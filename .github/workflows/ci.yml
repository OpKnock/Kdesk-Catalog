name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml jsonschema build pytest

      - name: Lint and compile
        run: |
          python -m compileall -q kdesk scripts
          python -m py_compile kdesk/cli.py

      - name: Stats validation (authoritative counts, zero-file guard)
        run: python -m kdesk.cli stats --format json --root .

      - name: Report freshness (reports must match current repository state)
        run: python scripts/check-report-freshness.py --fast --root .

      - name: Verify-all (never passes on zero files)
        run: python scripts/verify-all.py

      - name: Schema check (0 violations required)
        run: python scripts/schema-check.py

      - name: YAML + JSON parse integrity
        run: python scripts/validate-conversion.py

      - name: Provenance (all JSONs trace to source YAML, checksums match)
        run: python -m kdesk.cli provenance --root .

      - name: Security scan (no hardcoded secrets)
        run: python -m kdesk.cli security --json --root .

      - name: Duplicate scan
        run: python -m kdesk.cli duplicates --root .

      - name: License gate (all licenses resolved via policy)
        run: python -m kdesk.cli license --root .

      - name: Wiring integrity (evidence or manual override on every link)
        run: python -m kdesk.cli graph --root .

      - name: Unit tests (pytest)
        run: pytest -q tests

  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml jsonschema build pytest

      - name: Run canonical release check
        run: python scripts/release-check.py