name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quick-tests:
    name: Quick unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml jsonschema fastapi

      - name: Run quick test modules
        run: |
          python -m unittest -v tests.test_divisions \
            tests.test_tools_manifest \
            tests.test_converter_cli \
            tests.test_wire_skills \
            tests.test_marketplaces \
            tests.test_kdesk_install \
            tests.test_agent_framework \
            tests.test_web_security \
            tests.test_yaml_to_json