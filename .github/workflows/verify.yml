name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Verify-all and report freshness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml jsonschema

      - name: Generate JSON from YAML
        run: python scripts/yaml-to-json.py

      - name: Generate platform-agents
        run: python scripts/universal-converter.py --platforms all --quiet

      - name: No stale model IDs (gate)
        run: python scripts/fix-stale-model-ids.py --dry-run

      - name: Marketplaces mirror the definitions (gate)
        run: python scripts/generate-marketplaces.py --validate

      - name: Report freshness (reports must match current repository state)
        run: python scripts/check-report-freshness.py --root .

      - name: No uncommitted source changes
        run: |
          git diff --exit-code -- . \
            ':(exclude)reports/*' \
            ':(exclude)platform-agents/*' \
            ':(exclude)agents/*' \
            ':(exclude)skills/json' \
            ':(exclude)skills/yaml' \
            ':(exclude)workflows/*' \
            || { echo "source output is stale; rerun converter and commit"; exit 1; }