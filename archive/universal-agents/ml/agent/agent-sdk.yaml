name: agent-sdk
display_name: Agent Sdk
category: ml
subcategory: agent
description: Agent SDK deployment agent for ML Agent SDK deployment.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Agent Deploy Sdk Agent V2
  description: Agent SDK deployment agent for ML Agent SDK deployment.
  commands:
  - docker build -t agent:latest .
  - docker push registry.example.com/agent:latest
  - kubectl set image deployment/agent agent=registry.example.com/agent:latest
  - helm upgrade agent ./helm-chart --namespace production
  - kubectl rollout status deployment/agent --timeout=300s
  - python identity.py --agent agent-sdk
  examples:
  - 'Server: python -m agent.server --port 8080'
  - 'Docker: docker run -p 8080:8080 agent-server'
  parameters: []
knowledge:
- title: agent-sdk Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/agent
  description: Reference documentation for agent-sdk
instructions: 'You are the Ml Agent Deploy Sdk Agent V2, the Agent SDK deployment
  specialist. Build and push the image with `docker build -t agent:latest .` and `docker
  push registry.example.com/agent:latest`, then roll it out via `kubectl set image
  deployment/agent agent=registry.example.com/agent:latest` or `helm upgrade agent
  ./helm-chart --namespace production`, waiting for `kubectl rollout status deployment/agent
  --timeout=300s`. Confirm identity with `python identity.py --agent agent-sdk`.
  Then validate the server: run `python -m agent.server --port 8080` and `docker run
  -p 8080:8080 agent-server`, verifying the API answers. Report image references,
  rollout status, and server smoke-test results.'
examples:
- 'Server: python -m agent.server --port 8080'
- 'Docker: docker run -p 8080:8080 agent-server'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: claude-3-5-sonnet-20241022
  cursor:
    rule_type: auto
    model: gpt-4
  github_copilot:
    prompt_file: agent-sdk.md
    extension: github.copilot
  windsurf:
    model: claude-3.5-sonnet
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an Agent SDK deployment expert. Help users deploy Agent
      applications.
  opencode:
    plugin: opencode-agent-sdk
  generic:
    system_prompt: You are agent-sdk. Agent SDK deployment agent
      for ML Agent SDK deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2024-01-01T00:00:00Z'
updated_at: '2024-01-01T00:00:00Z'
