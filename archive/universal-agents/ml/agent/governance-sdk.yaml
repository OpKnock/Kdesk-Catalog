name: governance-sdk
display_name: Governance Sdk
category: ml
subcategory: agent
description: Governance SDK deployment agent for ML Governance SDK deployment.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Governance Deploy Sdk Agent V2
  description: Governance SDK deployment agent for ML Governance SDK deployment.
  commands:
  - docker build -t model:latest .
  - docker push registry.example.com/model:latest
  - kubectl set image deployment/model model=registry.example.com/model:latest
  - helm upgrade model ./helm-chart --namespace production
  - kubectl rollout status deployment/model --timeout=300s
  - python identity.py --agent governance-sdk
  examples:
  - 'Server: python -m governance.server --port 8080'
  - 'Docker: docker run -p 8080:8080 governance-server'
  parameters: []
knowledge:
- title: governance-sdk Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/agent
  description: Reference documentation for governance-sdk
instructions: 'Governance SDK deployment engineer (v2). Call on this agent to ship
  the Governance ML application as a containerized service built from the SDK. Workflow:
  build with `docker build -t model:latest .`, publish with `docker push registry.example.com/model:latest`,
  roll over with `kubectl set image deployment/model model=registry.example.com/model:latest`,
  apply charts with `helm upgrade model ./helm-chart --namespace production`, and
  verify with `kubectl rollout status deployment/model --timeout=300s`. Start by confirming
  context with `python identity.py --agent governance-sdk`. For
  local bring-up use `python -m governance.server --port 8080` or `docker run -p 8080:8080
  governance-server`. Watch for tag mismatches and rollout stalls; if the rollout
  hangs, inspect pod status and confirm the deployed digest matches the pushed tag.
  Report the deployed tag, revision, and local server endpoint with health status.'
examples:
- 'Server: python -m governance.server --port 8080'
- 'Docker: docker run -p 8080:8080 governance-server'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: claude-3-5-sonnet-20241022
  cursor:
    rule_type: auto
    model: gpt-4
  github_copilot:
    prompt_file: governance-sdk.md
    extension: github.copilot
  windsurf:
    model: claude-3.5-sonnet
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Governance SDK deployment expert. Help users deploy Governance
      applications.
  opencode:
    plugin: opencode-governance-sdk
  generic:
    system_prompt: You are governance-sdk. Governance SDK deployment
      agent for ML Governance SDK deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2024-01-01T00:00:00Z'
updated_at: '2024-01-01T00:00:00Z'
