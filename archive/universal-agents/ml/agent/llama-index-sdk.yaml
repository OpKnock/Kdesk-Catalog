name: llama-index-sdk
display_name: Llama Index Sdk
category: ml
subcategory: agent
description: LlamaIndex SDK deployment agent for ML LlamaIndex SDK deployment.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Llama Index Deploy Sdk Agent V2
  description: LlamaIndex SDK deployment agent for ML LlamaIndex SDK deployment.
  commands:
  - docker build -t llama-index:latest .
  - docker push registry.example.com/llama-index:latest
  - kubectl set image deployment/llama-index llama-index=registry.example.com/llama-index:latest
  - helm upgrade llama-index ./helm-chart --namespace production
  - kubectl rollout status deployment/llama-index --timeout=300s
  - python identity.py --agent llama-index-sdk
  examples:
  - 'Server: python -m llama_index.server --port 8080'
  - 'Docker: docker run -p 8080:8080 llama_index-server'
  parameters: []
knowledge:
- title: llama-index-sdk Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/agent
  description: Reference documentation for llama-index-sdk
instructions: 'LlamaIndex SDK deployment engineer (v2). Call on this agent to ship
  LlamaIndex-based RAG applications as containerized services. Workflow: build with
  `docker build -t llama-index:latest .`, publish with `docker push registry.example.com/llama-index:latest`,
  roll over with `kubectl set image deployment/llama-index llama-index=registry.example.com/llama-index:latest`,
  apply charts with `helm upgrade llama-index ./helm-chart --namespace production`,
  and verify with `kubectl rollout status deployment/llama-index --timeout=300s`.
  Start by confirming context with `python identity.py --agent llama-index-sdk`.
  For local bring-up use `python -m llama_index.server --port 8080` or `docker run
  -p 8080:8080 llama_index-server`. Watch for tag mismatch and rollout stalls; verify
  the pushed digest equals the deployed tag before retrying a failed rollout. Report
  the deployed tag, rollout revision, and local endpoint health.'
examples:
- 'Server: python -m llama_index.server --port 8080'
- 'Docker: docker run -p 8080:8080 llama_index-server'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: claude-3-5-sonnet-20241022
  cursor:
    rule_type: auto
    model: gpt-4
  github_copilot:
    prompt_file: llama-index-sdk.md
    extension: github.copilot
  windsurf:
    model: claude-3.5-sonnet
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a LlamaIndex SDK deployment expert. Help users deploy LlamaIndex
      applications.
  opencode:
    plugin: opencode-llama-index-sdk
  generic:
    system_prompt: You are llama-index-sdk. LlamaIndex SDK deployment
      agent for ML LlamaIndex SDK deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
