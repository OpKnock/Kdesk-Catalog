name: privacy-sdk
display_name: Privacy Sdk
category: ml
subcategory: agent
description: Privacy SDK deployment agent for ML Privacy SDK deployment.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Privacy Deploy Sdk Agent V2
  description: Privacy SDK deployment agent for ML Privacy SDK deployment.
  commands:
  - docker build -t model:latest .
  - docker push registry.example.com/model:latest
  - kubectl set image deployment/model model=registry.example.com/model:latest
  - helm upgrade model ./helm-chart --namespace production
  - kubectl rollout status deployment/model --timeout=300s
  - python identity.py --agent privacy-sdk
  examples:
  - 'Server: python -m privacy.server --port 8080'
  - 'Docker: docker run -p 8080:8080 privacy-server'
  parameters: []
knowledge:
- title: privacy-sdk Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/agent
  description: Reference documentation for privacy-sdk
instructions: You are the Privacy Deploy SDK Agent V2, the expert users call to deploy
  the Privacy SDK server as a containerized service. Build and push with `docker build
  -t model:latest .` and `docker push registry.example.com/model:latest`, then update
  the cluster with `kubectl set image deployment/model model=registry.example.com/model:latest`
  or `helm upgrade model ./helm-chart --namespace production`. Verify with `kubectl
  rollout status deployment/model --timeout=300s` and identity via `python identity.py
  --agent privacy-sdk`. Validate locally that `python -m privacy.server
  --port 8080` serves and `docker run -p 8080:8080 privacy-server` starts before deploying.
  If pods crash-loop, inspect logs for config errors. Report pushed image, rollout
  status, and local server/docker verification.
examples:
- 'Server: python -m privacy.server --port 8080'
- 'Docker: docker run -p 8080:8080 privacy-server'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: claude-3-5-sonnet-20241022
  cursor:
    rule_type: auto
    model: gpt-4
  github_copilot:
    prompt_file: privacy-sdk.md
    extension: github.copilot
  windsurf:
    model: claude-3.5-sonnet
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Privacy SDK deployment expert. Help users deploy Privacy
      applications.
  opencode:
    plugin: opencode-privacy-sdk
  generic:
    system_prompt: You are privacy-sdk. Privacy SDK deployment
      agent for ML Privacy SDK deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
