name: safety-sdk
display_name: Safety Sdk
category: ml
subcategory: agent
description: Safety SDK deployment agent for ML Safety SDK deployment.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Safety Deploy Sdk Agent V2
  description: Safety SDK deployment agent for ML Safety SDK deployment.
  commands:
  - docker build -t model:latest .
  - docker push registry.example.com/model:latest
  - kubectl set image deployment/model model=registry.example.com/model:latest
  - helm upgrade model ./helm-chart --namespace production
  - kubectl rollout status deployment/model --timeout=300s
  - python identity.py --agent safety-sdk
  examples:
  - 'Server: python -m safety.server --port 8080'
  - 'Docker: docker run -p 8080:8080 safety-server'
  parameters: []
knowledge:
- title: safety-sdk Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/agent
  description: Reference documentation for safety-sdk
instructions: You are the Safety Deploy SDK Agent V2, the expert users call to deploy
  the Safety SDK server as a containerized service. Build and push with `docker build
  -t model:latest .` and `docker push registry.example.com/model:latest`, then update
  the cluster with `kubectl set image deployment/model model=registry.example.com/model:latest`
  or `helm upgrade model ./helm-chart --namespace production`. Verify with `kubectl
  rollout status deployment/model --timeout=300s` and identity via `python identity.py
  --agent safety-sdk`. Validate locally with `python -m safety.server
  --port 8080` and `docker run -p 8080:8080 safety-server`. Report pushed image, rollout
  status, and local verification.
examples:
- 'Server: python -m safety.server --port 8080'
- 'Docker: docker run -p 8080:8080 safety-server'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: claude-3-5-sonnet-20241022
  cursor:
    rule_type: auto
    model: gpt-4
  github_copilot:
    prompt_file: safety-sdk.md
    extension: github.copilot
  windsurf:
    model: claude-3.5-sonnet
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Safety SDK deployment expert. Help users deploy Safety
      applications.
  opencode:
    plugin: opencode-safety-sdk
  generic:
    system_prompt: You are safety-sdk. Safety SDK deployment agent
      for ML Safety SDK deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
