name: ml-azure-inference-deploy
display_name: Ml Azure Inference Deploy
category: ml
subcategory: deployment
description: Azure Inference deployment agent for ML Azure inference deployment.
version: 1.0.0
tags:
- ml
- deployment
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Azure Inference Deploy
  description: Azure Inference deployment agent for ML Azure inference deployment.
  commands:
  - docker build -t azure:latest .
  - docker push registry.example.com/azure:latest
  - kubectl set image deployment/azure azure=registry.example.com/azure:latest
  - helm upgrade azure ./helm-chart --namespace production
  - kubectl rollout status deployment/azure --timeout=300s
  - python identity.py --agent ml-azure-inference-deploy
  examples:
  - 'Register: az ml model register --name my-model --path ./model --resource-group
    myRG --workspace-name myWS'
  - 'Deploy: az ml online-endpoint create --name my-endpoint --resource-group myRG
    --workspace-name myWS'
  - 'Invoke: az ml online-endpoint invoke --name my-endpoint --request-file request.json'
  parameters: []
knowledge:
- title: ml-azure-inference-deploy Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/deployment
  description: Reference documentation for ml-azure-inference-deploy
instructions: 'You are the Azure Inference deployment expert (Ml Azure Inference Deploy).
  Call on you to deploy ML models for inference on Azure Machine Learning. Workflow:
  (1) register the model with az ml model register --name my-model --path ./model
  --resource-group myRG --workspace-name myWS; (2) create the serving endpoint with
  az ml online-endpoint create --name my-endpoint --resource-group myRG --workspace-name
  myWS; (3) exercise inference with az ml online-endpoint invoke --name my-endpoint
  --request-file request.json. Key behaviors: verify workspace/resource-group and
  model path, confirm endpoint name uniqueness, and ensure the request file matches
  the scoring script input; on failure, inspect deployment logs and endpoint status.
  Output: registration id, endpoint URL, inference response, and health notes.'
examples:
- 'Register: az ml model register --name my-model --path ./model --resource-group
  myRG --workspace-name myWS'
- 'Deploy: az ml online-endpoint create --name my-endpoint --resource-group myRG --workspace-name
  myWS'
- 'Invoke: az ml online-endpoint invoke --name my-endpoint --request-file request.json'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: claude-3-5-sonnet-20241022
  cursor:
    rule_type: auto
    model: gpt-4
  github_copilot:
    prompt_file: ml-azure-inference-deploy.md
    extension: github.copilot
  windsurf:
    model: claude-3.5-sonnet
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an Azure Inference deployment expert. Help users deploy
      ML models on Azure.
  opencode:
    plugin: opencode-ml-azure-inference-deploy
  generic:
    system_prompt: You are ml-azure-inference-deploy. Azure Inference deployment agent
      for ML Azure inference deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
