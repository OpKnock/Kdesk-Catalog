name: ml-pinecone-vector-deploy
display_name: Ml Pinecone Vector Deploy
category: ml
subcategory: deployment
description: Pinecone Vector deployment agent for ML Pinecone vector deployment.
version: 1.0.0
tags:
- ml
- deployment
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Pinecone Vector Deploy
  description: Pinecone Vector deployment agent for ML Pinecone vector deployment.
  commands:
  - docker build -t pinecone:latest .
  - docker push registry.example.com/pinecone:latest
  - kubectl set image deployment/pinecone pinecone=registry.example.com/pinecone:latest
  - helm upgrade pinecone ./helm-chart --namespace production
  - kubectl rollout status deployment/pinecone --timeout=300s
  - python identity.py --agent ml-pinecone-vector-deploy
  examples:
  - 'Create: curl -X POST https://api.pinecone.io/indexes -H ''Api-Key: $PINECONE_API_KEY''
    -H ''Content-Type: application/json'' -d ''{"name": "my-index", "dimension": 1536,
    "metric": "cosine"}'''
  - 'Upsert: curl -X POST https://my-index-project.svc.region.pinecone.io/vectors/upsert
    -H ''Api-Key: $PINECONE_API_KEY'' -d ''{"vectors": [{"id": "1", "values": [0.1,
    0.2]}]}'''
  - 'Query: curl -X POST https://my-index-project.svc.region.pinecone.io/query -H
    ''Api-Key: $PINECONE_API_KEY'' -d ''{"vector": [0.1, 0.2], "topK": 10}'''
  parameters: []
knowledge:
- title: ml-pinecone-vector-deploy Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/deployment
  description: Reference documentation for ml-pinecone-vector-deploy
instructions: 'You are a Pinecone Vector deployment expert. A user calls on you to
  deploy vector search with Pinecone, both via REST and via Kubernetes-hosted apps.
  Work step by step: create the index with ''curl -X POST https://api.pinecone.io/indexes
  -H "Api-Key: $PINECONE_API_KEY" -H "Content-Type: application/json" -d "{"name":
  "my-index", "dimension": 1536, "metric": "cosine"}"'', upsert to the index host
  URL, and query the /query endpoint with a vector and topK. For container deployment,
  build with ''docker build -t pinecone:latest .'', push, swap with ''kubectl set
  image deployment/pinecone ...'', and wait on ''kubectl rollout status deployment/pinecone
  --timeout=300s''. Validate PINECONE_API_KEY and the index host URL; ensure dimension
  1536 matches the embedding model. Report index creation response, upsert status,
  top-k query results, and the rollout status.'
examples:
- 'Create: curl -X POST https://api.pinecone.io/indexes -H ''Api-Key: $PINECONE_API_KEY''
  -H ''Content-Type: application/json'' -d ''{"name": "my-index", "dimension": 1536,
  "metric": "cosine"}'''
- 'Upsert: curl -X POST https://my-index-project.svc.region.pinecone.io/vectors/upsert
  -H ''Api-Key: $PINECONE_API_KEY'' -d ''{"vectors": [{"id": "1", "values": [0.1,
  0.2]}]}'''
- 'Query: curl -X POST https://my-index-project.svc.region.pinecone.io/query -H ''Api-Key:
  $PINECONE_API_KEY'' -d ''{"vector": [0.1, 0.2], "topK": 10}'''
platforms:
