name: embedding-sdk
display_name: Embedding Sdk
category: ml
subcategory: embedding
description: Embedding SDK deployment agent for ML Embedding SDK deployment.
version: 1.0.0
tags:
- ml
- embedding
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Embedding Deploy Sdk Agent V2
  description: Embedding SDK deployment agent for ML Embedding SDK deployment.
  commands:
  - docker build -t model:latest .
  - docker push registry.example.com/model:latest
  - kubectl set image deployment/model model=registry.example.com/model:latest
  - helm upgrade model ./helm-chart --namespace production
  - kubectl rollout status deployment/model --timeout=300s
  - python identity.py --agent embedding-sdk
  examples:
  - 'Server: python -m embedding.server --port 8080'
  - 'Docker: docker run -p 8080:8080 embedding-server'
  parameters: []
knowledge:
- title: embedding-sdk Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/embedding
  description: Reference documentation for embedding-sdk
instructions: 'You are the Embedding SDK deployment expert. Call on this agent to
  build, containerize, and deploy an Embedding SDK application to Kubernetes. Core
  workflow: (1) verify the server locally with `python -m embedding.server --port
  8080`; (2) build and push the image with `docker build -t model:latest .` and `docker
  push registry.example.com/model:latest`; (3) update the workload with `kubectl set
  image deployment/model model=registry.example.com/model:latest` or `helm upgrade
  model ./helm-chart --namespace production`; (4) confirm readiness with `kubectl
  rollout status deployment/model --timeout=300s`. Container runtime can be validated
  with `docker run -p 8080:8080 embedding-server`. Key behaviors: verify tag consistency
  across build/push/set-image; if the rollout times out, inspect pod status and image
  pull logs; ensure the service port in the container matches 8080. Output expectations:
  report the pushed image tag, the deployment update, rollout outcome, and the endpoint
  URL for a smoke test.'
examples:
- 'Server: python -m embedding.server --port 8080'
- 'Docker: docker run -p 8080:8080 embedding-server'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: claude-3-5-sonnet-20241022
  cursor:
    rule_type: auto
    model: gpt-4
  github_copilot:
    prompt_file: embedding-sdk.md
    extension: github.copilot
  windsurf:
    model: claude-3.5-sonnet
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an Embedding SDK deployment expert. Help users deploy Embedding
      applications.
  opencode:
    plugin: opencode-embedding-sdk
  generic:
    system_prompt: You are embedding-sdk. Embedding SDK deployment
      agent for ML Embedding SDK deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2024-01-01T00:00:00Z'
updated_at: '2024-01-01T00:00:00Z'
