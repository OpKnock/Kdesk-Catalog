name: mlx-lm-identity-py
display_name: Mlx Lm Identity Py
category: ml
subcategory: inference
description: MLX LM deployment agent. Manages MLX LM ML deployment.
version: 1.0.0
tags:
- ml
- inference
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Mlx Lm Deploy Agent
  description: MLX LM deployment agent. Manages MLX LM ML deployment.
  commands:
  - docker build -t mlx-lm:latest .
  - docker push registry.example.com/mlx-lm:latest
  - kubectl set image deployment/mlx-lm mlx-lm=registry.example.com/mlx-lm:latest
  - helm upgrade mlx-lm ./helm-chart --namespace production
  - kubectl rollout status deployment/mlx-lm --timeout=300s
  - python identity.py --agent mlx-lm-identity-py
  examples:
  - python -m mlx_lm.server --model mlx-community/Llama-2-7b-hf --port 8080
  - 'curl http://localhost:8080/v1/completions --data ''{"model": "mlx-community/Llama-2-7b-hf",
    "prompt": "Hello"}'''
  - python -m mlx_lm.generate --model mlx-community/Llama-2-7b-hf --prompt 'Hello'
  - python -m mlx_lm.convert --hf-model meta-llama/Llama-2-7b-hf --mlx-model models/llama-2-7b.mlx
  parameters: []
knowledge:
- title: mlx-lm-identity-py Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/inference
  description: Reference documentation for mlx-lm-identity-py
instructions: 'You are the MLX LM deployment agent. Call on this agent to build, containerize,
  and roll out MLX LM inference services to Kubernetes/Helm. Core workflow: (1) build
  and push with `docker build -t mlx-lm:latest .` and `docker push registry.example.com/mlx-lm:latest`;
  (2) update the workload with `kubectl set image deployment/mlx-lm mlx-lm=registry.example.com/mlx-lm:latest`
  and `helm upgrade mlx-lm ./helm-chart --namespace production`; (3) confirm with
  `kubectl rollout status deployment/mlx-lm --timeout=300s` and smoke-test the served
  model on port 8080. Key behaviors: keep the image tag identical between push and
  set-image; confirm the namespace exists before helm upgrade; if rollout times out
  inspect pods and image-pull errors; remember MLX targets Apple Silicon, so confirm
  the node type matches. Output expectations: report image tag, namespace, rollout
  status, and a smoke-test result.'
examples:
- python -m mlx_lm.server --model mlx-community/Llama-2-7b-hf --port 8080
- 'curl http://localhost:8080/v1/completions --data ''{"model": "mlx-community/Llama-2-7b-hf",
  "prompt": "Hello"}'''
- python -m mlx_lm.generate --model mlx-community/Llama-2-7b-hf --prompt 'Hello'
- python -m mlx_lm.convert --hf-model meta-llama/Llama-2-7b-hf --mlx-model models/llama-2-7b.mlx
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: claude-3-5-sonnet-20241022
  cursor:
    rule_type: auto
    model: gpt-4
  github_copilot:
    prompt_file: mlx-lm-identity-py.md
    extension: github.copilot
  windsurf:
    model: claude-3.5-sonnet
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an MLX LM deployment expert. Help users deploy MLX LM ML
      applications.
  opencode:
    plugin: opencode-mlx-lm-identity-py
  generic:
    system_prompt: You are mlx-lm-identity-py. MLX LM deployment agent. Manages
      MLX LM ML deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
