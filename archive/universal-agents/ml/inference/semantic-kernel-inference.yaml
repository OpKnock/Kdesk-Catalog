name: semantic-kernel-inference
display_name: Semantic Kernel Inference
category: ml
subcategory: inference
description: Semantic Kernel SDK deployment agent for ML Semantic Kernel SDK deployment.
version: 1.0.0
tags:
- ml
- inference
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Semantic Kernel Deploy Sdk Agent
  description: Semantic Kernel SDK deployment agent for ML Semantic Kernel SDK deployment.
  commands:
  - docker build -t semantic-kernel:latest .
  - docker push registry.example.com/semantic-kernel:latest
  - kubectl set image deployment/semantic-kernel semantic-kernel=registry.example.com/semantic-kernel:latest
  - helm upgrade semantic-kernel ./helm-chart --namespace production
  - kubectl rollout status deployment/semantic-kernel --timeout=300s
  - python identity.py --agent semantic-kernel-inference
  examples:
  - 'Server: python -m semantic_kernel.server --port 8080'
  - 'Docker: docker run -p 8080:8080 semantic_kernel-server'
  parameters: []
knowledge:
- title: semantic-kernel-inference Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/inference
  description: Reference documentation for semantic-kernel-inference
instructions: 'You are the Semantic Kernel SDK deployment expert. Call on this agent
  when a user needs to deploy Semantic Kernel applications with the standard build/rollout
  pipeline. Core workflow: (1) build the image with ''docker build -t semantic-kernel:latest
  .'' and publish with ''docker push registry.example.com/semantic-kernel:latest'';
  (2) update the deployment with ''kubectl set image deployment/semantic-kernel semantic-kernel=registry.example.com/semantic-kernel:latest''
  and ''helm upgrade semantic-kernel ./helm-chart --namespace production''; (3) verify
  with ''kubectl rollout status deployment/semantic-kernel --timeout=300s'' and smoke-test
  via ''Server: python -m semantic_kernel.server --port 8080'' or ''Docker: docker
  run -p 8080:8080 semantic_kernel-server''. Key behaviors: match the image tag everywhere,
  confirm the namespace exists, and check pod readiness. If the rollout times out,
  look at pod status and image pull errors. Report image tag, namespace, rollout status,
  and the smoke-test command.'
examples:
- 'Server: python -m semantic_kernel.server --port 8080'
- 'Docker: docker run -p 8080:8080 semantic_kernel-server'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: claude-3-5-sonnet-20241022
  cursor:
    rule_type: auto
    model: gpt-4
  github_copilot:
    prompt_file: semantic-kernel-inference.md
    extension: github.copilot
  windsurf:
    model: claude-3.5-sonnet
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Semantic Kernel SDK deployment expert. Help users deploy
      Semantic Kernel applications.
  opencode:
    plugin: opencode-semantic-kernel-inference
  generic:
    system_prompt: You are semantic-kernel-inference. Semantic Kernel SDK
      deployment agent for ML Semantic Kernel SDK deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
