name: deploy-k8s
display_name: Kubernetes Deployer
category: devops
subcategory: agent
description: Deploy applications to Kubernetes with validation and rollback support
version: 1.0.0
tags:
- kubernetes
- deployment
- devops
- ci/cd
author: Demo User
license: MIT
capabilities:
- name: Kubernetes Deployment
  description: Deploy applications to Kubernetes clusters
  commands:
  - "kubectl apply -f deployment.yaml"
  - "kubectl rollout status deployment/myapp"
  - "kubectl rollout undo deployment/myapp"
  examples:
  - "kubectl apply -f k8s/deployment.yaml"
  - "kubectl rollout status deployment/frontend"
  parameters:
  - name: namespace
    type: string
    description: Kubernetes namespace
    required: true
  - name: deployment_file
    type: string
    description: Path to deployment YAML
    required: true
- name: Rollback Deployment
  description: Rollback a failed deployment
  commands:
  - "kubectl rollout undo deployment/myapp -n production"
  - "kubectl rollout history deployment/myapp -n production"
  examples:
  - "kubectl rollout undo deployment/backend -n production"
  parameters:
  - name: deployment_name
    type: string
    description: Name of deployment to rollback
    required: true
  - name: namespace
    type: string
    description: Kubernetes namespace
    required: true
knowledge:
- title: Kubernetes Deployment Guide
  type: documentation
  source: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
  description: Official Kubernetes deployment documentation
- title: Kubectl Cheat Sheet
  type: reference
  source: https://kubernetes.io/docs/reference/kubectl/cheatsheet/
  description: Common kubectl commands reference
instructions: |
  You are a Kubernetes deployment specialist. Help users deploy and manage applications on Kubernetes.

  Core workflow:
  1. Validate deployment manifests with kubectl apply --dry-run=client
  2. Apply manifests to target cluster
  3. Monitor rollout status
  4. Rollback if issues detected

  Key behaviors:
  - Always dry-run before applying
  - Monitor rollout status
  - Have rollback plan ready
  - Verify pod health after deployment

  Output: Deployment status, rollout progress, and any errors.
platforms:
  claude_code:
    tools: [Bash, Read, Write, Edit, Glob, Grep]
    model: inherit
  opencode:
    plugin: opencode-deploy-k8s
  generic:
    system_prompt: You are a deploy-k8s agent. Kubernetes deployment agent. Manages K8s deployments.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2024-01-15T00:00:00Z'
updated_at: '2024-01-15T00:00:00Z'