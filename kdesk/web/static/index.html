<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f2efe7">
<title>Kdesk — Universal Agent Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter+Tight:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="/static/styles.css?v=20260905b">
<link rel="icon" type="image/svg+xml" href="/static/logo.svg?v=20260905">
</head>
<body>

<div id="topbar"></div>

<div id="splash">
  <div class="splash-mark"><img src="/static/logo.svg?v=20260905" alt="Kdesk"></div>
  <div class="splash-title">Kdesk</div>
  <div class="splash-sub">Universal AI agent catalog &middot; 3,093 definitions &middot; 45 platforms</div>
  <div class="splash-bar"><i></i></div>
</div>

<div id="onboard">
  <div class="onboard-card">
    <h2>Welcome to Kdesk</h2>
    <p>Your personal mission control for AI agents.<br>What should we call you?</p>
    <input id="name-input" type="text" placeholder="Your name" maxlength="40" autocomplete="off">
    <div style="margin-top:16px"><button id="name-go" style="width:100%">Enter &rarr;</button></div>
  </div>
</div>

<div id="setup">
  <div class="onboard-card">
    <h2>Point Kdesk at your repo</h2>
    <p id="setup-msg">No catalog found here. Paste the path to your Kdesk-Catalog checkout.</p>
    <input id="root-input" type="text" placeholder="C:\path\to\Kdesk-Catalog" autocomplete="off">
    <div style="margin-top:16px"><button id="root-go" style="width:100%">Load catalog &rarr;</button></div>
  </div>
</div>

<div id="app">
  <aside>
    <div class="brand"><div class="brand-mark"><img src="/static/logo.svg?v=20260905" alt=""></div><span>Kdesk</span></div>
    <nav id="nav"></nav>
    <div class="greet" id="greet"></div>
  </aside>
  <main id="main"></main>
</div>

<div id="modal"><div class="modal-box" id="modal-box"></div></div>
<div class="toast" id="toast"></div>

<script src="/static/app.js?v=20260905b"></script>
</body>
</html>
