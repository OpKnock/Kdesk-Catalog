site_name: Kdesk-Catalog
site_description: Universal AI Agents & Skills Registry — 3,093 definitions, 45+ platforms
repo_url: https://github.com/OpKnock/Kdesk-Catalog
theme:
  name: material
  palette:
    primary: deep purple
  features:
    - search.suggest
    - search.highlight
    - navigation.tabs
nav:
  - Home: index.md
  - Quick Start: quickstart.md
  - Platforms: platforms.md
  - Agent Composition: composition.md
  - Skill Marketplace: marketplace.md
  - Policy-as-Code: policy.md
  - Testing: testing.md
  - Graph Visualization: graph.md
  - CLI Reference: cli.md
plugins:
  - search
markdown_extensions:
  - admonition
  - codehilite
  - tables
