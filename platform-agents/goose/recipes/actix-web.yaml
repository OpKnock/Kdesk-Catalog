title: Actix Web
description: 'Builds high-performance HTTP APIs in Rust with Actix Web: scaffolding, routing, JSON extractors,
  middleware, and release builds.'
version: 2.0.0
instructions: "# Actix Web\n\nBuilds high-performance HTTP APIs in Rust with Actix Web: scaffolding, routing,\
  \ JSON extractors, middleware, and release builds.\n\n## Instructions\n\n# Actix Web\n\n## What this\
  \ skill does\n\nDevelops HTTP services in Rust with Actix Web: scaffolding projects, defining routes\
  \ and state, extracting typed JSON payloads, adding middleware, and producing release binaries.\n\n\
  ## When to use\n\n- Building a new Rust REST API\n- Adding JSON endpoints, middleware, or WebSockets\
  \ to an Actix app\n- Tuning a server build for production\n\n## Real commands\n\n```bash\ncargo new\
  \ my-api\ncargo add actix-web serde --features serde/derive\n\ncargo run\ncurl http://localhost:8080/health\n\
  \n# Production build\ncargo build --release\nACTIX_WORKERS=4 ./target/release/my-api\n\n# Lint and test\n\
  cargo clippy -- -D warnings\ncargo test\n```\n\n## Minimal server\n\n```rust\nuse actix_web::{get, App,\
  \ HttpServer, Responder};\n\n#[get(\"/health\")]\nasync fn health() -> impl Responder { \"ok\" }\n\n\
  #[actix_web::main]\nasync fn main() -> std::io::Result<()> {\n    HttpServer::new(|| App::new().service(health))\n\
  \        .bind((\"127.0.0.1\", 8080))?\n        .run()\n        .await\n}\n```\n\n## JSON endpoint\n\
  \n```rust\n#[derive(Deserialize)]\nstruct User { name: String }\n\n#[post(\"/users\")]\nasync fn create(user:\
  \ web::Json<User>) -> HttpResponse {\n    HttpResponse::Created().json(user.0)\n}\n```\n\n## Testing\n\
  \n- Unit-test handlers with actix_web::test::init_service + TestRequest\n- Run `cargo test` for handlers\
  \ and `cargo clippy` in CI\n\n## Best practices\n\n- Put app state behind web::Data<T> instead of statics\n\
  - Use --release builds in production; debug builds are much slower\n- Set ACTIX_WORKERS to the number\
  \ of cores\n\n## Capabilities\n\n### project-scaffold\nCreate and configure a new Actix Web project\
  \ with Cargo.\n\n**Commands:**\n- `cargo new my-api`\n- `cargo add actix-web`\n- `cargo add serde --features\
  \ derive`\n- `cargo build`\n- `cargo run`\n\n**Examples:**\n- cargo new my-api && cargo add actix-web@4\n\
  - cargo add actix-web --features openssl\n- cargo add actix-cors\n\n### serve-and-test\nBuild, run,\
  \ lint, and test the Actix server.\n\n**Commands:**\n- `cargo build --release`\n- `cargo clippy -- -D\
  \ warnings`\n- `cargo test`\n- `cargo run --release`\n- `curl -s http://localhost:8080/health`\n\n**Examples:**\n\
  - cargo clippy --all-targets -- -D warnings\n- cargo test -- --nocapture\n- cargo build --release &&\
  \ ./target/release/my-api"
prompt: Act as Actix Web and handle the task per the instructions.
