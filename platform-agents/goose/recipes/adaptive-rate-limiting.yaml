title: Adaptive Rate Limiting
description: Implements adaptive rate limiting with nginx limit_req zones, Redis sliding-window counters,
  and load-test verification with ab.
version: 2.0.0
instructions: "# Adaptive Rate Limiting\n\nImplements adaptive rate limiting with nginx limit_req zones,\
  \ Redis sliding-window counters, and load-test verification with ab.\n\n## Instructions\n\n# Adaptive\
  \ Rate Limiting\n\n## What this skill does\n\nDesigns rate limits that adapt to traffic: nginx limit_req\
  \ zones enforce per-IP limits, Redis counters implement per-user sliding windows, and load tests verify\
  \ thresholds.\n\n## When to use\n\n- A public API is being hammered by a single client\n- Adding per-user\
  \ or per-tenant quotas\n- Tuning burst allowance so legitimate spikes are not rejected\n\n## Real commands\n\
  \n```bash\nnginx -t\nnginx -s reload\n\n# Verify configured zones\nnginx -T | grep -E \"limit_req|limit_conn\"\
  \n\n# Watch rejections under load\nab -n 2000 -c 100 http://localhost:8080/api/users\n```\n\n## nginx\
  \ config\n\n```nginx\nlimit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;\n\nserver {\n  location\
  \ /api/ {\n    limit_req zone=api burst=20 nodelay;\n    limit_req_status 429;\n    proxy_pass http://backend;\n\
  \  }\n}\n```\n\n## Redis fixed window\n\n```bash\nredis-cli INCR rate:$USER:$(date +%s)\nredis-cli EXPIRE\
  \ rate:$USER:$(date +%s) 60\n```\n\nRun a Lua script for atomic sliding-window decisions: `redis-cli\
  \ --eval sliding_window.lua rate:$USER:60 1 100 $(date +%s)`.\n\n## Testing\n\n- Drive 2x the limit\
  \ with ab and assert 429 share grows\n- Assert normal traffic never sees 429\n\n## Best practices\n\n\
  - Return Retry-After with 429 so clients back off\n- Store limits in config, not code\n- Combine nginx\
  \ (per-IP) with Redis (per-user) for defense in depth\n\n## Capabilities\n\n### nginx-limits\nConfigure\
  \ and hot-reload nginx request-rate and connection limits.\n\n**Commands:**\n- `nginx -t`\n- `nginx\
  \ -s reload`\n- `nginx -T | grep limit_req`\n- `ab -n 2000 -c 100 http://localhost:8080/api/users`\n\
  - `tail -f /var/log/nginx/error.log`\n\n**Examples:**\n- nginx -t && nginx -s reload\n- ab -n 2000 -c\
  \ 100 http://localhost:8080/api/users\n- curl -s -o /dev/null -w \"%{http_code}\\n\" http://localhost:8080/api\n\
  \n### redis-counters\nUse Redis fixed-window and Lua sliding-window counters to adapt limits per client.\n\
  \n**Commands:**\n- `redis-cli INCR rate:{userId}:{window}`\n- `redis-cli EXPIRE rate:{userId}:{window}\
  \ 60`\n- `redis-cli --eval sliding_window.lua rate:{userId}:{window} 1 100 $(date +%s)`\n- `redis-cli\
  \ GET rate:{userId}:{window}`\n- `redis-cli FLUSHDB`\n\n**Examples:**\n- redis-cli INCR rate:42:1736500000\
  \ && redis-cli EXPIRE rate:42:1736500000 60\n- redis-cli --eval sliding_window.lua rate:42:1736500000\
  \ 1 60 100 1736500030\n- redis-cli GET rate:42:1736500000"
prompt: Act as Adaptive Rate Limiting and handle the task per the instructions.
