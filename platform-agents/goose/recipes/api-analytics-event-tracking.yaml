title: Api Analytics Event Tracking
description: API analytics event tracking and funnels - capture custom events via Segment HTTP API, analyze
  conversion, and build retention views.
version: 2.0.0
instructions: "# Api Analytics Event Tracking\n\nAPI analytics event tracking and funnels - capture custom\
  \ events via Segment HTTP API, analyze conversion, and build retention views.\n\n## Instructions\n\n\
  # API Analytics (Event Tracking)\n\n## What this skill does\nTrack custom product events around your\
  \ API - signups, orders, feature use - via the Segment HTTP API, then analyze funnels and retention\
  \ to understand conversion.\n\n## When to use\n- Measuring feature adoption\n- Building conversion funnels\n\
  - Cohort retention analysis\n\n## Real commands\n```bash\n# Track an event\ncurl -s -X POST https://api.segment.io/v1/track\
  \ \\\n  -u 'WRITE_KEY:' -H 'Content-Type: application/json' \\\n  -d '{\"userId\":\"u_123\",\"event\"\
  :\"API Call\",\"properties\":{\"endpoint\":\"/v1/orders\"}}'\n\n# Identify a user\ncurl -s -X POST https://api.segment.io/v1/identify\
  \ \\\n  -u 'WRITE_KEY:' -H 'Content-Type: application/json' \\\n  -d '{\"userId\":\"u_123\",\"traits\"\
  :{\"plan\":\"enterprise\"}}'\n\n# Funnel analysis\ncurl -s 'http://localhost:8080/api/analytics/funnel?steps=visit,create_order,pay'\
  \ | jq '.steps[].conversion'\n\n# Retention\ncurl -s 'http://localhost:8080/api/analytics/retention?cohort=day'\
  \ | jq '.cohorts[-1]'\n\n# Event volume by name\ncurl -s http://localhost:8080/api/analytics/events\
  \ -H 'X-API-Key: key' | jq '.events | group_by(.name) | map({name: .[0].name, count: length})'\n```\n\
  \n## Event schema discipline\n```json\n{\n  \"userId\": \"u_123\",\n  \"event\": \"Checkout Started\"\
  ,\n  \"properties\": { \"endpoint\": \"/v1/orders\", \"status\": 201 }\n}\n```\n\n## Best practices\n\
  - Use verb-past-tense event names (Order Completed)\n- Keep a properties dictionary per event\n- Send\
  \ events from server-side, not the browser, for APIs\n- Batch events and retry with backoff\n\n## Testing\n\
  ```bash\ncurl -s -X POST http://localhost:8080/api/analytics/test-event -H 'Content-Type: application/json'\
  \ -d '{\"name\":\"Test\"}'\ncurl -s 'http://localhost:8080/api/analytics/events?event=Test' | jq '.total'\n\
  ```\n\n## Capabilities\n\n### event-tracking\nTrack API events and analyze funnels\n\n**Commands:**\n\
  - `curl -s -X POST https://api.segment.io/v1/track -u 'WRITE_KEY:' -H 'Content-Type: application/json'\
  \ -d '{\"userId\":\"u_123\",\"event\":\"API Call\",\"properties\":{\"endpoint\":\"/v1/orders\"}}'`\n\
  - `curl -s -X POST https://api.segment.io/v1/identify -u 'WRITE_KEY:' -H 'Content-Type: application/json'\
  \ -d '{\"userId\":\"u_123\",\"traits\":{\"plan\":\"enterprise\"}}'`\n- `curl -s 'http://localhost:8080/api/analytics/funnel?steps=visit,create_order,pay'\
  \ | jq '.steps[].conversion'`\n- `curl -s 'http://localhost:8080/api/analytics/retention?cohort=day'\
  \ | jq '.cohorts[-1]'`\n- `curl -s http://localhost:8080/api/analytics/events -H 'X-API-Key: key' |\
  \ jq '.events | group_by(.name) | map({name: .[0].name, count: length})'`\n\n**Examples:**\n- curl -s\
  \ -X POST https://api.segment.io/v1/track -u 'WRITE_KEY:' -d '{\"userId\":\"u_123\",\"event\":\"Checkout\
  \ Started\",\"properties\":{\"cart\":{\"total\":99.9}}}'\n- curl -s 'http://localhost:8080/api/analytics/funnel?steps=signup,activate,invite'\
  \ | jq '.steps'\n- curl -s 'http://localhost:8080/api/analytics/events?event=API%20Call&from=2024-06-01'\
  \ | jq '.total'"
prompt: Act as Api Analytics Event Tracking and handle the task per the instructions.
