title: Api Analytics Streaming
description: Real-time streaming API analytics with Kafka and ClickHouse - stream API events, aggregate
  with windowing, and query dashboards live.
version: 2.0.0
instructions: "# Api Analytics Streaming\n\nReal-time streaming API analytics with Kafka and ClickHouse\
  \ - stream API events, aggregate with windowing, and query dashboards live.\n\n## Instructions\n\n#\
  \ API Analytics (Real-time Streaming)\n\n## What this skill does\nStream API events in real time: produce\
  \ events to Kafka, ingest into ClickHouse, and query windowed aggregations for live dashboards.\n\n\
  ## When to use\n- Live dashboards with second-level freshness\n- High-volume event ingestion (millions/day)\n\
  - Time-series analysis with SQL\n\n## Real commands\n```bash\n# Create the topic\nkafka-topics.sh --bootstrap-server\
  \ localhost:9092 \\\n  --create --topic api-events --partitions 6 --replication-factor 1\n\n# Produce\
  \ events from a JSONL file\nkafka-console-producer.sh --bootstrap-server localhost:9092 --topic api-events\
  \ < events.jsonl\n\n# Verify consumption\nkafka-console-consumer.sh --bootstrap-server localhost:9092\
  \ \\\n  --topic api-events --from-beginning --max-messages 5\n\n# Start ClickHouse\ndocker run -d -p\
  \ 8123:8123 -p 9000:9000 clickhouse/clickhouse-server\n\n# Create the events table\ncurl -s -X POST\
  \ 'http://localhost:8123/?query=CREATE%20TABLE%20IF%20NOT%20EXISTS%20api_events%20(time%20DateTime,%20endpoint%20String,%20status%20UInt16)%20ENGINE%3DMergeTree%20ORDER%20BY%20time'\n\
  \n# Events per minute, last rows\ncurl -s -X POST 'http://localhost:8123/?query=SELECT%20toStartOfMinute(time)%20as%20m,%20count()%20FROM%20api_events%20GROUP%20BY%20m%20ORDER%20BY%20m%20DESC%20LIMIT%205'\
  \ | column -t\n\n# Status distribution last 10 minutes\ncurl -s 'http://localhost:8123/?query=SELECT%20status,%20count()%20FROM%20api_events%20WHERE%20time%20%3E%20now()-600%20GROUP%20BY%20status'\n\
  ```\n\n## Pipeline\n```\nAPI -> Kafka (api-events) -> ClickHouse -> dashboards\n```\n\n## Best practices\n\
  - Partition by API key or endpoint for parallelism\n- Use MergeTree ordering by time for range scans\n\
  - Batch inserts (min 1000 rows) for throughput\n- Monitor consumer lag with kafka-consumer-groups\n\n\
  ## Testing\n```bash\nkafka-console-consumer.sh --bootstrap-server localhost:9092 --topic api-events\
  \ --max-messages 1\ncurl -s 'http://localhost:8123/?query=SELECT%20count()%20FROM%20api_events'\n```\n\
  \n## Capabilities\n\n### streaming-analytics\nStream API events and run real-time aggregations\n\n**Commands:**\n\
  - `kafka-topics.sh --bootstrap-server localhost:9092 --create --topic api-events --partitions 6 --replication-factor\
  \ 1`\n- `kafka-console-producer.sh --bootstrap-server localhost:9092 --topic api-events < events.jsonl`\n\
  - `kafka-console-consumer.sh --bootstrap-server localhost:9092 --topic api-events --from-beginning --max-messages\
  \ 5`\n- `docker run -d -p 8123:8123 -p 9000:9000 clickhouse/clickhouse-server`\n- `curl -s -X POST 'http://localhost:8123/?query=SELECT%20toStartOfMinute(time)%20as%20m,%20count()%20FROM%20api_events%20GROUP%20BY%20m%20ORDER%20BY%20m%20DESC%20LIMIT%205'\
  \ | column -t`\n\n**Examples:**\n- kafka-console-consumer.sh --bootstrap-server localhost:9092 --topic\
  \ api-events --property print.key=true --max-messages 10\n- curl -s 'http://localhost:8123/?query=SELECT%20status,%20count()%20FROM%20api_events%20WHERE%20time%20%3E%20now()-600%20GROUP%20BY%20status'\n\
  - kafka-consumer-groups.sh --bootstrap-server localhost:9092 --group analytics --describe"
prompt: Act as Api Analytics Streaming and handle the task per the instructions.
