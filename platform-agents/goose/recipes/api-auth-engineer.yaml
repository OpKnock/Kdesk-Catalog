title: api-auth-engineer
description: 'Implement API authentication: OAuth2 flows with Keycloak, token exchange, client registration,
  and end-to-end token verification.'
version: 2.0.0
instructions: "# api-auth-engineer\n\nImplement API authentication: OAuth2 flows with Keycloak, token\
  \ exchange, client registration, and end-to-end token verification.\n\n## Instructions\n\n# API Auth\
  \ Engineer\n\n## What this skill does\nImplement and verify API authentication using OAuth2 with Keycloak\
  \ as the identity provider. Covers realm setup, the password and client-credentials grants, and verifying\
  \ tokens at the API.\n\n## When to use\n- Adding OAuth2 to an API\n- Standing up a local identity provider\n\
  - Testing grant flows and token verification\n\n## Real commands\n```bash\n# Start Keycloak (dev mode)\n\
  docker run -d -p 8080:8080 \\\n  -e KEYCLOAK_ADMIN=admin -e KEYCLOAK_ADMIN_PASSWORD=admin \\\n  quay.io/keycloak/keycloak:latest\
  \ start-dev\n\n# Discovery endpoints\ncurl -s 'http://localhost:8080/realms/demo/.well-known/openid-configuration'\
  \ | jq '.token_endpoint, .authorization_endpoint'\n\n# Password grant\ncurl -s -X POST 'http://localhost:8080/realms/demo/protocol/openid-connect/token'\
  \ \\\n  -H 'Content-Type: application/x-www-form-urlencoded' \\\n  -d 'grant_type=password&client_id=api&username=alice&password=secret'\
  \ | jq -r '.access_token'\n\n# Client credentials grant\ncurl -s -X POST 'http://localhost:8080/realms/demo/protocol/openid-connect/token'\
  \ \\\n  -d 'grant_type=client_credentials&client_id=orders-api&client_secret=abc123' | jq -r '.access_token'\n\
  \n# Refresh token\ncurl -s -X POST 'http://localhost:8080/realms/demo/protocol/openid-connect/token'\
  \ \\\n  -d 'grant_type=refresh_token&refresh_token=$REFRESH&client_id=api&client_secret=abc123' | jq\
  \ -r '.access_token'\n\n# Revoke\ncurl -s -X POST 'http://localhost:8080/realms/demo/protocol/openid-connect/revoke'\
  \ -d 'token=$TOKEN&client_id=api'\n\n# Verify at the API\ncurl -s http://localhost:8080/api/verify -H\
  \ 'Authorization: Bearer $TOKEN' | jq '.subject'\n```\n\n## Flow selection\n- password: first-party\
  \ apps with user creds (no longer recommended)\n- client_credentials: server-to-server\n- authorization_code\
  \ + PKCE: SPAs and mobile\n- refresh_token: long-lived sessions\n\n## Best practices\n- Never use the\
  \ password grant for third parties\n- Use PKCE for public clients\n- Validate signatures, issuer, audience,\
  \ and expiry\n- Rotate client secrets and refresh tokens\n\n## Testing\n```bash\nTOKEN=$(curl -s -X\
  \ POST 'http://localhost:8080/realms/demo/protocol/openid-connect/token' -d 'grant_type=password&client_id=api&username=alice&password=secret'\
  \ | jq -r '.access_token')\ncurl -s http://localhost:8080/api/verify -H \"Authorization: Bearer $TOKEN\"\
  \ | jq\n```\n\n## Capabilities\n\n### oauth2-implementation\nSet up and verify OAuth2 flows against\
  \ Keycloak\n\n**Commands:**\n- `docker run -d -p 8080:8080 -e KEYCLOAK_ADMIN=admin -e KEYCLOAK_ADMIN_PASSWORD=admin\
  \ quay.io/keycloak/keycloak:latest start-dev`\n- `curl -s -X POST 'http://localhost:8080/realms/demo/protocol/openid-connect/token'\
  \ -H 'Content-Type: application/x-www-form-urlencoded' -d 'grant_type=password&client_id=api&username=alice&password=secret'\
  \ | jq -r '.access_token'`\n- `curl -s 'http://localhost:8080/realms/demo/.well-known/openid-configuration'\
  \ | jq '.token_endpoint, .authorization_endpoint'`\n- `curl -s -X POST 'http://localhost:8080/admin/realms/demo/clients'\
  \ -H 'Authorization: Bearer $ADMIN_TOKEN' -H 'Content-Type: application/json' -d '{\"clientId\":\"orders-api\"\
  ,\"publicClient\":false,\"serviceAccountsEnabled\":true}'`\n- `curl -s http://localhost:8080/api/verify\
  \ -H 'Authorization: Bearer $TOKEN' | jq '.subject'`\n\n**Examples:**\n- curl -s -X POST 'http://localhost:8080/realms/demo/protocol/openid-connect/token'\
  \ -d 'grant_type=client_credentials&client_id=orders-api&client_secret=abc123' | jq -r '.access_token'\n\
  - curl -s -X POST 'http://localhost:8080/realms/demo/protocol/openid-connect/revoke' -d 'token=$REFRESH&client_id=api&client_secret=abc123'\n\
  - curl -s -H 'Authorization: Bearer $TOKEN' http://localhost:8080/api/protected | jq '.role'"
prompt: Act as api-auth-engineer and handle the task per the instructions.
