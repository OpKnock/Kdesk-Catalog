title: Api Auth Keys
description: API auth with API key management - generate secure keys, hash at rest, scope and rate-limit
  them, and rotate keys without downtime.
version: 2.0.0
instructions: "# Api Auth Keys\n\nAPI auth with API key management - generate secure keys, hash at rest,\
  \ scope and rate-limit them, and rotate keys without downtime.\n\n## Instructions\n\n# API Auth (API\
  \ Keys)\n\n## What this skill does\nManage API keys for third-party access: generate cryptographically\
  \ secure keys, store only hashes, attach scopes and expiry, support rotation and revocation.\n\n## When\
  \ to use\n- Issuing keys to external partners\n- Replacing shared static secrets\n- Enforcing per-key\
  \ limits and scopes\n\n## Real commands\n```bash\n# Generate a strong key\nopenssl rand -hex 32\nnode\
  \ -e \"const c=require('crypto');console.log(c.randomBytes(32).toString('hex'))\"\n\n# Hash for storage\
  \ (never store the raw key)\nnode -e \"const c=require('crypto');console.log(c.createHash('sha256').update(process.argv[1]).digest('hex'))\"\
  \ $KEY\n\n# Create a scoped key\ncurl -s -X POST http://localhost:8080/api/keys \\\n  -H 'X-Admin-Key:\
  \ $ADMIN' -H 'Content-Type: application/json' \\\n  -d '{\"name\":\"billing\",\"scopes\":[\"read:invoices\"\
  ],\"expires_at\":\"2025-01-01T00:00:00Z\"}' | jq '{key, id}'\n\n# List keys\ncurl -s http://localhost:8080/api/keys\
  \ | jq '.keys[] | {id, name, last_used_at}'\n\n# Rotate\ncurl -s -X POST http://localhost:8080/api/keys/$ID/rotate\
  \ -H 'X-Admin-Key: $ADMIN' | jq '{new_key, old_expires}'\n\n# Revoke\ncurl -s -X DELETE http://localhost:8080/api/keys/$ID\
  \ -H 'X-Admin-Key: $ADMIN' | jq '.revoked'\n\n# Use it\ncurl -s http://localhost:8080/api/orders -H\
  \ 'X-API-Key: $KEY' -o /dev/null -w '%{http_code}'\n```\n\n## Key formats\n- `sk_live_` prefix + 32+\
  \ random bytes (industry standard)\n- Show the raw key exactly once at creation\n\n## Best practices\n\
  - Hash with SHA-256 before storing (plus optional HMAC pepper)\n- Require scopes; default to least privilege\n\
  - Set expiry on all keys; auto-rotate yearly\n- On rotation, accept the old key for a grace window\n\
  \n## Testing\n```bash\ncurl -s http://localhost:8080/api/orders -H 'X-API-Key: bad-key' -o /dev/null\
  \ -w '%{http_code}\\n'\ncurl -s http://localhost:8080/api/keys/$ID/rotate -X POST -H 'X-Admin-Key: $ADMIN'\
  \ | jq\n```\n\n## Capabilities\n\n### api-key-mgmt\nGenerate, hash, scope, and rotate API keys\n\n**Commands:**\n\
  - `openssl rand -hex 32`\n- `node -e \"const c=require('crypto');console.log(c.randomBytes(32).toString('hex'))\"\
  `\n- `node -e \"const c=require('crypto');console.log(c.createHash('sha256').update(process.argv[1]).digest('hex'))\"\
  \ $KEY`\n- `curl -s -X POST http://localhost:8080/api/keys -H 'X-Admin-Key: $ADMIN' -H 'Content-Type:\
  \ application/json' -d '{\"name\":\"billing\",\"scopes\":[\"read:invoices\"],\"expires_at\":\"2025-01-01T00:00:00Z\"\
  }' | jq '{key, id}'`\n- `curl -s http://localhost:8080/api/keys | jq '.keys[] | {id, name, last_used_at}'`\n\
  \n**Examples:**\n- curl -s -X DELETE http://localhost:8080/api/keys/$ID -H 'X-Admin-Key: $ADMIN' | jq\
  \ '.revoked'\n- curl -s http://localhost:8080/api/keys/$ID/rotate -X POST -H 'X-Admin-Key: $ADMIN' |\
  \ jq '{new_key, old_expires}'\n- curl -s http://localhost:8080/api/orders -H 'X-API-Key: $KEY' -o /dev/null\
  \ -w '%{http_code}'"
prompt: Act as Api Auth Keys and handle the task per the instructions.
