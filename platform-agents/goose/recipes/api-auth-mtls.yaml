title: Api Auth mTLS
description: API auth with mutual TLS (mTLS) - generate CA and client certificates with openssl, configure
  the server, and test mTLS handshakes.
version: 2.0.0
instructions: "# Api Auth mTLS\n\nAPI auth with mutual TLS (mTLS) - generate CA and client certificates\
  \ with openssl, configure the server, and test mTLS handshakes.\n\n## Instructions\n\n# API Auth (mTLS)\n\
  \n## What this skill does\nAuthenticate API clients with mutual TLS: create a CA, issue client certificates,\
  \ configure the server to require client certs, and verify handshakes with curl and openssl.\n\n## When\
  \ to use\n- Server-to-server auth between high-value services\n- Replacing shared secrets for internal\
  \ APIs\n- Zero-trust API access\n\n## Real commands\n```bash\n# Create a CA\nopenssl req -x509 -newkey\
  \ rsa:2048 -keyout ca.key -out ca.crt \\\n  -days 365 -nodes -subj '/CN=Demo CA'\n\n# Create a client\
  \ key + CSR\nopenssl req -newkey rsa:2048 -keyout client.key -out client.csr \\\n  -nodes -subj '/CN=partner-1'\n\
  \n# Sign the client certificate\nopenssl x509 -req -in client.csr -CA ca.crt -CAkey ca.key \\\n  -CAcreateserial\
  \ -out client.crt -days 180\n\n# Verify the handshake with client auth\nopenssl s_client -connect localhost:8443\
  \ -cert client.crt -key client.key -CAfile ca.crt -brief\n\n# Call the API with mTLS\ncurl -s --cert\
  \ client.crt --key client.key --cacert ca.crt \\\n  https://localhost:8443/api/data -o /dev/null -w\
  \ '%{http_code}\\n'\n\n# No client cert: handshake should fail\nopenssl s_client -connect localhost:8443\
  \ -CAfile ca.crt -brief 2>&1 | grep -i 'no peer certificate'\n```\n\n## Server config (nginx snippet)\n\
  ```nginx\nserver {\n  listen 8443 ssl;\n  ssl_certificate     /etc/tls/server.crt;\n  ssl_certificate_key\
  \ /etc/tls/server.key;\n  ssl_client_certificate /etc/tls/ca.crt;\n  ssl_verify_client on;\n}\n```\n\
  \n## Best practices\n- Short certificate lifetimes (90-180 days) with auto-renewal\n- Use SAN/SPIFFE\
  \ identities, not CN-only\n- CRL or OCSP for revocation\n- Keep the CA key offline\n\n## Testing\n```bash\n\
  curl -s --cert client.crt --key client.key --cacert ca.crt https://localhost:8443/api/data\ncurl -s\
  \ --cacert ca.crt https://localhost:8443/api/data -o /dev/null -w '%{http_code}\\n'  # expect failure\n\
  ```\n\n## Capabilities\n\n### mtls-auth\nSet up and verify mutual TLS authentication\n\n**Commands:**\n\
  - `openssl req -x509 -newkey rsa:2048 -keyout ca.key -out ca.crt -days 365 -nodes -subj '/CN=Demo CA'`\n\
  - `openssl req -newkey rsa:2048 -keyout client.key -out client.csr -nodes -subj '/CN=partner-1'`\n-\
  \ `openssl x509 -req -in client.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out client.crt -days 180`\n\
  - `curl -s --cert client.crt --key client.key --cacert ca.crt https://localhost:8443/api/data -o /dev/null\
  \ -w '%{http_code}'`\n- `openssl s_client -connect localhost:8443 -cert client.crt -key client.key -CAfile\
  \ ca.crt -brief`\n\n**Examples:**\n- openssl req -newkey rsa:2048 -keyout client.key -out client.csr\
  \ -nodes -subj '/CN=partner-1/O=Acme' -addext 'subjectAltName=URI:spiffe://demo/acme/partner-1'\n- curl\
  \ -s --cert client.crt --key client.key --cacert ca.crt https://localhost:8443/api/data | jq '.client_cn'\n\
  - openssl s_client -connect localhost:8443 -CAfile ca.crt -brief 2>&1 | grep -i 'no peer certificate'"
prompt: Act as Api Auth mTLS and handle the task per the instructions.
