version: 2.0.0
instructions: "# Api Doc Openapi Authoring\n\nImplements API documentation basics: OpenAPI authoring,\
  \ Swagger UI/Redoc serving, and first docs build. Use when authoring or serving OpenAPI specs. Don't\
  \ use for docs-site architecture (see api-doc-site-architecture) or generated SDK docs (see api-documentation-generator).\n\
  \n## Instructions\n\n# API Doc (Implementation)\n\nGets documentation on its feet: a validated spec\
  \ and a served UI.\n\n## When to Use\n- No docs exist yet\n- Quick reference docs for a service\n- Single-spec\
  \ documentation\n\n## Real Commands\n\n```bash\n# Validate\nnpm install -g swagger-cli\nswagger-cli\
  \ validate openapi.yaml\n\n# Bundle for distribution\nswagger-cli bundle openapi.yaml -o bundled.yaml\n\
  \n# Serve Redoc\nnpm install -g redoc-cli\nredoc-cli serve openapi.yaml -p 8090\n\n# Build static HTML\n\
  redoc-cli build openapi.yaml -o index.html\n\n# Swagger UI\nnpm install swagger-ui-dist\n```\n\n## Minimal\
  \ Spec\n\n```yaml\nopenapi: 3.0.0\ninfo:\n  title: My API\n  version: 1.0.0\npaths: {}\n```\n\n## Testing\n\
  Validate after every spec edit; keep bundled.yaml committed.\n\n## Best Practices\n- Validate in pre-commit\n\
  - Serve the same bundled file in all environments\n\n## Capabilities\n\n### openapi-authoring\nAuthor\
  \ and validate OpenAPI specs by hand or from code\n\n**Commands:**\n- `npm install -g swagger-cli`\n\
  - `swagger-cli validate openapi.yaml`\n- `swagger-cli bundle openapi.yaml -o bundled.yaml`\n- `swagger-cli\
  \ dereference openapi.yaml -o deref.yaml`\n- `node -e \"const s={openapi:'3.0.0',info:{title:'API',version:'1.0.0'},paths:{}};console.log(JSON.stringify(s,null,2))\"\
  `\n\n**Examples:**\n- swagger-cli validate openapi.yaml\n- swagger-cli bundle openapi.yaml -o bundled.yaml\
  \ && swagger-cli validate bundled.yaml\n- node -e \"const s={openapi:'3.0.0',info:{title:'API',version:'1.0.0'},paths:{}};console.log(JSON.stringify(s,null,2))\"\
  \n\n### ui-serving\nServe Swagger UI and Redoc locally and in production\n\n**Commands:**\n- `npm install\
  \ -g redoc-cli`\n- `redoc-cli serve openapi.yaml`\n- `redoc-cli build openapi.yaml -o index.html`\n\
  - `npm install swagger-ui-dist`\n- `node -e \"const d=require('swagger-ui-dist');console.log(d.getAbsoluteFSPath())\"\
  `\n\n**Examples:**\n- redoc-cli serve openapi.yaml -p 8090\n- redoc-cli build openapi.yaml -o index.html\n\
  - node -e \"const d=require('swagger-ui-dist');console.log(d.getAbsoluteFSPath())\""
prompt: Act as Api Doc Openapi Authoring and handle the task per the instructions.
