title: Api Middleware Pino Logging
description: 'Builds observability-focused middleware for Node APIs: structured JSON logging with pino,
  request IDs, latency capture, and pretty console output in development.'
version: 2.0.0
instructions: "# Api Middleware Pino Logging\n\nBuilds observability-focused middleware for Node APIs:\
  \ structured JSON logging with pino, request IDs, latency capture, and pretty console output in development.\n\
  \n## Instructions\n\n# API Middleware v2 - Observability\n\nLogging and correlation middleware for Node.js\
  \ APIs.\n\n## What This Skill Does\n- Adds pino-http middleware for JSON request logging\n- Propagates\
  \ X-Request-Id correlation IDs through the pipeline\n- Measures per-request latency and status mapping\n\
  \n## When to Use\n- Debugging distributed request traces\n- Switching from text logs to structured JSON\n\
  - Adding service metadata to all log lines\n\n## Real Commands\n\n```bash\nnpm install pino pino-http\
  \ pino-pretty\nnode app.js | npx pino-pretty\ncurl -s -H \"X-Request-Id: 123e4567\" http://localhost:3000/api/health\n\
  ```\n\n## Middleware Setup\n\n```js\nconst pinoHttp = require('pino-http');\napp.use(pinoHttp({\n  genReqId:\
  \ (req) => req.headers['x-request-id'],\n  base: { service: 'billing-api' },\n  customLogLevel: (req,\
  \ res, err) => err ? 'error' : res.statusCode >= 400 ? 'warn' : 'info'\n}));\n```\n\n## Testing\n- Send\
  \ a request with an X-Request-Id header and confirm it appears in log output\n- Verify 5xx responses\
  \ produce error-level log lines\n- Confirm logs parse with jq for field extraction\n\n## Best Practices\n\
  - Never log bodies of auth endpoints\n- Use genReqId to honor incoming correlation headers\n- Keep pino\
  \ as a direct dependency so serializers are stable\n\n## Capabilities\n\n### pino-logging\nAdd structured\
  \ logging middleware with correlation IDs and latency measurement\n\n**Commands:**\n- `npm install pino\
  \ pino-http pino-pretty`\n- `node app.js | npx pino-pretty`\n- `curl -s -H \"X-Request-Id: 123e4567\"\
  \ http://localhost:3000/api/health`\n- `curl -s -o /dev/null -w \"%{http_code} %{time_total}s\\n\" http://localhost:3000/api`\n\
  \n**Examples:**\n- node app.js | npx pino-pretty renders human-readable logs in dev\n- app.use(pinoHttp({\
  \ genReqId: (req) => req.headers['x-request-id'] }))\n- curl -H 'X-Request-Id: abc' localhost:3000/\
  \ traces a single request across logs\n\n### log-querying\nQuery and filter structured logs in production\
  \ and development\n\n**Commands:**\n- `npm install -g pino-pretty`\n- `cat app.log | pino-pretty --translateTime`\n\
  - `jq 'select(.level >= 40)' app.log`\n- `node -r pino-pretty app.js`\n\n**Examples:**\n- -cli --help\n\
  - -api --help"
prompt: Act as Api Middleware Pino Logging and handle the task per the instructions.
