  \ (paths, checksums)\n- Fingerprint: `api-mock-browser-workers:883a8e2a`\n\n# API Mock v4 - MSW + Playwright\n\
  \nBrowser-grade mocking with MSW and E2E coverage.\n\n## What This Skill Does\n- Intercepts app traffic\
  \ in the browser with service workers\n- Shares handlers between dev, unit, and Playwright E2E runs\n\
  - Isolates test data per test with scoped handlers\n\n## When to Use\n- E2E suites that must not depend\
  \ on live backends\n- Reproducing specific API states in UI tests\n- Keeping dev and test mocks from\
  \ a single source\n\n## Real Commands\n\n```bash\nnpm install msw --save-dev\nnpx msw init public/\n\
  ```\n\n## Playwright Integration\n\n```ts\nimport { test as base } from '@playwright/test';\nimport\
  \ { createWorkerFixture } from '@playwright/msw';\nexport const test = base.extend({\n  worker: createWorkerFixture(handlers)\n\
  });\n```\n\n## Testing\n- Assert network responses from devtools/network panel match handlers\n- Verify\
  \ onUnhandledRequest: 'error' surfaces missing mocks\n- Reset server state between Playwright tests\n\
  \n## Best Practices\n- Version the worker script with the app bundle\n- Use dynamic handlers for time-dependent\
  \ data\n- Keep handler modules framework-agnostic for reuse\n\n## Capabilities\n\n### browser-workers\n\
  Configure MSW service workers in a Vite/Next.js application\n\n**Parameters:**\n- `worker-dir` (string):\
  \ Directory that serves the service worker script\n- `onUnhandledRequest` (string): warn | error | bypass\
  \ for unmatched requests\n- `quiet` (boolean): Suppress worker console output\n\n**Commands:**\n- `npm\
  \ install msw --save-dev`\n- `npx msw init public/`\n- `npm run build`\n- `curl -s http://localhost:4173\
  \ -o /dev/null -w '%{http_code}\\n'`\n- `npx playwright install chromium`\n\n**Examples:**\n- npx msw\
  \ init public/ writes the worker script served at /mockServiceWorker.js\n- import { setupWorker } from\
  \ 'msw/browser' starts the browser worker\n- worker.start({ onUnhandledRequest: 'error' }) fails loudly\
  \ on unmocked calls\n\n### e2e-integration\nReuse MSW handlers inside Playwright E2E tests\n\n**Commands:**\n\
  - `npm install @playwright/test msw`\n- `npx playwright test tests/api-flows.spec.ts --project=chromium`\n\
  - `npx playwright test --ui`\n- `npx playwright show-report`\n\n**Examples:**\n- -cli --help\n- -api\
