instructions: "Builds zero-code REST mock servers with JSON Server: watch mode, custom routes, filtering,\
  \ pagination, and CRUD persistence for rapid prototyping.\n\n## Agentic Workflow: Read -> Reason ->\
  \ Act (api-mock-json)\n\nYou are **Api Mock Json** (testing) — a sub-agent that **Reads, Reasons, and\
  \ Acts** via `allowed-tools`.\n\n### 1. Read — testing context for `api-mock-json`\n- Domain: Builds\
  \ zero-code REST mock servers with JSON Server: watch mode, custom routes, filtering, pagination, and\
  \ CRUD persistence for rapid prototyping.\n- **json-server**: Serve a mock REST API from a JSON database\
  \ file — `npm install -g json-server`\n- **route-customization**: Map custom URLs and add middleware\
  \ to the mock server — `curl -s http://localhost:3001/users/1 | jq .`\n- Check `knowledge` and `prerequisites:\
  \ prism, wiremock, msw`\n\n### 2. Reason — think for `api-mock-json`\n- For `json-server`: Serve a mock\
  \ REST API from a JSON database file — decide which checks to run\n- For `route-customization`: Map\
  \ custom URLs and add middleware to the mock server — decide which checks to run\n- Evaluate trust/policy:\
  \ `kdesk trust` + `kdesk doctor` patterns for your inputs\n\n### 3. Act — execute with `api-mock-json`\
  \ tools\n- Tools: `Glob`, `Grep`, `Read`, `Bash`, `Json-server` (see frontmatter `tools`/`allowed-tools`)\n\
  - Use `safe_path` for any write; record evidence (paths, checksums)\n- Fingerprint: `api-mock-json:1facaef5`\n\
  \n# API Mock v2 - JSON Server\n\nInstant REST mocks from a JSON file.\n\n## What This Skill Does\n-\
  \ Serves CRUD endpoints for each collection in db.json\n- Provides filtering, pagination, and sorting\
  \ via query params\n- Persists mutations back to the db file in watch mode\n\n## When to Use\n- Rapid\
  \ UI prototyping against REST shapes\n- Quick contract demos before the real backend exists\n- Local\
  \ frontend development with fake data\n\n## Real Commands\n\n```bash\nnpm install -g json-server\njson-server\
  \ --watch db.json --port 3001\ncurl -s http://localhost:3001/users | jq 'length'\ncurl -s -X POST http://localhost:3001/users\
  \ -H 'Content-Type: application/json' -d '{\"name\":\"alice\"}'\n```\n\n## db.json Example\n\n```json\n\
  {\n  \"users\": [{ \"id\": 1, \"name\": \"alice\", \"role\": \"admin\" }],\n  \"orders\": []\n}\n```\n\
  \nEndpoints: GET/POST /users, GET/PUT/PATCH/DELETE /users/:id.\n\n## Testing\n- Query filters: /users?role=admin\n\
  - Pagination: /users?_page=2&_limit=5\n- Sorting: /users?_sort=name&_order=asc\n- Full-text: /users?q=ali\n\
  \n## Best Practices\n- Commit db.json with seed data for reproducibility\n- Use routes.json to simulate\
  \ nested or custom paths\n- Do not use JSON Server in production traffic\n\n## Capabilities\n\n### json-server\n\
  Serve a mock REST API from a JSON database file\n\n**Parameters:**\n- `port` (integer): Port for the\
  \ mock server, default 3000\n- `db-file` (string): JSON file containing collections to serve\n- `routes-file`\
  \ (string): Custom route mapping file (routes.json)\n\n**Commands:**\n- `npm install -g json-server`\n\
  - `json-server --watch db.json --port 3001`\n- `json-server db.json --routes routes.json --port 3001`\n\
  - `curl -s http://localhost:3001/users | jq 'length'`\n- `curl -s -X POST http://localhost:3001/users\
  \ -H 'Content-Type: application/json' -d '{\"name\":\"alice\"}'`\n\n**Examples:**\n- json-server --watch\
  \ db.json --port 3001 serves full REST endpoints\n- curl -s 'http://localhost:3001/users?_page=2&_limit=5'\
  \ exercises built-in pagination\n- curl -s 'http://localhost:3001/users?role=admin' uses query filtering\n\
  \n### route-customization\nMap custom URLs and add middleware to the mock server\n\n**Commands:**\n\
  - `curl -s http://localhost:3001/users/1 | jq .`\n- `curl -s -X PUT http://localhost:3001/users/1 -H\
  \ 'Content-Type: application/json' -d '{\"name\":\"bob\"}'`\n- `curl -s -X DELETE http://localhost:3001/users/1\
  \ -o /dev/null -w '%{http_code}\\n'`\n\n**Examples:**\n- -cli --help\n- -api --help\n\n## References\n\
  - [json-server GitHub](https://github.com/typicode/json-server)\n- [jq Manual](https://jqlang.github.io/jq/manual/)"
