title: Api Pagination Drf
description: 'Implements pagination in Django REST Framework: PageNumberPagination, LimitOffsetPagination,
  CursorPagination classes, and OpenAPI schema integration.'
version: 2.0.0
instructions: "# Api Pagination Drf\n\nImplements pagination in Django REST Framework: PageNumberPagination,\
  \ LimitOffsetPagination, CursorPagination classes, and OpenAPI schema integration.\n\n## Instructions\n\
  \n# API Pagination v4 - Django REST Framework\n\nPagination with DRF classes.\n\n## What This Skill\
  \ Does\n- Applies PageNumber, LimitOffset, or Cursor pagination\n- Returns count/next/previous metadata\n\
  - Documents paging parameters in OpenAPI schemas\n\n## When to Use\n- DRF APIs needing standard paging\
  \ behavior\n- Admin list views with moderate data sizes\n- APIs where cursor stability matters less\
  \ than simplicity\n\n## Real Commands\n\n```bash\ncurl -s 'http://localhost:8000/api/users/?page=2&page_size=10'\
  \ | jq '.count, .next, .previous'\ncurl -s 'http://localhost:8000/api/users/?limit=5&offset=10' | jq\
  \ '.count, .results | length'\n```\n\n## Settings\n\n```python\nREST_FRAMEWORK = {\n    'DEFAULT_PAGINATION_CLASS':\
  \ 'rest_framework.pagination.PageNumberPagination',\n    'PAGE_SIZE': 20,\n    'MAX_PAGE_SIZE': 100,\n\
  }\n```\n\n## Testing\n- Verify count stays consistent across pages\n- Test negative and oversized page\
  \ values\n- Confirm cursor ordering survives record edits\n\n## Best Practices\n- Use CursorPagination\
  \ for feeds and timelines\n- Set MAX_PAGE_SIZE to bound query cost\n- Keep pagination metadata in the\
  \ serializer response\n\n## Capabilities\n\n### drf-pagination\nConfigure DRF pagination classes and\
  \ page metadata\n\n**Commands:**\n- `python manage.py runserver 8000`\n- `curl -s 'http://localhost:8000/api/users/?page=2&page_size=10'\
  \ | jq '.count, .next, .previous'`\n- `curl -s 'http://localhost:8000/api/users/?limit=5&offset=10'\
  \ | jq '.count, .results | length'`\n- `python manage.py shell -c \"from rest_framework.pagination import\
  \ PageNumberPagination; print(PageNumberPagination.page_size)\"`\n- `curl -s 'http://localhost:8000/api/schema/'\
  \ -o schema.yaml`\n\n**Examples:**\n- ?page=2&page_size=10 returns count/next/previous metadata\n- LimitOffsetPagination\
  \ accepts ?limit=5&offset=10\n- CursorPagination keys on ordering fields and returns next cursors\n\n\
  ### custom-pagination\nSubclass pagination classes for custom response shapes\n\n**Commands:**\n- `curl\
  \ -s 'http://localhost:8000/api/users/?ordering=created_at' | jq '.next'`\n- `python manage.py test\
  \ api.tests.test_pagination -v 2`\n- `curl -s 'http://localhost:8000/api/users/?page=-5' -o /dev/null\
  \ -w '%{http_code}\\n'`"
prompt: Act as Api Pagination Drf and handle the task per the instructions.
