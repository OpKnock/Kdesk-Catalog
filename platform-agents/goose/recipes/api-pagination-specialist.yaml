title: api-pagination-specialist
description: 'Implements RFC 8288 Link headers for pagination: rel=next/prev/first/last, parsing with
  standard libraries, and REST hypermedia navigation.'
version: 2.0.0
instructions: "# api-pagination-specialist\n\nImplements RFC 8288 Link headers for pagination: rel=next/prev/first/last,\
  \ parsing with standard libraries, and REST hypermedia navigation.\n\n## Instructions\n\n# API Pagination\
  \ Specialist\n\nLink-header pagination per RFC 8288.\n\n## What This Skill Does\n- Emits next/prev/first/last\
  \ URLs in the Link response header\n- Keeps pagination metadata out of the response body\n- Enables\
  \ generic hypermedia-driven clients\n\n## When to Use\n- REST APIs with clients that follow Link relations\n\
  - Standardizing pagination across many endpoints\n- Paginating where the body shape must stay fixed\n\
  \n## Real Commands\n\n```bash\ncurl -s -D- 'http://api.example.com/users?page=2' | grep -i '^link:'\n\
  npm install parse-link-header\nnode -e \"const parse=require('parse-link-header'); console.log(parse('<https://api.example.com/users?page=3>;\
  \ rel=\\\"next\\\"'))\"\n```\n\n## Header Format\n\n```http\nHTTP/1.1 200 OK\nLink: <https://api.example.com/users?page=1>;\
  \ rel=\"first\",\n      <https://api.example.com/users?page=3>; rel=\"next\",\n      <https://api.example.com/users?page=10>;\
  \ rel=\"last\"\n```\n\n## Testing\n- Assert headers exist and URLs are absolute\n- Verify last page\
  \ omits rel=next\n- Confirm empty results still emit valid links\n\n## Best Practices\n- Build links\
  \ from request host, never hardcode\n- Percent-encode query values in link URLs\n- Combine with rel=prev\
  \ for bidirectional navigation\n\n## Capabilities\n\n### link-headers\nExpose pagination metadata in\
  \ HTTP Link headers\n\n**Commands:**\n- `curl -sI 'http://localhost:8080/users?page=2&limit=10'`\n-\
  \ `curl -s -D- 'http://localhost:8080/users?page=2' | grep -i '^link:'`\n- `npm install parse-link-header`\n\
  - `node -e \"const parse=require('parse-link-header'); console.log(parse('demo-http-localhost-8080-users-page;\
  \ rel=\\\"next\\\"'))\"`\n- `curl -s -o /dev/null -w '%{http_code}\\n' 'http://localhost:8080/users?page=9999'`\n\
  \n**Examples:**\n- Link: demo-page; rel=\"next\" is the RFC 8288 wire format\n- parse-link-header turns\
  \ Link headers into a JS object\n- grep -i '^link:' extracts pagination links from response headers\n\
  \n### header-validation\nValidate Link header output against RFC 8288\n\n**Commands:**\n- `node -e \"\
  const h='demo-http-localhost-8080-users-page; rel=\\\"next\\\"'; const m=h.match(/demo-]+)>;\\s*rel=\\\
  \"(\\w+)\\\"/); console.log(m ? m.slice(1) : 'invalid')\"`\n- `curl -s 'http://localhost:8080/users?page=1'\
  \ -D- -o /dev/null | grep -ci 'link:'`\n\n**Examples:**\n- -cli --help\n- -api --help"
prompt: Act as api-pagination-specialist and handle the task per the instructions.
