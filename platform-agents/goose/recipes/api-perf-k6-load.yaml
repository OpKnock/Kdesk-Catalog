title: Api Perf K6 Load
description: 'Runs k6 load tests against APIs: virtual users, stages, thresholds, checks, and CI-friendly
  summary exports for throughput and latency assertions.'
version: 2.0.0
instructions: "# Api Perf K6 Load\n\nRuns k6 load tests against APIs: virtual users, stages, thresholds,\
  \ checks, and CI-friendly summary exports for throughput and latency assertions.\n\n## Instructions\n\
  \n# API Perf v2 - k6 Load Testing\n\nLoad testing with k6.\n\n## What This Skill Does\n- Simulates realistic\
  \ user load with virtual users\n- Ramps traffic in stages to find saturation\n- Fails CI when thresholds\
  \ are breached\n\n## When to Use\n- Before releases to catch regressions\n- Capacity planning for expected\
  \ traffic\n- Comparing architecture options (caching, scaling)\n\n## Real Commands\n\n```bash\nk6 run\
  \ --vus 50 --duration 60s script.js\nk6 run --stage '2s:10,30s:100,10s:0' ramping.js\nk6 run --summary-export=summary.json\
  \ script.js\n```\n\n## Script Example\n\n```js\nimport http from 'k6/http';\nimport { check, sleep }\
  \ from 'k6';\nexport const options = {\n  thresholds: { http_req_failed: ['rate<0.01'], http_req_duration:\
  \ ['p(95)<300'] }\n};\nexport default function () {\n  const res = http.get('https://api.example.com/v1/items');\n\
  \  check(res, { 'status 200': (r) => r.status === 200 });\n  sleep(1);\n}\n```\n\n## Testing\n- Run\
  \ a soak variant (30m at moderate load) for leaks\n- Add scenarios to mix read and write traffic\n-\
  \ Use k6 inspect to validate options before full runs\n\n## Best Practices\n- Randomize test data to\
  \ avoid cache skewing results\n- Set thresholds on percentiles, not averages\n- Store summary.json outputs\
  \ for regression charts\n\n## Capabilities\n\n### k6-load-testing\nExecute scripted load tests with\
  \ thresholds\n\n**Commands:**\n- `k6 run script.js`\n- `k6 run --vus 50 --duration 60s script.js`\n\
  - `k6 run --stage '2s:10,30s:100,10s:0' ramping.js`\n- `k6 run --summary-export=summary.json script.js`\n\
  - `k6 inspect script.js`\n\n**Examples:**\n- k6 run --vus 50 --duration 60s runs a steady 50-user load\n\
  - --stage ramps users up and down over time\n- --summary-export writes JSON for CI comparison\n\n###\
  \ thresholds-checks\nDefine pass/fail gates on latency and error rate\n\n**Commands:**\n- `k6 run --threshold\
  \ 'http_req_duration:p(95)<300' script.js`\n- `k6 run --threshold 'http_req_failed:rate<0.01' script.js`\n\
  - `k6 run --quiet script.js`\n\n**Examples:**\n- -cli --help\n- -api --help"
prompt: Act as Api Perf K6 Load and handle the task per the instructions.
