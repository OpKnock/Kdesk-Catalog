title: api-performance-engineer
description: 'Engineers API performance end-to-end with vegeta: attack targets files, rate/duration attacks,
  histogram reports, and binary result encoding for charting.'
version: 2.0.0
instructions: "# api-performance-engineer\n\nEngineers API performance end-to-end with vegeta: attack\
  \ targets files, rate/duration attacks, histogram reports, and binary result encoding for charting.\n\
  \n## Instructions\n\n# API Performance Engineer\n\nLoad engineering with vegeta.\n\n## What This Skill\
  \ Does\n- Runs fixed-rate attacks with exact QPS control\n- Reports histograms, percentiles, and status\
  \ code distributions\n- Produces artifacts for dashboards and reports\n\n## When to Use\n- Precise rate-based\
  \ capacity tests\n- Comparing versions with identical attack profiles\n- Generating shareable performance\
  \ reports\n\n## Real Commands\n\n```bash\necho \"GET http://localhost:3000/api\" | vegeta attack -duration=30s\
  \ -rate=100 | vegeta report\nvegeta attack -targets=targets.txt -rate=50 -duration=60s | tee results.bin\
  \ | \\\n  vegeta report -type=hist[0,10ms,50ms,200ms,1s]\nvegeta encode -to json < results.bin | jq\
  \ '.[0].latencies'\n```\n\n## Targets File\n\n```\nGET http://localhost:3000/api/items\nPOST http://localhost:3000/api/items\n\
  Content-Type: application/json\n@/tmp/body.json\n```\n\n## Testing\n- Verify attack rate matches configured\
  \ QPS\n- Correlate latency percentiles with resource utilization\n- Keep result binaries for reproducible\
  \ audits\n\n## Best Practices\n- Use -max-workers to control concurrency beyond rate\n- Name attacks\
  \ to identify test scenarios\n- Store report.json in CI artifacts per release\n\n## Capabilities\n\n\
  ### vegeta-attacks\nRun vegeta load attacks from targets files\n\n**Commands:**\n- `echo \"GET http://localhost:3000/api\"\
  \ | vegeta attack -duration=30s -rate=100 | vegeta report`\n- `vegeta attack -targets=targets.txt -rate=50\
  \ -duration=60s -name=apiv1 | tee results.bin | vegeta report -type=hist[0,10ms,50ms,200ms,1s]`\n- `vegeta\
  \ encode -to json < results.bin | jq '.[0].latencies'`\n- `vegeta report -type=json results.bin > report.json`\n\
  - `vegeta plot results.bin > plot.html`\n\n**Examples:**\n- vegeta attack pipes directly into vegeta\
  \ report\n- hist[0,10ms,...] groups latency into buckets\n- vegeta plot generates an interactive HTML\
  \ chart\n\n### distributed-attacks\nScale attacks across machines with vegeta\n\n**Commands:**\n- `vegeta\
  \ attack -rate=0 -max-workers=10 -duration=60s -targets=targets.txt > results.bin`\n- `vegeta report\
  \ -every=5s results.bin`\n- `vegeta dump results.bin | head -5`"
prompt: Act as api-performance-engineer and handle the task per the instructions.
