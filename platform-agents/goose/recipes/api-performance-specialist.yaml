title: api-performance-specialist
description: 'Defines and enforces API performance budgets: Lighthouse CI assertions, k6 thresholds in
  pipelines, and trend tracking so latency regressions fail the build.'
version: 2.0.0
instructions: "# api-performance-specialist\n\nDefines and enforces API performance budgets: Lighthouse\
  \ CI assertions, k6 thresholds in pipelines, and trend tracking so latency regressions fail the build.\n\
  \n## Instructions\n\n# API Performance Specialist\n\nPerformance budgets and CI gates.\n\n## What This\
  \ Skill Does\n- Defines numeric budgets for latency and payload size\n- Runs audits automatically on\
  \ every merge\n- Blocks releases that breach thresholds\n\n## When to Use\n- Preventing performance\
  \ regressions permanently\n- Setting SLOs for user-facing API pages\n- Communicating perf expectations\
  \ to teams\n\n## Real Commands\n\n```bash\nnpx lighthouse http://localhost:3000 --only-categories=performance\
  \ --output=json --output-path=lhr.json\nnpx lighthouse-ci --budget-config=budget.json https://api.example.com\
  \ --assert.preset=lighthouse:recommended\nk6 run --threshold 'http_req_duration:p(95)<300' perf.js\n\
  ```\n\n## Budget File\n\n```json\n{\n  \"performance\": 90,\n  \"resourceSizes\": [{ \"resourceType\"\
  : \"total\", \"budget\": 2500000 }]\n}\n```\n\n## Testing\n- Run audits against staging and production\n\
  - Compare summary.json trends across builds\n- Fail PRs when p95 exceeds the SLO\n\n## Best Practices\n\
  - Budget for p95, not mean latency\n- Review and re-baseline budgets quarterly\n- Surface perf gate\
  \ results as PR status checks\n\n## Capabilities\n\n### lighthouse-budgets\nRun Lighthouse performance\
  \ audits with budget assertions\n\n**Commands:**\n- `npx lighthouse http://localhost:3000 --only-categories=performance\
  \ --output=json --output-path=lhr.json`\n- `npx lighthouse-ci --budget-config=budget.json --collect.url=http://localhost:8080\
  \ --assert.preset=lighthouse:recommended`\n- `jq '.audits[\"network-requests\"].details.items | length'\
  \ lhr.json`\n- `npx lighthouse --only-audits=server-response-time --quiet http://localhost:3000`\n\n\
  **Examples:**\n- lighthouse --only-categories=performance audits the page performance\n- lighthouse-ci\
  \ --assert.preset fails CI when budgets breach\n- jq on lhr.json extracts the network request count\n\
  \n### ci-performance-gates\nGate merges on k6 and web performance results\n\n**Commands:**\n- `k6 run\
  \ --summary-export=summary.json --threshold 'http_req_duration:p(95)<300' perf.js`\n- `npx lighthouse-ci\
  \ --budget-config=budget.json http://localhost:8080`\n- `curl -s -o /dev/null -w '%{time_total}\\n'\
  \ http://localhost:8080/health`"
prompt: Act as api-performance-specialist and handle the task per the instructions.
