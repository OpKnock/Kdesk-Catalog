title: Api Rate Limit Verification
description: 'Verifies rate limiting behavior under load: 429 response testing, header assertions, burst
  tolerance checks, and k6 scenarios that prove limits hold at scale.'
version: 2.0.0
instructions: "# Api Rate Limit Verification\n\nVerifies rate limiting behavior under load: 429 response\
  \ testing, header assertions, burst tolerance checks, and k6 scenarios that prove limits hold at scale.\n\
  \n## Instructions\n\n# API Rate v4 - Limit Testing\n\nProving rate limits behave under load.\n\n## What\
  \ This Skill Does\n- Verifies exact 429 thresholds per client\n- Asserts RateLimit and Retry-After headers\n\
  - Proves limits hold under concurrency\n\n## When to Use\n- Acceptance tests for new limit configs\n\
  - Regression checks after limit refactors\n- Documenting observable limit behavior\n\n## Real Commands\n\
  \n```bash\nfor i in $(seq 1 150); do curl -s -o /dev/null -w '%{http_code}\\n' -H 'X-Client-Id: test1'\
  \ http://localhost:3000/api; done | sort | uniq -c\ncurl -s -D- -o /dev/null http://localhost:3000/api\
  \ | grep -iE 'ratelimit|retry-after'\n```\n\n## k6 Assertions\n\n```js\nconst res = http.get('http://localhost:3000/api',\
  \ { headers: { 'X-Client-Id': __VU } });\nif (res.status === 429) {\n  check(res, { 'has retry-after':\
  \ (r) => r.headers['Retry-After'] !== undefined });\n}\n```\n\n## Testing\n- Confirm the burst count\
  \ matches the configured limit\n- Validate header values match window math\n- Run with 2x VUs to catch\
  \ race conditions\n\n## Best Practices\n- Test at the exact boundary and one request beyond\n- Include\
  \ a control client that stays under the limit\n- Store limit-test scripts with the API source\n\n##\
  \ Capabilities\n\n### limit-verification\nAssert 429s and rate limit headers under controlled load\n\
  \n**Commands:**\n- `curl -s -o /dev/null -w '%{http_code}\\n' -H 'X-Client-Id: test1' http://localhost:3000/api`\n\
  - `for i in $(seq 1 150); do curl -s -o /dev/null -w '%{http_code}\\n' -H 'X-Client-Id: test1' http://localhost:3000/api;\
  \ done | sort | uniq -c`\n- `curl -s -D- -o /dev/null http://localhost:3000/api | grep -iE 'ratelimit|retry-after'`\n\
  - `ab -n 500 -c 20 http://localhost:3000/api 2>&1 | grep -E 'Non-2xx|Requests per second'`\n\n**Examples:**\n\
  - curl loops count how many requests pass before 429s start\n- grep -iE 'ratelimit|retry-after' verifies\
  \ limit headers\n- ab reports the non-2xx share under concurrent load\n\n### k6-limit-tests\nScript\
  \ rate limit enforcement tests in k6\n\n**Commands:**\n- `k6 run --vus 5 --iterations 300 ratelimit-test.js`\n\
  - `k6 run --threshold 'http_req_duration:p(95)<500' ratelimit-test.js`\n- `k6 run --summary-export=limit-summary.json\
  \ ratelimit-test.js`"
prompt: Act as Api Rate Limit Verification and handle the task per the instructions.
