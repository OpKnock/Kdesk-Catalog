title: api-rate-limiting-engineer
description: 'Implements rate limiting at the gateway with Kong''s rate-limiting plugin and OpenResty:
  plugin config, consumer-level limits, and declarative policies via decK.'
version: 2.0.0
instructions: "# api-rate-limiting-engineer\n\nImplements rate limiting at the gateway with Kong's rate-limiting\
  \ plugin and OpenResty: plugin config, consumer-level limits, and declarative policies via decK.\n\n\
  ## Instructions\n\n# API Rate Limiting Engineer\n\nGateway rate limiting with Kong.\n\n## What This\
  \ Skill Does\n- Applies rate limiting without touching service code\n- Scopes limits per consumer, IP,\
  \ or credential\n- Manages policies declaratively with decK\n\n## When to Use\n- Centralized throttling\
  \ across services\n- Per-tier limits for API consumers\n- Migrating app-level limits to the gateway\n\
  \n## Real Commands\n\n```bash\ncurl -s -X POST http://localhost:8001/plugins -d 'name=rate-limiting'\
  \ -d 'config.minute=60' -d 'config.limit_by=consumer'\ncurl -s -X POST http://localhost:8001/consumers\
  \ -d 'username=alice'\ncurl -s -X POST http://localhost:8001/consumers/alice/key-auth -d 'key=alice-key'\n\
  ```\n\n## Declarative Policy\n\n```yaml\n_format_version: \"3.0\"\nconsumers:\n  - username: alice\n\
  \    keyauth_credentials:\n      - key: alice-key\nplugins:\n  - name: rate-limiting\n    config: {\
  \ minute: 60, limit_by: consumer }\n```\n\n## Testing\n- Exhaust the limit and confirm 429 responses\n\
  - Verify limit headers (X-RateLimit-Remaining) appear\n- Test consumer isolation with two credentials\n\
  \n## Best Practices\n- Use the cluster policy in multi-node deployments\n- Combine with key-auth so\
  \ limits bind to real identities\n- Alert on 429 rates to detect abusive bursts\n\n## Capabilities\n\
  \n### kong-rate-limit\nEnable and tune Kong rate-limiting plugins\n\n**Commands:**\n- `curl -s -X POST\
  \ http://localhost:8001/plugins -d 'name=rate-limiting' -d 'config.minute=60' -d 'config.limit_by=consumer'`\n\
  - `curl -s http://localhost:8001/plugins | jq '.data[0].config'`\n- `curl -s -X PATCH http://localhost:8001/plugins/$(curl\
  \ -s http://localhost:8001/plugins | jq -r '.data[0].id') -d 'config.hour=3600'`\n- `curl -s -o /dev/null\
  \ -w '%{http_code}\\n' -H 'apikey: test' http://localhost:8000/api`\n- `deck gateway sync kong.yaml`\n\
  \n**Examples:**\n- config.minute=60 permits 60 requests per minute\n- limit_by=consumer enforces per-consumer\
  \ counters\n- deck gateway sync applies rate limit policies declaratively\n\n### kong-consumers\nCreate\
  \ consumers and credentials for limit scoping\n\n**Commands:**\n- `curl -s -X POST http://localhost:8001/consumers\
  \ -d 'username=alice'`\n- `curl -s -X POST http://localhost:8001/consumers/alice/key-auth -d 'key=alice-key'`\n\
  - `curl -s http://localhost:8001/consumers/alice/key-auth | jq '.data[0].key'`"
prompt: Act as api-rate-limiting-engineer and handle the task per the instructions.
