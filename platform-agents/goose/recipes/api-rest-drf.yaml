title: Api Rest Drf
description: 'Builds REST APIs with Django REST Framework: models, serializers, viewsets, routers, permissions,
  and browsable API testing.'
version: 2.0.0
instructions: "# Api Rest Drf\n\nBuilds REST APIs with Django REST Framework: models, serializers, viewsets,\
  \ routers, permissions, and browsable API testing.\n\n## Instructions\n\n# API REST v4 - Django REST\
  \ Framework\n\nREST APIs with DRF.\n\n## What This Skill Does\n- Exposes models as REST resources with\
  \ viewsets\n- Validates and serializes with serializers\n- Handles auth with permission classes\n\n\
  ## When to Use\n- Python/Django teams\n- Rapid CRUD APIs with admin UIs\n- Standardized DRF projects\n\
  \n## Real Commands\n\n```bash\npip install django djangorestframework\ndjango-admin startproject config\
  \ .\npython manage.py startapp api\npython manage.py migrate\npython manage.py runserver\n```\n\n##\
  \ ViewSet Example\n\n```python\nfrom rest_framework import viewsets\nfrom .models import User\nfrom\
  \ .serializers import UserSerializer\n\nclass UserViewSet(viewsets.ModelViewSet):\n    queryset = User.objects.all()\n\
  \    serializer_class = UserSerializer\n```\n\n## Testing\n- Verify browsable API at /api/users/\n-\
  \ Test validation and permissions with APIClient\n- Confirm 401/403 for anonymous writes\n\n## Best\
  \ Practices\n- Use routers to wire URLs consistently\n- Add filtering and ordering mixins\n- Document\
  \ with drf-spectacular OpenAPI generation\n\n## Capabilities\n\n### drf-setup\nScaffold a Django project\
  \ with DRF\n\n**Commands:**\n- `pip install django djangorestframework`\n- `django-admin startproject\
  \ config .`\n- `python manage.py startapp api`\n- `python manage.py migrate`\n- `python manage.py runserver`\n\
  \n**Examples:**\n- django-admin startproject scaffolds the project\n- python manage.py migrate applies\
  \ schema\n- python manage.py runserver serves the browsable API\n\n### viewsets\nExpose CRUD via viewsets\
  \ and routers\n\n**Commands:**\n- `curl -s http://localhost:8000/api/users/ | jq 'length'`\n- `curl\
  \ -s -X POST http://localhost:8000/api/users/ -H 'Content-Type: application/json' -d '{\"name\":\"alice\"\
  ,\"email\":\"a@localhost\"}' -w '\\n%{http_code}\\n'`\n- `curl -s -o /dev/null -w '%{http_code}\\n'\
  \ -X POST http://localhost:8000/api/users/ -H 'Content-Type: application/json' -d '{\"name\":\"x\"}'`\n\
  - `python manage.py test api -v 2`\n\n**Examples:**\n- -cli --help\n- -api --help"
prompt: Act as Api Rest Drf and handle the task per the instructions.
