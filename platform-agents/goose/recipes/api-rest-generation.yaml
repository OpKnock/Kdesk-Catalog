title: Api Rest Generation
description: 'Generates REST clients and documentation from OpenAPI with openapi-generator-cli and Redocly:
  multi-language client generation, config files, and docs deployment.'
version: 2.0.0
instructions: "# Api Rest Generation\n\nGenerates REST clients and documentation from OpenAPI with openapi-generator-cli\
  \ and Redocly: multi-language client generation, config files, and docs deployment.\n\n## Instructions\n\
  \n# API REST v5 - Clients & Docs\n\nCode and doc generation from OpenAPI.\n\n## What This Skill Does\n\
  - Generates clients for TS, Python, Go, Java\n- Builds static docs from the spec\n- Keeps generated\
  \ artifacts in sync\n\n## When to Use\n- Releasing official SDKs\n- Sharing docs with consumers\n- Multi-language\
  \ client support\n\n## Real Commands\n\n```bash\nnpx @openapitools/openapi-generator-cli generate -i\
  \ openapi.yaml -g typescript-fetch -o ./client-ts\nnpx @openapitools/openapi-generator-cli generate\
  \ -i openapi.yaml -g python -o ./client-py\nnpx @redocly/cli build-docs openapi.yaml -o dist/api.html\n\
  ```\n\n## Generation Config\n\n```yaml\ninputSpec: openapi.yaml\ngenerators:\n  typescript-fetch:\n\
  \    output: client-ts\n    additionalProperties:\n      useSingleRequestParameter: true\n```\n\n##\
  \ Testing\n- Compile each generated client\n- Run a smoke call against the live API\n- Diff generated\
  \ output on spec changes\n\n## Best Practices\n- Commit generated clients in SDK repos\n- Regenerate\
  \ on tagged releases only\n- Validate specs before generation\n\n## Capabilities\n\n### client-generation\n\
  Generate typed API clients in multiple languages\n\n**Commands:**\n- `npx @openapitools/openapi-generator-cli\
  \ generate -i openapi.yaml -g typescript-fetch -o ./client-ts`\n- `npx @openapitools/openapi-generator-cli\
  \ generate -i openapi.yaml -g python -o ./client-py`\n- `npx @openapitools/openapi-generator-cli generate\
  \ -i openapi.yaml -g go -o ./client-go`\n- `npx @openapitools/openapi-generator-cli generate -i openapi.yaml\
  \ -g java -o ./client-java`\n- `npx @openapitools/openapi-generator-cli config-help -g typescript-fetch`\n\
  \n**Examples:**\n- -g typescript-fetch produces a fetch-based TS client\n- -g python generates a requests-based\
  \ client\n- config-help documents generator options\n\n### docs-deployment\nBuild and preview reference\
  \ documentation\n\n**Commands:**\n- `npx @redocly/cli build-docs openapi.yaml -o dist/api.html`\n- `npx\
  \ @redocly/cli preview-docs openapi.yaml`\n- `npx @redocly/cli bundle openapi.yaml -o dist/openapi.bundle.yaml`\n\
  - `npx @redocly/cli lint openapi.yaml`\n\n**Examples:**\n- -cli --help\n- -api --help"
prompt: Act as Api Rest Generation and handle the task per the instructions.
