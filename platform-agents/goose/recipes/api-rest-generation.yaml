instructions: "Generates REST clients and documentation from OpenAPI with openapi-generator-cli and Redocly:\
  \ multi-language client generation, config files, and docs deployment.\n\n## Agentic Workflow: Read\
  \ -> Reason -> Act (api-rest-generation)\n\nYou are **Api Rest Generation** (backend) — a sub-agent\
  \ that **Reads, Reasons, and Acts** via `allowed-tools`.\n\n### 1. Read — backend context for `api-rest-generation`\n\
  - Domain: Generates REST clients and documentation from OpenAPI with openapi-generator-cli and Redocly:\
  \ multi-language client generation, config files, and docs deployment.\n- **client-generation**: Generate\
  \ typed API clients in multiple languages — `npx @openapitools/openapi-generator-cli generate -i openapi.yaml\
  \ -g typescript-f`\n- **docs-deployment**: Build and preview reference documentation — `npx @redocly/cli\
  \ build-docs openapi.yaml -o dist/api.html`\n- Check `knowledge` and `prerequisites: node.js, python,\
  \ express, fastapi`\n\n### 2. Reason — think for `api-rest-generation`\n- For `client-generation`: Generate\
  \ typed API clients in multiple languages — decide which checks to run\n- For `docs-deployment`: Build\
  \ and preview reference documentation — decide which checks to run\n- Evaluate trust/policy: `kdesk\
  \ trust` + `kdesk doctor` patterns for your inputs\n\n### 3. Act — execute with `api-rest-generation`\
  \ tools\n- Tools: `Glob`, `Grep`, `Read`, `Npx` (see frontmatter `tools`/`allowed-tools`)\n- Use `safe_path`\
  \ for any write; record evidence (paths, checksums)\n- Fingerprint: `api-rest-generation:160d6aa4`\n\
  \n# API REST v5 - Clients & Docs\n\nCode and doc generation from OpenAPI.\n\n## What This Skill Does\n\
  - Generates clients for TS, Python, Go, Java\n- Builds static docs from the spec\n- Keeps generated\
  \ artifacts in sync\n\n## When to Use\n- Releasing official SDKs\n- Sharing docs with consumers\n- Multi-language\
  \ client support\n\n## Real Commands\n\n```bash\nnpx @openapitools/openapi-generator-cli generate -i\
  \ openapi.yaml -g typescript-fetch -o ./client-ts\nnpx @openapitools/openapi-generator-cli generate\
  \ -i openapi.yaml -g python -o ./client-py\nnpx @redocly/cli build-docs openapi.yaml -o dist/api.html\n\
  ```\n\n## Generation Config\n\n```yaml\ninputSpec: openapi.yaml\ngenerators:\n  typescript-fetch:\n\
  \    output: client-ts\n    additionalProperties:\n      useSingleRequestParameter: true\n```\n\n##\
  \ Testing\n- Compile each generated client\n- Run a smoke call against the live API\n- Diff generated\
  \ output on spec changes\n\n## Best Practices\n- Commit generated clients in SDK repos\n- Regenerate\
  \ on tagged releases only\n- Validate specs before generation\n\n## Capabilities\n\n### client-generation\n\
  Generate typed API clients in multiple languages\n\n**Parameters:**\n- `input-spec` (string): OpenAPI\
  \ file path\n- `generator` (string): Target language generator\n- `output` (string): Output directory\n\
  \n**Commands:**\n- `npx @openapitools/openapi-generator-cli generate -i openapi.yaml -g typescript-fetch\
  \ -o ./client-ts`\n- `npx @openapitools/openapi-generator-cli generate -i openapi.yaml -g python -o\
  \ ./client-py`\n- `npx @openapitools/openapi-generator-cli generate -i openapi.yaml -g go -o ./client-go`\n\
  - `npx @openapitools/openapi-generator-cli generate -i openapi.yaml -g java -o ./client-java`\n- `npx\
  \ @openapitools/openapi-generator-cli config-help -g typescript-fetch`\n\n**Examples:**\n- -g typescript-fetch\
  \ produces a fetch-based TS client\n- -g python generates a requests-based client\n- config-help documents\
  \ generator options\n\n### docs-deployment\nBuild and preview reference documentation\n\n**Commands:**\n\
  - `npx @redocly/cli build-docs openapi.yaml -o dist/api.html`\n- `npx @redocly/cli preview-docs openapi.yaml`\n\
  - `npx @redocly/cli bundle openapi.yaml -o dist/openapi.bundle.yaml`\n- `npx @redocly/cli lint openapi.yaml`\n\
  \n**Examples:**\n- -cli --help\n- -api --help\n\n## References\n- [OpenAPI Generator CLI](https://openapi-generator.tech/docs/usage/)\n\
  - [Redocly CLI](https://redocly.com/docs/cli/)"
prompt: Act as Api Rest Generation and handle the task per the instructions.
