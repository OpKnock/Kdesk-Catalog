title: Api Rest Spring Scaffolding
description: 'Builds REST APIs with Spring Boot: Initializr scaffolding, Spring Web controllers, actuator
  health, and @Valid request validation.'
version: 2.0.0
instructions: "# Api Rest Spring Scaffolding\n\nBuilds REST APIs with Spring Boot: Initializr scaffolding,\
  \ Spring Web controllers, actuator health, and @Valid request validation.\n\n## Instructions\n\n# API\
  \ REST v3 - Spring Boot\n\nREST APIs with Spring Boot.\n\n## What This Skill Does\n- Scaffolds Spring\
  \ Boot projects from Initializr\n- Implements REST controllers with validation\n- Exposes actuator health\
  \ endpoints\n\n## When to Use\n- Java enterprise REST services\n- Teams standardized on Spring\n- Services\
  \ needing rich observability\n\n## Real Commands\n\n```bash\ncurl -s https://start.spring.io/starter.zip\
  \ -d dependencies=web,validation,data-jpa,h2 -d type=maven-project -o demo.zip\nunzip demo.zip -d demo\
  \ && cd demo && ./mvnw spring-boot:run\ncurl -s http://localhost:8080/actuator/health | jq .status\n\
  ```\n\n## Controller Example\n\n```java\n@RestController\n@RequestMapping(\"/api/users\")\npublic class\
  \ UserController {\n    @PostMapping\n    public ResponseEntity<?> create(@Valid @RequestBody User user)\
  \ {\n        return ResponseEntity.created(URI.create(\"/api/users/1\")).body(user);\n    }\n}\n```\n\
  \n## Testing\n- Assert actuator readiness before traffic\n- Test validation failures return 400\n- Use\
  \ @WebMvcTest for controller slices\n\n## Best Practices\n- Use ProblemDetail for error responses\n\
  - Enable actuator security for production\n- Keep DB migrations with Flyway\n\n## Capabilities\n\n###\
  \ spring-scaffolding\nGenerate Spring Boot projects and run them\n\n**Commands:**\n- `curl -s https://start.spring.io/starter.zip\
  \ -d dependencies=web,validation,data-jpa,h2 -d type=maven-project -o demo.zip`\n- `unzip demo.zip -d\
  \ demo && cd demo && ./mvnw spring-boot:run`\n- `curl -s http://localhost:8080/actuator/health | jq\
  \ .status`\n- `curl -s http://localhost:8080/actuator/health/readiness | jq .`\n\n**Examples:**\n- start.spring.io/starter.zip\
  \ downloads a configured project\n- GET /actuator/health reports liveness\n- h2 dependency gives an\
  \ in-memory database\n\n### spring-web\nImplement controllers with validation\n\n**Commands:**\n- `curl\
  \ -s -X POST http://localhost:8080/api/users -H 'Content-Type: application/json' -d '{\"name\":\"alice\"\
  }' -w '\\n%{http_code}\\n'`\n- `curl -s -o /dev/null -w '%{http_code}\\n' -X POST http://localhost:8080/api/users\
  \ -H 'Content-Type: application/json' -d '{}'`\n- `./mvnw clean test`\n\n**Examples:**\n- -cli --help\n\
  - -api --help"
prompt: Act as Api Rest Spring Scaffolding and handle the task per the instructions.
