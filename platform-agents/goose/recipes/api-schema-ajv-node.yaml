title: Api Schema Ajv Node
description: 'Uses JSON Schema in Node.js validation pipelines: ajv with formats, custom keywords, schema
  compilation caching, and request validation middleware.'
version: 2.0.0
instructions: "# Api Schema Ajv Node\n\nUses JSON Schema in Node.js validation pipelines: ajv with formats,\
  \ custom keywords, schema compilation caching, and request validation middleware.\n\n## Instructions\n\
  \n# API Schema v2 - Node Validation\n\nJSON Schema validation in Node.js.\n\n## What This Skill Does\n\
  - Validates payloads with ajv\n- Extends validation with formats and keywords\n- Integrates into request\
  \ middleware\n\n## When to Use\n- Node API request validation\n- Validating external data\n- Shared\
  \ schema modules\n\n## Real Commands\n\n```bash\nnpm install ajv ajv-formats\nnode -e \"const Ajv=require('ajv');\
  \ const addFormats=require('ajv-formats'); const a=new Ajv({allErrors:true}); addFormats(a); const v=a.compile({type:'object',properties:{email:{type:'string',format:'email'}},required:['email']});\
  \ console.log(v({email:'a@b.co'}))\"\n```\n\n## Middleware Pattern\n\n```js\nconst validate = ajv.compile(userSchema);\n\
  app.post('/api/users', (req, res) => {\n  if (!validate(req.body)) return res.status(400).json(validate.errors);\n\
  \  res.status(201).end();\n});\n```\n\n## Testing\n- Test valid and invalid fixtures\n- Verify 400 responses\
  \ carry error details\n- Benchmark compiled validator performance\n\n## Best Practices\n- Compile validators\
  \ once at startup\n- Use additionalProperties:false for strict DTOs\n- Keep schemas versioned and shared\n\
  \n## Capabilities\n\n### ajv-node\nCompile and use ajv validators in Node\n\n**Commands:**\n- `npm install\
  \ ajv ajv-formats`\n- `node -e \"const Ajv=require('ajv'); const addFormats=require('ajv-formats');\
  \ const a=new Ajv({allErrors:true}); addFormats(a); const v=a.compile({type:'object',properties:{email:{type:'string',format:'email'}},required:['email']});\
  \ console.log(v({email:'a@b.co'}), JSON.stringify(v.errors))\"`\n- `node -e \"const Ajv=require('ajv');\
  \ const a=new Ajv(); a.addKeyword({keyword:'even',validate:(s,v)=>v%2===0}); const v=a.compile({type:'integer',even:true});\
  \ console.log(v(2), v(3))\"`\n- `node -e \"const Ajv=require('ajv'); const a=new Ajv(); console.log(a.compile({type:'object'}).schema)\"\
  `\n\n**Examples:**\n- new Ajv({allErrors:true}) reports all violations\n- addKeyword defines custom\
  \ validation keywords\n- compile once, reuse for request validation\n\n### request-validation\nValidate\
  \ request bodies in middleware\n\n**Commands:**\n- `node -e \"const Ajv=require('ajv'); const v=new\
  \ Ajv().compile({type:'object',additionalProperties:false}); console.log(v({}), v({extra:1}))\"`\n-\
  \ `curl -s -X POST http://localhost:3000/api/users -H 'Content-Type: application/json' -d '{\"email\"\
  :\"bad\"}' -o /dev/null -w '%{http_code}\\n'`\n- `curl -s -X POST http://localhost:3000/api/users -H\
  \ 'Content-Type: application/json' -d '{\"email\":\"ok@x.co\"}' -o /dev/null -w '%{http_code}\\n'`\n\
  \n**Examples:**\n- -cli --help\n- -api --help"
