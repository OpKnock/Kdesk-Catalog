title: Api Schema Asyncapi Cli
description: 'Authors event API schemas with AsyncAPI and Apache Avro: AsyncAPI document validation and
  generation, Avro schema tooling, and Kafka payload contracts.'
version: 2.0.0
instructions: "# Api Schema Asyncapi Cli\n\nAuthors event API schemas with AsyncAPI and Apache Avro: AsyncAPI\
  \ document validation and generation, Avro schema tooling, and Kafka payload contracts.\n\n## Instructions\n\
  \n# API Schema v4 - AsyncAPI/Avro\n\nEvent schema authoring.\n\n## What This Skill Does\n- Documents\
  \ event-driven APIs with AsyncAPI\n- Compiles Avro schemas for Kafka\n- Generates docs and stubs\n\n\
  ## When to Use\n- Kafka/Kinesis event contracts\n- Event-driven microservices\n- Schema registry management\n\
  \n## Real Commands\n\n```bash\nnpm install -g @asyncapi/cli\nasyncapi validate asyncapi.yaml\nasyncapi\
  \ generate fromTemplate asyncapi.yaml @asyncapi/html-template -o docs\njava -jar avro-tools-1.11.3.jar\
  \ compile schema user.avsc .\n```\n\n## Avro Schema\n\n```json\n{\n  \"type\": \"record\",\n  \"name\"\
  : \"User\",\n  \"fields\": [\n    { \"name\": \"id\", \"type\": \"long\" },\n    { \"name\": \"email\"\
  , \"type\": \"string\" }\n  ]\n}\n```\n\n## Testing\n- Validate documents in CI\n- Round-trip JSON to\
  \ Avro and back\n- Check schema registry compatibility\n\n## Best Practices\n- Version event schemas\
  \ with a registry\n- Use forward/backward compatible fields\n- Keep AsyncAPI docs in sync with topics\n\
  \n## Capabilities\n\n### asyncapi-cli\nValidate and generate AsyncAPI documents\n\n**Commands:**\n-\
  \ `npm install -g @asyncapi/cli`\n- `asyncapi validate asyncapi.yaml`\n- `asyncapi new --example=tutorial`\n\
  - `asyncapi generate fromTemplate asyncapi.yaml @asyncapi/html-template -o docs`\n- `asyncapi bundle\
  \ asyncapi.yaml -o bundled.yaml`\n\n**Examples:**\n- asyncapi validate checks document structure\n-\
  \ asyncapi new scaffolds an example\n- generate fromTemplate builds HTML docs\n\n### avro-tools\nCompile\
  \ and inspect Avro schemas\n\n**Commands:**\n- `java -jar avro-tools-1.11.3.jar compile schema user.avsc\
  \ .`\n- `java -jar avro-tools-1.11.3.jar getmeta user.avsc`\n- `java -jar avro-tools-1.11.3.jar tojson\
  \ users.avro`\n- `java -jar avro-tools-1.11.3.jar fromjson --schema-file user.avsc users.json > users.avro`"
prompt: Act as Api Schema Asyncapi Cli and handle the task per the instructions.
