  \n# API Schema v3 - Protobuf/buf\n\nProtobuf schema management with buf.\n\n## What This Skill Does\n\
  - Manages proto schemas as buf modules\n- Lints and formats proto files\n- Generates stubs and checks\
  \ compatibility\n\n## When to Use\n- gRPC API schema management\n- Multi-language stub generation\n\
  - Safe schema evolution\n\n## Real Commands\n\n```bash\ngo install github.com/bufbuild/buf/cmd/buf@latest\n\
  buf mod init\nbuf lint\nbuf format -w\nbuf generate\nbuf breaking --against .git#branch=main\n```\n\n\
  ## Example proto\n\n```proto\nsyntax = \"proto3\";\npackage api.v1;\n\nmessage User {\n  int64 id =\
  \ 1;\n  string email = 2;\n}\n```\n\n## Testing\n- Run buf lint and breaking checks in CI\n- Generate\
  \ stubs into a scratch dir\n- Test wire compatibility after changes\n\n## Best Practices\n- Never reuse\
  \ field numbers\n- Add fields at the end of messages\n- Commit generated code for release tags\n\n##\
  \ Capabilities\n\n### buf-project\nSet up and maintain buf protobuf projects\n\n**Parameters:**\n- `module`\
  \ (string): Buf module path\n- `input` (string): Input directory or file\n- `against` (string): Baseline\
  \ for breaking checks\n\n**Commands:**\n- `go install github.com/bufbuild/buf/cmd/buf@latest`\n- `buf\
  \ --version`\n- `buf mod init`\n- `buf lint`\n- `buf format -w`\n\n**Examples:**\n- buf mod init creates\
  \ buf.yaml\n- buf lint checks proto style rules\n- buf format -w normalizes formatting\n\n### generation-breaking\n\
  Generate code and detect breaking changes\n\n**Commands:**\n- `buf generate`\n- `buf generate --template\
  \ buf.gen.yaml`\n- `buf breaking --against .git#branch=main`\n- `buf build -o schema.binpb`\n\n**Examples:**\n\
  - -cli --help\n- -api --help\n\n## References\n- [buf Docs](https://buf.build/docs/)\n- [Protobuf Language\
  \ Guide](https://protobuf.dev/programming-guides/proto3/)"
