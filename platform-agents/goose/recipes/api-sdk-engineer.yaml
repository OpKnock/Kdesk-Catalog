title: api-sdk-engineer
description: 'Generates API SDKs with openapi-generator-cli: language selection, config files, additional
  properties, and batch generation for multi-language SDK publishing.'
version: 2.0.0
instructions: "# api-sdk-engineer\n\nGenerates API SDKs with openapi-generator-cli: language selection,\
  \ config files, additional properties, and batch generation for multi-language SDK publishing.\n\n##\
  \ Instructions\n\n# API SDK Engineer\n\nSDK generation from OpenAPI.\n\n## What This Skill Does\n- Generates\
  \ idiomatic SDKs per language\n- Customizes output with templates\n- Publishes multi-language SDK artifacts\n\
  \n## When to Use\n- Shipping official SDKs\n- Keeping clients in sync with the API\n- Multi-language\
  \ support\n\n## Real Commands\n\n```bash\nnpx @openapitools/openapi-generator-cli generate -i openapi.yaml\
  \ -g typescript-axios -o sdk-ts\nnpx @openapitools/openapi-generator-cli generate -i openapi.yaml -g\
  \ python -o sdk-py\nnpx @openapitools/openapi-generator-cli batch openapi-generator-config.yaml\n```\n\
  \n## Batch Config\n\n```yaml\ninputSpec: openapi.yaml\noutputDir: sdks/\ngenerators:\n  typescript-axios:\n\
  \    output: sdk-ts\n  python:\n    output: sdk-py\n```\n\n## Testing\n- Compile generated SDKs\n- Run\
  \ smoke tests against a mock server\n- Compare output across generator versions\n\n## Best Practices\n\
  - Pin generator versions\n- Commit generated SDKs per release\n- Validate specs before generation\n\n\
  ## Capabilities\n\n### sdk-generation\nGenerate SDKs from OpenAPI specs\n\n**Commands:**\n- `npx @openapitools/openapi-generator-cli\
  \ generate -i openapi.yaml -g typescript-axios -o sdk-ts`\n- `npx @openapitools/openapi-generator-cli\
  \ generate -i openapi.yaml -g python -o sdk-py`\n- `npx @openapitools/openapi-generator-cli generate\
  \ -i openapi.yaml -g go -o sdk-go`\n- `npx @openapitools/openapi-generator-cli generate -i openapi.yaml\
  \ -g java -o sdk-java --additional-properties=library=okhttp-gson`\n- `npx @openapitools/openapi-generator-cli\
  \ batch openapi-generator-config.yaml`\n\n**Examples:**\n- -g typescript-axios generates a TS axios\
  \ SDK\n- --additional-properties tunes generated code\n- batch generates multiple languages at once\n\
  \n### template-customization\nCustomize generated SDK templates\n\n**Commands:**\n- `npx @openapitools/openapi-generator-cli\
  \ config-help -g typescript-axios`\n- `npx @openapitools/openapi-generator-cli generate -i openapi.yaml\
  \ -g typescript-axios -t ./custom-templates -o sdk-ts`\n- `npx @openapitools/openapi-generator-cli validate\
  \ -i openapi.yaml`"
prompt: Act as api-sdk-engineer and handle the task per the instructions.
