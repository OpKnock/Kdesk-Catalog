title: api-sdk-specialist
description: 'Applies SDK design patterns: configuration objects, typed errors, retry policies, pagination
  helpers, and package metadata quality with publint.'
version: 2.0.0
instructions: "# api-sdk-specialist\n\nApplies SDK design patterns: configuration objects, typed errors,\
  \ retry policies, pagination helpers, and package metadata quality with publint.\n\n## Instructions\n\
  \n# API SDK Specialist\n\nSDK design patterns and quality.\n\n## What This Skill Does\n- Designs SDK\
  \ config and error surfaces\n- Implements retries and pagination helpers\n- Ensures package quality\
  \ with publint\n\n## When to Use\n- SDK refactoring for consistency\n- Adding retry behavior\n- Preparing\
  \ SDK releases\n\n## Real Commands\n\n```bash\nnpm install openapi-fetch\nnode -e \"const api=require('openapi-fetch').createClient({baseUrl:'https://api.example.com',headers:{'X-API-Key':process.env.API_KEY}});\
  \ console.log(typeof api.GET)\"\nnpx publint\n```\n\n## SDK Pattern\n\n```ts\nconst client = createClient<paths>({\n\
  \  baseUrl: process.env.API_URL,\n  headers: { 'X-API-Key': process.env.API_KEY },\n  fetch: withRetry(fetch,\
  \ { retries: 3 })\n});\n```\n\n## Testing\n- Test retry behavior with failing mocks\n- Validate package\
  \ exports with publint\n- Check types compile for consumers\n\n## Best Practices\n- Expose typed errors,\
  \ not strings\n- Keep config objects minimal\n- Follow semantic versioning for breaking changes\n\n\
  ## Capabilities\n\n### sdk-design\nDesign consistent SDK configuration and error surfaces\n\n**Commands:**\n\
  - `npm install openapi-fetch`\n- `node -e \"const api=require('openapi-fetch').createClient({baseUrl:'http://localhost:8080',headers:{'X-API-Key':process.env.API_KEY}});\
  \ console.log(typeof api.GET)\"`\n- `node -e \"const api=require('openapi-fetch').createClient({baseUrl:'http://localhost:8080'});\
  \ api.GET('/users',{params:{query:{page:1}}}).then(r=>console.log(r.data ?? r.error))\"`\n- `npx publint`\n\
  \n**Examples:**\n- createClient sets baseUrl and headers once\n- GET returns { data, error } for type-safe\
  \ handling\n- publint validates package.json metadata\n\n### retry-policies\nImplement retry and backoff\
  \ for transient failures\n\n**Commands:**\n- `npm install p-retry`\n- `node -e \"const pRetry=require('p-retry');\
  \ const fn=async()=>{const r=await fetch('http://localhost:8080/users'); if(!r.ok) throw new Error('fail');\
  \ return r.json()}; pRetry(fn,{retries:3,factor:2}).then(console.log).catch(console.error)\"`\n- `node\
  \ -e \"const r=require('retry'); console.log(r.operation({retries:3,factor:2}).attempt)\"`\n\n**Examples:**\n\
  - -cli --help\n- -api --help"
prompt: Act as api-sdk-specialist and handle the task per the instructions.
