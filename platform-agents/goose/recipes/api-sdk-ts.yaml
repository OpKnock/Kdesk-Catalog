title: Api Sdk Ts
description: 'Builds TypeScript SDKs: tsup bundling with ESM/CJS and d.ts, tsc type checking, typedoc
  API docs, and npm publishing flow.'
version: 2.0.0
instructions: "# Api Sdk Ts\n\nBuilds TypeScript SDKs: tsup bundling with ESM/CJS and d.ts, tsc type checking,\
  \ typedoc API docs, and npm publishing flow.\n\n## Instructions\n\n# API SDK v2 - TypeScript\n\nTypeScript\
  \ SDK building.\n\n## What This Skill Does\n- Bundles ESM/CJS with d.ts output\n- Type-checks and generates\
  \ docs\n- Publishes clean npm packages\n\n## When to Use\n- Building TS SDKs for distribution\n- Maintaining\
  \ type-safe clients\n- Publishing to npm\n\n## Real Commands\n\n```bash\nnpm install -D tsup typescript\
  \ typedoc\nnpx tsup src/index.ts --format cjs,esm --dts\nnpx tsc --noEmit\nnpx typedoc src/index.ts\
  \ --out docs\n```\n\n## tsup Config\n\n```ts\nimport { defineConfig } from 'tsup';\nexport default defineConfig({\n\
  \  entry: ['src/index.ts'],\n  format: ['cjs', 'esm'],\n  dts: true,\n  clean: true,\n  sourcemap: true\n\
  });\n```\n\n## Testing\n- Run tsc --noEmit before release\n- Verify dual-format require/import both\
  \ work\n- Check npm pack contents\n\n## Best Practices\n- Export types from index\n- Set files in package.json\n\
  - Add exports map for ESM/CJS resolution\n\n## Capabilities\n\n### ts-build\nBundle a TypeScript SDK\
  \ with tsup\n\n**Commands:**\n- `npm install -D tsup typescript typedoc`\n- `npx tsup src/index.ts --format\
  \ cjs,esm --dts`\n- `npx tsc --noEmit`\n- `npx tsup src/index.ts --format cjs,esm --dts --clean`\n-\
  \ `npm run build`\n\n**Examples:**\n- tsup --format cjs,esm emits dual-format bundles\n- --dts generates\
  \ type declarations\n- tsc --noEmit type-checks the source\n\n### ts-docs\nGenerate API documentation\
  \ with typedoc\n\n**Commands:**\n- `npx typedoc src/index.ts --out docs`\n- `npx typedoc --entryPointStrategy\
  \ expand src --out docs`\n- `npm pack --dry-run`\n- `npm publish`\n\n**Examples:**\n- -cli --help\n\
  - -api --help"
prompt: Act as Api Sdk Ts and handle the task per the instructions.
