title: Api Test Data Factorybot
description: 'Builds test data factories with FactoryBot: trait definitions, sequences, associations,
  and on-the-fly attribute overrides for Rails APIs.'
version: 2.0.0
instructions: "# Api Test Data Factorybot\n\nBuilds test data factories with FactoryBot: trait definitions,\
  \ sequences, associations, and on-the-fly attribute overrides for Rails APIs.\n\n## Instructions\n\n\
  # API Test Data v3 - Factories\n\nTest data factories with FactoryBot.\n\n## What This Skill Does\n\
  - Defines reusable model factories\n- Composes fixtures with traits\n- Seeds large datasets for tests\n\
  \n## When to Use\n- Rails API test suites\n- Replacing brittle hardcoded fixtures\n- Building association\
  \ graphs\n\n## Real Commands\n\n```bash\nbundle add factory_bot_rails\nbundle exec rails runner \"FactoryBot.create_list(:user,\
  \ 50)\"\nbundle exec rails runner \"FactoryBot.lint\"\n```\n\n## Factory Example\n\n```ruby\nfactory\
  \ :user do\n  sequence(:email) { |n| \"user#{n}@example.com\" }\n  name { Faker::Name.name }\n  role\
  \ { :member }\n\n  trait :admin do\n    role { :admin }\n  end\nend\n```\n\n## Testing\n- Run FactoryBot.lint\
  \ to validate factories\n- Test every trait with a build call\n- Verify associations resolve\n\n\n##\
  \ Best Practices\n- Use sequences for uniqueness\n- Override attributes explicitly in tests\n- Avoid\
  \ factory hierarchies deeper than needed\n\n## Capabilities\n\n### factorybot\nDefine and use model\
  \ factories\n\n**Commands:**\n- `bundle add factory_bot_rails`\n- `bundle exec rails generate model\
  \ User name:string email:string role:string`\n- `bundle exec rails runner \"puts FactoryBot.create(:user).id\"\
  `\n- `bundle exec rails runner \"FactoryBot.create_list(:user, 50)\"`\n- `bundle exec rails runner \"\
  puts FactoryBot.create(:user, :admin, name: 'root').role\"`\n\n**Examples:**\n- FactoryBot.create(:user)\
  \ builds and saves a record\n- create_list(:user, 50) seeds bulk data\n- traits like :admin plus overrides\
  \ compose fixtures\n\n### factory-testing\nLint and verify factories\n\n**Commands:**\n- `bundle exec\
  \ rails runner \"FactoryBot.lint\"`\n- `bundle exec rspec spec/factories_spec.rb`\n- `bundle exec rails\
  \ db:seed`\n- `bundle exec rails runner \"puts FactoryBot.build(:user).email\"`"
prompt: Act as Api Test Data Factorybot and handle the task per the instructions.
