title: api-version-engineer
description: 'Implements API versioning in Express: URL path versioning, version routing, versioned controllers,
  and default version behavior.'
version: 2.0.0
instructions: "# api-version-engineer\n\nImplements API versioning in Express: URL path versioning, version\
  \ routing, versioned controllers, and default version behavior.\n\n## Instructions\n\n# API Version\
  \ Engineer\n\nURL-based API versioning.\n\n## What This Skill Does\n- Mounts versioned routers at /v1,\
  \ /v2 paths\n- Keeps versions in isolated modules\n- Controls default version behavior\n\n## When to\
  \ Use\n- Public APIs with external consumers\n- Adding breaking changes safely\n- Supporting multiple\
  \ client cohorts\n\n## Real Commands\n\n```bash\nnode -e \"const express=require('express'); const app=express();\
  \ app.use('/v1', require('./v1Routes')); app.use('/v2', require('./v2Routes')); app.listen(3000)\"\n\
  curl -s http://localhost:3000/v1/users | jq '.apiVersion'\ncurl -s http://localhost:3000/v2/users |\
  \ jq '.apiVersion'\n```\n\n## Structure\n\n```\nroutes/\n  v1/users.js\n  v2/users.js\n```\n\n## Testing\n\
  - Test each version independently\n- Verify default version behavior\n- Assert unknown versions 404\
  \ cleanly\n\n## Best Practices\n- Keep version routers thin\n- Share only stable middleware\n- Document\
  \ sunset dates per version\n\n## Capabilities\n\n### url-versioning\nRoute requests by versioned URL\
  \ paths\n\n**Commands:**\n- `node -e \"const express=require('express'); const app=express(); app.use('/v1',\
  \ require('./v1Routes')); app.use('/v2', require('./v2Routes')); app.listen(3000)\"`\n- `curl -s http://localhost:3000/v1/users\
  \ | jq '.apiVersion'`\n- `curl -s http://localhost:3000/v2/users | jq '.apiVersion'`\n- `curl -s http://localhost:3000/users\
  \ -o /dev/null -w '%{http_code}\\n'`\n\n**Examples:**\n- app.use('/v1', v1Routes) mounts versioned routers\n\
  - curl /v2/users hits the current version\n- Unversioned paths can 404 or default\n\n### version-router\n\
  Structure versioned routers and shared middleware\n\n**Commands:**\n- `node -e \"const fs=require('fs');\
  \ console.log(fs.existsSync('routes/v2/users.js'))\"`\n- `curl -s -o /dev/null -w '%{http_code}\\n'\
  \ http://localhost:3000/v9/users`\n- `curl -s http://localhost:3000/v1/users | jq '.count'`\n\n**Examples:**\n\
  - -cli --help\n- -api --help"
prompt: Act as api-version-engineer and handle the task per the instructions.
