title: api-webhook-engineer
description: 'Implements webhook delivery in Node.js: receiver endpoints, retry with backoff, delivery
  logging, and idempotent handling of events.'
version: 2.0.0
instructions: "# api-webhook-engineer\n\nImplements webhook delivery in Node.js: receiver endpoints, retry\
  \ with backoff, delivery logging, and idempotent handling of events.\n\n## Instructions\n\n# API Webhook\
  \ Engineer\n\nWebhook delivery implementation.\n\n## What This Skill Does\n- Receives and processes\
  \ webhook events\n- Implements retries with exponential backoff\n- Logs deliveries for debugging\n\n\
  ## When to Use\n- Building webhook receivers\n- Adding reliable event delivery\n- Handling third-party\
  \ webhooks\n\n## Real Commands\n\n```bash\nnpm install express\nnode server.js\ncurl -s -X POST http://localhost:3000/webhooks\
  \ -H 'Content-Type: application/json' -d '{\"event\":\"order.created\",\"data\":{\"id\":1}}' -w '\\\
  n%{http_code}\\n'\n```\n\n## Receiver Pattern\n\n```js\napp.post('/webhooks', async (req, res) => {\n\
  \  const key = req.body.id || hash(req.body);\n  if (await processed(key)) return res.sendStatus(200);\n\
  \  await processEvent(req.body);\n  res.sendStatus(200);\n});\n```\n\n## Testing\n- Replay events and\
  \ verify idempotency\n- Simulate handler failure and check retries\n- Verify logs capture delivery attempts\n\
  \n\n## Best Practices\n- Respond 200 fast, process asynchronously\n- Use idempotency keys for every\
  \ event\n- Log delivery metadata with event IDs\n\n## Capabilities\n\n### webhook-receiver\nBuild a\
  \ webhook receiver endpoint\n\n**Commands:**\n- `npm install express`\n- `node server.js`\n- `curl -s\
  \ -X POST http://localhost:3000/webhooks -H 'Content-Type: application/json' -d '{\"event\":\"order.created\"\
  ,\"data\":{\"id\":1}}' -w '\\n%{http_code}\\n'`\n- `curl -s -X POST http://localhost:3000/webhooks -H\
  \ 'Content-Type: application/json' -d '{\"event\":\"order.created\",\"data\":{\"id\":1}}' -w '\\n%{http_code}\\\
  n'`\n- `curl -s http://localhost:3000/webhooks/log | jq 'length'`\n\n**Examples:**\n- POST /webhooks\
  \ receives events\n- Replaying the same event is idempotent\n- Delivery logs record every attempt\n\n\
  ### retry-policy\nRetry failed deliveries with backoff\n\n**Commands:**\n- `npm install p-retry`\n-\
  \ `node -e \"const pRetry=require('p-retry'); const send=()=>Promise.reject(new Error('down')); pRetry(send,{retries:3,factor:2}).catch(e=>console.log('gave\
  \ up:',e.message))\"`\n- `node -e \"const r=require('retry'); const o=r.operation({retries:4,factor:2,minTimeout:1000});\
  \ o.attempt(n=>console.log('attempt',n))\"`\n\n**Examples:**\n- -cli --help\n- -api --help"
prompt: Act as api-webhook-engineer and handle the task per the instructions.
