title: api-webhook-specialist
description: 'Secures webhooks with HMAC signatures: signing payloads with openssl and node crypto, signature
  verification middleware, and replay protection.'
version: 2.0.0
instructions: "# api-webhook-specialist\n\nSecures webhooks with HMAC signatures: signing payloads with\
  \ openssl and node crypto, signature verification middleware, and replay protection.\n\n## Instructions\n\
  \n# API Webhook Specialist\n\nWebhook signature security.\n\n## What This Skill Does\n- Signs payloads\
  \ with HMAC-SHA256\n- Verifies signatures in middleware\n- Protects against replay and forgery\n\n##\
  \ When to Use\n- Receiving third-party webhooks\n- Emitting signed webhooks\n- Auditing delivery authenticity\n\
  \n## Real Commands\n\n```bash\nopenssl dgst -sha256 -hmac \"secret-key\" -hex payload.json\nnode -e\
  \ \"const c=require('crypto'); console.log(c.createHmac('sha256','secret-key').update('payload').digest('hex'))\"\
  \n```\n\n## Verification Middleware\n\n```js\napp.post('/webhooks', (req, res) => {\n  const sig = req.get('X-Signature').replace('sha256=',\
  \ '');\n  const expected = crypto.createHmac('sha256', SECRET)\n    .update(JSON.stringify(req.body)).digest('hex');\n\
  \  if (!crypto.timingSafeEqual(Buffer.from(sig), Buffer.from(expected))) {\n    return res.sendStatus(401);\n\
  \  }\n  res.sendStatus(200);\n});\n```\n\n## Testing\n- Send bad signatures and expect 401\n- Verify\
  \ timestamped replay rejection\n- Test header/body integrity\n\n\n## Best Practices\n- Rotate webhook\
  \ secrets regularly\n- Use timingSafeEqual for comparisons\n- Include timestamps to block replays\n\n\
  ## Capabilities\n\n### hmac-signing\nSign and verify webhook payloads\n\n**Commands:**\n- `openssl dgst\
  \ -sha256 -hmac \"secret-key\" -hex payload.json`\n- `node -e \"const c=require('crypto'); const sig=c.createHmac('sha256','secret-key').update(JSON.stringify({event:'x'})).digest('hex');\
  \ console.log(sig)\"`\n- `node -e \"const c=require('crypto'); const sig=(s)=>c.createHmac('sha256','secret-key').update(s).digest('hex');\
  \ const payload=JSON.stringify({a:1}); console.log('X-Signature:', sig(payload))\"`\n- `curl -s -X POST\
  \ http://localhost:3000/webhooks -H 'Content-Type: application/json' -H \"X-Signature: sha256=$(openssl\
  \ dgst -sha256 -hmac 'secret-key' -hex payload.json | awk '{print $2}')\" -d @payload.json -w '\\n%{http_code}\\\
  n'`\n\n**Examples:**\n- openssl dgst -hmac signs with a shared secret\n- node crypto verifies signatures\
  \ in middleware\n- curl sends the signature header for testing\n\n### verification\nVerify signatures\
  \ in middleware\n\n**Commands:**\n- `node -e \"const c=require('crypto'); const ok=(sig,p)=>{const expect=c.createHmac('sha256','secret-key').update(p).digest('hex');\
  \ return c.timingSafeEqual(Buffer.from(sig),Buffer.from(expect))}; console.log(ok('abc','x'), ok(c.createHmac('sha256','secret-key').update('x').digest('hex'),'x'))\"\
  `\n- `curl -s -X POST http://localhost:3000/webhooks -H 'Content-Type: application/json' -H 'X-Signature:\
  \ sha256=bad' -d '{\"a\":1}' -o /dev/null -w '%{http_code}\\n'`\n\n**Examples:**\n- -cli --help\n- -api\
  \ --help"
prompt: Act as api-webhook-specialist and handle the task per the instructions.
