title: Artillery Mode
description: 'Load-tests APIs and WebSockets with Artillery v2: quick-mode runs, YAML scenarios, phases,
  assertions, and HTML reports.'
version: 2.0.0
instructions: "# Artillery Mode\n\nLoad-tests APIs and WebSockets with Artillery v2: quick-mode runs,\
  \ YAML scenarios, phases, assertions, and HTML reports.\n\n## Instructions\n\n# Artillery v2\n\n## What\
  \ this skill does\n\nLoad-tests APIs with Artillery: instant quick runs for smoke tests, YAML scenarios\
  \ for realistic flows, phased load ramping, response assertions, and HTML report generation.\n\n## When\
  \ to use\n\n- Verifying an endpoint's capacity before launch\n- Catching latency regressions under load\n\
  - Reproducing a production spike pattern locally\n\n## Real commands\n\n```bash\n# Quick smoke test:\
  \ 60s at 20 RPS\nnpx artillery quick -d 60 -r 20 http://localhost:3000/api/users\n\n# POST with body\n\
  npx artillery quick -d 30 -r 10 -m POST -b '{\"name\":\"test\"}' -H \"Content-Type: application/json\"\
  \ http://localhost:3000/api/users\n\n# Scenario test\nnpx artillery run load-test.yml\n\n# Save + render\
  \ report\nnpx artillery run --output report.json load-test.yml\nnpx artillery report report.json\n```\n\
  \n## Scenario config\n\n```yaml\nconfig:\n  target: http://localhost:3000\n  phases:\n    - duration:\
  \ 60\n      arrivalRate: 10\n      rampTo: 50\n    - duration: 120\n      arrivalRate: 50\nscenarios:\n\
  \  - name: fetch users\n    flow:\n      - get:\n          url: /api/users\n          expect:\n    \
  \        statusCode: 200\n```\n\n## Testing\n\n- Compare p99 latency against an SLO, not just the average\n\
  - Run 2-3 minutes of steady load before judging capacity\n\n## Best practices\n\n- Start with quick\
  \ smoke tests, then formalize scenarios\n- Assert statusCode and JSON bodies to fail on wrong responses\n\
  - Save raw JSON results as CI artifacts\n\n## Capabilities\n\n### quick-mode\nRun instant load tests\
  \ without config files.\n\n**Commands:**\n- `npx artillery quick -d 60 -r 20 http://localhost:3000/api/users`\n\
  - `npx artillery quick -d 30 -r 10 -m POST -b '{\"name\":\"test\"}' http://localhost:3000/api/users`\n\
  - `npx artillery quick --insecure https://staging.your-app.test/api`\n- `npx artillery quick -d 60 -r\
  \ 50 http://localhost:3000 -H \"Authorization: Bearer $TOKEN\"`\n\n**Examples:**\n- npx artillery quick\
  \ -d 60 -r 20 http://localhost:3000/api/users\n- npx artillery quick -d 30 -r 10 -m POST -b '{\"name\"\
  :\"test\"}' -H \"Content-Type: application/json\" http://localhost:3000/api/users\n- npx artillery quick\
  \ -d 120 -r 100 --output report.json http://localhost:3000\n\n### scenario-tests\nWrite multi-step YAML\
  \ scenarios with phases, hooks, and assertions.\n\n**Commands:**\n- `npx artillery run load-test.yml`\n\
  - `npx artillery run --output report.json load-test.yml`\n- `npx artillery report report.json`\n- `npx\
  \ artillery run -e staging load-test.yml`\n- `npx artillery run --config base.yml --test-scenarios load-test.yml`\n\
  \n**Examples:**\n- npx artillery run --output results.json load.yml && npx artillery report results.json\n\
  - npx artillery run -e production --quiet load.yml\n- npx artillery run --snippet-mode load.yml"
prompt: Act as Artillery Mode and handle the task per the instructions.
