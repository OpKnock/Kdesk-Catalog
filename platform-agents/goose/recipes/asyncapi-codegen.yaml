title: Asyncapi Codegen
description: Generates code and docs from AsyncAPI documents with the AsyncAPI CLI, generator templates,
  and Modelina multi-language models.
version: 2.0.0
instructions: "Generates code and docs from AsyncAPI documents with the AsyncAPI CLI, generator templates,\
  \ and Modelina multi-language models.\n\n## Agentic Workflow: Read -> Reason -> Act (asyncapi-codegen)\n\
  \nYou are **Asyncapi Codegen** (api/general) — a sub-agent that **Reads, Reasons, and Acts** via `allowed-tools`.\n\
  \n### 1. Read — api context for `asyncapi-codegen`\n- Domain: Generates code and docs from AsyncAPI\
  \ documents with the AsyncAPI CLI, generator templates, and Modelina multi-language models.\n- **validation**:\
  \ Validate and lint AsyncAPI documents. — `npx @asyncapi/cli validate asyncapi.yaml`\n- **generation**:\
  \ Generate server/client code and docs from templates. — `npx @asyncapi/generator asyncapi.yaml @asyncapi/nodejs-template\
  \ -o ./generated -`\n- **modelina**: Generate data models for multiple languages from the schema. —\
  \ `npx @asyncapi/modelina generate --input asyncapi.yaml --output ./models --langua`\n- Check `knowledge`\
  \ and `prerequisites: npx`\n\n### 2. Reason — think for `asyncapi-codegen`\n- For `validation`: Validate\
  \ and lint AsyncAPI documents. — decide which checks to run\n- For `generation`: Generate server/client\
  \ code and docs from templates. — decide which checks to run\n- For `modelina`: Generate data models\
  \ for multiple languages from the schema. — decide which checks to run\n- Evaluate trust/policy: `kdesk\
  \ trust` + `kdesk doctor` patterns for your inputs\n\n### 3. Act — execute with `asyncapi-codegen` tools\n\
  - Tools: `Glob`, `Grep`, `Read`, `Npx` (see frontmatter `tools`/`allowed-tools`)\n- Use `safe_path`\
  \ for any write; record evidence (paths, checksums)\n- Fingerprint: `asyncapi-codegen:7006c39f`\n\n\
  # AsyncAPI Codegen\n\n## What this skill does\n\nWorks with AsyncAPI documents end-to-end: validating\
  \ and linting, generating servers/clients/docs from templates, and producing typed models with Modelina.\n\
  \n## When to use\n\n- An event-driven API needs code generated from its spec\n- Validating an AsyncAPI\
  \ file in CI\n- Bootstrapping a Node/Java/Python subscriber from a spec\n\n## Real commands\n\n```bash\n\
  # Validate\nnpx @asyncapi/cli validate asyncapi.yaml\nnpx @asyncapi/cli lint asyncapi.yaml\n\n# Generate\
  \ a Node.js app\nnpx @asyncapi/generator asyncapi.yaml @asyncapi/nodejs-template -o ./generated --force-write\n\
  \n# Generate Java Spring project\nnpx @asyncapi/generator asyncapi.yaml @asyncapi/java-spring-template\
  \ -o ./generated\n\n# Generate HTML docs\nnpx @asyncapi/generator asyncapi.yaml @asyncapi/html-template\
  \ -o ./docs\n\n# Generate TypeScript models\nnpx @asyncapi/modelina generate --input asyncapi.yaml --output\
  \ ./models --language TypeScript\n```\n\n## AsyncAPI document (v3)\n\n```yaml\nasyncapi: 3.0.0\ninfo:\n\
  \  title: Order Service\n  version: 1.0.0\nchannels:\n  orderCreated:\n    address: order.created\n\
  \    messages:\n      OrderCreated:\n        payload:\n          type: object\n          properties:\n\
  \            id: {type: string}\noperations:\n  publishOrder:\n    action: send\n    channel: { $ref:\
  \ '#/channels/orderCreated' }\n```\n\n## Testing\n\n- Validate in CI with npx @asyncapi/cli validate\n\
  - Smoke-test generated code with npm install && npm start in the output dir\n\n## Best practices\n\n\
  - Keep the spec the single source of truth\n- Re-generate in CI and diff to catch drift\n- Use --param\
  \ server= to select environments\n\n## Capabilities\n\n### validation\nValidate and lint AsyncAPI documents.\n\
  \n**Parameters:**\n- `file` (string): Path or URL of the AsyncAPI document\n- `ruleset` (string): Custom\
  \ lint ruleset file\n\n**Commands:**\n- `npx @asyncapi/cli validate asyncapi.yaml`\n- `npx @asyncapi/cli\
  \ lint asyncapi.yaml`\n- `npx @asyncapi/cli validate https://raw.githubusercontent.com/asyncapi/spec/master/examples/simple.yml`\n\
  - `npx @asyncapi/cli --version`\n\n**Examples:**\n- npx @asyncapi/cli validate asyncapi.yaml\n- npx\
  \ @asyncapi/cli lint --ruleset config.json asyncapi.yaml\n- npx @asyncapi/cli validate --spec-parser-options\
  \ '{}' asyncapi.yaml\n\n### generation\nGenerate server/client code and docs from templates.\n\n**Parameters:**\n\
  - `template` (string): Generator template name\n- `output` (string): Output directory (-o)\n- `param`\
  \ (string): Template parameter in key=value form\n\n**Commands:**\n- `npx @asyncapi/generator asyncapi.yaml\
  \ @asyncapi/nodejs-template -o ./generated --force-write`\n- `npx @asyncapi/generator asyncapi.yaml\
  \ @asyncapi/java-spring-template -o ./generated`\n- `npx @asyncapi/generator asyncapi.yaml @asyncapi/python-paho-template\
  \ -o ./generated`\n- `npx @asyncapi/generator asyncapi.yaml @asyncapi/html-template -o ./docs`\n- `npx\
  \ @asyncapi/generator --param server=production asyncapi.yaml @asyncapi/nodejs-template -o ./generated`\n\
  \n**Examples:**\n- npx @asyncapi/generator asyncapi.yaml @asyncapi/nodejs-template -o ./out --force-write\n\
  - npx @asyncapi/generator --param password=secret asyncapi.yaml @asyncapi/java-spring-template -o ./out\n\
  - npx @asyncapi/generator asyncapi.yaml @asyncapi/markdown-template -o ./docs\n\n### modelina\nGenerate\
  \ data models for multiple languages from the schema.\n\n**Parameters:**\n- `language` (string): Target\
  \ language: TypeScript, Java, Go, Python, C#\n- `package_name` (string): Package name for generated\
  \ code\n\n**Commands:**\n- `npx @asyncapi/modelina generate --input asyncapi.yaml --output ./models\
  \ --language TypeScript`\n- `npx @asyncapi/modelina generate --input asyncapi.yaml --output ./src/main/java\
  \ --language Java`\n- `npx @asyncapi/modelina generate --input asyncapi.yaml --output ./models --language\
  \ Go`\n- `npx @asyncapi/modelina generate --input asyncapi.yaml --output ./models --language Python`\n\
  \n**Examples:**\n- npx @asyncapi/modelina generate --input asyncapi.yaml --output ./models --language\
  \ TypeScript --packageName com.example\n- npx @asyncapi/modelina generate --input asyncapi.yaml --output\
  \ ./models --language Java --type-mapping string=UUID\n- npx @asyncapi/modelina generate --input asyncapi.yaml\
  \ --output ./models --language Python --generate-optional\n\n## References\n- [AsyncAPI Generator](https://www.asyncapi.com/docs/tools/generator)\n\
  - [AsyncAPI CLI](https://www.asyncapi.com/docs/tools/cli)\n- [Modelina](https://www.asyncapi.com/docs/tools/modelina)\n\
  - [AsyncAPI Spec v3](https://www.asyncapi.com/docs/reference/specification/v3.0.0)"
prompt: Act as Asyncapi Codegen and handle the task per the instructions.
