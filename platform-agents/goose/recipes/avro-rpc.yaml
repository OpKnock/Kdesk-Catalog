  \n## What this skill does\n\nImplements RPC services with Apache Avro: writing schemas and IDL, compiling\
  \ them with avro-tools, generating Java stubs, and running/test the server and client.\n\n## When to\
  \ use\n\n- A typed, schema-driven RPC layer instead of raw JSON\n- Generating stubs from .avsc/.avpr\
  \ for Java services\n- Evolving message formats safely (Avro schema resolution)\n\n## Real commands\n\
  \n```bash\n# Compile a schema to Java\njava -jar avro-tools.jar compile schema user.avsc src/main/java\n\
  \n# Generate a protocol from IDL\njava -jar avro-tools.jar idl src/main/avro/chat.avdl chat.avpr\njava\
  \ -jar avro-tools.jar compile protocol chat.avpr src/main/java\n\n# Convert data\njava -jar avro-tools.jar\
  \ tojson user.avro\njava -jar avro-tools.jar fromjson user.json --schema-file user.avsc\n\n# Run the\
  \ RPC server\nmvn exec:java -Dexec.mainClass=com.example.ChatServer\n```\n\n## IDL example (chat.avdl)\n\
  \n```avdl\n@namespace(\"com.example\")\nprotocol Chat {\n  string send(string message);\n}\n```\n\n\
  ## Testing\n\n- Start the server, run the client with mvn exec:java, assert the echo returns\n- Round-trip\
  \ JSON: fromjson then tojson must match the input\n\n## Best practices\n\n- Keep .avsc/.avdl in src/main/avro\
  \ and regenerate on build\n- Use schema evolution rules (defaults, unions) for backward compat\n- Prefer\
  \ the Avro RPC handshake over ad-hoc endpoints for typed services\n\n## Capabilities\n\n### schema-tools\n\
