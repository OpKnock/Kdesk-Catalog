  - `Gin: go run main.go`

  - `FastAPI: uvicorn main:app --reload`

  - `Express: node server.js`


  **Examples:**

  - FastAPI: uvicorn main:app --reload

  - Gin: go run main.go

  - Axum: cargo run

  - Express: node server.js'
