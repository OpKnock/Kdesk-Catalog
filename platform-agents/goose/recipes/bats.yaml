title: Bats
description: Writes and runs BASH unit tests with Bats, covering assertions, setup/teardown, and CI-friendly
  TAP output.
version: 2.0.0
instructions: "# Bats\n\nWrites and runs BASH unit tests with Bats, covering assertions, setup/teardown,\
  \ and CI-friendly TAP output.\n\n## Instructions\n\n# Bats\n\nUnit testing for Bash and shell scripts.\n\
  \n## What This Skill Does\n\n- Writes test files with @test blocks\n- Uses run, assert_success, and\
  \ assert_output\n- Manages setup/teardown fixtures\n- Produces TAP output for CI\n\n## When to Use\n\
  \n- Testing shell scripts and CLI tools\n- Regression tests for deploy and ops scripts\n- CI for anything\
  \ written in Bash\n\n## Real Commands\n\n```bash\n# Run tests\nbats test.bats\nbats --tap tests/\nbats\
  \ -f 'parses' test.bats\n\n# Run a Bats suite in CI\nbats --tap tests/ | tee results.tap\n```\n\n##\
  \ Sample Test File\n\n```bash\n#!/usr/bin/env bats\n\nload 'test_helper/bats-support/load'\nload 'test_helper/bats-assert/load'\n\
  \nsetup() {\n  export FOO=\"bar\"\n}\n\nteardown() {\n  rm -f /tmp/test-output\n}\n\n@test \"greeting\
  \ prints hello\" {\n  run ./greet.sh alice\n  assert_success\n  assert_output 'hello alice'\n}\n\n@test\
  \ \"greeting fails without args\" {\n  run ./greet.sh\n  assert_failure\n  assert_output --partial 'usage'\n\
  }\n```\n\n## Best Practices\n\n- Keep tests deterministic: set env in setup, clean in teardown\n- Use\
  \ run to capture stdout/stderr/exit code\n- Prefer assert_output --partial over exact matching\n- Use\
  \ tags and -f filters for targeted debugging\n- Run the full suite in CI with --tap output\n\n## Capabilities\n\
  \n### bats-testing\nAuthor and run Bats test files with filters.\n\n**Commands:**\n- `bats test.bats`\n\
  - `bats -t test.bats`\n- `bats --tap tests/`\n- `bats -f 'parses' test.bats`\n- `bats -c test.bats`\n\
  \n**Examples:**\n- bats test.bats\n- bats --tap tests/\n- bats -f 'returns error' test.bats\n\n### assertions-and-fixtures\n\
  Use bats-assert helpers and fixtures in tests.\n\n**Commands:**\n- `load 'test_helper/bats-support/load'`\n\
  - `load 'test_helper/bats-assert/load'`\n- `assert_success`\n- `assert_output --partial 'error'`\n-\
  \ `run ./deploy.sh --dry-run`\n\n**Examples:**\n- assert_success\n- assert_output --regexp 'deploying.*prod'\n\
  - run ./script.sh -h && assert_failure"
prompt: Act as Bats and handle the task per the instructions.
