title: betterer
description: 'Tracks and enforces code quality metrics over time with betterer: type coverage, lint counts,
  and complexity budgets that never regress.'
version: 2.0.0
instructions: "# betterer\n\nTracks and enforces code quality metrics over time with betterer: type coverage,\
  \ lint counts, and complexity budgets that never regress.\n\n## Instructions\n\n# Betterer\n\nPrevent\
  \ code quality regressions over time.\n\n## When to Use\n\n- Inheriting a codebase with existing lint/type\
  \ debt\n- Ensuring debt only decreases, never increases\n- Gating merges on quality metric budgets\n\
  - Tracking coverage, complexity, or TODO counts\n\n## Commands\n\n```bash\n# Init\nnpx betterer init\n\
  \n# Run and compare against baseline\nnpx betterer\n\n# Update baseline after intentional improvements\n\
  npx betterer --update\n\n# Strict: any regression fails\nnpx betterer --strict\n\n# CI mode\nnpx betterer\
  \ --ci\n\n# Precommit check\nnpx betterer --precommit\n```\n\n## Config Example\n\n```typescript\n//\
  \ .betterer.ts\nimport { ts } from \"@betterer/typescript\";\n\nexport default {\n  \"no unused\": ts.noUnusedLocals(\"\
  ./src/**/*.ts\"),\n  \"test coverage\": coverage(...),\n};\n```\n\n## Best Practices\n\n- Run betterer\
  \ in CI; never let results regress\n- Update baselines only with an explicit, reviewed change\n- Use\
  \ --strict in CI to catch even unchanged failures\n- Combine with eslint/tsc outputs for a single quality\
  \ gate\n- Keep the baseline file in version control\n- Document why each baseline entry exists\n\n##\
  \ Capabilities\n\n### betterer-core\nInitialize, run, and update betterer metrics.\n\n**Commands:**\n\
  - `npx betterer init`\n- `npx betterer`\n- `npx betterer --update`\n- `npx betterer --strict`\n- `npx\
  \ betterer --check-timestamps`\n\n**Examples:**\n- npx betterer --update --workers 4\n- npx betterer\
  \ --precommit\n- npx betterer --config .betterer.ts\n\n### betterer-config\nConfigure custom tests and\
  \ thresholds.\n\n**Commands:**\n- `npx betterer --ci`\n- `npx betterer --cache`\n- `npx betterer --silent`\n\
  - `npm run betterer`\n\n**Examples:**\n- npx betterer --ci --silent\n- npx betterer --cache-dir .cache/betterer"
prompt: Act as betterer and handle the task per the instructions.
