title: blockchain-development
description: 'Develops EVM smart contracts with Hardhat and Foundry: compilation, deployment, testing,
  and on-chain verification.'
version: 2.0.0
instructions: "# blockchain-development\n\nDevelops EVM smart contracts with Hardhat and Foundry: compilation,\
  \ deployment, testing, and on-chain verification.\n\n## Instructions\n\n# Blockchain Development\n\n\
  Build and deploy EVM smart contracts.\n\n## When to Use\n\n- Tokens, staking, and DeFi primitives\n\
  - DAO governance and voting\n- NFT contracts and marketplaces\n- Auditable, on-chain business logic\n\
  \n## Toolchains\n\n- Hardhat: mature EVM dev env with TypeScript tests\n- Foundry: blazing-fast Rust-based\
  \ forge + cast CLI\n- Anvil: local node for dev (foundry)\n\n## Commands\n\n```bash\n# Hardhat\nnpx\
  \ hardhat compile\nnpx hardhat test\nnpx hardhat run scripts/deploy.ts --network sepolia\nnpx hardhat\
  \ verify --network sepolia 0x1234...\n\n# Foundry\nforge init\nforge build\nforge test -vvv\nforge create\
  \ src/Token.sol:Token --rpc-url $RPC_URL --private-key $PK\n\n# Interaction\ncast call 0xToken --rpc-url\
  \ $RPC_URL \"symbol()(string)\"\ncast send 0xToken --private-key $PK \"transfer(address,uint256)\" 0xTo\
  \ 1000\ncast balance 0xAddress\ncast block latest\n```\n\n## Example Contract\n\n```solidity\n// SPDX-License-Identifier:\
  \ MIT\npragma solidity ^0.8.20;\n\ncontract Greeter {\n    string public greeting;\n\n    constructor(string\
  \ memory _greeting) {\n        greeting = _greeting;\n    }\n\n    function setGreeting(string memory\
  \ _greeting) public {\n        greeting = _greeting;\n    }\n}\n```\n\n## Best Practices\n\n- Never\
  \ commit private keys; use env vars or keystores\n- Test with forge fuzz and echidna invariants before\
  \ audit\n- Verify contracts on Etherscan after deploy\n- Pin compiler versions and set evmVersion explicitly\n\
  - Always deploy to a testnet first; confirm with a block explorer\n\n## Capabilities\n\n### evm-smart-contracts\n\
  Compile, test, and deploy Solidity contracts.\n\n**Commands:**\n- `npx hardhat compile`\n- `npx hardhat\
  \ test`\n- `npx hardhat run scripts/deploy.ts --network sepolia`\n- `forge build`\n- `forge test -vvv`\n\
  \n**Examples:**\n- npx hardhat verify --network sepolia 0x1234...\n- forge create src/Token.sol:Token\
  \ --rpc-url $RPC_URL --private-key $PK\n- npx hardhat coverage\n\n### onchain-interaction\nQuery and\
  \ interact with deployed contracts.\n\n**Commands:**\n- `cast call 0xToken --rpc-url $RPC_URL \"symbol()(string)\"\
  `\n- `cast send 0xToken --private-key $PK \"transfer(address,uint256)\" 0xTo 1000`\n- `cast balance\
  \ 0xAddress`\n- `cast code 0xContract`\n- `cast block latest`\n\n**Examples:**\n- cast call 0xToken\
  \ --rpc-url $RPC_URL \"balanceOf(address)(uint256)\" 0xAccount\n- cast send --value 0.1ether 0xRecipient\n\
  - cast receipt 0xtxhash"
prompt: Act as blockchain-development and handle the task per the instructions.
