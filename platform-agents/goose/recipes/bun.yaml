title: Bun
description: Develops and runs JavaScript/TypeScript backend services with the Bun runtime, bundler, test
  runner, and package manager.
version: 2.0.0
instructions: "# Bun\n\nDevelops and runs JavaScript/TypeScript backend services with the Bun runtime,\
  \ bundler, test runner, and package manager.\n\n## Instructions\n\n# Bun\n\nBackend development with\
  \ the Bun runtime and toolchain.\n\n## When to Use\n\n- Running TypeScript server code without a separate\
  \ compile step\n- Building APIs with Bun.serve, Hono, or Elysia\n- Packaging services as single-file\
  \ executables with bun compile\n- Fast installs and task running where npm is slow\n\n## Commands\n\n\
  ```bash\n# Scaffold a new project\nbun init\n\n# Install dependencies from package.json\nbun install\n\
  \n# Add a dependency\nbun add hono\nbun add -d typescript\n\n# Run a script or TS file directly\nbun\
  \ run dev\nbun run src/server.ts\n\n# Test runner\nbun test\nbun test --coverage\n\n# Benchmark\nbun\
  \ bench\n\n# Lint and format\nbun lint\nbun fmt --check\n\n# Compile to a standalone binary\nbun compile\
  \ --outfile app server.ts\n```\n\n## HTTP Server\n\n```typescript\n// server.ts\nconst server = Bun.serve({\n\
  \  port: 3000,\n  fetch(req) {\n    return new Response(`Hello ${new URL(req.url).pathname}`);\n  },\n\
  });\nconsole.log(`Listening on ${server.url}`);\n```\n\n## Best Practices\n\n- Use bunx instead of npx\
  \ for one-off tools\n- Run bun --bun to force Bun over node when scripts call node\n- Put shared types\
  \ in a single tsconfig with strict mode\n- Use bun test --coverage in CI to enforce thresholds\n- Compile\
  \ production binaries with bun compile --minify for smaller artifacts\n- Pin bun.lock in version control\
  \ for reproducible installs\n\n## Capabilities\n\n### bun-runtime\nInitialize projects, run scripts,\
  \ and compile executables with Bun.\n\n**Commands:**\n- `bun init`\n- `bun install`\n- `bun run dev`\n\
  - `bun run build`\n- `bun compile --outfile app server.ts`\n\n**Examples:**\n- bun init -y\n- bun run\
  \ src/server.ts --port 3000\n- bun compile --minify --outfile api main.ts\n\n### bun-testing\nRun unit\
  \ tests, benchmarks, and linting.\n\n**Commands:**\n- `bun test`\n- `bun test --coverage`\n- `bun bench`\n\
  - `bun lint`\n- `bun fmt --check`\n\n**Examples:**\n- bun test test/unit/*.test.ts\n- bun bench bench/parse.bench.ts\n\
  - bun test --coverage --coverage-reporter=text"
prompt: Act as Bun and handle the task per the instructions.
