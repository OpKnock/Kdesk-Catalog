  \ Prevent thundering herd on cache expiry. — decide which checks to run\n- Evaluate trust/policy: `kdesk\
  \ trust` + `kdesk doctor` patterns for your inputs\n\n### 3. Act — execute with `caching-patterns-engineer`\
  \ tools\n- Tools: `Glob`, `Grep`, `Read`, `Bash`, `Redis-cli` (see frontmatter `tools`/`allowed-tools`)\n\
  - Use `safe_path` for any write; record evidence (paths, checksums)\n- Fingerprint: `caching-patterns-engineer:e6548881`\n\
  \n# Caching Patterns Engineer\n\nImplement reliable caching patterns.\n\n## When to Use\n\n- Adding\
  \ caching to existing code paths safely\n- Fixing cache coherence bugs (stale data, stampedes)\n- Building\
  \ distributed locking around expensive work\n\n## Patterns\n\n- Cache-aside: read cache; on miss load\
  \ + populate; invalidate on write\n- Read-through: cache loads missing values from the store itself\n\
  - Write-through: update cache and store together\n- Write-behind: update store asynchronously after\
  \ cache write\n- Stampede lock: only one process regenerates an expired key\n\n## Commands\n\n```bash\n\
  # Atomic set-if-absent with TTL\nredis-cli SET user:1 \"data\" EX 60 NX\n\n# Stampede lock\nredis-cli\
  \ SETNX lock:regen:popular-key \"1\" EX 10\n\n# Inspect TTL\nredis-cli ttl popular-key\nredis-cli pttl\
  \ popular-key\n\n# Invalidate\nredis-cli unlink user:1\n```\n\n## Python Cache-Aside\n\n```python\n\
  import redis\n\nr = redis.Redis()\n\ndef get_user(uid):\n    key = f\"user:{uid}\"\n    cached = r.get(key)\n\
  \    if cached:\n        return cached\n    lock = r.set(f\"lock:{key}\", \"1\", ex=5, nx=True)\n  \
  \  if lock:\n        data = fetch_from_db(uid)\n        r.set(key, data, ex=300)\n    else:\n      \
  \  time.sleep(0.05)\n        return r.get(key)\n    return data\n```\n\n## Best Practices\n\n- Use SET\
  \ NX EX for atomic stampede locks\n- Validate before caching: never cache errors as success\n- Invalidate\
  \ on write with unlink for large values\n- Keep TTLs short enough that drift self-heals\n- Measure hit\
  \ rate and latency before/after changes\n\n## Capabilities\n\n### pattern-implementation\nImplement\
  \ caching patterns in code with Redis.\n\n**Parameters:**\n- `key` (string): Cache key\n- `ttl` (integer):\
  \ TTL seconds\n- `nx` (boolean): Only set if key absent\n\n**Commands:**\n- `pip install redis`\n- `npm\
  \ install ioredis`\n- `redis-cli set user:1 \"data\" EX 60 NX`\n- `redis-cli setnx lock:task:1 \"1\"\
  \ EX 30`\n\n**Examples:**\n- redis-cli SET user:1 \"data\" EX 60 NX\n- redis-cli GETSET lock:task:1\
  \ \"1\"\n- python -c \"import redis; r=redis.Redis(); print(r.set('k','v',ex=60,nx=True))\"\n\n### stampede-protection\n\
  Prevent thundering herd on cache expiry.\n\n**Parameters:**\n- `lock-key` (string): Stampede lock key\n\
  - `ttl` (integer): Lock TTL in seconds\n\n**Commands:**\n- `redis-cli setnx lock:regen:popular-key \"\
  1\" EX 10`\n- `redis-cli ttl popular-key`\n- `redis-cli get popular-key`\n- `redis-cli pttl popular-key`\n\
  \n**Examples:**\n- redis-cli setnx lock:regen:report \"1\" EX 15\n- redis-cli ttl report\n\n## References\n\
  - [Redis Cache-Aside Pattern](https://learn.microsoft.com/en-us/azure/architecture/patterns/cache-aside)\n\
  - [Redis Commands](https://redis.io/commands/)"
