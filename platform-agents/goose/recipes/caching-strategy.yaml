title: Caching Strategy
description: Designs and tunes multi-layer caching systems with Redis, Memcached, and HTTP caches including
  invalidation, TTL, and cache-aside patterns.
version: 2.0.0
instructions: "# Caching Strategy\n\nDesigns and tunes multi-layer caching systems with Redis, Memcached,\
  \ and HTTP caches including invalidation, TTL, and cache-aside patterns.\n\n## Instructions\n\n# Caching\
  \ Strategy\n\nDesign multi-layer caches and keep them consistent.\n\n## When to Use\n\n- Serving the\
  \ same read-heavy data repeatedly\n- Protecting databases from hot keys and read amplification\n- Storing\
  \ sessions, rate counters, or computed aggregates\n- Reducing latency on slow third-party lookups\n\n\
  ## Patterns\n\n- Cache-aside: read cache, on miss load from DB and populate, invalidate on write\n-\
  \ Read-through: cache loads from DB automatically on miss\n- Write-through: writes go to cache and DB\
  \ together\n- TTL-based expiry with jitter to avoid thundering herd\n- Setnx lock-based stampede protection\
  \ for expensive recompute\n\n## Commands\n\n```bash\n# Basic set with TTL (seconds)\nredis-cli set user:123\
  \ \"{\\\"name\\\":\\\"alice\\\"}\" EX 300\n\n# Inspect TTL remaining\nredis-cli ttl user:123\nredis-cli\
  \ pttl user:123\n\n# Scan keys by pattern\nredis-cli --scan --pattern \"user:*\"\n\n# Check memory usage\
  \ of a key\nredis-cli memory usage user:123\n\n# Cache stats\nredis-cli info keyspace\nredis-cli dbsize\n\
  \n# Invalidate\nredis-cli unlink user:123\nredis-cli del user:123\n\n# Stampede lock\nredis-cli setnx\
  \ lock:regen:report \"1\" EX 30\n```\n\n## Example\n\n```python\nimport redis\nr = redis.Redis(host=\"\
  localhost\")\n\ndef get_user(user_id):\n    cached = r.get(f\"user:{user_id}\")\n    if cached:\n  \
  \      return cached\n    data = db.fetch_user(user_id)  # miss: load from DB\n    r.set(f\"user:{user_id}\"\
  , data, ex=300)\n    return data\n```\n\n## Best Practices\n\n- Add random jitter (e.g. 5-10% of TTL)\
  \ to keys to prevent expiry stampedes\n- Use unlink instead of del for large values to avoid blocking\
  \ Redis\n- Evict with LRU/LFU policies appropriate to access patterns\n- Never cache unauthenticated\
  \ or per-user secrets without authorization checks\n- Profile hit rate with redis-cli info stats before\
  \ and after tuning\n\n## Capabilities\n\n### redis-caching\nOperate Redis as a cache: set/get with TTL,\
  \ scan keys, and inspect memory.\n\n**Commands:**\n- `redis-cli set user:123 \"{\\\"name\\\":\\\"alice\\\
  \"}\" EX 300`\n- `redis-cli --scan --pattern \"user:*\"`\n- `redis-cli ttl user:123`\n- `redis-cli memory\
  \ usage user:123`\n- `redis-cli info keyspace`\n\n**Examples:**\n- redis-cli set session:abc \"data\"\
  \ EX 3600\n- redis-cli --scan --pattern \"cache:*\" | xargs redis-cli del\n- redis-cli dbsize\n\n###\
  \ cache-invalidation\nInvalidate entries on writes and handle stampede protection.\n\n**Commands:**\n\
  - `redis-cli unlink user:123`\n- `redis-cli pttl user:123`\n- `redis-cli setnx lock:refresh:user:123\
  \ \"1\" EX 30`\n- `redis-cli get user:123`\n\n**Examples:**\n- redis-cli unlink user:123\n- redis-cli\
  \ del \"article:*\""
prompt: Act as Caching Strategy and handle the task per the instructions.
