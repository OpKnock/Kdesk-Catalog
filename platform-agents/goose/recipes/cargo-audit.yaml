title: Cargo Audit
description: 'Audits Rust dependencies for known vulnerabilities with cargo-audit: advisories, fix suggestions,
  and CI gating.'
version: 2.0.0
instructions: "# Cargo Audit\n\nAudits Rust dependencies for known vulnerabilities with cargo-audit: advisories,\
  \ fix suggestions, and CI gating.\n\n## Instructions\n\n# cargo-audit\n\nAudit Rust dependencies for\
  \ vulnerabilities.\n\n## When to Use\n\n- Before every release\n- In CI on every merge\n- When adding\
  \ or upgrading dependencies\n- Investigating reported CVEs affecting your crates\n\n## Commands\n\n\
  ```bash\n# Install\ncargo install cargo-audit\n\n# Scan the lockfile\ncargo audit\n\n# No network (use\
  \ cached advisory db)\ncargo audit -n\n\n# Ignore known accepted advisories\ncargo audit --ignore RUSTSEC-2024-0001\n\
  \n# Update a vulnerable crate\ncargo update -p vulnerable-crate\n\n# Find who depends on a crate\ncargo\
  \ tree -i openssl\n\n# Preview dependency updates\ncargo outdated\n```\n\n## CI Example\n\n```yaml\n\
  - name: Audit dependencies\n  run: cargo audit --deny warnings\n```\n\n## Best Practices\n\n- Keep Cargo.lock\
  \ committed for applications\n- Run cargo audit --deny warnings in CI\n- Review ignored advisories;\
  \ never ignore silently\n- Update directly vulnerable crates first (cargo update -p)\n- Check the advisory\
  \ details for patched versions\n- Pin the cargo-audit version in CI for stable output\n\n## Capabilities\n\
  \n### cargo-audit-scan\nScan dependency trees for vulnerabilities.\n\n**Commands:**\n- `cargo install\
  \ cargo-audit`\n- `cargo audit`\n- `cargo audit --ignore RUSTSEC-2024-0001`\n- `cargo audit -n`\n- `cargo\
  \ audit --version`\n\n**Examples:**\n- cargo audit --file Cargo.lock\n- cargo audit --ignore RUSTSEC-2023-0021,RUSTSEC-2024-0010\n\
  - cargo audit --db ~/.cargo/advisory-db\n\n### cargo-fix\nUpdate vulnerable dependencies.\n\n**Commands:**\n\
  - `cargo update -p vulnerable-crate`\n- `cargo update --precise 1.2.3`\n- `cargo tree -i vulnerable-crate`\n\
  - `cargo outdated`\n\n**Examples:**\n- cargo tree -i openssl\n- cargo update -p openssl --precise 0.10.66\n\
  - cargo audit && echo \"clean\""
prompt: Act as Cargo Audit and handle the task per the instructions.
