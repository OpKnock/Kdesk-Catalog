title: Cassandra
description: 'Operates Cassandra: cqlsh queries, schema management, and node health via nodetool.'
version: 2.0.0
instructions: "# Cassandra\n\nOperates Cassandra: cqlsh queries, schema management, and node health via\
  \ nodetool.\n\n## Instructions\n\n# Cassandra\n\nDistributed NoSQL operations: CQL queries, schema changes,\
  \ and cluster health\nwith nodetool.\n\n## When to Use\n\n- Querying or writing data via cqlsh\n- Running\
  \ repairs and checking node state\n- Applying schema changes to a cluster\n\n## Real Commands\n\n```bash\n\
  # Connect and explore\nsudo cqlsh\nsudo cqlsh -e \"DESCRIBE KEYSPACES;\"\n\n# Queries\nsudo cqlsh -k\
  \ app -e \"SELECT * FROM orders WHERE order_id = 'abc-123';\"\nsudo cqlsh -e \"SELECT * FROM app.orders\
  \ LIMIT 10;\"\n\n# Schema script\nsudo cqlsh -f schema.cql\n\n# Node health\nsudo nodetool status\n\
  sudo nodetool status app\n\n# Repairs (primary range)\nsudo nodetool repair -pr app\n\n# Activity\n\
  sudo nodetool tpstats\nsudo nodetool compactionstats\nsudo nodetool tablestats app.orders\n```\n\n##\
  \ Schema Example (schema.cql)\n\n```sql\nCREATE KEYSPACE IF NOT EXISTS app WITH replication = {'class':\
  \ 'NetworkTopologyStrategy', 'dc1': 3};\nCREATE TABLE IF NOT EXISTS app.orders (\n  order_id uuid PRIMARY\
  \ KEY,\n  customer_id uuid,\n  amount decimal,\n  created_at timestamp\n);\n```\n\n## Best Practices\n\
  \n- Always qualify queries with the partition key\n- Run repairs during low traffic with `-pr`\n- Never\
  \ `DESCRIBE`-drift: apply schema via versioned CQL files\n- Check `tpstats` for drop and latency issues\n\
  - Watch `nodetool status` for UN (up-normal) on all nodes\n\n## Example Response\n\nFor a slow cluster:\
  \ reports nodetool status, compaction stats, and tpstats; then\nrecommends repairs, compactions, or\
  \ query fixes.\n\n## Capabilities\n\n### cassandra-cli\nQuery and manage Cassandra with cqlsh and nodetool\n\
  \n**Commands:**\n- `cqlsh -e \"DESCRIBE KEYSPACES;\"`\n- `cqlsh -e \"SELECT * FROM app.orders LIMIT\
  \ 10;\"`\n- `cqlsh -f schema.cql`\n- `nodetool status`\n- `nodetool repair -pr`\n\n**Examples:**\n-\
  \ cqlsh -k app -e \"SELECT count(*) FROM orders;\"\n- nodetool tpstats | head -20\n- nodetool compactionstats"
prompt: Act as Cassandra and handle the task per the instructions.
