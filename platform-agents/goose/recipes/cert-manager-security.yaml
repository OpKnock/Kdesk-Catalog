title: cert-manager-security
description: Issues, renews, and troubleshoots TLS certificates in Kubernetes with cert-manager, ACME
  issuers, and the cmctl CLI.
version: 2.0.0
instructions: "# cert-manager-security\n\nIssues, renews, and troubleshoots TLS certificates in Kubernetes\
  \ with cert-manager, ACME issuers, and the cmctl CLI.\n\n## Instructions\n\n# cert-manager\n\nAutomatic\
  \ TLS certificate issuance and renewal in Kubernetes using cert-manager.\n\n## What This Skill Does\n\
  \n- Installs cert-manager and verifies the API is available\n- Creates ClusterIssuers for ACME (Let's\
  \ Encrypt), CA, and self-signed backends\n- Issues Certificate resources and tracks their lifecycle\n\
  - Forces renewals and debugs ACME order/challenge failures\n\n## When to Use\n\n- A cluster needs automatic\
  \ HTTPS for ingresses\n- Certificates fail to issue or renew\n- An issuer needs switching (staging to\
  \ production Let's Encrypt)\n\n## Real Commands\n\n```bash\n# Install\nkubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.15.0/cert-manager.yaml\n\
  cmctl check api\n\n# Issuer and certificate status\nkubectl get clusterissuers\nkubectl get certificates\
  \ -A\nkubectl describe certificate example-tls\ncmctl status certificate example-tls\n\n# Debug ACME\n\
  kubectl get orders.acme.cert-manager.io\nkubectl get challenges.acme.cert-manager.io\nkubectl get certificaterequests\
  \ -A\n\n# Operations\ncmctl renew example-tls\ncmctl renew --all\n```\n\n## Sample Certificate\n\n```yaml\n\
  apiVersion: cert-manager.io/v1\nkind: Certificate\nmetadata:\n  name: example-tls\n  namespace: istio-system\n\
  spec:\n  secretName: example-tls\n  dnsNames:\n    - example.com\n  issuerRef:\n    name: letsencrypt-prod\n\
  \    kind: ClusterIssuer\n```\n\n## Best Practices\n\n- Use ClusterIssuer for shared issuers, Issuer\
  \ for namespace-scoped control\n- Start with the staging ACME server to avoid rate limits\n- Enable\
  \ the HTTP-01 solver via an ingress class annotation or DNS-01 for wildcards\n- Monitor certificate\
  \ expiry with cert-manager's built-in metrics\n- Pin the cert-manager release and upgrade via helm to\
  \ match CRD versions\n\n## Capabilities\n\n### cmctl-management\nInspect and manage certificates, issuers,\
  \ and renewals with cmctl.\n\n**Commands:**\n- `kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.15.0/cert-manager.yaml`\n\
  - `kubectl get certificates -A`\n- `kubectl describe certificate example-tls`\n- `cmctl check api`\n\
  - `cmctl renew example-tls`\n- `cmctl status certificate example-tls`\n\n**Examples:**\n- kubectl get\
  \ certificates -A\n- cmctl status certificate example-tls\n- cmctl renew --all\n\n### acme-issuer-setup\n\
  Configure ClusterIssuers with Let's Encrypt and manage issuance resources.\n\n**Commands:**\n- `kubectl\
  \ get clusterissuers`\n- `kubectl apply -f cluster-issuer-letsencrypt.yaml`\n- `kubectl get orders.acme.cert-manager.io`\n\
  - `kubectl get challenges.acme.cert-manager.io`\n- `kubectl get certificaterequests`\n\n**Examples:**\n\
  - kubectl apply -f cluster-issuer-letsencrypt.yaml\n- kubectl get orders.acme.cert-manager.io -n istio-system\n\
  - kubectl get certificaterequests -A"
prompt: Act as cert-manager-security and handle the task per the instructions.
