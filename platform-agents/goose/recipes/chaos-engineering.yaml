title: Chaos Engineering
description: 'Run Kubernetes chaos experiments with Litmus: install the operator, create chaos engines,
  and inspect experiment results.'
version: 2.0.0
instructions: "# Chaos Engineering\n\nRun Kubernetes chaos experiments with Litmus: install the operator,\
  \ create chaos engines, and inspect experiment results.\n\n## Instructions\n\n# Chaos Engineering (Litmus)\n\
  \nRun Kubernetes-native chaos experiments with Litmus.\n\n## When to Use\n\n- Testing pod deletion,\
  \ CPU spikes, and network faults on k8s\n- Building a repeatable chaos suite for a service\n- Measuring\
  \ blast radius with controlled targeting\n\n## Install\n\n```bash\nhelm repo add litmuschaos https://charts.litmuschaos.io\n\
  helm install chaos litmuschaos/litmus --namespace litmus --create-namespace\nkubectl get pods -n litmus\n\
  ```\n\n## Pod Delete Experiment\n\n```yaml\napiVersion: litmuschaos.io/v1alpha1\nkind: ChaosEngine\n\
  metadata:\n  name: pod-delete-nginx\n  namespace: myapp\nspec:\n  appinfo:\n    appns: myapp\n    applabel:\
  \ app=nginx\n    appkind: deployment\n  chaosServiceAccount: litmus-sa\n  experiments:\n    - name:\
  \ pod-delete\n      spec:\n        components:\n          env:\n            - name: TOTAL_CHAOS_DURATION\n\
  \              value: \"30\"\n            - name: CHAOS_INTERVAL\n              value: \"10\"\n```\n\
  \n```bash\nkubectl apply -f pod-delete.yaml\nkubectl get chaosengines -n myapp\nkubectl get chaosexperiments\
  \ -n myapp\nkubectl describe chaosresult pod-delete-nginx -n myapp\n```\n\n## Connect Chaos Center\n\
  \n```bash\nlitmusctl connect agent --config=config.yaml --non-interactive\n```\n\n## Testing\n\n```bash\n\
  # Confirm injection is done and experiment passed\nkubectl get chaosresult pod-delete-nginx -n myapp\
  \ -o jsonpath='{.status.experimentStatus.verdict}'\n```\n\n## Best Practices\n\n- Always scope appinfo\
  \ with a unique applabel\n- Set TOTAL_CHAOS_DURATION and CHAOS_INTERVAL explicitly\n- Run experiments\
  \ against staging before prod\n- Use chaos runners only where a service account exists\n- Pair experiments\
  \ with dashboards to correlate incidents\n- Start with pod-delete, then add network and CPU faults\n\
  - Clean up engines after runs\n\n## Capabilities\n\n### litmus-install\nInstall Litmus Chaos operator\
  \ and connect agents via helm and litmusctl\n\n**Commands:**\n- `helm repo add litmuschaos https://charts.litmuschaos.io`\n\
  - `helm install chaos litmuschaos/litmus --namespace litmus --create-namespace`\n- `kubectl get pods\
  \ -n litmus`\n- `litmusctl version`\n\n**Examples:**\n- helm repo add litmuschaos https://charts.litmuschaos.io\
  \ && helm install chaos litmuschaos/litmus --namespace litmus --create-namespace\n- kubectl get pods\
  \ -n litmus -l app.kubernetes.io/name=litmus\n- litmusctl version\n\n### chaos-experiments\nApply chaos\
  \ experiments and engines, then inspect fault injection results\n\n**Commands:**\n- `kubectl apply -f\
  \ pod-delete.yaml`\n- `kubectl get chaosengines -n myapp`\n- `kubectl get chaosexperiments -n myapp`\n\
  - `kubectl describe chaosresult pod-delete-nginx -n myapp`\n\n**Examples:**\n- kubectl apply -f pod-delete.yaml\
  \ && kubectl get chaosengines -n myapp\n- kubectl describe chaosresult pod-delete-nginx -n myapp\n-\
  \ kubectl logs -n litmus -l app.kubernetes.io/name=chaos-exporter"
prompt: Act as Chaos Engineering and handle the task per the instructions.
