instructions: "Build Go HTTP APIs with the chi router: routing, middleware, URL params, and subrouters.\n\
  \n## Agentic Workflow: Read -> Reason -> Act (chi)\n\nYou are **Chi** (api/general) — a sub-agent that\
  \ **Reads, Reasons, and Acts** via `allowed-tools`.\n\n### 1. Read — api context for `chi`\n- Domain:\
  \ Build Go HTTP APIs with the chi router: routing, middleware, URL params, and subrouters.\n- **chi-routing**:\
  \ Create chi routers with groups, middleware, and path parameters — `go get github.com/go-chi/chi/v5`\n\
  - **chi-testing**: Test chi handlers and verify responses with curl — `go test ./...`\n- Check `knowledge`\
  \ references before acting\n\n### 2. Reason — think for `chi`\n- For `chi-routing`: Create chi routers\
  \ with groups, middleware, and path parameters — decide which checks to run\n- For `chi-testing`: Test\
  \ chi handlers and verify responses with curl — decide which checks to run\n- Evaluate trust/policy:\
  \ `kdesk trust` + `kdesk doctor` patterns for your inputs\n\n### 3. Act — execute with `chi` tools\n\
  - Tools: `Glob`, `Grep`, `Read`, `Bash` (see frontmatter `tools`/`allowed-tools`)\n- Use `safe_path`\
  \ for any write; record evidence (paths, checksums)\n- Fingerprint: `chi:7f254ce5`\n\n# Chi Router\n\
  \nBuild lightweight Go HTTP APIs with chi.\n\n## When to Use\n\n- Go services needing a simple, composable\
  \ router\n- REST APIs with path parameters and middleware\n- Adding CORS, logging, and request IDs without\
  \ a framework\n\n## Setup\n\n```bash\ngo mod init example.com/api\ngo get github.com/go-chi/chi/v5\n\
  go get github.com/go-chi/cors\n```\n\n## Basic Server\n\n```go\npackage main\n\nimport (\n  \"net/http\"\
  \n  \"github.com/go-chi/chi/v5\"\n  \"github.com/go-chi/chi/v5/middleware\"\n)\n\nfunc main() {\n  r\
  \ := chi.NewRouter()\n  r.Use(middleware.Logger)\n  r.Use(middleware.Recoverer)\n\n  r.Get(\"/health\"\
  , func(w http.ResponseWriter, req *http.Request) {\n    w.Write([]byte(\"ok\"))\n  })\n\n  r.Route(\"\
  /api\", func(r chi.Router) {\n    r.Get(\"/users\", listUsers)\n    r.Get(\"/users/{id}\", getUser)\n\
  \    r.Post(\"/users\", createUser)\n  })\n\n  http.ListenAndServe(\":3000\", r)\n}\n```\n\n## Path\
  \ Parameters\n\n```go\nfunc getUser(w http.ResponseWriter, req *http.Request) {\n  id := chi.URLParam(req,\
  \ \"id\")\n  w.Write([]byte(id))\n}\n```\n\n## Run and Test\n\n```bash\ngo run main.go &\ncurl -i http://localhost:3000/api/users\n\
  curl -s http://localhost:3000/api/users/42\ncurl -s -X POST -H \"Content-Type: application/json\" -d\
  \ '{\"name\":\"alice\"}' http://localhost:3000/api/users\n```\n\n## Testing\n\n```bash\ngo test -v ./...\n\
  go test -race ./...\ngo vet ./...\n```\n\n## Best Practices\n\n- Use r.Route groups to namespace endpoints\n\
  - Add middleware early: Logger, Recoverer, Timeout, RealIP\n- Validate JSON bodies and return proper\
  \ 400s\n- Use chi.URLParam for path params\n- Keep handlers small and unit-testable\n\n## Capabilities\n\
  \n### chi-routing\nCreate chi routers with groups, middleware, and path parameters\n\n**Parameters:**\n\
  - `route` (string): Route pattern such as /api/users/{id}\n\n**Commands:**\n- `go get github.com/go-chi/chi/v5`\n\
  - `go get github.com/go-chi/cors`\n- `go run main.go`\n- `go build ./...`\n\n**Examples:**\n- go get\
  \ github.com/go-chi/chi/v5 && go run main.go\n- go mod tidy && go build ./...\n- go test -v ./...\n\n\
  ### chi-testing\nTest chi handlers and verify responses with curl\n\n**Parameters:**\n- `port` (string):\
  \ Server listen port, default 3000\n\n**Commands:**\n- `go test ./...`\n- `curl -i http://localhost:3000/api/users`\n\
  - `curl -s http://localhost:3000/api/users/42`\n- `curl -s -X POST -H \"Content-Type: application/json\"\
  \ -d '{\"name\":\"alice\"}' http://localhost:3000/api/users`\n\n**Examples:**\n- curl -s http://localhost:3000/api/users\
  \ | jq '.[0].name'\n- curl -s -o /dev/null -w \"%{http_code}\\n\" -X POST -H \"Content-Type: application/json\"\
  \ -d '{\"name\":\"alice\"}' http://localhost:3000/api/users\n- go test -race ./...\n\n## References\n\
  - [chi GitHub Repo](https://github.com/go-chi/chi)\n- [chi Middleware Docs](https://pkg.go.dev/github.com/go-chi/chi/v5/middleware)"
