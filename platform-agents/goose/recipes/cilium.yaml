title: cilium
description: Installs, verifies, and debugs the Cilium CNI with eBPF data plane, CiliumNetworkPolicy,
  and Hubble observability.
version: 2.0.0
instructions: "# cilium\n\nInstalls, verifies, and debugs the Cilium CNI with eBPF data plane, CiliumNetworkPolicy,\
  \ and Hubble observability.\n\n## Instructions\n\n# Cilium Networking\n\nDeploy and troubleshoot the\
  \ Cilium CNI: eBPF data plane, network policies, and Hubble observability.\n\n## What This Skill Does\n\
  \n- Installs Cilium with the cilium CLI and Helm\n- Verifies the data plane with `cilium status` and\
  \ `cilium connectivity test`\n- Author CiliumNetworkPolicy (L3/L4/L7) policies\n- Observes and filters\
  \ traffic with Hubble\n- Diagnoses dropped packets, DNS failures, and identity issues\n\n## When to\
  \ Use\n\n- Installing a CNI with eBPF, kube-proxy replacement, or BGP\n- Pods cannot reach each other\
  \ and you need flow-level answers\n- Enforcing zero-trust east-west policies\n\n## Real Commands\n\n\
  ```bash\n# Install and verify\ncilium install --version v1.16.4\ncilium status --wait\ncilium connectivity\
  \ test --timeout 10m\n\n# Inspect state\ncilium identity list\ncilium endpoint list\ncilium policy get\
  \ default/allow-all\ncilium monitor --type drop\n\n# Hubble traffic flows\nhubble status\nhubble observe\
  \ --pod default/web-0 --last 200\nhubble observe --verdict DROPPED --last 100\nhubble observe --to-namespace\
  \ kube-system --type to-endpoint\n```\n\n## CiliumNetworkPolicy Example\n\n```yaml\napiVersion: cilium.io/v2\n\
  kind: CiliumNetworkPolicy\nmetadata:\n  name: allow-nginx-ingress\n  namespace: default\nspec:\n  endpointSelector:\n\
  \    matchLabels: { app: nginx }\n  ingress:\n    - fromEndpoints:\n        - matchLabels: { app: frontend\
  \ }\n      toPorts:\n        - ports:\n            - port: \"80\"\n              protocol: TCP\n```\n\
  \n## Best Practices\n\n- Run `cilium connectivity test` after every upgrade\n- Set `kubeProxyReplacement:\
  \ strict` and verify with `cilium status | grep KubeProxyReplacement`\n- Use CiliumNetworkPolicy namespaces\
  \ to segment tenants\n- Monitor drops with `cilium monitor --type drop` before changing policies\n-\
  \ Keep Hubble relay storage sized for your flow volume\n\n## Capabilities\n\n### cilium-install-and-verify\n\
  Install Cilium into a Kubernetes cluster and run connectivity and upgrade verification.\n\n**Commands:**\n\
  - `cilium install --version v1.16.4`\n- `cilium status --wait`\n- `cilium connectivity test`\n- `cilium\
  \ upgrade`\n- `cilium uninstall`\n\n**Examples:**\n- cilium install --version v1.16.4\n- cilium status\
  \ --wait\n- cilium connectivity test --timeout 10m\n\n### hubble-observability\nInspect service-to-service\
  \ traffic flows with Hubble CLI and troubleshoot connectivity issues.\n\n**Commands:**\n- `hubble status`\n\
  - `hubble observe --pod default/web-0`\n- `hubble observe --verdict DROPPED`\n- `hubble observe --from-pod\
  \ default/curl-0 --to-namespace kube-system`\n- `hubble flow`\n\n**Examples:**\n- hubble observe --verdict\
  \ DROPPED --last 100\n- hubble observe --to-pod kube-system/coredns-*\n- hubble status"
prompt: Act as cilium and handle the task per the instructions.
