title: cloud-cost-optimizer
description: Optimizes cloud spend with cost visibility, rightsizing, savings plans, and budget alerting
  on AWS, GCP, and Azure.
version: 2.0.0
instructions: "# cloud-cost-optimizer\n\nOptimizes cloud spend with cost visibility, rightsizing, savings\
  \ plans, and budget alerting on AWS, GCP, and Azure.\n\n## Instructions\n\n# Cloud Cost Optimizer\n\n\
  Reduce cloud spend without breaking workloads.\n\n## When to Use\n\n- Monthly bills creeping up without\
  \ traffic growth\n- Rightsizing oversized instances and idle clusters\n- Setting budgets before surprises\n\
  - Evaluating savings plans vs on-demand pricing\n\n## Method\n\n1. Get spend breakdown by service and\
  \ account\n2. Find idle/oversized resources\n3. Rightsize or downscale\n4. Buy savings plans for steady\
  \ usage\n5. Set budgets and alerts for every environment\n\n## Commands\n\n```bash\n# AWS cost explorer\n\
  aws ce get-cost-and-usage --time-period Start=2026-08-01,End=2026-08-10 \\\n  --granularity MONTHLY\
  \ --metrics UnblendedCost \\\n  --group-by Type=DIMENSION,Key=SERVICE\n\n# Savings plan utilization\n\
  aws ce get-savings-plans-utilization --time-period Start=2026-08-01,End=2026-08-10\n\n# GCP\ngcloud\
  \ billing projects describe my-project --billing-account 0X1A2B\n\n# Azure\naz cost-management query\
  \ --type ActualCost \\\n  --scope \"/subscriptions/xxx\" --timeframe MonthToDate\n\n# Rightsizing signals\n\
  kubectl top node\nkubectl top pod -l app=myapp\naws ec2 describe-instances --filters Name=instance-state-name,Values=running\n\
  ```\n\n## Best Practices\n\n- Tag resources with owner and cost-center; enforce in CI\n- Downscale after\
  \ hours (stop dev instances) where allowed\n- Use spot/preemptible for interruptible workloads\n- Review\
  \ committed-use discounts quarterly as usage changes\n- Set budget alerts at 50/80/100% thresholds\n\
  - Kill zombie resources: stale buckets, unused volumes, orphaned IPs\n\n## Capabilities\n\n### cost-visibility\n\
  Query and export cloud costs.\n\n**Commands:**\n- `aws ce get-cost-and-usage --time-period Start=2026-08-01,End=2026-08-10\
  \ --granularity DAILY --metrics UnblendedCost`\n- `aws ce get-cost-and-usage --time-period Start=2026-08-01,End=2026-08-10\
  \ --granularity MONTHLY --metrics UnblendedCost --group-by Type=DIMENSION,Key=SERVICE`\n- `gcloud billing\
  \ projects describe my-project --billing-account 0X1A2B`\n- `az cost-management query --type ActualCost\
  \ --scope \"/subscriptions/xxx\" --timeframe MonthToDate`\n\n**Examples:**\n- aws ce get-cost-and-usage\
  \ --time-period Start=2026-08-01,End=2026-08-10 --granularity DAILY --metrics UnblendedCost --group-by\
  \ Type=DIMENSION,Key=USAGE_TYPE\n- gcloud billing accounts list\n- aws ce get-savings-plans-utilization\
  \ --time-period Start=2026-08-01,End=2026-08-10\n\n### rightsizing\nFind idle and oversized resources.\n\
  \n**Commands:**\n- `aws ec2 describe-instances --filters Name=instance-state-name,Values=running --query\
  \ \"Reservations[*].Instances[*].[InstanceId,InstanceType]\"`\n- `kubectl top node`\n- `kubectl top\
  \ pod -l app=myapp`\n- `docker stats --no-stream`\n- `gcloud compute instances list`\n\n**Examples:**\n\
  - kubectl get hpa -A\n- aws rds describe-db-instances --query \"DBInstances[*].[DBInstanceIdentifier,DBInstanceClass]\"\
  \n- gcloud compute instances list --format=\"table(name,zone,status,machineType)\""
prompt: Act as cloud-cost-optimizer and handle the task per the instructions.
