title: Cloudflare Workers
description: 'Build and deploy edge APIs with Cloudflare Workers using wrangler: init, dev, deploy, secrets,
  and tail.'
version: 2.0.0
instructions: "# Cloudflare Workers\n\nBuild and deploy edge APIs with Cloudflare Workers using wrangler:\
  \ init, dev, deploy, secrets, and tail.\n\n## Instructions\n\n# Cloudflare Workers\n\nBuild edge APIs\
  \ with Cloudflare Workers.\n\n## When to Use\n\n- Global low-latency API endpoints\n- Auth, routing,\
  \ and caching at the edge\n- Serverless functions near users\n\n## Scaffold\n\n```bash\nnpx wrangler\
  \ init my-worker\ncd my-worker\nnpx wrangler dev\n```\n\n## Handler\n\n```ts\nexport default {\n  async\
  \ fetch(request: Request, env: Env, ctx: ExecutionContext): Promise<Response> {\n    const url = new\
  \ URL(request.url);\n    if (url.pathname === \"/health\") {\n      return new Response(JSON.stringify({\
  \ ok: true }), {\n        headers: { \"Content-Type\": \"application/json\" },\n      });\n    }\n \
  \   const key = url.pathname.slice(1);\n    return new Response(`Hello from edge: ${key}`);\n  },\n\
  };\n```\n\n## Deploy\n\n```bash\nnpx wrangler deploy --dry-run\nnpx wrangler deploy\nnpx wrangler deployments\
  \ list\n```\n\n## Secrets and Bindings\n\n```bash\nnpx wrangler secret put API_KEY\nnpx wrangler tail\n\
  npx wrangler kv key list --binding=MY_KV\n```\n\n## wrangler.toml\n\n```toml\nname = \"my-worker\"\n\
  main = \"src/index.ts\"\ncompatibility_date = \"2025-01-01\"\n\n[[kv_namespaces]]\nbinding = \"MY_KV\"\
  \nid = \"xxxxxxxx\"\n```\n\n## Testing\n\n```bash\nnpx wrangler dev &\ncurl -s http://localhost:8787/health\
  \ | jq\nnpx wrangler tail --format json\n```\n\n## Best Practices\n\n- Use --dry-run before real deploys\n\
  - Keep secrets in wrangler secret put, never in code\n- Set compatibility dates explicitly\n- Test with\
  \ Miniflare in CI\n- Cache aggressively with the Cache API\n- Use Durable Objects for stateful services\n\
  - Watch usage with wrangler deployments and analytics\n\n## Capabilities\n\n### wrangler-dev\nScaffold\
  \ Workers projects, run locally, and deploy to the edge\n\n**Commands:**\n- `npx wrangler init my-worker`\n\
  - `npx wrangler dev`\n- `npx wrangler deploy`\n- `npx wrangler whoami`\n\n**Examples:**\n- npx wrangler\
  \ init my-worker --yes && npx wrangler dev\n- npx wrangler deploy --dry-run\n- npx wrangler whoami\n\
  \n### runtime-tools\nManage secrets, inspect live traffic, and check KV/Durable Object bindings\n\n\
  **Commands:**\n- `npx wrangler secret put API_KEY`\n- `npx wrangler tail`\n- `npx wrangler kv key list\
  \ --binding=MY_KV`\n- `npx wrangler deployments list`\n\n**Examples:**\n- npx wrangler secret put API_KEY\n\
  - npx wrangler tail --format json\n- npx wrangler kv key list --binding=MY_KV | jq '.keys[0].name'"
prompt: Act as Cloudflare Workers and handle the task per the instructions.
