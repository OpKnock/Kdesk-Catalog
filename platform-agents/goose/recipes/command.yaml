title: Command
description: 'Implements the Command pattern in Java with Gradle: encapsulating requests as objects with
  undo/redo support.'
version: 2.0.0
instructions: "# Command\n\nImplements the Command pattern in Java with Gradle: encapsulating requests\
  \ as objects with undo/redo support.\n\n## Instructions\n\n# Command Pattern\n\nTurn requests into objects:\
  \ undoable, queueable, loggable.\n\n## When to Use\n\n- Undo/redo in editors\n- Queuing or logging operations\n\
  - Macro composition of actions\n\n## Example (Java)\n\n```java\npublic interface Command {\n    void\
  \ execute();\n    void undo();\n}\n\npublic class AddTextCommand implements Command {\n    private final\
  \ StringBuilder doc;\n    private final String text;\n\n    public AddTextCommand(StringBuilder doc,\
  \ String text) {\n        this.doc = doc;\n        this.text = text;\n    }\n\n    public void execute()\
  \ { doc.append(text); }\n    public void undo() {\n        int start = doc.length() - text.length();\n\
  \        doc.delete(start, doc.length());\n    }\n}\n\npublic class History {\n    private final Deque<Command>\
  \ undoStack = new ArrayDeque<>();\n\n    public void push(Command c) { c.execute(); undoStack.push(c);\
  \ }\n    public void undo() { undoStack.pop().undo(); }\n}\n```\n\n## Test\n\n```java\n@Test\nvoid addAndUndo()\
  \ {\n    var doc = new StringBuilder();\n    var h = new History();\n    h.push(new AddTextCommand(doc,\
  \ \"hello\"));\n    h.push(new AddTextCommand(doc, \" world\"));\n    assertThat(doc.toString()).isEqualTo(\"\
  hello world\");\n    h.undo();\n    assertThat(doc.toString()).isEqualTo(\"hello\");\n}\n```\n\n```bash\n\
  ./gradlew test --tests 'com.example.command.HistoryTest'\n```\n\n## Best practices\n\n- Commands are\
  \ pure intent; state lives in receivers.\n- Make commands serializable for queues and journals.\n- Implement\
  \ undo as inverse ops, not snapshots, for large state.\n- Test execute/undo pairs for every command.\n\
  \n## Testing\n\nVerify execute-then-undo returns exact prior state.\n\n## Capabilities\n\n### java-gradle\n\
  Implement and test Command pattern examples.\n\n**Commands:**\n- `gradle init --type java-library --dsl\
  \ groovy --test-framework junit-jupiter`\n- `gradle wrapper`\n- `./gradlew build`\n- `./gradlew test\
  \ --tests 'com.example.command.*'`\n- `./gradlew run`\n\n**Examples:**\n- gradle init --type java-application\
  \ --test-framework junit-jupiter\n- ./gradlew test --tests 'com.example.command.HistoryTest' --info\n\
  - ./gradlew build -x test"
prompt: Act as Command and handle the task per the instructions.
