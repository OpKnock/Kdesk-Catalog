instructions: "Use ConnectRPC in browser and TypeScript clients: @connectrpc/connect-web with buf-generated\
  \ stubs.\n\n## Agentic Workflow: Read -> Reason -> Act (connectrpc-web)\n\nYou are **Connectrpc Web**\
  \ (api/general) — a sub-agent that **Reads, Reasons, and Acts** via `allowed-tools`.\n\n### 1. Read\
  \ — api context for `connectrpc-web`\n- Domain: Use ConnectRPC in browser and TypeScript clients: @connectrpc/connect-web\
  \ with buf-generated stubs.\n- **web-client**: Create a TypeScript ConnectRPC web client and generate\
  \ stubs with buf — `npm create vite@latest my-app -- --template react-ts`\n- **browser-call**: Invoke\
  \ Connect services from the browser with CORS and unary streaming support — `npm run dev`\n- Check `knowledge`\
  \ and `prerequisites: npm, npx`\n\n### 2. Reason — think for `connectrpc-web`\n- For `web-client`: Create\
  \ a TypeScript ConnectRPC web client and generate stubs with buf — decide which checks to run\n- For\
  \ `browser-call`: Invoke Connect services from the browser with CORS and unary streaming support — decide\
  \ which checks to run\n- Evaluate trust/policy: `kdesk trust` + `kdesk doctor` patterns for your inputs\n\
  \n### 3. Act — execute with `connectrpc-web` tools\n- Tools: `Glob`, `Grep`, `Read`, `Bash`, `Npx` (see\
  \ frontmatter `tools`/`allowed-tools`)\n- Use `safe_path` for any write; record evidence (paths, checksums)\n\
  - Fingerprint: `connectrpc-web:cf026064`\n\n# ConnectRPC Web\n\nCall ConnectRPC services from browsers\
  \ and TypeScript apps.\n\n## When to Use\n\n- Building SPAs that talk to Connect/gRPC backends\n- Sharing\
  \ proto-generated types between frontend and backend\n- Streaming updates in the browser\n\n## Scaffold\n\
  \n```bash\nnpm create vite@latest my-app -- --template react-ts\ncd my-app\nnpm install @connectrpc/connect-web\
  \ @connectrpc/connect\n```\n\n## buf.gen.yaml\n\n```yaml\nversion: v2\nplugins:\n  - local: protoc-gen-es\n\
  \    out: src/gen\n    opt: target=ts\n  - local: protoc-gen-connect-es\n    out: src/gen\n    opt:\
  \ target=ts\n```\n\n```bash\nnpx buf generate\n```\n\n## Client Code\n\n```ts\nimport { createClient\
  \ } from \"@connectrpc/connect\";\nimport { createConnectTransport } from \"@connectrpc/connect-web\"\
  ;\nimport { GreetService } from \"./gen/greet/v1/greet_connect\";\n\nconst transport = createConnectTransport({\
  \ baseUrl: \"http://localhost:8080\" });\nconst client = createClient(GreetService, transport);\n\n\
  const res = await client.greet({ name: \"alice\" });\nconsole.log(res.greeting);\n```\n\n```bash\nnpm\
  \ run dev\n```\n\n## CORS\n\nThe server must send Access-Control-Allow-Origin for the dev origin, or\
  \ browser calls fail preflight.\n\n## Build\n\n```bash\nnpm run build\nnpm run preview\nnpx tsc --noEmit\n\
  ```\n\n## Testing\n\n```bash\ncurl -s -o /dev/null -w \"%{http_code}\\n\" http://localhost:5173\n```\n\
  \n## Best Practices\n\n- Generate stubs from the same proto as the backend\n- Set up Vite proxy in dev\
  \ to avoid CORS issues\n- Use createGrpcWebTransport for gRPC-Web endpoints\n- Enable streaming for\
  \ long-lived subscriptions\n- Pin generated files with buf lock\n\n## Capabilities\n\n### web-client\n\
  Create a TypeScript ConnectRPC web client and generate stubs with buf\n\n**Parameters:**\n- `app_name`\
  \ (string): Vite app name\n- `template` (string): Vite template such as react-ts, vue-ts\n\n**Commands:**\n\
  - `npm create vite@latest my-app -- --template react-ts`\n- `npm install @connectrpc/connect-web @connectrpc/connect`\n\
  - `npx buf generate`\n- `npm run dev -- --host 0.0.0.0`\n\n**Examples:**\n- npm create vite@latest my-app\
  \ -- --template react-ts && npm install @connectrpc/connect-web @connectrpc/connect\n- npx buf generate\n\
  - npm run build\n\n### browser-call\nInvoke Connect services from the browser with CORS and unary streaming\
  \ support\n\n**Parameters:**\n- `dev_port` (string): Vite dev server port, default 5173\n\n**Commands:**\n\
  - `npm run dev`\n- `npm run build`\n- `npm run preview`\n- `curl -s -o /dev/null -w \"%{http_code}\"\
  \ http://localhost:5173`\n- `npx vite --port 5173 --strictPort`\n\n**Examples:**\n- npm run dev\n- npm\
  \ run build && npm run preview\n- npx tsc --noEmit\n\n## References\n- [ConnectRPC Web Getting Started](https://connectrpc.com/docs/web/getting-started)\n\
  - [buf es plugin](https://buf.build/docs/ecosystem/es-plugins/)"
