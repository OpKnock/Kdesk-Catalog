title: Consumer Driven Contract
description: 'Implement consumer-driven contracts with Pact: publish pacts to a broker, check compatibility,
  and gate deployments with can-i-deploy.'
version: 2.0.0
instructions: "# Consumer Driven Contract\n\nImplement consumer-driven contracts with Pact: publish pacts\
  \ to a broker, check compatibility, and gate deployments with can-i-deploy.\n\n## Instructions\n\n#\
  \ Consumer-Driven Contracts\n\nLet consumers define what they expect from providers via Pact.\n\n##\
  \ When to Use\n\n- Many consumers depending on one API\n- Safe independent releases of consumer and\
  \ provider\n- Verifying compatibility before deployment\n\n## Run the Broker\n\n```bash\ndocker run\
  \ -d -p 9292:9292 pactfoundation/pact-broker:latest\n```\n\n## Consumer Creates a Pact\n\n```js\nconst\
  \ { PactV3 } = require('@pact-foundation/pact');\nconst provider = new PactV3({ consumer: 'WebApp',\
  \ provider: 'UserService' });\nawait provider.addInteraction({\n  states: [{ description: 'user exists'\
  \ }],\n  uponReceiving: 'a request for a user',\n  withRequest: { method: 'GET', path: '/users/42' },\n\
  \  willRespondWith: { status: 200, body: { id: 42, name: 'alice' } },\n});\n```\n\n## Publish\n\n```bash\n\
  npx @pact-foundation/pact-cli publish ./pacts \\\n  --broker-base-url http://localhost:9292 \\\n  --consumer-version\
  \ 1.0.0\n```\n\n## Provider Verifies\n\n```bash\nnpx @pact-foundation/pact-cli verify \\\n  --provider-base-url\
  \ http://localhost:8080 \\\n  --pact-urls http://localhost:9292/pacts/provider/UserService/consumer/WebApp/latest\n\
  ```\n\n## Gate Deployments\n\n```bash\nnpx @pact-foundation/pact-cli can-i-deploy \\\n  --pacticipant\
  \ UserService --version 2.0.0 --to-environment production\nnpx @pact-foundation/pact-cli record-deployment\
  \ \\\n  --pacticipant UserService --version 2.0.0 --environment production\n```\n\n## Testing\n\n```bash\n\
  # Break a contract: remove a field the consumer expects, then verify\nnpx @pact-foundation/pact-cli\
  \ can-i-deploy --pacticipant UserService --version 2.0.1 --to-environment production\n```\n\n## Best\
  \ Practices\n\n- Keep contract tests on the consumer side\n- Verify provider against the latest pact\
  \ of every consumer\n- Use provider states to control test data\n- Run can-i-deploy before every production\
  \ deploy\n- Record deployments to track the version matrix\n- Fail CI when verification fails\n\n##\
  \ Capabilities\n\n### pact-broker\nRun the Pact Broker and publish pacts from consumer builds\n\n**Commands:**\n\
  - `docker run -d -p 9292:9292 pactfoundation/pact-broker:latest`\n- `npx @pact-foundation/pact-cli publish\
  \ ./pacts --broker-base-url http://localhost:9292 --consumer-version 1.0.0`\n- `npx @pact-foundation/pact-cli\
  \ list-latest-pact-versions --broker-base-url http://localhost:9292`\n- `curl -s http://localhost:9292/\
  \ | grep -i pact`\n\n**Examples:**\n- npx @pact-foundation/pact-cli publish ./pacts --broker-base-url\
  \ http://localhost:9292 --consumer-version 1.0.0\n- npx @pact-foundation/pact-cli list-latest-pact-versions\
  \ --broker-base-url http://localhost:9292\n- curl -s http://localhost:9292/pacts/provider/UserService/consumer/WebApp/version/1.0.0\
  \ | jq '.interactions | length'\n\n### deployment-gating\nCheck compatibility and gate deployments with\
  \ can-i-deploy\n\n**Commands:**\n- `npx @pact-foundation/pact-cli can-i-deploy --pacticipant UserService\
  \ --version 2.0.0 --to-environment production`\n- `npx @pact-foundation/pact-cli can-i-deploy --pacticipant\
  \ WebApp --version 1.0.0 --to-environment production`\n- `npx @pact-foundation/pact-cli record-deployment\
  \ --pacticipant UserService --version 2.0.0 --environment production`\n- `npx @pact-foundation/pact-cli\
  \ can-i-deploy --pacticipant UserService --latest`\n\n**Examples:**\n- npx @pact-foundation/pact-cli\
  \ can-i-deploy --pacticipant UserService --version 2.0.0 --to-environment production\n- npx @pact-foundation/pact-cli\
  \ record-deployment --pacticipant UserService --version 2.0.0 --environment production\n- npx @pact-foundation/pact-cli\
  \ can-i-deploy --pacticipant WebApp --version 1.0.0 --to-environment production"
prompt: Act as Consumer Driven Contract and handle the task per the instructions.
