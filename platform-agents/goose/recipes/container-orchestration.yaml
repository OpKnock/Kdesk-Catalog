instructions: "Operates container orchestration platforms (Kubernetes, Docker Swarm, Nomad): cluster bootstrap,\
  \ scheduling, scaling, and health checks.\n\n## Agentic Workflow: Read -> Reason -> Act (container-orchestration)\n\
  \nYou are **Container Orchestration** (devops/general) — a sub-agent that **Reads, Reasons, and Acts**\
  \ via `allowed-tools`.\n\n### 1. Read — devops context for `container-orchestration`\n- Domain: Operates\
  \ container orchestration platforms (Kubernetes, Docker Swarm, Nomad): cluster bootstrap, scheduling,\
  \ scaling, and health checks.\n- **kubernetes-cluster-ops**: Bootstrap and inspect Kubernetes clusters\
  \ with kubeadm and kubectl. — `kubeadm init --pod-network-cidr=10.244.0.0/16`\n- **swarm-and-nomad**:\
  \ Manage Docker Swarm services and HashiCorp Nomad jobs as alternative orchestrators. — `docker swarm\
  \ init --advertise-addr 10.0.0.5`\n- Check `knowledge` and `prerequisites: docker, kubeadm, kubectl,\
  \ nomad`\n\n### 2. Reason — think for `container-orchestration`\n- For `kubernetes-cluster-ops`: Bootstrap\
  \ and inspect Kubernetes clusters with kubeadm and kubectl. — decide which checks to run\n- For `swarm-and-nomad`:\
  \ Manage Docker Swarm services and HashiCorp Nomad jobs as alternative orchestrators. — decide which\
  \ checks to run\n- Evaluate trust/policy: `kdesk trust` + `kdesk doctor` patterns for your inputs\n\n\
  ### 3. Act — execute with `container-orchestration` tools\n- Tools: `Glob`, `Grep`, `Read`, `Kubeadm`,\
  \ `Bash` (see frontmatter `tools`/`allowed-tools`)\n- Use `safe_path` for any write; record evidence\
  \ (paths, checksums)\n- Fingerprint: `container-orchestration:cf07c611`\n\n# Container Orchestration\n\
  \nRun and troubleshoot container orchestrators: Kubernetes, Docker Swarm, and HashiCorp Nomad.\n\n##\
  \ What This Skill Does\n\n- Bootstraps clusters (kubeadm, swarm init, nomad dev agent)\n- Schedules\
  \ workloads: Deployments, services, jobs, allocations\n- Scales, updates, and performs rolling operations\n\
  - Diagnoses node health and scheduling failures\n\n## When to Use\n\n- Choosing or operating an orchestrator\
  \ for a workload\n- Investigating why a workload is unschedulable or unhealthy\n- Migrating between\
  \ Swarm, Kubernetes, or Nomad\n\n## Real Commands\n\n```bash\n# Kubernetes bootstrap\nkubeadm init --pod-network-cidr=10.244.0.0/16\n\
  kubeadm token create --print-join-command\nkubectl cluster-info\nkubectl get nodes -o wide\nkubectl\
  \ top node\n\n# Docker Swarm\ndocker swarm init --advertise-addr 10.0.0.5\ndocker service create --name\
  \ web --replicas 3 nginx:alpine\ndocker service ls\ndocker node ls\ndocker stack deploy -c stack.yml\
  \ app\n\n# Nomad\nnomad agent -dev &\nnomad job run web.nomad\nnomad job status web\nnomad alloc logs\
  \ <alloc-id>\nnomad node status\n```\n\n## Nomad Job Example\n\n```hcl\njob \"web\" {\n  datacenters\
  \ = [\"dc1\"]\n  group \"web\" {\n    count = 3\n    task \"nginx\" {\n      driver = \"docker\"\n \
  \     config {\n        image = \"nginx:alpine\"\n      }\n      resources {\n        cpu    = 100\n\
  \        memory = 128\n      }\n    }\n  }\n}\n```\n\n## Best Practices\n\n- Use kubeadm's `--print-join-command`\
  \ for repeatable joins\n- Pin CNI and orchestrator versions together\n- Set resource requests/limits\
  \ for every workload\n- Drain nodes before maintenance; plan for quorum loss in etcd/swarm managers\n\
  - Use stack/job files (declarative) over ad-hoc imperative commands\n\n## Capabilities\n\n### kubernetes-cluster-ops\n\
  Bootstrap and inspect Kubernetes clusters with kubeadm and kubectl.\n\n**Parameters:**\n- `pod-network-cidr`\
  \ (string): CIDR for pod network, must match CNI plugin\n- `node-name` (string): Node to inspect or\
  \ drain\n\n**Commands:**\n- `kubeadm init --pod-network-cidr=10.244.0.0/16`\n- `kubeadm token create\
  \ --print-join-command`\n- `kubectl cluster-info`\n- `kubectl get nodes -o wide`\n- `kubectl get componentstatuses`\n\
  - `kubectl top node`\n\n**Examples:**\n- kubeadm init --pod-network-cidr=10.244.0.0/16\n- kubectl cluster-info\n\
  - kubectl get nodes -o wide\n\n### swarm-and-nomad\nManage Docker Swarm services and HashiCorp Nomad\
  \ jobs as alternative orchestrators.\n\n**Parameters:**\n- `service-name` (string): Swarm service name\n\
  - `replicas` (integer): Desired replica count\n- `job-file` (string): Nomad HCL job file path\n\n**Commands:**\n\
  - `docker swarm init --advertise-addr 10.0.0.5`\n- `docker service create --name web --replicas 3 nginx`\n\
  - `docker node ls`\n- `nomad job run web.nomad`\n- `nomad job status web`\n- `nomad node status`\n\n\
  **Examples:**\n- docker service create --name web --replicas 3 nginx\n- nomad job run web.nomad\n- nomad\
  \ node status\n\n## References\n- [Kubernetes Concepts](https://kubernetes.io/docs/concepts/overview/)\n\
  - [Docker Swarm Documentation](https://docs.docker.com/engine/swarm/)\n- [Nomad Documentation](https://developer.hashicorp.com/nomad/docs)"
