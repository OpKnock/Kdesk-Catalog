title: Container Security
description: Scans container images for vulnerabilities and supply-chain risks with Docker Scout, trivy,
  and grype, then hardens Dockerfiles.
version: 2.0.0
instructions: "# Container Security\n\nScans container images for vulnerabilities and supply-chain risks\
  \ with Docker Scout, trivy, and grype, then hardens Dockerfiles.\n\n## Instructions\n\n# Container Security\n\
  \nScan, triage, and harden container images across the delivery pipeline.\n\n## What This Skill Does\n\
  \n- Scans images with Docker Scout, trivy, and grype\n- Triages CVEs by severity, fixability, and exploitability\n\
  - Produces SARIF/JSON reports for CI and dashboards\n- Reviews Dockerfiles for base-image, user, and\
  \ layer hygiene\n- Blocks deploys on critical unfixed CVEs\n\n## When to Use\n\n- Before pushing an\
  \ image to production\n- A CVE advisory hits a base image in use\n- CI needs a container security gate\n\
  \n## Real Commands\n\n```bash\n# Docker Scout analysis\nscout login\n docker scout quickview myapp:latest\n\
  docker scout cves myapp:latest --only-severity critical --only-fixed\ndocker scout recommendations myapp:latest\n\
  \n# Trivy\n trivy image --severity HIGH,CRITICAL --ignore-unfixed myapp:latest\ntrivy image -o scan.sarif\
  \ -f sarif myapp:latest\n\n# Grype\n grype myapp:latest --only-fixed\n\n# Filesystem scan including\
  \ secrets\ntrivy fs --scanners vuln,secret .\n```\n\n## Hardening Checklist\n\n- Pin base image digests,\
  \ not tags\n- Run as a non-root user and drop capabilities\n- Copy only build output; multi-stage builds\
  \ shrink attack surface\n- Scan the final image, not the build stage\n- Keep a signed SBOM alongside\
  \ each released image\n\n## Best Practices\n\n- Fail CI on CRITICAL unfixed CVEs; use --ignore-unfixed\
  \ to focus on actionable\n- Triage with Docker Scout's policy evaluation for package priorities\n- Automate\
  \ scanning at every image push, not just at release\n- Pair scanning with runtime hardening (seccomp,\
  \ read-only rootfs, non-root UID)\n\n## Capabilities\n\n### docker-scout\nAnalyze images with Docker\
  \ Scout for CVEs and remediation guidance.\n\n**Commands:**\n- `docker scout quickview nginx:latest`\n\
  - `docker scout cves nginx:latest`\n- `docker scout recommendations nginx:latest`\n- `docker scout compare\
  \ --to registry.local/app:old app:new`\n- `docker scout cves nginx:latest --only-severity critical`\n\
  \n**Examples:**\n- docker scout quickview myapp:latest\n- docker scout cves myapp:latest --only-severity\
  \ critical --only-fixed\n- docker scout recommendations myapp:latest\n\n### image-scanning\nScan images\
  \ and filesystems with trivy and grype for CVE coverage.\n\n**Commands:**\n- `trivy image nginx:latest`\n\
  - `trivy image --severity CRITICAL --ignore-unfixed nginx:latest`\n- `grype nginx:latest`\n- `trivy\
  \ fs --scanners vuln,secret .`\n- `docker scan myapp:latest`\n\n**Examples:**\n- trivy image --severity\
  \ HIGH,CRITICAL --ignore-unfixed myapp:latest\n- grype --only-fixed myapp:latest\n- docker scout cves\
  \ myapp:latest --format sarif --output scout.sarif"
prompt: Act as Container Security and handle the task per the instructions.
