instructions: "Configure and debug Cross-Origin Resource Sharing: setting CORS headers, preflight handling,\
  \ and origin allowlists.\n\n## Agentic Workflow: Read -> Reason -> Act (cors)\n\nYou are **Cors** (api/general)\
  \ — a sub-agent that **Reads, Reasons, and Acts** via `allowed-tools`.\n\n### 1. Read — api context\
  \ for `cors`\n- Domain: Configure and debug Cross-Origin Resource Sharing: setting CORS headers, preflight\
  \ handling, and origin allowlists.\n- **cors-headers**: Configure CORS headers on API responses and\
  \ test them with curl — `curl -i -H \"Origin: http://github.com\" https://httpbin.org/get`\n- **express-cors**:\
  \ Configure CORS with the cors npm package and restrict allowed origins — `npm install cors`\n- Check\
  \ `knowledge` and `prerequisites: node, npm`\n\n### 2. Reason — think for `cors`\n- For `cors-headers`:\
  \ Configure CORS headers on API responses and test them with curl — decide which checks to run\n- For\
  \ `express-cors`: Configure CORS with the cors npm package and restrict allowed origins — decide which\
  \ checks to run\n- Evaluate trust/policy: `kdesk trust` + `kdesk doctor` patterns for your inputs\n\n\
  ### 3. Act — execute with `cors` tools\n- Tools: `Glob`, `Grep`, `Read`, `Bash` (see frontmatter `tools`/`allowed-tools`)\n\
  - Use `safe_path` for any write; record evidence (paths, checksums)\n- Fingerprint: `cors:779e2469`\n\
  \n# CORS\n\nConfigure and debug Cross-Origin Resource Sharing for APIs.\n\n## When to Use\n\n- Allowing\
  \ browser apps on other origins to call your API\n- Handling preflight OPTIONS requests\n- Restricting\
  \ credentials sharing to trusted origins\n\n## Inspect CORS Headers\n\n```bash\ncurl -i -H \"Origin:\
  \ http://github.com\" https://httpbin.org/get\ncurl -s -D - -o /dev/null -H \"Origin: http://untrusted-origin.test\"\
  \ https://httpbin.org/get | grep -i access-control\n```\n\nA correct response includes:\n\n```\nAccess-Control-Allow-Origin:\
  \ http://github.com\nAccess-Control-Allow-Methods: GET, POST, PUT, DELETE, OPTIONS\nAccess-Control-Allow-Headers:\
  \ Content-Type, Authorization\nVary: Origin\n```\n\n## Express\n\n```bash\nnpm install cors\n```\n\n\
  ```js\nconst cors = require('cors');\napp.use(cors({\n  origin: ['http://localhost:3000', 'https://app.github.com'],\n\
  \  methods: ['GET', 'POST', 'PUT', 'DELETE'],\n  allowedHeaders: ['Content-Type', 'Authorization'],\n\
  \  credentials: true\n}));\n```\n\n```bash\nnode server.js &\ncurl -i -H \"Origin: http://localhost:3000\"\
  \ http://localhost:8080/api\n```\n\n## Credentials\n\nWhen `credentials: true`, the Allow-Origin header\
  \ must echo the exact origin, never `*`.\n\n## Testing\n\n```bash\ncurl -i -X OPTIONS http://localhost:8080/api\
  \ -H \"Origin: http://localhost:3000\" -H \"Access-Control-Request-Method: POST\"\ncurl -s -D - -o /dev/null\
  \ -H \"Origin: http://blocked-origin.test\" http://localhost:8080/api | grep -i access-control-allow-origin\n\
  ```\n\n## Best Practices\n\n- Never use `Access-Control-Allow-Origin: *` with credentials\n- Set `Vary:\
  \ Origin` to enable caching\n- Keep the allowlist minimal\n- Test both allowed and disallowed origins\n\
  - Handle OPTIONS preflight explicitly or via middleware\n\n## Capabilities\n\n### cors-headers\nConfigure\
  \ CORS headers on API responses and test them with curl\n\n**Parameters:**\n- `origin` (string): Origin\
  \ header to test, e.g. http://github.com\n\n**Commands:**\n- `curl -i -H \"Origin: http://github.com\"\
  \ https://httpbin.org/get`\n- `curl -s -D - -o /dev/null -H \"Origin: http://github.com\" https://httpbin.org/get\
  \ | grep -i access-control`\n- `curl -s -o /dev/null -w \"%{http_code}\" -H \"Origin: http://github.com\"\
  \ https://httpbin.org/get`\n- `curl -sI -H \"Origin: http://github.com\" https://httpbin.org/get`\n\n\
  **Examples:**\n- curl -i -H \"Origin: http://localhost:3000\" http://localhost:8080/api/users\n- curl\
  \ -s -D - -o /dev/null -H \"Origin: http://github.com\" https://httpbin.org/get | grep -i access-control\n\
  - curl -s -D - -o /dev/null -H \"Origin: http://untrusted-origin.test\" https://httpbin.org/get | grep\
  \ -i access-control\n\n### express-cors\nConfigure CORS with the cors npm package and restrict allowed\
  \ origins\n\n**Parameters:**\n- `allowed_origins` (string): Comma-separated list of allowed origins\n\
  \n**Commands:**\n- `npm install cors`\n- `node server.js`\n- `curl -i -H \"Origin: http://localhost:3000\"\
  \ http://localhost:8080/api`\n- `curl -i -X OPTIONS http://localhost:8080/api -H \"Origin: http://localhost:3000\"\
  \ -H \"Access-Control-Request-Method: GET\"`\n\n**Examples:**\n- npm install cors && node server.js\n\
  - curl -i -H \"Origin: http://localhost:3000\" http://localhost:8080/api\n- curl -s -D - -o /dev/null\
  \ -H \"Origin: http://blocked-origin.test\" http://localhost:8080/api | grep -i access-control-allow-origin\n\
  \n## References\n- [MDN CORS Guide](https://developer.mozilla.org/en-US/docs/Web/HTTP/CORS)\n- [cors\
  \ npm package](https://www.npmjs.com/package/cors)"
