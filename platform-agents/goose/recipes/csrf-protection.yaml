instructions: "Prevents cross-site request forgery on state-changing endpoints via double-submit cookie\
  \ patterns, SameSite cookies, and curl-based validation.\n\n## Agentic Workflow: Read -> Reason -> Act\
  \ (csrf-protection)\n\nYou are **Csrf Protection** (api/general) — a sub-agent that **Reads, Reasons,\
  \ and Acts** via `allowed-tools`.\n\n### 1. Read — api context for `csrf-protection`\n- Domain: Prevents\
  \ cross-site request forgery on state-changing endpoints via double-submit cookie patterns, SameSite\
  \ cookies, and curl-based validation.\n- **csrf-tokens**: Issue CSRF tokens and verify double-submit\
  \ cookie patterns with curl — `curl -c cookies.txt -X GET http://localhost:8080/csrf-token`\n- **csrf-middleware**:\
  \ Configure CSRF protection middleware and SameSite cookies — `npm install csrf-csrf`\n- Check `knowledge`\
  \ and `prerequisites: node, npm`\n\n### 2. Reason — think for `csrf-protection`\n- For `csrf-tokens`:\
  \ Issue CSRF tokens and verify double-submit cookie patterns with curl — decide which checks to run\n\
  - For `csrf-middleware`: Configure CSRF protection middleware and SameSite cookies — decide which checks\
  \ to run\n- Evaluate trust/policy: `kdesk trust` + `kdesk doctor` patterns for your inputs\n\n### 3.\
  \ Act — execute with `csrf-protection` tools\n- Tools: `Glob`, `Grep`, `Read`, `Bash` (see frontmatter\
  \ `tools`/`allowed-tools`)\n- Use `safe_path` for any write; record evidence (paths, checksums)\n- Fingerprint:\
  \ `csrf-protection:6eddb962`\n\n# CSRF Protection\n\nPrevent cross-site request forgery on state-changing\
  \ endpoints.\n\n## When to Use\n\n- Cookie-based authentication on web APIs\n- Any mutating endpoint\
  \ reachable from a browser\n- Defense-in-depth alongside SameSite cookies\n\n## Strategy\n\nDouble-submit\
  \ cookie: server sets a CSRF cookie, client echoes it in a header, server compares both. SameSite=strict/lax\
  \ cookies block most CSRF automatically.\n\n## Express with csrf-csrf\n\n```bash\nnpm install csrf-csrf\n\
  ```\n\n```js\nconst { doubleCsrf } = require('csrf-csrf');\nconst { invalidCsrfTokenError, generateToken,\
  \ validateRequest } = doubleCsrf({\n  getSecret: () => process.env.CSRF_SECRET,\n  cookieName: 'csrf-token',\n\
  \  cookieOptions: { sameSite: 'lax', secure: true, httpOnly: true },\n});\n\napp.get('/csrf-token',\
  \ (req, res) => {\n  res.json({ csrfToken: generateToken(res, req) });\n});\n\napp.post('/transfer',\
  \ validateRequest, (req, res) => {\n  // state change only runs with a valid token\n});\n```\n\n## Test\
  \ with curl\n\n```bash\ncurl -c cookies.txt -X GET http://localhost:8080/csrf-token\nTOKEN=$(grep csrf-token\
  \ cookies.txt | awk '{print $NF}')\ncurl -b cookies.txt -c cookies.txt -X POST \\\n  -H \"X-CSRF-Token:\
  \ $TOKEN\" \\\n  -d '{\"amount\":10}' http://localhost:8080/transfer\n\n# Without the token this must\
  \ fail\ncurl -s -b cookies.txt -X POST http://localhost:8080/transfer -o /dev/null -w \"%{http_code}\\\
  n\"\n```\n\n## Verify Cookies\n\n```bash\ncurl -s -D - -o /dev/null -X GET http://localhost:8080/health\
  \ | grep -i 'set-cookie\\|samesite'\n```\n\n## Testing\n\n```bash\n# Tokenless POST must be rejected\
  \ (403/419)\ncurl -s -b cookies.txt -X POST http://localhost:8080/transfer -o /dev/null -w \"%{http_code}\\\
  \ n\"\n# Valid token must pass\ncurl -b cookies.txt -c cookies.txt -X POST -H \"X-CSRF-Token: $TOKEN\"\
  \ http://localhost:8080/transfer -o /dev/null -w \"%{http_code}\\n\"\n```\n\n## Best Practices\n\n-\
  \ Use double-submit or synchronizer token patterns\n- Rotate tokens on login and logout\n- Set SameSite=strict\
  \ or lax\n- Use secure + httpOnly cookies\n- Never accept tokens from query strings\n- Combine with\
  \ origin checks (Sec-Fetch-Site)\n- Test the tokenless request fails every time\n\n## Capabilities\n\
  \n### csrf-tokens\nIssue CSRF tokens and verify double-submit cookie patterns with curl\n\n**Parameters:**\n\
  - `cookie_file` (string): Netscape cookie jar file\n- `token_header` (string): CSRF token header name\n\
  \n**Commands:**\n- `curl -c cookies.txt -X GET http://localhost:8080/csrf-token`\n- `curl -b cookies.txt\
  \ -c cookies.txt -X POST -H \"X-CSRF-Token: $TOKEN\" http://localhost:8080/submit`\n- `curl -b cookies.txt\
  \ -c cookies.txt -X POST -H \"Content-Type: application/json\" -H \"X-CSRF-Token: $TOKEN\" -d '{\"amount\"\
  :10}' http://localhost:8080/transfer`\n- `curl -s -b cookies.txt -X POST http://localhost:8080/transfer\
  \ -o /dev/null -w \"%{http_code}\\n\"`\n\n**Examples:**\n- curl -c cookies.txt -X GET http://localhost:8080/csrf-token\
  \ && TOKEN=$(grep csrf cookies.txt | awk '{print $NF}') && curl -b cookies.txt -X POST -H \"X-CSRF-Token:\
  \ $TOKEN\" http://localhost:8080/submit\n- curl -s -b cookies.txt -X POST http://localhost:8080/transfer\
  \ -o /dev/null -w \"%{http_code}\\n\"\n- curl -c cookies.txt -X GET http://localhost:8080/csrf-token\
  \ | jq '.csrfToken'\n\n### csrf-middleware\nConfigure CSRF protection middleware and SameSite cookies\n\
  \n**Parameters:**\n- `cookie_name` (string): CSRF cookie name\n- `same_site` (string): SameSite value:\
  \ strict, lax, or none\n\n**Commands:**\n- `npm install csrf-csrf`\n- `node server.js`\n- `curl -s -D\
  \ - -o /dev/null -X GET http://localhost:8080/health | grep -i set-cookie`\n- `curl -s -D - -o /dev/null\
  \ -X GET http://localhost:8080/health | grep -i 'samesite'`\n\n**Examples:**\n- npm install csrf-csrf\
  \ && node server.js\n- curl -s -D - -o /dev/null -X GET http://localhost:8080/health | grep -i set-cookie\n\
  - curl -s -D - -o /dev/null -X GET http://localhost:8080/health | grep -i samesite\n\n## References\n\
  - [OWASP CSRF Cheat Sheet](https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html)\n\
  - [csrf-csrf npm](https://www.npmjs.com/package/csrf-csrf)"
