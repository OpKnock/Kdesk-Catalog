version: 2.0.0
instructions: "# cypress\n\nOpen, run, and filter it tests. Parallelize runs and record to it Cloud. Component\
  \ testing and debugging helpers. recording.\n\n## Instructions\n\n# Cypress\n\nFast, reliable E2E and\
  \ component testing for web apps.\n\n## What This Skill Does\n\n- Runs E2E suites in headed/interactive\
  \ mode\n- Filters specs and tests with CLI flags\n- Parallelizes runs and records to Cypress Cloud\n\
  - Writes resilient selectors and custom commands\n\n## When to Use\n\n- Full user-journey regression\
  \ suites\n- Visual and component testing\n- PR gating for web frontends\n\n## Real Commands\n\n```bash\n\
  # Interactive and headless\nnpx cypress open\nnpx cypress run --browser chrome\nnpx cypress run --spec\
  \ cypress/e2e/login.cy.js\n\n# Cloud and parallel\nnpx cypress run --record --key $CYPRESS_RECORD_KEY\n\
  npx cypress run --parallel --record --group chrome\n\n# Component and config\nnpx cypress run --component\n\
  npx cypress run --env grep='login'\nnpx cypress run --config video=false\n```\n\n## Sample Test\n\n\
  ```js\ndescribe('login', () => {\n  it('logs in with valid credentials', () => {\n    cy.visit('/login');\n\
  \    cy.get('[data-cy=email]').type('alice@example.com');\n    cy.get('[data-cy=password]').type('secret');\n\
  \    cy.get('[data-cy=submit]').click();\n    cy.url().should('include', '/dashboard');\n  });\n});\n\
  ```\n\n## Best Practices\n\n- Use data-cy attributes; never CSS classes in selectors\n- Keep tests independent\
  \ with cy.intercept stubs\n- Run a smoke subset on PRs, full suite nightly\n- Record to Cypress Cloud\
  \ for flake analytics\n- Parallelize across machines for large suites\n\n## Capabilities\n\n### cypress-runs\n\
  Open, run, and filter Cypress tests.\n\n**Commands:**\n- `npx cypress open`\n- `npx cypress run`\n-\
  \ `npx cypress run --browser chrome`\n- `npx cypress run --spec cypress/e2e/login.cy.js`\n- `npx cypress\
  \ run --headed`\n\n**Examples:**\n- npx cypress open\n- npx cypress run --spec cypress/e2e/login.cy.js\n\
  - npx cypress run --browser edge\n\n### parallel-and-record\nParallelize runs and record to Cypress\
  \ Cloud.\n\n**Commands:**\n- `npx cypress run --record --key $CYPRESS_RECORD_KEY`\n- `npx cypress run\
  \ --parallel --record`\n- `npx cypress run --group chrome --browser chrome`\n- `npx cypress run --tag\
  \ smoke`\n\n**Examples:**\n- npx cypress run --record --key $CYPRESS_RECORD_KEY\n- npx cypress run --parallel\
  \ --record --group chrome\n- npx cypress run --tag smoke\n\n### component-and-debug\nComponent testing\
  \ and debugging helpers.\n\n**Commands:**\n- `npx cypress run --component`\n- `npx cypress run --env\
  \ grep='login'`\n- `npx cypress run --config video=false`\n- `cypress verify`\n\n**Examples:**\n- npx\
  \ cypress run --component\n- npx cypress run --env grep='login'\n- npx cypress run --config video=false"
prompt: Act as cypress and handle the task per the instructions.
