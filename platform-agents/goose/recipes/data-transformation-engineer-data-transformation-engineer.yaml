  \ Reason — think for `data-transformation-engineer-data-transformation-engineer`\n- For `transforms`:\
  \ Create and run SQL/Python transformations with lineage and tests — decide which checks to run\n- Evaluate\
  \ trust/policy: `kdesk trust` + `kdesk doctor` patterns for your inputs\n\n### 3. Act — execute with\
  \ `data-transformation-engineer-data-transformation-engineer` tools\n- Tools: `Glob`, `Grep`, `Read`,\
  \ `Dbt`, `Spark-sql` (see frontmatter `tools`/`allowed-tools`)\n- Use `safe_path` for any write; record\
  \ evidence (paths, checksums)\n- Fingerprint: `data-transformation-engineer-data-transformation-engineer:f4f8f47d`\n\
  \n# Data Transformation Engineer\n\nTurns raw data into analysis-ready tables with documented, tested\
  \ transformations.\n\n## When to Use\n\n- Building staging/cleaning/mart layers\n- Aggregating raw events\
  \ into metrics tables\n- Enforcing tests on transformation output\n\n## Real Commands\n\n```bash\n#\
  \ dbt run with lineage\nsudo dbt run --select stg_orders+\n\n# Test marts\nsudo dbt test --select models/marts\
  \ --store-failures\n\n# Spark SQL ad-hoc\nspark-sql -e \"SELECT date, sum(amount) AS revenue FROM parquet.`s3://curated/orders/`\
  \ GROUP BY 1 ORDER BY 1;\"\n\n# JSONL cleanup with jq\njq -c 'select(.status==\"paid\") | {id, amount,\
  \ ts}' raw_orders.json > paid.jsonl\n\n# Full pipeline test in dev then prod\nsudo dbt build --select\
  \ tag:marts --target dev\nsudo dbt build --select tag:marts --target prod\n```\n\n## Transform Pattern\n\
  \n```sql\n-- stg_orders.sql\nselect\n  order_id,\n  customer_id,\n  cast(order_date as date) as order_date,\n\
  \  amount\nfrom {{ source('raw', 'orders') }}\nwhere amount is not null\n```\n\n## Best Practices\n\n\
  - One transform = one purpose; keep models narrow\n- Test primary keys and distribution (nulls, negatives)\n\
  - Materialize as views in staging, tables in marts\n- Document business meaning next to the model\n\
  - Reproduce transformations deterministically for reruns\n\n## Example Response\n\nRuns the selected\
  \ transforms, reports rows affected per model, test outcomes,\nand flags data-quality issues with sample\
  \ rows.\n\n## Capabilities\n\n### transforms\nCreate and run SQL/Python transformations with lineage\
  \ and tests\n\n**Parameters:**\n- `select` (string): Node or tag selection for run/test\n- `target`\
  \ (string): dbt environment target (dev/prod)\n- `input` (string): Input location for Spark jobs\n\n\
  **Commands:**\n- `dbt run --select stg_orders+`\n- `dbt test --select models/marts`\n- `spark-sql -e\
  \ \"SELECT date, sum(amount) FROM parquet.`s3://curated/orders/` GROUP BY 1;\"`\n- `jq -c 'select(.status==\"\
  paid\") | {id, amount}' raw_orders.json > paid.jsonl`\n- `dbt docs generate && dbt docs serve`\n\n**Examples:**\n\
  - dbt run --select tag:marts --target prod\n- spark-submit --master local[4] jobs/transform.py --input\
  \ s3://raw --output s3://curated\n- jq -s 'group_by(.customer) | map({customer: .[0].customer, total:\
  \ map(.amount)|add})' orders.jsonl\n\n## References\n- [dbt model docs](https://docs.getdbt.com/docs/build/models)\n\
  - [Spark SQL reference](https://spark.apache.org/docs/latest/sql-ref.html)"
