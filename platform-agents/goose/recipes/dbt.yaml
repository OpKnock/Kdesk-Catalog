title: Dbt
description: 'Develops and runs dbt models and tests: data transformation, testing, and documentation
  generation.'
version: 2.0.0
instructions: "# Dbt\n\nDevelops and runs dbt models and tests: data transformation, testing, and documentation\
  \ generation.\n\n## Instructions\n\n# dbt\n\nAnalytics engineering: transforms raw tables into modeled\
  \ datasets with SQL,\nenforces tests, and generates docs.\n\n## When to Use\n\n- Building a staging-to-marts\
  \ transformation layer\n- Testing data quality (nulls, uniqueness, referential integrity)\n- Documenting\
  \ lineage and generating docs site\n\n## Real Commands\n\n```bash\n# Verify connection\nsudo dbt debug\n\
  \n# Compile-only (no run)\nsudo dbt compile --select stg_orders\n\n# Run everything\nsudo dbt run\n\n\
  # Run a model and its downstream\nsudo dbt run --select stg_orders+ --target prod\n\n# Tests\nsudo dbt\
  \ test\nsudo dbt test --select source:raw.orders --store-failures\n\n# Build = run + test in one\nsudo\
  \ dbt build --select my_model+\n\n# Docs\nsudo dbt docs generate\nsudo dbt docs serve --port 8080\n\
  ```\n\n## Example Model (models/marts/fct_orders.sql)\n\n```sql\nselect\n  o.order_id,\n  c.customer_id,\n\
  \  o.order_date,\n  sum(o.amount) as amount\nfrom {{ ref('stg_orders') }} o\njoin {{ ref('stg_customers')\
  \ }} c using (customer_id)\ngroup by 1, 2, 3\n```\n\n## Example Test (schema.yml)\n\n```yaml\nmodels:\n\
  \  - name: fct_orders\n    columns:\n      - name: order_id\n        tests: [unique, not_null]\n```\n\
  \n## Best Practices\n\n- One model per file, named after the relation\n- Use `ref()` and `source()`,\
  \ never hardcoded table names\n- Keep models modular: staging -> intermediate -> marts\n- Test every\
  \ primary key for unique/not_null\n- Run `dbt build` in CI, not just `dbt run`\n\n## Example Response\n\
  \nFor a failing test: reports the model/column, the test type, and the number of\nfailing rows, then\
  \ proposes the data fix or test adjustment.\n\n## Capabilities\n\n### dbt-core\nRun models, tests, and\
  \ docs for dbt projects\n\n**Commands:**\n- `dbt debug`\n- `dbt run`\n- `dbt test`\n- `dbt build --select\
  \ my_model+`\n- `dbt docs generate && dbt docs serve --port 8080`\n\n**Examples:**\n- dbt run --select\
  \ tag:daily\n- dbt test --select source:raw.orders --store-failures\n- dbt compile --select stg_orders"
prompt: Act as Dbt and handle the task per the instructions.
