title: ddos-protection
description: 'Mitigates DDoS attacks: rate limiting, firewall rules, CDN shielding, and attack simulation.'
version: 2.0.0
instructions: "# ddos-protection\n\nMitigates DDoS attacks: rate limiting, firewall rules, CDN shielding,\
  \ and attack simulation.\n\n## Instructions\n\n# DDoS Protection\n\nDefends services against volumetric\
  \ and application-layer attacks: edge shielding,\nrate limits, and firewall rules.\n\n## When to Use\n\
  \n- During an active attack\n- Hardening before launch (prep)\n- Validating that mitigation configs\
  \ actually work\n\n## Real Commands\n\n```bash\n# Edge: enable proxy/CDN shielding and rate limits\n\
  # (via Cloudflare API)\ncurl -s -X POST 'https://api.cloudflare.com/client/v4/zones/$ZONE/rate_limits'\
  \ \\\n  -H 'Authorization: Bearer $TOKEN' -H 'Content-Type: application/json' \\\n  -d '{\"match\":\
  \ {\"request\": {\"url\": \"*\"}}, \"threshold\": 100, \"period\": 60, \"action\": {\"mode\": \"simulate\"\
  }}'\n\n# Host: connection limit at the firewall\nsudo iptables -A INPUT -p tcp --dport 443 -m connlimit\
  \ --connlimit-above 100 -j DROP\n\n# Nginx rate limit\nsudo nginx -t && sudo nginx -s reload\n\n# Validate:\
  \ simulate traffic\nsudo ab -n 10000 -c 100 https://app.example.com/\n\n# Capture evidence\nsudo tcpdump\
  \ -i eth0 -c 5000 -w /tmp/ddos.pcap\n```\n\n## Nginx Rate Limit Config\n\n```nginx\nlimit_req_zone $binary_remote_addr\
  \ zone=api:10m rate=20r/s;\nserver {\n  location /api/ {\n    limit_req zone=api burst=40 nodelay;\n\
  \  }\n}\n```\n\n## Best Practices\n\n- Put a CDN/edge in front; never expose origin IPs\n- Rate limit\
  \ per IP and per user (auth token)\n- Use `simulate` actions first, then enforce\n- Keep origin whitelisted\
  \ to the CDN only\n- Have a runbook: edge rules + firewall + emergency scaling\n\n## Example Response\n\
  \nDuring an attack: identifies the traffic signature from pcap, applies edge + host\nmitigations, and\
  \ verifies origin pressure drops.\n\n## Capabilities\n\n### ddos-mitigation\nConfigure rate limits,\
  \ firewall rules, and verify mitigation\n\n**Commands:**\n- `iptables -A INPUT -p tcp --dport 80 -m\
  \ connlimit --connlimit-above 100 -j DROP`\n- `nginx -t && nginx -s reload`\n- `ab -n 10000 -c 100 http://localhost:8080/`\n\
  - `tcpdump -i eth0 -c 5000 -w /tmp/ddos.pcap`\n- `curl -s -X POST 'https://api.cloudflare.com/client/v4/zones/$ZONE/rate_limits'\
  \ -H 'Authorization: Bearer $TOKEN' -H 'Content-Type: application/json' -d '{\"match\":{\"request\"\
  :{\"url\":\"*\"}}}'`\n\n**Examples:**\n- iptables -L -n -v | head -30\n- wrk -t8 -c500 -d60s http://localhost:8080/\
  \ --latency\n- ufw limit ssh comment 'rate limit ssh'"
prompt: Act as ddos-protection and handle the task per the instructions.
