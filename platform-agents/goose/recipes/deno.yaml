title: Deno
description: Builds secure TypeScript services with the Deno runtime using built-in permissions, std library,
  test runner, and compilation.
version: 2.0.0
instructions: "# Deno\n\nBuilds secure TypeScript services with the Deno runtime using built-in permissions,\
  \ std library, test runner, and compilation.\n\n## Instructions\n\n# Deno\n\nSecure TypeScript runtime\
  \ with built-in tooling.\n\n## When to Use\n\n- TypeScript-first services without npm toolchain overhead\n\
  - Edge functions and serverless workloads on Deno Deploy\n- Scripts that need explicit permission grants\
  \ (network, fs)\n- Single-file tools distributed as compiled binaries\n\n## Commands\n\n```bash\n# Scaffold\n\
  deno init\n\n# Run with explicit permissions\ndeno run --allow-net main.ts\ndeno run --allow-net --allow-read=./data\
  \ main.ts\n\n# Type-check without running\ndeno check main.ts\n\n# Formatting and linting\ndeno fmt\n\
  deno fmt --check\ndeno lint\n\n# Testing\ndeno test\ndeno test --coverage\n\n# Benchmark\ndeno bench\n\
  \n# Compile to a standalone binary\ndeno compile --allow-net -o app main.ts\n\n# Task runner from deno.json\n\
  deno task dev\n```\n\n## Server Example\n\n```typescript\nDeno.serve((req) => {\n  const url = new URL(req.url);\n\
  \  return new Response(`Hello ${url.pathname}`);\n});\n```\n\n## Best Practices\n\n- Grant the narrowest\
  \ permissions: prefer --allow-net=host:port over full access\n- Put scripts and deps in deno.json; use\
  \ deno task for commands\n- Check imports with deno check --all before pushing\n- Pin import versions;\
  \ Deno supports npm: specifiers for interop\n- Use deno compile in CI to ship native binaries\n\n##\
  \ Capabilities\n\n### deno-runtime\nScaffold, run, and compile Deno projects.\n\n**Commands:**\n- `deno\
  \ init`\n- `deno run main.ts`\n- `deno run --allow-net --allow-env main.ts`\n- `deno check main.ts`\n\
  - `deno compile --allow-net -o app main.ts`\n\n**Examples:**\n- deno run --allow-net --allow-read=./data\
  \ main.ts\n- deno compile --target x86_64-unknown-linux-gnu -o app main.ts\n- deno check --all src/\n\
  \n### deno-quality\nFormat, lint, and test Deno code.\n\n**Commands:**\n- `deno fmt`\n- `deno fmt --check`\n\
  - `deno lint`\n- `deno test`\n- `deno test --coverage`\n\n**Examples:**\n- deno fmt --check src/\n-\
  \ deno lint --rules-exclude=no-explicit-any\n- deno test test/ --coverage=coverage"
prompt: Act as Deno and handle the task per the instructions.
