  \ to run\n- Evaluate trust/policy: `kdesk trust` + `kdesk doctor` patterns for your inputs\n\n### 3.\
  \ Act — execute with `dependency-injection-architect-dependency-injection-architect` tools\n- Tools:\
  \ `Glob`, `Grep`, `Read`, `Npx`, `Mvn` (see frontmatter `tools`/`allowed-tools`)\n- Use `safe_path`\
  \ for any write; record evidence (paths, checksums)\n- Fingerprint: `dependency-injection-architect-dependency-injection-architect:3453f665`\n\
  \n# Dependency Injection Architect\n\nDesigns clean DI architectures: containers, provider scopes, factory\
  \ providers,\nand testability.\n\n## When to Use\n\n- Choosing container/framework setup for a new service\n\
  - Refactoring service classes toward DI\n- Fixing scope misuse (singleton capturing request-scoped deps)\n\
  \n## Real Commands\n\n```bash\n# NestJS\nsudo npx nest new app --package-manager npm\nsudo npx nest\
  \ g resource users\nsudo npx nest g provider database\nsudo npm run build && node dist/main.js\n\n#\
  \ Spring Boot\nmvn spring-boot:run -Dspring-boot.run.profiles=dev\n# Inspect the bean graph\ncurl -s\
  \ localhost:8080/actuator/beans | jq '.contexts.application.beans | keys'\n\n# .NET\nsudo dotnet add\
  \ package Microsoft.Extensions.DependencyInjection\nsudo dotnet run --project src/App --environment\
  \ Production\n```\n\n## Scoping Rules\n\n- Singleton: shared state, stateless services\n- Request/transient:\
  \ per-call state\n- Never inject request-scoped into singleton (captive dependency)\n\n## Service Registration\
  \ Example (NestJS)\n\n```ts\n@Module({\n  providers: [\n    DatabaseService,\n    {\n      provide:\
  \ 'CONFIG',\n      useFactory: (env: EnvService) => env.getConfig(),\n      inject: [EnvService],\n\
  \    },\n  ],\n})\nexport class AppModule {}\n```\n\n## Best Practices\n\n- Depend on abstractions (interfaces),\
  \ not concretions\n- Register in composition root only\n- Use factory providers for async/conditional\
  \ dependencies\n- Keep scopes explicit and consistent\n- Test with real containers plus mocks for external\
  \ IO\n\n## Example Response\n\nDiagrams the dependency graph, identifies scope violations (captive\n\
  dependencies), and refactors the registrations with tests.\n\n## Capabilities\n\n### di-patterns\nSet\
  \ up DI containers and providers in NestJS, Spring, and .NET\n\n**Parameters:**\n- `package-manager`\
  \ (string): Package manager for nest new\n- `profiles` (string): Spring profiles to activate\n- `project`\
  \ (string): dotnet project file for run\n\n**Commands:**\n- `npx nest new app --package-manager npm`\n\
  - `npx nest g resource users`\n- `mvn spring-boot:run -Dspring-boot.run.profiles=dev`\n- `dotnet add\
  \ package Microsoft.Extensions.DependencyInjection`\n- `npm run build && node dist/main.js`\n\n**Examples:**\n\
  - npx nest g provider database\n- curl -s localhost:8080/actuator/beans | jq '.contexts.application.beans\
  \ | keys'\n- dotnet run --project src/App --environment Production\n\n## References\n- [NestJS providers\
  \ docs](https://docs.nestjs.com/fundamentals/custom-providers)\n- [Spring dependency injection](https://docs.spring.io/spring-framework/reference/core/beans.html)\n\
  - [Microsoft DI docs](https://learn.microsoft.com/en-us/dotnet/core/extensions/dependency-injection)"
