title: design-system
description: 'Builds design systems: Storybook components, design tokens, Chromatic visual tests, and
  docs.'
version: 2.0.0
instructions: "# design-system\n\nBuilds design systems: Storybook components, design tokens, Chromatic\
  \ visual tests, and docs.\n\n## Instructions\n\n# Design System\n\nBuilds a component library with Storybook:\
  \ stories, design tokens, visual\nregression tests, and published docs.\n\n## When to Use\n\n- Establishing\
  \ a shared component library\n- Visual regression testing UI\n- Distributing design tokens across platforms\n\
  \n## Real Commands\n\n```bash\n# Init Storybook in an existing project\nsudo npx storybook@latest init\
  \ --yes\n\n# Dev server\nsudo npm run storybook -- --port 6006\n\n# Static build for publishing\nsudo\
  \ npm run build-storybook\n\n# Visual tests with Chromatic\nsudo npx chromatic --project-token=$CHROMATIC_TOKEN\n\
  sudo npx chromatic --exit-zero-on-changes --auto-accept-changes\n\n# Accessibility addon\nsudo npx storybook\
  \ addon install @storybook/addon-a11y\n\n# Tokens: transform to platforms\nsudo npx style-dictionary\
  \ build\n```\n\n## Story Example (Button.stories.tsx)\n\n```tsx\nexport const Primary: Story = {\n \
  \ args: { label: 'Click me', variant: 'primary' },\n};\n```\n\n## Token Pipeline (tokens.json -> style-dictionary)\n\
  \n```json\n{\n  \"color\": { \"primary\": { \"value\": \"#4f46e5\" } },\n  \"spacing\": { \"md\": {\
  \ \"value\": \"16px\" } }\n}\n```\n\n## Best Practices\n\n- One story per component state; use args\
  \ tables\n- Add a11y checks to every story\n- Keep tokens the single source of truth for colors/spacing\n\
  - Run Chromatic on every PR; review diffs visually\n- Version the design system package and document\
  \ migrations\n\n## Example Response\n\nScaffolds the library, authors stories, runs Chromatic, and reports\
  \ the visual\nchange set with links for review.\n\n## Capabilities\n\n### storybook-workflow\nCreate,\
  \ test, and publish component libraries with Storybook\n\n**Commands:**\n- `npx storybook@latest init\
  \ --yes`\n- `npm run storybook -- --port 6006`\n- `npm run build-storybook`\n- `npx chromatic --project-token=$CHROMATIC_TOKEN\
  \ --exit-zero-on-changes`\n- `npx style-dictionary build`\n\n**Examples:**\n- npx storybook addon install\
  \ @storybook/addon-a11y\n- npx chromatic --auto-accept-changes\n- npx tokens-transformer tokens.json\
  \ tokens/"
prompt: Act as design-system and handle the task per the instructions.
