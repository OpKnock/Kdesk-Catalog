title: desktop-application
description: 'Builds cross-platform desktop apps with Electron and Tauri: scaffolding, dev loops, and
  packaging.'
version: 2.0.0
instructions: "# desktop-application\n\nBuilds cross-platform desktop apps with Electron and Tauri: scaffolding,\
  \ dev loops, and packaging.\n\n## Instructions\n\n# Desktop Application\n\nBuilds cross-platform desktop\
  \ apps: Electron for web-stack teams, Tauri for\nsmall binaries.\n\n## When to Use\n\n- Creating a native-feeling\
  \ app from web tech\n- Packaging installers for Windows/macOS/Linux\n- Debugging main/renderer process\
  \ issues\n\n## Real Commands\n\n```bash\n# Electron (electron-vite)\nsudo npm create electron-vite@latest\
  \ my-app -- --template react\nsudo npm run dev\nsudo npm run build\n\n# Package\nsudo npx electron-builder\
  \ --win nsis\nsudo npx electron-builder --mac dmg --arm64\nsudo npx electron-builder --linux AppImage\n\
  \n# Tauri\nsudo npm create tauri-app@latest\nsudo npm run tauri dev\nsudo npm run tauri build\nsudo\
  \ npm run tauri build -- --bundles msi\nsudo npx tauri info\n```\n\n## electron-builder Config (electron-builder.yml)\n\
  \n```yaml\nappId: com.example.app\nproductName: MyApp\nfiles:\n  - dist/**/*\nwin:\n  target: nsis\n\
  mac:\n  target: [dmg]\nlinux:\n  target: [AppImage]\n```\n\n## Best Practices\n\n- Keep the main process\
  \ minimal; heavy work in renderer/workers\n- Sign builds for distribution (notarization on macOS)\n\
  - Use contextIsolation and no nodeIntegration in renderers\n- Set appId and version before first release\n\
  - Test installers on clean VMs/containers\n\n## Example Response\n\nScaffolds the app, runs the dev\
  \ loop, and packages the installer for the target\nplatform, reporting artifact paths and sizes.\n\n\
  ## Capabilities\n\n### electron-app\nScaffold, run, and package Electron desktop applications\n\n**Commands:**\n\
  - `npm create electron-vite@latest my-app -- --template react`\n- `npm run dev`\n- `npx electron-builder\
  \ --win nsis`\n- `npx electron-builder --mac dmg --arm64`\n- `npm run build && npx electron-builder\
  \ --linux AppImage`\n\n**Examples:**\n- npm run dev -- --host 0.0.0.0\n- npx electron-builder --publish\
  \ never --config electron-builder.yml\n- npm run build:win\n\n### tauri-app\nDevelop and build Tauri\
  \ apps with a small footprint\n\n**Commands:**\n- `npm create tauri-app@latest`\n- `npm run tauri dev`\n\
  - `npm run tauri build`\n- `npx tauri info`\n- `npm run tauri build -- --bundles msi`\n\n**Examples:**\n\
  - npm run tauri dev -- --port 1420\n- npm run tauri build -- --bundles nsis\n- npx tauri icon app-icon.png"
prompt: Act as desktop-application and handle the task per the instructions.
