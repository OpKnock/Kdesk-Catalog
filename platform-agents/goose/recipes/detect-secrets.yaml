title: detect-secrets
description: Scans codebases for high-entropy strings and known secret patterns, maintaining a reviewed
  baseline to prevent secret leaks in CI.
version: 2.0.0
instructions: "# detect-secrets\n\nScans codebases for high-entropy strings and known secret patterns,\
  \ maintaining a reviewed baseline to prevent secret leaks in CI.\n\n## Instructions\n\n# detect-secrets\n\
  \nFind and manage secrets in code with entropy detection and baseline workflows.\n\n## What This Skill\
  \ Does\n\n- Scans for AWS keys, tokens, private keys, and high-entropy strings\n- Generates a reviewed\
  \ baseline so legacy findings are tracked, not hidden\n- Runs as a pre-commit hook to block new secrets\n\
  - Audits findings interactively and updates the baseline\n\n## When to Use\n\n- Onboarding a repo that\
  \ may contain committed secrets\n- Enforcing a no-secrets-in-diffs policy in CI\n- Investigating a potential\
  \ secret leak\n\n## Real Commands\n\n```bash\n# Initial baseline\ncd repo\ndetect-secrets scan . > .secrets.baseline\n\
  \n# Audit the baseline (mark true/false positives)\ndetect-secrets audit .secrets.baseline\n\n# CI:\
  \ fail only on NEW secrets\ndetect-secrets scan --baseline .secrets.baseline .\n\n# Pre-commit hook\
  \ on staged content\npre-commit install\ngit diff | detect-secrets-hook --baseline .secrets.baseline\
  \ --stdin\n\n# Update baseline after removing a secret\ndetect-secrets scan --update .secrets.baseline\n\
  ```\n\n## .pre-commit-config.yaml\n\n```yaml\nrepos:\n  - repo: https://github.com/Yelp/detect-secrets\n\
  \    rev: v1.5.0\n    hooks:\n      - id: detect-secrets\n        args: [\"--baseline\", \".secrets.baseline\"\
  ]\n```\n\n## Best Practices\n\n- Never delete the baseline without auditing it first\n- Rotate any secret\
  \ that already leaked before removing it from the repo\n- Keep the hook fast by excluding vendored code\
  \ and generated files\n- Run a full scan in CI weekly, hook on every commit\n- Audit with two reviewers\
  \ for new baselines in sensitive repos\n\n## Capabilities\n\n### baseline-scanning\nScan repositories\
  \ and manage the .secrets.baseline allowlist.\n\n**Commands:**\n- `detect-secrets scan . > .secrets.baseline`\n\
  - `detect-secrets scan --baseline .secrets.baseline .`\n- `detect-secrets scan --exclude-files 'tests/*'\
  \ .`\n- `detect-secrets scan --update .secrets.baseline`\n\n**Examples:**\n- detect-secrets scan . >\
  \ .secrets.baseline\n- detect-secrets scan --baseline .secrets.baseline .\n- detect-secrets scan --update\
  \ .secrets.baseline\n\n### audit-and-hooks\nAudit findings, resolve them as true/false positives, and\
  \ run pre-commit hooks.\n\n**Commands:**\n- `detect-secrets audit .secrets.baseline`\n- `detect-secrets-hook\
  \ --baseline .secrets.baseline .env`\n- `git diff | detect-secrets-hook --baseline .secrets.baseline\
  \ --stdin`\n- `pre-commit install`\n\n**Examples:**\n- detect-secrets audit .secrets.baseline\n- git\
  \ diff | detect-secrets-hook --baseline .secrets.baseline --stdin\n- pre-commit run --all-files"
prompt: Act as detect-secrets and handle the task per the instructions.
