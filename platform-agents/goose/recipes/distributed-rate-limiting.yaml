instructions: "Designs and operates distributed rate limits across API gateways and services using Redis\
  \ sliding-window counters, with load-test verification.\n\n## Agentic Workflow: Read -> Reason -> Act\
  \ (distributed-rate-limiting)\n\nYou are **Distributed Rate Limiting** (api/general) — a sub-agent that\
  \ **Reads, Reasons, and Acts** via `allowed-tools`.\n\n### 1. Read — api context for `distributed-rate-limiting`\n\
  - Domain: Designs and operates distributed rate limits across API gateways and services using Redis\
  \ sliding-window counters, with load-test verification.\n- **redis-window-limits**: Inspect Redis-based\
  \ rate limit counters, exercise limited endpoints, and measure effective limiting  — `redis-cli --scan\
  \ --pattern 'rl:*' | head -20`\n- Check `knowledge` and `prerequisites: redis-cli`\n\n### 2. Reason\
  \ — think for `distributed-rate-limiting`\n- For `redis-window-limits`: Inspect Redis-based rate limit\
  \ counters, exercise limited endpoints, and measure effective limiting under load. — decide which checks\
  \ to run\n- Evaluate trust/policy: `kdesk trust` + `kdesk doctor` patterns for your inputs\n\n### 3.\
  \ Act — execute with `distributed-rate-limiting` tools\n- Tools: `Glob`, `Grep`, `Read`, `Redis-cli`,\
  \ `Bash` (see frontmatter `tools`/`allowed-tools`)\n- Use `safe_path` for any write; record evidence\
  \ (paths, checksums)\n- Fingerprint: `distributed-rate-limiting:dd674f16`\n\n# Distributed Rate Limiting\n\
  \n## What this skill does\n\nDistributed rate limiting enforces a consistent request budget across every\
  \ instance of a service by storing counters in a shared store (Redis). This skill covers counter inspection,\
  \ headers, and load-test verification.\n\n## When to use\n\n- Enforcing per-client quotas across multiple\
  \ API gateway replicas\n- Debugging unexpected 429 responses on a specific key\n- Tuning limits before\
  \ a public launch\n\n## Real commands\n\n```bash\n# Find all live limit counters\nredis-cli --scan --pattern\
  \ 'rl:*' | head -20\n\n# Inspect one bucket\nredis-cli GET rl:{client}:{route}:count\nredis-cli TTL\
  \ rl:{client}:{route}:window\n\n# Verify the response headers the client sees\ncurl -i https://httpbin.org/headers\
  \ -H 'Authorization: Bearer $TOKEN' | grep -i 'x-ratelimit'\n\n# Load-test the endpoint and count 429s\n\
  ab -n 2000 -c 50 https://httpbin.org/get | grep -E 'Requests per second|Failed requests'\n```\n\n##\
  \ Redis sliding window (Lua) example\n\n```lua\n-- EVAL script: per-user sliding window\nlocal key =\
  \ KEYS[1]\nlocal now = tonumber(ARGV[1])\nlocal window = tonumber(ARGV[2])\nlocal limit = tonumber(ARGV[3])\n\
  redis.call('ZREMRANGEBYSCORE', key, 0, now - window * 1000)\nlocal count = redis.call('ZCARD', key)\n\
  if count < limit then\n  redis.call('ZADD', key, now, now .. '-' .. math.random(100000))\n  redis.call('EXPIRE',\
  \ key, window * 2)\n  return 1\nend\nreturn 0\n```\n\n## Testing\n\n```bash\n# Confirm 429s start after\
  \ the limit is exhausted\nfor i in $(seq 1 250); do curl -s -o /dev/null -w '%{http_code}\\n' https://httpbin.org/get;\
  \ done | sort | uniq -c\n```\n\n## Best practices\n\n- Return standard headers: `X-RateLimit-Limit`,\
  \ `X-RateLimit-Remaining`, `X-RateLimit-Reset`.\n- Keep Lua scripts atomic and idempotent; test them\
  \ with `redis-cli --eval`.\n- Exclude health checks and internal calls from counting.\n- Monitor the\
  \ Redis instance; a limit-store outage must fail open or closed deliberately.\n\n## Capabilities\n\n\
  ### redis-window-limits\nInspect Redis-based rate limit counters, exercise limited endpoints, and measure\
  \ effective limiting under load.\n\n**Parameters:**\n- `limit-key` (string): Redis key prefix for rate\
  \ limit counters, e.g. rl:\n- `client-identifier` (string): API key or user id identifying the rate\
  \ limit bucket\n- `requests-per-second` (integer): Target RPS for load verification\n\n**Commands:**\n\
  - `redis-cli --scan --pattern 'rl:*' | head -20`\n- `redis-cli GET rl:{client}:{route}:count`\n- `curl\
  \ -i https://httpbin.org/headers -H 'Authorization: Bearer $TOKEN' | grep -i 'x-ratelimit'`\n- `redis-cli\
  \ TTL rl:{client}:{route}:window`\n- `ab -n 2000 -c 50 https://httpbin.org/get | grep -E 'Requests per\
  \ second|Failed requests'`\n\n**Examples:**\n- redis-cli --scan --pattern 'rl:*' | head -20\n- curl\
  \ -i https://httpbin.org/headers | grep -i 'x-ratelimit'\n- ab -n 2000 -c 50 https://httpbin.org/get\
  \ | grep -E 'Requests per second|Failed requests'\n\n## References\n- [Redis rate limiting patterns](https://redis.io/glossary/rate-limiting/)"
