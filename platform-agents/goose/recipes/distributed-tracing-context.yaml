title: Distributed Tracing Context
description: Propagates and validates W3C traceparent headers across services using OpenTelemetry Collector,
  with curl injection and Jaeger query verification.
version: 2.0.0
instructions: "# Distributed Tracing Context\n\nPropagates and validates W3C traceparent headers across\
  \ services using OpenTelemetry Collector, with curl injection and Jaeger query verification.\n\n## Instructions\n\
  \n# Distributed Tracing Context\n\n## What this skill does\n\nDistributed tracing links logs and spans\
  \ across services through propagated context. The W3C `traceparent` header carries trace-id, parent\
  \ span-id, and sampling flags; OpenTelemetry standardizes instrumentation and export.\n\n## When to\
  \ use\n\n- Correlating a single user request across microservices\n- Debugging why a trace appears in\
  \ the backend but not the gateway\n- Setting up the OTel Collector for the first time\n\n## Real commands\n\
  \n```bash\n# Validate the collector config and run it\notelcol-contrib --validate --config config.yaml\n\
  otelcol-contrib --config config.yaml\n\n# Inject a trace context into a request and confirm the service\
  \ keeps it\ncurl -i -H 'traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01' http://localhost:8080/api/orders\
  \ | grep -i traceparent\n\n# Send a raw OTLP protobuf trace to the collector\ncurl -X POST http://localhost:4318/v1/traces\
  \ -H 'Content-Type: application/x-protobuf' --data-binary @trace.pb\n\n# Query traces in Jaeger\njaeger\
  \ query --jaeger.host 127.0.0.1 --url http://localhost:16686/api/traces --service orders-service\n```\n\
  \n## Collector config example\n\n```yaml\nreceivers:\n  otlp:\n    protocols:\n      grpc:\n       \
  \ endpoint: 0.0.0.0:4317\n      http:\n        endpoint: 0.0.0.0:4318\nexporters:\n  jaeger:\n    endpoint:\
  \ jaeger:14250\n    tls:\n      insecure: true\nservice:\n  pipelines:\n    traces:\n      receivers:\
  \ [otlp]\n      exporters: [jaeger]\n```\n\n## Best practices\n\n- Propagate `traceparent` on every\
  \ outbound HTTP call; never generate a new trace id mid-path.\n- Sample at the edge (head sampling)\
  \ and consider tail sampling for low-volume important traces.\n- Include `trace_id` in application logs\
  \ so logs and traces join up.\n- Test propagation with the curl header injection above before adding\
  \ instrumentation.\n\n## Testing\n\n```bash\n# End-to-end check: send a traced request and search Jaeger\
  \ for the same trace id\ncurl -i -H 'traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01'\
  \ http://localhost:8080/api/orders\ncurl -s 'http://localhost:16686/api/traces?service=orders-service&traceID=4bf92f3577b34da6a3ce929d0e0e4736'\
  \ | jq '.data[0].spans | length'\n```\n\n## Capabilities\n\n### otel-propagation\nRun the OpenTelemetry\
  \ Collector, test trace-context propagation with curl, and export/query traces.\n\n**Commands:**\n-\
  \ `otelcol-contrib --config config.yaml`\n- `docker run -p 4317:4317 -p 4318:4318 otel/opentelemetry-collector-contrib\
  \ --config /etc/otelcol-contrib/config.yaml`\n- `curl -i -H 'traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01'\
  \ http://localhost:8080/api/orders | grep -i traceparent`\n- `curl -X POST http://localhost:4318/v1/traces\
  \ -H 'Content-Type: application/x-protobuf' --data-binary @trace.pb`\n- `jaeger query --jaeger.host\
  \ 127.0.0.1 --jaeger.port 16686 --url http://localhost:16686/api/traces`\n\n**Examples:**\n- curl -i\
  \ -H 'traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01' http://localhost:8080/api/orders\n\
  - docker run -p 4317:4317 -p 4318:4318 otel/opentelemetry-collector-contrib --config /etc/otelcol-contrib/config.yaml\n\
  - otelcol-contrib --validate --config config.yaml"
prompt: Act as Distributed Tracing Context and handle the task per the instructions.
