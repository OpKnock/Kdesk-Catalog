title: docker-compose-devops
description: 'Authors and operates multi-container applications with Docker Compose: services, networks,
  volumes, healthchecks, and profiles.'
version: 2.0.0
instructions: "# docker-compose-devops\n\nAuthors and operates multi-container applications with Docker\
  \ Compose: services, networks, volumes, healthchecks, and profiles.\n\n## Instructions\n\n# Docker Compose\
  \ Applications\n\nRun local dev environments and single-host multi-container apps with compose.yaml.\n\
  \n## What This Skill Does\n\n- Writes service definitions with images, builds, env, volumes, and healthchecks\n\
  - Manages the full lifecycle: up, build, restart, down\n- Interacts with running services: logs, exec,\
  \ top\n- Validates compose files before deployment\n- Uses profiles and overlays for dev/staging/prod\
  \ variants\n\n## When to Use\n\n- Local development with DB + cache + API sidecars\n- CI service containers\n\
  - Small single-host production stacks\n\n## Real Commands\n\n```bash\n# Lifecycle\ndocker compose up\
  \ -d\ndocker compose up -d --build --force-recreate\ndocker compose down -v            # remove volumes\
  \ too\ndocker compose restart api\ndocker compose stop\n\n# Interact\ndocker compose ps\ndocker compose\
  \ logs -f api\ndocker compose exec api sh\ndocker compose top\ndocker compose events\n\n# Validate\n\
  docker compose config\ndocker compose config --services\ndocker compose config --quiet     # exit code\
  \ only\n```\n\n## Sample compose.yaml\n\n```yaml\nservices:\n  api:\n    build: ./api\n    ports: [\"\
  8080:8080\"]\n    environment:\n      DB_URL: postgres://db:5432/app\n    depends_on:\n      db:\n \
  \       condition: service_healthy\n    healthcheck:\n      test: [\"CMD\", \"curl\", \"-f\", \"http://localhost:8080/health\"\
  ]\n      interval: 30s\n  db:\n    image: postgres:16\n    volumes: [pgdata:/var/lib/postgresql/data]\n\
  \    healthcheck:\n      test: [\"CMD-SHELL\", \"pg_isready -U app\"]\nvolumes:\n  pgdata:\n```\n\n\
  ## Best Practices\n\n- Always pin image tags; avoid `latest` in compose files\n- Use healthchecks with\
  \ `depends_on.condition` instead of restart loops\n- Keep secrets via env_file or Docker secrets, not\
  \ inline env\n- Use profiles (`profiles: [\"debug\"]`) for optional services\n- Test `docker compose\
  \ config --quiet` in CI to fail invalid files early\n\n## Capabilities\n\n### compose-lifecycle\nBuild,\
  \ start, stop, and tear down multi-service stacks defined in compose.yaml.\n\n**Commands:**\n- `docker\
  \ compose up -d`\n- `docker compose up --build`\n- `docker compose down`\n- `docker compose down -v`\n\
  - `docker compose restart api`\n- `docker compose stop`\n\n**Examples:**\n- docker compose up -d --build\n\
  - docker compose down -v\n- docker compose restart api\n\n### inspect-and-interact\nTail logs, exec\
  \ into services, and validate the compose file.\n\n**Commands:**\n- `docker compose logs -f api`\n-\
  \ `docker compose ps`\n- `docker compose exec api sh`\n- `docker compose config`\n- `docker compose\
  \ top`\n- `docker compose events`\n\n**Examples:**\n- docker compose logs -f api\n- docker compose exec\
  \ api sh -c 'npm test'\n- docker compose config --services"
prompt: Act as docker-compose-devops and handle the task per the instructions.
