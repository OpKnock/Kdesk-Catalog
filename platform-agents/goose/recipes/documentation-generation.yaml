title: Documentation Generation
description: 'Auto-generates API reference documentation from source code and specs: Typedoc for TypeScript,
  sphinx-apidoc for Python, Doxygen for C++, and OpenAPI generators.'
version: 2.0.0
instructions: "# Documentation Generation\n\nAuto-generates API reference documentation from source code\
  \ and specs: Typedoc for TypeScript, sphinx-apidoc for Python, Doxygen for C++, and OpenAPI generators.\n\
  \n## Instructions\n\n# Documentation Generation\n\n## What this skill does\n\nDocumentation generation\
  \ extracts docs from source code: comments, docstrings, and types. This skill covers Typedoc (TS), sphinx-apidoc\
  \ (Python), Doxygen (C++), jsdoc, and OpenAPI-based HTML generators.\n\n## When to use\n\n- Building\
  \ an API reference that stays in sync with the code\n- Onboarding a new team by generating module overviews\n\
  - Shipping docs as part of the release pipeline\n\n## Real commands\n\n```bash\n# TypeScript\nnpx typedoc\
  \ --out docs src/index.ts\n\n# Python: build module docs, then render HTML\nsphinx-apidoc -o docs/source\
  \ src/api\nsphinx-build -b html docs/source docs/build\n\n# C/C++\ndoxygen Doxyfile\n\n# OpenAPI ->\
  \ static HTML reference\nnpx @openapitools/openapi-generator-cli generate -i openapi.yaml -g html2 -o\
  \ docs\n```\n\n## Config example (jsdoc.json)\n\n```json\n{\n  \"source\": {\"include\": [\"src\"]},\n\
  \  \"opts\": {\"destination\": \"docs\", \"recurse\": true},\n  \"plugins\": [\"plugins/markdown\"]\n\
  }\n```\n\n## CI integration\n\n```bash\n# Regenerate and fail on drift\nnpx typedoc --out docs src/index.ts\
  \ && git diff --quiet docs/ || echo 'docs out of date'\n```\n\n## Best practices\n\n- Generate on every\
  \ merge; treat stale generated docs as a build failure.\n- Keep doc comments on public API surfaces\
  \ only.\n- Use `--pretty` and sort options consistently so diffs stay small.\n- Exclude generated/ and\
  \ vendor/ from the source globs.\n\n## Testing\n\n```bash\n# Verify all module pages rendered without\
  \ warnings\nsphinx-build -b html docs/source docs/build -W\n```\n\n## Capabilities\n\n### code-doc-gen\n\
  Generate API reference documentation from code and OpenAPI specs with the right tool per language.\n\
  \n**Commands:**\n- `npx typedoc --out docs src/index.ts`\n- `sphinx-apidoc -o docs/source src/api &&\
  \ sphinx-build -b html docs/source docs/build`\n- `doxygen Doxyfile`\n- `npx @openapitools/openapi-generator-cli\
  \ generate -i openapi.yaml -g html2 -o docs`\n- `jsdoc -c jsdoc.json -d docs`\n\n**Examples:**\n- npx\
  \ typedoc --out docs src/index.ts\n- sphinx-apidoc -o docs/source src/api && sphinx-build -b html docs/source\
  \ docs/build\n- npx @openapitools/openapi-generator-cli generate -i openapi.yaml -g html2 -o docs"
prompt: Act as Documentation Generation and handle the task per the instructions.
