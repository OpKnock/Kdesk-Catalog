title: Documentation
description: 'Authors and publishes project documentation sites with MkDocs: scaffolds, previews with
  hot reload, builds strictly, and deploys to GitHub Pages.'
version: 2.0.0
instructions: "# Documentation\n\nAuthors and publishes project documentation sites with MkDocs: scaffolds,\
  \ previews with hot reload, builds strictly, and deploys to GitHub Pages.\n\n## Instructions\n\n# Documentation\n\
  \n## What this skill does\n\nThis skill covers authoring and publishing documentation sites with MkDocs:\
  \ project scaffolding, live preview, strict builds, and GitHub Pages deployment. Markdown files are\
  \ the source of truth.\n\n## When to use\n\n- Starting a docs site for a project, API, or team\n- Restructuring\
  \ an existing docs tree\n- Publishing docs to GitHub Pages or a static host\n\n## Real commands\n\n\
  ```bash\n# Scaffold a new project\n mkdocs new my-docs\n cd my-docs\n\n# Preview with hot reload\n mkdocs\
  \ serve --dev-addr 127.0.0.1:8000\n\n# Build the static site (strict = warnings become errors)\n mkdocs\
  \ build --clean\n mkdocs build --strict\n\n# Deploy to GitHub Pages\n mkdocs gh-deploy --force\n```\n\
  \n## mkdocs.yml example\n\n```yaml\nsite_name: My Project\ntheme:\n  name: material\n  features:\n \
  \   - navigation.tabs\n    - search.suggest\nnav:\n  - Home: index.md\n  - Guides:\n      - Getting\
  \ started: guides/getting-started.md\n      - Configuration: guides/configuration.md\nplugins:\n  -\
  \ search\nmarkdown_extensions:\n  - admonition\n  - pymdownx.superfences\n```\n\n## Writing guidelines\n\
  \n- One idea per page; link between pages instead of duplicating.\n- Keep a short title and an intro\
  \ sentence before any heading.\n- Use admonitions (note, warning) sparingly for emphasis.\n- Include\
  \ a code example on every how-to page.\n\n## Testing\n\n```bash\n# Verify every link resolves and no\
  \ warnings are emitted\n mkdocs build --strict && echo 'docs healthy'\n```\n\n## Best practices\n\n\
  - Use `mkdocs build --strict` in CI so broken links fail the pipeline.\n- Keep nav ordering in mkdocs.yml\
  \ aligned with the docs tree.\n- Preview locally before every `gh-deploy`.\n- Store docs beside the\
  \ code and version them together.\n\n## Capabilities\n\n### mkdocs-publishing\nScaffold, serve, build,\
  \ and deploy MkDocs documentation projects.\n\n**Commands:**\n- `mkdocs new my-docs`\n- `mkdocs serve\
  \ --dev-addr 127.0.0.1:8000`\n- `mkdocs build --clean`\n- `mkdocs gh-deploy`\n- `mkdocs build --strict`\n\
  - `mkdocs --version`\n\n**Examples:**\n- mkdocs new my-docs && cd my-docs && mkdocs serve\n- mkdocs\
  \ build --strict\n- mkdocs gh-deploy --force"
prompt: Act as Documentation and handle the task per the instructions.
