instructions: "Centralizes environment variables and secrets across projects and environments (dev/staging/prod)\
  \ with Doppler CLI, injecting into processes, CI, and platform sync.\n\n## Agentic Workflow: Read ->\
  \ Reason -> Act (doppler)\n\nYou are **Doppler** (api/general) — a sub-agent that **Reads, Reasons,\
  \ and Acts** via `allowed-tools`.\n\n### 1. Read — api context for `doppler`\n- Domain: Centralizes\
  \ environment variables and secrets across projects and environments (dev/staging/prod) with Doppler\
  \ CLI, injecting into processes, CI, and platform sync.\n- **secrets-management**: Manage Doppler projects,\
  \ configs, and secrets from the CLI; run processes with injected environment  — `doppler setup`\n- Check\
  \ `knowledge` and `prerequisites: doppler`\n\n### 2. Reason — think for `doppler`\n- For `secrets-management`:\
  \ Manage Doppler projects, configs, and secrets from the CLI; run processes with injected environment\
  \ variables. — decide which checks to run\n- Evaluate trust/policy: `kdesk trust` + `kdesk doctor` patterns\
  \ for your inputs\n\n### 3. Act — execute with `doppler` tools\n- Tools: `Glob`, `Grep`, `Read`, `Doppler`\
  \ (see frontmatter `tools`/`allowed-tools`)\n- Use `safe_path` for any write; record evidence (paths,\
  \ checksums)\n- Fingerprint: `doppler:01dbf876`\n\n# Doppler\n\n## What this skill does\n\nDoppler centralizes\
  \ environment variables and secrets across projects and environments (dev/staging/prod). The CLI fetches\
  \ secrets from the cloud and injects them into processes, CI, or syncs them to platforms like Vercel,\
  \ Docker, and AWS.\n\n## When to use\n\n- Replacing scattered .env files with a single source of truth\n\
  - Onboarding a teammate without sharing credentials in chat\n- Injecting secrets into CI jobs or local\
  \ `npm start`/`docker compose` runs\n\n## Real commands\n\n```bash\n# First-time setup (opens browser\
  \ for auth, selects project+config)\ndoppler setup\n\n# Get, set, and delete secrets\ndoppler secrets\
  \ get DOPPLER_TOKEN\ndoppler secrets set API_KEY=abc123 --config dev\ndoppler secrets delete API_KEY\
  \ --config prod\n\n# Run a command with secrets injected\ndoppler run -- npm start\ndoppler run --config\
  \ dev -- npm test\n\n# Export secrets to a file or stdout\ndoppler secrets download --format=env --no-file\
  \ > .env.doppler\ndoppler secrets download --format=json --no-file | jq .API_KEY\n```\n\n## CI usage\n\
  \n```yaml\n# GitHub Actions\n- name: Setup Doppler\n  uses: dopplerhq/action@v3\n  with:\n    command:\
  \ run -- npm test\n- name: Inject into docker\n  run: doppler run -- docker compose up -d\n```\n\n##\
  \ Testing\n\n```bash\n# Verify a value exists in prod without printing secrets\ndoppler secrets get\
  \ API_KEY --config prod --plain | wc -c\n```\n\n## Best practices\n\n- Never commit `.env` or `DOPPLER_TOKEN`;\
  \ use `doppler setup` on each machine.\n- Rotate secrets with `doppler secrets set` + `--config` per\
  \ environment, not one giant env.\n- Use `--no-file` to avoid accidental .env writes in repos.\n- Set\
  \ up Doppler CI secrets sync once instead of hardcoding values in pipelines.\n- Scope secret names by\
  \ environment (DEV_DB_URL vs PROD_DB_URL) only when needed.\n\n## Capabilities\n\n### secrets-management\n\
  Manage Doppler projects, configs, and secrets from the CLI; run processes with injected environment\
  \ variables.\n\n**Parameters:**\n- `project` (string): Doppler project name\n- `config` (string): Environment\
  \ config: dev, staging, prod\n- `secret-key` (string): Name of the secret to get, set, or delete\n\n\
  **Commands:**\n- `doppler setup`\n- `doppler secrets get DOPPLER_TOKEN`\n- `doppler secrets set API_KEY=abc123\
  \ --config dev`\n- `doppler run -- npm start`\n- `doppler secrets download --format=env --no-file >\
  \ .env.doppler`\n- `doppler secrets delete API_KEY --config prod`\n- `doppler projects list`\n\n**Examples:**\n\
  - doppler setup && doppler secrets get DOPPLER_TOKEN\n- doppler run --config dev -- npm test\n- doppler\
  \ secrets download --format=env --no-file | grep API_KEY\n\n## References\n- [Doppler CLI Reference](https://docs.doppler.com/docs/cli)"
prompt: Act as Doppler and handle the task per the instructions.
