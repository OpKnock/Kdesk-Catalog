title: dprint
description: Formats multiple languages with dprint, the fast pluggable formatter, including plugin config
  and CI integration.
version: 2.0.0
instructions: "# dprint\n\nFormats multiple languages with dprint, the fast pluggable formatter, including\
  \ plugin config and CI integration.\n\n## Instructions\n\n# dprint\n\nFast, pluggable code formatter.\n\
  \n## When to Use\n\n- Formatting many languages with one tool\n- Replacing slower formatters on large\
  \ repos\n- Enforcing formatting in CI cheaply\n- Standardizing team-wide formatting rules\n\n## Commands\n\
  \n```bash\n# Install and init\nnpm install -g dprint\ndprint init\n\n# Format\ndprint fmt\ndprint fmt\
  \ --include \"**/*.ts\"\ndprint fmt --exclude \"**/dist/**\"\n\n# Check (CI)\ndprint check\n\n# Config\n\
  dprint config add typescript\ndprint config add markdown\ndprint config add \"prettier:toml\"\ndprint\
  \ config update\ndprint output-resolved-config\n```\n\n## Config Example\n\n```json\n{\n  \"typescript\"\
  : {\n    \"lineWidth\": 100,\n    \"semiColons\": \"always\"\n  },\n  \"markdown\": {},\n  \"includes\"\
  : [\"**/*.{ts,tsx,json,md}\"],\n  \"excludes\": [\"**/dist/**\", \"**/node_modules/**\"]\n}\n```\n\n\
  ## Best Practices\n\n- Commit dprint.json at the repo root\n- Run dprint check in CI, dprint fmt in\
  \ pre-commit\n- Use only the plugins your repo needs\n- Keep the dprint binary version pinned\n- Exclude\
  \ generated directories from formatting\n- Resolve config in CI with output-resolved-config to debug\
  \ drift\n\n## Capabilities\n\n### dprint-format\nFormat code with dprint plugins.\n\n**Commands:**\n\
  - `npm install -g dprint`\n- `dprint init`\n- `dprint fmt`\n- `dprint check`\n- `dprint fmt --include\
  \ \"**/*.ts\"`\n\n**Examples:**\n- dprint check ./src\n- dprint fmt --exclude \"**/dist/**\"\n- dprint\
  \ fmt -- --stdin-filepath main.ts\n\n### dprint-config\nManage plugins and configuration.\n\n**Commands:**\n\
  - `dprint config add typescript`\n- `dprint config add markdown`\n- `dprint config update`\n- `dprint\
  \ output-resolved-config`\n\n**Examples:**\n- dprint config add \"prettier:toml\"\n- dprint output-resolved-config\
  \ > dprint-resolved.json"
prompt: Act as dprint and handle the task per the instructions.
