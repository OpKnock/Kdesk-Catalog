title: Env Config
description: 'Environment configuration management: load .env files, validate required variables, and
  inject config per environment without leaking secrets.'
version: 2.0.0
instructions: "# Env Config\n\nEnvironment configuration management: load .env files, validate required\
  \ variables, and inject config per environment without leaking secrets.\n\n## Instructions\n\n# Env\
  \ Config\n\n## What this skill does\n\nEnvironment configuration keeps settings out of code: everything\
  \ that varies between environments lives in env vars. This skill covers dotenv loading, validation,\
  \ and safe debugging.\n\n## When to use\n\n- Setting up a new project's configuration layer\n- Debugging\
  \ why an app uses the wrong database\n- Auditing that no secret sits in committed .env files\n\n## Real\
  \ commands\n\n```bash\n# Load .env in Node without code changes\nnode -r dotenv/config index.js\n\n\
  # Verify a loaded value (name only, never the value)\nnode -e \"require('dotenv').config(); console.log(process.env.NODE_ENV)\"\
  \n\n# List variable NAMES from .env (values redacted)\ngrep -E '^[A-Z_]+=' .env | sed 's/=.*/=<redacted>/'\n\
  \n# Compare what the shell actually has\nenv | grep -iE '^(DATABASE|API_KEY|PORT)=' | cut -d= -f1\n\
  ```\n\n## Validation example (Node)\n\n```javascript\nconst required = ['DATABASE_URL', 'JWT_SECRET',\
  \ 'PORT']\nconst missing = required.filter(k => !process.env[k])\nif (missing.length) {\n  throw new\
  \ Error(`Missing required env vars: ${missing.join(', ')}`)\n}\n```\n\n## Testing\n\n```bash\n# Start\
  \ the app with a test env and confirm config is read\nNODE_ENV=test PORT=4000 node -r dotenv/config\
  \ index.js\ncurl -s localhost:4000/health | jq '.env'\n```\n\n## Best practices\n\n- Commit `.env.example`\
  \ with placeholder values; gitignore `.env`.\n- Fail fast at startup when required vars are missing.\n\
  - Never log env values; log names and presences only.\n- Prefer tooling like Doppler/aws ssm for prod;\
  \ keep dotenv for local only.\n- Parse booleans/numbers explicitly instead of string truthiness.\n\n\
  ## Capabilities\n\n### env-management\nLoad, validate, and debug environment variables across dev/staging/prod.\n\
  \n**Commands:**\n- `node -r dotenv/config index.js`\n- `node -e \"require('dotenv').config(); console.log(process.env.NODE_ENV)\"\
  `\n- `grep -E '^[A-Z_]+=' .env | sed 's/=.*/=[REDACTED]/'`\n- `env | grep -iE '^(DATABASE|API_KEY|PORT)='\
  \ | cut -d= -f1`\n- `python -c \"import os; from dotenv import load_dotenv; load_dotenv(); print(os.getenv('DATABASE_URL',\
  \ 'MISSING'))\"`\n\n**Examples:**\n- node -r dotenv/config index.js\n- grep -E '^[A-Z_]+=' .env | sed\
  \ 's/=.*/=[REDACTED]/'\n- env | grep -iE '^(DATABASE|API_KEY|PORT)=' | cut -d= -f1"
prompt: Act as Env Config and handle the task per the instructions.
