title: Envoy Tuning
description: 'Envoy proxy tuning: inspect listeners, clusters, and endpoints via admin API; tune buffer,
  timeout, and connection pool settings.'
version: 2.0.0
instructions: "# Envoy Tuning\n\nEnvoy proxy tuning: inspect listeners, clusters, and endpoints via admin\
  \ API; tune buffer, timeout, and connection pool settings.\n\n## Instructions\n\n# Envoy Tuning\n\n\
  ## What this skill does\n\nEnvoy is a high-performance L7 proxy. Tuning means reading the admin API\
  \ for listener/cluster state, watching upstream latency stats, and adjusting connection pools, timeouts,\
  \ and buffer sizes.\n\n## When to use\n\n- Latency regressions through a gateway or mesh sidecar\n-\
  \ Upstreams marked unhealthy or connection pool saturation\n- Pre-launch capacity tuning\n\n## Real\
  \ commands\n\n```bash\n# What listeners exist\ncurl -s http://localhost:15000/listeners | jq '.[].name'\n\
  \n# Healthy endpoints per cluster\ncurl -s http://localhost:15000/clusters?format=json | jq '.cluster_statuses[]\
  \ | {name: .name, membership: .membership.total_healthy_count}'\n\n# Upstream latency percentiles\n\
  curl -s http://localhost:15000/stats?filter=cluster.orders.upstream_rq_time | grep -E 'P50|P95'\n\n\
  # Drain before a restart\ncurl -s -X POST http://localhost:15000/drain_listeners?inboundonly\n\n# Zero\
  \ out stats after a change\ncurl -s -X POST http://localhost:15000/reset_counters\n```\n\n## Tuning\
  \ config example\n\n```yaml\nclusters:\n  - name: orders\n    connect_timeout: 1.5s\n    circuit_breakers:\n\
  \      thresholds:\n        - max_connections: 1024\n          max_pending_requests: 1024\n        \
  \  max_requests: 2048\n    http2_protocol_options: {}\n    health_checks:\n      healthy_threshold:\
  \ 2\n      unhealthy_threshold: 3\n      timeout: 1s\n      interval: 5s\n```\n\n## Key stats\n\n- `upstream_rq_time`\
  \ P95: endpoint latency as seen by Envoy\n- `upstream_cx_total` and `upstream_rq_pending_total`: pool\
  \ saturation\n- `upstream_cx_connect_fail`: network reachability\n\n## Best practices\n\n- Compare P50\
  \ vs P95; a widening gap points to queueing, not the endpoint.\n- Tune one variable at a time and reset_counters\
  \ between tests.\n- Drain listeners before rolling a proxy to avoid connection resets.\n- Keep connect_timeout\
  \ short (1-2s); raise only for slow-start endpoints.\n\n## Capabilities\n\n### envoy-admin\nQuery the\
  \ Envoy admin API for listeners, clusters, and stats, and drain or reset connections.\n\n**Commands:**\n\
  - `curl -s http://localhost:15000/listeners | jq`\n- `curl -s http://localhost:15000/clusters?format=json\
  \ | jq '.cluster_statuses[] | {name: .name, membership: .membership.total_healthy_count}'`\n- `curl\
  \ -s http://localhost:15000/stats?filter=cluster.orders.upstream_rq_time | grep -E 'P50|P95'`\n- `curl\
  \ -s -X POST http://localhost:15000/drain_listeners?inboundonly`\n- `curl -s -X POST http://localhost:15000/reset_counters`\n\
  \n**Examples:**\n- curl -s http://localhost:15000/clusters?format=json | jq '.cluster_statuses[] | {name:\
  \ .name, membership: .membership.total_healthy_count}'\n- curl -s http://localhost:15000/stats?filter=cluster.orders.upstream_rq_time\
  \ | grep -E 'P50|P95'\n- curl -s http://localhost:15000/listeners | jq '.[].name'"
prompt: Act as Envoy Tuning and handle the task per the instructions.
