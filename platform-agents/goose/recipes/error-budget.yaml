title: Error Budget
description: 'SLO and error budget management: compute error budgets from Prometheus metrics, track burn
  rates, and trigger alerts when budgets deplete.'
version: 2.0.0
instructions: "# Error Budget\n\nSLO and error budget management: compute error budgets from Prometheus\
  \ metrics, track burn rates, and trigger alerts when budgets deplete.\n\n## Instructions\n\n# Error\
  \ Budget\n\n## What this skill does\n\nAn error budget is the allowed failure over an SLO period: at\
  \ 99.9% availability over 30 days, 43 minutes of error is the budget. This skill computes SLIs from\
  \ Prometheus, tracks burn, and wires alerts.\n\n## When to use\n\n- Setting up SLOs for a new service\n\
  - Deciding whether a release can proceed (budget check)\n- Investigating which window consumed the budget\n\
  \n## Real commands\n\n```bash\n# Request rate (RPS)\ncurl -s 'http://prometheus:9090/api/v1/query' --data-urlencode\
  \ 'query=sum(rate(http_requests_total{job=\"api\"}[5m]))' | jq '.data.result[0].value'\n\n# Availability\
  \ SLI (percent of good requests)\ncurl -s 'http://prometheus:9090/api/v1/query' --data-urlencode 'query=(1\
  \ - sum(rate(http_requests_total{code=~\"5..\"}[5m])) / sum(rate(http_requests_total[5m]))) * 100' |\
  \ jq '.data.result[0].value[1]'\n\n# Latency SLI (P95)\ncurl -s 'http://prometheus:9090/api/v1/query'\
  \ --data-urlencode 'query=histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m]))\
  \ by (le))' | jq\n\n# Validate alert rules\npromtool check rules prometheus/rules.yml\npromtool test\
  \ rules test.yml\n```\n\n## Burn rate example (Prometheus rule)\n\n```yaml\ngroups:\n  - name: slo\n\
  \    rules:\n      - alert: ErrorBudgetBurnRate\n        expr: (1 - sum(rate(http_requests_total{code=~\"\
  5..\"}[1h])) / sum(rate(http_requests_total[1h]))) < 0.99\n        for: 15m\n        labels:\n     \
  \     severity: page\n```\n\n## Budget math\n\n- 99.9% over 30 days = 43m 12s budget\n- 99.95% over\
  \ 30 days = 21m 36s\n- Monthly budget seconds = (1 - target) * days * 86400\n\n## Best practices\n\n\
  - Alert on burn rate (budget depletion speed), not raw error count.\n- Use a 1h fast-burn and 6h slow-burn\
  \ alert pair.\n- Review budget consumption weekly in the on-call report.\n- Freeze risky releases when\
  \ burn crosses ~15% of the monthly budget.\n\n## Capabilities\n\n### budget-calculations\nQuery availability\
  \ and latency SLIs, compute burn, and alert on budget depletion.\n\n**Commands:**\n- `curl -s 'http://prometheus:9090/api/v1/query'\
  \ --data-urlencode 'query=sum(rate(http_requests_total{job=\"api\"}[5m]))' | jq '.data.result[0].value'`\n\
  - `curl -s 'http://prometheus:9090/api/v1/query' --data-urlencode 'query=(1 - sum(rate(http_requests_total{code=~\"\
  5..\"}[5m])) / sum(rate(http_requests_total[5m]))) * 100' | jq '.data.result[0].value[1]'`\n- `curl\
  \ -s 'http://prometheus:9090/api/v1/query' --data-urlencode 'query=histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m]))\
  \ by (le))' | jq`\n- `promtool check rules prometheus/rules.yml`\n- `promtool test rules test.yml`\n\
  \n**Examples:**\n- curl -s 'http://prometheus:9090/api/v1/query' --data-urlencode 'query=(1 - sum(rate(http_requests_total{code=~\"\
  5..\"}[5m])) / sum(rate(http_requests_total[5m]))) * 100' | jq '.data.result[0].value[1]'\n- curl -s\
  \ 'http://prometheus:9090/api/v1/query' --data-urlencode 'query=histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m]))\
  \ by (le))' | jq\n- promtool check rules prometheus/rules.yml"
prompt: Act as Error Budget and handle the task per the instructions.
