title: eslint
description: 'Lints JavaScript and TypeScript with ESLint: full lint runs, autofix, custom rulesets, and
  CI integration.'
version: 2.0.0
instructions: "# eslint\n\nLints JavaScript and TypeScript with ESLint: full lint runs, autofix, custom\
  \ rulesets, and CI integration.\n\n## Instructions\n\n# ESLint\n\nJavaScript and TypeScript linting.\n\
  \n## When to Use\n\n- Enforcing code style and catching bugs early\n- Autofixing safe issues in CI or\
  \ pre-commit\n- TS projects with typescript-eslint\n- Framework code with React/Vue plugins\n\n## Commands\n\
  \n```bash\n# Basic lint\neslint src/\n\n# Autofix\neslint src/ --fix\neslint --fix-dry-run src/  # preview\n\
  \n# Scope and extensions\neslint . --ext .js,.ts\neslint src/components/ --ext .jsx,.tsx\n\n# Warnings\
  \ budget\neslint --max-warnings 10 src/\n\n# Reports\neslint --format json src/ -o eslint-report.json\n\
  eslint --format sarif src/ -o eslint-report.sarif\n\n# Caching\neslint --cache src/\n```\n\n## Common\
  \ Rules\n\n```javascript\nrules: {\n  \"semi\": [\"error\", \"always\"],\n  \"no-unused-vars\": [\"\
  error\", { argsIgnorePattern: \"^_\" }],\n  \"@typescript-eslint/no-explicit-any\": \"warn\",\n}\n```\n\
  \n## Best Practices\n\n- Use --fix in pre-commit, verify-only in CI\n- Set --max-warnings 0 to block\
  \ warning creep\n- Cache runs locally; disable cache in CI\n- Emit JSON/SARIF reports in CI for dashboards\n\
  - Pin ESLint and plugin versions together\n- Use --fix-dry-run to review autofixes before applying\n\
  \n## Capabilities\n\n### eslint-lint\nLint and fix code with real CLI flags.\n\n**Commands:**\n- `eslint\
  \ src/ --ext .js,.mjs`\n- `eslint src/main.js --fix`\n- `eslint . --ext .js,.ts`\n- `eslint --max-warnings\
  \ 10 src/`\n- `eslint --format json src/ -o eslint-report.json`\n\n**Examples:**\n- eslint src/ --fix-dry-run\n\
  - eslint --no-error-on-unmatched-pattern \"src/**/*.ts\"\n- eslint --cache src/\n\n### eslint-rules\n\
  Inspect and apply specific rules.\n\n**Commands:**\n- `npx eslint --rule \"no-console: error\" src/`\n\
  - `eslint --rulesdir ./rules src/`\n- `eslint --plugin react --rule \"react/jsx-uses-react: error\"\
  \ src/`\n- `eslint --print-config src/main.js`\n\n**Examples:**\n- npx eslint --fix --ext .jsx,.tsx\
  \ src/components/\n- eslint --no-eslintrc --parser-options \"ecmaVersion: latest\" src/"
prompt: Act as eslint and handle the task per the instructions.
