title: Exception Handling
description: 'Patterns for consistent API error handling: structured RFC 7807 problem responses, centralized
  middleware to map domain exceptions to status codes, contextual logging without leaking internals, and
  test coverage for every error path.'
version: 2.0.0
instructions: "# Exception Handling\n\nPatterns for consistent API error handling: structured RFC 7807\
  \ problem responses, centralized middleware to map domain exceptions to status codes, contextual logging\
  \ without leaking internals, and test coverage for every error path.\n\n## Instructions\n\n# Exception\
  \ Handling\n\n## What this skill does\n\nGood exception handling turns crashes into structured, debuggable\
  \ error responses: a consistent JSON problem format, correct status codes, contextual logs, and tested\
  \ error paths.\n\n## When to use\n\n- Auditing an API for raw stack traces leaking to clients\n- Standardizing\
  \ 400/404/422/500 responses across services\n- Adding error-path tests before a launch\n\n## Real commands\n\
  \n```bash\n# What does the API actually return on errors?\ncurl -s -w '\\nHTTP %{http_code}\\n' http://localhost:8080/api/orders/999999\n\
  curl -s http://localhost:8080/api/orders/999999 | jq\n\n# POST with invalid body\ncurl -s -X POST http://localhost:8080/api/orders\
  \ -H 'Content-Type: application/json' -d '{\"invalid\":true}' | jq '.error.code'\n\n# Find exception\
  \ classes in the codebase\n grep -rn 'NotFoundException' src/ | head -20\n```\n\n## Problem details\
  \ example (RFC 7807)\n\n```json\n{\n  \"type\": \"https://api.example.com/errors/not-found\",\n  \"\
  title\": \"Order not found\",\n  \"status\": 404,\n  \"detail\": \"No order with id 999999\",\n  \"\
  instance\": \"/api/orders/999999\"\n}\n```\n\n## Middleware example (Node/Express)\n\n```javascript\n\
  app.use((err, req, res, next) => {\n  const status = err.status || 500\n  if (status >= 500) console.error('[unhandled]',\
  \ err.stack)\n  res.status(status).json({\n    type: err.type || 'about:blank',\n    title: err.title\
  \ || err.message,\n    status,\n    detail: status >= 500 ? 'Internal error' : err.message\n  })\n})\n\
  ```\n\n## Testing error paths\n\n```bash\n# Verify a 404 shape\ncurl -s http://localhost:8080/api/orders/999999\
  \ | jq -e '.status == 404 and .title != null'\n# Verify 500s never leak internals\ncurl -s -w '%{http_code}'\
  \ http://localhost:8080/api/crash | grep -q 500\n```\n\n## Best practices\n\n- Use RFC 7807 problem\
  \ details; keep `type` as a documented URI.\n- Log the full stack server-side, but return generic messages\
  \ for 5xx.\n- Never return internal exception messages to clients.\n- Map domain exceptions to status\
  \ codes in one place (middleware).\n- Test every error path, not just the happy path.\n\n## Capabilities\n\
  \n### error-response-design\nDefine, emit, log, and test consistent error responses across API layers.\n\
  \n**Commands:**\n- `curl -s http://localhost:8080/api/orders/999999 | jq`\n- `curl -s -w '\\nHTTP %{http_code}\\\
  n' http://localhost:8080/api/orders/999999`\n- `grep -rn 'NotFoundException' src/ | head -20`\n- `node\
  \ -e \"try { throw Object.assign(new Error('boom'), {status: 422, code: 'VALIDATION'}) } catch (e) {\
  \ console.log(JSON.stringify({error: e.message, code: e.code, status: e.status})) }\"`\n- `curl -s -X\
  \ POST http://localhost:8080/api/orders -H 'Content-Type: application/json' -d '{\"invalid\":true}'\
  \ | jq '.error.code'`\n\n**Examples:**\n- curl -s -w '\\nHTTP %{http_code}\\n' http://localhost:8080/api/orders/999999\n\
  - curl -s -X POST http://localhost:8080/api/orders -H 'Content-Type: application/json' -d '{\"invalid\"\
  :true}' | jq '.error.code'\n- grep -rn 'NotFoundException' src/ | head -20"
prompt: Act as Exception Handling and handle the task per the instructions.
