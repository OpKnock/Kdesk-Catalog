  \ and production hardening.\n\n## Agentic Workflow: Read -> Reason -> Act (express)\n\nYou are **express**\
  \ (backend/general) — a sub-agent that **Reads, Reasons, and Acts** via `allowed-tools`.\n\n### 1. Read\
  \ — backend context for `express`\n- Domain: Builds Node.js HTTP APIs with Express: routing, middleware,\
  \ error handling, validation, and production hardening.\n- **express-app**: Scaffold and run Express\
  \ applications. — `npm init -y`\n- **express-middleware**: Add routing, validation, and error middleware.\
  \ — `npm install helmet cors express-rate-limit`\n- Check `knowledge` and `prerequisites: node, npm,\
  \ npx`\n\n### 2. Reason — think for `express`\n- For `express-app`: Scaffold and run Express applications.\
  \ — decide which checks to run\n- For `express-middleware`: Add routing, validation, and error middleware.\
  \ — decide which checks to run\n- Evaluate trust/policy: `kdesk trust` + `kdesk doctor` patterns for\
  \ your inputs\n\n### 3. Act — execute with `express` tools\n- Tools: `Glob`, `Grep`, `Read`, `Bash`,\
  \ `Npx` (see frontmatter `tools`/`allowed-tools`)\n- Use `safe_path` for any write; record evidence\
  \ (paths, checksums)\n- Fingerprint: `express:239497be`\n\n# Express\n\nMinimal web framework for Node.js.\n\
  \n## When to Use\n\n- REST APIs and web apps with simple routing needs\n- Microservices where a lightweight\
  \ runtime is preferred\n- SPA backends serving JSON and static files\n\n## Commands\n\n```bash\n# Scaffold\n\
  npm init -y\nnpm install express\nnpx express-generator myapp\n\n# Run\nnode server.js\nnode --watch\
  \ server.js\n\n# Common middleware\nnpm install helmet cors express-rate-limit morgan\nnpm install compression\n\
  \n# Testing\nnpm install --save-dev supertest\n```\n\n## App Example\n\n```javascript\nconst express\
  \ = require(\"express\");\nconst app = express();\n\napp.use(express.json());\napp.use(require(\"helmet\"\
  )());\n\napp.get(\"/health\", (req, res) => res.json({ ok: true }));\n\napp.use((err, req, res, next)\
  \ => {\n  console.error(err);\n  res.status(500).json({ error: \"internal\" });\n});\n\napp.listen(3000);\n\
  ```\n\n## Best Practices\n\n- Put helmet, cors, and json body parsing before routes\n- Validate request\
  \ input; never trust req.body blindly\n- Centralize error handling in one error middleware\n- Use async\
  \ wrapper or try/catch for promises in handlers\n- Run npm audit in CI and pin production dependencies\n\
  - Serve behind a reverse proxy with trust proxy enabled when needed\n\n## Capabilities\n\n### express-app\n\
  Scaffold and run Express applications.\n\n**Parameters:**\n- `entry` (string): Entry file to run\n-\
  \ `port` (integer): Listen port\n\n**Commands:**\n- `npm init -y`\n- `npm install express`\n- `npx express-generator\
  \ myapp`\n- `node server.js`\n- `npm start`\n\n**Examples:**\n- npx express-generator --view=ejs myapp\n\
  - node --watch server.js\n- npm run dev\n\n### express-middleware\nAdd routing, validation, and error\
  \ middleware.\n\n**Parameters:**\n- `package` (string): npm package to install\n- `route` (string):\
  \ Route path the middleware applies to\n\n**Commands:**\n- `npm install helmet cors express-rate-limit`\n\
  - `npm install morgan`\n- `npm install --save-dev supertest`\n- `npm audit fix`\n\n**Examples:**\n-\
  \ npm install express-validator joi\n- npm install compression\n- npm audit --audit-level=high\n\n##\
  \ References\n- [Express Docs](https://expressjs.com)\n- [Express Security Best Practices](https://expressjs.com/en/advanced/best-practice-security.html)"
