title: express
description: 'Builds Node.js HTTP APIs with Express: routing, middleware, error handling, validation,
  and production hardening.'
version: 2.0.0
instructions: "# express\n\nBuilds Node.js HTTP APIs with Express: routing, middleware, error handling,\
  \ validation, and production hardening.\n\n## Instructions\n\n# Express\n\nMinimal web framework for\
  \ Node.js.\n\n## When to Use\n\n- REST APIs and web apps with simple routing needs\n- Microservices\
  \ where a lightweight runtime is preferred\n- SPA backends serving JSON and static files\n\n## Commands\n\
  \n```bash\n# Scaffold\nnpm init -y\nnpm install express\nnpx express-generator myapp\n\n# Run\nnode\
  \ server.js\nnode --watch server.js\n\n# Common middleware\nnpm install helmet cors express-rate-limit\
  \ morgan\nnpm install compression\n\n# Testing\nnpm install --save-dev supertest\n```\n\n## App Example\n\
  \n```javascript\nconst express = require(\"express\");\nconst app = express();\n\napp.use(express.json());\n\
  app.use(require(\"helmet\")());\n\napp.get(\"/health\", (req, res) => res.json({ ok: true }));\n\napp.use((err,\
  \ req, res, next) => {\n  console.error(err);\n  res.status(500).json({ error: \"internal\" });\n});\n\
  \napp.listen(3000);\n```\n\n## Best Practices\n\n- Put helmet, cors, and json body parsing before routes\n\
  - Validate request input; never trust req.body blindly\n- Centralize error handling in one error middleware\n\
  - Use async wrapper or try/catch for promises in handlers\n- Run npm audit in CI and pin production\
  \ dependencies\n- Serve behind a reverse proxy with trust proxy enabled when needed\n\n## Capabilities\n\
  \n### express-app\nScaffold and run Express applications.\n\n**Commands:**\n- `npm init -y`\n- `npm\
  \ install express`\n- `npx express-generator myapp`\n- `node server.js`\n- `npm start`\n\n**Examples:**\n\
  - npx express-generator --view=ejs myapp\n- node --watch server.js\n- npm run dev\n\n### express-middleware\n\
  Add routing, validation, and error middleware.\n\n**Commands:**\n- `npm install helmet cors express-rate-limit`\n\
  - `npm install morgan`\n- `npm install --save-dev supertest`\n- `npm audit fix`\n\n**Examples:**\n-\
  \ npm install express-validator joi\n- npm install compression\n- npm audit --audit-level=high"
prompt: Act as express and handle the task per the instructions.
