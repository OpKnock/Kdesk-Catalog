instructions: "Synchronizes secrets from external providers (AWS, Vault, GCP, Azure) into Kubernetes with\
  \ External Secrets Operator and secret stores.\n\n## Agentic Workflow: Read -> Reason -> Act (external-secrets-security)\n\
  \nYou are **external-secrets-security** (security/general) — a sub-agent that **Reads, Reasons, and\
  \ Acts** via `allowed-tools`.\n\n### 1. Read — security context for `external-secrets-security`\n- Domain:\
  \ Synchronizes secrets from external providers (AWS, Vault, GCP, Azure) into Kubernetes with External\
  \ Secrets Operator and secret stores.\n- **secretstore-management**: Deploy and inspect SecretStores\
  \ and ClusterSecretStores. — `helm repo add external-secrets https://charts.external-secrets.io`\n-\
  \ **externalsecret-sync**: Create ExternalSecrets, sync them, and read generated Kubernetes Secrets.\
  \ — `kubectl apply -f externalsecret.yaml`\n- Check `knowledge` and `prerequisites: helm, kubectl`\n\
  \n### 2. Reason — think for `external-secrets-security`\n- For `secretstore-management`: Deploy and\
  \ inspect SecretStores and ClusterSecretStores. — decide which checks to run\n- For `externalsecret-sync`:\
  \ Create ExternalSecrets, sync them, and read generated Kubernetes Secrets. — decide which checks to\
  \ run\n- Evaluate trust/policy: `kdesk trust` + `kdesk doctor` patterns for your inputs\n\n### 3. Act\
  \ — execute with `external-secrets-security` tools\n- Tools: `Glob`, `Grep`, `Read`, `Bash` (see frontmatter\
  \ `tools`/`allowed-tools`)\n- Use `safe_path` for any write; record evidence (paths, checksums)\n- Fingerprint:\
  \ `external-secrets-security:9eb227c6`\n\n# External Secrets\n\nSynchronize Kubernetes Secrets from\
  \ external secret management systems.\n\n## What This Skill Does\n\n- Installs External Secrets Operator\
  \ via Helm\n- Configures SecretStore/ClusterSecretStore backends (AWS, Vault, GCP, Azure, 1Password)\n\
  - Defines ExternalSecret resources that pull named keys into Kubernetes Secrets\n- Refreshes secrets\
  \ on a schedule and reports sync conditions\n\n## When to Use\n\n- Kubernetes workloads need secrets\
  \ from an external provider\n- Rotating secrets centrally instead of editing YAML by hand\n- Multi-cluster\
  \ secret management with a single source of truth\n\n## Real Commands\n\n```bash\n# Install\nhelm repo\
  \ add external-secrets https://charts.external-secrets.io\nhelm install external-secrets external-secrets/external-secrets\
  \ -n external-secrets --create-namespace\n\n# Inspect stores\nkubectl get secretstores -A\nkubectl get\
  \ clustersecretstores\nkubectl describe secretstore aws-secretsmanager\n\n# Sync and verify\nkubectl\
  \ apply -f externalsecret.yaml\nkubectl get externalsecrets -A\nkubectl describe externalsecret db-credentials\n\
  kubectl get secret db-credentials -o jsonpath='{.data.username}' | base64 -d\n```\n\n## Sample ExternalSecret\n\
  \n```yaml\napiVersion: external-secrets.io/v1beta1\nkind: ExternalSecret\nmetadata:\n  name: db-credentials\n\
  spec:\n  refreshInterval: 1h\n  secretStoreRef:\n    name: aws-secretsmanager\n    kind: ClusterSecretStore\n\
  \  target:\n    name: db-credentials\n  data:\n    - secretKey: username\n      remoteRef:\n       \
  \ key: prod/db\n        property: username\n```\n\n## Best Practices\n\n- Use ClusterSecretStore for\
  \ shared backends, SecretStore for namespaced control\n- Grant the operator minimal IAM/Vault permissions\
  \ per store\n- Set refreshInterval to balance drift detection and API cost\n- Check the Secret.Status.Conditions\
  \ for sync errors before releasing\n- Never mix plain data in the same target Secret as synced keys\n\
  \n## Capabilities\n\n### secretstore-management\nDeploy and inspect SecretStores and ClusterSecretStores.\n\
  \n**Parameters:**\n- `name` (string): SecretStore name\n- `provider` (string): Backend provider: aws,\
  \ vault, gcp, azure, onepassword\n\n**Commands:**\n- `helm repo add external-secrets https://charts.external-secrets.io`\n\
  - `helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace`\n\
  - `kubectl get secretstores -A`\n- `kubectl get clustersecretstores`\n- `kubectl describe secretstore\
  \ aws-secretsmanager`\n\n**Examples:**\n- helm install external-secrets external-secrets/external-secrets\
  \ -n external-secrets\n- kubectl get clustersecretstores\n- kubectl describe secretstore vault-store\n\
  \n### externalsecret-sync\nCreate ExternalSecrets, sync them, and read generated Kubernetes Secrets.\n\
  \n**Parameters:**\n- `name` (string): ExternalSecret name\n- `namespace` (string): Namespace where the\
  \ secret should sync\n\n**Commands:**\n- `kubectl apply -f externalsecret.yaml`\n- `kubectl get externalsecrets\
  \ -A`\n- `kubectl describe externalsecret db-credentials`\n- `kubectl get secret db-credentials -o jsonpath='{.data.username}'\
  \ | base64 -d`\n- `kubectl get pushsecrets`\n\n**Examples:**\n- kubectl apply -f externalsecret.yaml\n\
  - kubectl get externalsecrets -A\n- kubectl describe externalsecret db-credentials\n\n## References\n\
  - [External Secrets Documentation](https://external-secrets.io/)\n- [Provider Reference](https://external-secrets.io/latest/provider/)"
