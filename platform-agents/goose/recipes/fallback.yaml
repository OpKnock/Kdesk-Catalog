title: Fallback
description: 'Infrastructure failover strategies: nginx upstream server groups with backup servers for
  automatic failover, DNS round-robin and failover records for multi-region routing, and CDN origin switching
  so static content remains available during outages.'
version: 2.0.0
instructions: "# Fallback\n\nInfrastructure failover strategies: nginx upstream server groups with backup\
  \ servers for automatic failover, DNS round-robin and failover records for multi-region routing, and\
  \ CDN origin switching so static content remains available during outages.\n\n## Instructions\n\n# Fallback\n\
  \n## What this skill does\n\nInfrastructure-level failover routes traffic away from dead endpoints:\
  \ nginx upstream server groups with backup servers, DNS-based multi-region routing, and CDN origin switching\
  \ so content stays available during outages.\n\n## When to use\n\n- A single backend host fails and\
  \ the gateway returns 502\n- Adding multi-AZ or multi-region failover\n- Verifying which origin a CDN\
  \ currently serves\n\n## Real commands\n\n```bash\n# Validate and reload nginx\nnginx -t -c /etc/nginx/nginx.conf\n\
  nginx -s reload\n\n# What does DNS actually return?\ndig +short httpbin.org A\n\n# Where is the CDN\
  \ serving from?\ncurl -sI https://httpbin.org | grep -iE 'HTTP|x-cache'\n\n# Health timing\ncurl -s\
  \ -o /dev/null -w '%{http_code} %{time_total}s\\n' https://httpbin.org/get\n```\n\n## nginx upstream\
  \ failover example\n\n```nginx\nupstream api {\n  server api-1.internal:8080 max_fails=3 fail_timeout=30s;\n\
  \  server api-2.internal:8080 max_fails=3 fail_timeout=30s;\n  server api-backup.internal:8080 backup;\n\
  }\n\nserver {\n  listen 443 ssl;\n  location / {\n    proxy_pass http://api;\n    proxy_next_upstream\
  \ error timeout http_502 http_503;\n  }\n}\n```\n\n## DNS fallback\n\n```dns\napi.internal. 300 IN A\
  \ 10.0.1.10   ; primary\napi.internal. 300 IN A 10.0.2.10   ; failover region\n```\n\n## Testing failover\n\
  \n```bash\n# Stop primary, confirm the gateway still answers\nsystemctl stop api-1\nsleep 5\ncurl -s\
  \ -o /dev/null -w '%{http_code}' https://api.internal/health\n# expect 200 from api-2 or the backup\n\
  ```\n\n## Best practices\n\n- Use `backup` servers for cheap disaster-standby instead of parallel traffic.\n\
  - Set `proxy_next_upstream` to the exact conditions that justify failover.\n- Keep DNS TTL low (60-300s)\
  \ for fast failover, but not so low it thrashes.\n- Monitor 502/503 rates and upstream health checks,\
  \ not just DNS.\n\n## Capabilities\n\n### infra-failover\nConfigure nginx upstream failover, test DNS\
  \ fallback, and verify origin fallback behavior.\n\n**Commands:**\n- `nginx -t -c /etc/nginx/nginx.conf`\n\
  - `nginx -s reload`\n- `curl -sI https://httpbin.org | grep -iE 'HTTP|x-cache'`\n- `dig +short httpbin.org\
  \ A`\n- `dig +short httpbin.org @8.8.8.8 | head -3`\n- `curl -s -o /dev/null -w '%{http_code} %{time_total}s\\\
  n' https://httpbin.org/get`\n\n**Examples:**\n- nginx -t -c /etc/nginx/nginx.conf && nginx -s reload\n\
  - dig +short httpbin.org A\n- curl -sI https://httpbin.org | grep -iE 'HTTP|x-cache'"
prompt: Act as Fallback and handle the task per the instructions.
