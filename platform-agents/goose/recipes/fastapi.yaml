  \ Run, generate schema for, and test FastAPI applications. — `uvicorn main:app --reload --port 8000`\n\
  - Check `knowledge` and `prerequisites: pip, python, uvicorn`\n\n### 2. Reason — think for `fastapi`\n\
  - For `fastapi-server`: Run, generate schema for, and test FastAPI applications. — decide which checks\
  \ to run\n- Evaluate trust/policy: `kdesk trust` + `kdesk doctor` patterns for your inputs\n\n### 3.\
  \ Act — execute with `fastapi` tools\n- Tools: `Glob`, `Grep`, `Read`, `Uvicorn`, `Bash` (see frontmatter\
  \ `tools`/`allowed-tools`)\n- Use `safe_path` for any write; record evidence (paths, checksums)\n- Fingerprint:\
  \ `fastapi:1414f2c8`\n\n# FastAPI\n\n## What this skill does\n\nFastAPI is a modern async Python framework\
  \ with automatic OpenAPI generation and Pydantic validation. This skill covers running uvicorn, defining\
  \ routes/models, exporting schemas, and testing.\n\n## When to use\n\n- Building a new Python REST API\n\
  - Generating client libraries from the auto OpenAPI schema\n- Writing fast async endpoints with type\
  \ validation\n\n## Real commands\n\n```bash\n# Install and run\npip install fastapi uvicorn[standard]\
  \ pydantic\nuvicorn main:app --reload --port 8000\n\n# Production: multiple workers on 0.0.0.0\nuvicorn\
  \ main:app --host 0.0.0.0 --port 8000 --workers 4\n\n# Inspect the auto-generated schema\ncurl -s http://localhost:8000/openapi.json\
  \ | jq '.paths | keys'\n\n# Tests\npython -m pytest tests/ -v\n```\n\n## Minimal app\n\n```python\n\
  from fastapi import FastAPI, HTTPException\nfrom pydantic import BaseModel\n\napp = FastAPI()\n\nclass\
  \ Order(BaseModel):\n    id: str\n    amount: float\n\n@app.get(\"/api/orders/{order_id}\")\nasync def\
  \ get_order(order_id: str) -> Order:\n    order = find(order_id)\n    if not order:\n        raise HTTPException(status_code=404,\
  \ detail=\"Order not found\")\n    return order\n```\n\n## Testing with TestClient\n\n```python\nfrom\
  \ fastapi.testclient import TestClient\nfrom main import app\n\nclient = TestClient(app)\n\ndef test_get_missing_order():\n\
  \    r = client.get(\"/api/orders/nope\")\n    assert r.status_code == 404\n```\n\n## Best practices\n\
  \n- Use async def for IO-bound routes; plain def for CPU-bound sync ones.\n- Let Pydantic models drive\
  \ both validation and response docs.\n- Set `responses={404: ...}` on routes for accurate generated\
  \ docs.\n- Use dependency injection for auth and DB sessions instead of globals.\n- In prod, run with\
  \ `--workers` behind a process manager, not `--reload`.\n\n## Capabilities\n\n### fastapi-server\nRun,\
  \ generate schema for, and test FastAPI applications.\n\n**Parameters:**\n- `module` (string): ASGI\
  \ module path like main:app\n- `port` (integer): Server port\n- `workers` (integer): Number of uvicorn\
  \ workers\n\n**Commands:**\n- `uvicorn main:app --reload --port 8000`\n- `uvicorn main:app --host 0.0.0.0\
  \ --port 8000 --workers 4`\n- `curl -s http://localhost:8000/openapi.json | jq '.paths | keys'`\n- `python\
  \ -m pytest tests/ -v`\n- `pip install fastapi uvicorn[standard] pydantic`\n\n**Examples:**\n- uvicorn\
  \ main:app --reload --port 8000\n- curl -s http://localhost:8000/openapi.json | jq '.paths | keys'\n\
  - python -m pytest tests/ -v\n\n## References\n- [FastAPI Documentation](https://fastapi.tiangolo.com/)\n\
  - [Uvicorn docs](https://www.uvicorn.org/)"
