title: Fault Injection
description: 'Chaos engineering for API resilience: inject network latency and aborts via Istio VirtualService,
  run Chaos Mesh pod/network/stress experiments on Kubernetes, and use Toxiproxy for proxy-level fault
  simulation to validate retry and fallback behavior before production.'
version: 2.0.0
instructions: "# Fault Injection\n\nChaos engineering for API resilience: inject network latency and aborts\
  \ via Istio VirtualService, run Chaos Mesh pod/network/stress experiments on Kubernetes, and use Toxiproxy\
  \ for proxy-level fault simulation to validate retry and fallback behavior before production.\n\n##\
  \ Instructions\n\n# Fault Injection\n\n## What this skill does\n\nFault injection deliberately breaks\
  \ parts of the system to prove resilience: Istio delays/aborts HTTP traffic, Chaos Mesh kills pods or\
  \ saturates IO, and toxiproxy simulates proxy-level failures. The goal is finding weaknesses before\
  \ customers do.\n\n## When to use\n\n- Validating retries and fallbacks actually work\n- Testing degraded-mode\
  \ behavior before launch\n- Game-day exercises for on-call\n\n## Real commands\n\n```bash\n# Istio:\
  \ delay 2s on 50% of requests to reviews\nkubectl apply -f fault-injection.yaml\nkubectl get virtualservice\
  \ reviews -o yaml | grep -A5 fault\n\n# Chaos Mesh: kill 20% of pods for 1 minute\nkubectl apply -f\
  \ chaos-mesh-experiment.yaml\nkubectl get chaosexperiments -n chaos-mesh\n\n# Toxiproxy: run and add\
  \ a proxy\n docker run -d -p 8474:8474 shopify/toxiproxy\ncurl -s -X POST localhost:8474/proxies -d\
  \ '{\"name\":\"db\",\"listen\":\"0.0.0.0:5433\",\"upstream\":\"db:5432\"}'\n```\n\n## Istio fault injection\
  \ example\n\n```yaml\napiVersion: networking.istio.io/v1beta1\nkind: VirtualService\nmetadata:\n  name:\
  \ reviews\nspec:\n  hosts:\n    - reviews\n  http:\n    - fault:\n        delay:\n          percentage:\n\
  \            value: 50\n          fixedDelay: 2s\n      route:\n        - destination:\n           \
  \ host: reviews\n```\n\n## Safe experiment checklist\n\n- Start in staging; 5-10% blast radius.\n- Set\
  \ a hard end time for every experiment.\n- Verify monitoring covers the injected failure before running.\n\
  - Roll back via kubectl delete -f <experiment> immediately if impact surprises.\n\n## Testing\n\n```bash\n\
  # During the delay injection, watch client behavior\ncurl -s -o /dev/null -w '%{http_code} %{time_total}s\\\
  n' http://gateway.example/reviews\n```\n\n## Best practices\n\n- Run experiments during low traffic\
  \ windows first.\n- Tie experiments to a specific hypothesis (e.g. \"retry 3x survives 2s delays\").\n\
  - Automate with a game-day schedule; never run ad hoc in prod.\n\n## Capabilities\n\n### chaos-experiments\n\
  Inject faults at proxy, mesh, and node level, then verify application resilience.\n\n**Commands:**\n\
  - `kubectl apply -f fault-injection.yaml`\n- `kubectl get virtualservice reviews -o yaml | grep -A5\
  \ fault`\n- `kubectl apply -f chaos-mesh-experiment.yaml`\n- `kubectl get chaosexperiments -n chaos-mesh`\n\
  - `docker run -d -p 8474:8474 shopify/toxiproxy`\n- `curl -s -X POST localhost:8474/proxies -d '{\"\
  name\":\"db\",\"listen\":\"0.0.0.0:5433\",\"upstream\":\"db:5432\"}'`\n\n**Examples:**\n- kubectl apply\
  \ -f fault-injection.yaml && kubectl get virtualservice reviews -o yaml | grep -A5 fault\n- curl -s\
  \ -X POST localhost:8474/proxies -d '{\"name\":\"db\",\"listen\":\"0.0.0.0:5433\",\"upstream\":\"db:5432\"\
  }'\n- kubectl get chaosexperiments -n chaos-mesh"
prompt: Act as Fault Injection and handle the task per the instructions.
