title: Feature Flags
description: 'Feature flag management: launch, evaluate, and retire flags with LaunchDarkly, toggling
  features by environment and user segments.'
version: 2.0.0
instructions: "# Feature Flags\n\nFeature flag management: launch, evaluate, and retire flags with LaunchDarkly,\
  \ toggling features by environment and user segments.\n\n## Instructions\n\n# Feature Flags\n\n## What\
  \ this skill does\n\nFeature flags decouple deployment from release: code ships dark, and flags enable\
  \ features per environment, percentage, or user segment. This skill covers LaunchDarkly flag lifecycle\
  \ via the API and SDK.\n\n## When to use\n\n- Shipping a feature behind a kill switch\n- Progressive\
  \ rollouts (10% -> 50% -> 100%)\n- Per-customer or per-plan feature gating\n\n## Real commands\n\n```bash\n\
  # Create a flag\ncurl -s -X POST https://api.launchdarkly.com/api/v2/flags/default -H 'Authorization:\
  \ $LD_API_KEY' -H 'Content-Type: application/json' -d '{\"name\":\"new-checkout\",\"key\":\"new-checkout\"\
  ,\"variations\":[{\"value\":false},{\"value\":true}]}' | jq '.key'\n\n# Roll out to 10%\ncurl -s -X\
  \ PATCH https://api.launchdarkly.com/api/v2/flags/default/new-checkout -H 'Authorization: $LD_API_KEY'\
  \ -H 'Content-Type: application/json' -d '{\"comment\":\"enable 10%\",\"patch\":[{\"op\":\"replace\"\
  ,\"path\":\"/fallthrough/rollout\",\"value\":{\"variations\":[{\"variation\":0,\"weight\":90000},{\"\
  variation\":1,\"weight\":10000}]}}]}' | jq '.key'\n\n# Evaluate in Node\nnode -e \"const {LDClient}=require('launchdarkly-node-server-sdk');const\
  \ c=LDClient.init(process.env.LD_SDK_KEY);c.on('ready',()=>c.variation('new-checkout',{key:'user-1'},false).then(v=>{console.log('flag\
  \ =',v);c.close()}))\"\n\n# Audit usage before removal\n grep -rn 'new-checkout' src/ | head -20\n```\n\
  \n## Best practices\n\n- Flags need a default in code (false) so SDK failure degrades safely.\n- Add\
  \ a permanent kill-switch flag for each new major code path.\n- Remove flags within 2-4 weeks of full\
  \ rollout; dead flags rot.\n- Use environments to separate dev/prod toggle states.\n- Never gate security-critical\
  \ behavior behind a flag rollout.\n\n## Testing\n\n```bash\n# Verify the flag toggles correctly per\
  \ environment\ncurl -s https://app.launchdarkly.com/api/v2/flags/default/new-checkout -H 'Authorization:\
  \ $LD_API_KEY' | jq '{key, on: .on}'\n```\n\n## Capabilities\n\n### flag-ops\nCreate and toggle flags\
  \ in LaunchDarkly, evaluate via the SDK, and audit flag usage.\n\n**Commands:**\n- `curl -s -X POST\
  \ https://api.launchdarkly.com/api/v2/flags/default -H 'Authorization: $LD_API_KEY' -H 'Content-Type:\
  \ application/json' -d '{\"name\":\"new-checkout\",\"key\":\"new-checkout\",\"variations\":[{\"value\"\
  :false},{\"value\":true}]}' | jq '.key'`\n- `curl -s -X PATCH https://api.launchdarkly.com/api/v2/flags/default/new-checkout\
  \ -H 'Authorization: $LD_API_KEY' -H 'Content-Type: application/json' -d '{\"comment\":\"enable 10%\"\
  ,\"patch\":[{\"op\":\"replace\",\"path\":\"/fallthrough/rollout\",\"value\":{\"variations\":[{\"variation\"\
  :0,\"weight\":90000},{\"variation\":1,\"weight\":10000}]}}]}' | jq '.key'`\n- `node -e \"const {LDClient}=require('launchdarkly-node-server-sdk');const\
  \ c=LDClient.init(process.env.LD_SDK_KEY);c.on('ready',()=>c.variation('new-checkout',{key:'user-1'},false).then(v=>{console.log('flag\
  \ =',v);c.close()}))\"`\n- `grep -rn 'new-checkout' src/ | head -20`\n- `curl -s https://app.launchdarkly.com/api/v2/flags/default/new-checkout\
  \ -H 'Authorization: $LD_API_KEY' | jq '{key, on: .on, targeting: .fallthrough.rollout}'`\n\n**Examples:**\n\
  - curl -s -X PATCH https://api.launchdarkly.com/api/v2/flags/default/new-checkout -H 'Authorization:\
  \ $LD_API_KEY' -H 'Content-Type: application/json' -d '{\"comment\":\"enable 10%\",\"patch\":[{\"op\"\
  :\"replace\",\"path\":\"/fallthrough/rollout\",\"value\":{\"variations\":[{\"variation\":0,\"weight\"\
  :90000},{\"variation\":1,\"weight\":10000}]}}]}' | jq '.key'\n- node -e \"const {LDClient}=require('launchdarkly-node-server-sdk');const\
  \ c=LDClient.init(process.env.LD_SDK_KEY);c.on('ready',()=>c.variation('new-checkout',{key:'user-1'},false).then(v=>{console.log('flag\
  \ =',v);c.close()}))\"\n- grep -rn 'new-checkout' src/ | head -20"
prompt: Act as Feature Flags and handle the task per the instructions.
