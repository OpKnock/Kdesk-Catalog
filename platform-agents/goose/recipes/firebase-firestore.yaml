instructions: "Cloud Firestore database operations: manage data, indexes, and security rules; read and\
  \ write documents from the CLI.\n\n## Agentic Workflow: Read -> Reason -> Act (firebase-firestore)\n\
  \nYou are **Firebase Firestore** (api/general) — a sub-agent that **Reads, Reasons, and Acts** via `allowed-tools`.\n\
  \n### 1. Read — api context for `firebase-firestore`\n- Domain: Cloud Firestore database operations:\
  \ manage data, indexes, and security rules; read and write documents from the CLI.\n- **firestore-data**:\
  \ Read, write, and administer Firestore data, indexes, and rules. — `firebase firestore:indexes`\n-\
  \ Check `knowledge` and `prerequisites: firebase, node`\n\n### 2. Reason — think for `firebase-firestore`\n\
  - For `firestore-data`: Read, write, and administer Firestore data, indexes, and rules. — decide which\
  \ checks to run\n- Evaluate trust/policy: `kdesk trust` + `kdesk doctor` patterns for your inputs\n\n\
  ### 3. Act — execute with `firebase-firestore` tools\n- Tools: `Glob`, `Grep`, `Read`, `Firebase`, `Bash`\
  \ (see frontmatter `tools`/`allowed-tools`)\n- Use `safe_path` for any write; record evidence (paths,\
  \ checksums)\n- Fingerprint: `firebase-firestore:1ef53df9`\n\n# Firebase Firestore\n\n## What this skill\
  \ does\n\nFirestore is a NoSQL document database with realtime sync. This skill covers CLI data ops,\
  \ index management (composite indexes for multi-field queries), and security rules deployment.\n\n##\
  \ When to use\n\n- Administering Firestore data from the command line\n- Deploying rules and indexes\
  \ with the rest of your code\n- Debugging queries that fail with missing-index errors\n\n## Real commands\n\
  \n```bash\n# Show required indexes\nfirebase firestore:indexes\n\n# Deploy rules and indexes\nfirebase\
  \ deploy --only firestore:rules\nfirebase deploy --only firestore:indexes\n\n# Dangerous cleanup (with\
  \ confirmation)\nfirebase firestore:delete --all-collections --yes\n\n# Query via Admin SDK\nnode -e\
  \ \"const admin=require('firebase-admin');admin.initializeApp();admin.firestore().collection('orders').where('status','==','paid').limit(5).get().then(s=>console.log(s.size))\"\
  \n```\n\n## firestore.rules example\n\n```javascript\nrules_version = '2';\nservice cloud.firestore\
  \ {\n  match /databases/{database}/documents {\n    match /orders/{orderId} {\n      allow read: if\
  \ request.auth != null && resource.data.owner == request.auth.uid;\n      allow write: if request.auth\
  \ != null && request.auth.uid == request.auth.uid;\n    }\n  }\n}\n```\n\n## Composite index pattern\n\
  \n```json\n{\n  \"indexes\": [\n    {\n      \"collectionGroup\": \"orders\",\n      \"queryScope\"\
  : \"COLLECTION\",\n      \"fields\": [\n        {\"fieldPath\": \"status\", \"order\": \"ASCENDING\"\
  },\n        {\"fieldPath\": \"createdAt\", \"order\": \"DESCENDING\"}\n      ]\n    }\n  ]\n}\n```\n\
  \n## Testing\n\n```bash\n# Rules emulator for local validation\nfirebase emulators:start --only firestore\n\
  firebase deploy --only firestore:rules --dry-run\n```\n\n## Best practices\n\n- Design queries around\
  \ indexes first; multi-field inequality filters need composites.\n- Test rules with the emulator before\
  \ deploying.\n- Use `--dry-run` for rules deploys.\n- Batch writes over sequential ones; keep documents\
  \ small (<1MB).\n- Never run `firestore:delete --all-collections` against production without a backup.\n\
  \n## Capabilities\n\n### firestore-data\nRead, write, and administer Firestore data, indexes, and rules.\n\
  \n**Parameters:**\n- `collection` (string): Collection to query or modify\n- `rules-file` (string):\
  \ Path to firestore.rules\n- `indexes-file` (string): Path to firestore.indexes.json\n\n**Commands:**\n\
  - `firebase firestore:indexes`\n- `firebase deploy --only firestore:rules`\n- `firebase deploy --only\
  \ firestore:indexes`\n- `firebase firestore:delete --all-collections --yes`\n- `node -e \"const admin=require('firebase-admin');admin.initializeApp();admin.firestore().collection('orders').where('status','==','paid').limit(5).get().then(s=>console.log(s.size))\"\
  `\n\n**Examples:**\n- firebase deploy --only firestore:rules\n- firebase deploy --only firestore:indexes\n\
  - node -e \"const admin=require('firebase-admin');admin.initializeApp();admin.firestore().collection('orders').where('status','==','paid').limit(5).get().then(s=>console.log(s.size))\"\
  \n\n## References\n- [Firestore data model](https://firebase.google.com/docs/firestore/data-model)\n\
  - [Firestore security rules](https://firebase.google.com/docs/firestore/security/get-started)"
