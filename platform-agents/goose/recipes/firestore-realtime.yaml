title: Firestore Realtime
description: 'Firestore realtime updates: subscribe to document and collection snapshots, handle listener
  lifecycle, and debug sync lag.'
version: 2.0.0
instructions: "# Firestore Realtime\n\nFirestore realtime updates: subscribe to document and collection\
  \ snapshots, handle listener lifecycle, and debug sync lag.\n\n## Instructions\n\n# Firestore Realtime\n\
  \n## What this skill does\n\nFirestore pushes document changes to subscribed clients via snapshot listeners.\
  \ `onSnapshot` fires on server updates, local writes, and cache events; listeners auto-reconnect and\
  \ dedupe.\n\n## When to use\n\n- Chat, presence, or collaborative screens\n- Dashboards that must reflect\
  \ DB state instantly\n- Any screen that should update without polling\n\n## Real commands\n\n```bash\n\
  # Document listener\nnode -e \"const {onSnapshot,doc}=require('firebase/firestore');onSnapshot(doc(db,'orders','o1'),s=>console.log(s.data()));setTimeout(()=>{},10000)\"\
  \n\n# Query listener with filter\nnode -e \"const {onSnapshot,collection,query,where}=require('firebase/firestore');onSnapshot(query(collection(db,'orders'),where('status','==','paid')),s=>console.log('size',s.size))\"\
  \n\n# Unsubscribe properly\nnode -e \"const unsub=onSnapshot(doc(db,'orders','o1'),()=>{});setTimeout(unsub,5000);console.log('unsubscribed')\"\
  \n\n# Find all listeners in code\n grep -rn 'onSnapshot' src/ | head -10\n```\n\n## Metadata handling\n\
  \n```javascript\nonSnapshot(docRef, { includeMetadataChanges: true }, (snap) => {\n  if (snap.metadata.hasPendingWrites)\
  \ console.log('local write, not yet on server')\n  if (!snap.metadata.isFromCache) console.log('fresh\
  \ from server')\n})\n```\n\n## Testing\n\n```bash\nfirebase emulators:start --only firestore\n# write\
  \ a doc via the emulator UI and watch the listener fire\nnode -e \"const {setDoc,doc}=require('firebase/firestore');setDoc(doc(db,'orders','o1'),{status:'paid'})\"\
  \n```\n\n## Best practices\n\n- Always store the unsubscribe function and call it on screen teardown.\n\
  - Prefer filtered queries over listening to whole collections.\n- Use `includeMetadataChanges` to distinguish\
  \ cache vs server events.\n- Cap concurrent listeners; each one is a connection/session on the backend.\n\
  - Handle listener errors: log, retry, and surface offline state.\n\n## Capabilities\n\n### realtime-listeners\n\
  Attach, manage, and debug Firestore snapshot listeners.\n\n**Commands:**\n- `node -e \"const {onSnapshot,doc}=require('firebase/firestore');onSnapshot(doc(db,'orders','o1'),s=>console.log(s.data()));setTimeout(()=>{},10000)\"\
  `\n- `node -e \"const {onSnapshot,collection,query,where}=require('firebase/firestore');onSnapshot(query(collection(db,'orders'),where('status','==','paid')),s=>console.log('size',s.size))\"\
  `\n- `grep -rn 'onSnapshot' src/ | head -10`\n- `firebase emulators:start --only firestore`\n- `node\
  \ -e \"const unsub=onSnapshot(doc(db,'orders','o1'),()=>{});setTimeout(unsub,5000);console.log('unsubscribed')\"\
  `\n\n**Examples:**\n- node -e \"const {onSnapshot,doc}=require('firebase/firestore');onSnapshot(doc(db,'orders','o1'),s=>console.log(s.data()));setTimeout(()=>{},10000)\"\
  \n- node -e \"const {onSnapshot,collection,query,where}=require('firebase/firestore');onSnapshot(query(collection(db,'orders'),where('status','==','paid')),s=>console.log('size',s.size))\"\
  \n- grep -rn 'onSnapshot' src/ | head -10"
