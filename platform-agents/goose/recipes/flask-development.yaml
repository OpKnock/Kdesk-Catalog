  \ checks to run\n- Evaluate trust/policy: `kdesk trust` + `kdesk doctor` patterns for your inputs\n\n\
  ### 3. Act — execute with `flask-development` tools\n- Tools: `Glob`, `Grep`, `Read`, `Flask`, `Bash`\
  \ (see frontmatter `tools`/`allowed-tools`)\n- Use `safe_path` for any write; record evidence (paths,\
  \ checksums)\n- Fingerprint: `flask-development:841be343`\n\n# Flask v2\n\n## What this skill does\n\
  \nFlask is a lightweight Python WSGI framework. Modern Flask (2.x+) has a rich CLI: `flask run`, `flask\
  \ routes`, `flask shell`, and application factories for testability.\n\n## When to use\n\n- Building\
  \ small to medium Python APIs and dashboards\n- Prototyping services quickly\n- Teaching or internal\
  \ tooling with minimal framework\n\n## Real commands\n\n```bash\n# Run with debug reloader\nflask --app\
  \ app run --debug\n\n# Bind to all interfaces on another port\nflask --app app run --host 0.0.0.0 --port\
  \ 5001\n\n# List registered routes\nflask --app app routes\n\n# Interactive shell with app context\n\
  flask --app app shell\n\n# Tests\npython -m pytest -v\n```\n\n## App factory example\n\n```python\n\
  from flask import Flask, jsonify\n\ndef create_app():\n    app = Flask(__name__)\n\n    @app.get(\"\
  /api/orders/<order_id>\")\n    def get_order(order_id):\n        if order_id not in (“1”, “2”):\n  \
  \          return jsonify({\"error\": \"not found\"}), 404\n        return jsonify({\"id\": order_id})\n\
  \n    @app.errorhandler(404)\n    def not_found(e):\n        return jsonify({\"error\": \"not found\"\
  }), 404\n\n    return app\n```\n\n## Testing with the test client\n\n```python\nimport pytest\nfrom\
  \ app import create_app\n\n@pytest.fixture\ndef client():\n    return create_app().test_client()\n\n\
  def test_missing_order(client):\n    assert client.get(\"/api/orders/99\").status_code == 404\n```\n\
  \n## Best practices\n\n- Use the app factory pattern for testability.\n- Configure via env vars and\
  \ app.config.from_prefixed_env.\n- Register blueprints for larger apps.\n- Run with a WSGI server (gunicorn)\
  \ in production, not flask run.\n- Use `flask routes` in CI to catch route typos.\n\n## Capabilities\n\
  \n### flask-development\nRun, debug, and test Flask applications with the flask CLI.\n\n**Parameters:**\n\
  - `app-module` (string): Flask app module like app or myapp:create_app\n- `port` (integer): Server port\n\
  - `debug` (boolean): Enable reloader/debugger\n\n**Commands:**\n- `flask --app app run --debug`\n- `flask\
  \ --app app run --host 0.0.0.0 --port 5001`\n- `flask --app app routes`\n- `python -m pytest -v`\n-\
  \ `flask --app app shell`\n\n**Examples:**\n- flask --app app run --debug\n- flask --app app routes\n\
  - python -m pytest -v\n\n## References\n- [Flask CLI docs](https://flask.palletsprojects.com/en/stable/cli/)\n\
  - [Flask testing](https://flask.palletsprojects.com/en/stable/testing/)"
