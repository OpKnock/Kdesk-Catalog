title: Flink Sql
description: 'Stream processing with Flink SQL: start the SQL client, run streaming queries against Kafka
  topics, and manage table sources and sinks.'
version: 2.0.0
instructions: "# Flink Sql\n\nStream processing with Flink SQL: start the SQL client, run streaming queries\
  \ against Kafka topics, and manage table sources and sinks.\n\n## Instructions\n\n# Flink SQL\n\n##\
  \ What this skill does\n\nFlink SQL turns stream processing into SQL: you declare Kafka topics as tables\
  \ and run continuous queries over them. The sql-client executes interactively or from .sql scripts.\n\
  \n## When to use\n\n- Aggregating event streams (counts, sums, windows)\n- Joining streaming data with\
  \ static dimension data\n- Prototyping pipelines before writing Java/Scala jobs\n\n## Real commands\n\
  \n```bash\n# Interactive SQL client\nsql-client.sh embedded --defaults conf/sql-client-defaults.yaml\n\
  \n# Execute a script headless\nsql-client.sh embedded -f /opt/jobs/orders.sql\n\n# Seed a Kafka topic\
  \ to test against\nkafka-console-producer --bootstrap-server localhost:9092 --topic orders.events\n\
  ```\n\n## SQL example\n\n```sql\nCREATE TABLE orders (\n  order_id STRING,\n  amount DECIMAL(10, 2),\n\
  \  ts TIMESTAMP(3),\n  WATERMARK FOR ts AS ts - INTERVAL '5' SECOND\n) WITH (\n  'connector' = 'kafka',\n\
  \  'topic' = 'orders.events',\n  'properties.bootstrap.servers' = 'localhost:9092',\n  'format' = 'json',\n\
  \  'scan.startup.mode' = 'latest-offset'\n);\n\nCREATE TABLE hourly_sales (\n  window_start TIMESTAMP(3),\n\
  \  total_amount DECIMAL(14, 2)\n) WITH (\n  'connector' = 'print'\n);\n\nINSERT INTO hourly_sales\n\
  SELECT TUMBLE_START(ts, INTERVAL '1' HOUR), SUM(amount)\nFROM orders\nGROUP BY TUMBLE(ts, INTERVAL '1'\
  \ HOUR);\n```\n\n## Testing\n\n```bash\n# Run a bounded test: read from a file sink with print connector\n\
  sql-client.sh embedded -f /opt/jobs/test.sql\n```\n\n## Best practices\n\n- Always define WATERMARKs\
  \ for event-time aggregations.\n- Set checkpointing (default 60s) for exactly-once state.\n- Prefer\
  \ `scan.startup.mode = 'earliest-offset'` for reprocessing.\n- Keep DDL in .sql scripts versioned with\
  \ the job.\n- Test with the print connector before wiring real sinks.\n\n## Capabilities\n\n### flink-sql-client\n\
  Run Flink SQL queries, define sources/sinks, and manage jobs.\n\n**Commands:**\n- `sql-client.sh embedded\
  \ --defaults conf/sql-client-defaults.yaml`\n- `sql-client.sh embedded -f /opt/jobs/orders.sql`\n- `kafka-console-producer\
  \ --bootstrap-server localhost:9092 --topic orders.events`\n- `sql-client.sh embedded --help`\n- `flink\
  \ run -d -c org.example.StreamJob /opt/jobs/job.jar`\n\n**Examples:**\n- sql-client.sh embedded -f /opt/jobs/orders.sql\n\
  - kafka-console-producer --bootstrap-server localhost:9092 --topic orders.events\n- sql-client.sh embedded\
  \ --help"
prompt: Act as Flink Sql and handle the task per the instructions.
