title: Fluent Bit
description: 'Lightweight log and metric forwarding with Fluent Bit: configure inputs, parsers, and outputs,
  and validate configs before running.'
version: 2.0.0
instructions: "# Fluent Bit\n\nLightweight log and metric forwarding with Fluent Bit: configure inputs,\
  \ parsers, and outputs, and validate configs before running.\n\n## Instructions\n\n# Fluent Bit\n\n\
  ## What this skill does\n\nFluent Bit is a high-performance log/metric processor written in C, ideal\
  \ for sidecars and edge agents. Config is declared in fluent-bit.conf with [SERVICE], [INPUT], [FILTER],\
  \ and [OUTPUT] sections; the CLI overrides at runtime.\n\n## When to use\n\n- Tailing container logs\
  \ to Elasticsearch/Loki\n- Forwarding syslog from network devices\n- Low-footprint logging on edge nodes\n\
  \n## Real commands\n\n```bash\n# Validate without running\nfluent-bit --dry-run -c fluent-bit.conf\n\
  \n# Run with a config\nfluent-bit -c fluent-bit.conf\n\n# Quick inline pipeline: tail -> stdout\nfluent-bit\
  \ -i tail -p path=/var/log/app.log -o stdout -f 1\n\n# Parsers at runtime\nfluent-bit -R parsers.conf\
  \ -i dummy -o stdout\n```\n\n## fluent-bit.conf example\n\n```ini\n[SERVICE]\n    Flush 1\n    Log_Level\
  \ info\n\n[INPUT]\n    Name tail\n    Path /var/log/app/*.log\n    Parser json\n    Tag app.*\n\n[FILTER]\n\
  \    Name rewrite_tag\n    Match app.*\n    Rule $log_level ^(ERROR|WARN)$ error.$TAG true\n\n[OUTPUT]\n\
  \    Name es\n    Match *\n    Host elasticsearch\n    Port 9200\n    Index app-logs\n```\n\n## Testing\n\
  \n```bash\n# Watch the pipeline end to end\nfluent-bit -i tail -p path=/tmp/demo.log -o stdout\n# in\
  \ another shell:\necho '{\"log_level\":\"ERROR\",\"msg\":\"boom\"}' >> /tmp/demo.log\n```\n\n## Best\
  \ practices\n\n- Always run `--dry-run` in CI before deploying configs.\n- Tag early, filter by tag,\
  \ and route outputs by tag.\n- Use built-in parsers (json, syslog, nginx) before writing custom regexes.\n\
  - Set reasonable Buffer_Size and Mem_Buf_Limit to avoid OOM on bursts.\n- Test parser regexes with `fluent-bit\
  \ -R parsers.conf -i dummy` offline.\n\n## Capabilities\n\n### fluentbit-config\nValidate configs, run\
  \ Fluent Bit with tail/forward inputs, and test outputs.\n\n**Commands:**\n- `fluent-bit --dry-run -c\
  \ fluent-bit.conf`\n- `fluent-bit -c fluent-bit.conf`\n- `fluent-bit -i tail -p path=/var/log/app.log\
  \ -o stdout -f 1`\n- `fluent-bit -R parsers.conf -i dummy -o stdout`\n- `fluent-bit --help | grep -A2\
  \ tail`\n\n**Examples:**\n- fluent-bit --dry-run -c fluent-bit.conf\n- fluent-bit -i tail -p path=/var/log/app.log\
  \ -o stdout -f 1\n- fluent-bit -R parsers.conf -i dummy -o stdout"
prompt: Act as Fluent Bit and handle the task per the instructions.
