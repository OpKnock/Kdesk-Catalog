instructions: "# flutter\n\nFlutter mobile development. Real flutter CLI.\n\n## Instructions\n\n# Flutter\n\
  \nFlutter mobile development using real CLI.\n\n## When to Use\n\n- Cross-platform mobile apps\n- Beautiful\
  \ UIs\n- High-performance apps\n\n## Commands\n\n```bash\n# Create project\nflutter create my_app\n\n\
  # Run on device\nflutter run\n\n# Run on specific device\nflutter run -d <device_id>\n\n# List devices\n\
  flutter devices\n\n# Build APK\nflutter build apk\n\n# Build iOS\nflutter build ios\n\n# Run tests\n\
  flutter test\n\n# Analyze\nflutter analyze\n\n# Clean\nflutter clean\n\n# Get packages\nflutter pub\
  \ get\n\n# Upgrade packages\nflutter pub upgrade\n```\n\n## Widget\n\n```dart\n// lib/widgets/user_card.dart\n\
  import 'package:flutter/material.dart';\n\nclass UserCard extends StatelessWidget {\n  final String\
  \ name;\n  final String email;\n  \n  const UserCard({\n    Key? key,\n    required this.name,\n   \
  \ required this.email,\n  }) : super(key: key);\n  \n  @override\n  Widget build(BuildContext context)\
  \ {\n    return Card(\n      child: Padding(\n        padding: const EdgeInsets.all(16.0),\n       \
  \ child: Column(\n          crossAxisAlignment: CrossAxisAlignment.start,\n          children: [\n \
  \           Text(\n              name,\n              style: const TextStyle(\n                fontSize:\
  \ 18,\n                fontWeight: FontWeight.bold,\n              ),\n            ),\n            const\
  \ SizedBox(height: 8),\n            Text(\n              email,\n              style: const TextStyle(color:\
  \ Colors.grey),\n            ),\n          ],\n        ),\n      ),\n    );\n  }\n}\n```\n\n## State\
  \ Management\n\n```dart\n// lib/providers/user_provider.dart\nimport 'package:flutter/foundation.dart';\n\
  \nclass UserProvider extends ChangeNotifier {\n  List<User> _users = [];\n  bool _loading = false;\n\
  \  \n  List<User> get users => _users;\n  bool get loading => _loading;\n  \n  Future<void> fetchUsers()\
  \ async {\n    _loading = true;\n    notifyListeners();\n    \n    final response = await http.get(Uri.parse('https://api.example.com/users'));\n\
  \    _users = (jsonDecode(response.body) as List)\n        .map((json) => User.fromJson(json))\n   \
  \     .toList();\n    \n    _loading = false;\n    notifyListeners();\n  }\n}\n```\n\n## Navigation\n\
  \n```dart\n// lib/main.dart\nimport 'package:flutter/material.dart';\n\nvoid main() => runApp(MyApp());\n\
  \nclass MyApp extends StatelessWidget {\n  @override\n  Widget build(BuildContext context) {\n    return\
  \ MaterialApp(\n      title: 'My App',\n      theme: ThemeData(primarySwatch: Colors.blue),\n      home:\
  \ HomeScreen(),\n    );\n  }\n}\n\nclass HomeScreen extends StatelessWidget {\n  @override\n  Widget\
  \ build(BuildContext context) {\n    return Scaffold(\n      appBar: AppBar(title: const Text('Home')),\n\
  \      body: Center(\n        child: ElevatedButton(\n          onPressed: () {\n            Navigator.push(\n\
  \              context,\n              MaterialPageRoute(builder: (context) => DetailScreen()),\n  \
  \          );\n          },\n          child: const Text('Go to Detail'),\n        ),\n      ),\n  \
  \  );\n  }\n}\n```\n\n## pubspec.yaml\n\n```yaml\nname: my_app\ndescription: A new Flutter project.\n\
  version: 1.0.0+1\n\nenvironment:\n  sdk: '>=3.0.0 <4.0.0'\n\ndependencies:\n  flutter:\n    sdk: flutter\n\
  \  http: ^1.1.0\n  provider: ^6.0.0\n  \ndev_dependencies:\n  flutter_test:\n    sdk: flutter\n  flutter_lints:\
  \ ^3.0.0\n```\n\n## Capabilities\n\n### flutter\nFlutter mobile development. Real flutter CLI.\n\n**Commands:**\n\
  - `flutter create my_app`\n- `flutter run`\n- `flutter run -d demo-device-id`\n- `flutter devices`\n\
  - `flutter build apk`\n- `flutter build ios`\n- `flutter test`\n- `flutter analyze`\n- `flutter clean`\n\
  - `flutter pub get`\n- `flutter pub upgrade`\n\n**Examples:**\n- flutter create my_app\n- flutter run\n\
  - flutter run -d demo-device-id"
