title: Flux
description: 'GitOps delivery with Flux: bootstrap clusters, reconcile from git repositories, and manage
  Helm releases and Kustomizations.'
version: 2.0.0
instructions: "# Flux\n\nGitOps delivery with Flux: bootstrap clusters, reconcile from git repositories,\
  \ and manage Helm releases and Kustomizations.\n\n## Instructions\n\n# Flux\n\n## What this skill does\n\
  \nFlux is a GitOps operator for Kubernetes: it watches git repositories, applies manifests and Helm\
  \ charts, and keeps the cluster in sync with git. The CLI bootstraps and operates the controllers.\n\
  \n## When to use\n\n- Adopting GitOps for cluster delivery\n- Automating Helm releases from git\n- Reverting\
  \ to a previous state by reverting a commit\n\n## Real commands\n\n```bash\n# Bootstrap onto a cluster\
  \ (creates controllers + repo config)\nflux bootstrap github --owner=myorg --repository=infra --branch=main\
  \ --path=./clusters/prod\n\n# Create a source and a kustomization\nflux create source git app-infra\
  \ --url=https://github.com/myorg/app-infra --branch=main\nflux create kustomization apps --source=app-infra\
  \ --path=./apps --prune=true --interval=5m\n\n# Force reconciliation\nflux reconcile kustomization apps\
  \ --with-source\n\n# Inspect state\nflux get kustomizations\nflux get helmreleases -A\n```\n\n## Typical\
  \ layout\n\n```\nclusters/prod/\n  flux-system/          # generated by bootstrap\n  apps.yaml\n  helmreleases/\n\
  apps/\n  payments/\n    kustomization.yaml\n    deployment.yaml\n```\n\n## Testing\n\n```bash\n# Verify\
  \ source health and last applied commit\nflux get sources git -A\nflux get kustomizations -o json |\
  \ jq '.[] | {name: .metadata.name, ready: .status.conditions[0].status}'\n```\n\n## Best practices\n\
  \n- One repo or path per environment; keep prod separate from dev.\n- Use `--prune=true` so deleted\
  \ git files are removed from the cluster.\n- Enable notifications (flux create alert) for sync failures.\n\
  - Test kustomizations in staging before adding to prod path.\n- Keep secrets in sealed secrets or external-secrets,\
  \ never plain in git.\n\n## Capabilities\n\n### flux-gitops\nBootstrap Flux, create sources and kustomizations,\
  \ and reconcile cluster state from git.\n\n**Commands:**\n- `flux bootstrap github --owner=myorg --repository=infra\
  \ --branch=main --path=./clusters/prod`\n- `flux create source git app-infra --url=https://github.com/myorg/app-infra\
  \ --branch=main`\n- `flux create kustomization apps --source=app-infra --path=./apps --prune=true --interval=5m`\n\
  - `flux reconcile kustomization apps --with-source`\n- `flux get kustomizations`\n- `flux get helmreleases\
  \ -A`\n\n**Examples:**\n- flux bootstrap github --owner=myorg --repository=infra --branch=main --path=./clusters/prod\n\
  - flux reconcile kustomization apps --with-source\n- flux get kustomizations"
prompt: Act as Flux and handle the task per the instructions.
