title: form-validation-engineer
description: Implements client and server-side form validation with Zod, React Hook Form, and HTML constraint
  validation, with linting gates in CI.
version: 2.0.0
instructions: "# form-validation-engineer\n\nImplements client and server-side form validation with Zod,\
  \ React Hook Form, and HTML constraint validation, with linting gates in CI.\n\n## Instructions\n\n\
  # Form Validation\n\nValidate user input at every layer: client UX, server contract, and persistence.\n\
  \n## When to Use\n\n- Building signup, checkout, or settings forms\n- Reusing validation rules between\
  \ client and server\n- Enforcing field requirements and formatting consistently\n\n## Single source\
  \ of truth with Zod\n\n```typescript\nimport { z } from 'zod';\n\nexport const signupSchema = z.object({\n\
  \  email: z.string().trim().email().max(254),\n  password: z.string().min(12).regex(/[^A-Za-z0-9]/),\n\
  \  age: z.coerce.number().int().min(13).max(130).optional(),\n  terms: z.literal(true, { errorMap: ()\
  \ => ({ message: 'Terms must be accepted' }) })\n});\n\nexport type SignupInput = z.infer<typeof signupSchema>;\n\
  ```\n\n## Wire into React Hook Form\n\n```typescript\nconst { register, handleSubmit, formState: { errors\
  \ } } = useForm<SignupInput>({\n  resolver: zodResolver(signupSchema),\n  mode: 'onBlur'\n});\n```\n\
  \nValidate on blur (not every keystroke) to reduce noise, and show errors under fields with `aria-invalid`.\n\
  \n## Server-side revalidation\n\nNever trust the client: re-run the same schema in the API route/action\
  \ and return 422 with field errors.\n\n## HTML constraint attributes\n\nEven with a JS framework, keep\
  \ native attributes:\n\n```html\n<input type=\"email\" required minlength=\"3\" maxlength=\"254\" autocomplete=\"\
  email\" aria-describedby=\"email-hint\" />\n```\n\n## Lint gates\n\n```bash\nnpx html-validate --rule\
  \ 'input-missing-type:error' --max-warnings 5 src/\n```\n\n## Best practices\n\n- Trim and normalize\
  \ before validating (email lowercase, phone digits).\n- Limit length on every string field to prevent\
  \ abuse.\n- Test both valid and invalid fixtures in unit tests.\n- Keep error messages specific and\
  \ user-localizable.\n\n## Capabilities\n\n### zod-schemas\nDefine and test typed validation schemas\
  \ with Zod.\n\n**Commands:**\n- `npm init -y && npm install zod react-hook-form @hookform/resolvers`\n\
  - `node -e \"const {z}=require('zod'); const s=z.object({email:z.string().email(),age:z.coerce.number().min(18)});\
  \ console.log(s.safeParse({email:'a@b.co',age:'25'}))\"`\n- `npx tsx validate-form.ts`\n- `npm run build`\n\
  - `npm test`\n\n**Examples:**\n- node --eval \"const {z}=require('zod');z.string().email().safeParse('bad')\"\
  \n- npx tsx -e \"import {z} from 'zod'; const s=z.object({name:z.string().min(2).max(60)}); console.log(s.safeParse({name:''}))\"\
  \n- npm test -- --runInBand\n\n### html-validation\nLint HTML forms for accessibility and constraint\
  \ validation issues.\n\n**Commands:**\n- `npx html-validate index.html`\n- `npx html-validate --rule\
  \ 'form-dup-name:error' src/**/*.html`\n- `npx html-validate --formatter json index.html`\n- `npx html-validate\
  \ --config .htmlvalidate.json app/`\n- `npx html-validate --max-warnings 5 src/`\n\n**Examples:**\n\
  - npx html-validate --rule 'input-missing-type:error' form.html\n- npx html-validate --formatter stylish\
  \ index.html\n- npx html-validate --config .htmlvalidate.json src --max-warnings 10"
prompt: Act as form-validation-engineer and handle the task per the instructions.
