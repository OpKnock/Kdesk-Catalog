title: Gcp Cloud Functions
description: 'Deploy and manage Cloud Functions (Gen2): deploy from source, set env vars, view logs, and
  invoke functions for testing.'
version: 2.0.0
instructions: "# Gcp Cloud Functions\n\nDeploy and manage Cloud Functions (Gen2): deploy from source,\
  \ set env vars, view logs, and invoke functions for testing.\n\n## Instructions\n\n# GCP Cloud Functions\n\
  \n## What this skill does\n\nCloud Functions runs single-purpose serverless functions triggered by HTTP,\
  \ Pub/Sub, storage, or schedules. Gen2 functions run on Cloud Run infrastructure with more scaling control.\n\
  \n## When to use\n\n- Event-driven glue: process a message, resize an image, webhook handler\n- Cheap\
  \ scaling for variable workloads\n- Prototyping serverless quickly\n\n## Real commands\n\n```bash\n\
  # HTTP function\n gcloud functions deploy hello --runtime=python312 --trigger-http --allow-unauthenticated\
  \ --gen2\n\n# Pub/Sub-triggered function\n gcloud functions deploy orders-processor --runtime=nodejs20\
  \ --trigger-topic=orders --region=us-central1 --gen2\n\n# Invoke and read logs\n gcloud functions call\
  \ orders-processor --region=us-central1 --data='{\"orderId\":\"1\"}'\n gcloud functions logs read orders-processor\
  \ --region=us-central1 --limit=20\n\n# Get the URL\n gcloud functions describe orders-processor --region=us-central1\
  \ --format='value(serviceConfig.uri)'\n```\n\n## Env vars and retries\n\n```bash\n gcloud functions\
  \ deploy orders-processor --set-env-vars=DB_URL=postgres://... --max-retries=3 --gen2\n```\n\n## Testing\n\
  \n```bash\n# Direct HTTP invocation\nURL=$(gcloud functions describe hello --region=us-central1 --gen2\
  \ --format='value(serviceConfig.uri)')\ncurl -s -X POST \"$URL\" -H 'Content-Type: application/json'\
  \ -d '{\"msg\":\"ping\"}'\n```\n\n## Best practices\n\n- Make functions idempotent; Pub/Sub may retry\
  \ delivery.\n- Set `--max-retries` deliberately (0 for fire-and-forget).\n- Keep cold starts low: minimal\
  \ dependencies, no heavy init.\n- Use env vars via `--set-env-vars`, never secrets in source.\n- Use\
  \ secrets via Secret Manager references for credentials.\n\n## Capabilities\n\n### gcf-deploy\nDeploy,\
  \ invoke, log, and configure Cloud Functions.\n\n**Commands:**\n- `gcloud functions deploy orders-processor\
  \ --runtime=nodejs20 --trigger-topic=orders --region=us-central1 --gen2`\n- `gcloud functions deploy\
  \ hello --runtime=python312 --trigger-http --allow-unauthenticated --gen2`\n- `gcloud functions call\
  \ orders-processor --region=us-central1 --data='{\"orderId\":\"1\"}'`\n- `gcloud functions logs read\
  \ orders-processor --region=us-central1 --limit=20`\n- `gcloud functions describe orders-processor --region=us-central1\
  \ --format='value(serviceConfig.uri)'`\n- `gcloud functions delete orders-processor --region=us-central1\
  \ --quiet`\n\n**Examples:**\n- gcloud functions deploy hello --runtime=python312 --trigger-http --allow-unauthenticated\
  \ --gen2\n- gcloud functions call orders-processor --region=us-central1 --data='{\"orderId\":\"1\"}'\n\
  - gcloud functions logs read orders-processor --region=us-central1 --limit=20"
prompt: Act as Gcp Cloud Functions and handle the task per the instructions.
