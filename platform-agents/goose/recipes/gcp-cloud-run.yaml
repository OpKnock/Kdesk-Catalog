  \ gcloud`\n\n### 2. Reason — think for `gcp-cloud-run`\n- For `cloud-run`: Deploy revisions, manage\
  \ traffic, scale, and configure Cloud Run services. — decide which checks to run\n- Evaluate trust/policy:\
  \ `kdesk trust` + `kdesk doctor` patterns for your inputs\n\n### 3. Act — execute with `gcp-cloud-run`\
  \ tools\n- Tools: `Glob`, `Grep`, `Read`, `Gcloud` (see frontmatter `tools`/`allowed-tools`)\n- Use\
  \ `safe_path` for any write; record evidence (paths, checksums)\n- Fingerprint: `gcp-cloud-run:310fa0e2`\n\
  \n# GCP Cloud Run\n\n## What this skill does\n\nCloud Run runs stateless containers on a serverless\
  \ platform that scales to zero. Every deploy creates a revision; traffic can be split across revisions\
  \ for canary releases.\n\n## When to use\n\n- Deploying containerized APIs without managing servers\n\
  - Canary releases via traffic splitting\n- Autoscaling webhooks and batch jobs\n\n## Real commands\n\
  \n```bash\n# Deploy a revision\n gcloud run deploy orders --image=gcr.io/my-project/orders:v1.2.3 --region=us-central1\
  \ --allow-unauthenticated\n\n# Get the URL\n gcloud run services describe orders --region=us-central1\
  \ --format='value(status.url)'\n\n# Canary: 10% to new revision\n gcloud run services update-traffic\
  \ orders --region=us-central1 --to-revisions=orders-00001=10,orders-00002=90\n\n# Scaling and env\n\
  \ gcloud run services update orders --region=us-central1 --min-instances=1 --max-instances=20 --set-env-vars=LOG_LEVEL=info\n\
  \n# Logs\n gcloud run services logs read orders --region=us-central1 --limit=50\n```\n\n## Rollback\n\
  \n```bash\n# Return all traffic to the previous revision\n gcloud run services update-traffic orders\
  \ --region=us-central1 --to-latest\n```\n\n## Testing\n\n```bash\n# Warm the container and check headers\n\
  curl -sI \"$(gcloud run services describe orders --region=us-central1 --format='value(status.url)')/health\"\
  \ | grep -i 'HTTP'\n```\n\n## Best practices\n\n- Use `--no-allow-unauthenticated` for internal services\
  \ and add IAM.\n- Set `--max-instances` to cap cold-start and cost spikes.\n- Deploy immutable tags\
  \ (v1.2.3) so revisions are identifiable.\n- Split traffic 10% and watch metrics before full rollout.\n\
  - Use Secret Manager env references for credentials.\n\n## Capabilities\n\n### cloud-run\nDeploy revisions,\
  \ manage traffic, scale, and configure Cloud Run services.\n\n**Parameters:**\n- `service` (string):\
  \ Cloud Run service name\n- `image` (string): Container image reference\n- `revision-traffic` (string):\
  \ Traffic split spec like rev1=50,rev2=50\n\n**Commands:**\n- `gcloud run deploy orders --image=gcr.io/my-project/orders:v1.2.3\
  \ --region=us-central1 --allow-unauthenticated`\n- `gcloud run services describe orders --region=us-central1\
  \ --format='value(status.url)'`\n- `gcloud run services update-traffic orders --region=us-central1 --to-revisions=orders-00001=10,orders-00002=90`\n\
  - `gcloud run services update orders --region=us-central1 --min-instances=1 --max-instances=20 --set-env-vars=LOG_LEVEL=info`\n\
  - `gcloud run revisions list --service=orders --region=us-central1`\n- `gcloud run services logs read\
  \ orders --region=us-central1 --limit=50`\n\n**Examples:**\n- gcloud run deploy orders --image=gcr.io/my-project/orders:v1.2.3\
  \ --region=us-central1 --allow-unauthenticated\n- gcloud run services update-traffic orders --region=us-central1\
  \ --to-revisions=orders-00001=10,orders-00002=90\n- gcloud run services describe orders --region=us-central1\
  \ --format='value(status.url)'\n\n## References\n- [Cloud Run docs](https://cloud.google.com/run/docs)\n\
  - [gcloud run reference](https://cloud.google.com/sdk/gcloud/reference/run)"
