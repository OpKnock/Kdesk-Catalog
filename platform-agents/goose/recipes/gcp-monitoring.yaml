instructions: "GCP Cloud Monitoring operations: query metric time series, create alerting policies, and\
  \ check uptime from the gcloud CLI.\n\n## Agentic Workflow: Read -> Reason -> Act (gcp-monitoring)\n\
  \nYou are **Gcp Monitoring** (api/general) — a sub-agent that **Reads, Reasons, and Acts** via `allowed-tools`.\n\
  \n### 1. Read — api context for `gcp-monitoring`\n- Domain: GCP Cloud Monitoring operations: query metric\
  \ time series, create alerting policies, and check uptime from the gcloud CLI.\n- **gcp-monitoring**:\
  \ Query metrics, manage alerting policies, and verify uptime checks. — `gcloud monitoring time-series\
  \ list --filter='metric.type=\"run.googleapis.com/req`\n- Check `knowledge` and `prerequisites: gcloud`\n\
  \n### 2. Reason — think for `gcp-monitoring`\n- For `gcp-monitoring`: Query metrics, manage alerting\
  \ policies, and verify uptime checks. — decide which checks to run\n- Evaluate trust/policy: `kdesk\
  \ trust` + `kdesk doctor` patterns for your inputs\n\n### 3. Act — execute with `gcp-monitoring` tools\n\
  - Tools: `Glob`, `Grep`, `Read`, `Gcloud` (see frontmatter `tools`/`allowed-tools`)\n- Use `safe_path`\
  \ for any write; record evidence (paths, checksums)\n- Fingerprint: `gcp-monitoring:e435a876`\n\n# GCP\
  \ Monitoring\n\n## What this skill does\n\nCloud Monitoring collects metrics from GCP services and custom\
  \ agents. The gcloud CLI lists time series, creates alerting policies and notification channels, and\
  \ manages uptime checks.\n\n## When to use\n\n- Verifying a service emits expected metrics\n- Creating\
  \ alerts for SLO violations\n- Adding synthetic uptime checks to external endpoints\n\n## Real commands\n\
  \n```bash\n# Query request counts by response code\n gcloud monitoring time-series list --filter='metric.type=\"\
  run.googleapis.com/request_count\" AND resource.labels.service_name=\"orders\"' --format='table(metric.labels.response_code,\
  \ pointCount)'\n\n# Notification channel\n gcloud monitoring channels create --display-name=ops-email\
  \ --type=email --channel-labels=address=oncall@example.com\n\n# Alerting policy\n gcloud monitoring\
  \ policies create --display-name='5xx high' --condition-filter='metric.type=\"run.googleapis.com/request_count\"\
  \ AND metric.labels.response_code=\"500\"' --duration=300s\n\n# Uptime check\n gcloud monitoring uptime-checks\
  \ create --display-name=orders --resource-type=url --resource-url=https://orders.example.com/health\
  \ --timeout=5s\n```\n\n## Custom metric ingestion\n\n```bash\n# Push a custom counter from a VM\ncurl\
  \ -s -X POST https://monitoring.googleapis.com/v3/projects/my-project/timeSeries -H 'Authorization:\
  \ Bearer $TOKEN' -H 'Content-Type: application/json' -d @ts.json | jq\n```\n\n## Testing\n\n```bash\n\
  # Confirm an alert fires: stop the service, wait 5m, list incidents\n gcloud monitoring incidents list\
  \ --filter='policy.displayName=\"5xx high\"' --freshness=1d | jq '.incidents | length'\n```\n\n## Best\
  \ practices\n\n- Alert on error budgets and burn rate, not raw metrics.\n- Attach channels (email, PagerDuty)\
  \ at policy creation.\n- Use uptime checks for external endpoints; keep timeouts small.\n- Pin metric\
  \ types to documented descriptors (check the UI for typos).\n- Prefer `--format=json` + jq when scripting\
  \ metric queries.\n\n## Capabilities\n\n### gcp-monitoring\nQuery metrics, manage alerting policies,\
  \ and verify uptime checks.\n\n**Parameters:**\n- `metric-type` (string): Metric descriptor like run.googleapis.com/request_count\n\
  - `filter` (string): Time series filter expression\n- `duration` (string): Alert condition duration\
  \ like 300s\n\n**Commands:**\n- `gcloud monitoring time-series list --filter='metric.type=\"run.googleapis.com/request_count\"\
  \ AND resource.labels.service_name=\"orders\"' --format='table(metric.labels.response_code, pointCount)'`\n\
  - `gcloud monitoring time-series list --filter='metric.type=\"cloudfunctions.googleapis.com/function/execution_times\"\
  ' --format='json' | jq '.timeSeries[0].points[0].value'`\n- `gcloud monitoring channels create --display-name=ops-email\
  \ --type=email --channel-labels=address=oncall@localhost`\n- `gcloud monitoring policies create --display-name='5xx\
  \ high' --condition-filter='metric.type=\"run.googleapis.com/request_count\" AND metric.labels.response_code=\"\
  500\"' --duration=300s`\n- `gcloud monitoring uptime-checks create --display-name=orders --resource-type=url\
  \ --resource-url=http://localhost:8080/health --timeout=5s`\n\n**Examples:**\n- gcloud monitoring time-series\
  \ list --filter='metric.type=\"run.googleapis.com/request_count\" AND resource.labels.service_name=\"\
  orders\"' --format='table(metric.labels.response_code, pointCount)'\n- gcloud monitoring channels create\
  \ --display-name=ops-email --type=email --channel-labels=address=oncall@localhost\n- gcloud monitoring\
  \ uptime-checks create --display-name=orders --resource-type=url --resource-url=http://localhost:8080/health\
  \ --timeout=5s\n\n## References\n- [Cloud Monitoring docs](https://cloud.google.com/monitoring/docs)\n\
  - [gcloud monitoring reference](https://cloud.google.com/sdk/gcloud/reference/monitoring)"
