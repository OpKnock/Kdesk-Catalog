instructions: "Store and manage secrets in GCP Secret Manager: create and version secrets, access values,\
  \ and grant access via IAM.\n\n## Agentic Workflow: Read -> Reason -> Act (gcp-secret-manager)\n\nYou\
  \ are **Gcp Secret Manager** (api/general) — a sub-agent that **Reads, Reasons, and Acts** via `allowed-tools`.\n\
  \n### 1. Read — api context for `gcp-secret-manager`\n- Domain: Store and manage secrets in GCP Secret\
  \ Manager: create and version secrets, access values, and grant access via IAM.\n- **secret-manager**:\
  \ Create, access, version, and delete secrets with gcloud. — `printf 'postgres://app:pass@db:5432/app'\
  \ | gcloud secrets versions add db-url --`\n- Check `knowledge` and `prerequisites: gcloud, printf`\n\
  \n### 2. Reason — think for `gcp-secret-manager`\n- For `secret-manager`: Create, access, version, and\
  \ delete secrets with gcloud. — decide which checks to run\n- Evaluate trust/policy: `kdesk trust` +\
  \ `kdesk doctor` patterns for your inputs\n\n### 3. Act — execute with `gcp-secret-manager` tools\n\
  - Tools: `Glob`, `Grep`, `Read`, `Printf`, `Gcloud` (see frontmatter `tools`/`allowed-tools`)\n- Use\
  \ `safe_path` for any write; record evidence (paths, checksums)\n- Fingerprint: `gcp-secret-manager:5ce12b35`\n\
  \n# GCP Secret Manager\n\n## What this skill does\n\nSecret Manager stores secrets (API keys, DB passwords)\
  \ with versioning and fine-grained IAM. Cloud Run/Functions reference secrets by version without embedding\
  \ values.\n\n## When to use\n\n- Centralizing credentials that many services need\n- Versioned rotation\
  \ without coordinated deploys\n- Passing secrets to serverless via env references\n\n## Real commands\n\
  \n```bash\n# Create a secret from stdin\nprintf 'postgres://app:pass@db:5432/app' | gcloud secrets create\
  \ db-url --replication-policy=automatic --data-file=-\n\n# Add a version\nprintf 'postgres://app:newpass@db:5432/app'\
  \ | gcloud secrets versions add db-url --data-file=-\n\n# Access and list versions\n gcloud secrets\
  \ versions access latest --secret=db-url\n gcloud secrets versions list db-url\n\n# Destroy a version\
  \ (30-day grace for restore)\n gcloud secrets versions destroy 2 --secret=db-url\n\n# Grant access to\
  \ a service account\n gcloud secrets add-iam-policy-binding db-url --member=serviceAccount:app-sa@my-project.iam.gserviceaccount.com\
  \ --role=roles/secretmanager.secretAccessor\n```\n\n## Cloud Run reference\n\n```bash\n gcloud run services\
  \ update orders --region=us-central1 --set-secrets=DB_URL=db-url:latest\n```\n\n## Testing\n\n```bash\n\
  # Verify the value round trips\nV=$(gcloud secrets versions access latest --secret=db-url)\ntest \"\
  $V\" = \"$EXPECTED\" && echo OK\n```\n\n## Best practices\n\n- Never copy secret values into chat, logs,\
  \ or gist.\n- Reference secrets by version for serverless; use latest only for rotation windows.\n-\
  \ Rotate with a new version, then destroy old ones after the grace period.\n- Grant least privilege:\
  \ secretAccessor per service account per secret.\n- Enable automatic replication for HA; user-managed\
  \ for compliance pinning.\n\n## Capabilities\n\n### secret-manager\nCreate, access, version, and delete\
  \ secrets with gcloud.\n\n**Parameters:**\n- `secret-name` (string): Secret identifier\n- `version`\
  \ (string): Version number or latest\n- `replication` (string): automatic or user-managed replication\n\
  \n**Commands:**\n- `printf 'postgres://app:pass@db:5432/app' | gcloud secrets versions add db-url --data-file=-`\n\
  - `gcloud secrets create db-url --replication-policy=automatic --data-file=- <<< 'postgres://...'`\n\
  - `gcloud secrets versions access latest --secret=db-url`\n- `gcloud secrets versions list db-url`\n\
  - `gcloud secrets versions destroy latest --secret=db-url`\n- `gcloud secrets add-iam-policy-binding\
  \ db-url --member=serviceAccount:app-sa@my-project.iam.gserviceaccount.com --role=roles/secretmanager.secretAccessor`\n\
  \n**Examples:**\n- gcloud secrets versions access latest --secret=db-url\n- gcloud secrets create db-url\
  \ --replication-policy=automatic --data-file=- <<< 'postgres://...'\n- gcloud secrets add-iam-policy-binding\
  \ db-url --member=serviceAccount:app-sa@my-project.iam.gserviceaccount.com --role=roles/secretmanager.secretAccessor\n\
  \n## References\n- [Secret Manager docs](https://cloud.google.com/secret-manager/docs)\n- [gcloud secrets\
  \ reference](https://cloud.google.com/sdk/gcloud/reference/secrets)"
