title: Gin
description: 'Build Go HTTP APIs with the Gin framework: run the server, register middleware, and test
  handlers.'
version: 2.0.0
instructions: "# Gin\n\nBuild Go HTTP APIs with the Gin framework: run the server, register middleware,\
  \ and test handlers.\n\n## Instructions\n\n# Gin\n\n## What this skill does\n\nGin is a popular Go web\
  \ framework with a martini-like API, fast HTTP router, JSON binding/validation, and a middleware chain.\
  \ This skill covers running, routing, and testing.\n\n## When to use\n\n- Building Go REST APIs quickly\n\
  - Teams preferring express-like syntax in Go\n- JSON-heavy services with validation needs\n\n## Real\
  \ commands\n\n```bash\n# Get and run\ngo get github.com/gin-gonic/gin\ngo run main.go\n\n# Build and\
  \ test\ngo build -o server main.go\ngo test ./... -race -v\n\n# Smoke test\ncurl -s localhost:8080/api/orders\
  \ | jq\n```\n\n## Minimal app\n\n```go\npackage main\n\nimport (\n    \"github.com/gin-gonic/gin\"\n\
  )\n\nfunc main() {\n    r := gin.Default()\n\n    r.GET(\"/api/orders/:id\", func(c *gin.Context) {\n\
  \        id := c.Param(\"id\")\n        if id == \"\" {\n            c.JSON(400, gin.H{\"error\": \"\
  missing id\"})\n            return\n        }\n        c.JSON(200, gin.H{\"id\": id})\n    })\n\n  \
  \  r.Run(\":8080\")\n}\n```\n\n## Middleware example\n\n```go\nfunc RequestID() gin.HandlerFunc {\n\
  \    return func(c *gin.Context) {\n        c.Header(\"X-Request-ID\", uuid.New().String())\n      \
  \  c.Next()\n    }\n}\n```\n\n## Testing\n\n```go\nfunc TestGetOrder(t *testing.T) {\n    router :=\
  \ setupRouter()\n    w := httptest.NewRecorder()\n    req, _ := http.NewRequest(\"GET\", \"/api/orders/1\"\
  , nil)\n    router.ServeHTTP(w, req)\n    if w.Code != 200 { t.Fatalf(\"got %d\", w.Code) }\n}\n```\n\
  \n## Best practices\n\n- Set `GIN_MODE=release` in production; debug mode is slow.\n- Use `ShouldBindJSON`\
  \ with explicit struct tags for validation.\n- Register recovery middleware; never let a panic escape.\n\
  - Test handlers with httptest against the router, not a live port.\n- Keep handlers thin; put logic\
  \ in services for testability.\n\n## Capabilities\n\n### gin-development\nRun Gin apps, add middleware,\
  \ and test handlers with Go testing.\n\n**Commands:**\n- `go get github.com/gin-gonic/gin`\n- `go run\
  \ main.go`\n- `go build -o server main.go`\n- `go test ./... -race -v`\n- `curl -s localhost:8080/api/orders\
  \ | jq`\n\n**Examples:**\n- go get github.com/gin-gonic/gin && go run main.go\n- go test ./... -race\
  \ -v\n- curl -s localhost:8080/api/orders | jq"
prompt: Act as Gin and handle the task per the instructions.
