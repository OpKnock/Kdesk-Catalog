title: git-hooks
description: 'Automates git hooks with pre-commit, Husky, and core.hooksPath: linting, formatting, secret
  scanning, and commit message checks.'
version: 2.0.0
instructions: "# git-hooks\n\nAutomates git hooks with pre-commit, Husky, and core.hooksPath: linting,\
  \ formatting, secret scanning, and commit message checks.\n\n## Instructions\n\n# Git Hooks Automation\n\
  \nEnforce code quality at commit time with git hooks.\n\n## What This Skill Does\n\n- Installs pre-commit\
  \ framework hooks (lint, format, secrets)\n- Configures Husky hooks for Node projects\n- Adds commit-msg\
  \ linting (conventional commits)\n- Sets core.hooksPath for team-wide hooks\n- Runs hooks across all\
  \ files or changed files only\n\n## When to Use\n\n- Enforcing lint/format on every commit\n- Blocking\
  \ secrets and large files from entering history\n- Standardizing commit message formats\n\n## Real Commands\n\
  \n```bash\n# pre-commit\npre-commit install\npre-commit install --hook-type pre-push\npre-commit run\
  \ --all-files\npre-commit run ruff\npre-commit autoupdate\npre-commit uninstall\n\n# Husky (Node)\n\
  npx husky init\nnpx husky add .husky/pre-commit 'npx lint-staged'\nnpx husky add .husky/commit-msg 'npx\
  \ commitlint --edit $1'\ngit config core.hooksPath .husky\n```\n\n## .pre-commit-config.yaml Sketch\n\
  \n```yaml\nrepos:\n  - repo: https://github.com/pre-commit/pre-commit-hooks\n    rev: v4.6.0\n    hooks:\n\
  \      - id: trailing-whitespace\n      - id: check-added-large-files\n  - repo: https://github.com/astral-sh/ruff-pre-commit\n\
  \    rev: v0.6.0\n    hooks:\n      - id: ruff\n      - id: ruff-format\n```\n\n## Best Practices\n\n\
  - Keep hooks fast (<10s); slow hooks get bypassed\n- Use pre-commit.ci to enforce on PRs without local\
  \ installs\n- Add secret scanning (gitleaks/trufflehog) as a hook\n- Never use hooks for secrets or\
  \ processes that belong in CI\n- Version hook repos with rev pins, run autoupdate monthly\n\n## Capabilities\n\
  \n### pre-commit-framework\nInstall and configure pre-commit hooks for Python/any-repo workflows.\n\n\
  **Commands:**\n- `pre-commit install`\n- `pre-commit install --hook-type pre-push`\n- `pre-commit run\
  \ --all-files`\n- `pre-commit run ruff`\n- `pre-commit autoupdate`\n- `pre-commit uninstall`\n\n**Examples:**\n\
  - pre-commit install\n- pre-commit run --all-files\n- pre-commit autoupdate\n\n### husky-and-custom-hooks\n\
  Set up Husky hooks and custom scripts for Node projects.\n\n**Commands:**\n- `npx husky init`\n- `npx\
  \ husky add .husky/pre-commit 'npx lint-staged'`\n- `npx husky add .husky/commit-msg 'npx commitlint\
  \ --edit $1'`\n- `git config core.hooksPath .husky`\n- `npx lint-staged`\n- `git commit -m 'chore: trigger\
  \ hooks'`\n\n**Examples:**\n- npx husky add .husky/pre-commit 'npx lint-staged'\n- npx husky add .husky/commit-msg\
  \ 'npx commitlint --edit $1'\n- git config core.hooksPath .husky"
prompt: Act as git-hooks and handle the task per the instructions.
