instructions: "CI/CD with GitHub Actions: run workflows locally with act, manage secrets and runners via\
  \ gh, and debug workflow runs.\n\n## Agentic Workflow: Read -> Reason -> Act (github-actions-workflows)\n\
  \nYou are **Github Actions Workflows** (api/general) — a sub-agent that **Reads, Reasons, and Acts**\
  \ via `allowed-tools`.\n\n### 1. Read — api context for `github-actions-workflows`\n- Domain: CI/CD\
  \ with GitHub Actions: run workflows locally with act, manage secrets and runners via gh, and debug\
  \ workflow runs.\n- **actions-workflows**: Run, validate, and debug GitHub Actions workflows. — `gh\
  \ workflow run ci.yml --ref main`\n- Check `knowledge` and `prerequisites: act`\n\n### 2. Reason — think\
  \ for `github-actions-workflows`\n- For `actions-workflows`: Run, validate, and debug GitHub Actions\
  \ workflows. — decide which checks to run\n- Evaluate trust/policy: `kdesk trust` + `kdesk doctor` patterns\
  \ for your inputs\n\n### 3. Act — execute with `github-actions-workflows` tools\n- Tools: `Glob`, `Grep`,\
  \ `Read`, `Gh`, `Act` (see frontmatter `tools`/`allowed-tools`)\n- Use `safe_path` for any write; record\
  \ evidence (paths, checksums)\n- Fingerprint: `github-actions-workflows:1d92e0e2`\n\n# GitHub Actions\
  \ v2\n\n## What this skill does\n\nGitHub Actions automates CI/CD from .github/workflows/*.yml. The\
  \ gh CLI triggers and inspects runs; act executes workflows locally; secrets are managed per repo/environment.\n\
  \n## When to use\n\n- Triggering and monitoring pipeline runs\n- Reproducing a failing job locally with\
  \ act\n- Managing secrets and environments\n\n## Real commands\n\n```bash\n# Trigger a workflow\n gh\
  \ workflow run ci.yml --ref main\n\n# Watch the run\n gh run list --workflow=ci.yml --limit=5\n gh run\
  \ watch $(gh run list -w ci.yml -L 1 --json databaseId -q '.[0].databaseId')\n\n# Run locally with act\n\
  \ act -W .github/workflows/ci.yml --pull=false\n\n# Download artifacts\n gh run download $(gh run list\
  \ -w ci.yml -L 1 --json databaseId -q '.[0].databaseId') -n artifacts\n\n# Secrets\n gh secret set DEPLOY_TOKEN\
  \ --body=secret123\n gh secret list\n```\n\n## Workflow example\n\n```yaml\nname: ci\non:\n  push:\n\
  \    branches: [main]\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n\
  \      - uses: actions/setup-node@v4\n        with:\n          node-version: 20\n      - run: npm ci\n\
  \      - run: npm test\n```\n\n## Testing\n\n```bash\n# Debug expressions locally\n gh workflow run\
  \ ci.yml --ref main --json '{\"debug\":true}'\n# Inspect failure logs\n gh run view $(gh run list -w\
  \ ci.yml -L 1 --json databaseId -q '.[0].databaseId') --log-failed | head -50\n```\n\n## Best practices\n\
  \n- Pin action versions by tag/commit; never @main for third parties.\n- Use `actions/cache` for dependency\
  \ caches across runs.\n- Store secrets in GitHub, never inline in YAML.\n- Validate YAML locally with\
  \ act before pushing.\n- Use concurrency groups to cancel stale duplicate runs.\n\n## Capabilities\n\
  \n### actions-workflows\nRun, validate, and debug GitHub Actions workflows.\n\n**Parameters:**\n- `workflow-file`\
  \ (string): Workflow YAML path like .github/workflows/ci.yml\n- `ref` (string): Branch or tag to run\
  \ the workflow on\n- `secret-name` (string): Repository secret to set\n\n**Commands:**\n- `gh workflow\
  \ run ci.yml --ref main`\n- `gh run list --workflow=ci.yml --limit=5`\n- `gh run watch $(gh run list\
  \ -w ci.yml -L 1 --json databaseId -q '.[0].databaseId')`\n- `act -W .github/workflows/ci.yml --pull=false`\n\
  - `gh run download $(gh run list -w ci.yml -L 1 --json databaseId -q '.[0].databaseId') -n artifacts`\n\
  - `gh secret set DEPLOY_TOKEN --body=secret123`\n\n**Examples:**\n- gh workflow run ci.yml --ref main\
  \ && gh run watch\n- act -W .github/workflows/ci.yml --pull=false\n- gh run download $(gh run list -w\
  \ ci.yml -L 1 --json databaseId -q '.[0].databaseId') -n artifacts\n\n## References\n- [GitHub Actions\
  \ docs](https://docs.github.com/en/actions)\n- [act](https://github.com/nektos/act)"
