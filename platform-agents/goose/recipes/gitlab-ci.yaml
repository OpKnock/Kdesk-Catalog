title: Gitlab Ci
description: 'CI/CD pipelines with GitLab CI: validate pipeline YAML, run jobs via the API, manage runners,
  and debug job failures.'
version: 2.0.0
instructions: "# Gitlab Ci\n\nCI/CD pipelines with GitLab CI: validate pipeline YAML, run jobs via the\
  \ API, manage runners, and debug job failures.\n\n## Instructions\n\n# GitLab CI\n\n## What this skill\
  \ does\n\nGitLab CI defines pipelines in .gitlab-ci.yml with stages, jobs, and rules. The REST API validates\
  \ config, lists pipelines/jobs, and the gitlab-runner CLI manages executors.\n\n## When to use\n\n-\
  \ Validating .gitlab-ci.yml before pushing\n- Inspecting failing jobs via API\n- Registering runners\
  \ for new projects\n\n## Real commands\n\n```bash\n# Lint the config via API\ncurl -s -X POST --header\
  \ 'Content-Type: application/json' --header \"PRIVATE-TOKEN: $GITLAB_TOKEN\" https://gitlab.example.com/api/v4/projects/$PROJECT_ID/ci/lint\
  \ -d '{\"content\": \"$(cat .gitlab-ci.yml | python -c \"import sys,json;print(json.dumps(sys.stdin.read()))\"\
  )\"}' | jq '.errors'\n\n# Latest pipelines on main\ncurl -s --header \"PRIVATE-TOKEN: $GITLAB_TOKEN\"\
  \ https://gitlab.example.com/api/v4/projects/$PROJECT_ID/pipelines?ref=main | jq '.[0] | {id, status}'\n\
  \n# Job statuses for a pipeline\ncurl -s --header \"PRIVATE-TOKEN: $GITLAB_TOKEN\" https://gitlab.example.com/api/v4/projects/$PROJECT_ID/pipelines/$PIPE_ID/jobs\
  \ | jq '.[] | {name, status}'\n\n# Runner management\ngitlab-runner list\ngitlab-runner register --url\
  \ https://gitlab.example.com --token $RUNNER_TOKEN --executor docker --docker-image alpine:latest\n\
  ```\n\n## .gitlab-ci.yml example\n\n```yaml\nstages: [test, deploy]\n\ntest:\n  stage: test\n  image:\
  \ node:20\n  script:\n    - npm ci\n    - npm test\n  rules:\n    - if: $CI_PIPELINE_SOURCE == \"merge_request_event\"\
  \n\ndeploy:\n  stage: deploy\n  script:\n    - echo \"deploying\"\n  only:\n    - main\n```\n\n## Testing\n\
  \n```bash\n# Retry a failed job via API\ncurl -s -X POST --header \"PRIVATE-TOKEN: $GITLAB_TOKEN\" https://gitlab.example.com/api/v4/projects/$PROJECT_ID/jobs/$JOB_ID/retry\
  \ | jq '.status'\n```\n\n## Best practices\n\n- Lint config in pre-commit or MR CI so invalid YAML never\
  \ merges.\n- Use `rules:` instead of deprecated only/except.\n- Cache dependencies per branch and key\
  \ on lockfiles.\n- Scope runner registration tokens to one project.\n- Poll job status with the API,\
  \ don't scrape the UI.\n\n## Capabilities\n\n### gitlab-pipelines\nValidate, run, and inspect GitLab\
  \ CI pipelines and runners.\n\n**Commands:**\n- `curl -s -X POST --header 'Content-Type: application/json'\
  \ --header \"PRIVATE-TOKEN: $GITLAB_TOKEN\" https://gitlab.example.com/api/v4/projects/$PROJECT_ID/ci/lint\
  \ -d '{\"content\": \"$(cat .gitlab-ci.yml | python -c \"import sys,json;print(json.dumps(sys.stdin.read()))\"\
  )\"}' | jq '.errors'`\n- `curl -s --header \"PRIVATE-TOKEN: $GITLAB_TOKEN\" http://localhost:8080/api/v4/projects/$PROJECT_ID/pipelines?ref=main\
  \ | jq '.[0] | {id, status}'`\n- `curl -s --header \"PRIVATE-TOKEN: $GITLAB_TOKEN\" http://localhost:8080/api/v4/projects/$PROJECT_ID/pipelines/$PIPE_ID/jobs\
  \ | jq '.[] | {name, status}'`\n- `gitlab-runner list`\n- `gitlab-runner register --url http://localhost:8080\
  \ --token $RUNNER_TOKEN --executor docker --docker-image alpine:latest`\n- `curl -s --header \"PRIVATE-TOKEN:\
  \ $GITLAB_TOKEN\" http://localhost:8080/api/v4/projects/$PROJECT_ID/pipelines/$PIPE_ID | jq '{status,\
  \ duration, created_at}'`\n\n**Examples:**\n- curl -s -X POST --header 'Content-Type: application/json'\
  \ --header \"PRIVATE-TOKEN: $GITLAB_TOKEN\" https://gitlab.example.com/api/v4/projects/$PROJECT_ID/ci/lint\
  \ -d '{\"content\": \"$(cat .gitlab-ci.yml | python -c \"import sys,json;print(json.dumps(sys.stdin.read()))\"\
  )\"}' | jq '.errors'\n- curl -s --header \"PRIVATE-TOKEN: $GITLAB_TOKEN\" http://localhost:8080/api/v4/projects/$PROJECT_ID/pipelines?ref=main\
  \ | jq '.[0] | {id, status}'\n- gitlab-runner list"
prompt: Act as Gitlab Ci and handle the task per the instructions.
