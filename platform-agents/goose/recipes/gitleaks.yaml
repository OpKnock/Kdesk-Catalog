title: gitleaks
description: Detects hardcoded secrets in git history and files with gitleaks, including CI-safe configs
  and custom allowlists.
version: 2.0.0
instructions: "# gitleaks\n\nDetects hardcoded secrets in git history and files with gitleaks, including\
  \ CI-safe configs and custom allowlists.\n\n## Instructions\n\n# gitleaks\n\nSecret scanning for git\
  \ repositories with SAST-grade accuracy.\n\n## What This Skill Does\n\n- Scans commits, branches, tags,\
  \ and the working tree for 100+ secret types\n- Runs as a pre-commit hook and in CI\n- Generates custom\
  \ rule configs with allowlists\n- Produces JSON/SARIF reports for triage\n\n## When to Use\n\n- Auditing\
  \ a repo before making it public\n- Enforcing no-new-secrets policy in CI\n- Discovering how far back\
  \ a leaked key goes\n\n## Real Commands\n\n```bash\n# Basic working tree scan\n gitleaks detect --source\
  \ . -v\n\n# Full history scan\ngitleaks git --log-opts=\"--all\"\n\n# Remote repo scan\ngitleaks git\
  \ --remote https://github.com/org/repo\n\n# Protect staged changes before commit\ngitleaks protect --staged\n\
  \n# Generate a config to customize\n gitleaks generate > gitleaks.toml\n gitleaks detect --source .\
  \ --config gitleaks.toml --report-path report.json\n```\n\n## Sample Config (allowlist)\n\n```toml\n\
  [extend]\nuseDefault = true\n\n[[rules]]\nid = \"custom-aws-access-key\"\ndescription = \"AWS access\
  \ key\"\nregex = '''AKIA[0-9A-Z]{16}'''\n\n[[rules.allowlists]]\ndescription = \"test fixtures\"\nregexes\
  \ = ['''AKIA0000000000000000''']\npaths = ['''fixtures/.*''']\n```\n\n## Best Practices\n\n- Scan full\
  \ history once, then gate on new commits in CI\n- Use --redact in logs so secrets never hit your terminal/CI\
  \ logs\n- Rotate any secret found in history; purging history is not enough\n- Keep an allowlist for\
  \ fixtures, but review it in PRs\n- Export findings to SARIF for GitHub code scanning annotations\n\n\
  ## Capabilities\n\n### secret-detection\nScan working trees, git history, and stashes for leaked secrets.\n\
  \n**Commands:**\n- `gitleaks detect --source . -v`\n- `gitleaks git --log-opts=\"--all\"`\n- `gitleaks\
  \ git --remote https://github.com/org/repo`\n- `gitleaks detect --source . --redact`\n- `gitleaks detect\
  \ --source . --exit-code 1`\n\n**Examples:**\n- gitleaks detect --source . -v\n- gitleaks git --log-opts=\"\
  --all\"\n- gitleaks detect --source . --redact\n\n### config-and-ci\nGenerate baseline configs and run\
  \ gitleaks in CI workflows.\n\n**Commands:**\n- `gitleaks generate`\n- `gitleaks detect --source . --config\
  \ gitleaks.toml`\n- `gitleaks protect --staged`\n- `gitleaks secret-key`\n- `gitleaks detect --source\
  \ . --report-path report.json --report-format json`\n\n**Examples:**\n- gitleaks generate > gitleaks.toml\n\
  - gitleaks protect --staged\n- gitleaks detect --source . --report-path gitleaks-report.json"
prompt: Act as gitleaks and handle the task per the instructions.
