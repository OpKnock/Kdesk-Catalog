title: Gpg
description: 'PGP encryption and signing: generate keypairs, encrypt/decrypt files, sign and verify commits,
  and manage keyrings.'
version: 2.0.0
instructions: "# Gpg\n\nPGP encryption and signing: generate keypairs, encrypt/decrypt files, sign and\
  \ verify commits, and manage keyrings.\n\n## Instructions\n\n# GPG\n\n## What this skill does\n\nGPG\
  \ (GnuPG) implements OpenPGP: asymmetric encryption, digital signatures, and key management. It protects\
  \ files at rest and proves authorship of commits and releases.\n\n## When to use\n\n- Encrypting files\
  \ exchanged with partners\n- Signing commits/tags for supply chain trust\n- Managing keyrings for CI\
  \ release signing\n\n## Real commands\n\n```bash\n# Generate a keypair\ngpg --full-generate-key\n\n\
  # Encrypt/decrypt\ngpg --encrypt --recipient alice@example.com secrets.txt\ngpg --decrypt secrets.txt.gpg\n\
  \n# Sign and verify\ngpg --sign --local-user bob@example.com data.txt\ngpg --verify data.txt.gpg\n\n\
  # Export/import public keys\ngpg --armor --export alice@example.com > alice.pub\ngpg --import alice.pub\n\
  \n# Keyring\n gpg --list-keys --fingerprint\n```\n\n## Signing commits\n\n```bash\ngit config --global\
  \ user.signingkey <fingerprint>\ngit config --global commit.gpgsign true\ngit commit -S -m \"signed\
  \ commit\"\n```\n\n## Key backup\n\n```bash\n# Export the secret key (keep offline!) and revoke cert\n\
  gpg --armor --export-secret-keys alice@example.com > alice-secret.asc\ngpg --gen-revoke alice@example.com\
  \ > alice-revoke.asc\n```\n\n## Testing\n\n```bash\n# Round trip\necho topsecret | gpg --encrypt --recipient\
  \ alice@example.com | gpg --decrypt\n```\n\n## Best practices\n\n- Use 4096-bit RSA or modern ECC keys;\
  \ avoid legacy defaults.\n- Back up secret keys and revocation certs offline.\n- Sign, then encrypt\
  \ (sign-then-encrypt) rather than the reverse.\n- Keep a separate signing subkey for CI agents.\n- Never\
  \ share secret keys; share only armored public keys.\n\n## Capabilities\n\n### gpg-ops\nGenerate keys,\
  \ encrypt/decrypt, sign/verify, and manage keyring exports.\n\n**Commands:**\n- `gpg --full-generate-key`\n\
  - `gpg --encrypt --recipient alice@localhost secrets.txt`\n- `gpg --decrypt secrets.txt.gpg`\n- `gpg\
  \ --sign --local-user bob@localhost data.txt`\n- `gpg --verify data.txt.gpg`\n- `gpg --armor --export\
  \ alice@localhost > alice.pub`\n- `gpg --list-keys`\n\n**Examples:**\n- gpg --encrypt --recipient alice@localhost\
  \ secrets.txt && gpg --decrypt secrets.txt.gpg\n- gpg --armor --export alice@localhost > alice.pub &&\
  \ gpg --import alice.pub\n- gpg --list-keys --fingerprint"
prompt: Act as Gpg and handle the task per the instructions.
