title: Graphql Apollo
description: 'Apollo GraphQL ecosystem: set up Apollo Server and Client, run codegen, and manage the schema
  registry with the Apollo CLI.'
version: 2.0.0
instructions: "# Graphql Apollo\n\nApollo GraphQL ecosystem: set up Apollo Server and Client, run codegen,\
  \ and manage the schema registry with the Apollo CLI.\n\n## Instructions\n\n# GraphQL Apollo\n\n## What\
  \ this skill does\n\nThe Apollo ecosystem covers server (Apollo Server), client (Apollo Client), and\
  \ tooling (codegen, schema registry). This skill covers setup, introspection, and typed codegen.\n\n\
  ## When to use\n\n- Standing up a GraphQL server with a polished toolkit\n- Generating typed clients\
  \ from the schema\n- Introspecting a running endpoint\n\n## Real commands\n\n```bash\n# Server scaffold\n\
  npm install @apollo/server graphql\nnpx apollo server:init\n\n# Introspect a running endpoint\ncurl\
  \ -s -X POST http://localhost:4000/ -H 'Content-Type: application/json' -d '{\"query\":\"{ __schema\
  \ { types { name } } }\"}' | jq '.data.__schema.types[0].name'\n\n# Typed codegen for the client\nnpx\
  \ apollo codegen:generate --target=typescript --outputFlat src/__generated__\n```\n\n## Server example\n\
  \n```javascript\nconst { ApolloServer } = require('@apollo/server')\nconst { startStandaloneServer }\
  \ = require('@apollo/server/standalone')\n\nconst server = new ApolloServer({\n  typeDefs: `type Query\
  \ { hello: String }`,\n  resolvers: { Query: { hello: () => 'world' } }\n})\n\nstartStandaloneServer(server,\
  \ { listen: { port: 4000 } })\n```\n\n## Testing\n\n```bash\n# Smoke the server before wiring the client\n\
  curl -s -X POST http://localhost:4000/ -H 'Content-Type: application/json' -d '{\"query\":\"{ hello\
  \ }\"}' | jq\n```\n\n## Best practices\n\n- Keep resolvers thin; delegate to services.\n- Use context\
  \ for auth and data source injection.\n- Run codegen against the schema artifact, not a live server,\
  \ in CI.\n- Enable persisted queries for production caching.\n- Version the schema via the registry\
  \ before rolling client changes.\n\n## Capabilities\n\n### apollo-tooling\nScaffold Apollo Server, introspect\
  \ schemas, and run codegen.\n\n**Commands:**\n- `npm install @apollo/server graphql`\n- `npx apollo\
  \ server:init`\n- `curl -s -X POST http://localhost:4000/ -H 'Content-Type: application/json' -d '{\"\
  query\":\"{ __schema { types { name } } }\"}' | jq '.data.__schema.types[0].name'`\n- `npx apollo codegen:generate\
  \ --target=typescript --outputFlat src/__generated__`\n- `node -e \"const {ApolloServer}=require('@apollo/server');const\
  \ s=new ApolloServer({typeDefs:'type Query{hello:String}',resolvers:{Query:{hello:()=>'hi'}}});console.log(s)\"\
  `\n\n**Examples:**\n- curl -s -X POST http://localhost:4000/ -H 'Content-Type: application/json' -d\
  \ '{\"query\":\"{ __schema { types { name } } }\"}' | jq '.data.__schema.types[0].name'\n- npx apollo\
  \ codegen:generate --target=typescript --outputFlat src/__generated__\n- npm install @apollo/server\
  \ graphql && node index.js"
prompt: Act as Graphql Apollo and handle the task per the instructions.
