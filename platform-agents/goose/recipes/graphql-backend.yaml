title: Graphql
description: 'Authors GraphQL clients and tooling: queries, mutations, fragments, variables, and codegen
  with GraphQL Code Generator.'
version: 2.0.0
instructions: "# Graphql\n\nAuthors GraphQL clients and tooling: queries, mutations, fragments, variables,\
  \ and codegen with GraphQL Code Generator.\n\n## Instructions\n\n# GraphQL (Client)\n\nAuthor GraphQL\
  \ queries, mutations, and client tooling.\n\n## When to Use\n\n- Building frontend data layers against\
  \ a GraphQL API\n- Maintaining a typed client from the schema\n- Validating queries before shipping\
  \ them\n- Using fragments to share field selections\n\n## Query Example\n\n```graphql\nquery GetUser($id:\
  \ ID!) {\n  user(id: $id) {\n    name\n    email\n    posts(first: 5) {\n      title\n    }\n  }\n}\n\
  ```\n\n```json\n{ \"variables\": { \"id\": \"1\" } }\n```\n\n## Commands\n\n```bash\n# Execute a query\
  \ with variables\ncurl -X POST http://localhost:4000/graphql -H \"Content-Type: application/json\" \\\
  \n  -d '{\"query\":\"query($id: ID!){ user(id: $id) { name } }\",\"variables\":{\"id\":\"1\"}}'\n\n\
  # Codegen setup and run\nnpx @graphql-codegen/cli init\nnpx graphql-codegen --config codegen.yml\nnpx\
  \ graphql-codegen --watch\n```\n\n## Codegen Config\n\n```yaml\nschema: http://localhost:4000/graphql\n\
  documents: \"src/**/*.graphql\"\ngenerates:\n  src/gql/generated.ts:\n    plugins:\n      - typescript\n\
  \      - typescript-operations\n      - typed-document-node\n```\n\n## Best Practices\n\n- Use fragments\
  \ for reusable field sets instead of repeating fields\n- Always send variables rather than interpolating\
  \ values into queries\n- Enable codegen --watch in dev so types never drift\n- Ship generated types\
  \ and fail CI if generation is dirty\n- Keep queries shallow unless depth is needed; watch complexity\n\
  \n## Capabilities\n\n### graphql-client\nWrite and execute queries, mutations, and fragments.\n\n**Commands:**\n\
  - `npx graphql-codegen`\n- `npx graphql-query-complexity`\n- `curl -X POST http://localhost:4000/graphql\
  \ -H \"Content-Type: application/json\" -d \"{\\\"query\\\":\\\"query($id: ID!){ user(id: $id) { name\
  \ } }\\\",\\\"variables\\\":{\\\"id\\\":\\\"1\\\"}}\"`\n- `npm install @apollo/client`\n\n**Examples:**\n\
  - curl -X POST localhost:4000/graphql -d \"{\\\"query\\\":\\\"mutation { addUser(name: \\\\\\\"Ann\\\
  \\\\\") { id } }\\\"}\"\n- npx graphql-codegen --watch\n\n### graphql-codegen\nGenerate TypeScript types\
  \ and hooks from the schema.\n\n**Commands:**\n- `npx @graphql-codegen/cli init`\n- `npx graphql-codegen\
  \ --config codegen.yml`\n- `npx graphql-codegen --watch`\n- `npx graphql-tools load-documents \"src/**/*.graphql\"\
  `\n\n**Examples:**\n- npx graphql-codegen --config codegen.ts\n- npx graphql-codegen --dry-run"
prompt: Act as Graphql and handle the task per the instructions.
