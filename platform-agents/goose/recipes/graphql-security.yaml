title: Graphql Security
description: 'GraphQL API security: test for introspection abuse, injection, and excessive depth; apply
  protections like query cost limits and allowlists.'
version: 2.0.0
instructions: "# Graphql Security\n\nGraphQL API security: test for introspection abuse, injection, and\
  \ excessive depth; apply protections like query cost limits and allowlists.\n\n## Instructions\n\n#\
  \ GraphQL Security\n\n## What this skill does\n\nGraphQL endpoints have unique attack surfaces: introspection\
  \ leaks schemas, deep nested queries amplify cost, alias batching multiplies work, and batching fields\
  \ can throttle-rate bypass. This skill probes and protects those.\n\n## When to use\n\n- Pre-launch\
  \ security review of a GraphQL API\n- Verifying protections after a change\n- Incident triage on abusive\
  \ queries\n\n## Real commands\n\n```bash\n# Is introspection open?\ncurl -s -X POST http://localhost:4000/graphql\
  \ -H 'Content-Type: application/json' -d '{\"query\":\"{ __schema { types { name } } }\"}' | jq '.data.__schema.types\
  \ | length'\n\n# Alias batching probe (each alias is a separate field)\ncurl -s -X POST http://localhost:4000/graphql\
  \ -H 'Content-Type: application/json' -d '{\"query\":\"{ a: __typename b: __typename c: __typename }\"\
  }' | jq '.data | length'\n\n# Automated scan\nnpx graphql-cop -t http://localhost:4000/graphql\n```\n\
  \n## Protections example (Apollo Server)\n\n```javascript\nconst { ApolloServerPluginLandingPageDisabled\
  \ } = require('@apollo/server/plugin/landingPage/default')\n\n// disable introspection in prod:\nconst\
  \ server = new ApolloServer({\n  introspection: process.env.NODE_ENV !== 'production',\n  ...\n})\n\
  ```\n\n## Depth/cost limiting (graphql-armor)\n\n```javascript\nimport { EnvelopArmorPlugin } from '@envelop/armor'\n\
  // maxDepth: 6, maxAliases: 20, maxDirectives: 5\n```\n\n## Best practices\n\n- Disable introspection\
  \ in production (or gate it by role).\n- Enforce depth and alias limits; GraphQL has no natural pagination\
  \ guard.\n- Rate limit per operation complexity, not per request.\n- Use persisted query allowlists\
  \ for critical endpoints.\n- Never expose resolver internals in error messages.\n\n## Capabilities\n\
  \n### graphql-security\nProbe GraphQL endpoints for common vulnerabilities and validate protections.\n\
  \n**Commands:**\n- `curl -s -X POST http://localhost:4000/graphql -H 'Content-Type: application/json'\
  \ -d '{\"query\":\"{ __schema { types { name } } }\"}' | jq '.data.__schema.types | length'`\n- `curl\
  \ -s -X POST http://localhost:4000/graphql -H 'Content-Type: application/json' -d '{\"query\":\"{ __typename\
  \ }\"}' | jq '.errors'`\n- `curl -s -X POST http://localhost:4000/graphql -H 'Content-Type: application/json'\
  \ -d '{\"query\":\"{ a: __typename b: __typename c: __typename }\"}' | jq '.data | length'`\n- `curl\
  \ -s -X POST http://localhost:4000/graphql -H 'Content-Type: application/json' -d '{\"query\":\"query{\
  \ user(id: \\\"1\\\") { id } }\"}' | jq '.errors'`\n- `npx graphql-cop -t http://localhost:4000/graphql`\n\
  \n**Examples:**\n- curl -s -X POST http://localhost:4000/graphql -H 'Content-Type: application/json'\
  \ -d '{\"query\":\"{ __schema { types { name } } }\"}' | jq '.data.__schema.types | length'\n- npx graphql-cop\
  \ -t http://localhost:4000/graphql\n- curl -s -X POST http://localhost:4000/graphql -H 'Content-Type:\
  \ application/json' -d '{\"query\":\"{ a: __typename b: __typename c: __typename }\"}' | jq '.data |\
  \ length'"
prompt: Act as Graphql Security and handle the task per the instructions.
