  \ frontmatter `tools`/`allowed-tools`)\n- Use `safe_path` for any write; record evidence (paths, checksums)\n\
  - Fingerprint: `graphql-subscription:e71c29b4`\n\n# GraphQL Subscriptions\n\n## What this skill does\n\
  \nSubscriptions push realtime updates over WebSocket using the graphql-ws protocol. Servers publish\
  \ via PubSub; clients subscribe with a subscription document and receive events as they happen.\n\n\
  ## When to use\n\n- Live order boards, chat, and presence\n- Push notifications from mutations\n- Replacing\
  \ polling with event-driven updates\n\n## Real commands\n\n```bash\n# What subscriptions does the schema\
  \ offer?\ncurl -s -X POST http://localhost:4000/graphql -H 'Content-Type: application/json' -d '{\"\
  query\":\"{ __type(name: \\\"Subscription\\\") { fields { name } } }\"}' | jq '.data.__type.fields[].name'\n\
  \n# Subscribe via graphql-ws from Node\nnode -e \"const {createClient}=require('graphql-ws');const c=createClient({url:'ws://localhost:4000/graphql'});c.subscribe({query:'subscription\
  \ { orderUpdated { id status } }'},{next:d=>console.log(d.data),error:e=>console.error(e)});setTimeout(()=>c.dispose(),15000)\"\
  \n\n# Find the pubsub wiring\n grep -rn 'pubsub\\|PubSub' src/ | head -10\n```\n\n## Server example\
  \ (Apollo)\n\n```javascript\nconst { PubSub } = require('graphql-subscriptions')\nconst pubsub = new\
  \ PubSub()\n\nconst typeDefs = `\n  type Subscription { orderUpdated: Order }\n  type Mutation { placeOrder:\
  \ Order }\n`\n\n// in the mutation resolver:\nawait pubsub.publish('ORDER_UPDATED', { orderUpdated:\
  \ order })\n\n// in the subscription resolver:\nSubscription: { orderUpdated: { subscribe: () => pubsub.asyncIterator('ORDER_UPDATED')\
  \ } }\n```\n\n## Testing\n\n```bash\n# Terminal A: subscribe; Terminal B: mutate; watch the push\nnode\
  \ -e \"const {createClient}=require('graphql-ws');const c=createClient({url:'ws://localhost:4000/graphql'});c.subscribe({query:'subscription\
  \ { orderUpdated { id } }'},{next:d=>console.log('pushed',d.data)});setTimeout(()=>c.dispose(),30000)\"\
  \n# terminal B:\ncurl -s -X POST http://localhost:4000/graphql -H 'Content-Type: application/json' -d\
  \ '{\"query\":\"mutation{ placeOrder { orderId } }\"}' | jq\n```\n\n## Best practices\n\n- Filter subscription\
  \ events by context (user/tenant) inside resolvers.\n- Always dispose clients on disconnect to free\
  \ the socket.\n- Prefer small payloads over the wire; fetch details via query.\n- Add heartbeat/keepalive\
  \ handling to clients.\n- Use a scalable pubsub (Redis) when scaling horizontally.\n\n## Capabilities\n\
  \n### subscriptions\nConnect to GraphQL subscription endpoints over WebSocket and verify event delivery.\n\
  \n**Parameters:**\n- `subscription-query` (string): Subscription document\n- `ws-url` (string): WebSocket\
  \ endpoint URL\n- `event-topic` (string): PubSub topic emitting the event\n\n**Commands:**\n- `npm install\
  \ graphql-ws @apollo/server @apollo/server/plugin/subscriptionCallback`\n- `curl -s -X POST http://localhost:4000/graphql\
  \ -H 'Content-Type: application/json' -d '{\"query\":\"{ __type(name: \\\"Subscription\\\") { fields\
  \ { name } } }\"}' | jq '.data.__type.fields[].name'`\n- `node -e \"const {createClient}=require('graphql-ws');const\
  \ c=createClient({url:'ws://localhost:4000/graphql'});c.subscribe({query:'subscription { orderUpdated\
  \ { id status } }'},{next:d=>console.log(d.data),error:e=>console.error(e)});setTimeout(()=>c.dispose(),15000)\"\
  `\n- `grep -rn 'pubsub\\|PubSub' src/ | head -10`\n- `curl -s -X POST http://localhost:4000/graphql\
  \ -H 'Content-Type: application/json' -d '{\"query\":\"mutation{ placeOrder { orderId } }\"}' | jq`\n\
  \n**Examples:**\n- node -e \"const {createClient}=require('graphql-ws');const c=createClient({url:'ws://localhost:4000/graphql'});c.subscribe({query:'subscription\
  \ { orderUpdated { id status } }'},{next:d=>console.log(d.data),error:e=>console.error(e)});setTimeout(()=>c.dispose(),15000)\"\
  \n- curl -s -X POST http://localhost:4000/graphql -H 'Content-Type: application/json' -d '{\"query\"\
  :\"{ __type(name: \\\"Subscription\\\") { fields { name } } }\"}' | jq '.data.__type.fields[].name'\n\
  - grep -rn 'pubsub\\|PubSub' src/ | head -10\n\n## References\n- [graphql-ws docs](https://the-guild.dev/graphql/ws)\n\
  - [Apollo subscriptions](https://www.apollographql.com/docs/apollo-server/data/subscriptions/)"
