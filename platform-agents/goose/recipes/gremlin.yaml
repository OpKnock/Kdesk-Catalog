title: Gremlin
description: 'Gremlin chaos engineering platform operations: launching and halting CPU, disk, memory,
  and network attacks against production and staging hosts.'
version: 2.0.0
instructions: "# Gremlin\n\nGremlin chaos engineering platform operations: launching and halting CPU,\
  \ disk, memory, and network attacks against production and staging hosts.\n\n## Instructions\n\n# Gremlin\n\
  \nReal chaos engineering experiments using the `gremlin` CLI.\n\n## What this skill does\n\n- Launches\
  \ targeted attacks (CPU, memory, disk, network, process) on hosts or containers.\n- Runs and manages\
  \ failure scenarios across teams and infrastructure.\n- Halts attacks before they reach the blast radius\
  \ limit.\n- Resolves host IDs and API key configuration for the CLI.\n\n## When to use\n\n- A team wants\
  \ to verify autoscaling or failover behavior under load.\n- An incident review asks: what happens if\
  \ a node loses network or disk fills up.\n- Validating SLOs and retry logic with real failure injection.\n\
  \n## Real commands\n\n```bash\n# Install and authenticate\ncurl -sSL https://www.gremlin.com/install\
  \ | bash\nsudo gremlin service install\nsudo gremlin service start\ngremlin api-key set abcd1234-your-api-key\n\
  \n# CPU attack: peg all cores for 2 minutes\nsudo gremlin i attack -t \"cpu\" -a cpu=100 -a duration=120\
  \ -a cores=4\n\n# Memory attack: consume 90% of RAM for 30s\nsudo gremlin i attack -t \"memory\" -a\
  \ memory=90 -a duration=30\n\n# Disk attack: write to /data until 50% full\nsudo gremlin i attack -t\
  \ \"disk\" -a disk=50 -a path=/data -a duration=60\n\n# Network attack: drop 50% of packets\nsudo gremlin\
  \ i attack -t \"network\" -a device=eth0 -a latency=0 -a packet_loss=50 -a duration=60\n\n# Shutdown\
  \ an attack immediately\nsudo gremlin i shutdown\n\n# List running and past attacks\nsudo gremlin attack\
  \ list\nsudo gremlin scenario list\n```\n\n## Configuration\n\nTeam IDs and API keys come from the Gremlin\
  \ web console:\n\n```bash\ngremlin api-key set <API_KEY>\nsudo gremlin init --team_id <team-id>\n```\n\
  \nScenarios are declared in YAML:\n\n```yaml\nscenarios:\n  - name: failover-test\n    attacks:\n  \
  \    - type: cpu\n        args: [\"-a\", \"cpu=100\", \"-a\", \"duration=60\"]\n      - type: network\n\
  \        args: [\"-a\", \"packet_loss=30\"]\n```\n\n## Testing\n\n- Run a short 10s CPU attack in staging\
  \ and verify the target app recovers.\n- Confirm `gremlin i shutdown` ends attacks: `gremlin attack\
  \ list` should then be empty.\n- Check `gremlin i attack --help` before running a new attack type.\n\
  \n## Best practices\n\n- Always set `-a duration`; default attacks can run 10 minutes.\n- Start with\
  \ the smallest blast radius: one host, one attack type.\n- Pair the attack with a validation check (e.g.,\
  \ HTTP 200 after 30s).\n- Run a scheduled shutdown as a safety net in CI.\n- Never run unauthenticated\
  \ attacks: verify `gremlin attack list` shows the team first.\n\n## Example exchange\n\n```\nUser: Start\
  \ a 5-minute CPU attack on the prod-web host, halt after 2 minutes.\nAgent: sudo gremlin i attack -t\
  \ \"cpu\" -a cpu=100 -a duration=300 -a host_id=prod-web\n       # after 120s of observing: sudo gremlin\
  \ i shutdown\n```\n\n## Capabilities\n\n### attack-management\nCreate, list, and halt chaos attacks\
  \ and scenarios via the Gremlin CLI and API.\n\n**Commands:**\n- `gremlin i attack -t \"disk\" -a disk=50\
  \ -a path=/`\n- `gremlin i shutdown`\n- `gremlin attack list`\n- `gremlin scenario list`\n- `gremlin\
  \ api-key set demo-key`\n\n**Examples:**\n- sudo gremlin i attack -t \"cpu\" -a cpu=100 -a duration=60\
  \ -a cores=4\n- sudo gremlin i attack -t \"memory\" -a memory=90 -a duration=30\n- sudo gremlin i shutdown"
prompt: Act as Gremlin and handle the task per the instructions.
