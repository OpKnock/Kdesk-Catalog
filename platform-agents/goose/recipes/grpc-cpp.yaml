title: Grpc Cpp
description: 'Build gRPC services and clients in C++: protoc codegen with grpc_cpp_plugin, CMake integration,
  and sync server patterns.'
version: 2.0.0
instructions: "# Grpc Cpp\n\nBuild gRPC services and clients in C++: protoc codegen with grpc_cpp_plugin,\
  \ CMake integration, and sync server patterns.\n\n## Instructions\n\n# gRPC C++\n\nReal gRPC services\
  \ and clients in C++ using protoc, grpc_cpp_plugin, and CMake.\n\n## What this skill does\n\n- Generates\
  \ C++ stubs from .proto files.\n- Wires gRPC into CMake-based projects.\n- Runs sync servers and blocking\
  \ clients.\n- Resolves common build errors (plugin not found, missing include paths).\n\n## When to\
  \ use\n\n- A C++ service needs a high-performance RPC layer.\n- Integrating gRPC into an existing CMake\
  \ codebase.\n- Debugging link or protoc plugin issues.\n\n## Real commands\n\n```bash\n# Generate C++\
  \ stubs (messages + service)\nprotoc -I . --cpp_out=. helloworld.proto\nprotoc -I . --grpc_out=. --plugin=protoc-gen-grpc=$(which\
  \ grpc_cpp_plugin) helloworld.proto\n\n# Build with CMake\ncmake -B build -DCMAKE_PREFIX_PATH=$(pwd)/cmake\n\
  cmake --build build -j4\n\n# Run server then client\n./build/greeter_server &\n./build/greeter_client\n\
  ```\n\n## CMake config\n\n```cmake\nfind_package(gRPC CONFIG REQUIRED)\nfind_package(Protobuf CONFIG\
  \ REQUIRED)\n\nset(PROTO_FILES helloworld.proto)\nset(PROTO_GENERATED \"${CMAKE_CURRENT_BINARY_DIR}/helloworld.pb.cc\"\
  \n                    \"${CMAKE_CURRENT_BINARY_DIR}/helloworld.grpc.pb.cc\")\n\nadd_custom_command(\n\
  \  OUTPUT ${PROTO_GENERATED}\n  COMMAND protobuf::protoc -I ${CMAKE_CURRENT_SOURCE_DIR}\n          --cpp_out\
  \ ${CMAKE_CURRENT_BINARY_DIR}\n          --grpc_out ${CMAKE_CURRENT_BINARY_DIR}\n          --plugin=protoc-gen-grpc=$<TARGET_FILE:gRPC::grpc_cpp_plugin>\n\
  \  DEPENDS ${PROTO_FILES})\n```\n\n## Sync server pattern\n\n```cpp\n#include <grpcpp/grpcpp.h>\nclass\
  \ GreeterServiceImpl final : public Greeter::Service {\n  grpc::Status SayHello(grpc::ServerContext*\
  \ ctx, const HelloRequest* req, HelloReply* rep) override {\n    rep->set_message(\"Hello \" + req->name());\n\
  \    return grpc::Status::OK;\n  }\n};\n```\n\n## Testing\n\n```bash\ncmake --build build --target test\
  \ && ctest --test-dir build --output-on-failure\n```\n\n## Best practices\n\n- Always pass the full\
  \ plugin path via `--plugin`; protoc does not find grpc_cpp_plugin by default.\n- Keep generated .pb.cc\
  \ files in the build dir, not the source tree.\n- Use sync APIs for small QPS, the Callback API for\
  \ high concurrency.\n- Set a deadline on client calls: `ctx.set_deadline(gpr_time_add(gpr_now(GPR_CLOCK_REALTIME),\
  \ gpr_time_from_seconds(5, GPR_TIMESPAN)))`.\n\n## Example exchange\n\n```\nUser: My build fails with\
  \ \"protoc-gen-grpc: not found\".\nAgent: Run protoc with an explicit plugin path:\n       protoc -I\
  \ . --grpc_out=. --plugin=protoc-gen-grpc=$(which grpc_cpp_plugin) helloworld.proto\n```\n\n## Capabilities\n\
  \n### cpp-grpc-build\nGenerate C++ gRPC stubs and build servers/clients with CMake and grpc_cpp_plugin.\n\
  \n**Commands:**\n- `protoc -I . --cpp_out=. --grpc_out=. --plugin=protoc-gen-grpc=$(which grpc_cpp_plugin)\
  \ helloworld.proto`\n- `cmake -B build -DCMAKE_PREFIX_PATH=$(pwd)/cmake`\n- `cmake --build build -j4`\n\
  - `./build/greeter_client`\n- `grpc_cpp_plugin --version`\n\n**Examples:**\n- cmake -B build -DgRPC_BUILD_TESTS=OFF\
  \ && cmake --build build\n- ./build/greeter_server & ./build/greeter_client\n- protoc -I . --cpp_out=.\
  \ helloworld.proto"
prompt: Act as Grpc Cpp and handle the task per the instructions.
