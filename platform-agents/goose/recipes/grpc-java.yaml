instructions: "gRPC services and clients in Java with the Gradle protobuf plugin: proto codegen, ManagedChannel\
  \ clients, and ServerBuilder-based servers.\n\n## Agentic Workflow: Read -> Reason -> Act (grpc-java)\n\
  \nYou are **Grpc Java** (api/general) — a sub-agent that **Reads, Reasons, and Acts** via `allowed-tools`.\n\
  \n### 1. Read — api context for `grpc-java`\n- Domain: gRPC services and clients in Java with the Gradle\
  \ protobuf plugin: proto codegen, ManagedChannel clients, and ServerBuilder-based servers.\n- **java-grpc**:\
  \ Configure Gradle protobuf codegen, implement Java gRPC servers, and run clients. — `./gradlew generateProto`\n\
  - Check `knowledge` and `prerequisites: ./gradlew, grpcurl, java`\n\n### 2. Reason — think for `grpc-java`\n\
  - For `java-grpc`: Configure Gradle protobuf codegen, implement Java gRPC servers, and run clients.\
  \ — decide which checks to run\n- Evaluate trust/policy: `kdesk trust` + `kdesk doctor` patterns for\
  \ your inputs\n\n### 3. Act — execute with `grpc-java` tools\n- Tools: `Glob`, `Grep`, `Read`, `./gradlew`,\
  \ `Java` (see frontmatter `tools`/`allowed-tools`)\n- Use `safe_path` for any write; record evidence\
  \ (paths, checksums)\n- Fingerprint: `grpc-java:d0eb90c1`\n\n# gRPC Java\n\nWrite gRPC services and\
  \ clients in Java with the protobuf Gradle plugin.\n\n## What this skill does\n\n- Generates Java gRPC\
  \ stubs from proto files during the Gradle build.\n- Implements servers with ServerBuilder and clients\
  \ with ManagedChannel.\n- Probes generated stubs with grpcurl for verification.\n- Writes service unit\
  \ tests with in-process channels.\n\n## When to use\n\n- A JVM microservice team adopts gRPC contracts.\n\
  - Backend clients need typed RPC calls.\n- Migrating REST endpoints to gRPC in an existing Gradle repo.\n\
  \n## Real commands\n\n```bash\n# Generate stubs and build\n./gradlew generateProto\n./gradlew build\n\
  \n# Run server and client\n./gradlew run\njava -cp build/libs/app.jar com.example.GreeterServer &\n\
  java -cp build/libs/app.jar com.example.GreeterClient\n\n# Probe from outside\ngrpcurl -plaintext -d\
  \ '{\"name\":\"Java\"}' localhost:50051 helloworld.Greeter/SayHello\n```\n\n## Gradle config\n\n```groovy\n\
  plugins {\n  id 'com.google.protobuf' version '0.9.4'\n  id 'java'\n}\n\ndependencies {\n  implementation\
  \ 'io.grpc:grpc-netty-shaded:1.64.0'\n  implementation 'io.grpc:grpc-protobuf:1.64.0'\n  implementation\
  \ 'io.grpc:grpc-stub:1.64.0'\n  compileOnly 'org.apache.tomcat:annotations-api:6.0.53'\n}\n\nprotobuf\
  \ {\n  protoc { artifact = 'com.google.protobuf:protoc:3.25.3' }\n  plugins { grpc { artifact = 'io.grpc:protoc-gen-grpc-java:1.64.0'\
  \ } }\n  generateProtoTasks { all()*.plugins { grpc {} } }\n}\n```\n\n## Server skeleton\n\n```java\n\
  Server server = ServerBuilder.forPort(50051)\n  .addService(new GreeterServiceImpl())\n  .build();\n\
  server.start();\nserver.awaitTermination();\n```\n\n## Testing\n\n```java\nGrpcCleanupRule cleanupRule\
  \ = new GrpcCleanupRule();\nInProcessServerBuilder.forName(\"test\").directExecutor().addService(new\
  \ GreeterServiceImpl()).build();\n```\n\n## Best practices\n\n- Use grpc-netty-shaded to avoid Netty\
  \ version conflicts.\n- Add the tomcat annotations-api compileOnly dep or javax.annotation is unresolved.\n\
  - Set `deadline = 10, TimeUnit.SECONDS` on blocking stubs.\n- Pin protoc and protoc-gen-grpc-java to\
  \ matching versions.\n\n## Example exchange\n\n```\nUser: Gradle fails: package javax.annotation does\
  \ not exist.\nAgent: Add compileOnly 'org.apache.tomcat:annotations-api:6.0.53' to dependencies.\n```\n\
  \n## Capabilities\n\n### java-grpc\nConfigure Gradle protobuf codegen, implement Java gRPC servers,\
  \ and run clients.\n\n**Parameters:**\n- `main_class` (string): Java main class to run the server or\
  \ client.\n- `grpc_version` (string): gRPC Java version, e.g. 1.64.0.\n- `port` (integer): Server listen\
  \ port, default 50051.\n\n**Commands:**\n- `./gradlew generateProto`\n- `./gradlew build`\n- `./gradlew\
  \ run`\n- `java -cp build/libs/app.jar com.example.GreeterServer`\n- `grpcurl -plaintext localhost:50051\
  \ helloworld.Greeter/SayHello -d '{\"name\":\"Java\"}'`\n\n**Examples:**\n- ./gradlew clean generateProto\
  \ build\n- java -cp build/libs/app.jar com.example.GreeterClient\n- ./gradlew test --tests '*.GreeterServiceTest'\n\
  \n## References\n- [gRPC Java Docs](https://grpc.io/docs/languages/java/)\n- [grpc-java GitHub](https://github.com/grpc/grpc-java)"
