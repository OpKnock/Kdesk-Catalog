title: Grpc Kotlin
description: 'gRPC services and clients in Kotlin using grpc-kotlin coroutines stubs: suspend RPCs, Flow-based
  streaming, and Gradle codegen wiring.'
version: 2.0.0
instructions: "# Grpc Kotlin\n\ngRPC services and clients in Kotlin using grpc-kotlin coroutines stubs:\
  \ suspend RPCs, Flow-based streaming, and Gradle codegen wiring.\n\n## Instructions\n\n# gRPC Kotlin\n\
  \nSuspend-based gRPC services and clients with grpc-kotlin coroutines.\n\n## What this skill does\n\n\
  - Generates Kotlin stubs (suspend functions and Flow streams) from protos.\n- Implements servers without\
  \ blocking: suspend RPC handlers run on coroutines.\n- Consumes server-streaming RPCs as Kotlin Flow.\n\
  - Wires the Gradle build for both java and kotlin stub codegen.\n\n## When to use\n\n- A Kotlin backend\
  \ wants idiomatic coroutine RPC handling.\n- Streaming responses should map directly to Flow for reactive\
  \ clients.\n- Replacing hand-rolled retrofit calls with typed gRPC contracts.\n\n## Real commands\n\n\
  ```bash\n# Download the codegen plugin from grpc-kotlin releases\ncurl -L -o protoc-gen-grpc-kotlin\
  \ https://github.com/grpc/grpc-kotlin/releases/download/1.4.1/protoc-gen-grpc-kotlin\nchmod +x protoc-gen-grpc-kotlin\n\
  \nprotoc --plugin=protoc-gen-grpckt=$(pwd)/protoc-gen-grpc-kotlin \\\n  --grpckt_out=build/generated\
  \ --proto_path src/main/proto greet.proto\n\n# Build and run via Gradle\n./gradlew generateProto\n./gradlew\
  \ run\n\n# Verify\ngrpcurl -plaintext -d '{\"name\":\"Kotlin\"}' localhost:50051 helloworld.Greeter/SayHello\n\
  ```\n\n## Gradle deps\n\n```kotlin\nimplementation(\"io.grpc:grpc-kotlin-stub:1.4.1\")\nimplementation(\"\
  io.grpc:grpc-netty-shaded:1.64.0\")\nimplementation(\"com.google.protobuf:protobuf-kotlin:3.25.3\")\n\
  ```\n\n## Server skeleton\n\n```kotlin\nobject GreeterService : GreeterGrpcKt.GreeterCoroutineImplBase()\
  \ {\n  override suspend fun sayHello(request: HelloRequest): HelloReply =\n    HelloReply.newBuilder().setMessage(\"\
  Hello ${request.name}\").build()\n}\n```\n\n## Streaming via Flow\n\n```kotlin\noverride fun streamMessages(request:\
  \ HelloRequest): Flow<HelloReply> =\n  flow { emit(HelloReply.newBuilder().setMessage(\"one\").build())\n\
  \         emit(HelloReply.newBuilder().setMessage(\"two\").build()) }\n```\n\n## Testing\n\n```bash\n\
  ./gradlew test\n```\n\nUse `GrpcCleanupRule` with InProcessServerBuilder for unit tests.\n\n## Best\
  \ practices\n\n- Prefer the coroutine stubs (`*CoroutineImplBase`, `*CoroutineStub`) over blocking stubs.\n\
  - Return `flow { }` lazily; never pre-buffer infinite streams.\n- Cancel client Flows to cancel the\
  \ underlying call.\n- Keep protoc and grpc-kotlin versions aligned with grpc-java.\n\n## Example exchange\n\
  \n```\nUser: My streaming handler buffers the whole list before returning.\nAgent: Return a cold flow\
  \ and emit as data arrives:\n       override fun streamMessages(request: HelloRequest) = flow { ...\
  \ }\n```\n\n## Capabilities\n\n### kotlin-grpc\nGenerate Kotlin gRPC stubs with protoc-gen-grpc-kotlin\
  \ and write coroutine-based RPC services.\n\n**Commands:**\n- `protoc --plugin=protoc-gen-grpckt=$(which\
  \ protoc-gen-grpc-kotlin) --grpckt_out=build/generated --proto_path src/main/proto greet.proto`\n- `./gradlew\
  \ generateProto`\n- `./gradlew run`\n- `./gradlew build`\n- `grpcurl -plaintext localhost:50051 helloworld.Greeter/SayHello`\n\
  \n**Examples:**\n- protoc --plugin=protoc-gen-grpckt=$(which protoc-gen-grpc-kotlin) --grpckt_out=build/generated\
  \ --proto_path src/main/proto greet.proto\n- ./gradlew test --tests '*GreeterTest'\n- grpcurl -plaintext\
  \ -d '{\"name\":\"Kotlin\"}' localhost:50051 helloworld.Greeter/SayHello"
prompt: Act as Grpc Kotlin and handle the task per the instructions.
