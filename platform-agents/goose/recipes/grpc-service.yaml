title: Grpc Service
description: Builds gRPC services with protobuf definitions, grpcurl inspection, and language-specific
  code generation.
version: 2.0.0
instructions: "# Grpc Service\n\nBuilds gRPC services with protobuf definitions, grpcurl inspection, and\
  \ language-specific code generation.\n\n## Instructions\n\n# gRPC Service\n\nBuild high-performance\
  \ RPC services with protobuf.\n\n## When to Use\n\n- Internal service-to-service communication\n- Streaming\
  \ workloads (bidirectional streams)\n- Polyglot systems needing generated clients\n- Services needing\
  \ strict typed contracts\n\n## Proto Example\n\n```proto\nsyntax = \"proto3\";\n\npackage order;\n\n\
  service OrderService {\n  rpc GetOrder(GetOrderRequest) returns (Order);\n}\n\nmessage GetOrderRequest\
  \ {\n  string id = 1;\n}\n\nmessage Order {\n  string id = 1;\n  double total = 2;\n  repeated string\
  \ items = 3;\n}\n```\n\n## Commands\n\n```bash\n# Generate Go stubs\nprotoc --go_out=. --go_opt=paths=source_relative\
  \ \\\n  --go-grpc_out=. proto/order.proto\n\n# Python stubs\nprotoc --python_out=. --grpc_python_out=.\
  \ proto/order.proto\n\n# Buf workflow\nbuf lint\nbuf generate\nbuf breaking --against .git#branch=main\n\
  \n# Inspect and call live servers\ngrpcurl -plaintext localhost:50051 list\ngrpcurl -plaintext -d '{\"\
  id\":\"1\"}' localhost:50051 order.OrderService/GetOrder\ngrpcurl -plaintext localhost:50051 describe\
  \ order.OrderService\n```\n\n## Best Practices\n\n- Never break wire compatibility; add fields instead\
  \ of renaming\n- Use buf breaking in CI to catch incompatible changes\n- Set deadlines on every client\
  \ call; servers enforce them too\n- Keep messages small; gRPC default max message is 4MB\n- Reserve\
  \ field numbers when planning for removal\n- Always run a plaintext grpcurl check before enabling TLS\n\
  \n## Capabilities\n\n### protobuf-codegen\nCompile protobuf definitions and generate server/client stubs.\n\
  \n**Commands:**\n- `protoc --go_out=. --go-grpc_out=. proto/order.proto`\n- `protoc --python_out=. --grpc_python_out=.\
  \ proto/order.proto`\n- `protoc --js_out=import_style=commonjs,binary:./out proto/order.proto`\n- `buf\
  \ generate`\n- `buf lint`\n\n**Examples:**\n- protoc --go_out=. --go_opt=paths=source_relative --go-grpc_out=.\
  \ proto/*.proto\n- buf generate --path proto\n- buf breaking --against .git#branch=main\n\n### grpc-debugging\n\
  Call and inspect gRPC services without writing code.\n\n**Commands:**\n- `grpcurl -plaintext localhost:50051\
  \ list`\n- `grpcurl -plaintext -d \"{\\\"id\\\":\\\"1\\\"}\" localhost:50051 order.OrderService/GetOrder`\n\
  - `grpcurl -plaintext localhost:50051 describe order.OrderService`\n- `buf curl --schema proto localhost:50051\
  \ order.OrderService/GetOrder -d \"{\\\"id\\\":\\\"1\\\"}\"`\n\n**Examples:**\n- grpcurl -plaintext\
  \ localhost:50051 list order\n- grpcurl -plaintext -import-path proto -proto order.proto -d \"{}\" localhost:50051\
  \ order.OrderService/CreateOrder\n- grpcurl -plaintext localhost:50051 describe order.Order"
prompt: Act as Grpc Service and handle the task per the instructions.
