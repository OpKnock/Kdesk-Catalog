title: Hardhat
description: 'Develops and tests Solidity with Hardhat: compile, test, deploy scripts, network management,
  and Etherscan verification.'
version: 2.0.0
instructions: "# Hardhat\n\nDevelops and tests Solidity with Hardhat: compile, test, deploy scripts, network\
  \ management, and Etherscan verification.\n\n## Instructions\n\n# Hardhat\n\nEVM development environment.\n\
  \n## When to Use\n\n- Solidity development with JS/TS tests\n- Local blockchain with hardhat network\n\
  - Deployments to testnets/mainnet with scripts\n- Etherscan verification\n\n## Commands\n\n```bash\n\
  # Setup\nnpx hardhat init\n\n# Build\nnpx hardhat compile\nnpx hardhat clean\n\n# Test\nnpx hardhat\
  \ test\nnpx hardhat test test/token.test.js\n\n# Local node\nnpx hardhat node\n\n# Deploy\nnpx hardhat\
  \ run scripts/deploy.js --network sepolia\n\n# Verify\nnpx hardhat verify --network sepolia 0x1234\n\
  \n# Console\nnpx hardhat console --network mainnet\n```\n\n## Config Example\n\n```javascript\n// hardhat.config.js\n\
  require(\"@nomicfoundation/hardhat-toolbox\");\n\nmodule.exports = {\n  solidity: \"0.8.24\",\n  networks:\
  \ {\n    sepolia: {\n      url: process.env.SEPOLIA_RPC_URL,\n      accounts: [process.env.PRIVATE_KEY],\n\
  \    },\n  },\n};\n```\n\n## Best Practices\n\n- Test on the local hardhat network before testnets\n\
  - Use env vars for private keys and RPC URLs\n- Pin the Solidity version in config\n- Verify contracts\
  \ immediately after deploy\n- Use console.log in tests with hardhat-toolbox\n- Add gas reporting and\
  \ coverage in CI\n\n## Capabilities\n\n### hardhat-dev\nCompile, test, and run local nodes.\n\n**Commands:**\n\
  - `npx hardhat init`\n- `npx hardhat compile`\n- `npx hardhat test`\n- `npx hardhat node`\n- `npx hardhat\
  \ clean`\n\n**Examples:**\n- npx hardhat test test/token.test.js\n- npx hardhat node --port 8545\n-\
  \ npx hardhat compile --force\n\n### hardhat-deploy\nDeploy and verify contracts.\n\n**Commands:**\n\
  - `npx hardhat run scripts/deploy.js`\n- `npx hardhat run scripts/deploy.js --network sepolia`\n- `npx\
  \ hardhat verify --network sepolia 0x1234`\n- `npx hardhat console`\n- `npx hardhat run scripts/deploy.js\
  \ --network localhost`\n\n**Examples:**\n- npx hardhat verify --network sepolia 0x1234 --constructor-args\
  \ args.js\n- npx hardhat console --network mainnet\n- npx hardhat run scripts/deploy.ts --network hardhat"
prompt: Act as Hardhat and handle the task per the instructions.
