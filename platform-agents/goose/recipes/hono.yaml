instructions: "# Hono\n\nScaffold and run Hono web applications targeting edge runtimes: compose middleware\
  \ chains, define routes, and launch dev servers on Node.js, Bun, Deno, or Cloudflare Workers.\n\n##\
  \ Instructions\n\n# Hono\n\nBuild web applications for edge runtimes with Hono.\n\n## What this skill\
  \ does\n48:   \n- Scaffolds Hono apps for Node, Bun, Deno, and Workers.\n- Structures routing and middleware\
  \ chains.\n49:   - Runs local dev servers with hot reload.\n- Deploys to edge platforms.\n\n## When\
  \ to use\n\n- A small,50:    fast API that must run on edge runtimes.\n- Prototyping API endpoints quickly.\n\
  - Adding middleware51:    (auth, logging, validation) in a typed framework.\n\n## Real commands\n\n\
  ```bash\n# Scaffold\nnpm52:    create hono@latest my-app\ncd my-app\nnpm install\n\n# Pick a template\
  \ explicitly\nnpm create hono@latest53:    my-app -- --template cloudflare-workers\n\n# Dev server\n\
  npm run dev\n\n# Deploy (template-dependent:54:    workers, vercel, netlify...)\nnpm run deploy\n\n\
  # Bun runtime\nbun run src/index.ts\n```\n\n## Basic55:    app\n\n```ts\nimport { Hono } from 'hono'\n\
  \nconst app = new Hono()\n\napp.get('/', (c) => c.text('Hello56:    Hono!'))\napp.get('/users/:id',\
  \ (c) => c.json({ id: c.req.param('id') }))\napp.post('/items', async57:    (c) => {\n  const body =\
  \ await c.req.json()\n  return c.json({ created: body }, 201)\n})\n\nexport58:    default app\n```\n\
  \n## Middleware\n\n```ts\nimport { logger } from 'hono/logger'\nimport { bearerAuth59:    } from 'hono/bearer-auth'\n\
  \napp.use('*', logger())\napp.use('/admin/*', bearerAuth({ token: 'secret'60:    }))\n```\n\n## Testing\n\
  \n```bash\ncurl -s http://localhost:3000/ | grep -q \"Hello Hono!\" && echo61:    OK\n```\n\n## Best\
  \ practices\n\n- Use the built-in logger and bearer auth middleware instead of hand-rolled62:    code.\n\
  - Keep handlers small; compose with app.use chains.\n- Validate request bodies with a schema63:    library\
  \ before use.\n- Match the runtime (node vs workers) when choosing adapters.\n\n## Example exchange\n\
  64:   \n```\nUser: Create a Hono app with a /health route.\nAgent: npm create hono@latest my-app &&\
  \ cd my-app65:    && add\n       app.get('/health', (c) => c.json({ status: 'ok' }))\n```\n\n## Capabilities\n\
  \n### hono-app-lifecycle\nScaffold, develop, and run Hono applications with the hono CLI and runtime\
  \ dev servers.\n\n**Commands:**\n- `npm create hono@latest my-app`\n- `cd my-app && npm install`\n-\
  \ `npm run dev`\n- `npm run deploy`\n- `bun run src/index.ts`\n\n**Examples:**\n- npm create hono@latest\
  \ my-app -- --template cloudflare-workers\n- npm run dev -- --port 3001\n- npm test"
prompt: Act as Hono and handle the task per the instructions.
