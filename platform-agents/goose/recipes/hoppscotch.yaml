title: Hoppscotch
description: 'Hoppscotch API workspace: running collections from the CLI, environment variables, and browser-based
  request testing with real-time responses.'
version: 2.0.0
instructions: "# Hoppscotch\n\nHoppscotch API workspace: running collections from the CLI, environment\
  \ variables, and browser-based request testing with real-time responses.\n\n## Instructions\n\n# Hoppscotch\n\
  \nTest APIs with Hoppscotch in the browser and in CI with the CLI.\n\n##48:    What this skill does\n\
  \n- Runs exported collections headlessly in CI.\n- Resolves environment variables49:    across requests.\n\
  - Repeats iterations for smoke testing.\n- Explains request chaining (values from50:    previous responses).\n\
  \n## When to use\n\n- Replaying a hand-crafted API session after an incident.\n51:   - Smoke testing\
  \ an endpoint suite in CI without writing code.\n- Sharing a reproducible request collection52:    with\
  \ the team.\n\n## Real commands\n\n```bash\n# Install the CLI\nnpm install -g @hoppscotch/cli\n53: \
  \  \n# Run a collection (exported JSON from the Hoppscotch app)\nhoppscotch run collection.json\n\n\
  # With54:    an environment file\nhoppscotch run collection.json -e prod.env.json\n\n# Repeat N times\n\
  hoppscotch55:    run collection.json --iteration 3\n\n# Load env vars from .env (dotenv support)\nnpx\
  \ @hoppscotch/cli56:    run api-collection.json --dotenv .env\n```\n\n## Environment file\n\n```json\n\
  {\n  \"name\": \"prod\"57:   ,\n  \"variables\": [\n    { \"key\": \"baseUrl\", \"value\": \"https://api.your-app.test\"\
  , \"secret\"58:   : false },\n    { \"key\": \"token\", \"value\": \"eyJ...\", \"secret\": true }\n\
  \  ]\n}\n```\n\n## Testing\n59:   \n```bash\nhoppscotch run collection.json -e prod.env.json --verbose\n\
  # exit code 0 when all requests60:    in the collection succeed\n```\n\n## Best practices\n\n- Keep\
  \ collections exported from the workspace61:    in git for CI replay.\n- Mark secrets as secret in environments;\
  \ never commit real tokens.\n- Use62:    environment files per stage (dev, staging, prod).\n- Add test\
  \ assertions in the collection so the63:    CLI run fails on regressions.\n\n## Example exchange\n\n\
  ```\nUser: Run the checkout collection against64:    prod.\nAgent: hoppscotch run checkout-collection.json\
  \ -e prod.env.json\n```\n\n## Capabilities\n\n### hoppscotch-cli\nRun Hoppscotch collections and manage\
  \ environments from the command line.\n\n**Commands:**\n- `npx @hoppscotch/cli run collection.json`\n\
  - `hoppscotch run collection.json -e prod.env.json`\n- `hoppscotch run --env prod -t collection.json`\n\
  - `hoppscotch run collection.json -d ./data.json --iteration 3`\n- `hoppscotch --version`\n\n**Examples:**\n\
  - npx @hoppscotch/cli run api-collection.json --dotenv .env\n- hoppscotch run collection.json -e dev.env.json\
  \ --verbose\n- hoppscotch run --iteration 5 collection.json"
prompt: Act as Hoppscotch and handle the task per the instructions.
