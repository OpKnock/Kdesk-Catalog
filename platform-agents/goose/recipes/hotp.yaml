title: HOTP
description: 'HMAC-based One-Time Passwords (RFC 4226): generating counters-based codes with oathtool,
  computing HMAC-SHA1 in OpenSSL/Python, and verifying HOTP values.'
version: 2.0.0
instructions: "# HOTP\n\nHMAC-based One-Time Passwords (RFC 4226): generating counters-based codes with\
  \ oathtool, computing HMAC-SHA1 in OpenSSL/Python, and verifying HOTP values.\n\n## Instructions\n\n\
  # HOTP\n\nCounter-based one-time passwords (RFC 4226).\n\n## What this skill does\n\n-49:    Generates\
  \ HOTP codes for a given counter with oathtool.\n- Computes the underlying HMAC-SHA1 with50:    openssl\
  \ for verification.\n- Generates codes in Python with pyotp.\n- Validates codes with --check51:    to\
  \ test token drift.\n\n## When to use\n\n- Implementing or debugging event-based 2FA tokens.\n- Verifying52:\
  \    a token generator matches the server state.\n- Teaching or auditing HMAC-based token logic.\n\n\
  ##53:    Real commands\n\n```bash\n# RFC 4226 test vector (counter 0, secret 12345678901234567890 ->\
  \ 755224)\n54:   oathtool --hotp --counter 0 12345678901234567890\n\n# Base32 secret\noathtool --hotp\
  \ --counter 5 -b55:    JBSWY3DPEHPK3PXP\n\n# Verify a code against a counter\noathtool --hotp --check\
  \ 755224 1234567890123456789056:    --counter 0\necho $?   # 0 on match\n\n# Under the hood: HMAC-SHA1\
  \ of the 8-byte counter\npython357:    -c \"\nimport hmac, hashlib, struct\nsecret = b'12345678901234567890'\n\
  msg = struct.pack('>Q', 0)\n58:   digest = hmac.new(secret, msg, hashlib.sha1).hexdigest()\nprint(digest)\n\
  \"\n\n# pyotp equivalent\n59:   python3 -c \"import pyotp; print(pyotp.HOTP('12345678901234567890').at(0))\"\
  \n```\n\n## Dynamic truncation\n60:   \nThe 6-digit code is the last 31 bits of the HMAC digest, zero-padded\
  \ to `digits`.\n\n## Testing\n\n61:   ```bash\nCODE=$(oathtool --hotp --counter 0 12345678901234567890)\n\
  oathtool --hotp --check \"$CODE\"62:    12345678901234567890 --counter 0 && echo \"valid\"\n```\n\n\
  ## Best practices\n\n- The counter MUST63:    advance on both sides; desync is the most common failure.\n\
  - Store secrets base32-encoded for interop64:    with Google Authenticator-style apps.\n- Use a look-ahead\
  \ window (e.g., +10) when verifying to tolerate65:    lost codes.\n- Never log counters or secrets.\n\
  \n## Example exchange\n\n```\nUser: The server rejected66:    the HOTP code from the app.\nAgent: Compare\
  \ counters:\n       oathtool --hotp --counter 12 1234567890123456789067:     # server state\n      \
  \ # resync server to the client's counter or widen the window\n```\n\n## Capabilities\n\n### hotp-generation\n\
  Generate and verify counter-based one-time passwords with oathtool and OpenSSL.\n\n**Commands:**\n-\
  \ `oathtool --hotp --counter 0 12345678901234567890`\n- `oathtool --hotp --counter 5 -b 12345678901234567890`\n\
  - `echo -n \"secret\" | openssl dgst -sha1 -mac HMAC -macopt key:deadbeef`\n- `python3 -c \"import pyotp;\
  \ print(pyotp.HOTP('base32secret3232').at(0))\"`\n- `oathtool --hotp --check 755224 12345678901234567890\
  \ --counter 0`\n\n**Examples:**\n- oathtool --hotp --counter 1 12345678901234567890\n- python3 -c \"\
  import pyotp; print(pyotp.HOTP('JBSWY3DPEHPK3PXP').at(42))\"\n- oathtool --hotp --base32 --counter 3\
  \ JBSWY3DPEHPK3PXP"
prompt: Act as HOTP and handle the task per the instructions.
