title: HSTS
description: 'HTTP Strict Transport Security: verifying HSTS headers with curl, configuring Strict-Transport-Security
  in Nginx/Caddy, and checking preload status.'
version: 2.0.0
instructions: "# HSTS\n\nHTTP Strict Transport Security: verifying HSTS headers with curl, configuring\
  \ Strict-Transport-Security in Nginx/Caddy, and checking preload status.\n\n## Instructions\n\n# HSTS\n\
  \nEnforce HTTPS with HTTP Strict Transport Security headers.\n\n## What this skill48:    does\n\n- Verifies\
  \ the Strict-Transport-Security header on live sites.\n- Configures HSTS in Nginx49:    and other servers.\n\
  - Checks preload eligibility via the hstspreload API.\n- Catches mixed-content/redirect50:    issues\
  \ around HSTS.\n\n## When to use\n\n- Hardening a site after enabling HTTPS.\n- Auditing third-party51:\
  \    domains for HSTS compliance.\n- Preparing a domain for the HSTS preload list.\n\n## Real commands\n\
  52:   \n```bash\n# Check the header\ncurl -sI https://api.your-app.test | grep -i strict-transport-security\n\
  \n53:   # Check plain HTTP redirect (should 301 to https)\ncurl -sI http://api.your-app.test | grep\
  \ -i location\n\n54:   # Preload status\ncurl -s \"https://hstspreload.org/api/v2/status?domain=your-app.test\"\
  \ | jq .\n\n# Header55:    over TLS\nopenssl s_client -connect api.your-app.test:443 -servername api.your-app.test\
  \ </dev/null 2>/dev/null56:    | grep -i strict\n```\n\n## Nginx config\n\n```nginx\nserver {\n    listen\
  \ 443 ssl;\n    add_header57:    Strict-Transport-Security \"max-age=63072000; includeSubDomains; preload\"\
  \ always;\n}\n```\n\n## Preload58:    requirements\n\n- Valid certificate on all subdomains.\n- HSTS\
  \ with max-age >= 31536000 and includeSubDomains.\n59:   - All HTTP must redirect to HTTPS.\n\n## Testing\n\
  \n```bash\n# After deploying, verify header and preload60:    status\ncurl -sI https://api.your-app.test\
  \ | grep -i strict-transport-security\ncurl -s \"https://hstspreload.org/api/v2/status?domain=your-app.test\"\
  61:    | jq .status\n```\n\n## Best practices\n\n- Start with `max-age=86400`, then raise to 63072000\
  \ once62:    stable.\n- Add includeSubDomains only when every subdomain supports HTTPS.\n- Test with\
  \ curl -sI before63:    and after every TLS change.\n- Never add `preload` until both requirements are\
  \ fully met.\n\n## Example64:    exchange\n\n```\nUser: Does your-app.test send HSTS?\nAgent: curl -sI\
  \ https://api.your-app.test | grep -i65:    strict-transport-security\n       # strict-transport-security:\
  \ max-age=63072000; includeSubDomains\n66:   ```\n\n## Capabilities\n\n### hsts-header-ops\nInspect\
  \ and configure HSTS headers on servers and check preload eligibility.\n\n**Commands:**\n- `curl -sI\
  \ https://api.your-app.test | grep -i strict-transport-security`\n- `curl -s -o /dev/null -w '%{http_code}\\\
  n' https://api.your-app.test`\n- `echo | openssl s_client -connect api.your-app.test:443 -servername\
  \ api.your-app.test 2>/dev/null | grep -i strict`\n- `curl -s \"https://hstspreload.org/api/v2/status?domain=your-app.test\"\
  \ | jq .`\n- `curl -sI https://api.your-app.test | grep -iE \"location|strict\"`\n\n**Examples:**\n\
  - curl -sI https://api.your-app.test | grep -i \"strict-transport-security\"\n- curl -s \"https://hstspreload.org/api/v2/status?domain=your-app.test\"\
  \ | jq .status\n- curl -sI http://api.your-app.test | grep -i strict-transport-security"
prompt: Act as HSTS and handle the task per the instructions.
