title: huey
description: 'Runs lightweight task queues with Huey: in-process or Redis-backed workers, cron scheduling,
  retries, and lock management.'
version: 2.0.0
instructions: "# huey\n\nRuns lightweight task queues with Huey: in-process or Redis-backed workers, cron\
  \ scheduling, retries, and lock management.\n\n## Instructions\n\n# Huey\n\nLightweight task queue for\
  \ Python.\n\n## When to Use\n\n- Simple apps needing background tasks without Celery overhead\n- Redis-backed\
  \ or even in-process queues\n- Cron-style scheduling with the built-in crontab support\n- Atomic locks\
  \ for guarding shared resources\n\n## Setup\n\n```bash\npip install huey[redis]\n```\n\n## Commands\n\
  \n```bash\n# Start the consumer\nhuey_consumer tasks.huey\n\n# 4 worker processes\nhuey_consumer tasks.huey\
  \ -w 4\n\n# Thread pool with 8 threads\nhuey_consumer tasks.huey -k thread --threads 8\n\n# Debug logging\n\
  huey_consumer tasks.huey -l debug\n\n# Inspect queues\nredis-cli llen huey:queue\nredis-cli --scan --pattern\
  \ \"huey:*\"\n```\n\n## Task Example\n\n```python\n# tasks.py\nfrom huey import RedisHuey\nfrom huey.contrib.djhuey\
  \ import task  # Django users\n\nhuey = RedisHuey(\"myapp\")\n\n@huey.task(retries=3, retry_delay=10)\n\
  def send_email(to, subject):\n    send(to, subject)\n\n@huey.periodic_task(huey.crontab(minute=\"0\"\
  , hour=\"6\"))\ndef daily_report():\n    generate_report()\n```\n\n## Enqueue\n\n```python\nfrom tasks\
  \ import send_email\nsend_email(\"user@example.com\", \"Hello\")\n```\n\n## Best Practices\n\n- Set\
  \ retries and retry_delay on tasks touching external services\n- Use lock_task for idempotent periodic\
  \ jobs\n- Choose thread or process worker types per task workload\n- Monitor huey:queue length to size\
  \ workers\n- Keep the consumer running under a process manager\n\n## Capabilities\n\n### huey-workers\n\
  Run Huey consumers for Redis or in-memory brokers.\n\n**Commands:**\n- `huey_consumer tasks.huey`\n\
  - `huey_consumer tasks.huey -w 4`\n- `huey_consumer tasks.huey --workers 2 --threads 8`\n- `python -m\
  \ huey.consumer tasks.huey`\n- `redis-cli keys \"huey*\"`\n\n**Examples:**\n- huey_consumer tasks.huey\
  \ -k thread\n- huey_consumer tasks.huey -w 4 -l debug\n- huey_consumer tasks.huey --queues default,email\n\
  \n### huey-scheduling\nSchedule periodic tasks and manage task state.\n\n**Commands:**\n- `redis-cli\
  \ llen huey:queue`\n- `redis-cli hgetall huey:results:123`\n- `python -c \"from tasks import send_mail;\
  \ send_mail(\\\"a@b.c\\\")\"`\n- `redis-cli --scan --pattern \"huey:*\"`\n\n**Examples:**\n- redis-cli\
  \ llen huey:queue\n- redis-cli zrange huey:scheduled 0 -1"
prompt: Act as huey and handle the task per the instructions.
