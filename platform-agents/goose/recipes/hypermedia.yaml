  - Tools: `Glob`, `Grep`, `Read`, `Bash` (see frontmatter `tools`/`allowed-tools`)\n- Use `safe_path`\
  \ for any write; record evidence (paths, checksums)\n- Fingerprint: `hypermedia:82a55e50`\n\n# Hypermedia\n\
  \nDesign and consume hypermedia-driven (HATEOAS) APIs.\n\n## What this skill45:    does\n\n- Fetches\
  \ HAL and JSON:API resources with the right Accept headers.\n- Extracts and follows46:    link relations\
  \ with jq.\n- Checks OPTIONS for allowed affordances.\n- Guides response design with47:    self-describing\
  \ links.\n\n## When to use\n\n- Building APIs where clients should discover actions48:    from the response.\n\
  - Debugging a hypermedia client that follows links.\n- Auditing whether a response49:    is truly self-describing.\n\
  \n## Real commands\n\n```bash\n# Fetch HAL resource\ncurl -H \"Accept:50:    application/hal+json\"\
  \ http://localhost:8080/orders/1\n\n# Follow the self link\ncurl -s -H \"Accept:51:    application/hal+json\"\
  \ http://localhost:8080/orders/1 | jq '._links.self.href'\n\n# JSON:API with52:    pagination links\n\
  curl -s -H \"Accept: application/vnd.api+json\" http://localhost:8080/api/articles53:    | jq '.links'\n\
  \n# List allowed methods\ncurl -i -X OPTIONS http://localhost:8080/orders/1 | grep54:    -i allow\n\
  ```\n\n## HAL response shape\n\n```json\n{\n  \"id\": 1,\n  \"total\": 99.5,\n  \"_links\"55:   : {\n\
  \    \"self\": { \"href\": \"/orders/1\" },\n    \"customer\": { \"href\": \"/customers/7\" },\n56:\
  \       \"cancel\": { \"href\": \"/orders/1/cancel\" }\n  }\n}\n```\n\n## JSON:API response shape\n\n\
  ```json\n57:   {\n  \"data\": { \"type\": \"orders\", \"id\": \"1\", \"attributes\": { \"total\": 99.5\
  \ } },\n  \"links\"58:   : { \"self\": \"/orders/1\", \"next\": \"/orders?page=2\" }\n}\n```\n\n## Testing\n\
  \n```bash\n# A good59:    hypermedia API always exposes a discoverable root\ncurl -s http://localhost:8080/api\
  \ | jq 'keys'\n60:   ```\n\n## Best practices\n\n- Link relations are the contract: use RFC 8288 registered\
  \ relations where61:    possible.\n- Version the media type, not the URL: application/vnd.api+json.\n\
  - Never hardcode client62:    URLs; always resolve from links.\n- Distinguish safe (GET) from unsafe\
  \ relations in docs.\n\n## Example63:    exchange\n\n```\nUser: How does a client discover how to cancel\
  \ an order?\nAgent: Expose the affordance64:    in _links and let the client follow it:\n       curl\
  \ -s -H \"Accept: application/hal+json\" http://localhost:8080/orders/165:    | jq '._links.cancel.href'\n\
  ```\n\n## Capabilities\n\n### hypermedia-consumption\nExplore and follow hypermedia-driven APIs using\
  \ HAL and JSON:API conventions.\n\n**Parameters:**\n- `accept` (string): Media type, e.g. application/hal+json\
  \ or application/vnd.api+json.\n- `resource_url` (string): URL of the resource to fetch.\n- `relation`\
  \ (string): Link relation to extract, e.g. self, next, related.\n\n**Commands:**\n- `curl -H \"Accept:\
  \ application/hal+json\" http://localhost:8080/orders/1`\n- `curl -H \"Accept: application/vnd.api+json\"\
  \ http://localhost:8080/api/articles`\n- `curl -s -H \"Accept: application/hal+json\" http://localhost:8080/orders/1\
  \ | jq '._links'`\n- `curl -s -H \"Accept: application/vnd.api+json\" http://localhost:8080/api/articles\
  \ | jq '.data[0].relationships'`\n- `curl -i -X OPTIONS http://localhost:8080/orders/1`\n\n**Examples:**\n\
  - curl -s -H \"Accept: application/hal+json\" http://localhost:8080/orders/1 | jq '._links.self.href'\n\
  - curl -s -H \"Accept: application/vnd.api+json\" http://localhost:8080/api/articles | jq '.links.next'\n\
  - curl -s http://localhost:8080/api | jq .\n\n## References\n- [HAL Specification](https://stateless.co/hal_specification.html)\n\
  - [JSON:API Spec](https://jsonapi.org/format/)"
