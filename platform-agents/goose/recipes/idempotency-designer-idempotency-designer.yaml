title: idempotency-designer-idempotency-designer
description: 'Designs idempotent APIs and consumers: idempotency keys, Redis SETNX locks, unique constraints,
  and replay-safe workflows.'
version: 2.0.0
instructions: "# idempotency-designer-idempotency-designer\n\nDesigns idempotent APIs and consumers: idempotency\
  \ keys, Redis SETNX locks, unique constraints, and replay-safe workflows.\n\n## Instructions\n\n# Idempotency\
  \ Design\n\nMake writes safe to retry without double effects.\n\n## When to Use\n\n- Payment and order\
  \ APIs where clients retry\n- Webhook consumers that redeliver events\n- Queue workers with at-least-once\
  \ delivery\n\n## Idempotency key pattern\n\n1. Client sends `Idempotency-Key` header.\n2. Server tries\
  \ `SET key status NX EX 900` in Redis.\n3. If key exists, return the stored response instead of re-processing.\n\
  \n```bash\nredis-cli SET charge:key:abc 202 accepted NX EX 300\nredis-cli GET charge:key:abc\n```\n\n\
  If NX fails, load the stored response and return it with 200.\n\n## Key rules\n\n- Keys must be unique\
  \ per logical operation, random per client.\n- TTL the lock (300-900s) to bound storage.\n- Return the\
  \ same response body for replays - clients compare it.\n\n## Database uniqueness\n\nAdd a unique constraint\
  \ as the source of truth:\n\n```sql\nCREATE UNIQUE INDEX uq_payment_request\n  ON payments(request_id)\
  \ WHERE status <> 'failed';\n```\n\n## Testing replays\n\n```bash\ncurl -i -X POST http://localhost:8080/orders\
  \ -H 'Idempotency-Key: abc-123' -d '{\"sku\":\"A1\"}'\ncurl -i -X POST http://localhost:8080/orders\
  \ -H 'Idempotency-Key: abc-123' -d '{\"sku\":\"A1\"}'\n```\n\nThe second call must not create a second\
  \ order.\n\n## Concurrency test\n\n```js\n// idempotency-test.js\nimport http from 'k6/http';\nconst\
  \ key = 'k6-' + Date.now();\n\nexport default function () {\n  http.post('http://localhost:8080/orders',\n\
  \    JSON.stringify({ sku: 'A1' }),\n    { headers: { 'Idempotency-Key': key, 'Content-Type': 'application/json'\
  \ } });\n}\n```\n\n```bash\nk6 run --vus 20 --duration 10s idempotency-test.js\n```\n\nExactly one order\
  \ must be created despite 20 concurrent requests.\n\n## Best practices\n\n- Log the idempotency key\
  \ with every write for audit.\n- Never reuse a key with different payloads.\n- Test that failures during\
  \ processing do not poison the lock.\n\n## Testing\n\nRun sequential replay tests and the k6 concurrency\
  \ test in CI.\n\n## Capabilities\n\n### redis-locks\nImplement idempotency keys with Redis atomic primitives.\n\
  \n**Commands:**\n- `redis-cli SET order:key:abc123 processed NX EX 900`\n- `redis-cli SETNX order:key:abc123\
  \ processed`\n- `redis-cli GET order:key:abc123`\n- `redis-cli EXPIRE order:key:abc123 900`\n- `redis-cli\
  \ EVAL \"if redis.call('GET', KEYS[1]) == ARGV[1] then redis.call('DEL', KEYS[1]) return 1 else return\
  \ 0 end\" 1 order:key:abc123 done`\n\n**Examples:**\n- redis-cli SET charge:key:xyz 202 accepted NX\
  \ EX 300\n- redis-cli --eval lua/check-and-set.lua order:key:abc123 , request-id-1\n- redis-cli GET\
  \ charge:key:xyz\n\n### api-tests\nVerify idempotent behavior against live APIs.\n\n**Commands:**\n\
  - `curl -i -X POST http://localhost:8080/orders -H 'Idempotency-Key: abc-123' -H 'Content-Type: application/json'\
  \ -d '{\"sku\":\"A1\"}'`\n- `curl -i -X POST http://localhost:8080/orders -H 'Idempotency-Key: abc-123'\
  \ -H 'Content-Type: application/json' -d '{\"sku\":\"A1\"}'`\n- `curl -i -X POST http://localhost:8080/orders\
  \ -H 'Idempotency-Key: abc-456' -H 'Content-Type: application/json' -d '{\"sku\":\"A1\"}'`\n- `k6 run\
  \ --vus 20 --duration 10s idempotency-test.js`\n- `ab -n 200 -c 20 -p payload.json -T application/json\
  \ -H 'Idempotency-Key: load-test-1' http://localhost:8080/orders`\n\n**Examples:**\n- curl -i -X POST\
  \ http://localhost:8080/payments -H 'Idempotency-Key: pay-1' -d '{\"amount\":100}' | head -12\n- k6\
  \ run --vus 50 --duration 10s idempotency-test.js\n- curl -i -X DELETE http://localhost:8080/orders/42"
prompt: Act as idempotency-designer-idempotency-designer and handle the task per the instructions.
