title: Idempotency Pattern
description: Implement request deduplication using Idempotency-Key headers, atomic Redis SET NX EX operations,
  and database unique constraints to make retries safe for payment and order endpoints.
version: 2.0.0
instructions: "# Idempotency Pattern\n\nImplement request deduplication using Idempotency-Key headers,\
  \ atomic Redis SET NX EX operations, and database unique constraints to make retries safe for payment\
  \ and order endpoints.\n\n## Instructions\n\n# Idempotency Patterns\n\nMake retry-safe APIs with proven\
  \ dedup patterns.\n\n## What this48:    skill does\n\n- Explains Idempotency-Key headers for POST/PUT\
  \ retries.\n- Implements atomic claims49:    with Redis SET NX EX.\n- Backs dedup with database unique\
  \ constraints.\n- Verifies replay responses50:    are byte-identical.\n\n## When to use\n\n- Payment/order\
  \ endpoints where retries can double-charge.\n51:   - Designing public APIs for flaky mobile networks.\n\
  - Auditing whether a service is safe to retry.\n52:   \n## Real commands\n\n```bash\n# Client sends\
  \ a key with each request\ncurl -X POST -H \"Idempotency-Key:53:    7d1a-4f2b\" http://localhost:8080/payments\n\
  \n# Server claims the key atomically (NX = only if absent)\n54:   redis-cli SET idem:pay:7d1a in-progress\
  \ NX EX 3600\n\n# On retry, the same key returns the stored response\n55:   redis-cli GET idem:pay:7d1a\n\
  \n# DB-level backstop\nmysql -e \"ALTER TABLE payments ADD UNIQUE KEY uk_idem56:    (idempotency_key);\"\
  \n\n# Replay verification\ncurl -s -X POST -H \"Idempotency-Key: k-1\" http://localhost:8080/payments57:\
  \    -o r1.json\ncurl -s -X POST -H \"Idempotency-Key: k-1\" http://localhost:8080/payments -o r2.json\n\
  58:   diff r1.json r2.json  # must be identical\n```\n\n## Decision table\n\n- Idempotency-Key present\
  \ and59:    unknown -> process, store key + response.\n- Key present and cached -> return cached response\
  \ verbatim.\n60:   - Key absent on a mutating call -> process but warn; cannot dedup.\n- Key reused\
  \ with different payload61:    -> 422 Conflict.\n\n## Testing\n\n```bash\n# Crash mid-processing leaves\
  \ an in-progress entry: TTL62:    expires it\nredis-cli SET idem:pay:x in-progress NX EX 5\nredis-cli\
  \ TTL idem:pay:x  # should count63:    down\n```\n\n## Best practices\n\n- Keys must be unique per operation,\
  \ generated by the client.\n64:   - Expire keys after a bounded window (minutes to days).\n- Return\
  \ the exact cached body, including status65:    code, on replays.\n- Reject key reuse with a different\
  \ payload as a conflict.\n\n## Example exchange\n66:   \n```\nUser: A retry double-charged the customer.\n\
  Agent: Add a server-side Idempotency-Key claim:\n67:          redis-cli SET idem:pay:<key> in-progress\
  \ NX EX 3600\n       # and reject replays that carry68:    a different body\n```\n\n## Capabilities\n\
  \n### dedup-patterns\nImplement request deduplication with headers, Redis atomic ops, and DB constraints.\n\
  \n**Commands:**\n- `curl -X POST -H \"Idempotency-Key: 7d1a-4f2b\" http://localhost:8080/payments`\n\
  - `redis-cli SET idem:pay:7d1a created NX EX 3600`\n- `redis-cli GET idem:pay:7d1a`\n- `redis-cli SETNX\
  \ idem:pay:7d1a in-progress`\n- `curl -X POST -H \"Idempotency-Key: 7d1a-4f2b\" http://localhost:8080/payments\
  \ --retry 2`\n\n**Examples:**\n- redis-cli SET idem:pay:7d1a done EX 3600 NX && echo claimed\n- curl\
  \ -s -X POST -H \"Idempotency-Key: k-1\" http://localhost:8080/payments -o r1.json && curl -s -X POST\
  \ -H \"Idempotency-Key: k-1\" http://localhost:8080/payments -o r2.json && diff r1.json r2.json\n- mysql\
  \ -e \"ALTER TABLE payments ADD UNIQUE KEY uk_idem (idempotency_key);\""
prompt: Act as Idempotency Pattern and handle the task per the instructions.
