title: Idempotency
description: 'Idempotency in practice: Stripe-style Idempotency-Key usage, retry loops with curl, storing
  responses in Redis, and verifying identical replays.'
version: 2.0.0
instructions: "# Idempotency\n\nIdempotency in practice: Stripe-style Idempotency-Key usage, retry loops\
  \ with curl, storing responses in Redis, and verifying identical replays.\n\n## Instructions\n\n# Idempotency\n\
  \nSend and handle idempotent requests the way payment APIs do.\n\n## What51:    this skill does\n\n\
  - Uses Idempotency-Key headers on mutating requests.\n- Caches first responses52:    and replays them\
  \ verbatim.\n- Runs retry loops safely with curl --retry.\n- Verifies replays return53:    identical\
  \ bodies and status codes.\n\n## When to use\n\n- Integrating with APIs that document Idempotency-Key54:\
  \    (Stripe, Shopify...).\n- Adding retry logic without duplicate side effects.\n- Testing your own\
  \ API's55:    replay behavior.\n\n## Real commands\n\n```bash\n# Stripe-style request\ncurl -X POST\
  \ https://api.stripe.com/v1/charges56:    -u sk_test_x: \\\n  -H \"Idempotency-Key: abc123\" -d amount=100\
  \ -d currency=usd\n\n# Two calls, one57:    key: responses must be identical\ncurl -s -X POST -H \"\
  Idempotency-Key: k1\" http://localhost:8080/v1/payments58:    -d amount=100 -o r1.json\ncurl -s -X POST\
  \ -H \"Idempotency-Key: k1\" http://localhost:8080/v1/payments59:    -d amount=100 -o r2.json\ndiff\
  \ r1.json r2.json\n\n# Server-side cache key\nredis-cli SETEX idem:k160:    60 done\n\n# Retry with\
  \ the same key across attempts\ncurl --retry 3 --retry-all-errors -X POST -H61:    \"Idempotency-Key:\
  \ 9x\" \\\n  http://localhost:8080/v1/payments -d amount=10\n```\n\n## Client retry62:    loop\n\n```bash\n\
  KEY=\"$(uuidgen)\"\nfor i in 1 2 3; do\n  curl -s -X POST -H \"Idempotency-Key: $KEY\"63:    http://localhost:8080/v1/payments\
  \ -d amount=10 && break\n  sleep 2\ndone\n```\n\n## Testing\n\n```bash\n64:   # Same key, different\
  \ payload must be rejected\ncurl -s -o /dev/null -w '%{http_code}\\n' -X POST -H65:    \"Idempotency-Key:\
  \ k1\" http://localhost:8080/v1/payments -d amount=200\n# expect 409/422 conflict\n66:   ```\n\n## Best\
  \ practices\n\n- Generate the key client-side (UUID) before the first attempt.\n- Keep67:    the key\
  \ stable across all retries of one logical operation.\n- Store the canonical response (status68:   \
  \ + body) server-side under the key.\n- Expire entries to bound storage; clients accept a new key after69:\
  \    expiry.\n\n## Example exchange\n\n```\nUser: Retry the payment request safely after a timeout.\n\
  Agent:70:    Reuse one key for all attempts:\n       curl --retry 3 --retry-all-errors -X POST -H \"\
  Idempotency-Key:71:    9x\" http://localhost:8080/v1/payments -d amount=10\n```\n\n## Capabilities\n\
  \n### idempotency-http\nSend idempotent HTTP requests, cache responses, and verify replay behavior.\n\
  \n**Commands:**\n- `curl -X POST https://api.stripe.com/v1/charges -u sk_test_x: -H \"Idempotency-Key:\
  \ abc123\" -d amount=100 -d currency=usd`\n- `curl -s -X POST -H \"Idempotency-Key: k1\" http://localhost:8080/v1/payments\
  \ -d amount=100 -o r1.json`\n- `redis-cli SET idem:k1 in-progress NX EX 60`\n- `redis-cli SETEX idem:k1\
  \ 60 done`\n- `curl -s -X POST -H \"Idempotency-Key: k1\" http://localhost:8080/v1/payments -d amount=100\
  \ -o r2.json && diff r1.json r2.json`\n\n**Examples:**\n- curl --retry 3 --retry-all-errors -X POST\
  \ -H \"Idempotency-Key: 9x\" http://localhost:8080/v1/payments -d amount=10\n- redis-cli GET idem:k1\n\
  - curl -s -o /dev/null -w '%{http_code}' -X POST -H \"Idempotency-Key: k1\" http://localhost:8080/v1/payments\
  \ -d amount=200"
prompt: Act as Idempotency and handle the task per the instructions.
