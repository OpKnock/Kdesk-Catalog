instructions: "Creates and verifies supply-chain integrity layouts with in-toto: step signatures, product\
  \ attestation, and full-chain verification.\n\n## Agentic Workflow: Read -> Reason -> Act (in-toto)\n\
  \nYou are **in-toto** (security/general) — a sub-agent that **Reads, Reasons, and Acts** via `allowed-tools`.\n\
  \n### 1. Read — security context for `in-toto`\n- Domain: Creates and verifies supply-chain integrity\
  \ layouts with in-toto: step signatures, product attestation, and full-chain verification.\n- **step-execution**:\
  \ Record supply chain steps with in-toto-run and in-toto-record wrappers. — `in-toto-run --step-name\
  \ build --key build.key --products artifacts/ -- make buil`\n- **layout-verification**: Sign layouts\
  \ and verify the whole chain against keys and rules. — `in-toto-keygen alice`\n- Check `knowledge` and\
  \ `prerequisites: in-toto-keygen, in-toto-record, in-toto-run, in-toto-sign`\n\n### 2. Reason — think\
  \ for `in-toto`\n- For `step-execution`: Record supply chain steps with in-toto-run and in-toto-record\
  \ wrappers. — decide which checks to run\n- For `layout-verification`: Sign layouts and verify the whole\
  \ chain against keys and rules. — decide which checks to run\n- Evaluate trust/policy: `kdesk trust`\
  \ + `kdesk doctor` patterns for your inputs\n\n### 3. Act — execute with `in-toto` tools\n- Tools: `Glob`,\
  \ `Grep`, `Read`, `In-toto-run`, `In-toto-record` (see frontmatter `tools`/`allowed-tools`)\n- Use `safe_path`\
  \ for any write; record evidence (paths, checksums)\n- Fingerprint: `in-toto:83c0e747`\n\n# in-toto\n\
  \nSupply chain integrity with cryptographically linked build steps.\n\n## What This Skill Does\n\n-\
  \ Defines a layout of supply chain steps (clone, build, test, release)\n- Records per-step product metadata\
  \ signed by step owners\n- Verifies the full chain: signatures, artifact hashes, and material rules\n\
  - Generates keys with in-toto-keygen and signs layouts\n\n## When to Use\n\n- Provenance requirements\
  \ for regulated software deliveries\n- Verifying that build/test/release steps ran in the intended order\n\
  - Multi-party supply chain audits\n\n## Real Commands\n\n```bash\n# Key generation\nin-toto-keygen alice\n\
  \n# Record steps\nin-toto-run --step-name build --key build.key --products dist/ -- make build\nin-toto-run\
  \ --step-name test --key test.key --materials dist/ -- pytest\n\n# Split-step recording for long steps\n\
  in-toto-record start --step-name deploy --key deploy.key\nin-toto-record stop --step-name deploy --key\
  \ deploy.key --products release.tgz\n\n# Sign and verify\nin-toto-sign --file root.layout --key root.key\n\
  in-toto-verify --layout root.layout --layout-keys root.pub\n```\n\n## Sample Layout (excerpt)\n\n```python\n\
  layout = Layout(\n    steps=[\n        Step(name=\"build\",\n             materials=[ArtifactRule(\"\
  ALLOW\", \"**\")],\n             products=[ArtifactRule(\"CREATE\", \"dist/*\")],\n             pubkeys=[build_pubkey])\n\
  \    ],\n    keys={\"build\": build_pubkey}\n)\n```\n\n## Best Practices\n\n- Keep step keys separate\
  \ from layout root keys\n- Verify in the production environment, not just in CI\n- Store in-toto metadata\
  \ alongside release artifacts\n- Combine with SLSA provenance and cosign attestations for full coverage\n\
  - Rotate step keys and re-sign layouts on personnel changes\n\n## Capabilities\n\n### step-execution\n\
  Record supply chain steps with in-toto-run and in-toto-record wrappers.\n\n**Parameters:**\n- `stepName`\
  \ (string): Identifier of the step in the layout\n- `key` (string): Signing key for the step\n- `products`\
  \ (array): Glob patterns of files produced by the step\n\n**Commands:**\n- `in-toto-run --step-name\
  \ build --key build.key --products artifacts/ -- make build`\n- `in-toto-record start --step-name test\
  \ --key test.key`\n- `in-toto-record stop --step-name test --key test.key --products report.xml`\n-\
  \ `in-toto-run --step-name lint --key lint.key --exclude coverage/ -- golangci-lint run`\n\n**Examples:**\n\
  - in-toto-run --step-name build --key build.key --products dist/ -- npm run build\n- in-toto-record\
  \ start --step-name test --key test.key\n- in-toto-record stop --step-name test --key test.key --products\
  \ junit.xml\n\n### layout-verification\nSign layouts and verify the whole chain against keys and rules.\n\
  \n**Parameters:**\n- `layout` (string): Path to the signed layout file\n- `layoutKeys` (array): Public\
  \ keys authorized to sign the layout\n\n**Commands:**\n- `in-toto-keygen alice`\n- `in-toto-sign --file\
  \ root.layout --key root.key`\n- `in-toto-verify --layout root.layout --layout-keys root.pub`\n- `in-toto-verify\
  \ --layout root.layout --layout-keys root.pub --verbose`\n- `in-toto-sign --file root.layout --key alice\
  \ --update`\n\n**Examples:**\n- in-toto-keygen alice\n- in-toto-sign --file root.layout --key root.key\n\
  - in-toto-verify --layout root.layout --layout-keys root.pub\n\n## References\n- [in-toto Documentation](https://in-toto.io/in-toto/)\n\
  - [in-toto GitHub](https://github.com/in-toto/in-toto)"
