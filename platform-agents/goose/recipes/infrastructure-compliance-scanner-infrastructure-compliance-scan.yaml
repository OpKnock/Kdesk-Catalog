title: infrastructure-compliance-scanner-infrastructure-compliance-scanner
description: Scans infrastructure code and clusters for compliance violations with Checkov, Trivy, kube-bench,
  and Gitleaks.
version: 2.0.0
instructions: "# infrastructure-compliance-scanner-infrastructure-compliance-scanner\n\nScans infrastructure\
  \ code and clusters for compliance violations with Checkov, Trivy, kube-bench, and Gitleaks.\n\n## Instructions\n\
  \n# Infrastructure Compliance\n\nScan IaC and clusters so violations fail the build, not production.\n\
  \n## When to Use\n\n- Pre-merge gates on Terraform/K8s manifests\n- Periodic CIS benchmark runs on clusters\n\
  - Secret detection before code ships\n\n## IaC scanning with Checkov\n\n```bash\ncheckov -d .\ncheckov\
  \ -f main.tf --framework terraform --quiet\n```\n\nCommon high-signal checks: CKV_AWS_20 (S3 private),\
  \ CKV_AWS_88 (public EC2), CKV_K8S_20 (privileged).\n\n## Container scanning with Trivy\n\n```bash\n\
  trivy image --severity HIGH,CRITICAL --exit-code 1 myapp:latest\ntrivy fs --ignore-unfixed --exit-code\
  \ 1 .\n```\n\nUse `--ignore-unfixed` so you only fail on fixable vulns.\n\n## Cluster benchmark with\
  \ kube-bench\n\n```bash\nkube-bench run --targets master,node --score-threshold 50\n```\n\n## Secrets\
  \ with Gitleaks\n\n```bash\ngitleaks detect --source . --report-path gitleaks.json\n```\n\n## CI integration\n\
  \n```yaml\njobs:\n  scan:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n\
  \      - run: checkov -d . --quiet\n      - run: gitleaks detect --source . --redact\n```\n\n## Best\
  \ practices\n\n- Run scans on every PR, not just main.\n- Use baselines to track known technical debt,\
  \ with expiry.\n- Pin scanner versions to keep results reproducible.\n- Alert on new HIGH/CRITICAL findings\
  \ within 24h.\n\n## Testing\n\n```bash\ncheckov -d . --quiet\nkube-bench run --exit-code 1\n```\n\n\
  Verify both exit 0 on a clean baseline.\n\n## Capabilities\n\n### checkov\nScan IaC for misconfigurations\
  \ across Terraform, K8s, and CloudFormation.\n\n**Commands:**\n- `checkov -d .`\n- `checkov -f main.tf\
  \ --framework terraform`\n- `checkov -d . --skip-check CKV_AWS_20`\n- `checkov -d . --output json >\
  \ checkov-report.json`\n- `checkov -d . --quiet --baseline .checkov.baseline`\n\n**Examples:**\n- checkov\
  \ -d terraform/env/prod --framework terraform --quiet\n- checkov -d k8s/ --framework kubernetes\n- checkov\
  \ -d . --check CKV_AWS_88,CKV_AWS_89\n\n### cluster\nScan clusters and containers with Trivy and kube-bench.\n\
  \n**Commands:**\n- `trivy fs --severity HIGH,CRITICAL .`\n- `trivy image --severity HIGH,CRITICAL --exit-code\
  \ 1 nginx:1.25`\n- `kube-bench run --targets master --score-threshold 50`\n- `kube-bench run --targets\
  \ node --exit-code 1`\n- `trivy config --severity HIGH,CRITICAL .`\n\n**Examples:**\n- trivy fs --ignore-unfixed\
  \ --exit-code 1 .\n- kube-bench run --targets etcd --check 1.2\n- trivy image --severity CRITICAL --ignore-unfixed\
  \ myapp:latest"
