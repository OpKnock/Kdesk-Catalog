  \n# INI Files\n\nRead and modify INI configuration files safely.\n\n## What this skill does\n50:   \n\
  - Parses sections and options with Python configparser.\n- Extracts values with shell one-liners for51:\
  \    quick checks.\n- Writes back changes preserving structure.\n- Detects duplicate keys and malformed52:\
  \    lines.\n\n## When to use\n\n- Configuring legacy tools and services that use INI files.\n- Auditing53:\
  \    which settings an app will load.\n- Batch-editing configs across many hosts.\n\n## Real commands\n\
  54:   \n```bash\n# Read one value\npython3 -c \"import configparser; c=configparser.ConfigParser();\
  \ c.read('app.ini');55:    print(c['database']['host'])\"\n\n# Validate the file parses\npython3 -m\
  \ configparser app.ini\n\n56:   # List sections\npython3 -c \"import configparser; c=configparser.ConfigParser();\
  \ c.read('app.ini');57:    print(c.sections())\"\n\n# Shell one-liner for a section block\ngrep -A5\
  \ '^\\[database\\]' app.ini\n58:   \n# Update a value in place\npython3 - <<'EOF'\nimport configparser\n\
  c = configparser.ConfigParser()\n59:   c.read('app.ini')\nc['database']['port'] = '5433'\nwith open('app.ini',\
  \ 'w') as f:\n    c.write(f)\n60:   EOF\n```\n\n## Example file\n\n```ini\n[server]\nhost = 0.0.0.0\n\
  port = 8080\n\n[database]\nhost = db.internal\n61:   port = 5432\nuser = app\n```\n\n## Testing\n\n\
  ```bash\npython3 -m configparser app.ini && echo \"valid\"62:   \n```\n\n## Best practices\n\n- Back\
  \ up the file before in-place writes (`cp app.ini app.ini.bak`).\n63:   - Use interpolation-aware escaping\
  \ when values contain % characters.\n- Prefer configparser over regex64:    edits to preserve comments\
  \ and order.\n- Validate with `python3 -m configparser` in CI before deploy.\n65:   \n## Example exchange\n\
  \n```\nUser: What port is the app configured to use?\nAgent: python3 -c \"import66:    configparser;\
  \ c=configparser.ConfigParser(); c.read('app.ini'); print(c['server']['port'])\"\n```\n\n## Capabilities\n\
  \n### ini-parsing\nRead, validate, and modify INI files with Python and shell tools.\n\n**Parameters:**\n\
  - `file` (string): Path to the INI file.\n- `section` (string): Section name, e.g. database.\n- `key`\
  \ (string): Option key within the section.\n\n**Commands:**\n- `python3 -c \"import configparser; c=configparser.ConfigParser();\
  \ c.read('app.ini'); print(c['database']['host'])\"`\n- `python3 -m configparser app.ini`\n- `awk -F=\
  \ '/^\\[database\\]/{s=1;next} /^\\[/{s=0} s && /host/{print $2}' app.ini`\n- `grep -A5 '^\\[database\\\
  ]' app.ini`\n- `python3 -c \"import configparser; c=configparser.ConfigParser(); c.read('app.ini');\
  \ c['database']['port']='5433'; with open('app.ini','w') as f: c.write(f)\"`\n\n**Examples:**\n- awk\
  \ -F= '/^host=/{print $2}' config.ini\n- python3 -c \"import configparser; c=configparser.ConfigParser();\
  \ c.read('app.ini'); print(c.sections())\"\n- grep -c '^\\[' app.ini\n\n## References\n- [Python configparser\
  \ docs](https://docs.python.org/3/library/configparser.html)\n- [INI format overview](https://en.wikipedia.org/wiki/INI_file)"
