  \ checksums)\n- Fingerprint: `iptables:758683e3`\n\n# iptables\n\nManage Linux packet filtering with\
  \ iptables.\n\n## What this skill does\n48:   \n- Lists rules with counters for traffic visibility.\n\
  - Adds and removes ACCEPT/DROP rules by port49:    and source.\n- Redirects ports with NAT PREROUTING.\n\
  - Persists rulesets across reboots.\n\n## When50:    to use\n\n- Locking down a host's exposed ports.\n\
  - Redirecting local ports during maintenance.\n51:   - Debugging dropped/blocked traffic.\n\n## Real\
  \ commands\n\n```bash\n# List with counters\niptables52:    -L -n -v\n\n# Allow SSH from the management\
  \ subnet\niptables -A INPUT -p tcp --dport 22 -s 10.0.0.0/853:    -j ACCEPT\n\n# Drop traffic to 8080\n\
  iptables -A INPUT -p tcp --dport 8080 -j DROP\n\n# Allow established54:    traffic\niptables -A INPUT\
  \ -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT\n\n# Redirect local55:    80 -> 8080\niptables\
  \ -t nat -A PREROUTING -p tcp --dport 80 -j REDIRECT --to-port 8080\n\n# Remove56:    a rule\niptables\
  \ -D INPUT -p tcp --dport 8080 -j DROP\n\n# Persist (Debian/Ubuntu)\niptables-save57:    > /etc/iptables/rules.v4\n\
  iptables-restore < /etc/iptables/rules.v4\n```\n\n## Policy default\n\n58:   ```bash\niptables -P INPUT\
  \ DROP   # then explicitly allow what is needed\niptables -P FORWARD DROP\n59:   ```\n\n## Testing\n\
  \n```bash\niptables -L INPUT -n --line-numbers\nnc -zv localhost 8080   # should60:    fail when dropped\n\
  ```\n\n## Best practices\n\n- Always allow ESTABLISHED,RELATED before specific61:    drops.\n- Number\
  \ rules with --line-numbers for surgical deletes.\n- Test policy changes in a sandbox;62:    a bad rule\
  \ can lock you out.\n- Keep a cron/scheduled restore of the saved ruleset as a safety net.\n63:   \n\
  ## Example exchange\n\n```\nUser: Block all traffic to port 8080 except from 10.0.0.0/8.\nAgent: iptables64:\
  \    -A INPUT -p tcp --dport 8080 -s 10.0.0.0/8 -j ACCEPT\n       iptables -A INPUT -p tcp --dport 808065:\
  \    -j DROP\n```\n\n## Capabilities\n\n### iptables-rules\nInspect and modify iptables rulesets including\
  \ NAT and persistence.\n\n**Parameters:**\n- `chain` (string): Chain: INPUT, OUTPUT, FORWARD, or nat\
  \ chains.\n- `proto` (string): Protocol: tcp, udp, icmp.\n- `dport` (integer): Destination port.\n\n\
  **Commands:**\n- `iptables -L -n -v`\n- `iptables -A INPUT -p tcp --dport 22 -s 10.0.0.0/8 -j ACCEPT`\n\
