title: Java
description: Develops Java backend services with Maven/Gradle, Spring Boot, and the JVM toolchain including
  build, test, and packaging.
version: 2.0.0
instructions: "# Java\n\nDevelops Java backend services with Maven/Gradle, Spring Boot, and the JVM toolchain\
  \ including build, test, and packaging.\n\n## Instructions\n\n# Java\n\nBackend services on the JVM\
  \ with Maven or Gradle.\n\n## When to Use\n\n- Enterprise services with Spring Boot or Micronaut\n-\
  \ Long-lived services needing strong typing and tooling\n- High-throughput apps where JVM GC tuning\
  \ matters\n- Teams already standardized on JVM tooling\n\n## Maven Commands\n\n```bash\nmvn clean package\n\
  mvn test\nmvn spring-boot:run\nmvn dependency:tree\nmvn install -DskipTests\nmvn test -Dtest=OrderServiceTest\n\
  ```\n\n## Gradle Commands\n\n```bash\ngradle build\ngradle test --tests \"com.example.OrderTest\"\n\
  gradle bootRun\ngradle dependencies\ngradle bootJar\n```\n\n## Spring Boot Example\n\n```java\n@RestController\n\
  public class HealthController {\n\n    @GetMapping(\"/health\")\n    public Map<String, String> health()\
  \ {\n        return Map.of(\"status\", \"ok\");\n    }\n}\n```\n\n## Best Practices\n\n- Pin JDK and\
  \ build tool versions for reproducible builds\n- Keep builds fast with -T (Gradle) or parallel modules\n\
  - Use dependency:tree / gradle dependencies to audit transitive deps\n- Prefer records and sealed types\
  \ for immutable DTOs\n- Containerize with a multi-stage build; JRE base image is enough\n- Enable failfast\
  \ testing in CI with specific test filters\n\n## Capabilities\n\n### maven-build\nBuild and test Maven\
  \ projects.\n\n**Commands:**\n- `mvn clean package`\n- `mvn test`\n- `mvn spring-boot:run`\n- `mvn dependency:tree`\n\
  - `mvn install -DskipTests`\n\n**Examples:**\n- mvn clean package -DskipTests\n- mvn test -Dtest=OrderServiceTest\n\
  - mvn versions:display-dependency-updates\n\n### gradle-build\nBuild and test Gradle projects.\n\n**Commands:**\n\
  - `gradle build`\n- `gradle test`\n- `gradle bootRun`\n- `gradle dependencies`\n- `gradle clean build`\n\
  \n**Examples:**\n- gradle test --tests \"com.example.OrderTest\"\n- gradle build -x test\n- gradle bootJar"
prompt: Act as Java and handle the task per the instructions.
