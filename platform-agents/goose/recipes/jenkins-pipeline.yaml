title: Jenkins Pipeline
description: 'Jenkins pipeline operations: triggering builds via jenkins-cli and curl, running Groovy
  scripts, listing jobs, and checking build status.'
version: 2.0.0
instructions: "# Jenkins Pipeline\n\nJenkins pipeline operations: triggering builds via jenkins-cli and\
  \ curl, running Groovy scripts, listing jobs, and checking build status.\n\n## Instructions\n\n# Jenkins\
  \ Pipeline\n\nDrive Jenkins from the terminal.\n\n## What this skill does\n47:   \n- Lists jobs and\
  \ triggers builds with parameters.\n- Watches build results and console output.\n- Runs48:    ad-hoc\
  \ Groovy against the Jenkins instance.\n- Fetches build artifacts from the API.\n\n## When to49:   \
  \ use\n\n- Triggering CI from a script or another pipeline.\n- Checking why a build failed without opening50:\
  \    the UI.\n- Auditing installed plugins or job configs.\n\n## Real commands\n\n```bash\n# List jobs\n\
  51:   java -jar jenkins-cli.jar -s http://localhost:8080 list-jobs\n\n# Trigger a build and wait for\
  \ result\n52:   java -jar jenkins-cli.jar -s http://localhost:8080 build MyJob -s -v\n\n# Trigger with\
  \ curl (token auth)\n53:   curl -X POST -u admin:token http://localhost:8080/job/MyJob/build\n\n# Parameterized\
  \ build\ncurl -u54:    admin:token -X POST 'http://localhost:8080/job/MyJob/buildWithParameters?TARGET=staging'\n\
  \n# Build55:    result\ncurl -u admin:token http://localhost:8080/job/MyJob/lastBuild/api/json | jq\
  \ '.result, .duration'\n56:   \n# Groovy script (count plugins)\njava -jar jenkins-cli.jar -s http://localhost:8080\
  \ groovy = 'println57:    Jenkins.instance.pluginManager.plugins.size()'\n\n# Console output\njava -jar\
  \ jenkins-cli.jar -s http://localhost:808058:    console MyJob 42\n```\n\n## Polling loop\n\n```bash\n\
  while :; do\n  R=$(curl -s -u admin:token http://localhost:8080/job/MyJob/lastBuild/api/json59:    |\
  \ jq -r .result)\n  [ \"$R\" != \"null\" ] && break\n  sleep 5\ndone\necho \"build finished: $R\"\n\
  60:   ```\n\n## Testing\n\n```bash\ncurl -s -u admin:token http://localhost:8080/api/json | jq '.jobs[].name'\n\
  61:   ```\n\n## Best practices\n\n- Prefer jenkins-cli for interactive work, curl for CI scripting.\n\
  - Use62:    API tokens, never raw passwords, in scripts.\n- Poll api/json on the queued item, not the\
  \ build, to63:    avoid missing builds.\n- Pin jenkins-cli.jar version to the server version.\n\n##\
  \ Example exchange\n64:   \n```\nUser: Trigger a staging deploy build and wait for it.\nAgent: curl\
  \ -u admin:token -X POST 'http://localhost:8080/job/deploy/buildWithParameters?TARGET=staging'\n65:\
  \          then poll lastBuild/api/json until .result != null\n```\n\n## Capabilities\n\n### jenkins-cli\n\
  Trigger, monitor, and script Jenkins jobs from the terminal.\n\n**Commands:**\n- `java -jar jenkins-cli.jar\
  \ -s http://localhost:8080 list-jobs`\n- `java -jar jenkins-cli.jar -s http://localhost:8080 build MyJob\
  \ -s -v`\n- `curl -X POST -u admin:token http://localhost:8080/job/MyJob/build`\n- `curl -u admin:token\
  \ http://localhost:8080/job/MyJob/lastBuild/api/json | jq '.result, .duration'`\n- `java -jar jenkins-cli.jar\
  \ -s http://localhost:8080 groovy = 'println Jenkins.instance.pluginManager.plugins.size()'`\n\n**Examples:**\n\
  - curl -u admin:token -X POST 'http://localhost:8080/job/MyJob/buildWithParameters?TARGET=staging'\n\
  - curl -s 'http://localhost:8080/job/MyJob/lastSuccessfulBuild/artifact/report.json' | jq .\n- java\
  \ -jar jenkins-cli.jar -s http://localhost:8080 console MyJob 42"
prompt: Act as Jenkins Pipeline and handle the task per the instructions.
