title: jest-config
description: 'Configures Jest for JS/TS projects: presets, coverage thresholds, module mappers, reporters,
  and watch plugins.'
version: 2.0.0
instructions: "# jest-config\n\nConfigures Jest for JS/TS projects: presets, coverage thresholds, module\
  \ mappers, reporters, and watch plugins.\n\n## Instructions\n\n# Jest Configuration\n\nTune Jest for\
  \ your project's testing needs.\n\n## What This Skill Does\n\n- Initializes and validates Jest configs\n\
  - Sets environments, transforms, and module mappers\n- Configures coverage thresholds and reporters\n\
  - Optimizes watch mode and caching\n\n## When to Use\n\n- Setting up Jest for a new project\n- Migrating\
  \ tests between environments\n- Enforcing coverage policies\n\n## Real Commands\n\n```bash\n# Init and\
  \ inspect\nnpx jest --init\nnpx jest --showConfig\nnpx jest --listTests\n\n# Runtime config flags\n\
  npx jest --env=jsdom\nnpx jest --testMatch='**/*.test.ts'\nnpx jest --moduleNameMapper='{\"^@/(.*)$\"\
  :\"<rootDir>/src/$1\"}'\n\n# Coverage\nnpx jest --coverage --coverageThreshold='{\"global\":{\"lines\"\
  :80}}'\nnpx jest --coverageReporters=lcov,text-summary\n\n# Reporters\nnpx jest --reporters=default\
  \ --reporters=jest-junit\n```\n\n## jest.config.js\n\n```js\nmodule.exports = {\n  testEnvironment:\
  \ 'jsdom',\n  moduleNameMapper: {\n    '^@/(.*)$': '<rootDir>/src/$1'\n  },\n  setupFilesAfterEnv: ['<rootDir>/jest.setup.ts'],\n\
  \  coverageThreshold: {\n    global: { lines: 80, statements: 80, branches: 70, functions: 80 }\n  }\n\
  };\n```\n\n## Best Practices\n\n- Keep config in code (jest.config.js) for reviewability\n- Use setupFilesAfterEnv\
  \ for global mocks\n- Set thresholds that fail the build on regression\n- Cache mappers/transforms to\
  \ keep suites fast\n- Document non-obvious moduleNameMapper aliases\n\n## Capabilities\n\n### jest-initialization\n\
  Initialize and inspect Jest configuration.\n\n**Commands:**\n- `npx jest --init`\n- `npx jest --showConfig`\n\
  - `npx jest --listTests`\n- `npx jest --clearCache`\n- `npx jest --debug`\n\n**Examples:**\n- npx jest\
  \ --init\n- npx jest --showConfig\n- npx jest --listTests\n\n### config-options\nConfigure environments,\
  \ mappers, and transforms.\n\n**Commands:**\n- `npx jest --env=jsdom`\n- `npx jest --testMatch='**/*.test.ts'`\n\
  - `npx jest --testPathIgnorePatterns=/node_modules/`\n- `npx jest --moduleNameMapper='{\"^@/(.*)$\"\
  :\"demo-rootdir/src/$1\"}'`\n- `npx jest --coverage`\n\n**Examples:**\n- npx jest --env=jsdom\n- npx\
  \ jest --testMatch='**/*.test.ts'\n- npx jest --moduleNameMapper='{\"^@/(.*)$\":\"demo-rootdir/src/$1\"\
  }'\n\n### coverage-and-reporters\nCoverage thresholds and custom reporters.\n\n**Commands:**\n- `npx\
  \ jest --coverage --coverageThreshold='{\"global\":{\"lines\":80}}'`\n- `npx jest --coverageReporters=lcov,text-summary`\n\
  - `npx jest --reporters=default --reporters=jest-junit`\n- `npx jest --coverageDirectory=coverage`\n\
  \n**Examples:**\n- npx jest --coverage --coverageThreshold='{\"global\":{\"lines\":80}}'\n- npx jest\
  \ --coverageReporters=lcov,text-summary\n- npx jest --reporters=default --reporters=jest-junit"
prompt: Act as jest-config and handle the task per the instructions.
