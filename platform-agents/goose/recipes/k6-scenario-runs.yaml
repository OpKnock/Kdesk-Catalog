title: K6 Scenario Runs
description: 'Advanced load testing with Grafana k6: scenario-based scripts, threshold gates, ramping
  VUs, and structured result export for CI analysis.'
version: 2.0.0
instructions: "# K6 Scenario Runs\n\nAdvanced load testing with Grafana k6: scenario-based scripts, threshold\
  \ gates, ramping VUs, and structured result export for CI analysis.\n\n## Instructions\n\n# k6 (Advanced)\n\
  \nRun scenario-driven load tests with Grafana k6 and gate releases on thresholds.\n\n## What this skill\
  \ does\n\n- Runs k6 scripts with executors (ramping-vus, constant-arrival-rate, shared-iterations).\n\
  - Enforces threshold gates that fail the test run on SLO breaches.\n- Exports JSON summaries for dashboards\
  \ and archives for replay.\n\n## When to use\n\n- Pre-release capacity validation.\n- SLO regression\
  \ checks in CI (k6 run gates the pipeline).\n- Spike/soak testing with scenario scheduling.\n\n## Real\
  \ commands\n\n```bash\n# Quick run\nk6 run script.js\n\n# Ramped run\nk6 run --vus 50 --duration 1m\
  \ script.js\n\n# Environment override\nk6 run -e BASE_URL=https://staging.example.com script.js\n\n\
  # Trend stats\nk6 run --summary-trend-stats=\"avg,p(95),p(99)\" script.js\n\n# Inspect resolved options\n\
  k6 inspect script.js | jq .options\n\n# Export summary + full JSON\nk6 run --summary-export=summary.json\
  \ script.js\nk6 run --out json=results.json script.js\n```\n\n## Script example (ramping scenario)\n\
  \n```js\nimport http from 'k6/http';\nimport { check, sleep } from 'k6';\n\nexport const options = {\n\
  \  scenarios: {\n    ramping: {\n      executor: 'ramping-vus',\n      stages: [\n        { duration:\
  \ '30s', target: 20 },\n        { duration: '1m', target: 100 },\n        { duration: '30s', target:\
  \ 0 },\n      ],\n    },\n  },\n  thresholds: {\n    http_req_duration: ['p(95)<300', 'p(99)<800'],\n\
  \    http_req_failed: ['rate<0.01'],\n  },\n};\n\nexport default function () {\n  const res = http.get(__ENV.BASE_URL\
  \ + '/api/orders');\n  check(res, { 'status 200': (r) => r.status === 200 });\n  sleep(1);\n}\n```\n\
  \n## Testing\n\n```bash\nk6 run --vus 10 --iterations 20 script.js   # smoke check before the real run\n\
  ```\n\n## Best practices\n\n- Set thresholds in the script so CI fails fast on regressions.\n- Use --summary-export\
  \ and commit the JSON for trend tracking.\n- Always run a tiny smoke run before the full load to catch\
  \ script errors.\n\n## Capabilities\n\n### scenario-runs\nRun k6 scripts with scenarios, ramping profiles,\
  \ and environment overrides.\n\n**Commands:**\n- `k6 run script.js`\n- `k6 run --vus 50 --duration 1m\
  \ script.js`\n- `k6 run --scenario ramping -e BASE_URL=https://staging.your-app.test script.js`\n- `k6\
  \ run --summary-trend-stats=\"avg,p(95),p(99),p(99.9)\" script.js`\n- `k6 inspect script.js`\n\n**Examples:**\n\
  - k6 run --vus 50 --duration 1m script.js\n- k6 run -e BASE_URL=https://staging.your-app.test --summary-trend-stats=p(95)\
  \ script.js\n- k6 inspect script.js | jq .options.scenarios\n\n### export-archive\nExport JSON summaries\
  \ and archives for CI dashboards and later replay.\n\n**Commands:**\n- `k6 run --summary-export=summary.json\
  \ script.js`\n- `k6 archive script.js`\n- `k6 run --iterations 100 --max-exported-metrics-to-keep=500\
  \ script.js`\n- `k6 run --out json=results.json script.js`\n\n**Examples:**\n- k6 run --summary-export=summary.json\
  \ script.js\n- k6 archive script.js && k6 run archive.tar\n- k6 run --out json=results.json script.js"
prompt: Act as K6 Scenario Runs and handle the task per the instructions.
