title: Kafka Lag Monitoring
description: 'Monitor Kafka consumer lag: describe groups per topic/partition, inspect member assignment,
  reset offsets safely, and compute end-to-end lag from the CLI.'
version: 2.0.0
instructions: "# Kafka Lag Monitoring\n\nMonitor Kafka consumer lag: describe groups per topic/partition,\
  \ inspect member assignment, reset offsets safely, and compute end-to-end lag from the CLI.\n\n## Instructions\n\
  \n# Kafka Lag Monitoring\n\nTrack and manage consumer lag with the official Kafka CLI.\n\n## What this\
  \ skill does\n\n- Reports per-partition LAG for consumer groups.\n- Shows member-to-partition assignment.\n\
  - Resets offsets for replay, repairs, and backfills.\n\n## When to use\n\n- Investigating slow consumers\
  \ and growing lag.\n- Rolling back consumers after a bad deployment.\n- Calculating end-to-end processing\
  \ delay.\n\n## Real commands\n\n```bash\n# Per-partition lag for one group\nkafka-consumer-groups.sh\
  \ --bootstrap-server localhost:9092 \\\n  --describe --group payments\n\n# Which member owns which partitions\n\
  kafka-consumer-groups.sh --bootstrap-server localhost:9092 \\\n  --describe --group payments --members\
  \ --verbose\n\n# Group state (Stable/PreparingRebalance/Dead)\nkafka-consumer-groups.sh --bootstrap-server\
  \ localhost:9092 \\\n  --describe --group payments --state\n\n# Raw latest offsets\nkafka-run-class.sh\
  \ kafka.tools.GetOffsetShell \\\n  --broker-list localhost:9092 --topic orders --time -1\n\n# Reset\
  \ to earliest (requires no active members)\nkafka-consumer-groups.sh --bootstrap-server localhost:9092\
  \ \\\n  --reset-offsets --group payments --topic orders --to-earliest --execute\n\n# Replay from a specific\
  \ datetime\nkafka-consumer-groups.sh --bootstrap-server localhost:9092 \\\n  --reset-offsets --group\
  \ payments --topic orders \\\n  --to-datetime 2026-08-01T00:00:00.000 --execute\n\n# Shift offsets back\
  \ 100 records\nkafka-consumer-groups.sh --bootstrap-server localhost:9092 \\\n  --reset-offsets --group\
  \ payments --topic orders --shift-by -100 --execute\n```\n\n## Config example (alerting)\n\n```bash\n\
  # Poll lag every minute and alert when LAG > 10000\nwatch -n 60 'kafka-consumer-groups.sh --bootstrap-server\
  \ localhost:9092 --describe --group payments'\n```\n\n## Testing\n\n```bash\n# Dry-run a reset before\
  \ executing\nkafka-consumer-groups.sh --bootstrap-server localhost:9092 \\\n  --reset-offsets --group\
  \ payments --topic orders --to-earliest --dry-run\n```\n\n## Best practices\n\n- Reset only with the\
  \ group stopped (members cause -execute to fail).\n- Alert on lag growth rate, not just absolute lag.\n\
  - Pair lag with max.poll.interval.ms: repeated rebalances inflate lag.\n\n## Capabilities\n\n### lag-inspection\n\
  Inspect consumer group lag per partition and per member.\n\n**Commands:**\n- `kafka-consumer-groups.sh\
  \ --bootstrap-server localhost:9092 --describe --group payments`\n- `kafka-consumer-groups.sh --bootstrap-server\
  \ localhost:9092 --describe --group payments --members --verbose`\n- `kafka-consumer-groups.sh --bootstrap-server\
  \ localhost:9092 --describe --group payments --state`\n- `kafka-consumer-groups.sh --bootstrap-server\
  \ localhost:9092 --describe --all-groups`\n\n**Examples:**\n- kafka-consumer-groups.sh --bootstrap-server\
  \ localhost:9092 --describe --group payments\n- kafka-consumer-groups.sh --bootstrap-server localhost:9092\
  \ --describe --group payments --members --verbose\n- kafka-consumer-groups.sh --bootstrap-server localhost:9092\
  \ --describe --all-groups | grep -A2 payments\n\n### offset-ops\nGet raw offsets and reset group offsets\
  \ for replay or repairs.\n\n**Commands:**\n- `kafka-run-class.sh kafka.tools.GetOffsetShell --broker-list\
  \ localhost:9092 --topic orders --time -1`\n- `kafka-consumer-groups.sh --bootstrap-server localhost:9092\
  \ --reset-offsets --group payments --topic orders --to-earliest --execute`\n- `kafka-consumer-groups.sh\
  \ --bootstrap-server localhost:9092 --reset-offsets --group payments --topic orders --to-datetime 2026-08-01T00:00:00.000\
  \ --execute`\n- `kafka-consumer-groups.sh --bootstrap-server localhost:9092 --reset-offsets --group\
  \ payments --topic orders --shift-by -100 --execute`\n\n**Examples:**\n- kafka-run-class.sh kafka.tools.GetOffsetShell\
  \ --broker-list localhost:9092 --topic orders --time -1\n- kafka-consumer-groups.sh --bootstrap-server\
  \ localhost:9092 --reset-offsets --group payments --topic orders --to-earliest --execute\n- kafka-consumer-groups.sh\
  \ --bootstrap-server localhost:9092 --reset-offsets --group payments --topic orders --shift-by -100\
  \ --execute"
prompt: Act as Kafka Lag Monitoring and handle the task per the instructions.
