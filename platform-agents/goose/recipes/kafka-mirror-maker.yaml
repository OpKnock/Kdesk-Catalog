title: Kafka Mirror Maker
description: 'Replicate Kafka clusters with MirrorMaker 2: cluster-to-cluster topology configs, connector
  management, and cross-cluster topic verification.'
version: 2.0.0
instructions: "# Kafka Mirror Maker\n\nReplicate Kafka clusters with MirrorMaker 2: cluster-to-cluster\
  \ topology configs, connector management, and cross-cluster topic verification.\n\n## Instructions\n\
  \n# Kafka MirrorMaker 2\n\nReplicate topics between Kafka clusters for DR, aggregation, and migration.\n\
  \n## What this skill does\n\n- Runs MirrorMaker 2 in standalone mode from a topology config.\n- Creates/replicates\
  \ topics with the correct remote.prefix naming.\n- Verifies replicated data and connector task state.\n\
  \n## When to use\n\n- Disaster recovery: replicate primary to secondary cluster.\n- Aggregating multiple\
  \ clusters into one analytics cluster.\n- Cluster migrations with low downtime.\n\n## Real commands\n\
  \n```bash\n# Run MM2 standalone\nkafka-mirror-maker2.sh --config config/mm2.properties\n\n# Run with\
  \ offset topic management\nkafka-mirror-maker2.sh --config config/mm2.properties --manage-offsets\n\n\
  # Legacy MirrorMaker 1 (single topic set)\nkafka-mirror-maker.sh --consumer.config consumer.properties\
  \ \\\n  --producer.config producer.properties --whitelist 'orders|payments'\n\n# Verify connectors\n\
  curl -s http://localhost:8083/connectors | jq .\ncurl -s http://localhost:8083/connectors/mm2-primary-secondary/status\
  \ | jq '.tasks[0].state'\n\n# Verify replicated topics and data on secondary\nkafka-topics.sh --bootstrap-server\
  \ secondary:9092 --list | grep orders\nkafka-console-consumer.sh --bootstrap-server secondary:9092 \\\
  \n  --topic secondary.orders --from-beginning --max-messages 5\n```\n\n## mm2.properties example\n\n\
  ```properties\nclusters = primary, secondary\nprimary.bootstrap.servers = primary:9092\nsecondary.bootstrap.servers\
  \ = secondary:9092\n\nprimary->secondary.enabled = true\nsecondary->primary.enabled = false\n\nreplication.factor\
  \ = 3\ncheckpoints.topic.replication.factor = 1\nheartbeats.topic.replication.factor = 1\noffset-syncs.topic.replication.factor\
  \ = 1\n\nsync.topic.acls.enabled = false\nrefresh.topics.interval.seconds = 60\n```\n\n## Testing\n\n\
  ```bash\n# Produce on primary, consume on secondary\necho '{\"dr\":\"test\"}' | kafka-console-producer.sh\
  \ --bootstrap-server primary:9092 --topic orders\nkafka-console-consumer.sh --bootstrap-server secondary:9092\
  \ --topic secondary.orders --from-beginning --max-messages 1\n```\n\n## Best practices\n\n- Run MM2\
  \ in distributed mode (via connect) for HA.\n- Keep replication.factor at cluster defaults; configure\
  \ offset sync intervals.\n- Monitor checkpoint lag; growing checkpoint lag means replication is falling\
  \ behind.\n\n## Capabilities\n\n### mm2-run\nRun MirrorMaker 2 in standalone mode with a topology properties\
  \ file.\n\n**Commands:**\n- `kafka-mirror-maker2.sh --config config/mm2.properties`\n- `kafka-mirror-maker2.sh\
  \ --config config/mm2.properties --manage-offsets`\n- `kafka-mirror-maker.sh --consumer.config consumer.properties\
  \ --producer.config producer.properties --whitelist 'orders|payments'`\n- `kafka-mirror-maker.sh --consumer.config\
  \ consumer.properties --producer.config producer.properties --whitelist '.*' --num.streams 4`\n\n**Examples:**\n\
  - kafka-mirror-maker2.sh --config config/mm2.properties\n- kafka-mirror-maker.sh --consumer.config consumer.properties\
  \ --producer.config producer.properties --whitelist 'orders|payments'\n- kafka-mirror-maker2.sh --config\
  \ config/mm2.properties --manage-offsets\n\n### verify-replication\nCheck MM2 connectors, replicated\
  \ topics, and consumed data on the target cluster.\n\n**Commands:**\n- `curl -s http://localhost:8083/connectors\
  \ | jq .`\n- `curl -s http://localhost:8083/connectors/mm2-primary-secondary/status | jq '.tasks[0].state'`\n\
  - `kafka-topics.sh --bootstrap-server secondary:9092 --list | grep orders`\n- `kafka-console-consumer.sh\
  \ --bootstrap-server secondary:9092 --topic secondary.orders --from-beginning --max-messages 5`\n\n\
  **Examples:**\n- curl -s http://localhost:8083/connectors/mm2-primary-secondary/status | jq '.tasks[0].state'\n\
  - kafka-topics.sh --bootstrap-server secondary:9092 --list | grep -E 'orders|payments'\n- kafka-console-consumer.sh\
  \ --bootstrap-server secondary:9092 --topic secondary.orders --from-beginning --max-messages 5"
prompt: Act as Kafka Mirror Maker and handle the task per the instructions.
