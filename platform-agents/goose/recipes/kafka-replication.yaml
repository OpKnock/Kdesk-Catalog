title: Kafka Replication
description: Manage Kafka replica health, trigger leader elections, reassign partitions across brokers,
  and configure throttle rates.
version: 2.0.0
instructions: "# Kafka Replication\n\nManage Kafka replica health, trigger leader elections, reassign\
  \ partitions across brokers, and configure throttle rates.\n\n## Instructions\n\n# Kafka Replication\n\
  \nOperate replication: keep ISRs healthy, fail over leaders, and heal replicas.\n\n## What this skill\
  \ does\n\n- Detects under-replicated partitions and unclean leader states.\n- Runs preferred leader\
  \ elections.\n- Reassigns replicas away from dead brokers with throttling.\n\n## When to use\n\n- Broker\
  \ outages and recovery.\n- Verifying RF=3 actually tolerates failures.\n- Rebalancing replicas after\
  \ adding brokers.\n\n## Real commands\n\n```bash\n# Find under-replicated partitions\nkafka-topics.sh\
  \ --bootstrap-server localhost:9092 \\\n  --describe --under-replicated-partitions\n\n# Find partitions\
  \ with unclean leader elections\nkafka-topics.sh --bootstrap-server localhost:9092 \\\n  --describe\
  \ --unclean-offset-leader-available\n\n# Inspect ISR for a topic\nkafka-topics.sh --bootstrap-server\
  \ localhost:9092 --describe --topic orders\n\n# Preferred leader election (all topics)\nkafka-leader-election.sh\
  \ --bootstrap-server localhost:9092 \\\n  --election-type preferred --all-topic-partitions\n\n# Single\
  \ partition election\nkafka-leader-election.sh --bootstrap-server localhost:9092 \\\n  --election-type\
  \ preferred --topic orders --partition 0\n\n# Reassign replicas off a dead broker (1) onto 2,3,4\nkafka-reassign-partitions.sh\
  \ --bootstrap-server localhost:9092 \\\n  --generate --topics-to-move-json-file topics.json --broker-list\
  \ \"2,3,4\"\n\n# Throttle replication during reassignment\nkafka-configs.sh --bootstrap-server localhost:9092\
  \ \\\n  --entity-type brokers --entity-name 1 --alter \\\n  --add-config \"leader.replication.throttled.rate=10000000,follower.replication.throttled.rate=10000000\"\
  \n```\n\n## topics.json example\n\n```json\n{\"topics\":[{\"topic\":\"orders\"}],\"version\":1}\n```\n\
  \n## Testing\n\n```bash\nkafka-reassign-partitions.sh --bootstrap-server localhost:9092 \\\n  --reassignment-json-file\
  \ reassignment.json --verify\n```\n\n## Best practices\n\n- Watch ISR shrink as the first sign of broker\
  \ trouble.\n- Set unclean.leader.election.enable=false on critical topics.\n- Remove throttle configs\
  \ after reassignment completes.\n\n## Capabilities\n\n### replica-health\nInspect replication health:\
  \ ISR state, under-replicated partitions, and unclean leaders.\n\n**Commands:**\n- `kafka-topics.sh\
  \ --bootstrap-server localhost:9092 --describe --topic orders`\n- `kafka-topics.sh --bootstrap-server\
  \ localhost:9092 --describe --under-replicated-partitions`\n- `kafka-topics.sh --bootstrap-server localhost:9092\
  \ --describe --unclean-offset-leader-available`\n- `kafka-topics.sh --bootstrap-server localhost:9092\
  \ --describe --topics-with-overrides`\n\n**Examples:**\n- kafka-topics.sh --bootstrap-server localhost:9092\
  \ --describe --under-replicated-partitions\n- kafka-topics.sh --bootstrap-server localhost:9092 --describe\
  \ --topic orders | head -10\n- kafka-topics.sh --bootstrap-server localhost:9092 --describe --unclean-offset-leader-available\n\
  \n### leader-and-reassign\nTrigger leader elections and reassign replicas around failed brokers.\n\n\
  **Commands:**\n- `kafka-leader-election.sh --bootstrap-server localhost:9092 --election-type preferred\
  \ --all-topic-partitions`\n- `kafka-leader-election.sh --bootstrap-server localhost:9092 --election-type\
  \ preferred --topic orders --partition 0`\n- `kafka-reassign-partitions.sh --bootstrap-server localhost:9092\
  \ --generate --topics-to-move-json-file topics.json --broker-list \"1,2,3\"`\n- `kafka-reassign-partitions.sh\
  \ --bootstrap-server localhost:9092 --reassignment-json-file reassignment.json --execute`\n- `kafka-configs.sh\
  \ --bootstrap-server localhost:9092 --entity-type brokers --entity-name 1 --alter --add-config \"leader.replication.throttled.rate=10000000,follower.replication.throttled.rate=10000000\"\
  `\n\n**Examples:**\n- kafka-leader-election.sh --bootstrap-server localhost:9092 --election-type preferred\
  \ --all-topic-partitions\n- kafka-reassign-partitions.sh --bootstrap-server localhost:9092 --generate\
  \ --topics-to-move-json-file topics.json --broker-list \"1,2,3\"\n- kafka-configs.sh --bootstrap-server\
  \ localhost:9092 --entity-type brokers --entity-name 1 --alter --add-config \"leader.replication.throttled.rate=10000000\""
prompt: Act as Kafka Replication and handle the task per the instructions.
