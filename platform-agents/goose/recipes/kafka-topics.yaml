title: Kafka Topics
description: 'Full Kafka topic lifecycle: create with configs, list, describe layout, alter configurations,
  and delete topics safely with the Kafka CLI.'
version: 2.0.0
instructions: "# Kafka Topics\n\nFull Kafka topic lifecycle: create with configs, list, describe layout,\
  \ alter configurations, and delete topics safely with the Kafka CLI.\n\n## Instructions\n\n# Kafka Topics\n\
  \nManage topics through their full lifecycle with the Kafka CLI.\n\n## What this skill does\n\n- Creates\
  \ topics with partitions, replication, and configs.\n- Describes layout (leader, replicas, ISR) and\
  \ effective configs.\n- Alters and deletes topics safely.\n\n## When to use\n\n- Provisioning topics\
  \ for new services.\n- Auditing partition distribution and config drift.\n- Cleaning up legacy topics.\n\
  \n## Real commands\n\n```bash\n# Create with configs\nkafka-topics.sh --bootstrap-server localhost:9092\
  \ --create \\\n  --topic orders --partitions 6 --replication-factor 3 \\\n  --config retention.ms=604800000\
  \ --config max.message.bytes=1048576\n\n# Create only if absent\nkafka-topics.sh --bootstrap-server\
  \ localhost:9092 --create \\\n  --topic orders --if-not-exists --partitions 6 --replication-factor 3\n\
  \n# List\nkafka-topics.sh --bootstrap-server localhost:9092 --list\n\n# Describe layout\nkafka-topics.sh\
  \ --bootstrap-server localhost:9092 --describe --topic orders\n\n# Show effective configs\nkafka-topics.sh\
  \ --bootstrap-server localhost:9092 --describe --topic orders --show-configs\n\n# Alter a config\nkafka-topics.sh\
  \ --bootstrap-server localhost:9092 --alter \\\n  --topic orders --config max.message.bytes=2097152\n\
  \n# Remove an override\nkafka-topics.sh --bootstrap-server localhost:9092 --alter \\\n  --topic orders\
  \ --delete-config max.message.bytes\n\n# Delete (requires delete.topic.enable=true on brokers)\nkafka-topics.sh\
  \ --bootstrap-server localhost:9092 --delete --topic orders\n```\n\n## Testing\n\n```bash\nkafka-topics.sh\
  \ --bootstrap-server localhost:9092 --describe --topic orders | grep PartitionCount\n```\n\n## Best\
  \ practices\n\n- Document partition count and rationale; it caps parallelism.\n- Keep overrides explicit\
  \ and reviewed; use --show-configs in audits.\n- Never delete topics holding consumer-group offsets\
  \ still in use.\n\n## Capabilities\n\n### topic-lifecycle\nCreate, list, and delete topics.\n\n**Commands:**\n\
  - `kafka-topics.sh --bootstrap-server localhost:9092 --create --topic orders --partitions 6 --replication-factor\
  \ 3 --config retention.ms=604800000 --config max.message.bytes=1048576`\n- `kafka-topics.sh --bootstrap-server\
  \ localhost:9092 --list`\n- `kafka-topics.sh --bootstrap-server localhost:9092 --delete --topic orders`\n\
  - `kafka-topics.sh --bootstrap-server localhost:9092 --create --topic orders --if-not-exists --partitions\
  \ 6 --replication-factor 3`\n\n**Examples:**\n- kafka-topics.sh --bootstrap-server localhost:9092 --create\
  \ --topic orders --partitions 6 --replication-factor 3\n- kafka-topics.sh --bootstrap-server localhost:9092\
  \ --list | grep orders\n- kafka-topics.sh --bootstrap-server localhost:9092 --delete --topic orders\n\
  \n### topic-config\nDescribe topic layout and alter topic configurations.\n\n**Commands:**\n- `kafka-topics.sh\
  \ --bootstrap-server localhost:9092 --describe --topic orders`\n- `kafka-topics.sh --bootstrap-server\
  \ localhost:9092 --describe --topic orders --show-configs`\n- `kafka-topics.sh --bootstrap-server localhost:9092\
  \ --alter --topic orders --config max.message.bytes=2097152`\n- `kafka-topics.sh --bootstrap-server\
  \ localhost:9092 --alter --topic orders --delete-config max.message.bytes`\n\n**Examples:**\n- kafka-topics.sh\
  \ --bootstrap-server localhost:9092 --describe --topic orders\n- kafka-topics.sh --bootstrap-server\
  \ localhost:9092 --alter --topic orders --config max.message.bytes=2097152\n- kafka-topics.sh --bootstrap-server\
  \ localhost:9092 --describe --topic orders --show-configs"
prompt: Act as Kafka Topics and handle the task per the instructions.
