title: Kafka
description: 'Core Kafka operations: run a local cluster, manage topics, produce and consume messages,
  and inspect consumer groups from the command line.'
version: 2.0.0
instructions: "# Kafka\n\nCore Kafka operations: run a local cluster, manage topics, produce and consume\
  \ messages, and inspect consumer groups from the command line.\n\n## Instructions\n\n# Kafka (Core)\n\
  \nCore Kafka operations for developers and operators.\n\n## What this skill does\n\n- Boots a local\
  \ KRaft-based Kafka cluster.\n- Creates topics and streams messages with the console tools.\n- Inspects\
  \ consumer groups and broker state.\n\n## When to use\n\n- Local development and demos.\n- First-time\
  \ cluster bring-up and smoke tests.\n- Teaching the messaging model (topic, partition, offset).\n\n\
  ## Real commands\n\n```bash\n# Format KRaft storage (one-time)\nkafka-storage.sh format -t $(kafka-storage.sh\
  \ random-uuid) \\\n  -c config/kraft/server.properties\n\n# Start broker\nkafka-server-start.sh config/kraft/server.properties\n\
  \n# Verify broker is up\nkafka-broker-api-versions.sh --bootstrap-server localhost:9092\n\n# Create\
  \ a topic\nkafka-topics.sh --bootstrap-server localhost:9092 \\\n  --create --topic events --partitions\
  \ 3 --replication-factor 1\n\n# Produce (type lines, Ctrl-D to exit)\nkafka-console-producer.sh --bootstrap-server\
  \ localhost:9092 --topic events\n\n# Consume from beginning\nkafka-console-consumer.sh --bootstrap-server\
  \ localhost:9092 \\\n  --topic events --from-beginning\n\n# List topics and groups\nkafka-topics.sh\
  \ --bootstrap-server localhost:9092 --list\nkafka-consumer-groups.sh --bootstrap-server localhost:9092\
  \ --list\n```\n\n## Producer with keys\n\n```bash\nkafka-console-producer.sh --bootstrap-server localhost:9092\
  \ \\\n  --topic events --property parse.key=true --property key.separator=:\n```\n\n## Testing\n\n```bash\n\
  # End-to-end smoke test\necho 'hello kafka' | kafka-console-producer.sh --bootstrap-server localhost:9092\
  \ --topic events\nkafka-console-consumer.sh --bootstrap-server localhost:9092 --topic events --from-beginning\
  \ --max-messages 1\n```\n\n## Best practices\n\n- Use partitions >= consumers for parallel processing.\n\
  - Name topics <domain>.<event>; document keys and value schemas.\n- Stop brokers with kafka-server-stop.sh\
  \ to flush state cleanly.\n\n## Capabilities\n\n### core-cluster\nStart and verify a Kafka broker (KRaft\
  \ mode).\n\n**Commands:**\n- `kafka-server-start.sh config/kraft/server.properties`\n- `kafka-storage.sh\
  \ format -t $(kafka-storage.sh random-uuid) -c config/kraft/server.properties`\n- `kafka-server-start.sh\
  \ config/server.properties`\n- `kafka-broker-api-versions.sh --bootstrap-server localhost:9092`\n\n\
  **Examples:**\n- kafka-storage.sh format -t $(kafka-storage.sh random-uuid) -c config/kraft/server.properties\n\
  - kafka-server-start.sh config/kraft/server.properties\n- kafka-broker-api-versions.sh --bootstrap-server\
  \ localhost:9092\n\n### core-messaging\nCreate topics, produce and consume messages, and inspect groups.\n\
  \n**Commands:**\n- `kafka-topics.sh --bootstrap-server localhost:9092 --create --topic events --partitions\
  \ 3 --replication-factor 1`\n- `kafka-console-producer.sh --bootstrap-server localhost:9092 --topic\
  \ events`\n- `kafka-console-consumer.sh --bootstrap-server localhost:9092 --topic events --from-beginning`\n\
  - `kafka-topics.sh --bootstrap-server localhost:9092 --list`\n- `kafka-consumer-groups.sh --bootstrap-server\
  \ localhost:9092 --list`\n\n**Examples:**\n- kafka-topics.sh --bootstrap-server localhost:9092 --create\
  \ --topic events --partitions 3 --replication-factor 1\n- kafka-console-producer.sh --bootstrap-server\
  \ localhost:9092 --topic events\n- kafka-console-consumer.sh --bootstrap-server localhost:9092 --topic\
  \ events --from-beginning"
prompt: Act as Kafka and handle the task per the instructions.
