title: knip
description: Finds unused files, exports, and dependencies with knip, the JavaScript dead-code detective,
  including plugin configs.
version: 2.0.0
instructions: "# knip\n\nFinds unused files, exports, and dependencies with knip, the JavaScript dead-code\
  \ detective, including plugin configs.\n\n## Instructions\n\n# Knip\n\nFind dead code in JavaScript\
  \ projects.\n\n## When to Use\n\n- Removing unused files, exports, and dependencies\n- Cleaning monorepos\
  \ where packages hide usage\n- Reducing bundle size and install time\n- Pre-merge CI checks for dead\
  \ code regressions\n\n## Commands\n\n```bash\n# Scan\nnpx knip\n\n# Production-only concerns\nnpx knip\
  \ --production\n\n# Scope\nnpx knip --include files,dependencies\nnpx knip --include exports\n\n# Reports\n\
  npx knip --json > knip-report.json\nnpx knip --reporter codeowners\n\n# Init and debug\nnpx knip --init\n\
  npx knip --debug\n\n# Auto-fix dependencies\nnpx knip --fix --include dependencies\n```\n\n## Config\
  \ Example\n\n```json\n{\n  \"entry\": [\"src/index.ts\", \"scripts/*.ts\"],\n  \"ignore\": [\"src/generated/**\"\
  ],\n  \"ignoreDependencies\": [\"@types/node\"]\n}\n```\n\n## Best Practices\n\n- Run knip in CI on\
  \ every merge\n- Define entry points explicitly for CLI tools\n- Ignore generated directories and bundled\
  \ output\n- Review the report before bulk-deleting files\n- Use --include exports to find dead public\
  \ API surface\n- Treat new dead code as a build failure\n\n## Capabilities\n\n### knip-scan\nScan projects\
  \ for dead code.\n\n**Commands:**\n- `npx knip`\n- `npx knip --production`\n- `npx knip --no-gitignore`\n\
  - `npx knip --include files,dependencies`\n- `npx knip --reporter json`\n\n**Examples:**\n- npx knip\
  \ --json > knip-report.json\n- npx knip --include exports --tags owner\n- npx knip --config knip.jsonc\n\
  \n### knip-config\nConfigure entry points and ignore rules.\n\n**Commands:**\n- `npx knip --init`\n\
  - `npx knip --debug`\n- `npx knip --fix`\n- `npx knip --dependencies`\n\n**Examples:**\n- npx knip --fix\
  \ --include dependencies\n- npx knip --workspace packages/*"
prompt: Act as knip and handle the task per the instructions.
