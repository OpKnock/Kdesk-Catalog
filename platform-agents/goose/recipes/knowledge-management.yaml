title: knowledge-management
description: 'Builds team documentation and knowledge bases with MkDocs and Docusaurus: authoring, serving,
  and publishing.'
version: 2.0.0
instructions: "# knowledge-management\n\nBuilds team documentation and knowledge bases with MkDocs and\
  \ Docusaurus: authoring, serving, and publishing.\n\n## Instructions\n\n# Knowledge Management\n\nTurn\
  \ team knowledge into a maintainable documentation site.\n\n## When to Use\n\n- Onboarding and runbook\
  \ documentation\n- API and product docs that need versioning\n- Centralizing tribal knowledge from Slack/meetings\n\
  \n## MkDocs for lightweight docs\n\n```yaml\nsite_name: Platform Docs\nnav:\n  - Home: index.md\n  -\
  \ Runbooks: runbooks.md\n  - Architecture: architecture.md\ntheme: material\n```\n\n```bash\nmkdocs\
  \ new docs\nmkdocs serve -a localhost:8000\nmkdocs build --strict\n```\n\n`--strict` turns warnings\
  \ into errors - great CI gate.\n\n## Publish to GitHub Pages\n\n```bash\nmkdocs gh-deploy\n```\n\n##\
  \ Docusaurus for feature-rich docs\n\n```bash\nnpx create-docusaurus@latest my-docs classic --typescript\n\
  npm run start\nnpm run build\n```\n\n## Documentation hygiene\n\n- Every runbook starts with impact\
  \ + owner + recovery steps.\n- Link docs from code comments and alert pages.\n- Mark stale docs with\
  \ expiry dates; delete rather than rot.\n- Keep a docs review task in the team's sprint.\n\n## Best\
  \ practices\n\n- Single source of truth: link, don't duplicate.\n- Use mermaid diagrams for architecture\
  \ flows.\n- Version docs with product versions.\n- CI: build --strict on every PR touching docs/\n\n\
  ## Testing\n\n```bash\nmkdocs build --strict\n```\n\nVerify all internal links resolve before merge.\n\
  \n## Capabilities\n\n### mkdocs\nAuthor and publish documentation sites with MkDocs.\n\n**Commands:**\n\
  - `mkdocs new docs`\n- `mkdocs serve -a localhost:8000`\n- `mkdocs build --strict`\n- `mkdocs gh-deploy`\n\
  - `mkdocs build --clean`\n\n**Examples:**\n- mkdocs serve -a 0.0.0.0:8000 --livereload\n- mkdocs build\
  \ --strict --site-dir dist\n- mkdocs gh-deploy --force\n\n### docusaurus\nBuild React-powered knowledge\
  \ bases with Docusaurus.\n\n**Commands:**\n- `npx create-docusaurus@latest my-docs classic --typescript`\n\
  - `npm run start`\n- `npm run build`\n- `npm run swizzle @docusaurus/theme-classic SidebarItem -- --typescript`\n\
  - `npx docusaurus serve`\n\n**Examples:**\n- npx create-docusaurus@latest my-docs classic --typescript\
  \ --skip-install\n- npm run build && npx docusaurus serve --port 3001\n- npm run write-translations\
  \ -- --locale de"
prompt: Act as knowledge-management and handle the task per the instructions.
