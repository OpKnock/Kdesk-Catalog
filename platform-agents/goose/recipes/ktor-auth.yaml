title: Ktor Auth
description: 'Secure Ktor applications: JWT bearer validation, Basic auth, session auth, and protected-route
  testing with curl.'
version: 2.0.0
instructions: "# Ktor Auth\n\nSecure Ktor applications: JWT bearer validation, Basic auth, session auth,\
  \ and protected-route testing with curl.\n\n## Instructions\n\n# Ktor Auth\n\nProtect Ktor routes with\
  \ JWT, Basic, and session authentication.\n\n## What this skill does\n\n- Adds JWT bearer validation\
  \ with HS256/RS256 keys.\n- Adds Basic auth for simple service credentials.\n- Tests 401/200 behavior\
  \ with curl.\n\n## When to use\n\n- Securing Ktor APIs behind bearer tokens.\n- Service-to-service auth\
  \ with Basic headers.\n- Adding claims-based authorization (roles in JWT).\n\n## Real commands\n\n```bash\n\
  # Run the app\n./gradlew run\n\n# Unauthenticated request -> 401\ncurl -s -o /dev/null -w '%{http_code}\\\
  n' http://localhost:8080/me\n\n# With a valid token\ncurl -s -H \"Authorization: Bearer $TOKEN\" http://localhost:8080/me\
  \ | jq .\n\n# Basic auth\ncurl -s -u alice:password http://localhost:8080/basic\ncurl -s -o /dev/null\
  \ -w '%{http_code}\\n' -u alice:wrong http://localhost:8080/basic\n\n# Basic header from base64\ncurl\
  \ -s -H 'Authorization: Basic YWxpY2U6cGFzc3dvcmQ=' http://localhost:8080/basic\n```\n\n## JWT config\
  \ example\n\n```kotlin\ninstall(Authentication) {\n    jwt(\"auth-jwt\") {\n        realm = \"ktor.io\"\
  \n        verifier(\n            JWT.verifier(JWKProvider(\"https://example.com/.well-known/jwks.json\"\
  ))\n        )\n        validate { credential ->\n            if (credential.payload.getClaim(\"role\"\
  ).asString() == \"admin\")\n                JWTPrincipal(credential.payload) else null\n        }\n\
  \    }\n}\n\nrouting {\n    authenticate(\"auth-jwt\") {\n        get(\"/me\") { call.respond(User(\"\
  alice\", \"admin\")) }\n    }\n}\n```\n\n## Testing\n\n```bash\n./gradlew test\n```\n\n## Best practices\n\
  \n- Verify signature AND claims (exp, iss, aud) in the validate block.\n- Use JWK providers for RS256;\
  \ rotate secrets without redeploys.\n- Return 401 for missing/invalid, 403 for valid-but-forbidden.\n\
  \n## Capabilities\n\n### jwt-auth\nConfigure and test JWT authentication in Ktor.\n\n**Commands:**\n\
  - `./gradlew run`\n- `curl -s -o /dev/null -w '%{http_code}\\n' http://localhost:8080/me`\n- `curl -s\
  \ -H 'Authorization: Bearer eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJhbGljZSJ9.signature' http://localhost:8080/me`\n\
  - `curl -s -H 'Authorization: Bearer $TOKEN' http://localhost:8080/me | jq .`\n\n**Examples:**\n- curl\
  \ -s -o /dev/null -w '%{http_code}\\n' http://localhost:8080/me\n- curl -s -H 'Authorization: Bearer\
  \ $TOKEN' http://localhost:8080/me\n- ./gradlew run\n\n### basic-auth\nConfigure Basic auth and test\
  \ credentials via curl.\n\n**Commands:**\n- `curl -s -u alice:password http://localhost:8080/basic`\n\
  - `curl -s -o /dev/null -w '%{http_code}\\n' -u alice:wrong http://localhost:8080/basic`\n- `curl -s\
  \ -H 'Authorization: Basic YWxpY2U6cGFzc3dvcmQ=' http://localhost:8080/basic`\n- `./gradlew test`\n\n\
  **Examples:**\n- curl -s -u alice:password http://localhost:8080/basic\n- curl -s -o /dev/null -w '%{http_code}\\\
  n' -u alice:wrong http://localhost:8080/basic\n- ./gradlew test"
prompt: Act as Ktor Auth and handle the task per the instructions.
