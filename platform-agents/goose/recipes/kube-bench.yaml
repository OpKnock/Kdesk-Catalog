title: kube-bench
description: Runs CIS Kubernetes Benchmark checks against master, worker, etcd, and control-plane components
  with the kube-bench auditor.
version: 2.0.0
instructions: "# kube-bench\n\nRuns CIS Kubernetes Benchmark checks against master, worker, etcd, and\
  \ control-plane components with the kube-bench auditor.\n\n## Instructions\n\n# kube-bench\n\nAudit\
  \ Kubernetes clusters against the CIS Kubernetes Benchmark.\n\n## What This Skill Does\n\n- Runs CIS\
  \ checks against master, worker, and etcd components\n- Matches benchmark checks to the cluster's Kubernetes\
  \ version\n- Outputs JSON/JUnit reports for compliance and CI\n- Identifies the exact control-plane\
  \ flags to harden\n\n## When to Use\n\n- Pre-deployment security audit of a cluster\n- Compliance evidence\
  \ for CIS or SOC2 controls\n- Periodic hardening reviews of node configuration\n\n## Real Commands\n\
  \n```bash\n# Run against all node roles\nkube-bench\n\n# Scope by role\nkube-bench run --targets master\n\
  kube-bench run --targets worker\nkube-bench run --targets etcd\n\n# Version-specific benchmark\nkube-bench\
  \ run --version 1.28\n\n# Targeted checks and reporting\nkube-bench run --check 1.2.7,1.4.1\nkube-bench\
  \ run --json --outputfile report.json\nkube-bench run --junit --junitfile junit.xml\n```\n\n## In-Cluster\
  \ Run\n\n```yaml\napiVersion: batch/v1\nkind: Job\nmetadata:\n  name: kube-bench\nspec:\n  template:\n\
  \    spec:\n      hostPID: true\n      containers:\n        - name: kube-bench\n          image: aquasec/kube-bench:latest\n\
  \          command: [\"/bin/sh\", \"-c\", \"kube-bench run --json --outputfile /reports/report.json\"\
  ]\n      restartPolicy: Never\n```\n\n## Best Practices\n\n- Run per node role and store JSON artifacts\
  \ per node\n- Re-run after every Kubernetes upgrade; checks change with versions\n- Automate remediation\
  \ for repeated failures (e.g. flag-level config)\n- Pair with kube-hunter or kubescape for active and\
  \ posture testing\n- Track failures as tracked exemptions, not silence\n\n## Capabilities\n\n### benchmark-runs\n\
  Run CIS checks against node roles and Kubernetes versions.\n\n**Commands:**\n- `kube-bench`\n- `kube-bench\
  \ run --targets master`\n- `kube-bench run --targets etcd`\n- `kube-bench run --version 1.28`\n- `kube-bench\
  \ run --check 1.2.7,1.4.1`\n\n**Examples:**\n- kube-bench run --targets master,worker\n- kube-bench\
  \ run --version 1.28 --targets etcd\n- kube-bench --json\n\n### reporting\nProduce JSON and JUnit reports\
  \ for compliance evidence.\n\n**Commands:**\n- `kube-bench run --json`\n- `kube-bench run --json --outputfile\
  \ kube-bench-report.json`\n- `kube-bench run --junit --junitfile junit.xml`\n- `kube-bench install`\n\
  - `kube-bench run --verbose`\n\n**Examples:**\n- kube-bench run --json --outputfile report.json\n- kube-bench\
  \ run --junit --junitfile junit.xml\n- kube-bench install && kube-bench"
prompt: Act as kube-bench and handle the task per the instructions.
