title: Kubernetes Deployment Advanced Rollouts
description: 'Advanced Kubernetes deployment strategies: canary and blue/green rollouts, rollbacks to
  revisions, and rollout pausing/resuming.'
version: 2.0.0
instructions: "# Kubernetes Deployment Advanced Rollouts\n\nAdvanced Kubernetes deployment strategies:\
  \ canary and blue/green rollouts, rollbacks to revisions, and rollout pausing/resuming.\n\n## Instructions\n\
  \n# Kubernetes Deployments (Advanced)\n\nProgressive delivery: canaries, blue/green, and controlled\
  \ rollbacks.\n\n## What this skill does\n\n- Inspects rollout history and rolls back to prior revisions.\n\
  - Pauses/resumes rollouts for manual verification gates.\n- Runs canary and blue/green patterns with\
  \ services.\n\n## When to use\n\n- Gradual feature rollouts with traffic shaping.\n- Instant rollback\
  \ on regression without image rebuilds.\n- Zero-downtime upgrades across versions.\n\n## Real commands\n\
  \n```bash\n# History\nkubectl rollout history deployment/nginx\nkubectl rollout history deployment/nginx\
  \ --revision=3\n\n# Rollback\nkubectl rollout undo deployment/nginx\nkubectl rollout undo deployment/nginx\
  \ --to-revision=2\n\n# Pause/resume (canary verification window)\nkubectl rollout pause deployment/nginx\n\
  kubectl rollout resume deployment/nginx\n\n# Canary: separate deployment with track label\nkubectl apply\
  \ -f canary-deployment.yaml\nkubectl scale deployment nginx-canary --replicas=1\n\n# Blue/green: flip\
  \ service selector\nkubectl apply -f green-deployment.yaml\nkubectl patch service nginx -p '{\"spec\"\
  :{\"selector\":{\"track\":\"green\"}}}'\n```\n\n## Canary YAML example\n\n```yaml\napiVersion: apps/v1\n\
  kind: Deployment\nmetadata:\n  name: nginx-canary\nspec:\n  replicas: 1\n  selector:\n    matchLabels:\n\
  \      app: nginx\n      track: canary\n  template:\n    metadata:\n      labels:\n        app: nginx\n\
  \        track: canary\n    spec:\n      containers:\n        - name: nginx\n          image: nginx:1.29\n\
  ```\n\n## Testing\n\n```bash\n# Route 10% via an ingress weight, or a second service:\nkubectl get svc\
  \ nginx-canary\ncurl -H 'Host: nginx-canary' http://<ingress>/ | grep Server\n```\n\n## Best practices\n\
  \n- Use rollout undo --to-revision=N instead of manual image reverts.\n- Keep a few old revisions (revisionHistoryLimit)\
  \ for quick rollbacks.\n- Combine canaries with metrics gates (Argo Rollouts) for automation.\n\n##\
  \ Capabilities\n\n### advanced-rollouts\nManage revisions: history, rollback, pause, and resume.\n\n\
  **Commands:**\n- `kubectl rollout history deployment/nginx`\n- `kubectl rollout history deployment/nginx\
  \ --revision=3`\n- `kubectl rollout undo deployment/nginx`\n- `kubectl rollout undo deployment/nginx\
  \ --to-revision=2`\n- `kubectl rollout pause deployment/nginx`\n- `kubectl rollout resume deployment/nginx`\n\
  \n**Examples:**\n- kubectl rollout history deployment/nginx\n- kubectl rollout undo deployment/nginx\
  \ --to-revision=2\n- kubectl rollout pause deployment/nginx\n\n### canary-bluegreen\nImplement canary\
  \ and blue/green release patterns with labels and services.\n\n**Commands:**\n- `kubectl apply -f canary-deployment.yaml`\n\
  - `kubectl get deployments -l app=nginx --show-labels`\n- `kubectl scale deployment nginx-canary --replicas=1`\n\
  - `kubectl apply -f blue-deployment.yaml && kubectl apply -f green-deployment.yaml`\n- `kubectl patch\
  \ service nginx -p '{\"spec\":{\"selector\":{\"track\":\"green\"}}}'`\n\n**Examples:**\n- kubectl apply\
  \ -f canary-deployment.yaml\n- kubectl scale deployment nginx-canary --replicas=1\n- kubectl patch service\
  \ nginx -p '{\"spec\":{\"selector\":{\"track\":\"green\"}}}'"
prompt: Act as Kubernetes Deployment Advanced Rollouts and handle the task per the instructions.
