title: Kubernetes Deployment
description: 'Deploy and operate workloads with kubectl: create deployments, scale replicas, update images,
  and manage rollouts.'
version: 2.0.0
instructions: "# Kubernetes Deployment\n\nDeploy and operate workloads with kubectl: create deployments,\
  \ scale replicas, update images, and manage rollouts.\n\n## Instructions\n\n# Kubernetes Deployments\n\
  \nCreate and operate declarative workloads with kubectl.\n\n## What this skill does\n\n- Creates deployments\
  \ from images with replica counts.\n- Scales replicas and updates images.\n- Manages rollouts and status\
  \ checks.\n\n## When to use\n\n- Deploying stateless services.\n- Day-2 operations: scaling, image bumps,\
  \ restarts.\n- Checking rollout health during releases.\n\n## Real commands\n\n```bash\n# Create\nkubectl\
  \ create deployment nginx --image=nginx:1.27 --replicas=3\n\n# Scale\nkubectl scale deployment nginx\
  \ --replicas=5\n\n# Update image (triggers a rollout)\nkubectl set image deployment/nginx nginx=nginx:1.28\n\
  \n# Expose as a service\nkubectl expose deployment nginx --port=80 --type=ClusterIP\n\n# Rollout status\n\
  kubectl rollout status deployment/nginx\n\n# Restart (re-pull, new rollout)\nkubectl rollout restart\
  \ deployment/nginx\n\n# Inspect\nkubectl get deployments\nkubectl get pods -l app=nginx -o wide\nkubectl\
  \ describe deployment nginx\n```\n\n## Deployment YAML example\n\n```yaml\napiVersion: apps/v1\nkind:\
  \ Deployment\nmetadata:\n  name: nginx\nspec:\n  replicas: 3\n  selector:\n    matchLabels:\n      app:\
  \ nginx\n  template:\n    metadata:\n      labels:\n        app: nginx\n    spec:\n      containers:\n\
  \        - name: nginx\n          image: nginx:1.27\n          ports:\n            - containerPort:\
  \ 80\n```\n\n## Testing\n\n```bash\nkubectl apply -f deployment.yaml\nkubectl rollout status deployment/nginx\n\
  kubectl get pods --watch\n```\n\n## Best practices\n\n- Always set resource requests/limits on containers.\n\
  - Use apply -f with versioned manifests, not ad-hoc create.\n- Check rollout status before declaring\
  \ a release done.\n\n## Capabilities\n\n### deploy-basic\nCreate, scale, and update deployments.\n\n\
  **Commands:**\n- `kubectl create deployment nginx --image=nginx:1.27 --replicas=3`\n- `kubectl scale\
  \ deployment nginx --replicas=5`\n- `kubectl set image deployment/nginx nginx=nginx:1.28`\n- `kubectl\
  \ expose deployment nginx --port=80 --type=ClusterIP`\n\n**Examples:**\n- kubectl create deployment\
  \ nginx --image=nginx:1.27 --replicas=3\n- kubectl scale deployment nginx --replicas=5\n- kubectl set\
  \ image deployment/nginx nginx=nginx:1.28\n\n### rollout-ops\nMonitor rollout progress and status.\n\
  \n**Commands:**\n- `kubectl rollout status deployment/nginx`\n- `kubectl rollout restart deployment/nginx`\n\
  - `kubectl get deployments`\n- `kubectl get pods -l app=nginx -o wide`\n- `kubectl describe deployment\
  \ nginx`\n\n**Examples:**\n- kubectl rollout status deployment/nginx\n- kubectl rollout restart deployment/nginx\n\
  - kubectl get deployments"
prompt: Act as Kubernetes Deployment and handle the task per the instructions.
