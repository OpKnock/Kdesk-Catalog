  # Kubernetes Secrets\n\nStore and inject sensitive data into Kubernetes workloads.\n\n## What this skill\
  \ does\n\n- Creates generic and TLS secrets from CLI input or files.\n- Injects secrets as env vars\
  \ or mounted files.\n- Decodes values safely for audits.\n\n## When to use\n\n- DB credentials, API\
  \ keys, and tokens for workloads.\n- TLS cert/key pairs for ingress and service TLS.\n- Keeping secrets\
  \ out of images and git.\n\n## Real commands\n\n```bash\n# Generic secret\nkubectl create secret generic\
  \ db-creds \\\n  --from-literal=DB_USER=admin --from-literal=DB_PASSWORD=s3cret\n\n# From env file\n\
  kubectl create secret generic app-secrets --from-env-file=secrets.env\n\n# TLS secret for ingress\n\
  kubectl create secret tls my-tls --cert=cert.pem --key=key.pem\n\n# List\nkubectl get secrets\n\n# Decode\
  \ a value (base64 in etcd/API)\nkubectl get secret db-creds -o jsonpath='{.data.DB_PASSWORD}' | base64\
  \ -d\n\n# Describe shows keys only, not values\nkubectl describe secret db-creds\n```\n\n## Pod reference\
  \ example\n\n```yaml\nspec:\n  containers:\n    - name: app\n      image: myapp:1.2\n      env:\n  \
  \      - name: DB_PASSWORD\n          valueFrom:\n            secretKeyRef:\n              name: db-creds\n\
  \              key: DB_PASSWORD\n      volumeMounts:\n        - name: tls\n          mountPath: /etc/tls\n\
  \          readOnly: true\n  volumes:\n    - name: tls\n      secret:\n        secretName: my-tls\n\
  ```\n\n## Testing\n\n```bash\nkubectl exec deploy/app -- env | grep DB_PASSWORD\nkubectl exec deploy/app\
  \ -- cat /etc/tls/tls.crt\n```\n\n## Best practices\n\n- Values are base64, not encrypted; use encryption\
  \ at rest (KMS) or ExternalSecrets.\n- Prefer mounted secrets over env vars for large or rotating values.\n\
  - Never commit secret manifests; generate them in pipelines.\n\n## Capabilities\n\n### secret-create\n\
  Create generic and TLS secrets.\n\n**Parameters:**\n- `name` (string): Secret name.\n- `from_literal`\
  \ (string): key=value literals.\n- `cert` (string): TLS certificate file.\n- `key` (string): TLS private\
  \ key file.\n\n**Commands:**\n- `kubectl create secret generic db-creds --from-literal=DB_USER=admin\
  \ --from-literal=DB_PASSWORD=s3cret`\n- `kubectl create secret generic app-secrets --from-file=tls.crt=cert.pem\
  \ --from-file=tls.key=key.pem`\n- `kubectl create secret tls my-tls --cert=cert.pem --key=key.pem`\n\
  - `kubectl create secret generic app-secrets --from-env-file=secrets.env`\n\n**Examples:**\n- kubectl\
  \ create secret generic db-creds --from-literal=DB_USER=admin --from-literal=DB_PASSWORD=s3cret\n- kubectl\
  \ create secret tls my-tls --cert=cert.pem --key=key.pem\n- kubectl create secret generic app-secrets\
  \ --from-env-file=secrets.env\n\n### secret-ops\nList, decode, and reference secrets in workloads.\n\
  \n**Parameters:**\n- `name` (string): Secret name.\n- `key` (string): Secret key to decode.\n\n**Commands:**\n\
  - `kubectl get secrets`\n- `kubectl get secret db-creds -o jsonpath='{.data.DB_PASSWORD}' | base64 -d`\n\
  - `kubectl describe secret db-creds`\n- `kubectl delete secret db-creds`\n- `kubectl get secret my-tls\
  \ -o yaml`\n\n**Examples:**\n- kubectl get secret db-creds -o jsonpath='{.data.DB_PASSWORD}' | base64\
  \ -d\n- kubectl get secrets\n- kubectl describe secret db-creds\n\n## References\n- [Kubernetes Secrets](https://kubernetes.io/docs/concepts/configuration/secret/)\n\
  - [Distribute Credentials Securely](https://kubernetes.io/docs/tasks/inject-data-application/distribute-credentials-secure/)"
