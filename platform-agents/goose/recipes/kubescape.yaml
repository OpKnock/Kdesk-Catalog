title: kubescape
description: Scans Kubernetes clusters, manifests, and images against NSA/CISA, MITRE, and other hardening
  frameworks with kubescape.
version: 2.0.0
instructions: "# kubescape\n\nScans Kubernetes clusters, manifests, and images against NSA/CISA, MITRE,\
  \ and other hardening frameworks with kubescape.\n\n## Instructions\n\n# Kubescape\n\nKubernetes posture\
  \ scanning against industry hardening frameworks.\n\n## What This Skill Does\n\n- Scans live clusters,\
  \ manifests, and images\n- Checks against NSA/CISA, MITRE ATT&CK, and CIS frameworks\n- Reports compliance\
  \ scores per control\n- Exports SARIF, JSON, HTML, and JUnit for CI\n\n## When to Use\n\n- Cluster hardening\
  \ baseline before production\n- Compliance gate in CI for manifest changes\n- Image scanning before\
  \ deployment\n\n## Real Commands\n\n```bash\n# Framework scans\nkubescape scan framework nsa\nkubescape\
  \ scan framework all --verbose\nkubescape scan framework mitre-attack\n\n# Manifest and image scans\n\
  kubescape scan workload nginx.yaml\nkubescape scan image ubuntu:latest\nkubescape scan framework nsa\
  \ --file-path manifests/\n\n# Downloads and reports\nkubescape download framework nsa\nkubescape scan\
  \ framework nsa --format sarif --output scan.sarif\nkubescape scan framework nsa --format html --output\
  \ report.html\n```\n\n## CI Gate\n\n```yaml\n- name: Kubescape scan\n  run: |\n    kubescape scan framework\
  \ nsa --file-path . --format sarif --output scan.sarif \\\n      --set-exit-code 3 --fail-threshold\
  \ 80\n```\n\n## Best Practices\n\n- Run live scans after upgrades; manifest scans on every PR\n- Start\
  \ with the NSA framework, add MITRE for threat mapping\n- Use --fail-threshold as a compliance score\
  \ gate, not hard deny\n- Store SARIF in code scanning for inline findings\n- Remediate by control: RBAC,\
  \ resource limits, and securityContext first\n\n## Capabilities\n\n### framework-scans\nScan clusters\
  \ or files against security frameworks.\n\n**Commands:**\n- `kubescape scan framework nsa`\n- `kubescape\
  \ scan framework all`\n- `kubescape scan framework mitre-attack`\n- `kubescape scan framework cis-aks-t1.2.0`\n\
  - `kubescape scan framework nsa --verbose`\n\n**Examples:**\n- kubescape scan framework nsa\n- kubescape\
  \ scan framework all\n- kubescape scan framework mitre-attack --verbose\n\n### workload-and-image-scan\n\
  Scan manifest files and container images directly.\n\n**Commands:**\n- `kubescape scan workload nginx.yaml`\n\
  - `kubescape scan image ubuntu:latest`\n- `kubescape scan framework nsa --file-path manifests/`\n- `kubescape\
  \ download framework nsa`\n\n**Examples:**\n- kubescape scan workload deploy.yaml\n- kubescape scan\
  \ image nginx:1.25\n- kubescape download framework cis-eks-t1.2.0\n\n### reporting\nExport scan results\
  \ in CI and audit formats.\n\n**Commands:**\n- `kubescape scan framework nsa --format sarif --output\
  \ scan.sarif`\n- `kubescape scan framework all --format json --output scan.json`\n- `kubescape scan\
  \ framework nsa --format html --output report.html`\n- `kubescape scan framework nsa --set-exit-code\
  \ 3 --fail-threshold 70`\n\n**Examples:**\n- kubescape scan framework nsa --format sarif --output scan.sarif\n\
  - kubescape scan framework nsa --format html --output report.html\n- kubescape scan framework all --set-exit-code\
  \ 3 --fail-threshold 80"
prompt: Act as kubescape and handle the task per the instructions.
