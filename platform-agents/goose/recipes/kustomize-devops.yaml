title: kustomize-devops
description: 'Composes Kubernetes manifests with kustomize: overlays, bases, patches, generators, and
  kubectl apply -k workflows.'
version: 2.0.0
instructions: "# kustomize-devops\n\nComposes Kubernetes manifests with kustomize: overlays, bases, patches,\
  \ generators, and kubectl apply -k workflows.\n\n## Instructions\n\n# Kustomize Configuration\n\nManage\
  \ environment-specific Kubernetes configs with bases and overlays.\n\n## What This Skill Does\n\n- Builds\
  \ final manifests from base + overlay layers\n- Patches any field with strategic merge or JSON patches\n\
  - Generates ConfigMaps and Secrets from files/literals\n- Sets images, labels, namespaces per overlay\n\
  - Applies straight to the cluster with kubectl apply -k\n\n## When to Use\n\n- Running the same app\
  \ in dev/staging/prod with small diffs\n- Replacing sed-heavy templating in deployment scripts\n- Vendoring\
  \ upstream manifests with local tweaks\n\n## Real Commands\n\n```bash\n# Build\nkustomize build ./overlays/prod\n\
  kustomize build . | kubectl apply -f -\nkubectl apply -k ./overlays/prod\nkustomize cfg tree .     \
  \     # view resource tree\n\n# Edit kustomization.yaml\nkustomize create --resources=base\nkustomize\
  \ edit add resource deployment.yaml\nkustomize edit add patch --kind Deployment --name web --path patch.yaml\n\
  kustomize edit set image myapp:1.2.0\nkustomize edit add label app.kubernetes.io/part-of:web\nkustomize\
  \ edit add configmap app-config --from-literal=DEBUG=false\n```\n\n## Layout\n\n```\nbase/\n  deployment.yaml\n\
  \  service.yaml\n  kustomization.yaml\noverlays/\n  dev/    # kustomization.yaml -> base + patches\n\
  \  prod/   # kustomization.yaml -> base + patches\n```\n\n## Best Practices\n\n- Keep base pristine;\
  \ all environment diffs live in overlays\n- Use `edit set image` for immutable image promotion (gitops-friendly)\n\
  - Generate secrets via sealed-secrets/kustomize secretGenerator with encryption\n- Validate built output\
  \ in CI: `kustomize build | kubectl apply --dry-run=client -f -`\n- Name overlays after environment;\
  \ keep field paths stable\n\n## Capabilities\n\n### build-and-apply\nBuild overlays into final manifests\
  \ and apply them directly.\n\n**Commands:**\n- `kustomize build ./overlays/prod`\n- `kustomize build\
  \ . | kubectl apply -f -`\n- `kubectl apply -k ./overlays/prod`\n- `kustomize build ./overlays/dev >\
  \ /tmp/dev.yaml`\n- `kustomize cfg tree .`\n\n**Examples:**\n- kustomize build ./overlays/prod\n- kubectl\
  \ apply -k ./overlays/prod\n- kustomize build . | kubectl apply -f -\n\n### edit-and-patch\nModify kustomization.yaml:\
  \ add resources, patches, and set images.\n\n**Commands:**\n- `kustomize create --resources=base`\n\
  - `kustomize edit add resource deployment.yaml`\n- `kustomize edit add patch --kind Deployment --name\
  \ web --path patch.yaml`\n- `kustomize edit set image myapp:1.2.0`\n- `kustomize edit add label app.kubernetes.io/part-of:web`\n\
  - `kustomize edit add configmap app-config --from-literal=DEBUG=false`\n\n**Examples:**\n- kustomize\
  \ edit set image myapp:1.2.0\n- kustomize edit add patch --kind Deployment --name web --path patch.yaml\n\
  - kustomize edit add configmap app-config --from-literal=DEBUG=false"
prompt: Act as kustomize-devops and handle the task per the instructions.
