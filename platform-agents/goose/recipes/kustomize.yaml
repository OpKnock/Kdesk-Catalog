title: Kustomize
description: 'Manage Kubernetes manifests with Kustomize: overlays per environment, image/namespace overrides,
  and build-to-apply workflows.'
version: 2.0.0
instructions: "# Kustomize\n\nManage Kubernetes manifests with Kustomize: overlays per environment, image/namespace\
  \ overrides, and build-to-apply workflows.\n\n## Instructions\n\n# Kustomize\n\nManage Kubernetes manifests\
  \ with overlays and patches, no templating needed.\n\n## What this skill does\n\n- Builds final manifests\
  \ from base + overlays.\n- Overrides images, namespaces, labels, and names.\n- Applies via kubectl -k\
  \ for GitOps-style flows.\n\n## When to use\n\n- Environment-specific tweaks (dev/staging/prod) of one\
  \ base.\n- Promoting a manifest set across clusters.\n- Adding site-specific patches without forking\
  \ manifests.\n\n## Real commands\n\n```bash\n# Build merged output\nkustomize build .\n\n# Build a specific\
  \ overlay\nkustomize build overlays/prod\n\n# Apply directly\nkubectl apply -k .\n\n# Pipe build into\
  \ apply (audit trail)\nkustomize build overlays/prod | kubectl apply -f -\n\n# Create a new overlay\
  \ from base\nkustomize create --resources=../base --namespace=dev\n\n# Edit kustomization.yaml\nkustomize\
  \ edit set image myapp=myapp:v2.0\nkustomize edit set namespace production\nkustomize edit add label\
  \ app:myapp --force\nkustomize edit set nameprefix prod-\n```\n\n## Directory layout\n\n```text\nbase/\n\
  \  deployment.yaml\n  service.yaml\n  kustomization.yaml\noverlays/\n  dev/\n    kustomization.yaml\n\
  \  prod/\n    kustomization.yaml\n    prod-patch.yaml\n```\n\n## kustomization.yaml example\n\n```yaml\n\
  apiVersion: kustomize.config.k8s.io/v1beta1\nkind: Kustomization\nresources:\n  - ../../base\nnamespace:\
  \ production\nimages:\n  - name: myapp\n    newTag: v2.0\npatches:\n  - path: prod-patch.yaml\n```\n\
  \n## Testing\n\n```bash\nkustomize build overlays/prod | kubectl apply --dry-run=client -f -\n```\n\n\
  ## Best practices\n\n- Keep the base pristine; put all environment changes in overlays.\n- Use configMapGenerator\
  \ for config auto-naming (rollout on change).\n- Commit the built output only if auditors need it; otherwise\
  \ build in CI.\n\n## Capabilities\n\n### kustomize-build\nBuild and apply kustomized manifests.\n\n\
  **Commands:**\n- `kustomize build .`\n- `kubectl apply -k .`\n- `kustomize build --load-restrictor LoadRestrictionsNone\
  \ overlays/prod`\n- `kustomize build . | kubectl apply -f -`\n\n**Examples:**\n- kustomize build .\n\
  - kubectl apply -k .\n- kustomize build overlays/prod | kubectl apply -f -\n\n### kustomize-edit\nEdit\
  \ kustomization.yaml: images, namespaces, and common labels.\n\n**Commands:**\n- `kustomize create --resources=../base`\n\
  - `kustomize edit set image myapp=myapp:v2.0`\n- `kustomize edit set namespace production`\n- `kustomize\
  \ edit add label app:myapp --force`\n- `kustomize edit set nameprefix prod-`\n\n**Examples:**\n- kustomize\
  \ create --resources=../base\n- kustomize edit set image myapp=myapp:v2.0\n- kustomize edit set namespace\
  \ production"
prompt: Act as Kustomize and handle the task per the instructions.
