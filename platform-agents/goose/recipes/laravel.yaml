title: laravel
description: 'Builds PHP web applications with Laravel: artisan commands, migrations, queues, scheduling,
  and testing.'
version: 2.0.0
instructions: "# laravel\n\nBuilds PHP web applications with Laravel: artisan commands, migrations, queues,\
  \ scheduling, and testing.\n\n## Instructions\n\n# Laravel\n\nPHP web framework with batteries included.\n\
  \n## When to Use\n\n- Full-stack PHP apps with Eloquent ORM\n- REST APIs with built-in auth and validation\n\
  - Apps needing queues, caching, and scheduling out of the box\n\n## Commands\n\n```bash\n# Create app\n\
  composer create-project laravel/laravel myapp\n\n# Dev server\nphp artisan serve\n\n# Scaffolding\n\
  php artisan make:model Order -m\nphp artisan make:controller OrderController --resource\n\n# Database\n\
  php artisan migrate\nphp artisan migrate:fresh --seed\n\n# Shell\nphp artisan tinker\n\n# Routes\nphp\
  \ artisan route:list\n\n# Queues\nphp artisan queue:work\nphp artisan queue:listen --tries=3\nphp artisan\
  \ queue:retry all\n\n# Scheduler\nphp artisan schedule:work\nphp artisan schedule:list\n```\n\n## Job\
  \ Example\n\n```php\n// app/Jobs/SendEmail.php\nclass SendEmail implements ShouldQueue\n{\n    public\
  \ function handle(): void\n    {\n        Mail::to($this->user)->send(new WelcomeMail());\n    }\n}\n\
  ```\n\n## Best Practices\n\n- Run migrations via deploy pipelines, never ad-hoc in prod\n- Keep controllers\
  \ thin; push logic into services and jobs\n- Use queue:work under supervisor in production\n- Schedule\
  \ tasks in the kernel and run schedule:run via cron once\n- Cache config/routes in prod: php artisan\
  \ config:cache\n\n## Capabilities\n\n### laravel-artisan\nScaffold and manage Laravel applications.\n\
  \n**Commands:**\n- `composer create-project laravel/laravel myapp`\n- `php artisan serve`\n- `php artisan\
  \ make:model Order -m`\n- `php artisan migrate`\n- `php artisan tinker`\n\n**Examples:**\n- php artisan\
  \ make:controller OrderController --resource\n- php artisan migrate:fresh --seed\n- php artisan route:list\
  \ --path=api\n\n### laravel-queues\nRun queue workers and the scheduler.\n\n**Commands:**\n- `php artisan\
  \ queue:work`\n- `php artisan queue:listen --tries=3`\n- `php artisan schedule:work`\n- `php artisan\
  \ queue:table`\n- `php artisan schedule:list`\n\n**Examples:**\n- php artisan queue:work redis --timeout=60\n\
  - php artisan schedule:test\n- php artisan queue:retry all"
prompt: Act as laravel and handle the task per the instructions.
