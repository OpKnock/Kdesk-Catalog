title: License Checker
description: Audits npm dependency licenses with license-checker, detecting incompatible, missing, or
  unknown licenses before release.
version: 2.0.0
instructions: "# License Checker\n\nAudits npm dependency licenses with license-checker, detecting incompatible,\
  \ missing, or unknown licenses before release.\n\n## Instructions\n\n# License Checker\n\nAudits every\
  \ transitive npm dependency and reports its SPDX license so you can enforce\nlegal compliance in CI.\n\
  \n## When to Use\n\n- Before shipping a package or SaaS product to check license compatibility\n- Enforcing\
  \ an allow-list (MIT/Apache/BSD only) on a monorepo\n- Detecting copyleft (GPL/AGPL) or unknown licenses\
  \ sneaking in via transitive deps\n- Generating a license report for legal or compliance review\n\n\
  ## Real Commands\n\n```bash\n# Install\nnpm install --save-dev license-checker\n\n# Human-readable tree\
  \ of every package and its license\nnpx license-checker --start\n\n# Summary counts per license type\n\
  npx license-checker --summary\n\n# Fail the build if any license is outside the allow-list\nnpx license-checker\
  \ --onlyAllow \"MIT;Apache-2.0;ISC;BSD-2-Clause;BSD-3-Clause\"\n\n# Fail on copyleft regardless of allow-list\n\
  npx license-checker --failOn \"GPL;AGPL;LGPL\"\n\n# Production-only JSON report for legal\nnpx license-checker\
  \ --production --json --out license-audit.json\n\n# CSV report suitable for spreadsheets\nnpx license-checker\
  \ --csv --out licenses.csv\n```\n\n## CI Integration\n\n```yaml\n# GitHub Actions\n- name: License audit\n\
  \  run: npx license-checker --onlyAllow \"MIT;Apache-2.0;ISC;BSD-3-Clause\"\n\n# GitLab CI\nlicense-audit:\n\
  \  stage: security\n  script:\n    - npx license-checker --summary\n    - npx license-checker --onlyAllow\
  \ \"MIT;Apache-2.0;ISC\"\n```\n\n## Best Practices\n\n- Pin the checker version; license data changes\
  \ as packages publish\n- Run against `--production` for releases and full tree for dev tooling\n- Review\
  \ `--excludePackages` carefully; it bypasses the allow-list entirely\n- Treat packages with `UNKNOWN`\
  \ licenses as a review task, not an auto-pass\n- Re-run after every dependency bump; a new transitive\
  \ dep can add a copyleft license\n\n## Example Response\n\nWhen a copyleft license is found the exit\
  \ code is non-zero and stdout lists the offending\npackages with `license-checker --summary` style counts,\
  \ so the agent reports the exact\npackage name and version to remove or replace.\n\n## Capabilities\n\
  \n### audit-licenses\nGenerate license inventories and enforce allowed-license policies for npm projects\n\
  \n**Commands:**\n- `npx license-checker --summary`\n- `license-checker --csv --out /tmp/licenses.csv`\n\
  - `license-checker --onlyAllow \"MIT;Apache-2.0;ISC;BSD-3-Clause\"`\n- `license-checker --production\
  \ --json --out license-audit.json`\n- `license-checker --excludePackages \"lodash@4.17.21\" --failOn\
  \ \"GPL\"`\n\n**Examples:**\n- npx license-checker --onlyAllow 'MIT;Apache-2.0'\n- license-checker --start\
  \ --production --csv > licenses.csv\n- license-checker --summary | head -40"
prompt: Act as License Checker and handle the task per the instructions.
