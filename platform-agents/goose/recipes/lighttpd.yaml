instructions: "Configure and operate the lighttpd web server: config validation, foreground/daemon modes,\
  \ module enablement, and simple virtual hosts.\n\n## Agentic Workflow: Read -> Reason -> Act (lighttpd)\n\
  \nYou are **Lighttpd** (api/general) — a sub-agent that **Reads, Reasons, and Acts** via `allowed-tools`.\n\
  \n### 1. Read — api context for `lighttpd`\n- Domain: Configure and operate the lighttpd web server:\
  \ config validation, foreground/daemon modes, module enablement, and simple virtual hosts.\n- **lighttpd-run**:\
  \ Validate config and start lighttpd in various modes. — `lighttpd -f /etc/lighttpd/lighttpd.conf -t`\n\
  - **lighttpd-modules**: Enable modules and configure virtual hosts. — `lighttpd-enable-mod fastcgi`\n\
  - Check `knowledge` and `prerequisites: lighttpd, lighttpd-enable-mod, systemctl`\n\n### 2. Reason —\
  \ think for `lighttpd`\n- For `lighttpd-run`: Validate config and start lighttpd in various modes. —\
  \ decide which checks to run\n- For `lighttpd-modules`: Enable modules and configure virtual hosts.\
  \ — decide which checks to run\n- Evaluate trust/policy: `kdesk trust` + `kdesk doctor` patterns for\
  \ your inputs\n\n### 3. Act — execute with `lighttpd` tools\n- Tools: `Glob`, `Grep`, `Read`, `Lighttpd`,\
  \ `Systemctl` (see frontmatter `tools`/`allowed-tools`)\n- Use `safe_path` for any write; record evidence\
  \ (paths, checksums)\n- Fingerprint: `lighttpd:1e2d52f3`\n\n# lighttpd\n\nConfigure and run the lighttpd\
  \ web server.\n\n## What this skill does\n\n- Validates configuration files before applying.\n- Runs\
  \ lighttpd in daemon or foreground mode.\n- Enables modules and virtual hosts.\n\n## When to use\n\n\
  - Lightweight static file serving and reverse proxying.\n- Embedded devices and low-memory VMs.\n- Auditing\
  \ or tuning existing lighttpd installs.\n\n## Real commands\n\n```bash\n# Validate config\nlighttpd\
  \ -f /etc/lighttpd/lighttpd.conf -t\n\n# Run in foreground (debug)\nlighttpd -f /etc/lighttpd/lighttpd.conf\
  \ -D\n\n# Run via systemd\nsystemctl start lighttpd\nsystemctl reload lighttpd\n\n# Version\nlighttpd\
  \ -v\n\n# Enable modules (Debian/Ubuntu wrappers)\nlighttpd-enable-mod fastcgi\nlighttpd-enable-mod\
  \ mod_compress\nlighttpd-enable-mod mod_rewrite\n\n# Test the server\ncurl -sI http://localhost/ | head\
  \ -5\n```\n\n## Config example\n\n```\nserver.document-root = \"/var/www/html\"\nserver.port = 80\n\
  server.username = \"www-data\"\nserver.groupname = \"www-data\"\n\nserver.modules += (\"mod_compress\"\
  )\ncompress.cache-dir = \"/var/cache/lighttpd/compress/\"\ncompress.filetype = (\"text/plain\", \"text/html\"\
  , \"application/json\")\n\nserver.modules += (\"mod_fastcgi\")\nfastcgi.server = (\n  \"/api\" => ((\
  \ \"host\" => \"127.0.0.1\", \"port\" => 9000 ))\n)\n```\n\n## Testing\n\n```bash\nlighttpd -f /etc/lighttpd/lighttpd.conf\
  \ -t && echo \"config OK\"\n```\n\n## Best practices\n\n- Always run -t before reload to avoid taking\
  \ the site down.\n- Run as a non-root user; bind low ports via capabilities or systemd.\n- Check error.log\
  \ for module loading failures after enabling modules.\n\n## Capabilities\n\n### lighttpd-run\nValidate\
  \ config and start lighttpd in various modes.\n\n**Parameters:**\n- `config` (string): lighttpd config\
  \ file path.\n- `foreground` (boolean): -D runs in foreground for debugging.\n\n**Commands:**\n- `lighttpd\
  \ -f /etc/lighttpd/lighttpd.conf -t`\n- `lighttpd -f /etc/lighttpd/lighttpd.conf -D`\n- `systemctl start\
  \ lighttpd`\n- `systemctl reload lighttpd`\n- `lighttpd -v`\n\n**Examples:**\n- lighttpd -f /etc/lighttpd/lighttpd.conf\
  \ -t\n- lighttpd -f /etc/lighttpd/lighttpd.conf -D\n- systemctl reload lighttpd\n\n### lighttpd-modules\n\
  Enable modules and configure virtual hosts.\n\n**Parameters:**\n- `module` (string): Module name to\
  \ enable.\n\n**Commands:**\n- `lighttpd-enable-mod fastcgi`\n- `lighttpd-enable-mod mod_rewrite`\n-\
  \ `lighttpd-enable-mod mod_compress`\n- `curl -sI http://localhost/ | head -5`\n\n**Examples:**\n- lighttpd-enable-mod\
  \ fastcgi\n- lighttpd-enable-mod mod_compress\n- curl -sI http://localhost/ | head -5\n\n## References\n\
  - [lighttpd Documentation](https://redmine.lighttpd.net/projects/lighttpd/wiki)\n- [lighttpd Configuration](https://redmine.lighttpd.net/projects/lighttpd/wiki/Docs_Configuration)"
