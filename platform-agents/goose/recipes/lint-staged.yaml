title: lint-staged
description: Runs linters only on staged files via lint-staged git hooks, keeping pre-commit checks fast
  in any JS project.
version: 2.0.0
instructions: "# lint-staged\n\nRuns linters only on staged files via lint-staged git hooks, keeping pre-commit\
  \ checks fast in any JS project.\n\n## Instructions\n\n# Lint-Staged\n\nRuns configured linters and\
  \ formatters against only the files that are staged in git,\nso pre-commit checks stay fast even in\
  \ huge repos.\n\n## When to Use\n\n- Setting up a pre-commit hook that lints and auto-fixes changed\
  \ files\n- Speeding up a slow full-repo lint that blocks commits\n- Enforcing formatting (Prettier)\
  \ and linting (ESLint) only on touched files\n\n## Real Commands\n\n```bash\n# Install with the husky\
  \ pre-commit hook\nnpm install --save-dev lint-staged husky\nnpx husky init\n\n# Add the hook\necho\
  \ \"npx lint-staged\" > .husky/pre-commit\n\n# Run on the current staging area (what the hook does)\n\
  npx lint-staged\n\n# Run with output for debugging glob matching\nnpx lint-staged --debug\n\n# Run linters\
  \ one at a time\nnpx lint-staged --concurrent false\n\n# Scope to a range of commits instead of the\
  \ index\nnpx lint-staged --diff 'main...HEAD'\n```\n\n## Configuration (.lintstagedrc.json)\n\n```json\n\
  {\n  \"*.{js,jsx,ts,tsx}\": [\"eslint --fix\", \"prettier --write\"],\n  \"*.{json,md,yml,yaml}\": [\"\
  prettier --write\"],\n  \"*.css\": [\"stylelint --fix\", \"prettier --write\"],\n  \"*.py\": [\"black\
  \ --check\"]\n}\n```\n\n## Testing\n\n```bash\n# Simulate what runs on commit\nnpx lint-staged --diff\
  \ HEAD~1 --debug\n\n# Verify the hook is installed\nnpx husky check\n```\n\n## Best Practices\n\n- Combine\
  \ `--fix`/`--write` linters so the file is fixed before commit\n- Put slow checks (type-check, full\
  \ test suite) in pre-push, not pre-commit\n- Use explicit extensions, never `*` alone, to avoid binary\
  \ files being formatted\n- Keep the staged task list short; 3 steps max per glob\n\n## Capabilities\n\
  \n### lint-staged-hooks\nConfigure and run lint-staged to execute linters and formatters on git-staged\
  \ files\n\n**Commands:**\n- `npx lint-staged --allow-empty`\n- `npx lint-staged --concurrent false`\n\
  - `npx lint-staged --debug`\n- `npx lint-staged --diff 'main...HEAD'`\n- `npx lint-staged --shell`\n\
  \n**Examples:**\n- npx lint-staged\n- npx lint-staged --concurrent false --debug\n- git commit -m 'chore:\
  \ format'  # triggers lint-staged via pre-commit hook"
prompt: Act as lint-staged and handle the task per the instructions.
