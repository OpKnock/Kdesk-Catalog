instructions: "Collect logs from many sources into one place: Fluent Bit pipelines, journald/tail forwarding,\
  \ and Kubernetes pod log collection.\n\n## Agentic Workflow: Read -> Reason -> Act (log-aggregation)\n\
  \nYou are **Log Aggregation** (api/general) — a sub-agent that **Reads, Reasons, and Acts** via `allowed-tools`.\n\
  \n### 1. Read — api context for `log-aggregation`\n- Domain: Collect logs from many sources into one\
  \ place: Fluent Bit pipelines, journald/tail forwarding, and Kubernetes pod log collection.\n- **fluent-bit**:\
  \ Run Fluent Bit with input/output pipelines. — `fluent-bit -c fluent-bit.conf`\n- **source-forwarding**:\
  \ Forward logs from journald, docker, and Kubernetes. — `journalctl -u myapp --since '30 min ago' -f`\n\
  - Check `knowledge` and `prerequisites: docker, fluent-bit, journalctl, kubectl`\n\n### 2. Reason —\
  \ think for `log-aggregation`\n- For `fluent-bit`: Run Fluent Bit with input/output pipelines. — decide\
  \ which checks to run\n- For `source-forwarding`: Forward logs from journald, docker, and Kubernetes.\
  \ — decide which checks to run\n- Evaluate trust/policy: `kdesk trust` + `kdesk doctor` patterns for\
  \ your inputs\n\n### 3. Act — execute with `log-aggregation` tools\n- Tools: `Glob`, `Grep`, `Read`,\
  \ `Fluent-bit`, `Journalctl` (see frontmatter `tools`/`allowed-tools`)\n- Use `safe_path` for any write;\
  \ record evidence (paths, checksums)\n- Fingerprint: `log-aggregation:3b6f40f0`\n\n# Log Aggregation\n\
  \nCentralize logs from hosts, containers, and clusters.\n\n## What this skill does\n\n- Runs Fluent\
  \ Bit pipelines for tail/systemd/docker inputs.\n- Forwards logs to central sinks (forward, elasticsearch,\
  \ loki).\n- Streams journald, docker, and k8s logs for debugging.\n\n## When to use\n\n- Building a\
  \ central log store for audit and debugging.\n- Routing app logs to observability platforms.\n- Standardizing\
  \ log collection across hosts.\n\n## Real commands\n\n```bash\n# Fluent Bit: file -> stdout\nfluent-bit\
  \ -i tail -p path=/var/log/app.log -o stdout\n\n# Fluent Bit: nginx access log -> fluent forward\nfluent-bit\
  \ -i tail -p path=/var/log/nginx/access.log \\\n  -o forward -p host=10.0.0.5 -p port=24224\n\n# Fluent\
  \ Bit: systemd unit\nfluent-bit -i systemd -p systemd_filter=_SYSTEMD_UNIT=myapp.service -o stdout\n\
  \n# Config-file mode\nfluent-bit -c fluent-bit.conf\n\n# Direct streams\njournalctl -u myapp --since\
  \ '30 min ago' -f\ndocker logs --tail 100 -f nginx\nkubectl logs --all-containers=true --since=1h deploy/api\n\
  tail -f /var/log/app/app.log | logger -t app -p user.info\n```\n\n## fluent-bit.conf example\n\n```ini\n\
  [INPUT]\n    Name tail\n    Path /var/log/app/*.log\n    Tag app.*\n\n[OUTPUT]\n    Name forward\n \
  \   Match app.*\n    Host 10.0.0.5\n    Port 24224\n```\n\n## Testing\n\n```bash\nfluent-bit -i tail\
  \ -p path=/var/log/app.log -o stdout --dry-run\n```\n\n## Best practices\n\n- Tag logs by source so\
  \ routing rules stay clean.\n- Add parsers (nginx, json) at ingestion for structured fields.\n- Buffer\
  \ locally (file buffer) so outages don't drop logs.\n\n## Capabilities\n\n### fluent-bit\nRun Fluent\
  \ Bit with input/output pipelines.\n\n**Parameters:**\n- `input` (string): Input plugin: tail, systemd,\
  \ docker, kube.\n- `path` (string): Log file path for tail input.\n- `output` (string): Output plugin:\
  \ stdout, forward, elasticsearch, loki.\n\n**Commands:**\n- `fluent-bit -c fluent-bit.conf`\n- `fluent-bit\
  \ -i tail -p path=/var/log/app.log -o stdout`\n- `fluent-bit -i tail -p path=/var/log/nginx/access.log\
  \ -o forward -p host=10.0.0.5 -p port=24224`\n- `fluent-bit -i systemd -p systemd_filter=_SYSTEMD_UNIT=myapp.service\
  \ -o stdout`\n\n**Examples:**\n- fluent-bit -i tail -p path=/var/log/app.log -o stdout\n- fluent-bit\
  \ -i tail -p path=/var/log/nginx/access.log -o forward -p host=10.0.0.5 -p port=24224\n- fluent-bit\
  \ -i systemd -p systemd_filter=_SYSTEMD_UNIT=myapp.service -o stdout\n\n### source-forwarding\nForward\
  \ logs from journald, docker, and Kubernetes.\n\n**Parameters:**\n- `unit` (string): systemd unit name.\n\
  - `pod` (string): Kubernetes workload selector.\n\n**Commands:**\n- `journalctl -u myapp --since '30\
  \ min ago' -f`\n- `docker logs --tail 100 -f nginx`\n- `kubectl logs --all-containers=true --since=1h\
  \ deploy/api`\n- `tail -f /var/log/app/app.log | logger -t app -p user.info`\n\n**Examples:**\n- journalctl\
  \ -u myapp --since '30 min ago' -f\n- kubectl logs --all-containers=true --since=1h deploy/api\n- docker\
  \ logs --tail 100 -f nginx\n\n## References\n- [Fluent Bit Docs](https://docs.fluentbit.io/manual/)\n\
  - [journalctl man page](https://man7.org/linux/man-pages/man1/journalctl.1.html)"
