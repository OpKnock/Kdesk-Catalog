instructions: "Run and query Grafana Loki: single-binary server, LogQL queries with logcli, promtail shipping,\
  \ and label-based filtering.\n\n## Agentic Workflow: Read -> Reason -> Act (loki)\n\nYou are **Loki**\
  \ (api/general) — a sub-agent that **Reads, Reasons, and Acts** via `allowed-tools`.\n\n### 1. Read\
  \ — api context for `loki`\n- Domain: Run and query Grafana Loki: single-binary server, LogQL queries\
  \ with logcli, promtail shipping, and label-based filtering.\n- **loki-server**: Start a local Loki\
  \ server and check readiness. — `docker run -d --name loki -p 3100:3100 grafana/loki:3.0.0`\n- **logcli-query**:\
  \ Query logs with logcli and the HTTP query API. — `logcli query '{app=\"checkout\"}' --limit 50`\n\
  - Check `knowledge` and `prerequisites: docker, logcli`\n\n### 2. Reason — think for `loki`\n- For `loki-server`:\
  \ Start a local Loki server and check readiness. — decide which checks to run\n- For `logcli-query`:\
  \ Query logs with logcli and the HTTP query API. — decide which checks to run\n- Evaluate trust/policy:\
  \ `kdesk trust` + `kdesk doctor` patterns for your inputs\n\n### 3. Act — execute with `loki` tools\n\
  - Tools: `Glob`, `Grep`, `Read`, `Bash`, `Logcli` (see frontmatter `tools`/`allowed-tools`)\n- Use `safe_path`\
  \ for any write; record evidence (paths, checksums)\n- Fingerprint: `loki:61303c3f`\n\n# Grafana Loki\n\
  \nQuery and operate Grafana Loki, the log aggregation system.\n\n## What this skill does\n\n- Starts\
  \ a local Loki instance (single binary / Docker).\n- Ships logs with promtail and queries with logcli.\n\
  - Runs LogQL stream and metric queries.\n\n## When to use\n\n- Cheap log search without full-text indexing\
  \ overhead.\n- Alerting on log rates (error rate, panic count).\n- Consolidating logs from Kubernetes\
  \ clusters.\n\n## Real commands\n\n```bash\n# Start Loki\ndocker run -d --name loki -p 3100:3100 grafana/loki:3.0.0\n\
  \n# Readiness\ncurl -s http://localhost:3100/ready\n\n# Ship logs with promtail\ndocker run -d --name\
  \ promtail -v /var/log:/var/log:ro \\\n  -v $PWD/promtail-config.yml:/etc/promtail/config.yml \\\n \
  \ grafana/promtail:3.0.0 -config.file=/etc/promtail/config.yml\n\n# logcli: recent lines for a label\
  \ set\nlogcli query '{app=\"checkout\"}' --limit 50\n\n# logcli: filter for 500s in the last hour\n\
  logcli query '{app=\"nginx\"} |= \"500\"' --from=\"1h ago\" --limit 20\n\n# logcli: rate query (lines/sec)\n\
  logcli query rate('{app=\"checkout\"}[5m]') --from=\"1h ago\"\n\n# logcli: list label values\nlogcli\
  \ labels app\n\n# HTTP query API\ncurl -G -s http://localhost:3100/loki/api/v1/query_range \\\n  --data-urlencode\
  \ 'query={app=\"checkout\"}' --data-urlencode 'limit=10'\n```\n\n## promtail config example\n\n```yaml\n\
  server:\n  http_listen_port: 9080\nclients:\n  - url: http://localhost:3100/loki/api/v1/push\nscrape_configs:\n\
  \  - job_name: app\n    static_configs:\n      - targets: [localhost]\n        labels:\n          job:\
  \ app\n          __path__: /var/log/app/*.log\n```\n\n## Testing\n\n```bash\nlogcli query '{job=\"app\"\
  }' --limit 5\n```\n\n## Best practices\n\n- Design labels carefully; cardinality explodes storage and\
  \ query cost.\n- Use LogQL metric queries (rate/count_over_time) for alerting.\n- Keep log lines parseable;\
  \ combine with a parser for structured fields.\n\n## Capabilities\n\n### loki-server\nStart a local\
  \ Loki server and check readiness.\n\n**Parameters:**\n- `version` (string): Loki version tag, e.g.\
  \ 3.0.0.\n- `port` (integer): Loki HTTP port, default 3100.\n\n**Commands:**\n- `docker run -d --name\
  \ loki -p 3100:3100 grafana/loki:3.0.0`\n- `curl -s http://localhost:3100/ready`\n- `curl -s http://localhost:3100/metrics\
  \ | grep loki_logs_ingested_bytes_total | head -3`\n- `docker logs loki --tail=20`\n\n**Examples:**\n\
  - docker run -d --name loki -p 3100:3100 grafana/loki:3.0.0\n- curl -s http://localhost:3100/ready\n\
  - curl -s http://localhost:3100/metrics | grep loki_logs_ingested_bytes_total | head -3\n\n### logcli-query\n\
  Query logs with logcli and the HTTP query API.\n\n**Parameters:**\n- `query` (string): LogQL query.\n\
  - `from` (string): Time range start, e.g. 1h ago.\n- `limit` (integer): Max results.\n\n**Commands:**\n\
  - `logcli query '{app=\"checkout\"}' --limit 50`\n- `logcli query '{app=\"nginx\"} |= \"500\"' --from=\"\
  1h ago\" --limit 20`\n- `logcli query rate('{app=\"checkout\"}[5m]') --from=\"1h ago\"`\n- `curl -G\
  \ -s http://localhost:3100/loki/api/v1/query_range --data-urlencode 'query={app=\"checkout\"}' --data-urlencode\
  \ 'limit=10'`\n- `logcli labels app`\n\n**Examples:**\n- logcli query '{app=\"nginx\"} |= \"500\"' --from=\"\
  1h ago\" --limit 20\n- logcli query rate('{app=\"checkout\"}[5m]') --from=\"1h ago\"\n- curl -G -s http://localhost:3100/loki/api/v1/query_range\
  \ --data-urlencode 'query={app=\"checkout\"}' --data-urlencode 'limit=10'\n\n## References\n- [Grafana\
  \ Loki Docs](https://grafana.com/docs/loki/)\n- [LogQL Reference](https://grafana.com/docs/loki/latest/logql/)\n\
  - [Promtail](https://grafana.com/docs/loki/latest/send-data/promtail/)"
