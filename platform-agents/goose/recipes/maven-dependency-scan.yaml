title: Maven Dependency Scan
description: Scans Maven projects for known vulnerable dependencies using the OWASP Dependency-Check Maven
  plugin.
version: 2.0.0
instructions: "# Maven Dependency Scan\n\nScans Maven projects for known vulnerable dependencies using\
  \ the OWASP Dependency-Check Maven plugin.\n\n## Instructions\n\n# Maven Dependency Scan\n\nUses OWASP\
  \ Dependency-Check to identify known vulnerabilities (CVE) in every direct\nand transitive Maven dependency.\n\
  \n## When to Use\n\n- Scanning a Maven project before release\n- Enforcing a CVSS threshold gate in\
  \ CI\n- Checking a dependency tree for CVEs after a version bump\n\n## Real Commands\n\n```bash\n# Basic\
  \ scan (writes report to target/dependency-check-report.html)\nmvn org.owasp:dependency-check-maven:check\n\
  \n# Fail the build on CVSS >= 7, all report formats\nmvn dependency-check:check -DfailBuildOnCVSS=7\
  \ -Dformat=ALL\n\n# Update the local NVD cache only (no scan)\nmvn dependency-check:update-only -DnvdApiKey=$NVD_API_KEY\n\
  \n# Aggregate across all modules of a multi-module build\nmvn dependency-check:aggregate -Dformat=JSON\
  \ -DoutputDirectory=target/dc\n\n# With suppression file for known false positives\nmvn dependency-check:check\
  \ -DsuppressionFiles=suppressions.xml\n```\n\n## Suppressions Example (suppressions.xml)\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<suppressions xmlns=\"https://jeremylong.github.io/DependencyCheck/dependency-suppression.1.3.xsd\"\
  >\n  <suppress>\n    <notes>Only affects Windows builds</notes>\n    <packageUrl regex=\"true\">^pkg:maven/.*</packageUrl>\n\
  \    <cve>CVE-2023-99999</cve>\n  </suppress>\n</suppressions>\n```\n\n## Best Practices\n\n- Export\
  \ an NVD API key (`-DnvdApiKey`) to avoid rate-limit failures\n- Start with `-DfailBuildOnCVSS=11` to\
  \ baseline, then tighten to 7\n- Keep suppressions file reviewed and commented\n- Cache reports (`-DoutputDirectory=target/dc`)\
  \ for auditing\n\n## Example Response\n\nA scan that finds a vulnerable log4j transitive dep reports\
  \ the exact package\ncoordinates, the CVE ID, CVSS score, and the affected version range, then the agent\n\
  recommends the upgraded version.\n\n## Capabilities\n\n### dependency-check\nRun OWASP Dependency-Check\
  \ against Maven projects and fail builds on high-CVSS findings\n\n**Commands:**\n- `mvn org.owasp:dependency-check-maven:check`\n\
  - `mvn dependency-check:check -DfailBuildOnCVSS=7 -Dformat=ALL`\n- `mvn dependency-check:update-only`\n\
  - `mvn dependency-check:aggregate -Dformat=JSON`\n- `mvn dependency-check:check -DnvdApiKey=$NVD_API_KEY\
  \ -DsuppressionFiles=suppressions.xml`\n\n**Examples:**\n- mvn org.owasp:dependency-check-maven:check\
  \ -Dformat=HTML\n- mvn dependency-check:aggregate -Dformat=ALL -DoutputDirectory=target/dc\n- mvn verify\
  \ -Ddependency-check.failBuildOnCVSS=8"
prompt: Act as Maven Dependency Scan and handle the task per the instructions.
