title: Metrics Cardinality
description: 'Diagnose and fix high-cardinality metric problems in Prometheus: find exploding label values,
  top series, and identify offending scrape targets.'
version: 2.0.0
instructions: "# Metrics Cardinality\n\nDiagnose and fix high-cardinality metric problems in Prometheus:\
  \ find exploding label values, top series, and identify offending scrape targets.\n\n## Instructions\n\
  \n# Metrics Cardinality\n\nHigh cardinality (too many unique label-value combinations) is the #1 cause\
  \ of Prometheus memory and disk exhaustion.\n\n## What this skill does\n\n- Analyzes the TSDB to find\
  \ which metric names generate the most series\n- Lists the label value counts driving cardinality (e.g.\
  \ per-endpoint, per-user)\n- Recommends fixes: relabeling, metric redesign, or aggregation\n\n## When\
  \ to use\n\n- Prometheus memory spikes or OOM kills on `metric_relabel_configs` host\n- Dashboards are\
  \ slow and `count by` queries time out\n- An endpoint suddenly creates millions of series\n\n## Real\
  \ commands\n\n```bash\n# Analyze whole TSDB for cardinality report\npromtool tsdb analyze /var/lib/prometheus/metrics2/\n\
  \n# List all series for a metric\npromtool tsdb series --match 'http_requests_total{status=~\".+\"}'\
  \ /var/lib/prometheus/metrics2/\n\n# Top 20 metric names by series count (HTTP API)\ncurl -g 'http://localhost:9090/api/v1/query?query=topk(20,count%20by%20(__name__)({__name__=~\"\
  .+\"}))'\n\n# Which endpoints/methods dominate a metric\ncurl -g 'http://localhost:9090/api/v1/query?query=count%20by%20(endpoint,%20method)(http_requests_total)'\n\
  ```\n\n## Fixing it\n\n```yaml\n# Drop the offending label at scrape time\nmetric_relabel_configs:\n\
  - source_labels: [user_id]\n  regex: '.*'\n  action: drop\n\n# Or aggregate away the cardinality in\
  \ recording rules\n- record: job:http_requests_total:rate5m\n  expr: sum(rate(http_requests_total[5m]))\
  \ by (job)\n```\n\n## Best practices\n\n- Limit label values that are unbounded (user IDs, emails, IPs)\n\
  - Keep cardinality per metric under ~10k series\n- Set `--storage.tsdb.retention.time` and alert on\
  \ `prometheus_tsdb_head_series`\n\n## Capabilities\n\n### cardinality-diagnosis\nAnalyze a Prometheus\
  \ TSDB to find high-cardinality series, top label combinations, and memory-heavy metrics.\n\n**Commands:**\n\
  - `promtool tsdb analyze --help`\n- `promtool tsdb analyze /var/lib/prometheus/metrics2/`\n- `promtool\
  \ tsdb series --match '{__name__=~\".+\"}' /var/lib/prometheus/metrics2/`\n- `curl -g 'http://localhost:9090/api/v1/query?query=topk(20,count%20by%20(__name__)({__name__%3D~%22.%2B%22}))'`\n\
  - `curl -g 'http://localhost:9090/api/v1/query?query=count%20by%20(endpoint%2C%20method)(http_requests_total)'`\n\
  \n**Examples:**\n- promtool tsdb analyze /var/lib/prometheus/metrics2/\n- curl -g 'http://localhost:9090/api/v1/query?query=topk(10,count%20by%20(__name__)({__name__=~\"\
  .+\"}))'\n- promtool tsdb series --match 'http_requests_total{status=~\".*\"}' /var/lib/prometheus/metrics2/"
prompt: Act as Metrics Cardinality and handle the task per the instructions.
