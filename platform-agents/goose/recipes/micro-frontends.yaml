title: micro-frontends
description: 'Architects micro-frontend platforms with single-spa, Module Federation, and Nx workspaces:
  composition, sharing, and independent deploys.'
version: 2.0.0
instructions: "# micro-frontends\n\nArchitects micro-frontend platforms with single-spa, Module Federation,\
  \ and Nx workspaces: composition, sharing, and independent deploys.\n\n## Instructions\n\n# Micro-Frontends\n\
  \nCompose independent frontend apps into one product.\n\n## When to Use\n\n- Multiple teams shipping\
  \ one web product independently\n- Migrating a monolith UI in slices\n- Sharing a shell, auth, and navigation\n\
  \n## single-spa composition\n\n```bash\nnpx create-single-spa --moduleType root-config\nnpx create-single-spa\
  \ --moduleType app-parcel --framework react\n```\n\nRoot config registers apps with lifecycle functions\
  \ (bootstrap/mount/unmount).\n\n## Module Federation sharing\n\n```js\n// webpack config of shell\n\
  new ModuleFederationPlugin({\n  name: 'shell',\n  remotes: { orders: 'orders@http://localhost:9001/remoteEntry.js'\
  \ },\n  shared: { react: { singleton: true } }\n});\n```\n\nSingletons prevent duplicate React instances\
  \ - version them carefully.\n\n## Nx monorepo management\n\n```bash\nnpx nx graph\nnpx nx run-many --target=test\
  \ --all\nnpx nx affected:build --base=main\n```\n\nOnly rebuild what changed using `affected`.\n\n##\
  \ Contracts between apps\n\n- Shared props: user, locale, navigation state.\n- Routing: each app owns\
  \ its routes; the shell owns top-level segments.\n- Styling: design tokens via shared packages, not\
  \ global CSS.\n- Events: pub/sub on window or a shared bus, versioned payloads.\n\n## Best practices\n\
  \n- Version and document the integration contract.\n- Every app deploys independently; no release trains.\n\
  - Shared UI in a versioned package, not duplicated code.\n- E2E the shell + key apps in a single smoke\
  \ suite.\n\n## Testing\n\n```bash\nnpx nx affected:test --base=origin/main\n```\n\nRun integration smoke\
  \ tests across the composed shell weekly.\n\n## Capabilities\n\n### single-spa\nBuild and register micro-frontend\
  \ applications.\n\n**Commands:**\n- `npx create-single-spa --moduleType root-config`\n- `npx create-single-spa\
  \ --moduleType app-parcel`\n- `npm run build -- --watch`\n- `npx serve -s dist -l 9000`\n- `npm run\
  \ importmap`\n\n**Examples:**\n- npx create-single-spa --moduleType app-parcel --framework react\n-\
  \ npx create-single-spa --moduleType root-config --dir root\n- npm run build && npx serve -s dist -l\
  \ 8080\n\n### nx\nManage monorepo builds and dependencies with Nx.\n\n**Commands:**\n- `npx nx graph`\n\
  - `npx nx run shell:build --configuration=production`\n- `npx nx affected:build --base=main`\n- `npx\
  \ nx run-many --target=test --all`\n- `npx nx migrate latest`\n\n**Examples:**\n- npx nx affected:test\
  \ --base=origin/main\n- npx nx build shell --with-deps\n- npx nx run-many --target=lint --parallel=3"
prompt: Act as micro-frontends and handle the task per the instructions.
