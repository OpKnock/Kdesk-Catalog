title: Micronaut Kotlin
description: 'Build Micronaut applications with the Kotlin language: scaffolding, controllers, coroutines,
  and Gradle/Kotlin DSL setup.'
version: 2.0.0
instructions: "# Micronaut Kotlin\n\nBuild Micronaut applications with the Kotlin language: scaffolding,\
  \ controllers, coroutines, and Gradle/Kotlin DSL setup.\n\n## Instructions\n\n# Micronaut Kotlin\n\n\
  Micronaut with Kotlin gives compile-time dependency injection and first-class coroutines support.\n\n\
  ## What this skill does\n\n- Scaffolds Kotlin Micronaut projects (Gradle or Maven)\n- Adds controllers,\
  \ services and clients in Kotlin\n- Uses kapt/ksp for compile-time DI processing\n\n## When to use\n\
  \n- Starting a new Kotlin JVM microservice\n- Adding coroutine-based endpoints to an existing Micronaut\
  \ app\n- Configuring Kotlin-specific features (kotlinx.serialization, ksp)\n\n## Real commands\n\n```bash\n\
  # Create Kotlin app with Gradle\nmn create-app com.example.demo --lang kotlin --build gradle\n\n# Add\
  \ a controller\nmn create-controller com.example.HelloController --lang kotlin\n\n# Run and test\n./gradlew\
  \ run\n./gradlew test\n\n# CLI application (picocli)\nmn create-cli-app cli-app --lang kotlin\n```\n\
  \n## Coroutines controller\n\n```kotlin\n@Controller(\"/hello\")\nclass HelloController {\n    @Get(\"\
  /\") \n    suspend fun hello(): String = coroutineScope { \"Hello from Kotlin\" }\n}\n```\n\n## build.gradle.kts\
  \ essentials\n\n```kotlin\nplugins {\n    id(\"org.jetbrains.kotlin.jvm\") version \"1.9.22\"\n    id(\"\
  io.micronaut.library\") version \"4.2.1\"\n}\n```\n\n## Best practices\n\n- Prefer KSP over kapt (`mn\
  \ create-app --features kotlin,ksp`)\n- Use `suspend` functions for non-blocking endpoints\n- Test with\
  \ `./gradlew test` and MicronautTest annotation\n\n## Capabilities\n\n### micronaut-kotlin-scaffold\n\
  Scaffold Kotlin Micronaut apps and services with the Micronaut CLI and manage the build.\n\n**Commands:**\n\
  - `mn create-app com.example.demo --lang kotlin --build gradle`\n- `mn create-controller com.example.HelloController\
  \ --lang kotlin`\n- `./gradlew run`\n- `./gradlew test`\n- `mn create-cli-app cli-app --lang kotlin`\n\
  \n**Examples:**\n- mn create-app com.example.orders --lang kotlin --features kapt\n- ./gradlew run\n\
  - ./gradlew test --tests com.example.HelloControllerTest"
prompt: Act as Micronaut Kotlin and handle the task per the instructions.
