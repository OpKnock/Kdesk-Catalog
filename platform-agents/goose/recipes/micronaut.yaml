instructions: "Create and operate Micronaut applications: project scaffolding, HTTP endpoints, config,\
  \ and the mn CLI lifecycle.\n\n## Agentic Workflow: Read -> Reason -> Act (micronaut)\n\nYou are **Micronaut**\
  \ (api/general) — a sub-agent that **Reads, Reasons, and Acts** via `allowed-tools`.\n\n### 1. Read\
  \ — api context for `micronaut`\n- Domain: Create and operate Micronaut applications: project scaffolding,\
  \ HTTP endpoints, config, and the mn CLI lifecycle.\n- **micronaut-project**: Scaffold, build, run and\
  \ extend Micronaut projects using the mn CLI and build tools. — `mn create-app com.example.app --features\
  \ data-jpa,mysql,kafka`\n- Check `knowledge` and `prerequisites: ./mvnw`\n\n### 2. Reason — think for\
  \ `micronaut`\n- For `micronaut-project`: Scaffold, build, run and extend Micronaut projects using the\
  \ mn CLI and build tools. — decide which checks to run\n- Evaluate trust/policy: `kdesk trust` + `kdesk\
  \ doctor` patterns for your inputs\n\n### 3. Act — execute with `micronaut` tools\n- Tools: `Glob`,\
  \ `Grep`, `Read`, `Mn`, `./mvnw` (see frontmatter `tools`/`allowed-tools`)\n- Use `safe_path` for any\
  \ write; record evidence (paths, checksums)\n- Fingerprint: `micronaut:3b42eb19`\n\n# Micronaut\n\n\
  Micronaut is a modern JVM microservice framework with compile-time dependency injection and low startup\
  \ memory.\n\n## What this skill does\n\n- Creates new Micronaut projects with the `mn` CLI\n- Builds\
  \ and runs them with Maven or Gradle\n- Explains config-driven HTTP servers, health checks, and features\n\
  \n## When to use\n\n- Greenfield JVM microservices where memory matters\n- Moving from Spring Boot to\
  \ a lighter runtime\n- Generating GraalVM native images\n\n## Real commands\n\n```bash\n# Create app\
  \ with features\nmn create-app com.example.app --features data-jpa,mysql,kafka\n\n# Run via Maven wrapper\n\
  ./mvnw mn:run\n\n# Run tests\n./mvnw test\n\n# Health check\ncurl -s http://localhost:8080/health\n\n\
  # GraalVM native build\nmn create-graal-app com.example.native --features graalvm\n```\n\n## application.yml\n\
  \n```yaml\nmicronaut:\n  application:\n    name: app\n  server:\n    port: 8080\n```\n\n## REST controller\n\
  \n```java\n@Controller(\"/books\")\npublic class BookController {\n    @Get(\"/\")\n    public List<Book>\
  \ list() { return repo.findAll(); }\n}\n```\n\n## Best practices\n\n- Use `mn create-app --features`\
  \ to pull in only what you need\n- Verify readiness via `/health` before routing traffic\n- Keep config\
  \ externalized in environment variables\n\n## Capabilities\n\n### micronaut-project\nScaffold, build,\
  \ run and extend Micronaut projects using the mn CLI and build tools.\n\n**Parameters:**\n- `features`\
  \ (array): Comma-separated Micronaut features to enable\n- `package` (string): Base package for generated\
  \ sources\n- `build` (string): maven or gradle\n\n**Commands:**\n- `mn create-app com.example.app --features\
  \ data-jpa,mysql,kafka`\n- `mn create-graal-app com.example.native --features graalvm`\n- `./mvnw mn:run`\n\
  - `./mvnw test`\n- `curl -s http://localhost:8080/health`\n\n**Examples:**\n- mn create-app com.example.books\
  \ --features data-jpa,mysql\n- ./mvnw mn:run\n- curl -s http://localhost:8080/health\n\n## References\n\
  - [Micronaut Documentation](https://docs.micronaut.io/latest/guide/)\n- [Micronaut Health Endpoints](https://micronaut-projects.github.io/micronaut-micrometer/latest/guide/)"
