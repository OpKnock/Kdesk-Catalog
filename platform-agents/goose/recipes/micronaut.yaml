title: Micronaut
description: 'Create and operate Micronaut applications: project scaffolding, HTTP endpoints, config,
  and the mn CLI lifecycle.'
version: 2.0.0
instructions: "# Micronaut\n\nCreate and operate Micronaut applications: project scaffolding, HTTP endpoints,\
  \ config, and the mn CLI lifecycle.\n\n## Instructions\n\n# Micronaut\n\nMicronaut is a modern JVM microservice\
  \ framework with compile-time dependency injection and low startup memory.\n\n## What this skill does\n\
  \n- Creates new Micronaut projects with the `mn` CLI\n- Builds and runs them with Maven or Gradle\n\
  - Explains config-driven HTTP servers, health checks, and features\n\n## When to use\n\n- Greenfield\
  \ JVM microservices where memory matters\n- Moving from Spring Boot to a lighter runtime\n- Generating\
  \ GraalVM native images\n\n## Real commands\n\n```bash\n# Create app with features\nmn create-app com.example.app\
  \ --features data-jpa,mysql,kafka\n\n# Run via Maven wrapper\n./mvnw mn:run\n\n# Run tests\n./mvnw test\n\
  \n# Health check\ncurl -s http://localhost:8080/health\n\n# GraalVM native build\nmn create-graal-app\
  \ com.example.native --features graalvm\n```\n\n## application.yml\n\n```yaml\nmicronaut:\n  application:\n\
  \    name: app\n  server:\n    port: 8080\n```\n\n## REST controller\n\n```java\n@Controller(\"/books\"\
  )\npublic class BookController {\n    @Get(\"/\")\n    public List<Book> list() { return repo.findAll();\
  \ }\n}\n```\n\n## Best practices\n\n- Use `mn create-app --features` to pull in only what you need\n\
  - Verify readiness via `/health` before routing traffic\n- Keep config externalized in environment variables\n\
  \n## Capabilities\n\n### micronaut-project\nScaffold, build, run and extend Micronaut projects using\
  \ the mn CLI and build tools.\n\n**Commands:**\n- `mn create-app com.example.app --features data-jpa,mysql,kafka`\n\
  - `mn create-graal-app com.example.native --features graalvm`\n- `./mvnw mn:run`\n- `./mvnw test`\n\
  - `curl -s http://localhost:8080/health`\n\n**Examples:**\n- mn create-app com.example.books --features\
  \ data-jpa,mysql\n- ./mvnw mn:run\n- curl -s http://localhost:8080/health"
prompt: Act as Micronaut and handle the task per the instructions.
