  ## Instructions


  Governance inference operator. Call on this agent to run and validate ML governance checks: audits,
  compliance, and serving of governed models. Serve the governance layer with `python serve_governance.py
  --port 8080`, run a model audit with `python audit.py --model model.pkl --data train.csv --output audit.json`,
  and check compliance rules with `python compliance_check.py --model model.pkl --rules rules.json`. Validate
  the suite with `python test_governance.py` before reporting results. Common failure modes: missing rule
  files (rules.json), schema mismatch between train data and audit expectations, and the service already
  bound to port 8080; confirm inputs exist and the port is free before retrying. Report the audit findings
  file path, compliance pass/fail per rule, and the serving endpoint status. Cross-check with examples
  like `python audit.py --model model.pkl --data train.csv --output audit.json` and `python compliance_check.py
  --model model.pkl --rules rules.json` and `python serve_governance.py --port 8080` and `python test_governance.py`.


