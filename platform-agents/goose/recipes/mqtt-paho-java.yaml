  \ (paths, checksums)\n- Fingerprint: `mqtt-paho-java:df0b7bd6`\n\n# Paho MQTT Java\n\nThe Eclipse Paho\
  \ Java client (org.eclipse.paho.client.mqttv3) is the standard MQTT client for JVM apps.\n\n## What\
  \ this skill does\n\n- Configures the Maven dependency\n- Writes MqttClient publish/subscribe code\n\
  - Covers persistent sessions and async callbacks\n\n## When to use\n\n- JVM services publishing events\
  \ to MQTT\n- IoT backends and edge gateways in Java\n\n## Real commands\n\n```bash\n# Verify the dependency\
  \ resolves\nmvn dependency:tree -Dincludes=org.eclipse.paho\n\n# Build and run\nmvn compile\nmvn exec:java\
  \ -Dexec.mainClass=com.example.Publisher\nmvn package\n```\n\n## Publish code\n\n```java\nMqttClient\
  \ client = new MqttClient(\"tcp://localhost:1883\", \"java-pub\");\nclient.connect();\nclient.publish(\"\
  sensors/temp\", new MqttMessage(\"21.5\".getBytes()));\nclient.disconnect();\n```\n\n## Callbacks for\
  \ async\n\n```java\nclient.setCallback(new MqttCallback() {\n    public void messageArrived(String topic,\
  \ MqttMessage m) { /* handle */ }\n    public void connectionLost(Throwable c) { client.reconnect();\
  \ }\n    public void deliveryComplete(IMqttDeliveryToken t) { }\n});\n```\n\n## pom.xml dependency\n\
  \n```xml\n<dependency>\n  <groupId>org.eclipse.paho</groupId>\n  <artifactId>org.eclipse.paho.client.mqttv3</artifactId>\n\
  \  <version>1.2.5</version>\n</dependency>\n```\n\n## Best practices\n\n- Use `MqttConnectOptions#setCleanSession(false)`\
  \ for durable subscriptions\n- Reconnect with exponential backoff in connectionLost\n- Match MQTT QoS\
  \ with your reliability requirements\n\n## Capabilities\n\n### paho-java-client\nAdd the paho.mqttv3\
  \ dependency, write synchronous/async clients and manage connections in Maven projects.\n\n**Parameters:**\n\
  - `version` (string): paho.mqttv3 version, e.g. 1.2.5\n- `main_class` (string): Java main class to run\
  \ via exec plugin\n- `broker_url` (string): tcp:// or ssl:// broker URL\n\n**Commands:**\n- `mvn dependency:tree`\n\
  - `mvn compile`\n- `mvn package`\n- `mvn exec:java -Dexec.mainClass=com.example.Publisher`\n- `curl\
  \ -s https://repo1.maven.org/maven2/org/eclipse/paho/org.eclipse.paho.client.mqttv3/maven-metadata.xml`\n\
  \n**Examples:**\n- mvn dependency:tree -Dincludes=org.eclipse.paho\n- mvn package -DskipTests\n- mvn\
  \ exec:java -Dexec.mainClass=com.example.Subscriber\n\n## References\n- [Paho Java client page](https://www.eclipse.org/paho/index.php?page=clients/java/index.php)\n\
