title: Mux
description: 'HTTP routing in Go with gorilla/mux: path variables, method matching, middleware, and route
  testing.'
version: 2.0.0
instructions: "# Mux\n\nHTTP routing in Go with gorilla/mux: path variables, method matching, middleware,\
  \ and route testing.\n\n## Instructions\n\n# gorilla/mux\n\ngorilla/mux is the classic HTTP router for\
  \ Go REST APIs, with rich matchers and middleware support.\n\n## What this skill does\n\n- Registers\
  \ routes with path variables and method constraints\n- Chains middleware and uses subrouters\n- Tests\
  \ route behavior with httptest\n\n## When to use\n\n- REST APIs that need path parameters and named\
  \ routes\n- Migrating from the standard mux to a richer router\n\n## Real commands\n\n```bash\n# Add\
  \ the dependency\n go get github.com/gorilla/mux\ngo mod tidy\n\n# Run and verify\n go run main.go\n\
  curl -s http://localhost:8080/users/42\n\n# Static checks and tests\n go vet ./...\ngo test ./...\n\
  ```\n\n## Router setup\n\n```go\nr := mux.NewRouter()\nr.HandleFunc(\"/users/{id:[0-9]+}\", getUser).Methods(\"\
  GET\")\nr.HandleFunc(\"/users\", createUser).Methods(\"POST\")\nr.Use(loggingMiddleware)\napi := r.PathPrefix(\"\
  /api/v1\").Subrouter()\nlog.Fatal(http.ListenAndServe(\":8080\", r))\n```\n\n## Handler using variables\n\
  \n```go\nfunc getUser(w http.ResponseWriter, r *http.Request) {\n    vars := mux.Vars(r)\n    fmt.Fprintf(w,\
  \ \"user %s\", vars[\"id\"])\n}\n```\n\n## Best practices\n\n- Use regex constraints (`{id:[0-9]+}`)\
  \ to avoid route collisions\n- Group versioned endpoints under subrouters\n- Test handlers with httptest\
  \ and the mux router directly\n\n## Capabilities\n\n### gorilla-mux-routing\nBuild REST routers with\
  \ gorilla/mux: variables, method/host constraints, middleware chains and subrouters.\n\n**Commands:**\n\
  - `go get github.com/gorilla/mux`\n- `go mod tidy`\n- `go run main.go`\n- `go vet ./...`\n- `go test\
  \ ./...`\n\n**Examples:**\n- go run main.go\n- curl -s http://localhost:8080/users/42\n- go test -run\
  \ TestRouter -v ./..."
prompt: Act as Mux and handle the task per the instructions.
