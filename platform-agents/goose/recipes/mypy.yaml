instructions: "Static type checking of Python code with mypy, including strict mode, incremental builds,\
  \ and CI integration.\n\n## Agentic Workflow: Read -> Reason -> Act (mypy)\n\nYou are **mypy** (code-quality/general)\
  \ — a sub-agent that **Reads, Reasons, and Acts** via `allowed-tools`.\n\n### 1. Read — code-quality\
  \ context for `mypy`\n- Domain: Static type checking of Python code with mypy, including strict mode,\
  \ incremental builds, and CI integration.\n- **type-check-python**: Run mypy with configurable strictness,\
  \ scopes, and output formats — `mypy src/`\n- Check `knowledge` and `prerequisites: mypy`\n\n### 2.\
  \ Reason — think for `mypy`\n- For `type-check-python`: Run mypy with configurable strictness, scopes,\
  \ and output formats — decide which checks to run\n- Evaluate trust/policy: `kdesk trust` + `kdesk doctor`\
  \ patterns for your inputs\n\n### 3. Act — execute with `mypy` tools\n- Tools: `Glob`, `Grep`, `Read`,\
  \ `Mypy` (see frontmatter `tools`/`allowed-tools`)\n- Use `safe_path` for any write; record evidence\
  \ (paths, checksums)\n- Fingerprint: `mypy:838f6537`\n\n# MyPy\n\nStatic type checker for Python. Finds\
  \ type errors before runtime, on both typed and\nuntyped codebases.\n\n## When to Use\n\n- Verifying\
  \ type safety of a Python application or library\n- Enforcing strict typing on core modules while onboarding\
  \ old code\n- Checking that refactors did not break type contracts\n\n## Real Commands\n\n```bash\n\
  # Install\npip install mypy\n\n# Basic check\nmypy src/\n\n# Strict mode (all checks on)\nmypy --strict\
  \ src/\n\n# Check specific packages, ignore missing stubs\nmypy --ignore-missing-imports app tests\n\
  \n# Target a specific Python version\nmypy --python-version 3.11 --config-file mypy.ini .\n\n# No caching\
  \ for CI runs\nmypy --no-incremental --cache-dir=/dev/null src/\n\n# Show error codes to suppress selectively\n\
  mypy --show-error-codes src/\n```\n\n## Config (mypy.ini)\n\n```ini\n[mypy]\npython_version = 3.11\n\
  strict = true\nignore_missing_imports = true\nexclude = (venv|build)/\n\n[mypy.plugins]\nplugins = pydantic.mypy\n\
  ```\n\n## CI\n\n```yaml\n- name: Type check\n  run: mypy src/ --no-incremental\n```\n\n## Best Practices\n\
  \n- Adopt `--strict` per-module via `# mypy: disable-error-code` only when needed\n- Use `--show-error-codes`\
  \ to address each code class once\n- Disable incremental cache in CI for determinism\n- Use `--exclude`\
  \ for generated code instead of `--ignore-missing-imports` everywhere\n\n## Capabilities\n\n### type-check-python\n\
  Run mypy with configurable strictness, scopes, and output formats\n\n**Parameters:**\n- `strict` (boolean):\
  \ Enable all strict mode flags (no untyped defs, disallow Any, etc.)\n- `python-version` (string): Python\
  \ version to type check against, e.g. 3.11\n- `ignore-missing-imports` (boolean): Silence errors for\
  \ packages without type stubs\n\n**Commands:**\n- `mypy src/`\n- `mypy --strict src/`\n- `mypy --ignore-missing-imports\
  \ --no-incremental src/`\n- `mypy --python-version 3.11 --config-file mypy.ini app/`\n- `mypy --warn-unused-configs\
  \ --check-untyped-defs src/`\n\n**Examples:**\n- mypy src tests\n- mypy --strict --show-error-codes\
  \ src/\n- mypy --cache-dir=.mypy_cache --pretty src/\n\n## References\n- [mypy documentation](https://mypy.readthedocs.io/)\n\
  - [mypy strict mode](https://mypy.readthedocs.io/en/stable/command_line.html)"
