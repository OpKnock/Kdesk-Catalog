  \ `nats-client-go:943311d3`\n\n# NATS Go Client\n\nnats.go is the official Go client for NATS, covering\
  \ core pub/sub, JetStream and KV.\n\n## What this skill does\n\n- Connects to NATS with options (reconnect,\
  \ credentials)\n- Publishes/subscribes and does request-reply\n- Uses queue groups for worker distribution\n\
  \n## When to use\n\n- Go microservices with NATS messaging\n- Replacing HTTP polling with NATS request-reply\n\
  \n## Real commands\n\n```bash\n# Dependency\n go get github.com/nats-io/nats.go\ngo mod tidy\n\n# Run\
  \ and verify\n go run main.go\ngo vet ./...\ngo test ./...\n```\n\n## Publish / subscribe\n\n```go\n\
  nc, _ := nats.Connect(\"nats://localhost:4222\")\nnc.Publish(\"orders.created\", []byte(`{\"id\":1}`))\n\
  sub, _ := nc.Subscribe(\"orders.*\", func(m *nats.Msg) {\n    fmt.Printf(\"received: %s\\n\", m.Data)\n\
  })\nsub.Unsubscribe()\n```\n\n## Request-reply\n\n```go\nresp, err := nc.Request(\"service.echo\", []byte(\"\
  ping\"), 2*time.Second)\nnc.Subscribe(\"service.echo\", func(m *nats.Msg) { m.Respond([]byte(\"pong\"\
  )) })\n```\n\n## Queue group\n\n```go\nnc.QueueSubscribe(\"tasks\", \"workers\", handler)\n```\n\n##\
  \ Best practices\n\n- Always check errors from Publish/Subscribe\n- Set `nats.MaxReconnects(-1)` for\
  \ resilient services\n- Use request-reply timeouts matching SLA\n\n## Capabilities\n\n### nats-go-client\n\
