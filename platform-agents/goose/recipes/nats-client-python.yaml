title: Nats Client Python
description: 'NATS clients in Python with nats-py: async connect, pub/sub, JetStream consumers, and request-reply.'
version: 2.0.0
instructions: "# Nats Client Python\n\nNATS clients in Python with nats-py: async connect, pub/sub, JetStream\
  \ consumers, and request-reply.\n\n## Instructions\n\n# NATS Python Client\n\nnats-py is the official\
  \ asyncio-based NATS client for Python.\n\n## What this skill does\n\n- Connects asynchronously with\
  \ reconnect policies\n- Publishes/subscribes and does request-reply\n- Consumes from JetStream streams\n\
  \n## When to use\n\n- Python data pipelines and workers\n- Async services in the NATS ecosystem\n\n\
  ## Real commands\n\n```bash\npip install nats-py\npython3 -m pip show nats-py\npython3 pub.py\npython3\
  \ sub.py\n```\n\n## Subscribe\n\n```python\nimport asyncio, nats\n\nasync def main():\n    nc = await\
  \ nats.connect(\"nats://localhost:4222\")\n    sub = await nc.subscribe(\"orders.*\")\n    async for\
  \ msg in sub:\n        print(f\"{msg.subject}: {msg.data.decode()}\")\n        await msg.ack()\n\nasyncio.run(main())\n\
  ```\n\n## Publish + request\n\n```python\nawait nc.publish(\"orders.created\", b\"{\\\"id\\\":1}\")\n\
  resp = await nc.request(\"service.echo\", b\"ping\", timeout=2)\nprint(resp.data)\n```\n\n## JetStream\
  \ consumer\n\n```python\njs = nc.jetstream()\npull = await js.pull_subscribe(\"orders\", \"worker\"\
  )\nmsgs = await pull.fetch(10)\n```\n\n## Best practices\n\n- Use `await nc.drain()` on shutdown to\
  \ flush pending\n- Prefer async contexts; avoid blocking calls in the loop\n- Use queue groups for competing\
  \ consumers\n\n## Capabilities\n\n### nats-python-client\nInstall nats-py and write async Python clients\
  \ for core NATS and JetStream.\n\n**Commands:**\n- `pip install nats-py`\n- `python3 -m pip show nats-py`\n\
  - `python3 pub.py`\n- `python3 sub.py`\n- `python3 -c \"import nats; print(nats.__version__)\"`\n\n\
  **Examples:**\n- python3 sub.py\n- python3 -m asyncio\n- python3 req.py"
prompt: Act as Nats Client Python and handle the task per the instructions.
