title: Nats Security
description: 'Secure NATS deployments: operators/accounts/users with nsc, credentials files, TLS, and
  authorization permissions.'
version: 2.0.0
instructions: "# Nats Security\n\nSecure NATS deployments: operators/accounts/users with nsc, credentials\
  \ files, TLS, and authorization permissions.\n\n## Instructions\n\n# NATS Security\n\nNATS uses JWT-based\
  \ identity: an operator owns accounts, accounts contain users, users hold credentials.\n\n## What this\
  \ skill does\n\n- Bootstraps the nsc operator/account/user hierarchy\n- Grants pub/sub permissions per\
  \ user\n- Connects clients with .creds files and nats context\n\n## When to use\n\n- Multi-tenant NATS\
  \ deployments\n- Enforcing least-privilege per service\n- TLS-encrypted NATS traffic\n\n## Real commands\n\
  \n```bash\n# Operator and account\nnsc add operator --generate-signing-key --sys\nnsc add account prod\n\
  \n# User with permissions\nnsc add user api --allow-pub 'orders.*' --allow-sub 'orders.>'\n\n# Export\
  \ creds and create a context\nnsc describe user api\nnats context save prod --server nats://localhost:4222\
  \ --creds ~/.nsc/creds/prod/api/user.creds\n\n# Use it\nnats --creds user.creds pub orders.created '{\"\
  id\":1}'\n```\n\n## Server config with JWT\n\n```conf\noperator: /etc/nats/op.jwt\nsystem_account: SYS\n\
  resolver: {\n  type: full\n  dir: /var/lib/nats/jwt\n}\n```\n\n## Best practices\n\n- Never share operator\
  \ keys; keep them offline\n- Grant narrow subject permissions per service\n- Rotate user credentials\
  \ by creating new users in nsc\n\n## Capabilities\n\n### nats-security-identity\nCreate NATS operator/account/user\
  \ hierarchies with nsc and connect using credentials files.\n\n**Commands:**\n- `nsc add operator --generate-signing-key\
  \ --sys`\n- `nsc add account prod`\n- `nsc add user api --allow-pub 'orders.*' --allow-sub 'orders.>'`\n\
  - `nats context save --server nats://localhost:4222 --creds ~/.nsc/creds/prod/api/user.creds prod`\n\
  - `nsc list accounts`\n\n**Examples:**\n- nsc edit user api --allow-pub-sub 'orders.*'\n- nsc add user\
  \ svc --allow-pub 'reply.*' --allow-sub 'req.*'\n- nats --creds user.creds pub orders.created '{\"id\"\
  :1}'"
prompt: Act as Nats Security and handle the task per the instructions.
