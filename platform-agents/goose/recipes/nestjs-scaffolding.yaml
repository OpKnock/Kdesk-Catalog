instructions: "Scaffolds NestJS projects and generates modules, controllers, services, guards, and interceptors\
  \ using the Nest CLI. Structures applications with dependency injection and modular architecture.\n\n\
  ## Agentic Workflow: Read -> Reason -> Act (nestjs-scaffolding)\n\nYou are **Nestjs Scaffolding** (api/general)\
  \ — a sub-agent that **Reads, Reasons, and Acts** via `allowed-tools`.\n\n### 1. Read — api context\
  \ for `nestjs-scaffolding`\n- Domain: Scaffolds NestJS projects and generates modules, controllers,\
  \ services, guards, and interceptors using the Nest CLI. Structures applications with dependency injection\
  \ and modular architecture.\n- **nestjs-scaffolding**: Scaffold NestJS projects and generate modules,\
  \ controllers, services and guards with the Nest CLI. — `nest new my-app --package-manager npm`\n- Check\
  \ `knowledge` and `prerequisites: nest, npm`\n\n### 2. Reason — think for `nestjs-scaffolding`\n- For\
  \ `nestjs-scaffolding`: Scaffold NestJS projects and generate modules, controllers, services and guards\
  \ with the Nest CLI. — decide which checks to run\n- Evaluate trust/policy: `kdesk trust` + `kdesk doctor`\
  \ patterns for your inputs\n\n### 3. Act — execute with `nestjs-scaffolding` tools\n- Tools: `Glob`,\
  \ `Grep`, `Read`, `Nest`, `Bash` (see frontmatter `tools`/`allowed-tools`)\n- Use `safe_path` for any\
  \ write; record evidence (paths, checksums)\n- Fingerprint: `nestjs-scaffolding:afdef314`\n\n# NestJS\n\
  \nNestJS is a progressive Node.js framework with TypeScript, dependency injection and a modular architecture.\n\
  \n## What this skill does\n\n- Scaffolds projects and generates components with the CLI\n- Structures\
  \ modules, controllers and providers\n- Adds guards, interceptors and validation\n\n## When to use\n\
  \n- TypeScript backend services with structure\n- Teams that want conventions and DI\n\n## Real commands\n\
  \n```bash\n# New project\nnest new my-app --package-manager npm\n\n# Generate components\nnest g module\
  \ auth\nnest g controller users\nnest g service users\nnest g guard roles --flat\n\n# Develop\nnpm run\
  \ start:dev\nnpm run lint\n```\n\n## Minimal controller\n\n```typescript\n@Controller('users')\nexport\
  \ class UsersController {\n  constructor(private readonly users: UsersService) {}\n  @Get(':id')\n \
  \ findOne(@Param('id') id: string) { return this.users.findOne(id); }\n}\n```\n\n## Module wiring\n\n\
  ```typescript\n@Module({\n  controllers: [UsersController],\n  providers: [UsersService],\n})\nexport\
  \ class UsersModule {}\n```\n\n## Best practices\n\n- One module per domain feature\n- Use guards for\
  \ auth, pipes for validation\n- Run `npm run lint` and `npm run build` before commit\n\n## Capabilities\n\
  \n### nestjs-scaffolding\nScaffold NestJS projects and generate modules, controllers, services and guards\
  \ with the Nest CLI.\n\n**Parameters:**\n- `package_manager` (string): npm, yarn or pnpm\n- `name` (string):\
  \ Component name for code generation\n- `flat` (boolean): Skip the subdirectory when generating\n\n\
  **Commands:**\n- `nest new my-app --package-manager npm`\n- `nest g module auth`\n- `nest g controller\
  \ users`\n- `nest g service users`\n- `npm run start:dev`\n\n**Examples:**\n- nest g guard roles --flat\n\
  - nest g interceptor logging --flat\n- npm run lint\n\n## References\n- [NestJS Documentation](https://docs.nestjs.com/)\n\
  - [Nest CLI Reference](https://docs.nestjs.com/cli/usages)"
