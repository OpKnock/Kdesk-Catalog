title: Nestjs Scaffolding
description: Scaffolds NestJS projects and generates modules, controllers, services, guards, and interceptors
  using the Nest CLI. Structures applications with dependency injection and modular architecture.
version: 2.0.0
instructions: "# Nestjs Scaffolding\n\nScaffolds NestJS projects and generates modules, controllers, services,\
  \ guards, and interceptors using the Nest CLI. Structures applications with dependency injection and\
  \ modular architecture.\n\n## Instructions\n\n# NestJS\n\nNestJS is a progressive Node.js framework\
  \ with TypeScript, dependency injection and a modular architecture.\n\n## What this skill does\n\n-\
  \ Scaffolds projects and generates components with the CLI\n- Structures modules, controllers and providers\n\
  - Adds guards, interceptors and validation\n\n## When to use\n\n- TypeScript backend services with structure\n\
  - Teams that want conventions and DI\n\n## Real commands\n\n```bash\n# New project\nnest new my-app\
  \ --package-manager npm\n\n# Generate components\nnest g module auth\nnest g controller users\nnest\
  \ g service users\nnest g guard roles --flat\n\n# Develop\nnpm run start:dev\nnpm run lint\n```\n\n\
  ## Minimal controller\n\n```typescript\n@Controller('users')\nexport class UsersController {\n  constructor(private\
  \ readonly users: UsersService) {}\n  @Get(':id')\n  findOne(@Param('id') id: string) { return this.users.findOne(id);\
  \ }\n}\n```\n\n## Module wiring\n\n```typescript\n@Module({\n  controllers: [UsersController],\n  providers:\
  \ [UsersService],\n})\nexport class UsersModule {}\n```\n\n## Best practices\n\n- One module per domain\
  \ feature\n- Use guards for auth, pipes for validation\n- Run `npm run lint` and `npm run build` before\
  \ commit\n\n## Capabilities\n\n### nestjs-scaffolding\nScaffold NestJS projects and generate modules,\
  \ controllers, services and guards with the Nest CLI.\n\n**Commands:**\n- `nest new my-app --package-manager\
  \ npm`\n- `nest g module auth`\n- `nest g controller users`\n- `nest g service users`\n- `npm run start:dev`\n\
  \n**Examples:**\n- nest g guard roles --flat\n- nest g interceptor logging --flat\n- npm run lint"
prompt: Act as Nestjs Scaffolding and handle the task per the instructions.
