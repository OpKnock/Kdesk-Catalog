title: nestjs
description: 'Builds structured Node.js services with NestJS: modules, controllers, providers, CLI scaffolding,
  and testing.'
version: 2.0.0
instructions: "# nestjs\n\nBuilds structured Node.js services with NestJS: modules, controllers, providers,\
  \ CLI scaffolding, and testing.\n\n## Instructions\n\n# NestJS\n\nStructured Node.js framework for scalable\
  \ services.\n\n## When to Use\n\n- Services needing clear module boundaries and dependency injection\n\
  - Teams that want opinionated structure and conventions\n- APIs combining REST, GraphQL, WebSockets,\
  \ and microservices\n- Enterprise Node.js with built-in testing support\n\n## Commands\n\n```bash\n\
  # New app\nnpx @nestjs/cli new myapp\n\n# Scaffolding\nnpx nest generate module orders\nnpx nest generate\
  \ controller orders\nnpx nest generate service orders\nnpx nest generate pipe validation\n\n# Run\n\
  npm run start:dev\nnpm run start -- --watch\n\n# Tests\nnpm test\nnpm run test:e2e\n```\n\n## Module\
  \ Example\n\n```typescript\n// orders.module.ts\n@Module({\n  imports: [DatabaseModule],\n  controllers:\
  \ [OrdersController],\n  providers: [OrdersService],\n})\nexport class OrdersModule {}\n```\n\n```typescript\n\
  // orders.controller.ts\n@Controller(\"orders\")\nexport class OrdersController {\n  constructor(private\
  \ readonly ordersService: OrdersService) {}\n\n  @Get(\":id\")\n  findOne(@Param(\"id\") id: string)\
  \ {\n    return this.ordersService.findOne(id);\n  }\n}\n```\n\n## Best Practices\n\n- One resource\
  \ per module with clear imports/exports\n- Use guards for auth and pipes for validation at boundaries\n\
  - Keep services free of HTTP concerns\n- Write unit tests with jest mocks for providers\n- Run e2e tests\
  \ against a real test database in CI\n- Follow the nest CLI naming for consistency\n\n## Capabilities\n\
  \n### nestjs-cli\nScaffold modules, controllers, and services.\n\n**Commands:**\n- `npx @nestjs/cli\
  \ new myapp`\n- `npx nest generate module orders`\n- `npx nest generate controller orders`\n- `npx nest\
  \ generate service orders`\n- `npm run start:dev`\n\n**Examples:**\n- npx nest g resource users --no-spec\n\
  - npx nest generate pipe validation\n- npm run start -- --watch\n\n### nestjs-testing\nRun unit and\
  \ e2e tests.\n\n**Commands:**\n- `npm test`\n- `npm run test:e2e`\n- `npm run test -- --testPathPattern=\"\
  orders\"`\n- `npm run test -- --coverage`\n\n**Examples:**\n- npm run test:e2e -- --runInBand\n- npm\
  \ run test -- --watch"
prompt: Act as nestjs and handle the task per the instructions.
