title: Netlify Functions
description: Creates, serves, invokes, and deploys Netlify Functions using the Netlify CLI. Supports local
  development with netlify dev, function testing with payloads, and production deployments.
version: 2.0.0
instructions: "# Netlify Functions\n\nCreates, serves, invokes, and deploys Netlify Functions using the\
  \ Netlify CLI. Supports local development with netlify dev, function testing with payloads, and production\
  \ deployments.\n\n## Instructions\n\n# Netlify Functions\n\nNetlify Functions run serverless backend\
  \ code alongside static sites on Netlify.\n\n## What this skill does\n\n- Scaffolds new functions from\
  \ templates\n- Serves and invokes functions locally\n- Deploys to production with the CLI\n\n## When\
  \ to use\n\n- Serverless APIs for Jamstack sites\n- Form handlers and webhooks\n\n## Real commands\n\
  \n```bash\n# Authenticate and init\nnetlify login\nnetlify init\n\n# Create a function\nnetlify functions:create\n\
  \n# Local serving\nnetlify functions:serve --port 8888\nnetlify dev\n\n# Invoke with payload\nnetlify\
  \ functions:invoke my-function --payload '{\"name\":\"alice\"}'\n\n# Deploy\nnetlify deploy --prod\n\
  netlify deploy --prod --build\n```\n\n## Handler example\n\n```js\nexports.handler = async (event, context)\
  \ => ({\n  statusCode: 200,\n  body: JSON.stringify({ hello: event.queryStringParameters.name }),\n\
  });\n```\n\n## Best practices\n\n- Test locally before deploying\n- Keep functions pure: no shared mutable\
  \ state\n- Use environment variables for secrets via netlify env\n\n## Capabilities\n\n### netlify-functions-workflow\n\
  Create, serve, invoke and deploy Netlify Functions with the Netlify CLI.\n\n**Commands:**\n- `netlify\
  \ functions:create`\n- `netlify functions:serve --port 8888`\n- `netlify functions:invoke my-function`\n\
  - `netlify dev`\n- `netlify deploy --prod`\n\n**Examples:**\n- netlify functions:invoke my-function\
  \ --payload '{\"name\":\"alice\"}'\n- netlify functions:serve --functions build/functions\n- netlify\
  \ deploy --prod --build"
prompt: Act as Netlify Functions and handle the task per the instructions.
