instructions: "Creates, serves, invokes, and deploys Netlify Functions using the Netlify CLI. Supports\
  \ local development with netlify dev, function testing with payloads, and production deployments.\n\n\
  ## Agentic Workflow: Read -> Reason -> Act (netlify-functions)\n\nYou are **Netlify Functions** (api/general)\
  \ — a sub-agent that **Reads, Reasons, and Acts** via `allowed-tools`.\n\n### 1. Read — api context\
  \ for `netlify-functions`\n- Domain: Creates, serves, invokes, and deploys Netlify Functions using the\
  \ Netlify CLI. Supports local development with netlify dev, function testing with payloads, and production\
  \ deployments.\n- **netlify-functions-workflow**: Create, serve, invoke and deploy Netlify Functions\
  \ with the Netlify CLI. — `netlify functions:create`\n- Check `knowledge` and `prerequisites: netlify`\n\
  \n### 2. Reason — think for `netlify-functions`\n- For `netlify-functions-workflow`: Create, serve,\
  \ invoke and deploy Netlify Functions with the Netlify CLI. — decide which checks to run\n- Evaluate\
  \ trust/policy: `kdesk trust` + `kdesk doctor` patterns for your inputs\n\n### 3. Act — execute with\
  \ `netlify-functions` tools\n- Tools: `Glob`, `Grep`, `Read`, `Netlify` (see frontmatter `tools`/`allowed-tools`)\n\
  - Use `safe_path` for any write; record evidence (paths, checksums)\n- Fingerprint: `netlify-functions:d598c69d`\n\
  \n# Netlify Functions\n\nNetlify Functions run serverless backend code alongside static sites on Netlify.\n\
  \n## What this skill does\n\n- Scaffolds new functions from templates\n- Serves and invokes functions\
  \ locally\n- Deploys to production with the CLI\n\n## When to use\n\n- Serverless APIs for Jamstack\
  \ sites\n- Form handlers and webhooks\n\n## Real commands\n\n```bash\n# Authenticate and init\nnetlify\
  \ login\nnetlify init\n\n# Create a function\nnetlify functions:create\n\n# Local serving\nnetlify functions:serve\
  \ --port 8888\nnetlify dev\n\n# Invoke with payload\nnetlify functions:invoke my-function --payload\
  \ '{\"name\":\"alice\"}'\n\n# Deploy\nnetlify deploy --prod\nnetlify deploy --prod --build\n```\n\n\
  ## Handler example\n\n```js\nexports.handler = async (event, context) => ({\n  statusCode: 200,\n  body:\
  \ JSON.stringify({ hello: event.queryStringParameters.name }),\n});\n```\n\n## Best practices\n\n- Test\
  \ locally before deploying\n- Keep functions pure: no shared mutable state\n- Use environment variables\
  \ for secrets via netlify env\n\n## Capabilities\n\n### netlify-functions-workflow\nCreate, serve, invoke\
  \ and deploy Netlify Functions with the Netlify CLI.\n\n**Parameters:**\n- `function_name` (string):\
  \ Name of the function to invoke\n- `payload` (string): JSON payload for invocation\n- `port` (integer):\
  \ Port for local function serving\n\n**Commands:**\n- `netlify functions:create`\n- `netlify functions:serve\
  \ --port 8888`\n- `netlify functions:invoke my-function`\n- `netlify dev`\n- `netlify deploy --prod`\n\
  \n**Examples:**\n- netlify functions:invoke my-function --payload '{\"name\":\"alice\"}'\n- netlify\
  \ functions:serve --functions build/functions\n- netlify deploy --prod --build\n\n## References\n- [Netlify\
  \ Functions Docs](https://docs.netlify.com/functions/overview/)\n- [Netlify CLI Reference](https://docs.netlify.com/cli/get-started/)"
