title: Netlify
description: 'Deploys frontend apps with Netlify: CLI deploys, build configuration, environment variables,
  and edge functions.'
version: 2.0.0
instructions: "# Netlify\n\nDeploys frontend apps with Netlify: CLI deploys, build configuration, environment\
  \ variables, and edge functions.\n\n## Instructions\n\n# Netlify\n\nDeploy frontend apps with the Netlify\
  \ CLI.\n\n## When to Use\n\n- Static sites and SPAs with CDN delivery\n- JAMstack deploys with preview\
  \ deployments\n- Serverless functions (Netlify Functions)\n- Managed forms and identity without a backend\n\
  \n## Commands\n\n```bash\n# Setup\nnpm install -g netlify-cli\nnetlify init\n\n# Deploy\nnetlify deploy\
  \ --dir dist\nnetlify deploy --prod\nnetlify deploy --dir dist --prod\n\n# Local dev\nnetlify dev\n\n\
  # Env vars\nnetlify env:set API_KEY abc123\nnetlify env:set --context production API_URL https://api.example.com\n\
  netlify env:list\nnetlify env:unset API_KEY\n\n# Status and functions\nnetlify status\nnetlify functions:list\n\
  netlify functions:serve\n```\n\n## netlify.toml Example\n\n```toml\n[build]\n  command = \"npm run build\"\
  \n  publish = \"dist\"\n\n[build.environment]\n  NODE_VERSION = \"20\"\n\n[redirects]\n  from = \"/*\"\
  \n  to = \"/index.html\"\n  status = 200\n```\n\n## Best Practices\n\n- Use deploy previews for PR review\
  \ environments\n- Set context-specific env vars (production vs preview)\n- Keep redirects and headers\
  \ in netlify.toml for versioning\n- Run netlify deploy --build in CI with a pinned CLI version\n- Test\
  \ functions locally with netlify functions:serve\n- Use deploy contexts to gate production promotions\n\
  \n## Capabilities\n\n### netlify-cli\nBuild, deploy, and manage Netlify sites.\n\n**Commands:**\n- `npm\
  \ install -g netlify-cli`\n- `netlify init`\n- `netlify deploy`\n- `netlify deploy --prod`\n- `netlify\
  \ dev`\n\n**Examples:**\n- netlify deploy --dir dist --prod\n- netlify deploy --build --prod\n- netlify\
  \ open\n\n### netlify-config\nManage environment variables and site settings.\n\n**Commands:**\n- `netlify\
  \ env:set API_KEY abc123`\n- `netlify env:list`\n- `netlify env:unset API_KEY`\n- `netlify status`\n\
  - `netlify functions:list`\n\n**Examples:**\n- netlify env:set --context production API_URL https://api.example.com\n\
  - netlify functions:serve\n- netlify status"
prompt: Act as Netlify and handle the task per the instructions.
