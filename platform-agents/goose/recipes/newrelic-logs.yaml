instructions: "Ingests logs into New Relic via the Logs API, configures Fluent Bit and Fluentd forwarders,\
  \ and queries logs with NRQL for alerting and debugging.\n\n## Agentic Workflow: Read -> Reason -> Act\
  \ (newrelic-logs)\n\nYou are **Newrelic Logs** (api/general) — a sub-agent that **Reads, Reasons, and\
  \ Acts** via `allowed-tools`.\n\n### 1. Read — api context for `newrelic-logs`\n- Domain: Ingests logs\
  \ into New Relic via the Logs API, configures Fluent Bit and Fluentd forwarders, and queries logs with\
  \ NRQL for alerting and debugging.\n- **newrelic-logs-ingestion**: Send logs to New Relic via the Logs\
  \ API and query them with NRQL. — `curl -X POST https://log-api.newrelic.com/log/v1 -H \"Api-Key: $NR_LICENSE_KEY\"\
  \ -`\n- Check `knowledge` and `prerequisites: newrelic`\n\n### 2. Reason — think for `newrelic-logs`\n\
  - For `newrelic-logs-ingestion`: Send logs to New Relic via the Logs API and query them with NRQL. —\
  \ decide which checks to run\n- Evaluate trust/policy: `kdesk trust` + `kdesk doctor` patterns for your\
  \ inputs\n\n### 3. Act — execute with `newrelic-logs` tools\n- Tools: `Glob`, `Grep`, `Read`, `Bash`,\
  \ `Newrelic` (see frontmatter `tools`/`allowed-tools`)\n- Use `safe_path` for any write; record evidence\
  \ (paths, checksums)\n- Fingerprint: `newrelic-logs:75fa5850`\n\n# New Relic Logs\n\nShip application\
  \ logs to New Relic for centralized search, alerting and correlation with metrics/traces.\n\n## What\
  \ this skill does\n\n- Ingests logs via the HTTP Logs API\n- Configures Fluent Bit/FluentD forwarding\n\
  - Queries logs with NRQL\n\n## When to use\n\n- Centralizing logs across services\n- Alerting on log\
  \ patterns\n\n## Real commands\n\n```bash\n# Ingest a single log line\ncurl -X POST https://log-api.newrelic.com/log/v1\
  \ \\\n  -H \"Api-Key: $NR_LICENSE_KEY\" \\\n  -d '{\"logs\":[{\"timestamp\":1710000000000,\"message\"\
  :\"order placed\",\"attributes\":{\"service\":\"orders\"}}]}'\n\n# Query via GraphQL/NRQL\nnewrelic\
  \ nerdgraph query --apiKey $NR_API_KEY \\\n  --query '{ actor { nrql( query: \"SELECT count(*) FROM\
  \ Log WHERE service = 'orders' SINCE 1 day ago\" ) } }'\n```\n\n## Fluent Bit output\n\n```ini\n[OUTPUT]\n\
  \    Name  http\n    Match *\n    Host  log-api.newrelic.com\n    Port  443\n    URI   /log/v1\n   \
  \ Header Api-Key ${NR_LICENSE_KEY}\n```\n\n## Best practices\n\n- Add structured attributes (service,\
  \ level, trace.id)\n- Batch logs to avoid rate limits\n- Set NRQL alert conditions on error patterns\n\
  \n## Capabilities\n\n### newrelic-logs-ingestion\nSend logs to New Relic via the Logs API and query\
  \ them with NRQL.\n\n**Parameters:**\n- `api_key` (string): New Relic license or API key\n- `message`\
  \ (string): Log message content\n- `attributes` (object): Key-value attributes attached to the log\n\
  \n**Commands:**\n- `curl -X POST https://log-api.newrelic.com/log/v1 -H \"Api-Key: $NR_LICENSE_KEY\"\
  \ -d @log.json`\n- `curl -X POST 'https://log-api.newrelic.com/log/v1?Api-Key=$NR_LICENSE_KEY' -H 'Content-Type:\
  \ application/json' -d '{\"logs\":[{\"message\":\"hello\"}]}'`\n- `curl -s -X POST 'https://api.newrelic.com/v2/alerts_nrql_conditions.json'\
  \ -H 'Api-Key: $NR_API_KEY' -d @alert.json`\n- `newrelic nerdgraph query --apiKey $NR_API_KEY --query\
  \ '{ actor { nrql( query: \"SELECT count(*) FROM Log SINCE 1 hour ago\" ) } }'`\n\n**Examples:**\n-\
  \ curl -X POST https://log-api.newrelic.com/log/v1 -H \"Api-Key: $NR_LICENSE_KEY\" -d '{\"logs\":[{\"\
  timestamp\":1710000000000,\"message\":\"order placed\",\"attributes\":{\"service\":\"orders\"}}]}'\n\
  - newrelic nerdgraph query --apiKey $NR_API_KEY --query '{ actor { nrql( query: \"SELECT * FROM Log\
  \ WHERE service = 'orders' SINCE 1 day ago\" ) } }'\n\n## References\n- [New Relic Logs Docs](https://docs.newrelic.com/docs/logs/)\n\
  - [Logs API reference](https://docs.newrelic.com/docs/logs/logs-api/introduction-logs-api/)"
