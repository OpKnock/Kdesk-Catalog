title: Newrelic Logs
description: Ingests logs into New Relic via the Logs API, configures Fluent Bit and Fluentd forwarders,
  and queries logs with NRQL for alerting and debugging.
version: 2.0.0
instructions: "# Newrelic Logs\n\nIngests logs into New Relic via the Logs API, configures Fluent Bit\
  \ and Fluentd forwarders, and queries logs with NRQL for alerting and debugging.\n\n## Instructions\n\
  \n# New Relic Logs\n\nShip application logs to New Relic for centralized search, alerting and correlation\
  \ with metrics/traces.\n\n## What this skill does\n\n- Ingests logs via the HTTP Logs API\n- Configures\
  \ Fluent Bit/FluentD forwarding\n- Queries logs with NRQL\n\n## When to use\n\n- Centralizing logs across\
  \ services\n- Alerting on log patterns\n\n## Real commands\n\n```bash\n# Ingest a single log line\n\
  curl -X POST https://log-api.newrelic.com/log/v1 \\\n  -H \"Api-Key: $NR_LICENSE_KEY\" \\\n  -d '{\"\
  logs\":[{\"timestamp\":1710000000000,\"message\":\"order placed\",\"attributes\":{\"service\":\"orders\"\
  }}]}'\n\n# Query via GraphQL/NRQL\nnewrelic nerdgraph query --apiKey $NR_API_KEY \\\n  --query '{ actor\
  \ { nrql( query: \"SELECT count(*) FROM Log WHERE service = 'orders' SINCE 1 day ago\" ) } }'\n```\n\
  \n## Fluent Bit output\n\n```ini\n[OUTPUT]\n    Name  http\n    Match *\n    Host  log-api.newrelic.com\n\
  \    Port  443\n    URI   /log/v1\n    Header Api-Key ${NR_LICENSE_KEY}\n```\n\n## Best practices\n\n\
  - Add structured attributes (service, level, trace.id)\n- Batch logs to avoid rate limits\n- Set NRQL\
  \ alert conditions on error patterns\n\n## Capabilities\n\n### newrelic-logs-ingestion\nSend logs to\
  \ New Relic via the Logs API and query them with NRQL.\n\n**Commands:**\n- `curl -X POST https://log-api.newrelic.com/log/v1\
  \ -H \"Api-Key: $NR_LICENSE_KEY\" -d @log.json`\n- `curl -X POST 'https://log-api.newrelic.com/log/v1?Api-Key=$NR_LICENSE_KEY'\
  \ -H 'Content-Type: application/json' -d '{\"logs\":[{\"message\":\"hello\"}]}'`\n- `curl -s -X POST\
  \ 'https://api.newrelic.com/v2/alerts_nrql_conditions.json' -H 'Api-Key: $NR_API_KEY' -d @alert.json`\n\
  - `newrelic nerdgraph query --apiKey $NR_API_KEY --query '{ actor { nrql( query: \"SELECT count(*) FROM\
  \ Log SINCE 1 hour ago\" ) } }'`\n\n**Examples:**\n- curl -X POST https://log-api.newrelic.com/log/v1\
  \ -H \"Api-Key: $NR_LICENSE_KEY\" -d '{\"logs\":[{\"timestamp\":1710000000000,\"message\":\"order placed\"\
  ,\"attributes\":{\"service\":\"orders\"}}]}'\n- newrelic nerdgraph query --apiKey $NR_API_KEY --query\
  \ '{ actor { nrql( query: \"SELECT * FROM Log WHERE service = 'orders' SINCE 1 day ago\" ) } }'"
prompt: Act as Newrelic Logs and handle the task per the instructions.
