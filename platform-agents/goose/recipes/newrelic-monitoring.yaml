  \ Reason -> Act (newrelic-monitoring)\n\nYou are **Newrelic Monitoring** (api/general) — a sub-agent\
  \ that **Reads, Reasons, and Acts** via `allowed-tools`.\n\n### 1. Read — api context for `newrelic-monitoring`\n\
  - Domain: Operates New Relic APM agents, runs NRQL queries against telemetry, searches entities, and\
  \ manages dashboards and alert conditions via the New Relic CLI.\n- **newrelic-apm-operations**: Install\
  \ APM agents, query telemetry with NRQL, and inspect entities via the New Relic CLI. — `newrelic entity\
  \ search --name \"my-app\"`\n- Check `knowledge` and `prerequisites: newrelic`\n\n### 2. Reason — think\
  \ for `newrelic-monitoring`\n- For `newrelic-apm-operations`: Install APM agents, query telemetry with\
  \ NRQL, and inspect entities via the New Relic CLI. — decide which checks to run\n- Evaluate trust/policy:\
  \ `kdesk trust` + `kdesk doctor` patterns for your inputs\n\n### 3. Act — execute with `newrelic-monitoring`\
  \ tools\n- Tools: `Glob`, `Grep`, `Read`, `Newrelic`, `Bash` (see frontmatter `tools`/`allowed-tools`)\n\
  - Use `safe_path` for any write; record evidence (paths, checksums)\n- Fingerprint: `newrelic-monitoring:7d07b5ba`\n\
  \n# New Relic Monitoring\n\nInstrument apps with New Relic APM and drive it from the CLI for instant\
  \ answers.\n\n## What this skill does\n\n- Installs and configures APM agents\n- Runs NRQL queries against\
  \ telemetry\n- Manages entities and dashboards\n\n## When to use\n\n- Debugging slow transactions\n\
  - Verifying agent health after deployment\n\n## Real commands\n\n```bash\n# Entity search\nnewrelic\
  \ entity search --name \"my-app\"\nnewrelic entity search --domain APM --type APPLICATION\n\n# NRQL\
  \ queries\nnewrelic nrql \"SELECT count(*) FROM Transaction SINCE 1 hour ago\"\nnewrelic nrql \"SELECT\
  \ average(duration) FROM Transaction WHERE appName = 'my-app' SINCE 1 day ago\"\n\n# GraphQL access\n\
  newrelic nerdgraph query --apiKey $NR_API_KEY \\\n  --query '{ actor { account(id: 1) { name } } }'\n\
  \n# Agent diagnostics\nnewrelic diagnostics run\n```\n\n## APM agent config (Node example)\n\n```env\n\
  NEW_RELIC_LICENSE_KEY=xxxx\nNEW_RELIC_APP_NAME=my-app\nNEW_RELIC_LOG_LEVEL=info\n```\n\n```js\nrequire('newrelic');\n\
  ```\n\n## Best practices\n\n- Use the same app name across all instances\n- Query with explicit SINCE\
  \ windows to bound cost\n- Alert on NRQL conditions, not static thresholds\n\n## Capabilities\n\n###\
  \ newrelic-apm-operations\nInstall APM agents, query telemetry with NRQL, and inspect entities via the\
  \ New Relic CLI.\n\n**Parameters:**\n- `nrql` (string): NRQL query string\n- `app_name` (string): APM\
  \ application name\n- `api_key` (string): New Relic API key\n\n**Commands:**\n- `newrelic entity search\
  \ --name \"my-app\"`\n- `newrelic nrql \"SELECT count(*) FROM Transaction SINCE 1 hour ago\"`\n- `newrelic\
  \ nerdgraph query --apiKey $NR_API_KEY --query '{ actor { account(id: 1) { name } } }'`\n- `newrelic\
  \ diagnostics run`\n- `curl -s 'https://api.newrelic.com/v2/applications.json' -H 'Api-Key: $NR_API_KEY'`\n\
  \n**Examples:**\n- newrelic nrql \"SELECT average(duration) FROM Transaction WHERE appName = 'my-app'\
  \ SINCE 1 day ago\"\n- newrelic entity search --domain APM --type APPLICATION\n- newrelic diagnostics\
  \ run\n\n## References\n- [New Relic Documentation](https://docs.newrelic.com/)\n- [New Relic CLI GitHub](https://github.com/newrelic/newrelic-cli)"
