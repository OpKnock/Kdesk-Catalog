title: Nginx
description: 'Engineers nginx as a reverse proxy and API gateway: location routing, headers, rate limiting,
  and caching layers.'
version: 2.0.0
instructions: "# Nginx\n\nEngineers nginx as a reverse proxy and API gateway: location routing, headers,\
  \ rate limiting, and caching layers.\n\n## Instructions\n\n# Nginx (Networking)\n\nEngineer nginx as\
  \ the L7 edge: proxies, limits, and cache.\n\n## When to Use\n\n- Reverse proxying to services with\
  \ path routing\n- Rate limiting public endpoints\n- Caching static and API responses\n\n## Proxy config\n\
  \n```nginx\nupstream api_servers {\n  least_conn;\n  server 10.0.1.11:8080 max_fails=3 fail_timeout=10s;\n\
  \  server 10.0.1.12:8080 max_fails=3 fail_timeout=10s;\n}\n\nserver {\n  listen 80;\n  server_name api.example.com;\n\
  \n  location /api/v1/ {\n    proxy_pass http://api_servers;\n    proxy_set_header X-Real-IP $remote_addr;\n\
  \    proxy_set_header X-Request-Id $request_id;\n  }\n}\n```\n\n## Rate limiting\n\n```nginx\nlimit_req_zone\
  \ $binary_remote_addr zone=api:10m rate=10r/s;\nlocation /api/ {\n  limit_req zone=api burst=20 nodelay;\n\
  \  proxy_pass http://api_servers;\n}\n```\n\n## Cache headers\n\n```nginx\nlocation /static/ {\n  alias\
  \ /srv/static/;\n  expires 7d;\n  add_header Cache-Control 'public, max-age=604800';\n}\n```\n\n## Verify\
  \ behavior\n\n```bash\nnginx -t && nginx -s reload\ncurl -sI -H 'Host: api.example.com' http://127.0.0.1/api/v1/healthz\n\
  ab -n 200 -c 20 http://127.0.0.1/api/v1/search\n```\n\n## Best practices\n\n- Add X-Request-Id at the\
  \ edge for tracing.\n- Rate limit at the edge AND at the app.\n- Test 429 responses in load tests.\n\
  - Keep upstream health checks tight (5s interval).\n\n## Testing\n\nRun ab/hey against limited endpoints\
  \ and confirm 429s beyond the burst.\n\n## Capabilities\n\n### proxy\nRoute and transform traffic with\
  \ nginx locations.\n\n**Commands:**\n- `nginx -t -c /etc/nginx/nginx.conf`\n- `nginx -s reload`\n- `nginx\
  \ -T | grep -E 'server_name|proxy_pass|location'`\n- `curl -sI -H 'Host: api.example.com' http://127.0.0.1/api/v1/healthz`\n\
  - `curl -s -o /dev/null -w '%{http_code}\\n' http://127.0.0.1/api/v1/healthz`\n\n**Examples:**\n- nginx\
  \ -T | grep proxy_pass | head -20\n- curl -sI http://127.0.0.1/api/ | head -8\n- nginx -t && nginx -s\
  \ reload\n\n### gateway\nApply rate limits, caching, and header policies.\n\n**Commands:**\n- `ab -n\
  \ 200 -c 20 http://127.0.0.1/api/v1/search | grep -E 'Failed|Requests per second'`\n- `curl -s -o /dev/null\
  \ -w '%{size_download}' -H 'Cache-Control: max-age=60' http://127.0.0.1/static/app.js`\n- `curl -sI\
  \ http://127.0.0.1/static/app.js | grep -i cache`\n- `ab -n 1000 -c 50 http://127.0.0.1/api/v1/ | grep\
  \ -E 'Non-2xx|Requests per second'`\n- `tail -n 50 /var/log/nginx/access.log | awk '{print $9}' | sort\
  \ | uniq -c`\n\n**Examples:**\n- ab -n 500 -c 50 http://127.0.0.1/api/ | grep 'Non-2xx responses'\n\
  - curl -sI -H 'Host: api.example.com' http://127.0.0.1/api/v1/healthz | grep -i x-rate\n- tail -n 200\
  \ /var/log/nginx/access.log | grep ' 429 ' | wc -l"
prompt: Act as Nginx and handle the task per the instructions.
