  \ Read -> Reason -> Act (nginx-unit)\n\nYou are **Nginx Unit** (api/general) — a sub-agent that **Reads,\
  \ Reasons, and Acts** via `allowed-tools`.\n\n### 1. Read — api context for `nginx-unit`\n- Domain:\
  \ Configures NGINX Unit via its JSON control API to manage listeners, routes, and application objects\
  \ supporting PHP, Node.js, Python, and Go apps with zero-downtime reloads.\n- **nginx-unit-config**:\
  \ Control NGINX Unit through its JSON control API: configure listeners, routes and application objects\
  \ — `unitd --no-daemon`\n- Check `knowledge` and `prerequisites: unitd`\n\n### 2. Reason — think for\
  \ `nginx-unit`\n- For `nginx-unit-config`: Control NGINX Unit through its JSON control API: configure\
  \ listeners, routes and application objects. — decide which checks to run\n- Evaluate trust/policy:\
  \ `kdesk trust` + `kdesk doctor` patterns for your inputs\n\n### 3. Act — execute with `nginx-unit`\
  \ tools\n- Tools: `Glob`, `Grep`, `Read`, `Unitd`, `Bash` (see frontmatter `tools`/`allowed-tools`)\n\
  - Use `safe_path` for any write; record evidence (paths, checksums)\n- Fingerprint: `nginx-unit:b6b45943`\n\
  \n# NGINX Unit\n\nNGINX Unit is an application server for PHP, Python, Node.js, Go and more, configured\
  \ entirely over a JSON API.\n\n## What this skill does\n\n- Runs unitd and manages the control API\n\
  - Configures listeners, routes and applications\n- Reloads configs without restarts\n\n## When to use\n\
  \n- Polyglot workloads behind one runtime\n- Zero-downtime config changes\n\n## Real commands\n\n```bash\n\
  # Start\nunitd\nunitd --no-daemon   # foreground\n\n# Full config\ncurl -X PUT --data-binary @config.json\
  \ http://127.0.0.1:8080/config\n\n# Add an application object\ncurl -X PUT --data-binary '{\"type\"\
  :\"python3\",\"processes\":4,\"path\":\"/srv/app\",\"module\":\"app\"}' \\\n  http://127.0.0.1:8080/config/applications/web\n\
  \n# Route a listener to it\ncurl -X PUT --data-binary '{\"listeners\":{\"*:8300\":{\"pass\":\"applications/web\"\
  }}}' \\\n  http://127.0.0.1:8080/config\n\n# Inspect\ncurl -s http://127.0.0.1:8080/config\ncurl -s\
  \ http://127.0.0.1:8080/status\n```\n\n## config.json example\n\n```json\n{\n  \"listeners\": { \"*:8300\"\
  : { \"pass\": \"routes/main\" } },\n  \"routes\": { \"main\": [ { \"action\": { \"pass\": \"applications/web\"\
  \ } } ] },\n  \"applications\": { \"web\": { \"type\": \"php\", \"root\": \"/srv/www\" } }\n}\n```\n\
  \n## Best practices\n\n- Apply config as JSON files for auditability\n- Use routes for request routing\
  \ across apps\n- Check /status for application and request counters\n\n## Capabilities\n\n### nginx-unit-config\n\
  Control NGINX Unit through its JSON control API: configure listeners, routes and application objects.\n\
  \n**Parameters:**\n- `listener` (string): Socket address the app listens on\n- `app_type` (string):\
  \ php, python3, node, go or perl\n- `config_path` (string): Path to JSON config file\n\n**Commands:**\n\
  - `unitd --no-daemon`\n- `curl -X PUT --data-binary @config.json http://127.0.0.1:8080/config`\n- `curl\
  \ -X PUT --data-binary @app.json http://127.0.0.1:8080/config/applications/web`\n- `curl -X DELETE http://127.0.0.1:8080/config/listeners/127.0.0.1:8300`\n\
  - `curl -s http://127.0.0.1:8080/status`\n\n**Examples:**\n- curl -X PUT --data-binary '{\"type\":\"\
  python3\",\"processes\":4,\"path\":\"/srv/app\",\"module\":\"app\"}' http://127.0.0.1:8080/config/applications/web\n\
  - curl -X PUT --data-binary '{\"listeners\":{\"*:8300\":{\"pass\":\"applications/web\"}}}' http://127.0.0.1:8080/config\n\
  - curl -s http://127.0.0.1:8080/config\n\n## References\n- [NGINX Unit Docs](https://unit.nginx.org/)\n\
  - [Unit control API](https://unit.nginx.org/controlapi/)"
