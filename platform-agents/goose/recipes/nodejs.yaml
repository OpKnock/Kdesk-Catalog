title: Nodejs
description: 'Develops Node.js backends: npm project setup, debugging, worker threads, dependency auditing,
  and production runtime management.'
version: 2.0.0
instructions: "# Nodejs\n\nDevelops Node.js backends: npm project setup, debugging, worker threads, dependency\
  \ auditing, and production runtime management.\n\n## Instructions\n\n# Node.js\n\nBackend development\
  \ on the Node.js runtime.\n\n## When to Use\n\n- HTTP APIs, WebSockets, and real-time services\n- CLI\
  \ tools and automation scripts\n- Polyglot teams already using JavaScript/TypeScript\n\n## Commands\n\
  \n```bash\n# Project setup\nnpm init -y\nnpm install express\nnpm install --save-dev nodemon typescript\n\
  \n# Run\nnode server.js\nnode --watch server.js\n\n# Memory control\nnode --max-old-space-size=4096\
  \ app.js\n\n# Debugging\nnode --inspect-brk server.js\n\n# Production deps only\nnpm ci --omit=dev\n\
  \n# Audit and updates\nnpm audit --audit-level=high\nnpm audit fix\nnpm outdated\n\n# Tests\nnpm test\n\
  node --test\n```\n\n## HTTP Server\n\n```javascript\nconst http = require(\"node:http\");\n\nconst server\
  \ = http.createServer((req, res) => {\n  res.writeHead(200, { \"Content-Type\": \"application/json\"\
  \ });\n  res.end(JSON.stringify({ ok: true }));\n});\n\nserver.listen(3000);\n```\n\n## Best Practices\n\
  \n- Pin dependency versions and use package-lock.json in VCS\n- Run npm audit in CI and fix high+ findings\n\
  - Use worker threads or child processes for CPU-heavy work\n- Always set a graceful shutdown handler\
  \ (SIGTERM)\n- Use --watch in dev, a process manager in prod\n- Enable NODE_ENV=production to skip dev-only\
  \ work\n\n## Capabilities\n\n### nodejs-runtime\nManage Node.js projects and run scripts.\n\n**Commands:**\n\
  - `npm init -y`\n- `npm install express`\n- `node --version`\n- `node --watch server.js`\n- `node --max-old-space-size=4096\
  \ app.js`\n\n**Examples:**\n- npm install --save-dev nodemon typescript\n- node --inspect-brk server.js\n\
  - npm ci --omit=dev\n\n### nodejs-quality\nAudit dependencies and run tests.\n\n**Commands:**\n- `npm\
  \ audit`\n- `npm audit fix`\n- `npm test`\n- `npm outdated`\n- `node --test`\n\n**Examples:**\n- npm\
  \ audit --audit-level=high\n- npm run lint\n- node --test test/"
prompt: Act as Nodejs and handle the task per the instructions.
