instructions: "Delivers alerts to Slack via webhooks, email via mailx, SMS via Twilio, and push notifications\
  \ via ntfy. Supports channel selection by severity and includes rate-limiting guidance.\n\n## Agentic\
  \ Workflow: Read -> Reason -> Act (notification-channels)\n\nYou are **Notification Channels** (api/general)\
  \ — a sub-agent that **Reads, Reasons, and Acts** via `allowed-tools`.\n\n### 1. Read — api context\
  \ for `notification-channels`\n- Domain: Delivers alerts to Slack via webhooks, email via mailx, SMS\
  \ via Twilio, and push notifications via ntfy. Supports channel selection by severity and includes rate-limiting\
  \ guidance.\n- **notification-delivery**: Deliver messages to Slack, email, Twilio SMS and ntfy topics\
  \ using curl and CLI tools. — `curl -X POST -H 'Content-type: application/json' --data '{\"text\":\"\
  Deploy complet`\n- Check `knowledge` and `prerequisites: echo, ntfy`\n\n### 2. Reason — think for `notification-channels`\n\
  - For `notification-delivery`: Deliver messages to Slack, email, Twilio SMS and ntfy topics using curl\
  \ and CLI tools. — decide which checks to run\n- Evaluate trust/policy: `kdesk trust` + `kdesk doctor`\
  \ patterns for your inputs\n\n### 3. Act — execute with `notification-channels` tools\n- Tools: `Glob`,\
  \ `Grep`, `Read`, `Bash`, `Echo` (see frontmatter `tools`/`allowed-tools`)\n- Use `safe_path` for any\
  \ write; record evidence (paths, checksums)\n- Fingerprint: `notification-channels:e61c0c10`\n\n# Notification\
  \ Channels\n\nRoute alerts to the right channel per severity: pages, chat, email and push.\n\n## What\
  \ this skill does\n\n- Posts messages to Slack webhooks\n- Sends email via mailx\n- Sends SMS via Twilio\
  \ and pushes via ntfy\n\n## When to use\n\n- Wiring alertmanager or cron alerts to humans\n- Choosing\
  \ a channel for a given severity\n\n## Real commands\n\n```bash\n# Slack webhook\ncurl -X POST -H 'Content-type:\
  \ application/json' \\\n  --data '{\"text\":\"Deploy complete\"}' \\\n  https://hooks.slack.com/services/T000/B000/XXX\n\
  \n# Email\nprintf 'Body\\n' | mailx -s \"Subject\" -r alerts@your-app.test oncall@your-app.test\n\n\
  # Twilio SMS\ncurl -X POST https://api.twilio.com/2010-04-01/Accounts/$TWILIO_SID/Messages.json \\\n\
  \  --data-urlencode \"To=+15551234567\" \\\n  --data-urlencode \"From=+15559876543\" \\\n  --data-urlencode\
  \ \"Body=Alert: high latency\" \\\n  -u \"$TWILIO_SID:$TWILIO_TOKEN\"\n\n# ntfy push\nntfy publish mytopic\
  \ \"Server down!\"\ncurl -d \"pipeline failed\" ntfy.sh/mytopic\n```\n\n## Channel guidance\n\n- Pager/critical:\
  \ SMS or phone call\n- Normal ops: Slack or ntfy\n- Reports: email\n\n## Best practices\n\n- Include\
  \ severity, service and runbook link in every alert\n- Rate-limit notifications to avoid alert storms\n\
  - Test each channel with a canned message first\n\n## Capabilities\n\n### notification-delivery\nDeliver\
  \ messages to Slack, email, Twilio SMS and ntfy topics using curl and CLI tools.\n\n**Parameters:**\n\
  - `channel` (string): slack, email, sms or ntfy\n- `message` (string): Message body text\n- `recipient`\
  \ (string): Webhook URL, email address or phone number\n\n**Commands:**\n- `curl -X POST -H 'Content-type:\
  \ application/json' --data '{\"text\":\"Deploy complete\"}' https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX`\n\
  - `echo \"Body text\" | mailx -s \"Subject\" -r alerts@your-app.test oncall@your-app.test`\n- `curl\
  \ -X POST https://api.twilio.com/2010-04-01/Accounts/$TWILIO_SID/Messages.json --data-urlencode \"To=+15551234567\"\
  \ --data-urlencode \"From=+15559876543\" --data-urlencode \"Body=Alert: high latency\" -u \"$TWILIO_SID:$TWILIO_TOKEN\"\
  `\n- `ntfy publish mytopic \"Server down!\"`\n- `curl -d \"pipeline failed\" ntfy.sh/mytopic`\n\n**Examples:**\n\
  - curl -X POST -H 'Content-type: application/json' --data '{\"text\":\":warning: CPU at 95%\"}' https://hooks.slack.com/services/T000/B000/XXX\n\
  - ntfy publish --title \"CI\" mytopic \"build #42 passed\"\n- curl -d \"disk nearly full\" https://ntfy.sh/ops-alerts\n\
  \n## References\n- [Slack Incoming Webhooks](https://api.slack.com/messaging/webhooks)\n- [ntfy docs](https://docs.ntfy.sh/publish/)\n\
  - [Twilio Messaging API](https://www.twilio.com/docs/messaging/api)"
