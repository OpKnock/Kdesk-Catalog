title: Openapi
description: Authors, validates, lints, bundles, and generates code from OpenAPI 3.x specifications. Supports
  contract-first development with Redocly, Spectral, and openapi-generator tooling.
version: 2.0.0
instructions: "# Openapi\n\nAuthors, validates, lints, bundles, and generates code from OpenAPI 3.x specifications.\
  \ Supports contract-first development with Redocly, Spectral, and openapi-generator tooling.\n\n## Instructions\n\
  \n# OpenAPI\n\nOpenAPI 3.x is the standard for describing REST APIs: paths, schemas, parameters and\
  \ security.\n\n## What this skill does\n\n- Validates and lints specs\n- Bundles multi-file specs into\
  \ one\n- Generates clients and servers\n\n## When to use\n\n- Starting a new API contract\n- Keeping\
  \ docs in sync with implementation\n\n## Real commands\n\n```bash\n# Validate\nopenapi-generator-cli\
  \ validate -i openapi.yaml\nswagger-cli validate openapi.yaml\n\n# Lint\nredocly lint openapi.yaml --extends\
  \ recommended\n\n# Bundle\nnpx @redocly/cli bundle openapi.yaml -o bundle.yaml\n\n# Generate clients\n\
  openapi-generator-cli generate -g python -i openapi.yaml -o generated/\nopenapi-generator-cli generate\
  \ -g typescript-axios -i openapi.yaml -o out/\n```\n\n## Minimal spec\n\n```yaml\nopenapi: 3.0.3\ninfo:\n\
  \  title: Example API\n  version: 1.0.0\npaths:\n  /health:\n    get:\n      responses:\n        '200':\n\
  \          description: OK\n```\n\n## Best practices\n\n- Write the spec before the code (contract-first)\n\
  - Keep one spec file per API, reference external $refs\n- Run lint + validate in CI\n\n## Capabilities\n\
  \n### openapi-authoring\nValidate, lint, bundle and generate code from OpenAPI 3.x specifications.\n\
  \n**Commands:**\n- `openapi-generator-cli validate -i openapi.yaml`\n- `redocly lint openapi.yaml`\n\
  - `npx @redocly/cli bundle openapi.yaml -o bundle.yaml`\n- `openapi-generator-cli generate -g python\
  \ -i openapi.yaml -o generated/`\n- `swagger-cli validate openapi.yaml`\n\n**Examples:**\n- redocly\
  \ lint openapi.yaml --extends recommended\n- openapi-generator-cli generate -g typescript-axios -i openapi.yaml\
  \ -o out/\n- npx @redocly/cli bundle openapi.yaml --ext json"
prompt: Act as Openapi and handle the task per the instructions.
