  - Tools: `Glob`, `Grep`, `Read`, `Openresty`, `Resty` (see frontmatter `tools`/`allowed-tools`)\n- Use\
  \ `safe_path` for any write; record evidence (paths, checksums)\n- Fingerprint: `openresty:db9c4c62`\n\
  \n# OpenResty\n\nOpenResty bundles nginx with LuaJIT so you can script request handling at the edge.\n\
  \n## What this skill does\n\n- Runs and tests nginx-Lua configs\n- Uses the resty CLI for quick Lua\
  \ experiments\n- Installs lua-resty libraries\n\n## When to use\n\n- Edge logic: auth, rate limits,\
  \ request transforms\n- Dynamic routing without full services\n\n## Real commands\n\n```bash\n# Validate\
  \ and reload\nopenresty -t\nopenresty -s reload\n\n# Quick Lua experiments\nresty -e 'ngx.say(ngx.var.request_uri)'\n\
  resty -e 'local cjson = require(\"cjson\"); ngx.say(cjson.encode({a=1}))'\n\n# Libraries\nluarocks install\
  \ lua-resty-http\nluarocks install lua-resty-redis\n```\n\n## In nginx.conf\n\n```nginx\nserver {\n\
  \    listen 8080;\n    location /hello {\n        content_by_lua_block {\n            ngx.say(\"hello,\
  \ \", ngx.var.arg_name or \"world\")\n        }\n    }\n}\n```\n\n## Best practices\n\n- Test logic\
  \ with resty before wiring into nginx\n- Use lua-resty modules instead of raw ngx APIs when possible\n\
  - Keep Lua code in .lua files loaded with `lua_package_path`\n\n## Capabilities\n\n### openresty-lua\n\
  Write and test Lua handlers for OpenResty and manage Lua modules with luarocks.\n\n**Parameters:**\n\
  - `lua_code` (string): Inline Lua code to run with resty\n- `rock` (string): lua-resty module name for\
  \ luarocks\n- `config` (string): nginx config path\n\n**Commands:**\n- `openresty -t`\n- `openresty\
  \ -s reload`\n- `resty -e 'ngx.say(ngx.var.request_uri)'`\n- `luarocks install lua-resty-http`\n- `openresty\
  \ -p /usr/local/openresty/nginx/ -c nginx.conf`\n\n**Examples:**\n- resty -e 'local cjson = require(\"\
  cjson\"); ngx.say(cjson.encode({a=1}))'\n- luarocks install lua-resty-redis\n- openresty -t && openresty\
  \ -s reload\n\n## References\n- [OpenResty Official Site](https://openresty.org/en/)\n- [OpenResty Lua\
  \ Guide](https://github.com/openresty/lua-nginx-module)"
