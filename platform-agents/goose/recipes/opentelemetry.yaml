title: Opentelemetry
description: Runs the OpenTelemetry Collector with configured receivers, processors, and exporters. Validates
  OTLP ingestion over HTTP/gRPC and verifies collector self-metrics.
version: 2.0.0
instructions: "# Opentelemetry\n\nRuns the OpenTelemetry Collector with configured receivers, processors,\
  \ and exporters. Validates OTLP ingestion over HTTP/gRPC and verifies collector self-metrics.\n\n##\
  \ Instructions\n\n# OpenTelemetry\n\nOpenTelemetry standardizes how traces, metrics and logs are produced\
  \ and shipped.\n\n## What this skill does\n\n- Runs the OTel Collector with a config pipeline\n- Exports\
  \ telemetry over OTLP\n- Verifies data reaches the collector\n\n## When to use\n\n- Adopting observability\
  \ across services\n- Replacing vendor-specific SDKs\n\n## Real commands\n\n```bash\n# Run collector\n\
  otelcol --config config.yaml\notelcol-contrib --config config.yaml\n\n# OTLP/HTTP ingest test\ncurl\
  \ -X POST http://localhost:4318/v1/traces -H \"Content-Type: application/json\" -d @trace.json\ncurl\
  \ -X POST http://localhost:4318/v1/metrics -H \"Content-Type: application/json\" -d @metric.json\n\n\
  # Collector self-metrics\ncurl -s http://localhost:8888/metrics | grep otelcol\n```\n\n## config.yaml\n\
  \n```yaml\nreceivers:\n  otlp:\n    protocols:\n      grpc:\n      http:\nprocessors:\n  batch:\nexporters:\n\
  \  otlp:\n    endpoint: jaeger:4317\n    tls:\n      insecure: true\nservice:\n  pipelines:\n    traces:\n\
  \      receivers: [otlp]\n      processors: [batch]\n      exporters: [otlp]\n```\n\n## SDK setup (Node)\n\
  \n```js\nconst { NodeSDK } = require('@opentelemetry/sdk-node');\nconst sdk = new NodeSDK();\nsdk.start();\n\
  ```\n\n## Best practices\n\n- Start with traces, then metrics, then logs\n- Batch processor in every\
  \ pipeline\n- Export to a backend before scaling collection\n\n## Capabilities\n\n### otel-pipelines\n\
  Run the OTel Collector, configure receivers/exporters, and verify OTLP ingestion.\n\n**Commands:**\n\
  - `otelcol --config config.yaml`\n- `otelcol-contrib --config config.yaml`\n- `curl -X POST http://localhost:4318/v1/traces\
  \ -H \"Content-Type: application/json\" -d @trace.json`\n- `curl -X POST http://localhost:4318/v1/metrics\
  \ -H \"Content-Type: application/json\" -d @metric.json`\n- `curl -s http://localhost:8888/metrics |\
  \ grep otelcol`\n\n**Examples:**\n- docker run -p 4317:4317 -p 4318:4318 otel/opentelemetry-collector-contrib\n\
  - curl -X POST http://localhost:4318/v1/traces -H \"Content-Type: application/json\" -d @trace.json\n\
  - curl -s http://localhost:8888/metrics | grep otelcol_receiver"
prompt: Act as Opentelemetry and handle the task per the instructions.
