  \ relay SQL, and Debezium outbox event router connectors. — `mysql -u app -p -e \"SELECT * FROM outbox\
  \ WHERE status='pending' ORDER BY id LIMI`\n- Check `knowledge` and `prerequisites: mysql`\n\n### 2.\
  \ Reason — think for `outbox-pattern`\n- For `outbox-implementation`: Design outbox tables, poll-and-forward\
  \ relay SQL, and Debezium outbox event router connectors. — decide which checks to run\n- Evaluate trust/policy:\
  \ `kdesk trust` + `kdesk doctor` patterns for your inputs\n\n### 3. Act — execute with `outbox-pattern`\
  \ tools\n- Tools: `Glob`, `Grep`, `Read`, `Mysql`, `Bash` (see frontmatter `tools`/`allowed-tools`)\n\
  - Use `safe_path` for any write; record evidence (paths, checksums)\n- Fingerprint: `outbox-pattern:c004db4a`\n\
  \n# Outbox Pattern\n\nThe transactional outbox writes events to the same DB transaction as the business\
  \ change, then relays them to the broker.\n\n## What this skill does\n\n- Designs outbox table schemas\n\
  - Implements relay workers (poll or CDC)\n- Deploys Debezium connectors\n\n## When to use\n\n- Publishing\
  \ events reliably from DB-backed services\n- Avoiding dual-write problems (DB + broker)\n\n## Real commands\n\
  \n```bash\n# Relay worker polling\nmysql -u app -p -e \"SELECT * FROM outbox WHERE status='pending'\
  \ ORDER BY id LIMIT 100;\"\nmysql -u app -p -e \"UPDATE outbox SET status='sent' WHERE id IN (...);\"\
  \n\n# Debezium connector lifecycle\ncurl -X POST http://localhost:8083/connectors -H \"Content-Type:\
  \ application/json\" -d @outbox-connector.json\ncurl -s http://localhost:8083/connectors/outbox-connector/status\n\
  curl -X DELETE http://localhost:8083/connectors/outbox-connector\n```\n\n## Table schema\n\n```sql\n\
  CREATE TABLE outbox (\n  id BIGINT AUTO_INCREMENT PRIMARY KEY,\n  aggregate_type VARCHAR(100) NOT NULL,\n\
  \  aggregate_id VARCHAR(100) NOT NULL,\n  event_type VARCHAR(100) NOT NULL,\n  payload JSON NOT NULL,\n\
  \  created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n  status ENUM('pending','sent') DEFAULT 'pending'\n\
  );\n```\n\n## Best practices\n\n- Write event + business row in ONE transaction\n- Make relay idempotent\
  \ (publish, then mark sent)\n- Add retention cleanup for old sent rows\n\n## Capabilities\n\n### outbox-implementation\n\
  Design outbox tables, poll-and-forward relay SQL, and Debezium outbox event router connectors.\n\n**Parameters:**\n\
  - `table` (string): Outbox table name\n- `status` (string): pending, sent or failed\n- `connector_name`\
  \ (string): Debezium connector name\n\n**Commands:**\n- `mysql -u app -p -e \"SELECT * FROM outbox WHERE\
  \ status='pending' ORDER BY id LIMIT 100;\"`\n- `mysql -u app -p -e \"UPDATE outbox SET status='sent'\
  \ WHERE id IN (...);\"`\n- `curl -X POST http://localhost:8083/connectors -H \"Content-Type: application/json\"\
  \ -d @outbox-connector.json`\n- `curl -s http://localhost:8083/connectors`\n- `curl -s http://localhost:8083/connectors/outbox-connector/status`\n\
  \n**Examples:**\n- curl -s http://localhost:8083/connectors/outbox-connector/status | jq .\n- mysql\
  \ -u app -p -e \"SELECT COUNT(*) FROM outbox WHERE status='pending';\"\n- curl -X DELETE http://localhost:8083/connectors/outbox-connector\n\
  \n## References\n- [Debezium Outbox Event Router](https://debezium.io/documentation/reference/stable/transformations/outbox-event-router.html)\n\
  - [Microservices.io Outbox Pattern](https://microservices.io/patterns/data/transactional-outbox.html)"
