title: Outbox Pattern
description: Implements the transactional outbox approach with database outbox tables, poll-and-forward
  relay workers, and Debezium CDC connectors for reliable event publishing without dual-write problems.
version: 2.0.0
instructions: "# Outbox Pattern\n\nImplements the transactional outbox approach with database outbox tables,\
  \ poll-and-forward relay workers, and Debezium CDC connectors for reliable event publishing without\
  \ dual-write problems.\n\n## Instructions\n\n# Outbox Pattern\n\nThe transactional outbox writes events\
  \ to the same DB transaction as the business change, then relays them to the broker.\n\n## What this\
  \ skill does\n\n- Designs outbox table schemas\n- Implements relay workers (poll or CDC)\n- Deploys\
  \ Debezium connectors\n\n## When to use\n\n- Publishing events reliably from DB-backed services\n- Avoiding\
  \ dual-write problems (DB + broker)\n\n## Real commands\n\n```bash\n# Relay worker polling\nmysql -u\
  \ app -p -e \"SELECT * FROM outbox WHERE status='pending' ORDER BY id LIMIT 100;\"\nmysql -u app -p\
  \ -e \"UPDATE outbox SET status='sent' WHERE id IN (...);\"\n\n# Debezium connector lifecycle\ncurl\
  \ -X POST http://localhost:8083/connectors -H \"Content-Type: application/json\" -d @outbox-connector.json\n\
  curl -s http://localhost:8083/connectors/outbox-connector/status\ncurl -X DELETE http://localhost:8083/connectors/outbox-connector\n\
  ```\n\n## Table schema\n\n```sql\nCREATE TABLE outbox (\n  id BIGINT AUTO_INCREMENT PRIMARY KEY,\n \
  \ aggregate_type VARCHAR(100) NOT NULL,\n  aggregate_id VARCHAR(100) NOT NULL,\n  event_type VARCHAR(100)\
  \ NOT NULL,\n  payload JSON NOT NULL,\n  created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\n  status ENUM('pending','sent')\
  \ DEFAULT 'pending'\n);\n```\n\n## Best practices\n\n- Write event + business row in ONE transaction\n\
  - Make relay idempotent (publish, then mark sent)\n- Add retention cleanup for old sent rows\n\n## Capabilities\n\
  \n### outbox-implementation\nDesign outbox tables, poll-and-forward relay SQL, and Debezium outbox event\
  \ router connectors.\n\n**Commands:**\n- `mysql -u app -p -e \"SELECT * FROM outbox WHERE status='pending'\
  \ ORDER BY id LIMIT 100;\"`\n- `mysql -u app -p -e \"UPDATE outbox SET status='sent' WHERE id IN (...);\"\
  `\n- `curl -X POST http://localhost:8083/connectors -H \"Content-Type: application/json\" -d @outbox-connector.json`\n\
  - `curl -s http://localhost:8083/connectors`\n- `curl -s http://localhost:8083/connectors/outbox-connector/status`\n\
  \n**Examples:**\n- curl -s http://localhost:8083/connectors/outbox-connector/status | jq .\n- mysql\
  \ -u app -p -e \"SELECT COUNT(*) FROM outbox WHERE status='pending';\"\n- curl -X DELETE http://localhost:8083/connectors/outbox-connector"
prompt: Act as Outbox Pattern and handle the task per the instructions.
