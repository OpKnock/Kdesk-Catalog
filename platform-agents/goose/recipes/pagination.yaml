title: Pagination
description: Designs and tests paginated REST endpoints with page/limit and cursor-based strategies. Emits
  RFC 8288 Link headers, enforces max page size, and validates cursor stability under concurrent writes.
version: 2.0.0
instructions: "# Pagination\n\nDesigns and tests paginated REST endpoints with page/limit and cursor-based\
  \ strategies. Emits RFC 8288 Link headers, enforces max page size, and validates cursor stability under\
  \ concurrent writes.\n\n## Instructions\n\n# Pagination\n\nPaginate large collections predictably so\
  \ clients never have to fetch everything.\n\n## What this skill does\n\n- Designs page/limit and cursor\
  \ APIs\n- Emits RFC 8288 Link headers\n- Tests pagination behavior with curl\n\n## When to use\n\n-\
  \ New list endpoints\n- Fixing slow endpoints returning unbounded data\n\n## Real commands\n\n```bash\n\
  # Offset pagination\ncurl -s \"https://api.your-app.test/v1/items?page=2&per_page=20\" | jq .\n\n# Link\
  \ headers\ncurl -sI \"https://api.your-app.test/v1/items?per_page=20\" | grep -i '^link:'\n\n# Cursor\
  \ pagination\ncurl -s \"https://api.your-app.test/v1/items?cursor=eyJpZCI6MTAwfQ\" | jq '.data,.next_cursor'\n\
  ```\n\n## Link header shape\n\n```http\nLink: <https://api.your-app.test/v1/items?page=2&per_page=20>;\
  \ rel=\"next\", <https://api.your-app.test/v1/items?page=1&per_page=20>; rel=\"prev\"\n```\n\n## Response\
  \ envelope\n\n```json\n{\n  \"data\": [ ... ],\n  \"pagination\": { \"page\": 2, \"per_page\": 20, \"\
  total\": 1000 }\n}\n```\n\n## Cursor vs offset\n\n- Offset: simple, but unstable with inserts\n- Cursor/keyset:\
  \ stable, better for streams\n\n## Best practices\n\n- Cap per_page (e.g. max 100) and document it\n\
  - Include Link headers on every page\n- For streams, prefer cursor pagination\n\n## Capabilities\n\n\
  ### pagination-design\nDesign and test paginated endpoints: query params, Link headers and cursor traversal.\n\
  \n**Commands:**\n- `curl -s \"https://api.your-app.test/v1/items?page=2&per_page=20\" | jq .`\n- `curl\
  \ -sI \"https://api.your-app.test/v1/items?page=1&per_page=20\"`\n- `curl -s \"https://api.your-app.test/v1/items?cursor=eyJpZCI6MTAwfQ\"\
  \ | jq '.data,.next_cursor'`\n- `curl -s \"https://api.your-app.test/v1/items?limit=50\" | jq '.links'`\n\
  - `curl -sI \"https://api.your-app.test/v1/items\" | grep -i '^link:'`\n\n**Examples:**\n- curl -sI\
  \ \"https://api.your-app.test/v1/items?per_page=20\" | grep -i '^link:' | tr ',' '\\n'\n- curl -s \"\
  https://api.your-app.test/v1/items?page=2&per_page=20\" | jq '.pagination'\n- curl -s \"https://api.your-app.test/v1/items?cursor=eyJpZCI6MTAwfQ\"\
  \ | jq '.data[0].id'"
prompt: Act as Pagination and handle the task per the instructions.
