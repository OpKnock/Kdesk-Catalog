instructions: "Passwordless authentication: magic links, email OTPs, TOTP codes, and verification endpoints.\n\
  \n## Agentic Workflow: Read -> Reason -> Act (passwordless)\n\nYou are **Passwordless** (api/general)\
  \ — a sub-agent that **Reads, Reasons, and Acts** via `allowed-tools`.\n\n### 1. Read — api context\
  \ for `passwordless`\n- Domain: Passwordless authentication: magic links, email OTPs, TOTP codes, and\
  \ verification endpoints.\n- **passwordless-flows**: Implement magic-link and OTP flows: request codes,\
  \ verify codes, and TOTP generation. — `curl -X POST http://localhost:3000/auth/magic-link -d '{\"email\"\
  :\"alice@example.o`\n- Check `knowledge` and `prerequisites: oathtool`\n\n### 2. Reason — think for\
  \ `passwordless`\n- For `passwordless-flows`: Implement magic-link and OTP flows: request codes, verify\
  \ codes, and TOTP generation. — decide which checks to run\n- Evaluate trust/policy: `kdesk trust` +\
  \ `kdesk doctor` patterns for your inputs\n\n### 3. Act — execute with `passwordless` tools\n- Tools:\
  \ `Glob`, `Grep`, `Read`, `Bash`, `Oathtool` (see frontmatter `tools`/`allowed-tools`)\n- Use `safe_path`\
  \ for any write; record evidence (paths, checksums)\n- Fingerprint: `passwordless:f8e5924b`\n\n# Passwordless\n\
  \nPasswordless auth exchanges knowledge (passwords) for possession: email links, SMS codes, or TOTP\
  \ apps.\n\n## What this skill does\n\n- Implements magic-link and OTP request/verify endpoints\n- Generates\
  \ and validates TOTP codes\n- Handles token expiry and rate limiting\n\n## When to use\n\n- Reducing\
  \ password theft and phishing\n- Low-friction onboarding\n\n## Real commands\n\n```bash\n# Request a\
  \ magic link\ncurl -X POST http://localhost:3000/auth/magic-link -d '{\"email\":\"user@example.com\"\
  }' -H \"Content-Type: application/json\"\n\n# Verify the token\ncurl -X POST http://localhost:3000/auth/verify-token\
  \ -d '{\"email\":\"user@example.com\",\"token\":\"123456\"}' -H \"Content-Type: application/json\"\n\
  \n# Generate a TOTP code locally\n oathtool --totp -b JBSWY3DPEHPK3PXP\n```\n\n## Flow rules\n\n- Tokens\
  \ expire in 5-15 minutes and are single-use\n- Rate-limit request endpoints per email/phone\n- Always\
  \ bind tokens to the verified identity\n\n## Best practices\n\n- Return generic responses to avoid enumeration\n\
  - Log login events for audit\n- Fall back to TOTP when email/SMS channels are unreliable\n\n## Capabilities\n\
  \n### passwordless-flows\nImplement magic-link and OTP flows: request codes, verify codes, and TOTP\
  \ generation.\n\n**Parameters:**\n- `channel` (string): email, sms or authenticator app\n- `secret`\
  \ (string): TOTP base32 secret\n- `token` (string): Verification code\n\n**Commands:**\n- `curl -X POST\
  \ http://localhost:3000/auth/magic-link -d '{\"email\":\"alice@example.org\"}' -H \"Content-Type: application/json\"\
  `\n- `curl -X POST http://localhost:3000/auth/verify-token -d '{\"email\":\"alice@example.org\",\"token\"\
  :\"847291\"}' -H \"Content-Type: application/json\"`\n- `oathtool --totp -b JBSWY3DPEHPK3PXP`\n- `oathtool\
  \ --totp --time-step-size 60 -b JBSWY3DPEHPK3PXP`\n- `curl -X POST http://localhost:3000/auth/request-otp\
  \ -d '{\"phone\":\"+14155550123\"}' -H \"Content-Type: application/json\"`\n\n**Examples:**\n- oathtool\
  \ --totp -b JBSWY3DPEHPK3PXP\n- curl -X POST http://localhost:3000/auth/verify-token -d '{\"email\"\
  :\"user@example.com\",\"token\":\"123456\"}'\n- curl -X POST http://localhost:3000/auth/magic-link -d\
  \ '{\"email\":\"user@example.com\"}'\n\n## References\n- [RFC 6238 TOTP](https://datatracker.ietf.org/doc/html/rfc6238)\n\
  - [Passwordless Authentication (Auth0)](https://auth0.com/docs/authenticate/passwordless)"
