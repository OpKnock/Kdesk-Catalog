title: Performance Baseline
description: 'Establish performance baselines: k6 load tests, thresholds, trend stats, and regression
  comparison.'
version: 2.0.0
instructions: "# Performance Baseline\n\nEstablish performance baselines: k6 load tests, thresholds, trend\
  \ stats, and regression comparison.\n\n## Instructions\n\n# Performance Baselines\n\nBaselines give\
  \ you a number to compare against every release, catching regressions early.\n\n## What this skill does\n\
  \n- Writes k6 scenarios with realistic load\n- Sets thresholds that fail the build\n- Stores results\
  \ for comparison\n\n## When to use\n\n- Before big releases\n- After infra changes (DB, caches, deploys)\n\
  \n## Real commands\n\n```bash\n# Run a load test\nk6 run --vus 50 --duration 30s script.js\n\n# Inspect\
  \ script structure\nk6 inspect script.js\n\n# Custom stats\nk6 run --summary-trend-stats=\"avg,p(95),p(99)\"\
  \ script.js\n\n# Environment override\nk6 run --env BASE_URL=https://staging.your-app.test script.js\n\
  \n# JSON output for comparison\nk6 run --out json=results.json script.js\n```\n\n## Script with thresholds\n\
  \n```js\nimport http from 'k6/http';\nimport { check, sleep } from 'k6';\n\nexport const options = {\n\
  \  vus: 50,\n  duration: '1m',\n  thresholds: {\n    http_req_duration: ['p(95)<500'],\n    http_req_failed:\
  \ ['rate<0.01'],\n  },\n};\n\nexport default function () {\n  const res = http.get('http://localhost:8080/api/health');\n\
  \  check(res, { 'status 200': (r) => r.status === 200 });\n  sleep(1);\n}\n```\n\n## Best practices\n\
  \n- Fix the baseline dataset and environment for comparability\n- Compare p(95), not averages\n- Run\
  \ in CI with thresholds to gate releases\n\n## Capabilities\n\n### k6-baseline-testing\nWrite and run\
  \ k6 load tests with thresholds, virtual users and summary statistics.\n\n**Commands:**\n- `k6 run --vus\
  \ 50 --duration 30s script.js`\n- `k6 inspect script.js`\n- `k6 run --summary-trend-stats=\"avg,p(95),p(99)\"\
  \ script.js`\n- `k6 run --env BASE_URL=https://staging.your-app.test script.js`\n- `k6 run --out json=results.json\
  \ script.js`\n\n**Examples:**\n- k6 run --vus 20 --duration 1m --summary-trend-stats='avg,p(90),p(95)'\
  \ script.js\n- k6 inspect script.js\n- k6 run --out json=results.json --vus 100 --duration 2m script.js"
prompt: Act as Performance Baseline and handle the task per the instructions.
