title: performance
description: 'Web performance analysis: Lighthouse audits, load testing, and request timing measurements.'
version: 2.0.0
instructions: "# performance\n\nWeb performance analysis: Lighthouse audits, load testing, and request\
  \ timing measurements.\n\n## Instructions\n\n# Performance\n\nMeasures and diagnoses web performance:\
  \ lab audits (Lighthouse), load tests, and\nraw request timing.\n\n## When to Use\n\n- Auditing Core\
  \ Web Vitals (LCP, INP, CLS)\n- Comparing page speed before/after a change\n- Capacity testing an API\
  \ or web server\n\n## Real Commands\n\n```bash\n# Lighthouse JSON audit\nnpx lighthouse https://example.com\
  \ --output=json --output-path=./lh.json\n\n# HTML report for sharing\nnpx lighthouse https://example.com\
  \ --output=html --output-path=./lh.html\n\n# Performance-only with a budget\nnpx lighthouse https://example.com\
  \ --only-categories=performance --budget-path=budget.json\n\n# Quick TTFB measurement\ncurl -o /dev/null\
  \ -s -w '%{time_total}s ttfb=%{time_starttransfer}s\n' https://example.com\n\n# Load test with wrk\n\
  wrk -t4 -c100 -d30s http://localhost:3000/ --latency\n\n# Scripted load test with k6\nk6 run load-test.js\n\
  ```\n\n## Budget Example (budget.json)\n\n```json\n{\n  \"timings\": [{\"metric\": \"lcp\", \"budget\"\
  : 2500}],\n  \"resourceSizes\": [{\"resourceType\": \"script\", \"budget\": 200}]\n}\n```\n\n## k6 Script\
  \ Example\n\n```js\nimport http from 'k6/http';\nimport { check } from 'k6';\n\nexport const options\
  \ = { vus: 50, duration: '60s' };\n\nexport default function () {\n  const res = http.get('https://example.com/');\n\
  \  check(res, { 'status 200': (r) => r.status === 200 });\n}\n```\n\n## Best Practices\n\n- Run Lighthouse\
  \ on a fixed device profile (Moto G Power / slow 4G) for comparability\n- Measure before and after;\
  \ one-off numbers are noisy\n- Use `wrk --latency` to see percentile tails, not just averages\n- Combine\
  \ lab (Lighthouse) and field (RUM) data for the full picture\n\n## Example Response\n\nReturns Lighthouse\
  \ scores per category with the top 5 performance opportunities\n(LCP, TBT, CLS), plus curl timing breakdown\
  \ and load-test percentile latencies.\n\n## Capabilities\n\n### web-performance\nMeasure page performance\
  \ with Lighthouse, curl timing, and load tests\n\n**Commands:**\n- `npx lighthouse http://localhost:8080\
  \ --output=json --output-path=./lh-report.json`\n- `curl -o /dev/null -s -w 'total: %{time_total}s ttfb:\
  \ %{time_starttransfer}s\n' https://example.com`\n- `npx lighthouse http://localhost:8080 --only-categories=performance\
  \ --budget-path=budget.json`\n- `wrk -t4 -c100 -d30s http://localhost:3000/`\n- `k6 run load-test.js`\n\
  \n**Examples:**\n- npx lighthouse http://localhost:8080 --chrome-flags='--headless' --output=html\n\
  - curl -w '%{http_code} %{time_total}' -o /dev/null http://localhost:8080/api/health\n- wrk -t8 -c200\
  \ -d60s http://localhost:8080/api --latency"
prompt: Act as performance and handle the task per the instructions.
