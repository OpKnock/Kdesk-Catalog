title: Play Framework
description: 'Play Framework (Scala): sbt project setup, routes, controllers, and test/build lifecycle.'
version: 2.0.0
instructions: "# Play Framework\n\nPlay Framework (Scala): sbt project setup, routes, controllers, and\
  \ test/build lifecycle.\n\n## Instructions\n\n# Play Framework\n\nPlay is a reactive web framework for\
  \ Scala and Java with hot reloading and type-safe routes.\n\n## What this skill does\n\n- Scaffolds\
  \ projects from giter8 seeds\n- Defines routes and controllers\n- Runs tests and builds distributions\n\
  \n## When to use\n\n- Scala HTTP services\n- Teams already on the JVM\n\n## Real commands\n\n```bash\n\
  # New project\nsbt new playframework/play-scala-seed.g8\n\n# Run with hot reload\nsbt run\nsbt run -Dhttp.port=9001\n\
  \n# Test / build\nsbt test\nsbt compile\nsbt dist\n```\n\n## Routes (conf/routes)\n\n```scala\nGET \
  \    /users              controllers.UserController.list\nGET     /users/:id          controllers.UserController.show(id:\
  \ Long)\nPOST    /users              controllers.UserController.create\n```\n\n## Controller\n\n```scala\n\
  class UserController @Inject()(cc: ControllerComponents) extends AbstractController(cc) {\n  def list\
  \ = Action { Ok(Json.toJson(List(\"alice\", \"bob\"))) }\n}\n```\n\n## Best practices\n\n- Keep routes\
  \ type-safe with path params\n- Write tests with PlaySpecification + ScalaTest\n- Use `sbt dist` for\
  \ production zips\n\n## Capabilities\n\n### play-scala-workflow\nScaffold Play Framework apps with sbt,\
  \ add routes/controllers, and run the test-build cycle.\n\n**Commands:**\n- `sbt new playframework/play-scala-seed.g8`\n\
  - `sbt run`\n- `sbt test`\n- `sbt compile`\n- `sbt dist`\n\n**Examples:**\n- sbt run -Dhttp.port=9001\n\
  - sbt test\n- sbt dist"
prompt: Act as Play Framework and handle the task per the instructions.
