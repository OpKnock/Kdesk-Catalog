title: playwright-config
description: 'Configures Playwright test projects: browsers, webServer, baseURL, devices, and CI settings.'
version: 2.0.0
instructions: "# playwright-config\n\nConfigures Playwright test projects: browsers, webServer, baseURL,\
  \ devices, and CI settings.\n\n## Instructions\n\n# Playwright Configuration\n\nTune Playwright Test\
  \ for your projects and CI.\n\n## What This Skill Does\n\n- Initializes Playwright and installs browsers\n\
  - Defines projects for desktop/mobile devices\n- Manages webServer startup and baseURL\n- Configures\
  \ parallelism, retries, and reporters\n\n## When to Use\n\n- Setting up Playwright for a new repo\n\
  - Adjusting browser matrix and sharding\n- Debugging CI flakiness via config\n\n## Real Commands\n\n\
  ```bash\n# Init\nnpm init playwright@latest\nnpx playwright install --with-deps\nnpx playwright test\
  \ --list\n\n# Projects\nnpx playwright test --project=desktop\nnpx playwright test --project=mobile\
  \ --grep @smoke\n\n# CI overrides\nnpx playwright test --workers=2 --retries=3 --reporter=html\nnpx\
  \ playwright test --config=playwright.config.ts --baseURL=https://staging.example.com\n```\n\n## Sample\
  \ Config\n\n```ts\nimport { defineConfig, devices } from '@playwright/test';\n\nexport default defineConfig({\n\
  \  testDir: './tests',\n  timeout: 30_000,\n  retries: process.env.CI ? 2 : 0,\n  workers: process.env.CI\
  \ ? 2 : undefined,\n  use: {\n    baseURL: process.env.BASE_URL ?? 'http://localhost:3000',\n    trace:\
  \ 'on-first-retry'\n  },\n  webServer: {\n    command: 'npm run dev',\n    url: 'http://localhost:3000',\n\
  \    reuseExistingServer: !process.env.CI\n  },\n  projects: [\n    { name: 'desktop', use: { ...devices['Desktop\
  \ Chrome'] } },\n    { name: 'mobile', use: { ...devices['iPhone 13'] } }\n  ]\n});\n```\n\n## Best\
  \ Practices\n\n- Enable trace on-first-retry for flake debugging\n- Use reuseExistingServer locally\
  \ for fast loops\n- Set retries higher in CI than locally\n- Pin devices from the devices module; avoid\
  \ hardcoded viewports\n- Keep webServer commands environment-agnostic\n\n## Capabilities\n\n### playwright-init\n\
  Initialize and validate Playwright configuration.\n\n**Commands:**\n- `npm init playwright@latest`\n\
  - `npx playwright install chromium`\n- `npx playwright install --with-deps`\n- `npx playwright test\
  \ --list`\n- `npx playwright test --config=playwright.config.ts`\n\n**Examples:**\n- npm init playwright@latest\n\
  - npx playwright install --with-deps\n- npx playwright test --list\n\n### config-projects\nConfigure\
  \ projects, devices, and baseURL.\n\n**Commands:**\n- `npx playwright test --project=desktop`\n- `npx\
  \ playwright test --project=mobile --grep @smoke`\n- `npx playwright test --config=playwright.config.ts\
  \ --baseURL=http://localhost:8080`\n- `npx playwright test --project=webkit`\n\n**Examples:**\n- npx\
  \ playwright test --project=desktop\n- npx playwright test --config=playwright.config.ts --baseURL=http://localhost:8080\n\
  - npx playwright test --project=mobile\n\n### ci-and-webserver\nWeb server and CI worker configuration.\n\
  \n**Commands:**\n- `npx playwright test --workers=2`\n- `npx playwright test --reporter=html`\n- `npx\
  \ playwright test --retries=3`\n- `npx playwright test --global-timeout=1800000`\n- `npx playwright\
  \ test --timeout=30000`\n\n**Examples:**\n- npx playwright test --workers=2 --retries=3\n- npx playwright\
  \ test --reporter=html\n- npx playwright test --timeout=30000"
prompt: Act as playwright-config and handle the task per the instructions.
