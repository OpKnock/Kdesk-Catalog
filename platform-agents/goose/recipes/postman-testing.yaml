title: postman-testing
description: Designs and runs API tests with Postman collections via Newman CLI, including environments,
  data files, and reporters.
version: 2.0.0
instructions: "# postman-testing\n\nDesigns and runs API tests with Postman collections via Newman CLI,\
  \ including environments, data files, and reporters.\n\n## Instructions\n\n# Postman / Newman\n\nRun\
  \ Postman collections in CI with Newman.\n\n## What This Skill Does\n\n- Executes collections against\
  \ environments\n- Runs data-driven iterations from CSV/JSON\n- Asserts responses with pm.test scripts\n\
  - Emits HTML, JUnit, and JSON reports\n\n## When to Use\n\n- API regression suites in CI\n- Environment\
  \ smoke tests\n- Contract verification against staging\n\n## Real Commands\n\n```bash\n# Basic runs\n\
  newman run collection.json\nnewman run collection.json -e staging.postman_environment.json\nnewman run\
  \ collection.json --folder auth\n\n# Data-driven\nnewman run collection.json -d data.csv\nnewman run\
  \ collection.json -d users.json --iterations 100\n\n# Reports\nnewman run collection.json -r html --reporter-html-export\
  \ report.html\nnewman run collection.json -r junit --reporter-junit-export results.xml\n```\n\n## Assertion\
  \ Script\n\n```js\npm.test('creates user with 201', () => {\n  pm.response.to.have.status(201);\n  const\
  \ body = pm.response.json();\n  pm.expect(body.data.id).to.be.a('string');\n  pm.expect(body.data.email).to.eql(pm.variables.get('expectedEmail'));\n\
  });\n```\n\n## Best Practices\n\n- Keep environments as variables, never hardcode URLs\n- Use {{variables}}\
  \ for data from earlier requests\n- Write pm.test assertions for every critical response\n- Run --folder\
  \ scoped suites in CI to control runtime\n- Export HTML/JUnit reports for dashboards\n\n## Capabilities\n\
  \n### newman-runs\nRun Postman collections with environments.\n\n**Commands:**\n- `newman run api.postman_collection.json`\n\
  - `newman run collection.json -e staging.postman_environment.json`\n- `newman run collection.json --env-var\
  \ baseUrl=http://localhost:8080`\n- `newman run collection.json --folder auth`\n- `newman run collection.json\
  \ --iteration-count 5`\n\n**Examples:**\n- newman run collection.json -e staging.postman_environment.json\n\
  - newman run collection.json --folder auth\n- newman run collection.json --env-var baseUrl=http://localhost:8080\n\
  \n### data-driven\nRun collections with CSV/JSON data files.\n\n**Commands:**\n- `newman run collection.json\
  \ -d data.csv`\n- `newman run collection.json -d users.json`\n- `newman run collection.json -d data.csv\
  \ --iterations 100`\n- `newman run collection.json -d data.csv --delay-request 500`\n\n**Examples:**\n\
  - newman run collection.json -d data.csv\n- newman run collection.json -d users.json --iterations 50\n\
  - newman run collection.json -d data.csv --delay-request 500\n\n### reporters\nEmit CLI, HTML, and JUnit\
  \ reports.\n\n**Commands:**\n- `newman run collection.json -r cli`\n- `newman run collection.json -r\
  \ html --reporter-html-export report.html`\n- `newman run collection.json -r junit --reporter-junit-export\
  \ results.xml`\n- `newman run collection.json -r json --reporter-json-export results.json`\n- `newman\
  \ run collection.json -r cli,html`\n\n**Examples:**\n- newman run collection.json -r html --reporter-html-export\
  \ report.html\n- newman run collection.json -r junit --reporter-junit-export results.xml\n- newman run\
  \ collection.json -r cli,html"
prompt: Act as postman-testing and handle the task per the instructions.
