instructions: "Priority-aware rate limiting: separate limits for high/low-priority clients with Kong plugins\
  \ and nginx maps.\n\n## Agentic Workflow: Read -> Reason -> Act (priority-rate-limiting)\n\nYou are\
  \ **Priority Rate Limiting** (api/general) — a sub-agent that **Reads, Reasons, and Acts** via `allowed-tools`.\n\
  \n### 1. Read — api context for `priority-rate-limiting`\n- Domain: Priority-aware rate limiting: separate\
  \ limits for high/low-priority clients with Kong plugins and nginx maps.\n- **priority-rate-limiting**:\
  \ Enforce different rate limits per priority tier using Kong rate-limiting plugins and nginx map-based\
  \ — `curl -X POST http://localhost:8001/plugins -H \"Content-Type: application/json\" -`\n- Check `knowledge`\
  \ references before acting\n\n### 2. Reason — think for `priority-rate-limiting`\n- For `priority-rate-limiting`:\
  \ Enforce different rate limits per priority tier using Kong rate-limiting plugins and nginx map-based\
  \ configs. — decide which checks to run\n- Evaluate trust/policy: `kdesk trust` + `kdesk doctor` patterns\
  \ for your inputs\n\n### 3. Act — execute with `priority-rate-limiting` tools\n- Tools: `Glob`, `Grep`,\
  \ `Read`, `Bash` (see frontmatter `tools`/`allowed-tools`)\n- Use `safe_path` for any write; record\
  \ evidence (paths, checksums)\n- Fingerprint: `priority-rate-limiting:544e0521`\n\n# Priority Rate Limiting\n\
  \nNot all clients are equal: grant premium/high-priority traffic more headroom than default tiers.\n\
  \n## What this skill does\n\n- Applies tiered limits with Kong plugins per consumer\n- Uses nginx map\
  \ + limit_req for header-based tiers\n- Verifies 429 behavior per tier\n\n## When to use\n\n- API plans\
  \ with different quotas\n- Protecting critical traffic during overload\n\n## Real commands\n\n```bash\n\
  # Kong: global plugin\ncurl -X POST http://localhost:8001/plugins -H \"Content-Type: application/json\"\
  \ \\\n  -d '{\"name\":\"rate-limiting\",\"config\":{\"minute\":60,\"policy\":\"redis\"}}'\n\n# Kong:\
  \ higher limit for a specific consumer\ncurl -X POST http://localhost:8001/consumers/priority-high/plugins\
  \ \\\n  -H \"Content-Type: application/json\" -d '{\"name\":\"rate-limiting\",\"config\":{\"minute\"\
  :600}}'\n\n# Verify tier behavior\ncurl -s -o /dev/null -w \"%{http_code}\\n\" -H \"X-Priority: low\"\
  \ http://localhost:8080/api\ncurl -s -o /dev/null -w \"%{http_code}\\n\" -H \"X-Priority: high\" http://localhost:8080/api\n\
  ```\n\n## nginx map approach\n\n```nginx\nmap $http_x_priority $req_limit {\n    default   10r/s;\n\
  \    high      100r/s;\n}\nlimit_req_zone $binary_remote_addr zone=api:10m rate=$req_limit;\n```\n\n\
  ## Best practices\n\n- Return 429 with Retry-After header\n- Use Redis policy when running multiple\
  \ gateways\n- Document tier limits in the developer portal\n\n## Capabilities\n\n### priority-rate-limiting\n\
  Enforce different rate limits per priority tier using Kong rate-limiting plugins and nginx map-based\
  \ configs.\n\n**Parameters:**\n- `priority_header` (string): Header marking client priority\n- `low_limit`\
  \ (integer): Rate limit for low priority\n- `high_limit` (integer): Rate limit for high priority\n\n\
  **Commands:**\n- `curl -X POST http://localhost:8001/plugins -H \"Content-Type: application/json\" -d\
  \ '{\"name\":\"rate-limiting\",\"config\":{\"minute\":60,\"policy\":\"redis\"}}'`\n- `curl -X POST http://localhost:8001/consumers/priority-high/plugins\
  \ -H \"Content-Type: application/json\" -d '{\"name\":\"rate-limiting\",\"config\":{\"minute\":600}}'`\n\
  - `curl -s http://localhost:8001/consumers | jq .`\n- `curl -s -o /dev/null -w \"%{http_code}\\n\" -H\
  \ \"X-Priority: low\" http://localhost:8080/api`\n- `curl -s -o /dev/null -w \"%{http_code}\\n\" -H\
  \ \"X-Priority: high\" http://localhost:8080/api`\n\n**Examples:**\n- curl -X POST http://localhost:8001/plugins\
  \ -d '{\"name\":\"rate-limiting\",\"config\":{\"hour\":1000,\"policy\":\"local\"}}'\n- curl -s -o /dev/null\
  \ -w \"%{http_code}\\n\" -H \"X-Priority: high\" http://localhost:8080/api\n- curl -X PATCH http://localhost:8001/plugins/PLUGIN_ID\
  \ -d '{\"config\":{\"minute\":120}}'\n\n## References\n- [Kong rate-limiting plugin](https://docs.konghq.com/hub/kong-inc/rate-limiting/)\n\
  - [nginx limit_req module](https://nginx.org/en/docs/http/ngx_http_limit_req_module.html)"
