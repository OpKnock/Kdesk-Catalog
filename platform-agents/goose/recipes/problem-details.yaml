title: Problem Details
description: 'RFC 7807 problem details: structured error responses, media types, instances, and client
  handling.'
version: 2.0.0
instructions: "# Problem Details\n\nRFC 7807 problem details: structured error responses, media types,\
  \ instances, and client handling.\n\n## Instructions\n\n# Problem Details\n\nRFC 7807 standardizes machine-readable\
  \ error responses with type, title, status, detail and instance.\n\n## What this skill does\n\n- Shapes\
  \ error responses across endpoints\n- Emits application/problem+json correctly\n- Tests clients against\
  \ structured errors\n\n## When to use\n\n- Consistent error handling in REST APIs\n- API clients that\
  \ branch on error type\n\n## Real commands\n\n```bash\n# Verify media type and status\ncurl -s -o /dev/null\
  \ -w \"%{http_code} %{content_type}\\n\" http://localhost:8080/api/orders/12345\n\n# Inspect fields\n\
  curl -s http://localhost:8080/api/orders/12345 | jq '.title,.detail,.type'\n\n# Validation errors\n\
  curl -s -X POST -H \"Content-Type: application/json\" -d '{}' http://localhost:8080/api/orders | jq\
  \ .\n```\n\n## Response body\n\n```json\n{\n  \"type\": \"https://api.example.com/errors/order-not-found\"\
  ,\n  \"title\": \"Order not found\",\n  \"status\": 404,\n  \"detail\": \"No order with id 12345\",\n\
  \  \"instance\": \"/api/orders/12345\"\n}\n```\n\n## Validation extension\n\n```json\n{\n  \"type\"\
  : \"https://api.example.com/errors/validation\",\n  \"status\": 400,\n  \"violations\": [\n    { \"\
  name\": \"amount\", \"reason\": \"must be positive\" }\n  ]\n}\n```\n\n## Best practices\n\n- Keep `type`\
  \ stable and documented per error class\n- Use 4xx status codes that match the semantics\n- Log `instance`\
  \ for correlation with traces\n\n## Capabilities\n\n### problem-details-responses\nDesign, emit and\
  \ consume application/problem+json error payloads with extension members.\n\n**Commands:**\n- `curl\
  \ -s -H \"Accept: application/problem+json\" http://localhost:8080/api/orders/12345`\n- `curl -s -o\
  \ /dev/null -w \"%{http_code} %{content_type}\\n\" http://localhost:8080/api/orders/12345`\n- `curl\
  \ -s -X POST -H \"Content-Type: application/json\" -d '{}' http://localhost:8080/api/orders | jq .`\n\
  - `curl -s http://localhost:8080/api/orders/12345 | jq '.title,.detail,.type'`\n- `curl -sI http://localhost:8080/api/orders/12345\
  \ | grep -i content-type`\n\n**Examples:**\n- curl -s http://localhost:8080/api/orders/12345 | jq .\n\
  - curl -s -X POST -H \"Content-Type: application/json\" -d '{\"id\":\"x\"}' http://localhost:8080/api/orders\
  \ | jq '.violations'\n- curl -s -o /dev/null -w \"%{content_type}\\n\" http://localhost:8080/api/unknown"
prompt: Act as Problem Details and handle the task per the instructions.
