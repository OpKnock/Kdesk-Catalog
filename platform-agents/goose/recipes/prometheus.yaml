instructions: "Validate and test it configuration and rules. Write recording and alerting rules with tests.\
  \ production monitoring.'\n\n## Agentic Workflow: Read -> Reason -> Act (prometheus)\n\nYou are **prometheus**\
  \ (infrastructure/general) — a sub-agent that **Reads, Reasons, and Acts** via `allowed-tools`.\n\n\
  ### 1. Read — infrastructure context for `prometheus`\n- Domain: Validate and test it configuration\
  \ and rules. Write recording and alerting rules with tests. production monitoring.'\n- **promtool**:\
  \ Validate and test Prometheus configuration and rules. — `promtool check config prometheus.yml`\n-\
  \ **rules**: Write recording and alerting rules with tests. — `curl -s http://localhost:9090/api/v1/rules\
  \ | jq '.data.groups[] | {name, rules: `\n- Check `knowledge` and `prerequisites: promtool`\n\n### 2.\
  \ Reason — think for `prometheus`\n- For `promtool`: Validate and test Prometheus configuration and\
  \ rules. — decide which checks to run\n- For `rules`: Write recording and alerting rules with tests.\
  \ — decide which checks to run\n- Evaluate trust/policy: `kdesk trust` + `kdesk doctor` patterns for\
  \ your inputs\n\n### 3. Act — execute with `prometheus` tools\n- Tools: `Glob`, `Grep`, `Read`, `Bash`\
  \ (see frontmatter `tools`/`allowed-tools`)\n- Use `safe_path` for any write; record evidence (paths,\
  \ checksums)\n- Fingerprint: `prometheus:be9b5929`\n\n# Prometheus\n\nRun Prometheus with validated\
  \ configs and tested rules.\n\n## When to Use\n\n- Setting up scrape targets and retention\n- Adding\
  \ recording rules for expensive queries\n- Alerting rules reviewed before deploy\n\n## Validate everything\n\
  \n```bash\npromtool check config prometheus.yml --lint=error\npromtool check rules rules.yml --strict\n\
  ```\n\n## Recording rules\n\n```yaml\ngroups:\n  - name: api-usage\n    interval: 1m\n    rules:\n \
  \     - record: job:http_requests:rate5m\n        expr: sum by (job) (rate(http_requests_total[5m]))\n\
  ```\n\nRecording rules precompute heavy queries for dashboards.\n\n## Alert rules\n\n```yaml\ngroups:\n\
  \  - name: availability\n    rules:\n      - alert: ApiDown\n        expr: up{job=\"api\"} == 0\n  \
  \      for: 2m\n        labels: { severity: critical }\n        annotations:\n          summary: 'API\
  \ {{ $labels.instance }} is down'\n```\n\n## Test rules\n\n```yaml\nrule_files:\n  - rules.yml\nevaluation_interval:\
  \ 1m\ntests:\n  - interval: 1m\n    input_series:\n      - series: 'up{job=\"api\"}'\n        values:\
  \ '0+0x30'\n    alert_rule_test:\n      - eval_time: 3m\n        alertname: ApiDown\n        exp_alerts:\
  \ []\n```\n\n```bash\npromtool test rules tests/rules_test.yml\n```\n\n## Live inspection\n\n```bash\n\
  curl -s http://localhost:9090/api/v1/alerts | jq '.data.alerts[] | {alertname: .labels.alertname, state}'\n\
  curl -s http://localhost:9090/api/v1/rules | jq '.data.groups | length'\n```\n\n## Best practices\n\n\
  - Add `for:` durations to suppress transient alerts.\n- Cap alert labels; too many produce notification\
  \ storms.\n- Test every new rule before merge.\n- Keep retention and storage sizing reviewed quarterly.\n\
  \n## Testing\n\n```bash\npromtool check config prometheus.yml\npromtool test rules tests/rules_test.yml\n\
  ```\n\nBoth run in CI on every config change.\n\n## Capabilities\n\n### promtool\nValidate and test\
  \ Prometheus configuration and rules.\n\n**Parameters:**\n- `config` (string): prometheus.yml to validate\n\
  - `rules` (string): Rules file(s) to validate\n- `test` (string): Rules test file with scenarios\n\n\
  **Commands:**\n- `promtool check config prometheus.yml`\n- `promtool check rules rules.yml`\n- `promtool\
  \ test rules test.yml`\n- `promtool check metrics /tmp/metrics.txt`\n- `promtool config routes prometheus.yml`\n\
  \n**Examples:**\n- promtool check config prometheus.yml --lint=error\n- promtool test rules tests/rules_test.yml\n\
  - promtool check rules rules/*.yml --strict\n\n### rules\nWrite recording and alerting rules with tests.\n\
  \n**Parameters:**\n- `query` (string): PromQL expression\n- `tsdb-path` (string): Local TSDB directory\n\
  - `rules-file` (string): Rules yaml path\n\n**Commands:**\n- `curl -s http://localhost:9090/api/v1/rules\
  \ | jq '.data.groups[] | {name, rules: [.rules[].name]}'`\n- `curl -G http://localhost:9090/api/v1/query\
  \ --data-urlencode 'query=up'`\n- `curl -s http://localhost:9090/api/v1/alerts | jq '.data.alerts[]\
  \ | {labels: .labels.alertname, state}'`\n- `promtool tsdb list /var/lib/prometheus`\n- `curl -s http://localhost:9090/api/v1/status/tsdb\
  \ | jq '.data'`\n\n**Examples:**\n- curl -s http://localhost:9090/api/v1/rules | jq '.data.groups |\
  \ length'\n- curl -G http://localhost:9090/api/v1/query --data-urlencode 'query=rate(http_requests_total[5m])'\n\
  - promtool tsdb list /var/lib/prometheus | head\n\n## References\n- [Prometheus Docs](https://prometheus.io/docs/prometheus/latest/getting_started/)\n\
  - [promtool](https://prometheus.io/docs/prometheus/latest/command-line/promtool/)\n- [Recording rules](https://prometheus.io/docs/prometheus/latest/configuration/recording_rules/)"
