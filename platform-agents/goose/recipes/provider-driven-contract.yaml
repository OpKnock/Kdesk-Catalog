title: Provider Driven Contract
description: 'Provider-driven contract testing with Pact: publish pacts, verify against providers, and
  gate deploys.'
version: 2.0.0
instructions: "# Provider Driven Contract\n\nProvider-driven contract testing with Pact: publish pacts,\
  \ verify against providers, and gate deploys.\n\n## Instructions\n\n# Provider-Driven Contracts\n\n\
  Contract testing (Pact) verifies that a provider's API satisfies what consumers actually expect.\n\n\
  ## What this skill does\n\n- Publishes pacts generated by consumers\n- Verifies provider endpoints against\
  \ pacts\n- Gates deployments with can-i-deploy\n\n## When to use\n\n- Many consumers of one API\n- Catching\
  \ contract breaks before deploys\n\n## Real commands\n\n```bash\n# Publish pacts\npact-broker publish\
  \ ./pacts -b http://localhost:9292 -c 1.0.0 -a main\n\n# List latest\npact-broker list-latest-pact-versions\
  \ -b http://localhost:9292\n\n# Verify provider\npact-provider-verifier --provider-base-url=http://localhost:8080\
  \ \\\n  --pact-urls=./pacts/consumer-orders-api.json --provider-version 1.0.0\n\n# Deploy gate\npact-broker\
  \ can-i-deploy --pacticipant orders-api --version 1.0.0 --to prod -b http://localhost:9292\n```\n\n\
  ## Verification in CI\n\n```yaml\n- run: pact-provider-verifier --provider-base-url=$BASE_URL --pact-urls=$PACT_URLS\n\
  - run: pact-broker can-i-deploy --pacticipant orders-api --version $VERSION --to prod\n```\n\n## Best\
  \ practices\n\n- Verify provider on every PR\n- Use can-i-deploy as the final gate\n- Tag versions for\
  \ environment promotion\n\n## Capabilities\n\n### pact-contract-testing\nPublish pact files to a broker,\
  \ verify provider endpoints, and run can-i-deploy checks.\n\n**Commands:**\n- `pact-broker publish ./pacts\
  \ -b http://localhost:9292 -c 1.0.0 -a main`\n- `pact-broker list-latest-pact-versions -b http://localhost:9292`\n\
  - `pact-broker can-i-deploy --pacticipant orders-api --version 1.0.0 --to prod -b http://localhost:9292`\n\
  - `pact-provider-verifier --provider-base-url=http://localhost:8080 --pact-urls=./pacts/consumer-orders-api.json`\n\
  - `curl -s http://localhost:9292/pacts/provider/orders-api/latest | jq .`\n\n**Examples:**\n- pact-broker\
  \ publish ./pacts -b http://localhost:9292 -c 1.0.0\n- pact-provider-verifier --provider-base-url=http://localhost:8080\
  \ --pact-urls=./pacts/*.json --provider-version 1.0.0\n- pact-broker can-i-deploy --pacticipant orders-api\
  \ --version 1.0.0 --to prod"
prompt: Act as Provider Driven Contract and handle the task per the instructions.
