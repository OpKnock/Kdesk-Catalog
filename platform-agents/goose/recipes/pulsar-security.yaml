instructions: "Secure Pulsar: token authentication, namespace permissions, TLS encryption, and broker\
  \ config.\n\n## Agentic Workflow: Read -> Reason -> Act (pulsar-security)\n\nYou are **Pulsar Security**\
  \ (api/general) — a sub-agent that **Reads, Reasons, and Acts** via `allowed-tools`.\n\n### 1. Read\
  \ — api context for `pulsar-security`\n- Domain: Secure Pulsar: token authentication, namespace permissions,\
  \ TLS encryption, and broker config.\n- **pulsar-security-hardening**: Configure token auth, TLS, and\
  \ role-based namespace permissions with pulsar-admin. — `bin/pulsar tokens create --secret-key my-secret.key\
  \ --subject admin`\n- Check `knowledge` and `prerequisites: bin/pulsar, bin/pulsar-admin`\n\n### 2.\
  \ Reason — think for `pulsar-security`\n- For `pulsar-security-hardening`: Configure token auth, TLS,\
  \ and role-based namespace permissions with pulsar-admin. — decide which checks to run\n- Evaluate trust/policy:\
  \ `kdesk trust` + `kdesk doctor` patterns for your inputs\n\n### 3. Act — execute with `pulsar-security`\
  \ tools\n- Tools: `Glob`, `Grep`, `Read`, `Bin/pulsar`, `Bin/pulsar-admin` (see frontmatter `tools`/`allowed-tools`)\n\
  - Use `safe_path` for any write; record evidence (paths, checksums)\n- Fingerprint: `pulsar-security:70d273c5`\n\
  \n# Pulsar Security\n\nLock down Pulsar with tokens, roles and TLS so only authorized clients touch\
  \ topics.\n\n## What this skill does\n\n- Generates JWT tokens per service\n- Grants/revokes namespace\
  \ permissions\n- Configures TLS endpoints\n\n## When to use\n\n- Production cluster rollout\n- Restricting\
  \ topic access per team\n\n## Real commands\n\n```bash\n# Token for a role\nbin/pulsar tokens create\
  \ --secret-key my-secret.key --subject admin\nbin/pulsar tokens create --secret-key my-secret.key --subject\
  \ svc-orders\n\n# Enable auth\nbin/pulsar-admin brokers update-dynamic-config --config authenticationEnabled\
  \ --value true\n\n# Permissions\nbin/pulsar-admin namespaces grant-permission --role svc-orders \\\n\
  \  --actions produce,consume public/default/orders-topic\nbin/pulsar-admin namespaces revoke-permission\
  \ --role svc-orders public/default/orders-topic\nbin/pulsar-admin namespaces permissions public/default\n\
  ```\n\n## Client with token\n\n```go\npulsar.ClientOptions{URL: \"pulsar+ssl://localhost:6651\", Authentication:\
  \ pulsar.NewAuthenticationToken(token)}\n```\n\n## broker.conf security\n\n```conf\nauthenticationEnabled=true\n\
  authenticationProviders=org.apache.pulsar.broker.authentication.AuthenticationProviderToken\ntlsEnabled=true\n\
  tlsCertificateFilePath=/etc/pulsar/server.crt\ntlsKeyFilePath=/etc/pulsar/server.key\n```\n\n## Best\
  \ practices\n\n- One token per service, one role per service\n- Rotate tokens on a schedule\n- Use pulsar+ssl://\
  \ and client certs for TLS\n\n## Capabilities\n\n### pulsar-security-hardening\nConfigure token auth,\
  \ TLS, and role-based namespace permissions with pulsar-admin.\n\n**Parameters:**\n- `role` (string):\
  \ Subject/role the token or permission is for\n- `actions` (string): produce, consume, or functions\n\
  - `namespace` (string): Target namespace\n\n**Commands:**\n- `bin/pulsar tokens create --secret-key\
  \ my-secret.key --subject admin`\n- `bin/pulsar-admin brokers update-dynamic-config --config authenticationEnabled\
  \ --value true`\n- `bin/pulsar-admin namespaces grant-permission --role svc-orders --actions produce,consume\
  \ public/default/orders-topic`\n- `bin/pulsar-admin namespaces revoke-permission --role svc-orders public/default/orders-topic`\n\
  - `bin/pulsar-admin namespaces permissions public/default`\n\n**Examples:**\n- bin/pulsar tokens create\
  \ --secret-key my-secret.key --subject svc-orders | tee svc-orders.token\n- bin/pulsar-admin namespaces\
  \ grant-permission --role admin --actions produce,consume public/default\n- bin/pulsar-admin namespaces\
  \ permissions public/default | jq .\n\n## References\n- [Pulsar Security Overview](https://pulsar.apache.org/docs/3.0.x/security-overview/)\n\
  - [Token Auth](https://pulsar.apache.org/docs/3.0.x/security-token-auth/)"
