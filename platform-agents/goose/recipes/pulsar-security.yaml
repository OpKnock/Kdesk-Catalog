title: Pulsar Security
description: 'Secure Pulsar: token authentication, namespace permissions, TLS encryption, and broker config.'
version: 2.0.0
instructions: "# Pulsar Security\n\nSecure Pulsar: token authentication, namespace permissions, TLS encryption,\
  \ and broker config.\n\n## Instructions\n\n# Pulsar Security\n\nLock down Pulsar with tokens, roles\
  \ and TLS so only authorized clients touch topics.\n\n## What this skill does\n\n- Generates JWT tokens\
  \ per service\n- Grants/revokes namespace permissions\n- Configures TLS endpoints\n\n## When to use\n\
  \n- Production cluster rollout\n- Restricting topic access per team\n\n## Real commands\n\n```bash\n\
  # Token for a role\nbin/pulsar tokens create --secret-key my-secret.key --subject admin\nbin/pulsar\
  \ tokens create --secret-key my-secret.key --subject svc-orders\n\n# Enable auth\nbin/pulsar-admin brokers\
  \ update-dynamic-config --config authenticationEnabled --value true\n\n# Permissions\nbin/pulsar-admin\
  \ namespaces grant-permission --role svc-orders \\\n  --actions produce,consume public/default/orders-topic\n\
  bin/pulsar-admin namespaces revoke-permission --role svc-orders public/default/orders-topic\nbin/pulsar-admin\
  \ namespaces permissions public/default\n```\n\n## Client with token\n\n```go\npulsar.ClientOptions{URL:\
  \ \"pulsar+ssl://localhost:6651\", Authentication: pulsar.NewAuthenticationToken(token)}\n```\n\n##\
  \ broker.conf security\n\n```conf\nauthenticationEnabled=true\nauthenticationProviders=org.apache.pulsar.broker.authentication.AuthenticationProviderToken\n\
  tlsEnabled=true\ntlsCertificateFilePath=/etc/pulsar/server.crt\ntlsKeyFilePath=/etc/pulsar/server.key\n\
  ```\n\n## Best practices\n\n- One token per service, one role per service\n- Rotate tokens on a schedule\n\
  - Use pulsar+ssl:// and client certs for TLS\n\n## Capabilities\n\n### pulsar-security-hardening\nConfigure\
  \ token auth, TLS, and role-based namespace permissions with pulsar-admin.\n\n**Commands:**\n- `bin/pulsar\
  \ tokens create --secret-key my-secret.key --subject admin`\n- `bin/pulsar-admin brokers update-dynamic-config\
  \ --config authenticationEnabled --value true`\n- `bin/pulsar-admin namespaces grant-permission --role\
  \ svc-orders --actions produce,consume public/default/orders-topic`\n- `bin/pulsar-admin namespaces\
  \ revoke-permission --role svc-orders public/default/orders-topic`\n- `bin/pulsar-admin namespaces permissions\
  \ public/default`\n\n**Examples:**\n- bin/pulsar tokens create --secret-key my-secret.key --subject\
  \ svc-orders | tee svc-orders.token\n- bin/pulsar-admin namespaces grant-permission --role admin --actions\
  \ produce,consume public/default\n- bin/pulsar-admin namespaces permissions public/default | jq ."
prompt: Act as Pulsar Security and handle the task per the instructions.
