title: Push Notification
description: Deliver mobile notifications via FCM v1, legacy FCM, and APNs HTTP/2 using curl with OAuth
  tokens and certificate-based auth.
version: 2.0.0
instructions: "# Push Notification\n\nDeliver mobile notifications via FCM v1, legacy FCM, and APNs HTTP/2\
  \ using curl with OAuth tokens and certificate-based auth.\n\n## Instructions\n\n# Push Notifications\n\
  \nSend notifications to iOS and Android devices through FCM and APNs.\n\n## What this skill does\n\n\
  - Sends FCM v1 messages with OAuth tokens\n- Sends legacy FCM requests\n- Pushes to APNs over HTTP/2\n\
  \n## When to use\n\n- Triggering notifications from backend events\n- Testing delivery with curl before\
  \ building\n\n## Real commands\n\n```bash\n# FCM v1: get OAuth token, then send\n gcloud auth application-default\
  \ print-access-token\ncurl -X POST -H \"Authorization: Bearer $FCM_TOKEN\" -H \"Content-Type: application/json\"\
  \ \\\n  -d @fcm.json \"https://fcm.googleapis.com/v1/projects/my-firebase-project/messages:send\"\n\n\
  # FCM legacy\ncurl -X POST -H \"Authorization: key=$FCM_LEGACY_KEY\" -H \"Content-Type: application/json\"\
  \ \\\n  -d '{\"to\":\"DEVICE_TOKEN\",\"notification\":{\"title\":\"Hi\",\"body\":\"Hello\"}}' \\\n \
  \ https://fcm.googleapis.com/fcm/send\n\n# APNs\ncurl -d '{\"aps\":{\"alert\":\"Hello\",\"sound\":\"\
  default\"}}' \\\n  -H \"apns-topic: com.mycompany.myapp\" --cert apns.pem \\\n  https://api.push.apple.com/3/device/DEVICE_TOKEN\n\
  ```\n\n## fcm.json (v1)\n\n```json\n{\n  \"message\": {\n    \"token\": \"DEVICE_TOKEN\",\n    \"notification\"\
  : { \"title\": \"Hi\", \"body\": \"Hello\" },\n    \"data\": { \"screen\": \"orders\" }\n  }\n}\n```\n\
  \n## Best practices\n\n- Store device tokens per user and refresh on invalid-token errors\n- Use data\
  \ payloads for background handling\n- Send to topic groups (FCM) instead of one-by-one at scale\n\n\
  ## Capabilities\n\n### push-notification-delivery\nSend notifications via FCM and APNs using curl and\
  \ the gcloud token flow.\n\n**Commands:**\n- `gcloud auth application-default print-access-token`\n\
  - `curl -X POST -H \"Authorization: Bearer $FCM_TOKEN\" -H \"Content-Type: application/json\" -d @fcm.json\
  \ \"https://fcm.googleapis.com/v1/projects/my-firebase-project/messages:send\"`\n- `curl -X POST -H\
  \ \"Authorization: key=$FCM_LEGACY_KEY\" -H \"Content-Type: application/json\" -d '{\"to\":\"DEVICE_TOKEN\"\
  ,\"notification\":{\"title\":\"Hi\",\"body\":\"Hello\"}}' https://fcm.googleapis.com/fcm/send`\n- `curl\
  \ -d '{\"aps\":{\"alert\":\"Hello\",\"sound\":\"default\"}}' -H \"apns-topic: com.mycompany.myapp\"\
  \ --cert apns.pem https://api.push.apple.com/3/device/DEVICE_TOKEN`\n- `curl -s -X POST -H \"Authorization:\
  \ Bearer $FCM_TOKEN\" -H \"Content-Type: application/json\" -d @fcm.json \"https://fcm.googleapis.com/v1/projects/my-firebase-project/messages:send\"\
  \ | jq .`\n\n**Examples:**\n- curl -X POST -H \"Authorization: key=$FCM_LEGACY_KEY\" -H \"Content-Type:\
  \ application/json\" -d '{\"to\":\"DEVICE_TOKEN\",\"data\":{\"type\":\"order\"}}' https://fcm.googleapis.com/fcm/send\n\
  - curl -d '{\"aps\":{\"alert\":\"Order shipped\"}}' -H \"apns-topic: com.mycompany.myapp\" --cert apns.pem\
  \ https://api.push.apple.com/3/device/DEVICE_TOKEN\n- gcloud auth application-default print-access-token\
  \ > /tmp/fcm_token"
prompt: Act as Push Notification and handle the task per the instructions.
