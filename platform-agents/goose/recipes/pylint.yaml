title: pylint
description: Lints Python code with Pylint, enforcing style and catching bugs via a configurable rule
  system.
version: 2.0.0
instructions: "# pylint\n\nLints Python code with Pylint, enforcing style and catching bugs via a configurable\
  \ rule system.\n\n## Instructions\n\n# Pylint\n\nChecks Python code for errors, style problems, and\
  \ design smells, scoring each\nmodule on a 0-10 scale.\n\n## When to Use\n\n- Enforcing style and naming\
  \ conventions\n- Catching unused imports, undefined vars, and bad redefinitions\n- Gatekeeping merge\
  \ requests with a minimum score\n\n## Real Commands\n\n```bash\n# Install\npip install pylint\n\n# Basic\
  \ run\npylint src/\n\n# Generate a config file\npylint --generate-rcfile > .pylintrc\n\n# Use the config\
  \ with a score gate\npylint --rcfile=.pylintrc --fail-under=9 src/\n\n# Errors only\npylint --errors-only\
  \ src/\n\n# JSON for CI\npylint --output-format=json src/ > pylint-report.json\n\n# Disable specific\
  \ checks inline\npylint --disable=too-many-locals,too-many-branches src/\n```\n\n## Config (.pylintrc)\n\
  \n```ini\n[MESSAGES CONTROL]\ndisable=missing-docstring,too-many-arguments,invalid-name\n\n[MASTER]\n\
  fail-under=9\nload-plugins=pylint.extensions.docparams\n```\n\n## CI\n\n```yaml\n- name: Pylint\n  run:\
  \ pylint --rcfile=.pylintrc --fail-under=9 src/\n```\n\n## Best Practices\n\n- Commit a generated `.pylintrc`;\
  \ don't rely on defaults\n- Set `fail-under` a bit below a perfect score so regressions fail but noise\
  \ is allowed\n- Keep `--disable` lists small and reviewed\n- Use `# pylint: disable=...` inline comments\
  \ sparingly\n\n## Example Response\n\nReports per-module scores, message counts by category (E/W/R/C),\
  \ and the worst\noffenders with `file:line` references.\n\n## Capabilities\n\n### pylint-linting\nRun\
  \ Pylint with custom rc files, score thresholds, and CI formats\n\n**Commands:**\n- `pylint src/`\n\
  - `pylint --rcfile=.pylintrc app tests`\n- `pylint --fail-under=9 src/`\n- `pylint --output-format=json\
  \ src/ > pylint.json`\n- `pylint --disable=missing-docstring,too-many-arguments src/`\n\n**Examples:**\n\
  - pylint --generate-rcfile > .pylintrc\n- pylint --fail-under=9 --reports=y src/\n- pylint --errors-only\
  \ src/"
prompt: Act as pylint and handle the task per the instructions.
