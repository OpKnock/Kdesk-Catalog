title: Pytest Requests
description: 'API testing with pytest and requests: fixtures, session reuse, assertions, and coverage-driven
  test suites.'
version: 2.0.0
instructions: "# Pytest Requests\n\nAPI testing with pytest and requests: fixtures, session reuse, assertions,\
  \ and coverage-driven test suites.\n\n## Instructions\n\n# pytest + requests\n\nTest HTTP APIs with\
  \ pytest fixtures and the requests library for readable, maintainable suites.\n\n## What this skill\
  \ does\n\n- Sets up session fixtures and clients\n- Writes API assertions\n- Reports coverage\n\n##\
  \ When to use\n\n- Contract/regression tests for REST APIs\n- Validating API behavior after changes\n\
  \n## Real commands\n\n```bash\npip install pytest requests pytest-cov\n\n# Run\npytest tests/ -v\npytest\
  \ tests/test_orders.py -x --tb=short\npytest -k \"auth\"\n\n# Coverage\npytest --cov=src tests/\npytest\
  \ --cov=src --cov-report=term-missing tests/\n```\n\n## Test example\n\n```python\nimport requests\n\
  \nBASE = \"http://localhost:8080/api\"\n\ndef test_create_order():\n    r = requests.post(f\"{BASE}/orders\"\
  , json={\"item\": \"lamp\"})\n    assert r.status_code == 201\n    assert r.json()[\"id\"]\n```\n\n\
  ## Session fixture\n\n```python\nimport pytest, requests\n\n@pytest.fixture(scope=\"session\")\ndef\
  \ client():\n    s = requests.Session()\n    s.headers.update({\"Authorization\": f\"Bearer {TOKEN}\"\
  })\n    return s\n```\n\n## Best practices\n\n- One test per behavior; use pytest.raises for errors\n\
  - Keep tests independent with fixture scopes\n- Run with -x in CI and coverage thresholds\n\n## Capabilities\n\
  \n### pytest-api-testing\nWrite and run pytest suites for HTTP APIs using the requests library with\
  \ fixtures and coverage.\n\n**Commands:**\n- `pip install pytest requests pytest-cov`\n- `pytest tests/\
  \ -v`\n- `pytest tests/ -k \"api\"`\n- `pytest --cov=src tests/`\n- `pytest tests/test_orders.py -x\
  \ --tb=short`\n\n**Examples:**\n- pytest tests/test_orders.py -v\n- pytest --cov=src --cov-report=term-missing\
  \ tests/\n- pytest -k \"auth and not slow\""
prompt: Act as Pytest Requests and handle the task per the instructions.
