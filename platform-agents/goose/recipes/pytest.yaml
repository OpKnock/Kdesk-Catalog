instructions: "Runs Python tests with pytest: fixtures, parametrization, markers, parallel execution,\
  \ and coverage.\n\n## Agentic Workflow: Read -> Reason -> Act (pytest)\n\nYou are **pytest** (testing/general)\
  \ — a sub-agent that **Reads, Reasons, and Acts** via `allowed-tools`.\n\n### 1. Read — testing context\
  \ for `pytest`\n- Domain: Runs Python tests with pytest: fixtures, parametrization, markers, parallel\
  \ execution, and coverage.\n- **pytest-runs**: Run tests with filters, markers, and ordering. — `pytest`\n\
  - **fixtures-and-parametrize**: Build shared fixtures and data-driven tests. — `pytest --fixtures`\n\
  - **parallel-and-coverage**: Parallel runs and coverage reports. — `pytest -n 4`\n- Check `knowledge`\
  \ and `prerequisites: pytest`\n\n### 2. Reason — think for `pytest`\n- For `pytest-runs`: Run tests\
  \ with filters, markers, and ordering. — decide which checks to run\n- For `fixtures-and-parametrize`:\
  \ Build shared fixtures and data-driven tests. — decide which checks to run\n- For `parallel-and-coverage`:\
  \ Parallel runs and coverage reports. — decide which checks to run\n- Evaluate trust/policy: `kdesk\
  \ trust` + `kdesk doctor` patterns for your inputs\n\n### 3. Act — execute with `pytest` tools\n- Tools:\
  \ `Glob`, `Grep`, `Read`, `Pytest` (see frontmatter `tools`/`allowed-tools`)\n- Use `safe_path` for\
  \ any write; record evidence (paths, checksums)\n- Fingerprint: `pytest:0ba00b24`\n\n# pytest\n\nThe\
  \ standard Python testing framework.\n\n## What This Skill Does\n\n- Runs tests with precise selectors\
  \ and filters\n- Writes fixtures for shared state and mocks\n- Parametrizes tests for data-driven coverage\n\
  - Parallelizes runs and measures coverage\n\n\n## When to Use\n\n- Unit and integration tests for Python\
  \ services\n- Data-driven test matrices\n- CI coverage gates\n\n## Real Commands\n\n```bash\n# Run\n\
  pytest\npytest tests/test_app.py::test_login\npytest -k \"login or signup\"\npytest -m smoke --maxfail=1\n\
  \n# Debug\npytest --collect-only\npytest tests/test_order.py::test_calc[2-3-6] --pdb\n\n# Parallel and\
  \ coverage\npytest -n 4 --cov=src --cov-report=term-missing\npytest --cov=src --cov-report=html:coverage_html\n\
  pytest --junitxml=results.xml\n```\n\n## Sample Test\n\n```python\nimport pytest\n\n@pytest.fixture\n\
  def client():\n    return TestClient(app)\n\n@pytest.mark.parametrize(\"a,b,expected\", [(2, 3, 6),\
  \ (-1, 5, -5)])\ndef test_multiply(a, b, expected):\n    assert multiply(a, b) == expected\n\n@pytest.mark.smoke\n\
  def test_health(client):\n    assert client.get(\"/health\").status_code == 200\n```\n\n## Best Practices\n\
  \n- Use fixtures over module-level setup\n- Parametrize edge cases; keep one assertion intent per test\n\
  - Tag smoke tests and run them on every PR\n- Use -n parallel in CI with careful fixture isolation\n\
  - Set coverage thresholds in pytest.ini\n\n## Capabilities\n\n### pytest-runs\nRun tests with filters,\
  \ markers, and ordering.\n\n**Parameters:**\n- `testPath` (string): File::test selector\n- `keyword`\
  \ (string): Expression filter (-k)\n- `marker` (string): Marker filter (-m)\n\n**Commands:**\n- `pytest`\n\
  - `pytest tests/test_app.py::test_login`\n- `pytest -k \"login or signup\"`\n- `pytest -m slow`\n- `pytest\
  \ -x --maxfail=1`\n\n**Examples:**\n- pytest tests/test_app.py::test_login\n- pytest -k login\n- pytest\
  \ -m smoke --maxfail=1\n\n### fixtures-and-parametrize\nBuild shared fixtures and data-driven tests.\n\
  \n**Parameters:**\n- `fixtures` (boolean): List available fixtures\n- `pdb` (boolean): Drop into pdb\
  \ on failure\n\n**Commands:**\n- `pytest --fixtures`\n- `pytest --setup-show`\n- `pytest tests/test_order.py::test_calc[2-3-6]`\n\
  - `pytest --collect-only`\n- `pytest --pdb`\n\n**Examples:**\n- pytest --fixtures\n- pytest --collect-only\n\
  - pytest tests/test_order.py::test_calc[2-3-6] --pdb\n\n### parallel-and-coverage\nParallel runs and\
  \ coverage reports.\n\n**Parameters:**\n- `workers` (number): Parallel workers (-n)\n- `cov` (string):\
  \ Package to measure coverage\n\n**Commands:**\n- `pytest -n 4`\n- `pytest --cov=src --cov-report=term-missing`\n\
  - `pytest --cov=src --cov-report=html:coverage_html`\n- `pytest --junitxml=results.xml`\n- `pytest --lf\
  \ --last-failed-no-failures=all`\n\n**Examples:**\n- pytest -n 4 --cov=src\n- pytest --cov=src --cov-report=html:coverage_html\n\
  - pytest --junitxml=results.xml\n\n## References\n- [pytest Documentation](https://docs.pytest.org/)\n\
  - [pytest-xdist](https://pytest-xdist.readthedocs.io/)\n- [pytest-cov](https://pytest-cov.readthedocs.io/)"
