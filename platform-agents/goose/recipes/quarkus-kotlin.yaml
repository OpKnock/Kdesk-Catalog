title: Quarkus Kotlin
description: 'Quarkus with Kotlin: quarkus CLI scaffolding, Kotlin endpoints, coroutines and native builds.'
version: 2.0.0
instructions: "# Quarkus Kotlin\n\nQuarkus with Kotlin: quarkus CLI scaffolding, Kotlin endpoints, coroutines\
  \ and native builds.\n\n## Instructions\n\n# Quarkus Kotlin\n\nQuarkus brings fast startup and low memory\
  \ to Kotlin microservices.\n\n## What this skill does\n\n- Scaffolds Kotlin projects with the quarkus\
  \ CLI\n- Adds extensions and Kotlin endpoints\n- Builds native images\n\n## When to use\n\n- Kotlin\
  \ JVM services needing GraalVM native\n- Replacing heavier frameworks\n\n## Real commands\n\n```bash\n\
  # Create with Kotlin\nquarkus create app my-app --lang kotlin\n\n# Dev mode with hot reload\nquarkus\
  \ dev\n\n# Add extensions\nquarkus ext add rest\nquarkus ext add rest-client,resteasy-reactive-jackson\n\
  \n# Build\nquarkus build\nquarkus build -Dquarkus.package.type=uber-jar\n./mvnw compile\n```\n\n## Kotlin\
  \ endpoint\n\n```kotlin\n@Path(\"/hello\")\nclass HelloResource {\n    @GET\n    suspend fun hello():\
  \ String = \"Hello from Kotlin\"\n}\n```\n\n## Native build\n\n```bash\nquarkus build --native\n```\n\
  \n## Best practices\n\n- Use suspend functions with RESTEasy Reactive\n- Test with quarkus dev and the\
  \ continuous test mode\n- Profile with `quarkus dev` before native builds\n\n## Capabilities\n\n###\
  \ quarkus-kotlin-build\nCreate Kotlin Quarkus apps, add extensions and run the dev loop with the quarkus\
  \ CLI.\n\n**Commands:**\n- `quarkus create app my-app --lang kotlin`\n- `quarkus dev`\n- `quarkus build`\n\
  - `quarkus ext add rest`\n- `./mvnw compile`\n\n**Examples:**\n- quarkus create app orders --lang kotlin\
  \ -P io.quarkus.platform:quarkus-bom:3.10.0\n- quarkus dev\n- quarkus build -Dquarkus.package.type=uber-jar"
prompt: Act as Quarkus Kotlin and handle the task per the instructions.
