title: Quarkus
description: 'Quarkus application development: CLI scaffolding, extensions, dev mode, testing and packaging.'
version: 2.0.0
instructions: "# Quarkus\n\nQuarkus application development: CLI scaffolding, extensions, dev mode, testing\
  \ and packaging.\n\n## Instructions\n\n# Quarkus\n\nQuarkus is a Kubernetes-native Java stack with fast\
  \ startup, low RSS, and developer joy.\n\n## What this skill does\n\n- Scaffolds apps with the quarkus\
  \ CLI\n- Adds extensions for REST, persistence, messaging\n- Runs dev mode and builds artifacts\n\n\
  ## When to use\n\n- New Java microservices\n- Serverless/native deployments\n\n## Real commands\n\n\
  ```bash\n# Create\nquarkus create app hello-world\nquarkus create app -P io.quarkus.platform:quarkus-bom:3.10.0\
  \ hello\n\n# Dev mode\nquarkus dev\nquarkus dev --port 8081\n\n# Extensions\nquarkus ext add resteasy-reactive,resteasy-reactive-jackson\n\
  quarkus ext add hibernate-orm-panache,postgresql-client\n\n# Build and test\nquarkus build\n./mvnw test\n\
  quarkus build --native\n```\n\n## REST endpoint\n\n```java\n@Path(\"/hello\")\npublic class HelloResource\
  \ {\n    @GET\n    @Produces(MediaType.TEXT_PLAIN)\n    public String hello() { return \"Hello Quarkus\"\
  ; }\n}\n```\n\n## application.properties\n\n```properties\nquarkus.http.port=8080\nquarkus.datasource.db-kind=postgresql\n\
  quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/app\n```\n\n## Best practices\n\n- Use\
  \ dev mode's continuous testing\n- Profile and size before native builds\n- Pin the BOM version in CI\n\
  \n## Capabilities\n\n### quarkus-workflow\nCreate, extend, run and test Quarkus apps with the quarkus\
  \ CLI and Maven.\n\n**Commands:**\n- `quarkus create app hello-world`\n- `quarkus dev`\n- `quarkus ext\
  \ add resteasy-reactive,resteasy-reactive-jackson`\n- `quarkus build`\n- `./mvnw test`\n\n**Examples:**\n\
  - quarkus create app -P io.quarkus.platform:quarkus-bom:3.10.0 hello\n- quarkus dev --port 8081\n- quarkus\
  \ build --native"
prompt: Act as Quarkus and handle the task per the instructions.
