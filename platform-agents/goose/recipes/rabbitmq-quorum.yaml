title: Rabbitmq Quorum
description: 'RabbitMQ quorum queues: declaration, policies, durability, and replication behavior across
  nodes.'
version: 2.0.0
instructions: "# Rabbitmq Quorum\n\nRabbitMQ quorum queues: declaration, policies, durability, and replication\
  \ behavior across nodes.\n\n## Instructions\n\n# RabbitMQ Quorum Queues\n\nQuorum queues replicate to\
  \ multiple nodes with Raft consensus, replacing classic mirrored queues.\n\n## What this skill does\n\
  \n- Declares quorum queues with arguments\n- Sets HA policies\n- Inspects replication and leader state\n\
  \n## When to use\n\n- Durable, exactly-safe messaging\n- Migrating from mirrored classic queues\n\n\
  ## Real commands\n\n```bash\n# Declare a quorum queue\nrabbitmqadmin declare queue name=orders durable=true\
  \ \\\n  arguments='{\"x-queue-type\":\"quorum\",\"x-delivery-limit\":5}'\n\n# Inspect\nrabbitmqctl list_queues\
  \ name type messages\nrabbitmqctl list_queues name node state\n\n# Policy for quorum replication\nrabbitmqctl\
  \ set_policy quorum-ha \"^q\\.\" '{\"ha-mode\":\"all\"}' --apply-to queues\n```\n\n## Key facts\n\n\
  - Durable by design; survive broker restarts\n- Leader election per queue via Raft\n- Poison messages\
  \ bounded by x-delivery-limit\n\n## Best practices\n\n- Prefer quorum queues over classic mirrored\n\
  - Set x-delivery-limit to avoid poison loops\n- Use at least 3 nodes for quorum durability\n\n## Capabilities\n\
  \n### quorum-queue-operations\nDeclare quorum queues, apply HA policies and inspect queue type and replication\
  \ state.\n\n**Commands:**\n- `rabbitmqadmin declare queue name=q durable=true arguments='{\"x-queue-type\"\
  :\"quorum\"}'`\n- `rabbitmqctl list_queues name type messages`\n- `rabbitmqctl list_queues name policy\
  \ node state`\n- `rabbitmqctl set_policy quorum-ha \"^q\\.\" '{\"ha-mode\":\"all\"}' --apply-to queues`\n\
  - `rabbitmqadmin list queues name type --format=table`\n\n**Examples:**\n- rabbitmqadmin declare queue\
  \ name=orders durable=true arguments='{\"x-queue-type\":\"quorum\",\"x-delivery-limit\":5}'\n- rabbitmqctl\
  \ list_queues name type messages ready\n- rabbitmqctl set_policy q-2 \"^q\\.\" '{\"ha-mode\":\"exactly\"\
  ,\"ha-params\":2}' --apply-to queues"
prompt: Act as Rabbitmq Quorum and handle the task per the instructions.
