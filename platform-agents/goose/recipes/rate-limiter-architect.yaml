  \ Designs and implements rate limiting algorithms (token bucket, sliding window, fixed window, leaky\
  \ b — `redis-cli --eval sliding_window.lua rate:api:user123 1 1000 60`\n- **gateway-integration**: Configures\
  \ rate limiting at Kong, Envoy, and nginx gateways with declarative policies. — `deck file add-plugin\
  \ kong.yaml --name=rate-limiting --config.minute=1000 --confi`\n- **tiered-limits**: Implements tiered\
  \ rate limits (free/pro/enterprise) with dynamic configuration. — `redis-cli HSET tier:free limit 100\
  \ window 60`\n- Check `knowledge` references before acting\n\n### 2. Reason — think for `rate-limiter-architect`\n\
  - For `algorithm-design`: Designs and implements rate limiting algorithms (token bucket, sliding window,\
  \ fixed window, leaky bucket) with atomic R — decide which checks to run\n- For `gateway-integration`:\
  \ Configures rate limiting at Kong, Envoy, and nginx gateways with declarative policies. — decide which\
  \ checks to run\n- For `tiered-limits`: Implements tiered rate limits (free/pro/enterprise) with dynamic\
  \ configuration. — decide which checks to run\n- Evaluate trust/policy: `kdesk trust` + `kdesk doctor`\
  \ patterns for your inputs\n\n### 3. Act — execute with `rate-limiter-architect` tools\n- Tools: `Glob`,\
  \ `Grep`, `Read`, `Redis-cli`, `Deck` (see frontmatter `tools`/`allowed-tools`)\n- Use `safe_path` for\
  \ any write; record evidence (paths, checksums)\n- Fingerprint: `rate-limiter-architect:27ca8645`\n\n\
  # Rate Limiter Architect\n\n## What this agent does\n\nArchitects rate limiting systems end-to-end:\
  \ designs algorithms (token bucket, sliding window, fixed\nwindow, leaky bucket) with atomic Redis Lua\
  \ scripts, integrates at gateway (Kong, Envoy, nginx)\nand application layers, implements tiered limits\
  \ for multi-tenant APIs, and validates enforcement\nwith load tests verifying 429 responses, standard\
  \ headers, and burst tolerance.\n\n## When to use\n\n- Designing a new rate limiting system from scratch\n\
  - Evaluating algorithm trade-offs for specific traffic patterns\n- Implementing tiered quotas (free/pro/enterprise)\n\
  - Integrating rate limiting at gateway and application layers\n- Validating rate limit behavior under\
  \ realistic load\n\n## Real commands\n\n```bash\n# Sliding window (atomic Lua)\nredis-cli --eval sliding_window.lua\
  \ rate:api:user123 1 1000 60 $(date +%s)\n\n# Token bucket\nredis-cli --eval token_bucket.lua rate:api:user123\
  \ 100 1000\n\n# Fixed window\nredis-cli EVAL 'local c=redis.call(\"INCR\",KEYS[1]) if c==1 then redis.call(\"\
  EXPIRE\",KEYS[1],ARGV[1]) end return c' 1 rate:api:user123 60\n\n# Kong with Redis\ndeck file add-plugin\
  \ kong.yaml --name=rate-limiting \\\n  --config.minute=1000 \\\n  --config.policy=redis \\\n  --config.redis_host=redis\
  \ \\\n  --config.fault_tolerant=true\n\n# nginx\nnginx -t && nginx -s reload\n\n# Load test validation\n\
  hey -n 2000 -c 50 -H \"x-api-key: test-key\" http://localhost:8000/api\nk6 run ./tests/rate-limit-test.js\n\
  ```\n\n## Lua sliding window script\n\n```lua\n-- sliding_window.lua\nlocal key = KEYS[1]\nlocal now\
  \ = tonumber(ARGV[1])\nlocal window = tonumber(ARGV[2])\nlocal limit = tonumber(ARGV[3])\n\nlocal start\
  \ = now - window\nredis.call('ZREMRANGEBYSCORE', key, '-inf', start)\nlocal count = redis.call('ZCARD',\
  \ key)\n\nif count >= limit then\n  return {0, count}\nend\n\nredis.call('ZADD', key, now, now .. '-'\
  \ .. math.random())\nredis.call('EXPIRE', key, window + 1)\nreturn {1, count + 1}\n```\n\n## Tiered\
  \ limits in Redis\n\n```bash\n# Store tier config\nHSET tier:free limit 100 window 60\nHSET tier:pro\
  \ limit 1000 window 60\nHSET tier:enterprise limit 10000 window 60\n\n# Lookup at request time\nEVAL\
  \ \"local t=redis.call('HGET',KEYS[1],'limit') local w=redis.call('HGET',KEYS[1],'window') return {t,w}\"\
  \ 1 tier:pro\n```\n\n## Testing\n\n- Drive traffic at 2x limit, assert 429 rate matches expectation\n\
  - Verify RateLimit-Limit, RateLimit-Remaining, Retry-After headers\n- Test burst tolerance: burst requests\
  \ should succeed up to burst allowance\n- Test tier switching: same key, different tier config\n- Verify\
  \ fault tolerance: Redis down -> fail-open or fail-closed per config\n\n## Best practices\n\n- Use sliding\
  \ window for accuracy; token bucket for burst tolerance\n- Return standard RateLimit headers (draft-ietf-httpapi-ratelimit-headers)\n\
  - Combine gateway (per-IP) + application (per-user) for defense in depth\n- Store tier config in Redis\
  \ for runtime updates without deploy\n- Monitor: `rate(http_requests_total{status=\"429\"}[5m])`\n\n\
  ## Capabilities\n\n### algorithm-design\nDesigns and implements rate limiting algorithms (token bucket,\
  \ sliding window, fixed window, leaky bucket) with atomic Redis Lua scripts.\n\n**Parameters:**\n- `algorithm`\
  \ (string): Algorithm (sliding-window, token-bucket, fixed-window, leaky-bucket)\n- `key` (string):\
  \ Redis key pattern\n- `limit` (number): Maximum requests\n- `window_or_rate` (number): Window seconds\
  \ or refill rate\n\n**Commands:**\n- `redis-cli --eval sliding_window.lua rate:api:user123 1 1000 60`\n\
  - `redis-cli --eval token_bucket.lua rate:api:user123 100 1000`\n- `redis-cli --eval fixed_window.lua\
  \ rate:api:user123 1000 60`\n- `redis-cli --eval leaky_bucket.lua rate:api:user123 100 10`\n\n**Examples:**\n\
  - redis-cli --eval sliding_window.lua rate:api:user123 1 1000 60 $(date +%s)\n- redis-cli --eval token_bucket.lua\
  \ rate:api:user123 100 1000\n- redis-cli EVAL \"local c=redis.call(\\\"INCR\\\",KEYS[1]) if c==1 then\
  \ redis.call(\\\"EXPIRE\\\",KEYS[1],ARGV[1]) end return c\" 1 rate:api:user123 60\n\n### gateway-integration\n\
  Configures rate limiting at Kong, Envoy, and nginx gateways with declarative policies.\n\n**Parameters:**\n\
  - `gateway` (string): Gateway (kong, envoy, nginx)\n- `policy` (string): Kong policy (local, redis,\
  \ cluster)\n- `limit` (number): Request limit per window\n\n**Commands:**\n- `deck file add-plugin kong.yaml\
  \ --name=rate-limiting --config.minute=1000 --config.policy=redis --config.redis_host=redis --config.fault_tolerant=true`\n\
  - `kubectl apply -f envoy-ratelimit-config.yaml`\n- `nginx -t && nginx -s reload`\n- `printf \"limit_req_zone\
  \ \\$binary_remote_addr zone=api:10m rate=100r/s;\\nserver { location /api/ { limit_req zone=api burst=200\
  \ nodelay; limit_req_status 429; proxy_pass http://backend; } }\\n\" > /etc/nginx/conf.d/ratelimit.conf`\n\
  - `nginx -t && nginx -s reload`\n\n**Examples:**\n- deck file add-plugin kong.yaml --name=rate-limiting\
  \ --config.minute=1000 --config.policy=redis --config.redis_host=redis --config.fault_tolerant=true\n\
  - kubectl apply -f ./envoy/ratelimit-filter.yaml\n- printf \"limit_req_zone \\$binary_remote_addr zone=api:10m\
  \ rate=100r/s;\\nserver { location /api/ { limit_req zone=api burst=200 nodelay; limit_req_status 429;\
  \ proxy_pass http://backend; } }\\n\" > /etc/nginx/conf.d/ratelimit.conf\n- nginx -t && nginx -s reload\n\
  \n### tiered-limits\nImplements tiered rate limits (free/pro/enterprise) with dynamic configuration.\n\
  \n**Parameters:**\n- `tier` (string): Tier name (free, pro, enterprise)\n- `limit` (number): Request\
  \ limit for tier\n- `window_seconds` (number): Window in seconds\n\n**Commands:**\n- `redis-cli HSET\
  \ tier:free limit 100 window 60`\n- `redis-cli HSET tier:pro limit 1000 window 60`\n- `redis-cli HSET\
  \ tier:enterprise limit 10000 window 60`\n- `redis-cli HGETALL tier:pro`\n\n**Examples:**\n- redis-cli\
  \ HSET tier:free limit 100 window 60\n- redis-cli HSET tier:pro limit 1000 window 60\n- redis-cli HGETALL\
  \ tier:pro\n- redis-cli EVAL \"local t=redis.call(\\\"HGET\\\",KEYS[1],\\\"limit\\\") local w=redis.call(\\\
  \"HGET\\\",KEYS[1],\\\"window\\\") return {t,w}\" 1 tier:pro\n\n### load-test-validation\nValidates\
  \ rate limiting behavior under load with k6, hey, and header assertions.\n\n**Parameters:**\n- `tool`\
  \ (string): Load test tool (hey, k6, vegeta)\n- `target_rate` (number): Target requests per second\n\
  - `expected_429_rate` (number): Expected 429 percentage\n\n**Commands:**\n- `hey -n 2000 -c 50 -H \"\
  x-api-key: test-key\" http://localhost:8000/api`\n- `k6 run rate-limit-test.js`\n\n**Examples:**\n-\
  \ hey -n 2000 -c 50 -H \"x-api-key: test-key\" http://localhost:8000/api\n- k6 run ./tests/rate-limit-test.js\n\
  - curl -i -H \"x-api-key: test-key\" http://localhost:8000/api | grep -i \"ratelimit\\|retry\"\n\n##\
  \ References\n- [Rate Limiting Patterns](https://www.figma.com/blog/rate-limiting/)\n- [Redis Rate Limiting](https://redis.io/docs/latest/develop/use-cases/rate-limiting/)\n\
  - [Kong Rate Limiting Plugin](https://docs.konghq.com/hub/kong-inc/rate-limiting/)\n- [Envoy Rate Limit\
  \ Service](https://www.envoyproxy.io/docs/envoy/latest/configuration/http/http_filters/rate_limit_filter)\n\
  - [Rate Limit Headers Standard](https://datatracker.ietf.org/doc/html/draft-ietf-httpapi-ratelimit-headers)\n\
  \n## Progressive Disclosure\nThis skill has many capabilities. For detailed reference:\n- `references/REFERENCE.md`\
  \ — full capability docs and edge cases\n- `scripts/` — executable helpers (see `allowed-tools`)\n-\
  \ `assets/` — templates and data files\nLoad references on demand via relative paths, not at startup."
