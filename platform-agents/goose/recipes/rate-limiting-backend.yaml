title: Rate Limiting
description: Implements API rate limiting with Redis sliding windows, token buckets, and nginx/AWS strategies
  to protect services from abuse.
version: 2.0.0
instructions: "# Rate Limiting\n\nImplements API rate limiting with Redis sliding windows, token buckets,\
  \ and nginx/AWS strategies to protect services from abuse.\n\n## Instructions\n\n# Rate Limiting\n\n\
  Protect APIs from abuse with rate limits.\n\n## When to Use\n\n- Public APIs where abuse costs money\
  \ (LLM calls, SMS, scraping)\n- Login and auth endpoints against credential stuffing\n- Protecting downstream\
  \ services from cascading load\n\n## Algorithms\n\n- Fixed window: count per bucket; bursts at boundaries\n\
  - Sliding window: exact counts over rolling period\n- Token bucket: steady rate with burst allowance\n\
  - Leaky bucket: smooth output regardless of input\n\n## Redis Fixed Window\n\n```bash\nredis-cli INCR\
  \ ratelimit:user:42\nredis-cli EXPIRE ratelimit:user:42 60\n```\n\n## Nginx Example\n\n```nginx\nlimit_req_zone\
  \ $binary_remote_addr zone=api:10m rate=10r/s;\n\nserver {\n    location /api/ {\n        limit_req\
  \ zone=api burst=20 nodelay;\n        proxy_pass http://backend;\n    }\n}\n```\n\n## Commands\n\n```bash\n\
  nginx -t\nnginx -s reload\n\n# Load test your limits\nab -n 1000 -c 50 http://localhost:8000/api\nwrk\
  \ -t4 -c100 -d10s http://localhost:8000/api\n```\n\n## Best Practices\n\n- Return 429 with Retry-After\
  \ so clients back off correctly\n- Rate limit by identity (API key/user) and by IP as fallback\n- Use\
  \ Lua scripts or INCR+EXPIRE atomically; avoid TOCTOU races\n- Add per-route limits, not just global\
  \ ones\n- Load test with ab/wrk to verify headers and behavior\n- Store counters in Redis, not app memory,\
  \ in multi-instance deploys\n\n## Capabilities\n\n### redis-rate-limit\nEnforce rate limits with Redis\
  \ primitives.\n\n**Commands:**\n- `redis-cli incr ratelimit:user:42`\n- `redis-cli expire ratelimit:user:42\
  \ 60`\n- `redis-cli eval \"local c=redis.call(\\\"incr\\\",KEYS[1]); if c==1 then redis.call(\\\"expire\\\
  \",KEYS[1],ARGV[1]) end; return c\" 1 ratelimit:user:42 60`\n- `redis-cli ttl ratelimit:user:42`\n\n\
  **Examples:**\n- redis-cli INCR ratelimit:user:42\n- redis-cli --scan --pattern \"ratelimit:*\"\n- redis-cli\
  \ DEL ratelimit:user:42\n\n### proxy-limiting\nConfigure limits at the reverse proxy layer.\n\n**Commands:**\n\
  - `nginx -t`\n- `nginx -s reload`\n- `ab -n 1000 -c 50 http://localhost:8000/api`\n- `curl -s -o /dev/null\
  \ -w \"%{http_code}\" http://localhost:8000/api`\n\n**Examples:**\n- ab -n 5000 -c 100 http://localhost:8000/\n\
  - wrk -t4 -c100 -d10s http://localhost:8000/api"
prompt: Act as Rate Limiting and handle the task per the instructions.
