title: Rate Limiting
description: 'Core rate limiting: nginx limit_req/limit_conn, 429 responses, headers, and per-IP vs per-key
  scoping.'
version: 2.0.0
instructions: "# Rate Limiting\n\nCore rate limiting: nginx limit_req/limit_conn, 429 responses, headers,\
  \ and per-IP vs per-key scoping.\n\n## Instructions\n\n# Rate Limiting\n\nLimit how often clients may\
  \ hit endpoints, protecting services from abuse and overload.\n\n## What this skill does\n\n- Configures\
  \ nginx rate and connection limits\n- Handles 429s with Retry-After\n- Scopes limits per IP or API key\n\
  \n## When to use\n\n- Protecting endpoints from bursts\n- Enforcing fair usage\n\n## Real commands\n\
  \n```bash\n# Apply config\nnginx -t && nginx -s reload\n\n# Verify limits\ncurl -s -o /dev/null -w \"\
  %{http_code}\\n\" http://localhost:8080/api\nab -n 200 -c 20 http://localhost:8080/api\ncurl -sI http://localhost:8080/api\
  \ | grep -i retry-after\n```\n\n## nginx config\n\n```nginx\nlimit_req_zone $binary_remote_addr zone=api:10m\
  \ rate=10r/s;\nlimit_conn_zone $binary_remote_addr zone=conn:10m;\n\nserver {\n    location /api {\n\
  \        limit_req zone=api burst=20 nodelay;\n        limit_conn conn 10;\n        limit_req_status\
  \ 429;\n    }\n}\n```\n\n## Scoping\n\n- `$binary_remote_addr` - per IP\n- `$http_x_api_key` - per key\n\
  - Combine with `limit_conn` for connection caps\n\n## Best practices\n\n- Always return 429 with Retry-After\n\
  - Test with ab/curl before going live\n- Log limit hits for abuse analysis\n\n## Capabilities\n\n###\
  \ rate-limiting-basics\nConfigure nginx request and connection limits with burst handling and verify\
  \ 429 responses.\n\n**Commands:**\n- `nginx -t`\n- `nginx -s reload`\n- `curl -s -o /dev/null -w \"\
  %{http_code}\\n\" http://localhost:8080/api`\n- `ab -n 200 -c 20 http://localhost:8080/api`\n- `curl\
  \ -sI http://localhost:8080/api | grep -i retry-after`\n\n**Examples:**\n- nginx -t && nginx -s reload\n\
  - ab -n 300 -c 30 http://localhost:8080/api\n- curl -s -o /dev/null -w \"%{http_code}\\n\" http://localhost:8080/api"
prompt: Act as Rate Limiting and handle the task per the instructions.
