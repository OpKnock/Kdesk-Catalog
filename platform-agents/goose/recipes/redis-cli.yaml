instructions: "# redis-cli\n\nRedis CLI commands. Real redis-cli CLI.\n\n## Instructions\n\n# Redis CLI\n\
  \nRedis CLI commands using real CLI.\n\n## When to Use\n\n- Redis operations\n- Cache management\n-\
  \ Key-value store\n\n## Commands\n\n```bash\n# Install\nbrew install redis  # macOS\n\n# Connect\nredis-cli\n\
  \n# Connect with host\nredis-cli -h localhost -p 6379\n\n# Connect with password\nredis-cli -a password\n\
  \n# Connect with TLS\nredis-cli --tls\n\n# Ping\nredis-cli ping\n\n# Set key\nredis-cli SET key value\n\
  \n# Get key\nredis-cli GET key\n\n# Delete key\nredis-cli DEL key\n\n# Exists\nredis-cli EXISTS key\n\
  \n# Expire\nredis-cli EXPIRE key 60\n\n# TTL\nredis-cli TTL key\n\n# Type\nredis-cli TYPE key\n\n# Keys\n\
  redis-cli KEYS pattern*\n\n# Info\nredis-cli INFO\n\n# Config get\nredis-cli CONFIG GET maxmemory\n\n\
  # Config set\nredis-cli CONFIG SET maxmemory 256mb\n```\n\n## String Operations\n\n```bash\n# Set\n\
  redis-cli SET key value\n\n# Get\nredis-cli GET key\n\n# Set with expiry\nredis-cli SETEX key 60 value\n\
  \n# Set if not exists\nredis-cli SETNX key value\n\n# Get set\nredis-cli GETSET key newvalue\n\n# Increment\n\
  redis-cli INCR key\n\n# Decrement\nredis-cli DECR key\n\n# Increment by\nredis-cli INCRBY key 5\n\n\
  # Append\nredis-cli APPEND key value\n\n# Strlen\nredis-cli STRLEN key\n```\n\n## List Operations\n\n\
  ```bash\n# Push left\nredis-cli LPUSH key value\n\n# Push right\nredis-cli RPUSH key value\n\n# Pop\
  \ left\nredis-cli LPOP key\n\n# Pop right\nredis-cli RPOP key\n\n# Range\nredis-cli LRANGE key 0 -1\n\
  \n# Length\nredis-cli LLEN key\n\n# Index\nredis-cli LINDEX key 0\n\n# Set\nredis-cli LSET key 0 value\n\
  \n# Trim\nredis-cli LTRIM key 0 9\n```\n\n## Hash Operations\n\n```bash\n# Set field\nredis-cli HSET\
  \ key field value\n\n# Get field\nredis-cli HGET key field\n\n# Get all\nredis-cli HGETALL key\n\n#\
  \ Delete field\nredis-cli HDEL key field\n\n# Exists field\nredis-cli HEXISTS key field\n\n# Length\n\
  redis-cli HLEN key\n\n# Keys\nredis-cli HKEYS key\n\n# Values\nredis-cli HVALS key\n```\n\n## Set Operations\n\
  \n```bash\n# Add\nredis-cli SADD key member\n\n# Remove\nredis-cli SREM key member\n\n# Members\nredis-cli\
  \ SMEMBERS key\n\n# Is member\nredis-cli SISMEMBER key member\n\n# Union\nredis-cli SUNION key1 key2\n\
  \n# Intersection\nredis-cli SINTER key1 key2\n\n# Difference\nredis-cli SDIFF key1 key2\n\n# Random\
  \ member\nredis-cli SRANDMEMBER key\n\n# Pop\nredis-cli SPOP key\n```\n\n## Sorted Set Operations\n\n\
  ```bash\n# Add\nredis-cli ZADD key score member\n\n# Range\nredis-cli ZRANGE key 0 -1 WITHSCORES\n\n\
  # Range by score\nredis-cli ZRANGEBYSCORE key 0 100\n\n# Remove\nredis-cli ZREM key member\n\n# Score\n\
  redis-cli ZSCORE key member\n\n# Rank\nredis-cli ZRANK key member\n\n# Count\nredis-cli ZCARD key\n\n\
  # Count by score\nredis-cli ZCOUNT key 0 100\n```\n\n## Pub/Sub\n\n```bash\n# Subscribe\nredis-cli SUBSCRIBE\
  \ channel\n\n# Publish\nredis-cli PUBLISH channel message\n\n# PSUBSCRIBE\nredis-cli PSUBSCRIBE pattern*\n\
  ```\n\n## Transactions\n\n```bash\n# Watch\nredis-cli WATCH key\n\n# Multi\nredis-cli MULTI\n\n# Exec\n\
  redis-cli EXEC\n\n# Discard\nredis-cli DISCARD\n```\n\n## Examples\n\n```bash\n# Connect\nredis-cli\n\
  \n# Set/Get\nredis-cli SET key value\nredis-cli GET key\n\n# Keys\nredis-cli KEYS *\n\n# Info\nredis-cli\
  \ INFO\n```\n\n## CI/CD\n\n```yaml\n# GitHub Actions\n- name: Redis CLI\n  run: |\n    redis-cli ping\n\
  \n# GitLab CI\nredis:\n  stage: test\n  script:\n    - redis-cli ping\n```\n\n## Capabilities\n\n###\
  \ redis-cli\nRedis CLI commands. Real redis-cli CLI.\n\n**Commands:**\n- `brew install redis`\n- `redis-cli`\n\
  - `redis-cli -h localhost -p 6379`\n- `redis-cli -a password`\n- `redis-cli --tls`\n- `redis-cli ping`\n\
  - `redis-cli SET key value`\n- `redis-cli GET key`\n- `redis-cli DEL key`\n- `redis-cli EXISTS key`\n\
  - `redis-cli EXPIRE key 60`\n- `redis-cli TTL key`\n- `redis-cli TYPE key`\n- `redis-cli KEYS pattern*`\n\
  - `redis-cli INFO`\n- `redis-cli CONFIG GET maxmemory`\n- `redis-cli CONFIG SET maxmemory 256mb`\n-\
  \ `redis-cli SET key value`\n- `redis-cli GET key`\n- `redis-cli SETEX key 60 value`\n- `redis-cli SETNX\
  \ key value`\n- `redis-cli GETSET key newvalue`\n- `redis-cli INCR key`\n- `redis-cli DECR key`\n- `redis-cli\
  \ INCRBY key 5`\n- `redis-cli APPEND key value`\n- `redis-cli STRLEN key`\n- `redis-cli LPUSH key value`\n\
  - `redis-cli RPUSH key value`\n- `redis-cli LPOP key`\n- `redis-cli RPOP key`\n- `redis-cli LRANGE key\
  \ 0 -1`\n- `redis-cli LLEN key`\n- `redis-cli LINDEX key 0`\n- `redis-cli LSET key 0 value`\n- `redis-cli\
  \ LTRIM key 0 9`\n- `redis-cli HSET key field value`\n- `redis-cli HGET key field`\n- `redis-cli HGETALL\
  \ key`\n- `redis-cli HDEL key field`\n- `redis-cli HEXISTS key field`\n- `redis-cli HLEN key`\n- `redis-cli\
  \ HKEYS key`\n- `redis-cli HVALS key`\n- `redis-cli SADD key member`\n- `redis-cli SREM key member`\n\
  - `redis-cli SMEMBERS key`\n- `redis-cli SISMEMBER key member`\n- `redis-cli SUNION key1 key2`\n- `redis-cli\
  \ SINTER key1 key2`\n- `redis-cli SDIFF key1 key2`\n- `redis-cli SRANDMEMBER key`\n- `redis-cli SPOP\
  \ key`\n- `redis-cli ZADD key score member`\n- `redis-cli ZRANGE key 0 -1 WITHSCORES`\n- `redis-cli\
  \ ZRANGEBYSCORE key 0 100`\n- `redis-cli ZREM key member`\n- `redis-cli ZSCORE key member`\n- `redis-cli\
  \ ZRANK key member`\n- `redis-cli ZCARD key`\n- `redis-cli ZCOUNT key 0 100`\n- `redis-cli SUBSCRIBE\
  \ channel`\n- `redis-cli PUBLISH channel message`\n- `redis-cli PSUBSCRIBE pattern*`\n- `redis-cli WATCH\
  \ key`\n- `redis-cli MULTI`\n- `redis-cli EXEC`\n- `redis-cli DISCARD`\n- `redis-cli`\n- `redis-cli\
  \ SET key value`\n- `redis-cli GET key`\n- `redis-cli KEYS *`\n- `redis-cli INFO`\n\n**Examples:**\n\
  - brew install redis\n- redis-cli\n- redis-cli -h localhost -p 6379"
