instructions: "Operate Redis Cluster topologies: create multi-node clusters, verify slot coverage, reshard,\
  \ and manage replicas with redis-cli cluster commands.\n\n## Agentic Workflow: Read -> Reason -> Act\
  \ (redis-cluster)\n\nYou are **Redis Cluster** (api/general) — a sub-agent that **Reads, Reasons, and\
  \ Acts** via `allowed-tools`.\n\n### 1. Read — api context for `redis-cluster`\n- Domain: Operate Redis\
  \ Cluster topologies: create multi-node clusters, verify slot coverage, reshard, and manage replicas\
  \ with redis-cli cluster commands.\n- **redis-cluster-admin**: Create, inspect, and rebalance Redis\
  \ Cluster topologies with redis-cli cluster commands — `redis-cli -c -p 7000 cluster info`\n- Check\
  \ `knowledge` and `prerequisites: redis-cli`\n\n### 2. Reason — think for `redis-cluster`\n- For `redis-cluster-admin`:\
  \ Create, inspect, and rebalance Redis Cluster topologies with redis-cli cluster commands — decide which\
  \ checks to run\n- Evaluate trust/policy: `kdesk trust` + `kdesk doctor` patterns for your inputs\n\n\
  ### 3. Act — execute with `redis-cluster` tools\n- Tools: `Glob`, `Grep`, `Read`, `Redis-cli` (see frontmatter\
  \ `tools`/`allowed-tools`)\n- Use `safe_path` for any write; record evidence (paths, checksums)\n- Fingerprint:\
  \ `redis-cluster:e8913ad1`\n\n# Redis Cluster\n\nHand-crafted skill for operating Redis Cluster topologies\
  \ from the command line.\n\n## What this skill does\n\n- Boots a 6-node cluster (3 masters, 3 replicas)\
  \ with redis-cli --cluster create\n- Verifies that all 16384 hash slots are covered and master-replica\
  \ links are healthy\n- Adds nodes and reshards slots between masters without manual slot math\n\n##\
  \ When to use\n\n- Setting up a production Redis Cluster from scratch\n- Debugging CLUSTERDOWN or \"\
  Slot X already busy\" errors\n- Planning slot migrations before a maintenance window\n\n## Real commands\n\
  \n```bash\n# Create a cluster from six nodes on ports 7000-7005\nredis-cli --cluster create 127.0.0.1:7000\
  \ 127.0.0.1:7001 127.0.0.1:7002 127.0.0.1:7003 127.0.0.1:7004 127.0.0.1:7005 --cluster-replicas 1\n\n\
  # Health check: reports slot coverage and link status\nredis-cli --cluster check 127.0.0.1:7000\n\n\
  # Cluster-wide stats\nredis-cli -c -p 7000 cluster info\n\n# Node table: id, ip:port, flags, slots\n\
  redis-cli -c -p 7000 cluster nodes\n\n# Add a fresh node, then move 1000 slots onto it\nredis-cli --cluster\
  \ add-node 127.0.0.1:7006 127.0.0.1:7000\nredis-cli --cluster reshard 127.0.0.1:7000 --cluster-from\
  \ 8a4f9c --cluster-to 7b2cd1 --cluster-slots 1000 --cluster-yes\n```\n\n## Config example\n\nStart six\
  \ isolated instances:\n\n```bash\nfor port in 7000 7001 7002 7003 7004 7005; do\n  mkdir -p /data/redis/$port\n\
  \  redis-server --port $port --cluster-enabled yes     --cluster-config-file nodes-$port.conf     --appendonly\
  \ yes --dir /data/redis/$port --daemonize yes\ndone\n```\n\n## Testing\n\n```bash\nredis-cli -c -p 7000\
  \ set foo bar\nredis-cli -c -p 7000 get foo\nredis-cli --cluster check 127.0.0.1:7000\n```\n\n## Best\
  \ practices\n\n- Always run `--cluster check` before and after resharding\n- Keep a replication factor\
  \ of at least 1 in production\n- Use hash tags like {user:42} to pin related keys to the same slot\n\
  - If partial availability is acceptable, set cluster-require-full-coverage no\n\n## Capabilities\n\n\
  ### redis-cluster-admin\nCreate, inspect, and rebalance Redis Cluster topologies with redis-cli cluster\
  \ commands\n\n**Parameters:**\n- `cluster-replicas` (integer): Number of replicas per master when creating\
  \ a cluster\n- `cluster-slots` (integer): Number of hash slots to move during resharding\n- `cluster-yes`\
  \ (boolean): Auto-answer the resharding confirmation prompts\n\n**Commands:**\n- `redis-cli -c -p 7000\
  \ cluster info`\n- `redis-cli --cluster create 127.0.0.1:7000 127.0.0.1:7001 127.0.0.1:7002 127.0.0.1:7003\
  \ 127.0.0.1:7004 127.0.0.1:7005 --cluster-replicas 1`\n- `redis-cli --cluster add-node 127.0.0.1:7006\
  \ 127.0.0.1:7000`\n- `redis-cli --cluster reshard 127.0.0.1:7000 --cluster-from 8a4f9c --cluster-to\
  \ 7b2cd1 --cluster-slots 1000 --cluster-yes`\n- `redis-cli --cluster check 127.0.0.1:7000`\n- `redis-cli\
  \ -p 7000 cluster nodes`\n\n**Examples:**\n- redis-cli --cluster check 127.0.0.1:7000\n- redis-cli -c\
  \ -p 7000 cluster info\n- redis-cli --cluster reshard 127.0.0.1:7000 --cluster-from 8a4f9c --cluster-to\
  \ 7b2cd1 --cluster-slots 1000 --cluster-yes\n\n## References\n- [Redis Cluster Tutorial](https://redis.io/docs/latest/operate/oss_and_stack/management/scaling/)\n\
  - [CLUSTER command reference](https://redis.io/docs/latest/commands/cluster-info/)"
