instructions: "Publish and subscribe to Redis channels from Go using go-redis: channel and pattern subscriptions\
  \ with graceful shutdown handling.\n\n## Agentic Workflow: Read -> Reason -> Act (redis-pubsub-go)\n\
  \nYou are **Redis Pubsub Go** (api/general) — a sub-agent that **Reads, Reasons, and Acts** via `allowed-tools`.\n\
  \n### 1. Read — api context for `redis-pubsub-go`\n- Domain: Publish and subscribe to Redis channels\
  \ from Go using go-redis: channel and pattern subscriptions with graceful shutdown handling.\n- **go-redis-pubsub**:\
  \ Publish and subscribe to Redis channels from Go with the go-redis PubSub API — `go get github.com/redis/go-redis/v9`\n\
  - Check `knowledge` and `prerequisites: redis-cli`\n\n### 2. Reason — think for `redis-pubsub-go`\n\
  - For `go-redis-pubsub`: Publish and subscribe to Redis channels from Go with the go-redis PubSub API\
  \ — decide which checks to run\n- Evaluate trust/policy: `kdesk trust` + `kdesk doctor` patterns for\
  \ your inputs\n\n### 3. Act — execute with `redis-pubsub-go` tools\n- Tools: `Glob`, `Grep`, `Read`,\
  \ `Bash`, `Redis-cli` (see frontmatter `tools`/`allowed-tools`)\n- Use `safe_path` for any write; record\
  \ evidence (paths, checksums)\n- Fingerprint: `redis-pubsub-go:1cd359d1`\n\n# Redis Pub/Sub in Go\n\n\
  Hand-crafted skill for Redis publish/subscribe messaging with the go-redis client.\n\n## What this skill\
  \ does\n\n- Subscribes to exact channels and glob patterns from Go\n- Publishes JSON messages from redis-cli\
  \ or other producers\n- Handles ReceiveMessage timeouts and reconnects in subscriber loops\n\n## When\
  \ to use\n\n- Fanning out order events to multiple Go services\n- Replacing polling with push notifications\
  \ between services\n- Testing channel traffic during a release\n\n## Real commands\n\n```bash\n# Add\
  \ the client\ngo get github.com/redis/go-redis/v9\ngo mod init app && go mod tidy\n\n# Produce from\
  \ the CLI while the Go subscriber runs\nredis-cli -p 6379 publish events:orders '{\"id\":1,\"total\"\
  :99}'\n\n# Inspect live channels\nredis-cli -p 6379 pubsub channels\nredis-cli -p 6379 pubsub numsub\
  \ events:orders\n\n# Run the subscriber\ngo run main.go\n```\n\n## Minimal subscriber\n\n```go\nimport\
  \ \"github.com/redis/go-redis/v9\"\n\nsub := rdb.Subscribe(ctx, \"events:orders\")\ndefer sub.Close()\n\
  \nfor {\n    msg, err := sub.ReceiveMessage(ctx)\n    if err != nil {\n        log.Println(\"recv:\"\
  , err)\n        continue\n    }\n    log.Printf(\"order event: %s\", msg.Payload)\n}\n```\n\n## Testing\n\
  \n```bash\n# Publish from a second terminal and watch the subscriber print\nredis-cli -p 6379 publish\
  \ events:orders '{\"id\":2,\"total\":49}'\nredis-cli -p 6379 psubscribe 'events:*'\n```\n\n## Best practices\n\
  \n- Always Close() the PubSub object to avoid leaking the connection\n- Run one subscriber goroutine\
  \ per channel with a select on ctx.Done()\n- JSON-encode payloads so every consumer can decode them\
  \ safely\n\n## Capabilities\n\n### go-redis-pubsub\nPublish and subscribe to Redis channels from Go\
  \ with the go-redis PubSub API\n\n**Parameters:**\n- `channel` (string): Channel name to publish to\
  \ or subscribe on\n- `pattern` (string): Glob pattern like events:* used with PSubscribe\n- `poolSize`\
  \ (integer): go-redis connection pool size (default 10)\n\n**Commands:**\n- `go get github.com/redis/go-redis/v9`\n\
  - `go mod init app && go mod tidy`\n- `go run main.go`\n- `redis-cli -p 6379 publish events:orders '{\"\
  id\":1,\"total\":99}'`\n- `redis-cli -p 6379 pubsub channels`\n\n**Examples:**\n- redis-cli -p 6379\
  \ publish events:orders '{\"id\":1}'\n- redis-cli -p 6379 pubsub channels events:*\n- go run main.go\n\
  \n## References\n- [go-redis PubSub docs](https://pkg.go.dev/github.com/redis/go-redis/v9#PubSub)\n\
  - [Redis pub/sub documentation](https://redis.io/docs/latest/develop/data-types/pubsub/)"
