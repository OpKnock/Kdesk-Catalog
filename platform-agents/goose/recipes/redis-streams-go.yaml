  \n# Redis Streams in Go\n\nHand-crafted skill for Redis Streams with the go-redis client.\n\n## What\
  \ this skill does\n\n- Adds entries to a stream with rdb.XAdd and lets Redis assign IDs\n- Reads with\
  \ XRead for raw tailing and XReadGroup for consumer groups\n- Acknowledges processed messages and inspects\
  \ pending state\n\n## When to use\n\n- Event sourcing with Redis Streams as the log\n- Replacing polling\
  \ jobs with blocking stream readers\n- Implementing at-least-once processing in Go services\n\n## Real\
  \ commands\n\n```bash\ngo get github.com/redis/go-redis/v9\n\n# Seed entries from the CLI\nredis-cli\
  \ XADD orders * amount 99.50\nredis-cli XLEN orders\n\n# Create a group (MKSTREAM creates the stream\
  \ if missing)\nredis-cli XGROUP CREATE orders workers $ MKSTREAM\nredis-cli XINFO GROUPS orders\n\n\
  # Run the Go producer/consumer\ngo run main.go\n```\n\n## Producer snippet\n\n```go\nid, err := rdb.XAdd(ctx,\
  \ &redis.XAddArgs{\n    Stream: \"orders\",\n    Values: map[string]interface{}{\"amount\": 99.50, \"\
  sku\": \"A1\"},\n}).Result()\n```\n\n## Consumer snippet\n\n```go\nmsgs, err := rdb.XReadGroup(ctx,\
  \ &redis.XReadGroupArgs{\n    Group:    \"workers\",\n    Consumer: \"c1\",\n    Streams:  []string{\"\
  orders\", \">\"},\n    Count:    5,\n    Block:    0,\n}).Result()\nfor _, m := range msgs {\n    for\
  \ _, e := range m.Messages {\n        rdb.XAck(ctx, \"orders\", \"workers\", e.ID)\n    }\n}\n```\n\n\
  ## Testing\n\n```bash\nredis-cli XINFO STREAM orders\nredis-cli XPENDING orders workers\n```\n\n## Best\
  \ practices\n\n- Read with \">\" in the Streams arg for new messages only\n- Always XAck after successful\
  \ handling to keep the PEL small\n- Set a Block timeout so readers idle instead of busy-looping\n\n\
  ## Capabilities\n\n### go-redis-streams\nProduce and consume Redis Streams from Go with go-redis\n\n\
  **Parameters:**\n- `stream` (string): Stream key name\n- `group` (string): Consumer group name for XGroupCreate\n\
  - `count` (integer): Max entries per XRead/XReadGroup call\n\n**Commands:**\n- `go get github.com/redis/go-redis/v9`\n\
  - `redis-cli XADD orders * amount 99.50`\n- `redis-cli XLEN orders`\n- `redis-cli XGROUP CREATE orders\
  \ workers $ MKSTREAM`\n- `redis-cli XINFO GROUPS orders`\n\n**Examples:**\n- redis-cli XGROUP CREATE\
  \ orders workers $ MKSTREAM\n- redis-cli XINFO GROUPS orders\n- go run main.go\n\n## References\n- [go-redis\
  \ streams API](https://pkg.go.dev/github.com/redis/go-redis/v9#Client.XAdd)\n- [Redis Streams docs](https://redis.io/docs/latest/develop/data-types/streams/)"
