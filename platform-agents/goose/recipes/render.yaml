title: Render
description: Expert deployment reference covering render.yaml blueprints, CLI handling deploy/logs/secrets,
  and the platform API that enables service inspection and GitOps workflows.
version: 2.0.0
instructions: "# Render\n\nExpert deployment reference covering render.yaml blueprints, CLI handling deploy/logs/secrets,\
  \ and the platform API that enables service inspection and GitOps workflows.\n\n## Instructions\n\n\
  # Render\n\nExpert skill for deploying services to Render.com.\n\n## What this skill does\n\n- Defines\
  \ services, databases, and cron jobs in a render.yaml blueprint\n- Deploys and tails logs with the official\
  \ render-cli\n- Manages environment secrets and inspects services via the API\n\n## When to use\n\n\
  - Shipping a web service or API to Render\n- Converting manual dashboard clicks into GitOps blueprint\
  \ deploys\n- Debugging failed deploys from the CLI\n\n## Real commands\n\n```bash\n# Authenticate the\
  \ CLI\nrender login\n\n# Deploy the latest commit of a service\nrender deploy srv-abc123\n\n# Stream\
  \ logs\nrender logs srv-abc123 --tail\n\n# List environment secrets\nrender secret list srv-abc123\n\
  \n# Inspect services via the API\ncurl -s https://api.render.com/v1/services -H \"Authorization: Bearer\
  \ $RENDER_API_KEY\" | jq -r '.[].serviceDetails.url'\n```\n\n## render.yaml blueprint\n\n```yaml\nservices:\n\
  \  - type: web\n    name: api\n    runtime: node\n    plan: starter\n    region: oregon\n    buildCommand:\
  \ npm ci && npm run build\n    startCommand: node dist/index.js\n    healthCheckPath: /healthz\n   \
  \  envVars:\n      - key: DATABASE_URL\n        fromDatabase:\n          name: db\n          property:\
  \ connectionString\ndatabases:\n  - name: db\n    plan: starter\n    databaseName: app\n```\n\n## Testing\
  \ a deploy\n\n```bash\ncurl -sf https://api.onrender.com/healthz && echo healthy\nrender logs srv-abc123\
  \ --tail\n```\n\n## Best practices\n\n- Keep the startCommand minimal; Render restarts on health check\
  \ failure\n- Store secrets as env vars, never in the blueprint\n- Merge the blueprint via Git to enable\
  \ automatic deploys\n\n## Capabilities\n\n### render-deploy\nDeploy and manage Render.com services with\
  \ blueprint and CLI\n\n**Commands:**\n- `render login`\n- `render deploy srv-abc123`\n- `render logs\
  \ srv-abc123 --tail`\n- `render secret list srv-abc123`\n- `curl -s https://api.render.com/v1/services\
  \ -H \"Authorization: Bearer $RENDER_API_KEY\" | jq '.[0].name'`\n\n**Examples:**\n- render deploy srv-abc123\n\
  - render logs srv-abc123 --tail\n- curl -s https://api.render.com/v1/services -H \"Authorization: Bearer\
  \ $RENDER_API_KEY\" | jq -r '.[].serviceDetails.url'"
prompt: Act as Render and handle the task per the instructions.
