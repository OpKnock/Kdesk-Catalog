  \ -Dartifact=io.rest-assured:rest-assured:5.4.0`\n- Check `knowledge` and `prerequisites: ./gradlew,\
  \ mvn`\n\n### 2. Reason — think for `rest-assured`\n- For `rest-assured-bdd`: Write and run BDD-style\
  \ REST tests in Java with Rest Assured — decide which checks to run\n- Evaluate trust/policy: `kdesk\
  \ trust` + `kdesk doctor` patterns for your inputs\n\n### 3. Act — execute with `rest-assured` tools\n\
  - Tools: `Glob`, `Grep`, `Read`, `Mvn`, `./gradlew` (see frontmatter `tools`/`allowed-tools`)\n- Use\
  \ `safe_path` for any write; record evidence (paths, checksums)\n- Fingerprint: `rest-assured:6a0360f7`\n\
  \n# Rest Assured\n\nExpert skill for REST API testing in Java with Rest Assured.\n\n## What this skill\
  \ does\n\n- Builds BDD-style tests: given() setup, when() request, then() assertions\n- Asserts status\
  \ codes, headers, and JSONPath expressions\n- Runs individual tests via Maven or Gradle filters\n\n\
  ## When to use\n\n- Contract tests against Spring Boot or other Java APIs\n- Smoke tests that should\
  \ run in CI after deploy\n- Local verification of endpoints during development\n\n## Real commands\n\
  \n```bash\n# Fetch the dependency explicitly\nmvn dependency:get -Dartifact=io.rest-assured:rest-assured:5.4.0\n\
  \n# Run a whole test class\nmvn test -Dtest=OrderApiTest\n\n# Run a single method\nmvn test -q -Dtest=OrderApiTest#shouldReturn201\n\
  \n# Gradle equivalent with verbose output\n./gradlew test --tests '*ApiTest' --info\n```\n\n## Test\
  \ example\n\n```java\nimport static io.restassured.RestAssured.*;\n\ngiven()\n    .contentType(\"application/json\"\
  )\n    .body(\"{\\\"customer\\\":7,\\\"total\\\":199}\")\n.when()\n    .post(\"/v1/orders\")\n.then()\n\
  \    .statusCode(201)\n\n    .body(\"id\", greaterThan(0))\n    .header(\"Location\", not(emptyString()));\n\
  \n// JSONPath extraction\n\nint id = when().get(\"/v1/orders\").then().statusCode(200)\n    .extract().path(\"\
  data[0].id\");\n```\n\n## Config example\n\n```java\nRestAssured.baseURI = \"http://localhost:8080\"\
  ;\nRestAssured.port = 8080;\n```\n\n## Testing\n\n```bash\nmvn test -Dtest=OrderApiTest\n./gradlew test\
  \ --tests '*ApiTest'\n```\n\n## Best practices\n\n- Keep test data creation in @BeforeAll so tests stay\
  \ independent\n- Prefer JSONPath assertions over raw string contains checks\n- Put integration tests\
  \ behind a Maven profile so unit builds stay fast\n\n## Capabilities\n\n### rest-assured-bdd\nWrite\
  \ and run BDD-style REST tests in Java with Rest Assured\n\n**Parameters:**\n- `baseURI` (string): RestAssured.baseURI,\
  \ e.g. http://localhost:8080\n- `port` (integer): RestAssured.port when not 80/443\n- `jsonPath` (string):\
  \ GPath expression like data.items[0].id\n\n**Commands:**\n- `mvn dependency:get -Dartifact=io.rest-assured:rest-assured:5.4.0`\n\
  - `mvn test -Dtest=OrderApiTest`\n- `mvn test -q -Dtest=OrderApiTest#shouldReturn201`\n- `./gradlew\
  \ test --tests '*ApiTest' --info`\n- `mvn verify -Dskip.integration.tests=false`\n\n**Examples:**\n\
  - mvn test -Dtest=OrderApiTest\n- mvn test -q -Dtest=OrderApiTest#shouldReturn201\n- ./gradlew test\
  \ --tests '*ApiTest' --info\n\n## References\n- [Rest Assured docs](https://github.com/rest-assured/rest-assured/wiki/Usage)\n\
  - [Rest Assured on Maven Central](https://central.sonatype.com/artifact/io.rest-assured/rest-assured)"
