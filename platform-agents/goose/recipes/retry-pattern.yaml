  \n# Retry Pattern\n\nExpert skill for resilient retries with exponential backoff.\n\n## What this skill\
  \ does\n\n- Retries transient failures a bounded number of times\n- Grows delays exponentially with\
  \ jitter\n- Honors Retry-After headers from rate-limited APIs\n\n## When to use\n\n- Downstream services\
  \ return 503/429 or refuse connections\n- Batch jobs should survive brief network blips\n- Rate-limited\
  \ third-party APIs need polite retries\n\n## Real commands\n\n```bash\n# curl: 5 attempts, 2s base delay,\
  \ retry on everything including connection refused\ncurl --retry 5 --retry-delay 2 --retry-all-errors\
  \ --retry-connrefused https://api.your-app.test/health\n\n# Honoring Retry-After from a 429\ncurl -si\
  \ https://api.your-app.test/rate-limited | grep -i retry-after\n\n# Python tenacity: 3 attempts, exponential\
  \ 1s..10s\npip install tenacity\n```\n\n## Python retry\n\n```python\nfrom tenacity import retry, stop_after_attempt,\
  \ wait_exponential, wait_jitter\n\n@retry(stop=stop_after_attempt(5),\n       wait=wait_exponential(multiplier=1,\
  \ max=10) + wait_jitter(1, 3),\n       retry_on=lambda e: isinstance(e, ConnectionError))\ndef call_downstream():\n\
  \    return requests.get(\"https://api.your-app.test/health\", timeout=5)\n```\n\n## Testing\n\n```bash\n\
  # Simulate flakiness with a proxy like toxiproxy, then:\ncurl --retry 5 --retry-delay 2 --retry-all-errors\
  \ -s https://api.your-app.test/health\n```\n\n## Best practices\n\n- Always bound retries: stop_after_attempt\
  \ or a deadline\n- Add jitter so retries do not synchronize across clients\n- For 429s, sleep on Retry-After\
  \ when present, else back off\n- Do not retry 4xx validation errors: they will never succeed\n\n## Capabilities\n\
  \n### exponential-backoff\nRetry failing calls with exponential backoff, jitter, and Retry-After\n\n\
  **Parameters:**\n- `max_attempts` (integer): Total attempts before giving up\n- `backoff_multiplier`\
  \ (integer): Base delay in seconds for exponential growth\n- `jitter` (boolean): Randomize delay to\
  \ avoid thundering herd\n\n**Commands:**\n- `curl --retry 5 --retry-delay 2 --retry-all-errors --retry-connrefused\
  \ https://api.your-app.test/health`\n- `pip install tenacity`\n- `curl -si https://api.your-app.test/rate-limited\
  \ | grep -i retry-after`\n- `curl --retry 3 --retry-connrefused -s https://api.your-app.test/data -o\
  \ data.json`\n\n**Examples:**\n- curl --retry 5 --retry-delay 2 --retry-all-errors https://api.your-app.test/health\n\
  - python -c 'from tenacity import retry, stop_after_attempt, wait_exponential; print(retry(stop=stop_after_attempt(3),\
  \ wait=wait_exponential(multiplier=1, max=10))(__import__(\"requests\").get).__name__)'\n- curl -si\
  \ https://api.your-app.test/429 | grep -i retry-after\n\n## References\n- [Azure retry pattern](https://learn.microsoft.com/en-us/azure/architecture/patterns/retry)\n\
  - [tenacity docs](https://tenacity.readthedocs.io/en/latest/)"
