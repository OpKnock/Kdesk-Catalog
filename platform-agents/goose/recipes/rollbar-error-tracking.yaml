  \ record evidence (paths, checksums)\n- Fingerprint: `rollbar-error-tracking:47d7f72b`\n\n# Rollbar\
  \ Error Tracking\n\nExpert skill for error monitoring with Rollbar.\n\n## What this skill does\n\n-\
  \ Initializes the Python SDK and reports messages and exceptions\n- Posts items and deploys directly\
  \ through the REST API\n- Queries items for triage and release correlation\n\n## When to use\n\n- Wiring\
  \ a new service into error monitoring\n- Marking a release so errors can be attributed to it\n- Checking\
  \ whether an incident has fresh errors\n\n## Real commands\n\n```bash\n# SDK\npip install rollbar\n\n\
  # Report a message\npython -c 'import rollbar; rollbar.init(\"POST_SERVER_ITEM_ACCESS_TOKEN\", \"prod\"\
  ); rollbar.report_message(\"booted\", \"info\")'\n\n# Report the current exception in a handler\npython\
  \ -c 'import rollbar; rollbar.report_exc_info()'\n\n# POST an item directly\ncurl -X POST https://api.rollbar.com/api/1/item/\
  \ -H 'Content-Type: application/json' -d '{\"access_token\":\"POST_SERVER_ITEM_ACCESS_TOKEN\",\"data\"\
  :{\"environment\":\"prod\",\"body\":{\"message\":{\"body\":\"test\"}}}}'\n\n# Track a deploy\ncurl -X\
  \ POST https://api.rollbar.com/api/1/deploy/ -H 'Content-Type: application/json' -d '{\"access_token\"\
  :\"POST_SERVER_ITEM_ACCESS_TOKEN\",\"environment\":\"prod\",\"revision\":\"abc123\"}'\n\n# Query recent\
  \ items\ncurl -s 'https://api.rollbar.com/api/1/items/?access_token=READ_TOKEN&environment=prod' | jq\
  \ -r '.result.items[0].title'\n```\n\n## SDK config\n\n```python\nimport rollbar\nrollbar.init(\"POST_SERVER_ITEM_ACCESS_TOKEN\"\
  , \"prod\")\ntry:\n    risky_call()\nexcept Exception:\n    rollbar.report_exc_info()\n    raise\n```\n\
  \n## Testing\n\n```bash\ncurl -X POST https://api.rollbar.com/api/1/item/ -H 'Content-Type: application/json'\
  \ -d '{\"access_token\":\"POST_SERVER_ITEM_ACCESS_TOKEN\",\"data\":{\"environment\":\"test\",\"body\"\
  :{\"message\":{\"body\":\"smoke\"}}}}'\n```\n\n## Best practices\n\n- Call rollbar.init once at startup\
  \ with the environment name\n- Send deploys after every release for blame attribution\n- Use read tokens\
  \ for dashboards, never for writes\n\n## Capabilities\n\n### rollbar-reporting\nReport errors and deploys\
  \ to Rollbar and query items\n\n**Parameters:**\n- `access_token` (string): Server or read access token\n\
  - `environment` (string): Environment name, e.g. prod or staging\n- `revision` (string): Git SHA associated\
  \ with a deploy\n\n**Commands:**\n- `pip install rollbar`\n- `python -c 'import rollbar; rollbar.init(\"\
  POST_SERVER_ITEM_ACCESS_TOKEN\", \"prod\"); rollbar.report_message(\"booted\", \"info\")'`\n- `curl\
  \ -X POST https://api.rollbar.com/api/1/item/ -H 'Content-Type: application/json' -d '{\"access_token\"\
  :\"POST_SERVER_ITEM_ACCESS_TOKEN\",\"data\":{\"environment\":\"prod\",\"body\":{\"message\":{\"body\"\
  :\"test\"}}}}'`\n- `curl -X POST https://api.rollbar.com/api/1/deploy/ -H 'Content-Type: application/json'\
  \ -d '{\"access_token\":\"POST_SERVER_ITEM_ACCESS_TOKEN\",\"environment\":\"prod\",\"revision\":\"abc123\"\
  }'`\n- `curl -s 'https://api.rollbar.com/api/1/items/?access_token=READ_TOKEN&environment=prod' | jq\
  \ -r '.result.items[0].title'`\n\n**Examples:**\n- curl -s 'https://api.rollbar.com/api/1/items/?access_token=READ_TOKEN&environment=prod&level=error'\
  \ | jq '.result.items | length'\n- python -c 'import rollbar; rollbar.report_exc_info()'\n- curl -X\
  \ POST https://api.rollbar.com/api/1/deploy/ -H 'Content-Type: application/json' -d '{\"access_token\"\
  :\"POST_SERVER_ITEM_ACCESS_TOKEN\",\"environment\":\"prod\",\"revision\":\"abc123\"}'\n\n## References\n\
  - [Rollbar Python SDK](https://docs.rollbar.com/docs/python)\n- [Rollbar API reference](https://docs.rollbar.com/reference)"
