title: Runbook Automation
description: Expert reference for automating incident runbooks end to end with kubectl/journalctl checks,
  Slack webhook alerts, PagerDuty event API, and scripted remediation playbooks.
version: 2.0.0
instructions: "# Runbook Automation\n\nExpert reference for automating incident runbooks end to end with\
  \ kubectl/journalctl checks, Slack webhook alerts, PagerDuty event API, and scripted remediation playbooks.\n\
  \n## Instructions\n\n# Runbook Automation\n\nExpert skill for automating incident runbooks end to end.\n\
  \n## What this skill does\n\n- Gathers diagnostics fast: pod state, logs, recent events\n- Pages humans\
  \ with Slack webhooks and PagerDuty events\n- Runs scripted remediation with Ansible or shell\n\n##\
  \ When to use\n\n- On-call pages for symptoms that have known fixes\n- Standardizing what the first\
  \ responder actually runs\n- Wiring probes to paging instead of manual checks\n\n## Real commands\n\n\
  ```bash\n# Diagnose\nkubectl describe pod api-7d9f -n prod | tail -40\nkubectl get events -n prod --sort-by=.lastTimestamp\
  \ | tail -20\njournalctl -u api -n 100 --no-pager\n\n# Alert to Slack\ncurl -X POST https://hooks.slack.com/services/T123456/B789012/XYZ789\
  \ -H 'Content-Type: application/json' -d '{\"text\":\":fire: API latency above 5s\"}'\n\n# Page via\
  \ PagerDuty Events API v2\ncurl -X POST -H 'Content-Type: application/json' -H 'X-Routing-Key: rk_abc123def456'\
  \ -d '{\"event_type\":\"trigger\",\"payload\":{\"summary\":\"API down\",\"source\":\"probe\"}}' https://events.pagerduty.com/v2/enqueue\n\
  \n# Remediate\nansible-playbook -i inventory.ini runbooks/restart-api.yml\n```\n\n## Playbook skeleton\n\
  \n```yaml\n- hosts: api\n  tasks:\n    - name: Restart api service\n      ansible.builtin.service:\n\
  \        name: api\n        state: restarted\n```\n\n## Testing\n\n```bash\n# Dry-run remediation\n\
  ansible-playbook -i inventory.ini runbooks/restart-api.yml --check\n# Test the webhook with a benign\
  \ message\ncurl -X POST https://hooks.slack.com/services/T123456/B789012/XYZ789 -H 'Content-Type: application/json'\
  \ -d '{\"text\":\"test\"}'\n```\n\n## Best practices\n\n- Every runbook step must be a single command\
  \ or script\n- Test webhooks before incidents; use pagerduty resolve on recovery\n- Log which runbook\
  \ fired and its outcome to your ops store\n\n## Capabilities\n\n### incident-runbook\nAutomate incident\
  \ response: diagnose, alert, remediate\n\n**Commands:**\n- `kubectl describe pod api-7d9f -n prod |\
  \ tail -40`\n- `journalctl -u api -n 100 --no-pager`\n- `curl -X POST https://hooks.slack.com/services/T123456/B789012/XYZ789\
  \ -H 'Content-Type: application/json' -d '{\"text\":\":fire: API latency above 5s\"}'`\n- `curl -X POST\
  \ -H 'Content-Type: application/json' -H 'X-Routing-Key: rk_abc123def456' -d '{\"event_type\":\"trigger\"\
  ,\"payload\":{\"summary\":\"API down\",\"source\":\"probe\"}}' https://events.pagerduty.com/v2/enqueue`\n\
  - `ansible-playbook -i inventory.ini runbooks/restart-api.yml`\n\n**Examples:**\n- journalctl -u api\
  \ -n 100 --no-pager -f\n- curl -X POST https://hooks.slack.com/services/T123456/B789012/XYZ789 -H 'Content-Type:\
  \ application/json' -d '{\"text\":\"deploy finished\"}'\n- kubectl get events -n prod --sort-by=.lastTimestamp\
  \ | tail -20"
prompt: Act as Runbook Automation and handle the task per the instructions.
