title: runtime-protection
description: 'Detects and responds to threats at runtime with Falco, Tracee, auditd, and strace: suspicious
  syscalls, containers, and process behavior.'
version: 2.0.0
instructions: "# runtime-protection\n\nDetects and responds to threats at runtime with Falco, Tracee,\
  \ auditd, and strace: suspicious syscalls, containers, and process behavior.\n\n## Instructions\n\n\
  # Runtime Protection\n\nDetect malicious behavior while it happens.\n\n## When to Use\n\n- Container\
  \ escape and privilege escalation detection\n- Suspicious process behavior monitoring\n- Forensics after\
  \ an incident\n\n## Falco\n\n```bash\nfalcoctl install falco\nfalco -r /etc/falco/falco_rules.yaml\n\
  ```\n\nRule example - terminal in container:\n\n```yaml\n- rule: Terminal shell in container\n  desc:\
  \ A shell was spawned in a container\n  condition: container.id != host and proc.name = bash\n  output:\
  \ shell spawned in container (proc=%proc.name container=%container.id)\n  priority: WARNING\n```\n\n\
  ## Tracee\n\n```bash\ntracee-ebpf --events execve,openat\n```\n\n## Syscall tracing\n\n```bash\nstrace\
  \ -f -e trace=execve,openat -o trace.log ./app\n```\n\n## Kernel audit\n\n```bash\nauditctl -a always,exit\
  \ -F arch=b64 -S execve -k exec-log\nauditctl -l\nausearch -k exec-log -ts recent\n```\n\n## Alert pipeline\n\
  \nFalco events -> priority threshold -> pager. Wire outputs to a SIEM or message queue.\n\n## Best practices\n\
  \n- Tune rules to the workload to avoid alert fatigue.\n- Ship the event stream off-host immediately.\n\
  - Test rules with real attack simulations (e.g., kubectl exec).\n- Keep Falco/Tracee versions pinned\
  \ and updated.\n\n## Testing\n\nSimulate a known-bad action (shell in container) and verify the rule\
  \ fires within seconds.\n\n## Capabilities\n\n### falco\nRun Falco threat detection and manage rules.\n\
  \n**Commands:**\n- `falco --version`\n- `falcoctl install falco`\n- `falco -r /etc/falco/falco_rules.yaml\
  \ -e /dev/null`\n- `falco --json --output '{\"event\":\"%evt.type\",\"proc\":\"%proc.name\"}'`\n- `falcoctl\
  \ artifact list --type rules`\n\n**Examples:**\n- falco -r my-rules.yaml | head -20\n- falcoctl artifact\
  \ install falco_rules:2.0\n- falco --version && falco -h | head -20\n\n### syscall\nTrace and audit\
  \ syscall activity.\n\n**Commands:**\n- `strace -f -e trace=execve,openat -o trace.log ./app`\n- `strace\
  \ -p 1234 -f -e trace=network`\n- `auditctl -a always,exit -F arch=b64 -S execve -k exec-log`\n- `auditctl\
  \ -l`\n- `ausearch -k exec-log -ts recent | head -30`\n\n**Examples:**\n- strace -f -e trace=openat\
  \ ./app 2>&1 | grep ENOENT | head\n- auditctl -a always,exit -F arch=b64 -S socket -k net-conn\n- ausearch\
  \ -k net-conn -i | head -20"
prompt: Act as runtime-protection and handle the task per the instructions.
