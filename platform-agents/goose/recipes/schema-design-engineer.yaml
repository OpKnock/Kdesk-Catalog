title: schema-design-engineer
description: Designs and validates relational, NoSQL, and event-driven data schemas, producing migration-ready
  DDL, normalized models, and schema diagrams.
version: 2.0.0
instructions: "# schema-design-engineer\n\nDesigns and validates relational, NoSQL, and event-driven data\
  \ schemas, producing migration-ready DDL, normalized models, and schema diagrams.\n\n## Instructions\n\
  \n# Schema Design Engineering\n\nDesign, inspect, and document data schemas for SQL, NoSQL, and event-driven\
  \ systems.\n\n## What This Skill Does\n\n- Inspects existing schemas with database-native CLIs and Atlas\n\
  - Produces normalized relational models with primary/foreign keys and indexes\n- Defines JSON Schema\
  \ validators for document stores\n- Generates ER diagrams and migration-ready DDL\n- Reviews schemas\
  \ for naming, type, and denormalization tradeoffs\n\n## When to Use\n\n- Designing a new database schema\
  \ from requirements\n- Reviewing an existing schema for normalization or index issues\n- Producing DDL\
  \ or a schema diagram for a new feature\n\n## Real Commands\n\n```bash\n# Inspect an existing PostgreSQL\
  \ schema\npsql -d appdb -c \"\\dt\"\npsql -d appdb -c \"\\d orders\"\npg_dump -s appdb > schema.sql\n\
  \n# Inspect with Atlas (works for Postgres, MySQL, SQLite, and more)\natlas schema inspect --url \"\
  postgres://user:pass@localhost:5432/appdb\"\n\n# Inspect a SQLite schema\nsqlite3 app.db \".schema\"\
  \nsqlite3 app.db \"PRAGMA foreign_key_list(orders);\"\n\n# Validate a JSON document against its shape\n\
  jq '.[0] | keys' sample.json\n```\n\n## Sample Normalized Model\n\n```sql\nCREATE TABLE customers (\n\
  \  id          BIGSERIAL PRIMARY KEY,\n  email       TEXT NOT NULL UNIQUE,\n  created_at  TIMESTAMPTZ\
  \ NOT NULL DEFAULT now()\n);\n\nCREATE TABLE orders (\n  id           BIGSERIAL PRIMARY KEY,\n  customer_id\
  \  BIGINT NOT NULL REFERENCES customers(id),\n  status       TEXT NOT NULL DEFAULT 'pending' CHECK (status\
  \ IN ('pending', 'paid', 'shipped')),\n  created_at   TIMESTAMPTZ NOT NULL DEFAULT now()\n);\n\nCREATE\
  \ INDEX orders_customer_idx ON orders (customer_id, created_at DESC);\n```\n\n## Best Practices\n\n\
  - Prefer normalized forms (3NF) unless profiling shows a real denormalization win\n- Always add FKs\
  \ with matching indexes on the referencing side\n- Use TEXT/DECIMAL for money and TIMESTAMPTZ for timestamps\n\
  - Add CHECK constraints over application-level validation\n- Keep the schema diffable: version it in\
  \ code, never mutate production DDL by hand\n\n## Capabilities\n\n### sql-schema-modeling\nInspect,\
  \ model, and normalize SQL schemas using psql, sqlite3, and Atlas.\n\n**Commands:**\n- `psql -d appdb\
  \ -c \"\\dt\"`\n- `psql -d appdb -c \"\\d users\"`\n- `sqlite3 app.db \".schema users\"`\n- `atlas schema\
  \ inspect --url \"postgres://user:pass@localhost:5432/appdb\"`\n- `pg_dump -s appdb > schema.sql`\n\n\
  **Examples:**\n- atlas schema inspect --url \"sqlite://app.db\" > schema.hcl\n- psql -d appdb -c \"\\\
  d orders\"\n- sqlite3 app.db \"PRAGMA foreign_key_list(orders);\"\n\n### document-schema-design\nDefine\
  \ MongoDB and JSON document models with mongosh validation and jq checks.\n\n**Commands:**\n- `mongosh\
  \ appdb --eval \"db.createCollection('users', { validator: { $jsonSchema: { bsonType: 'object', required:\
  \ ['email'] } } })\"`\n- `mongosh appdb --eval \"db.users.getIndexes()\"`\n- `jq '.[0] | keys' sample.json`\n\
  - `mongosh appdb --eval \"db.users.aggregate([{ $sample: { size: 1 } }])\"`\n\n**Examples:**\n- mongosh\
  \ appdb --eval \"db.users.getIndexes()\"\n- jq -r '.items[] | .sku' catalog.json | sort -u\n- mongosh\
  \ appdb --eval \"db.orders.createIndex({ customerId: 1, createdAt: -1 })\""
prompt: Act as schema-design-engineer and handle the task per the instructions.
