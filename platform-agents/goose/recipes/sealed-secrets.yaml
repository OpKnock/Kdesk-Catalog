title: Sealed Secrets
description: Expert reference for kubeseal encryption of Kubernetes Secrets, cert fetch/management, sealed
  secret creation, and GitOps-safe secret commits.
version: 2.0.0
instructions: "# Sealed Secrets\n\nExpert reference for kubeseal encryption of Kubernetes Secrets, cert\
  \ fetch/management, sealed secret creation, and GitOps-safe secret commits.\n\n## Instructions\n\n#\
  \ Sealed Secrets\n\nExpert skill for GitOps-safe secrets with Bitnami Sealed Secrets.\n\n## What this\
  \ skill does\n\n- Encrypts Kubernetes Secrets into SealedSecret manifests with kubeseal\n- Fetches the\
  \ controller's public cert for offline sealing\n- Applies sealed manifests that the controller unseals\
  \ at runtime\n\n## When to use\n\n- Storing secrets in a git repository safely\n- Cluster bootstrap\
  \ where Vault is not available\n- Giving developers access to secret creation without the cluster key\n\
  \n## Real commands\n\n```bash\n# Fetch the controller public cert once\nkubeseal --fetch-cert --controller-name\
  \ sealed-secrets --controller-namespace kube-system > pub-cert.pem\n\n# Create and seal a secret\nkubectl\
  \ create secret generic db --from-literal=password=hunter2 --dry-run=client -o yaml | kubeseal --cert\
  \ pub-cert.pem --format yaml > sealed-db.yaml\n\n# Apply it; the controller decrypts into a regular\
  \ Secret\nkubectl apply -f sealed-db.yaml\n\n# Inspect results\nkubectl get sealedsecrets -o yaml\n\
  kubectl get secret db -o yaml\n```\n\n## SealedSecret example\n\n```yaml\napiVersion: bitnami.com/v1alpha1\n\
  kind: SealedSecret\nmetadata:\n  name: db\n  namespace: default\nspec:\n  encryptedData:\n    password:\
  \ AgBy3i4OJSWK+PiTySYZ...\n```\n\n## Testing\n\n```bash\nkubectl apply -f sealed-db.yaml\nkubectl get\
  \ secret db -o jsonpath='{.data.password}' | base64 -d\n```\n\n## Best practices\n\n- Seal with a scope\
  \ that includes the target namespace (default)\n- Back up the controller's private key: it is irreplaceable\n\
  - Commit only .yaml SealedSecrets, never plain Secrets\n\n## Capabilities\n\n### kubeseal\nEncrypt Kubernetes\
  \ Secrets with kubeseal and manage sealing certs\n\n**Commands:**\n- `kubeseal --fetch-cert --controller-name\
  \ sealed-secrets --controller-namespace kube-system > pub-cert.pem`\n- `kubectl create secret generic\
  \ db --from-literal=password=hunter2 --dry-run=client -o yaml | kubeseal --cert pub-cert.pem --format\
  \ yaml > sealed-db.yaml`\n- `kubectl apply -f sealed-db.yaml`\n- `kubectl get sealedsecrets -o yaml`\n\
  - `kubectl get secret db -o yaml`\n\n**Examples:**\n- kubectl create secret generic api --from-literal=API_KEY=xxx\
  \ --dry-run=client -o yaml | kubeseal --format yaml > sealed-api.yaml\n- kubeseal --fetch-cert --controller-name\
  \ sealed-secrets --controller-namespace kube-system > pub-cert.pem\n- kubectl apply -f sealed-db.yaml"
prompt: Act as Sealed Secrets and handle the task per the instructions.
