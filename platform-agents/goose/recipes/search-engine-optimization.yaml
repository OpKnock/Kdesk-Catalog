title: search-engine-optimization
description: Audits and improves site SEO with Lighthouse CI, crawler checks, sitemap generation, and
  Core Web Vitals measurement from the CLI.
version: 2.0.0
instructions: "# search-engine-optimization\n\nAudits and improves site SEO with Lighthouse CI, crawler\
  \ checks, sitemap generation, and Core Web Vitals measurement from the CLI.\n\n## Instructions\n\n#\
  \ Search Engine Optimization\n\nAudit and improve on-page SEO, crawlability, and performance signals\
  \ from the terminal.\n\n## What This Skill Does\n\n- Runs Lighthouse SEO/performance audits and extracts\
  \ scored JSON\n- Validates robots.txt, sitemaps, and critical HTTP headers\n- Lints HTML for missing\
  \ titles, meta descriptions, and heading structure\n- Measures Core Web Vitals (LCP, CLS, INP) across\
  \ runs\n- Enforces performance budgets in CI with Lighthouse CI\n\n## When to Use\n\n- A page loses\
  \ rankings and needs an SEO audit\n- Site migration or launch needs crawlability checks\n- CI should\
  \ block PRs that regress Lighthouse scores\n\n## Real Commands\n\n```bash\n# Full audit with machine-readable\
  \ output\nnpx lighthouse https://example.com --only-categories=seo,performance --output=json --output-path=lh.json\n\
  \n# CI gate with budgets and assertions\nnpx lhci collect --url=https://example.com --numberOfRuns=3\n\
  npx lhci assert --preset=lighthouse:recommended\nnpx lhci upload --target=temporary-public-storage\n\
  \n# Crawlability and headers\ncurl -s https://example.com/robots.txt\ncurl -s https://example.com/sitemap.xml\
  \ | grep -c '<url>'\ncurl -sI https://example.com | grep -i 'cache-control'\n\n# On-page linting\nnpx\
  \ htmlhint public/index.html\ncurl -s https://example.com | grep -o '<title>[^<]*</title>'\n```\n\n\
  ## Sample lighthouserc\n\n```json\n{\n  \"ci\": {\n    \"collect\": { \"url\": [\"https://example.com\"\
  ], \"numberOfRuns\": 3 },\n    \"assert\": {\n      \"assertions\": {\n        \"categories:seo\": [\"\
  error\", { \"minScore\": 0.9 }],\n        \"categories:performance\": [\"warn\", { \"minScore\": 0.8\
  \ }]\n      }\n    }\n  }\n}\n```\n\n## Best Practices\n\n- Audit the top-traffic and money pages, not\
  \ just the homepage\n- Verify sitemap URLs return 200 and match canonical URLs\n- Keep LCP under 2.5s:\
  \ compress images, preload critical assets\n- Set cache-control on static assets and avoid redirect\
  \ chains\n- Wire lhci into CI so SEO regressions fail the build\n\n## Capabilities\n\n### lighthouse-audit\n\
  Run Lighthouse audits for SEO, performance, and accessibility scores.\n\n**Commands:**\n- `npx lighthouse\
  \ http://localhost:8080 --only-categories=seo,performance --output=json --output-path=lh.json`\n- `npx\
  \ lhci autorun`\n- `npx lighthouse http://localhost:8080 --chrome-flags=\"--headless\"`\n- `npx lhci\
  \ collect --url=http://localhost:8080 --numberOfRuns=3`\n\n**Examples:**\n- npx lighthouse http://localhost:8080\
  \ --only-categories=seo --output=json --output-path=seo.json\n- npx lhci autorun\n- npx lighthouse http://localhost:8080/checkout\
  \ --budget-path=budget.json\n\n### crawling-and-content\nValidate meta tags, robots.txt, sitemaps, and\
  \ HTTP headers with curl and htmlhint.\n\n**Commands:**\n- `curl -s http://localhost:8080/robots.txt`\n\
  - `curl -s http://localhost:8080/sitemap.xml | head -20`\n- `curl -sI http://localhost:8080 | grep -i\
  \ '^HTTP\\|^content-type\\|^cache-control'`\n- `npx htmlhint index.html`\n- `curl -s http://localhost:8080\
  \ | grep -o 'demo-title[^<]*demo-title'`\n\n**Examples:**\n- curl -sI http://localhost:8080 | grep -i\
  \ '^content-encoding'\n- curl -s http://localhost:8080/sitemap.xml | grep -c 'http://localhost:8080'\n\
  - npx htmlhint public/index.html"
prompt: Act as search-engine-optimization and handle the task per the instructions.
