title: Secret Management
description: 'Manages secrets across platforms with HashiCorp Vault, SOPS, and cloud secret managers:
  creation, rotation, policies, and injection.'
version: 2.0.0
instructions: "# Secret Management\n\nManages secrets across platforms with HashiCorp Vault, SOPS, and\
  \ cloud secret managers: creation, rotation, policies, and injection.\n\n## Instructions\n\n# Secret\
  \ Management\n\nStore, rotate, and inject secrets across Vault, SOPS, and cloud managers.\n\n## What\
  \ This Skill Does\n\n- Operates Vault KV engines, policies, and tokens\n- Encrypts repo files with SOPS\
  \ (age/KMS/PGP)\n- Reads/writes cloud secret manager entries\n- Applies least-privilege policies per\
  \ workload\n- Automates rotation workflows\n\n## When to Use\n\n- Choosing a secret storage strategy\
  \ for an app\n- Moving secrets out of env vars and git history\n- Rotating credentials safely\n\n##\
  \ Real Commands\n\n```bash\n# Vault\nvault secrets enable -path=kv kv-v2\nvault kv put kv/app/db password=s3cr3t\
  \ user=app\nvault kv get kv/app/db\nvault kv delete kv/app/db\nvault policy write app-reader policy.hcl\n\
  vault token create -policy=app-reader -ttl=24h\nvault kv rotate kv/app/db\n\n# SOPS (age)\nsops --encrypt\
  \ --age $(cat age-public-key) secrets.yaml\nsops -e --in-place secrets.yaml\nsops -d secrets.yaml\n\
  sops --set '[\"db\"][\"password\"] \"newpass\"' secrets.yaml\n\n# Cloud\naws secretsmanager put-secret-value\
  \ --secret-id app/db --secret-string '{\"password\":\"s3cr3t\"}'\naws secretsmanager get-secret-value\
  \ --secret-id app/db --query SecretString --output text\ngcloud secrets create db-password --data-file=./pw.txt\n\
  ```\n\n## Vault Policy\n\n```hcl\npath \"kv/data/app/db\" {\n  capabilities = [\"read\"]\n}\n```\n\n\
  ## Best Practices\n\n- Never store plaintext secrets in git; use SOPS or SealedSecrets\n- Use Vault\
  \ short-TTL tokens and approle auth for services\n- Rotate on a schedule; verify rotation with versioning\n\
  - Keep KMS/age keys in hardware or isolated credential stores\n- Audit access: cloud managers and Vault\
  \ both log reads\n\n## Capabilities\n\n### vault-operations\nEnable engines, write/read secrets, and\
  \ manage policies and tokens.\n\n**Commands:**\n- `vault secrets enable -path=kv kv-v2`\n- `vault kv\
  \ put kv/app/db password=s3cr3t user=app`\n- `vault kv get kv/app/db`\n- `vault policy write app-reader\
  \ policy.hcl`\n- `vault token create -policy=app-reader -ttl=24h`\n- `vault kv rotate kv/app/db`\n\n\
  **Examples:**\n- vault kv put kv/app/db password=s3cr3t\n- vault kv get kv/app/db\n- vault policy write\
  \ app-reader policy.hcl\n\n### sops-and-cloud\nEncrypt files with SOPS and manage cloud secret manager\
  \ entries.\n\n**Commands:**\n- `sops --encrypt --age $(cat ~/.config/sops/age/keys.txt | head -1) secrets.yaml`\n\
  - `sops -e --in-place secrets.yaml`\n- `sops -d secrets.yaml`\n- `aws secretsmanager put-secret-value\
  \ --secret-id app/db --secret-string '{\"password\":\"s3cr3t\"}'`\n- `aws secretsmanager get-secret-value\
  \ --secret-id app/db --query SecretString --output text`\n- `gcloud secrets create db-password --data-file=./pw.txt`\n\
  \n**Examples:**\n- sops -e --in-place secrets.yaml\n- aws secretsmanager get-secret-value --secret-id\
  \ app/db\n- gcloud secrets create db-password --data-file=./pw.txt"
prompt: Act as Secret Management and handle the task per the instructions.
