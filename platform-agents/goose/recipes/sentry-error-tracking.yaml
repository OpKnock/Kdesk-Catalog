version: 2.0.0
instructions: "# Sentry Error Tracking\n\nOperates Sentry end-to-end: bootstraps the Python SDK with DSN\
  \ and release context, manages releases and deploys via sentry-cli with commit linking, and verifies\
  \ the ingest pipeline with raw envelope submissions.\n\n## Instructions\n\n# Sentry Error Tracking\n\
  \nOperates Sentry end-to-end: SDK initialization, release/deploy management, and ingest verification.\n\
  \n## What this skill does\n\n- Bootstraps the Python SDK with DSN, environment, and release context\n\
  - Creates releases and links commits with sentry-cli\n- Sends raw events to the ingest endpoint for\
  \ smoke testing\n\n## When to use\n\n- Onboarding a new service to Sentry\n- Release hygiene: source\
  \ maps and commits per release\n- Verifying the ingest pipeline with a test event\n\n## Real commands\n\
  \n```bash\n# SDK installation\npip install sentry-sdk\n\n# Release management\nsentry-cli releases new\
  \ -p backend 2026.08.1\nsentry-cli releases set-commits --auto 2026.08.1\nsentry-cli releases deploys\
  \ 2026.08.1 new -e production\nsentry-cli releases list -p backend\n\n# Raw ingest smoke test\ncurl\
  \ -X POST \"https://o1.ingest.sentry.io/api/0/store/?sentry_key=DSN_PUBLIC\" \\\n  -H 'Content-Type:\
  \ application/json' \\\n  -d '{\"event_id\":\"0123456789abcdef0123456789abcdef\",\"message\":\"smoke\"\
  ,\"level\":\"warning\"}'\n```\n\n## SDK init\n\n```python\nimport sentry_sdk\n\nsentry_sdk.init(\n \
  \   dsn=\"https://public@o1.ingest.sentry.io/1234\",\n    environment=\"production\",\n    release=\"\
  2026.08.1\",\n    traces_sample_rate=0.1,\n)\n```\n\n## Testing\n\n```bash\nsentry-cli releases new\
  \ -p backend smoke-$(date +%s)\ncurl -X POST \"https://o1.ingest.sentry.io/api/0/store/?sentry_key=DSN_PUBLIC\"\
  \ \\\n  -d '{\"message\":\"test\",\"level\":\"info\"}'\n```\n\n## Best practices\n\n- Set release and\
  \ environment in init; filters depend on them\n- Run sentry-cli set-commits in CI right after deploy\n\
  - Keep the DSN public key safe in client code but never the auth token\n\n## Capabilities\n\n### sentry-release-workflow\n\
  Initialize the SDK, track releases/deploys, and ingest test events\n\n**Commands:**\n- `pip install\
  \ sentry-sdk`\n- `sentry-cli --version`\n- `sentry-cli releases new -p backend 2026.08.1`\n- `sentry-cli\
  \ releases set-commits --auto 2026.08.1`\n- `sentry-cli releases deploys 2026.08.1 new -e production`\n\
  - `curl -X POST \"https://o1.ingest.sentry.io/api/0/store/?sentry_key=DSN_PUBLIC\" -H 'Content-Type:\
  \ application/json' -d '{\"event_id\":\"0123456789abcdef0123456789abcdef\",\"message\":\"smoke\",\"\
  level\":\"warning\"}'`\n\n**Examples:**\n- sentry-cli releases new -p backend 2026.08.1 && sentry-cli\
  \ releases set-commits --auto 2026.08.1\n- curl -X POST \"https://o1.ingest.sentry.io/api/0/store/?sentry_key=DSN_PUBLIC\"\
  \ -H 'Content-Type: application/json' -d '{\"message\":\"test\",\"level\":\"info\"}'\n- sentry-cli releases\
  \ list -p backend"
prompt: Act as Sentry Error Tracking and handle the task per the instructions.
