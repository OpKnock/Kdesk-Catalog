title: Service Mesh
description: Installs and operates Istio or Linkerd service meshes in Kubernetes. Verifies sidecar injection,
  analyzes configuration, routes traffic with VirtualServices, and enables mTLS between services without
  application changes.
version: 2.0.0
instructions: "# Service Mesh\n\nInstalls and operates Istio or Linkerd service meshes in Kubernetes.\
  \ Verifies sidecar injection, analyzes configuration, routes traffic with VirtualServices, and enables\
  \ mTLS between services without application changes.\n\n## Instructions\n\n# Service Mesh\n\nHand-crafted\
  \ skill for installing and operating a service mesh.\n\n## What this skill does\n\n- Installs Istio\
  \ or Linkerd into a cluster\n- Verifies proxies are connected and sidecars injected\n- Routes traffic\
  \ with VirtualService rules\n\n## When to use\n\n- Enabling mTLS between services without app changes\n\
  - Adding fine-grained traffic routing or canaries\n- Rolling out mesh observability (metrics, tracing)\n\
  \n## Real commands\n\n```bash\n# Istio install (demo profile for evaluation)\nistioctl install --set\
  \ profile=demo -y\n\n# Static analysis of your config\nistioctl analyze\n\n# Are proxies synced?\nistioctl\
  \ proxy-status\n\n# Traffic rules\nkubectl get virtualservices -A\nkubectl get virtualservices -A -o\
  \ yaml\n\n# Linkerd bootstrap\nlinkerd check --pre && linkerd install | kubectl apply -f -\nlinkerd\
  \ check\nkubectl get deploy -n <ns> -o yaml | linkerd inject - | kubectl apply -f -\n```\n\n## VirtualService\
  \ example\n\n```yaml\napiVersion: networking.istio.io/v1beta1\nkind: VirtualService\nmetadata:\n  name:\
  \ api-routes\nspec:\n  hosts: [api]\n  http:\n    - match: [{ headers: { version: { exact: canary }\
  \ } }]\n      route: [{ destination: { host: api, subset: v2 } }]\n    - route: [{ destination: { host:\
  \ api, subset: v1 } }]\n```\n\n## Testing\n\n```bash\nistioctl proxy-status\nkubectl exec deploy/api\
  \ -c istio-proxy -- curl -s localhost:15090/stats/prometheus | grep istio_requests_total | head\n```\n\
  \n## Best practices\n\n- Run istioctl analyze before and after config changes\n- Inject sidecars namespace-wide\
  \ with labels, not pod by pod\n- Validate mesh health with linkerd check or istioctl proxy-status\n\n\
  ## Capabilities\n\n### istio-linkerd-mesh\nInstalls and operates Istio or Linkerd service meshes in\
  \ Kubernetes. Verifies sidecar injection, analyzes configuration, routes traffic with VirtualServices,\
  \ and enables mTLS between services without application changes.\n\n**Commands:**\n- `istioctl install\
  \ --set profile=demo -y`\n- `istioctl analyze`\n- `istioctl proxy-status`\n- `kubectl get virtualservices\
  \ -A`\n- `linkerd check --pre`\n- `linkerd install`\n- `linkerd check`\n\n**Examples:**\n- istioctl\
  \ install --set profile=demo -y\n- istioctl analyze\n- istioctl proxy-status\n- kubectl get virtualservices\
  \ -A\n- linkerd check --pre && linkerd install | kubectl apply -f -"
prompt: Act as Service Mesh and handle the task per the instructions.
