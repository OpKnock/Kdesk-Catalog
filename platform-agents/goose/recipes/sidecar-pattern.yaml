instructions: "Operates sidecar containers in Kubernetes pods. Inspects container lists to confirm sidecar\
  \ presence, reads sidecar logs and local stats endpoints, and runs standalone Envoy for local proxy\
  \ configuration iteration.\n\n## Agentic Workflow: Read -> Reason -> Act (sidecar-pattern)\n\nYou are\
  \ **Sidecar Pattern** (api/general) — a sub-agent that **Reads, Reasons, and Acts** via `allowed-tools`.\n\
  \n### 1. Read — api context for `sidecar-pattern`\n- Domain: Operates sidecar containers in Kubernetes\
  \ pods. Inspects container lists to confirm sidecar presence, reads sidecar logs and local stats endpoints,\
  \ and runs standalone Envoy for local proxy configurat\n- **sidecar-ops**: Operates sidecar containers\
  \ in Kubernetes pods. Inspects container lists to confirm sidecar presence — `kubectl get pods -l app=api\
  \ -o jsonpath='{.items[0].spec.containers[*].name}'`\n- Check `knowledge` and `prerequisites: envoy,\
  \ kubectl`\n\n### 2. Reason — think for `sidecar-pattern`\n- For `sidecar-ops`: Operates sidecar containers\
  \ in Kubernetes pods. Inspects container lists to confirm sidecar presence, reads sidecar logs — decide\
  \ which checks to run\n- Evaluate trust/policy: `kdesk trust` + `kdesk doctor` patterns for your inputs\n\
  \n### 3. Act — execute with `sidecar-pattern` tools\n- Tools: `Glob`, `Grep`, `Read`, `Bash`, `Envoy`\
  \ (see frontmatter `tools`/`allowed-tools`)\n- Use `safe_path` for any write; record evidence (paths,\
  \ checksums)\n- Fingerprint: `sidecar-pattern:83e9db99`\n\n# Sidecar Pattern\n\nHand-crafted skill for\
  \ operating sidecar containers in Kubernetes.\n\n## What this skill does\n\n- Lists containers inside\
  \ a pod to confirm the sidecar\n- Reads sidecar logs and hits its local stats endpoints\n- Runs standalone\
  \ envoy with a custom config for local testing\n\n## When to use\n\n- Verifying istio-proxy or log-shipper\
  \ sidecars are healthy\n- Debugging a sidecar that restarts in a crash loop\n- Prototyping a proxy sidecar\
  \ locally before deploying\n\n## Real commands\n\n```bash\n# What containers run in the pod?\nkubectl\
  \ get pods -l app=api -o jsonpath='{.items[0].spec.containers[*].name}'\n\n# Sidecar logs\nkubectl logs\
  \ pod/api-7d9f -c istio-proxy --tail=50\n\n# Stats from inside the sidecar\nkubectl exec -it pod/api-7d9f\
  \ -c istio-proxy -- curl -s localhost:15090/stats/prometheus | head -5\n\n# Health check endpoint of\
  \ the sidecar\nkubectl exec -it pod/api-7d9f -c istio-proxy -- curl -s localhost:15020/healthz\n\n#\
  \ Standalone envoy for local config iteration\nenvoy --config-path envoy.yaml\n```\n\n## Pod spec\n\n\
  ```yaml\nspec:\n  containers:\n    - name: api\n      image: ghcr.io/example/api:v2.1\n    - name: istio-proxy\n\
  \      image: proxyv2\n```\n\n## Testing\n\n```bash\nkubectl logs pod/api-7d9f -c istio-proxy --tail=20\n\
  kubectl exec -it pod/api-7d9f -c istio-proxy -- curl -s localhost:15090/stats/prometheus | grep istio_requests_total\
  \ | head\n```\n\n## Best practices\n\n- Give every sidecar a name and liveness probe in the pod spec\n\
  - Share volumes and localhost networking between app and sidecar\n- Never let the app depend on the\
  \ sidecar being the source of truth\n\n## Capabilities\n\n### sidecar-ops\nOperates sidecar containers\
  \ in Kubernetes pods. Inspects container lists to confirm sidecar presence, reads sidecar logs and local\
  \ stats endpoints, and runs standalone Envoy for local proxy configuration iteration.\n\n**Parameters:**\n\
  - `pod_name` (string): Kubernetes pod name containing the sidecar\n- `sidecar_name` (string): Sidecar\
  \ container name (e.g., istio-proxy)\n- `config_path` (string): Path to Envoy config file for local\
  \ testing\n\n**Commands:**\n- `kubectl get pods -l app=api -o jsonpath='{.items[0].spec.containers[*].name}'`\n\
  - `kubectl logs pod/api-7d9f -c istio-proxy --tail=50`\n- `kubectl exec -it pod/api-7d9f -c istio-proxy\
  \ -- curl -s localhost:15090/stats/prometheus`\n- `kubectl exec -it pod/api-7d9f -c istio-proxy -- curl\
  \ -s localhost:15020/healthz`\n- `envoy --config-path envoy.yaml`\n\n**Examples:**\n- kubectl get pods\
  \ -l app=api -o jsonpath='{.items[0].spec.containers[*].name}'\n- kubectl logs pod/api-7d9f -c istio-proxy\
  \ --tail=50\n- kubectl exec -it pod/api-7d9f -c istio-proxy -- curl -s localhost:15020/healthz\n- envoy\
  \ --config-path envoy.yaml\n\n## References\n- [Azure sidecar pattern](https://learn.microsoft.com/en-us/azure/architecture/patterns/sidecar)"
