title: SLO SLI
description: Defines Service Level Indicators and computes SLO error budgets from Prometheus metrics.
  Evaluates availability and latency SLIs over 30-day windows, validates recording rules with promtool,
  and enables burn-rate alerting.
version: 2.0.0
instructions: "# SLO SLI\n\nDefines Service Level Indicators and computes SLO error budgets from Prometheus\
  \ metrics. Evaluates availability and latency SLIs over 30-day windows, validates recording rules with\
  \ promtool, and enables burn-rate alerting.\n\n## Instructions\n\n# SLO / SLI\n\nHand-crafted skill\
  \ for defining SLIs and computing SLO error budgets.\n\n## What this skill does\n\n- Computes availability\
  \ and latency SLIs from Prometheus counters\n- Evaluates error budget burn over 30d windows\n- Validates\
  \ recording rules with promtool before deploying\n\n## When to use\n\n- Defining reliability targets\
  \ for a new service\n- Checking whether an incident burned the budget\n- Alerting on burn rate instead\
  \ of raw errors\n\n## Real commands\n\n```bash\n# Error rate over 5m\npromtool query instant --url=http://localhost:9090\
  \ 'rate(http_requests_total{job=\"api\",code=~\"5..\"}[5m])'\n\n# Total requests per hour\ncurl -g 'http://localhost:9090/api/v1/query?query=sum(rate(http_requests_total[1h]))'\
  \ | jq '.data.result'\n\n# 30-day availability SLI: good / total\ncurl -g 'http://localhost:9090/api/v1/query?query=sum(rate(http_requests_total{job=\"\
  api\",code!~\"5..\"}[30d])) / sum(rate(http_requests_total{job=\"api\"}[30d]))' | jq '.data.result[0].value[1]'\n\
  \n# p99 latency from a histogram\ncurl -g 'http://localhost:9090/api/v1/query?query=histogram_quantile(0.99,\
  \ sum(rate(http_request_duration_seconds_bucket[5m])) by (le))' | jq '.data.result[0].value[1]'\n\n\
  # Validate SLO rules before reload\npromtool check rules slo.rules.yml\n```\n\n## Error budget rule\n\
  \n```yaml\ngroups:\n  - name: slo.rules\n    rules:\n      - record: slo:api:error_budget_remaining\n\
  \        expr: 1 - ((1 - sli:api:availability:ratio30d) / 0.01)\n```\n\n## Testing\n\n```bash\npromtool\
  \ check rules slo.rules.yml\npromtool query instant --url=http://localhost:9090 'slo:api:error_budget_remaining'\n\
  ```\n\n## Best practices\n\n- Pick SLIs you can measure: availability from status codes, latency from\
  \ histograms\n- Use 30d windows for budget; alert on fast burn (5% budget in 6h)\n- Never change the\
  \ SLI definition retroactively\n\n## Capabilities\n\n### slo-computation\nDefines Service Level Indicators\
  \ and computes SLO error budgets from Prometheus metrics. Evaluates availability and latency SLIs over\
  \ 30-day windows, validates recording rules with promtool, and enables burn-rate alerting.\n\n**Commands:**\n\
  - `promtool query instant --url=http://localhost:9090 'rate(http_requests_total{job=\"api\",code=~\"\
  5..\"}[5m])'`\n- `curl -g 'http://localhost:9090/api/v1/query?query=sum(rate(http_requests_total[1h]))'\
  \ | jq '.data.result'`\n- `curl -g 'http://localhost:9090/api/v1/query?query=sum(rate(http_requests_total{job=\"\
  api\",code!~\"5..\"}[30d])) / sum(rate(http_requests_total{job=\"api\"}[30d]))' | jq '.data.result[0].value[1]'`\n\
  - `curl -g 'http://localhost:9090/api/v1/query?query=histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m]))\
  \ by (le))' | jq '.data.result[0].value[1]'`\n- `promtool check rules slo.rules.yml`\n\n**Examples:**\n\
  - promtool query instant --url=http://localhost:9090 'rate(http_requests_total{job=\"api\",code=~\"\
  5..\"}[5m])'\n- curl -g 'http://localhost:9090/api/v1/query?query=sum(rate(http_requests_total[1h]))'\
  \ | jq '.data.result'\n- curl -g 'http://localhost:9090/api/v1/query?query=sum(rate(http_requests_total{job=\"\
  api\",code!~\"5..\"}[30d])) / sum(rate(http_requests_total{job=\"api\"}[30d]))' | jq '.data.result[0].value[1]'\n\
  - promtool check rules slo.rules.yml"
prompt: Act as SLO SLI and handle the task per the instructions.
