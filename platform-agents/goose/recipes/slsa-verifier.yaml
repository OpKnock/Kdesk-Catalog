title: slsa-verifier
description: Verifies SLSA provenance of artifacts and container images with slsa-verifier before deployment.
version: 2.0.0
instructions: "# slsa-verifier\n\nVerifies SLSA provenance of artifacts and container images with slsa-verifier\
  \ before deployment.\n\n## Instructions\n\n# slsa-verifier\n\nVerify SLSA provenance before trusting\
  \ artifacts and images.\n\n## What This Skill Does\n\n- Verifies artifacts against intoto provenance\
  \ generated by GitHub Actions\n- Verifies OCI images with provenance attestations\n- Checks source URI,\
  \ tag, and build workflow inputs\n- Prints parsed provenance for review\n\n## When to Use\n\n- Deploy\
  \ gates that require provenance (SLSA Level 3)\n- Downloading third-party binaries built by public CI\n\
  - Auditing that artifacts match their declared build source\n\n## Real Commands\n\n```bash\n# Verify\
  \ an artifact\nslsa-verifier verify-artifact dist.tgz \\\n  --provenance-path dist.intoto.jsonl \\\n\
  \  --source-uri github.com/org/repo \\\n  --source-tag v1.2.3\n\n# Verify an image\nslsa-verifier verify-image\
  \ ghcr.io/org/app:v1.0.0 \\\n  --source-uri github.com/org/repo --source-tag v1.0.0\n\n# Inspect the\
  \ provenance\nslsa-verifier verify-artifact --provenance-path p.json dist.tgz \\\n  --source-uri github.com/org/repo\
  \ --print-provenance\n```\n\n## Pipeline Placement\n\n```yaml\n- name: Verify SLSA provenance\n  run:\
  \ |\n    slsa-verifier verify-artifact dist.tgz \\\n      --provenance-path dist.intoto.jsonl \\\n \
  \     --source-uri github.com/org/repo --source-tag $GITHUB_REF_NAME\n```\n\n## Best Practices\n\n-\
  \ Pin --source-tag for release builds, not just --source-uri\n- Verify in the deploy environment, not\
  \ only in CI\n- Require provenance for all artifacts produced by the build pipeline\n- Pair with cosign\
  \ for signature verification of the images themselves\n- Fail deploy if verification errors; never warn-and-continue\n\
  \n## Capabilities\n\n### artifact-verification\nVerify binaries and archives against SLSA provenance.\n\
  \n**Commands:**\n- `slsa-verifier verify-artifact dist.tgz --provenance-path dist.intoto.jsonl --source-uri\
  \ github.com/org/repo`\n- `slsa-verifier verify-artifact dist.zip --provenance-path provenance.json\
  \ --source-uri github.com/org/repo --source-tag v1.2.3`\n- `slsa-verifier verify-artifact --provenance-path\
  \ p.json dist.tgz --source-uri github.com/org/repo --print-provenance`\n- `slsa-verifier verify-artifact\
  \ --build-workflow-input \"repository: org/repo\" --provenance-path p.json dist.tgz`\n\n**Examples:**\n\
  - slsa-verifier verify-artifact dist.tgz --provenance-path dist.intoto.jsonl --source-uri github.com/org/repo\n\
  - slsa-verifier verify-artifact dist.tgz --provenance-path p.json --source-uri github.com/org/repo --source-tag\
  \ v1.0.0\n- slsa-verifier verify-artifact dist.tgz --provenance-path p.json --source-uri github.com/org/repo\
  \ --print-provenance\n\n### image-verification\nVerify container images with SLSA provenance.\n\n**Commands:**\n\
  - `slsa-verifier verify-image ghcr.io/org/app:latest --source-uri github.com/org/repo`\n- `slsa-verifier\
  \ verify-image ghcr.io/org/app:latest --source-uri github.com/org/repo --source-tag v1.2.3`\n- `slsa-verifier\
  \ verify-image ghcr.io/app@sha256:abc123 --source-uri github.com/org/repo`\n\n**Examples:**\n- slsa-verifier\
  \ verify-image ghcr.io/org/app:v1.0.0 --source-uri github.com/org/repo --source-tag v1.0.0\n- slsa-verifier\
  \ verify-image ghcr.io/org/app:latest --source-uri github.com/org/repo"
prompt: Act as slsa-verifier and handle the task per the instructions.
