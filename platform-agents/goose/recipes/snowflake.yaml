title: Snowflake
description: 'Works with Snowflake: SQL execution via snowsql, warehouses, stages, and query performance.'
version: 2.0.0
instructions: "# Snowflake\n\nWorks with Snowflake: SQL execution via snowsql, warehouses, stages, and\
  \ query performance.\n\n## Instructions\n\n# Snowflake\n\nData warehouse operations with snowsql: SQL\
  \ execution, loading via stages,\nwarehouse management, and query diagnostics.\n\n## When to Use\n\n\
  - Running ad-hoc and scripted SQL\n- Loading files from stages into tables\n- Investigating slow queries\
  \ and warehouse usage\n\n## Real Commands\n\n```bash\n# Connect and run one query\nsnowsql -a myorg-account\
  \ -u jdoe -d analytics -s core -w etl_wh \\\n  -q \"SELECT CURRENT_WAREHOUSE(), CURRENT_ROLE();\"\n\n\
  # Run a script file\nsnowsql -a myorg-account -u jdoe -f scripts/schema.sql --warehouse=etl_wh \\\n\
  \  -o exit_on_error=true -o echo=true\n\n# Load data from a stage\nsnowsql -q \"COPY INTO raw.events\
  \ FROM @my_stage/events FILE_FORMAT=(TYPE=CSV SKIP_HEADER=1);\"\n\n# Warehouse state\nsnowsql -q \"\
  SHOW WAREHOUSES;\" -o output_format=json\n\n# Slow query analysis\nsnowsql -q \"SELECT query_id, total_elapsed_time/1000\
  \ AS secs, query_text FROM table(information_schema.query_history(result_limit=>10)) ORDER BY total_elapsed_time\
  \ DESC;\"\n```\n\n## Best Practices\n\n- Set `-o exit_on_error=true` in migrations to stop on failures\n\
  - Use roles, not individual credentials, for automation\n- Suspend warehouses in dev (auto_suspend)\
  \ to control cost\n- Load via stages + COPY INTO rather than insert-by-insert\n- Check `QUERY_HISTORY`\
  \ for cost and performance diagnosis\n\n## Example Response\n\nFor a slow pipeline: finds the slow queries\
  \ in query_history, checks warehouse\nsize and cache misses, and recommends sizing or clustering changes.\n\
  \n## Capabilities\n\n### snowsql\nExecute SQL, scripts, and configuration against Snowflake\n\n**Commands:**\n\
  - `snowsql -a myorg-account -u jdoe -d analytics -s core`\n- `snowsql -q \"SELECT CURRENT_WAREHOUSE(),\
  \ CURRENT_ROLE();\"`\n- `snowsql -f scripts/schema.sql --warehouse=etl_wh`\n- `snowsql -o exit_on_error=true\
  \ -f migrations/001.sql`\n- `snowsql -q \"SHOW WAREHOUSES;\" -o output_format=json`\n\n**Examples:**\n\
  - snowsql -a myorg-account -u jdoe -d analytics -s core -w compute_wh\n- snowsql -q \"COPY INTO raw.events\
  \ FROM @stage/events FILE_FORMAT=(TYPE=CSV)\"\n- snowsql -q \"SELECT query_id, total_elapsed_time/1000\
  \ secs FROM table(information_schema.query_history()) ORDER BY total_elapsed_time DESC LIMIT 10;\""
prompt: Act as Snowflake and handle the task per the instructions.
