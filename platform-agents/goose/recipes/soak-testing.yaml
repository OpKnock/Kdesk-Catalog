title: Soak Testing
description: Runs sustained load tests for 24+ hours using k6 while monitoring resource trends. Captures
  memory, CPU, and connection metrics from Kubernetes pods and host-level tools to detect leaks and drift
  that short tests miss.
version: 2.0.0
instructions: "# Soak Testing\n\nRuns sustained load tests for 24+ hours using k6 while monitoring resource\
  \ trends. Captures memory, CPU, and connection metrics from Kubernetes pods and host-level tools to\
  \ detect leaks and drift that short tests miss.\n\n## Instructions\n\n# Soak Testing\n\nHand-crafted\
  \ skill for endurance testing long-running services.\n\n## What this skill does\n\n- Sustains moderate\
  \ load for hours to days with k6\n- Watches memory, CPU, and connection trends\n- Catches leaks and\
  \ drift that short tests miss\n\n## When to use\n\n- Before a launch where the service will run 24/7\n\
  - Investigating memory growth after a release\n- Verifying HPA can hold steady state under constant\
  \ load\n\n## Real commands\n\n```bash\n# 24-hour endurance run with 10 sustained users\nk6 run --vus\
  \ 10 --duration 24h soak.js\n\n# Save results for trend analysis\nk6 run --vus 10 --duration 24h soak.js\
  \ --out json=soak.json\n\n# Kubernetes resource trend\nkubectl top pods -l app=api -n prod\n\n# Host-level\
  \ watch\nfree -h && vmstat 1 10\ndstat -tcdmn 10\n\n# Autoscaling behavior\nkubectl get hpa api\n```\n\
  \n## k6 script\n\n```javascript\nexport const options = {\n  stages: [\n    { duration: \"1h\", target:\
  \ 10 },   // ramp\n    { duration: \"22h\", target: 10 },  // plateau\n    { duration: \"1h\", target:\
  \ 0 },    // ramp down\n  ],\n  thresholds: {\n    http_req_failed: [\"rate<0.01\"],\n    http_req_duration:\
  \ [\"p(95)<500\"],\n  },\n};\n\nexport default function () {\n  http.get(\"http://localhost:8080/api/v1/users\"\
  );\n}\n```\n\n## Testing\n\n```bash\nk6 run --vus 10 --duration 30m soak.js --out json=short-soak.json\n\
  kubectl top pods -n prod | sort -k2 -h\n```\n\n## Best practices\n\n- Check memory growth: RSS should\
  \ plateau, never climb linearly\n- Capture k6 JSON output and pod metrics at the same interval\n- A\
  \ 24h run is the minimum for leak confidence\n\n## Capabilities\n\n### soak-run\nRuns sustained load\
  \ tests for 24+ hours using k6 while monitoring resource trends. Captures memory, CPU, and connection\
  \ metrics from Kubernetes pods and host-level tools to detect leaks and drift that short tests miss.\n\
  \n**Commands:**\n- `k6 run --vus 10 --duration 24h soak.js`\n- `k6 run --vus 10 --duration 24h soak.js\
  \ --out json=soak.json`\n- `kubectl top pods -l app=api -n prod`\n- `free -h`\n- `vmstat 1 10`\n- `dstat\
  \ -tcdmn 10`\n- `kubectl get hpa api`\n\n**Examples:**\n- k6 run --vus 10 --duration 24h soak.js\n-\
  \ k6 run --vus 10 --duration 24h soak.js --out json=soak.json\n- kubectl top pods -l app=api -n prod\n\
  - free -h && vmstat 1 10\n- kubectl get hpa api"
prompt: Act as Soak Testing and handle the task per the instructions.
