title: SOPS Age
description: Encrypts configuration files with SOPS using age encryption keys. Generates age keypairs,
  encrypts and decrypts YAML/JSON files, patches individual values in encrypted files without disk decryption,
  and manages creation rules for GitOps workflows.
version: 2.0.0
instructions: "# SOPS Age\n\nEncrypts configuration files with SOPS using age encryption keys. Generates\
  \ age keypairs, encrypts and decrypts YAML/JSON files, patches individual values in encrypted files\
  \ without disk decryption, and manages creation rules for GitOps workflows.\n\n## Instructions\n\n#\
  \ SOPS with age\n\nHand-crafted skill for encrypting config files with SOPS using age keys.\n\n## What\
  \ this skill does\n\n- Generates age keypairs and derives the public recipient key\n- Encrypts and decrypts\
  \ YAML/JSON config files with sops\n- Rotates keys and patches individual values in encrypted files\n\
  \n## When to use\n\n- Storing env configs with secrets in a git repo\n- Local-first secret management\
  \ without a KMS\n- Offboarding a teammate: remove their key, rotate\n\n## Real commands\n\n```bash\n\
  # Generate the keypair (keep age.key safe, share only the public key)\nage-keygen -o age.key\nage-keygen\
  \ -y age.key   # prints the age1... public key\n\n# Encrypt a config file\nsops --age age1qxyzyqmvwec5xxh9rfld7f2lcgpfqyq0q8c9dk4tw3j3e2y3rms9qe5jwcq\
  \ --encrypt secrets/application.yaml > secrets/application.enc.yaml\n\n# Decrypt for local use\nsops\
  \ --decrypt secrets/application.enc.yaml\n\n# Patch one value without decrypting to disk\nsops --set\
  \ '[\"db\"][\"password\"] \"newpass\"' secrets/application.enc.yaml\n\n# Re-encrypt with the current\
  \ key set\nsops --rotate-keys secrets/application.enc.yaml\n```\n\n## .sops.yaml creation rules\n\n\
  ```yaml\ncreation_rules:\n  - path_regex: secrets/.*\\.yaml\n    age: age1qxyzyqmvwec5xxh9rfld7f2lcgpfqyq0q8c9dk4tw3j3e2y3rms9qe5jwcq\n\
  ```\n\nWith creation rules in place: `sops --encrypt secrets/application.yaml` needs no key flag.\n\n\
  ## Testing\n\n```bash\nsops --decrypt secrets/application.enc.yaml | yq '.db.password'\nsops --encrypt\
  \ secrets/application.yaml   # rule-based, no flags\n```\n\n## Best practices\n\n- Encrypt whole files,\
  \ never a single value, so the format stays honest\n- Keep age.key out of the repo and backups: recovery\
  \ depends on it\n- Remove a leaver's key and run sops --rotate-keys immediately\n\n## Capabilities\n\
  \n### sops-age\nEncrypts configuration files with SOPS using age encryption keys. Generates age keypairs,\
  \ encrypts and decrypts YAML/JSON files, patches individual values in encrypted files without disk decryption,\
  \ and manages creation rules for GitOps workflows.\n\n**Commands:**\n- `age-keygen -o age.key`\n- `age-keygen\
  \ -y age.key`\n- `sops --age age1qxyzyqmvwec5xxh9rfld7f2lcgpfqyq0q8c9dk4tw3j3e2y3rms9qe5jwcq --encrypt\
  \ secrets/application.yaml`\n- `sops --decrypt secrets/application.enc.yaml`\n- `sops --set '[\"db\"\
  ][\"password\"] \"newpass\"' secrets/application.enc.yaml`\n- `sops --rotate-keys secrets/application.enc.yaml`\n\
  \n**Examples:**\n- age-keygen -o age.key\n- sops --age age1qxyzyqmvwec5xxh9rfld7f2lcgpfqyq0q8c9dk4tw3j3e2y3rms9qe5jwcq\
  \ --encrypt secrets/application.yaml\n- sops --decrypt secrets/application.enc.yaml\n- sops --set '[\"\
  db\"][\"password\"] \"newpass\"' secrets/application.enc.yaml\n- sops --rotate-keys secrets/application.enc.yaml"
prompt: Act as SOPS Age and handle the task per the instructions.
