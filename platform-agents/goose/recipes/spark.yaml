title: Spark
description: 'Develops and runs Apache Spark jobs: spark-submit, interactive shells, SQL, and package
  management.'
version: 2.0.0
instructions: "# Spark\n\nDevelops and runs Apache Spark jobs: spark-submit, interactive shells, SQL,\
  \ and package management.\n\n## Instructions\n\n# Spark\n\nDevelops and operates Apache Spark batch\
  \ jobs: submission, tuning, SQL analysis,\nand debugging.\n\n## When to Use\n\n- Processing large datasets\
  \ in batch\n- Interactive analysis with pyspark/spark-shell\n- Tuning shuffle and memory for slow jobs\n\
  \n## Real Commands\n\n```bash\n# Local development run\nspark-submit --master local[4] --executor-memory\
  \ 4g jobs/wordcount.py\n\n# YARN cluster run\nspark-submit --master yarn --deploy-mode cluster \\\n\
  \  --num-executors 8 --executor-cores 4 --executor-memory 8g etl.py\n\n# With Python dependencies\n\
  spark-submit --master local[*] --py-files utils.py,models.zip job.py\n\n# Spark SQL\nspark-sql -f queries/aggregate.sql\
  \ --conf spark.sql.shuffle.partitions=200\n\n# Interactive\npyspark --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0\n\
  spark-shell --master yarn --deploy-mode client\n```\n\n## Tuning Cheat Sheet\n\n- Total executors ~=\
  \ cluster cores / 4\n- Shuffle partitions ~= 2-4x executors x cores\n- Use broadcast joins for small\
  \ tables (`spark.sql.autoBroadcastJoinThreshold`)\n- Cache hot DataFrames; unpersist after use\n- Monitor\
  \ via Spark UI port 4040\n\n## Best Practices\n\n- Test on a sample with `local[*]` before cluster runs\n\
  - Use `--py-files` for local modules\n- Set `spark.sql.shuffle.partitions` explicitly\n- Check for data\
  \ skew in GROUP BY keys\n- Persist intermediate results only when reused\n\n## Example Response\n\n\
  For a slow job: reviews the Spark UI metrics, identifies shuffle-heavy stages or\nskew, and applies\
  \ tuning options with expected impact.\n\n## Capabilities\n\n### spark-submit\nSubmit batch jobs with\
  \ cluster/local masters and dependencies\n\n**Commands:**\n- `spark-submit --master local[4] --executor-memory\
  \ 4g jobs/wordcount.py`\n- `spark-submit --master yarn --deploy-mode cluster --num-executors 8 --executor-cores\
  \ 4 etl.py`\n- `pyspark --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0`\n- `spark-shell\
  \ --master yarn --deploy-mode client -i setup.scala`\n- `spark-sql -f queries/aggregate.sql --conf spark.sql.shuffle.partitions=200`\n\
  \n**Examples:**\n- spark-submit --master local[*] --py-files utils.py job.py\n- spark-submit --master\
  \ k8s://https://k8s:6443 --deploy-mode cluster --conf spark.kubernetes.container.image=img job.py\n\
  - pyspark -i init.sql"
prompt: Act as Spark and handle the task per the instructions.
