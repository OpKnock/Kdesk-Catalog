title: ssh
description: 'Connects to remote hosts with ssh: config files, port forwarding, tunnels, keys, jump hosts,
  and verbose troubleshooting.'
version: 2.0.0
instructions: "# ssh\n\nConnects to remote hosts with ssh: config files, port forwarding, tunnels, keys,\
  \ jump hosts, and verbose troubleshooting.\n\n## Instructions\n\n# SSH Connections\n\nConnect and tunnel\
  \ to remote hosts securely.\n\n## What This Skill Does\n\n- Connects with keys, ports, and command execution\n\
  - Configures per-host options in ~/.ssh/config\n- Forwards local/remote ports and SOCKS proxies\n- Uses\
  \ jump hosts and agent forwarding\n- Troubleshoots with verbose output\n\n## When to Use\n\n- Any remote\
  \ shell access\n- Exposing local services through tunnels\n- Multi-hop bastion environments\n\n## Real\
  \ Commands\n\n```bash\n# Basic connections\nssh user@host\nssh -p 2222 user@host\nssh -i ~/.ssh/id_ed25519\
  \ user@host\nssh -t user@host 'sudo systemctl status nginx'\nssh -J jumpuser@bastion user@target\n\n\
  # Tunnels\nssh -L 8080:localhost:80 user@host          # local forward\nssh -L 3306:db.internal:3306\
  \ user@bastion   # through bastion\nssh -R 3000:localhost:3000 user@host        # remote forward\nssh\
  \ -D 1080 -N user@host                    # SOCKS proxy\nssh -o ExitOnForwardFailure=yes -L 8080:localhost:80\
  \ user@host\n\n# Debug\nssh -vvv user@host\n```\n\n## ~/.ssh/config\n\n```\nHost prod\n  HostName 10.0.0.5\n\
  \  User deploy\n  IdentityFile ~/.ssh/id_ed25519\n  ServerAliveInterval 30\n```\n\n## Best Practices\n\
  \n- Use config aliases over long flag lists\n- Prefer -J for bastions; forward agent only when needed\n\
  - Add ExitOnForwardFailure to fail fast on tunnels\n- Use -N for tunnels with no shell\n- Verify fingerprints\
  \ (ssh-keygen -F) before first connect\n\n## Capabilities\n\n### connections\nConnect with keys, ports,\
  \ and options.\n\n**Commands:**\n- `ssh user@host`\n- `ssh -p 2222 user@host`\n- `ssh -i ~/.ssh/id_ed25519\
  \ user@host`\n- `ssh -t user@host 'sudo systemctl status nginx'`\n- `ssh -J jumpuser@bastion user@target`\n\
  - `ssh -N -L 5432:localhost:5432 user@dbhost`\n\n**Examples:**\n- ssh -i ~/.ssh/id_ed25519 user@host\n\
  - ssh -t user@host 'sudo systemctl status nginx'\n- ssh -J jumpuser@bastion user@target\n\n### tunnels-and-forwarding\n\
  Forward ports, set up SOCKS proxies, and tunnel traffic.\n\n**Commands:**\n- `ssh -L 8080:localhost:80\
  \ user@host`\n- `ssh -R 3000:localhost:3000 user@host`\n- `ssh -D 1080 -N user@host`\n- `ssh -L 3306:db.internal:3306\
  \ user@bastion`\n- `ssh -o ExitOnForwardFailure=yes -L 8080:localhost:80 user@host`\n- `ssh -vvv user@host`\n\
  \n**Examples:**\n- ssh -L 3306:db.internal:3306 user@bastion\n- ssh -D 1080 -N user@host\n- ssh -vvv\
  \ user@host"
prompt: Act as ssh and handle the task per the instructions.
