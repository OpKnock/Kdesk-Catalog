  \n# SSO with Keycloak\n\nHand-crafted skill for single sign-on with Keycloak.\n\n## What this skill\
  \ does\n\n- Creates realms and clients with kcadm.sh\n- Exercises OIDC token flows against the token\
  \ endpoint\n- Uses discovery for endpoints and logout wiring\n\n## When to use\n\n- Standing up SSO\
  \ for internal apps\n- Testing flows before writing app code\n- Auditing clients and their scopes\n\n\
  ## Real commands\n\n```bash\n# Authenticate the admin CLI\nkcadm.sh config credentials --server http://localhost:8080\
  \ --realm master --user admin --password admin\n\n# Create a realm\nkcadm.sh create realms -s realm=myrealm\
  \ -s enabled=true\n\n# Create a client from JSON\nkcadm.sh create clients -r myrealm -f client.json\n\
  \n# Password grant token\ncurl -s -X POST http://localhost:8080/realms/myrealm/protocol/openid-connect/token\
  \ -d 'grant_type=password&client_id=app&username=ada&password=secret' | jq -r .access_token\n\n# Discovery\n\
  curl -s http://localhost:8080/realms/myrealm/.well-known/openid-configuration | jq -r '.end_session_endpoint'\n\
  ```\n\n## client.json\n\n```json\n{\n  \"clientId\": \"app\",\n  \"enabled\": true,\n  \"publicClient\"\
  : true,\n  \"redirectUris\": [\"http://localhost:3000/cb\"],\n  \"directAccessGrantsEnabled\": true\n\
  }\n```\n\n## Testing\n\n```bash\nTOKEN=$(curl -s -X POST http://localhost:8080/realms/myrealm/protocol/openid-connect/token\
  \ -d 'grant_type=password&client_id=app&username=ada&password=secret' | jq -r .access_token)\ncurl -s\
  \ -H \"Authorization: Bearer $TOKEN\" http://localhost:8080/realms/myrealm/protocol/openid-connect/userinfo\
  \ | jq\n```\n\n## Best practices\n\n- Prefer authorization_code for browser apps; keep secrets server-side\n\
  - Rotate client secrets and disable direct access grants in prod\n- Wire end_session_endpoint into logout\
  \ so SSO sessions die too\n\n## Capabilities\n\n### keycloak-sso\nConfigure SSO with Keycloak: realms,\
  \ clients, token flows\n\n**Parameters:**\n- `realm` (string): Keycloak realm name\n- `client_id` (string):\
  \ OIDC client identifier\n- `grant_type` (string): authorization_code, password, client_credentials,\
  \ refresh_token\n\n**Commands:**\n- `kcadm.sh config credentials --server http://localhost:8080 --realm\
  \ master --user admin --password admin`\n- `kcadm.sh create realms -s realm=myrealm -s enabled=true`\n\
  - `kcadm.sh create clients -r myrealm -f client.json`\n- `curl -s -X POST http://localhost:8080/realms/myrealm/protocol/openid-connect/token\
  \ -d 'grant_type=password&client_id=app&username=ada&password=secret' | jq -r .access_token`\n- `curl\
  \ -s http://localhost:8080/realms/myrealm/.well-known/openid-configuration | jq -r '.end_session_endpoint'`\n\
  \n**Examples:**\n- kcadm.sh config credentials --server http://localhost:8080 --realm master --user\
  \ admin --password admin\n- kcadm.sh create clients -r myrealm -f client.json\n- curl -s -X POST http://localhost:8080/realms/myrealm/protocol/openid-connect/token\
  \ -d 'grant_type=password&client_id=app&username=ada&password=secret' | jq -r .access_token\n\n## References\n\
  - [Keycloak server admin guide](https://www.keycloak.org/docs/latest/server_admin/index.html)\n- [Keycloak\
  \ Admin CLI](https://www.keycloak.org/docs/latest/server_admin/index.html#admin-cli)"
