title: static-site-generator
description: Builds and serves static sites with Hugo and Eleventy, managing content, themes, and production
  builds.
version: 2.0.0
instructions: "# static-site-generator\n\nBuilds and serves static sites with Hugo and Eleventy, managing\
  \ content, themes, and production builds.\n\n## Instructions\n\n# Static Site Generation\n\nBuild fast\
  \ static sites with Hugo and Eleventy.\n\n## What This Skill Does\n\n- Scaffolds sites and content with\
  \ Hugo/Eleventy CLIs\n- Serves live-preview dev servers with drafts\n- Produces minified production\
  \ builds\n- Manages taxonomies, drafts, and git-based deploy info\n\n## When to Use\n\n- Creating documentation\
  \ or marketing sites\n- Migrating a slow dynamic site to static\n- Building a blog with markdown content\n\
  \n## Real Commands\n\n```bash\n# Hugo\nhugo new site mysite\nhugo new posts/first-post.md\nhugo server\
  \ -D\nhugo -D --minify\nhugo --gc --minify --enableGitInfo\nhugo list drafts\n\n# Eleventy\nnpx @11ty/eleventy\
  \ --input=src --output=dist\nnpx @11ty/eleventy --serve\nnpx @11ty/eleventy --config=.eleventy.cjs --pathprefix=/blog\n\
  ```\n\n## Hugo Config (hugo.toml)\n\n```toml\nbaseURL = \"https://example.com/\"\ntitle = \"Docs\"\n\
  enableGitInfo = true\n[minify]\n  minifyOutput = true\n[params]\n  description = \"Product documentation\"\
  \n```\n\n## Best Practices\n\n- Keep content in markdown with front matter for metadata\n- Build with\
  \ --minify and --gc for production\n- Set --enableGitInfo so pages show last-modified dates\n- Use a\
  \ single content directory convention per team\n- Deploy the static output via any CDN or object storage\n\
  \n## Capabilities\n\n### hugo-build\nScaffold, develop, and build Hugo sites.\n\n**Commands:**\n- `hugo\
  \ new site mysite`\n- `hugo new posts/first-post.md`\n- `hugo server -D`\n- `hugo -D`\n- `hugo list\
  \ all`\n\n**Examples:**\n- hugo new site mysite && cd mysite && hugo server -D\n- hugo new posts/hello-world.md\n\
  - hugo -D --minify\n\n### eleventy-build\nScaffold, serve, and build Eleventy sites.\n\n**Commands:**\n\
  - `npx @11ty/eleventy --input=src --output=dist`\n- `npx @11ty/eleventy --serve`\n- `npx @11ty/eleventy\
  \ --watch`\n- `npx @11ty/eleventy --quiet`\n- `npx @11ty/eleventy --config=.eleventy.cjs --pathprefix=/docs`\n\
  \n**Examples:**\n- npx @11ty/eleventy --input=src --output=dist\n- npx @11ty/eleventy --serve\n- npx\
  \ @11ty/eleventy --pathprefix=/blog\n\n### content-publishing\nManage content, taxonomies, and deployment\
  \ output.\n\n**Commands:**\n- `hugo new docs/guide/_index.md`\n- `hugo --gc --minify --enableGitInfo`\n\
  - `hugo list drafts`\n- `hugo config`\n- `hugo env`\n\n**Examples:**\n- hugo --gc --minify --enableGitInfo\n\
  - hugo list drafts\n- hugo config"
prompt: Act as static-site-generator and handle the task per the instructions.
