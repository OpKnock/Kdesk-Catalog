title: stylelint
description: Lints CSS/SCSS and CSS-in-JS with Stylelint, enforcing order, naming, and browser-compatibility
  rules.
version: 2.0.0
instructions: "# stylelint\n\nLints CSS/SCSS and CSS-in-JS with Stylelint, enforcing order, naming, and\
  \ browser-compatibility rules.\n\n## Instructions\n\n# Stylelint\n\nModern linter for CSS and CSS-like\
  \ syntax (SCSS, Less, CSS-in-JS) with 200+ rules\ncovering formatting, patterns, and browser quirks.\n\
  \n## When to Use\n\n- Enforcing consistent CSS/SCSS style across a project\n- Catching invalid property\
  \ values or unknown at-rules\n- Ordering properties and declarations consistently\n\n## Real Commands\n\
  \n```bash\n# Install with standard config\nnpm install --save-dev stylelint stylelint-config-standard\n\
  \n# Check all CSS\nnpx stylelint \"src/**/*.css\"\n\n# Auto-fix\nnpx stylelint --fix \"src/**/*.{css,scss}\"\
  \n\n# Custom config\nnpx stylelint --config .stylelintrc.json .\n\n# Lint stdin (editor integration)\n\
  echo '.a { color: red }' | npx stylelint --stdin-filename app.css\n\n# Custom formatter for CI\nnpx\
  \ stylelint \"src/**/*.css\" --custom-formatter=node_modules/stylelint-json-formatter\n```\n\n## Config\
  \ (.stylelintrc.json)\n\n```json\n{\n  \"extends\": \"stylelint-config-standard\",\n  \"customSyntax\"\
  : \"postcss-scss\",\n  \"rules\": {\n    \"color-hex-length\": \"long\",\n    \"max-nesting-depth\"\
  : 3\n  }\n}\n```\n\n## CI\n\n```yaml\n- name: Stylelint\n  run: npx stylelint \"src/**/*.css\"\n```\n\
  \n## Best Practices\n\n- Extend `stylelint-config-standard` and only override what you disagree with\n\
  - Use `postcss-scss` customSyntax for SCSS files\n- Enable the property-order config for team consistency\n\
  - Run `--fix` locally, plain check in CI\n\n## Example Response\n\nReports violations as `file:line:col\
  \ severity message rule-name`, then applies\n--fix and confirms the remaining list.\n\n## Capabilities\n\
  \n### stylelint-css\nCheck and fix CSS/SCSS with Stylelint and its standard configs\n\n**Commands:**\n\
  - `npx stylelint \"src/**/*.css\"`\n- `npx stylelint --fix \"src/**/*.{css,scss}\"`\n- `npx stylelint\
  \ --config .stylelintrc.json .`\n- `npx stylelint --custom-formatter=node_modules/stylelint-json-formatter\
  \ .`\n- `npx stylelint \"src/**/*.css\" --stdin-filename app.css --stdin`\n\n**Examples:**\n- npx stylelint\
  \ --ignore-path .gitignore \"**/*.css\"\n- npx stylelint --fix src/styles/\n- echo '.a {color:red}'\
  \ | npx stylelint --stdin-filename app.css"
prompt: Act as stylelint and handle the task per the instructions.
