title: Swift
description: 'Develops iOS and Swift apps: SwiftPM packages, SwiftLint gates, swift-format, and xcodebuild
  CI builds.'
version: 2.0.0
instructions: "# Swift\n\nDevelops iOS and Swift apps: SwiftPM packages, SwiftLint gates, swift-format,\
  \ and xcodebuild CI builds.\n\n## Instructions\n\n# Swift\n\nBuild iOS and Swift packages with SwiftPM\
  \ and xcodebuild.\n\n## When to Use\n\n- iOS/macOS application development\n- Reusable Swift libraries\
  \ via SwiftPM\n- CI builds, tests, and archives\n\n## SwiftPM\n\n```bash\nswift package init --type\
  \ executable\nswift build\nswift test --filter 'LoginTests'\n```\n\n## SwiftLint\n\n```swift\n// .swiftlint.yml\n\
  disabled_rules:\n  - trailing_whitespace\nopt_in_rules:\n  - empty_count\n  - force_unwrapping\n```\n\
  \n```bash\nswiftlint lint --strict\nswiftlint --fix\n```\n\nUse `--strict` in CI to treat warnings as\
  \ errors.\n\n## swift-format\n\n```bash\nswift-format lint --strict --recursive Sources/\nswift-format\
  \ format --in-place --recursive Sources/\n```\n\n## xcodebuild in CI\n\n```bash\nxcodebuild -scheme\
  \ MyApp -destination 'platform=iOS Simulator,name=iPhone 15' test\nxcodebuild -scheme MyApp -archivePath\
  \ build/MyApp.xcarchive archive\n```\n\nExport the archive with an options plist for signing in CI.\n\
  \n## Best practices\n\n- Commit Package.resolved for reproducible builds.\n- Gate on swiftlint --strict\
  \ and swift-format lint.\n- Parallelize tests with --parallel on fast machines.\n- Use Xcode cloud or\
  \ runner pools with simulator caching.\n\n## Testing\n\n```bash\nswift test --parallel\nswiftlint lint\
  \ --strict\n```\n\nRun unit tests and lint in CI on every PR.\n\n## Capabilities\n\n### swiftpm\nCreate\
  \ and manage Swift packages.\n\n**Commands:**\n- `swift package init --type executable`\n- `swift build`\n\
  - `swift test --filter 'LoginTests'`\n- `swift run my-tool --help`\n- `swift package resolve`\n\n**Examples:**\n\
  - swift package init --type library\n- swift test --parallel\n- swift run my-tool config.json\n\n###\
  \ xcodebuild\nBuild and test iOS apps in CI.\n\n**Commands:**\n- `xcodebuild -scheme MyApp -destination\
  \ 'platform=iOS Simulator,name=iPhone 15' build`\n- `xcodebuild test -scheme MyApp -destination 'platform=iOS\
  \ Simulator,name=iPhone 15'`\n- `xcodebuild -scheme MyApp -archivePath build/MyApp.xcarchive archive`\n\
  - `xcodebuild -exportArchive -archivePath build/MyApp.xcarchive -exportPath dist -exportOptionsPlist\
  \ ExportOptions.plist`\n- `xcodebuild -list`\n\n**Examples:**\n- xcodebuild -scheme MyApp -destination\
  \ 'platform=iOS Simulator,name=iPhone 15,OS=18.0' test\n- xcodebuild -scheme MyApp archive -archivePath\
  \ build/MyApp.xcarchive\n- xcodebuild -project MyApp.xcodeproj -scheme MyApp -showBuildSettings | grep\
  \ PRODUCT_BUNDLE_IDENTIFIER"
prompt: Act as Swift and handle the task per the instructions.
