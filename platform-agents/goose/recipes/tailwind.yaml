title: Tailwind
description: 'Configures and builds utility-first CSS with Tailwind: content scanning, custom themes,
  and production optimization.'
version: 2.0.0
instructions: "# Tailwind\n\nConfigures and builds utility-first CSS with Tailwind: content scanning,\
  \ custom themes, and production optimization.\n\n## Instructions\n\n# Tailwind CSS\n\nShip utility-first\
  \ CSS with Tailwind CLI pipelines.\n\n## When to Use\n\n- Rapid UI iteration with utility classes\n\
  - Consistent design tokens across large teams\n- Small CSS payloads with only used classes compiled\n\
  \n## Install and configure\n\n```bash\nnpm install -D tailwindcss @tailwindcss/cli\nnpx @tailwindcss/cli\
  \ init -p\n```\n\n## Input CSS\n\n```css\n@import \"tailwindcss\";\n@theme {\n  --color-brand: #4f46e5;\n\
  \  --font-display: \"Sora\", sans-serif;\n}\n```\n\n## Build and watch\n\n```bash\nnpx @tailwindcss/cli\
  \ -i src/input.css -o dist/output.css\nnpx @tailwindcss/cli -i src/input.css -o dist/output.css --watch\n\
  npx @tailwindcss/cli -i src/input.css -o dist/output.css --minify\n```\n\n## Content scanning\n\nTailwind\
  \ v4 auto-detects sources; with a config file, keep content globs tight:\n\n```js\n/** @type {import('tailwindcss').Config}\
  \ */\nexport default {\n  content: ['./src/**/*.{html,js,svelte,tsx}'],\n  theme: { extend: { colors:\
  \ { brand: '#4f46e5' } } }\n};\n```\n\n## Custom utilities\n\n```css\n@utility glass {\n  backdrop-filter:\
  \ blur(8px);\n  background: rgb(255 255 255 / 0.8);\n}\n```\n\n## Best practices\n\n- Keep design tokens\
  \ in `@theme`, not scattered hex values.\n- Extract repeated markup into components, not custom classes.\n\
  - Verify output size: minified CSS should grow only with usage.\n- Prefer responsive prefixes over media\
  \ query duplication.\n\n## Testing\n\n```bash\nnpx @tailwindcss/cli -i src/input.css -o dist/output.css\
  \ --minify\nls -la dist/output.css\n```\n\nWatch for unexpected bloat after adding libraries.\n\n##\
  \ Capabilities\n\n### setup\nInstall and configure Tailwind CSS.\n\n**Commands:**\n- `npm install -D\
  \ tailwindcss @tailwindcss/cli`\n- `npx @tailwindcss/cli init -p`\n- `npx @tailwindcss/cli init --ts`\n\
  - `npm install -D @tailwindcss/vite`\n- `npm install -D @tailwindcss/typography`\n\n**Examples:**\n\
  - npm install -D tailwindcss @tailwindcss/vite\n- npx @tailwindcss/cli init --ts\n- npm install -D @tailwindcss/forms\
  \ @tailwindcss/typography\n\n### build\nCompile Tailwind CSS for development and production.\n\n**Commands:**\n\
  - `npx @tailwindcss/cli -i src/input.css -o dist/output.css`\n- `npx @tailwindcss/cli -i src/input.css\
  \ -o dist/output.css --minify`\n- `npx @tailwindcss/cli -i src/input.css -o dist/output.css --watch`\n\
  - `npx @tailwindcss/cli -i src/input.css -o dist/output.css --minify --watch`\n- `npx tailwindcss -c\
  \ tailwind.config.js -i src/input.css -o dist/output.css`\n\n**Examples:**\n- npx @tailwindcss/cli -i\
  \ src/input.css -o dist/output.css --minify\n- npx @tailwindcss/cli -i src/input.css -o dist/output.css\
  \ --watch\n- npx tailwindcss -c tailwind.config.js -i src/input.css -o dist/output.css --minify"
prompt: Act as Tailwind and handle the task per the instructions.
