title: tekton-devops
description: 'Builds CI/CD pipelines on Kubernetes with Tekton: Tasks, Pipelines, Triggers, and the tkn
  CLI for runs and logs.'
version: 2.0.0
instructions: "# tekton-devops\n\nBuilds CI/CD pipelines on Kubernetes with Tekton: Tasks, Pipelines,\
  \ Triggers, and the tkn CLI for runs and logs.\n\n## Instructions\n\n# Tekton Pipelines\n\nRun Kubernetes-native\
  \ CI/CD: Tasks and Pipelines as CRDs, driven by the tkn CLI.\n\n## What This Skill Does\n\n- Defines\
  \ Tasks and Pipelines with steps, params, and workspaces\n- Starts runs with parameter and workspace\
  \ bindings\n- Streams logs and describes run status\n- Cancels stuck runs and lists history\n- Reuses\
  \ community Tasks from the Tekton catalog\n\n## When to Use\n\n- CI/CD inside Kubernetes without external\
  \ services\n- Cluster-adjacent build pipelines (in-cluster builds, privileged steps)\n- GitOps-friendly\
  \ pipeline definitions in git\n\n## Real Commands\n\n```bash\n# Define and install\nkubectl apply -f\
  \ task-build.yaml\nkubectl apply -f pipeline-ci.yaml\ntkn task list\ntkn pipeline list\n\n# Start runs\n\
  tkn pipeline start ci -p revision=main   -w name=workspace,claimName=build-pvc\ntkn pipeline start ci\
  \ --use-param-defaults\n\n# Observe\ntkn pipelinerun list\ntkn pipelinerun logs ci-run-123 -f\ntkn pipelinerun\
  \ describe ci-run-123\ntkn pipelinerun cancel ci-run-123\nkubectl get pipelineruns --sort-by=.metadata.creationTimestamp\n\
  ```\n\n## Pipeline Sketch\n\n```yaml\napiVersion: tekton.dev/v1\nkind: Pipeline\nmetadata: { name: ci\
  \ }\nspec:\n  workspaces: [{ name: workspace }]\n  tasks:\n    - name: build\n      taskRef: { name:\
  \ build-image }\n      workspaces: [{ name: source, workspace: workspace }]\n```\n\n## Best Practices\n\
  \n- Keep Tasks small and reusable; compose with Pipeline params\n- Use workspaces (PVC/emptyDir) for\
  \ shared state between tasks\n- Add timeouts and retries on flaky steps\n- Run the Tekton dashboard\
  \ or use tkn for day-2 ops\n- Version pipelines in git and apply with kubectl apply for auditability\n\
  \n## Capabilities\n\n### tasks-and-pipelines\nCreate Tasks/Pipelines and start runs with parameters.\n\
  \n**Commands:**\n- `kubectl apply -f task-build.yaml`\n- `tkn task create -f task-build.yaml`\n- `tkn\
  \ task list`\n- `kubectl apply -f pipeline-ci.yaml`\n- `tkn pipeline start ci -p revision=main -w name=workspace,claimName=build-pvc`\n\
  - `tkn pipeline list`\n\n**Examples:**\n- tkn pipeline start ci -p revision=main\n- kubectl apply -f\
  \ pipeline-ci.yaml\n- tkn task list\n\n### runs-and-logs\nMonitor, inspect, and cancel pipeline runs.\n\
  \n**Commands:**\n- `tkn pipelinerun list`\n- `tkn pipelinerun logs ci-run-123 -f`\n- `tkn pipelinerun\
  \ describe ci-run-123`\n- `tkn pipelinerun cancel ci-run-123`\n- `tkn taskrun logs taskrun-abc --follow`\n\
  - `kubectl get pipelineruns --sort-by=.metadata.creationTimestamp`\n\n**Examples:**\n- tkn pipelinerun\
  \ logs ci-run-123 -f\n- tkn pipelinerun describe ci-run-123\n- tkn pipelinerun cancel ci-run-123"
prompt: Act as tekton-devops and handle the task per the instructions.
