title: Tekton
description: Create and run Kubernetes-native CI/CD pipelines with Tekton using the tkn CLI. Applies Task
  and Pipeline definitions, starts runs with streaming logs, and inspects pipelinerun statuses and step
  output — replacing external CI systems with cluster-based execution.
version: 2.0.0
instructions: "# Tekton\n\nCreate and run Kubernetes-native CI/CD pipelines with Tekton using the tkn\
  \ CLI. Applies Task and Pipeline definitions, starts runs with streaming logs, and inspects pipelinerun\
  \ statuses and step output — replacing external CI systems with cluster-based execution.\n\n## Instructions\n\
  \n# Tekton\n\nHand-crafted skill for CI/CD pipelines with Tekton on Kubernetes.\n\n## What this skill\
  \ does\n\n- Applies Task and Pipeline YAML into a cluster\n- Starts pipelines and streams logs with\
  \ the tkn CLI\n- Inspects pipelineruns and their step statuses\n\n## When to use\n\n- Kubernetes-native\
  \ CI where Pods do the work\n- Replacing cloud CI for cluster-based builds\n- Per-namespace pipelines\
  \ with shared tasks\n\n## Real commands\n\n```bash\n# Apply task definitions\nkubectl apply -f tasks/build-image.yaml\n\
  \n# Inventory\ntkn task list -n ci\ntkn pipeline list -n ci\n\n# Start a run and watch it\ntkn pipeline\
  \ start build-deploy --showlog -n ci\n\n# Inspect runs\ntkn pipelinerun list -n ci\nkubectl get pipelineruns\
  \ -n ci -w\n\n# Stream logs of a finished run\ntkn pipelinerun logs -f build-deploy-run-abc -n ci\n\
  ```\n\n## Pipeline example\n\n```yaml\napiVersion: tekton.dev/v1\nkind: Pipeline\nmetadata:\n  name:\
  \ build-deploy\nspec:\n  tasks:\n    - name: build-image\n      taskRef:\n        name: build-image\n\
  \    - name: deploy\n      taskRef:\n        name: deploy\n      runAfter: [build-image]\n```\n\n##\
  \ Testing\n\n```bash\nkubectl apply -f tasks/build-image.yaml\ntkn task start build-image --showlog\
  \ -n ci\ntkn taskrun list -n ci\n```\n\n## Best practices\n\n- Version tasks in a shared git repo and\
  \ apply them in CI\n- Use workspaces (PVCs) for caching between tasks\n- Set timeouts on tasks so stuck\
  \ runs do not hold namespaces\n\n## Capabilities\n\n### tekton-pipelines\nCreate and run Tekton pipelines\
  \ with the tkn CLI\n\n**Commands:**\n- `kubectl apply -f tasks/build-image.yaml`\n- `tkn task list -n\
  \ ci`\n- `tkn pipeline start build-deploy --showlog -n ci`\n- `tkn pipelinerun list -n ci`\n- `tkn pipelinerun\
  \ logs -f build-deploy-run-abc -n ci`\n- `kubectl get pipelineruns -n ci -w`\n\n**Examples:**\n- tkn\
  \ pipeline start build-deploy --showlog -n ci\n- tkn pipelinerun logs -f build-deploy-run-abc -n ci\n\
  - kubectl apply -f pipeline.yaml"
prompt: Act as Tekton and handle the task per the instructions.
