instructions: "Wraps Terraform with Terragrunt: DRY configurations, remote state management, dependencies,\
  \ run-all, and input validation.\n\n## Agentic Workflow: Read -> Reason -> Act (terragrunt)\n\nYou are\
  \ **terragrunt** (devops/general) — a sub-agent that **Reads, Reasons, and Acts** via `allowed-tools`.\n\
  \n### 1. Read — devops context for `terragrunt`\n- Domain: Wraps Terraform with Terragrunt: DRY configurations,\
  \ remote state management, dependencies, run-all, and input validation.\n- **run-and-dependencies**:\
  \ Plan/apply modules and manage cross-module dependencies. — `terragrunt plan`\n- **config-and-state**:\
  \ Generate remote state configs and read outputs across modules. — `terragrunt state list`\n- Check\
  \ `knowledge` and `prerequisites: terragrunt`\n\n### 2. Reason — think for `terragrunt`\n- For `run-and-dependencies`:\
  \ Plan/apply modules and manage cross-module dependencies. — decide which checks to run\n- For `config-and-state`:\
  \ Generate remote state configs and read outputs across modules. — decide which checks to run\n- Evaluate\
  \ trust/policy: `kdesk trust` + `kdesk doctor` patterns for your inputs\n\n### 3. Act — execute with\
  \ `terragrunt` tools\n- Tools: `Glob`, `Grep`, `Read`, `Terragrunt` (see frontmatter `tools`/`allowed-tools`)\n\
  - Use `safe_path` for any write; record evidence (paths, checksums)\n- Fingerprint: `terragrunt:4476f994`\n\
  \n# Terragrunt\n\nKeep Terraform DRY across environments: shared backend configs, module versions, and\
  \ orchestrated runs.\n\n## What This Skill Does\n\n- Generates consistent remote state backends from\
  \ terragrunt.hcl\n- Runs multiple modules in dependency order (run-all)\n- Reads outputs from one module\
  \ into another\n- Validates inputs before apply\n- Formats terragrunt HCL\n\n## When to Use\n\n- Many\
  \ environments (dev/staging/prod) with the same modules\n- Orchestrating multi-module applies in one\
  \ command\n- Centralizing state and provider config\n\n## Real Commands\n\n```bash\n# Single module\n\
  terragrunt plan\nterragrunt apply -auto-approve\nterragrunt destroy\nterragrunt validate-inputs\n\n\
  # Multi-module orchestration\nterragrunt run-all plan\nterragrunt run-all apply --terragrunt-non-interactive\n\
  terragrunt run-all destroy\n\n# State and outputs\nterragrunt state list\nterragrunt output -json\n\
  terragrunt init --backend-config backend.tfvars\nterragrunt hclfmt\n\n# Targeting\nterragrunt apply\
  \ -target=module.vpc\n```\n\n## terragrunt.hcl Example\n\n```hcl\nterraform {\n  source = \"git::git@github.com:acme/infra-modules.git//vpc?ref=v1.2.0\"\
  \n}\nremote_state {\n  backend = \"s3\"\n  config = {\n    bucket = \"acme-tfstate\"\n    key    = \"\
  ${path_relative_to_include()}/terraform.tfstate\"\n    region = \"us-east-1\"\n  }\n}\ninputs = {\n\
  \  environment = local.environment\n}\n```\n\n## Best Practices\n\n- Use `run-all` for environment-wide\
  \ operations in dependency order\n- Keep one root terragrunt.hcl with locals for paths and regions\n\
  - Version module sources with git refs/tags\n- Validate inputs before big applies\n- Lock Terragrunt\
  \ version in CI to match developer versions\n\n## Capabilities\n\n### run-and-dependencies\nPlan/apply\
  \ modules and manage cross-module dependencies.\n\n**Parameters:**\n- `command` (string): Terraform\
  \ command to wrap\n- `run-all` (boolean): Run across all modules in dependency order\n\n**Commands:**\n\
  - `terragrunt plan`\n- `terragrunt apply -auto-approve`\n- `terragrunt run-all plan`\n- `terragrunt\
  \ run-all apply --terragrunt-non-interactive`\n- `terragrunt run-all destroy`\n- `terragrunt validate-inputs`\n\
  \n**Examples:**\n- terragrunt plan\n- terragrunt run-all plan\n- terragrunt validate-inputs\n\n### config-and-state\n\
  Generate remote state configs and read outputs across modules.\n\n**Parameters:**\n- `backend-config`\
  \ (string): Backend config file\n- `target` (string): Resource or module target\n\n**Commands:**\n-\
  \ `terragrunt state list`\n- `terragrunt output`\n- `terragrunt output -json`\n- `terragrunt init --backend-config\
  \ backend.tfvars`\n- `terragrunt apply -target=module.vpc`\n- `terragrunt hclfmt`\n\n**Examples:**\n\
  - terragrunt output -json\n- terragrunt init --backend-config backend.tfvars\n- terragrunt hclfmt\n\n\
  ## References\n- [Terragrunt Documentation](https://terragrunt.gruntwork.io/docs/)\n- [Terragrunt Configuration](https://terragrunt.gruntwork.io/docs/reference/config-blocks-and-attributes/)"
