title: test-data-generator
description: Generates realistic fake data for tests and demos with Faker, mock JSON servers, and database
  seed tools.
version: 2.0.0
instructions: "# test-data-generator\n\nGenerates realistic fake data for tests and demos with Faker,\
  \ mock JSON servers, and database seed tools.\n\n## Instructions\n\n# Test Data Generation\n\nCreate\
  \ realistic data for testing, demos, and development.\n\n## What This Skill Does\n\n- Generates fake\
  \ names, profiles, and domain records with Faker\n- Serves and resets mock REST APIs with json-server\n\
  - Seeds databases with realistic volumes via pgbench and SQL\n- Produces locale-aware and schema-shaped\
  \ data\n\n## When to Use\n\n- Building test fixtures for API tests\n- Populating dev/demo environments\n\
  - Load-testing with realistic payloads\n\n## Real Commands\n\n```bash\n# Faker CLI\nfaker name\nfaker\
  \ profile --locale=fr_FR\nfaker -i 500 user_profile > users.jsonl\npython -m faker credit_card_number\
  \ --repeat 5\n\n# Mock API\nnpx json-server --watch db.json --port 3000\ncurl -s http://localhost:3000/users\
  \ | jq '.[0]'\n\n# Database seeding\npgbench -i -s 10 mydb\npgbench -c 10 -j 2 -t 1000 mydb\nsqlite3\
  \ app.db < seed.sql\n```\n\n## Seed Script Pattern\n\n```bash\n# Generate 1000 users into JSON\necho\
  \ '[' > db.json\nfor i in $(seq 1 1000); do\n  faker profile --locale=en_US\n  [ $i -lt 1000 ] && echo\
  \ ','\ndone >> db.json\necho ']' >> db.json\n```\n\n## Best Practices\n\n- Generate data matching production\
  \ schema constraints\n- Use locales matching real users for i18n tests\n- Keep seed scripts idempotent\
  \ (delete before insert)\n- Mask or synthesize data never copied from prod\n- Size seed volumes to match\
  \ load-test targets\n\n## Capabilities\n\n### faker-generation\nGenerate fake records from the command\
  \ line.\n\n**Commands:**\n- `faker name`\n- `faker profile --locale=fr_FR`\n- `faker pystr --min_chars=10\
  \ --max_chars=20`\n- `faker -i 500 user_profile > users.jsonl`\n- `python -m faker address --repeat\
  \ 10`\n\n**Examples:**\n- faker name\n- faker profile --locale=fr_FR\n- python -m faker credit_card_number\
  \ --repeat 5\n\n### mock-json-servers\nServe and reset fake API data for development.\n\n**Commands:**\n\
  - `npx json-server --watch db.json --port 3000`\n- `npx json-server db.json --routes routes.json`\n\
  - `curl -s http://localhost:3000/users`\n- `npx json-server db.json --static ./public`\n\n**Examples:**\n\
  - npx json-server --watch db.json --port 3000\n- curl -s http://localhost:3000/users | jq '.[0]'\n-\
  \ npx json-server db.json --routes routes.json\n\n### database-seeding\nSeed databases with realistic\
  \ volumes.\n\n**Commands:**\n- `pgbench -i -s 10 mydb`\n- `pgbench -c 10 -j 2 -t 1000 mydb`\n- `sqlite3\
  \ app.db < seed.sql`\n- `mysql -u root app < seed.sql`\n\n**Examples:**\n- pgbench -i -s 10 mydb\n-\
  \ pgbench -c 10 -j 2 -t 1000 mydb\n- sqlite3 app.db < seed.sql"
prompt: Act as test-data-generator and handle the task per the instructions.
