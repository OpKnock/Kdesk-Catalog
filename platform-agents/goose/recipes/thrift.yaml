title: Thrift
description: Compile it IDL to client/server code in many languages.
version: 2.0.0
instructions: "# Thrift\n\nCompile it IDL to client/server code in many languages.\n\n## Instructions\n\
  \n# Apache Thrift\n\nHand-crafted skill for cross-language RPC with Apache Thrift.\n\n## What this skill\
  \ does\n\n- Writes .thrift IDL files with structs, enums, and services\n- Generates code for Python,\
  \ Go, Java, Node, and more\n- Runs strict mode to catch ambiguous IDL early\n\n## When to use\n\n- Polyglot\
  \ teams sharing one RPC contract\n- Legacy services already speaking Thrift\n- When protobuf/gRPC tooling\
  \ is not an option\n\n## Real commands\n\n```bash\n# Check the compiler\nthrift --version\n\n# Python\
  \ client/server code\nthrift --gen py shared.thrift\n\n# Go (include included files with -r)\nthrift\
  \ -r --gen go calculator.thrift\n\n# Java into a specific dir\nthrift -r --gen java --out gen/java calculator.thrift\n\
  \n# Node\nthrift -r --gen js:node calculator.thrift\n\n# Strict parsing: unknown fields and sloppy includes\
  \ fail\nthrift --gen py -out gen/ --strict calculator.thrift\n```\n\n## IDL example\n\n```thrift\nnamespace\
  \ py calculator\nnamespace go calculator\n\nenum Operation {\n  ADD = 1,\n  SUBTRACT = 2\n}\n\nstruct\
  \ Work {\n  1: i32 num1,\n  2: i32 num2,\n  3: Operation op\n}\n\nexception InvalidOperation {\n  1:\
  \ i32 code,\n  2: string why\n}\n\nservice Calculator {\n  i32 calculate(1: Work w) throws (1: InvalidOperation\
  \ e),\n  oneway void ping()\n}\n```\n\n## Testing\n\n```bash\nthrift -r --gen py calculator.thrift &&\
  \ ls -R gen-py\nthrift --gen py --strict calculator.thrift\n```\n\n## Best practices\n\n- Keep one .thrift\
  \ per bounded domain, include shared definitions\n- Never renumber fields: wire compatibility depends\
  \ on IDs\n- Generate at build time and pin the thrift compiler version\n\n## Capabilities\n\n### thrift-codegen\n\
  Compile Thrift IDL to client/server code in many languages\n\n**Commands:**\n- `thrift --version`\n\
  - `thrift --gen py shared.thrift`\n- `thrift -r --gen go calculator.thrift`\n- `thrift -r --gen java\
  \ --out gen/java calculator.thrift`\n- `thrift --gen py -out gen/ --strict calculator.thrift`\n\n**Examples:**\n\
  - thrift -r --gen go calculator.thrift\n- thrift --gen py shared.thrift\n- thrift -r --gen js:node calculator.thrift"
prompt: Act as Thrift and handle the task per the instructions.
