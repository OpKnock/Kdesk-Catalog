instructions: "Bound shell commands with GNU it and related tools.\n\n## Agentic Workflow: Read -> Reason\
  \ -> Act (timeout)\n\nYou are **Timeout** (api/general) — a sub-agent that **Reads, Reasons, and Acts**\
  \ via `allowed-tools`.\n\n### 1. Read — api context for `timeout`\n- Domain: Bound shell commands with\
  \ GNU it and related tools.\n- **timeout-guard**: Bound shell commands with GNU timeout and related\
  \ tools — `timeout 30s sleep 60`\n- Check `knowledge` and `prerequisites: python, timeout`\n\n### 2.\
  \ Reason — think for `timeout`\n- For `timeout-guard`: Bound shell commands with GNU timeout and related\
  \ tools — decide which checks to run\n- Evaluate trust/policy: `kdesk trust` + `kdesk doctor` patterns\
  \ for your inputs\n\n### 3. Act — execute with `timeout` tools\n- Tools: `Glob`, `Grep`, `Read`, `Timeout`,\
  \ `Bash` (see frontmatter `tools`/`allowed-tools`)\n- Use `safe_path` for any write; record evidence\
  \ (paths, checksums)\n- Fingerprint: `timeout:7a86a899`\n\n# GNU timeout\n\nHand-crafted skill for bounding\
  \ command execution with coreutils timeout.\n\n## What this skill does\n\n- Kills long-running commands\
  \ after a deadline\n- Sends SIGKILL after a grace period with -k\n- Wraps flaky network commands so\
  \ scripts cannot hang\n\n## When to use\n\n- Cron jobs that occasionally hang\n- CI steps stuck on network\
  \ waits\n- Any script that must finish in a bounded time\n\n## Real commands\n\n```bash\n# Kill after\
  \ 30s; exit status 124 on timeout\ntimeout 30s sleep 60\necho $?\n\n# Grace: TERM, then KILL after 5s\
  \ more\ntimeout -k 5 30s docker pull busybox\n\n# Network probe that cannot hang\ntimeout 10s ping -c\
  \ 20 8.8.8.8\n\n# curl's own bound\ncurl --max-time 10 -s https://example.com\n\n# Python equivalent\n\
  python -c 'import signal; signal.alarm(5); print(\"alarm set\")'\n```\n\n## Exit statuses\n\n- 124:\
  \ the command was killed by the timeout\n- 125: timeout itself failed\n- 126/127: command could not\
  \ be run/found\n\n## Script pattern\n\n```bash\nif timeout 30s ./deploy.sh; then\n  echo \"deploy finished\"\
  \nelse\n  echo \"deploy timed out\"\nfi\n```\n\n## Testing\n\n```bash\ntimeout 2s sleep 10; echo \"\
  exit: $?\"   # expect 124\ntimeout 5s curl -sf https://example.com && echo ok\n```\n\n## Best practices\n\
  \n- Check exit code 124 explicitly to distinguish timeouts from failures\n- Add -k only when the process\
  \ ignores TERM\n- Combine with retry loops: bounded attempts, bounded runtime\n\n## Capabilities\n\n\
  ### timeout-guard\nBound shell commands with GNU timeout and related tools\n\n**Parameters:**\n- `duration`\
  \ (string): Timeout like 30s, 5m, 1h\n- `kill_after` (string): Grace period before SIGKILL with -k\n\
  - `signal` (string): Signal to send on timeout, e.g. -s HUP\n\n**Commands:**\n- `timeout 30s sleep 60`\n\
  - `timeout -k 5 30s docker pull busybox`\n- `timeout 10s ping -c 20 8.8.8.8`\n- `curl --max-time 10\
  \ -s http://localhost:8080`\n- `python -c 'import signal; signal.alarm(5); print(\"alarm set\")'`\n\n\
  **Examples:**\n- timeout 30s sleep 60; echo $?\n- timeout -k 5 30s docker pull busybox\n- timeout 10s\
  \ ping -c 20 8.8.8.8\n\n## References\n- [GNU timeout manual](https://www.gnu.org/software/coreutils/manual/html_node/timeout-invocation.html)\n\
  - [curl --max-time](https://curl.se/docs/manpage.html#--max-time)"
