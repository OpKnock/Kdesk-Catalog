title: Tooling
description: 'Standardizes everyday infra developer tooling: jq/yq data processing, Docker Compose workflows,
  and task runners.'
version: 2.0.0
instructions: "# Tooling\n\nStandardizes everyday infra developer tooling: jq/yq data processing, Docker\
  \ Compose workflows, and task runners.\n\n## Instructions\n\n# Infrastructure Tooling\n\nStandardize\
  \ local and CI tooling across the org.\n\n## When to Use\n\n- Parsing API responses or configs in scripts\n\
  - Booting full local stacks with one command\n- CI pipelines that inspect manifests\n\n## jq for JSON\n\
  \n```bash\njq -r '.items[] | select(.status==\"running\") | .id' instances.json\ncurl -s https://api.github.com/repos/opencode/opencode\
  \ | jq '.stargazers_count'\n```\n\nUse `-r` for raw strings, `@csv`/`@tsv` for tables.\n\n## yq for\
  \ YAML\n\n```bash\nyq eval '.services.web.image' docker-compose.yml\nyq eval '.services | keys' docker-compose.yml\n\
  ```\n\nGreat for pulling values out of k8s manifests and compose files.\n\n## Compose development loop\n\
  \n```bash\ndocker compose up -d --build\ndocker compose ps\ndocker compose logs -f web\ndocker compose\
  \ down -v\n```\n\n## Task runner pattern\n\nUse `make` or `task` to encode common commands:\n\n```makefile\n\
  up:\n\tdocker compose up -d\nlint:\n\tnpx eslint . --max-warnings 0\ntest:\n\tnpx vitest run\n```\n\n\
  ```bash\nmake up make lint\n```\n\n## Best practices\n\n- Pin tool versions via mise/asdf in a shared\
  \ .tool-versions.\n- Keep compose files env-driven with .env.example committed.\n- Prefer `docker compose\
  \ run --rm` for one-off jobs.\n- Add a CI job that runs every script from the Makefile.\n\n## Testing\n\
  \n```bash\njq empty file.json && echo valid\ncurl -s <api> | jq -e 'has(\"data\")'\n```\n\nValidate\
  \ JSON/YAML in CI before scripts consume them.\n\n## Capabilities\n\n### data-tools\nProcess JSON and\
  \ YAML with jq and yq.\n\n**Commands:**\n- `jq '.name, .version' package.json`\n- `jq -r '.items[] |\
  \ select(.status==\"running\") | .id' instances.json`\n- `yq eval '.services.web.image' docker-compose.yml`\n\
  - `yq eval '.services | keys' docker-compose.yml`\n- `jq '.[] | {id, name} | @csv' data.json`\n\n**Examples:**\n\
  - jq -r '.[] | .name' package-lock.json | sort -u | head\n- yq eval '.services.redis.ports' docker-compose.yml\n\
  - curl -s https://api.github.com/repos/opencode/opencode | jq '.stargazers_count'\n\n### compose\nManage\
  \ local dev environments with Docker Compose.\n\n**Commands:**\n- `docker compose up -d`\n- `docker\
  \ compose ps`\n- `docker compose logs -f web`\n- `docker compose exec web sh`\n- `docker compose down\
  \ -v`\n\n**Examples:**\n- docker compose up -d --build\n- docker compose logs --tail=50 api\n- docker\
  \ compose run --rm migrate"
prompt: Act as Tooling and handle the task per the instructions.
