title: Truffle
description: Develops, compiles, tests, and deploys Ethereum smart contracts with the Truffle suite.
version: 2.0.0
instructions: "# Truffle\n\nDevelops, compiles, tests, and deploys Ethereum smart contracts with the Truffle\
  \ suite.\n\n## Instructions\n\n# Truffle\n\nDevelopment environment, testing framework, and asset pipeline\
  \ for Ethereum\ncontracts.\n\n## When to Use\n\n- Scaffolding a Solidity project with migrations\n-\
  \ Running contract tests against Ganache\n- Deploying to test networks and mainnet\n\n## Real Commands\n\
  \n```bash\n# Scaffold a project\ntruffle init\n\n# Compile contracts\nsudo truffle compile\n\n# Run\
  \ tests\nsudo truffle test\nsudo truffle test ./test/Token.test.js\n\n# Start the built-in dev network\
  \ and console\nsudo truffle develop\n\n# Migrate (deploy) to a configured network\nsudo truffle migrate\
  \ --network development --reset\n\n# Deploy a specific migration\nsudo truffle migrate --f 2 --to 2\
  \ --network development\n\n# Interactive console on a network\nsudo truffle console --network mainnet\n\
  \n# Run a script with Truffle artifacts\nsudo truffle exec scripts/seed.js\n```\n\n## Example Test (test/Token.test.js)\n\
  \n```js\nconst Token = artifacts.require('Token');\n\ncontract('Token', (accounts) => {\n  it('mints\
  \ to owner', async () => {\n    const t = await Token.deployed();\n    await t.mint(accounts[1], 1000);\n\
  \    assert.equal((await t.balanceOf(accounts[1])).toString(), '1000');\n  });\n});\n```\n\n## Best\
  \ Practices\n\n- Use `--reset` only on disposable networks\n- Keep migrations idempotent; re-runs must\
  \ not double-deploy\n- Test with `truffle develop`, deploy with a network that matches your target\n\
  - Verify contracts on Etherscan after deployment\n\n## Example Response\n\nShows compile warnings, test\
  \ pass/fail summary with gas usage, and migration\naddresses with transaction hashes.\n\n## Capabilities\n\
  \n### truffle-workflow\nCompile, test, migrate, and interact with contracts via Truffle\n\n**Commands:**\n\
  - `truffle init`\n- `truffle compile`\n- `truffle test ./test/Token.test.js`\n- `truffle migrate --network\
  \ development --reset`\n- `truffle console --network mainnet`\n\n**Examples:**\n- truffle develop\n\
  - truffle migrate --network rinkeby --verbose-rpc\n- truffle exec scripts/seed.js"
prompt: Act as Truffle and handle the task per the instructions.
