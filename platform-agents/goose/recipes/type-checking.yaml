title: type-checking
description: 'Static type checking with TypeScript: strictness, incremental builds, and monorepo project
  references.'
version: 2.0.0
instructions: "# type-checking\n\nStatic type checking with TypeScript: strictness, incremental builds,\
  \ and monorepo project references.\n\n## Instructions\n\n# Type Checking\n\nRuns the TypeScript compiler\
  \ in no-emit mode to validate types across the project,\nwith strictness tuned per codebase.\n\n## When\
  \ to Use\n\n- Pre-merge type gate in CI\n- Verifying a refactor didn't break type contracts\n- Onboarding\
  \ strict mode incrementally\n\n## Real Commands\n\n```bash\n# Basic check\nnpx tsc --noEmit\n\n# Strict\
  \ + unused checks\nnpx tsc --noEmit --strict --noUnusedLocals --noUnusedParameters\n\n# Fast re-checks\
  \ with incremental cache\nnpx tsc --noEmit --incremental --tsBuildInfoFile node_modules/.cache/tsbuildinfo\n\
  \n# CI-friendly output\nnpx tsc -p tsconfig.json --pretty false\n\n# Vue SFC projects\nnpx vue-tsc --noEmit\n\
  \n# Monorepo with project references\nnpx tsc --build\n```\n\n## CI\n\n```yaml\n- name: Type check\n\
  \  run: npx tsc --noEmit --pretty false\n```\n\n## Strict-mode rollout\n\n```json\n{\n  \"compilerOptions\"\
  : {\n    \"strict\": true,\n    \"noImplicitAny\": true,\n    \"strictNullChecks\": true\n  }\n}\n```\n\
  \n## Best Practices\n\n- Enforce `strict` in new projects; migrate old ones package by package\n- Use\
  \ `--incremental` locally, disable or persist cache in CI\n- Add `skipLibCheck: true` to avoid slow\
  \ .d.ts checking\n- Fail CI on any error: `tsc --noEmit --pretty false` exit code is 1 on errors\n\n\
  ## Example Response\n\nReports each error as `path(file):line:col - TSxxxx: message`, grouped by file,\n\
  plus the total error count and suggestions for fixing each category.\n\n## Capabilities\n\n### tsc-checking\n\
  Type-check TypeScript projects with configurable strictness and outputs\n\n**Commands:**\n- `tsc --noEmit`\n\
  - `tsc -p tsconfig.json --pretty false`\n- `tsc --noEmit --strict --noUnusedLocals`\n- `tsc --noEmit\
  \ --incremental --tsBuildInfoFile .cache/tsconfig.tsbuildinfo`\n- `tsc --noEmit --project tsconfig.build.json`\n\
  \n**Examples:**\n- npx vue-tsc --noEmit\n- tsc --noEmit --composite false\n- tsc --build --force"
prompt: Act as type-checking and handle the task per the instructions.
