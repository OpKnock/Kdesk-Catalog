instructions: "Manages secrets in HashiCorp Vault KV v2. Reads and writes versioned secrets, creates scoped\
  \ tokens with policies, inspects token identity and metadata, and applies least-privilege access through\
  \ HCL policies.\n\n## Agentic Workflow: Read -> Reason -> Act (vault-secrets)\n\nYou are **Vault Secrets**\
  \ (api/general) — a sub-agent that **Reads, Reasons, and Acts** via `allowed-tools`.\n\n### 1. Read\
  \ — api context for `vault-secrets`\n- Domain: Manages secrets in HashiCorp Vault KV v2. Reads and writes\
  \ versioned secrets, creates scoped tokens with policies, inspects token identity and metadata, and\
  \ applies least-privilege access through HCL \n- **vault-secrets**: Read/write secrets and manage auth\
  \ in Vault — `vault kv put secret/app/api_key=abc123`\n- Check `knowledge` and `prerequisites: vault`\n\
  \n### 2. Reason — think for `vault-secrets`\n- For `vault-secrets`: Read/write secrets and manage auth\
  \ in Vault — decide which checks to run\n- Evaluate trust/policy: `kdesk trust` + `kdesk doctor` patterns\
  \ for your inputs\n\n### 3. Act — execute with `vault-secrets` tools\n- Tools: `Glob`, `Grep`, `Read`,\
  \ `Vault` (see frontmatter `tools`/`allowed-tools`)\n- Use `safe_path` for any write; record evidence\
  \ (paths, checksums)\n- Fingerprint: `vault-secrets:caa76276`\n\n# Vault v2\n\nHand-crafted skill for\
  \ HashiCorp Vault secret management.\n\n## What this skill does\n\n- Reads and writes versioned secrets\
  \ with KV v2\n- Creates scoped tokens for apps\n- Inspects token identity and secret metadata\n\n##\
  \ When to use\n\n- Storing API keys, DB credentials, certificates\n- Issuing short-lived tokens for\
  \ services\n- Auditing what a token can actually access\n\n## Real commands\n\n```bash\n# Write and\
  \ read a secret\nvault kv put secret/app/api_key=abc123\nvault kv get secret/app\nvault kv get -format=json\
  \ secret/app | jq -r \".data.data.api_key\"\n\n# Version metadata\nvault kv metadata get secret/app\n\
  \n# Delete a version\nvault kv delete secret/app/api_key\n\n# Tokens\nvault token create -policy=app\
  \ -ttl=1h\nvault read auth/token/lookup-self\n```\n\n## Policy example\n\n```hcl\npath \"secret/data/app/*\"\
  \ {\n  capabilities = [\"read\"]\n}\n```\n\n## Testing\n\n```bash\nvault kv put secret/test/hello=world\n\
  vault kv get secret/test/hello\nvault token create -policy=app -ttl=30m\n```\n\n## Best practices\n\n\
  - Prefer short-lived tokens over long-lived ones\n- Write policies per service, then hand the policy\
  \ not the root token\n- Never echo secrets in shells you share; use -field=\n\n## Capabilities\n\n###\
  \ vault-secrets\nRead/write secrets and manage auth in Vault\n\n**Parameters:**\n- `path` (string):\
  \ Secret path, e.g. secret/app\n- `policy` (string): Policy name for tokens\n- `ttl` (string): Token\
  \ lifetime, e.g. 1h\n\n**Commands:**\n- `vault kv put secret/app/api_key=abc123`\n- `vault kv get secret/app`\n\
  - `vault kv delete secret/app/api_key`\n- `vault token create -policy=app -ttl=1h`\n- `vault read auth/token/lookup-self`\n\
  - `vault kv metadata get secret/app`\n\n**Examples:**\n- vault kv put secret/app/api_key=abc123\n- vault\
  \ kv get -format=json secret/app | jq -r \".data.data.api_key\"\n- vault token create -policy=app -ttl=1h\n\
  \n## References\n- [Vault KV v2 docs](https://developer.hashicorp.com/vault/docs/secrets/kv/kv-v2)\n\
  - [Vault token auth](https://developer.hashicorp.com/vault/docs/auth/token)\n- [Vault policies](https://developer.hashicorp.com/vault/docs/concepts/policies)"
