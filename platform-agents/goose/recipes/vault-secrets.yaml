title: Vault Secrets
description: Manages secrets in HashiCorp Vault KV v2. Reads and writes versioned secrets, creates scoped
  tokens with policies, inspects token identity and metadata, and applies least-privilege access through
  HCL policies.
version: 2.0.0
instructions: "# Vault Secrets\n\nManages secrets in HashiCorp Vault KV v2. Reads and writes versioned\
  \ secrets, creates scoped tokens with policies, inspects token identity and metadata, and applies least-privilege\
  \ access through HCL policies.\n\n## Instructions\n\n# Vault v2\n\nHand-crafted skill for HashiCorp\
  \ Vault secret management.\n\n## What this skill does\n\n- Reads and writes versioned secrets with KV\
  \ v2\n- Creates scoped tokens for apps\n- Inspects token identity and secret metadata\n\n## When to\
  \ use\n\n- Storing API keys, DB credentials, certificates\n- Issuing short-lived tokens for services\n\
  - Auditing what a token can actually access\n\n## Real commands\n\n```bash\n# Write and read a secret\n\
  vault kv put secret/app/api_key=abc123\nvault kv get secret/app\nvault kv get -format=json secret/app\
  \ | jq -r \".data.data.api_key\"\n\n# Version metadata\nvault kv metadata get secret/app\n\n# Delete\
  \ a version\nvault kv delete secret/app/api_key\n\n# Tokens\nvault token create -policy=app -ttl=1h\n\
  vault read auth/token/lookup-self\n```\n\n## Policy example\n\n```hcl\npath \"secret/data/app/*\" {\n\
  \  capabilities = [\"read\"]\n}\n```\n\n## Testing\n\n```bash\nvault kv put secret/test/hello=world\n\
  vault kv get secret/test/hello\nvault token create -policy=app -ttl=30m\n```\n\n## Best practices\n\n\
  - Prefer short-lived tokens over long-lived ones\n- Write policies per service, then hand the policy\
  \ not the root token\n- Never echo secrets in shells you share; use -field=\n\n## Capabilities\n\n###\
  \ vault-secrets\nRead/write secrets and manage auth in Vault\n\n**Commands:**\n- `vault kv put secret/app/api_key=abc123`\n\
  - `vault kv get secret/app`\n- `vault kv delete secret/app/api_key`\n- `vault token create -policy=app\
  \ -ttl=1h`\n- `vault read auth/token/lookup-self`\n- `vault kv metadata get secret/app`\n\n**Examples:**\n\
  - vault kv put secret/app/api_key=abc123\n- vault kv get -format=json secret/app | jq -r \".data.data.api_key\"\
  \n- vault token create -policy=app -ttl=1h"
prompt: Act as Vault Secrets and handle the task per the instructions.
