  - For `deploy-vercel`: Deploy projects and manage edge functions — decide which checks to run\n- Evaluate\
  \ trust/policy: `kdesk trust` + `kdesk doctor` patterns for your inputs\n\n### 3. Act — execute with\
  \ `vercel-edge` tools\n- Tools: `Glob`, `Grep`, `Read`, `Vercel` (see frontmatter `tools`/`allowed-tools`)\n\
  - Use `safe_path` for any write; record evidence (paths, checksums)\n- Fingerprint: `vercel-edge:f8ccef42`\n\
  \n# Vercel Edge\n\n## What this skill does\n\nManage Vercel deployments for APIs and edge functions\
  \ using the Vercel CLI. Covers authentication, local development with `vercel dev`, environment variables,\
  \ preview vs production deploys, and rollbacks.\n\n## When to use\n\n- Deploying a Next.js API or standalone\
  \ edge function\n- Managing per-environment secrets\n- Debugging preview vs production differences\n\
  \n## Real commands\n\n```bash\n# Authenticate and link project\nvercel login\nvercel link\n\n# Local\
  \ development with functions and env\nvercel dev\n\n# Preview deployment (default)\nvercel deploy\n\n\
  # Production deployment\nvercel deploy --prod\n\n# Deploy without rebuild (CI scenario)\nvercel deploy\
  \ --prebuilt --prod\n\n# Environment variables\nvercel env add DATABASE_URL production\nvercel env pull\n\
  \n# List deployments and rollback\nvercel ls\nvercel rollback <deployment-url>\n```\n\n## Edge function\
  \ example (api/hello.ts)\n\n```ts\nexport const config = { runtime: 'edge' };\nexport default function\
  \ handler(req: Request) {\n  return new Response(JSON.stringify({ hello: 'edge' }), {\n    headers:\
  \ { 'content-type': 'application/json' },\n  });\n}\n```\n\n## Best practices\n\n- Always test with\
  \ `vercel dev` before deploying\n- Scope env vars per environment (development/preview/production)\n\
  - Use `--prebuilt` in CI to keep builds reproducible\n- Roll back immediately if production errors spike\
  \ after deploy\n\n## Testing\n\n```bash\nvercel dev &\ncurl http://localhost:3000/api/hello\n```\n\n\
  ## Capabilities\n\n### deploy-vercel\nDeploy projects and manage edge functions\n\n**Parameters:**\n\
  - `prod` (boolean): Deploy to production instead of preview\n- `prebuilt` (boolean): Deploy prebuilt\
  \ output, skipping the build step\n- `yes` (boolean): Skip confirmation prompts\n\n**Commands:**\n-\
  \ `vercel login`\n- `vercel dev`\n- `vercel deploy --prod`\n- `vercel env add DATABASE_URL production`\n\
  - `vercel ls`\n\n**Examples:**\n- vercel deploy --prebuilt\n- vercel env pull\n- vercel rollback\n\n\
  ## References\n- [Vercel Docs](https://vercel.com/docs)\n- [Edge Functions Docs](https://vercel.com/docs/functions/edge-functions)\n\
  - [Vercel CLI reference](https://vercel.com/docs/cli)"
