title: Vertx
description: Builds reactive APIs with Eclipse Vert.x on the JVM. Scaffolds Maven projects via the official
  archetype, runs verticles with hot reload, packages executable fat jars, and verifies endpoints with
  curl.
version: 2.0.0
instructions: "# Vertx\n\nBuilds reactive APIs with Eclipse Vert.x on the JVM. Scaffolds Maven projects\
  \ via the official archetype, runs verticles with hot reload, packages executable fat jars, and verifies\
  \ endpoints with curl.\n\n## Instructions\n\n# Vert.x\n\n## What this skill does\n\nBuild reactive,\
  \ event-loop-driven APIs with Eclipse Vert.x on the JVM. Covers scaffolding via the official Maven archetype,\
  \ development mode with hot redeploy, packaging executable fat jars, and verifying endpoints.\n\n##\
  \ When to use\n\n- Building high-throughput async APIs in Java/Kotlin\n- Prototyping with Vert.x Web\
  \ Router\n- Packaging services for deployment\n\n## Real commands\n\n```bash\n# Scaffold a new project\n\
  mvn archetype:generate \\\n  -DarchetypeGroupId=io.vertx \\\n  -DarchetypeArtifactId=vertx-maven-archetype\
  \ \\\n  -DarchetypeVersion=4.5.10\n\n# Development mode with hot reload\nmvn compile vertx:run\n\n#\
  \ Run a specific verticle\nmvn compile vertx:run -Dvertx.id=main-verticle\n\n# Package the fat jar\n\
  mvn clean package -DskipTests\n\n# Run the packaged jar\njava -jar target/hello-1.0.0-fat.jar\n\n# Verify\
  \ the endpoint\ncurl -s http://localhost:8080/hello\n```\n\n## Minimal MainVerticle.java\n\n```java\n\
  public class MainVerticle extends AbstractVerticle {\n  @Override\n  public void start(Promise<Void>\
  \ startPromise) {\n    vertx.createHttpServer()\n      .requestHandler(req -> req.response()\n     \
  \   .putHeader(\"content-type\", \"application/json\")\n        .end(\"{\\\"status\\\":\\\"ok\\\"}\"\
  ))\n      .listen(8080, http -> {\n        if (http.succeeded()) startPromise.complete();\n        else\
  \ startPromise.fail(http.cause());\n      });\n  }\n}\n```\n\n## Best practices\n\n- Never block the\
  \ event loop; use `vertx.executeBlocking` for JDBC calls\n- Use Vert.x Web Router with sub-routers per\
  \ resource\n- Prefer the service proxy pattern for inter-verticle calls\n- Pin the archetype version\
  \ in CI builds\n\n## Testing\n\n```bash\nmvn compile vertx:run &\nsleep 8\ncurl -s http://localhost:8080/hello\
  \ -w '\\n%{http_code}\\n'\n```\n\n## Capabilities\n\n### vertx-project\nScaffold, run, and package Vert.x\
  \ applications\n\n**Commands:**\n- `mvn archetype:generate -DarchetypeGroupId=io.vertx -DarchetypeArtifactId=vertx-maven-archetype\
  \ -DarchetypeVersion=4.5.10`\n- `mvn compile vertx:run`\n- `mvn package`\n- `java -jar target/hello-1.0.0-fat.jar`\n\
  - `curl -s http://localhost:8080/hello`\n\n**Examples:**\n- mvn compile vertx:run -Dvertx.id=main-verticle\n\
  - mvn clean package -DskipTests\n- curl -s http://localhost:8080/api/tasks | jq \".length\""
prompt: Act as Vertx and handle the task per the instructions.
