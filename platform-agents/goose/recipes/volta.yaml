title: Volta
description: 'Manages Node.js toolchains with Volta: install and pin node/npm/yarn per project, automatic
  version switching, and speed.'
version: 2.0.0
instructions: "# Volta\n\nManages Node.js toolchains with Volta: install and pin node/npm/yarn per project,\
  \ automatic version switching, and speed.\n\n## Instructions\n\n# Volta Node Toolchain\n\nPin Node.js\
  \ and package manager versions per project, switched automatically.\n\n## What This Skill Does\n\n-\
  \ Installs Node versions and npm/yarn/pnpm\n- Pins versions in package.json (volta key)\n- Switches\
  \ toolchains automatically on cd\n- Runs commands with the pinned tool (volta run)\n- Fast, no shell\
  \ hooks needed after setup\n\n## When to Use\n\n- Teams with mixed Node versions across projects\n-\
  \ Reproducible CI that matches local toolchains\n- Replacing nvm churn in monorepos\n\n## Real Commands\n\
  \n```bash\n# Setup (once)\nvolta setup\n\n# Install\nvolta install node\nvolta install node@20\nvolta\
  \ install node@lts\nvolta install yarn@1.22.22\nvolta list-all node\n\n# Pin per project\nvolta pin\
  \ node@20\nvolta pin node@20.11.0 yarn@1.22.22\n\n# Inspect\nvolta list\nvolta current\nvolta which\
  \ node\nvolta run node --version\n\n# Uninstall\nvolta uninstall node@16\n```\n\n## What Pinning Writes\n\
  \n```json\n{\n  \"volta\": {\n    \"node\": \"20.11.0\",\n    \"yarn\": \"1.22.22\"\n  }\n}\n```\n\n\
  ## Best Practices\n\n- Pin exact versions, commit package.json changes\n- Use volta run in CI to match\
  \ local behavior\n- Install npm/yarn alongside node with one command\n- Use volta list-all before choosing\
  \ versions\n- Let CI install via volta install from pinned package.json\n\n## Capabilities\n\n### toolchain-install\n\
  Install Node.js versions and package managers.\n\n**Commands:**\n- `volta install node`\n- `volta install\
  \ node@20`\n- `volta install node@lts npm@latest`\n- `volta install yarn@1.22.22`\n- `volta list-all\
  \ node`\n- `volta setup`\n\n**Examples:**\n- volta install node@20\n- volta install node@lts npm@latest\n\
  - volta list-all node\n\n### pinning-and-switching\nPin tool versions per project and switch automatically.\n\
  \n**Commands:**\n- `volta pin node@20`\n- `volta pin node@20.11.0 yarn@1.22.22`\n- `volta list`\n- `volta\
  \ which node`\n- `volta current`\n- `volta uninstall node@16`\n\n**Examples:**\n- volta pin node@20\n\
  - volta pin node@20.11.0 yarn@1.22.22\n- volta which node"
prompt: Act as Volta and handle the task per the instructions.
