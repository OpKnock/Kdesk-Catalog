title: Webhook Delivery
description: Operates webhook delivery end-to-end. Registers endpoints, forwards events locally with smee,
  sends test deliveries, inspects delivery status and logs, and replays failed deliveries.
version: 2.0.0
instructions: "# Webhook Delivery\n\nOperates webhook delivery end-to-end. Registers endpoints, forwards\
  \ events locally with smee, sends test deliveries, inspects delivery status and logs, and replays failed\
  \ deliveries.\n\n## Instructions\n\n# Webhook Delivery\n\n## What this skill does\n\nSet up and operate\
  \ webhook delivery for your API: register endpoints, forward events locally with smee, send test deliveries,\
  \ inspect delivery status, and replay failures.\n\n## When to use\n\n- Building a webhook feature for\
  \ customers\n- Debugging undelivered events\n- Replaying deliveries after an outage\n\n## Real commands\n\
  \n```bash\n# Forward remote webhooks to localhost\nsmee --url https://smee.io/your-channel --port 8080\n\
  \n# Simulate an event POST\ncurl -X POST -H \"Content-Type: application/json\" \\\n  -d \"{\\\"event\\\
  \":\\\"order.created\\\",\\\"id\\\":42}\" \\\n  http://localhost:8080/webhooks/orders\n\n# Delivery\
  \ status\ncurl -s http://localhost:8080/webhooks/deliveries | jq \".[0].status\"\n\n# Count failed deliveries\n\
  curl -s \"http://localhost:8080/webhooks/deliveries?status=failed\" | jq \"length\"\n\n# Retry a delivery\n\
  curl -s -X POST http://localhost:8080/webhooks/deliveries/DELIVERY_ID/retry | jq \".attempts\"\n\n#\
  \ List registered endpoints\ncurl -s http://localhost:8080/webhooks/endpoints | jq \".[].url\"\n```\n\
  \n## Delivery record fields\n\n- delivery_id, event_id, endpoint_id\n- status, attempts, last_error\n\
  - request_headers, request_body, response_body\n- created_at, next_retry_at\n\n## Best practices\n\n\
  - Sign payloads (see webhook-signature-skill)\n- Include `X-Event-ID` and `X-Delivery-ID` headers\n\
  - Retry with exponential backoff, cap at ~5 attempts\n- Dead-letter events that exceed retry limits\n\
  - Keep delivery logs for at least 30 days\n\n## Testing\n\n```bash\nsmee --url https://smee.io/test-channel\
  \ --port 8080 &\ncurl -s -X POST http://localhost:8080/webhooks/orders -d \"{\\\"event\\\":\\\"test\\\
  \"}\"\ncurl -s http://localhost:8080/webhooks/deliveries | jq \".[0]\"\n```\n\n## Capabilities\n\n###\
  \ webhook-delivery\nForward, deliver, and monitor webhook events\n\n**Commands:**\n- `smee --url https://smee.io/your-channel\
  \ --port 8080`\n- `curl -X POST -H \"Content-Type: application/json\" -d \"{\\\"event\\\":\\\"order.created\\\
  \",\\\"id\\\":42}\" http://localhost:8080/webhooks/orders`\n- `curl -s http://localhost:8080/webhooks/deliveries\
  \ | jq \".[0].status\"`\n- `curl -s -X POST http://localhost:8080/webhooks/deliveries/DELIVERY_ID/retry\
  \ | jq \".attempts\"`\n- `curl -s \"http://localhost:8080/webhooks/deliveries?status=failed\" | jq \"\
  length\"`\n\n**Examples:**\n- smee --url https://smee.io/your-channel --port 8080\n- curl -s -X POST\
  \ http://localhost:8080/webhooks/orders -H \"X-Event-ID: evt_1\" -d \"{\\\"event\\\":\\\"payment.succeeded\"\
  }\" | jq\n- curl -s http://localhost:8080/webhooks/endpoints | jq \".[].url\""
prompt: Act as Webhook Delivery and handle the task per the instructions.
