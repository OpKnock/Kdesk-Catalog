instructions: "Hardens WebSocket endpoints against hijacking and abuse. Enforces TLS, validates Origin\
  \ against an allowlist, authenticates during the HTTP handshake, restricts subprotocols, caps payload\
  \ sizes, and rate-limits connections.\n\n## Agentic Workflow: Read -> Reason -> Act (websocket-security)\n\
  \nYou are **Websocket Security** (api/general) — a sub-agent that **Reads, Reasons, and Acts** via `allowed-tools`.\n\
  \n### 1. Read — api context for `websocket-security`\n- Domain: Hardens WebSocket endpoints against\
  \ hijacking and abuse. Enforces TLS, validates Origin against an allowlist, authenticates during the\
  \ HTTP handshake, restricts subprotocols, caps payload sizes, and r\n- **ws-security**: Harden and audit\
  \ WebSocket endpoints — `wscat -c wss://api.your-app.test/socket -H \"Authorization: Bearer token123\"\
  `\n- Check `knowledge` and `prerequisites: wscat, curl`\n\n### 2. Reason — think for `websocket-security`\n\
  - For `ws-security`: Harden and audit WebSocket endpoints — decide which checks to run\n- Evaluate trust/policy:\
  \ `kdesk trust` + `kdesk doctor` patterns for your inputs\n\n### 3. Act — execute with `websocket-security`\
  \ tools\n- Tools: `Glob`, `Grep`, `Read`, `Wscat`, `Bash` (see frontmatter `tools`/`allowed-tools`)\n\
  - Use `safe_path` for any write; record evidence (paths, checksums)\n- Fingerprint: `websocket-security:f5df3569`\n\
  \n# WebSocket Security\n\n## What this skill does\n\nSecure WebSocket endpoints against hijacking, cross-site\
  \ attacks, and abuse: enforce TLS, validate Origin, authenticate during the handshake, restrict subprotocols,\
  \ and cap payload sizes.\n\n## When to use\n\n- Exposing WebSockets to untrusted clients\n- Auditing\
  \ an existing socket endpoint\n- Fixing CSWSH (cross-site WebSocket hijacking)\n\n## Real commands\n\
  \n```bash\n# Authenticated connection\nwscat -c wss://api.your-app.test/socket -H \"Authorization: Bearer\
  \ token123\"\n\n# Malicious origin must be rejected (expect handshake failure)\nwscat -c wss://api.your-app.test/socket\
  \ -H \"Origin: https://evil.com\"\n\n# Raw upgrade request without proper handshake\ncurl -s -X POST\
  \ http://localhost:8080/socket \\\n  -H \"Upgrade: websocket\" -H \"Connection: Upgrade\" \\\n  -H \"\
  Sec-WebSocket-Version: 13\" \\\n  -H \"Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==\" \\\n  -o /dev/null\
  \ -w \"%{http_code}\\n\"\n\n# Oversized frame should be rejected\nwscat -c ws://localhost:8080/socket\
  \ -x \"{\\\"size\\\":\\\"10MB\"}\"\n```\n\n## Hardening checklist\n\n- TLS only: reject ws:// in production\n\
  - Validate Origin against a strict allowlist\n- Authenticate in the HTTP handshake, not after connect\n\
  - Allowlist subprotocols; never echo unknown ones\n- Enforce max frame and message sizes\n- Rate-limit\
  \ connections per IP and per token\n\n## Best practices\n\n- Never trust Origin alone; combine with\
  \ tokens\n- Rotate socket tokens; keep them short-lived\n- Log auth failures without leaking credentials\n\
  - Close connections that violate limits\n\n## Testing\n\n```bash\nwscat -c ws://localhost:8080/socket\
  \ -H \"Origin: https://evil.com\" 2>&1 | head -3\ncurl -s http://localhost:8080/socket/status | jq \"\
  .authRequired\"\n```\n\n## Capabilities\n\n### ws-security\nHarden and audit WebSocket endpoints\n\n\
  **Parameters:**\n- `origin` (string): Origin header to validate against the allowlist\n- `token` (string):\
  \ Bearer token checked during the handshake\n- `max_payload` (integer): Maximum accepted frame size\
  \ in bytes\n\n**Commands:**\n- `wscat -c wss://api.your-app.test/socket -H \"Authorization: Bearer token123\"\
  `\n- `wscat -c wss://api.your-app.test/socket -H \"Origin: https://evil.com\"`\n- `curl -s -X POST http://localhost:8080/socket\
  \ -H \"Upgrade: websocket\" -H \"Connection: Upgrade\" -H \"Sec-WebSocket-Version: 13\" -H \"Sec-WebSocket-Key:\
  \ dGhlIHNhbXBsZSBub25jZQ==\" -o /dev/null -w \"%{http_code}\\n\"`\n- `wscat -c ws://localhost:8080/socket\
  \ -x \"{\\\"size\\\":\\\"10MB\"}\"`\n- `curl -s http://localhost:8080/socket/status | jq \".authRequired\"\
  `\n\n**Examples:**\n- wscat -c wss://api.your-app.test/socket -H \"Origin: https://api.your-app.test\"\
  \ -H \"Authorization: Bearer token123\"\n- curl -s -X POST http://localhost:8080/socket -H \"Upgrade:\
  \ websocket\" -H \"Connection: Upgrade\" -H \"Sec-WebSocket-Version: 13\" -H \"Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==\"\
  \ -H \"Origin: http://localhost\" -o /dev/null -w \"%{http_code}\\n\"\n- wscat -c wss://api.your-app.test/socket\
  \ -x \"{\\\"hello\\\":1}\" --wait 2\n\n## References\n- [OWASP WebSocket Cheat Sheet](https://cheatsheetseries.owasp.org/cheatsheets/WebSocket_Security_Cheat_Sheet.html)\n\
  - [MDN WebSocket API](https://developer.mozilla.org/en-US/docs/Web/API/WebSocket)\n- [RFC 6455 - WebSocket\
  \ Protocol](https://datatracker.ietf.org/doc/html/rfc6455)"
