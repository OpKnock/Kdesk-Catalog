  ### 3. Act — execute with `wget` tools\n- Tools: `Glob`, `Grep`, `Read`, `Wget` (see frontmatter `tools`/`allowed-tools`)\n\
  - Use `safe_path` for any write; record evidence (paths, checksums)\n- Fingerprint: `wget:4b7f9d26`\n\
  \n# wget\n\n## What this skill does\nDownload files and mirror websites with GNU wget: single-file downloads\
  \ with resume, recursive site crawling, full mirroring with link conversion, authenticated requests,\
  \ and batch downloads from URL lists.\n\n## When to use\n- Downloading large artifacts reliably\n- Mirroring\
  \ documentation for offline use\n- Scripting downloads in CI\n\n## Real commands\n```bash\n# Resume\
  \ an interrupted download\nwget -c https://httpbin.org/bytes/1024\n\n# Recursive crawl (2 levels, no\
  \ parent)\nwget -r -l 2 -np https://httpbin.org/\n\n# Full mirror with assets and converted links\n\
  wget --mirror -p --convert-links -P ./mirror https://httpbin.org/\n\n# Batch download with bandwidth\
  \ cap\nwget -i urls.txt --limit-rate=1m -q\n\n# Authenticated API export\nwget --header='Authorization:\
  \ Bearer token123' -O data.json https://httpbin.org/json\n\n# Basic auth\nwget --user=ci --password=secret\
  \ https://httpbin.org/bytes/1024\n\n# Retry-tolerant download\nwget -c -t 10 --timeout=30 https://httpbin.org/bytes/1048576\n\
  ```\n\n## Common flags\n- `-c` continue/resume\n- `-r -l N -np` recursive, depth, no parent\n- `-p`\
  \ page requisites (css/js/img)\n- `--convert-links` rewrite links for offline use\n- `-P DIR` output\
  \ directory\n- `-q` quiet for scripts\n\n## Best practices\n- Use `-c` for large downloads\n- Cap recursion\
  \ depth before mirroring big sites\n- Prefer `--header` over `--user` for token auth\n- Never mirror\
  \ sites that forbid it in robots.txt\n\n## Testing\n```bash\nwget --spider -S https://httpbin.org/ 2>&1\
  \ | grep -E 'HTTP|Content-Length'\nwget -q -O /dev/null -w '%{http_code}' https://httpbin.org/\n```\n\
  \n## Capabilities\n\n### wget-downloads\nFetch, resume, and mirror HTTP resources\n\n**Parameters:**\n\
  - `recursive` (boolean): Follow links recursively (-r)\n- `level` (integer): Maximum recursion depth\
  \ (-l)\n- `rate` (string): Bandwidth limit, e.g. 1m, 500k (--limit-rate)\n\n**Commands:**\n- `wget -c\
  \ https://httpbin.org/bytes/1024`\n- `wget -r -l 2 -np https://httpbin.org/`\n- `wget --mirror -p --convert-links\
  \ -P ./mirror https://httpbin.org/`\n- `wget -i urls.txt --limit-rate=1m -q`\n- `wget --header='Authorization:\
  \ Bearer token123' -O data.json https://httpbin.org/json`\n\n**Examples:**\n- wget -c -t 10 --timeout=30\
  \ https://httpbin.org/bytes/1048576\n- wget -r -A '*.pdf' -np -l 3 https://httpbin.org/\n- wget --user=ci\
  \ --password=secret https://httpbin.org/bytes/1024\n\n## References\n- [GNU Wget Manual](https://www.gnu.org/software/wget/manual/wget.html)\n\
  - [Wget WARC Guide](https://www.gnu.org/software/wget/manual/wget.html#WARC)"
