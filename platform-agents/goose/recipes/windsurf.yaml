title: Windsurf
description: 'Operates the Windsurf editor with Cascade AI: global rules, memories, CLI launch flags,
  and project configuration.'
version: 2.0.0
instructions: "# Windsurf\n\nOperates the Windsurf editor with Cascade AI: global rules, memories, CLI\
  \ launch flags, and project configuration.\n\n## Instructions\n\n# Windsurf Editor Operations\n\nWork\
  \ with the Windsurf editor and its Cascade AI assistant.\n\n## What This Skill Does\n\n- Launches the\
  \ editor at projects and files\n- Opens multifolder workspaces\n- Configures Cascade rules and memories\n\
  - Manages global vs project rules\n- Uses diff/CLI flags for focused sessions\n\n## When to Use\n\n\
  - Setting up Windsurf for a repository\n- Configuring Cascade behavior for a team\n- CLI-driven editor\
  \ workflows\n\n## Real Commands\n\n```bash\n# Launch\nwindsurf .\nwindsurf ~/projects/app\nwindsurf\
  \ --multifolder ~/projects/a ~/projects/b\nwindsurf --diff src/main.ts\nwindsurf --help\n\n# Cascade\
  \ config\nwindsurf --rules ~/.windsurf/rules\nwindsurf --memories ~/.windsurf/memories\nwindsurf --global-rules\n\
  windsurf --dev\nwindsurf --no-session-restore\n```\n\n## Cascade Rules Layout\n\n```\n.windsurf/\n \
  \ rules/\n    global_rules.md      # always-on guidance\n    project_rules.md     # repo-specific guidance\n\
  \  memories/              # persisted context\n```\n\n## Best Practices\n\n- Commit .windsurf/rules\
  \ to the repo for team consistency\n- Keep global rules for personal preferences, project rules for\
  \ standards\n- Use memories for frequently reused context\n- Pair --diff with staged files for review\
  \ workflows\n- Test rule changes with a fresh session (--no-session-restore)\n\n## Capabilities\n\n\
  ### editor-launch\nLaunch Windsurf with project paths and window options.\n\n**Commands:**\n- `windsurf\
  \ .`\n- `windsurf ~/projects/app`\n- `windsurf --multifolder ~/projects/a ~/projects/b`\n- `windsurf\
  \ --diff src/main.ts`\n- `windsurf --help`\n\n**Examples:**\n- windsurf .\n- windsurf --diff src/main.ts\n\
  - windsurf --multifolder ~/projects/a ~/projects/b\n\n### cascade-configuration\nConfigure Cascade AI\
  \ rules, memories, and model settings.\n\n**Commands:**\n- `windsurf --rules ~/.windsurf/rules`\n- `windsurf\
  \ --memories ~/.windsurf/memories`\n- `windsurf --global-rules`\n- `windsurf --dev`\n- `windsurf --no-session-restore`\n\
  \n**Examples:**\n- windsurf --rules ~/.windsurf/rules\n- windsurf --memories ~/.windsurf/memories\n\
  - windsurf --dev"
prompt: Act as Windsurf and handle the task per the instructions.
