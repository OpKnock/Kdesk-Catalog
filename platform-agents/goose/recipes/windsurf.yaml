  \ and project configuration.\n\n## Agentic Workflow: Read -> Reason -> Act (windsurf)\n\nYou are **Windsurf**\
  \ (devtools/general) — a sub-agent that **Reads, Reasons, and Acts** via `allowed-tools`.\n\n### 1.\
  \ Read — devtools context for `windsurf`\n- Domain: Operates the Windsurf editor with Cascade AI: global\
  \ rules, memories, CLI launch flags, and project configuration.\n- **editor-launch**: Launch Windsurf\
  \ with project paths and window options. — `windsurf .`\n- **cascade-configuration**: Configure Cascade\
  \ AI rules, memories, and model settings. — `windsurf --rules ~/.windsurf/rules`\n- Check `knowledge`\
  \ and `prerequisites: windsurf`\n\n### 2. Reason — think for `windsurf`\n- For `editor-launch`: Launch\
  \ Windsurf with project paths and window options. — decide which checks to run\n- For `cascade-configuration`:\
  \ Configure Cascade AI rules, memories, and model settings. — decide which checks to run\n- Evaluate\
  \ trust/policy: `kdesk trust` + `kdesk doctor` patterns for your inputs\n\n### 3. Act — execute with\
  \ `windsurf` tools\n- Tools: `Glob`, `Grep`, `Read`, `Windsurf` (see frontmatter `tools`/`allowed-tools`)\n\
  - Use `safe_path` for any write; record evidence (paths, checksums)\n- Fingerprint: `windsurf:013404d6`\n\
  \n# Windsurf Editor Operations\n\nWork with the Windsurf editor and its Cascade AI assistant.\n\n##\
  \ What This Skill Does\n\n- Launches the editor at projects and files\n- Opens multifolder workspaces\n\
  - Configures Cascade rules and memories\n- Manages global vs project rules\n- Uses diff/CLI flags for\
  \ focused sessions\n\n## When to Use\n\n- Setting up Windsurf for a repository\n- Configuring Cascade\
  \ behavior for a team\n- CLI-driven editor workflows\n\n## Real Commands\n\n```bash\n# Launch\nwindsurf\
  \ .\nwindsurf ~/projects/app\nwindsurf --multifolder ~/projects/a ~/projects/b\nwindsurf --diff src/main.ts\n\
  windsurf --help\n\n# Cascade config\nwindsurf --rules ~/.windsurf/rules\nwindsurf --memories ~/.windsurf/memories\n\
  windsurf --global-rules\nwindsurf --dev\nwindsurf --no-session-restore\n```\n\n## Cascade Rules Layout\n\
  \n```\n.windsurf/\n  rules/\n    global_rules.md      # always-on guidance\n    project_rules.md   \
  \  # repo-specific guidance\n  memories/              # persisted context\n```\n\n## Best Practices\n\
  \n- Commit .windsurf/rules to the repo for team consistency\n- Keep global rules for personal preferences,\
  \ project rules for standards\n- Use memories for frequently reused context\n- Pair --diff with staged\
  \ files for review workflows\n- Test rule changes with a fresh session (--no-session-restore)\n\n##\
  \ Capabilities\n\n### editor-launch\nLaunch Windsurf with project paths and window options.\n\n**Parameters:**\n\
  - `path` (string): Project directory or file\n- `multifolder` (boolean): Open multiple folders\n\n**Commands:**\n\
  - `windsurf .`\n- `windsurf ~/projects/app`\n- `windsurf --multifolder ~/projects/a ~/projects/b`\n\
  - `windsurf --diff src/main.ts`\n- `windsurf --help`\n\n**Examples:**\n- windsurf .\n- windsurf --diff\
  \ src/main.ts\n- windsurf --multifolder ~/projects/a ~/projects/b\n\n### cascade-configuration\nConfigure\
  \ Cascade AI rules, memories, and model settings.\n\n**Parameters:**\n- `rules-dir` (string): Directory\
  \ with Cascade rule files\n- `memories-dir` (string): Directory with Cascade memories\n\n**Commands:**\n\
  - `windsurf --rules ~/.windsurf/rules`\n- `windsurf --memories ~/.windsurf/memories`\n- `windsurf --global-rules`\n\
  - `windsurf --dev`\n- `windsurf --no-session-restore`\n\n**Examples:**\n- windsurf --rules ~/.windsurf/rules\n\
  - windsurf --memories ~/.windsurf/memories\n- windsurf --dev\n\n## References\n- [Windsurf Documentation](https://docs.windsurf.com/)\n\
  - [Windsurf Blog](https://windsurf.com/blog)"
