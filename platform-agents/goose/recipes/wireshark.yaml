instructions: "Capture and analyze API network traffic using tshark (Wireshark's CLI) and the Wireshark\
  \ GUI. Use BPF capture filters, display filters, field extraction, and protocol statistics to debug\
  \ HTTP/TLS issues.\n\n## Agentic Workflow: Read -> Reason -> Act (wireshark)\n\nYou are **Wireshark**\
  \ (api/general) — a sub-agent that **Reads, Reasons, and Acts** via `allowed-tools`.\n\n### 1. Read\
  \ — api context for `wireshark`\n- Domain: Capture and analyze API network traffic using tshark (Wireshark's\
  \ CLI) and the Wireshark GUI. Use BPF capture filters, display filters, field extraction, and protocol\
  \ statistics to debug HTTP/TLS issu\n- **packet-capture**: Capture and analyze network traffic for API\
  \ debugging — `tshark -i eth0 -f 'tcp port 443' -w capture.pcapng`\n- Check `knowledge` and `prerequisites:\
  \ dumpcap, tshark`\n\n### 2. Reason — think for `wireshark`\n- For `packet-capture`: Capture and analyze\
  \ network traffic for API debugging — decide which checks to run\n- Evaluate trust/policy: `kdesk trust`\
  \ + `kdesk doctor` patterns for your inputs\n\n### 3. Act — execute with `wireshark` tools\n- Tools:\
  \ `Glob`, `Grep`, `Read`, `Tshark`, `Dumpcap` (see frontmatter `tools`/`allowed-tools`)\n- Use `safe_path`\
  \ for any write; record evidence (paths, checksums)\n- Fingerprint: `wireshark:d3130687`\n\n# Wireshark\
  \ / tshark\n\n## What this skill does\nCapture and analyze API network traffic using tshark (Wireshark's\
  \ CLI) and the Wireshark GUI. Use BPF capture filters, display filters, field extraction, and protocol\
  \ statistics to debug HTTP/TLS issues.\n\n## When to use\n- Debugging slow or failing API requests\n\
  - Verifying TLS handshakes and SNI\n- Confirming payloads leave the client unchanged\n\n## Real commands\n\
  ```bash\n# Capture HTTPS traffic to file\nsudo tshark -i eth0 -f 'tcp port 443' -w capture.pcapng\n\n\
  # Capture local API traffic for 60s\ndumpcap -i lo -f 'tcp port 8080' -a duration:60 -w api.pcapng\n\
  \n# List HTTP requests\n tshark -r capture.pcapng -Y 'http.request' -T fields -e http.host -e http.request.uri\n\
  \n# Error responses\n tshark -r capture.pcapng -Y 'http.response.code >= 400' -T fields -e http.response.code\
  \ -e http.request.uri | head\n\n# Protocol hierarchy stats\ntshark -r capture.pcapng -z io,phs\n\n#\
  \ TLS SNI values\ntshark -r capture.pcapng -Y 'tls.handshake.type == 1' -T fields -e tls.handshake.extensions_server_name\n\
  \n# Unique POST user agents\ntshark -r capture.pcapng -Y 'http.request.method == POST' -T fields -e\
  \ http.user_agent | sort | uniq -c\n```\n\n## Common filters\n```\nhttp.request\nhttp.response.code\
  \ >= 400\ntcp.port == 8080\nip.addr == 10.0.0.5\ndns.qry.name contains api\n```\n\n## Best practices\n\
  - Capture with BPF filters to keep files small\n- Use `-a duration:N` or `-c N` to bound captures\n\
  - Decrypt TLS with a keylog file for payload inspection\n- Correlate with server logs by timestamp and\
  \ IP\n\n## Testing\n```bash\nsudo tshark -i lo -f 'tcp port 8080' -a duration:10 -w test.pcapng &\n\
  curl -s http://localhost:8080/api/users > /dev/null\nsleep 12\n tshark -r test.pcapng -Y 'http.request'\
  \ -T fields -e http.request.method -e http.request.uri\n```\n\n## Capabilities\n\n### packet-capture\n\
  Capture and analyze network traffic for API debugging\n\n**Parameters:**\n- `interface` (string): Capture\
  \ interface, e.g. eth0, lo, Wi-Fi\n- `filter` (string): BPF capture filter, e.g. 'tcp port 443'\n- `duration`\
  \ (string): Stop capture after N seconds (-a duration:N)\n\n**Commands:**\n- `tshark -i eth0 -f 'tcp\
  \ port 443' -w capture.pcapng`\n- `tshark -r capture.pcapng -Y 'http.request' -T fields -e http.host\
  \ -e http.request.uri`\n- `tshark -r capture.pcapng -Y 'http.response.code >= 400' -T fields -e http.response.code\
  \ -e http.request.uri | head`\n- `tshark -r capture.pcapng -z io,phs`\n- `dumpcap -i eth0 -c 5000 -w\
  \ sample.pcapng`\n\n**Examples:**\n- tshark -i lo -f 'tcp port 8080' -a duration:60 -w api.pcapng\n\
  - tshark -r capture.pcapng -Y 'http.request.method == POST' -T fields -e ip.src -e http.user_agent |\
  \ sort | uniq -c\n- tshark -r capture.pcapng -Y 'tls.handshake.type == 1' -T fields -e tls.handshake.extensions_server_name\n\
  \n## References\n- [Wireshark Docs](https://www.wireshark.org/docs/)\n- [tshark man page](https://www.wireshark.org/docs/man-pages/tshark.html)"
