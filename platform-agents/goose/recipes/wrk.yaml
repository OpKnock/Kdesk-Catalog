title: Wrk
description: Benchmark HTTP APIs with wrk, a lightweight multi-threaded HTTP load generator. Tune threads
  and connections, script requests with Lua, read latency distributions, and run repeatable benchmarks
  in CI.
version: 2.0.0
instructions: "# Wrk\n\nBenchmark HTTP APIs with wrk, a lightweight multi-threaded HTTP load generator.\
  \ Tune threads and connections, script requests with Lua, read latency distributions, and run repeatable\
  \ benchmarks in CI.\n\n## Instructions\n\n# wrk\n\n## What this skill does\nBenchmark HTTP APIs with\
  \ wrk, a lightweight multi-threaded HTTP load generator. Tune threads and connections, script requests\
  \ with Lua, read latency distributions, and run repeatable benchmarks in CI.\n\n## When to use\n- Measuring\
  \ throughput and latency\n- Comparing config changes A/B\n- Capacity planning\n\n## Real commands\n\
  ```bash\n# Default benchmark\nwrk -t12 -c400 -d30s http://localhost:8080/api/users\n\n# Latency distribution\n\
  wrk -t4 -c100 -d60s --latency http://localhost:8080/api/users\n\n# Lua-scripted POSTs\nwrk -t2 -c50\
  \ -d10s -s post.lua http://localhost:8080/api/orders\n\n# With auth header\nwrk -H 'Authorization: Bearer\
  \ token123' -d30s --latency https://httpbin.org/get\n\n# Fixed request rate (throughput mode)\nwrk -t8\
  \ -c200 -d120s -R 1000 http://localhost:8080/api/search\n```\n\n## post.lua\n```lua\nwrk.method = \"\
  POST\"\nwrk.headers[\"Content-Type\"] = \"application/json\"\nwrk.body = '{\"customer\": 1}'\n```\n\n\
  ## Interpreting output\n```\nThread Stats   Avg      Stdev     Max   +/- Stdev\n  Latency     12.5ms\
  \    8.0ms   200ms   90.00%\n  Req/Sec      4.5k    300.0     5.5k    75.00%\nLatency Distribution\n\
  \  50%  10.0ms\n  99%  90.0ms\n```\n\n## Best practices\n- Match thread count to CPU cores (2-4x)\n\
  - Keep connections below fd limits (check `ulimit -n`)\n- Warm up before timed runs\n- Use `-R` for\
  \ fixed-rate tests, default for max-rate\n\n## Testing\n```bash\nwrk -t4 -c100 -d10s --latency http://localhost:8080/api/health\
  \ | grep -E 'Requests/sec|99%'\n```\n\n## Capabilities\n\n### wrk-benchmark\nRun and interpret wrk HTTP\
  \ benchmarks\n\n**Commands:**\n- `wrk -t12 -c400 -d30s http://localhost:8080/api/users`\n- `wrk -t4\
  \ -c100 -d60s --latency http://localhost:8080/api/users`\n- `wrk -t2 -c50 -d10s -s post.lua http://localhost:8080/api/orders`\n\
  - `wrk -H 'Authorization: Bearer token123' -d30s --latency https://httpbin.org/get`\n- `wrk -t8 -c200\
  \ -d120s -R 1000 http://localhost:8080/api/search`\n\n**Examples:**\n- wrk -t4 -c200 -d30s --latency\
  \ http://localhost:8080/api/health | grep -E 'Requests/sec|p99'\n- wrk -t2 -c20 -d15s -s upload.lua\
  \ http://localhost:8080/api/files\n- wrk -t12 -c400 -d60s -R 2000 --latency https://httpbin.org/get"
prompt: Act as Wrk and handle the task per the instructions.
