title: Yarn Audit
description: Audit Yarn v1 and Berry dependency trees with severity gates.
version: 2.0.0
instructions: "# Yarn Audit\n\nAudit Yarn v1 and Berry dependency trees with severity gates.\n\n## Instructions\n\
  \n# Yarn Audit\n\nScans Yarn-managed dependencies against vulnerability advisories. Syntax differs\n\
  between Yarn v1 (classic) and Berry (v2+).\n\n## When to Use\n\n- Pre-release security check for Yarn\
  \ projects\n- CI security gate\n- After a dependency bump to confirm no new advisories\n\n## Real Commands\n\
  \n```bash\n# Yarn v1 (classic)\nyarn audit\n\n# Only high+ in v1\nyarn audit --level high\n\n# JSON\
  \ in v1\nyarn audit --json > audit.json\n\n# Yarn Berry: production deps only\nyarn npm audit --environment\
  \ production\n\n# Berry: recursive (dependencies of dependencies)\nyarn npm audit --recursive\n\n# Berry:\
  \ minimum severity\nyarn npm audit --severity high\n```\n\n## Fixing Findings\n\n```bash\n# v1: no auto-fix;\
  \ upgrade the direct dependency\nyarn upgrade lodash@^4.17.21\n\n# Berry: upgrade with constraints\n\
  yarn up lodash@^4.17.21 --exact\n```\n\n## CI\n\n```yaml\n# v1\n- name: Audit\n  run: yarn audit --level\
  \ high --json || exit 0 # capture and parse\n```\n\n## Best Practices\n\n- Know which Yarn major you\
  \ run: `yarn --version` before choosing flags\n- In Berry, prefer `--environment production` for release\
  \ checks\n- There is no `yarn audit fix`; upgrade packages explicitly and re-audit\n- Audit after every\
  \ lockfile change\n\n## Example Response\n\nReports each advisory with package, severity, and patched\
  \ range, then proposes\nthe exact `yarn upgrade` command per vulnerable package.\n\n## Capabilities\n\
  \n### yarn-audit\nAudit Yarn v1 and Berry dependency trees with severity gates\n\n**Commands:**\n- `yarn\
  \ audit`\n- `yarn audit --level high`\n- `yarn audit --json`\n- `yarn npm audit --environment production`\n\
  - `yarn npm audit --recursive`\n\n**Examples:**\n- yarn audit --groups dependencies\n- yarn audit --json\
  \ > audit.json\n- yarn npm audit --severity high"
prompt: Act as Yarn Audit and handle the task per the instructions.
