[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kdesk"
version = "1.1.0"
description = "Universal AI Agent + Skill + Workflow Registry and Orchestration Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kdesk" }]
keywords = ["ai", "agents", "skills", "claude", "cursor", "copilot", "registry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "PyYAML>=6.0",
    "platformdirs>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.8",
    "build>=1.0",
    "jsonschema>=4.0",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
]

[project.scripts]
kdesk = "kdesk.cli:main"

[project.urls]
Homepage = "https://github.com/OpKnock/Kdesk-Catalog"
Repository = "https://github.com/OpKnock/Kdesk-Catalog"
Issues = "https://github.com/OpKnock/Kdesk-Catalog/issues"

[tool.setuptools]
packages = ["kdesk", "kdesk.adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["kdesk"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
