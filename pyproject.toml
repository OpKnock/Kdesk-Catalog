[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kdesk"
version = "1.1.0"
description = "Universal AI Agent + Skill + Workflow Registry and Orchestration Platform"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mehul Wagde" }]
dependencies = [
    "PyYAML>=6.0",
    "platformdirs>=3.0",
]

[project.scripts]
kdesk = "kdesk.cli:main"

[tool.setuptools]
packages = ["kdesk", "kdesk.adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"