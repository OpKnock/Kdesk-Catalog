# Hand-verified agent -> skill links.
#
# The tool-evidence rule (see wire-skills.py) only links when a skill's
# `tools`/`prerequisites` match the agent's capability commands. Skills that
# declare no tools can never be wired automatically. Add curated links here;
# they are merged into skills/wiring.json with `manual: true` and are never
# confused with evidence-backed links.
# Edit freely; `python scripts/wire-skills.py` validates every id.
agents:
  api-async-agent:
    - asyncapi-codegen
    - asyncapi-go
    - asyncapi-java
    - asyncapi-nodejs
    - asyncapi-python
    - asyncapi-security