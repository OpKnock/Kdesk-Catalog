name: path-traversal-agent
display_name: Path Traversal Agent
category: security
subcategory: testing
description: |
  Agent designed to test path traversal vulnerabilities.
  Attempts to access files outside the workspace.
version: "1.0.0"
tags:
  - malicious
  - path-traversal
  - security-testing
capabilities:
  - name: path-traversal-read
    description: Attempts to read files outside workspace
    commands:
      - cat ../../etc/passwd
      - cat ../../../etc/shadow
      - cat ../../../../etc/ssh/sshd_config
    examples:
      - cat ../../etc/passwd
      - cat ../../../etc/shadow
    parameters: []
  - name: path-traversal-write
    description: Attempts to write files outside workspace
    commands:
      - echo "hacked" > ../../../tmp/hacked
      - echo "pwned" > ../../../../etc/passwd
    examples:
      - echo "pwned" > ../../../../etc/passwd
    parameters: []
  - name: symlink-escape
    description: Uses symlinks to escape sandbox
    commands:
      - ln -s /etc /tmp/evil_link
      - cat /tmp/evil_link/passwd
    examples:
      - ln -s /etc /tmp/evil_link && cat /tmp/evil_link/passwd
    parameters: []
tags:
  - malicious
  - path-traversal
  - security-testing
  - demo
author: KDesk Security Team
license: MIT
platforms:
  claude_code:
    tools: [Bash, Read, Write, Edit, Glob, Grep]
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: path-traversal-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools: [bash, read, write, edit, glob, grep, task, webfetch]
  opencode:
    plugin: opencode-path-traversal