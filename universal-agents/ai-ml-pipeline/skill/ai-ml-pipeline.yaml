name: ai-ml-pipeline
version: 2.0.0
type: skill
category: data
description: 'Builds reproducible ML pipelines: DVC for data/model versioning, MLflow for experiment tracking
  and serving, and Kubeflow Pipelines for orchestration.'
keywords:
- ml-pipeline
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ai-ml-pipeline.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-ai-ml-pipeline
  generic:
    system_prompt: 'You own ai-ml-pipeline end to end. You do it through data-versioning: Track datasets
      and model artifacts with DVC so training runs reproduce from any git commit. The commands are real,
      e.g. `dvc init`. You answer with exact commands, not abstractions, and flag anything you have not
      verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: data-versioning
  description: Track datasets and model artifacts with DVC so training runs reproduce from any git commit.
  commands:
  - dvc init
  - dvc add data/train.csv
  - dvc repro
  - dvc push
  - dvc metrics show
  examples:
  - dvc add data/train.csv && git add data/train.csv.dvc .dvc/config && git commit -m 'add training data'
  - dvc repro train.dvc
  - dvc metrics diff --sort-by=accuracy
  parameters:
  - name: stage
    type: string
    description: DVC stage file (e.g. train.dvc) to reproduce
  - name: targets
    type: string
    description: Space-separated stages for dvc repro
- name: experiment-tracking
  description: Log parameters, metrics, and models with MLflow and serve models as REST endpoints.
  commands:
  - mlflow run . -P alpha=0.5
  - mlflow experiments create --experiment-name ab-test
  - mlflow models serve -m runs:/demo-run-id/model -p 5000
  - mlflow ui --host 0.0.0.0 --port 5000
  examples:
  - mlflow run . -P alpha=0.5 -P batch_size=64
  - mlflow models serve -m runs:/abc123/model -p 5000
  - mlflow experiments list
  parameters:
  - name: experiment
    type: string
    description: MLflow experiment name or ID
  - name: run_id
    type: string
    description: Run ID used to reference a registered model
  - name: params
    type: string
    description: Hyperparameters passed with -P key=value
- name: pipeline-orchestration
  description: Package and run component pipelines on Kubeflow Pipelines.
  commands:
  - kubectl apply -f pipeline.yaml
  - kfp pipeline upload
  - kubectl get pods -n kubeflow -l pipeline-sdk-type=component
  - kubectl logs -l pipeline-run-id=demo-run-id --all-containers
  examples:
  - kfp pipeline upload --name iris-pipeline pipeline.yaml
  - kubectl logs -n kubeflow -l pipeline-run-id=run-123 --tail=200
  - kubectl get experiments.pipelines.kubeflow.org
  parameters:
  - name: pipeline_file
    type: string
    description: Path to the compiled pipeline YAML/JSON
  - name: run_id
    type: string
    description: Pipeline run identifier for logs
prerequisites:
- python
- scikit-learn
- tensorflow
- mlflow
tools:
- python
- scikit-learn
- tensorflow
- mlflow
- kubeflow
examples:
- input: Why did our model accuracy drop this week?
  output: Runs `dvc metrics diff --sort-by=accuracy` against the last commit, inspects changed dependencies
    with `dvc status`, and isolates the regression source.
- input: Set up experiment tracking
  output: Starts `mlflow ui`, wraps training with mlflow.log_params/log_metrics, then demonstrates `mlflow
    run . -P alpha=0.5` and comparing runs.
instructions: "# AI/ML Pipeline\n\n## What this skill does\n\nCreates reproducible ML pipelines: DVC versions\
  \ raw data and model artifacts, MLflow tracks experiments and serves models, and Kubeflow Pipelines\
  \ orchestrates training end to end.\n\n## When to use\n\n- Reproducing a training run from a git commit\n\
  - Tracking hyperparameters/metrics without spreadsheets\n- Deploying an ML training workflow to Kubernetes\n\
  \n## Real commands\n\n```bash\n# Version training data\ndvc init\ndvc add data/train.csv\ngit add data/train.csv.dvc\
  \ .dvc/config\ngit commit -m \"add training data\"\n\n# Reproduce pipeline stages\ndvc repro\n\n# Track\
  \ an experiment\nmlflow run . -P alpha=0.5 -P batch_size=64\n\n# Compare metric deltas\ndvc metrics\
  \ diff --sort-by=accuracy\n\n# Serve a model\nmlflow models serve -m runs:/<run-id>/model -p 5000\n\
  ```\n\n## dvc.yaml pipeline\n\n```yaml\nstages:\n  featurize:\n    cmd: python featurize.py\n    deps:\n\
  \      - data/train.csv\n    outs:\n      - features.pkl\n  train:\n    cmd: python train.py --params\
  \ params.yaml\n    deps:\n      - features.pkl\n    metrics:\n      - metrics.json\n```\n\n## Testing\n\
  \n- Run `dvc repro` on a clean clone to verify reproducibility\n- Add a CI job running `dvc metrics\
  \ diff --branch main` that fails when accuracy drops\n\n## Best practices\n\n- Never commit binaries\
  \ into git; DVC stores them in remote storage\n- Pin Python deps so runs are deterministic\n- Log a\
  \ params snapshot in MLflow for every run\n- Set `dvc remote add` to S3/GCS for team sharing"
display_name: ai-ml-pipeline
knowledge:
- title: DVC Documentation
  type: documentation
  source: https://dvc.org/doc
  description: Data versioning, pipeline stages, metrics
- title: MLflow Docs
  type: documentation
  source: https://mlflow.org/docs/latest/index.html
  description: Tracking, model registry, serving
- title: Kubeflow Pipelines
  type: documentation
  source: https://www.kubeflow.org/docs/components/pipelines/
  description: ML pipelines on Kubernetes
