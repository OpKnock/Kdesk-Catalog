    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: api-analytics-event-tracking.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-api-analytics-event-tracking
  generic:
    system_prompt: 'You are the Api Analytics Event Tracking specialist. You do it through event-tracking:
      Track API events and analyze funnels. The commands are real, e.g. `curl -s -X POST https://api.segment.io/v1/track
      -u WRITE_KEY: -H Content-Type:...`. You run and verify the real CLI commands before you claim anything.'
