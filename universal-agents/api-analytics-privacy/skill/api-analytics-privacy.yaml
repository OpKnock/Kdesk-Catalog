name: api-analytics-privacy
version: 2.0.0
type: skill
category: sre
description: Privacy-preserving API analytics - anonymize PII with Presidio, aggregate without raw data,
  and comply with GDPR data minimization.
keywords:
- api-analytics
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: api-analytics-privacy.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-api-analytics-privacy
  generic:
    system_prompt: 'You take the Api Analytics Privacy seat. You do it through privacy-analytics: Anonymize
      PII and run privacy-safe aggregations. The commands are real, e.g. `pip install presidio-analyzer
      presidio-anonymizer`. You run and verify the real CLI commands before you claim anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: privacy-analytics
  description: Anonymize PII and run privacy-safe aggregations
  commands:
  - pip install presidio-analyzer presidio-anonymizer
  - presidio-analyzer --text 'Call me at 555-1234 or email alice@localhost'
  - presidio-anonymizer --analyzer_result /tmp/analysis.json --text 'alice@localhost called'
  - python anonymize.py --input events.jsonl --output events_safe.jsonl --entities EMAIL_ADDRESS,PHONE_NUMBER,CREDIT_CARD
  - curl -s http://localhost:8080/api/analytics/aggregate?dimension=country | jq '.rows | length'
  examples:
  - presidio-analyzer --text 'SSN 123-45-6789' --language en
  - python anonymize.py --input events.jsonl --output events_safe.jsonl --entities PERSON,EMAIL_ADDRESS
    --operator redact
  - curl -s http://localhost:8080/api/analytics/privacy/retention | jq '.days'
  parameters:
  - name: entities
    type: string
    description: Comma-separated PII entity types to remove
  - name: operator
    type: string
    description: redact, replace, or hash
  - name: input
    type: string
    description: Input events file
prerequisites:
- prometheus
- grafana
- elasticsearch
tools:
- prometheus
- grafana
- elasticsearch
- node.js
- python
examples:
- input: Anonymize analytics events before storage
  output: Runs Presidio over the event stream, strips EMAIL_ADDRESS/PHONE_NUMBER, and writes the safe
    dataset.
- input: Is my pipeline GDPR-clean?
  output: Audits event properties, applies anonymization, and confirms retention limits.
instructions: "# API Analytics (Privacy-preserving)\n\n## What this skill does\nRun analytics without\
  \ exposing personal data: detect and anonymize PII with Presidio before analytics pipelines, aggregate\
  \ on pseudonymous dimensions, and set retention policies.\n\n## When to use\n- Collecting analytics\
  \ containing emails, phones, or credit cards\n- GDPR / CCPA compliance for analytics\n- Sharing datasets\
  \ with partners\n\n## Real commands\n```bash\n# Install\npip install presidio-analyzer presidio-anonymizer\n\
  \n# Detect PII in text\npresidio-analyzer --text 'Call me at 555-1234 or email alice@example.com'\n\n\
  # Anonymize a stream\npython anonymize.py --input events.jsonl \\\n  --output events_safe.jsonl \\\n\
  \  --entities EMAIL_ADDRESS,PHONE_NUMBER,CREDIT_CARD\n\n# Redact instead of replace\npython anonymize.py\
  \ --input events.jsonl \\\n  --output events_safe.jsonl \\\n  --entities PERSON,EMAIL_ADDRESS --operator\
  \ redact\n\n# Aggregates only on safe dimensions\ncurl -s 'http://localhost:8080/api/analytics/aggregate?dimension=country'\
  \ | jq '.rows | length'\n\n# Check retention config\ncurl -s http://localhost:8080/api/analytics/privacy/retention\
  \ | jq '.days'\n```\n\n## Anonymization strategies\n- redact: remove the value\n- replace: substitute\
  \ a placeholder\n- hash: SHA-256 pseudonymization (still linkable)\n- encrypt: reversible for support\
  \ use\n\n## Best practices\n- Anonymize before writing to analytics storage\n- Keep raw data in a locked\
  \ data lake with retention limits\n- Never send PII to third-party analytics vendors\n- Document the\
  \ legal basis for each event property\n\n## Testing\n```bash\npresidio-analyzer --text 'email alice@example.com'\
  \ | jq '.recognized_entities'\ncurl -s http://localhost:8080/api/analytics/privacy/retention | jq '.days'\n\
  ```"
display_name: Api Analytics Privacy
knowledge:
- title: Microsoft Presidio
  type: documentation
  source: https://microsoft.github.io/presidio/
  description: PII detection and anonymization toolkit
- title: GDPR Data Minimization
  type: documentation
  source: https://gdpr-info.eu/art-5-gdpr/
  description: Purpose limitation and data minimization principles
