name: api-analytics-streaming
version: 2.0.0
type: skill
category: sre
description: Real-time streaming API analytics with Kafka and ClickHouse - stream API events, aggregate
  with windowing, and query dashboards live.
keywords:
- api-analytics
- dashboards
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: api-analytics-streaming.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-api-analytics-streaming
  generic:
    system_prompt: 'You take the Api Analytics Streaming seat. You do it through streaming-analytics:
      Stream API events and run real-time aggregations. The commands are real, e.g. `kafka-topics.sh --bootstrap-server
      localhost:9092 --create --topic api-events...`. You answer with exact commands, not abstractions,
      and flag anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: streaming-analytics
  description: Stream API events and run real-time aggregations
  commands:
  - kafka-topics.sh --bootstrap-server localhost:9092 --create --topic api-events --partitions 6 --replication-factor
    1
  - kafka-console-producer.sh --bootstrap-server localhost:9092 --topic api-events < events.jsonl
  - kafka-console-consumer.sh --bootstrap-server localhost:9092 --topic api-events --from-beginning --max-messages
    5
  - docker run -d -p 8123:8123 -p 9000:9000 clickhouse/clickhouse-server
  - curl -s -X POST 'http://localhost:8123/?query=SELECT%20toStartOfMinute(time)%20as%20m,%20count()%20FROM%20api_events%20GROUP%20BY%20m%20ORDER%20BY%20m%20DESC%20LIMIT%205'
    | column -t
  examples:
  - kafka-console-consumer.sh --bootstrap-server localhost:9092 --topic api-events --property print.key=true
    --max-messages 10
  - curl -s 'http://localhost:8123/?query=SELECT%20status,%20count()%20FROM%20api_events%20WHERE%20time%20%3E%20now()-600%20GROUP%20BY%20status'
  - kafka-consumer-groups.sh --bootstrap-server localhost:9092 --group analytics --describe
  parameters:
  - name: topic
    type: string
    description: Kafka topic for events
  - name: query
    type: string
    description: SQL against ClickHouse
  - name: window
    type: string
    description: Window function, e.g. toStartOfMinute
prerequisites:
- prometheus
- grafana
- elasticsearch
tools:
- prometheus
- grafana
- elasticsearch
- node.js
- python
examples:
- input: Stream API events and count per minute
  output: Creates the topic, produces sample events, inserts into ClickHouse, and runs the windowed query.
- input: Check consumer lag
  output: Runs kafka-consumer-groups --describe for the analytics group.
instructions: "# API Analytics (Real-time Streaming)\n\n## What this skill does\nStream API events in\
  \ real time: produce events to Kafka, ingest into ClickHouse, and query windowed aggregations for live\
  \ dashboards.\n\n## When to use\n- Live dashboards with second-level freshness\n- High-volume event\
  \ ingestion (millions/day)\n- Time-series analysis with SQL\n\n## Real commands\n```bash\n# Create the\
  \ topic\nkafka-topics.sh --bootstrap-server localhost:9092 \\\n  --create --topic api-events --partitions\
  \ 6 --replication-factor 1\n\n# Produce events from a JSONL file\nkafka-console-producer.sh --bootstrap-server\
  \ localhost:9092 --topic api-events < events.jsonl\n\n# Verify consumption\nkafka-console-consumer.sh\
  \ --bootstrap-server localhost:9092 \\\n  --topic api-events --from-beginning --max-messages 5\n\n#\
  \ Start ClickHouse\ndocker run -d -p 8123:8123 -p 9000:9000 clickhouse/clickhouse-server\n\n# Create\
  \ the events table\ncurl -s -X POST 'http://localhost:8123/?query=CREATE%20TABLE%20IF%20NOT%20EXISTS%20api_events%20(time%20DateTime,%20endpoint%20String,%20status%20UInt16)%20ENGINE%3DMergeTree%20ORDER%20BY%20time'\n\
  \n# Events per minute, last rows\ncurl -s -X POST 'http://localhost:8123/?query=SELECT%20toStartOfMinute(time)%20as%20m,%20count()%20FROM%20api_events%20GROUP%20BY%20m%20ORDER%20BY%20m%20DESC%20LIMIT%205'\
  \ | column -t\n\n# Status distribution last 10 minutes\ncurl -s 'http://localhost:8123/?query=SELECT%20status,%20count()%20FROM%20api_events%20WHERE%20time%20%3E%20now()-600%20GROUP%20BY%20status'\n\
  ```\n\n## Pipeline\n```\nAPI -> Kafka (api-events) -> ClickHouse -> dashboards\n```\n\n## Best practices\n\
  - Partition by API key or endpoint for parallelism\n- Use MergeTree ordering by time for range scans\n\
  - Batch inserts (min 1000 rows) for throughput\n- Monitor consumer lag with kafka-consumer-groups\n\n\
  ## Testing\n```bash\nkafka-console-consumer.sh --bootstrap-server localhost:9092 --topic api-events\
  \ --max-messages 1\ncurl -s 'http://localhost:8123/?query=SELECT%20count()%20FROM%20api_events'\n```"
display_name: Api Analytics Streaming
knowledge:
- title: Kafka Documentation
  type: documentation
  source: https://kafka.apache.org/documentation/
  description: Topics, producers, consumers, and CLI tools
- title: ClickHouse Docs
  type: documentation
  source: https://clickhouse.com/docs
  description: SQL reference and time-series functions
