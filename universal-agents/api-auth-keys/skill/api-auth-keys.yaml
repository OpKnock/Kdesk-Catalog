name: api-auth-keys
version: 2.0.0
type: skill
category: security
description: API auth with API key management - generate secure keys, hash at rest, scope and rate-limit
  them, and rotate keys without downtime.
keywords:
- api-auth
- api-keys
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: api-auth-keys.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-api-auth-keys
  generic:
    system_prompt: 'This is your domain: Api Auth Keys. You do it through api-key-mgmt: Generate, hash,
      scope, and rotate API keys. The commands are real, e.g. `openssl rand -hex 32`. You answer with
      exact commands, not abstractions, and flag anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: api-key-mgmt
  description: Generate, hash, scope, and rotate API keys
  commands:
  - openssl rand -hex 32
  - node -e "const c=require('crypto');console.log(c.randomBytes(32).toString('hex'))"
  - node -e "const c=require('crypto');console.log(c.createHash('sha256').update(process.argv[1]).digest('hex'))"
    $KEY
  - 'curl -s -X POST http://localhost:8080/api/keys -H ''X-Admin-Key: $ADMIN'' -H ''Content-Type: application/json''
    -d ''{"name":"billing","scopes":["read:invoices"],"expires_at":"2025-01-01T00:00:00Z"}'' | jq ''{key,
    id}'''
  - curl -s http://localhost:8080/api/keys | jq '.keys[] | {id, name, last_used_at}'
  examples:
  - 'curl -s -X DELETE http://localhost:8080/api/keys/$ID -H ''X-Admin-Key: $ADMIN'' | jq ''.revoked'''
  - 'curl -s http://localhost:8080/api/keys/$ID/rotate -X POST -H ''X-Admin-Key: $ADMIN'' | jq ''{new_key,
    old_expires}'''
  - 'curl -s http://localhost:8080/api/orders -H ''X-API-Key: $KEY'' -o /dev/null -w ''%{http_code}'''
  parameters:
  - name: name
    type: string
    description: Human-readable key name
  - name: scopes
    type: array
    description: Permissions granted to the key
  - name: expires_at
    type: string
    description: Expiry timestamp for the key
prerequisites:
- node.js
- python
- jsonwebtoken
tools:
- node.js
- python
- jsonwebtoken
- passport
- keycloak
examples:
- input: Issue an API key for a partner with read-only access
  output: Generates a key, scopes it to read:invoices, returns it once, and stores only the hash.
- input: Rotate a compromised key
  output: Rotates with a grace window for the old key and revokes it after confirmation.
instructions: "# API Auth (API Keys)\n\n## What this skill does\nManage API keys for third-party access:\
  \ generate cryptographically secure keys, store only hashes, attach scopes and expiry, support rotation\
  \ and revocation.\n\n## When to use\n- Issuing keys to external partners\n- Replacing shared static\
  \ secrets\n- Enforcing per-key limits and scopes\n\n## Real commands\n```bash\n# Generate a strong key\n\
  openssl rand -hex 32\nnode -e \"const c=require('crypto');console.log(c.randomBytes(32).toString('hex'))\"\
  \n\n# Hash for storage (never store the raw key)\nnode -e \"const c=require('crypto');console.log(c.createHash('sha256').update(process.argv[1]).digest('hex'))\"\
  \ $KEY\n\n# Create a scoped key\ncurl -s -X POST http://localhost:8080/api/keys \\\n  -H 'X-Admin-Key:\
  \ $ADMIN' -H 'Content-Type: application/json' \\\n  -d '{\"name\":\"billing\",\"scopes\":[\"read:invoices\"\
  ],\"expires_at\":\"2025-01-01T00:00:00Z\"}' | jq '{key, id}'\n\n# List keys\ncurl -s http://localhost:8080/api/keys\
  \ | jq '.keys[] | {id, name, last_used_at}'\n\n# Rotate\ncurl -s -X POST http://localhost:8080/api/keys/$ID/rotate\
  \ -H 'X-Admin-Key: $ADMIN' | jq '{new_key, old_expires}'\n\n# Revoke\ncurl -s -X DELETE http://localhost:8080/api/keys/$ID\
  \ -H 'X-Admin-Key: $ADMIN' | jq '.revoked'\n\n# Use it\ncurl -s http://localhost:8080/api/orders -H\
  \ 'X-API-Key: $KEY' -o /dev/null -w '%{http_code}'\n```\n\n## Key formats\n- `sk_live_` prefix + 32+\
  \ random bytes (industry standard)\n- Show the raw key exactly once at creation\n\n## Best practices\n\
  - Hash with SHA-256 before storing (plus optional HMAC pepper)\n- Require scopes; default to least privilege\n\
  - Set expiry on all keys; auto-rotate yearly\n- On rotation, accept the old key for a grace window\n\
  \n## Testing\n```bash\ncurl -s http://localhost:8080/api/orders -H 'X-API-Key: bad-key' -o /dev/null\
  \ -w '%{http_code}\\n'\ncurl -s http://localhost:8080/api/keys/$ID/rotate -X POST -H 'X-Admin-Key: $ADMIN'\
  \ | jq\n```"
display_name: Api Auth Keys
knowledge:
- title: Stripe API Key Best Practices
  type: documentation
  source: https://docs.stripe.com/keys
  description: Restricted keys, rotation, and leakage response
- title: API Key in OpenAPI
  type: documentation
  source: https://swagger.io/docs/specification/authentication/api-keys/
  description: Modeling API key auth in OpenAPI
