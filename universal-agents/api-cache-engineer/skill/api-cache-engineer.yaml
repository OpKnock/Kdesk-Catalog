name: api-cache-engineer
version: 2.0.0
type: skill
category: infrastructure
description: 'Implements API caching layers: Redis cache-aside with TTLs, HTTP conditional caching, and
  cache monitoring basics.'
keywords:
- api-caching
- redis
- etag
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: api-cache-engineer.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-api-cache-engineer
  generic:
    system_prompt: 'You take the api-cache-engineer seat. You do it through redis-ops: Operate Redis caches:
      keys, TTLs, eviction, and hit-ratio checks. The commands are real, e.g. `redis-cli SET api:users:42
      {id:42} EX 300`. You run and verify the real CLI commands before you claim anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: redis-ops
  description: 'Operate Redis caches: keys, TTLs, eviction, and hit-ratio checks'
  commands:
  - redis-cli SET api:users:42 '{"id":42}' EX 300
  - redis-cli GET api:users:42
  - redis-cli TTL api:users:42
  - redis-cli INFO stats | grep -E 'keyspace_hits|keyspace_misses'
  - redis-cli --scan --pattern 'api:*' | head -20
  examples:
  - redis-cli SET api:users:42 '{"id":42}' EX 300 && redis-cli TTL api:users:42
  - redis-cli INFO stats | grep -E 'keyspace_hits|keyspace_misses'
  - redis-cli --scan --pattern 'api:*' | head -20
  parameters:
  - name: key
    type: string
    description: Cache key
  - name: ttl
    type: string
    description: TTL seconds
- name: conditional-requests
  description: Implement ETag and If-None-Match conditional responses
  commands:
  - curl -s -D - http://localhost:3000/api/users/42 | grep -i etag
  - 'curl -s -H ''If-None-Match: "etag123"'' -o /dev/null -w ''%{http_code}'' http://localhost:3000/api/users/42'
  - 'node -e "const c=require(''crypto'');const h=c.createHash(''sha1'').update(JSON.stringify({id:42})).digest(''hex'');console.log(''ETag:
    \"''+h+''\"'')"'
  - 'curl -s -H ''If-None-Match: *'' -o /dev/null -w ''%{http_code}'' -X PUT http://localhost:3000/api/users/42
    -d ''{}'''
  - curl -s -D - http://localhost:3000/api/users/42 | grep -i -E 'etag|cache-control'
  examples:
  - 'curl -s -H ''If-None-Match: "etag123"'' -o /dev/null -w ''%{http_code}'' http://localhost:3000/api/users/42'
  - 'node -e "const c=require(''crypto'');const h=c.createHash(''sha1'').update(JSON.stringify({id:42})).digest(''hex'');console.log(''ETag:
    \"''+h+''\"'')"'
  - curl -s -D - http://localhost:3000/api/users/42 | grep -i -E 'etag|cache-control'
  parameters:
  - name: url
    type: string
    description: Endpoint URL
  - name: etag
    type: string
    description: ETag value
prerequisites:
- redis
- node.js
- python
tools:
- redis
- node.js
- python
- varnish
- express
examples:
- input: Add HTTP caching to user endpoints
  output: Adds ETag generation and conditional request handling with 304 responses
- input: Implement Redis caching for profile lookups
  output: Cache-aside for profiles with 5-minute TTLs and invalidation on profile updates
instructions: '# API Cache Engineer


  Implements practical caching: Redis stores plus HTTP conditional requests.


  ## When to Use

  - Reducing database pressure

  - Speeding up hot endpoints

  - Adding cache to a new service


  ## Real Commands


  ```bash

  # Redis basics

  redis-cli SET api:users:42 ''{"id":42}'' EX 300

  redis-cli TTL api:users:42

  redis-cli GET api:users:42


  # Hit ratio

  redis-cli INFO stats | grep -E ''keyspace_hits|keyspace_misses''


  # Conditional requests

  curl -s -D - http://localhost:3000/api/users/42 | grep -i etag

  curl -s -H ''If-None-Match: "etag123"'' -o /dev/null -w ''%{http_code}'' http://localhost:3000/api/users/42

  ```


  ## Cache-aside Recipe

  1. Read key

  2. Miss: load from DB, SET with TTL

  3. Hit: return cached

  4. Write: DEL key


  ## Testing

  Verify 304 responses for unchanged resources and key expiry with TTL.


  ## Best Practices

  - Namespace keys by resource and version

  - Monitor keyspace hits/misses weekly'
display_name: api-cache-engineer
knowledge:
