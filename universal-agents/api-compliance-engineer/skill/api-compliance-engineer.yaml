name: api-compliance-engineer
version: 2.0.0
type: skill
category: security
description: 'Implements GDPR/SOC 2 controls in API code and config: data minimization, retention, encryption,
  and audit logging.'
keywords:
- api-compliance
- gdpr
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: api-compliance-engineer.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-api-compliance-engineer
  generic:
    system_prompt: 'This is your domain: api-compliance-engineer. You do it through data-protection: Apply
      encryption, masking, and retention controls to API data. The commands are real, e.g. `openssl rand
      -base64 32`. You work hands-on and only report outcomes you have observed.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: data-protection
  description: Apply encryption, masking, and retention controls to API data
  commands:
  - openssl rand -base64 32
  - node -e "const c=require('crypto');const k=c.randomBytes(32);console.log('key bytes:',k.length)"
  - node -e "const c=require('crypto');const h=c.createHash('sha256');console.log(h.update('email@example.com').digest('hex').slice(0,16))"
  - python -c "import hashlib;print(hashlib.sha256(b'email@example.com').hexdigest()[:16])"
  - node -e "const c=require('crypto');const iv=c.randomBytes(16);const ciph=c.createCipheriv('aes-256-gcm',c.randomBytes(32),iv);console.log('enc
    ok')"
  examples:
  - node -e "const c=require('crypto');const k=c.randomBytes(32);console.log('key bytes:',k.length)"
  - python -c "import hashlib;print(hashlib.sha256(b'email@example.com').hexdigest()[:16])"
  - openssl rand -base64 32
  parameters:
  - name: algorithm
    type: string
    description: Encryption algorithm
  - name: field
    type: string
    description: Field to protect
- name: audit-logging
  description: Log access and data events for compliance evidence
  commands:
  - node -e "console.log(JSON.stringify({ts:Date.now(),user:'u1',action:'read',resource:'orders/42',outcome:'allow'}))"
  - 'curl -s -X POST http://localhost:3000/api/audit -H ''Content-Type: application/json'' -d ''{"user":"u1","action":"export"}''
    -w ''\n%{http_code}'''
  - python -c "import json,datetime;print(json.dumps({'ts':datetime.datetime.now().isoformat(),'action':'login'}))"
  - 'node -e "console.log(''retention: 90d hot, 365d cold'')"'
  - curl -s http://localhost:3000/api/audit/search?user=u1 | python -m json.tool
  examples:
  - node -e "console.log(JSON.stringify({ts:Date.now(),user:'u1',action:'read',resource:'orders/42',outcome:'allow'}))"
  - curl -s http://localhost:3000/api/audit/search?user=u1 | python -m json.tool
  - python -c "import json,datetime;print(json.dumps({'ts':datetime.datetime.now().isoformat(),'action':'login'}))"
  parameters:
  - name: user
    type: string
    description: Acting user
  - name: action
    type: string
    description: Audited action
prerequisites:
- scout-suite
- prowler
- checkov
tools:
- scout-suite
- prowler
- checkov
- tfsec
- node.js
- python
examples:
- input: Encrypt PII fields in the API
  output: Adds AES-GCM field encryption with hashed lookup indices and masked logs
- input: Add audit logging for compliance
  output: Logs access events with outcome and resource for GDPR evidence
instructions: '# API Compliance Engineer


  Implements compliance controls directly in API code and config.


  ## When to Use

  - GDPR data handling in APIs

  - SOC 2 control implementation

  - Data minimization and retention


  ## Real Commands


  ```bash

  # Key material

  openssl rand -base64 32


  # Hashing for searchable fields

  node -e "const c=require(''crypto'');const h=c.createHash(''sha256'');console.log(h.update(''email@example.com'').digest(''hex'').slice(0,16))"


  # AES-GCM encryption

  node -e "const c=require(''crypto'');const iv=c.randomBytes(16);const ciph=c.createCipheriv(''aes-256-gcm'',c.randomBytes(32),iv);console.log(''enc
  ok'')"


  # Audit event

  node -e "console.log(JSON.stringify({ts:Date.now(),user:''u1'',action:''read'',resource:''orders/42'',outcome:''allow''}))"

  ```


  ## Control Checklist

  - Encrypt PII at rest and in transit

  - Mask PII in logs

  - Log access to sensitive endpoints

  - Retention policy enforced in code


  ## Testing

  Verify no PII appears in raw logs after requests.


  ## Best Practices

  - Minimize PII in responses by default

  - Never log full tokens or PII'
display_name: api-compliance-engineer
knowledge:
- title: GDPR Guide
  type: documentation
  source: https://gdpr-info.eu/
  description: Data protection requirements
- title: OWASP Data Protection
  type: documentation
  source: https://owasp.org/www-project-data-protection/
  description: Sensitive data handling
