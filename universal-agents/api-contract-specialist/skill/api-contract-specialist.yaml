name: api-contract-specialist
version: 2.0.0
type: skill
category: testing
description: 'Deep expertise in contract testing at scale: multi-team Pact Broker workflows, version tags,
  and breaking-change policy.'
keywords:
- contract-testing
- pact
- openapi
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: api-contract-specialist.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-api-contract-specialist
  generic:
    system_prompt: 'Your lane is api-contract-specialist. You do it through broker-governance: Operate
      Pact Broker with tags, branches, and deploy gates across teams. The commands are real, e.g. `npx
      pact-broker publish ./pacts --consumer-version 1.0.0 --tag prod --broker-base-url...`. You prefer
      the shortest safe path, and you reproduce failures before diagnosing them.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: broker-governance
  description: Operate Pact Broker with tags, branches, and deploy gates across teams
  commands:
  - npx pact-broker publish ./pacts --consumer-version 1.0.0 --tag prod --broker-base-url http://localhost:9292
  - npx pact-broker can-i-deploy --pacticipant payments-service --version 2.1.0 --to prod --broker-base-url
    http://localhost:9292
  - npx pact-broker list-pacticipants --broker-base-url http://localhost:9292
  - npx pact-broker describe-version --pacticipant orders --version 3.0.0 --broker-base-url http://localhost:9292
  - npx pact-broker remove-all-pacticipant-versions --pacticipant legacy-service --broker-base-url http://localhost:9292
  examples:
  - npx pact-broker publish ./pacts --consumer-version 1.0.0 --tag prod --broker-base-url http://localhost:9292
  - npx pact-broker can-i-deploy --pacticipant payments-service --version 2.1.0 --to prod --broker-base-url
    http://localhost:9292
  - npx pact-broker list-pacticipants --broker-base-url http://localhost:9292
  parameters:
  - name: broker
    type: string
    description: Pact Broker base URL
  - name: participant
    type: string
    description: Pacticipant name
  - name: tag
    type: string
    description: Environment tag
- name: compatibility-policy
  description: Define and enforce breaking-change policy with diffs and can-i-deploy
  commands:
  - openapi-diff --fail-on-incompatible v1.yaml v2.yaml
  - npx pact-broker can-i-deploy --pacticipant consumer --latest --to prod --broker-base-url http://localhost:9292
  - openapi-generator validate -i v2.yaml
  - npx pact-broker matrix --consumer consumer --broker-base-url http://localhost:9292
  - git diff v1.yaml v2.yaml --stat
  examples:
  - openapi-diff --fail-on-incompatible v1.yaml v2.yaml
  - npx pact-broker matrix --consumer consumer --broker-base-url http://localhost:9292
  - npx pact-broker can-i-deploy --pacticipant consumer --latest --to prod --broker-base-url http://localhost:9292
  parameters:
  - name: oldSpec
    type: string
    description: Previous spec
  - name: newSpec
    type: string
    description: New spec
prerequisites:
- pact
- openapi
- node.js
- python
tools:
- pact
- openapi
- node.js
- python
- postman
examples:
- input: Roll out contract testing across 12 services
  output: Sets up a Pact Broker with tags, webhooks, and can-i-deploy gates in every pipeline
- input: Enforce a no-breaking-changes policy
  output: Adds openapi-diff checks on spec changes plus broker-based deploy gating
instructions: '# API Contract Specialist


  Runs contract testing as an organization-wide program.


  ## When to Use

  - Many consumer-provider pairs

  - Enforcing a no-breaking-changes policy

  - Building release confidence across teams


  ## Real Commands


  ```bash

  # Publish with environment tags

  npx pact-broker publish ./pacts --consumer-version 1.0.0 --tag prod --broker-base-url http://localhost:9292


  # Gate deployment

  npx pact-broker can-i-deploy --pacticipant payments-service --version 2.1.0 --to prod --broker-base-url
  http://localhost:9292


  # Compatibility matrix

  npx pact-broker matrix --consumer consumer --broker-base-url http://localhost:9292


  # Spec diff policy

  openapi-diff --fail-on-incompatible v1.yaml v2.yaml

  ```


  ## Policy Design

  - `can-i-deploy` is mandatory in every release

  - Tag every deploy environment

  - Webhook broker to notify providers of new pacts


  ## Testing

  Run can-i-deploy against the matrix in CI before promoting builds.


  ## Best Practices

  - One participant per service, one version per build

  - Never delete pacts blindly; archive with the matrix'
display_name: api-contract-specialist
knowledge:
- title: Pact Broker Docs
  type: documentation
  source: https://docs.pact.io/pact_broker/
  description: Tags, matrices, webhooks, can-i-deploy
- title: openapi-diff
  type: documentation
  source: https://github.com/OpenAPITools/openapi-diff
  description: API diff tooling
