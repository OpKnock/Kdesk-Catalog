name: api-documentation-engineer
version: 2.0.0
type: skill
category: backend
description: 'Implements docs-as-code for APIs: OpenAPI authoring, Redoc builds, mock servers, and SDK
  generation from specs.'
keywords:
- api-documentation
- openapi
- swagger
- redoc
- sdk-generation
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: api-documentation-engineer.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-api-documentation-engineer
  generic:
    system_prompt: 'This is your domain: api-documentation-engineer. You do it through docs-as-code: Author
      specs in Git, validate, bundle, and build interactive docs. The commands are real, e.g. `npm install
      -g redoc-cli`. You verify each step you report and stay honest about what you have not run.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: docs-as-code
  description: Author specs in Git, validate, bundle, and build interactive docs
  commands:
  - npm install -g redoc-cli
  - redoc-cli build openapi.yaml -o public/index.html
  - redoc-cli bundle openapi.yaml -o bundled.yaml
  - swagger-cli validate openapi.yaml
  - redoc-cli serve openapi.yaml
  examples:
  - redoc-cli build openapi.yaml -o public/index.html
  - swagger-cli validate openapi.yaml && redoc-cli build openapi.yaml -o public/index.html
  - redoc-cli serve openapi.yaml -p 8090
  parameters:
  - name: spec
    type: string
    description: OpenAPI spec path
  - name: output
    type: string
    description: HTML output path
- name: mock-and-sdk
  description: Stand up mock servers and generate SDKs from the spec
  commands:
  - npm install -g @stoplight/prism-cli
  - prism mock openapi.yaml -p 4010
  - openapi-generator generate -i openapi.yaml -g typescript-fetch -o sdk/ts
  - openapi-generator generate -i openapi.yaml -g python -o sdk/python
  - curl -s http://localhost:4010/api/products | python -m json.tool
  examples:
  - prism mock openapi.yaml -p 4010 & curl -s http://localhost:4010/api/products | python -m json.tool
  - openapi-generator generate -i openapi.yaml -g typescript-fetch -o sdk/ts
  - openapi-generator generate -i openapi.yaml -g python --package-name store_api -o sdk/python
  parameters:
  - name: port
    type: string
    description: Mock server port
  - name: generator
    type: string
    description: SDK generator name
prerequisites:
- swagger-cli
- redoc-cli
- openapi-generator
tools:
- swagger-cli
- redoc-cli
- openapi-generator
- stoplight-studio
- postman
examples:
- input: Generate OpenAPI spec from the Express API
  output: Extracts and validates the spec, builds Redoc HTML, and generates TS/Python SDKs
- input: Create interactive docs with try-it-out
  output: Deploys Redoc with prism-powered examples so developers can test endpoints from the docs
instructions: '# API Documentation Engineer


  Implements a docs-as-code pipeline: spec in Git, docs generated in CI.


  ## When to Use

  - Keeping docs in sync with code

  - Shipping interactive docs fast

  - Generating SDKs alongside docs


  ## Real Commands


  ```bash

  # Build docs

  npm install -g redoc-cli

  redoc-cli build openapi.yaml -o public/index.html


  # Serve locally

  redoc-cli serve openapi.yaml -p 8090


  # Mock server

  npm install -g @stoplight/prism-cli

  prism mock openapi.yaml -p 4010

  curl -s http://localhost:4010/api/products | python -m json.tool


  # SDKs

  openapi-generator generate -i openapi.yaml -g typescript-fetch -o sdk/ts

  openapi-generator generate -i openapi.yaml -g python --package-name store_api -o sdk/python

  ```


  ## CI Pipeline

  1. Validate spec

  2. Build HTML

  3. Generate SDKs

  4. Publish to docs site


  ## Testing

  Walk through the mock endpoints matching each documented example.


  ## Best Practices

  - Never hand-edit generated HTML or SDKs

  - Review spec diffs in PRs'
display_name: api-documentation-engineer
knowledge:
- title: redoc-cli
  type: documentation
  source: https://github.com/Redocly/redoc/blob/master/cli/README.md
  description: Build and bundle docs from OpenAPI
- title: Prism CLI
  type: documentation
  source: https://meta.stoplight.io/docs/prism
  description: Mock and proxy servers
