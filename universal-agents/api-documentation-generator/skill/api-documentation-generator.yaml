name: api-documentation-generator
version: 2.0.0
type: skill
category: backend
description: 'Automates documentation generation: extracts OpenAPI from code, bundles specs, builds static
  sites, and publishes in CI.'
keywords:
- api-documentation
- openapi
- swagger
- redoc
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: api-documentation-generator.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-api-documentation-generator
  generic:
    system_prompt: 'You own api-documentation-generator end to end. You do it through spec-extraction:
      Extract OpenAPI specs from code with decorators and tooling. The commands are real, e.g. `npm install
      @nestjs/swagger`. You answer with exact commands, not abstractions, and flag anything you have not
      verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: spec-extraction
  description: Extract OpenAPI specs from code with decorators and tooling
  commands:
  - npm install @nestjs/swagger
  - npm install swagger-autogen
  - node -e "const a=require('swagger-autogen')();console.log(typeof a)"
  - pip install fastapi && python -c "from fastapi.openapi.utils import get_openapi;print('fastapi openapi
    ready')"
  - node -e "console.log('swagger-autogen -o ./swagger.json')"
  examples:
  - npm install swagger-autogen && node -e "const a=require('swagger-autogen')();console.log(typeof a)"
  - pip install fastapi && python -c "from fastapi.openapi.utils import get_openapi;print('fastapi openapi
    ready')"
  - npm install @nestjs/swagger
  parameters:
  - name: framework
    type: string
    description: FastAPI, NestJS, Express
  - name: output
    type: string
    description: Spec output path
- name: publish-pipeline
  description: Build and publish documentation sites in CI
  commands:
  - npx @redocly/cli bundle openapi.yaml -o dist/bundled.yaml
  - npx @redocly/cli build-docs dist/bundled.yaml -o dist/index.html
  - npx @redocly/cli lint dist/bundled.yaml
  - npm install -g docusaurus
  - npx docusaurus build
  examples:
  - npx @redocly/cli bundle openapi.yaml -o dist/bundled.yaml && npx @redocly/cli build-docs dist/bundled.yaml
    -o dist/index.html
  - npx @redocly/cli lint dist/bundled.yaml
  - npm install -g docusaurus && npx docusaurus build
  parameters:
  - name: spec
    type: string
    description: Source OpenAPI spec
  - name: outputDir
    type: string
    description: Static site output
prerequisites:
- swagger-cli
- redoc-cli
- openapi-generator
- prism
tools:
- swagger-cli
- redoc-cli
- openapi-generator
- prism
- stoplight-studio
- postman
examples:
- input: Generate OpenAPI from the FastAPI service
  output: Exports the app's OpenAPI schema and builds a bundled Redoc site automatically
- input: Automate docs publishing in CI
  output: Adds a pipeline that lints, bundles, and deploys reference docs on each release
instructions: '# API Documentation Generator


  Automates docs from code to static site with zero hand-written reference content.


  ## When to Use

  - Docs drift from code constantly

  - Reference docs must be generated

  - Publishing docs in CI


  ## Real Commands


  ```bash

  # Extract from FastAPI

  python -c "from fastapi.openapi.utils import get_openapi;print(''fastapi openapi ready'')"


  # Extract from Express

  npm install swagger-autogen


  # Bundle and lint

  npx @redocly/cli bundle openapi.yaml -o dist/bundled.yaml

  npx @redocly/cli lint dist/bundled.yaml


  # Build site

  npx @redocly/cli build-docs dist/bundled.yaml -o dist/index.html

  npm install -g docusaurus && npx docusaurus build

  ```


  ## CI Flow

  1. Extract spec from code

  2. Lint and bundle

  3. Build reference pages

  4. Publish to hosting


  ## Testing

  Compare generated docs against the running API automatically.


  ## Best Practices

  - Generation in CI on every merge

  - Keep hand-written guides separate from generated reference'
display_name: api-documentation-generator
knowledge:
- title: swagger-autogen
  type: documentation
  source: https://github.com/davibaltar/swagger-autogen
  description: Generate specs from Express routes
- title: FastAPI OpenAPI
  type: documentation
  source: https://fastapi.tiangolo.com/advanced/openapi-callbacks/
  description: Automatic OpenAPI from Python
- title: Docusaurus
  type: documentation
  source: https://docusaurus.io/docs
  description: Static docs site generator
