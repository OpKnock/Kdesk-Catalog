name: api-error-engineer
version: 2.0.0
type: skill
category: backend
description: 'Implements consistent API error handling: RFC 9457 problem details middleware, error codes,
  and OpenAPI error documentation.'
keywords:
- error-codes
- error-documentation
- problem-details
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: api-error-engineer.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-api-error-engineer
  generic:
    system_prompt: 'You own api-error-engineer end to end. You do it through error-middleware: Build error-handling
      middleware with structured problem details responses. The commands are real, e.g. `npm install http-errors`.
      You verify each step you report and stay honest about what you have not run.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: error-middleware
  description: Build error-handling middleware with structured problem details responses
  commands:
  - npm install http-errors
  - npm install express-async-errors
  - curl -s http://localhost:3000/api/users/999 | python -m json.tool
  - 'curl -s -X POST http://localhost:3000/api/users -H ''Content-Type: application/json'' -d ''{}'' -w
    ''\n%{http_code}'''
  - node -e "console.log(require('http-errors').createError(404, 'User not found'))"
  examples:
  - curl -s http://localhost:3000/api/users/999 | python -m json.tool
  - 'curl -s -X POST http://localhost:3000/api/users -H ''Content-Type: application/json'' -d ''{}'' -w
    ''status=%{http_code}\n'''
  - node -e "console.log(JSON.stringify(require('http-errors').createError(422, 'Validation failed')))"
  parameters:
  - name: status
    type: string
    description: HTTP status code
  - name: code
    type: string
    description: Domain error code
- name: error-docs
  description: Document error responses in OpenAPI with reusable schemas and examples
  commands:
  - swagger-cli validate openapi.yaml
  - redocly lint openapi.yaml
  - curl -s http://localhost:3000/api/docs -o /dev/null -w '%{http_code}'
  - openapi-generator validate -i openapi.yaml
  - npx @stoplight/spectral-cli lint openapi.yaml
  examples:
  - swagger-cli validate openapi.yaml && redocly lint openapi.yaml
  - npx @stoplight/spectral-cli lint --ruleset error-docs.yaml openapi.yaml
  - openapi-generator validate -i openapi.yaml
  parameters:
  - name: spec
    type: string
    description: OpenAPI spec path
prerequisites:
- node.js
- python
- openapi
tools:
- node.js
- python
- openapi
- postman
- swagger-ui
examples:
- input: Design error format for a REST API
  output: Rolls out RFC 9457 problem details across all endpoints with domain error codes
- input: Add error documentation
  output: Adds reusable error schemas with per-code examples to the OpenAPI spec
instructions: '# API Error Engineer


  Implements standardized, documented, and observable error handling for APIs.


  ## When to Use

  - Inconsistent error bodies across endpoints

  - Stack traces leaking to clients

  - Building error catalogs


  ## Real Commands


  ```bash

  # Install middleware deps

  npm install http-errors express-async-errors


  # Reproduce error responses

  curl -s http://localhost:3000/api/users/999 | python -m json.tool

  curl -s -X POST http://localhost:3000/api/users -H ''Content-Type: application/json'' -d ''{}'' -w ''\n%{http_code}''


  # Validate docs include errors

  swagger-cli validate openapi.yaml

  redocly lint openapi.yaml

  ```


  ## Problem Details Shape


  ```json

  {"type":"https://api.example.com/errors/user-not-found","title":"User not found","status":404,"code":"USER_NOT_FOUND","instance":"/api/users/999"}

  ```


  ## Testing

  Assert on status, code, and title for every documented error in automated tests.


  ## Best Practices

  - Never leak stack traces to clients

  - One `code` per failure mode

  - Document each code in OpenAPI'
display_name: api-error-engineer
knowledge:
- title: RFC 9457 Problem Details
  type: documentation
  source: https://www.rfc-editor.org/rfc/rfc9457
  description: Standard error format for HTTP APIs
- title: http-errors
  type: documentation
  source: https://github.com/jshttp/http-errors
  description: Create HTTP errors in Node
- title: FastAPI Exception Handling
  type: documentation
  source: https://fastapi.tiangolo.com/tutorial/handling-errors/
  description: Python error handlers
