name: api-error-express-middleware
version: 2.0.0
type: skill
category: backend
description: 'Implements error handling middleware for Express and FastAPI: centralized handlers, logging,
  and consistent responses.'
keywords:
- api-errors
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: api-error-express-middleware.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-api-error-express-middleware
  generic:
    system_prompt: 'You take the Api Error Express Middleware seat. You do it through express-middleware:
      Add centralized error middleware to Express APIs. The commands are real, e.g. `npm install http-errors`.
      You work hands-on and only report outcomes you have observed.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: express-middleware
  description: Add centralized error middleware to Express APIs
  commands:
  - npm install http-errors
  - node -e "const h=require('http-errors');const e=h(404,'missing');console.log(e.status,e.message)"
  - npm install express-async-errors
  - node -e "require('express-async-errors');console.log('async handlers patched')"
  - curl -s http://localhost:3000/api/boom -w '\n%{http_code}'
  examples:
  - node -e "const h=require('http-errors');const e=h(422,'bad input',{code:'VALIDATION_1001'});console.log(e.status,e.expose)"
  - curl -s http://localhost:3000/api/boom -w '\n%{http_code}'
  - npm install http-errors express-async-errors
  parameters:
  - name: status
    type: string
    description: HTTP status
  - name: code
    type: string
    description: Error code
- name: fastapi-handlers
  description: Register exception handlers in FastAPI with consistent bodies
  commands:
  - pip install fastapi
  - python -c "from fastapi import FastAPI,HTTPException;print(HTTPException(status_code=404,detail='missing'))"
  - python -c "import uvicorn;print('uvicorn ok')"
  - curl -s http://localhost:8000/api/missing -w '\n%{http_code}'
  - python -c "from fastapi.responses import JSONResponse;r=JSONResponse({'detail':'x'},status_code=400);print(r.status_code)"
  examples:
  - python -c "from fastapi import HTTPException;print(HTTPException(status_code=422,detail={'code':'VALIDATION_1001'}))"
  - curl -s http://localhost:8000/api/missing -w '\n%{http_code}'
  - python -c "from fastapi.responses import JSONResponse;print(JSONResponse({'detail':'x'},400).status_code)"
  parameters:
  - name: status
    type: string
    description: HTTP status code
  - name: detail
    type: string
    description: Error detail
prerequisites:
- node.js
- python
- openapi
tools:
- node.js
- python
- openapi
- postman
examples:
- input: Standardize error responses in Express
  output: Adds centralized error middleware returning consistent JSON with codes and statuses
- input: Handle errors in FastAPI
  output: Registers exception handlers that serialize problem details for all 4xx/5xx
instructions: "# API Error (Implementation)\n\nImplements centralized error handling in Node and Python\
  \ APIs.\n\n## When to Use\n- Errors returned ad hoc from handlers\n- Stack traces leaking in responses\n\
  - Adding structured error logging\n\n## Real Commands\n\n```bash\n# Express\nnpm install http-errors\
  \ express-async-errors\nnode -e \"const h=require('http-errors');const e=h(422,'bad input');console.log(e.status)\"\
  \n\n# FastAPI\npython -c \"from fastapi import HTTPException;print(HTTPException(status_code=422,detail={'code':'VALIDATION_1001'}))\"\
  \n\n# Probe\ncurl -s http://localhost:3000/api/boom -w '\\n%{http_code}'\n```\n\n## Middleware Shape\n\
  \n```js\napp.use((err, req, res, next) => {\n  res.status(err.status || 500).json({\n    code: err.code\
  \ || 'INTERNAL',\n    title: err.message,\n    status: err.status || 500,\n    instance: req.originalUrl\n\
  \  });\n});\n```\n\n## Testing\nAssert every route returns the same error body shape.\n\n## Best Practices\n\
  - Log the stack, never expose it\n- Map unknown errors to 500 with INTERNAL code"
display_name: Api Error Express Middleware
knowledge:
- title: Express Error Handling
  type: documentation
  source: https://expressjs.com/en/guide/error-handling.html
  description: Error middleware in Express
- title: FastAPI Errors
  type: documentation
  source: https://fastapi.tiangolo.com/tutorial/handling-errors/
  description: Exception handlers in FastAPI
