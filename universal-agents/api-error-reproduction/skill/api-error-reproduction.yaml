name: api-error-reproduction
version: 2.0.0
type: skill
category: backend
description: 'Troubleshoots API error issues: reproduce failures, trace error flows, correlate with releases,
  and fix root causes.'
keywords:
- api-error-reproduction
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: api-error-reproduction.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-api-error-reproduction
  generic:
    system_prompt: 'You work Api Error Reproduction hands-on. You do it through error-reproduction: Reproduce
      error conditions with curl and scenario payloads. The commands are real, e.g. `curl -s -X POST http://localhost:3000/api/users
      -H Content-Type: application/json -d...`. You verify each step you report and stay honest about
      what you have not run.'
    available_tools:
