    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: error-reproduction
  description: Reproduce error conditions with curl and scenario payloads
  commands:
  - 'curl -s -X POST http://localhost:3000/api/users -H ''Content-Type: application/json'' -d ''{"email":"bad"}''
    -w ''\n%{http_code}'''
  - curl -s http://localhost:3000/api/users/999999 -w '\n%{http_code}'
  - 'curl -s -X PUT http://localhost:3000/api/users/1 -H ''Content-Type: application/json'' -d ''{"email":"x@y.z"}''
    -w ''\n%{http_code}'''
  - curl -s -X DELETE http://localhost:3000/api/users/1 -w '\n%{http_code}'
  - 'curl -s -H ''Authorization: Bearer invalid'' http://localhost:3000/api/me -w ''\n%{http_code}'''
  examples:
  - 'curl -s -X POST http://localhost:3000/api/users -H ''Content-Type: application/json'' -d ''{"email":"bad"}''
    -w ''\n%{http_code}'''
  - curl -s http://localhost:3000/api/users/999999 -w '\n%{http_code}'
  - 'curl -s -H ''Authorization: Bearer invalid'' http://localhost:3000/api/me -w ''\n%{http_code}'''
  parameters:
  - name: url
    type: string
    description: Endpoint to probe
  - name: method
    type: string
    description: HTTP method
- name: log-analysis
  description: Correlate errors in logs and metrics to find root causes
  commands:
  - node -e "console.log('trace_id=abc123 err=DB_TIMEOUT op=users.list')"
  - curl -s http://localhost:3000/metrics | grep -E 'http_errors|http_error_total' | head
  - kubectl logs -l app=api --tail=200 | grep -iE 'error|exception' | tail -20
  - node -e "const r=require('os');console.log('pid',process.pid,'load',r.loadavg()[0])"
  - curl -s http://localhost:3000/health -w '\n%{http_code}'
  examples:
  - kubectl logs -l app=api --tail=200 | grep -iE 'error|exception' | tail -20
  - curl -s http://localhost:3000/metrics | grep -E 'http_errors|http_error_total' | head
  - curl -s http://localhost:3000/health -w '\n%{http_code}'
  parameters:
  - name: pattern
    type: string
    description: Log filter pattern
  - name: lines
    type: string
    description: Number of log lines
prerequisites:
- node.js
- python
- openapi
tools:
- node.js
- python
- openapi
- postman
examples:
- input: Investigate a 500 spike after the latest deploy
  output: Reproduces failing requests, greps logs for the stack trace, and correlates the error rate with
    the release window
- input: Fix inconsistent error bodies across endpoints
  output: Reproduces each shape, unifies the middleware, and adds regression tests per status
instructions: '# API Error (Troubleshooting)


  Diagnoses and fixes error-handling problems in running APIs.


  ## When to Use

  - Unexplained 5xx spikes

  - Inconsistent error bodies in production

  - Errors only appear after deploys


  ## Real Commands


  ```bash

  # Reproduce

  curl -s -X POST http://localhost:3000/api/users -H ''Content-Type: application/json'' -d ''{"email":"bad"}''
  -w ''\n%{http_code}''

  curl -s http://localhost:3000/api/users/999999 -w ''\n%{http_code}''


  # Logs

  kubectl logs -l app=api --tail=200 | grep -iE ''error|exception'' | tail -20


  # Metrics

  curl -s http://localhost:3000/metrics | grep -E ''http_errors|http_error_total'' | head


  # Health

  curl -s http://localhost:3000/health -w ''\n%{http_code}''

  ```


  ## Root Cause Checklist

  - Is the error body consistent? (format issue)

  - When did the spike start? (release correlation)

  - Is a dependency failing? (timeouts/upstream)


  ## Testing

  Turn each reproduction into an automated regression test.


  ## Best Practices

  - Add trace IDs to every error response

  - Alert on rate deltas, not raw counts'
display_name: Api Error Reproduction
knowledge:
- title: kubectl Logs
  type: documentation
