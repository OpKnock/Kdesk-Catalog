name: api-error-specialist
version: 2.0.0
type: skill
category: backend
description: 'Deep expertise in API error handling: full error taxonomy, monitoring and alerting, and
  developer-facing error catalogs.'
keywords:
- api-errors
- error-codes
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: api-error-specialist.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-api-error-specialist
  generic:
    system_prompt: 'You take the api-error-specialist seat. You do it through error-taxonomy: Design a
      comprehensive error code taxonomy covering client, server, and integration failures. The commands
      are real, e.g. `node -e const t=[AUTH,VALIDATION,RATE,NOT_FOUND,CONFLICT,UPSTREAM,TIMEOUT];console.log(t.m...`.
      You verify each step you report and stay honest about what you have not run.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: error-taxonomy
  description: Design a comprehensive error code taxonomy covering client, server, and integration failures
  commands:
  - node -e "const t=['AUTH','VALIDATION','RATE','NOT_FOUND','CONFLICT','UPSTREAM','TIMEOUT'];console.log(t.map(c=>c+'_XXXX').join('\n'))"
  - python -c "import json;print(json.dumps({'prefix':'VALIDATION_','range':[1000,1999]}))"
  - curl -s http://localhost:3000/api/errors/schema | python -m json.tool
  - node -e "const codes=['VALIDATION_1001','VALIDATION_1002'];console.log(codes.length+' codes defined')"
  - python -c "print(' '.join(['%04d'%i for i in range(1000,1005)]))"
  examples:
  - node -e "const t=['AUTH','VALIDATION','RATE','NOT_FOUND','CONFLICT','UPSTREAM','TIMEOUT'];console.log(t.map(c=>c+'_XXXX').join('\n'))"
  - curl -s http://localhost:3000/api/errors/schema | python -m json.tool
  - node -e "const codes=require('./errors.json').map(e=>e.code);console.log(new Set(codes).size===codes.length?'no
    dups':'dups found')"
  parameters:
  - name: prefix
    type: string
    description: Error family prefix
  - name: schema
    type: string
    description: Error schema path
- name: error-monitoring
  description: Track error rates, correlate with deploys, and alert on regressions
  commands:
  - sentry-cli send-event -m 'test' --release 1.2.3
  - 'curl -s -X POST http://localhost:3000/api/monitor/errors -H ''Content-Type: application/json'' -d
    ''{"code":"TIMEOUT","count":42}'''
  - node -e "const r=require('os');console.log('uptime',r.uptime())"
  - curl -s http://localhost:3000/metrics | grep -E 'http_errors_total|http_error_rate'
  - sentry-cli releases list
  examples:
  - sentry-cli send-event -m 'manual test' --release 1.2.3
  - curl -s http://localhost:3000/metrics | grep error_rate | head
  - sentry-cli releases list | head -5
  parameters:
  - name: release
    type: string
    description: Release version
  - name: metric
    type: string
    description: Metric to query
prerequisites:
- node.js
- python
- openapi
tools:
- node.js
- python
- openapi
- postman
examples:
- input: Standardize error codes across teams
  output: Designs a prefixed taxonomy, validates uniqueness in CI, and publishes the catalog
- input: Set up error-rate alerting
  output: Exports error metrics, connects Sentry releases, and alerts on rate spikes after deploys
instructions: '# API Error Specialist


  Designs and operates a complete error program: taxonomy, monitoring, and developer experience.


  ## When to Use

  - Designing error strategy org-wide

  - Reducing mean-time-to-understand incidents

  - Standardizing cross-team error codes


  ## Real Commands


  ```bash

  # Draft taxonomy

  node -e "const t=[''AUTH'',''VALIDATION'',''RATE'',''NOT_FOUND'',''CONFLICT'',''UPSTREAM'',''TIMEOUT''];console.log(t.map(c=>c+''_XXXX'').join(''\n''))"


  # Verify no duplicate codes

  node -e "const codes=require(''./errors.json'').map(e=>e.code);console.log(new Set(codes).size===codes.length?''no
  dups'':''dups'')"


  # Ship a test event

  sentry-cli send-event -m ''manual test'' --release 1.2.3


  # Watch error metrics

  curl -s http://localhost:3000/metrics | grep error_rate | head

  ```


  ## Taxonomy Rules

  - Prefix by family: `VALIDATION_`, `UPSTREAM_`, `AUTH_`

  - Numeric suffix within family

  - One canonical meaning per code


  ## Monitoring

  Alert on error-rate deltas vs. baseline, not absolute counts.


  ## Best Practices

  - Every code has a doc entry and a remediation hint

  - Deprecate codes, never reuse'
display_name: api-error-specialist
knowledge:
- title: Sentry CLI
  type: documentation
  source: https://docs.sentry.io/cli/
  description: Events, releases, and monitoring
- title: RFC 9457
  type: documentation
  source: https://www.rfc-editor.org/rfc/rfc9457
  description: Problem details standard
- title: OpenTelemetry Errors
  type: documentation
  source: https://opentelemetry.io/docs/specs/otel/
  description: Semantic conventions for errors
