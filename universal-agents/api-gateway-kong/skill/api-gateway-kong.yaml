  commands:
  - 'curl -s -X POST http://localhost:8001/services/orders/routes -H ''Content-Type: application/json''
    -d ''{"paths":["/orders"]}'''
  - 'curl -s -X POST http://localhost:8001/services/orders/plugins -H ''Content-Type: application/json''
    -d ''{"name":"rate-limiting","config":{"minute":60}}'''
  - 'curl -s -X POST http://localhost:8001/services/orders/plugins -H ''Content-Type: application/json''
    -d ''{"name":"jwt"}'''
  - 'curl -s -X POST http://localhost:8001/services/orders/plugins -H ''Content-Type: application/json''
    -d ''{"name":"http-log","config":{"http_endpoint":"http://logs:8080"}}'''
  - curl -s http://localhost:8001/services/orders/plugins | python -m json.tool
  examples:
  - 'curl -s -X POST http://localhost:8001/services/orders/plugins -H ''Content-Type: application/json''
    -d ''{"name":"rate-limiting","config":{"minute":60}}'''
  - 'curl -s -X POST http://localhost:8001/services/orders/plugins -H ''Content-Type: application/json''
    -d ''{"name":"jwt"}'''
  - curl -s http://localhost:8001/services/orders/plugins | python -m json.tool
  parameters:
  - name: plugin
    type: string
    description: Plugin name
  - name: config
    type: string
    description: Plugin configuration JSON
