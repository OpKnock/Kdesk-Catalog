examples:
- input: Set up a Kong gateway for our services
  output: Deploys Kong, adds routes for orders and payments, and enables JWT auth plus rate limiting
- input: Add rate limiting per consumer
  output: Creates consumers, issues API keys, and applies rate-limiting plugins per consumer
instructions: '# API Gateway (Implementation)


  Deploys and operates Kong API gateways with declarative config.


  ## When to Use

  - Centralizing API entry points

  - Adding auth and rate limits without app changes

  - Multi-service routing


  ## Real Commands


  ```bash

  # Run Kong

  kong migrations bootstrap

  kong start

  docker run -d --name kong-gateway -p 8000:8000 -p 8001:8001 kong/kong-gateway


  # Declarative config

  deck ping

  kong config -c kong.yaml


  # Add a route

  curl -s -X POST http://localhost:8001/services/orders/routes -H ''Content-Type: application/json'' -d
  ''{"paths":["/orders"]}''


  # Plugins

  curl -s -X POST http://localhost:8001/services/orders/plugins -H ''Content-Type: application/json''
  -d ''{"name":"rate-limiting","config":{"minute":60}}''

  ```


  ## Testing

  Send requests through the gateway and verify 401/429 behavior after enabling plugins.


  ## Best Practices

  - Keep config in Git via deck sync

  - Enable rate limiting before going public

  - Use health checks on upstreams'
