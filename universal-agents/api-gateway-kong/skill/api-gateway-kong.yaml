  commands:
  - docker run -d --name kong-gateway -p 8000:8000 -p 8001:8001 kong/kong-gateway
  - deck ping
  - deck dump --output-file kong.yaml
  - deck sync --state kong.yaml
  - curl -s http://localhost:8001/status
