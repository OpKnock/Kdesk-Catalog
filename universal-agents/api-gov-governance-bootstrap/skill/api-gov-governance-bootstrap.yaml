  - name: extends
    type: string
    description: Base ruleset to extend
  - name: spec
    type: string
    description: Spec path
- name: style-guide-authoring
  description: Write and publish the API style guide that rules enforce
  commands:
  - mkdir -p docs/api-guide
  - node -e "const fs=require('fs');fs.writeFileSync('docs/api-guide/STYLE.md','# API Style Guide\n\n-
    Resources are plural nouns\n- Errors use RFC 9457\n')"
  - 'node -e "console.log(''naming: kebab-case paths'') "'
  - python -c "open('docs/api-guide/ERRORS.md','w').write('# Error Codes\n')"
  - git add docs/api-guide && git commit -m 'publish API style guide'
  examples:
  - node -e "const fs=require('fs');fs.writeFileSync('docs/api-guide/STYLE.md','# API Style Guide\n\n-
    Resources are plural nouns\n- Errors use RFC 9457\n')"
  - python -c "open('docs/api-guide/ERRORS.md','w').write('# Error Codes\n')"
  - git add docs/api-guide && git commit -m 'publish API style guide'
