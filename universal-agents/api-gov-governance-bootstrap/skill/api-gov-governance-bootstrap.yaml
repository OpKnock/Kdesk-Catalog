examples:
- input: Start enforcing API standards in our team
  output: Bootstraps Spectral with the OAS recommended set, publishes a short style guide, and adds a
    CI lint step
- input: Create a style guide doc for new endpoints
  output: Writes STYLE.md covering naming, errors, pagination, and versioning for team review
instructions: '# API Gov (Bootstrap)


  Stands up governance for a team or org that has none: baseline linting, a style guide, and a first CI
  gate.


  ## When to Use

  - No API standards exist yet

  - Teams ship inconsistent APIs

  - Starting governance incrementally


  ## Real Commands


  ```bash

  # Install

  npm install -g @stoplight/spectral-cli

  npx @stoplight/spectral-cli lint --version


  # Baseline lint

  npx @stoplight/spectral-cli lint --extends spectral:oas openapi.yaml


  # With project ruleset

  npx @stoplight/spectral-cli lint --extends spectral:oas --ruleset .spectral.yaml openapi.yaml

  ```


  ## Style Guide


  ```bash

  mkdir -p docs/api-guide

  python -c "open(''docs/api-guide/STYLE.md'',''w'').write(''# API Style Guide\n\n- Plural nouns for collections\n-
  RFC 9457 errors\n- Pagination via page/limit\n'')"

  ```


  ## First CI Gate

  Run the baseline lint in CI with `--fail-severity error`.


  ## Testing

  Fix or annotate existing violations before enabling the gate org-wide.


  ## Best Practices

  - Start with recommended rules; add custom ones later

  - Publish the guide where developers already read docs'
