    description: CI gate severity
prerequisites:
- spectral
- openapi
tools:
- spectral
- openapi
- node.js
- python
- stoplight-studio
examples:
- input: Design a governance program for the platform team
  output: Produces tiered ruleset architecture, per-domain rule docs, and an exception workflow
- input: Design review workflows for API changes
  output: Documents the lint-diff-review-approve flow with CI gate severities and waiver process
instructions: '# API Gov (Design)


  Designs the governance program before enforcing it: rules, tiers, and workflows.


  ## When to Use

  - Planning governance for many teams

  - Avoiding over-strict rule sets

  - Documenting review and waiver flows


  ## Real Commands


  ```bash

  # Layout

  mkdir -p rules/guides rules/functions tests/fixtures


  # Draft rule docs

  node -e "const fs=require(''fs'');fs.writeFileSync(''rules/guides/naming.yaml'',''# naming rules\n'')"


  # Fixtures for testing rules

  python -c "open(''tests/fixtures/bad.yaml'',''w'').write(''paths:\n  /BadPath:\n'')"


  # Exception process

  node -e "const fs=require(''fs'');fs.writeFileSync(''docs/EXCEPTIONS.md'',''# Exceptions\n\n1. Submit
  waiver PR\n2. Time-box 30 days\n'')"

  ```


  ## Design Decisions

  - Three tiers: recommended, org, strict

  - One rule doc per domain

  - Fixtures per rule for automated tests


  ## Workflow Design

  lint -> diff -> human review -> approve; waivers are PRs with expiry.


  ## Testing

  Validate every new rule against fixtures before rollout.


  ## Best Practices

  - Enforce incrementally: warn first, error later'
display_name: Api Gov Governance Design
