name: api-governance-specialist
version: 2.0.0
type: skill
category: backend
description: 'Deep expertise in API governance programs: enterprise rulesets, standards publication, and
  measuring compliance adoption.'
keywords:
- api-governance
- compliance
- standards
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: api-governance-specialist.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-api-governance-specialist
  generic:
    system_prompt: 'You are the api-governance-specialist specialist. You do it through enterprise-rulesets:
      Maintain layered rulesets with severity tiers and exception flows. The commands are real, e.g. `npx
      @stoplight/spectral-cli lint -r .spectral.yaml --format json openapi.yaml > report.json`. You verify
      each step you report and stay honest about what you have not run.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: enterprise-rulesets
  description: Maintain layered rulesets with severity tiers and exception flows
  commands:
  - npx @stoplight/spectral-cli lint -r .spectral.yaml --format json openapi.yaml > report.json
  - npx @stoplight/spectral-cli lint -r .spectral.yaml --ignore-unknown-formats openapi.yaml
  - python -c "import json;r=json.load(open('report.json'));print(len(r))"
  - node -e "const r=require('./report.json');const byRule={};r.forEach(x=>byRule[x.code]=(byRule[x.code]||0)+1);console.log(JSON.stringify(byRule,null,2))"
  - npx @stoplight/spectral-cli lint -r .spectral.yaml --fail-severity error openapi.yaml
  examples:
  - npx @stoplight/spectral-cli lint -r .spectral.yaml --format json openapi.yaml > report.json && node
    -e "const r=require('./report.json');console.log(r.length+' findings')"
  - node -e "const r=require('./report.json');const byRule={};r.forEach(x=>byRule[x.code]=(byRule[x.code]||0)+1);console.log(JSON.stringify(byRule,null,2))"
  - npx @stoplight/spectral-cli lint -r .spectral.yaml --fail-severity error openapi.yaml
  parameters:
  - name: ruleset
    type: string
    description: Layered ruleset file
  - name: spec
    type: string
    description: Spec to evaluate
- name: adoption-metrics
  description: Measure governance adoption across specs and report trends
  commands:
  - npx @stoplight/spectral-cli lint -r .spectral.yaml --format json specs/**/*.yaml > all.json
  - python -c "import json,glob;r=[];[r.extend(json.load(open(f))) for f in glob.glob('specs/*/*.json')]"
    2>/dev/null || echo 'aggregate manually'
  - node -e "const fs=require('fs');const files=fs.readdirSync('specs').filter(f=>f.endsWith('.yaml'));console.log(files.length+'
    specs')"
  - node -e "const fs=require('fs');fs.readdirSync('specs').forEach(f=>{if(f.endsWith('.yaml'))console.log(f)}"
  - python -c "print('compliance % = 100 - (violations / rules) * 100')"
  examples:
  - npx @stoplight/spectral-cli lint -r .spectral.yaml --format json specs/**/*.yaml > all.json
  - node -e "const fs=require('fs');const files=fs.readdirSync('specs').filter(f=>f.endsWith('.yaml'));console.log(files.length+'
    specs')"
  - python -c "import json;r=json.load(open('all.json'));print('violations:',len(r))"
  parameters:
  - name: specsDir
    type: string
    description: Directory of specs to measure
  - name: output
    type: string
    description: Aggregate report file
prerequisites:
- spectral
- openapi
- node.js
tools:
- spectral
- openapi
- node.js
- python
- stoplight-studio
examples:
- input: Enforce API standards across all services
  output: Rolls out layered rulesets and aggregates JSON reports to track violations per team
- input: Measure governance adoption over time
  output: Generates quarterly violation-per-spec metrics and publishes a compliance dashboard
instructions: '# API Governance Specialist


  Runs governance as a program with measurable adoption.


  ## When to Use

  - Governance across many teams and APIs

  - Need to prove standards adoption

  - Tiered enforcement (warn vs error)


  ## Real Commands


  ```bash

  # Aggregate findings

  npx @stoplight/spectral-cli lint -r .spectral.yaml --format json specs/**/*.yaml > all.json


  # Analyze by rule

  node -e "const r=require(''./all.json'');const byRule={};r.forEach(x=>byRule[x.code]=(byRule[x.code]||0)+1);console.log(JSON.stringify(byRule,null,2))"


  # Count specs

  node -e "const fs=require(''fs'');const files=fs.readdirSync(''specs'').filter(f=>f.endsWith(''.yaml''));console.log(files.length+''
  specs'')"

  ```


  ## Governance Model

  - Recommended tier: everyone

  - Org tier: enterprise conventions

  - Exception tier: documented waivers


  ## Testing

  Track violations-per-spec quarterly and publish the trend.


  ## Best Practices

  - Severity tiers keep momentum without blocking

  - Waivers must be time-boxed'
display_name: api-governance-specialist
knowledge:
- title: Spectral Rulesets
  type: documentation
  source: https://docs.stoplight.io/docs/spectral/reference/rules
  description: Rule anatomy and reuse
- title: API Guidelines Databases
  type: documentation
  source: https://github.com/apisyouwonthate/style-guides
  description: Collection of public API style guides
