  - npm install graphql-directive-auth
  - 'curl -s -X POST http://localhost:4000/graphql -H ''Content-Type: application/json'' -H ''Authorization:
    Bearer bad'' -d ''{"query":"{ me { id } }"}'''
  - node -e "const j=require('jsonwebtoken');console.log(j.sign({sub:'u1'},'s',{expiresIn:'1h'}))"
  examples:
  - node -e "const {expressjwt}=require('express-jwt');const m=expressjwt({secret:'s',algorithms:['HS256']});console.log(typeof
    m)"
  - 'curl -s -X POST http://localhost:4000/graphql -H ''Content-Type: application/json'' -H ''Authorization:
    Bearer bad'' -d ''{"query":"{ me { id } }"}'''
