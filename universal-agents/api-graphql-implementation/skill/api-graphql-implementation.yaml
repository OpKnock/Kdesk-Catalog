name: api-graphql-implementation
version: 2.0.0
type: skill
category: backend
description: 'Implements GraphQL APIs: Apollo Server setup, resolver wiring, schema authoring, and playground-based
  testing.'
keywords:
- graphql
- schema
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: api-graphql-implementation.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-api-graphql-implementation
  generic:
    system_prompt: 'You work Api Graphql Implementation hands-on. You do it through server-implementation:
      Stand up Apollo Server with resolvers and schema. The commands are real, e.g. `npm init -y && npm
      install @apollo/server graphql`. You run and verify the real CLI commands before you claim anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: server-implementation
  description: Stand up Apollo Server with resolvers and schema
  commands:
  - npm init -y && npm install @apollo/server graphql
  - node -e "const {ApolloServer}=require('@apollo/server');console.log(typeof ApolloServer)"
  - npm install @graphql-tools/load-files @graphql-tools/schema
  - node -e "const {makeExecutableSchema}=require('@graphql-tools/schema');console.log(typeof makeExecutableSchema)"
  - npm install graphql-tag
  examples:
  - npm init -y && npm install @apollo/server graphql
  - npm install @graphql-tools/load-files @graphql-tools/schema
  - node -e "const {makeExecutableSchema}=require('@graphql-tools/schema');console.log(typeof makeExecutableSchema)"
  parameters:
  - name: typeDefs
    type: string
    description: SDL type definitions
  - name: resolvers
    type: string
    description: Resolver map
- name: playground-testing
  description: Test queries and mutations via HTTP introspection
  commands:
  - 'curl -s -X POST http://localhost:4000/graphql -H ''Content-Type: application/json'' -d ''{"query":"{
    __schema { queryType { name } } }"}'''
  - 'curl -s -X POST http://localhost:4000/graphql -H ''Content-Type: application/json'' -d ''{"query":"{
    products { id name } }"}'''
  - 'curl -s -X POST http://localhost:4000/graphql -H ''Content-Type: application/json'' -d ''{"query":"mutation
    { createProduct(name:\"x\") { id } }"}'''
  - 'curl -s -X POST http://localhost:4000/graphql -H ''Content-Type: application/json'' -d ''{"query":"{
    products { id } }"}'' -w ''\n%{time_total}s'''
  - node -e "fetch('http://localhost:4000/graphql',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query:'{
    __typename }'})}).then(r=>r.json()).then(console.log)"
  examples:
  - 'curl -s -X POST http://localhost:4000/graphql -H ''Content-Type: application/json'' -d ''{"query":"{
    products { id name } }"}'''
  - 'curl -s -X POST http://localhost:4000/graphql -H ''Content-Type: application/json'' -d ''{"query":"{
    __schema { queryType { name } } }"}'''
  - node -e "fetch('http://localhost:4000/graphql',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query:'{
    __typename }'})}).then(r=>r.json()).then(console.log)"
  parameters:
  - name: endpoint
    type: string
    description: GraphQL endpoint URL
  - name: query
    type: string
    description: GraphQL query string
prerequisites:
- apollo-server
- graphql-codegen
- dataloader
tools:
- apollo-server
- graphql-codegen
- dataloader
- node.js
- python
examples:
- input: Build a GraphQL API for product catalog
  output: Stands up Apollo Server with Product schema, resolvers, and HTTP-tested queries and mutations
- input: Add a mutation with validation
  output: Implements createProduct with input checks and typed errors
instructions: '# API GraphQL (Implementation)


  Builds working GraphQL APIs with Apollo Server.


  ## When to Use

  - New GraphQL API for a service

  - Migrating a simple REST endpoint

  - Adding type safety to a backend


  ## Real Commands


  ```bash

  # Bootstrap

  npm init -y && npm install @apollo/server graphql


  # Load schema files

  npm install @graphql-tools/load-files @graphql-tools/schema


  # Test via HTTP

  curl -s -X POST http://localhost:4000/graphql -H ''Content-Type: application/json'' -d ''{"query":"{
  products { id name } }"}''


  # Introspect

  curl -s -X POST http://localhost:4000/graphql -H ''Content-Type: application/json'' -d ''{"query":"{
  __schema { queryType { name } } }"}''

  ```


  ## Schema First


  ```graphql

  type Product { id: ID!, name: String!, price: Float }

  type Query { products: [Product!]!, product(id: ID!): Product }

  type Mutation { createProduct(name: String!): Product }

  ```


  ## Testing

  Exercise queries, mutations, and error paths over HTTP.


  ## Best Practices

  - Validate inputs in mutations

  - Return nullable fields for optional data

  - Enable Apollo Studio in production'
