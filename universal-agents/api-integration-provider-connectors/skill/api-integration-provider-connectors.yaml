  and sandbox testing.'
keywords:
- api-integration
- third-party
- webhooks
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: api-integration-provider-connectors.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-api-integration-provider-connectors
  generic:
    system_prompt: 'This is your domain: Api Integration Provider Connectors. You do it through provider-connectors:
      Connect payment and messaging providers using their official CLIs and SDKs. The commands are real,
      e.g. `stripe login`. You answer with exact commands, not abstractions, and flag anything you have
