name: api-integration-resilience-patterns
version: 2.0.0
type: skill
category: backend
description: 'Troubleshoots and hardens third-party API integrations: retries, circuit breakers, idempotency,
  and webhook reliability.'
keywords:
- api-integration
- third-party
- webhooks
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: api-integration-resilience-patterns.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-api-integration-resilience-patterns
  generic:
    system_prompt: 'You take the Api Integration Resilience Patterns seat. You do it through resilience-patterns:
      Add retry backoff, circuit breakers, and fallbacks around flaky third-party calls. The commands
      are real, e.g. `npm install p-retry`. You answer with exact commands, not abstractions, and flag
      anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: resilience-patterns
  description: Add retry backoff, circuit breakers, and fallbacks around flaky third-party calls
  commands:
  - npm install p-retry
  - node -e "const r=require('p-retry'); const f=()=>Promise.reject(new Error('flaky')); r(f,{retries:3,onFailedAttempt:e=>console.log(e.attemptNumber)}).catch(()=>{})"
  - npm install opossum
  - node -e "const c=require('opossum'); const b=c(Promise.resolve,{timeout:1000,errorThresholdPercentage:50});
    b.fire().then(()=>b.stats&&console.log(b.stats()))"
  - npm install p-timeout
  examples:
  - node -e "const r=require('p-retry');r(async()=>{const res=await fetch('https://api.payment.example/v1/charge');if(!res.ok)throw
    new Error('upstream');return res.json()},{retries:4})"
  - node -e "const c=require('opossum');const b=c(()=>fetch('https://api.example.com'),{timeout:2000,resetTimeout:30000});b.fire()"
  - npm install p-timeout && node -e "const t=require('p-timeout');t(fetch('https://slow.example'),{milliseconds:1500}).catch(e=>console.log('timeout'))"
  parameters:
  - name: retries
    type: string
    description: Retry count
  - name: timeoutMs
    type: string
    description: Per-request timeout
- name: webhook-debugging
  description: Forward, replay, and verify webhooks from third-party services
  commands:
  - ngrok http 3000
  - stripe listen --forward-to localhost:3000/webhooks/stripe
  - stripe trigger payment_intent.succeeded
  - stripe logs tail payment_intent
  - 'curl -s -X POST http://localhost:3000/webhooks/replay -H ''Content-Type: application/json'' -d ''{"event_id":"evt_123"}'''
  examples:
  - ngrok http 3000 --subdomain my-dev
  - stripe listen --forward-to localhost:3000/webhooks/stripe --events payment_intent.succeeded
  - stripe trigger invoice.paid
  parameters:
  - name: port
    type: string
    description: Local webhook listener port
  - name: event
    type: string
    description: Third-party event to trigger
prerequisites:
- node.js
- python
- ngrok
- redis
tools:
- node.js
- python
- ngrok
- redis
- stripe-cli
examples:
- input: Integrate Stripe payments with webhooks
  output: Wires payment intents, listens with stripe-cli, verifies signatures, and stores event IDs for
    idempotent processing
- input: Stop upstream failures from crashing the API
  output: Adds opossum circuit breakers and p-retry with backoff around partner calls plus a Redis fallback
    queue
instructions: '# API Integration (Reliability)


  Hardens integrations against third-party failures: timeouts, retries, circuit breaking, idempotency.


  ## When to Use

  - Flaky upstream APIs cause user-visible failures

  - Webhooks arrive late, duplicated, or out of order

  - Meeting uptime SLAs that depend on partners


  ## Real Commands


  ```bash

  # Tunnel for webhook testing

  ngrok http 3000


  # Stripe webhook flow

  stripe listen --forward-to localhost:3000/webhooks/stripe

  stripe trigger payment_intent.succeeded


  # Retry with backoff

  node -e "const r=require(''p-retry'');r(async()=>{const res=await fetch(''https://api.partner.example/v1/x'');if(!res.ok)throw
  new Error(''upstream'');return res.json()},{retries:4})"


  # Circuit breaker

  node -e "const c=require(''opossum'');const b=c(()=>fetch(''https://api.example.com''),{timeout:2000,errorThresholdPercentage:50,resetTimeout:30000});b.fire()"

  ```


  ## Idempotency

  Send `Idempotency-Key` headers and store processed event IDs so replays are no-ops.


  ## Testing

  Use `stripe trigger` and replay endpoints to simulate duplicates, late arrivals, and malformed payloads.


  ## Best Practices

  - Timeout every third-party call

  - Exponential backoff with jitter

  - Fall back to a queue (Redis) for durable processing'
display_name: Api Integration Resilience Patterns
knowledge:
- title: Stripe CLI
  type: documentation
  source: https://docs.stripe.com/stripe-cli
  description: Webhook forwarding, event triggers, logs
- title: ngrok Docs
  type: documentation
  source: https://ngrok.com/docs
  description: Public tunnels for local webhook testing
- title: Resilience Patterns
  type: documentation
  source: https://docs.aws.amazon.com/prescriptive-guidance/latest/backup-and-restore/resilience.html
  description: Retry, circuit breaker, backoff guidance
