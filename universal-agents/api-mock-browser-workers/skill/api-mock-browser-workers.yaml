name: api-mock-browser-workers
version: 2.0.0
type: skill
category: testing
description: 'Implements browser and Node mock layers with MSW combined with Playwright for E2E mocking:
  persistent session state, resolver utilities, and test isolation.'
keywords:
- msw
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: api-mock-browser-workers.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-api-mock-browser-workers
  generic:
    system_prompt: 'You work Api Mock Browser Workers hands-on. You do it through browser-workers: Configure
      MSW service workers in a Vite/Next.js application. The commands are real, e.g. `npm install msw
      --save-dev`. You work hands-on and only report outcomes you have observed.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: browser-workers
  description: Configure MSW service workers in a Vite/Next.js application
  commands:
  - npm install msw --save-dev
  - npx msw init public/
  - npm run build
  - curl -s http://localhost:4173 -o /dev/null -w '%{http_code}\n'
  - npx playwright install chromium
  examples:
  - npx msw init public/ writes the worker script served at /mockServiceWorker.js
  - import { setupWorker } from 'msw/browser' starts the browser worker
  - 'worker.start({ onUnhandledRequest: ''error'' }) fails loudly on unmocked calls'
  parameters:
  - name: worker-dir
    type: string
    description: Directory that serves the service worker script
  - name: onUnhandledRequest
    type: string
    description: warn | error | bypass for unmatched requests
  - name: quiet
    type: boolean
    description: Suppress worker console output
- name: e2e-integration
  description: Reuse MSW handlers inside Playwright E2E tests
  commands:
  - npm install @playwright/test msw
  - npx playwright test tests/api-flows.spec.ts --project=chromium
  - npx playwright test --ui
  - npx playwright show-report
  examples: []
  parameters: []
prerequisites:
- prism
- wiremock
- msw
tools:
- prism
- wiremock
- msw
- node.js
- python
examples:
- input: Mock network in Playwright E2E
  output: Installs @playwright/msw, extends the test fixture with createWorkerFixture, and runs playwright
    test
- input: Serve mocks in production build
  output: Initializes the worker in the SPA entry only when import.meta.env.DEV is true
instructions: "# API Mock v4 - MSW + Playwright\n\nBrowser-grade mocking with MSW and E2E coverage.\n\n\
  ## What This Skill Does\n- Intercepts app traffic in the browser with service workers\n- Shares handlers\
  \ between dev, unit, and Playwright E2E runs\n- Isolates test data per test with scoped handlers\n\n\
  ## When to Use\n- E2E suites that must not depend on live backends\n- Reproducing specific API states\
  \ in UI tests\n- Keeping dev and test mocks from a single source\n\n## Real Commands\n\n```bash\nnpm\
  \ install msw --save-dev\nnpx msw init public/\n```\n\n## Playwright Integration\n\n```ts\nimport {\
  \ test as base } from '@playwright/test';\nimport { createWorkerFixture } from '@playwright/msw';\n\
  export const test = base.extend({\n  worker: createWorkerFixture(handlers)\n});\n```\n\n## Testing\n\
  - Assert network responses from devtools/network panel match handlers\n- Verify onUnhandledRequest:\
  \ 'error' surfaces missing mocks\n- Reset server state between Playwright tests\n\n## Best Practices\n\
  - Version the worker script with the app bundle\n- Use dynamic handlers for time-dependent data\n- Keep\
  \ handler modules framework-agnostic for reuse"
display_name: Api Mock Browser Workers
knowledge:
- title: MSW Browser Docs
  type: documentation
  source: https://mswjs.io/docs/basics/mocking/browser
  description: Browser-side interception with service workers
- title: Playwright Test Docs
  type: documentation
  source: https://playwright.dev/docs/test-intro
  description: E2E testing framework with network mocking support
