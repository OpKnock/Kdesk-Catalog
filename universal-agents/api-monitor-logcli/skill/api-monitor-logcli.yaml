name: api-monitor-logcli
version: 2.0.0
type: skill
category: sre
description: 'Monitors API logs with Loki and LogCLI: label-based querying, logQL
  pipelines, error-rate derivation, and alerting on log patterns.'
keywords:
- api-monitoring
- alerting
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: api-monitor-logcli.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-api-monitor-logcli
  generic:
    system_prompt: 'This is your domain: Api Monitor Logcli. You do it through logcli:
      Query and tail API logs stored in Loki. The commands are real, e.g. `logcli
      query {app=api-gateway} --from=2h`. You work hands-on and only report outcomes
      you have observed.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: logcli
  description: Query and tail API logs stored in Loki
  commands:
  - logcli query '{app="api-gateway"}' --from=2h
  - logcli query 'rate({app="api"} |= "ERROR" [5m])'
  - logcli query '{app="api"} | json | status_code >= 500 | line_format "{{.message}}"'
  - logcli labels
  - curl -s -G 'http://localhost:3100/loki/api/v1/query_range' --data-urlencode 'query={app="api"}'
    --data-urlencode 'limit=10' | jq '.data.result[0].values[0]'
  examples:
  - logcli query '{app="api"} | json | status_code=500' finds 5xx lines
  - logcli labels lists available label names
  - rate(... |= "ERROR" [5m]) computes error rate over the last 5 minutes
  parameters:
  - name: query
    type: string
    description: LogQL query with label matchers and pipeline stages
  - name: from
    type: string
    description: Start time (2h, 2024-06-01T00:00:00Z)
  - name: limit
    type: integer
    description: Maximum number of log entries returned
- name: logql-pipelines
  description: Parse and filter structured API logs with LogQL
  commands:
  - logcli query '{app="api"} | json | latency_ms > 1000 | drop timestamp'
  - curl -s -G 'http://localhost:3100/loki/api/v1/labels' | jq '.data.values'
  - logcli series '{app=~"api.+"}'
  examples:
  - -cli --help
  - -api --help
  parameters: []
prerequisites:
- prometheus
- grafana
tools:
- prometheus
- grafana
- node.js
- python
- new-relic
examples:
- input: Find all 500 errors in the last hour
  output: Runs logcli query with json parsing and status_code filter from --from=1h
- input: Alert when error rate spikes
  output: Writes a LogQL rate expression and tests it in a Grafana alert rule
instructions: "# API Monitor v4 - Loki/LogCLI\n\nLog-based API monitoring with Loki.\n\
  \n## What This Skill Does\n- Queries structured API logs by labels\n- Derives error\
  \ rates with LogQL aggregation\n- Alerts on log patterns that indicate failures\n\
  \n## When to Use\n- Debugging API failures from log evidence\n- Correlating errors\
  \ across services by trace_id label\n- Cost-effective alternative to full metric\
  \ instrumentation\n\n## Real Commands\n\n```bash\nlogcli query '{app=\"api\"}' --from=2h\n\
  logcli query 'rate({app=\"api\"} |= \"ERROR\" [5m])'\nlogcli query '{app=\"api\"\
  } | json | status_code >= 500'\n```\n\n## LogQL Pipeline\n- | json  parses structured\
  \ fields\n- | label_format adds derived labels\n- | line_format re-renders output\
  \ lines\n- | unwrap latency_ms extracts numeric fields for aggregation\n\n## Alerting\n\
  ```yaml\ngroups:\n  - name: api-errors\n    rules:\n      - alert: APIErrorRateHigh\n\
  \        expr: sum(rate({app=\"api\"} | json | status_code=500 [5m])) > 0.05\n```\n\
  \n## Best Practices\n- Emit structured JSON logs with stable labels\n- Use |= filters\
  \ before parsing for cheaper queries\n- Set retention to match compliance needs"
display_name: Api Monitor Logcli
knowledge:
- title: LogCLI Docs
  type: documentation
  source: https://grafana.com/docs/loki/latest/tools/logcli/
  description: Command line interface for querying Loki
- title: LogQL Reference
  type: documentation
  source: https://grafana.com/docs/loki/latest/query/
  description: Log query language reference with pipelines
