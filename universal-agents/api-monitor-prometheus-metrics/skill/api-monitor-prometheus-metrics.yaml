name: api-monitor-prometheus-metrics
version: 2.0.0
type: skill
category: sre
description: 'Monitors API performance with Prometheus and Grafana: exporting metrics,
  promtool validation, HTTP API queries, and alert rule checking.'
keywords:
- api-monitoring
- metrics
- alerting
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: api-monitor-prometheus-metrics.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-api-monitor-prometheus-metrics
  generic:
    system_prompt: 'Your lane is Api Monitor Prometheus Metrics. You do it through
      prometheus-metrics: Query API metrics from the Prometheus HTTP API. The commands
      are real, e.g. `promtool check config prometheus.yml`. You answer with exact
      commands, not abstractions, and flag anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: prometheus-metrics
  description: Query API metrics from the Prometheus HTTP API
  commands:
  - promtool check config prometheus.yml
  - curl -s 'http://localhost:9090/api/v1/query' --data-urlencode 'query=rate(http_requests_total[5m])'
    | jq '.data.result'
  - curl -s 'http://localhost:9090/api/v1/targets' | jq '.data.activeTargets[].health'
    | sort | uniq -c
  - curl -s 'http://localhost:9090/api/v1/query_range' --data-urlencode 'query=histogram_quantile(0.95,
    sum(rate(http_request_duration_seconds_bucket[5m])) by (le))' --data-urlencode
    'start=now-1h' --data-urlencode 'end=now' --data-urlencode 'step=60' | jq '.data.result[0].values[-1]'
  examples:
  - promtool check config validates scrape configs before restart
  - curl localhost:9090/api/v1/targets lists scrape targets and health
  - histogram_quantile computes p95 latency from buckets
  parameters:
  - name: promql
    type: string
    description: PromQL expression to evaluate
  - name: range
    type: string
    description: start/end/step for range queries
  - name: config-file
    type: string
    description: prometheus.yml path for validation
- name: alert-rules
  description: Validate and test alerting rules for API SLOs
  commands:
  - promtool check rules rules.yml
  - promtool test rules test.yml
  - curl -s 'http://localhost:9090/api/v1/rules' | jq '.data.groups[0].rules | length'
  - grafana-cli plugins install grafana-lokiexplore-app
  examples:
  - -cli --help
  - -api --help
  parameters: []
prerequisites:
- prometheus
- grafana
tools:
- prometheus
- grafana
- node.js
- python
- new-relic
examples:
- input: Find p95 latency for the last hour
  output: Runs a histogram_quantile query over http_request_duration_seconds_bucket
    via the API
- input: Check scrape health
  output: Queries /api/v1/targets and groups target health states
instructions: "# API Monitor v2 - Prometheus/Grafana\n\nMetrics-based API monitoring.\n\
  \n## What This Skill Does\n- Exports RED metrics (rate, errors, duration) from APIs\n\
  - Queries metrics via the Prometheus HTTP API\n- Validates configs and alert rules\
  \ with promtool\n\n## When to Use\n- SLO tracking for latency and error budgets\n\
  - Capacity planning from request-rate trends\n- Alerting on error-rate anomalies\n\
  \n## Real Commands\n\n```bash\npromtool check config prometheus.yml\ncurl -s 'http://localhost:9090/api/v1/query'\
  \ --data-urlencode 'query=rate(http_requests_total[5m])' | jq '.data.result'\n```\n\
  \n## Scrape Config\n\n```yaml\nscrape_configs:\n  - job_name: api\n    metrics_path:\
  \ /metrics\n    static_configs:\n      - targets: ['api:8080']\n```\n\n## Dashboards\n\
  - p95/p99 latency panels from histograms\n- Error ratio = errors / total requests\n\
  - Uptime = 1 - down time / window\n\n## Best Practices\n- Validate config and rules\
  \ before applying\n- Use recording rules for expensive aggregations\n- Expose /metrics\
  \ unauthenticated only inside the network"
display_name: Api Monitor Prometheus Metrics
knowledge:
- title: Prometheus HTTP API
  type: documentation
  source: https://prometheus.io/docs/prometheus/latest/querying/api/
  description: Query, targets, and rules endpoints
- title: PromQL Basics
  type: documentation
  source: https://prometheus.io/docs/prometheus/latest/querying/basics/
  description: PromQL expression reference
