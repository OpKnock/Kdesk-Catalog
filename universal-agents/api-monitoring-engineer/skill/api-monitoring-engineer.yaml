name: api-monitoring-engineer
version: 2.0.0
type: skill
category: sre
description: 'Instruments APIs with OpenTelemetry for distributed tracing: auto-instrumentation,
  OTLP export, otel-cli command injection, and Jaeger trace inspection.'
keywords:
- api-monitoring
- observability
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: api-monitoring-engineer.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-api-monitoring-engineer
  generic:
    system_prompt: 'You own api-monitoring-engineer end to end. You do it through
      otel-instrumentation: Add OpenTelemetry tracing to a Node.js API. The commands
      are real, e.g. `npm install @opentelemetry/sdk-node @opentelemetry/auto-instrumentations-node`.
      You verify each step you report and stay honest about what you have not run.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: otel-instrumentation
  description: Add OpenTelemetry tracing to a Node.js API
  commands:
  - npm install @opentelemetry/sdk-node @opentelemetry/auto-instrumentations-node
  - node -r @opentelemetry/auto-instrumentations-node/register app.js
  - curl -s http://localhost:3000/api/users -o /dev/null -w '%{http_code}\n'
  - npm install otel-cli
  - otel-cli exec --service my-api --name "GET /api/users" -- curl http://localhost:3000/api/users
  examples:
  - node -r @opentelemetry/auto-instrumentations-node/register app.js auto-instruments
    HTTP and DB calls
  - otel-cli exec wraps any command in a trace span
  - export OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317 routes spans to the collector
  parameters:
  - name: service-name
    type: string
    description: Name of the traced service in spans
  - name: exporter-endpoint
    type: string
    description: OTLP endpoint (gRPC 4317 or HTTP 4318)
  - name: sample-ratio
    type: number
    description: Fraction of requests to sample (0-1)
- name: trace-inspection
  description: Query traces from Jaeger after export
  commands:
  - docker run -d --name jaeger -p 16686:16686 -p 4317:4317 -p 4318:4318 jaegertracing/all-in-one:latest
  - curl -s 'http://localhost:16686/api/traces?service=my-api&limit=10' | jq '.data[0].spans
    | length'
  - curl -s 'http://localhost:16686/api/services' | jq '.data'
  - curl -s 'http://localhost:4318/v1/traces' -o /dev/null -w '%{http_code}\n'
  examples:
  - -cli --help
  - -api --help
  parameters: []
prerequisites:
- prometheus
- grafana
- node.js
- python
tools:
- prometheus
- grafana
- node.js
- python
- new-relic
- datadog
examples:
- input: Trace a slow checkout flow across services
  output: Instruments both services with OTel, exports to Jaeger, and finds the slow
    span in the waterfall
- input: Trace a CLI job against the API
  output: Wraps the job command with otel-cli exec to create spans in the same trace
instructions: '# API Monitoring Engineer


  Distributed tracing with OpenTelemetry.


  ## What This Skill Does

  - Instruments APIs without code changes via auto-instrumentation

  - Exports spans over OTLP to Jaeger or a collector

  - Traces requests across services via context propagation


  ## When to Use

  - Diagnosing latency across service boundaries

  - Building trace-based SLOs

  - Migrating to vendor-neutral observability


  ## Real Commands


  ```bash

  npm install @opentelemetry/sdk-node @opentelemetry/auto-instrumentations-node

  node -r @opentelemetry/auto-instrumentations-node/register app.js

  docker run -d --name jaeger -p 16686:16686 -p 4317:4317 jaegertracing/all-in-one:latest

  ```


  ## Configuration


  ```bash

  export OTEL_SERVICE_NAME=my-api

  export OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317

  export OTEL_TRACES_SAMPLER=parentbased_traceidratio

  export OTEL_TRACES_SAMPLER_ARG=0.1

  ```


  ## Testing

  - Generate traffic, then query /api/traces?service=my-api

  - Confirm parent-child span relationships across services

  - Validate collector endpoint health on 4318


  ## Best Practices

  - Start with auto-instrumentation before manual spans

  - Propagate W3C traceparent headers at gateways

  - Sample 10-25% at high QPS, 100% on canaries'
display_name: api-monitoring-engineer
knowledge:
- title: OpenTelemetry Node.js Docs
  type: documentation
  source: https://opentelemetry.io/docs/languages/js/getting-started/nodejs/
  description: Getting started with Node.js instrumentation
- title: Jaeger Getting Started
  type: documentation
  source: https://www.jaegertracing.io/docs/latest/getting-started/
  description: Running Jaeger all-in-one and querying traces
