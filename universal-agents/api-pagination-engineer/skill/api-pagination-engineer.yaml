name: api-pagination-engineer
version: 2.0.0
type: skill
category: backend
description: 'Implements cursor-based (keyset) pagination for high-volume APIs: indexed SQL queries, opaque
  cursor encoding, next-page links, and stability under writes.'
keywords:
- api-pagination
- cursor
- offset
- keyset
- pagination
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: api-pagination-engineer.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-api-pagination-engineer
  generic:
    system_prompt: 'Your lane is api-pagination-engineer. You do it through keyset-queries: Build index-backed
      keyset queries with stable ordering. The commands are real, e.g. `psql -d app -c CREATE INDEX idx_users_created_id
      ON users(created_at, id)`. You verify each step you report and stay honest about what you have not
      run.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: keyset-queries
  description: Build index-backed keyset queries with stable ordering
  commands:
  - psql -d app -c "CREATE INDEX idx_users_created_id ON users(created_at, id)"
  - psql -d app -c "EXPLAIN ANALYZE SELECT id, name FROM users WHERE (created_at, id) > ('2024-01-01',
    100) ORDER BY created_at, id LIMIT 20"
  - curl -s 'http://localhost:3000/api/users?cursor=eyJjcmVhdGVkX2F0IjoiMjAyNC0wMS0wMSIsImlkIjoxMDB9&limit=20'
    | jq '.data | length'
  - psql -d app -c "SELECT count(*) FROM users"
  examples:
  - psql EXPLAIN ANALYZE verifies the index is used on keyset queries
  - Cursor encodes (created_at, id) as base64url for opaque page tokens
  - WHERE (created_at, id) > (cursor) is stable even when rows are inserted
  parameters:
  - name: cursor
    type: string
    description: Opaque base64url token encoding the last row's sort keys
  - name: limit
    type: integer
    description: Max rows per page, default 20
  - name: sort
    type: string
    description: Sort columns that must match the composite index
- name: cursor-encoding
  description: Encode and decode opaque page cursors
  commands:
  - node -e "console.log(Buffer.from(JSON.stringify({created_at:'2024-01-01',id:100})).toString('base64url'))"
  - node -e "console.log(JSON.parse(Buffer.from('eyJjcmVhdGVkX2F0IjoiMjAyNC0wMS0wMSIsImlkIjoxMDB9','base64url').toString()))"
  - curl -s 'http://localhost:3000/api/users?cursor=bad%20token' -o /dev/null -w '%{http_code}\n'
  examples: []
  parameters: []
prerequisites:
- node.js
- python
- postgresql
- redis
tools:
- node.js
- python
- postgresql
- redis
- graphql
examples:
- input: Paginate a 5M-row orders table
  output: Adds a composite index and rewrites the endpoint to keyset queries with opaque cursors
- input: Fix duplicate rows in paging
  output: Replaces unstable offset math with (sort_key, id) tuple comparisons
instructions: "# API Pagination Engineer\n\nCursor-based pagination for scalable APIs.\n\n## What This\
  \ Skill Does\n- Replaces offset pagination with index-backed keyset queries\n- Encodes cursors as opaque\
  \ tokens with no client math\n- Returns next/prev links instead of page numbers\n\n## When to Use\n\
  - Tables with millions of rows\n- Frequently written datasets where offsets drift\n- Mobile clients\
  \ that need stable paging\n\n## Real Commands\n\n```bash\npsql -d app -c \"CREATE INDEX idx_users_created_id\
  \ ON users(created_at, id)\"\npsql -d app -c \"EXPLAIN ANALYZE SELECT id, name FROM users WHERE (created_at,\
  \ id) > ('2024-01-01', 100) ORDER BY created_at, id LIMIT 20\"\n```\n\n## Response Shape\n\n```json\n\
  {\n  \"data\": [...],\n  \"next\": \"https://api.example.com/users?cursor=eyJpZCI6MTIwfQ&limit=20\"\n\
  }\n```\n\n## Testing\n- Run EXPLAIN ANALYZE to confirm index-only scans\n- Insert rows mid-pagination\
  \ and verify no duplicates\n- Send corrupted cursors and assert 400 with a clear message\n\n## Best\
  \ Practices\n- Tie-break with an always-unique column (id) in the sort keys\n- Sign cursors to prevent\
  \ tampering\n- Cap limit and reject negative values"
display_name: api-pagination-engineer
knowledge:
- title: PostgreSQL Indexes Docs
  type: documentation
  source: https://www.postgresql.org/docs/current/indexes-intro.html
  description: How indexes speed up keyset pagination queries
- title: Use The Index Luke - Pagination
  type: documentation
  source: https://use-the-index-luke.com/sql/partial-results/fetch-next-page
  description: Keyset pagination explained with index requirements
