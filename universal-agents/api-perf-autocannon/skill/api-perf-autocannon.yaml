name: api-perf-autocannon
version: 2.0.0
type: skill
category: backend
description: Analyzes API latency distribution and connection behavior with autocannon,
  artillery quick mode, and request-level timing to separate network from application
  cost.
keywords:
- api-perf-autocannon
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: api-perf-autocannon.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-api-perf-autocannon
  generic:
    system_prompt: 'Your lane is Api Perf Autocannon. You do it through autocannon:
      Run pipelined HTTP benchmarks with full statistics. The commands are real, e.g.
      `npx autocannon -c 20 -d 30 -p 1 http://localhost:3000/`. You work hands-on
      and only report outcomes you have observed.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: autocannon
  description: Run pipelined HTTP benchmarks with full statistics
  commands:
  - npx autocannon -c 20 -d 30 -p 1 http://localhost:3000/
  - npx autocannon -c 10 -d 20 -m POST -b '{"a":1}' -H 'Content-Type=application/json'
    http://localhost:3000/api
  - npx autocannon -c 20 -d 30 --json http://localhost:3000/ > results.json
  - npx autocannon --renderStatusCodes -c 20 -d 10 http://localhost:3000/
  examples:
  - autocannon -p 1 disables pipelining for realistic latency
  - --json emits machine-readable results for charts
  - --renderStatusCodes shows the status code mix
  parameters:
  - name: connections
    type: integer
    description: Number of concurrent connections
  - name: duration
    type: integer
    description: Duration in seconds
  - name: pipelining
    type: integer
    description: Pipelined requests per connection
- name: artillery-quick
  description: Use artillery quick for ad-hoc load scenarios
  commands:
  - npx artillery quick -d 30 -r 20 http://localhost:3000/api
  - npx artillery quick --count 50 --num 20 http://localhost:8080/users
  - npx artillery quick -d 60 -r 50 -o report.json http://localhost:3000/
  examples:
  - -cli --help
  - -api --help
  parameters: []
prerequisites:
- node.js
- python
- redis
- k6
tools:
- node.js
- python
- redis
- k6
- new-relic
examples:
- input: Did adding gzip improve p95?
  output: Runs autocannon before/after and compares the p95 rows
- input: Quick load check before demo
  output: Runs artillery quick at 50 rps for 60s and reviews the report
instructions: '# API Perf v4 - Latency Analysis


  Latency distribution analysis with autocannon.


  ## What This Skill Does

  - Measures latency percentiles with pipelining control

  - Produces JSON artifacts for trend tracking

  - Drives ad-hoc loads with artillery quick


  ## When to Use

  - Verifying latency improvements after a fix

  - Comparing request sizes and connection reuse

  - Ad-hoc load checks without writing scripts


  ## Real Commands


  ```bash

  npx autocannon -c 20 -d 30 -p 1 http://localhost:3000/

  npx autocannon --json http://localhost:3000/ > results.json

  npx artillery quick -d 30 -r 20 http://localhost:3000/api

  ```


  ## Interpreting Output

  - avg/max: central and worst-case latency

  - p1-p99: full distribution shape

  - errors: connection and timeout failures

  - requests/sec: achieved throughput


  ## Testing

  - Repeat runs 3x and compare medians

  - Vary payload size to expose serialization cost

  - Test HTTP/1.1 vs HTTP/2 if both available


  ## Best Practices

  - Keep -p 1 for mobile-like latency measurements

  - Persist JSON outputs per build for regression charts

  - Correlate latency shifts with deploy timestamps'
display_name: Api Perf Autocannon
knowledge:
- title: autocannon GitHub
  type: documentation
  source: https://github.com/mcollina/autocannon
  description: Fast HTTP/1.1 benchmarking tool
- title: Artillery Quick Docs
  type: documentation
  source: https://www.artillery.io/docs/guides/getting-started/overview
  description: Load testing with quick and YAML scenarios
