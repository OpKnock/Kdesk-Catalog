name: api-perf-wrk
version: 2.0.0
type: skill
category: backend
description: 'Benchmarks APIs with wrk, hey, and ApacheBench: throughput, latency
  percentiles, connection concurrency, and POST payload testing.'
keywords:
- api-perf-wrk
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: api-perf-wrk.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-api-perf-wrk
  generic:
    system_prompt: 'This is your domain: Api Perf Wrk. You do it through wrk: Run
      thread-based HTTP benchmarks with latency histograms. The commands are real,
      e.g. `wrk -t4 -c100 -d30s http://localhost:3000/api`. You work hands-on and
      only report outcomes you have observed.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: wrk
  description: Run thread-based HTTP benchmarks with latency histograms
  commands:
  - wrk -t4 -c100 -d30s http://localhost:3000/api
  - wrk -t2 -c50 -d20s --latency http://localhost:3000/api
  - wrk -s post.lua -t4 -c50 -d30s http://localhost:3000/api
  examples:
  - wrk -t4 -c100 -d30s uses 4 threads and 100 connections for 30s
  - --latency prints a full percentile distribution
  - -s post.lua drives custom request bodies
  parameters:
  - name: threads
    type: integer
    description: Number of threads (-t)
  - name: connections
    type: integer
    description: Open connections (-c)
  - name: duration
    type: string
    description: Benchmark duration like 30s
- name: hey-ab
  description: Compare with hey and ApacheBench for POST and header testing
  commands:
  - 'hey -n 10000 -c 100 -m POST -H ''Content-Type: application/json'' -d ''{"q":"test"}''
    http://localhost:3000/search'
  - hey -n 5000 -c 50 http://localhost:3000/api
  - ab -n 5000 -c 50 -p post.json -T application/json http://localhost:3000/api
  - ab -n 1000 -c 20 -k http://localhost:3000/api
  examples:
  - -cli --help
  - -api --help
  parameters: []
prerequisites:
- node.js
- python
- redis
- k6
tools:
- node.js
- python
- redis
- k6
- new-relic
examples:
- input: Compare two cache configurations
  output: Runs identical wrk commands against both and compares latency histograms
- input: Benchmark a JSON POST endpoint
  output: Uses hey with a JSON body at 100 concurrent connections
instructions: '# API Perf v3 - Benchmarking


  Raw HTTP benchmarking with wrk/hey/ab.


  ## What This Skill Does

  - Measures requests/sec and latency percentiles

  - Drives concurrent connections and POST bodies

  - Compares framework and config changes quickly


  ## When to Use

  - Quick A/B of a config flag

  - Validating a framework or runtime change

  - Establishing a throughput baseline


  ## Real Commands


  ```bash

  wrk -t4 -c100 -d30s --latency http://localhost:3000/api

  hey -n 10000 -c 100 -m POST -H ''Content-Type: application/json'' -d ''{"q":"test"}''
  http://localhost:3000/search

  ab -n 5000 -c 50 -p post.json -T application/json http://localhost:3000/api

  ```


  ## Reading Results

  - Requests/sec: throughput ceiling

  - Latency Std Dev: jitter in responses

  - Non-2xx responses: capacity-induced failures


  ## Testing

  - Warm up with a short run before measuring

  - Keep connection counts consistent between A/B runs

  - Compare percentile curves, not just averages


  ## Best Practices

  - Run benchmarks on dedicated machines to avoid noise

  - Match benchmark traffic shape to production traffic

  - Beware keep-alive (-k) inflating throughput on ab'
display_name: Api Perf Wrk
knowledge:
- title: wrk GitHub
  type: documentation
  source: https://github.com/wg/wrk
  description: HTTP benchmarking tool with Lua scripting
- title: ApacheBench Docs
  type: documentation
  source: https://httpd.apache.org/docs/2.4/programs/ab.html
  description: ab load testing tool reference
