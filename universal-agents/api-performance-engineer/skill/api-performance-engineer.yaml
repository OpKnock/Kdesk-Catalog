name: api-performance-engineer
version: 2.0.0
type: skill
category: backend
description: 'Engineers API performance end-to-end with vegeta: attack targets files,
  rate/duration attacks, histogram reports, and binary result encoding for charting.'
keywords:
- api-performance
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: api-performance-engineer.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-api-performance-engineer
  generic:
    system_prompt: 'You take the api-performance-engineer seat. You do it through
      vegeta-attacks: Run vegeta load attacks from targets files. The commands are
      real, e.g. `echo GET http://localhost:3000/api | vegeta attack -duration=30s
      -rate=100 | vegeta report`. You run and verify the real CLI commands before
      you claim anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: vegeta-attacks
  description: Run vegeta load attacks from targets files
  commands:
  - echo "GET http://localhost:3000/api" | vegeta attack -duration=30s -rate=100 |
    vegeta report
  - vegeta attack -targets=targets.txt -rate=50 -duration=60s -name=apiv1 | tee results.bin
    | vegeta report -type=hist[0,10ms,50ms,200ms,1s]
  - vegeta encode -to json < results.bin | jq '.[0].latencies'
  - vegeta report -type=json results.bin > report.json
  - vegeta plot results.bin > plot.html
  examples:
  - vegeta attack pipes directly into vegeta report
  - hist[0,10ms,...] groups latency into buckets
  - vegeta plot generates an interactive HTML chart
  parameters:
  - name: rate
    type: integer
    description: Requests per second
  - name: duration
    type: string
    description: Attack duration like 30s
  - name: targets-file
    type: string
    description: File with method/url/header lines
- name: distributed-attacks
  description: Scale attacks across machines with vegeta
  commands:
  - vegeta attack -rate=0 -max-workers=10 -duration=60s -targets=targets.txt > results.bin
  - vegeta report -every=5s results.bin
  - vegeta dump results.bin | head -5
  examples:
  - -cli --help
  - -api --help
  parameters: []
prerequisites:
- node.js
- python
- redis
- new-relic
tools:
- node.js
- python
- redis
- new-relic
- artillery
- k6
examples:
- input: Capacity test /api at 200 QPS
  output: Runs a vegeta attack at rate=200 for 60s and reports the p99
- input: Share a perf report with the team
  output: Generates an HTML plot with vegeta plot and attaches it to the PR
instructions: "# API Performance Engineer\n\nLoad engineering with vegeta.\n\n## What\
  \ This Skill Does\n- Runs fixed-rate attacks with exact QPS control\n- Reports histograms,\
  \ percentiles, and status code distributions\n- Produces artifacts for dashboards\
  \ and reports\n\n## When to Use\n- Precise rate-based capacity tests\n- Comparing\
  \ versions with identical attack profiles\n- Generating shareable performance reports\n\
  \n## Real Commands\n\n```bash\necho \"GET http://localhost:3000/api\" | vegeta attack\
  \ -duration=30s -rate=100 | vegeta report\nvegeta attack -targets=targets.txt -rate=50\
  \ -duration=60s | tee results.bin | \\\n  vegeta report -type=hist[0,10ms,50ms,200ms,1s]\n\
  vegeta encode -to json < results.bin | jq '.[0].latencies'\n```\n\n## Targets File\n\
  \n```\nGET http://localhost:3000/api/items\nPOST http://localhost:3000/api/items\n\
  Content-Type: application/json\n@/tmp/body.json\n```\n\n## Testing\n- Verify attack\
  \ rate matches configured QPS\n- Correlate latency percentiles with resource utilization\n\
  - Keep result binaries for reproducible audits\n\n## Best Practices\n- Use -max-workers\
  \ to control concurrency beyond rate\n- Name attacks to identify test scenarios\n\
  - Store report.json in CI artifacts per release"
display_name: api-performance-engineer
knowledge:
- title: vegeta GitHub
  type: documentation
  source: https://github.com/tsenart/vegeta
  description: HTTP load testing tool and library
- title: vegeta Target Format
  type: documentation
  source: https://github.com/tsenart/vegeta/blob/master/README.md#target-format
  description: Targets file syntax for attack definitions
