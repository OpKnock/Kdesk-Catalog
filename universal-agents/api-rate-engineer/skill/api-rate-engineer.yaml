name: api-rate-engineer
version: 2.0.0
type: skill
category: security
description: 'Implements API rate limiting with nginx limit_req and limit_conn modules:
  shared memory zones, burst queues, delayed processing, and 429 responses.'
keywords:
- rate-limiting
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: api-rate-engineer.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-api-rate-engineer
  generic:
    system_prompt: 'Your lane is api-rate-engineer. You do it through nginx-limit-req:
      Configure request rate limiting zones in nginx. The commands are real, e.g.
      `nginx -t`. You run and verify the real CLI commands before you claim anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: nginx-limit-req
  description: Configure request rate limiting zones in nginx
  commands:
  - nginx -t
  - nginx -s reload
  - curl -s -o /dev/null -w '%{http_code}\n' http://localhost/api/
  - for i in $(seq 1 30); do curl -s -o /dev/null -w '%{http_code}\n' http://localhost/api/;
    done | sort | uniq -c
  - curl -s -D- -o /dev/null http://localhost/api/ | grep -i retry-after
  examples:
  - limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s defines the zone
  - limit_req zone=api burst=20 nodelay applies it to a location
  - nginx -t validates config before reload
  parameters:
  - name: zone-name
    type: string
    description: Zone identifier with size like api:10m
  - name: rate
    type: string
    description: Rate like 10r/s or 60r/m
  - name: burst
    type: integer
    description: Queue size for exceeded requests
- name: limit-conn
  description: Cap concurrent connections per client
  commands:
  - nginx -t -c /etc/nginx/nginx.conf
  - curl -s -o /dev/null -w '%{http_code}\n' http://localhost/api/health
  - ab -n 500 -c 100 http://localhost/api/ 2>&1 | grep -i 'non-2xx'
  examples:
  - -cli --help
  - -api --help
  parameters: []
prerequisites:
- redis
- node.js
- python
tools:
- redis
- node.js
- python
- nginx
- express-rate-limit
examples:
- input: Limit /api to 10 rps per client
  output: Adds a limit_req_zone and applies it with burst 20, verifying 429s under
    load
- input: Stop one IP from opening many connections
  output: Adds limit_conn per IP and validates with a high-concurrency ab run
instructions: "# API Rate Engineer\n\nRate limiting with nginx.\n\n## What This Skill\
  \ Does\n- Limits requests per second per client key\n- Buffers bursts with queues\
  \ or nodelay policy\n- Limits concurrent connections per IP\n\n## When to Use\n\
  - Protecting APIs behind nginx reverse proxy\n- Throttling heavy endpoints without\
  \ app changes\n- Defending against single-IP abuse\n\n## Real Commands\n\n```bash\n\
  nginx -t\nnginx -s reload\nfor i in $(seq 1 30); do curl -s -o /dev/null -w '%{http_code}\\\
  n' http://localhost/api/; done | sort | uniq -c\n```\n\n## Config Example\n\n```nginx\n\
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;\nserver {\n  location\
  \ /api/ {\n    limit_req zone=api burst=20 nodelay;\n    limit_req_status 429;\n\
  \    proxy_pass http://backend;\n  }\n}\n```\n\n## Testing\n- Fire over-limit bursts\
  \ and count 429 responses\n- Verify Retry-After headers appear on 429s\n- Confirm\
  \ normal traffic below the limit is unaffected\n\n## Best Practices\n- Key zones\
  \ on real client identity, not just IP\n- Use burst+nodelay for interactive APIs\n\
  - Log limit violations to a dedicated access log"
display_name: api-rate-engineer
knowledge:
- title: nginx limit_req Module
  type: documentation
  source: https://nginx.org/en/docs/http/ngx_http_limit_req_module.html
  description: Official reference for request rate limiting
- title: nginx limit_conn Module
  type: documentation
  source: https://nginx.org/en/docs/http/ngx_http_limit_conn_module.html
  description: Concurrent connection limiting directives
