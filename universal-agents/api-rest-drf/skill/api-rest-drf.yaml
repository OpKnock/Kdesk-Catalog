name: api-rest-drf
version: 2.0.0
type: skill
category: backend
description: 'Builds REST APIs with Django REST Framework: models, serializers, viewsets,
  routers, permissions, and browsable API testing.'
keywords:
- rest
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: api-rest-drf.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-api-rest-drf
  generic:
    system_prompt: 'Your lane is Api Rest Drf. You do it through drf-setup: Scaffold
      a Django project with DRF. The commands are real, e.g. `pip install django djangorestframework`.
      You work hands-on and only report outcomes you have observed.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: drf-setup
  description: Scaffold a Django project with DRF
  commands:
  - pip install django djangorestframework
  - django-admin startproject config .
  - python manage.py startapp api
  - python manage.py migrate
  - python manage.py runserver
  examples:
  - django-admin startproject scaffolds the project
  - python manage.py migrate applies schema
  - python manage.py runserver serves the browsable API
  parameters:
  - name: app
    type: string
    description: Django app name
  - name: model
    type: string
    description: Model to expose via the API
  - name: serializer
    type: string
    description: DRF serializer class
- name: viewsets
  description: Expose CRUD via viewsets and routers
  commands:
  - curl -s http://localhost:8000/api/users/ | jq 'length'
  - 'curl -s -X POST http://localhost:8000/api/users/ -H ''Content-Type: application/json''
    -d ''{"name":"alice","email":"a@localhost"}'' -w ''\n%{http_code}\n'''
  - 'curl -s -o /dev/null -w ''%{http_code}\n'' -X POST http://localhost:8000/api/users/
    -H ''Content-Type: application/json'' -d ''{"name":"x"}'''
  - python manage.py test api -v 2
  examples:
  - -cli --help
  - -api --help
  parameters: []
prerequisites:
- node.js
- python
- express
- fastapi
tools:
- node.js
- python
- express
- fastify
- openapi
examples:
- input: Expose a users model as REST
  output: Creates a viewset with router registration and tests CRUD via curl
- input: Protect write operations
  output: Adds IsAuthenticated permission and verifies 401s
instructions: "# API REST v4 - Django REST Framework\n\nREST APIs with DRF.\n\n##\
  \ What This Skill Does\n- Exposes models as REST resources with viewsets\n- Validates\
  \ and serializes with serializers\n- Handles auth with permission classes\n\n##\
  \ When to Use\n- Python/Django teams\n- Rapid CRUD APIs with admin UIs\n- Standardized\
  \ DRF projects\n\n## Real Commands\n\n```bash\npip install django djangorestframework\n\
  django-admin startproject config .\npython manage.py startapp api\npython manage.py\
  \ migrate\npython manage.py runserver\n```\n\n## ViewSet Example\n\n```python\n\
  from rest_framework import viewsets\nfrom .models import User\nfrom .serializers\
  \ import UserSerializer\n\nclass UserViewSet(viewsets.ModelViewSet):\n    queryset\
  \ = User.objects.all()\n    serializer_class = UserSerializer\n```\n\n## Testing\n\
  - Verify browsable API at /api/users/\n- Test validation and permissions with APIClient\n\
  - Confirm 401/403 for anonymous writes\n\n## Best Practices\n- Use routers to wire\
  \ URLs consistently\n- Add filtering and ordering mixins\n- Document with drf-spectacular\
  \ OpenAPI generation"
display_name: Api Rest Drf
knowledge:
- title: DRF Quickstart
  type: documentation
  source: https://www.django-rest-framework.org/tutorial/quickstart/
  description: Setting up a DRF API
- title: DRF Viewsets
  type: documentation
  source: https://www.django-rest-framework.org/api-guide/viewsets/
  description: ViewSet and router reference
