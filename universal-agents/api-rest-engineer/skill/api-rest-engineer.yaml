name: api-rest-engineer
version: 2.0.0
type: skill
category: backend
description: 'Implements REST APIs in Node.js with Express: resource routing, status-code
  semantics, JSON error handling, and curl-based endpoint verification.'
keywords:
- rest
- http
- status-codes
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: api-rest-engineer.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-api-rest-engineer
  generic:
    system_prompt: 'This is your domain: api-rest-engineer. You do it through express-routing:
      Build REST resource routes with Express. The commands are real, e.g. `npm init
      -y && npm install express`. You prefer the shortest safe path, and you reproduce
      failures before diagnosing them.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: express-routing
  description: Build REST resource routes with Express
  commands:
  - npm init -y && npm install express
  - node app.js
  - 'curl -s -X POST http://localhost:3000/api/users -H ''Content-Type: application/json''
    -d ''{"name":"alice"}'' -w ''\n%{http_code}\n'''
  - curl -s http://localhost:3000/api/users | jq 'length'
  - curl -s http://localhost:3000/api/users/1 | jq .name
  examples:
  - POST /api/users returns 201 Created
  - GET /api/users/1 returns the resource or 404
  - curl -w '%{http_code}' asserts status codes
  parameters:
  - name: resource
    type: string
    description: Resource name in the route path
  - name: id
    type: integer
    description: Resource identifier
  - name: body
    type: object
    description: JSON payload for mutations
- name: status-semantics
  description: Apply correct HTTP status codes per operation
  commands:
  - curl -s -o /dev/null -w '%{http_code}\n' http://localhost:3000/api/users/999
  - curl -s -o /dev/null -w '%{http_code}\n' -X DELETE http://localhost:3000/api/users/1
  - 'curl -s -o /dev/null -w ''%{http_code}\n'' -X PATCH http://localhost:3000/api/users/1
    -H ''Content-Type: application/json'' -d ''{"name":"bob"}'''
  - curl -s -o /dev/null -w '%{http_code}\n' http://localhost:3000/api/health
  examples:
  - -cli --help
  - -api --help
  parameters: []
prerequisites:
- node.js
- python
- express
- fastapi
tools:
- node.js
- python
- express
- fastapi
- openapi
- postman
examples:
- input: Build CRUD for users
  output: Implements Express routes with proper status codes and verifies with curl
- input: Fix a wrong 500 on missing users
  output: Returns 404 with a JSON error body instead of a crash
instructions: '# API REST Engineer


  REST implementation with Express.


  ## What This Skill Does

  - Implements CRUD endpoints with Express routing

  - Uses REST-correct status codes

  - Handles errors with consistent JSON


  ## When to Use

  - Building Node.js REST services

  - Implementing new resource endpoints

  - Fixing status code semantics


  ## Real Commands


  ```bash

  npm init -y && npm install express

  node app.js

  curl -s -X POST http://localhost:3000/api/users -H ''Content-Type: application/json''
  -d ''{"name":"alice"}'' -w ''\n%{http_code}\n''

  ```


  ## Status Code Rules

  - 200 for GET/PUT/PATCH success

  - 201 + Location for POST

  - 204 for DELETE success

  - 400 invalid body, 404 missing resource, 409 conflict


  ## Testing

  - Exercise each status code with curl

  - Verify Location header on creates

  - Validate 404 bodies include the resource id


  ## Best Practices

  - Keep route handlers thin; extract services

  - Use middleware for validation before handlers

  - Document codes in the OpenAPI contract'
display_name: api-rest-engineer
knowledge:
- title: Express Routing Guide
  type: documentation
  source: https://expressjs.com/en/guide/routing.html
  description: Express route definitions
- title: MDN HTTP Status Codes
  type: documentation
  source: https://developer.mozilla.org/en-US/docs/Web/HTTP/Status
  description: HTTP status code reference
