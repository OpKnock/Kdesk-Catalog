name: api-rest-fastapi-routes
version: 2.0.0
type: skill
category: backend
description: 'Implements REST APIs with FastAPI and Pydantic: typed routes, automatic OpenAPI docs, dependency
  injection, and TestClient-based testing.'
keywords:
- rest
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: api-rest-fastapi-routes.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-api-rest-fastapi-routes
  generic:
    system_prompt: 'You own Api Rest Fastapi Routes end to end. You do it through fastapi-routes: Define
      typed FastAPI routes with automatic validation. The commands are real, e.g. `pip install fastapi
      uvicorn`. You prefer the shortest safe path, and you reproduce failures before diagnosing them.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: fastapi-routes
  description: Define typed FastAPI routes with automatic validation
  commands:
  - pip install fastapi uvicorn
  - uvicorn main:app --reload
  - curl -s http://127.0.0.1:8000/openapi.json | jq '.paths | keys'
  - curl -s http://127.0.0.1:8000/docs -o /dev/null -w '%{http_code}\n'
  - 'curl -s -X POST http://127.0.0.1:8000/api/items -H ''Content-Type: application/json'' -d ''{"name":"widget"}''
    -w ''\n%{http_code}\n'''
  examples:
  - uvicorn main:app --reload hot-reloads the API
  - GET /openapi.json returns the generated contract
  - Invalid payloads return 422 automatically
  parameters:
  - name: model
    type: object
    description: Pydantic request model
  - name: status-code
    type: integer
    description: Route response status
  - name: response-model
    type: object
    description: Pydantic response model
- name: dependency-injection
  description: Share auth and DB logic via FastAPI dependencies
  commands:
  - 'curl -s -o /dev/null -w ''%{http_code}\n'' -H ''Authorization: Bearer invalid'' http://127.0.0.1:8000/api/me'
  - pytest -q
  - uvicorn main:app --host 0.0.0.0 --port 8000
  examples: []
  parameters: []
prerequisites:
- node.js
- python
- express
- fastapi
tools:
- node.js
- python
- express
- fastapi
- openapi
examples:
- input: Create a typed items API
  output: Defines Pydantic models and typed routes, testing with TestClient
- input: Require auth on routes
  output: Implements an auth dependency and verifies 401s with curl
instructions: "# API REST Engineer v2 - FastAPI\n\nREST APIs with FastAPI.\n\n## What This Skill Does\n\
  - Builds typed routes with Pydantic validation\n- Auto-generates OpenAPI docs\n- Uses dependencies for\
  \ auth and DB access\n\n## When to Use\n- Python REST services\n- Prototyping with instant docs\n- Validation-heavy\
  \ APIs\n\n## Real Commands\n\n```bash\npip install fastapi uvicorn\nuvicorn main:app --reload\ncurl\
  \ -s http://127.0.0.1:8000/openapi.json | jq '.paths | keys'\n```\n\n## Route Example\n\n```python\n\
  from fastapi import FastAPI, Depends\nfrom pydantic import BaseModel\napp = FastAPI()\n\nclass Item(BaseModel):\n\
  \    name: str\n    price: float\n\n@app.post('/api/items', status_code=201)\ndef create_item(item:\
  \ Item):\n    return {'id': 1, **item.model_dump()}\n```\n\n## Testing\n- Use TestClient for route tests\
  \ without a server\n- Verify 422s for schema violations\n- Test dependency overrides for auth\n\n##\
  \ Best Practices\n- Define response_model to shape output\n- Organize routes with APIRouter\n- Add tags\
  \ and operation summaries for docs"
display_name: Api Rest Fastapi Routes
knowledge:
- title: FastAPI First Steps
  type: documentation
  source: https://fastapi.tiangolo.com/tutorial/first-steps/
  description: FastAPI basics and routes
- title: FastAPI Dependencies
  type: documentation
  source: https://fastapi.tiangolo.com/tutorial/dependencies/
  description: Dependency injection guide
