name: api-sec-tls-certificates
version: 2.0.0
type: skill
category: security
description: 'Audits API transport security: TLS certificate validation with openssl, SSL/TLS configuration
  scanning with testssl.sh and sslyze, and header checks.'
keywords:
- api-security
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: api-sec-tls-certificates.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-api-sec-tls-certificates
  generic:
    system_prompt: 'You take the Api Sec Tls Certificates seat. You do it through tls-certificates: Inspect
      TLS certificates and handshakes. The commands are real, e.g. `echo | openssl s_client -connect api.example.com:443
      -servername api.example.com...`. You prefer the shortest safe path, and you reproduce failures before
      diagnosing them.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: tls-certificates
  description: Inspect TLS certificates and handshakes
  commands:
  - echo | openssl s_client -connect api.example.com:443 -servername api.example.com 2>/dev/null | openssl
    x509 -noout -subject -dates -issuer
  - echo | openssl s_client -connect api.example.com:443 -tls1_2 -servername api.example.com 2>/dev/null
    | grep -E 'Protocol|Cipher'
  - curl -sI http://localhost:8080 | grep -iE 'strict-transport|content-security'
  - npx sslyze api.example.com --certinfo
  examples:
  - openssl s_client extracts certificate details
  - -tls1_2 forces the protocol for version checks
  - sslyze --certinfo reports cert chain issues
  parameters:
  - name: host
    type: string
    description: Target hostname
  - name: port
    type: integer
    description: TLS port, default 443
  - name: protocol
    type: string
    description: TLS version to test
- name: config-scans
  description: Scan TLS configuration with testssl.sh
  commands:
  - testssl.sh api.example.com
  - testssl.sh --hints api.example.com
  - testssl.sh --ssl-native api.example.com
  - curl -s -o /dev/null -w '%{http_code}\n' http://localhost:8080/health
  examples: []
  parameters: []
prerequisites:
- node.js
- python
- owasp-zap
tools:
- node.js
- python
- owasp-zap
- helmet
- cors
examples:
- input: Verify a renewed certificate
  output: Runs openssl s_client and checks dates, SANs, and chain
- input: Scan TLS configuration
  output: Runs testssl.sh and remediates weak ciphers
instructions: '# API Security v4 - TLS


  Transport security auditing.


  ## What This Skill Does

  - Verifies certificate validity and chain

  - Scans cipher and protocol support

  - Checks security response headers


  ## When to Use

  - Certificate renewal verification

  - PCI compliance evidence

  - Post-incident transport review


  ## Real Commands


  ```bash

  echo | openssl s_client -connect api.example.com:443 -servername api.example.com 2>/dev/null | openssl
  x509 -noout -subject -dates -issuer

  testssl.sh api.example.com

  npx sslyze api.example.com --certinfo

  ```


  ## Checks

  - Certificate expiry and SANs

  - TLS 1.2/1.3 enabled, 1.0/1.1 disabled

  - Weak ciphers negotiated

  - HSTS header present


  ## Testing

  - Test from external networks to see public config

  - Compare staging and production configs

  - Re-test after any config change


  ## Best Practices

  - Enforce TLS 1.2+ and modern ciphers

  - Send HSTS with a long max-age

  - Automate expiry monitoring'
display_name: Api Sec Tls Certificates
knowledge:
- title: OpenSSL s_client
  type: documentation
  source: https://docs.openssl.org/master/man1/openssl-s_client/
  description: OpenSSL client for TLS inspection
- title: testssl.sh
  type: documentation
  source: https://testssl.sh/
  description: TLS configuration scanner
