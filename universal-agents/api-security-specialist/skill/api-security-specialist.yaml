name: api-security-specialist
version: 2.0.0
type: skill
category: security
description: 'Manages API secrets and identity: HashiCorp Vault secret storage and
  rotation, AWS Secrets Manager CLI, and secrets hygiene for API keys.'
keywords:
- api-security
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: api-security-specialist.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-api-security-specialist
  generic:
    system_prompt: 'This is your domain: api-security-specialist. You do it through
      vault-secrets: Store and retrieve API secrets in Vault. The commands are real,
      e.g. `vault server -dev`. You verify each step you report and stay honest about
      what you have not run.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: vault-secrets
  description: Store and retrieve API secrets in Vault
  commands:
  - vault server -dev
  - vault kv put secret/api DB_PASSWORD="s3cr3t" API_KEY="key-123"
  - vault kv get secret/api
  - vault kv get -format=json secret/api | jq '.data.data.API_KEY'
  - vault kv delete secret/api
  examples:
  - vault kv put stores key-value secrets
  - vault kv get retrieves with -format=json
  - vault kv delete removes rotated secrets
  parameters:
  - name: path
    type: string
    description: Secret path in the KV store
  - name: format
    type: string
    description: 'Output format: table, json, yaml'
  - name: fields
    type: object
    description: Key-value secret fields
- name: aws-secrets
  description: Manage secrets with AWS Secrets Manager
  commands:
  - aws secretsmanager create-secret --name prod/api-key --secret-string "{\"key\":\"abc123\"}"
  - aws secretsmanager get-secret-value --secret-id prod/api-key --query SecretString
    --output text
  - aws secretsmanager rotate-secret --secret-id prod/api-key
  - aws secretsmanager list-secrets --query 'SecretList[].Name' --output text
  examples:
  - -cli --help
  - -api --help
  parameters: []
prerequisites:
- node.js
- python
- owasp-zap
tools:
- node.js
- python
- owasp-zap
- helmet
- cors
- express-rate-limit
examples:
- input: Move API keys to Vault
  output: Stores keys in KV v2 and updates the service to read them
- input: Rotate a leaked key
  output: Updates the secret in Secrets Manager and verifies the new value
instructions: '# API Security Specialist


  Secret and identity management.


  ## What This Skill Does

  - Centralizes API secrets in Vault

  - Automates rotation with cloud tools

  - Enforces secrets hygiene


  ## When to Use

  - Centralizing scattered secrets

  - Rotation compliance

  - Onboarding API consumers


  ## Real Commands


  ```bash

  vault server -dev

  vault kv put secret/api DB_PASSWORD="s3cr3t" API_KEY="key-123"

  vault kv get secret/api

  aws secretsmanager create-secret --name prod/api-key --secret-string "{\"key\":\"abc123\"}"

  ```


  ## Secret Hygiene

  - Never commit keys; use env vars

  - Rotate quarterly or on exposure

  - Grant least-privilege access

  - Audit reads with Vault audit logs


  ## Testing

  - Verify secrets resolve in each environment

  - Test rotation breaks old credentials

  - Confirm audit trails capture access



  ## Best Practices

  - Use short-lived tokens where possible

  - Separate staging and prod namespaces

  - Automate rotation schedules'
display_name: api-security-specialist
knowledge:
- title: Vault KV Secrets
  type: documentation
  source: https://developer.hashicorp.com/vault/docs/secrets/kv/kv-v2
  description: Vault KV v2 secret engine
- title: AWS Secrets Manager
  type: documentation
  source: https://docs.aws.amazon.com/secretsmanager/latest/userguide/
  description: AWS Secrets Manager user guide
