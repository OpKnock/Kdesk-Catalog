name: api-test-data-sqlite-seeding
version: 2.0.0
type: skill
category: testing
description: 'Seeds database test data with SQL scripts and Node scripts: sqlite3 import, PostgreSQL COPY/INSERT,
  fixtures, and repeatable seed flows.'
keywords:
- test-data
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: api-test-data-sqlite-seeding.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-api-test-data-sqlite-seeding
  generic:
    system_prompt: 'You take the Api Test Data Sqlite Seeding seat. You do it through sqlite-seeding:
      Seed SQLite databases for API tests. The commands are real, e.g. `sqlite3 test.db CREATE TABLE users
      (id INTEGER PRIMARY KEY, name TEXT, email TEXT)`. You work hands-on and only report outcomes you
      have observed.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: sqlite-seeding
  description: Seed SQLite databases for API tests
  commands:
  - sqlite3 test.db "CREATE TABLE users (id INTEGER PRIMARY KEY, name TEXT, email TEXT)"
  - sqlite3 test.db "INSERT INTO users (name, email) VALUES ('alice', 'a@example.com'), ('bob', 'b@example.com')"
  - sqlite3 test.db "SELECT COUNT(*) FROM users"
  - node -e "const db=require('better-sqlite3')('test.db'); db.prepare('INSERT INTO users (name,email)
    VALUES (?,?)').run('carol','c@example.com'); console.log(db.prepare('SELECT COUNT(*) c FROM users').get())"
  - sqlite3 test.db ".dump" > seed.sql
  examples:
  - sqlite3 multi-row INSERT seeds fixtures
  - better-sqlite3 runs prepared statements
  - .dump exports the full seed
  parameters:
  - name: db-file
    type: string
    description: SQLite database file
  - name: table
    type: string
    description: Target table
  - name: sql
    type: string
    description: SQL statement
- name: postgres-seeding
  description: Seed PostgreSQL for integration tests
  commands:
  - psql -d app -f seed.sql
  - psql -d app -c "COPY users (name, email) FROM '/tmp/users.csv' WITH (FORMAT csv, HEADER true)"
  - psql -d app -c "TRUNCATE users RESTART IDENTITY"
  - pg_dump --data-only -t users app > seed.sql
  examples: []
  parameters: []
prerequisites:
- faker
- node.js
- python
tools:
- faker
- node.js
- python
- factory-boy
- json-schema-faker
examples:
- input: Seed users for integration tests
  output: Creates a seed.sql and runs it with psql, then truncates between suites
- input: Bulk load 10k rows
  output: Uses COPY from CSV for fast inserts
instructions: '# API Test Data v2 - Database Seeding


  Database seeding for API tests.


  ## What This Skill Does

  - Seeds SQLite and PostgreSQL fixtures

  - Resets state between tests

  - Exports reusable seed scripts


  ## When to Use

  - Integration test databases

  - CI ephemeral environments

  - Reproducible local dev data


  ## Real Commands


  ```bash

  sqlite3 test.db "INSERT INTO users (name, email) VALUES (''alice'', ''a@example.com'')"

  psql -d app -c "COPY users (name, email) FROM ''/tmp/users.csv'' WITH (FORMAT csv, HEADER true)"

  psql -d app -c "TRUNCATE users RESTART IDENTITY"

  ```


  ## Seeding Strategy

  1. Truncate with restart identity

  2. Insert fixtures in dependency order

  3. Re-verify with count queries


  ## Testing

  - Reset then seed in test setup hooks

  - Verify foreign keys after truncation

  - Time large seeds with COPY vs INSERT



  ## Best Practices

  - Keep seed scripts idempotent

  - Version seeds with migrations

  - Use CSV COPY for bulk rows'
