name: api-versioning-engineer
version: 2.0.0
type: skill
category: backend
description: 'Implements versioning in Java/Spring Boot: versioned controllers, request mapping constraints,
  media-type versioning, and endpoint tests.'
keywords:
- api-versioning
- content-negotiation
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: api-versioning-engineer.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-api-versioning-engineer
  generic:
    system_prompt: 'You take the api-versioning-engineer seat. You do it through spring-versioning: Version
      Spring REST controllers. The commands are real, e.g. `curl -s https://start.spring.io/starter.zip
      -d dependencies=web,validation -d...`. You work hands-on and only report outcomes you have observed.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: spring-versioning
  description: Version Spring REST controllers
  commands:
  - curl -s https://start.spring.io/starter.zip -d dependencies=web,validation -d packageName=com.example
    -o ver.zip && unzip -o ver.zip -d ver
  - 'curl -s -H ''Accept: application/vnd.example.v1+json'' http://localhost:8080/api/users | jq ''.version'''
  - 'curl -s -H ''Accept: application/vnd.example.v2+json'' http://localhost:8080/api/users | jq ''.version'''
  - ./mvnw clean test
  - ./mvnw spring-boot:run
  examples:
  - produces/consumes media types version routes
  - 'Accept: application/vnd.example.v2+json selects v2'
  - Controller-level @RequestMapping versioning
  parameters:
  - name: media-type
    type: string
    description: Vendor media type
  - name: version
    type: string
    description: Version in the media type
  - name: endpoint
    type: string
    description: Controller endpoint
- name: version-tests
  description: Test versioned endpoints
  commands:
  - ./mvnw test -Dtest=UserControllerTest
  - 'curl -s -D- -H ''Accept: application/vnd.example.v1+json'' http://localhost:8080/api/users | grep
    -i ''^vary:'''
  - 'curl -s -H ''Accept: application/json'' http://localhost:8080/api/users -o /dev/null -w ''%{http_code}\n'''
  examples: []
  parameters: []
prerequisites:
- node.js
- python
- openapi-generator
tools:
- node.js
- python
- openapi-generator
- postman
- stoplight-studio
examples:
- input: Add media-type versioning
  output: Splits controllers by produces and verifies content negotiation
- input: Test version selection
  output: Writes controller tests for v1 and v2 Accept headers
instructions: '# API Versioning Engineer


  Spring Boot API versioning.


  ## What This Skill Does

  - Versions endpoints with media types

  - Controls content negotiation

  - Tests version selection


  ## When to Use

  - Java/Spring APIs with external clients

  - Media-type versioning strategies

  - Backward-compatible evolution


  ## Real Commands


  ```bash

  curl -s -H ''Accept: application/vnd.example.v1+json'' http://localhost:8080/api/users | jq ''.version''

  curl -s -H ''Accept: application/vnd.example.v2+json'' http://localhost:8080/api/users | jq ''.version''

  ```


  ## Controller Example


  ```java

  @RestController

  @RequestMapping(value = "/api/users", produces = "application/vnd.example.v2+json")

  public class UserV2Controller { }

  ```


  ## Testing

  - Test each version media type

  - Verify Vary header includes Accept

  - Confirm 406 for unsupported versions



  ## Best Practices

  - Register media types explicitly

  - Document versions in OpenAPI

  - Keep version-specific logic separated'
