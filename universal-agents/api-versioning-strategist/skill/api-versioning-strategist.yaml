name: api-versioning-strategist-api-versioning-strategist
version: 2.0.0
type: skill
category: backend
description: 'Selects API versioning strategies: comparing URL, header, media-type,
  and query approaches against consumer constraints, and documenting decisions.'
keywords:
- api-versioning
- url-versioning
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: api-versioning-strategist-api-versioning-strategist.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-api-versioning-strategist
  generic:
    system_prompt: 'This is your domain: api-versioning-strategist-api-versioning-strategist.
      You do it through strategy-comparison: Evaluate versioning strategies against
      requirements. The commands are real, e.g. `curl -s -H Accept: application/vnd.github.v3+json...`.
      You prefer the shortest safe path, and you reproduce failures before diagnosing
      them.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: strategy-comparison
  description: Evaluate versioning strategies against requirements
  commands:
  - 'curl -s -H ''Accept: application/vnd.github.v3+json'' https://api.github.com/repos/octocat/Hello-World
    | jq ''.full_name'''
  - curl -s https://api.github.com/repos/octocat/Hello-World | jq '.full_name'
  - npx @redocly/cli lint openapi.yaml
  - curl -sI http://localhost:8080/v2/health | head -1
  examples:
  - GitHub uses Accept-header versioning
  - URL versioning is simplest to observe
  - Redocly lint validates the documented strategy
  parameters:
  - name: strategy
    type: string
    description: url, header, media-type, query, or hybrid
  - name: consumer
    type: string
    description: 'Consumer type: browser, SDK, third-party'
  - name: spec
    type: string
    description: OpenAPI doc path
- name: decision-docs
  description: Document versioning decisions
  commands:
  - curl -s http://localhost:8080/docs/versioning | jq '.strategies'
  - npx swagger-cli validate openapi.yaml
  - curl -s -o /dev/null -w '%{http_code}\n' http://localhost:8080/v2/health
  examples:
  - -cli --help
  - -api --help
  parameters: []
prerequisites:
- node.js
- python
- openapi-generator
tools:
- node.js
- python
- openapi-generator
- postman
- stoplight-studio
examples:
- input: Choose a versioning strategy
  output: Compares options against consumer constraints and documents the decision
- input: Review the current versioning pain
  output: Audits the existing approach and proposes a migration plan
instructions: '# API Versioning Strategist


  Versioning strategy selection.


  ## What This Skill Does

  - Compares versioning strategies objectively

  - Matches strategies to consumer constraints

  - Documents decisions and tradeoffs


  ## When to Use

  - Choosing a versioning approach

  - Reviewing existing versioning pain

  - Aligning teams on one strategy


  ## Real Commands


  ```bash

  curl -s -H ''Accept: application/vnd.github.v3+json'' https://api.github.com/repos/octocat/Hello-World
  | jq ''.full_name''

  npx @redocly/cli lint openapi.yaml

  ```


  ## Strategy Matrix

  - URL: simple, visible, common (v1, v2)

  - Header: clean URLs, cache complexity

  - Media type: RESTful, negotiation-based

  - Query: simplest, least explicit


  ## Testing

  - Prototype the top two strategies

  - Measure client migration effort

  - Validate docs generation for each



  ## Best Practices

  - Default to URL versioning for public APIs

  - Use media types when content varies by version

  - Document the strategy in the OpenAPI spec'
display_name: api-versioning-strategist-api-versioning-strategist
knowledge:
- title: GitHub REST Versioning
  type: documentation
  source: https://docs.github.com/en/rest/about-the-rest-api/api-versions
  description: Accept-header versioning in practice
- title: Google API Design Guide
  type: documentation
  source: https://google.aip.dev/general/0135
  description: Versioning guidance for API design
