name: api-webhook-svix-management
version: 2.0.0
type: skill
category: backend
description: 'Operates webhook infrastructure with Svix and Hookdeck: endpoint management, message dispatch,
  retries, and delivery observability.'
keywords:
- webhooks
- delivery
- retry
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: api-webhook-svix-management.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-api-webhook-svix-management
  generic:
    system_prompt: 'You are the Api Webhook Svix Management specialist. You do it through svix-management:
      Manage webhook endpoints and dispatch messages. The commands are real, e.g. `svix webhook create
      --name order-created --url https://app.example.com/hook`. You work hands-on and only report outcomes
      you have observed.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: svix-management
  description: Manage webhook endpoints and dispatch messages
  commands:
  - svix webhook create --name "order-created" --url https://app.example.com/hook
  - svix webhook get --id wh_xxxx
  - svix webhook list
  - 'curl -s -X POST http://localhost:8071/api/v1/message -H ''Authorization: Bearer $SVIX_TOKEN'' -H
    ''Content-Type: application/json'' -d ''{"eventType":"order.created","payload":{"id":1}}'''
  - curl -s http://localhost:8071/api/v1/health -o /dev/null -w '%{http_code}\n'
  examples:
  - svix webhook create registers an endpoint
  - POST /message dispatches a signed event
  - svix webhook list shows endpoint status
  parameters:
  - name: endpoint
    type: string
    description: Webhook URL
  - name: event-type
    type: string
    description: Event type name
  - name: payload
    type: object
    description: Event payload
- name: hookdeck
  description: Route and observe webhooks with Hookdeck
  commands:
  - hookdeck login
  - hookdeck listen 3000 webhook
  - hookdeck sources list
  - hookdeck destinations list
  - hookdeck events list
  examples: []
  parameters: []
prerequisites:
- node.js
- python
- ngrok
- redis
tools:
- node.js
- python
- ngrok
- redis
- stripe-cli
examples:
- input: Dispatch order.created to a customer
  output: Creates the endpoint and posts the typed message with Svix
- input: Route webhooks to dev servers
  output: Uses hookdeck listen to forward into localhost
instructions: '# API Webhook v3 - Infrastructure


  Webhook platform operations.


  ## What This Skill Does

  - Manages endpoints and event types

  - Dispatches signed messages

  - Provides retry and observability


  ## When to Use

  - Running webhooks at scale

  - Reliable delivery guarantees

  - Multi-endpoint fan-out


  ## Real Commands


  ```bash

  svix webhook create --name "order-created" --url https://app.example.com/hook

  curl -s -X POST http://localhost:8071/api/v1/message -H ''Authorization: Bearer $SVIX_TOKEN'' -H ''Content-Type:
  application/json'' -d ''{"eventType":"order.created","payload":{"id":1}}''

  hookdeck listen 3000 webhook

  ```


  ## Message Flow

  1. Register endpoints with URLs

  2. Dispatch typed events

  3. Platform retries failures

  4. Inspect delivery attempts


  ## Testing

  - Trigger events and verify signed delivery

  - Test endpoint downtime retries

  - Review delivery attempt logs



  ## Best Practices

  - Register event types explicitly

  - Rotate signing secrets

  - Monitor delivery failure rates'
display_name: Api Webhook Svix Management
