name: api-async-agent
display_name: Async API Agent
category: api
subcategory: agent
description: Specializes in event-driven API development using the AsyncAPI specification. Validates AsyncAPI documents, detects breaking changes across versions, and generates code, documentation, and mock servers from validated specs for Kafka, MQTT, AMQP, and WebSocket channels.
version: 2.0.0
tags:
- api
- agent
- asyncapi
- event-driven
- kafka
- mqtt
author: Mehul Wagde
license: MIT
capabilities:
- name: spec-validation
  description: Validates AsyncAPI documents against the specification schema before any generation step.
  commands:
  - 'asyncapi validate asyncapi.yaml'
  - 'asyncapi validate asyncapi.yaml --verbose'
  examples:
  - 'asyncapi validate asyncapi.yaml'
  - 'asyncapi validate ./specs/events.yaml --verbose'
  parameters:
  - name: spec_path
    type: string
    description: Path to the AsyncAPI document
  - name: verbose
    type: boolean
    description: Show detailed validation output
- name: contract-diff
  description: Compares two AsyncAPI specifications to identify breaking changes in channels, operations, and message payloads.
  commands:
  - 'asyncapi diff asyncapi-v1.yaml asyncapi-v2.yaml'
  - 'asyncapi diff asyncapi-v1.yaml asyncapi-v2.yaml --format=markdown'
  examples:
  - 'asyncapi diff v1.yaml v2.yaml'
  - 'asyncapi diff ./specs/v1.yaml ./specs/v2.yaml --format=markdown > CHANGES.md'
  parameters:
  - name: old_spec
    type: string
    description: Path to the previous AsyncAPI spec
  - name: new_spec
    type: string
    description: Path to the new AsyncAPI spec
  - name: format
    type: string
    description: Output format (text, markdown, json)
- name: artifact-generation
  description: Generates code, documentation, and mock servers from validated AsyncAPI specs using templates.
  commands:
  - 'asyncapi generate fromTemplate @asyncapi/nodejs-template asyncapi.yaml -o ./output'
  - 'asyncapi generate fromTemplate @asyncapi/html-template asyncapi.yaml -o ./docs'
  - 'asyncapi generate fromTemplate @asyncapi/markdown-template asyncapi.yaml -o ./docs'
  examples:
  - 'asyncapi generate fromTemplate @asyncapi/nodejs-template asyncapi.yaml -o ./generated'
  - 'asyncapi generate fromTemplate @asyncapi/python-paho-template asyncapi.yaml -o ./consumer'
  - 'asyncapi generate fromTemplate @asyncapi/html-template asyncapi.yaml -o ./docs'
  parameters:
  - name: template
    type: string
    description: Template package name (e.g., @asyncapi/nodejs-template)
  - name: spec_path
    type: string
    description: Path to the validated AsyncAPI document
  - name: output_dir
    type: string
    description: Destination directory for generated artifacts
