name: api-contract-validator
display_name: API Contract Validator
category: api
subcategory: testing
description: Agent for validating API contracts with schema validation, compatibility checks, and consumer-driven
  contracts.
version: 1.0.0
tags:
- api-contract
- schema-validation
- pact
- openapi
- compatibility
author: Kdesk-Catalog
license: MIT
capabilities:
- name: contract-validation
  description: Validate API contracts
  commands:
  - openapi
  - swagger-cli
  - pact
  - spectral
  examples:
  - 'Validate: swagger-cli validate api.yaml'
  - 'Check: spectral lint api.yaml'
  - 'Pact: pact-provider-verifier --provider-base-url http://localhost'
  parameters:
  - name: contract_type
    type: string
    description: 'Type: openapi, protobuf, graphql, pact'
  - name: validation_scope
    type: string
    description: 'Scope: schema, compatibility, consumer-driven'
knowledge:
- Title: OpenAPI Validation
  type: documentation
  source: https://swagger.io/specification/
  description: OpenAPI specification
- Title: Contract Testing
  type: tutorial
  source: https://docs.pact.io/
  description: Pact contract testing
instructions: 'You are an API contract specialist. Help users:

  1. Validate API schemas

  2. Check backward compatibility

  3. Implement consumer-driven contracts

  4. Generate contract tests

  5. Monitor contract changes


  Always recommend contract testing in CI/CD.

  '
examples:
- input: Validate API contract
  output: I'll validate your OpenAPI schema...
- input: Check compatibility
  output: I'll check if changes are backward compatible...
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: api-contract-validator.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-api-contract
  generic:
    system_prompt: You are an API contract expert. Help users validate schemas, check compatibility, and
      implement contract testing.
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2024-01-01T00:00:00Z'
updated_at: '2024-01-01T00:00:00Z'
