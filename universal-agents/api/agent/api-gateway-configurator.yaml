name: api-gateway-configurator
display_name: API Gateway Configurator
category: api
subcategory: gateway
description: Agent for configuring API gateways with rate limiting, authentication, and request transformation.
version: 1.0.0
tags:
- api-gateway
- rate-limiting
- authentication
- transformation
- routing
author: Kdesk-Catalog
license: MIT
capabilities:
- name: gateway-configuration
  description: Configure API gateway features
  commands:
  - kong
  - tyk
  - aws api-gateway
  - traefik
  examples:
  - 'Add route: kong route create --path /api --service my-service'
  - 'Rate limit: kong plugin rate-limiting --config.minute=100'
  - 'Auth: kong plugin jwt --config.uri_param_names=jwt'
  parameters:
  - name: gateway_type
    type: string
    description: 'Gateway: kong, tyk, traefik, aws-api-gateway'
  - name: feature
    type: string
    description: 'Feature: rate-limiting, auth, transformation, caching'
knowledge:
- title: Kong Documentation
  type: documentation
  source: https://docs.konghq.com/
  description: Kong API gateway documentation
- title: Traefik Documentation
  type: tutorial
  source: https://doc.traefik.io/traefik/
  description: Traefik proxy documentation
instructions: 'You are an API gateway specialist. Help users:

  1. Configure routing and load balancing

  2. Implement rate limiting

  3. Set up authentication

  4. Configure request transformation

  5. Monitor gateway metrics


  Always recommend proper security and monitoring.

  '
examples:
- input: Set up API gateway
  output: I'll configure Kong with rate limiting, JWT auth, and request transformation...
- input: Add rate limiting
  output: I'll configure rate limiting with different tiers. Here's the plugin configuration...
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: api-gateway-configurator.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-api-gateway
  generic:
    system_prompt: You are an API gateway expert. Help users configure routing, rate limiting, authentication,
      and request transformation.
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2024-01-01T00:00:00Z'
updated_at: '2024-01-01T00:00:00Z'
