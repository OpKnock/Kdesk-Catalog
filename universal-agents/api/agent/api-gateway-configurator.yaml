name: api-gateway-configurator
display_name: API Gateway Configurator
category: api
subcategory: gateway
description: Configures API gateways (Kong, Traefik, AWS API Gateway, Envoy) for routing, rate limiting, authentication, request/response transformation, and observability. Manages declarative configuration as code and validates gateway state.
version: 2.0.0
tags:
- api-gateway
- rate-limiting
- authentication
- transformation
- routing
- kong
- traefik
- envoy
author: Mehul Wagde
license: MIT
capabilities:
- name: kong-management
  description: Manages Kong services, routes, plugins, and consumers via decK declarative configuration.
  commands:
  - 'deck sync --state kong.yaml'
  - 'deck validate --state kong.yaml'
  - 'deck diff --state kong.yaml'
  - 'kong config db_import kong.yaml'
  - 'curl -s http://localhost:8001/services | jq'
  examples:
  - 'deck sync --state ./kong/kong.yaml'
  - 'deck validate --state ./kong/kong.yaml'
  - 'deck diff --state ./kong/kong.yaml --kong-addr=http://localhost:8001'
  parameters:
  - name: state_file
    type: string
    description: Path to decK state file (kong.yaml)
  - name: kong_addr
    type: string
    description: Kong Admin API address
- name: traefik-configuration
  description: Configures Traefik dynamic configuration for routing, middleware, and TLS.
  commands:
  - 'kubectl apply -f traefik-dynamic.yaml'
  - 'kubectl get ingressroute -A'
  - 'kubectl get middleware -A'
  - 'curl -s http://localhost:8080/api/http/routers | jq'
  examples:
  - 'kubectl apply -f ./traefik/ingressroute.yaml'
  - 'kubectl apply -f ./traefik/middleware-rate-limit.yaml'
  - 'curl -s http://traefik:8080/api/http/services | jq'
  parameters:
  - name: config_file
    type: string
    description: Traefik dynamic config YAML
  - name: namespace
    type: string
    description: Kubernetes namespace for resources
- name: gateway-plugins
  description: Configures authentication, rate limiting, transformation, and logging plugins across gateway types.
  commands:
  - 'deck file add-plugin kong.yaml --name=rate-limiting --config.minute=100 --config.policy=local'
  - 'deck file add-plugin kong.yaml --name=jwt --config.key_claim_name=iss'
  - 'deck file add-plugin kong.yaml --name=request-transformer --config.add.headers="X-User-ID:$(consumer.id)"'
  - 'kubectl annotate ingressroute my-route traefik.ingress.kubernetes.io/router.middlewares=default-rate-limit@kubernetescrd'
  examples:
  - 'deck file add-plugin kong.yaml --name=rate-limiting --config.minute=100 --config.policy=redis --config.redis_host=redis'
  - 'deck file add-plugin kong.yaml --name=oauth2 --config.scopes="read write" --config.mandatory_scope=true'
  - 'kubectl apply -f ./traefik/middleware-auth.yaml'
  parameters:
  - name: plugin_name
    type: string
    description: Plugin name (rate-limiting, jwt, oauth2, cors, request-transformer)
  - name: config
    type: string
    description: Plugin configuration as key=value pairs
knowledge:
- title: Kong Gateway Documentation
  type: documentation
  source: https://docs.konghq.com/gateway/latest/
  description: Kong configuration, plugins, and decK workflows
- title: decK Documentation
  type: documentation
  source: https://docs.konghq.com/deck/latest/
  description: Declarative configuration for Kong
- title: Traefik Middleware
  type: documentation
  source: https://doc.traefik.io/traefik/middlewares/
  description: Rate limiting, auth, headers, and custom middleware
- title: AWS API Gateway
  type: documentation
  source: https://docs.aws.amazon.com/apigateway/latest/developerguide/welcome.html
  description: REST and WebSocket API management
- title: Envoy Proxy Configuration
  type: documentation
