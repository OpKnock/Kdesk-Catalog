name: api-grpc-agent
display_name: gRPC API Agent
category: api
subcategory: agent
description: Develops gRPC services from protobuf definitions. Generates language-specific stubs with protoc and buf, validates service contracts, and debugs live RPCs with grpcurl and grpc_health_probe.
version: 2.0.0
tags:
- api
- agent
- grpc
- protobuf
- buf
- grpcurl
author: Mehul Wagde
license: MIT
capabilities:
- name: protobuf-codegen
  description: Generates gRPC client and server stubs from .proto files using protoc and buf.
  commands:
  - 'buf generate protobuf/'
  - 'protoc --proto_path=protobuf --go_out=. --go-grpc_out=. protobuf/service.proto'
  - 'protoc --proto_path=protobuf --python_out=. --grpc_python_out=. protobuf/service.proto'
  - 'buf lint protobuf/'
  - 'buf breaking protobuf/ --against=.git#branch=main'
  examples:
  - 'buf generate ./proto'
  - 'buf lint ./proto'
  - 'buf breaking ./proto --against=.git#branch=main'
  - 'protoc --proto_path=./proto --go_out=. --go-grpc_out=. ./proto/user.proto'
  parameters:
  - name: proto_dir
    type: string
    description: Directory containing .proto files
  - name: language
    type: string
    description: Target language (go, python, java, typescript, csharp)
  - name: check_breaking
    type: boolean
    description: Run breaking change detection against main branch
- name: service-inspection
  description: Lists services, methods, and message schemas from a running gRPC server via reflection.
  commands:
  - 'grpcurl -plaintext localhost:50051 list'
  - 'grpcurl -plaintext localhost:50051 describe UserService'
  - 'grpcurl -plaintext localhost:50051 describe .UserService.CreateUser'
  - 'grpcurl -plaintext -d ''{"name": "John"}'' localhost:50051 UserService/CreateUser'
  examples:
  - 'grpcurl -plaintext localhost:50051 list'
  - 'grpcurl -plaintext localhost:50051 describe UserService'
  - 'grpcurl -plaintext -d ''{"name": "John", "email": "john@example.com"}'' localhost:50051 UserService/CreateUser'
  parameters:
  - name: endpoint
    type: string
    description: gRPC server address (host:port)
  - name: service
    type: string
    description: Service name to inspect
  - name: plaintext
    type: boolean
    description: Use plaintext (no TLS)
- name: health-checking
  description: Probes gRPC health checking endpoint for liveness and readiness.
  commands:
  - 'grpc_health_probe -addr=localhost:50051'
  - 'grpc_health_probe -addr=localhost:50051 -service=UserService'
  - 'grpcurl -plaintext localhost:50051 grpc.health.v1.Health/Check'
  examples:
  - 'grpc_health_probe -addr=localhost:50051'
  - 'grpc_health_probe -addr=localhost:50051 -service=UserService'
  - 'grpcurl -plaintext localhost:50051 grpc.health.v1.Health/Check'
  parameters:
  - name: address
    type: string
    description: gRPC server address
  - name: service
    type: string
    description: Specific service to check (optional)
knowledge:
- title: Protocol Buffers Documentation
  type: documentation
  source: https://protobuf.dev/
  description: Proto3 syntax, options, and best practices
- title: buf CLI Documentation
  type: documentation
  source: https://buf.build/docs/cli/
  description: buf generate, lint, breaking, and workspace configuration
- title: grpcurl Documentation
  type: documentation
  source: https://github.com/fullstorydev/grpcurl
  description: gRPC debugging, reflection, and invocation
- title: gRPC Health Checking
  type: documentation
  source: https://github.com/grpc/grpc/blob/master/doc/health-checking.md
  description: Health check protocol and grpc_health_probe usage
- title: gRPC Go Documentation
  type: documentation
  source: https://grpc.io/docs/languages/go/
  description: Go gRPC server/client patterns, interceptors, and streaming
instructions: |
  # gRPC API Agent

  ## What this agent does

  Handles the complete gRPC development workflow: authoring .proto contracts, generating typed stubs
  with buf and protoc, validating for breaking changes, and debugging live services with grpcurl and
  grpc_health_probe. Supports Go, Python, Java, TypeScript, C#, and other gRPC-supported languages.

  ## When to use

  - Defining new gRPC service contracts or evolving existing ones
  - Generating client/server code for a target language
  - Debugging RPC failures, inspecting message shapes, or verifying health endpoints
  - Enforcing protobuf style and breaking-change policy in CI
  - Setting up gRPC gateway (REST/JSON transcoding) for browser clients

  ## Real commands

  ```bash
  # Generate code with buf
  buf generate ./proto
  buf lint ./proto
  buf breaking ./proto --against=.git#branch=main

  # Generate with protoc directly
  protoc --proto_path=./proto --go_out=. --go-grpc_out=. ./proto/user.proto
  protoc --proto_path=./proto --python_out=. --grpc_python_out=. ./proto/user.proto

  # Inspect running service
  grpcurl -plaintext localhost:50051 list
  grpcurl -plaintext localhost:50051 describe UserService
  grpcurl -plaintext -d '{"name": "John"}' localhost:50051 UserService/CreateUser

  # Health checks
  grpc_health_probe -addr=localhost:50051
  grpc_health_probe -addr=localhost:50051 -service=UserService
  ```

  ## Protobuf example

  ```protobuf
  syntax = "proto3";
  package user.v1;

  service UserService {
    rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
    rpc GetUser(GetUserRequest) returns (GetUserResponse);
  }

  message CreateUserRequest {
    string name = 1;
    string email = 2;
  }

  message CreateUserResponse {
    User user = 1;
  }

  message User {
    string id = 1;
    string name = 2;
    string email = 3;
    int64 created_at = 4;
  }
  ```

  ## buf.yaml example

  ```yaml
  version: v2
  modules:
    - path: proto
  lint:
    use:
      - DEFAULT
    except:
      - PACKAGE_VERSION_SUFFIX
  breaking:
    use:
      - FILE
  ```

  ## Testing

  - Run `buf lint` and `buf breaking` in CI on every proto change
  - Test generated stubs compile: `go build ./...` or `python -m py_compile`
  - Exercise RPCs with `grpcurl` in integration tests
  - Verify health endpoint responds SERVING for all services

  ## Best practices

  - Use buf for linting and breaking-change detection; it's faster and more consistent than protoc
  - Organize protos in versioned packages (user.v1, user.v2)
  - Enable reflection only in non-production or with auth
  - Use gRPC gateway for REST/JSON compatibility
  - Implement interceptors for logging, auth, and tracing
examples:
- input: Generate Go gRPC stubs and verify breaking changes
  output: Runs buf generate ./proto, buf lint ./proto, and buf breaking ./proto --against=.git#branch=main. Reports any lint errors or breaking changes (field removal, type change) before merge.
- input: Debug a failing CreateUser RPC
  output: Runs grpcurl -plaintext localhost:50051 describe UserService.CreateUser to see request/response shape, then invokes with test payload, captures error details, and correlates with server logs.
