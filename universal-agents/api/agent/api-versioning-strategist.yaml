name: api-versioning-strategist
display_name: API Versioning Strategist
category: api
subcategory: lifecycle
description: Designs and implements API versioning strategies (URL path, header, query parameter, media type) with backward compatibility guarantees. Manages deprecation workflows, Sunset headers, and client migration timelines.
version: 2.0.0
tags:
- api-versioning
- backward-compatibility
- deprecation
- lifecycle
- migration
- openapi
author: Kdesk
license: MIT
capabilities:
- name: strategy-selection
  description: Evaluates and selects versioning approach based on consumer constraints and platform capabilities.
  commands:
  - 'curl -H "Accept: application/vnd.api.v2+json" https://api.your-app.test/users'
  - 'curl -H "API-Version: 2" https://api.your-app.test/users'
  - 'curl "https://api.your-app.test/users?version=2"'
  - 'curl "https://api.your-app.test/v2/users"'
  examples:
  - 'curl -s -H "Accept: application/vnd.api.v2+json" https://api.your-app.test/users | jq'
  - 'curl -s -H "API-Version: 2" https://api.your-app.test/users | jq'
  - 'curl -s "https://api.your-app.test/v2/users" | jq'
  - 'curl -s "https://api.your-app.test/users?version=2" | jq'
  parameters:
  - name: strategy
    type: string
    description: Versioning strategy (url-path, header, query-param, media-type)
  - name: version
    type: string
    description: API version identifier
- name: deprecation-management
  description: Implements deprecation headers, Sunset dates, and migration tooling for clients.
  commands:
  - 'curl -I https://api.your-app.test/v1/users'
  - 'curl -H "Accept: application/vnd.api.v1+json" https://api.your-app.test/users'
  examples:
  - 'curl -sI https://api.your-app.test/v1/users | grep -i "deprecation\|sunset"'
  - 'curl -s -H "Accept: application/vnd.api.v1+json" https://api.your-app.test/users -w "\nDeprecation: %{header_deprecation}\nSunset: %{header_sunset}\n"'
  parameters:
  - name: version
    type: string
    description: Version being deprecated
  - name: sunset_date
    type: string
    description: ISO 8601 sunset date
  - name: replacement_version
    type: string
    description: Version clients should migrate to
- name: compatibility-testing
  description: Validates backward compatibility between versions with openapi-diff and consumer contract tests.
  commands:
  - 'openapi-diff openapi-v1.yaml openapi-v2.yaml'
  - 'pact-broker can-i-deploy --pacticipant=API --version=2.0.0 --to=production'
  examples:
  - 'openapi-diff ./api/v1.yaml ./api/v2.yaml --format=markdown'
  - 'spectral lint ./api/v2.yaml --ruleset=./backward-compat-ruleset.yaml'
  - 'pact-broker can-i-deploy --pacticipant=OrdersAPI --version=2.0.0 --to=production'
  parameters:
  - name: old_spec
    type: string
    description: Previous version spec
  - name: new_spec
    type: string
    description: New version spec
