name: openapi-documentation-builder
display_name: OpenAPI Documentation Builder
category: api
subcategory: documentation
description: Builds comprehensive OpenAPI/Swagger documentation with validation, code generation, and interactive publishing. Authors specs with reusable components, generates typed clients for multiple languages, and deploys Redoc/Swagger UI documentation sites.
version: 2.0.0
tags:
- openapi
- swagger
- api-documentation
- code-generation
- validation
- redoc
- swagger-ui
author: Mehul Wagde
license: MIT
capabilities:
- name: spec-authoring
  description: Authors OpenAPI 3.1 documents with reusable components, security schemes, and examples.
  commands:
  - 'swagger-cli validate openapi.yaml'
  - 'spectral lint openapi.yaml --ruleset=spectral:oas'
  - 'redocly lint openapi.yaml'
  examples:
  - 'swagger-cli validate ./api/openapi.yaml'
  - 'spectral lint ./api/openapi.yaml --ruleset=spectral:oas --format=stylish'
  - 'redocly lint ./api/openapi.yaml --format=codeframe'
  parameters:
  - name: spec_path
    type: string
    description: Path to OpenAPI document
  - name: ruleset
    type: string
    description: Spectral ruleset for validation
- name: client-generation
  description: Generates typed client SDKs, server stubs, and TypeScript types from validated OpenAPI specs.
  commands:
  - 'openapi-generator-cli generate -i openapi.yaml -g typescript-axios -o ./client/ts'
  - 'openapi-generator-cli generate -i openapi.yaml -g python-fastapi -o ./server/fastapi'
  - 'openapi-generator-cli generate -i openapi.yaml -g go -o ./client/go'
  - 'openapi-generator-cli generate -i openapi.yaml -g kotlin-spring -o ./client/kotlin'
  - 'openapi-generator-cli generate -i openapi.yaml -g java-spring -o ./server/java'
  examples:
  - 'openapi-generator-cli generate -i ./api/openapi.yaml -g typescript-axios -o ./generated/ts'
  - 'openapi-generator-cli generate -i ./api/openapi.yaml -g python-fastapi -o ./generated/fastapi'
  - 'openapi-generator-cli generate -i ./api/openapi.yaml -g go -o ./generated/go'
  - 'openapi-generator-cli generate -i ./api/openapi.yaml -g kotlin-spring -o ./generated/kotlin'
  parameters:
  - name: spec_path
    type: string
    description: Path to validated OpenAPI spec
  - name: generator
    type: string
    description: Generator name (typescript-axios, python-fastapi, go, kotlin-spring, java-spring)
  - name: output_dir
    type: string
    description: Output directory
- name: documentation-publishing
  description: Builds and deploys interactive API documentation with Redoc and Swagger UI.
  commands:
  - 'redoc-cli bundle openapi.yaml -o docs/index.html'
  - 'redocly build-docs openapi.yaml -o ./docs'
  - 'swagger-ui-serve openapi.yaml -p 8080'
  - 'npx @redocly/cli preview-docs openapi.yaml'
  examples:
  - 'redoc-cli bundle ./api/openapi.yaml -o ./docs/index.html'
  - 'redocly build-docs ./api/openapi.yaml -o ./docs'
  - 'swagger-ui-serve ./api/openapi.yaml -p 8080'
  - 'npx @redocly/cli preview-docs ./api/openapi.yaml'
  parameters:
  - name: spec_path
    type: string
    description: Path to OpenAPI document
  - name: output_dir
    type: string
    description: Output directory for built docs
  - name: tool
    type: string
    description: Documentation tool (redoc, redocly, swagger-ui)
