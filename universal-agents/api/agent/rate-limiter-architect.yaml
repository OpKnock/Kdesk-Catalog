capabilities:
- name: algorithm-design
  description: Designs and implements rate limiting algorithms (token bucket, sliding window, fixed window, leaky bucket) with atomic Redis Lua scripts.
  commands:
  - 'redis-cli --eval sliding_window.lua rate:api:user123 1 1000 60'
  - 'redis-cli --eval token_bucket.lua rate:api:user123 100 1000'
  - 'redis-cli --eval fixed_window.lua rate:api:user123 1000 60'
  - 'redis-cli --eval leaky_bucket.lua rate:api:user123 100 10'
  examples:
  - 'redis-cli --eval sliding_window.lua rate:api:user123 1 1000 60 $(date +%s)'
  - 'redis-cli --eval token_bucket.lua rate:api:user123 100 1000'
  - 'redis-cli EVAL "local c=redis.call(\"INCR\",KEYS[1]) if c==1 then redis.call(\"EXPIRE\",KEYS[1],ARGV[1]) end return c" 1 rate:api:user123 60'
  parameters:
  - name: algorithm
    type: string
    description: Algorithm (sliding-window, token-bucket, fixed-window, leaky-bucket)
  - name: key
    type: string
    description: Redis key pattern
  - name: limit
    type: number
    description: Maximum requests
  - name: window_or_rate
    type: number
    description: Window seconds or refill rate
- name: gateway-integration
  description: Configures rate limiting at Kong, Envoy, and nginx gateways with declarative policies.
  commands:
  - 'deck file add-plugin kong.yaml --name=rate-limiting --config.minute=1000 --config.policy=redis --config.redis_host=redis --config.fault_tolerant=true'
  - 'kubectl apply -f envoy-ratelimit-config.yaml'
  - 'nginx -t && nginx -s reload'
  - 'printf "limit_req_zone \$binary_remote_addr zone=api:10m rate=100r/s;\nserver { location /api/ { limit_req zone=api burst=200 nodelay; limit_req_status 429; proxy_pass http://backend; } }\n" > /etc/nginx/conf.d/ratelimit.conf'
  - 'nginx -t && nginx -s reload'
  examples:
  - 'deck file add-plugin kong.yaml --name=rate-limiting --config.minute=1000 --config.policy=redis --config.redis_host=redis --config.fault_tolerant=true'
  - 'kubectl apply -f ./envoy/ratelimit-filter.yaml'
  - 'printf "limit_req_zone \$binary_remote_addr zone=api:10m rate=100r/s;\nserver { location /api/ { limit_req zone=api burst=200 nodelay; limit_req_status 429; proxy_pass http://backend; } }\n" > /etc/nginx/conf.d/ratelimit.conf'
  - 'nginx -t && nginx -s reload'
  parameters:
  - name: gateway
    type: string
    description: Gateway (kong, envoy, nginx)
  - name: policy
    type: string
    description: Kong policy (local, redis, cluster)
  - name: limit
    type: number
    description: Request limit per window
- name: tiered-limits
  description: Implements tiered rate limits (free/pro/enterprise) with dynamic configuration.
  commands:
  - 'redis-cli HSET tier:free limit 100 window 60'
  - 'redis-cli HSET tier:pro limit 1000 window 60'
  - 'redis-cli HSET tier:enterprise limit 10000 window 60'
  - 'redis-cli HGETALL tier:pro'
  examples:
  - 'redis-cli HSET tier:free limit 100 window 60'
  - 'redis-cli HSET tier:pro limit 1000 window 60'
  - 'redis-cli HGETALL tier:pro'
  - 'redis-cli EVAL "local t=redis.call(\"HGET\",KEYS[1],\"limit\") local w=redis.call(\"HGET\",KEYS[1],\"window\") return {t,w}" 1 tier:pro'
  parameters:
  - name: tier
    type: string
    description: Tier name (free, pro, enterprise)
  - name: limit
    type: number
    description: Request limit for tier
  - name: window_seconds
    type: number
    description: Window in seconds
- name: load-test-validation
  description: Validates rate limiting behavior under load with k6, hey, and header assertions.
  commands:
  - 'hey -n 2000 -c 50 -H "x-api-key: test-key" http://localhost:8000/api'
  - 'k6 run rate-limit-test.js'
  examples:
  - 'hey -n 2000 -c 50 -H "x-api-key: test-key" http://localhost:8000/api'
  - 'k6 run ./tests/rate-limit-test.js'
  - 'curl -i -H "x-api-key: test-key" http://localhost:8000/api | grep -i "ratelimit\|retry"'
  parameters:
  - name: tool
    type: string
    description: Load test tool (hey, k6, vegeta)
  - name: target_rate
    type: number
    description: Target requests per second
  - name: expected_429_rate
    type: number
    description: Expected 429 percentage
