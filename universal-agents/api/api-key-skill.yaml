name: api-key
display_name: Api Key
category: api
subcategory: general
description: 'Designs, generates, stores, and rotates API keys: high-entropy generation with openssl,
  hashed storage, and Vault-backed issuance.'
version: 2.0.0
tags:
- api
author: Mehul Wagde
license: MIT
prerequisites:
- node
- openssl
- uuidgen
- vault
capabilities:
- name: key-generation
  description: Generate strong API keys and inspect their entropy.
  commands:
  - openssl rand -hex 32
  - openssl rand -base64 32
  - node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))"
  - uuidgen
  - openssl rand -base64 32 | sha256sum
  examples:
  - KEY=$(openssl rand -hex 32) && echo $KEY
  - openssl rand -base64 48 | tr '+/' '-_' | tr -d '='
  - node -e "console.log(require('crypto').randomBytes(24).toString('hex'))"
  parameters:
  - name: bytes
    type: number
    description: Number of random bytes (32 = 256 bits)
  - name: encoding
    type: string
    description: hex, base64, or base64url
- name: vault-issuance
  description: Store, retrieve, and rotate API keys in HashiCorp Vault KV.
  commands:
  - vault kv put secret/api-keys/prod key=$(openssl rand -hex 32)
  - vault kv get secret/api-keys/prod
  - vault kv list secret/api-keys
  - vault kv delete secret/api-keys/expired
  - vault kv patch secret/api-keys/prod rotated_at=$(date -u +%FT%TZ)
  examples:
  - vault kv put secret/api-keys/prod service=payments key=$(openssl rand -hex 32)
  - vault kv get -field=key secret/api-keys/prod
  - vault kv metadata get secret/api-keys/prod
  parameters:
  - name: path
    type: string
    description: Vault KV path, e.g. secret/api-keys/prod
  - name: field
    type: string
    description: Single field to read from the secret
knowledge:
- title: Vault KV v2
  type: documentation
  source: https://developer.hashicorp.com/vault/docs/secrets/kv/kv-v2
  description: kv put/get/list/patch and versioning
- title: OWASP API Key Cheat Sheet
  type: documentation
  source: https://cheatsheetseries.owasp.org/cheatsheets/API_Key_Security_Cheat_Sheet.html
  description: Generation, storage, rotation guidance
- title: RFC 9110 Authorization
  type: documentation
  source: https://www.rfc-editor.org/rfc/rfc9110#name-authorization
  description: Key transport via Authorization header
instructions: '# API Keys


  ## What this skill does


  End-to-end API key management: generating high-entropy keys with openssl/node crypto, storing them in
  Vault KV, hashing keys at rest, and rotating keys with dual-write grace windows.


  ## When to use


  - Adding key-based auth to an API

  - Responding to a leaked key incident (rotation)

  - Centralizing key storage instead of .env pasting


  ## Real commands


  ```bash

  # Generate a 256-bit key

  openssl rand -hex 32

  openssl rand -base64 32


  # Store in Vault

  vault kv put secret/api-keys/prod key=$(openssl rand -hex 32)


  # Retrieve

  vault kv get -field=key secret/api-keys/prod


  # List / delete

  vault kv list secret/api-keys

  vault kv delete secret/api-keys/expired

  ```


  ## Storage best practice


  Store only a SHA-256 hash of the key in the application database:


  ```bash

  KEY=$(openssl rand -hex 32)

  echo -n "$KEY" | sha256sum

  ```


  Show the raw key exactly once, then hash it.


  ## Rotation checklist


  1. Generate new key and store as v2 in Vault

  2. Deploy dual-read (accept old + new) for a grace window

  3. Cut over writers to the new key

  4. Revoke the old key with vault kv delete


  ## Testing


  - Confirm the old key stops working after revocation

  - Verify Vault ACLs: a service can only read its own path


  ## Best practices


  - Never log keys; redact Authorization in access logs

  - Rate-limit by key and monitor anomalous usage

  - Use X-API-Key header or Bearer tokens consistently'
examples:
- input: Generate a new API key for payments
  output: Runs openssl rand -hex 32, stores it with vault kv put, saves a SHA-256 hash for the app DB,
    and shows the one-time display of the raw key.
- input: A key leaked in a commit, rotate it
  output: Generates a replacement, patches Vault, deploys dual-write, then deletes the compromised version
    and verifies only the new key remains.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: api-key.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-api-key
  generic:
    system_prompt: 'You are the Api Key specialist. You do it through key-generation: Generate strong
      API keys and inspect their entropy. The commands are real, e.g. `openssl rand -hex 32`. You run
      and verify the real CLI commands before you claim anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
