name: argocd
display_name: Argocd
category: api
subcategory: general
description: 'Operates Argo CD for GitOps deployments: app creation, sync policies, health checks, rollbacks,
  and CLI auth.'
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
prerequisites:
- argocd
capabilities:
- name: app-lifecycle
  description: Create, sync, and manage Argo CD applications.
  commands:
  - argocd app create my-api --repo https://github.com/org/my-api --path manifests --dest-server https://kubernetes.default.svc
    --dest-namespace prod
  - argocd app list
  - argocd app sync my-api
  - argocd app get my-api
  - argocd app delete my-api
  examples:
  - argocd app create my-api --repo https://github.com/org/my-api --path charts/api --dest-server https://kubernetes.default.svc
    --dest-namespace prod --helm-set image.tag=v1.2.0
  - argocd app sync my-api --prune --timeout 300
  - argocd app get my-api -o wide
  parameters:
  - name: repo
    type: string
    description: Git repository URL
  - name: path
    type: string
    description: Manifest/helm path in the repo
  - name: namespace
    type: string
    description: Destination namespace
  - name: prune
    type: boolean
    description: Delete resources removed from git during sync
- name: sync-policies
  description: Configure automated sync, pruning, and self-heal behavior.
  commands:
  - argocd app set my-api --sync-policy automated
  - argocd app set my-api --auto-prune
  - argocd app set my-api --self-heal
  - argocd app get my-api --show-operation
  - argocd app wait my-api --health
  examples:
  - argocd app set my-api --sync-policy automated --auto-prune --self-heal
  - argocd app wait my-api --timeout 300
  - argocd app get my-api --refresh
  parameters:
  - name: sync_policy
    type: string
    description: manual or automated
  - name: timeout
    type: number
    description: Sync/wait timeout in seconds
- name: rollback-and-ops
  description: Roll back deployments and manage CLI sessions.
  commands:
  - argocd login argocd.example.com --sso
  - argocd app rollback my-api 3
  - argocd app history my-api
  - argocd app terminate-op my-api
  - argocd account get-user-info
  examples:
  - argocd login argocd.example.com --username admin --insecure
  - argocd app history my-api | head -5
  - argocd app rollback my-api 2 --prune
  parameters:
  - name: revision
    type: number
    description: History index to roll back to
  - name: server
    type: string
    description: Argo CD server URL for login
knowledge:
- title: Argo CD Docs
  type: documentation
  source: https://argo-cd.readthedocs.io/
  description: CLI reference, app model, sync strategies
- title: Argo CD CLI
  type: documentation
  source: https://argo-cd.readthedocs.io/en/stable/user-guide/commands/argocd/
  description: Complete command tree
- title: Declarative GitOps
  type: documentation
  source: https://argo-cd.readthedocs.io/en/stable/operator-manual/declarative-setup/
  description: Applications defined in git
instructions: "# Argo CD\n\n## What this skill does\n\nOperates Argo CD for GitOps: creating apps from\
  \ git repos, controlling sync (manual/automated, prune, self-heal), inspecting sync/health state, rolling\
  \ back to prior revisions, and CLI auth.\n\n## When to use\n\n- Deploying an API's manifests to Kubernetes\
  \ from git\n- Fixing a bad deploy fast via rollback\n- Debugging why the cluster drifts from git\n\n\
  ## Real commands\n\n```bash\nargocd login argocd.example.com --sso\n\nargocd app create my-api --repo\
  \ https://github.com/org/my-api --path manifests --dest-server https://kubernetes.default.svc --dest-namespace\
  \ prod\n\nargocd app sync my-api --prune --timeout 300\n\nargocd app set my-api --sync-policy automated\
  \ --auto-prune --self-heal\n\nargocd app get my-api\nargocd app history my-api\nargocd app rollback\
  \ my-api 3\n```\n\n## Declarative Application\n\n```yaml\napiVersion: argoproj.io/v1alpha1\nkind: Application\n\
  metadata:\n  name: my-api\nspec:\n  destination:\n    server: https://kubernetes.default.svc\n    namespace:\
  \ prod\n  source:\n    repoURL: https://github.com/org/my-api\n    path: manifests\n    targetRevision:\
  \ main\n  syncPolicy:\n    automated:\n      prune: true\n      selfHeal: true\n```\n\n## Testing\n\n\
  - Run `argocd app diff my-api` to preview drift\n- Wait for health with `argocd app wait my-api --health`\n\
  \n## Best practices\n\n- Prefer declarative Applications in git\n- Pin targetRevision (tags, not main)\
  \ for production\n- Enable prune+selfHeal only after diff tooling is in place"
examples:
- input: Deploy our API from the main branch
  output: Logs into Argo CD, creates the Application with --dest-namespace prod, enables automated sync+prune+self-heal,
    verifies Synced/Healthy with argocd app get.
- input: The last deploy broke production, revert it
  output: Runs argocd app history my-api, argocd app rollback my-api 3 --prune, then argocd app wait my-api
    --health.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: argocd.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-argocd
  generic:
    system_prompt: 'Your lane is Argocd. You do it through app-lifecycle: Create, sync, and manage Argo
      CD applications. The commands are real, e.g. `argocd app create my-api --repo https://github.com/org/my-api
      --path manifests...`. You run and verify the real CLI commands before you claim anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
