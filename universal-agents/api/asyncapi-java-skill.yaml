name: asyncapi-java
display_name: Asyncapi Java
category: api
subcategory: general
description: Generates Java Spring Boot projects and POJO models from AsyncAPI documents, then builds,
  runs, and tests them with Maven.
version: 2.0.0
tags:
- api
author: Kdesk
license: MIT
prerequisites:
- java
- mvn
- npx
capabilities:
- name: spring-generation
  description: Generate a Spring Boot async API project from a spec.
  commands:
  - npx @asyncapi/generator asyncapi.yaml @asyncapi/java-spring-template -o ./generated
  - cd generated && ./mvnw clean package
  - cd generated && ./mvnw spring-boot:run
  - curl -s http://localhost:8080/actuator/health
  - java -jar target/asyncapi-spring-0.0.1-SNAPSHOT.jar
  examples:
  - npx @asyncapi/generator asyncapi.yaml @asyncapi/java-spring-template -o ./generated --force-write
  - cd generated && ./mvnw test
  - cd generated && java -jar target/asyncapi-spring-0.0.1-SNAPSHOT.jar
  parameters:
  - name: output
    type: string
    description: Output directory for the generated project
  - name: param
    type: string
    description: Template params, e.g. server=kafka
- name: java-models
  description: Generate Java POJOs from the spec schema with Modelina.
  commands:
  - npx @asyncapi/modelina generate --input asyncapi.yaml --output ./src/main/java --language Java
  - mvn compile
  - mvn test
  - mvn package -DskipTests
  examples:
  - npx @asyncapi/modelina generate --input asyncapi.yaml --output ./src/main/java --language Java --packageName
    com.example.orders
  - mvn package
  - mvn dependency:tree | grep kafka
  parameters:
  - name: package_name
    type: string
    description: Java package for generated models
  - name: type_mapping
    type: string
    description: Custom type mapping, e.g. string=UUID
knowledge:
- title: Java Spring Template
  type: documentation
  source: https://github.com/asyncapi/java-spring-template
  description: Template features and structure
- title: Modelina Java
  type: documentation
  source: https://www.asyncapi.com/docs/tools/modelina/languages/Java
  description: Java model generation options
- title: Spring Boot Reference
  type: documentation
  source: https://docs.spring.io/spring-boot/docs/current/reference/html/
  description: Packaging, profiles, actuator
instructions: '# AsyncAPI Java


  ## What this skill does


  Generates Java/Spring Boot applications from AsyncAPI documents with the java-spring-template, generates
  POJOs with Modelina, and builds/runs/tests with Maven.


  ## When to use


  - Bootstrapping a Spring Boot event consumer/producer from a spec

  - Keeping Java payload classes in sync with message schemas

  - Moving an existing JMS/Kafka app onto spec-driven generation


  ## Real commands


  ```bash

  # Generate a Spring Boot project

  npx @asyncapi/generator asyncapi.yaml @asyncapi/java-spring-template -o ./generated


  # Build and run

  cd generated

  ./mvnw clean package

  ./mvnw spring-boot:run


  # Generate POJOs

  npx @asyncapi/modelina generate --input asyncapi.yaml --output ./src/main/java --language Java --packageName
  com.example.orders

  mvn compile


  # Verify health

  curl -s http://localhost:8080/actuator/health

  ```


  ## Generated structure


  - src/main/java/.../handler/ - message listeners

  - src/main/resources/application.yml - broker connection

  - POJOs in the package you pass with Modelina


  ## Testing


  - ./mvnw test runs generated unit tests

  - Publish a message to the broker and assert the handler logs it


  ## Best practices


  - Override broker settings via Spring profiles

  - Regenerate and diff in CI

  - Use Testcontainers Kafka for hermetic integration tests'
examples:
- input: Generate a Spring Boot project for our order events
  output: Runs the java-spring-template into ./generated, points out application.yml broker config, then
    builds and runs with Maven.
- input: Add typed POJOs for the order schema
  output: Runs Modelina --language Java --packageName com.example.orders, then mvn compile and shows the
    generated class.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: asyncapi-java.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-asyncapi-java
  generic:
    system_prompt: 'You work Asyncapi Java hands-on. You do it through spring-generation: Generate a Spring
      Boot async API project from a spec. The commands are real, e.g. `npx @asyncapi/generator asyncapi.yaml
      @asyncapi/java-spring-template -o ./generated`. You prefer the shortest safe path, and you reproduce
      failures before diagnosing them.'
    available_tools:
    - bash
    - read
    - write
    - edit
