name: audit-logging
display_name: Audit Logging
category: api
subcategory: general
description: 'Implements tamper-resistant audit logging on Linux: auditd configuration, rule creation,
  event search, and report generation.'
version: 2.0.0
tags:
- api
author: Kdesk
license: MIT
prerequisites:
- auditctl
- augenrules
- aureport
- ausearch
- journalctl
- logger
- systemctl
- tail
capabilities:
- name: auditd
  description: Configure the Linux audit daemon and its rules.
  commands:
  - auditctl -w /etc/passwd -p wa -k password_changes
  - auditctl -l
  - systemctl restart auditd
  - auditctl -D
  - augenrules --load
  examples:
  - auditctl -w /etc/shadow -p wa -k shadow_changes
  - auditctl -a always,exit -F arch=b64 -S execve -k exec_events
  - augenrules --check
  parameters:
  - name: watch_path
    type: string
    description: File or directory to watch
  - name: permissions
    type: string
    description: 'Permission filter: r, w, x, a'
  - name: key
    type: string
    description: Audit rule key (max 32 chars)
- name: search-report
  description: Search audit logs and produce summaries.
  commands:
  - ausearch -k password_changes -ts today
  - ausearch -m USER_LOGIN -ts yesterday
  - aureport -au --start today
  - aureport -l --failed
  - ausearch -k exec_events -i
  examples:
  - ausearch -k password_changes -i | tail -20
  - aureport -au -ts 09:00 -te 17:00
  - ausearch -m AVC -ts today | grep -c denied
  parameters:
  - name: key
    type: string
    description: Rule key to filter by
  - name: time_start
    type: string
    description: Start time (-ts), e.g. today or 09:00
  - name: time_end
    type: string
    description: End time (-te)
- name: app-logging
  description: Forward application audit events to syslog/journald.
  commands:
  - logger -t my-api "AUDIT user=alice action=delete resource=order/42"
  - journalctl -u my-api --since "1 hour ago"
  - journalctl -t my-api
  - tail -f /var/log/audit/audit.log
  examples:
  - logger -t my-api "AUDIT user=alice action=export resource=reports/2026"
  - journalctl -u my-api -p err -n 100
  - journalctl -t my-api --output=json-pretty
  parameters:
  - name: tag
    type: string
    description: Syslog tag (-t) for the application
  - name: message
    type: string
    description: Audit event message
knowledge:
- title: auditd Manual
  type: documentation
  source: https://linux.die.net/man/8/auditd
  description: Daemon configuration and rules
- title: ausearch Manual
  type: documentation
  source: https://linux.die.net/man/8/ausearch
  description: Event searching
- title: OWASP Logging Cheat Sheet
  type: documentation
  source: https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html
  description: What to log and how to protect logs
instructions: '# Audit Logging


  ## What this skill does


  Implements tamper-resistant audit logging on Linux: auditd rules for sensitive files and syscalls, event
  search with ausearch, report generation with aureport, and application event forwarding via logger/journald.


  ## When to use


  - Compliance (SOC2, PCI) requires immutable access logs

  - Tracking who changed /etc/passwd or executed privileged commands

  - Centralizing app security events for forensics


  ## Real commands


  ```bash

  # Add a watch rule with a key

  auditctl -w /etc/passwd -p wa -k password_changes


  # List active rules

  auditctl -l


  # Syscall rules (record every execve)

  auditctl -a always,exit -F arch=b64 -S execve -k exec_events


  # Search events by key

  ausearch -k password_changes -ts today -i


  # Summary report

  ureport -au --start today

  ```


  Note: `ausearch -k password_changes -ts today -i` renders human-readable; `aureport -au` lists authentication
  events.


  ## App events


  ```bash

  logger -t my-api "AUDIT user=alice action=delete resource=order/42"

  journalctl -u my-api --since "1 hour ago"

  ```


  ## Testing


  - Touch a watched file and confirm an event via ausearch

  - Compare aureport totals against known activity


  ## Best practices


  - Log who/what/when/result for every privileged action

  - Ship audit.log to a remote SIEM; treat local logs as suspect

  - Use rule keys consistently for fast search'
examples:
- input: Track who modifies /etc/passwd
  output: Adds `auditctl -w /etc/passwd -p wa -k password_changes`, persists via /etc/audit/rules.d/,
    then queries with `ausearch -k password_changes -i`.
- input: Produce an auth report for the compliance review
  output: Runs `aureport -au --start today` and `aureport -l --failed` to summarize successful and failed
    logins.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: audit-logging.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-audit-logging
  generic:
    system_prompt: 'You work Audit Logging hands-on. You do it through auditd: Configure the Linux audit
      daemon and its rules. The commands are real, e.g. `auditctl -w /etc/passwd -p wa -k password_changes`.
      You prefer the shortest safe path, and you reproduce failures before diagnosing them.'
    available_tools:
    - bash
    - read
    - write
    - edit
