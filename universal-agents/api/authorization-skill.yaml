name: authorization
display_name: Authorization
category: api
subcategory: general
description: Configures Kubernetes RBAC roles and bindings with can-i verification, manages AWS IAM policies with permission simulation, and validates role-based access patterns for API endpoints.
version: 2.0.0
tags:
- api
author: Kdesk
license: MIT
prerequisites:
- aws
- kubectl
- mysql
capabilities:
- name: kubernetes-rbac
  description: Create and test RBAC roles and bindings.
  commands:
  - kubectl create role reader --verb=get,list --resource=pods
  - kubectl create rolebinding reader-binding --role=reader --user=jane
  - kubectl auth can-i get pods --as=jane
  - kubectl auth can-i delete pods --as=jane
  - kubectl get role,rolebinding
  examples:
  - kubectl create clusterrole metrics-reader --verb=get --resource=nodes/stats
  - kubectl auth can-i list pods --as=jane --namespace=prod
  - kubectl create rolebinding dev-binding --clusterrole=view --group=devs -n dev
  parameters:
  - name: verb
    type: string
    description: get, list, watch, create, update, delete
  - name: resource
    type: string
    description: Resource or resource/subresource
  - name: user
    type: string
    description: User/group to bind or impersonate
- name: aws-iam
  description: Manage IAM policies, roles, and verify effective permissions.
  commands:
  - aws iam attach-user-policy --user-name deploy-bot --policy-arn arn:aws:iam::aws:policy/ReadOnlyAccess
  - aws iam list-attached-policies --user-name deploy-bot
  - aws iam get-policy-version --policy-arn arn:aws:iam::aws:policy/ReadOnlyAccess --version-id v1
  - aws iam simulate-principal-policy --policy-source-arn arn:aws:iam::111122223333:user/deploy-bot --action-names
    s3:GetObject --resource-arns arn:aws:s3:::my-bucket/*
  - aws iam list-policies --scope Local
  examples:
  - aws iam simulate-principal-policy --policy-source-arn arn:aws:iam::111122223333:user/deploy-bot --action-names
    s3:PutObject s3:DeleteObject --resource-arns arn:aws:s3:::my-bucket/* | jq '.EvaluationResults[].EvalDecision'
  - aws iam get-account-authorization-details --filter Role | jq '.RoleDetailList[].RoleName'
  - aws iam attach-role-policy --role-name api-role --policy-arn arn:aws:iam::aws:policy/service-role/AmazonAPIGatewayPushToCloudWatchLogs
  parameters:
  - name: principal_arn
    type: string
    description: User/role ARN to simulate
  - name: actions
    type: string
    description: Space-separated action names
  - name: resources
    type: string
    description: Resource ARNs to test
- name: design-patterns
  description: Design RBAC/ABAC models with verification checks.
  commands:
  - 'curl -s -o /dev/null -w "%{http_code}\n" -H "Authorization: Bearer $ADMIN" https://api.your-app.test/v1/admin'
  - 'curl -s -o /dev/null -w "%{http_code}\n" -H "Authorization: Bearer $USER" https://api.your-app.test/v1/admin'
  - 'curl -s -o /dev/null -w "%{http_code}\n" -H "Authorization: Bearer $USER" https://api.your-app.test/v1/me'
  - mysql -e "SHOW GRANTS FOR 'app'@'%'"
  examples:
  - 'curl -s -o /dev/null -w "%{http_code}\n" -H "Authorization: Bearer $USER" https://api.your-app.test/v1/other-user-resource'
  - mysql -e "SHOW GRANTS FOR 'readonly'@'%'"
  - kubectl auth can-i --list --as=ci-bot
  parameters:
  - name: role
    type: string
    description: Role being tested
  - name: endpoint
    type: string
    description: Endpoint to probe
knowledge:
- title: Kubernetes RBAC
  type: documentation
  source: https://kubernetes.io/docs/reference/access-authn-authz/rbac/
  description: Roles, bindings, can-i checks
- title: AWS IAM
  type: documentation
  source: https://docs.aws.amazon.com/IAM/latest/UserGuide/
  description: Policies and simulation
- title: OWASP AuthZ Cheat Sheet
  type: documentation
  source: https://cheatsheetseries.owasp.org/cheatsheets/Authorization_Cheat_Sheet.html
  description: Access control design
instructions: '# Authorization


  ## What this skill does


  Implements authorization for APIs and platforms: Kubernetes RBAC roles/bindings with can-i verification,
  AWS IAM policy attachment and permission simulation, and role-based access control design patterns.


  ## When to use


  - A user/team needs least-privilege access on a cluster or AWS account

  - Verifying that a role can (or cannot) perform an action

  - Designing role hierarchies for an API


  ## Real commands


  ```bash

  # Kubernetes RBAC

  kubectl create role reader --verb=get,list --resource=pods

  kubectl create rolebinding reader-binding --role=reader --user=jane

  kubectl auth can-i get pods --as=jane

  kubectl auth can-i delete pods --as=jane


  # AWS IAM

  aws iam attach-user-policy --user-name deploy-bot --policy-arn arn:aws:iam::aws:policy/ReadOnlyAccess

  aws iam simulate-principal-policy --policy-source-arn arn:aws:iam::111122223333:user/deploy-bot --action-names
  s3:GetObject --resource-arns arn:aws:s3:::my-bucket/*


  # API role checks

  curl -s -o /dev/null -w "%{http_code}\n" -H "Authorization: Bearer $USER" https://api.your-app.test/v1/admin

  ```


  ## Testing


  - Use kubectl auth can-i --as=<user> for every role change

  - Use iam simulate-principal-policy before granting access

  - Probe endpoints as each role and assert status codes


  ## Best practices


  - Least privilege: start deny-all, grant narrowly

  - Use groups over individual users

  - Review policy grants quarterly; revoke stale ones'
examples:
- input: Give Jane read access to pods in prod
  output: Creates a reader role (get,list pods), binds it to jane, and verifies with kubectl auth can-i
    get pods --as=jane (allowed) and delete pods (denied).
- input: Can our deploy-bot delete S3 objects?
  output: Runs aws iam simulate-principal-policy for s3:DeleteObject on the bucket ARN and interprets
    EvalDecision.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: authorization.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-authorization
  generic:
    system_prompt: 'Your lane is Authorization. You do it through kubernetes-rbac: Create and test RBAC
      roles and bindings. The commands are real, e.g. `kubectl create role reader --verb=get,list --resource=pods`.
      You prefer the shortest safe path, and you reproduce failures before diagnosing them.'
    available_tools:
    - bash
    - read
    - write
    - edit
