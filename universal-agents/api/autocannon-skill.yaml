name: autocannon
display_name: Autocannon
category: api
subcategory: general
description: 'Load-tests HTTP servers with autocannon: concurrent connections, custom methods/bodies,
  latency reports, and JSON output.'
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
prerequisites:
- npx
capabilities:
- name: basic-load
  description: Run basic load tests with configurable concurrency and duration.
  commands:
  - npx autocannon -c 100 -d 30 http://localhost:3000
  - npx autocannon -c 50 -d 60 --latency http://localhost:3000
  - npx autocannon -R 1000 http://localhost:3000
  - npx autocannon --workers 4 -c 100 -d 30 http://localhost:3000
  examples:
  - npx autocannon -c 100 -d 30 http://localhost:3000
  - npx autocannon --latency -c 20 -d 120 http://localhost:3000/api/users
  - npx autocannon -c 1000 --duration 10 http://localhost:3000/health
  parameters:
  - name: connections
    type: number
    description: Concurrent connections (-c)
  - name: duration
    type: number
    description: Test duration in seconds (-d)
  - name: rate
    type: number
    description: Fixed requests per second (-R)
- name: custom-requests
  description: Load-test with custom methods, bodies, headers, and paths.
  commands:
  - 'npx autocannon -c 50 -d 20 -m POST -b ''{"name":"test"}'' -H "Content-Type: application/json" http://localhost:3000/api/users'
  - 'npx autocannon -c 50 -d 20 -H "Authorization: Bearer $TOKEN" http://localhost:3000/api/me'
  - 'npx autocannon -c 10 -d 30 --body ''{"q":"search"}'' -m POST -H "Content-Type: application/json"
    http://localhost:3000/api/search'
  - 'npx autocannon -c 20 -d 30 -m PUT -b ''{"status":"ok"}'' -H "Content-Type: application/json" http://localhost:3000/api/orders/42'
  examples:
  - 'npx autocannon -c 50 -d 20 -m POST -b ''{"name":"test"}'' -H "Content-Type: application/json" http://localhost:3000/api/users'
  - 'npx autocannon --connections 100 -m PATCH -b ''{"seen":true}'' -H "Content-Type: application/json"
    http://localhost:3000/api/notifications/1'
  - 'npx autocannon -c 10 -d 60 -H "Accept: application/json" http://localhost:3000/api/feed'
  parameters:
  - name: method
    type: string
    description: HTTP method (-m)
  - name: body
    type: string
    description: Request body (-b)
  - name: headers
    type: string
    description: Headers as -H key:value
- name: reporting
  description: Capture JSON results and render reports.
  commands:
  - npx autocannon --json -c 100 -d 20 http://localhost:3000 > results.json
  - npx autocannon --output results.json -c 100 -d 20 http://localhost:3000
  - npx autocannon -c 100 -d 20 http://localhost:3000 | jq '.latency'
  - npx autocannon -c 100 -d 20 --renderStatusCodes http://localhost:3000
  examples:
  - 'npx autocannon --json http://localhost:3000 | jq ''{requests, latency: .latency.p99}''

    '
  - npx autocannon --output results.json -d 30 -c 100 http://localhost:3000 && cat results.json | jq .requests
  - npx autocannon --renderStatusCodes -c 50 -d 10 http://localhost:3000
  parameters:
  - name: json
    type: boolean
    description: Emit JSON output
  - name: output
    type: string
    description: Write results to a file
knowledge:
- title: autocannon GitHub
  type: documentation
  source: https://github.com/mcollina/autocannon
  description: CLI options and usage
- title: Node.js Benchmarking Guide
  type: documentation
  source: https://nodejs.org/en/learn/diagnostics/simple-profiling
  description: Interpreting latency results
instructions: '# Autocannon


  ## What this skill does


  Load-tests HTTP servers with autocannon: concurrent connections, custom methods/bodies/headers, latency
  percentiles, status-code breakdowns, and JSON results for CI.


  ## When to use


  - Quick capacity check of an endpoint

  - Comparing latency before/after an optimization

  - Verifying a server survives burst connections


  ## Real commands


  ```bash

  # Basic: 100 connections for 30s

  npx autocannon -c 100 -d 30 http://localhost:3000


  # With latency breakdown

  npx autocannon -c 50 -d 60 --latency http://localhost:3000


  # POST with JSON body

  npx autocannon -c 50 -d 20 -m POST -b ''{"name":"test"}'' -H "Content-Type: application/json" http://localhost:3000/api/users


  # JSON output for CI

  npx autocannon --json -c 100 -d 20 http://localhost:3000 > results.json


  # Extract p99

  npx autocannon --json http://localhost:3000 | jq ''.latency.p99''

  ```


  ## Testing


  - Run once to warm up, then record the second run

  - Compare results across commits; guard on p99 regressions


  ## Best practices


  - Fix the target rate (-R) or connections (-c) for comparability

  - Test with real payloads, not empty GETs

  - Watch for socket errors and timeouts, not just throughput'
examples:
- input: Can our API handle 1000 concurrent connections?
  output: Runs `npx autocannon -c 1000 -d 30 --latency http://localhost:3000` and interprets requests/sec,
    p99, and non-2xx responses.
- input: Compare the search endpoint before and after the index change
  output: Runs the same autocannon command twice (baseline + change), saves JSON outputs, and compares
    requests/sec and p99 with jq.
