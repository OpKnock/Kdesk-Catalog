name: aws-cloudfront
display_name: Aws Cloudfront
category: api
subcategory: general
description: 'Manages AWS CloudFront distributions: creation, cache invalidation, origin configuration,
  and edge behavior testing.'
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
prerequisites:
- aws
capabilities:
- name: distribution-lifecycle
  description: Create and manage CloudFront distributions.
  commands:
  - aws cloudfront create-distribution --origin-domain-name my-bucket.s3.amazonaws.com
  - aws cloudfront get-distribution --id <distribution-id>
  - aws cloudfront list-distributions --query 'DistributionList.Items[].{Id:Id,DomainName:DomainName}'
  - aws cloudfront update-distribution --id <distribution-id> --distribution-config file://config.json
  - aws cloudfront delete-distribution --id <distribution-id> --if-match <etag>
  examples:
  - aws cloudfront create-distribution --origin-domain-name my-bucket.s3.amazonaws.com --default-root-object
    index.html
  - aws cloudfront list-distributions --query 'DistributionList.Items[].{Id:Id,DomainName:DomainName,Status:Status}'
    --output table
  - aws cloudfront get-distribution --id <id> | jq '.Distribution.DistributionConfig.DefaultCacheBehavior'
  parameters:
  - name: origin_domain
    type: string
    description: Origin domain name
  - name: distribution_id
    type: string
    description: CloudFront distribution ID
- name: invalidation
  description: Invalidate cached objects at edge locations.
  commands:
  - aws cloudfront create-invalidation --distribution-id <id> --paths "/*"
  - aws cloudfront create-invalidation --distribution-id <id> --paths "/index.html" "/assets/*"
  - aws cloudfront list-invalidations --distribution-id <id>
  - aws cloudfront get-invalidation --distribution-id <id> --id <invalidation-id>
  - curl -sI https://d111111abcdef8.cloudfront.net/index.html | grep -iE 'x-cache|age|via'
  examples:
  - aws cloudfront create-invalidation --distribution-id E2EXAMPLE --paths "/css/*" "/js/*"
  - aws cloudfront list-invalidations --distribution-id E2EXAMPLE --max-items 5
  - curl -sI https://d111111abcdef8.cloudfront.net/app.js | grep -i x-cache
  parameters:
  - name: paths
    type: string
    description: Object paths to invalidate
  - name: distribution_id
    type: string
    description: Distribution ID
knowledge:
- title: CloudFront Developer Guide
  type: documentation
  source: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/
  description: Distributions, caching, invalidations
- title: AWS CLI cloudfront Reference
  type: documentation
  source: https://awscli.amazonaws.com/v2/documentation/api/latest/reference/cloudfront/index.html
  description: CLI commands
instructions: '# AWS CloudFront


  ## What this skill does


  Manages AWS CloudFront CDN distributions: creating distributions from S3/HTTP origins, updating cache
  behavior, invalidating edge caches, and verifying responses at the edge.


  ## When to use


  - Serving a static site or API through a CDN

  - Pushing a new deploy when TTLs are long (invalidation)

  - Debugging stale content served from the edge


  ## Real commands


  ```bash

  # Create a distribution

  aws cloudfront create-distribution --origin-domain-name my-bucket.s3.amazonaws.com


  # List distributions

  aws cloudfront list-distributions --query ''DistributionList.Items[].{Id:Id,DomainName:DomainName,Status:Status}''
  --output table


  # Invalidate everything after a deploy

  aws cloudfront create-invalidation --distribution-id E2EXAMPLE --paths "/*"


  # Targeted invalidation

  aws cloudfront create-invalidation --distribution-id E2EXAMPLE --paths "/index.html" "/assets/*"


  # Verify edge response

  curl -sI https://d111111abcdef8.cloudfront.net/index.html | grep -iE ''x-cache|age''

  ```


  ## Testing


  - Check x-cache header: Hit-from-cloudfront vs RefreshHit/Miss

  - Poll list-invalidations until status becomes Completed


  ## Best practices


  - Invalidate narrow paths (/* only for emergencies)

  - Version assets by filename to avoid invalidations entirely

  - Use Origin Shield + default TTLs tuned to content type

  - Get the ETag from get-distribution before update/delete'
examples:
- input: Push the new frontend but users see the old version
  output: Runs targeted invalidation for /index.html and /assets/*, polls list-invalidations, and confirms
    via curl x-cache headers.
- input: Create a CDN in front of our S3 bucket
  output: Runs create-distribution with the bucket origin, notes the Distribution.DomainName, and tests
    with curl -sI.
