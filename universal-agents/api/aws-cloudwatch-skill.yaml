name: aws-cloudwatch
display_name: Aws Cloudwatch
category: api
subcategory: general
description: 'Manages CloudWatch metrics and alarms: metric retrieval, alarm creation, anomaly detection,
  and dashboard publishing.'
version: 2.0.0
tags:
- api
author: Mehul Wagde
license: MIT
prerequisites:
- aws
capabilities:
- name: metrics
  description: List, query, and publish metrics.
  commands:
  - aws cloudwatch list-metrics --namespace AWS/ApiGateway
  - aws cloudwatch get-metric-statistics --namespace AWS/ApiGateway --metric-name 4XXError --start-time
    $(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%SZ) --end-time $(date -u +%Y-%m-%dT%H:%M:%SZ) --period
    300 --statistics Sum
  - aws cloudwatch put-metric-data --namespace Custom --metric-name latency --value 120 --unit Milliseconds
  - aws cloudwatch list-metrics --metric-name CPUUtilization --dimensions Name=InstanceId,Value=i-12345
  - aws cloudwatch get-metric-data --metric-data-queries file://queries.json --start-time ... --end-time
    ...
  examples:
  - aws cloudwatch get-metric-statistics --namespace AWS/ApiGateway --metric-name 5XXError --period 60
    --statistics Sum --start-time $(date -u -d '1h ago' +%Y-%m-%dT%H:%M:%SZ) --end-time $(date -u +%Y-%m-%dT%H:%M:%SZ)
  - aws cloudwatch put-metric-data --namespace Custom --metric-name order.count --value 42 --timestamp
    $(date -u +%Y-%m-%dT%H:%M:%SZ)
  - aws cloudwatch list-metrics --namespace AWS/Lambda --query 'Metrics[].MetricName' | sort -u
  parameters:
  - name: namespace
    type: string
    description: Metric namespace (AWS/... or Custom)
  - name: metric_name
    type: string
    description: Metric name
  - name: statistics
    type: string
    description: Sum, Average, Maximum, Minimum, SampleCount
- name: alarms
  description: Create and manage CloudWatch alarms.
  commands:
  - aws cloudwatch put-metric-alarm --alarm-name api-5xx --alarm-description "API 5xx errors" --metric-name
    5XXError --namespace AWS/ApiGateway --statistic Sum --period 60 --evaluation-periods 3 --threshold
    10 --comparison-operator GreaterThanOrEqualToThreshold
  - aws cloudwatch describe-alarms --state-value ALARM
  - aws cloudwatch describe-alarms --alarm-names api-5xx
  - aws cloudwatch set-alarm-state --alarm-name api-5xx --state-value ALARM --state-reason "test"
  - aws cloudwatch delete-alarms --alarm-names api-5xx
  examples:
  - aws cloudwatch put-metric-alarm --alarm-name api-5xx --metric-name 5XXError --namespace AWS/ApiGateway
    --statistic Sum --period 60 --evaluation-periods 3 --threshold 10 --comparison-operator GreaterThanOrEqualToThreshold
    --alarm-actions arn:aws:sns:us-east-1:123456789012:oncall
  - aws cloudwatch describe-alarms --state-value ALARM --query 'MetricAlarms[].AlarmName'
  - aws cloudwatch describe-alarms-for-metric --metric-name 5XXError --namespace AWS/ApiGateway
  parameters:
  - name: threshold
    type: number
    description: Alarm threshold
  - name: period
    type: number
    description: Evaluation period in seconds
  - name: evaluation_periods
    type: number
    description: Consecutive periods before firing
knowledge:
- title: CloudWatch Monitoring Docs
  type: documentation
  source: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/
  description: Metrics, alarms, dashboards
- title: AWS CLI cloudwatch Reference
  type: documentation
  source: https://awscli.amazonaws.com/v2/documentation/api/latest/reference/cloudwatch/index.html
  description: CLI commands
- title: API Gateway Metrics
  type: documentation
  source: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-metrics-and-dimensions.html
  description: Available API Gateway metrics
instructions: '# AWS CloudWatch


  ## What this skill does


  Manages CloudWatch metrics and alarms: listing/querying metric namespaces, computing statistics over
  time windows, publishing custom metrics, and creating/test alarms.


  ## When to use


  - Verifying an API''s error rate or latency trend

  - Creating an alarm for a new service

  - Publishing custom application metrics


  ## Real commands


  ```bash

  # Available metrics

  aws cloudwatch list-metrics --namespace AWS/ApiGateway


  # Query a metric over the last hour

  aws cloudwatch get-metric-statistics --namespace AWS/ApiGateway --metric-name 4XXError --start-time
  $(date -u -d ''1 hour ago'' +%Y-%m-%dT%H:%M:%SZ) --end-time $(date -u +%Y-%m-%dT%H:%M:%SZ) --period
  300 --statistics Sum


  # Publish a custom metric

  aws cloudwatch put-metric-data --namespace Custom --metric-name latency --value 120 --unit Milliseconds


  # Create an alarm

  aws cloudwatch put-metric-alarm --alarm-name api-5xx --metric-name 5XXError --namespace AWS/ApiGateway
  --statistic Sum --period 60 --evaluation-periods 3 --threshold 10 --comparison-operator GreaterThanOrEqualToThreshold


  # Check alarm state

  aws cloudwatch describe-alarms --state-value ALARM

  ```


  Note: `eaws` is a typo for `aws`; always use `aws cloudwatch ...`.


  ## Testing


  - Trigger an alarm intentionally with set-alarm-state, then reset to OK

  - Verify period and evaluation-periods match your SLO window


  ## Best practices


  - Use Sum for error counts, Average for utilization

  - Attach SNS actions for actionable alerts

  - Publish custom metrics with consistent units'
examples:
- input: Did we get 5xx errors in the last hour?
  output: Runs get-metric-statistics for 5XXError with 60s period over the last hour and sums the datapoints.
- input: Alert me when API 5xx exceeds 10 in 3 minutes
  output: Creates the alarm with period 60, evaluation-periods 3, threshold 10, and an SNS action, then
    verifies with describe-alarms.
