name: aws-lambda
display_name: Aws Lambda
category: api
subcategory: general
description: Creates, updates, and invokes AWS Lambda functions with the AWS CLI, including packaging,
  configuration, and log inspection.
version: 2.0.0
tags:
- api
author: Kdesk
license: MIT
prerequisites:
- aws
capabilities:
- name: function-lifecycle
  description: Create, update, and manage Lambda functions.
  commands:
  - aws lambda create-function --function-name my-fn --runtime nodejs20.x --role arn:aws:iam::111122223333:role/lambda-basic
    --handler index.handler --zip-file fileb://function.zip
  - aws lambda update-function-code --function-name my-fn --zip-file fileb://function.zip
  - aws lambda list-functions
  - aws lambda get-function --function-name my-fn
  - aws lambda delete-function --function-name my-fn
  examples:
  - aws lambda create-function --function-name my-fn --runtime python3.12 --role arn:aws:iam::111122223333:role/lambda-basic
    --handler lambda_function.handler --zip-file fileb://function.zip
  - aws lambda update-function-code --function-name my-fn --zip-file fileb://function.zip --publish
  - aws lambda list-functions --query 'Functions[].{name:FunctionName,runtime:Runtime}'
  parameters:
  - name: runtime
    type: string
    description: 'Runtime: nodejs20.x, python3.12, go1.x, etc.'
  - name: handler
    type: string
    description: Handler entry point
  - name: zip_file
    type: string
    description: Path to deployment package
- name: invoke-and-config
  description: Invoke functions and manage configuration.
  commands:
  - aws lambda invoke --function-name my-fn --payload '{"a":1}' out.json
  - aws lambda invoke --function-name my-fn --cli-binary-format raw-in-base64-out --payload '{"a":1}'
    --log-type Tail response.json
  - aws lambda get-function-configuration --function-name my-fn
  - aws lambda update-function-configuration --function-name my-fn --memory-size 512 --timeout 15
  - aws lambda list-versions-by-function --function-name my-fn
  examples:
  - aws lambda invoke --function-name my-fn --payload '{"a":1}' out.json && cat out.json
  - aws lambda invoke --function-name my-fn --payload '{}' --cli-binary-format raw-in-base64-out --log-type
    Tail resp.json | jq -r '.LogResult' | base64 -d
  - aws lambda update-function-configuration --function-name my-fn --environment Variables={LOG_LEVEL=info}
  parameters:
  - name: payload
    type: string
    description: JSON event payload
  - name: memory_size
    type: number
    description: Memory in MB
  - name: timeout
    type: number
    description: Timeout in seconds
- name: logs-and-metrics
  description: Inspect function logs and metric alarms.
  commands:
  - aws logs tail /aws/lambda/my-fn --follow
  - aws logs filter-log-events --log-group-name /aws/lambda/my-fn --filter-pattern "ERROR"
  - aws cloudwatch get-metric-statistics --namespace AWS/Lambda --metric-name Errors --dimensions Name=FunctionName,Value=my-fn
    --period 300 --statistics Sum --start-time ... --end-time ...
  - aws lambda get-account-settings
  examples:
  - aws logs tail /aws/lambda/my-fn --follow --format short
  - aws logs filter-log-events --log-group-name /aws/lambda/my-fn --filter-pattern "ERROR" | jq '.events[].message'
  - aws cloudwatch get-metric-statistics --namespace AWS/Lambda --metric-name Duration --dimensions Name=FunctionName,Value=my-fn
    --period 300 --statistics Average --start-time ... --end-time ...
  parameters:
  - name: function_name
    type: string
    description: Lambda function name
  - name: filter_pattern
    type: string
    description: Log filter pattern
knowledge:
- title: Lambda Developer Guide
  type: documentation
  source: https://docs.aws.amazon.com/lambda/latest/dg/
  description: Deployment, config, runtimes
- title: AWS CLI lambda Reference
  type: documentation
  source: https://awscli.amazonaws.com/v2/documentation/api/latest/reference/lambda/index.html
  description: CLI commands
instructions: '# AWS Lambda


  ## What this skill does


  Creates, updates, and invokes AWS Lambda functions: packaging code, managing configuration (memory/timeout/env),
  invoking with test payloads, and inspecting logs.


  ## When to use


  - Deploying a serverless function from CI

  - Debugging a failing invocation via logs

  - Tuning memory/timeout for cost and latency


  ## Real commands


  ```bash

  # Create

  zip function.zip index.js

  aws lambda create-function --function-name my-fn --runtime nodejs20.x --role arn:aws:iam::111122223333:role/lambda-basic
  --handler index.handler --zip-file fileb://function.zip


  # Update code

  aws lambda update-function-code --function-name my-fn --zip-file fileb://function.zip --publish


  # Invoke and capture logs

  aws lambda invoke --function-name my-fn --cli-binary-format raw-in-base64-out --payload ''{"a":1}''
  --log-type Tail response.json

  jq -r ''.LogResult'' <(cat /tmp/nonexistent) 2>/dev/null; aws lambda invoke ... | jq -r ''.LogResult''
  | base64 -d


  # Configuration

  aws lambda update-function-configuration --function-name my-fn --memory-size 512 --timeout 15


  # Logs

  aws logs tail /aws/lambda/my-fn --follow

  ```


  ## Testing


  - Invoke with sample events and check response.json

  - Filter logs for ERROR after each deploy


  ## Best practices


  - Keep the package small; use layers for common deps

  - Set memory to minimize duration*cost product

  - Publish versions and alias traffic for canary deploys

  - Always set a timeout lower than the client''s expectation'
examples:
- input: Deploy a new version of our Lambda
  output: Zips the code, runs update-function-code --publish, invokes with a test payload, and tails logs
    to confirm the new version logs.
- input: Why is my function timing out?
  output: Checks Duration metric vs configured timeout, inspects logs for slow DB/HTTP calls, and raises
    timeout or memory as needed.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: aws-lambda.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-aws-lambda
  generic:
    system_prompt: 'This is your domain: Aws Lambda. You do it through function-lifecycle: Create, update,
      and manage Lambda functions. The commands are real, e.g. `aws lambda create-function --function-name
      my-fn --runtime nodejs20.x --role...`. You answer with exact commands, not abstractions, and flag
      anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
