  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: aws-secrets-manager.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-aws-secrets-manager
  generic:
    system_prompt: 'You work Aws Secrets Manager hands-on. You do it through secret-lifecycle: Create,
      retrieve, list, and delete secrets. The commands are real, e.g. `aws secretsmanager create-secret
      --name prod/api-db --secret-string {user:admin,pass:x}`. You prefer the shortest safe path, and
      you reproduce failures before diagnosing them.'
    available_tools:
    - bash
    - read
    - write
    - edit
