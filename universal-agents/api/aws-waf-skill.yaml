    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: aws-waf.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-aws-waf
  generic:
    system_prompt: 'You own Aws Waf end to end. You do it through web-acl: Create and inspect WAF web
      ACLs. The commands are real, e.g. `aws wafv2 list-web-acls --scope REGIONAL`. You answer with exact
      commands, not abstractions, and flag anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
