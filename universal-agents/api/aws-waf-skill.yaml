name: aws-waf
display_name: Aws Waf
category: api
subcategory: general
description: Manages AWS WAF web ACLs, rule groups, IP sets, and associations for API Gateway, CloudFront,
  and ALB protection.
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
prerequisites:
- aws
capabilities:
- name: web-acl
  description: Create and inspect WAF web ACLs.
  commands:
  - aws wafv2 list-web-acls --scope REGIONAL
  - aws wafv2 create-web-acl --name my-acl --scope REGIONAL --default-action Allow={} --visibility-config
    SampledRequestsEnabled=true,CloudWatchMetricsEnabled=true,MetricName=my-acl
  - aws wafv2 get-web-acl --name my-acl --scope REGIONAL --id <acl-id>
  - aws wafv2 delete-web-acl --name my-acl --scope REGIONAL --id <acl-id> --lock-token <token>
  - aws wafv2 list-web-acls --scope CLOUDFRONT
  examples:
  - aws wafv2 list-web-acls --scope REGIONAL --query 'WebACLs[].{name:Name,id:Id}'
  - aws wafv2 create-web-acl --name my-acl --scope REGIONAL --default-action Allow={} --visibility-config
    SampledRequestsEnabled=true,CloudWatchMetricsEnabled=true,MetricName=my-acl --rules file://rules.json
  - aws wafv2 get-web-acl --name my-acl --scope REGIONAL --id <acl-id> | jq '.WebACL.Rules[].Name'
  parameters:
  - name: scope
    type: string
    description: REGIONAL or CLOUDFRONT
  - name: acl_name
    type: string
    description: Web ACL name
- name: rules-ipset
  description: Add rules and IP sets to web ACLs.
  commands:
  - aws wafv2 create-ip-set --name blocked-ips --scope REGIONAL --ip-address-version IPV4 --addresses
    203.0.113.0/24
  - aws wafv2 get-ip-set --name blocked-ips --scope REGIONAL --id <ipset-id>
  - aws wafv2 update-web-acl --name my-acl --scope REGIONAL --id <acl-id> --default-action Allow={} --visibility-config
    SampledRequestsEnabled=true,CloudWatchMetricsEnabled=true,MetricName=my-acl --rules file://rules.json
  - aws wafv2 list-ip-sets --scope REGIONAL
  - aws wafv2 get-rate-based-statement-managed-keys --scope REGIONAL --web-acl-name my-acl --web-acl-id
    <acl-id>
  examples:
  - aws wafv2 create-ip-set --name blocked-ips --scope REGIONAL --ip-address-version IPV4 --addresses
    203.0.113.0/24 198.51.100.0/24
  - aws wafv2 update-ip-set --name blocked-ips --scope REGIONAL --id <id> --addresses 203.0.113.0/24 --lock-token
    <token>
  - aws wafv2 get-rate-based-statement-managed-keys --scope REGIONAL --web-acl-name my-acl --web-acl-id
    <acl-id> | jq '.ManagedKeysIPV4'
  parameters:
  - name: ip_set_name
    type: string
    description: IP set name
  - name: addresses
    type: string
    description: CIDR addresses
  - name: rules_file
    type: string
    description: JSON rules file
- name: associate
  description: Associate web ACLs with protected resources.
  commands:
  - aws wafv2 associate-web-acl --web-acl-arn <acl-arn> --resource-arn <alb-or-apigateway-arn>
  - aws wafv2 disassociate-web-acl --resource-arn <resource-arn>
  - aws wafv2 get-web-acl-for-resource --resource-arn <resource-arn>
  - aws wafv2 list-resources-for-web-acl --web-acl-arn <acl-arn>
  examples:
  - aws wafv2 associate-web-acl --web-acl-arn arn:aws:wafv2:us-east-1:123456789012:regional/webacl/my-acl/<id>
    --resource-arn arn:aws:elasticloadbalancing:us-east-1:123456789012:loadbalancer/app/api/abc
  - aws wafv2 get-web-acl-for-resource --resource-arn arn:aws:apigateway:us-east-1::/restapis/<api-id>/stages/prod
  - aws wafv2 list-resources-for-web-acl --web-acl-arn <acl-arn>
  parameters:
  - name: resource_arn
    type: string
    description: ARN of the protected resource
  - name: web_acl_arn
    type: string
    description: Web ACL ARN
knowledge:
- title: WAF Developer Guide
  type: documentation
  source: https://docs.aws.amazon.com/waf/latest/developerguide/
  description: Web ACLs, rules, managed rules
- title: AWS CLI wafv2 Reference
  type: documentation
  source: https://awscli.amazonaws.com/v2/documentation/api/latest/reference/wafv2/index.html
  description: CLI commands
instructions: '# AWS WAF


  ## What this skill does


  Manages AWS WAF web ACLs: creating ACLs and rule groups, blocking IP sets, rate-based rules, associating
  with ALB/API Gateway/CloudFront, and inspecting sampled requests.


  ## When to use


  - Blocking abusive IPs or bot traffic

  - Rate-limiting an API at the edge

  - Meeting compliance with managed rules (OWASP CRS)


  ## Real commands


  ```bash

  # Create a web ACL

  aws wafv2 create-web-acl --name my-acl --scope REGIONAL --default-action Allow={} --visibility-config
  SampledRequestsEnabled=true,CloudWatchMetricsEnabled=true,MetricName=my-acl


  # Create and update an IP set

  aws wafv2 create-ip-set --name blocked-ips --scope REGIONAL --ip-address-version IPV4 --addresses 203.0.113.0/24

  aws wafv2 update-ip-set --name blocked-ips --scope REGIONAL --id <id> --addresses 203.0.113.0/24 198.51.100.0/24
  --lock-token <token>


  # Attach rules from a JSON file

  aws wafv2 update-web-acl --name my-acl --scope REGIONAL --id <acl-id> --default-action Allow={} --visibility-config
  SampledRequestsEnabled=true,CloudWatchMetricsEnabled=true,MetricName=my-acl --rules file://rules.json


  # Associate with an ALB

  aws wafv2 associate-web-acl --web-acl-arn <acl-arn> --resource-arn <alb-arn>


  # See blocked IPs under a rate rule

  aws wafv2 get-rate-based-statement-managed-keys --scope REGIONAL --web-acl-name my-acl --web-acl-id
  <acl-id>

  ```


  ## Rules JSON fragment


  ```json

  {"Name": "block-abuse", "Priority": 1, "Statement": {"IPSetReferenceStatement": {"ARN": "arn:aws:wafv2:...:ipset/blocked-ips/<id>"}},
  "Action": {"Block": {}}, "VisibilityConfig": {"SampledRequestsEnabled": true, "CloudWatchMetricsEnabled":
  true, "MetricName": "block-abuse"}}

  ```


  ## Testing


  - Curl the endpoint from an IP in the blocked set and expect 403

  - Use sampled requests via CloudWatch Logs to verify decisions


  ## Best practices


  - Start in Count mode, review logs, then switch to Block

  - Use managed rule groups (AWSManagedRulesCommonRuleSet) first

  - Scope ACLs to specific resources, not everything'
examples:
- input: Block a botnet CIDR at the edge
  output: Creates an IP set with the CIDR, adds a Block rule referencing it, updates the ACL, and verifies
    a 403 from curl.
- input: Rate-limit our login endpoint
  output: Adds a rate-based rule on the /login URI at 2000 requests/5min, associates the ACL with the
    API Gateway stage, and checks managed keys.
platforms:
