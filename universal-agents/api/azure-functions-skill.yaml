name: azure-functions
display_name: Azure Functions
category: api
subcategory: general
description: 'Develops and deploys Azure Functions with Core Tools: scaffolding triggers, local runtime,
  and publishing to Azure.'
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
prerequisites:
- func
capabilities:
- name: local-dev
  description: Create and run functions locally with Core Tools.
  commands:
  - func new --template "HttpTrigger" --name MyFunction
  - func new --template "TimerTrigger" --name DailyJob --runtime node
  - func start
  - func init --worker-runtime node
  - func --version
  examples:
  - func init --worker-runtime python && func new --template "HttpTrigger" --name HttpExample
  - func start --port 7071
  - func new --template "ServiceBusQueueTrigger" --name OrderHandler --runtime dotnet
  parameters:
  - name: template
    type: string
    description: Trigger template (HttpTrigger, TimerTrigger, etc.)
  - name: runtime
    type: string
    description: node, python, dotnet, java, powershell
  - name: port
    type: number
    description: Local runtime port
- name: publish
  description: Deploy functions to Azure.
  commands:
  - func azure functionapp publish MyFunctionApp
  - func azure functionapp list-functions MyFunctionApp
  - func azure functionapp fetch-app-settings MyFunctionApp
  - az functionapp list --resource-group rg
  - az functionapp show --name MyFunctionApp -g rg
  examples:
  - func azure functionapp publish MyFunctionApp --publish-local-settings -i
  - func azure functionapp list-functions MyFunctionApp --show-keys
  - func azure functionapp publish MyFunctionApp --no-build
  parameters:
  - name: app_name
    type: string
    description: Function app name in Azure
  - name: publish_settings
    type: boolean
    description: Publish local app settings
- name: test-function
  description: Invoke functions locally and in Azure.
  commands:
  - curl -X POST http://localhost:7071/api/MyFunction -d '{"name":"test"}'
  - curl -s http://localhost:7071/api/MyFunction?name=world
  - curl -s https://MyFunctionApp.azurewebsites.net/api/MyFunction?name=azure
  - func start --functions MyFunction
  - curl -s -o /dev/null -w "%{http_code}\n" http://localhost:7071/api/MyFunction
  examples:
  - curl -s "http://localhost:7071/api/MyFunction?name=world"
  - curl -s "https://MyFunctionApp.azurewebsites.net/api/MyFunction?name=azure"
  - func start --functions MyFunction --verbose
  parameters:
  - name: url
    type: string
    description: Function URL
  - name: query
    type: string
    description: Query parameters
knowledge:
- title: Azure Functions Docs
  type: documentation
  source: https://learn.microsoft.com/en-us/azure/azure-functions/
  description: Triggers, bindings, deployment
- title: Azure Functions Core Tools
  type: documentation
  source: https://learn.microsoft.com/en-us/azure/azure-functions/functions-run-local
  description: func CLI reference
- title: HTTP Trigger Reference
  type: documentation
  source: https://learn.microsoft.com/en-us/azure/azure-functions/functions-bindings-http-webhook-trigger
  description: Request/response binding
instructions: '# Azure Functions


  ## What this skill does


  Develops and deploys Azure Functions with Core Tools: scaffolding triggers, running the local runtime,
  publishing to Azure, and invoking functions.


  ## When to use


  - Building a serverless HTTP API or timer job

  - Testing a function locally before deploy

  - Deploying from CI with func azure functionapp publish


  ## Real commands


  ```bash

  # Init and scaffold

  func init --worker-runtime node

  func new --template "HttpTrigger" --name MyFunction


  # Run locally

  func start --port 7071


  # Test locally

  curl -s "http://localhost:7071/api/MyFunction?name=world"


  # Publish

  func azure functionapp publish MyFunctionApp


  # List deployed functions

  func azure functionapp list-functions MyFunctionApp


  # Test in Azure

  curl -s "https://MyFunctionApp.azurewebsites.net/api/MyFunction?name=azure"

  ```


  ## Testing


  - Test locally with func start, then against the live URL

  - Use --functions to run a single function during debugging


  ## Best practices


  - Use --publish-local-settings -i for consistent settings

  - Keep functions stateless; use bindings for I/O

  - Pin Core Tools version in CI for reproducible builds'
examples:
- input: Create an HTTP-triggered function
  output: Runs func init + func new with HttpTrigger, starts locally, curls it, then publishes and tests
    the live URL.
- input: Why does my deployed function return 500?
  output: Runs func azure functionapp fetch-app-settings to compare settings, checks Application Insights,
    and reruns locally to reproduce.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: azure-functions.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-azure-functions
  generic:
    system_prompt: 'You work Azure Functions hands-on. You do it through local-dev: Create and run functions
      locally with Core Tools. The commands are real, e.g. `func new --template HttpTrigger --name MyFunction`.
      You run and verify the real CLI commands before you claim anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
