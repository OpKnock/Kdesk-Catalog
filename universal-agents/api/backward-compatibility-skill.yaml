name: backward-compatibility
display_name: Backward Compatibility
category: api
subcategory: general
description: 'Maintains backward compatibility for APIs: semantic versioning, additive change discipline,
  media-type versioning, and diff checks.'
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
prerequisites:
- git
- npm
- npx
capabilities:
- name: semver
  description: Apply semantic versioning rules to releases.
  commands:
  - npm version minor
  - npm version major
  - git tag v2.0.0
  - npx semver --range ">=1.0.0 <2.0.0" 1.5.0
  - git diff v1.0.0 v2.0.0 --stat
  examples:
  - npm version patch -m "release %s"
  - git tag -a v1.1.0 -m "additive release"
  - npx semver --coerce "v1.2.3"
  parameters:
  - name: version_bump
    type: string
    description: major, minor, or patch
  - name: range
    type: string
    description: Semver range expression
- name: api-versioning
  description: Version APIs via media types or URL prefixes.
  commands:
  - 'curl -s -H "Accept: application/vnd.myapi.v2+json" https://api.example.com/users'
  - 'curl -s -H "Accept: application/vnd.myapi.v1+json" https://api.example.com/users'
  - curl -s https://api.example.com/v2/users?limit=10
  - curl -s https://api.example.com/v1/users
  - 'curl -s -H "Api-Version: 2026-01-01" https://api.example.com/users'
  examples:
  - 'curl -s -H "Accept: application/vnd.myapi.v2+json" https://api.example.com/users | jq ''.schema'''
  - curl -s https://api.example.com/v1/users -o v1.json && curl -s https://api.example.com/v2/users -o
    v2.json && diff v1.json v2.json
  - 'curl -s -o /dev/null -w "%{http_code}\n" -H "Accept: application/vnd.myapi.v99+json" https://api.example.com/users'
  parameters:
  - name: accept_header
    type: string
    description: Media type version header
  - name: base_url
    type: string
    description: API base URL
- name: compat-checks
  description: Detect breaking changes between specs.
  commands:
  - npx openapi-diff old.yaml new.yaml
  - npx @redocly/cli lint new.yaml
  - npx swagger-cli validate new.yaml
  - npx openapi-changes compare old.yaml new.yaml
  - git diff --exit-code v1.0.0 v1.1.0 -- openapi.yaml
  examples:
  - npx openapi-diff old.yaml new.yaml | grep -i breaking
  - npx @redocly/cli lint --extends minimal new.yaml
  - npx openapi-changes compare old.yaml new.yaml --json
  parameters:
  - name: old_spec
    type: string
    description: Baseline OpenAPI spec
  - name: new_spec
    type: string
    description: Candidate OpenAPI spec
knowledge:
- title: Semantic Versioning
  type: documentation
  source: https://semver.org/
  description: Versioning rules
- title: openapi-diff
  type: documentation
  source: https://github.com/OpenAPITools/openapi-diff
  description: Breaking change detection
- title: Redocly CLI
  type: documentation
  source: https://redocly.com/docs/cli/
  description: Linting and breaking-change checks
- title: RFC 9110 Content Negotiation
  type: documentation
  source: https://www.rfc-editor.org/rfc/rfc9110#name-content-negotiation
  description: Media type negotiation
instructions: '# Backward Compatibility


  ## What this skill does


  Keeps APIs backward compatible: semantic versioning discipline, additive-only changes, media-type/URL
  versioning, and automated breaking-change detection between OpenAPI specs.


  ## When to use


  - Planning a release that touches public API contracts

  - Evaluating whether a spec change is breaking

  - Setting up CI gates against spec drift


  ## Real commands


  ```bash

  # Version bumps

  npm version minor

  npm version patch -m "release %s"

  git tag v2.0.0


  # Test versioned endpoints

  curl -s -H "Accept: application/vnd.myapi.v2+json" https://api.example.com/users

  curl -s https://api.example.com/v1/users


  # Breaking change detection

  npx openapi-diff old.yaml new.yaml | grep -i breaking

  npx @redocly/cli lint new.yaml

  ```


  ## Rules of thumb


  - Adding an optional field/parameter: compatible

  - Removing or renaming a field: breaking (major)

  - Changing a required field to optional: usually safe; reverse is not


  ## Testing


  - Run openapi-diff in CI on every spec change

  - Keep a compat test calling v1 endpoints after v2 ships


  ## Best practices


  - Deprecate with headers and docs, then remove after a published timeline

  - Use additive evolutions (openapi-diff ''non-breaking'') as the default

  - Pin clients to media-type versions to decouple releases'
examples:
- input: Can we change the users endpoint response?
  output: Runs openapi-diff between the released and candidate specs; if breaking, proposes additive alternatives
    (new field, new media type) and a major version bump.
- input: V2 is out; when can we drop v1?
  output: Checks v1 usage via logs/metrics, sets a deprecation header, communicates a timeline, then removes
    v1 routes and bumps major.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: backward-compatibility.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-backward-compatibility
  generic:
    system_prompt: 'You work Backward Compatibility hands-on. You do it through semver: Apply semantic
      versioning rules to releases. The commands are real, e.g. `npm version minor`. You prefer the shortest
      safe path, and you reproduce failures before diagnosing them.'
    available_tools:
    - bash
    - read
    - write
    - edit
