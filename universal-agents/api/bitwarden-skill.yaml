name: bitwarden
display_name: Bitwarden
category: api
subcategory: general
description: 'Manages passwords and secrets with the Bitwarden CLI: login, item CRUD, generation, exports,
  and sync.'
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
prerequisites:
- bw
capabilities:
- name: auth-session
  description: Log in, unlock, and manage CLI sessions.
  commands:
  - bw login
  - bw unlock
  - bw status
  - bw logout
  - bw sync
  examples:
  - bw login user@example.com
  - bw unlock --raw | pbcopy
  - bw status | jq '.status'
  parameters:
  - name: email
    type: string
    description: Account email
  - name: raw
    type: boolean
    description: Print raw session token
- name: item-management
  description: Create, read, update, and delete vault items.
  commands:
  - bw get password https://example.com
  - bw list items --search github
  - bw get item my-api-key
  - bw create item --session $BW_SESSION
  - bw delete item <item-id>
  examples:
  - bw list items --search aws | jq '.[].login.username'
  - bw get password https://stripe.com
  - echo '{"type":1,"name":"prod-db","login":{"username":"admin","password":"secret"}}' | bw create item
  parameters:
  - name: search
    type: string
    description: Search query
  - name: item_id
    type: string
    description: Item ID or search term
- name: generation-export
  description: Generate passwords and export vaults.
  commands:
  - bw generate -l 20 -n -s
  - bw generate -u -l 24
  - bw export --format json --output bw.json --session $BW_SESSION
  - bw export --format csv --output bw.csv
  - bw get totp <item-id>
  examples:
  - bw generate -l 24 -n -s --base64
  - bw export --format json --output vault.json
  - bw get totp google
  parameters:
  - name: length
    type: number
    description: Password length (-l)
  - name: export_format
    type: string
    description: json or csv
knowledge:
- title: Bitwarden CLI Docs
  type: documentation
  source: https://bitwarden.com/help/cli/
  description: Full bw command reference
- title: Bitwarden API
  type: documentation
  source: https://bitwarden.com/help/api/
  description: Vault API and CLI internals
instructions: '# Bitwarden


  ## What this skill does


  Manages passwords and secrets with the Bitwarden CLI (bw): login/unlock, item CRUD, password generation,
  exports, and TOTP retrieval.


  ## When to use


  - Fetching a stored credential for a script or deploy

  - Generating strong passwords

  - Migrating or exporting a vault


  ## Real commands


  ```bash

  # Login and unlock

  bw login user@example.com

  bw unlock --raw

  bw status


  # Search and read

  bw list items --search github

  bw get password https://stripe.com

  bw get item prod-db


  # Create an item

  BW_SESSION=$(bw unlock --raw)

  echo ''{"type":1,"name":"prod-db","login":{"username":"admin","password":"secret"}}'' | bw create item
  --session $BW_SESSION


  # Generate

  bw generate -l 24 -n -s


  # Export

  bw export --format json --output vault.json --session $BW_SESSION

  ```


  ## Testing


  - Run bw sync after external changes

  - Verify exports import cleanly (json preferred)


  ## Best practices


  - Keep BW_SESSION out of logs; use --session carefully

  - Rotate shared passwords via item edits

  - Use TOTP items with bw get totp for 2FA flows

  - Export only to trusted, encrypted storage'
examples:
- input: Get the GitHub token from our vault
  output: Unlocks, runs `bw get item github` (or list items --search github), extracts the password/notes
    field, and pipes it into the workflow without logging it.
- input: Generate a strong database password
  output: Runs `bw generate -l 24 -n -s`, then creates a login item for the DB via echo | bw create item.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: bitwarden.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-bitwarden
  generic:
    system_prompt: 'This is your domain: Bitwarden. You do it through auth-session: Log in, unlock, and
      manage CLI sessions. The commands are real, e.g. `bw login`. You work hands-on and only report outcomes
      you have observed.'
    available_tools:
    - bash
    - read
    - write
    - edit
