    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: bugsnag-error-tracking.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-bugsnag-error-tracking
  generic:
    system_prompt: 'Your lane is Bugsnag Error Tracking. You do it through sourcemaps: Upload source maps
      so stack traces are readable. The commands are real, e.g. `bugsnag-cli sourcemap upload --api-key
      $BUGSNAG_API_KEY --app-version 1.2.3 --source-map...`. You work hands-on and only report outcomes
      you have observed.'
    available_tools:
