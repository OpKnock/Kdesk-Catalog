name: bulkhead-pattern
display_name: Bulkhead Pattern
category: api
subcategory: general
description: 'Designs bulkhead isolation for services: resource partitioning, thread pool sizing, connection
  limits, and failure containment.'
version: 2.0.0
tags:
- api
author: Mehul Wagde
license: MIT
prerequisites:
- docker
- java
- jcmd
- jstack
- top
- ulimit
- vmstat
- watch
capabilities:
- name: capacity-planning
  description: Measure and size bulkhead partitions.
  commands:
  - ps -o nlwp,pcpu,pmem,rss -p $(pgrep -f my-api)
  - ulimit -n
  - ss -s
  - docker stats --no-stream
  - vmstat 1 5
  examples:
  - ps -o nlwp,pcpu,pmem -p $(pgrep -f my-api)
  - ss -s | grep -E 'estab|total'
  - docker stats --no-stream $(docker ps -q) | column -t
  parameters:
  - name: pid
    type: string
    description: Process ID or pgrep pattern
  - name: fd_limit
    type: number
    description: File descriptor limit
- name: pool-isolation
  description: Configure isolated thread pools and connection pools.
  commands:
  - java -XX:+PrintFlagsFinal -version | grep -i threads
  - jstack $(pgrep -f my-api) | grep -c 'pool-'
  - jcmd $(pgrep -f my-api) Thread.print | grep -A2 'pool-'
  - curl -s http://localhost:8080/actuator/metrics/executor.active
  examples:
  - jstack $(pgrep -f app.jar) | grep -c '"pool-'
  - curl -s http://localhost:8080/actuator/metrics/executor.active | jq '.measurements'
  - jcmd $(pgrep -f app.jar) Thread.print > threads.txt
  parameters:
  - name: pool_name
    type: string
    description: Thread pool name
  - name: pool_size
    type: number
    description: Pool size
- name: failure-test
  description: Verify a partition failure does not exhaust shared resources.
  commands:
  - ab -n 5000 -c 200 http://localhost:8080/api/slow
  - curl -s -o /dev/null -w "%{http_code} %{time_total}\n" http://localhost:8080/api/fast
  - watch -n1 'curl -s -o /dev/null -w "%{http_code}\n" http://localhost:8080/api/fast'
  - top -b -n 3 -p $(pgrep -f my-api)
  examples:
  - ab -n 5000 -c 200 http://localhost:8080/api/slow; curl -s -o /dev/null -w "%{http_code}\n" http://localhost:8080/api/fast
  - watch -n1 'curl -s -o /dev/null -w "%{http_code}\n" http://localhost:8080/api/fast'
  - top -b -n 3 -p $(pgrep -f app.jar) | tail -12
  parameters:
  - name: slow_endpoint
    type: string
    description: Endpoint under failure
  - name: fast_endpoint
    type: string
    description: Endpoint that must stay healthy
knowledge:
- title: Bulkhead Pattern (Microsoft)
  type: documentation
  source: https://learn.microsoft.com/en-us/azure/architecture/patterns/bulkhead
  description: Isolation design guidance
- title: Resilience4j Bulkhead
  type: documentation
  source: https://resilience4j.readme.io/docs/bulkhead
  description: Implementation with thread pools
- title: Isolation (Istio)
  type: documentation
  source: https://istio.io/latest/docs/tasks/traffic-management/circuit-breaking/
  description: Connection pool limits in mesh
instructions: '# Bulkhead Pattern


  ## What this skill does


  Designs bulkhead isolation so one service partition cannot exhaust shared resources: sizing thread/connection
  pools, partitioning by dependency or tenant, and verifying failure containment with load tests.


  ## When to use


  - One slow dependency is starving the whole service

  - Multi-tenant APIs need isolated quotas

  - Adding capacity planning for thread pools


  ## Real commands


  ```bash

  # Measure current capacity

  ps -o nlwp,pcpu,pmem,rss -p $(pgrep -f my-api)

  ss -s

  ulimit -n


  # Inspect pool usage (JVM)

  jstack $(pgrep -f app.jar) | grep -c ''"pool-''

  curl -s http://localhost:8080/actuator/metrics/executor.active


  # Failure containment test

  ab -n 5000 -c 200 http://localhost:8080/api/slow

  curl -s -o /dev/null -w "%{http_code}\n" http://localhost:8080/api/fast

  ```


  ## Design rules


  - One pool per dependency/tenant group: pool-a, pool-b

  - Pool size = max concurrent calls the dependency can serve

  - Queue lengths bounded; overflow rejects fast (503)


  ## Testing


  - Saturate one partition with ab; assert the other partition stays healthy

  - Watch thread counts with top/jstack during the test


  ## Best practices


  - Separate pools for CPU vs I/O work

  - Set short queue timeouts so rejection is immediate

  - Monitor pool utilization and size alerts on saturation'
examples:
- input: One slow DB call blocks all API requests
  output: Partitions the DB pool from the HTTP pool, sizes it to the DB's concurrency, and proves with
    ab against a slow endpoint that fast endpoints still return 200.
- input: Size our thread pool correctly
  output: Measures concurrency with load tests, applies the pool sizing formula, and validates with actuator
    executor metrics.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: bulkhead-pattern.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-bulkhead-pattern
  generic:
    system_prompt: 'You own Bulkhead Pattern end to end. You do it through capacity-planning: Measure
      and size bulkhead partitions. The commands are real, e.g. `ps -o nlwp,pcpu,pmem,rss -p $(pgrep -f my-api)`. You
      run and verify the real CLI commands before you claim anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
