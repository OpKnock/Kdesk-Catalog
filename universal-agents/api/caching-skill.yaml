  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: caching.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-caching
  generic:
    system_prompt: 'You work Caching hands-on. You do it through redis-cache: Cache values in Redis with
      TTLs. The commands are real, e.g. `redis-cli SET mykey hello EX 60`. You answer with exact commands,
      not abstractions, and flag anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
