name: caching
display_name: Caching
category: api
subcategory: general
description: 'Implements caching for APIs: HTTP cache headers, Redis TTL caches, invalidation patterns,
  and hit-rate verification.'
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
prerequisites:
- redis-cli
- varnishstat
capabilities:
- name: redis-cache
  description: Cache values in Redis with TTLs.
  commands:
  - redis-cli SET mykey "hello" EX 60
  - redis-cli GET mykey
  - redis-cli TTL mykey
  - redis-cli DEL mykey
  - redis-cli MSET user:1 '{"id":1}' user:2 '{"id":2}'
  examples:
  - redis-cli SET cache:users:page:1 '[...]' EX 300
  - redis-cli GET cache:users:page:1
  - redis-cli -3 SETNX cache:lock:order:42 1 EX 30
  parameters:
  - name: key
    type: string
    description: Cache key
  - name: ttl
    type: number
    description: TTL seconds
- name: http-caching
  description: Control browser/proxy caching with headers.
  commands:
  - curl -sI https://example.com/static/app.js | grep -i cache-control
  - 'curl -s -H "Cache-Control: max-age=0" -o /dev/null -w "%{http_code} %{time_total}\n" https://example.com/static/app.js'
  - 'curl -s -H "If-Modified-Since: $(date -R -d ''1 day ago'')" -o /dev/null -w "%{http_code}\n" https://example.com/static/app.js'
  - 'curl -s -I -H "Cache-Control: no-cache" https://example.com/api/users'
  examples:
  - curl -sI https://example.com/static/app.js | grep -iE 'cache-control|etag|age'
  - 'curl -s -H "If-None-Match: \"abc123\"" -o /dev/null -w "%{http_code}\n" https://example.com/static/app.js'
  - curl -s -o /dev/null -w "%{http_code} %{time_total}\n" https://example.com/static/app.js
  parameters:
  - name: url
    type: string
    description: Cached resource URL
  - name: headers
    type: string
    description: Validation headers
- name: cache-stats
  description: Measure hit rates and invalidate selectively.
  commands:
  - redis-cli INFO stats | grep -E 'keyspace_hits|keyspace_misses'
  - redis-cli --scan --pattern 'cache:users:*' | wc -l
  - varnishstat | grep -E 'MAIN.cache_hit|MAIN.cache_miss'
  - 'curl -s https://example.com/static/app.js -o /dev/null -w "%{http_code}\n" -H "Cache-Control: max-age=0"'
  examples:
  - redis-cli INFO stats | grep -E 'keyspace_hits|keyspace_misses'
  - redis-cli --scan --pattern 'cache:users:*' | head -20
  - varnishstat | grep -E 'hit_ratio|MAIN.cache_hit'
  parameters:
  - name: pattern
    type: string
    description: Key pattern to scan
knowledge:
- title: Redis Commands
  type: documentation
  source: https://redis.io/docs/latest/commands/
  description: SET/GET/TTL commands
- title: HTTP Caching (RFC 9111)
  type: documentation
  source: https://httpwg.org/specs/rfc9111.html
  description: Cache-Control, ETag, validation
- title: Caching Best Practices
  type: documentation
  source: https://developers.google.com/web/fundamentals/performance/optimizing-content-efficiency/http-caching
  description: Header strategy guide
instructions: '# Caching


  ## What this skill does


  Implements API caching: Redis TTL caches for computed data, HTTP cache-control/ETag headers for clients
  and proxies, and hit-rate measurement.


  ## When to use


  - An endpoint returns the same data repeatedly

  - Reducing latency for static assets

  - Caching expensive queries or third-party calls


  ## Real commands


  ```bash

  # Redis TTL cache

  redis-cli SET cache:users:page:1 ''[...]'' EX 300

  redis-cli GET cache:users:page:1

  redis-cli TTL cache:users:page:1

  redis-cli DEL cache:users:page:1


  # HTTP caching headers

  curl -sI https://example.com/static/app.js | grep -iE ''cache-control|etag''


  # Validation request (304 expected)

  curl -s -H "If-None-Match: \"abc123\"" -o /dev/null -w "%{http_code}\n" https://example.com/static/app.js


  # Hit rate

  redis-cli INFO stats | grep -E ''keyspace_hits|keyspace_misses''

  ```


  ## Invalidation patterns


  - Cache-aside: write-through on read, DEL on write

  - Versioned keys: key = data:users:v2 (avoids invalidation)

  - Time-based: short TTL for hot data, long TTL for cold


  ## Testing


  - Run the same request twice; second should be faster

  - Verify 304 responses for conditional requests


  ## Best practices


  - Always set TTL; unbounded caches grow forever

  - Cache by canonical key (normalized URL/query)

  - Measure hit ratio; < 70% may mean poor key design

  - Never cache user-specific responses without private/no-store'
examples:
- input: Our user list endpoint is slow, cache it
  output: Adds Redis cache-aside with 5-minute TTL, shows SET/GET/DEL flow, and measures latency before/after
    with curl.
- input: Browser cache keeps serving stale JS
  output: Sets Cache-Control and ETag headers, verifies with curl -sI, and shows the 304 flow with If-None-Match.
