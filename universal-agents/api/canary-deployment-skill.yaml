name: canary-deployment
display_name: Canary Deployment
category: api
subcategory: general
description: 'Implements canary releases on Kubernetes with Argo Rollouts: weighted traffic splitting,
  analysis, and promotion/rollback.'
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
prerequisites:
- kubectl
capabilities:
- name: argo-rollouts
  description: Manage canary Rollouts and traffic weights.
  commands:
  - kubectl argo rollouts get rollout my-api
  - kubectl argo rollouts status rollout my-api
  - kubectl argo rollouts promote rollout my-api
  - kubectl argo rollouts abort rollout my-api
  - kubectl get rollout my-api -o yaml
  examples:
  - kubectl argo rollouts get rollout my-api
  - kubectl argo rollouts status rollout my-api --timeout 300
  - kubectl argo rollouts promote rollout my-api --full
  parameters:
  - name: rollout
    type: string
    description: Rollout name
  - name: timeout
    type: number
    description: Status timeout seconds
- name: weighted-traffic
  description: Configure weighted canary steps.
  commands:
  - kubectl apply -f rollout-canary.yaml
  - kubectl patch rollout my-api --type=merge -p '{"spec":{"strategy":{"canary":{"steps":[{"setWeight":10},{"pause":{"duration":60}}]}}}}'
  - kubectl get service my-api -o jsonpath='{.spec.selector}'
  - kubectl get pods -l app=my-api -o wide
  - kubectl get analysisrun
  examples:
  - kubectl apply -f rollout-canary.yaml && kubectl argo rollouts status rollout my-api
  - kubectl get pods -l app=my-api -o custom-columns=NAME:.metadata.name,READY:.status.conditions[0].status
  - kubectl get analysisrun -l rollout=my-api
  parameters:
  - name: weight
    type: number
    description: Traffic percentage for the canary
  - name: pause_duration
    type: number
    description: Pause seconds between steps
- name: analysis
  description: Run metric analysis jobs that gate promotion.
  commands:
  - kubectl get analysisrun -n app
  - kubectl get analysisrun canary-1 --namespace app -o yaml
  - kubectl describe analysisrun -l app=my-api | grep -E 'Status|Failed'
  - kubectl argo rollouts promote rollout my-api
  - kubectl argo rollouts abort rollout my-api
  examples:
  - kubectl get analysisrun -n app -o custom-columns=NAME:.metadata.name,PHASE:.status.phase
  - kubectl describe analysisrun -l app=my-api | grep -E 'Status|Failed'
  - kubectl argo rollouts abort rollout my-api
  parameters:
  - name: metric
    type: string
    description: Analysis metric name (error-rate, latency)
  - name: threshold
    type: number
    description: Success threshold
knowledge:
- title: Argo Rollouts Docs
  type: documentation
  source: https://argo-rollouts.readthedocs.io/
  description: Canary strategies, analysis, promotion
- title: Canary Release (Fowler)
  type: documentation
  source: https://martinfowler.com/bliki/CanaryRelease.html
  description: Pattern rationale
- title: Flagger
  type: documentation
  source: https://docs.flagger.app/
  description: Alternative progressive delivery
instructions: "# Canary Deployment\n\n## What this skill does\n\nImplements canary releases with Argo\
  \ Rollouts: weighted traffic steps, pauses for observation, metric analysis gates, and manual promote/abort.\n\
  \n## When to use\n\n- Rolling out a risky change to a small traffic slice\n- Gating promotion on error-rate/latency\
  \ metrics\n- Fast rollback by aborting the canary\n\n## Real commands\n\n```bash\n# Apply the canary\
  \ rollout\nkubectl apply -f rollout-canary.yaml\n\n# Watch the rollout\nkubectl argo rollouts get rollout\
  \ my-api\nkubectl argo rollouts status rollout my-api --timeout 300\n\n# Promote a paused canary\nkubectl\
  \ argo rollouts promote rollout my-api\n\n# Abort a bad canary\nkubectl argo rollouts abort rollout\
  \ my-api\n\n# Inspect analysis\nkubectl get analysisrun -l rollout=my-api\n```\n\n## Rollout spec (steps)\n\
  \n```yaml\nstrategy:\n  canary:\n    steps:\n      - setWeight: 10\n      - pause: {duration: 60}\n\
  \      - analysis:\n          templates:\n            - templateName: error-rate\n      - setWeight:\
  \ 50\n      - pause: {}\n```\n\n## Testing\n\n- Verify traffic split via kubectl get pods/weight annotations\n\
  - Force an analysis failure and confirm abort\n\n## Best practices\n\n- Start at 5-10% weight with a\
  \ pause for observation\n- Pair with analysis templates on real metrics\n- Never promote during known\
  \ incident windows"
examples:
- input: Roll out v2 to 10% of traffic first
  output: Writes the Rollout with setWeight 10 + pause, applies it, and shows kubectl argo rollouts get
    rollout traffic split.
- input: The canary is failing, stop it
  output: Runs kubectl argo rollouts abort rollout my-api and verifies the stable version regains 100%
    traffic.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: canary-deployment.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-canary-deployment
  generic:
    system_prompt: 'You own Canary Deployment end to end. You do it through argo-rollouts: Manage canary
      Rollouts and traffic weights. The commands are real, e.g. `kubectl argo rollouts get rollout my-api`.
      You work hands-on and only report outcomes you have observed.'
    available_tools:
    - bash
    - read
    - write
    - edit
