name: cassandra-compaction
display_name: Cassandra Compaction
category: api
subcategory: general
description: "Monitors and controls SSTable merging in Apache Cassandra: inspects compactionstats and history, triggers manual merges, stops runaway operations, and selects or tunes strategies (STCS, LCS, TWCS) for table behavior."
version: 2.0.0
tags:
- api
author: Mehul Wagde
license: MIT
prerequisites:
- cqlsh
- nodetool
capabilities:
- name: compaction-status
  description: Inspect compaction activity and history.
  commands:
  - nodetool compactionstats
  - nodetool compactionhistory
  - nodetool status
  - nodetool cfstats mykeyspace
  - nodetool tablestats mykeyspace.users
  examples:
  - nodetool compactionstats
  - nodetool compactionhistory | tail -20
  - nodetool tablestats mykeyspace.users | grep -E 'SSTable|pending'
  parameters:
  - name: keyspace
    type: string
    description: Keyspace name
  - name: table
    type: string
    description: Table name
- name: manual-compaction
  description: Trigger or stop compaction on tables.
  commands:
  - nodetool compact mykeyspace users
  - nodetool compact -- mykeyspace users
  - nodetool stop compaction
  - nodetool scrub mykeyspace users
  - nodetool flush mykeyspace users
  examples:
  - nodetool compact mykeyspace users
  - nodetool stop compaction
  - nodetool flush mykeyspace users
  parameters:
  - name: keyspace
    type: string
    description: Keyspace to compact
  - name: table
    type: string
    description: Table to compact
- name: strategy-tuning
  description: Set and tune compaction strategies.
  commands:
  - cqlsh -e "ALTER TABLE mykeyspace.users WITH compaction = {'class':'LeveledCompactionStrategy','sstable_size_in_mb':160}"
  - cqlsh -e "SELECT table_name, compaction FROM system_schema.tables WHERE keyspace_name='mykeyspace'"
  - cqlsh -e "ALTER TABLE mykeyspace.users WITH compaction = {'class':'SizeTieredCompactionStrategy','min_threshold':4}"
  - nodetool getcompactionthroughput
  - nodetool setcompactionthroughput 64
  examples:
  - cqlsh -e "ALTER TABLE mykeyspace.users WITH compaction = {'class':'LeveledCompactionStrategy','sstable_size_in_mb':160}"
  - cqlsh -e "SELECT table_name, compaction FROM system_schema.tables WHERE keyspace_name='mykeyspace'"
  - nodetool setcompactionthroughput 64
  parameters:
  - name: strategy
    type: string
    description: STCS, LCS, TWCS
  - name: throughput
    type: number
    description: Compaction throughput MB/s
knowledge:
- title: Cassandra Compaction
  type: documentation
  source: https://cassandra.apache.org/doc/latest/cassandra/operating/compaction/index.html
  description: Strategies and tuning
- title: nodetool Reference
  type: documentation
  source: https://cassandra.apache.org/doc/latest/cassandra/operating/nodetool/
  description: compact, compactionstats, scrub
instructions: '# Cassandra Compaction


  ## What this skill does


  Manages Cassandra compaction: monitoring activity with compactionstats, triggering manual compactions,
  stopping runaway compaction, and selecting/tuning strategies (STCS/LCS/TWCS).


  ## When to use


  - Disk usage climbs due to many small SSTables

  - Compaction is starving the cluster of I/O

  - Choosing the right strategy for a table''s workload


  ## Real commands


  ```bash

  # Monitor

  nodetool compactionstats

  nodetool compactionhistory | tail -20


  # Manual compaction

  nodetool compact mykeyspace users


  # Stop runaway compaction

  nodetool stop compaction


  # Flush memtables first if needed

  nodetool flush mykeyspace users


  # Set strategy via cqlsh

  cqlsh -e "ALTER TABLE mykeyspace.users WITH compaction = {''class'':''LeveledCompactionStrategy'',''sstable_size_in_mb'':160}"


  # Throttle

  nodetool setcompactionthroughput 64

  ```


  ## Strategy guidance


  - STCS: default; good for most workloads

  - LCS: read-heavy, low-latency (better read amplification)

  - TWCS: time-series with TTL data


  ## Testing


  - Check compactionhistory for completed runs after manual compact

  - Watch pending tasks in compactionstats


  ## Best practices


  - Schedule major compactions in maintenance windows

  - Throttle during peak traffic

  - Use TWCS for time-series tables; never LCS+TWCS mix'
examples:
- input: Disk is filling up with SSTables
  output: Checks compactionstats + tablestats, triggers nodetool compact, and reviews strategy fit with
    a cqlsh query.
- input: Compaction is hurting production latency
  output: Throttles with nodetool setcompactionthroughput, verifies, and schedules off-peak windows.
