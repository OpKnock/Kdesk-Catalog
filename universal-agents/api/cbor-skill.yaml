name: cbor
display_name: Cbor
category: api
subcategory: general
description: Encodes and decodes CBOR (RFC 8949) data with cbor2 (Python) and cbor (Node.js), including
  hex inspection and streaming.
version: 2.0.0
tags:
- api
author: Mehul Wagde
license: MIT
prerequisites:
- file
- node
- npm
- pip
- python
- xxd
capabilities:
- name: python-cbor2
  description: Encode/decode CBOR with the cbor2 library.
  commands:
  - pip install cbor2
  - python -c "import cbor2; d=cbor2.dumps({'hello':'world'}); print(d.hex())"
  - python -c "import cbor2; print(cbor2.loads(bytes.fromhex('a16568656c6c6f65776f726c64')))"
  - python -c "import cbor2; print(len(cbor2.dumps({'hello':'world'})))"
  examples:
  - 'python -c "import cbor2; d=cbor2.dumps({''hello'':''world'', ''n'': 42}); print(d.hex())"'
  - python -c "import cbor2; print(cbor2.loads(cbor2.dumps({'a':[1,2,3]})))"
  - python -c "import cbor2; print(cbor2.dumps(1234567890123456789).hex())"
  parameters:
  - name: value
    type: string
    description: Value to encode
  - name: hex
    type: string
    description: Hex string to decode
- name: node-cbor
  description: Encode/decode CBOR with the Node.js cbor package.
  commands:
  - npm install cbor
  - node -e "const cbor=require('cbor'); console.log(cbor.encode({hello:'world'}).toString('hex'))"
  - node -e "const cbor=require('cbor'); cbor.decodeFirst(Buffer.from('a16568656c6c6f65776f726c64','hex')).then(console.log)"
  - node -e "const cbor=require('cbor'); const b=cbor.encode([1,2,3]); console.log(b.length, b.toString('hex'))"
  examples:
  - node -e "const cbor=require('cbor'); console.log(cbor.encode({a:1,b:'x'}).toString('hex'))"
  - 'node -e "const cbor=require(''cbor''); cbor.decodeFirst(cbor.encode(1234567890123456789n ? 1234567890123456789
    : 42)).then(console.log)"'
  - 'node -e "const cbor=require(''cbor''); cbor.encodeCanonical({b:1,a:2}).toString(''hex'').then ? cbor.encodeCanonical({b:1,a:2}).then(b=>console.log(b.toString(''hex'')))
    : console.log(cbor.encodeCanonical({b:1,a:2}).toString(''hex''))"'
  parameters:
  - name: value
    type: string
    description: JS value to encode
  - name: hex
    type: string
    description: Hex input to decode
- name: inspect
  description: Inspect raw CBOR bytes.
  commands:
  - xxd data.cbor | head -20
  - xxd data.cbor | grep -A2 -B2 'a1'
  - python -c "import cbor2; data=open('data.cbor','rb').read(); print(cbor2.loads(data))"
  - file data.cbor
  examples:
  - xxd data.cbor | head -10
  - python -c "import cbor2; print(cbor2.loads(open('data.cbor','rb').read()))"
  - file data.cbor && xxd data.cbor | head -5
  parameters:
  - name: file
    type: string
    description: CBOR file path
knowledge:
- title: RFC 8949 (CBOR)
  type: documentation
  source: https://www.rfc-editor.org/rfc/rfc8949
  description: CBOR specification
- title: cbor2 (Python)
  type: documentation
  source: https://cbor2.readthedocs.io/
  description: Python CBOR library
- title: cbor.me Playground
  type: documentation
  source: https://cbor.me/
  description: Interactive CBOR decode tool
instructions: '# CBOR


  ## What this skill does


  Encodes and decodes CBOR (RFC 8949) data: cbor2 for Python, cbor for Node.js, hex inspection with xxd,
  and size comparison against JSON.


  ## When to use


  - Compact binary encoding for APIs or IoT payloads

  - Reducing payload size vs JSON

  - Debugging raw CBOR byte streams


  ## Real commands


  ```bash

  # Python

  pip install cbor2

  python -c "import cbor2; d=cbor2.dumps({''hello'':''world''}); print(d.hex())"

  python -c "import cbor2; print(cbor2.loads(bytes.fromhex(''a16568656c6c6f65776f726c64'')))"


  # Node

  npm install cbor

  node -e "const cbor=require(''cbor''); console.log(cbor.encode({hello:''world''}).toString(''hex''))"

  node -e "const cbor=require(''cbor''); cbor.decodeFirst(Buffer.from(''a16568656c6c6f65776f726c64'',''hex'')).then(console.log)"


  # Inspect raw bytes

  xxd data.cbor | head -10

  file data.cbor

  ```


  ## Testing


  - Round-trip encode/decode and compare with the original

  - Compare byte lengths vs JSON.stringify for the same data


  ## Best practices


  - Use canonical encoding when hashing payloads

  - Prefer definite-length items for streaming

  - Validate sizes; CBOR can embed large indefinite strings'
examples:
- input: Show the CBOR encoding of our telemetry sample
  output: Encodes the sample with cbor2 and shows the hex bytes with annotations from RFC 8949 (map header,
    string lengths).
- input: Is CBOR smaller than JSON for our payload?
  output: Compares len(cbor2.dumps(x)) against len(json.dumps(x).encode()) and recommends when to switch.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: cbor.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-cbor
  generic:
    system_prompt: 'You work Cbor hands-on. You do it through python-cbor2: Encode/decode CBOR with the
      cbor2 library. The commands are real, e.g. `pip install cbor2`. You prefer the shortest safe path,
      and you reproduce failures before diagnosing them.'
    available_tools:
    - bash
    - read
    - write
    - edit
