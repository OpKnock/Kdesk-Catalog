name: changelog-generation
display_name: Changelog Generation
category: api
subcategory: general
description: Generate conventional changelogs from git history using git-cliff and conventional-changelog,
  with semantic-release ready config.
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
prerequisites:
- git-cliff
- npx
capabilities:
- name: git-cliff
  description: Generate changelogs from git commits using git-cliff with configurable templates
  commands:
  - git-cliff --init
  - git-cliff -o CHANGELOG.md
  - git-cliff --unreleased -o CHANGELOG.md
  - git-cliff --bump --unreleased --prepend CHANGELOG.md
  examples:
  - git-cliff --init && git-cliff -o CHANGELOG.md
  - git-cliff --unreleased -o CHANGELOG.md
  - git-cliff --bump --tag v1.2.0 -o CHANGELOG.md
  parameters:
  - name: tag
    type: string
    description: Version tag to release, e.g. v1.2.0
  - name: output
    type: string
    description: Changelog output file, default CHANGELOG.md
- name: conventional-changelog
  description: Generate and update changelogs with the conventional-changelog CLI and standard-version
  commands:
  - npx conventional-changelog -p angular -i CHANGELOG.md -s -r 0
  - npx conventional-changelog -p conventionalcommits -i CHANGELOG.md -s
  - npx standard-version
  - npx standard-version --release-as 1.3.0
  examples:
  - npx conventional-changelog -p angular -i CHANGELOG.md -s -r 0
  - npx standard-version --dry-run
  - npx standard-version --release-as major
  parameters:
  - name: preset
    type: string
    description: 'Commit convention preset: angular, conventionalcommits, eslint'
  - name: release_as
    type: string
    description: 'Force version bump level: major, minor, patch, or explicit version'
knowledge:
- title: git-cliff Documentation
  type: documentation
  source: https://git-cliff.org/docs/
  description: git-cliff reference for config, templates, and CLI flags
- title: Conventional Commits
  type: documentation
  source: https://www.conventionalcommits.org/
  description: Specification for commit messages driving changelog generation
instructions: '# Changelog Generation


  Generate release changelogs from git history automatically.


  ## When to Use


  - Preparing release notes before tagging

  - Keeping a changelog in sync with conventional commits

  - Automating versioning in CI


  ## Setup


  ```bash

  cargo install git-cliff

  # or via scoop/choco on Windows

  scoop install git-cliff

  ```


  ## git-cliff


  ```bash

  git-cliff --init

  # edit cliff.toml to add a GitHub remote for links

  git-cliff -o CHANGELOG.md

  git-cliff --unreleased -o CHANGELOG.md

  git-cliff --bump --tag v1.2.0 -o CHANGELOG.md

  ```


  ## conventional-changelog


  ```bash

  npx conventional-changelog -p angular -i CHANGELOG.md -s -r 0

  npx standard-version --dry-run

  npx standard-version

  npx standard-version --release-as 1.3.0

  ```


  ## Commit Convention


  ```

  feat: add retry middleware

  fix(api): return 404 for unknown routes

  feat(api)!: remove legacy /v1/status endpoint

  docs: update README

  ```


  Breaking changes use `!` or a `BREAKING CHANGE:` footer and trigger major bumps.


  ## Testing


  ```bash

  # Dry run to review what would be released and its changelog

  npx standard-version --dry-run

  # Regenerate from scratch

  npx conventional-changelog -p angular -i CHANGELOG.md -s -r 0

  ```


  ## Best Practices


  - Enforce conventional commits in CI with commitlint

  - Generate changelogs in CI on the release tag

  - Commit CHANGELOG.md before tagging

  - Use --dry-run before standard-version releases'
examples:
- input: Generate a changelog from all my git history.
  output: The agent runs git-cliff --init (if no cliff.toml), then git-cliff -o CHANGELOG.md and shows
    the generated sections.
- input: Release version 2.0.0 and update the changelog.
  output: The agent runs npx standard-version --release-as 2.0.0 after a --dry-run, then shows the updated
    CHANGELOG.md diff.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: changelog-generation.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-changelog-generation
  generic:
    system_prompt: 'Your lane is Changelog Generation. You do it through git-cliff: Generate changelogs
      from git commits using git-cliff with configurable templates. The commands are real, e.g. `git-cliff
      --init`. You run and verify the real CLI commands before you claim anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
