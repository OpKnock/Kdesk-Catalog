name: chaos-engineering
display_name: Chaos Engineering
category: api
subcategory: general
description: 'Run Kubernetes chaos experiments with Litmus: install the operator, create chaos engines,
  and inspect experiment results.'
version: 2.0.0
tags:
- api
author: Mehul Wagde
license: MIT
prerequisites:
- helm
- kubectl
- litmusctl
capabilities:
- name: litmus-install
  description: Install Litmus Chaos operator and connect agents via helm and litmusctl
  commands:
  - helm repo add litmuschaos https://charts.litmuschaos.io
  - helm install chaos litmuschaos/litmus --namespace litmus --create-namespace
  - kubectl get pods -n litmus
  - litmusctl version
  examples:
  - helm repo add litmuschaos https://charts.litmuschaos.io && helm install chaos litmuschaos/litmus --namespace
    litmus --create-namespace
  - kubectl get pods -n litmus -l app.kubernetes.io/name=litmus
  - litmusctl version
  parameters:
  - name: namespace
    type: string
    description: Namespace to install Litmus into, default litmus
- name: chaos-experiments
  description: Apply chaos experiments and engines, then inspect fault injection results
  commands:
  - kubectl apply -f pod-delete.yaml
  - kubectl get chaosengines -n myapp
  - kubectl get chaosexperiments -n myapp
  - kubectl describe chaosresult pod-delete-nginx -n myapp
  examples:
  - kubectl apply -f pod-delete.yaml && kubectl get chaosengines -n myapp
  - kubectl describe chaosresult pod-delete-nginx -n myapp
  - kubectl logs -n litmus -l app.kubernetes.io/name=chaos-exporter
  parameters:
  - name: engine_name
    type: string
    description: ChaosEngine CR name
  - name: result_name
    type: string
    description: ChaosResult CR name
knowledge:
- title: Litmus Docs
  type: documentation
  source: https://litmuschaos.io/docs/
  description: Litmus install, chaos experiments, and chaos center reference
- title: ChaosHub Experiments
  type: documentation
  source: https://hub.litmuschaos.io/
  description: Curated chaos experiment charts
instructions: "# Chaos Engineering (Litmus)\n\nRun Kubernetes-native chaos experiments with Litmus.\n\n\
  ## When to Use\n\n- Testing pod deletion, CPU spikes, and network faults on k8s\n- Building a repeatable\
  \ chaos suite for a service\n- Measuring blast radius with controlled targeting\n\n## Install\n\n```bash\n\
  helm repo add litmuschaos https://charts.litmuschaos.io\nhelm install chaos litmuschaos/litmus --namespace\
  \ litmus --create-namespace\nkubectl get pods -n litmus\n```\n\n## Pod Delete Experiment\n\n```yaml\n\
  apiVersion: litmuschaos.io/v1alpha1\nkind: ChaosEngine\nmetadata:\n  name: pod-delete-nginx\n  namespace:\
  \ myapp\nspec:\n  appinfo:\n    appns: myapp\n    applabel: app=nginx\n    appkind: deployment\n  chaosServiceAccount:\
  \ litmus-sa\n  experiments:\n    - name: pod-delete\n      spec:\n        components:\n          env:\n\
  \            - name: TOTAL_CHAOS_DURATION\n              value: \"30\"\n            - name: CHAOS_INTERVAL\n\
  \              value: \"10\"\n```\n\n```bash\nkubectl apply -f pod-delete.yaml\nkubectl get chaosengines\
  \ -n myapp\nkubectl get chaosexperiments -n myapp\nkubectl describe chaosresult pod-delete-nginx -n\
  \ myapp\n```\n\n## Connect Chaos Center\n\n```bash\nlitmusctl connect agent --config=config.yaml --non-interactive\n\
  ```\n\n## Testing\n\n```bash\n# Confirm injection is done and experiment passed\nkubectl get chaosresult\
  \ pod-delete-nginx -n myapp -o jsonpath='{.status.experimentStatus.verdict}'\n```\n\n## Best Practices\n\
  \n- Always scope appinfo with a unique applabel\n- Set TOTAL_CHAOS_DURATION and CHAOS_INTERVAL explicitly\n\
  - Run experiments against staging before prod\n- Use chaos runners only where a service account exists\n\
  - Pair experiments with dashboards to correlate incidents\n- Start with pod-delete, then add network\
  \ and CPU faults\n- Clean up engines after runs"
examples:
- input: Install Litmus and delete a pod to test resilience.
  output: The agent installs via helm, applies a ChaosEngine pod-delete manifest targeting app=nginx,
    and checks the chaosresult verdict.
- input: What is the result of my last chaos run?
  output: The agent runs kubectl describe chaosresult pod-delete-nginx -n myapp and extracts the experiment
    verdict.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: chaos-engineering.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-chaos-engineering
  generic:
    system_prompt: 'This is your domain: Chaos Engineering. You do it through litmus-install: Install
      Litmus Chaos operator and connect agents via helm and litmusctl. The commands are real, e.g. `helm
      repo add litmuschaos https://charts.litmuschaos.io`. You work hands-on and only report outcomes
      you have observed.'
    available_tools:
    - bash
    - read
    - write
    - edit
