name: chaos-testing
display_name: Chaos Testing
category: api
subcategory: general
description: Chaos test APIs by injecting latency, errors, and network faults with Toxiproxy, then load-testing
  resilience with vegeta and hey.
version: 2.0.0
tags:
- api
author: Kdesk
license: MIT
prerequisites:
- hey
- toxiproxy-cli
- vegeta
capabilities:
- name: fault-injection
  description: Inject latency, bandwith, and error faults on a proxy between client and API using toxiproxy-cli
  commands:
  - toxiproxy-cli create api -l localhost:8081 -u localhost:8080
  - toxiproxy-cli toxic add -t latency -a latency=500 -a jitter=100 api
  - toxiproxy-cli toxic add -t bandwidth -a rate=10 api
  - toxiproxy-cli toxic add -t disconnect -a toxicity=1 api
  examples:
  - toxiproxy-cli create api -l localhost:8081 -u localhost:8080
  - toxiproxy-cli toxic add -t latency -a latency=500 -a jitter=100 api
  - toxiproxy-cli toxic remove -t latency api
  parameters:
  - name: toxin_type
    type: string
    description: latency, bandwidth, disconnect, timeout, or reset_peer
  - name: latency_ms
    type: string
    description: Amount of latency to inject in milliseconds
- name: resilience-load
  description: Generate load against the faulted API and measure error rates and percentiles
  commands:
  - vegeta attack -targets targets.txt -rate 50 -duration 30s | vegeta report
  - vegeta attack -targets targets.txt -rate 50 -duration 30s -output results.bin && vegeta report -type=json
    results.bin
  - hey -n 1000 -c 50 http://localhost:8080/api/users
  - ab -n 1000 -c 50 http://localhost:8080/api/users
  examples:
  - 'echo "POST http://localhost:8080/api/users" > targets.txt && echo "Content-Type: application/json"
    >> targets.txt && vegeta attack -targets targets.txt -rate 20 -duration 20s | vegeta report'
  - hey -n 500 -c 25 http://localhost:8080/api/users
  - vegeta attack -targets targets.txt -rate 100 -duration 60s -output results.bin; vegeta report -type=hist[0,100ms,500ms,1s]
    results.bin
  parameters:
  - name: rate
    type: string
    description: Requests per second for vegeta
  - name: duration
    type: string
    description: Test duration such as 30s or 1m
knowledge:
- title: Toxiproxy Docs
  type: documentation
  source: https://github.com/Shopify/toxiproxy
  description: Toxiproxy proxy and toxiproxy-cli reference for fault injection
- title: Vegeta Docs
  type: documentation
  source: https://github.com/tsenart/vegeta
  description: Vegeta HTTP load testing tool documentation
instructions: '# Chaos Testing


  Test API resilience by injecting faults through a proxy and measuring behavior under load.


  ## When to Use


  - Verifying circuit breakers and retries trigger correctly

  - Measuring p95/p99 latency under injected latency

  - Confirming the API degrades gracefully, not fatally


  ## Setup


  ```bash

  toxiproxy-server &

  # or in Docker

  docker run -d -p 8474:8474 shopify/toxiproxy

  export GOPATH=$(go env GOPATH)

  go install github.com/tsenart/vegeta/v12@latest

  ```


  ## Proxy and Faults


  ```bash

  toxiproxy-cli create api -l localhost:8081 -u localhost:8080

  toxiproxy-cli toxic add -t latency -a latency=500 -a jitter=100 api

  toxiproxy-cli list

  toxiproxy-cli toxic remove -t latency api

  toxiproxy-cli delete api

  ```


  ## Load Test


  ```bash

  cat > targets.txt <<EOF

  POST http://localhost:8081/api/users

  Content-Type: application/json

  EOF

  vegeta attack -targets targets.txt -rate 50 -duration 30s | vegeta report

  hey -n 1000 -c 50 http://localhost:8081/api/users

  ```


  ## Interpretation


  - Latency 500ms injected: expect p95 to rise ~500ms

  - Disconnect toxic: expect errors to spike and circuit breaker to open


  ## Testing


  ```bash

  # Baseline without faults, then with faults, and compare

  vegeta attack -targets targets.txt -rate 50 -duration 30s -output baseline.bin

  vegeta report baseline.bin

  ```


  ## Best Practices


  - Run baseline before injecting faults

  - Inject one fault at a time to attribute effects

  - Point load at the proxy (8081), not the real API (8080)

  - Clean up toxics after each experiment

  - Combine with monitoring to correlate spikes'
examples:
- input: Inject 500ms latency into my API and see how it behaves under load.
  output: The agent starts toxiproxy-server, creates proxy api (8081->8080), adds a latency toxic, then
    runs vegeta attack against 8081 and reports latency percentiles.
- input: Simulate a total network outage on the API.
  output: The agent adds the disconnect toxic with toxicity 1 and runs hey to confirm error rates and
    that the circuit breaker opens.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: chaos-testing.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-chaos-testing
  generic:
    system_prompt: 'You take the Chaos Testing seat. You do it through fault-injection: Inject latency,
      bandwith, and error faults on a proxy between client and API using toxiproxy-cli. The commands are
      real, e.g. `toxiproxy-cli create api -l localhost:8081 -u localhost:8080`. You answer with exact
      commands, not abstractions, and flag anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
