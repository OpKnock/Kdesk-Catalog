name: chaos-toolkit
display_name: Chaos Toolkit
category: api
subcategory: general
description: Design and run repeatable chaos experiments with the Chaos Toolkit CLI, including probes,
  steady-state checks, and Docker/Kubernetes actions.
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
prerequisites:
- chaos
- pip
capabilities:
- name: experiment-run
  description: Create, validate, and run Chaos Toolkit experiments from JSON manifests
  commands:
  - chaos init
  - chaos run experiment.json
  - chaos run --dry-run experiment.json
  - chaos --help
  examples:
  - chaos init && chaos run --dry-run experiment.json
  - chaos run experiments/network-delay.json --rollback-strategy always
  - chaos run experiment.json --hypothesis-strategy before-and-after
  parameters:
  - name: experiment_path
    type: string
    description: Path to the experiment JSON file
  - name: hypothesis_strategy
    type: string
    description: before, after, or before-and-after
- name: extensions
  description: Install Chaos Toolkit extension packages for Docker, Kubernetes, HTTP, and other platforms
  commands:
  - pip install chaostoolkit
  - pip install chaostoolkit-kubernetes
  - pip install chaostoolkit-docker
  - pip install chaostoolkit-http
  examples:
  - pip install chaostoolkit chaostoolkit-kubernetes
  - pip install chaostoolkit-docker chaostoolkit-http
  - chaos info
  parameters:
  - name: package
    type: string
    description: Extension package name such as chaostoolkit-kubernetes
knowledge:
- title: Chaos Toolkit Docs
  type: documentation
  source: https://docs.chaostoolkit.org/
  description: Experiment format, probes, actions, and extension reference
- title: Chaos Toolkit Extensions
  type: documentation
  source: https://docs.chaostoolkit.org/reference/extensions/
  description: List of official Chaos Toolkit extensions
instructions: "# Chaos Toolkit\n\nRun reproducible chaos engineering experiments.\n\n## When to Use\n\n\
  - Automated resilience testing in CI or on schedules\n- Validating steady-state hypotheses before and\
  \ after faults\n- Team-wide shareable experiment definitions\n\n## Install\n\n```bash\npip install chaostoolkit\
  \ chaostoolkit-http chaostoolkit-docker\nchaos --help\n```\n\n## Experiment Manifest\n\n```json\n{\n\
  \  \"version\": \"1.0.0\",\n  \"title\": \"API latency under network delay\",\n  \"description\": \"\
  Inject 100ms latency and verify the API stays healthy\",\n  \"steady-state-hypothesis\": {\n    \"title\"\
  : \"API is healthy\",\n    \"probes\": [\n      {\n        \"type\": \"probe\",\n        \"name\": \"\
  health-check\",\n        \"provider\": {\n          \"type\": \"http\",\n          \"url\": \"http://localhost:8080/health\"\
  ,\n          \"expected_status\": 200\n        }\n      }\n    ]\n  },\n  \"method\": [\n    {\n   \
  \   \"type\": \"action\",\n      \"name\": \"add-latency\",\n      \"provider\": {\n        \"type\"\
  : \"process\",\n        \"path\": \"tc\",\n        \"arguments\": \"qdisc add dev eth0 root netem delay\
  \ 100ms\"\n      }\n    }\n  ],\n  \"rollbacks\": [\n    {\n      \"type\": \"action\",\n      \"name\"\
  : \"remove-latency\",\n      \"provider\": {\n        \"type\": \"process\",\n        \"path\": \"tc\"\
  ,\n        \"arguments\": \"qdisc del dev eth0 root\"\n      }\n    }\n  ]\n}\n```\n\n## Run\n\n```bash\n\
  chaos run --dry-run experiment.json\nchaos run experiment.json --rollback-strategy always\nchaos run\
  \ experiment.json --hypothesis-strategy before-and-after\n```\n\n## Explore\n\n```bash\nchaos init\n\
  chaos info\n```\n\n## Testing\n\n```bash\n# Force a probe failure to validate the hypothesis logic\n\
  chaos run --hypothesis-strategy after experiment.json\n```\n\n## Best Practices\n\n- Always define a\
  \ steady-state hypothesis\n- Always define rollbacks and set --rollback-strategy always\n- Run experiments\
  \ in staging first\n- Keep experiments in git with versioned manifests\n- Report results from chaos\
  \ report into CI dashboards\n- Start with small blast radius: one pod, one service"
examples:
- input: Set up a chaos experiment that injects latency and checks health.
  output: The agent runs chaos init, writes experiment.json with an http probe on /health and a tc latency
    action with a rollback, then runs chaos run --dry-run.
- input: Run my chaos experiment against Kubernetes.
  output: The agent installs chaostoolkit-kubernetes and shows a k8s pod-kill action example with the
    kubernetes provider.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: chaos-toolkit.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-chaos-toolkit
  generic:
    system_prompt: 'Your lane is Chaos Toolkit. You do it through experiment-run: Create, validate, and
      run Chaos Toolkit experiments from JSON manifests. The commands are real, e.g. `chaos init`. You
      prefer the shortest safe path, and you reproduce failures before diagnosing them.'
    available_tools:
    - bash
    - read
    - write
    - edit
