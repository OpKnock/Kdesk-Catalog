name: circuit-breaker
display_name: Circuit Breaker
category: api
subcategory: general
description: Implement resilience patterns with Hystrix-style circuit breakers in Go (hystrix-go/gobreaker),
  with load-test verification.
version: 2.0.0
tags:
- api
author: Kdesk
license: MIT
prerequisites:
- hey
capabilities:
- name: hystrix-go
  description: Add circuit breaking and fallbacks to Go APIs with hystrix-go
  commands:
  - go get github.com/afex/hystrix-go/hystrix
  - go run ./cmd/server
  - go test ./...
  - go vet ./...
  examples:
  - go get github.com/afex/hystrix-go/hystrix
  - go test -v ./...
  - go run ./cmd/server
  parameters:
  - name: command_name
    type: string
    description: Hystrix command name, e.g. payments-api
  - name: timeout_ms
    type: string
    description: Command timeout in milliseconds
- name: load-verify
  description: Load-test the service to trigger and observe breaker transitions
  commands:
  - hey -n 500 -c 50 http://localhost:8080/api/payments
  - 'hey -n 500 -c 50 -m POST -H "Content-Type: application/json" -d ''{}'' http://localhost:8080/api/payments'
  - curl -s -o /dev/null -w "%{http_code}\n" http://localhost:8080/api/payments
  - go test -run TestCircuitBreaker -v ./...
  examples:
  - hey -n 500 -c 50 http://localhost:8080/api/payments
  - curl -s -o /dev/null -w "%{http_code}\n" http://localhost:8080/api/payments
  - go test -run TestCircuitBreaker -v ./...
  parameters:
  - name: requests
    type: string
    description: Total requests for the load test
  - name: concurrency
    type: string
    description: Concurrent workers
knowledge:
- title: hystrix-go GitHub
  type: documentation
  source: https://github.com/afex/hystrix-go
  description: Hystrix-style circuit breaker for Go
- title: Resilience Patterns
  type: documentation
  source: https://github.com/Resilience4J/resilience4j
  description: Resilience4j circuit breaker and related patterns
instructions: "# Circuit Breaker\n\nProtect API consumers from slow or failing dependencies.\n\n## When\
  \ to Use\n\n- Downstream services are flaky or slow\n- Preventing request pileups and cascading failures\n\
  - Graceful degradation with fallbacks\n\n## hystrix-go\n\n```go\npackage main\n\nimport (\n  \"github.com/afex/hystrix-go/hystrix\"\
  \n)\n\nfunc init() {\n  hystrix.ConfigureCommand(\"payments-api\", hystrix.CommandConfig{\n    Timeout:\
  \                2000,\n    MaxConcurrentRequests:  100,\n    ErrorPercentThreshold:  50,\n    RequestVolumeThreshold:\
  \ 10,\n    SleepWindow:            10000,\n  })\n}\n\nfunc charge(orderID string) (string, error) {\n\
  \  out, err := hystrix.Do(\"payments-api\", func() (interface{}, error) {\n    return paymentsClient.charge(orderID)\n\
  \  }, func(err error) (interface{}, error) {\n    return \"fallback\", nil\n  })\n  return out.(string),\
  \ err\n}\n```\n\n```bash\ngo get github.com/afex/hystrix-go/hystrix\ngo run ./cmd/server\n```\n\n##\
  \ Trigger the Breaker\n\n```bash\n# Fail the downstream, then flood the endpoint\nhey -n 500 -c 50 http://localhost:8080/api/payments\n\
  curl -s -o /dev/null -w \"%{http_code}\\n\" http://localhost:8080/api/payments\n```\n\n## Metrics\n\n\
  Hystrix metrics stream on http://localhost:8070/hystrix.stream; run a dashboard or scrape it.\n\n##\
  \ Testing\n\n```bash\ngo test -run TestCircuitBreaker -v ./...\ngo test -race ./...\n```\n\n## Best\
  \ Practices\n\n- Set ErrorPercentThreshold based on your error budget\n- Tune RequestVolumeThreshold\
  \ to avoid tripping on noise\n- Always provide a fallback function\n- Expose breaker state to monitoring\n\
  - SleepWindow should exceed downstream recovery time\n- Test open, half-open, and closed transitions\
  \ explicitly\n- Combine with timeouts and retries, not instead of them"
examples:
- input: My API hangs when the payment service is down.
  output: The agent wraps the payment call in hystrix.Do with a 2s timeout and a fallback, then load-tests
    with hey to confirm fast failure.
- input: How do I know the breaker tripped?
  output: The agent points to the Hystrix metrics stream on :8070/hystrix.stream and checks circuitOpen
    events during the hey flood.
