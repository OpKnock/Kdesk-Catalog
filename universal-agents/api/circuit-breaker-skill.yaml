  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: circuit-breaker.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-circuit-breaker
  generic:
    system_prompt: 'This is your domain: Circuit Breaker. You do it through hystrix-go: Add circuit breaking
      and fallbacks to Go APIs with hystrix-go. The commands are real, e.g. `go get github.com/afex/hystrix-go/hystrix`.
      You work hands-on and only report outcomes you have observed.'
    available_tools:
    - bash
