name: compression
display_name: Compression
category: api
subcategory: general
description: 'Compress API responses to cut bandwidth and latency using gzip, Brotli, and zstd, with
  curl verification and server configuration.'
version: 2.0.0
tags:
- api
author: Mehul Wagde
license: MIT
prerequisites:
- brotli
- gunzip
- gzip
- zstd
capabilities:
- name: compression-verify
  description: Verify compression headers and response size on API endpoints
  commands:
  - 'curl -s -H "Accept-Encoding: gzip" -D - -o /dev/null https://httpbin.org/get | grep -i content-encoding'
  - 'curl -s -H "Accept-Encoding: gzip, br" -o /dev/null -w "%{size_download} bytes\n" https://httpbin.org/get'
  - 'curl -s -o /dev/null -w "%{http_code}\n" -H "Accept-Encoding: gzip" https://httpbin.org/get'
  - curl --compressed -s https://httpbin.org/get | wc -c
  examples:
  - 'curl -s -H "Accept-Encoding: gzip, br" -D - -o /dev/null https://httpbin.org/get | grep
    -i ''content-encoding'''
  - 'curl -s -o /dev/null -w "%{size_download}\n" -H "Accept-Encoding: gzip" https://httpbin.org/get'
  - 'curl -s -o /dev/null -w "%{size_download}\n" -H "Accept-Encoding: gzip, br, zstd" https://httpbin.org/get'
  parameters:
  - name: url
    type: string
    description: Endpoint to check
  - name: accept_encoding
    type: string
    description: Accept-Encoding header value
- name: cli-tools
  description: Compress and decompress payloads with gzip, brotli, and zstd
  commands:
  - gzip -9 -k response.json
  - gunzip -k response.json.gz
  - brotli -9 -o response.json.br response.json
  - zstd -19 -o response.json.zst response.json
  examples:
  - gzip -9 -k response.json && ls -la response.json.gz
  - brotli -9 -o response.json.br response.json
  - zstd -19 response.json -o response.json.zst
  parameters:
  - name: file
    type: string
    description: File to compress
  - name: level
    type: string
    description: Compression level, e.g. 9 for gzip, 11 for brotli
knowledge:
- title: MDN Content-Encoding
  type: documentation
  source: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Encoding
  description: HTTP content encoding headers reference
- title: Brotli GitHub
  type: documentation
  source: https://github.com/google/brotli
  description: Brotli CLI and library usage
instructions: '# Compression


  Compress API responses to cut bandwidth and latency.


  ## When to Use


  - JSON-heavy APIs with large payloads

  - Mobile clients on slow networks

  - Reducing egress cost and p95 transfer time


  ## Encode Selection


  Prefer Brotli (br) for text-heavy JSON, then gzip, then zstd; always set Vary: Accept-Encoding.


  ## Verify Endpoints


```bash
 
   curl -s -H "Accept-Encoding: gzip" -D - -o /dev/null https://httpbin.org/get | grep -i content-encoding
 
   curl -s -o /dev/null -w "compressed: %{size_download} bytes\n" -H "Accept-Encoding: gzip, br" https://httpbin.org/get
 
   curl --compressed -s https://httpbin.org/get | wc -c
 
   ```


  Compare with no encoding:


```bash
 
   curl -s -o /dev/null -w "uncompressed: %{size_download} bytes\n" https://httpbin.org/get
 
   ```


  ## CLI Tools


  ```bash

  gzip -9 -k response.json

  brotli -9 -o response.json.br response.json

  zstd -19 -o response.json.zst response.json

  ```


  ## Server Middleware (Express)


  ```bash

  npm install compression

  ```


  ```js

  const compression = require(''compression'');

  app.use(compression({ threshold: 1024 }));

  ```


  ## Testing


```bash
 
   curl -s -o /dev/null -w "gzip: %{size_download}\n" -H "Accept-Encoding: gzip" https://httpbin.org/get
 
   curl -s -o /dev/null -w "br: %{size_download}\n" -H "Accept-Encoding: br" https://httpbin.org/get
 
   ```


  ## Best Practices


  - Compress above a small threshold (1KB) only

  - Do not compress already-compressed media (images, video)

  - Set Vary: Accept-Encoding on cached responses

  - Never send both Content-Length and chunked encoding

  - Use brotli when clients support it

  - Keep compression CPU cost off the hot path with CDN caching'
examples:
- input: Check if my API serves compressed responses.
  output: 'The agent curls with Accept-Encoding: gzip, br and compares size_download with and without
    encoding, then reports the Content-Encoding header.'
- input: Enable gzip on my Express API.
  output: The agent installs the compression middleware, adds it with a 1KB threshold, and verifies the
    Content-Encoding header with curl.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: compression.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-compression
  generic:
    system_prompt: 'You are the Compression specialist. You do it through compression-verify: Verify compression
      headers and response size on API endpoints. The commands are real, e.g. `curl -s -H Accept-Encoding:
      gzip -D - -o /dev/null https://httpbin.org/get |...`. You answer with exact commands, not
      abstractions, and flag anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
