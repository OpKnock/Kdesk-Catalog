name: connectrpc-web
display_name: Connectrpc Web
category: api
subcategory: general
description: 'Use ConnectRPC in browser and TypeScript clients: @connectrpc/connect-web with buf-generated
  stubs.'
version: 2.0.0
tags:
- api
author: Kdesk
license: MIT
prerequisites:
- npm
- npx
capabilities:
- name: web-client
  description: Create a TypeScript ConnectRPC web client and generate stubs with buf
  commands:
  - npm create vite@latest my-app -- --template react-ts
  - npm install @connectrpc/connect-web @connectrpc/connect
  - npx buf generate
  - npm run dev -- --host 0.0.0.0
  examples:
  - npm create vite@latest my-app -- --template react-ts && npm install @connectrpc/connect-web @connectrpc/connect
  - npx buf generate
  - npm run build
  parameters:
  - name: app_name
    type: string
    description: Vite app name
  - name: template
    type: string
    description: Vite template such as react-ts, vue-ts
- name: browser-call
  description: Invoke Connect services from the browser with CORS and unary streaming support
  commands:
  - npm run dev
  - npm run build
  - npm run preview
  - curl -s -o /dev/null -w "%{http_code}" http://localhost:5173
  - npx vite --port 5173 --strictPort
  examples:
  - npm run dev
  - npm run build && npm run preview
  - npx tsc --noEmit
  parameters:
  - name: dev_port
    type: string
    description: Vite dev server port, default 5173
knowledge:
- title: ConnectRPC Web Getting Started
  type: documentation
  source: https://connectrpc.com/docs/web/getting-started
  description: Official ConnectRPC web client quickstart
- title: buf es plugin
  type: documentation
  source: https://buf.build/docs/ecosystem/es-plugins/
  description: buf generate plugins for TypeScript protobuf codegen
instructions: "# ConnectRPC Web\n\nCall ConnectRPC services from browsers and TypeScript apps.\n\n## When\
  \ to Use\n\n- Building SPAs that talk to Connect/gRPC backends\n- Sharing proto-generated types between\
  \ frontend and backend\n- Streaming updates in the browser\n\n## Scaffold\n\n```bash\nnpm create vite@latest\
  \ my-app -- --template react-ts\ncd my-app\nnpm install @connectrpc/connect-web @connectrpc/connect\n\
  ```\n\n## buf.gen.yaml\n\n```yaml\nversion: v2\nplugins:\n  - local: protoc-gen-es\n    out: src/gen\n\
  \    opt: target=ts\n  - local: protoc-gen-connect-es\n    out: src/gen\n    opt: target=ts\n```\n\n\
  ```bash\nnpx buf generate\n```\n\n## Client Code\n\n```ts\nimport { createClient } from \"@connectrpc/connect\"\
  ;\nimport { createConnectTransport } from \"@connectrpc/connect-web\";\nimport { GreetService } from\
  \ \"./gen/greet/v1/greet_connect\";\n\nconst transport = createConnectTransport({ baseUrl: \"http://localhost:8080\"\
  \ });\nconst client = createClient(GreetService, transport);\n\nconst res = await client.greet({ name:\
  \ \"alice\" });\nconsole.log(res.greeting);\n```\n\n```bash\nnpm run dev\n```\n\n## CORS\n\nThe server\
  \ must send Access-Control-Allow-Origin for the dev origin, or browser calls fail preflight.\n\n## Build\n\
  \n```bash\nnpm run build\nnpm run preview\nnpx tsc --noEmit\n```\n\n## Testing\n\n```bash\ncurl -s -o\
  \ /dev/null -w \"%{http_code}\\n\" http://localhost:5173\n```\n\n## Best Practices\n\n- Generate stubs\
  \ from the same proto as the backend\n- Set up Vite proxy in dev to avoid CORS issues\n- Use createGrpcWebTransport\
  \ for gRPC-Web endpoints\n- Enable streaming for long-lived subscriptions\n- Pin generated files with\
  \ buf lock"
examples:
- input: Add a ConnectRPC client to my React app.
  output: The agent installs @connectrpc/connect-web, generates stubs with npx buf generate, and shows
    createClient usage.
- input: My browser calls to the backend fail on CORS.
  output: The agent checks preflight with curl OPTIONS, confirms the Connect transport baseUrl matches
    the server origin, and suggests a Vite proxy.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: connectrpc-web.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-connectrpc-web
  generic:
    system_prompt: 'You own Connectrpc Web end to end. You do it through web-client: Create a TypeScript
      ConnectRPC web client and generate stubs with buf. The commands are real, e.g. `npm create vite@latest
      my-app -- --template react-ts`. You answer with exact commands, not abstractions, and flag anything
      you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
