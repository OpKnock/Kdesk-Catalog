name: consul-config
display_name: Consul Config
category: api
subcategory: general
description: 'Manage API configuration and service discovery with HashiCorp Consul: KV store, watches,
  and env-consul templates.'
version: 2.0.0
tags:
- api
author: Kdesk
license: MIT
prerequisites:
- consul
- consul-template
capabilities:
- name: kv-store
  description: Read, write, list, and delete configuration keys in Consul KV
  commands:
  - consul kv put config/api/port 8080
  - consul kv get config/api/port
  - consul kv list config/
  - consul kv delete config/api/port
  examples:
  - consul kv put config/api/feature-flags/retries 3
  - consul kv get -recurse config/api
  - consul kv put -flags=0 config/api/deploy "blue"
  parameters:
  - name: key
    type: string
    description: KV key path such as config/api/port
  - name: value
    type: string
    description: Value to store
- name: consul-template
  description: Render config files from Consul KV with consul-template
  commands:
  - consul-template -template "config.ctmpl:config.json" -once
  - consul-template -template "config.ctmpl:config.json:reload.sh"
  - consul watch -type keyprefix -prefix config/api env
  - consul members
  examples:
  - consul-template -template "config.ctmpl:config.json" -once
  - consul watch -type keyprefix -prefix config/api env
  - consul members -detailed
  parameters:
  - name: template_file
    type: string
    description: Go template path mapping such as config.ctmpl:config.json
knowledge:
- title: Consul KV Docs
  type: documentation
  source: https://developer.hashicorp.com/consul/docs/dynamic-app-config/kv
  description: Consul KV store and CLI reference
- title: consul-template Docs
  type: documentation
  source: https://developer.hashicorp.com/consul/tutorials/get-started/consul-template
  description: Template rendering from Consul data
instructions: '# Consul Config


  Manage API configuration centrally with Consul KV and templates.


  ## When to Use


  - Central config that changes without redeploys

  - Feature flags and per-datacenter overrides

  - Service discovery combined with config


  ## Start Consul


  ```bash

  consul agent -dev

  ```


  ## KV Operations


  ```bash

  consul kv put config/api/port 8080

  consul kv get config/api/port

  consul kv list config/

  consul kv get -recurse config/api

  consul kv delete config/api/port

  ```


  ## Template


  ```

  {"port": {{ key "config/api/port" }}, "retries": {{ keyOrDefault "config/api/feature-flags/retries"
  "3" }}}

  ```


  ```bash

  consul-template -template "config.ctmpl:config.json" -once

  consul-template -template "config.ctmpl:config.json:reload.sh"

  ```


  ## Watches


  ```bash

  consul watch -type keyprefix -prefix config/api env

  ```


  ## Service Discovery


  ```bash

  consul members

  consul catalog services

  curl http://localhost:8500/v1/kv/config/api/port

  ```


  ## Testing


  ```bash

  consul kv put config/api/port 9090

  # consul-template re-renders and optionally reloads the app

  consul-template -template "config.ctmpl:config.json:reload.sh"

  ```


  ## Best Practices


  - Use keyOrDefault in templates for resilient config

  - Namespace keys by service: config/<service>/<key>

  - Version config with K/V indexes and CAS

  - Use watches or consul-template for hot reloads

  - Back up KV with consul kv export

  - Never store secrets in KV; use Vault

  - Add ACLs in production clusters'
examples:
- input: Centralize my API port config in Consul.
  output: The agent writes config/api/port with consul kv put and renders it into config.json with consul-template.
- input: Reload my API when config changes.
  output: The agent runs consul-template with a reload.sh command action so the service restarts on key
    changes.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: consul-config.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-consul-config
  generic:
    system_prompt: 'Your lane is Consul Config. You do it through kv-store: Read, write, list, and delete
      configuration keys in Consul KV. The commands are real, e.g. `consul kv put config/api/port 8080`.
      You prefer the shortest safe path, and you reproduce failures before diagnosing them.'
    available_tools:
    - bash
    - read
    - write
    - edit
