name: cors
display_name: Cors
category: api
subcategory: general
description: 'Configure and debug Cross-Origin Resource Sharing: setting CORS headers, preflight
  handling, and origin allowlists.'
version: 2.0.0
tags:
- api
author: Mehul Wagde
license: MIT
prerequisites:
- node
- npm
capabilities:
- name: cors-headers
  description: Configure CORS headers on API responses and test them with curl
  commands:
  - 'curl -i -H "Origin: http://github.com" https://httpbin.org/get'
  - 'curl -s -D - -o /dev/null -H "Origin: http://github.com" https://httpbin.org/get | grep
    -i access-control'
  - 'curl -s -o /dev/null -w "%{http_code}" -H "Origin: http://github.com" https://httpbin.org/get'
  - 'curl -sI -H "Origin: http://github.com" https://httpbin.org/get'
  examples:
  - 'curl -i -H "Origin: http://localhost:3000" http://localhost:8080/api/users'
  - 'curl -s -D - -o /dev/null -H "Origin: http://github.com" https://httpbin.org/get | grep
    -i access-control'
  - 'curl -s -D - -o /dev/null -H "Origin: http://untrusted-origin.test" https://httpbin.org/get | grep -i
    access-control'
  parameters:
  - name: origin
    type: string
    description: Origin header to test, e.g. http://github.com
- name: express-cors
  description: Configure CORS with the cors npm package and restrict allowed origins
  commands:
  - npm install cors
  - node server.js
  - 'curl -i -H "Origin: http://localhost:3000" http://localhost:8080/api'
  - 'curl -i -X OPTIONS http://localhost:8080/api -H "Origin: http://localhost:3000" -H "Access-Control-Request-Method:
    GET"'
  examples:
  - npm install cors && node server.js
  - 'curl -i -H "Origin: http://localhost:3000" http://localhost:8080/api'
  - 'curl -s -D - -o /dev/null -H "Origin: http://blocked-origin.test" http://localhost:8080/api | grep -i
    access-control-allow-origin'
  parameters:
  - name: allowed_origins
    type: string
    description: Comma-separated list of allowed origins
knowledge:
- title: MDN CORS Guide
  type: documentation
  source: https://developer.mozilla.org/en-US/docs/Web/HTTP/CORS
  description: Cross-Origin Resource Sharing headers, preflight, and credentials reference
- title: cors npm package
  type: documentation
  source: https://www.npmjs.com/package/cors
  description: CORS middleware for Express and configuration options
instructions: "# CORS\n\nConfigure and debug Cross-Origin Resource Sharing for APIs.\n\n## When to Use\n\
  \n- Allowing browser apps on other origins to call your API\n- Handling preflight OPTIONS requests\n\
  - Restricting credentials sharing to trusted origins\n\n## Inspect CORS Headers\n\n```bash\ncurl -i\
  \ -H \"Origin: http://github.com\" https://httpbin.org/get\ncurl -s -D - -o /dev/null -H \"\
  Origin: http://untrusted-origin.test\" https://httpbin.org/get | grep -i access-control\n```\n\nA correct\
  \ response includes:\n\n```\nAccess-Control-Allow-Origin: http://github.com\nAccess-Control-Allow-Methods:\
  \ GET, POST, PUT, DELETE, OPTIONS\nAccess-Control-Allow-Headers: Content-Type, Authorization\nVary:\
  \ Origin\n```\n\n## Express\n\n```bash\nnpm install cors\n```\n\n```js\nconst cors = require('cors');\n\
  app.use(cors({\n  origin: ['http://localhost:3000', 'https://app.github.com'],\n  methods: ['GET',\
  \ 'POST', 'PUT', 'DELETE'],\n  allowedHeaders: ['Content-Type', 'Authorization'],\n  credentials: true\n\
  }));\n```\n\n```bash\nnode server.js &\ncurl -i -H \"Origin: http://localhost:3000\" http://localhost:8080/api\n\
  ```\n\n## Credentials\n\nWhen `credentials: true`, the Allow-Origin header must echo the exact origin,\
  \ never `*`.\n\n## Testing\n\n```bash\ncurl -i -X OPTIONS http://localhost:8080/api -H \"Origin: http://localhost:3000\"\
  \ -H \"Access-Control-Request-Method: POST\"\ncurl -s -D - -o /dev/null -H \"Origin: http://blocked-origin.test\"\
  \ http://localhost:8080/api | grep -i access-control-allow-origin\n```\n\n## Best Practices\n\n- Never\
  \ use `Access-Control-Allow-Origin: *` with credentials\n- Set `Vary: Origin` to enable caching\n- Keep\
  \ the allowlist minimal\n- Test both allowed and disallowed origins\n- Handle OPTIONS preflight explicitly\
  \ or via middleware"
examples:
- input: Why does my browser block calls to the API from localhost:3000?
  output: 'The agent checks the API with curl -i -H "Origin: http://localhost:3000", finds missing Access-Control-Allow-Origin
    headers, and shows the cors middleware config.'
- input: Allow only my two frontend origins to call the API.
  output: The agent configures the cors package with an origin allowlist and verifies both allowed and
    denied origins with curl.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: cors.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-cors
  generic:
    system_prompt: 'This is your domain: Cors. You do it through cors-headers: Configure CORS headers
      on API responses and test them with curl. The commands are real, e.g. `curl -i -H Origin: http://github.com
      https://httpbin.org/get`. You work hands-on and only report outcomes you have observed.'
    available_tools:
    - bash
    - read
    - write
    - edit
