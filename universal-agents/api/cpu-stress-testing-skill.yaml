name: cpu-stress-testing
display_name: Cpu Stress Testing
category: api
subcategory: general
description: Stress test CPU for load, capacity planning, and chaos scenarios with stress-ng, stress,
  and sysbench.
version: 2.0.0
tags:
- api
author: Mehul Wagde
license: MIT
prerequisites:
- mpstat
- stress
- stress-ng
- sysbench
- top
- vmstat
capabilities:
- name: stress-tools
  description: Drive CPU to saturation with stress-ng, stress, and sysbench and monitor utilization
  commands:
  - stress-ng --cpu 8 --timeout 60s
  - stress-ng --cpu 4 --cpu-load 80 --timeout 30s
  - sysbench cpu --cpu-max-prime=20000 --threads=4 run
  - stress --cpu 4 --timeout 60
  examples:
  - stress-ng --cpu 8 --timeout 60s
  - stress-ng --cpu 4 --cpu-load 75 --timeout 120s --metrics-brief
  - sysbench cpu --cpu-max-prime=10000 --threads=1 run
  parameters:
  - name: workers
    type: string
    description: Number of CPU workers
  - name: timeout
    type: string
    description: Duration such as 60s or 1m
- name: monitoring
  description: Monitor CPU utilization and thermal/load behavior during the stress window
  commands:
  - top -bn1 | head -15
  - mpstat -P ALL 1 5
  - stress-ng --cpu 8 --timeout 60s --metrics-brief
  - vmstat 1 5
  examples:
  - top -bn1 | head -15
  - mpstat -P ALL 1 3
  - vmstat 1 5
  parameters:
  - name: interval
    type: string
    description: Sample interval in seconds
knowledge:
- title: stress-ng reference
  type: documentation
  source: https://manpages.ubuntu.com/manpages/trusty/man1/stress-ng.1.html
  description: stress-ng stressors and options reference
- title: sysbench documentation
  type: documentation
  source: https://github.com/akopytov/sysbench
  description: sysbench benchmark options
instructions: '# CPU Stress Testing


  Saturate CPU in a controlled way to validate capacity and resilience.


  ## When to Use


  - Capacity planning for API servers

  - Testing autoscaling and CPU alerts

  - Chaos scenarios: CPU spike during deployments


  ## Install


  ```bash

  # Debian/Ubuntu

  sudo apt install stress-ng sysbench stress

  # macOS

  brew install stress-ng

  ```


  ## Stress Runs


  ```bash

  # All cores, 60 seconds

  stress-ng --cpu 8 --timeout 60s


  # 80% load on 4 cores

  stress-ng --cpu 4 --cpu-load 80 --timeout 30s


  # Classic stress

  stress --cpu 4 --timeout 60


  # sysbench prime test

  sysbench cpu --cpu-max-prime=20000 --threads=4 run

  ```


  ## Metrics


  ```bash

  stress-ng --cpu 8 --timeout 60s --metrics-brief

  mpstat -P ALL 1 5

  vmstat 1 5

  top -bn1 | head -15

  ```


  ## Measuring Saturation


  stress-ng reports bogo-ops per second as a throughput proxy; sysbench reports total time and events
  per second.


  ## Testing


  ```bash

  # Verify alert fires at 90%+ utilization during the window

  stress-ng --cpu 4 --cpu-load 95 --timeout 120s

  ```


  ## Best Practices


  - Never run stress tests on production without approval

  - Use --cpu-load to simulate realistic partial saturation

  - Run a baseline before the test

  - Pair with monitoring to correlate latency and CPU

  - Set hard timeouts to avoid runaway load

  - Use --metrics-brief for machine-readable results

  - Check thermal throttling on physical hosts'
examples:
- input: Simulate a CPU spike for 60 seconds on 8 cores.
  output: The agent runs stress-ng --cpu 8 --timeout 60s and monitors with mpstat and top to observe saturation.
- input: Benchmark CPU performance on this machine.
  output: The agent runs sysbench cpu --cpu-max-prime=20000 run and reports events per second and total
    time.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: cpu-stress-testing.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-cpu-stress-testing
  generic:
    system_prompt: 'This is your domain: Cpu Stress Testing. You do it through stress-tools: Drive CPU
      to saturation with stress-ng, stress, and sysbench and monitor utilization. The commands are real,
      e.g. `stress-ng --cpu 8 --timeout 60s`. You verify each step you report and stay honest about what
      you have not run.'
    available_tools:
    - bash
    - read
    - write
    - edit
