name: csp
display_name: Csp
category: api
subcategory: general
description: Implement and verify Content Security Policy headers on APIs and web apps using curl header
  checks and the helmet middleware.
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
prerequisites:
- node
- npm
capabilities:
- name: header-verification
  description: Inspect and verify Content-Security-Policy response headers on live endpoints
  commands:
  - curl -sI https://example.com | grep -i content-security-policy
  - curl -s -D - -o /dev/null https://example.com | grep -i 'content-security-policy\|x-frame-options'
  - 'curl -s -H "Accept: application/json" https://api.example.com/v1/health -D - -o /dev/null | grep
    -i content-security'
  - curl -sI http://localhost:8080 | grep -i content-security-policy
  examples:
  - curl -sI https://example.com | grep -i content-security-policy
  - curl -s -D - -o /dev/null https://example.com/api/v1 | grep -i 'content-security'
  - curl -sI http://localhost:8080 | awk 'tolower($1) ~ /content-security/{print}'
  parameters:
  - name: url
    type: string
    description: URL to check for CSP headers
- name: helmet-config
  description: Configure CSP and related security headers with helmet in Node.js
  commands:
  - npm install helmet
  - node -e "const helmet=require('helmet'); console.log(typeof helmet.contentSecurityPolicy)"
  - npm run start
  - curl -sI https://api.example.com/health | grep -i content-security-policy
  examples:
  - npm install helmet && npm run start
  - curl -sI http://localhost:8080 | grep -i content-security-policy
  - npm test
  parameters:
  - name: directives
    type: string
    description: CSP directives such as default-src 'self'
knowledge:
- title: MDN CSP Guide
  type: documentation
  source: https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP
  description: Content Security Policy directives and header reference
- title: Helmet Docs
  type: documentation
  source: https://helmetjs.github.io/
  description: Helmet middleware for setting security headers in Node.js
instructions: "# Content Security Policy (CSP)\n\nImplement and verify Content-Security-Policy headers\
  \ for APIs and web endpoints.\n\n## When to Use\n\n- Hardening API responses against XSS and injection\n\
  - Enforcing a strict allowlist of origins and scripts\n- Auditing which headers a deployed endpoint\
  \ actually returns\n\n## Verify Existing Headers\n\n```bash\ncurl -sI https://example.com | grep -i\
  \ content-security-policy\ncurl -s -D - -o /dev/null https://api.example.com/v1/health\n```\n\n## Minimal\
  \ Policy\n\n```\nContent-Security-Policy: default-src 'self'; script-src 'self'; object-src 'none';\
  \ frame-ancestors 'none'\n```\n\n## Node.js with Helmet\n\n```bash\nnpm install helmet\n```\n\n```js\n\
  const express = require('express');\nconst helmet = require('helmet');\nconst app = express();\napp.use(helmet.contentSecurityPolicy({\n\
  \  directives: {\n    \"default-src\": [\"'self'\"],\n    \"script-src\": [\"'self'\"],\n    \"object-src\"\
  : [\"'none'\"],\n    \"frame-ancestors\": [\"'none'\"]\n  }\n}));\napp.get('/health', (req, res) =>\
  \ res.json({ ok: true }));\napp.listen(8080);\n```\n\n```bash\nnode server.js &\ncurl -sI http://localhost:8080/health\
  \ | grep -i content-security-policy\n```\n\n## Rollout Strategy\n\n```\n# Start with report-only mode\
  \ to observe violations\nContent-Security-Policy-Report-Only: default-src 'self'\n# Then enforce after\
  \ reviewing violation reports\nContent-Security-Policy: default-src 'self'\n```\n\n## Testing\n\n```bash\n\
  curl -s -D - -o /dev/null http://localhost:8080/health | grep -i content-security\n```\n\n## Best Practices\n\
  \n- Start with report-only mode before enforcing\n- Keep a violation-report-uri to monitor breakage\n\
  - Avoid unsafe-inline and unsafe-eval in production\n- Use nonces or hashes for inline scripts\n- Verify\
  \ headers on every environment, not just production"
examples:
- input: Check if my API returns a Content-Security-Policy header.
  output: The agent runs curl -sI https://api.example.com | grep -i content-security-policy and reports
    what headers are present or missing.
- input: Add CSP to my Express API.
  output: The agent installs helmet, adds helmet.contentSecurityPolicy with default-src 'self', and verifies
    the header with curl.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: csp.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-csp
  generic:
    system_prompt: 'You are the Csp specialist. You do it through header-verification: Inspect and verify
      Content-Security-Policy response headers on live endpoints. The commands are real, e.g. `curl -sI
      https://example.com | grep -i content-security-policy`. You answer with exact commands, not abstractions,
      and flag anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
