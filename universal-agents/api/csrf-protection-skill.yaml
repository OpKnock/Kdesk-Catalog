name: csrf-protection
display_name: Csrf Protection
category: api
subcategory: general
description: 'Prevents cross-site request forgery on state-changing endpoints via double-submit cookie
  patterns, SameSite cookies, and curl-based validation.'
version: 2.0.0
tags:
- api
author: Mehul Wagde
license: MIT
prerequisites:
- node
- npm
capabilities:
- name: csrf-tokens
  description: Issue CSRF tokens and verify double-submit cookie patterns with curl
  commands:
  - curl -c cookies.txt -X GET http://localhost:8080/csrf-token
  - 'curl -b cookies.txt -c cookies.txt -X POST -H "X-CSRF-Token: $TOKEN" http://localhost:8080/submit'
  - 'curl -b cookies.txt -c cookies.txt -X POST -H "Content-Type: application/json" -H "X-CSRF-Token:
    $TOKEN" -d ''{"amount":10}'' http://localhost:8080/transfer'
  - curl -s -b cookies.txt -X POST http://localhost:8080/transfer -o /dev/null -w "%{http_code}\n"
  examples:
  - 'curl -c cookies.txt -X GET http://localhost:8080/csrf-token && TOKEN=$(grep csrf cookies.txt | awk
    ''{print $NF}'') && curl -b cookies.txt -X POST -H "X-CSRF-Token: $TOKEN" http://localhost:8080/submit'
  - curl -s -b cookies.txt -X POST http://localhost:8080/transfer -o /dev/null -w "%{http_code}\n"
  - curl -c cookies.txt -X GET http://localhost:8080/csrf-token | jq '.csrfToken'
  parameters:
  - name: cookie_file
    type: string
    description: Netscape cookie jar file
  - name: token_header
    type: string
    description: CSRF token header name
- name: csrf-middleware
  description: Configure CSRF protection middleware and SameSite cookies
  commands:
  - npm install csrf-csrf
  - node server.js
  - curl -s -D - -o /dev/null -X GET http://localhost:8080/health | grep -i set-cookie
  - curl -s -D - -o /dev/null -X GET http://localhost:8080/health | grep -i 'samesite'
  examples:
  - npm install csrf-csrf && node server.js
  - curl -s -D - -o /dev/null -X GET http://localhost:8080/health | grep -i set-cookie
  - curl -s -D - -o /dev/null -X GET http://localhost:8080/health | grep -i samesite
  parameters:
  - name: cookie_name
    type: string
    description: CSRF cookie name
  - name: same_site
    type: string
    description: 'SameSite value: strict, lax, or none'
knowledge:
- title: OWASP CSRF Cheat Sheet
  type: documentation
  source: https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html
  description: CSRF prevention techniques and token patterns
- title: csrf-csrf npm
  type: documentation
  source: https://www.npmjs.com/package/csrf-csrf
  description: Modern CSRF protection middleware for Node.js
instructions: "# CSRF Protection\n\nPrevent cross-site request forgery on state-changing endpoints.\n\n\
  ## When to Use\n\n- Cookie-based authentication on web APIs\n- Any mutating endpoint reachable from\
  \ a browser\n- Defense-in-depth alongside SameSite cookies\n\n## Strategy\n\nDouble-submit cookie: server\
  \ sets a CSRF cookie, client echoes it in a header, server compares both. SameSite=strict/lax cookies\
  \ block most CSRF automatically.\n\n## Express with csrf-csrf\n\n```bash\nnpm install csrf-csrf\n```\n\
  \n```js\nconst { doubleCsrf } = require('csrf-csrf');\nconst { invalidCsrfTokenError, generateToken,\
  \ validateRequest } = doubleCsrf({\n  getSecret: () => process.env.CSRF_SECRET,\n  cookieName: 'csrf-token',\n\
  \  cookieOptions: { sameSite: 'lax', secure: true, httpOnly: true },\n});\n\napp.get('/csrf-token',\
  \ (req, res) => {\n  res.json({ csrfToken: generateToken(res, req) });\n});\n\napp.post('/transfer',\
  \ validateRequest, (req, res) => {\n  // state change only runs with a valid token\n});\n```\n\n## Test\
  \ with curl\n\n```bash\ncurl -c cookies.txt -X GET http://localhost:8080/csrf-token\nTOKEN=$(grep csrf-token\
  \ cookies.txt | awk '{print $NF}')\ncurl -b cookies.txt -c cookies.txt -X POST \\\n  -H \"X-CSRF-Token:\
  \ $TOKEN\" \\\n  -d '{\"amount\":10}' http://localhost:8080/transfer\n\n# Without the token this must\
  \ fail\ncurl -s -b cookies.txt -X POST http://localhost:8080/transfer -o /dev/null -w \"%{http_code}\\\
  n\"\n```\n\n## Verify Cookies\n\n```bash\ncurl -s -D - -o /dev/null -X GET http://localhost:8080/health\
  \ | grep -i 'set-cookie\\|samesite'\n```\n\n## Testing\n\n```bash\n# Tokenless POST must be rejected\
  \ (403/419)\ncurl -s -b cookies.txt -X POST http://localhost:8080/transfer -o /dev/null -w \"%{http_code}\\
  n\"\n# Valid token must pass\ncurl -b cookies.txt -c cookies.txt -X POST -H \"X-CSRF-Token: $TOKEN\"\
  \ http://localhost:8080/transfer -o /dev/null -w \"%{http_code}\\n\"\n```\n\n## Best Practices\n\n-\
  \ Use double-submit or synchronizer token patterns\n- Rotate tokens on login and logout\n- Set SameSite=strict\
  \ or lax\n- Use secure + httpOnly cookies\n- Never accept tokens from query strings\n- Combine with\
  \ origin checks (Sec-Fetch-Site)\n- Test the tokenless request fails every time"
examples:
- input: My /transfer endpoint is vulnerable to CSRF.
  output: The agent adds csrf-csrf with a /csrf-token endpoint, enforces validateRequest on POST /transfer,
    and tests tokenless vs token requests with curl.
- input: Verify my CSRF protection works.
  output: The agent runs a tokenless POST expecting 403 and a tokenized POST with X-CSRF-Token expecting
    success, using a cookie jar.
