  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: csrf-protection.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-csrf-protection
  generic:
    system_prompt: 'Your lane is Csrf Protection. You do it through csrf-tokens: Issue CSRF tokens and
      verify double-submit cookie patterns with curl. The commands are real, e.g. `curl -c cookies.txt
      -X GET http://localhost:8080/csrf-token`. You run and verify the real CLI commands before you claim
      anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
