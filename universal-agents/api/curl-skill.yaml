name: curl
display_name: Curl
category: api
subcategory: general
description: 'Test and debug REST APIs with curl: methods, headers, JSON bodies, auth, TLS options, and
  output formatting.'
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
capabilities:
- name: requests
  description: Send HTTP requests with curl covering methods, headers, bodies, and auth
  commands:
  - curl -i https://api.example.com/v1/users
  - 'curl -X POST -H "Content-Type: application/json" -d ''{"name":"alice"}'' https://api.example.com/v1/users'
  - curl -u alice:secret https://api.example.com/v1/me
  - 'curl -H "Authorization: Bearer $TOKEN" https://api.example.com/v1/users'
  examples:
  - 'curl -X PUT -H "Content-Type: application/json" -d ''{"name":"bob"}'' https://api.example.com/v1/users/42'
  - curl -X DELETE -o /dev/null -w "%{http_code}\n" https://api.example.com/v1/users/42
  - 'curl -H "Accept: application/vnd.api+json" https://api.example.com/v1/users'
  parameters:
  - name: method
    type: string
    description: 'HTTP method: GET, POST, PUT, PATCH, DELETE'
  - name: url
    type: string
    description: Target URL
- name: debugging
  description: Inspect responses, headers, TLS, timing, and write output to files
  commands:
  - curl -s -D headers.txt -o response.json https://api.example.com/v1/users
  - curl -k https://self-signed.example.com
  - curl -w "status:%{http_code} time:%{time_total}s size:%{size_download}\n" -o /dev/null https://api.example.com/v1/users
  - curl -v https://api.example.com/v1/users
  examples:
  - curl -w "%{time_connect} %{time_starttransfer} %{time_total}\n" -o /dev/null https://api.example.com/v1/users
  - curl -k -v https://localhost:8443/health
  - curl -s https://api.example.com/v1/users | jq '.data[0]'
  parameters:
  - name: output_file
    type: string
    description: File to write the body to with -o
  - name: insecure
    type: string
    description: -k skips TLS verification for self-signed certs
knowledge:
- title: curl man page
  type: documentation
  source: https://curl.se/docs/manpage.html
  description: All curl command-line options
- title: curl Everything curl
  type: documentation
  source: https://everything.curl.dev/
  description: In-depth curl usage guide
instructions: "# curl\n\nTest and debug APIs from the terminal with curl.\n\n## When to Use\n\n- Quick\
  \ API smoke tests and debugging\n- Reproducing reported issues with exact requests\n- Verifying headers,\
  \ auth, and TLS behavior\n\n## Basic Requests\n\n```bash\ncurl -i https://api.example.com/v1/users\n\
  curl -X POST -H \"Content-Type: application/json\" \\\n  -d '{\"name\":\"alice\"}' https://api.example.com/v1/users\n\
  curl -u alice:secret https://api.example.com/v1/me\ncurl -H \"Authorization: Bearer $TOKEN\" https://api.example.com/v1/users\n\
  ```\n\n## Inspecting Responses\n\n```bash\ncurl -s -D headers.txt -o response.json https://api.example.com/v1/users\n\
  curl -w \"status:%{http_code} time:%{time_total}s size:%{size_download}\\n\" \\\n  -o /dev/null https://api.example.com/v1/users\n\
  curl -v https://api.example.com/v1/users\n```\n\n## TLS and Debugging\n\n```bash\ncurl -k https://self-signed.example.com\n\
  curl -k -v https://localhost:8443/health\ncurl --cacert ca.pem https://api.example.com\n```\n\n## Data\
  \ Files\n\n```bash\ncurl -X POST -H \"Content-Type: application/json\" --data-binary @payload.json \\\
  \n  https://api.example.com/v1/users\ncurl -F \"file=@report.pdf\" https://api.example.com/upload\n\
  ```\n\n## Testing\n\n```bash\ncurl -o /dev/null -w \"%{http_code}\\n\" https://api.example.com/v1/health\n\
  curl -s https://api.example.com/v1/users | jq '.data | length'\n```\n\n## Best Practices\n\n- Always\
  \ set Content-Type for bodies\n- Use -w for status codes and timing in scripts\n- Never put credentials\
  \ on the command line history; use env vars\n- Use --data-binary for exact JSON payloads\n- Add -f to\
  \ fail fast on HTTP errors in scripts\n- Read responses with jq for readability"
examples:
- input: POST a new user and show the response status.
  output: 'The agent runs curl -X POST -H "Content-Type: application/json" -d ''{"name":"alice"}'' with
    -w ''%{http_code}'' to show the status and body.'
- input: Debug why my request to the API is slow.
  output: The agent uses curl -w with time_connect, time_starttransfer, and time_total against the endpoint
    to isolate DNS, TLS, and transfer time.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: curl.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-curl
  generic:
    system_prompt: 'You own Curl end to end. You do it through requests: Send HTTP requests with curl
      covering methods, headers, bodies, and auth. The commands are real, e.g. `curl -i https://api.example.com/v1/users`.
      You work hands-on and only report outcomes you have observed.'
    available_tools:
    - bash
    - read
    - write
    - edit
