name: deprecation
display_name: Deprecation
category: api
subcategory: general
description: 'Manages endpoint phase-out lifecycle: Sunset headers, spec linting for metadata, and usage auditing before removal.'
version: 2.0.0
tags:
- api
author: Kdesk
license: MIT
prerequisites:
- grep
- npx
- spectral
capabilities:
- name: deprecation-audit
  description: Lint OpenAPI specs for missing metadata and probe live endpoints for sunset headers.
  commands:
  - spectral lint openapi.yaml -r .spectral/deprecation.rules.yml
  - 'curl -sI https://httpbin.org/headers -H ''Authorization: Bearer $TOKEN'' | grep -iE ''^(deprecation|sunset|link):'''
  - 'grep -n ''deprecated: true'' openapi.yaml | wc -l'
  - npx @redocly/cli lint openapi.yaml --skip-rule operation-4xx-response
  - curl -s https://httpbin.org/get | jq '.meta.deprecation'
  examples:
  - spectral lint openapi.yaml -r .spectral/deprecation.rules.yml
  - 'curl -sI https://httpbin.org/headers -H ''Authorization: Bearer $TOKEN'' | grep -i ''sunset:'''
  - 'grep -rn ''deprecated: true'' specs/*.yaml'
  parameters:
  - name: spec-path
    type: string
    description: Path to the OpenAPI spec to lint
  - name: endpoint
    type: string
    description: URL of the legacy endpoint to probe
  - name: sunset-date
    type: string
    description: ISO 8601 date when the endpoint will be removed, used in the Sunset header
knowledge:
- title: Sunset Header RFC 8594
  type: documentation
  source: https://www.rfc-editor.org/rfc/rfc8594.html
  description: The standard for communicating API phase-out and sunset dates via HTTP headers
instructions: "# API Phase-Out\n\n## What this skill does\n\nEndpoint phase-out management is the discipline\
  \ of announcing, phasing, and removing API features without breaking consumers. This skill covers the\
  \ Sunset headers, spec linting for metadata, and migration auditing.\n\n## When to use\n\n- Planning the retirement of a v1 endpoint in favor of v2\n- Enforcing that all retired operations carry metadata in the OpenAPI spec\n- Auditing which consumers still call an endpoint before removal\n\n## Real commands\n\n```bash\n# Lint the spec so every removed-in-future operation is marked\n\
  spectral lint openapi.yaml -r .spectral/deprecation.rules.yml\n\n# Probe a live endpoint for sunset headers\ncurl -sI https://httpbin.org/headers -H 'Authorization: Bearer $TOKEN' | grep -iE '^(deprecation|sunset|link):'\n\
  \n# Count retired operations in the spec\nnpx @redocly/cli lint openapi.yaml --skip-rule operation-4xx-response\n\
  \n# Find who still uses the endpoint in server logs\nzgrep -h 'GET /v1/legacy' /var/log/nginx/access.log*.gz\
  \ | awk '{print $1}' | sort | uniq -c | sort -rn\n```\n\n## Header example\n\n```http\nHTTP/1.1 200\
  \ OK\nDeprecation: true\nSunset: Sat, 31 Dec 2026 23:59:59 GMT\nLink: <https://api.example.com/v2/users>;\
  \ rel=\"successor-version\"\n```\n\n## OpenAPI metadata example\n\n```yaml\npaths:\n  /v1/legacy:\n\
  \    get:\n      deprecated: true\n      description: Use GET /v2/users instead.\n```\n\n## Best practices\n\
  \n- Always ship a successor: a retired endpoint with no replacement is a trap.\n- Give at least 6-12\
  \ months between announcement and the Sunset date.\n- Include the `sunset` date in the header\
  \ so clients can schedule migration automatically.\n- Log warnings server-side and report usage metrics before removal.\n- Remove the endpoint only when traffic falls below the agreed threshold.\n\n## Testing\n\n```bash\n# Verify the header is present on every version of the endpoint\ncurl -sI https://httpbin.org/headers\
  \ | grep -qi '^deprecation:'; echo $?\n```\n"
examples:
- input: Make sure no endpoint is removed silently
  output: Add a Spectral rule requiring deprecated:true plus a Sunset header on any operation tagged with
    a future removal date, then run spectral lint in CI.
- input: How do I announce the removal of /v1/orders?
  output: 'Set Deprecation: true and Sunset headers on the endpoint, add a successor link to /v2/orders,
    and lint the spec so the metadata is enforced.'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: deprecation.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-deprecation
  generic:
    system_prompt: 'You work Endpoint Phase-Out hands-on. You do it through deprecation-audit: Lint OpenAPI specs
      for missing metadata and probe live endpoints for sunset headers. The commands are real, e.g. `spectral lint openapi.yaml -r .spectral/deprecation.rules.yml`. You prefer the shortest
      safe path, and you reproduce failures before diagnosing them.'
    available_tools:
    - bash
    - read
    - write
    - edit
