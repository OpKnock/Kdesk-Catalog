name: device-auth
display_name: Device Auth
category: api
subcategory: general
description: 'OAuth 2.0 Device Authorization Grant (RFC 8628) flows for input-constrained devices: request
  device codes, poll tokens, and handle slow-down errors.'
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
capabilities:
- name: device-flow
  description: 'Drive the full device code flow with curl: device authorization request, token polling,
    and error handling.'
  commands:
  - 'curl -X POST https://auth.example.com/oauth/device_authorization -d ''client_id=MY_CLIENT&scope=openid%20profile''
    -H ''Content-Type: application/x-www-form-urlencoded'''
  - curl -X POST https://auth.example.com/oauth/token -d 'grant_type=urn:ietf:params:oauth:grant-type:device_code&device_code=DEVICE_CODE&client_id=MY_CLIENT'
  - curl -X POST https://auth.example.com/oauth/token -d 'grant_type=urn:ietf:params:oauth:grant-type:device_code&device_code=DEVICE_CODE&client_id=MY_CLIENT'
    | jq -r '.access_token'
  - curl -s https://auth.example.com/oauth/device_authorization -d 'client_id=MY_CLIENT' | jq '.verification_uri_complete'
  - curl -X POST https://auth.example.com/oauth/token -d 'grant_type=refresh_token&refresh_token=REFRESH&client_id=MY_CLIENT'
  examples:
  - curl -s https://auth.example.com/oauth/device_authorization -d 'client_id=MY_CLIENT' | jq '.device_code,
    .user_code, .verification_uri_complete'
  - curl -X POST https://auth.example.com/oauth/token -d 'grant_type=urn:ietf:params:oauth:grant-type:device_code&device_code=DEVICE_CODE&client_id=MY_CLIENT'
    | jq
  - curl -X POST https://auth.example.com/oauth/token -d 'grant_type=refresh_token&refresh_token=REFRESH&client_id=MY_CLIENT'
    | jq -r '.access_token'
  parameters:
  - name: client-id
    type: string
    description: Public client identifier registered at the authorization server
  - name: device-code
    type: string
    description: Opaque code returned by the device_authorization endpoint, used for polling
  - name: interval
    type: integer
    description: Polling interval in seconds returned by the server; increase it on slow_down errors
knowledge:
- title: RFC 8628 Device Authorization Grant
  type: documentation
  source: https://www.rfc-editor.org/rfc/rfc8628.html
  description: The spec defining the device authorization flow, polling, and error semantics
instructions: "# Device Authorization\n\n## What this skill does\n\nOAuth 2.0 Device Authorization Grant\
  \ (RFC 8628) lets input-constrained devices (smart TVs, CLI logins, IoT) obtain tokens. The device shows\
  \ a user code and verification URL; the user approves on another device; the client polls for the token.\n\
  \n## When to use\n\n- Adding login to CLIs, TVs, or devices without a browser or keyboard\n- Implementing\
  \ `az login`, `aws sso login` style flows in your own client\n\n## Real commands\n\n```bash\n# Step\
  \ 1: request a device code\ncurl -s https://auth.example.com/oauth/device_authorization \\\n  -d 'client_id=MY_CLIENT&scope=openid%20profile'\
  \ | jq '.device_code, .user_code, .verification_uri_complete'\n\n# Step 2: poll for the token (respect\
  \ the interval!)  \ncurl -X POST https://auth.example.com/oauth/token \\\n  -d 'grant_type=urn:ietf:params:oauth:grant-type:device_code&device_code=DEVICE_CODE&client_id=MY_CLIENT'\
  \ | jq\n\n# Step 3: use and refresh the token\ncurl -X POST https://auth.example.com/oauth/token -d\
  \ 'grant_type=refresh_token&refresh_token=REFRESH&client_id=MY_CLIENT' | jq -r '.access_token'\n```\n\
  \n## Error handling\n\n```json\n{\"error\": \"slow_down\"}\n{\"error\": \"authorization_pending\"}\n\
  {\"error\": \"access_denied\"}\n{\"error\": \"expired_token\"}\n```\n\n- `authorization_pending`: keep\
  \ polling after the same interval.\n- `slow_down`: increase the interval by 5 seconds before the next\
  \ poll.\n- `expired_token`: the device_code expired; restart the flow.\n\n## Testing\n\n```bash\n# Simulate\
  \ the full flow locally\ncurl -s https://auth.example.com/oauth/device_authorization -d 'client_id=MY_CLIENT'\
  \ | jq -r '.verification_uri_complete'\n# Open the URL, approve, then poll:\nfor i in $(seq 1 20); do\
  \ sleep 5; curl -X POST https://auth.example.com/oauth/token -d \"grant_type=urn:ietf:params:oauth:grant-type:device_code&device_code=DEVICE_CODE&client_id=MY_CLIENT\"\
  \ | jq; done\n```\n\n## Best practices\n\n- Never log the device_code or access_token.\n- Use PKCE (code_challenge)\
  \ with confidential-client-capable servers even for public clients.\n- Implement the `interval` and\
  \ `slow_down` backoff exactly as specified.\n"
examples:
- input: Implement device login for our CLI tool
  output: Request a device code via the device_authorization endpoint, print verification_uri_complete,
    poll the token endpoint with the returned interval, and handle authorization_pending/slow_down.
- input: Polling returns slow_down
  output: Increase the poll interval by 5 seconds as required by RFC 8628 and retry, never hammer the
    endpoint.
