capabilities:
- name: redis-window-limits
  description: Inspect Redis-based rate limit counters, exercise limited endpoints, and measure effective
    limiting under load.
  commands:
  - redis-cli --scan --pattern 'rl:*' | head -20
  - redis-cli GET rl:{client}:{route}:count
  - 'curl -i https://api.example.com/v1/items -H ''Authorization: Bearer $TOKEN'' | grep -i ''x-ratelimit'''
  - redis-cli TTL rl:{client}:{route}:window
  - ab -n 2000 -c 50 https://api.example.com/v1/items | grep -E 'Requests per second|Failed requests'
  examples:
  - redis-cli --scan --pattern 'rl:*' | head -20
  - curl -i https://api.example.com/v1/items | grep -i 'x-ratelimit'
  - ab -n 2000 -c 50 https://api.example.com/v1/items | grep -E 'Requests per second|Failed requests'
  parameters:
  - name: limit-key
    type: string
    description: 'Redis key prefix for rate limit counters, e.g. rl:'
  - name: client-identifier
    type: string
    description: API key or user id identifying the rate limit bucket
  - name: requests-per-second
    type: integer
    description: Target RPS for load verification
knowledge:
- title: Redis rate limiting patterns
  type: documentation
  source: https://redis.io/glossary/rate-limiting/
  description: Sliding window and fixed window counter patterns implemented in Redis
instructions: "# Distributed Rate Limiting\n\n## What this skill does\n\nDistributed rate limiting enforces\
  \ a consistent request budget across every instance of a service by storing counters in a shared store\
  \ (Redis). This skill covers counter inspection, headers, and load-test verification.\n\n## When to\
  \ use\n\n- Enforcing per-client quotas across multiple API gateway replicas\n- Debugging unexpected\
  \ 429 responses on a specific key\n- Tuning limits before a public launch\n\n## Real commands\n\n```bash\n\
  # Find all live limit counters\nredis-cli --scan --pattern 'rl:*' | head -20\n\n# Inspect one bucket\n\
  redis-cli GET rl:{client}:{route}:count\nredis-cli TTL rl:{client}:{route}:window\n\n# Verify the response\
  \ headers the client sees\ncurl -i https://api.example.com/v1/items -H 'Authorization: Bearer $TOKEN'\
  \ | grep -i 'x-ratelimit'\n\n# Load-test the endpoint and count 429s\nab -n 2000 -c 50 https://api.example.com/v1/items\
  \ | grep -E 'Requests per second|Failed requests'\n```\n\n## Redis sliding window (Lua) example\n\n\
  ```lua\n-- EVAL script: per-user sliding window\nlocal key = KEYS[1]\nlocal now = tonumber(ARGV[1])\n\
  local window = tonumber(ARGV[2])\nlocal limit = tonumber(ARGV[3])\nredis.call('ZREMRANGEBYSCORE', key,\
  \ 0, now - window * 1000)\nlocal count = redis.call('ZCARD', key)\nif count < limit then\n  redis.call('ZADD',\
  \ key, now, now .. '-' .. math.random(100000))\n  redis.call('EXPIRE', key, window * 2)\n  return 1\n\
  end\nreturn 0\n```\n\n## Testing\n\n```bash\n# Confirm 429s start after the limit is exhausted\nfor\
  \ i in $(seq 1 250); do curl -s -o /dev/null -w '%{http_code}\\n' https://api.example.com/v1/items;\
  \ done | sort | uniq -c\n```\n\n## Best practices\n\n- Return standard headers: `X-RateLimit-Limit`,\
  \ `X-RateLimit-Remaining`, `X-RateLimit-Reset`.\n- Keep Lua scripts atomic and idempotent; test them\
  \ with `redis-cli --eval`.\n- Exclude health checks and internal calls from counting.\n- Monitor the\
  \ Redis instance; a limit-store outage must fail open or closed deliberately.\n"
examples:
- input: Clients see intermittent 429s across replicas
  output: Check redis-cli --scan --pattern 'rl:*' for the client key, compare counts across windows, and
    verify the Lua script is atomic so concurrent replicas don't double-count.
- input: Tune the default per-key limit
  output: Run ab -n 2000 -c 50 against the endpoint, count 429 vs 200 responses, and adjust the window/limit
    parameters in the Redis script.
