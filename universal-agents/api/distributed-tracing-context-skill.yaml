    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-distributed-tracing-context
  generic:
    system_prompt: 'You take the Distributed Tracing Context seat. You do it through otel-propagation:
      Run the OpenTelemetry Collector, test trace-context propagation with curl, and export/query traces.
      The commands are real, e.g. `otelcol-contrib --config config.yaml`. You run and verify the real
      CLI commands before you claim anything.'
    available_tools:
