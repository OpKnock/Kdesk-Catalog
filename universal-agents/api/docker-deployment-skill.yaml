name: docker-deployment
display_name: Docker Deployment
category: api
subcategory: general
description: 'Production Docker deployments: build multi-stage images, tag and push to registries, run
  containers with proper restart policies, and roll back.'
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
prerequisites:
- docker
capabilities:
- name: image-deploy
  description: Build, sign, push, run, and inspect Docker images and containers in deployment pipelines.
  commands:
  - docker build -t registry.example.com/app:v1.2.3 .
  - docker login registry.example.com
  - docker push registry.example.com/app:v1.2.3
  - docker run -d --name app --restart unless-stopped -p 8080:8080 -e ENV=prod registry.example.com/app:v1.2.3
  - docker inspect app --format '{{json .State}}' | jq
  - docker system prune -af --volumes
  examples:
  - docker build -t registry.example.com/app:v1.2.3 . && docker push registry.example.com/app:v1.2.3
  - docker run -d --name app --restart unless-stopped -p 8080:8080 registry.example.com/app:v1.2.3
  - docker tag app:old registry.example.com/app:v1.2.2 && docker push registry.example.com/app:v1.2.2
  parameters:
  - name: image-tag
    type: string
    description: Full image reference including registry and tag
  - name: container-name
    type: string
    description: Name for the running container
  - name: port-mapping
    type: string
    description: host:container port mapping for -p
knowledge:
- title: Dockerfile Best Practices
  type: documentation
  source: https://docs.docker.com/develop/develop-images/dockerfile_best-practices/
  description: Layer caching, multi-stage builds, and image hygiene
- title: docker CLI Reference
  type: documentation
  source: https://docs.docker.com/reference/cli/docker/
  description: Full docker command reference for build, push, run, and inspect
instructions: "# Docker Deployment\n\n## What this skill does\n\nDocker deployment is the art of taking\
  \ an application from Dockerfile to running container in production: building reproducible images, pushing\
  \ to a registry, running with correct restart policies, and rolling back safely.\n\n## When to use\n\
  \n- Deploying an application on a single host or small fleet with docker run\n- Building images in CI\
  \ for later release\n- Debugging why a production container stopped\n\n## Real commands\n\n```bash\n\
  # Build and push\n docker build -t registry.example.com/app:v1.2.3 .\n docker login registry.example.com\n\
  \ docker push registry.example.com/app:v1.2.3\n\n# Run in production\n docker run -d --name app --restart\
  \ unless-stopped -p 8080:8080 -e ENV=prod registry.example.com/app:v1.2.3\n\n# Inspect state\n docker\
  \ inspect app --format '{{json .State}}' | jq\n docker ps -a --filter name=app\n\n# Roll back to the\
  \ previous tag\n docker rm -f app\n docker run -d --name app --restart unless-stopped -p 8080:8080 registry.example.com/app:v1.2.2\n\
  \n# Cleanup\n docker system prune -af --volumes\n```\n\n## Multi-stage Dockerfile example\n\n```dockerfile\n\
  FROM golang:1.22 AS build\nWORKDIR /src\nCOPY go.mod go.sum ./\nRUN go mod download\nCOPY . .\nRUN CGO_ENABLED=0\
  \ go build -o /bin/app ./cmd/app\n\nFROM alpine:3.20\nRUN adduser -D app\nCOPY --from=build /bin/app\
  \ /usr/local/bin/app\nUSER app\nEXPOSE 8080\nENTRYPOINT [\"/usr/local/bin/app\"]\n```\n\n## Testing\n\
  \n```bash\n# Health check after deploy\ncurl -sf http://localhost:8080/health && echo OK\n# Check container\
  \ restarts\n docker inspect app --format '{{.RestartCount}}'\n```\n\n## Best practices\n\n- Use multi-stage\
  \ builds; final image should be minimal (distroless or alpine).\n- Always run as a non-root user in\
  \ the container.\n- Use `--restart unless-stopped` for services; never `--restart always` with manual\
  \ runs.\n- Tag images with immutable versions, not `latest`, so rollback is deterministic.\n- Keep old\
  \ images for at least one release cycle to enable quick rollback.\n"
examples:
- input: Deploy v1.2.3 to the production host
  output: Build and push the image, remove the old container, run with docker run -d --name app --restart
    unless-stopped -p 8080:8080 registry.example.com/app:v1.2.3, then curl the health endpoint.
- input: The container exits immediately on start
  output: docker logs app --tail=100 for the crash, docker inspect app --format '{{.State.ExitCode}}',
    fix the config, then recreate with the same image.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: docker-deployment.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-docker-deployment
  generic:
    system_prompt: 'You take the Docker Deployment seat. You do it through image-deploy: Build, sign,
      push, run, and inspect Docker images and containers in deployment pipelines. The commands are real,
      e.g. `docker build -t registry.example.com/app:v1.2.3 .`. You prefer the shortest safe path, and
      you reproduce failures before diagnosing them.'
    available_tools:
    - bash
    - read
    - write
    - edit
