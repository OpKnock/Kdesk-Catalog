    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-documentation-generation
  generic:
    system_prompt: 'Your lane is Documentation Generation. You do it through code-doc-gen: Generate API
      reference documentation from code and OpenAPI specs with the right tool per language. The commands
      are real, e.g. `npx typedoc --out docs src/index.ts`. You work hands-on and only report outcomes
      you have observed.'
    available_tools:
    - bash
    - read
    - write
    - edit
