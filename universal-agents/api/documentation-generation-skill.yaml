name: documentation-generation
display_name: Documentation Generation
category: api
subcategory: general
description: 'Auto-generates API reference documentation from source code and specs: Typedoc for TypeScript,
  sphinx-apidoc for Python, Doxygen for C++, and OpenAPI generators.'
version: 2.0.0
tags:
- api
author: Mehul Wagde
license: MIT
prerequisites:
- doxygen
- jsdoc
- npx
- sphinx-apidoc
capabilities:
- name: code-doc-gen
  description: Generate API reference documentation from code and OpenAPI specs with the right tool per
    language.
  commands:
  - npx typedoc --out docs src/index.ts
  - sphinx-apidoc -o docs/source src/api && sphinx-build -b html docs/source docs/build
  - doxygen Doxyfile
  - npx @openapitools/openapi-generator-cli generate -i openapi.yaml -g html2 -o docs
  - jsdoc -c jsdoc.json -d docs
  examples:
  - npx typedoc --out docs src/index.ts
  - sphinx-apidoc -o docs/source src/api && sphinx-build -b html docs/source docs/build
  - npx @openapitools/openapi-generator-cli generate -i openapi.yaml -g html2 -o docs
  parameters:
  - name: language
    type: string
    description: 'Source language: typescript, python, cpp, javascript'
  - name: source-dir
    type: string
    description: Directory containing the source files to document
  - name: output-dir
    type: string
    description: Directory for generated docs
knowledge:
- title: Typedoc Docs
  type: documentation
  source: https://typedoc.org/guides/overview/
  description: TypeScript API doc generation from comments and types
- title: Sphinx autodoc
  type: documentation
  source: https://www.sphinx-doc.org/en/master/usage/extensions/autodoc.html
  description: Python doc generation from docstrings via sphinx-apidoc and autodoc
instructions: |
  # Documentation Generation

  ## What this skill does

  Documentation generation extracts docs from source code: comments, docstrings, and types. This skill covers Typedoc (TS), sphinx-apidoc (Python), Doxygen (C++), jsdoc, and OpenAPI-based HTML generators.

  ## When to use

  - Building an API reference that stays in sync with the code
  - Onboarding a new team by generating module overviews
  - Shipping docs as part of the release pipeline

  ## Real commands

  ```bash
  # TypeScript
  npx typedoc --out docs src/index.ts

  # Python: build module docs, then render HTML
  sphinx-apidoc -o docs/source src/api
  sphinx-build -b html docs/source docs/build

  # C/C++
  doxygen Doxyfile

  # OpenAPI -> static HTML reference
  npx @openapitools/openapi-generator-cli generate -i openapi.yaml -g html2 -o docs
  ```

  ## Config example (jsdoc.json)

  ```json
  {
    "source": {"include": ["src"]},
    "opts": {"destination": "docs", "recurse": true},
    "plugins": ["plugins/markdown"]
  }
  ```

  ## CI integration

  ```bash
  # Regenerate and fail on drift
  npx typedoc --out docs src/index.ts && git diff --quiet docs/ || echo 'docs out of date'
  ```

  ## Best practices

  - Generate on every merge; treat stale generated docs as a build failure.
  - Keep doc comments on public API surfaces only.
  - Use `--pretty` and sort options consistently so diffs stay small.
  - Exclude generated/ and vendor/ from the source globs.

  ## Testing

  ```bash
  # Verify all module pages rendered without warnings
  sphinx-build -b html docs/source docs/build -W
  ```
examples:
- input: Generate docs for our TypeScript SDK
  output: Run npx typedoc --out docs src/index.ts, check the generated index page, and wire the command
    into CI to fail on stale docs.
- input: Document the Python api package
  output: Run sphinx-apidoc -o docs/source src/api then sphinx-build -b html docs/source docs/build -W,
    and add docstrings to public functions.
