name: doppler
display_name: Doppler
category: api
subcategory: general
description: 'Centralizes environment variables and secrets across projects and environments (dev/staging/prod)
  with Doppler CLI, injecting into processes, CI, and platform sync.'
version: 2.0.0
tags:
- api
author: Mehul Wagde
license: MIT
prerequisites:
- doppler
capabilities:
- name: secrets-management
  description: Manage Doppler projects, configs, and secrets from the CLI; run processes with injected
    environment variables.
  commands:
  - doppler setup
  - doppler secrets get DOPPLER_TOKEN
  - doppler secrets set API_KEY=abc123 --config dev
  - doppler run -- npm start
  - doppler secrets download --format=env --no-file > .env.doppler
  - doppler secrets delete API_KEY --config prod
  - doppler projects list
  examples:
  - doppler setup && doppler secrets get DOPPLER_TOKEN
  - doppler run --config dev -- npm test
  - doppler secrets download --format=env --no-file | grep API_KEY
  parameters:
  - name: project
    type: string
    description: Doppler project name
  - name: config
    type: string
    description: 'Environment config: dev, staging, prod'
  - name: secret-key
    type: string
    description: Name of the secret to get, set, or delete
knowledge:
- title: Doppler CLI Reference
  type: documentation
  source: https://docs.doppler.com/docs/cli
  description: All doppler CLI commands for secrets, configs, projects, and run injection
instructions: "# Doppler\n\n## What this skill does\n\nDoppler centralizes environment variables and secrets\
  \ across projects and environments (dev/staging/prod). The CLI fetches secrets from the cloud and injects\
  \ them into processes, CI, or syncs them to platforms like Vercel, Docker, and AWS.\n\n## When to use\n\
  \n- Replacing scattered .env files with a single source of truth\n- Onboarding a teammate without sharing\
  \ credentials in chat\n- Injecting secrets into CI jobs or local `npm start`/`docker compose` runs\n\
  \n## Real commands\n\n```bash\n# First-time setup (opens browser for auth, selects project+config)\n\
  doppler setup\n\n# Get, set, and delete secrets\ndoppler secrets get DOPPLER_TOKEN\ndoppler secrets\
  \ set API_KEY=abc123 --config dev\ndoppler secrets delete API_KEY --config prod\n\n# Run a command with\
  \ secrets injected\ndoppler run -- npm start\ndoppler run --config dev -- npm test\n\n# Export secrets\
  \ to a file or stdout\ndoppler secrets download --format=env --no-file > .env.doppler\ndoppler secrets\
  \ download --format=json --no-file | jq .API_KEY\n```\n\n## CI usage\n\n```yaml\n# GitHub Actions\n\
  - name: Setup Doppler\n  uses: dopplerhq/action@v3\n  with:\n    command: run -- npm test\n- name: Inject\
  \ into docker\n  run: doppler run -- docker compose up -d\n```\n\n## Testing\n\n```bash\n# Verify a\
  \ value exists in prod without printing secrets\ndoppler secrets get API_KEY --config prod --plain |\
  \ wc -c\n```\n\n## Best practices\n\n- Never commit `.env` or `DOPPLER_TOKEN`; use `doppler setup` on\
  \ each machine.\n- Rotate secrets with `doppler secrets set` + `--config` per environment, not one giant\
  \ env.\n- Use `--no-file` to avoid accidental .env writes in repos.\n- Set up Doppler CI secrets sync\
  \ once instead of hardcoding values in pipelines.\n- Scope secret names by environment (DEV_DB_URL vs\
  \ PROD_DB_URL) only when needed.\n"
examples:
- input: Give a new dev access to the right secrets
  output: Run doppler setup in their shell, confirm the project/config selection, then doppler secrets
    get DOPPLER_TOKEN to verify.
- input: Rotate the API key in production
  output: Run doppler secrets set API_KEY=<new> --config prod, verify with doppler secrets get API_KEY
    --config prod, then restart services that hold the old value.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: doppler.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-doppler
  generic:
    system_prompt: 'You are the Doppler specialist. You do it through secrets-management: Manage Doppler
      projects, configs, and secrets from the CLI; run processes with injected environment variables.
      The commands are real, e.g. `doppler setup`. You answer with exact commands, not abstractions, and
      flag anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
