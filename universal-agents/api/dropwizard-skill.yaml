name: dropwizard
display_name: Dropwizard
category: api
subcategory: general
description: 'Operates Dropwizard services: validates config, runs DB migrations, and checks healthchecks
  and metrics on the admin port from the fat jar.'
version: 2.0.0
tags:
- api
author: Kdesk
license: MIT
prerequisites:
- java
capabilities:
- name: dropwizard-server
  description: Start, validate, migrate, and monitor a Dropwizard application from its fat jar.
  commands:
  - java -jar app.jar server config.yml
  - java -jar app.jar check config.yml
  - java -jar app.jar db migrate config.yml
  - curl -s localhost:8081/healthcheck | jq
  - curl -s localhost:8081/metrics | jq '.meters."com.example.orders.api"'
  - curl -s localhost:8081/threads | head -50
  examples:
  - java -jar app.jar check config.yml && java -jar app.jar server config.yml
  - curl -s localhost:8081/healthcheck | jq '.deadlocks, .database'
  - java -jar app.jar db migrate config.yml --migrations migrations.xml
  parameters:
  - name: jar-file
    type: string
    description: Path to the Dropwizard fat jar
  - name: config-file
    type: string
    description: Path to the YAML config file
  - name: command
    type: string
    description: 'Dropwizard command: server, check, db migrate, db status'
knowledge:
- title: Dropwizard Documentation
  type: documentation
  source: https://www.dropwizard.io/en/stable/
  description: Configuration reference, admin endpoints, metrics, and database commands
instructions: "# Dropwizard\n\n## What this skill does\n\nDropwizard bundles Jetty, Jersey, Jackson, and\
  \ Dropwizard Metrics into one fat jar. The CLI supports `server`, `check`, and `db` commands; the admin\
  \ port (8081 by default) exposes healthchecks, metrics, and threads.\n\n## When to use\n\n- Starting\
  \ or stopping a Dropwizard service\n- Pre-deploy config validation and DB migration\n- Investigating\
  \ unhealthy services via the admin endpoints\n\n## Real commands\n\n```bash\n# Validate config, then\
  \ run\njava -jar app.jar check config.yml\njava -jar app.jar server config.yml\n\n# Run or verify DB\
  \ migrations\njava -jar app.jar db migrate config.yml\njava -jar app.jar db status config.yml\n\n# Healthchecks\
  \ and metrics on the admin port\ncurl -s localhost:8081/healthcheck | jq '.deadlocks, .database'\ncurl\
  \ -s localhost:8081/metrics | jq '.meters'\ncurl -s localhost:8081/threads | head -50\n```\n\n## config.yml\
  \ example\n\n```yaml\nserver:\n  applicationConnectors:\n    - type: http\n      port: 8080\n  adminConnectors:\n\
  \    - type: http\n      port: 8081\ndatabase:\n  driverClass: org.postgresql.Driver\n  user: app\n\
  \  password: secret\n  url: jdbc:postgresql://db:5432/app\nlogging:\n  level: INFO\n```\n\n## Healthcheck\
  \ example\n\n```java\nimport com.codahale.metrics.health.HealthCheck;\n\npublic class DatabaseHealthCheck\
  \ extends HealthCheck {\n    @Override\n    protected Result check() {\n        return db.isValid(2)\
  \ ? Result.healthy() : Result.unhealthy(\"db unreachable\");\n    }\n}\n```\n\n## Testing\n\n```bash\n\
  # Gate deploys on healthcheck output\ncurl -sf localhost:8081/healthcheck | jq -e 'all(.; .healthy ==\
  \ true)'\n```\n\n## Best practices\n\n- Always run `check` before `server` in CI.\n- Use `db status`\
  \ to confirm migration drift before rollout.\n- Poll /healthcheck (not /metrics) for load balancer health.\n\
  - Set adminConnectors to a private network or firewall it.\n"
examples:
- input: Start the service for staging
  output: Run java -jar app.jar check config.yml, then java -jar app.jar server config.yml, and verify
    with curl -s localhost:8081/healthcheck.
- input: The app is unhealthy on the db healthcheck
  output: Check java -jar app.jar db status config.yml for pending migrations, verify connection details
    in config.yml, and look at curl -s localhost:8081/metrics | jq for connection pool gauges.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: dropwizard.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-dropwizard
  generic:
    system_prompt: 'You work Dropwizard hands-on. You do it through dropwizard-server: Start, validate,
      migrate, and monitor a Dropwizard application from its fat jar. The commands are real, e.g. `java
      -jar app.jar server config.yml`. You work hands-on and only report outcomes you have observed.'
    available_tools:
    - bash
    - read
    - write
    - edit
