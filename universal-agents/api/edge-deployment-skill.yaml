name: edge-deployment
display_name: Edge Deployment
category: api
subcategory: general
description: 'Deploys static and serverless content to the edge with CloudFront + S3: syncs assets, creates
  and invalidates distributions, and updates Lambda@Edge functions.'
version: 2.0.0
tags:
- api
author: Kdesk
license: MIT
prerequisites:
- aws
capabilities:
- name: cloudfront-edge
  description: Manage S3-backed CloudFront distributions and edge invalidations for static deployments.
  commands:
  - aws s3 sync ./public s3://my-bucket --delete
  - aws cloudfront list-distributions --query 'DistributionList.Items[].{id:Id,domain:DomainName}'
  - aws cloudfront get-distribution --id E1234567890ABC
  - aws cloudfront create-invalidation --distribution-id E1234567890ABC --paths '/*'
  - aws s3api head-object --bucket my-bucket --key index.html
  examples:
  - aws s3 sync ./public s3://my-bucket --delete && aws cloudfront create-invalidation --distribution-id
    E1234567890ABC --paths '/*'
  - aws cloudfront list-distributions --query 'DistributionList.Items[].{id:Id,domain:DomainName}' | jq
  - curl -s https://d1abc2def3g4h5.cloudfront.net/ | head -5
  parameters:
  - name: distribution-id
    type: string
    description: CloudFront distribution id to invalidate or inspect
  - name: bucket
    type: string
    description: S3 bucket serving the edge content
  - name: paths
    type: array
    description: Object paths to invalidate, e.g. /* or /assets/*
knowledge:
- title: CloudFront with S3
  type: documentation
  source: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Introduction.html
  description: Distribution setup, caching, invalidation, and origin access control
- title: Lambda@Edge
  type: documentation
  source: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/lambda-at-edge.html
  description: Run functions at edge locations for request/response transformation
instructions: '# Edge Deployment
 
 
  ## What this skill does
 
 
  Edge deployment pushes content to CDN and edge-compute locations so users hit nearby POPs. The typical
  stack: S3 for storage, CloudFront for distribution, Lambda@Edge for request-time logic.
 
 
  ## When to use
 
 
  - Shipping a static site or SPA globally
 
 
  - Invalidating cached content after a release
 
 
  - Adding edge request/response headers without a server
 
 
  ## Real commands
 
 
  ```bash
 
  # Sync assets to S3 (delete stale files)
 
  aws s3 sync ./public s3://my-bucket --delete
 
 
  # Find your distributions
 
  aws cloudfront list-distributions --query ''DistributionList.Items[].{id:Id,domain:DomainName}''
 
 
  # Inspect cache behaviors and origins
 
  aws cloudfront get-distribution --id E1234567890ABC | jq ''.Distribution.DistributionConfig.CacheBehaviors''
 
 
  # Invalidate after deploy
 
  aws cloudfront create-invalidation --distribution-id E1234567890ABC --paths ''/*''
 
 
  # Verify the object reached the edge
 
  curl -sI https://d1abc2def3g4h5.cloudfront.net/ | grep -iE ''x-cache|etag''
 
  ```
 
 
  ## Deploy script example
 
 
  ```bash
 
  set -euo pipefail
 
  aws s3 sync ./public s3://my-bucket --delete --cache-control "max-age=300"
 
  INV=$(aws cloudfront create-invalidation --distribution-id $DIST_ID --paths ''/*'' --query Invalidation.Id
  --output text)
 
  aws cloudfront wait invalidation-completed --distribution-id $DIST_ID --id $INV
 
  ```
 
 
  ## Testing
 
 
  ```bash
 
  # Confirm the invalidation finished before traffic check
 
  aws cloudfront get-invalidation --distribution-id E1234567890ABC --id $INV | jq ''.Invalidation.Status''
 
  ```
 
 
  ## Best practices
 
 
  - Cache hashed assets (immutable) for a year; cache HTML for minutes.
 
 
  - Use Origin Access Control (OAC) so only CloudFront reads the bucket.
 
 
  - Invalidate only the paths that changed; `/*` costs more and thrashes the cache.
 
 
  - Test with `?cache-bust` query params instead of invalidating in dev.
 
 
  '
examples:
- input: Deploy the new site build globally
  output: aws s3 sync ./public s3://my-bucket --delete, then create a CloudFront invalidation for /* and
    wait for completion before announcing.
- input: Users see stale JS after release
