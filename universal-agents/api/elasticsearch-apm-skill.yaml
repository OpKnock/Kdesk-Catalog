name: elasticsearch-apm
display_name: Elasticsearch Apm
category: api
subcategory: general
description: 'Application performance monitoring with the Elastic APM stack: configure APM Server, instrument
  Node.js apps, and query traces from the CLI.'
version: 2.0.0
tags:
- api
author: Kdesk
license: MIT
prerequisites:
- apm-server
- npm
capabilities:
- name: apm-instrumentation
  description: Configure and run the Elastic APM server and agents, and inspect traces and service status.
  commands:
  - apm-server -e -c apm-server.yml
  - apm-server test config -c apm-server.yml
  - curl -s http://localhost:8200/ | jq
  - npm install elastic-apm-node
  - 'curl -s ''localhost:9200/apm-*/_search'' -H ''Content-Type: application/json'' -d ''{"query":{"term":{"processor.event":"transaction"}},"size":3}''
    | jq ''.hits.total'''
  examples:
  - apm-server test config -c apm-server.yml && apm-server -e -c apm-server.yml
  - 'curl -s ''localhost:9200/apm-*/_search'' -H ''Content-Type: application/json'' -d ''{"query":{"range":{"@timestamp":{"gte":"now-1h"}}}}''
    | jq ''.hits.total'''
  - curl -s http://localhost:8200/ | jq '.version'
  parameters:
  - name: apm-server-config
    type: string
    description: Path to apm-server.yml
  - name: service-name
    type: string
    description: APM agent service name for instrumentation
  - name: index-pattern
    type: string
    description: Index pattern for APM data, e.g. apm-*
knowledge:
- title: APM Server Reference
  type: documentation
  source: https://www.elastic.co/guide/en/apm/server/current/index.html
  description: APM Server configuration, authorization, and data flow
- title: Elastic APM Node.js Agent
  type: documentation
  source: https://www.elastic.co/guide/en/apm/agent/nodejs/current/index.html
  description: Instrumenting Node.js with elastic-apm-node
instructions: "# Elasticsearch APM\n\n## What this skill does\n\nElastic APM captures transactions, spans,\
  \ and errors from instrumented services. APM Server (port 8200) receives data from agents and indexes\
  \ into `apm-*` indices; Kibana visualizes the traces.\n\n## When to use\n\n- Finding slow endpoints\
  \ and their bottleneck spans\n- Instrumenting a new service with a minimum of code\n- Verifying APM\
  \ data flows end to end\n\n## Real commands\n\n```bash\n# Validate config and start the server\napm-server\
  \ test config -c apm-server.yml\napm-server -e -c apm-server.yml\n\n# Health check\ncurl -s http://localhost:8200/\
  \ | jq '.version'\n\n# Node.js agent\nnpm install elastic-apm-node\nnode -r elastic-apm-node/start app.js\n\
  \n# Verify transactions landed in Elasticsearch\ncurl -s 'localhost:9200/apm-*/_search' -H 'Content-Type:\
  \ application/json' -d '{\"query\":{\"term\":{\"processor.event\":\"transaction\"}},\"size\":3}' | jq\
  \ '.hits.total'\n```\n\n## apm-server.yml example\n\n```yaml\napm-server:\n  host: \"0.0.0.0:8200\"\n\
  \  auth:\n    secret_token: '${APM_SECRET_TOKEN}'\noutput.elasticsearch:\n  hosts: ['https://es.example.com:9200']\n\
  \  username: apm_server_writer\n  password: '${APM_ES_PASSWORD}'\n```\n\n## Agent config example\n\n\
  ```javascript\nconst apm = require('elastic-apm-node').start({\n  serviceName: 'orders-api',\n  serverUrl:\
  \ 'http://apm.internal:8200',\n  secretToken: process.env.APM_SECRET_TOKEN,\n  environment: process.env.NODE_ENV,\n\
  \  captureBody: 'errors'\n})\n```\n\n## Testing\n\n```bash\n# Generate traffic and check for spans\n\
  curl -s http://localhost:8080/api/orders > /dev/null\ncurl -s 'localhost:9200/apm-*/_search' -H 'Content-Type:\
  \ application/json' -d '{\"query\":{\"term\":{\"service.name\":\"orders-api\"}}}' | jq '.hits.total'\n\
  ```\n\n## Best practices\n\n- Set a secret token and TLS for the APM intake endpoint.\n- Sample at 10%\
  \ in prod and use central config to adjust per service.\n- Set `captureBody: 'errors'` to limit sensitive\
  \ data.\n- Correlate traces with logs by shipping the `trace.id` into log records.\n"
examples:
- input: Instrument the orders service with APM
  output: npm install elastic-apm-node, start with node -r elastic-apm-node/start app.js, and verify apm-server.yml
    points to the right ES cluster.
- input: No traces appear in Kibana
  output: Check apm-server test config, curl the :8200 health endpoint, and query apm-* indices for recent
    data to isolate server vs agent issues.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: elasticsearch-apm.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-elasticsearch-apm
  generic:
    system_prompt: 'You take the Elasticsearch Apm seat. You do it through apm-instrumentation: Configure
      and run the Elastic APM server and agents, and inspect traces and service status. The commands are
      real, e.g. `apm-server -e -c apm-server.yml`. You work hands-on and only report outcomes you have
      observed.'
    available_tools:
    - bash
    - read
    - write
    - edit
