name: env-config
display_name: Env Config
category: api
subcategory: general
description: 'Environment configuration management: load .env files, validate required variables, and
  inject config per environment without leaking secrets.'
version: 2.0.0
tags:
- api
author: Kdesk
license: MIT
prerequisites:
- env
- grep
- node
- python
capabilities:
- name: env-management
  description: Load, validate, and debug environment variables across dev/staging/prod.
  commands:
  - node -r dotenv/config index.js
  - node -e "require('dotenv').config(); console.log(process.env.NODE_ENV)"
  - grep -E '^[A-Z_]+=' .env | sed 's/=.*/=[REDACTED]/'
  - env | grep -iE '^(DATABASE|API_KEY|PORT)=' | cut -d= -f1
  - python -c "import os; from dotenv import load_dotenv; load_dotenv(); print(os.getenv('DATABASE_URL', 'MISSING'))"
  examples:
  - node -r dotenv/config index.js
  - grep -E '^[A-Z_]+=' .env | sed 's/=.*/=[REDACTED]/'
  - env | grep -iE '^(DATABASE|API_KEY|PORT)=' | cut -d= -f1
  parameters:
  - name: env-file
    type: string
    description: Path to the .env file
  - name: var-name
    type: string
    description: Variable to validate or print
  - name: required-vars
    type: array
    description: List of variables that must be set for the app to start
knowledge:
- title: 'The Twelve-Factor App: Config'
  type: documentation
  source: https://12factor.net/config
  description: Store config in the environment, never in code or committed files
instructions: "# Env Config\n\n## What this skill does\n\nEnvironment configuration keeps settings out\
  \ of code: everything that varies between environments lives in env vars. This skill covers dotenv loading,\
  \ validation, and safe debugging.\n\n## When to use\n\n- Setting up a new project's configuration layer\n\
  - Debugging why an app uses the wrong database\n- Auditing that no secret sits in committed .env files\n\
  \n## Real commands\n\n```bash\n# Load .env in Node without code changes\nnode -r dotenv/config index.js\n\
  \n# Verify a loaded value (name only, never the value)\nnode -e \"require('dotenv').config(); console.log(process.env.NODE_ENV)\"\
  \n\n# List variable NAMES from .env (values redacted)\ngrep -E '^[A-Z_]+=' .env | sed 's/=.*/=<redacted>/'\n\
  \n# Compare what the shell actually has\nenv | grep -iE '^(DATABASE|API_KEY|PORT)=' | cut -d= -f1\n\
  ```\n\n## Validation example (Node)\n\n```javascript\nconst required = ['DATABASE_URL', 'JWT_SECRET',\
  \ 'PORT']\nconst missing = required.filter(k => !process.env[k])\nif (missing.length) {\n  throw new\
  \ Error(`Missing required env vars: ${missing.join(', ')}`)\n}\n```\n\n## Testing\n\n```bash\n# Start\
  \ the app with a test env and confirm config is read\nNODE_ENV=test PORT=4000 node -r dotenv/config\
  \ index.js\ncurl -s localhost:4000/health | jq '.env'\n```\n\n## Best practices\n\n- Commit `.env.example`\
  \ with placeholder values; gitignore `.env`.\n- Fail fast at startup when required vars are missing.\n\
  - Never log env values; log names and presences only.\n- Prefer tooling like Doppler/aws ssm for prod;\
  \ keep dotenv for local only.\n- Parse booleans/numbers explicitly instead of string truthiness.\n"
examples:
- input: App connects to prod DB locally
  output: 'Check loaded values: grep the variable names from .env with sed redaction, and confirm NODE_ENV
    before the app reads DATABASE_URL.'
- input: Add config validation at startup
  output: Write a required-vars check that throws with the missing names before the server listens.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: env-config.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-env-config
  generic:
    system_prompt: 'You work Env Config hands-on. You do it through env-management: Load, validate, and
      debug environment variables across dev/staging/prod. The commands are real, e.g. `node -r dotenv/config
      index.js`. You answer with exact commands, not abstractions, and flag anything you have not verified
      yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
