name: envoy-tuning
display_name: Envoy Tuning
category: api
subcategory: general
description: 'Envoy proxy tuning: inspect listeners, clusters, and endpoints via admin API; tune buffer,
  timeout, and connection pool settings.'
version: 2.0.0
tags:
- api
author: Mehul Wagde
license: MIT
capabilities:
- name: envoy-admin
  description: Query the Envoy admin API for listeners, clusters, and stats, and drain or reset connections.
  commands:
  - curl -s http://localhost:15000/listeners | jq
  - 'curl -s http://localhost:15000/clusters?format=json | jq ''.cluster_statuses[] | {name: .name, membership:
    .membership.total_healthy_count}'''
  - curl -s http://localhost:15000/stats?filter=cluster.orders.upstream_rq_time | grep -E 'P50|P95'
  - curl -s -X POST http://localhost:15000/drain_listeners?inboundonly
  - curl -s -X POST http://localhost:15000/reset_counters
  examples:
  - 'curl -s http://localhost:15000/clusters?format=json | jq ''.cluster_statuses[] | {name: .name, membership:
    .membership.total_healthy_count}'''
  - curl -s http://localhost:15000/stats?filter=cluster.orders.upstream_rq_time | grep -E 'P50|P95'
  - curl -s http://localhost:15000/listeners | jq '.[].name'
  parameters:
  - name: admin-port
    type: integer
    description: Envoy admin port (default 15000 in Istio, 9901 standalone)
  - name: cluster-name
    type: string
    description: Cluster name for stats filters
  - name: filter
    type: string
    description: Stats filter regex
knowledge:
- title: Envoy Admin Interface
  type: documentation
  source: https://www.envoyproxy.io/docs/envoy/latest/operations/admin
  description: 'Admin endpoints: clusters, listeners, stats, config dumps'
- title: Envoy Tuning Guide
  type: documentation
  source: https://www.envoyproxy.io/docs/envoy/latest/faq/performance/how_to_benchmark_envoy
  description: 'Performance tuning: workers, connection pools, and timeouts'
instructions: "# Envoy Tuning\n\n## What this skill does\n\nEnvoy is a high-performance L7 proxy. Tuning\
  \ means reading the admin API for listener/cluster state, watching upstream latency stats, and adjusting\
  \ connection pools, timeouts, and buffer sizes.\n\n## When to use\n\n- Latency regressions through a\
  \ gateway or mesh sidecar\n- Upstreams marked unhealthy or connection pool saturation\n- Pre-launch\
  \ capacity tuning\n\n## Real commands\n\n```bash\n# What listeners exist\ncurl -s http://localhost:15000/listeners\
  \ | jq '.[].name'\n\n# Healthy endpoints per cluster\ncurl -s http://localhost:15000/clusters?format=json\
  \ | jq '.cluster_statuses[] | {name: .name, membership: .membership.total_healthy_count}'\n\n# Upstream\
  \ latency percentiles\ncurl -s http://localhost:15000/stats?filter=cluster.orders.upstream_rq_time |\
  \ grep -E 'P50|P95'\n\n# Drain before a restart\ncurl -s -X POST http://localhost:15000/drain_listeners?inboundonly\n\
  \n# Zero out stats after a change\ncurl -s -X POST http://localhost:15000/reset_counters\n```\n\n##\
  \ Tuning config example\n\n```yaml\nclusters:\n  - name: orders\n    connect_timeout: 1.5s\n    circuit_breakers:\n\
  \      thresholds:\n        - max_connections: 1024\n          max_pending_requests: 1024\n        \
  \  max_requests: 2048\n    http2_protocol_options: {}\n    health_checks:\n      healthy_threshold:\
  \ 2\n      unhealthy_threshold: 3\n      timeout: 1s\n      interval: 5s\n```\n\n## Key stats\n\n- `upstream_rq_time`\
  \ P95: endpoint latency as seen by Envoy\n- `upstream_cx_total` and `upstream_rq_pending_total`: pool\
  \ saturation\n- `upstream_cx_connect_fail`: network reachability\n\n## Best practices\n\n- Compare P50\
  \ vs P95; a widening gap points to queueing, not the endpoint.\n- Tune one variable at a time and reset_counters\
  \ between tests.\n- Drain listeners before rolling a proxy to avoid connection resets.\n- Keep connect_timeout\
  \ short (1-2s); raise only for slow-start endpoints.\n"
examples:
- input: P95 latency jumped through the sidecar
  output: Check upstream_rq_time P50/P95 and upstream_rq_pending_total; if pending is high, raise max_pending_requests
    or max_connections in the circuit breaker.
- input: One upstream keeps getting marked unhealthy
  output: Query /clusters?format=json for the cluster's membership and health check failures, and adjust
    interval/timeout thresholds.
