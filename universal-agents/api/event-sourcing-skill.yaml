name: event-sourcing
display_name: Event Sourcing
category: api
subcategory: general
description: 'Event-sourcing architectures: append events to event stores (Kafka, EventStoreDB), rebuild
  projections, and replay events for audit and recovery.'
version: 2.0.0
tags:
- api
author: Kdesk
license: MIT
prerequisites:
- kafka-console-consumer
- kafka-console-producer
- kafka-consumer-groups
capabilities:
- name: event-store-ops
  description: Append and read events in EventStoreDB and Kafka, and manage projections.
  commands:
  - 'curl -s -X POST http://localhost:2113/streams/orders-1 -H ''Content-Type: application/vnd.eventstore.events+json''
    -d ''["{\"eventId\":\"$(uuidgen)\",\"eventType\":\"OrderPlaced\",\"data\":{\"amount\":42}}"]'''
  - curl -s http://localhost:2113/streams/orders-1/0/forward/20 | jq '.entries[].eventType'
  - kafka-console-producer --bootstrap-server localhost:9092 --topic orders.events
  - kafka-console-consumer --bootstrap-server localhost:9092 --topic orders.events --from-beginning
  - kafka-consumer-groups --bootstrap-server localhost:9092 --group projections --describe
  examples:
  - kafka-console-producer --bootstrap-server localhost:9092 --topic orders.events
  - curl -s http://localhost:2113/streams/orders-1/0/forward/20 | jq '.entries[].eventType'
  - kafka-consumer-groups --bootstrap-server localhost:9092 --group projections --describe
  parameters:
  - name: topic
    type: string
    description: Kafka topic or EventStoreDB stream name
  - name: event-type
    type: string
    description: Event type like OrderPlaced
  - name: stream-id
    type: string
    description: Aggregate stream identifier
knowledge:
- title: EventStoreDB HTTP API
  type: documentation
  source: https://developers.eventstore.com/server/v24.2/http-api/
  description: Appending and reading streams via the HTTP API
- title: Kafka Consumers Guide
  type: documentation
  source: https://kafka.apache.org/documentation/
  description: Topics, producers, consumers, and consumer groups
instructions: "# Event Sourcing\n\n## What this skill does\n\nEvent sourcing stores state changes as immutable\
  \ events rather than the current state. Aggregates are rebuilt by replaying events; projections produce\
  \ read models. This skill covers event stores and replays.\n\n## When to use\n\n- Designing audit-complete\
  \ systems (finance, compliance)\n- Rebuilding a read model from scratch\n- Debugging why a projection\
  \ lagged\n\n## Real commands\n\n```bash\n# Append an event to EventStoreDB\ncurl -s -X POST http://localhost:2113/streams/orders-1\
  \ -H 'Content-Type: application/vnd.eventstore.events+json' -d @order-event.json\n\n# Read a stream\
  \ forward\ncurl -s http://localhost:2113/streams/orders-1/0/forward/20 | jq '.entries[].eventType'\n\
  \n# Produce and consume on Kafka\nkafka-console-producer --bootstrap-server localhost:9092 --topic orders.events\n\
  kafka-console-consumer --bootstrap-server localhost:9092 --topic orders.events --from-beginning\n\n\
  # Projection lag\nkafka-consumer-groups --bootstrap-server localhost:9092 --group projections --describe\n\
  ```\n\n## Event JSON example\n\n```json\n{\n  \"eventId\": \"3f3c3b24-1f4b-4b2c-9c1a-0c0d0e0f1a2b\"\
  ,\n  \"eventType\": \"OrderPlaced\",\n  \"data\": {\"orderId\": \"o-1\", \"amount\": 4200}\n}\n```\n\
  \n## Rebuild workflow\n\n```bash\n# 1. Stop the projection consumer\nkafka-consumer-groups --bootstrap-server\
  \ localhost:9092 --group projections --reset-offsets --to-earliest --execute\n# 2. Let it replay from\
  \ the first event\n# 3. Verify counts match the original aggregate totals\n```\n\n## Best practices\n\
  \n- Never mutate or delete events; write corrections as new events.\n- Version your event schemas (v1,\
  \ v2) and keep old readers working.\n- Idempotent projections: replay must yield the same read model.\n\
  - Use a dedicated topic per aggregate type to keep replay simple.\n- Store event type names as constants\
  \ shared across services.\n"
examples:
- input: Rebuild the orders read model
  output: Reset the projections consumer group to earliest, replay, and verify counts; ensure projection
    handlers are idempotent first.
- input: Store order events in Kafka
  output: Produce OrderPlaced/OrderShipped events to orders.events with a schema-versioned payload, and
    consume with a projection group.
