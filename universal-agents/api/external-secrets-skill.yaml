name: external-secrets
display_name: External Secrets
category: api
subcategory: general
description: 'Sync secrets from external providers (AWS Secrets Manager, Vault, GCP) into Kubernetes with
  External Secrets Operator: define ExternalSecrets and verify injected values.'
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
prerequisites:
- helm
- kubectl
capabilities:
- name: external-secrets
  description: Deploy ESO, create SecretStores and ExternalSecrets, and verify secrets land in the cluster.
  commands:
  - helm repo add external-secrets https://charts.external-secrets.io && helm install external-secrets
    external-secrets/external-secrets -n external-secrets --create-namespace
  - kubectl apply -f secret-store.yaml
  - kubectl apply -f external-secret.yaml
  - kubectl get externalsecrets -n app
  - kubectl get secret my-secret -n app -o jsonpath='{.data.DATABASE_URL}' | base64 -d
  - kubectl describe externalsecret db-credentials -n app
  examples:
  - kubectl apply -f secret-store.yaml && kubectl apply -f external-secret.yaml
  - kubectl get externalsecret db-credentials -n app -o jsonpath='{.status.conditions[0].message}'
  - kubectl get secret my-secret -n app -o jsonpath='{.data.DATABASE_URL}' | base64 -d
  parameters:
  - name: namespace
    type: string
    description: Namespace for the ExternalSecret
  - name: secret-name
    type: string
    description: Name of the Kubernetes Secret to sync into
  - name: provider
    type: string
    description: aws, vault, gcp, azure provider for the SecretStore
knowledge:
- title: External Secrets Operator Docs
  type: documentation
  source: https://external-secrets.io/latest/introduction/overview/
  description: SecretStore CRDs, providers, and templating
- title: ESO AWS provider
  type: documentation
  source: https://external-secrets.io/latest/provider/aws-secrets-manager/
  description: Syncing from AWS Secrets Manager with IAM roles
instructions: "# External Secrets\n\n## What this skill does\n\nExternal Secrets Operator (ESO) syncs\
  \ secrets from external APIs (AWS Secrets Manager, Vault, GCP) into Kubernetes Secrets declaratively.\
  \ You define SecretStore (provider+auth) and ExternalSecret (what to fetch), and ESO reconciles the\
  \ target Secret.\n\n## When to use\n\n- Replacing long-lived Secrets baked into cluster manifests\n\
  - Rotating provider-side secrets without touching the cluster\n- Centralizing secret access with IAM/role-based\
  \ auth\n\n## Real commands\n\n```bash\n# Install ESO\nhelm repo add external-secrets https://charts.external-secrets.io\n\
  helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace\n\
  \n# Apply store + external secret\nkubectl apply -f secret-store.yaml\nkubectl apply -f external-secret.yaml\n\
  \n# Verify\nkubectl get externalsecrets -n app\nkubectl get secret my-secret -n app -o jsonpath='{.data.DATABASE_URL}'\
  \ | base64 -d\nkubectl describe externalsecret db-credentials -n app\n```\n\n## Manifests example\n\n\
  ```yaml\n# secret-store.yaml\napiVersion: external-secrets.io/v1beta1\nkind: SecretStore\nmetadata:\n\
  \  name: aws-store\nspec:\n  provider:\n    aws:\n      service: SecretsManager\n      region: us-east-1\n\
  \      auth:\n        jwt:\n          serviceAccountRef:\n            name: eso-sa\n---\n# external-secret.yaml\n\
  apiVersion: external-secrets.io/v1beta1\nkind: ExternalSecret\nmetadata:\n  name: db-credentials\nspec:\n\
  \  refreshInterval: 1h\n  secretStoreRef:\n    name: aws-store\n  target:\n    name: my-secret\n  data:\n\
  \    - secretKey: DATABASE_URL\n      remoteRef:\n        key: prod/db\n        property: url\n```\n\
  \n## Testing\n\n```bash\n# Force an immediate reconcile\nkubectl annotate externalsecret db-credentials\
  \ force-sync=$(date +%s)\n```\n\n## Best practices\n\n- Use `secretStoreRef` per namespace; use ClusterSecretStore\
  \ only for shared stores.\n- Give the operator an IRSA/workload identity, never static keys in the cluster.\n\
  - Check `status.conditions` message when sync fails; it carries the provider error.\n- Test provider\
  \ rotation by changing the remote value and forcing a sync.\n"
examples:
- input: Sync the DB password from AWS Secrets Manager
  output: Install ESO, create the SecretStore with an IRSA service account, then an ExternalSecret mapping
    remote key prod/db property password to a Kubernetes Secret.
- input: ExternalSecret stuck in NotReady
  output: kubectl describe externalsecret <name> and read status.conditions message for the provider error;
    check IAM permissions and SecretStore auth.
