name: fastapi
display_name: Fastapi
category: api
subcategory: general
description: 'Build async Python APIs with FastAPI: run uvicorn, generate OpenAPI schemas, create Pydantic
  models, and test endpoints with TestClient.'
version: 2.0.0
tags:
- api
author: Kdesk
license: MIT
prerequisites:
- pip
- python
- uvicorn
capabilities:
- name: fastapi-server
  description: Run, generate schema for, and test FastAPI applications.
  commands:
  - uvicorn main:app --reload --port 8000
  - uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4
  - curl -s http://localhost:8000/openapi.json | jq '.paths | keys'
  - python -m pytest tests/ -v
  - pip install fastapi uvicorn[standard] pydantic
  examples:
  - uvicorn main:app --reload --port 8000
  - curl -s http://localhost:8000/openapi.json | jq '.paths | keys'
  - python -m pytest tests/ -v
  parameters:
  - name: module
    type: string
    description: ASGI module path like main:app
  - name: port
    type: integer
    description: Server port
  - name: workers
    type: integer
    description: Number of uvicorn workers
knowledge:
- title: FastAPI Documentation
  type: documentation
  source: https://fastapi.tiangolo.com/
  description: Path operations, dependencies, Pydantic models, and testing
- title: Uvicorn docs
  type: documentation
  source: https://www.uvicorn.org/
  description: 'ASGI server settings: reload, workers, and production deployment'
instructions: "# FastAPI\n\n## What this skill does\n\nFastAPI is a modern async Python framework with\
  \ automatic OpenAPI generation and Pydantic validation. This skill covers running uvicorn, defining\
  \ routes/models, exporting schemas, and testing.\n\n## When to use\n\n- Building a new Python REST API\n\
  - Generating client libraries from the auto OpenAPI schema\n- Writing fast async endpoints with type\
  \ validation\n\n## Real commands\n\n```bash\n# Install and run\npip install fastapi uvicorn[standard]\
  \ pydantic\nuvicorn main:app --reload --port 8000\n\n# Production: multiple workers on 0.0.0.0\nuvicorn\
  \ main:app --host 0.0.0.0 --port 8000 --workers 4\n\n# Inspect the auto-generated schema\ncurl -s http://localhost:8000/openapi.json\
  \ | jq '.paths | keys'\n\n# Tests\npython -m pytest tests/ -v\n```\n\n## Minimal app\n\n```python\n\
  from fastapi import FastAPI, HTTPException\nfrom pydantic import BaseModel\n\napp = FastAPI()\n\nclass\
  \ Order(BaseModel):\n    id: str\n    amount: float\n\n@app.get(\"/api/orders/{order_id}\")\nasync def\
  \ get_order(order_id: str) -> Order:\n    order = find(order_id)\n    if not order:\n        raise HTTPException(status_code=404,\
  \ detail=\"Order not found\")\n    return order\n```\n\n## Testing with TestClient\n\n```python\nfrom\
  \ fastapi.testclient import TestClient\nfrom main import app\n\nclient = TestClient(app)\n\ndef test_get_missing_order():\n\
  \    r = client.get(\"/api/orders/nope\")\n    assert r.status_code == 404\n```\n\n## Best practices\n\
  \n- Use async def for IO-bound routes; plain def for CPU-bound sync ones.\n- Let Pydantic models drive\
  \ both validation and response docs.\n- Set `responses={404: ...}` on routes for accurate generated\
  \ docs.\n- Use dependency injection for auth and DB sessions instead of globals.\n- In prod, run with\
  \ `--workers` behind a process manager, not `--reload`.\n"
examples:
- input: Scaffold a FastAPI service
  output: pip install fastapi uvicorn[standard], write main.py with routes and Pydantic models, run uvicorn
    main:app --reload, and check /openapi.json.
- input: Tests fail with import errors
  output: Run pytest from the app directory, verify the ASGI app import path in tests, and use TestClient(app)
    instead of starting a server.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: fastapi.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-fastapi
  generic:
    system_prompt: 'You take the Fastapi seat. You do it through fastapi-server: Run, generate schema
      for, and test FastAPI applications. The commands are real, e.g. `uvicorn main:app --reload --port
      8000`. You prefer the shortest safe path, and you reproduce failures before diagnosing them.'
    available_tools:
    - bash
    - read
    - write
    - edit
