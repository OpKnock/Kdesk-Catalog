name: fastify
display_name: Fastify
category: api
subcategory: general
description: 'Build high-performance Node.js APIs with Fastify: plugins, schema validation, hooks, and
  benchmarking with autocannon.'
version: 2.0.0
tags:
- api
author: Mehul Wagde
license: MIT
prerequisites:
- npm
- npx
capabilities:
- name: fastify-development
  description: Scaffold, run, extend, and benchmark Fastify applications.
  commands:
  - npm create fastify@latest my-app
  - npm install fastify @fastify/cors @fastify/jwt
  - npm run dev
  - npm start
  - npx autocannon -c 50 -d 10 http://localhost:3000/api/orders
  - npm run test
  examples:
  - npm create fastify@latest my-app && cd my-app && npm run dev
  - npx autocannon -c 50 -d 10 http://localhost:3000/api/orders
  - npm install @fastify/cors @fastify/jwt && npm start
  parameters:
  - name: port
    type: integer
    description: Fastify listen port
  - name: connections
    type: integer
    description: autocannon concurrent connections
  - name: duration
    type: integer
    description: Benchmark duration in seconds
knowledge:
- title: Fastify Documentation
  type: documentation
  source: https://fastify.dev/docs/latest/
  description: Plugins, schemas, hooks, and encapsulation model
- title: autocannon
  type: documentation
  source: https://github.com/mcollina/autocannon
  description: HTTP/1.1 benchmark tool for load testing Node services
instructions: "# Fastify\n\n## What this skill does\n\nFastify is a fast, low-overhead Node.js framework\
  \ with JSON Schema validation built in. It is plugin-based, encapsulated, and ships with benchmarks-first\
  \ performance tooling (autocannon).\n\n## When to use\n\n- Building APIs where latency and throughput\
  \ matter\n- Organizing code into plugins with shared decorators and hooks\n- Validating payloads with\
  \ JSON Schema without extra libraries\n\n## Real commands\n\n```bash\n# Scaffold\nnpm create fastify@latest\
  \ my-app\ncd my-app\n\n# Run dev/prod\nnpm run dev\nnpm start\n\n# Plugins\nnpm install @fastify/cors\
  \ @fastify/jwt\n\n# Load test\nnpx autocannon -c 50 -d 10 http://localhost:3000/api/orders\n```\n\n\
  ## Route with schema example\n\n```javascript\nconst fastify = require('fastify')({ logger: true })\n\
  \nfastify.get('/api/orders/:id', {\n  schema: {\n    params: { type: 'object', properties: { id: { type:\
  \ 'string' } } },\n    response: { 404: { type: 'object', properties: { message: { type: 'string' }\
  \ } } }\n  }\n}, async (request, reply) => {\n  const order = await db.find(request.params.id)\n  if\
  \ (!order) return reply.code(404).send({ message: 'not found' })\n  return order\n})\n\nfastify.listen({\
  \ port: 3000 })\n```\n\n## Testing\n\n```bash\nnpm run test\n# or manual smoke\ncurl -s localhost:3000/api/orders/1\
  \ | jq\n```\n\n## Best practices\n\n- Encapsulate features in plugins; pass shared state via decorators.\n\
  - Always define JSON Schema for routes to get serialization speedups.\n- Use fastify.addHook for auth/logging\
  \ instead of middleware wrappers.\n- Benchmark every change with autocannon and keep a baseline file.\n\
  - Register plugins with fastify-plugin when they must cross encapsulation.\n"
examples:
- input: Scaffold a Fastify service with auth
  output: npm create fastify@latest, add @fastify/jwt and @fastify/cors, protect routes via onRequest
    hooks, and verify with curl + a token.
- input: Compare framework throughput
  output: Run npx autocannon -c 50 -d 10 against each candidate and compare req/s and latency p99.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: fastify.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-fastify
  generic:
    system_prompt: 'Your lane is Fastify. You do it through fastify-development: Scaffold, run, extend,
      and benchmark Fastify applications. The commands are real, e.g. `npm create fastify@latest my-app`.
      You work hands-on and only report outcomes you have observed.'
    available_tools:
    - bash
    - read
    - write
    - edit
