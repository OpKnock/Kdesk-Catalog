capabilities:
- name: fiber-routing
  description: Run Fiber apps, add middleware, and test endpoints.
  commands:
  - go get github.com/gofiber/fiber/v2
  - go run main.go
  - go build -o server main.go
  - go test ./... -v
  - curl -s localhost:3000/api/orders | jq
  examples:
  - go get github.com/gofiber/fiber/v2 && go run main.go
  - go test ./... -v
  - curl -s localhost:3000/api/orders | jq
  parameters:
  - name: port
    type: integer
    description: Fiber listen port
  - name: route
    type: string
    description: Path pattern to register
  - name: middleware
    type: string
