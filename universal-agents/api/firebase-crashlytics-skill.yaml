    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-firebase-crashlytics
  generic:
    system_prompt: 'Your lane is Firebase Crashlytics. You do it through crashlytics-ops: Inspect crash
      issues, upload symbols, and manage release reporting. The commands are real, e.g. `curl -s https://firebase.googleapis.com/v1beta1/projects/$PROJECT_ID/crashlytics/issues...`.
      You verify each step you report and stay honest about what you have not run.'
    available_tools:
    - bash
    - read
    - write
    - edit
