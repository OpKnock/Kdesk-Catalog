name: firebase-hosting
display_name: Firebase Hosting
category: api
subcategory: general
description: 'Firebase Hosting: deploy sites, configure rewrites and headers, preview builds locally,
  and manage multiple sites per project.'
version: 2.0.0
tags:
- api
author: Kdesk
license: MIT
prerequisites:
- firebase
capabilities:
- name: hosting-deploy
  description: Deploy, preview, and configure Firebase Hosting sites.
  commands:
  - firebase init hosting
  - firebase hosting:channel:deploy staging
  - firebase hosting:deploy --only hosting
  - firebase hosting:channel:deploy preview-123 --expires 7d
  - firebase hosting:channel:list
  - firebase serve --only hosting
  examples:
  - firebase init hosting && firebase hosting:channel:deploy staging
  - firebase hosting:channel:deploy preview-123 --expires 7d
  - firebase hosting:deploy --only hosting
  parameters:
  - name: channel
    type: string
    description: Preview channel name like staging
  - name: expires
    type: string
    description: Channel expiry like 7d
  - name: site
    type: string
    description: Hosting site id
knowledge:
- title: Firebase Hosting docs
  type: documentation
  source: https://firebase.google.com/docs/hosting
  description: Deployment, preview channels, rewrites, and headers
- title: Hosting full config
  type: documentation
  source: https://firebase.google.com/docs/hosting/full-config
  description: firebase.json hosting configuration reference
instructions: "# Firebase Hosting\n\n## What this skill does\n\nFirebase Hosting serves static sites and\
  \ SPAs on a global CDN with one-command deploys, preview channels for every PR, and configurable rewrites\
  \ and headers.\n\n## When to use\n\n- Shipping a static site or SPA\n- Giving stakeholders a preview\
  \ URL per PR\n- Adding redirects, rewrites, or security headers\n\n## Real commands\n\n```bash\n# Scaffold\n\
  firebase init hosting\n\n# Deploy to the live channel\nfirebase hosting:deploy --only hosting\n\n# Preview\
  \ channels\nfirebase hosting:channel:deploy staging\nfirebase hosting:channel:deploy preview-123 --expires\
  \ 7d\nfirebase hosting:channel:list\n\n# Local preview\nfirebase serve --only hosting\n```\n\n## firebase.json\
  \ hosting example\n\n```json\n{\n  \"hosting\": {\n    \"public\": \"dist\",\n    \"ignore\": [\"firebase.json\"\
  , \"**/.*\"],\n    \"rewrites\": [\n      {\"source\": \"**\", \"destination\": \"/index.html\"},\n\
  \      {\"source\": \"/api/**\", \"function\": \"api\"}\n    ],\n    \"headers\": [\n      {\"source\"\
  : \"/assets/**\", \"headers\": [{\"key\": \"Cache-Control\", \"value\": \"public, max-age=31536000,\
  \ immutable\"}]}\n    ]\n  }\n}\n```\n\n## Testing\n\n```bash\n# Deploy a channel and curl it\nfirebase\
  \ hosting:channel:deploy preview-123 --expires 7d\ncurl -sI https://preview-123-project.web.app | grep\
  \ -i 'x-cache'\n```\n\n## Best practices\n\n- Always preview on a channel before deploying to the live\
  \ site.\n- Cache hashed assets immutably; HTML without cache headers.\n- Use rewrites for SPA fallback\
  \ and functions for dynamic routes.\n- Set `_` predeploy build step in CI so the site is always fresh.\n\
  - Pin `headers` per asset type, not per file.\n"
examples:
- input: Preview a PR build
  output: firebase hosting:channel:deploy pr-$PR_NUMBER --expires 7d and share the channel URL with reviewers.
- input: SPA 404s on deep links
  output: 'Add a rewrite {''source'': ''**'', ''destination'': ''/index.html''} to firebase.json hosting
    config and redeploy.'
