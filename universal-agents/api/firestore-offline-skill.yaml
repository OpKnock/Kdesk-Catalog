name: firestore-offline
display_name: Firestore Offline
category: api
subcategory: general
description: 'Firestore offline persistence: enable local caching, debug cache reads, and design apps
  that work when connectivity drops.'
version: 2.0.0
tags:
- api
author: Mehul Wagde
license: MIT
prerequisites:
- firebase
- grep
- node
capabilities:
- name: offline-persistence
  description: Enable and debug offline persistence, and verify cache behavior in client SDKs.
  commands:
  - 'node -e "const db=require(''firebase/firestore'');firebase.firestore().settings({persistence: true});firebase.firestore().enablePersistence().then(()=>console.log(''offline
    ok''))"'
  - node -e "const {initializeFirestore,persistentLocalCache,indexedDbLocalCache}=require('firebase/firestore');const
    db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:indexedDbLocalCache()})});console.log(db)"
  - firebase emulators:start --only firestore
  - grep -rn 'enablePersistence\|persistentLocalCache' src/ | head -10
  - curl -s 'http://localhost:8080/api/cache-stats' | jq '.localDocuments'
  examples:
  - node -e "const {initializeFirestore,persistentLocalCache,indexedDbLocalCache}=require('firebase/firestore');const
    db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:indexedDbLocalCache()})});console.log(db)"
  - firebase emulators:start --only firestore
  - grep -rn 'enablePersistence\|persistentLocalCache' src/ | head -10
  parameters:
  - name: cache-mode
    type: string
    description: persistent or memory local cache mode
  - name: tab-manager
    type: string
    description: indexedDbLocalCache or multiTabLocalCache
  - name: settings-file
    type: string
    description: File where Firestore settings are configured
knowledge:
- title: Firestore offline data
  type: documentation
  source: https://firebase.google.com/docs/firestore/manage-data/enable-offline
  description: Enabling persistence on mobile and web SDKs
- title: Firestore cache semantics
  type: documentation
  source: https://firebase.google.com/docs/firestore/manage-data/enable-offline#monitor_network_status
  description: Source options, cache eviction, and network state handling
instructions: "# Firestore Offline\n\n## What this skill does\n\nFirestore caches data locally so reads\
  \ and queued writes continue offline. Mobile SDKs enable persistence by default; web needs explicit\
  \ settings. This skill covers enabling and verifying the cache.\n\n## When to use\n\n- Mobile apps that\
  \ must work on subways/airplanes\n- Web apps wanting instant re-renders from cache\n- Queuing writes\
  \ that happened offline\n\n## Real commands\n\n```bash\n# Web: persistent cache with IndexedDB tab manager\n\
  node -e \"const {initializeFirestore,persistentLocalCache,indexedDbLocalCache}=require('firebase/firestore');const\
  \ db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:indexedDbLocalCache()})});console.log(db)\"\
  \n\n# Older web SDK pattern\nfirebase.firestore().enablePersistence().catch(e => console.log('multi-tab\
  \ needs config'))\n\n# Local emulation to test offline behavior\nfirebase emulators:start --only firestore\n\
  \n# Audit cache config in the codebase\n grep -rn 'enablePersistence\\|persistentLocalCache' src/ |\
  \ head -10\n```\n\n## Read source options\n\n```javascript\n// Server-first vs cache-first reads\nimport\
  \ { getDoc, source } from 'firebase/firestore'\nconst snap = await getDoc(docRef, { source: source.server\
  \ })\nconst cached = await getDoc(docRef, { source: source.cache })\n```\n\n## Testing offline behavior\n\
  \n```bash\n# Simulate offline: kill the emulator or disable the network\nfirebase emulators:start --only\
  \ firestore\n# load the page, disconnect, verify reads still render from cache\n```\n\n## Best practices\n\
  \n- Web: pick `persistentLocalCache` explicitly; avoid mixing persistence modes per tab.\n- Use `multiTabLocalCache`\
  \ for multi-tab consistency on web.\n- Remember cache-only data may be stale: use `snapshotListeners`\
  \ to reconcile.\n- Test with `getDoc(docRef, { source: source.cache })` to force cache reads.\n- Handle\
  \ `failed-precondition` errors (persistence unavailable) gracefully.\n"
examples:
- input: Make our web app read from cache first
  output: 'Initialize Firestore with persistentLocalCache({tabManager: indexedDbLocalCache()}) and use
    cache-source reads for read-mostly screens.'
- input: Offline writes are lost on app restart
  output: Verify enablePersistence/persistentLocalCache is set before any queries; without persistence,
    queued writes drop when the page closes.
