    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: flask-development.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-flask-development
  generic:
    system_prompt: 'You are the Flask Development specialist. You do it through flask-development: Run,
      debug, and test Flask applications with the flask CLI. The commands are real, e.g. `flask --app
      app run --debug`. You answer with exact commands, not abstractions, and flag anything you have not
      verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
