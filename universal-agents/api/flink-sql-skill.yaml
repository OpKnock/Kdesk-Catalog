name: flink-sql
display_name: Flink Sql
category: api
subcategory: general
description: 'Stream processing with Flink SQL: start the SQL client, run streaming queries against Kafka
  topics, and manage table sources and sinks.'
version: 2.0.0
tags:
- api
author: Mehul Wagde
license: MIT
prerequisites:
- flink
- kafka-console-producer
- sql-client.sh
capabilities:
- name: flink-sql-client
  description: Run Flink SQL queries, define sources/sinks, and manage jobs.
  commands:
  - sql-client.sh embedded --defaults conf/sql-client-defaults.yaml
  - sql-client.sh embedded -f /opt/jobs/orders.sql
  - kafka-console-producer --bootstrap-server localhost:9092 --topic orders.events
  - sql-client.sh embedded --help
  - flink run -d -c org.example.StreamJob /opt/jobs/job.jar
  examples:
  - sql-client.sh embedded -f /opt/jobs/orders.sql
  - kafka-console-producer --bootstrap-server localhost:9092 --topic orders.events
  - sql-client.sh embedded --help
  parameters:
  - name: script-file
    type: string
    description: Path to a .sql script for batch execution
  - name: kafka-topic
    type: string
    description: Topic backing the source/sink table
  - name: checkpoint-interval
    type: string
    description: Checkpoint interval like 60s
knowledge:
- title: Flink SQL Reference
  type: documentation
  source: https://nightlies.apache.org/flink/flink-docs-stable/docs/dev/table/sql/overview/
  description: 'SQL syntax for stream processing: CREATE TABLE, windowing, and joins'
- title: Flink SQL Client
  type: documentation
  source: https://nightlies.apache.org/flink/flink-docs-stable/docs/dev/table/sqlclient/
  description: Interactive and file-based SQL client usage
instructions: "# Flink SQL\n\n## What this skill does\n\nFlink SQL turns stream processing into SQL: you\
  \ declare Kafka topics as tables and run continuous queries over them. The sql-client executes interactively\
  \ or from .sql scripts.\n\n## When to use\n\n- Aggregating event streams (counts, sums, windows)\n-\
  \ Joining streaming data with static dimension data\n- Prototyping pipelines before writing Java/Scala\
  \ jobs\n\n## Real commands\n\n```bash\n# Interactive SQL client\nsql-client.sh embedded --defaults conf/sql-client-defaults.yaml\n\
  \n# Execute a script headless\nsql-client.sh embedded -f /opt/jobs/orders.sql\n\n# Seed a Kafka topic\
  \ to test against\nkafka-console-producer --bootstrap-server localhost:9092 --topic orders.events\n\
  ```\n\n## SQL example\n\n```sql\nCREATE TABLE orders (\n  order_id STRING,\n  amount DECIMAL(10, 2),\n\
  \  ts TIMESTAMP(3),\n  WATERMARK FOR ts AS ts - INTERVAL '5' SECOND\n) WITH (\n  'connector' = 'kafka',\n\
  \  'topic' = 'orders.events',\n  'properties.bootstrap.servers' = 'localhost:9092',\n  'format' = 'json',\n\
  \  'scan.startup.mode' = 'latest-offset'\n);\n\nCREATE TABLE hourly_sales (\n  window_start TIMESTAMP(3),\n\
  \  total_amount DECIMAL(14, 2)\n) WITH (\n  'connector' = 'print'\n);\n\nINSERT INTO hourly_sales\n\
  SELECT TUMBLE_START(ts, INTERVAL '1' HOUR), SUM(amount)\nFROM orders\nGROUP BY TUMBLE(ts, INTERVAL '1'\
  \ HOUR);\n```\n\n## Testing\n\n```bash\n# Run a bounded test: read from a file sink with print connector\n\
  sql-client.sh embedded -f /opt/jobs/test.sql\n```\n\n## Best practices\n\n- Always define WATERMARKs\
  \ for event-time aggregations.\n- Set checkpointing (default 60s) for exactly-once state.\n- Prefer\
  \ `scan.startup.mode = 'earliest-offset'` for reprocessing.\n- Keep DDL in .sql scripts versioned with\
  \ the job.\n- Test with the print connector before wiring real sinks.\n"
examples:
- input: Aggregate orders per hour from Kafka
  output: Define the orders table with a watermark, run a TUMBLE window INSERT INTO a print sink from
    a .sql script, and seed data with kafka-console-producer.
- input: SQL client can't find Kafka
  output: Check the 'properties.bootstrap.servers' in the WITH clause and conf/sql-client-defaults.yaml
    connector jars.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: flink-sql.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-flink-sql
  generic:
    system_prompt: 'This is your domain: Flink Sql. You do it through flink-sql-client: Run Flink SQL
      queries, define sources/sinks, and manage jobs. The commands are real, e.g. `sql-client.sh embedded
      --defaults conf/sql-client-defaults.yaml`. You verify each step you report and stay honest about
      what you have not run.'
    available_tools:
    - bash
    - read
    - write
    - edit
