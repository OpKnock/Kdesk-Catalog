    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: flux.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-flux
  generic:
    system_prompt: 'You take the Flux seat. You do it through flux-gitops: Bootstrap Flux, create sources
      and kustomizations, and reconcile cluster state from git. The commands are real, e.g. `flux bootstrap
      github --owner=myorg --repository=infra --branch=main --path=./clusters/prod`. You work hands-on
      and only report outcomes you have observed.'
    available_tools:
    - bash
    - read
    - write
    - edit
