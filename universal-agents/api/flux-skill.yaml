name: flux
display_name: Flux
category: api
subcategory: general
description: 'GitOps delivery with Flux: bootstrap clusters, reconcile from git repositories, and manage
  Helm releases and Kustomizations.'
version: 2.0.0
tags:
- api
author: Mehul Wagde
license: MIT
prerequisites:
- flux
capabilities:
- name: flux-gitops
  description: Bootstrap Flux, create sources and kustomizations, and reconcile cluster state from git.
  commands:
  - flux bootstrap github --owner=myorg --repository=infra --branch=main --path=./clusters/prod
  - flux create source git app-infra --url=https://github.com/myorg/app-infra --branch=main
  - flux create kustomization apps --source=app-infra --path=./apps --prune=true --interval=5m
  - flux reconcile kustomization apps --with-source
  - flux get kustomizations
  - flux get helmreleases -A
  examples:
  - flux bootstrap github --owner=myorg --repository=infra --branch=main --path=./clusters/prod
  - flux reconcile kustomization apps --with-source
  - flux get kustomizations
  parameters:
  - name: repository
    type: string
    description: Git repository holding cluster manifests
  - name: source-name
    type: string
    description: Flux source (git) name
  - name: path
    type: string
    description: Manifests path inside the repository
knowledge:
- title: Flux docs
  type: documentation
  source: https://fluxcd.io/flux/
  description: Bootstrap, GitRepository, Kustomization, and HelmRelease controllers
- title: Flux CLI reference
  type: documentation
  source: https://fluxcd.io/flux/cmd/
  description: All flux create/get/reconcile commands
instructions: "# Flux\n\n## What this skill does\n\nFlux is a GitOps operator for Kubernetes: it watches\
  \ git repositories, applies manifests and Helm charts, and keeps the cluster in sync with git. The CLI\
  \ bootstraps and operates the controllers.\n\n## When to use\n\n- Adopting GitOps for cluster delivery\n\
  - Automating Helm releases from git\n- Reverting to a previous state by reverting a commit\n\n## Real\
  \ commands\n\n```bash\n# Bootstrap onto a cluster (creates controllers + repo config)\nflux bootstrap\
  \ github --owner=myorg --repository=infra --branch=main --path=./clusters/prod\n\n# Create a source\
  \ and a kustomization\nflux create source git app-infra --url=https://github.com/myorg/app-infra --branch=main\n\
  flux create kustomization apps --source=app-infra --path=./apps --prune=true --interval=5m\n\n# Force\
  \ reconciliation\nflux reconcile kustomization apps --with-source\n\n# Inspect state\nflux get kustomizations\n\
  flux get helmreleases -A\n```\n\n## Typical layout\n\n```\nclusters/prod/\n  flux-system/          #\
  \ generated by bootstrap\n  apps.yaml\n  helmreleases/\napps/\n  payments/\n    kustomization.yaml\n\
  \    deployment.yaml\n```\n\n## Testing\n\n```bash\n# Verify source health and last applied commit\n\
  flux get sources git -A\nflux get kustomizations -o json | jq '.[] | {name: .metadata.name, ready: .status.conditions[0].status}'\n\
  ```\n\n## Best practices\n\n- One repo or path per environment; keep prod separate from dev.\n- Use\
  \ `--prune=true` so deleted git files are removed from the cluster.\n- Enable notifications (flux create\
  \ alert) for sync failures.\n- Test kustomizations in staging before adding to prod path.\n- Keep secrets\
  \ in sealed secrets or external-secrets, never plain in git.\n"
examples:
- input: Bootstrap GitOps on our prod cluster
  output: Run flux bootstrap github with the infra repo and clusters/prod path, then add kustomizations
    pointing at app manifests.
- input: Cluster drifted from git
  output: Run flux reconcile kustomization apps --with-source to force a sync, then check flux get kustomizations
    for the error.
