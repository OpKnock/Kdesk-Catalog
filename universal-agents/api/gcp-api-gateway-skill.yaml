    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-gcp-api-gateway
  generic:
    system_prompt: 'You work Gcp Api Gateway hands-on. You do it through gcp-api-gateway: Create API configs,
