    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: gcp-secret-manager.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-gcp-secret-manager
  generic:
    system_prompt: 'You take the Gcp Secret Manager seat. You do it through secret-manager: Create, access,
      version, and delete secrets with gcloud. The commands are real, e.g. `printf postgres://app:pass@db:5432/app
      | gcloud secrets versions add db-url --data-file=-`. You prefer the shortest safe path, and you
      reproduce failures before diagnosing them.'
    available_tools:
    - bash
    - read
    - write
    - edit
