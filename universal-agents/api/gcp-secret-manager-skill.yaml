name: gcp-secret-manager
display_name: Gcp Secret Manager
category: api
subcategory: general
description: 'Store and manage secrets in GCP Secret Manager: create and version secrets, access values,
  and grant access via IAM.'
version: 2.0.0
tags:
- api
author: Kdesk
license: MIT
prerequisites:
- gcloud
- printf
capabilities:
- name: secret-manager
  description: Create, access, version, and delete secrets with gcloud.
  commands:
  - printf 'postgres://app:pass@db:5432/app' | gcloud secrets versions add db-url --data-file=-
  - gcloud secrets create db-url --replication-policy=automatic --data-file=- <<< 'postgres://...'
  - gcloud secrets versions access latest --secret=db-url
  - gcloud secrets versions list db-url
  - gcloud secrets versions destroy latest --secret=db-url
  - gcloud secrets add-iam-policy-binding db-url --member=serviceAccount:app-sa@my-project.iam.gserviceaccount.com
    --role=roles/secretmanager.secretAccessor
  examples:
  - gcloud secrets versions access latest --secret=db-url
  - gcloud secrets create db-url --replication-policy=automatic --data-file=- <<< 'postgres://...'
  - gcloud secrets add-iam-policy-binding db-url --member=serviceAccount:app-sa@my-project.iam.gserviceaccount.com
    --role=roles/secretmanager.secretAccessor
  parameters:
  - name: secret-name
    type: string
    description: Secret identifier
  - name: version
    type: string
    description: Version number or latest
  - name: replication
    type: string
    description: automatic or user-managed replication
knowledge:
- title: Secret Manager docs
  type: documentation
  source: https://cloud.google.com/secret-manager/docs
  description: Secret versions, replication, rotation, and IAM
- title: gcloud secrets reference
  type: documentation
  source: https://cloud.google.com/sdk/gcloud/reference/secrets
  description: create, versions, and IAM commands
instructions: "# GCP Secret Manager\n\n## What this skill does\n\nSecret Manager stores secrets (API keys,\
  \ DB passwords) with versioning and fine-grained IAM. Cloud Run/Functions reference secrets by version\
  \ without embedding values.\n\n## When to use\n\n- Centralizing credentials that many services need\n\
  - Versioned rotation without coordinated deploys\n- Passing secrets to serverless via env references\n\
  \n## Real commands\n\n```bash\n# Create a secret from stdin\nprintf 'postgres://app:pass@db:5432/app'\
  \ | gcloud secrets create db-url --replication-policy=automatic --data-file=-\n\n# Add a version\nprintf\
  \ 'postgres://app:newpass@db:5432/app' | gcloud secrets versions add db-url --data-file=-\n\n# Access\
  \ and list versions\n gcloud secrets versions access latest --secret=db-url\n gcloud secrets versions\
  \ list db-url\n\n# Destroy a version (30-day grace for restore)\n gcloud secrets versions destroy 2\
  \ --secret=db-url\n\n# Grant access to a service account\n gcloud secrets add-iam-policy-binding db-url\
  \ --member=serviceAccount:app-sa@my-project.iam.gserviceaccount.com --role=roles/secretmanager.secretAccessor\n\
  ```\n\n## Cloud Run reference\n\n```bash\n gcloud run services update orders --region=us-central1 --set-secrets=DB_URL=db-url:latest\n\
  ```\n\n## Testing\n\n```bash\n# Verify the value round trips\nV=$(gcloud secrets versions access latest\
  \ --secret=db-url)\ntest \"$V\" = \"$EXPECTED\" && echo OK\n```\n\n## Best practices\n\n- Never copy\
  \ secret values into chat, logs, or gist.\n- Reference secrets by version for serverless; use latest\
  \ only for rotation windows.\n- Rotate with a new version, then destroy old ones after the grace period.\n\
  - Grant least privilege: secretAccessor per service account per secret.\n- Enable automatic replication\
  \ for HA; user-managed for compliance pinning.\n"
examples:
- input: Store the DB URL and wire it into Cloud Run
  output: Create the secret with gcloud secrets create, grant the runtime SA secretAccessor, and set it
    via gcloud run services update --set-secrets.
- input: Rotate a credential
  output: Add a new version, point consumers at the new version, then destroy the old one after confirming
    no errors.
platforms:
