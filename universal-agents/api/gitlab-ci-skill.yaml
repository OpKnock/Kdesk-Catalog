name: gitlab-ci
display_name: Gitlab Ci
category: api
subcategory: general
description: 'CI/CD pipelines with GitLab CI: validate pipeline YAML, run jobs via the API, manage runners,
  and debug job failures.'
version: 2.0.0
tags:
- api
author: Mehul Wagde
license: MIT
prerequisites:
- gitlab-runner
capabilities:
- name: gitlab-pipelines
  description: Validate, run, and inspect GitLab CI pipelines and runners.
  commands:
  - 'curl -s -X POST --header ''Content-Type: application/json'' --header "PRIVATE-TOKEN: $GITLAB_TOKEN"
    https://gitlab.example.com/api/v4/projects/$PROJECT_ID/ci/lint -d ''{"content": "$(cat .gitlab-ci.yml
    | python -c "import sys,json;print(json.dumps(sys.stdin.read()))")"}'' | jq ''.errors'''
  - 'curl -s --header "PRIVATE-TOKEN: $GITLAB_TOKEN" http://localhost:8080/api/v4/projects/$PROJECT_ID/pipelines?ref=main
    | jq ''.[0] | {id, status}'''
  - 'curl -s --header "PRIVATE-TOKEN: $GITLAB_TOKEN" http://localhost:8080/api/v4/projects/$PROJECT_ID/pipelines/$PIPE_ID/jobs
    | jq ''.[] | {name, status}'''
  - gitlab-runner list
  - gitlab-runner register --url http://localhost:8080 --token $RUNNER_TOKEN --executor docker --docker-image
    alpine:latest
  - 'curl -s --header "PRIVATE-TOKEN: $GITLAB_TOKEN" http://localhost:8080/api/v4/projects/$PROJECT_ID/pipelines/$PIPE_ID
    | jq ''{status, duration, created_at}'''
  examples:
  - 'curl -s -X POST --header ''Content-Type: application/json'' --header "PRIVATE-TOKEN: $GITLAB_TOKEN"
    https://gitlab.example.com/api/v4/projects/$PROJECT_ID/ci/lint -d ''{"content": "$(cat .gitlab-ci.yml
    | python -c "import sys,json;print(json.dumps(sys.stdin.read()))")"}'' | jq ''.errors'''
  - 'curl -s --header "PRIVATE-TOKEN: $GITLAB_TOKEN" http://localhost:8080/api/v4/projects/$PROJECT_ID/pipelines?ref=main
    | jq ''.[0] | {id, status}'''
  - gitlab-runner list
  parameters:
  - name: project-id
    type: string
    description: GitLab project id or URL-encoded path
  - name: pipeline-id
    type: integer
    description: Pipeline to inspect
  - name: runner-token
    type: string
    description: Runner registration token
knowledge:
- title: GitLab CI/CD docs
  type: documentation
  source: https://docs.gitlab.com/ee/ci/
  description: Pipeline configuration, jobs, rules, and caching
- title: GitLab REST API pipelines
  type: documentation
  source: https://docs.gitlab.com/ee/api/pipelines.html
  description: Pipeline and job API endpoints
instructions: "# GitLab CI\n\n## What this skill does\n\nGitLab CI defines pipelines in .gitlab-ci.yml\
  \ with stages, jobs, and rules. The REST API validates config, lists pipelines/jobs, and the gitlab-runner\
  \ CLI manages executors.\n\n## When to use\n\n- Validating .gitlab-ci.yml before pushing\n- Inspecting\
  \ failing jobs via API\n- Registering runners for new projects\n\n## Real commands\n\n```bash\n# Lint\
  \ the config via API\ncurl -s -X POST --header 'Content-Type: application/json' --header \"PRIVATE-TOKEN:\
  \ $GITLAB_TOKEN\" https://gitlab.example.com/api/v4/projects/$PROJECT_ID/ci/lint -d '{\"content\": \"\
  $(cat .gitlab-ci.yml | python -c \"import sys,json;print(json.dumps(sys.stdin.read()))\")\"}' | jq '.errors'\n\
  \n# Latest pipelines on main\ncurl -s --header \"PRIVATE-TOKEN: $GITLAB_TOKEN\" https://gitlab.example.com/api/v4/projects/$PROJECT_ID/pipelines?ref=main\
  \ | jq '.[0] | {id, status}'\n\n# Job statuses for a pipeline\ncurl -s --header \"PRIVATE-TOKEN: $GITLAB_TOKEN\"\
  \ https://gitlab.example.com/api/v4/projects/$PROJECT_ID/pipelines/$PIPE_ID/jobs | jq '.[] | {name,\
  \ status}'\n\n# Runner management\ngitlab-runner list\ngitlab-runner register --url https://gitlab.example.com\
  \ --token $RUNNER_TOKEN --executor docker --docker-image alpine:latest\n```\n\n## .gitlab-ci.yml example\n\
  \n```yaml\nstages: [test, deploy]\n\ntest:\n  stage: test\n  image: node:20\n  script:\n    - npm ci\n\
  \    - npm test\n  rules:\n    - if: $CI_PIPELINE_SOURCE == \"merge_request_event\"\n\ndeploy:\n  stage:\
  \ deploy\n  script:\n    - echo \"deploying\"\n  only:\n    - main\n```\n\n## Testing\n\n```bash\n#\
  \ Retry a failed job via API\ncurl -s -X POST --header \"PRIVATE-TOKEN: $GITLAB_TOKEN\" https://gitlab.example.com/api/v4/projects/$PROJECT_ID/jobs/$JOB_ID/retry\
  \ | jq '.status'\n```\n\n## Best practices\n\n- Lint config in pre-commit or MR CI so invalid YAML never\
  \ merges.\n- Use `rules:` instead of deprecated only/except.\n- Cache dependencies per branch and key\
  \ on lockfiles.\n- Scope runner registration tokens to one project.\n- Poll job status with the API,\
  \ don't scrape the UI.\n"
examples:
- input: Validate the new pipeline config before pushing
  output: POST the .gitlab-ci.yml content to the ci/lint endpoint and check .errors; fix before committing.
- input: Find which job failed in the last pipeline
  output: List pipelines for the ref, take the newest id, then GET /pipelines/<id>/jobs and filter status
    == 'failed'.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: gitlab-ci.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-gitlab-ci
  generic:
    system_prompt: 'You are the Gitlab Ci specialist. You do it through gitlab-pipelines: Validate, run,
      and inspect GitLab CI pipelines and runners. The commands are real, e.g. `curl -s -X POST --header
      Content-Type: application/json --header PRIVATE-TOKEN:...`. You prefer the shortest safe path, and
      you reproduce failures before diagnosing them.'
    available_tools:
    - bash
    - read
    - write
    - edit
