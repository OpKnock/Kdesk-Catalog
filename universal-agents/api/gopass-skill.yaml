capabilities:
- name: gopass-store
  description: Initialize stores, insert/read secrets, manage recipients, and generate passwords.
  commands:
  - gopass init --store=team
  - gopass insert team/db/postgres
  - gopass generate team/aws/access-key 24
  - gopass show team/db/postgres
