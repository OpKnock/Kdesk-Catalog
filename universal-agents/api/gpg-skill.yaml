name: gpg
display_name: Gpg
category: api
subcategory: general
description: 'PGP encryption and signing: generate keypairs, encrypt/decrypt files, sign and verify commits,
  and manage keyrings.'
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
prerequisites:
- gpg
capabilities:
- name: gpg-ops
  description: Generate keys, encrypt/decrypt, sign/verify, and manage keyring exports.
  commands:
  - gpg --full-generate-key
  - gpg --encrypt --recipient alice@example.com secrets.txt
  - gpg --decrypt secrets.txt.gpg
  - gpg --sign --local-user bob@example.com data.txt
  - gpg --verify data.txt.gpg
  - gpg --armor --export alice@example.com > alice.pub
  - gpg --list-keys
  examples:
  - gpg --encrypt --recipient alice@example.com secrets.txt && gpg --decrypt secrets.txt.gpg
  - gpg --armor --export alice@example.com > alice.pub && gpg --import alice.pub
  - gpg --list-keys --fingerprint
  parameters:
  - name: recipient
    type: string
    description: Key id or email of the recipient
  - name: input-file
    type: string
    description: File to encrypt/sign/decrypt
  - name: key-id
    type: string
    description: Local key id or fingerprint
knowledge:
- title: GnuPG documentation
  type: documentation
  source: https://www.gnupg.org/documentation/manuals/gnupg/
  description: Key management, encryption, and signing manuals
- title: GPG CLI cheat sheet
  type: documentation
  source: https://docs.github.com/en/authentication/managing-commit-signature-verification/signing-commits
  description: Using GPG keys to sign commits on GitHub
instructions: "# GPG\n\n## What this skill does\n\nGPG (GnuPG) implements OpenPGP: asymmetric encryption,\
  \ digital signatures, and key management. It protects files at rest and proves authorship of commits\
  \ and releases.\n\n## When to use\n\n- Encrypting files exchanged with partners\n- Signing commits/tags\
  \ for supply chain trust\n- Managing keyrings for CI release signing\n\n## Real commands\n\n```bash\n\
  # Generate a keypair\ngpg --full-generate-key\n\n# Encrypt/decrypt\ngpg --encrypt --recipient alice@example.com\
  \ secrets.txt\ngpg --decrypt secrets.txt.gpg\n\n# Sign and verify\ngpg --sign --local-user bob@example.com\
  \ data.txt\ngpg --verify data.txt.gpg\n\n# Export/import public keys\ngpg --armor --export alice@example.com\
  \ > alice.pub\ngpg --import alice.pub\n\n# Keyring\n gpg --list-keys --fingerprint\n```\n\n## Signing\
  \ commits\n\n```bash\ngit config --global user.signingkey <fingerprint>\ngit config --global commit.gpgsign\
  \ true\ngit commit -S -m \"signed commit\"\n```\n\n## Key backup\n\n```bash\n# Export the secret key\
  \ (keep offline!) and revoke cert\ngpg --armor --export-secret-keys alice@example.com > alice-secret.asc\n\
  gpg --gen-revoke alice@example.com > alice-revoke.asc\n```\n\n## Testing\n\n```bash\n# Round trip\n\
  echo topsecret | gpg --encrypt --recipient alice@example.com | gpg --decrypt\n```\n\n## Best practices\n\
  \n- Use 4096-bit RSA or modern ECC keys; avoid legacy defaults.\n- Back up secret keys and revocation\
  \ certs offline.\n- Sign, then encrypt (sign-then-encrypt) rather than the reverse.\n- Keep a separate\
  \ signing subkey for CI agents.\n- Never share secret keys; share only armored public keys.\n"
examples:
- input: Encrypt a file for a partner
  output: Import their public key, gpg --encrypt --recipient <their-email> secrets.txt, and send the .gpg
    file; they decrypt with their key.
- input: Sign the release artifact
  output: gpg --armor --detach-sign release.tar.gz to produce release.tar.gz.asc and ship both for verification.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: gpg.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-gpg
  generic:
    system_prompt: 'You own Gpg end to end. You do it through gpg-ops: Generate keys, encrypt/decrypt,
      sign/verify, and manage keyring exports. The commands are real, e.g. `gpg --full-generate-key`.
      You run and verify the real CLI commands before you claim anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
