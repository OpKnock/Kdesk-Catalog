name: grafana-dashboards
display_name: Grafana Dashboards
category: api
subcategory: general
description: 'Grafana dashboard management: provision dashboards via API and files, create panels and
  alerts, and query data sources from the CLI.'
version: 2.0.0
tags:
- api
author: Mehul Wagde
license: MIT
prerequisites:
- grafana-cli
capabilities:
- name: grafana-provisioning
  description: Provision, export, and manage dashboards via the Grafana HTTP API.
  commands:
  - grafana-cli plugins list
  - 'curl -s -H ''Authorization: Bearer $GRAFANA_TOKEN'' http://localhost:3000/api/search?type=dash-db
    | jq ''.[] | {uid, title}'''
  - 'curl -s -H ''Authorization: Bearer $GRAFANA_TOKEN'' http://localhost:3000/api/dashboards/uid/orders-overview
    | jq ''.dashboard.title'''
  - 'curl -s -X POST -H ''Authorization: Bearer $GRAFANA_TOKEN'' -H ''Content-Type: application/json''
    http://localhost:3000/api/dashboards/db -d @dashboard.json | jq ''.status'''
  - 'curl -s -H ''Authorization: Bearer $GRAFANA_TOKEN'' ''http://localhost:3000/api/dashboards/uid/orders-overview''
    | jq ''.dashboard.panels[0].targets[0].expr'''
  - 'curl -s -X DELETE -H ''Authorization: Bearer $GRAFANA_TOKEN'' http://localhost:3000/api/dashboards/uid/orders-overview
    | jq ''.title'''
  examples:
  - 'curl -s -H ''Authorization: Bearer $GRAFANA_TOKEN'' http://localhost:3000/api/search?type=dash-db
    | jq ''.[] | {uid, title}'''
  - 'curl -s -X POST -H ''Authorization: Bearer $GRAFANA_TOKEN'' -H ''Content-Type: application/json''
    http://localhost:3000/api/dashboards/db -d @dashboard.json | jq ''.status'''
  - 'curl -s -H ''Authorization: Bearer $GRAFANA_TOKEN'' http://localhost:3000/api/dashboards/uid/orders-overview
    | jq ''.dashboard.panels[0].targets[0].expr'''
  parameters:
  - name: dashboard-uid
    type: string
    description: Dashboard unique identifier
  - name: datasource
    type: string
    description: Data source like Prometheus or Loki
  - name: promql-expr
    type: string
    description: Panel query expression
knowledge:
- title: Grafana HTTP API
  type: documentation
  source: https://grafana.com/docs/grafana/latest/developers/http_api/dashboard/
  description: Dashboard create/read/delete API endpoints
- title: Grafana provisioning
  type: documentation
  source: https://grafana.com/docs/grafana/latest/administration/provisioning/
  description: Provisioning dashboards and data sources from files
instructions: "# Grafana Dashboards\n\n## What this skill does\n\nGrafana visualizes metrics and logs\
  \ in dashboards. This skill covers dashboard lifecycle through the API: search, export, create, and\
  \ delete, plus panel query inspection.\n\n## When to use\n\n- Rolling out dashboards as code\n- Inspecting\
  \ what a panel actually queries\n- Migrating dashboards between Grafana instances\n\n## Real commands\n\
  \n```bash\n# Search dashboards\ncurl -s -H 'Authorization: Bearer $GRAFANA_TOKEN' http://localhost:3000/api/search?type=dash-db\
  \ | jq '.[] | {uid, title}'\n\n# Export and inspect panels\ncurl -s -H 'Authorization: Bearer $GRAFANA_TOKEN'\
  \ http://localhost:3000/api/dashboards/uid/orders-overview | jq '.dashboard.panels[0].targets[0].expr'\n\
  \n# Import a dashboard JSON\ncurl -s -X POST -H 'Authorization: Bearer $GRAFANA_TOKEN' -H 'Content-Type:\
  \ application/json' http://localhost:3000/api/dashboards/db -d @dashboard.json | jq '.status'\n\n# Delete\n\
  curl -s -X DELETE -H 'Authorization: Bearer $GRAFANA_TOKEN' http://localhost:3000/api/dashboards/uid/orders-overview\
  \ | jq '.title'\n\n# Plugins\n grafana-cli plugins list\n```\n\n## Dashboard JSON shape\n\n```json\n\
  {\n  \"dashboard\": {\n    \"title\": \"Orders Overview\",\n    \"uid\": \"orders-overview\",\n    \"\
  panels\": [\n      {\n        \"title\": \"Request rate\",\n        \"type\": \"timeseries\",\n    \
  \    \"targets\": [{\"expr\": \"sum(rate(http_requests_total{job=\\\"orders\\\"}[5m]))\", \"refId\"\
  : \"A\"}]\n      }\n    ],\n    \"time\": {\"from\": \"now-1h\", \"to\": \"now\"}\n  },\n  \"overwrite\"\
  : true\n}\n```\n\n## Testing\n\n```bash\n# After import, verify the panel resolves\ncurl -s -H 'Authorization:\
  \ Bearer $GRAFANA_TOKEN' 'http://localhost:3000/api/ds/query' -H 'Content-Type: application/json' -d\
  \ '{\"queries\":[{\"expr\":\"up\",\"refId\":\"A\"}],\"from\":\"now-5m\",\"to\":\"now\"}' | jq '.results.A.frames[0].data'\
  \ | head -5\n```\n\n## Best practices\n\n- Manage dashboards as JSON in git; import via API or provisioning\
  \ files.\n- Keep panel queries readable; add refIds and comments.\n- Use template variables for environment/instance\
  \ filtering.\n- Set versioned UIDs so imports overwrite cleanly.\n- Enable annotations from data sources\
  \ to correlate with deploys.\n"
examples:
- input: Import the orders dashboard into Grafana
  output: POST the dashboard JSON to /api/dashboards/db with overwrite:true, then verify with /api/search?type=dash-db.
- input: What does this panel actually query?
  output: GET /api/dashboards/uid/<uid> and walk .dashboard.panels[].targets[].expr to audit every query.
