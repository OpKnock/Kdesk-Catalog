instructions: "# GraphQL Graphene\n\n## What this skill does\n\nGraphene builds GraphQL schemas in Python\
  \ with classes: ObjectType for objects, resolvers as methods, and Schema for the root. Graphene-Django\
  \ adds ORM-friendly fields.\n\n## When to use\n\n- Adding GraphQL to a Python/Django service\n- Reusing\
  \ existing ORM models in a graph\n- Python teams that want code-first GraphQL\n\n## Real commands\n\n\
  ```bash\n# Install\npip install graphene graphene-django\n\n# Inline smoke test\npython -c \"import\
  \ graphene; s=graphene.Schema(query=Query); print(s.execute('{ hello }').data)\"\n\n# Export SDL for\
  \ client tooling\npython manage.py graphql_schema --schema myapp.schema.schema --out schema.graphql\n\
  \n# Serve and query\npython manage.py runserver\ncurl -s -X POST http://localhost:8000/graphql -H 'Content-Type:\
  \ application/json' -d '{\"query\":\"{ hello }\"}' | jq\n```\n\n## Schema example\n\n```python\nimport\
  \ graphene\n\nclass Order(graphene.ObjectType):\n    id = graphene.ID()\n    status = graphene.String()\n\
  \nclass Query(graphene.ObjectType):\n    hello = graphene.String()\n    order = graphene.Field(Order,\
  \ id=graphene.ID(required=True))\n\n    def resolve_hello(self, info):\n        return \"world\"\n\n\
  \    def resolve_order(self, info, id):\n        return Orders.get(id)  # None -> graphene returns null\n\
  \nschema = graphene.Schema(query=Query)\n```\n\n## Testing\n\n```bash\n# Execute without HTTP\npython\
  \ -c \"from myapp.schema import schema; r=schema.execute('{ order(id: \\\"1\\\") { id status } }');\
  \ print(r.data, r.errors)\"\n```\n\n## Best practices\n\n- Code-first: keep schema classes near the\
  \ models they expose.\n- Use graphene-django's DjangoObjectType to avoid hand-written fields.\n- Export\
  \ SDL to schema.graphql for the client pipeline.\n- Resolve N+1 queries with select_related/prefetch_related.\n\
  - Return errors as GraphQL errors, not Python exceptions leaking.\n"
examples:
- input: Expose Django models via GraphQL
  output: Define DjangoObjectType classes and a Query with resolvers, wire graphene-django in urls.py,
    and runserver to test.
- input: Export the schema for codegen
  output: python manage.py graphql_schema --schema myapp.schema.schema --out schema.graphql and feed it
    to codegen.
