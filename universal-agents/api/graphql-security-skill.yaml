name: graphql-security
display_name: Graphql Security
category: api
subcategory: general
description: 'GraphQL API security: test for introspection abuse, injection, and excessive depth; apply
  protections like query cost limits and allowlists.'
version: 2.0.0
tags:
- api
author: Kdesk
license: MIT
prerequisites:
- npx
capabilities:
- name: graphql-security
  description: Probe GraphQL endpoints for common vulnerabilities and validate protections.
  commands:
  - 'curl -s -X POST http://localhost:4000/graphql -H ''Content-Type: application/json'' -d ''{"query":"{
    __schema { types { name } } }"}'' | jq ''.data.__schema.types | length'''
  - 'curl -s -X POST http://localhost:4000/graphql -H ''Content-Type: application/json'' -d ''{"query":"{
    __typename }"}'' | jq ''.errors'''
  - 'curl -s -X POST http://localhost:4000/graphql -H ''Content-Type: application/json'' -d ''{"query":"{
    a: __typename b: __typename c: __typename }"}'' | jq ''.data | length'''
  - 'curl -s -X POST http://localhost:4000/graphql -H ''Content-Type: application/json'' -d ''{"query":"query{
    user(id: \"1\") { id } }"}'' | jq ''.errors'''
  - npx graphql-cop -t http://localhost:4000/graphql
  examples:
  - 'curl -s -X POST http://localhost:4000/graphql -H ''Content-Type: application/json'' -d ''{"query":"{
    __schema { types { name } } }"}'' | jq ''.data.__schema.types | length'''
  - npx graphql-cop -t http://localhost:4000/graphql
  - 'curl -s -X POST http://localhost:4000/graphql -H ''Content-Type: application/json'' -d ''{"query":"{
    a: __typename b: __typename c: __typename }"}'' | jq ''.data | length'''
  parameters:
  - name: endpoint
    type: string
    description: GraphQL endpoint URL
  - name: query
    type: string
    description: Probe query to send
  - name: protection
    type: string
    description: introspection, depth-limit, cost-limit, allowlist
knowledge:
- title: OWASP GraphQL Cheat Sheet
  type: documentation
  source: https://cheatsheetseries.owasp.org/cheatsheets/GraphQL_Cheat_Sheet.html
  description: Introspection, batching attacks, and mitigation strategies
- title: graphql-cop
  type: documentation
  source: https://github.com/dolevf/graphql-cop
  description: Automated GraphQL security scanner
instructions: "# GraphQL Security\n\n## What this skill does\n\nGraphQL endpoints have unique attack surfaces:\
  \ introspection leaks schemas, deep nested queries amplify cost, alias batching multiplies work, and\
  \ batching fields can throttle-rate bypass. This skill probes and protects those.\n\n## When to use\n\
  \n- Pre-launch security review of a GraphQL API\n- Verifying protections after a change\n- Incident\
  \ triage on abusive queries\n\n## Real commands\n\n```bash\n# Is introspection open?\ncurl -s -X POST\
  \ http://localhost:4000/graphql -H 'Content-Type: application/json' -d '{\"query\":\"{ __schema { types\
  \ { name } } }\"}' | jq '.data.__schema.types | length'\n\n# Alias batching probe (each alias is a separate\
  \ field)\ncurl -s -X POST http://localhost:4000/graphql -H 'Content-Type: application/json' -d '{\"\
  query\":\"{ a: __typename b: __typename c: __typename }\"}' | jq '.data | length'\n\n# Automated scan\n\
  npx graphql-cop -t http://localhost:4000/graphql\n```\n\n## Protections example (Apollo Server)\n\n\
  ```javascript\nconst { ApolloServerPluginLandingPageDisabled } = require('@apollo/server/plugin/landingPage/default')\n\
  \n// disable introspection in prod:\nconst server = new ApolloServer({\n  introspection: process.env.NODE_ENV\
  \ !== 'production',\n  ...\n})\n```\n\n## Depth/cost limiting (graphql-armor)\n\n```javascript\nimport\
  \ { EnvelopArmorPlugin } from '@envelop/armor'\n// maxDepth: 6, maxAliases: 20, maxDirectives: 5\n```\n\
  \n## Best practices\n\n- Disable introspection in production (or gate it by role).\n- Enforce depth\
  \ and alias limits; GraphQL has no natural pagination guard.\n- Rate limit per operation complexity,\
  \ not per request.\n- Use persisted query allowlists for critical endpoints.\n- Never expose resolver\
  \ internals in error messages.\n"
examples:
- input: Someone is hammering the endpoint with deep queries
  output: Run the alias/depth probes with curl to confirm, then add armor maxDepth/maxAliases and per-operation
    cost limits.
- input: Pre-launch GraphQL security review
  output: Run npx graphql-cop -t <endpoint>, triage introspection and injection findings, and apply the
    listed protections.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: graphql-security.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-graphql-security
  generic:
    system_prompt: 'You are the Graphql Security specialist. You do it through graphql-security: Probe
      GraphQL endpoints for common vulnerabilities and validate protections. The commands are real, e.g.
      `curl -s -X POST http://localhost:4000/graphql -H Content-Type: application/json -d...`. You answer
      with exact commands, not abstractions, and flag anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
