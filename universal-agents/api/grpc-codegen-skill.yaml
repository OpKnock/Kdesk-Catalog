name: grpc-codegen
display_name: Grpc Codegen
category: api
subcategory: general
description: Generate gRPC service stubs and clients from .proto definitions using protoc, protoc-gen-*
  plugins, and buf for linting and breaking-change detection.
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
prerequisites:
- buf
- protoc
capabilities:
- name: proto-codegen
  description: Compile proto files to language stubs, lint schemas, and detect breaking API changes with
    buf.
  commands:
  - protoc -I . --go_out=paths=source_relative:. --go-grpc_out=paths=source_relative:. helloworld.proto
  - buf generate
  - buf lint
  - buf breaking --against .git#branch=main
  - buf format -w
  examples:
  - buf generate --template buf.gen.yaml
  - buf lint --error-format=json
  - buf breaking --against buf.build/acme/apis:latest
  parameters:
  - name: out_dir
    type: string
    description: Output directory for generated stubs (default .).
  - name: paths
    type: string
    description: 'Module path mode: source_relative or import.'
  - name: proto_file
    type: string
    description: The .proto file to compile.
knowledge:
- title: protobuf.dev
  type: documentation
  source: https://protobuf.dev
  description: 'Protocol Buffers official docs: language guide and compiler reference.'
- title: Buf Docs
  type: documentation
  source: https://buf.build/docs
  description: 'buf CLI docs: code generation, linting, and breaking change detection.'
instructions: "# gRPC Code Generation\n\nTurn .proto contracts into real client/server code with protoc\
  \ and buf.\n\n## What this skill does\n\n- Compiles proto files into Go, Java, Python, JS, or C++ gRPC\
  \ stubs.\n- Lints proto schemas against style rules.\n- Detects breaking API changes before they ship.\n\
  - Formats proto files consistently.\n\n## When to use\n\n- Adding a new RPC service and need generated\
  \ stubs.\n- Changing an existing proto and want to check backwards compatibility.\n- Standardizing proto\
  \ style in a monorepo.\n\n## Real commands\n\n```bash\n# Go codegen (protoc-gen-go + protoc-gen-go-grpc)\n\
  go install google.golang.org/protobuf/cmd/protoc-gen-go@latest\ngo install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest\n\
  export PATH=\"$PATH:$(go env GOPATH)/bin\"\n\nprotoc -I . --go_out=paths=source_relative:. --go-grpc_out=paths=source_relative:.\
  \ helloworld.proto\n\n# Python codegen\npython -m grpc_tools.protoc -I . --python_out=. --grpc_python_out=.\
  \ helloworld.proto\n\n# buf managed workflow\ncat > buf.yaml <<EOF\nversion: v2\nmodules:\n  - path:\
  \ proto\nEOF\n\ncat > buf.gen.yaml <<EOF\nversion: v2\nplugins:\n  - local: protoc-gen-go\n    out:\
  \ gen\n    opt: paths=source_relative\n  - local: protoc-gen-go-grpc\n    out: gen\n    opt: paths=source_relative\n\
  EOF\n\nbuf generate\nbuf lint\nbuf breaking --against .git#branch=main\nbuf format -w\n```\n\n## Best\
  \ practices\n\n- Keep generated files out of git or commit them at a tagged version; pick one and stay\
  \ consistent.\n- Run `buf breaking` in CI before merging any proto change.\n- Use source_relative paths\
  \ for Go so imports match your module layout.\n- Name files with underscores (user_service.proto), messages\
  \ with PascalCase.\n\n## Testing\n\n```bash\nbuf lint && buf generate && go build ./...\n```\n\n## Example\
  \ exchange\n\n```\nUser: Regenerate the Go stubs after I added a field to Order.\nAgent: buf generate\
  \ && go build ./...  # stubs regenerated, build green\n```"
examples:
- input: Check if renaming OrderId to Id breaks existing clients
  output: 'buf breaking --against .git#branch=main  # flags removal of field order_id'
- input: Regenerate Go stubs from proto/
  output: buf generate && go build ./...
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: grpc-codegen.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-grpc-codegen
  generic:
    system_prompt: 'You work Grpc Codegen hands-on. You do it through proto-codegen: Compile proto files
      to language stubs, lint schemas, and detect breaking API changes with buf. The commands are real,
      e.g. `protoc -I . --go_out=paths=source_relative:. --go-grpc_out=paths=source_relative:....`. You
      verify each step you report and stay honest about what you have not run.'
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2024-01-01T00:00:00Z'
updated_at: '2024-01-01T00:00:00Z'
