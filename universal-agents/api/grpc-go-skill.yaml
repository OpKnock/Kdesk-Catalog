name: grpc-go
display_name: Grpc Go
category: api
subcategory: general
description: 'gRPC servers and clients in Go: protoc-gen-go codegen, grpc.NewClient channels, interceptors,
  streaming RPCs, and vet-clean service wiring.'
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
prerequisites:
- protoc
capabilities:
- name: go-grpc-server
  description: Build and run Go gRPC servers with registration, interceptors, and reflection.
  commands:
  - go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
  - go get google.golang.org/grpc@latest
  - protoc -I . --go_out=. --go-grpc_out=. helloworld.proto
  - go run ./server
  - go build ./...
  examples:
  - go run ./server & grpcurl -plaintext localhost:50051 list
  - go test ./...
  - go vet ./...
  parameters:
  - name: listen_addr
    type: string
    description: TCP address the server listens on, e.g. :50051.
  - name: dial_target
    type: string
    description: Client target address, e.g. localhost:50051.
  - name: secure
    type: boolean
    description: Use TLS credentials (true) or insecure credentials (false).
knowledge:
- title: gRPC Go Docs
  type: documentation
  source: https://grpc.io/docs/languages/go/
  description: Official gRPC Go quickstart, basics, streaming, and auth guides.
- title: grpc-go Reference
  type: documentation
  source: https://pkg.go.dev/google.golang.org/grpc
  description: Package reference for google.golang.org/grpc.
instructions: "# gRPC Go\n\nWrite and run gRPC services in Go using protoc-gen-go-grpc and google.golang.org/grpc.\n\
  \n## What this skill does\n\n- Generates Go gRPC stubs from proto files.\n- Implements unary, server-streaming,\
  \ client-streaming, and bidi-streaming RPCs.\n- Wires interceptors for logging, auth, and metrics.\n\
  - Runs and debugs servers with grpcurl and reflection.\n\n## When to use\n\n- Building a Go microservice\
  \ with typed RPC contracts.\n- Adding streaming endpoints (logs, live data, uploads).\n- Writing Go\
  \ clients for an existing gRPC API.\n\n## Real commands\n\n```bash\n# Install generators\ngo install\
  \ google.golang.org/protobuf/cmd/protoc-gen-go@latest\ngo install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest\n\
  \n# Generate stubs (paths=source_relative keeps package layout)\nprotoc -I . --go_out=paths=source_relative:.\
  \ --go-grpc_out=paths=source_relative:. helloworld.proto\n\n# Build and run\ngo build ./...\ngo run\
  \ ./server &\ngo run ./client\n\n# Debug with reflection\ngrpcurl -plaintext localhost:50051 list\n\
  ```\n\n## Server skeleton\n\n```go\nlis, _ := net.Listen(\"tcp\", \":50051\")\ns := grpc.NewServer(\n\
  \  grpc.ChainUnaryInterceptor(logInterceptor, authInterceptor),\n)\npb.RegisterGreeterServer(s, &server{})\n\
  reflection.Register(s)\ns.Serve(lis)\n```\n\n## Client skeleton\n\n```go\nconn, _ := grpc.NewClient(\"\
  localhost:50051\", grpc.WithTransportCredentials(insecure.NewCredentials()))\ndefer conn.Close()\nclient\
  \ := pb.NewGreeterClient(conn)\nresp, err := client.SayHello(ctx, &pb.HelloRequest{Name: \"Ada\"})\n\
  ```\n\n## Testing\n\n```bash\ngo test ./... -race\ngo run ./server &\ngrpcurl -plaintext -d '{\"name\"\
  :\"Ada\"}' localhost:50051 helloworld.Greeter/SayHello\n```\n\n## Best practices\n\n- Use `grpc.NewClient`\
  \ (not deprecated grpc.Dial) with `WithTransportCredentials`.\n- Set per-call deadlines with context.WithTimeout\
  \ on the client side.\n- Return `status.Error(codes.X, msg)` instead of plain errors.\n- Register reflection\
  \ in dev so grpcurl can discover services.\n\n## Example exchange\n\n```\nUser: My Go client hangs calling\
  \ the Greeter.\nAgent: Add a timeout context and check the server address:\n       ctx, cancel := context.WithTimeout(ctx,\
  \ 5*time.Second)\n       resp, err := client.SayHello(ctx, &pb.HelloRequest{Name: \"Ada\"})\n```"
examples:
- input: Generate Go stubs for helloworld.proto
  output: protoc -I . --go_out=paths=source_relative:. --go-grpc_out=paths=source_relative:. helloworld.proto
- input: Call the running Greeter server with grpcurl
  output: grpcurl -plaintext -d '{"name":"Ada"}' localhost:50051 helloworld.Greeter/SayHello
