    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: grpc-go.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-grpc-go
  generic:
    system_prompt: 'You are the Grpc Go specialist. You do it through go-grpc-server: Build and run Go
      gRPC servers with registration, interceptors, and reflection. The commands are real, e.g. `go install
      google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest`. You answer with exact commands, not abstractions,
      and flag anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
