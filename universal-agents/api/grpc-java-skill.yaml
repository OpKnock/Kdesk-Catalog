instructions: "# gRPC Java\n\nWrite gRPC services and clients in Java with the protobuf Gradle plugin.\n\
  \n## What this skill does\n\n- Generates Java gRPC stubs from proto files during the Gradle build.\n\
  - Implements servers with ServerBuilder and clients with ManagedChannel.\n- Probes generated stubs with\
  \ grpcurl for verification.\n- Writes service unit tests with in-process channels.\n\n## When to use\n\
  \n- A JVM microservice team adopts gRPC contracts.\n- Backend clients need typed RPC calls.\n- Migrating\
  \ REST endpoints to gRPC in an existing Gradle repo.\n\n## Real commands\n\n```bash\n# Generate stubs\
  \ and build\n./gradlew generateProto\n./gradlew build\n\n# Run server and client\n./gradlew run\njava\
  \ -cp build/libs/app.jar com.example.GreeterServer &\njava -cp build/libs/app.jar com.example.GreeterClient\n\
  \n# Probe from outside\ngrpcurl -plaintext -d '{\"name\":\"Java\"}' localhost:50051 helloworld.Greeter/SayHello\n\
  ```\n\n## Gradle config\n\n```groovy\nplugins {\n  id 'com.google.protobuf' version '0.9.4'\n  id 'java'\n\
  }\n\ndependencies {\n  implementation 'io.grpc:grpc-netty-shaded:1.64.0'\n  implementation 'io.grpc:grpc-protobuf:1.64.0'\n\
  \  implementation 'io.grpc:grpc-stub:1.64.0'\n  compileOnly 'org.apache.tomcat:annotations-api:6.0.53'\n\
  }\n\nprotobuf {\n  protoc { artifact = 'com.google.protobuf:protoc:3.25.3' }\n  plugins { grpc { artifact\
  \ = 'io.grpc:protoc-gen-grpc-java:1.64.0' } }\n  generateProtoTasks { all()*.plugins { grpc {} } }\n\
  }\n```\n\n## Server skeleton\n\n```java\nServer server = ServerBuilder.forPort(50051)\n  .addService(new\
  \ GreeterServiceImpl())\n  .build();\nserver.start();\nserver.awaitTermination();\n```\n\n## Testing\n\
  \n```java\nGrpcCleanupRule cleanupRule = new GrpcCleanupRule();\nInProcessServerBuilder.forName(\"test\"\
  ).directExecutor().addService(new GreeterServiceImpl()).build();\n```\n\n## Best practices\n\n- Use\
  \ grpc-netty-shaded to avoid Netty version conflicts.\n- Add the tomcat annotations-api compileOnly\
  \ dep or javax.annotation is unresolved.\n- Set `deadline = 10, TimeUnit.SECONDS` on blocking stubs.\n\
  - Pin protoc and protoc-gen-grpc-java to matching versions.\n\n## Example exchange\n\n```\nUser: Gradle\
  \ fails: package javax.annotation does not exist.\nAgent: Add compileOnly 'org.apache.tomcat:annotations-api:6.0.53'\
  \ to dependencies.\n```"
examples:
- input: Generate Java stubs for the greet proto and build
  output: ./gradlew generateProto build
- input: Probe the running Java server
  output: grpcurl -plaintext -d '{"name":"Java"}' localhost:50051 helloworld.Greeter/SayHello
