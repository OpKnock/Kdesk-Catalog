name: grpc-kotlin
display_name: Grpc Kotlin
category: api
subcategory: general
description: 'gRPC services and clients in Kotlin using grpc-kotlin coroutines stubs: suspend RPCs, Flow-based
  streaming, and Gradle codegen wiring.'
version: 2.0.0
tags:
- api
author: Kdesk
license: MIT
prerequisites:
- ./gradlew
- grpcurl
- protoc
capabilities:
- name: kotlin-grpc
  description: Generate Kotlin gRPC stubs with protoc-gen-grpc-kotlin and write coroutine-based RPC services.
  commands:
  - protoc --plugin=protoc-gen-grpckt=$(which protoc-gen-grpc-kotlin) --grpckt_out=build/generated --proto_path
    src/main/proto greet.proto
  - ./gradlew generateProto
  - ./gradlew run
  - ./gradlew build
  - grpcurl -plaintext localhost:50051 helloworld.Greeter/SayHello
  examples:
  - protoc --plugin=protoc-gen-grpckt=$(which protoc-gen-grpc-kotlin) --grpckt_out=build/generated --proto_path
    src/main/proto greet.proto
  - ./gradlew test --tests '*GreeterTest'
  - grpcurl -plaintext -d '{"name":"Kotlin"}' localhost:50051 helloworld.Greeter/SayHello
  parameters:
  - name: grpc_kotlin_version
    type: string
    description: grpc-kotlin library version, e.g. 1.4.1.
  - name: plugin_path
    type: string
    description: Path to the protoc-gen-grpc-kotlin executable.
  - name: proto_dir
    type: string
    description: Directory containing .proto files.
