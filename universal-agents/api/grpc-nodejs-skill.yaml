name: grpc-nodejs
display_name: Grpc Nodejs
category: api
subcategory: general
description: 'gRPC services and clients in Node.js with @grpc/grpc-js and @grpc/proto-loader: dynamic
  proto loading, streaming RPCs, and grpc_tools_node_protoc codegen.'
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
prerequisites:
- ./node_modules/.bin/grpc_tools_node_protoc
- node
- npm
capabilities:
- name: nodejs-grpc
  description: Load proto definitions dynamically and implement gRPC servers/clients in Node.js.
  commands:
  - npm install @grpc/grpc-js @grpc/proto-loader
  - npm install -D grpc-tools
  - ./node_modules/.bin/grpc_tools_node_protoc -I ./proto --js_out=import_style=commonjs:./generated --grpc_out=./generated
    ./proto/greet.proto
  - node server.js
  - node client.js
  examples:
  - node server.js & node client.js
  - npm run proto:gen && node server.js
  - node --inspect server.js
  parameters:
  - name: proto_path
    type: string
    description: Directory containing the .proto files.
  - name: host
    type: string
    description: Server host:port, e.g. localhost:50051.
  - name: keepalive_ms
    type: integer
    description: Keepalive ping interval in ms for long-lived channels.
knowledge:
- title: gRPC Node.js Docs
  type: documentation
  source: https://grpc.io/docs/languages/node/
  description: Official gRPC Node quickstart and basics with @grpc/grpc-js.
- title: '@grpc/grpc-js npm'
  type: documentation
  source: https://www.npmjs.com/package/@grpc/grpc-js
  description: Package docs and options for the pure-JS grpc implementation.
instructions: "# gRPC Node.js\n\ngRPC services and clients in Node with @grpc/grpc-js.\n\n## What this\
  \ skill does\n\n- Loads .proto files at runtime with @grpc/proto-loader (no build step needed).\n- Implements\
  \ unary and streaming RPC handlers.\n- Generates static JS stubs with grpc_tools_node_protoc when preferred.\n\
  - Configures channels: deadlines, keepalive, and interceptors.\n\n## When to use\n\n- A Node microservice\
  \ needs internal typed RPC calls.\n- Prototype gRPC APIs quickly without a codegen pipeline.\n- Building\
  \ gateway workers that fan out to gRPC services.\n\n## Real commands\n\n```bash\n# Install\nnpm install\
  \ @grpc/grpc-js @grpc/proto-loader\nnpm install -D grpc-tools\n\n# Dynamic loading (no codegen) is the\
  \ default pattern\nnode server.js &\nnode client.js\n\n# Optional static codegen\n./node_modules/.bin/grpc_tools_node_protoc\
  \ -I ./proto \\\n  --js_out=import_style=commonjs:./generated --grpc_out=./generated ./proto/greet.proto\n\
  ```\n\n## Server skeleton\n\n```js\nconst grpc = require('@grpc/grpc-js');\nconst protoLoader = require('@grpc/proto-loader');\n\
  const pkgDef = protoLoader.loadSync('./proto/greet.proto');\nconst greet = grpc.loadPackageDefinition(pkgDef).helloworld;\n\
  \nconst server = new grpc.Server();\nserver.addService(greet.Greeter.service, {\n  sayHello: (call,\
  \ callback) => callback(null, { message: 'Hello ' + call.request.name })\n});\nserver.bindAsync('0.0.0.0:50051',\
  \ grpc.ServerCredentials.createInsecure(), () => server.start());\n```\n\n## Client skeleton\n\n```js\n\
  const client = new greet.Greeter('localhost:50051', grpc.credentials.createInsecure(), {\n  'grpc.keepalive_time_ms':\
  \ 10000\n});\nclient.sayHello({ name: 'Node' }, (err, res) => console.log(res.message));\n```\n\n##\
  \ Testing\n\n```bash\nnode server.js &\ngrpcurl -plaintext -d '{\"name\":\"Node\"}' localhost:50051\
  \ helloworld.Greeter/SayHello\nnode client.js\n```\n\n## Best practices\n\n- Use dynamic loading for\
  \ dev velocity, static stubs for strict typing in TS.\n- Always `server.tryShutdown()` on SIGTERM for\
  \ a clean drain.\n- Set `grpc.keepalive_time_ms` on channels behind load balancers.\n- Proto-loader\
  \ `keepCase:false` (default) camelCases field names; keep it consistent client-side.\n\n## Example exchange\n\
  \n```\nUser: My Node client times out after the server restarts.\nAgent: Create a new channel on reconnect\
  \ and set a deadline per call:\n       client.sayHello(req, { deadline: Date.now() + 5000 }, cb)\n```"
examples:
- input: Start the Node gRPC server and verify with grpcurl
  output: node server.js & grpcurl -plaintext -d '{"name":"Node"}' localhost:50051 helloworld.Greeter/SayHello
- input: Generate static JS stubs from greet.proto
  output: ./node_modules/.bin/grpc_tools_node_protoc -I ./proto --js_out=import_style=commonjs:./generated
    --grpc_out=./generated ./proto/greet.proto
