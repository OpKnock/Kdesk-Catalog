name: hotp
display_name: HOTP
category: api
subcategory: general
description: 'HMAC-based One-Time Passwords (RFC 4226): generating counters-based codes with oathtool,
  computing HMAC-SHA1 in OpenSSL/Python, and verifying HOTP values.'
version: 2.0.0
tags:
- api
author: Mehul Wagde
license: MIT
prerequisites:
- echo
- oathtool
- python3
capabilities:
- name: hotp-generation
  description: Generate and verify counter-based one-time passwords with oathtool and OpenSSL.
  commands:
  - oathtool --hotp --counter 0 12345678901234567890
  - oathtool --hotp --counter 5 -b 12345678901234567890
  - echo -n "secret" | openssl dgst -sha1 -mac HMAC -macopt key:deadbeef
  - python3 -c "import pyotp; print(pyotp.HOTP('base32secret3232').at(0))"
  - oathtool --hotp --check 755224 12345678901234567890 --counter 0
  examples:
  - oathtool --hotp --counter 1 12345678901234567890
  - python3 -c "import pyotp; print(pyotp.HOTP('JBSWY3DPEHPK3PXP').at(42))"
  - oathtool --hotp --base32 --counter 3 JBSWY3DPEHPK3PXP
  parameters:
  - name: secret
    type: string
    description: Shared secret (plain or base32-encoded with -b).
  - name: counter
    type: integer
    description: Event counter value for the code.
  - name: digits
    type: integer
    description: Code length, default 6.
knowledge:
- title: RFC 4226 HOTP
  type: documentation
  source: https://datatracker.ietf.org/doc/html/rfc4226
  description: 'HOTP: An HMAC-Based One-Time Password Algorithm specification.'
- title: oathtool manual
  type: documentation
  source: https://www.nongnu.org/oath-toolkit/oathtool.1.html
  description: 'oathtool man page: --hotp, --counter, --check flags.'
instructions: "# HOTP\n\nCounter-based one-time passwords (RFC 4226).\n\n## What this skill does\n\n-\
49:   \ Generates HOTP codes for a given counter with oathtool.\n- Computes the underlying HMAC-SHA1 with\
50:   \ openssl for verification.\n- Generates codes in Python with pyotp.\n- Validates codes with --check\
51:   \ to test token drift.\n\n## When to use\n\n- Implementing or debugging event-based 2FA tokens.\n- Verifying\
52:   \ a token generator matches the server state.\n- Teaching or auditing HMAC-based token logic.\n\n##\
53:   \ Real commands\n\n```bash\n# RFC 4226 test vector (counter 0, secret 12345678901234567890 -> 755224)\n\
54:   oathtool --hotp --counter 0 12345678901234567890\n\n# Base32 secret\noathtool --hotp --counter 5 -b\
55:   \ JBSWY3DPEHPK3PXP\n\n# Verify a code against a counter\noathtool --hotp --check 755224 12345678901234567890\
56:   \ --counter 0\necho $?   # 0 on match\n\n# Under the hood: HMAC-SHA1 of the 8-byte counter\npython3\
57:   \ -c \"\nimport hmac, hashlib, struct\nsecret = b'12345678901234567890'\nmsg = struct.pack('>Q', 0)\n\
58:   digest = hmac.new(secret, msg, hashlib.sha1).hexdigest()\nprint(digest)\n\"\n\n# pyotp equivalent\n\
59:   python3 -c \"import pyotp; print(pyotp.HOTP('12345678901234567890').at(0))\"\n```\n\n## Dynamic truncation\n\
60:   \nThe 6-digit code is the last 31 bits of the HMAC digest, zero-padded to `digits`.\n\n## Testing\n\n\
61:   ```bash\nCODE=$(oathtool --hotp --counter 0 12345678901234567890)\noathtool --hotp --check \"$CODE\"\
62:   \ 12345678901234567890 --counter 0 && echo \"valid\"\n```\n\n## Best practices\n\n- The counter MUST\
63:   \ advance on both sides; desync is the most common failure.\n- Store secrets base32-encoded for interop\
64:   \ with Google Authenticator-style apps.\n- Use a look-ahead window (e.g., +10) when verifying to tolerate\
65:   \ lost codes.\n- Never log counters or secrets.\n\n## Example exchange\n\n```\nUser: The server rejected\
66:   \ the HOTP code from the app.\nAgent: Compare counters:\n       oathtool --hotp --counter 12 12345678901234567890\
67:   \  # server state\n       # resync server to the client's counter or widen the window\n```"
examples:
- input: Generate the HOTP code at counter 0
  output: 'oathtool --hotp --counter 0 12345678901234567890  # 755224 per RFC 4226'
- input: Verify a code the user typed
  output: oathtool --hotp --check 755224 JBSWY3DPEHPK3PXP --counter 5 && echo valid
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: hotp.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-hotp
  generic:
    system_prompt: 'This is your domain: HOTP. You do it through hotp-generation: Generate and verify
      counter-based one-time passwords with oathtool and OpenSSL. The commands are real, e.g. `oathtool
      --hotp --counter 0 12345678901234567890`. You run and verify the real CLI commands before you claim
      anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
