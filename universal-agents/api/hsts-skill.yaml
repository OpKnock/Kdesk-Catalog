name: hsts
display_name: Hsts
category: api
subcategory: general
description: 'HTTP Strict Transport Security: verifying HSTS headers with curl, configuring Strict-Transport-Security
  in Nginx/Caddy, and checking preload status.'
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
prerequisites:
- openssl
capabilities:
- name: hsts-header-ops
  description: Inspect and configure HSTS headers on servers and check preload eligibility.
  commands:
  - curl -sI https://example.com | grep -i strict-transport-security
  - curl -s -o /dev/null -w '%{http_code}\n' https://example.com
  - openssl s_client -connect example.com:443 -servername example.com </dev/null 2>/dev/null | grep -i
    strict
  - curl -s "https://hstspreload.org/api/v2/status?domain=example.com" | jq .
  - curl -sI https://example.com | grep -iE "location|strict"
  examples:
  - curl -sI https://example.com | grep -i "strict-transport-security"
  - curl -s "https://hstspreload.org/api/v2/status?domain=example.com" | jq .status
  - curl -sI http://example.com | grep -i strict-transport-security
  parameters:
  - name: domain
    type: string
    description: Domain to check.
  - name: max_age
    type: integer
    description: HSTS max-age in seconds.
  - name: include_subdomains
    type: boolean
    description: Apply the policy to subdomains.
knowledge:
- title: Strict-Transport-Security MDN
  type: documentation
  source: https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Strict-Transport-Security
  description: 'HSTS header reference: syntax, directives, and pitfalls.'
- title: HSTS Preload
  type: documentation
  source: https://hstspreload.org/
  description: Preload list submission and status API.
instructions: "# HSTS\n\nEnforce HTTPS with HTTP Strict Transport Security headers.\n\n## What this skill\
  \ does\n\n- Verifies the Strict-Transport-Security header on live sites.\n- Configures HSTS in Nginx\
  \ and other servers.\n- Checks preload eligibility via the hstspreload API.\n- Catches mixed-content/redirect\
  \ issues around HSTS.\n\n## When to use\n\n- Hardening a site after enabling HTTPS.\n- Auditing third-party\
  \ domains for HSTS compliance.\n- Preparing a domain for the HSTS preload list.\n\n## Real commands\n\
  \n```bash\n# Check the header\ncurl -sI https://example.com | grep -i strict-transport-security\n\n\
  # Check plain HTTP redirect (should 301 to https)\ncurl -sI http://example.com | grep -i location\n\n\
  # Preload status\ncurl -s \"https://hstspreload.org/api/v2/status?domain=example.com\" | jq .\n\n# Header\
  \ over TLS\nopenssl s_client -connect example.com:443 -servername example.com </dev/null 2>/dev/null\
  \ | grep -i strict\n```\n\n## Nginx config\n\n```nginx\nserver {\n    listen 443 ssl;\n    add_header\
  \ Strict-Transport-Security \"max-age=63072000; includeSubDomains; preload\" always;\n}\n```\n\n## Preload\
  \ requirements\n\n- Valid certificate on all subdomains.\n- HSTS with max-age >= 31536000 and includeSubDomains.\n\
  - All HTTP must redirect to HTTPS.\n\n## Testing\n\n```bash\n# After deploying, verify header and preload\
  \ status\ncurl -sI https://example.com | grep -i strict-transport-security\ncurl -s \"https://hstspreload.org/api/v2/status?domain=example.com\"\
  \ | jq .status\n```\n\n## Best practices\n\n- Start with `max-age=86400`, then raise to 63072000 once\
  \ stable.\n- Add includeSubDomains only when every subdomain supports HTTPS.\n- Test with curl -sI before\
  \ and after every TLS change.\n- Never add `preload` until both requirements are fully met.\n\n## Example\
  \ exchange\n\n```\nUser: Does example.com send HSTS?\nAgent: curl -sI https://example.com | grep -i\
  \ strict-transport-security\n       # strict-transport-security: max-age=63072000; includeSubDomains\n\
  ```"
examples:
- input: Check HSTS on example.com
  output: curl -sI https://example.com | grep -i strict-transport-security
- input: Check preload eligibility
  output: curl -s "https://hstspreload.org/api/v2/status?domain=example.com" | jq .
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: hsts.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-hsts
  generic:
    system_prompt: 'You work Hsts hands-on. You do it through hsts-header-ops: Inspect and configure HSTS
      headers on servers and check preload eligibility. The commands are real, e.g. `curl -sI https://example.com
      | grep -i strict-transport-security`. You answer with exact commands, not abstractions, and flag
      anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
