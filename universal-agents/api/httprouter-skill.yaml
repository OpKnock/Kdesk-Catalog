  description: Standard library http package for Handler interface.
instructions: "# httprouter\n\nHigh-performance radix-tree routing for Go.\n\n## What this skill does\n\
  \n- Registers typed routes with :param path segments.\n- Dispatches by HTTP method automatically.\n\
  - Wraps handlers with middleware the standard library way.\n- Serves 404/405 with method-specific handling.\n\
  \n## When to use\n\n- A Go service needs fast routing without framework weight.\n- You want explicit\
  \ path parameters instead of string parsing.\n- Serving REST endpoints with clean method separation.\n\
  \n## Real commands\n\n```bash\n# Install\ngo get github.com/julienschmidt/httprouter@latest\n\n# Build,\
  \ vet, test\ngo build -o app .\ngo vet ./...\ngo test ./...\n\n# Run and hit a param route\ngo run .\
  \ &\ncurl -X GET http://localhost:8080/users/42\n```\n\n## Router setup\n\n```go\npackage main\n\nimport\
  \ (\n    \"fmt\"\n    \"net/http\"\n    \"github.com/julienschmidt/httprouter\"\n)\n\nfunc Hello(w http.ResponseWriter,\
  \ r *http.Request, ps httprouter.Params) {\n    fmt.Fprintf(w, \"hello, %s!\", ps.ByName(\"name\"))\n\
  }\n\nfunc main() {\n    router := httprouter.New()\n    router.GET(\"/hello/:name\", Hello)\n    router.POST(\"\
  /users\", CreateUser)\n    router.PUT(\"/users/:id\", UpdateUser)\n    router.DELETE(\"/users/:id\"\
  , DeleteUser)\n    http.ListenAndServe(\":8080\", router)\n}\n```\n\n## Middleware wrapper\n\n```go\n\
  func logging(next httprouter.Handle) httprouter.Handle {\n    return func(w http.ResponseWriter, r *http.Request,\
  \ ps httprouter.Params) {\n        log.Printf(\"%s %s\", r.Method, r.URL.Path)\n        next(w, r, ps)\n\
  \    }\n}\n\nrouter.GET(\"/users/:id\", logging(GetUser))\n```\n\n## Testing\n\n```bash\ncurl -s http://localhost:8080/hello/world\n\
  go test -bench=. -benchmem ./...\n```\n\n## Best practices\n\n- Path params are matched in a single\
  \ segment; use `:name` not `*` for required parts.\n- Wrap handlers with standard `func(http.Handler,\
  \ ...) http.Handler` style for reuse.\n- Set `router.RedirectTrailingSlash = true` consciously; it can\
  \ surprise clients.\n- Keep handlers httprouter.Handle-typed to use Params without globals.\n\n## Example\
  \ exchange\n\n```\nUser: Add a GET /users/:id route.\nAgent: router.GET(\"/users/:id\", func(w, r, ps)\
  \ { id := ps.ByName(\"id\") ... })\n```"
examples:
- input: Register GET /hello/:name and test it
  output: router.GET("/hello/:name", Hello) && curl -s http://localhost:8080/hello/world
- input: Run benchmarks on the router
  output: go test -bench=. -benchmem ./...
