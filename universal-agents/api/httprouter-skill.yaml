name: httprouter
display_name: Httprouter
category: api
subcategory: general
description: 'Go httprouter: radix-tree routing with typed path params, method handlers, middleware wrapping,
  and benchmark-grade request dispatch.'
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
capabilities:
- name: httprouter-routing
  description: Build typed HTTP routes with httprouter and wrap handlers with middleware.
  commands:
  - go get github.com/julienschmidt/httprouter@latest
  - go build -o app .
  - go test ./...
  - go vet ./...
  - curl -X GET http://localhost:8080/users/42
  examples:
  - go run . & curl -s http://localhost:8080/hello/world
  - go test -bench=. -benchmem ./...
  - curl -s -o /dev/null -w '%{http_code}\n' http://localhost:8080/users/42
  parameters:
  - name: path
    type: string
    description: Route pattern, e.g. /users/:id.
  - name: method
    type: string
    description: HTTP method to register.
  - name: port
    type: integer
    description: Listen port, default 8080.
