name: hypermedia
display_name: Hypermedia
category: api
subcategory: general
description: 'Hypermedia APIs (HAL, JSON:API, HATEOAS): discovering links with curl, following affordances,
  and designing self-describing responses.'
version: 2.0.0
tags:
- api
author: Mehul Wagde
license: MIT
capabilities:
- name: hypermedia-consumption
  description: Explore and follow hypermedia-driven APIs using HAL and JSON:API conventions.
  commands:
  - 'curl -H "Accept: application/hal+json" http://localhost:8080/orders/1'
  - 'curl -H "Accept: application/vnd.api+json" http://localhost:8080/api/articles'
  - 'curl -s -H "Accept: application/hal+json" http://localhost:8080/orders/1 | jq ''._links'''
  - 'curl -s -H "Accept: application/vnd.api+json" http://localhost:8080/api/articles | jq ''.data[0].relationships'''
  - curl -i -X OPTIONS http://localhost:8080/orders/1
  examples:
  - 'curl -s -H "Accept: application/hal+json" http://localhost:8080/orders/1 | jq ''._links.self.href'''
  - 'curl -s -H "Accept: application/vnd.api+json" http://localhost:8080/api/articles | jq ''.links.next'''
  - curl -s http://localhost:8080/api | jq .
  parameters:
  - name: accept
    type: string
    description: Media type, e.g. application/hal+json or application/vnd.api+json.
  - name: resource_url
    type: string
    description: URL of the resource to fetch.
  - name: relation
    type: string
    description: Link relation to extract, e.g. self, next, related.
knowledge:
- title: HAL Specification
  type: documentation
  source: https://stateless.co/hal_specification.html
  description: 'Hypertext Application Language spec: _links, _embedded.'
- title: JSON:API Spec
  type: documentation
  source: https://jsonapi.org/format/
  description: 'JSON:API 1.1 specification: links, relationships, and compound documents.'
instructions: "# Hypermedia\n\nDesign and consume hypermedia-driven (HATEOAS) APIs.\n\n## What this skill\
45:   \ does\n\n- Fetches HAL and JSON:API resources with the right Accept headers.\n- Extracts and follows\
46:   \ link relations with jq.\n- Checks OPTIONS for allowed affordances.\n- Guides response design with\
47:   \ self-describing links.\n\n## When to use\n\n- Building APIs where clients should discover actions\
48:   \ from the response.\n- Debugging a hypermedia client that follows links.\n- Auditing whether a response\
49:   \ is truly self-describing.\n\n## Real commands\n\n```bash\n# Fetch HAL resource\ncurl -H \"Accept:\
50:   \ application/hal+json\" http://localhost:8080/orders/1\n\n# Follow the self link\ncurl -s -H \"Accept:\
51:   \ application/hal+json\" http://localhost:8080/orders/1 | jq '._links.self.href'\n\n# JSON:API with\
52:   \ pagination links\ncurl -s -H \"Accept: application/vnd.api+json\" http://localhost:8080/api/articles\
53:   \ | jq '.links'\n\n# List allowed methods\ncurl -i -X OPTIONS http://localhost:8080/orders/1 | grep\
54:   \ -i allow\n```\n\n## HAL response shape\n\n```json\n{\n  \"id\": 1,\n  \"total\": 99.5,\n  \"_links\"\
55:   : {\n    \"self\": { \"href\": \"/orders/1\" },\n    \"customer\": { \"href\": \"/customers/7\" },\n\
56:   \    \"cancel\": { \"href\": \"/orders/1/cancel\" }\n  }\n}\n```\n\n## JSON:API response shape\n\n```json\n\
57:   {\n  \"data\": { \"type\": \"orders\", \"id\": \"1\", \"attributes\": { \"total\": 99.5 } },\n  \"links\"\
58:   : { \"self\": \"/orders/1\", \"next\": \"/orders?page=2\" }\n}\n```\n\n## Testing\n\n```bash\n# A good\
59:   \ hypermedia API always exposes a discoverable root\ncurl -s http://localhost:8080/api | jq 'keys'\n\
60:   ```\n\n## Best practices\n\n- Link relations are the contract: use RFC 8288 registered relations where\
61:   \ possible.\n- Version the media type, not the URL: application/vnd.api+json.\n- Never hardcode client\
62:   \ URLs; always resolve from links.\n- Distinguish safe (GET) from unsafe relations in docs.\n\n## Example\
63:   \ exchange\n\n```\nUser: How does a client discover how to cancel an order?\nAgent: Expose the affordance\
64:   \ in _links and let the client follow it:\n       curl -s -H \"Accept: application/hal+json\" http://localhost:8080/orders/1\
65:   \ | jq '._links.cancel.href'\n```"
examples:
- input: Discover links on an order resource
  output: 'curl -s -H "Accept: application/hal+json" http://localhost:8080/orders/1 | jq ''._links'''
- input: Fetch the next page of articles
  output: 'curl -s -H "Accept: application/vnd.api+json" http://localhost:8080/api/articles | jq -r ''.links.next'''
