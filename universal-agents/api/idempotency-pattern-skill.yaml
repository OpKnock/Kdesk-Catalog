name: idempotency-pattern
display_name: Idempotency Pattern
category: api
subcategory: general
description: 'Idempotency patterns for APIs: Idempotency-Key headers, atomic dedup with Redis SET NX EX,
  database unique constraints, and replay-safe retries.'
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
prerequisites:
- redis-cli
capabilities:
- name: dedup-patterns
  description: Implement request deduplication with headers, Redis atomic ops, and DB constraints.
  commands:
  - 'curl -X POST -H "Idempotency-Key: 7d1a-4f2b" http://localhost:8080/payments'
  - redis-cli SET idem:pay:7d1a created NX EX 3600
  - redis-cli GET idem:pay:7d1a
  - redis-cli SETNX idem:pay:7d1a in-progress
  - 'curl -X POST -H "Idempotency-Key: 7d1a-4f2b" http://localhost:8080/payments --retry 2'
  examples:
  - redis-cli SET idem:pay:7d1a done EX 3600 NX && echo claimed
  - 'curl -s -X POST -H "Idempotency-Key: k-1" http://localhost:8080/payments -o r1.json && curl -s -X
    POST -H "Idempotency-Key: k-1" http://localhost:8080/payments -o r2.json && diff r1.json r2.json'
  - mysql -e "ALTER TABLE payments ADD UNIQUE KEY uk_idem (idempotency_key);"
  parameters:
  - name: key
    type: string
    description: Client-supplied idempotency key.
  - name: ttl
    type: integer
    description: Dedup window in seconds.
  - name: header_name
    type: string
    description: Header carrying the key, default Idempotency-Key.
knowledge:
- title: IETF Idempotency-Key Draft
  type: documentation
  source: https://datatracker.ietf.org/doc/draft-ietf-httpapi-idempotency-key-header/
  description: HTTPAPI working group draft on the Idempotency-Key header.
- title: Redis SET command
  type: documentation
  source: https://redis.io/commands/set/
  description: SET with NX and EX options for atomic claim semantics.
instructions: "# Idempotency Patterns\n\nMake retry-safe APIs with proven dedup patterns.\n\n## What this\
  \ skill does\n\n- Explains Idempotency-Key headers for POST/PUT retries.\n- Implements atomic claims\
  \ with Redis SET NX EX.\n- Backs dedup with database unique constraints.\n- Verifies replay responses\
  \ are byte-identical.\n\n## When to use\n\n- Payment/order endpoints where retries can double-charge.\n\
  - Designing public APIs for flaky mobile networks.\n- Auditing whether a service is safe to retry.\n\
  \n## Real commands\n\n```bash\n# Client sends a key with each request\ncurl -X POST -H \"Idempotency-Key:\
  \ 7d1a-4f2b\" http://localhost:8080/payments\n\n# Server claims the key atomically (NX = only if absent)\n\
  redis-cli SET idem:pay:7d1a in-progress NX EX 3600\n\n# On retry, the same key returns the stored response\n\
  redis-cli GET idem:pay:7d1a\n\n# DB-level backstop\nmysql -e \"ALTER TABLE payments ADD UNIQUE KEY uk_idem\
  \ (idempotency_key);\"\n\n# Replay verification\ncurl -s -X POST -H \"Idempotency-Key: k-1\" http://localhost:8080/payments\
  \ -o r1.json\ncurl -s -X POST -H \"Idempotency-Key: k-1\" http://localhost:8080/payments -o r2.json\n\
  diff r1.json r2.json  # must be identical\n```\n\n## Decision table\n\n- Idempotency-Key present and\
  \ unknown -> process, store key + response.\n- Key present and cached -> return cached response verbatim.\n\
  - Key absent on a mutating call -> process but warn; cannot dedup.\n- Key reused with different payload\
  \ -> 422 Conflict.\n\n## Testing\n\n```bash\n# Crash mid-processing leaves an in-progress entry: TTL\
  \ expires it\nredis-cli SET idem:pay:x in-progress NX EX 5\nredis-cli TTL idem:pay:x  # should count\
  \ down\n```\n\n## Best practices\n\n- Keys must be unique per operation, generated by the client.\n\
  - Expire keys after a bounded window (minutes to days).\n- Return the exact cached body, including status\
  \ code, on replays.\n- Reject key reuse with a different payload as a conflict.\n\n## Example exchange\n\
  \n```\nUser: A retry double-charged the customer.\nAgent: Add a server-side Idempotency-Key claim:\n\
  \       redis-cli SET idem:pay:<key> in-progress NX EX 3600\n       # and reject replays that carry\
  \ a different body\n```"
examples:
- input: Dedup payment requests with the same key
  output: 'curl -X POST -H "Idempotency-Key: 7d1a-4f2b" http://localhost:8080/payments  # repeat => same
    response'
- input: Atomically claim a key in Redis
  output: redis-cli SET idem:pay:7d1a in-progress NX EX 3600
