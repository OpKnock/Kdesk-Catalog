name: idempotency
display_name: Idempotency
category: api
subcategory: general
description: 'Idempotency in practice: Stripe-style Idempotency-Key usage, retry loops with curl, storing
  responses in Redis, and verifying identical replays.'
version: 2.0.0
tags:
- api
author: Mehul Wagde
license: MIT
prerequisites:
- redis-cli
capabilities:
- name: idempotency-http
  description: Send idempotent HTTP requests, cache responses, and verify replay behavior.
  commands:
  - 'curl -X POST https://api.stripe.com/v1/charges -u sk_test_x: -H "Idempotency-Key: abc123" -d amount=100
    -d currency=usd'
  - 'curl -s -X POST -H "Idempotency-Key: k1" http://localhost:8080/v1/payments -d amount=100 -o r1.json'
  - redis-cli SET idem:k1 in-progress NX EX 60
  - redis-cli SETEX idem:k1 60 done
  - 'curl -s -X POST -H "Idempotency-Key: k1" http://localhost:8080/v1/payments -d amount=100 -o r2.json
    && diff r1.json r2.json'
  examples:
  - 'curl --retry 3 --retry-all-errors -X POST -H "Idempotency-Key: 9x" http://localhost:8080/v1/payments
    -d amount=10'
  - redis-cli GET idem:k1
  - 'curl -s -o /dev/null -w ''%{http_code}'' -X POST -H "Idempotency-Key: k1" http://localhost:8080/v1/payments
    -d amount=200'
  parameters:
  - name: key
    type: string
    description: Idempotency key value.
  - name: endpoint
    type: string
    description: Mutating endpoint URL.
  - name: cache_ttl
    type: integer
    description: Response cache TTL in seconds.
knowledge:
- title: Stripe Idempotent Requests
  type: documentation
  source: https://docs.stripe.com/api/idempotent_requests
  description: Stripe's production pattern for idempotent requests.
- title: Redis SETEX
  type: documentation
  source: https://redis.io/commands/setex/
  description: SETEX command for keyed caching with expiry.
instructions: "# Idempotency\n\nSend and handle idempotent requests the way payment APIs do.\n\n## What\
51:   \ this skill does\n\n- Uses Idempotency-Key headers on mutating requests.\n- Caches first responses\
52:   \ and replays them verbatim.\n- Runs retry loops safely with curl --retry.\n- Verifies replays return\
53:   \ identical bodies and status codes.\n\n## When to use\n\n- Integrating with APIs that document Idempotency-Key\
54:   \ (Stripe, Shopify...).\n- Adding retry logic without duplicate side effects.\n- Testing your own API's\
55:   \ replay behavior.\n\n## Real commands\n\n```bash\n# Stripe-style request\ncurl -X POST https://api.stripe.com/v1/charges\
56:   \ -u sk_test_x: \\\n  -H \"Idempotency-Key: abc123\" -d amount=100 -d currency=usd\n\n# Two calls, one\
57:   \ key: responses must be identical\ncurl -s -X POST -H \"Idempotency-Key: k1\" http://localhost:8080/v1/payments\
58:   \ -d amount=100 -o r1.json\ncurl -s -X POST -H \"Idempotency-Key: k1\" http://localhost:8080/v1/payments\
59:   \ -d amount=100 -o r2.json\ndiff r1.json r2.json\n\n# Server-side cache key\nredis-cli SETEX idem:k1\
60:   \ 60 done\n\n# Retry with the same key across attempts\ncurl --retry 3 --retry-all-errors -X POST -H\
61:   \ \"Idempotency-Key: 9x\" \\\n  http://localhost:8080/v1/payments -d amount=10\n```\n\n## Client retry\
62:   \ loop\n\n```bash\nKEY=\"$(uuidgen)\"\nfor i in 1 2 3; do\n  curl -s -X POST -H \"Idempotency-Key: $KEY\"\
63:   \ http://localhost:8080/v1/payments -d amount=10 && break\n  sleep 2\ndone\n```\n\n## Testing\n\n```bash\n\
64:   # Same key, different payload must be rejected\ncurl -s -o /dev/null -w '%{http_code}\\n' -X POST -H\
65:   \ \"Idempotency-Key: k1\" http://localhost:8080/v1/payments -d amount=200\n# expect 409/422 conflict\n\
66:   ```\n\n## Best practices\n\n- Generate the key client-side (UUID) before the first attempt.\n- Keep\
67:   \ the key stable across all retries of one logical operation.\n- Store the canonical response (status\
68:   \ + body) server-side under the key.\n- Expire entries to bound storage; clients accept a new key after\
69:   \ expiry.\n\n## Example exchange\n\n```\nUser: Retry the payment request safely after a timeout.\nAgent:\
70:   \ Reuse one key for all attempts:\n       curl --retry 3 --retry-all-errors -X POST -H \"Idempotency-Key:\
71:   \ 9x\" http://localhost:8080/v1/payments -d amount=10\n```"
examples:
- input: Verify a replayed request returns the same body
  output: 'curl -s -X POST -H "Idempotency-Key: k1" http://localhost:8080/v1/payments -o r1.json; # repeat;
    then diff r1.json r2.json'
- input: Retry a payment with one idempotency key
  output: 'curl --retry 3 --retry-all-errors -X POST -H "Idempotency-Key: 9x" http://localhost:8080/v1/payments
    -d amount=10'
