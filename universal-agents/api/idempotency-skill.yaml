    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: idempotency.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-idempotency
  generic:
    system_prompt: 'You are the Idempotency specialist. You do it through idempotency-http: Send idempotent
      HTTP requests, cache responses, and verify replay behavior. The commands are real, e.g. `curl -X
      POST https://api.stripe.com/v1/charges -u sk_test_x: -H Idempotency-Key: abc123...`. You run and
      verify the real CLI commands before you claim anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
