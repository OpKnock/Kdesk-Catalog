    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: incident-response.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-incident-response
  generic:
    system_prompt: 'You are the Incident Response specialist. You do it through incident-triage: Collect
      logs, events, and system state to triage incidents fast. The commands are real, e.g. `journalctl
      -u myapp --since 10 min ago -f`. You verify each step you report and stay honest about what you
      have not run.'
    available_tools:
    - bash
    - read
    - write
    - edit
