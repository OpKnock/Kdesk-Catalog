name: incident-response
display_name: Incident Response
category: api
subcategory: general
description: 'Incident response from the terminal: triaging with journalctl and kubectl, capturing evidence
  with timestamps, and coordinating the timeline.'
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
prerequisites:
- journalctl
- kubectl
- top
capabilities:
- name: incident-triage
  description: Collect logs, events, and system state to triage incidents fast.
  commands:
  - journalctl -u myapp --since '10 min ago' -f
  - kubectl get events --sort-by=.lastTimestamp
  - kubectl logs deployment/myapp --tail=200 --timestamps
  - curl -fsS --max-time 5 http://localhost:8080/health
  - top -b -n 1 -o %CPU | head -20
  examples:
  - journalctl -u myapp -p err --since yesterday
  - kubectl describe pod myapp-abc123
  - free -m && df -h /
  parameters:
  - name: service
    type: string
    description: Service or pod name under investigation.
  - name: since
    type: string
    description: Time window, e.g. '10 min ago' or '1h'.
  - name: tail
    type: integer
    description: Lines of log tail.
knowledge:
- title: PagerDuty Incident Response Docs
  type: documentation
  source: https://response.pagerduty.com/
  description: 'Incident response best practices: roles, timeline, communication.'
- title: kubectl Cheat Sheet
  type: documentation
  source: https://kubernetes.io/docs/reference/kubectl/cheatsheet/
  description: kubectl commands for inspecting workloads and events.
instructions: "# Incident Response\n\nRespond to incidents from the terminal with disciplined triage.\n\
  \n## What this skill does\n\n- Collects logs, events, and system metrics for the affected service.\n\
  - Captures evidence with timestamps for the incident timeline.\n- Checks health endpoints and resource\
  \ state.\n- Produces a reproducible runbook of commands.\n\n## When to use\n\n- An alert pages: service\
  \ down, latency spike, or errors rising.\n- Debugging post-incident: what changed right before the event.\n\
  - Handoffs: passing a concise evidence trail to the on-call next shift.\n\n## Real commands\n\n```bash\n\
  # Application logs with timestamps\njournalctl -u myapp --since '10 min ago' -f\nkubectl logs deployment/myapp\
  \ --tail=200 --timestamps\n\n# Cluster events\nkubectl get events --sort-by=.lastTimestamp | tail -30\n\
  \n# Pod state\nkubectl describe pod myapp-abc123 | grep -A5 -i \"events\\|status\"\n\n# Health and resources\n\
  curl -fsS --max-time 5 http://localhost:8080/health\ntop -b -n 1 -o %CPU | head -20\nfree -m && df -h\
  \ /\n```\n\n## Timeline discipline\n\n```bash\n# Stamp every evidence capture\necho \"=== $(date -u\
  \ +%FT%TZ) start of incident ===\" > incident.log\njournalctl -u myapp -p err --since '30 min ago' >>\
  \ incident.log\ncurl -fsS http://localhost:8080/health >> incident.log 2>&1\n```\n\n## Testing\n\n```bash\n\
  # Reproduce with a fixed window to compare before/after changes\njournalctl -u myapp --since \"$(date\
  \ -d '1 hour ago' +%FT%T)\" --until now | grep -iE \"error|panic|timeout\" | tail -50\n```\n\n## Best\
  \ practices\n\n- First command is always: confirm scope (which service, which hosts, since when).\n\
  - Capture evidence BEFORE changing anything; you cannot un-restart.\n- Never restart a pod before grabbing\
  \ its logs and events.\n- Keep a running timeline with UTC timestamps for the postmortem.\n- Escalate\
  \ early; communicate in the channel, not just the terminal.\n\n## Example exchange\n\n```\nUser: /api\
  \ started 500ing five minutes ago.\nAgent: kubectl logs deployment/myapp --since=10m --timestamps |\
  \ tail -100\n       kubectl get events --sort-by=.lastTimestamp\n       curl -fsS http://localhost:8080/health\n\
  ```"
examples:
- input: Triage a sudden 500 spike on myapp
  output: journalctl -u myapp --since '10 min ago' | grep -iE 'error|panic' | tail -50 && curl -fsS http://localhost:8080/health
- input: Check what happened in the cluster around the outage
  output: kubectl get events --sort-by=.lastTimestamp | tail -30
