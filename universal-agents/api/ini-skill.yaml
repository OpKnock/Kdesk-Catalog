name: ini
display_name: Ini
category: api
subcategory: general
description: 'INI configuration file handling: parsing and editing with Python configparser, shell one-liners
  for section lookups, and validation of duplicate keys.'
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
prerequisites:
- awk
- grep
- python3
capabilities:
- name: ini-parsing
  description: Read, validate, and modify INI files with Python and shell tools.
  commands:
  - python3 -c "import configparser; c=configparser.ConfigParser(); c.read('app.ini'); print(c['database']['host'])"
  - python3 -m configparser app.ini
  - awk -F= '/^\[database\]/{s=1;next} /^\[/{s=0} s && /host/{print $2}' app.ini
  - grep -A5 '^\[database\]' app.ini
  - 'python3 - <<''EOF''\nimport configparser\nc = configparser.ConfigParser()\nc.read(''app.ini'')\nc[''database''][''port'']
    = ''5433''\nwith open(''app.ini'', ''w'') as f: c.write(f)\nEOF'
  examples:
  - awk -F= '/^host=/{print $2}' config.ini
  - python3 -c "import configparser; c=configparser.ConfigParser(); c.read('app.ini'); print(c.sections())"
  - grep -c '^\[' app.ini
  parameters:
  - name: file
    type: string
    description: Path to the INI file.
  - name: section
    type: string
    description: Section name, e.g. database.
  - name: key
    type: string
    description: Option key within the section.
knowledge:
- title: Python configparser docs
  type: documentation
  source: https://docs.python.org/3/library/configparser.html
  description: 'configparser module: reading, writing, and validating INI files.'
- title: INI format overview
  type: documentation
  source: https://en.wikipedia.org/wiki/INI_file
  description: INI file format conventions and variants.
instructions: "# INI Files\n\nRead and modify INI configuration files safely.\n\n## What this skill does\n\
  \n- Parses sections and options with Python configparser.\n- Extracts values with shell one-liners for\
  \ quick checks.\n- Writes back changes preserving structure.\n- Detects duplicate keys and malformed\
  \ lines.\n\n## When to use\n\n- Configuring legacy tools and services that use INI files.\n- Auditing\
  \ which settings an app will load.\n- Batch-editing configs across many hosts.\n\n## Real commands\n\
  \n```bash\n# Read one value\npython3 -c \"import configparser; c=configparser.ConfigParser(); c.read('app.ini');\
  \ print(c['database']['host'])\"\n\n# Validate the file parses\npython3 -m configparser app.ini\n\n\
  # List sections\npython3 -c \"import configparser; c=configparser.ConfigParser(); c.read('app.ini');\
  \ print(c.sections())\"\n\n# Shell one-liner for a section block\ngrep -A5 '^\\[database\\]' app.ini\n\
  \n# Update a value in place\npython3 - <<'EOF'\nimport configparser\nc = configparser.ConfigParser()\n\
  c.read('app.ini')\nc['database']['port'] = '5433'\nwith open('app.ini', 'w') as f:\n    c.write(f)\n\
  EOF\n```\n\n## Example file\n\n```ini\n[server]\nhost = 0.0.0.0\nport = 8080\n\n[database]\nhost = db.internal\n\
  port = 5432\nuser = app\n```\n\n## Testing\n\n```bash\npython3 -m configparser app.ini && echo \"valid\"\
  \n```\n\n## Best practices\n\n- Back up the file before in-place writes (`cp app.ini app.ini.bak`).\n\
  - Use interpolation-aware escaping when values contain % characters.\n- Prefer configparser over regex\
  \ edits to preserve comments and order.\n- Validate with `python3 -m configparser` in CI before deploy.\n\
  \n## Example exchange\n\n```\nUser: What port is the app configured to use?\nAgent: python3 -c \"import\
  \ configparser; c=configparser.ConfigParser(); c.read('app.ini'); print(c['server']['port'])\"\n```"
examples:
- input: Read the database host from app.ini
  output: python3 -c "import configparser; c=configparser.ConfigParser(); c.read('app.ini'); print(c['database']['host'])"
- input: Validate app.ini parses
  output: python3 -m configparser app.ini
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ini.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-ini
  generic:
    system_prompt: 'This is your domain: Ini. You do it through ini-parsing: Read, validate, and modify
      INI files with Python and shell tools. The commands are real, e.g. `python3 -c import configparser;
      c=configparser.ConfigParser(); c.read(app.ini);...`. You answer with exact commands, not abstractions,
      and flag anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
