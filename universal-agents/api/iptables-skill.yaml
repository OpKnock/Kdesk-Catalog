name: iptables
display_name: Iptables
category: api
subcategory: general
description: 'Netfilter iptables operations: listing rules, adding/removing accept and drop rules, port
  redirects with NAT, and persisting rule sets.'
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
prerequisites:
- iptables
- iptables-save
capabilities:
- name: iptables-rules
  description: Inspect and modify iptables rulesets including NAT and persistence.
  commands:
  - iptables -L -n -v
  - iptables -A INPUT -p tcp --dport 22 -s 10.0.0.0/8 -j ACCEPT
  - iptables -A INPUT -p tcp --dport 8080 -j DROP
  - iptables -t nat -A PREROUTING -p tcp --dport 80 -j REDIRECT --to-port 8080
  - iptables-save > /etc/iptables/rules.v4
  examples:
  - iptables -D INPUT -p tcp --dport 8080 -j DROP
  - iptables -L INPUT -n --line-numbers
  - iptables -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
  parameters:
  - name: chain
    type: string
    description: 'Chain: INPUT, OUTPUT, FORWARD, or nat chains.'
  - name: proto
    type: string
    description: 'Protocol: tcp, udp, icmp.'
  - name: dport
    type: integer
    description: Destination port.
knowledge:
- title: iptables man page
  type: documentation
  source: https://man7.org/linux/man-pages/man8/iptables.8.html
  description: 'iptables(8) reference: tables, chains, targets, and options.'
- title: Netfilter HOWTO
  type: documentation
  source: https://www.netfilter.org/documentation/HOWTO/packet-filtering-HOWTO.html
  description: Packet filtering HOWTO explaining filter flow.
instructions: "# iptables\n\nManage Linux packet filtering with iptables.\n\n## What this skill does\n\
  \n- Lists rules with counters for traffic visibility.\n- Adds and removes ACCEPT/DROP rules by port\
  \ and source.\n- Redirects ports with NAT PREROUTING.\n- Persists rulesets across reboots.\n\n## When\
  \ to use\n\n- Locking down a host's exposed ports.\n- Redirecting local ports during maintenance.\n\
  - Debugging dropped/blocked traffic.\n\n## Real commands\n\n```bash\n# List with counters\niptables\
  \ -L -n -v\n\n# Allow SSH from the management subnet\niptables -A INPUT -p tcp --dport 22 -s 10.0.0.0/8\
  \ -j ACCEPT\n\n# Drop traffic to 8080\niptables -A INPUT -p tcp --dport 8080 -j DROP\n\n# Allow established\
  \ traffic\niptables -A INPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT\n\n# Redirect local\
  \ 80 -> 8080\niptables -t nat -A PREROUTING -p tcp --dport 80 -j REDIRECT --to-port 8080\n\n# Remove\
  \ a rule\niptables -D INPUT -p tcp --dport 8080 -j DROP\n\n# Persist (Debian/Ubuntu)\niptables-save\
  \ > /etc/iptables/rules.v4\niptables-restore < /etc/iptables/rules.v4\n```\n\n## Policy default\n\n\
  ```bash\niptables -P INPUT DROP   # then explicitly allow what is needed\niptables -P FORWARD DROP\n\
  ```\n\n## Testing\n\n```bash\niptables -L INPUT -n --line-numbers\nnc -zv localhost 8080   # should\
  \ fail when dropped\n```\n\n## Best practices\n\n- Always allow ESTABLISHED,RELATED before specific\
  \ drops.\n- Number rules with --line-numbers for surgical deletes.\n- Test policy changes in a sandbox;\
  \ a bad rule can lock you out.\n- Keep a cron/scheduled restore of the saved ruleset as a safety net.\n\
  \n## Example exchange\n\n```\nUser: Block all traffic to port 8080 except from 10.0.0.0/8.\nAgent: iptables\
  \ -A INPUT -p tcp --dport 8080 -s 10.0.0.0/8 -j ACCEPT\n       iptables -A INPUT -p tcp --dport 8080\
  \ -j DROP\n```"
examples:
- input: List all rules with counters
  output: iptables -L -n -v
- input: Redirect local port 80 to 8080
  output: iptables -t nat -A PREROUTING -p tcp --dport 80 -j REDIRECT --to-port 8080
