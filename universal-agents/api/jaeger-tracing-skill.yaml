name: jaeger-tracing
display_name: Jaeger Tracing
category: api
subcategory: general
description: 'Jaeger distributed tracing: running all-in-one, generating sample traces with tracegen,
  and querying the Jaeger API for services and traces.'
version: 2.0.0
tags:
- api
author: Kdesk
license: MIT
prerequisites:
- docker
capabilities:
- name: jaeger-ops
  description: Run Jaeger locally and query traces through the API and UI.
  commands:
  - docker run -d --name jaeger -p 16686:16686 -p 4317:4317 -p 4318:4318 jaegertracing/all-in-one:1.57
  - curl 'http://localhost:16686/api/traces?service=myservice&limit=10' | jq '.data[0].traceID'
  - curl 'http://localhost:16686/api/services' | jq '.data'
  - go install github.com/jaegertracing/jaeger/cmd/tracegen@latest && tracegen -service myservice -traces
    50
  - curl -s 'http://localhost:16686/api/traces?service=myservice&lookback=1h' | jq '.data | length'
  examples:
  - tracegen -service myservice -traces 100 -duration 2s
  - curl 'http://localhost:16686/api/traces?service=myservice&limit=1' | jq '.data[0].spans | length'
  - docker logs jaeger | tail -20
  parameters:
  - name: service
    type: string
    description: Service name to query traces for.
  - name: lookback
    type: string
    description: Time window, e.g. 1h, 24h.
  - name: limit
    type: integer
    description: Max traces to return.
knowledge:
- title: Jaeger Docs
  type: documentation
  source: https://www.jaegertracing.io/docs/latest/
  description: 'Jaeger documentation: deployment, sampling, and query API.'
- title: Jaeger API Reference
  type: documentation
  source: https://www.jaegertracing.io/docs/latest/apis/
  description: Jaeger query API endpoints for services and traces.
instructions: "# Jaeger Tracing\n\nRun Jaeger and investigate distributed traces.\n\n## What this skill\
  \ does\n\n- Starts the all-in-one Jaeger stack (collector + query UI).\n- Generates sample traces with\
  \ tracegen.\n- Queries services and traces via the JSON API.\n- Inspects span counts and durations from\
  \ the CLI.\n\n## When to use\n\n- Verifying trace instrumentation is emitting data.\n- Drilling into\
  \ one slow request's span waterfall.\n- Load-testing the trace pipeline itself.\n\n## Real commands\n\
  \n```bash\n# Run all-in-one (UI :16686, OTLP :4317/:4318)\ndocker run -d --name jaeger -p 16686:16686\
  \ -p 4317:4317 -p 4318:4318 \\\n  jaegertracing/all-in-one:1.57\n\n# Generate sample traces\ngo install\
  \ github.com/jaegertracing/jaeger/cmd/tracegen@latest\ntracegen -service myservice -traces 50 -duration\
  \ 2s\n\n# List known services\ncurl 'http://localhost:16686/api/services' | jq '.data'\n\n# Recent traces\
  \ for a service\ncurl 'http://localhost:16686/api/traces?service=myservice&limit=10' | jq '.data[].traceID'\n\
  \n# Span count in the newest trace\ncurl 'http://localhost:16686/api/traces?service=myservice&limit=1'\
  \ | jq '.data[0].spans | length'\n```\n\n## OTLP wiring for apps\n\n```bash\nexport OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318\n\
  export OTEL_SERVICE_NAME=myservice\n```\n\n## Testing\n\n```bash\ntracegen -service myservice -traces\
  \ 10 && \\\n  curl -s 'http://localhost:16686/api/traces?service=myservice&limit=1' | jq -e '.data[0]'\
  \ > /dev/null && echo \"traces flowing\"\n```\n\n## Best practices\n\n- Check sampling config before\
  \ blaming missing traces (default head sampling).\n- Use lookback windows matching the investigation\
  \ window.\n- Query by operation and tags: /api/traces?service=X&operation=Y&tags=...\n- Match OTLP port\
  \ choices (4317 gRPC, 4318 HTTP) to your exporter.\n\n## Example exchange\n\n```\nUser: Are traces arriving\
  \ for the checkout service?\nAgent: curl -s 'http://localhost:16686/api/traces?service=checkout&lookback=1h'\
  \ | jq '.data | length'\n```"
examples:
- input: Start Jaeger all-in-one
  output: docker run -d --name jaeger -p 16686:16686 -p 4317:4317 -p 4318:4318 jaegertracing/all-in-one:1.57
- input: Generate 50 sample traces for myservice
  output: tracegen -service myservice -traces 50
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: jaeger-tracing.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-jaeger-tracing
  generic:
    system_prompt: 'You take the Jaeger Tracing seat. You do it through jaeger-ops: Run Jaeger locally
      and query traces through the API and UI. The commands are real, e.g. `docker run -d --name jaeger
      -p 16686:16686 -p 4317:4317 -p 4318:4318...`. You run and verify the real CLI commands before you
      claim anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
