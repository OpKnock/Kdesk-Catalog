name: jenkins-pipeline
display_name: Jenkins Pipeline
category: api
subcategory: general
description: 'Jenkins pipeline operations: triggering builds via jenkins-cli and curl, running Groovy
  scripts, listing jobs, and checking build status.'
version: 2.0.0
tags:
- api
author: Kdesk
license: MIT
prerequisites:
- java
capabilities:
- name: jenkins-cli
  description: Trigger, monitor, and script Jenkins jobs from the terminal.
  commands:
  - java -jar jenkins-cli.jar -s http://localhost:8080 list-jobs
  - java -jar jenkins-cli.jar -s http://localhost:8080 build MyJob -s -v
  - curl -X POST -u admin:token http://localhost:8080/job/MyJob/build
  - curl -u admin:token http://localhost:8080/job/MyJob/lastBuild/api/json | jq '.result, .duration'
  - java -jar jenkins-cli.jar -s http://localhost:8080 groovy = 'println Jenkins.instance.pluginManager.plugins.size()'
  examples:
  - curl -u admin:token -X POST 'http://localhost:8080/job/MyJob/buildWithParameters?TARGET=staging'
  - curl -s 'http://localhost:8080/job/MyJob/lastSuccessfulBuild/artifact/report.json' | jq .
  - java -jar jenkins-cli.jar -s http://localhost:8080 console MyJob 42
  parameters:
  - name: job
    type: string
    description: Jenkins job name.
  - name: build_number
    type: integer
    description: Build number to inspect.
  - name: params
    type: string
    description: Build parameters as key=value pairs.
knowledge:
- title: Jenkins CLI Docs
  type: documentation
  source: https://www.jenkins.io/doc/book/managing/cli/
  description: 'Jenkins CLI: jenkins-cli.jar usage and commands.'
- title: Pipeline Syntax
  type: documentation
  source: https://www.jenkins.io/doc/book/pipeline/syntax/
  description: Declarative and scripted pipeline syntax reference.
instructions: "# Jenkins Pipeline\n\nDrive Jenkins from the terminal.\n\n## What this skill does\n\
47:   \n- Lists jobs and triggers builds with parameters.\n- Watches build results and console output.\n- Runs\
48:   \ ad-hoc Groovy against the Jenkins instance.\n- Fetches build artifacts from the API.\n\n## When to\
49:   \ use\n\n- Triggering CI from a script or another pipeline.\n- Checking why a build failed without opening\
50:   \ the UI.\n- Auditing installed plugins or job configs.\n\n## Real commands\n\n```bash\n# List jobs\n\
51:   java -jar jenkins-cli.jar -s http://localhost:8080 list-jobs\n\n# Trigger a build and wait for result\n\
52:   java -jar jenkins-cli.jar -s http://localhost:8080 build MyJob -s -v\n\n# Trigger with curl (token auth)\n\
53:   curl -X POST -u admin:token http://localhost:8080/job/MyJob/build\n\n# Parameterized build\ncurl -u\
54:   \ admin:token -X POST 'http://localhost:8080/job/MyJob/buildWithParameters?TARGET=staging'\n\n# Build\
55:   \ result\ncurl -u admin:token http://localhost:8080/job/MyJob/lastBuild/api/json | jq '.result, .duration'\n\
56:   \n# Groovy script (count plugins)\njava -jar jenkins-cli.jar -s http://localhost:8080 groovy = 'println\
57:   \ Jenkins.instance.pluginManager.plugins.size()'\n\n# Console output\njava -jar jenkins-cli.jar -s http://localhost:8080\
58:   \ console MyJob 42\n```\n\n## Polling loop\n\n```bash\nwhile :; do\n  R=$(curl -s -u admin:token http://localhost:8080/job/MyJob/lastBuild/api/json\
59:   \ | jq -r .result)\n  [ \"$R\" != \"null\" ] && break\n  sleep 5\ndone\necho \"build finished: $R\"\n\
60:   ```\n\n## Testing\n\n```bash\ncurl -s -u admin:token http://localhost:8080/api/json | jq '.jobs[].name'\n\
61:   ```\n\n## Best practices\n\n- Prefer jenkins-cli for interactive work, curl for CI scripting.\n- Use\
62:   \ API tokens, never raw passwords, in scripts.\n- Poll api/json on the queued item, not the build, to\
63:   \ avoid missing builds.\n- Pin jenkins-cli.jar version to the server version.\n\n## Example exchange\n\
64:   \n```\nUser: Trigger a staging deploy build and wait for it.\nAgent: curl -u admin:token -X POST 'http://localhost:8080/job/deploy/buildWithParameters?TARGET=staging'\n\
65:   \       then poll lastBuild/api/json until .result != null\n```"
examples:
- input: List Jenkins jobs
  output: java -jar jenkins-cli.jar -s http://localhost:8080 list-jobs
- input: Trigger MyJob and wait
  output: java -jar jenkins-cli.jar -s http://localhost:8080 build MyJob -s -v
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: jenkins-pipeline.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-jenkins-pipeline
  generic:
    system_prompt: 'You are the Jenkins Pipeline specialist. You do it through jenkins-cli: Trigger, monitor,
      and script Jenkins jobs from the terminal. The commands are real, e.g. `java -jar jenkins-cli.jar
      -s http://localhost:8080 list-jobs`. You prefer the shortest safe path, and you reproduce failures
      before diagnosing them.'
    available_tools:
    - bash
    - read
    - write
    - edit
