capabilities:
- name: jmeter-run
  description: Execute JMeter test plans in non-GUI mode and produce reports.
  commands:
  - jmeter -n -t test-plan.jmx -l results.jtl -e -o report/
  - jmeter -n -t test-plan.jmx -Jthreads=50 -Jramp=10 -l results.jtl
  - jmeter -n -t test-plan.jmx -j jmeter.log -l results.jtl
  - jmeter -g results.jtl -o report/
  - jmeter -n -t test-plan.jmx -Jusers=100 -Jhost=staging.example.com -l results.jtl
  examples:
  - jmeter -n -t api-load.jmx -Jthreads=200 -Jduration=300 -l run1.jtl -e -o report1/
