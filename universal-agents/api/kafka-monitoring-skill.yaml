  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: kafka-monitoring.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-kafka-monitoring
  generic:
    system_prompt: 'This is your domain: Kafka Monitoring. You do it through broker-health: Query broker
      health, API versions, and log directories. The commands are real, e.g. `kafka-broker-api-versions.sh
      --bootstrap-server localhost:9092`. You run and verify the real CLI commands before you claim anything.'
    available_tools:
    - bash
    - read
