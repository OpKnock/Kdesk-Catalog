name: kafka-python
display_name: Kafka Python
category: api
subcategory: general
description: 'Build Kafka producers and consumers in Python with confluent-kafka: SerializingProducer,
  Consumer groups, and end-to-end event pipelines.'
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
prerequisites:
- kafka-console-consumer.sh
- kafka-consumer-groups.sh
- kafka-topics.sh
- pip
- python
capabilities:
- name: python-pipeline
  description: Write Python producers/consumers with confluent-kafka and verify against the broker.
  commands:
  - pip install confluent-kafka
  - python producer.py --topic events --count 500
  - python consumer.py --topic events --group analytics
  - kafka-topics.sh --bootstrap-server localhost:9092 --create --topic events --partitions 6 --replication-factor
    1
  - python -m pytest tests/
  examples:
  - python producer.py --topic events --count 500
  - python consumer.py --topic events --group analytics
  - kafka-topics.sh --bootstrap-server localhost:9092 --create --topic events --partitions 6 --replication-factor
    1
  parameters:
  - name: topic
    type: string
    description: Topic name.
  - name: group
    type: string
    description: Consumer group id.
  - name: count
    type: integer
    description: Messages to produce.
- name: consume-check
  description: Inspect consumed data and group state from the CLI.
  commands:
  - kafka-console-consumer.sh --bootstrap-server localhost:9092 --topic events --from-beginning --max-messages
    3
  - kafka-consumer-groups.sh --bootstrap-server localhost:9092 --describe --group analytics
  - python consumer.py --topic events --group analytics --reset earliest --poll 5000
  examples:
  - kafka-console-consumer.sh --bootstrap-server localhost:9092 --topic events --from-beginning --max-messages
    3
  - kafka-consumer-groups.sh --bootstrap-server localhost:9092 --describe --group analytics
  - python consumer.py --topic events --group analytics --reset earliest --poll 5000
  parameters:
  - name: reset
    type: string
    description: 'auto.offset.reset: earliest or latest.'
  - name: poll
    type: integer
    description: Poll timeout in milliseconds.
knowledge:
- title: confluent-kafka-python
  type: documentation
  source: https://docs.confluent.io/platform/current/clients/confluent-kafka-python/
  description: Official Python client documentation.
- title: confluent_kafka on PyPI
  type: documentation
  source: https://pypi.org/project/confluent-kafka/
  description: Package page with installation and quickstart.
instructions: "# Kafka (Python)\n\nStream events with the confluent-kafka Python client.\n\n## What this\
  \ skill does\n\n- Produces records with SerializingProducer.\n- Consumes in groups with on_assign/on_revoke\
  \ callbacks.\n- Verifies end-to-end delivery with the Kafka CLI.\n\n## When to use\n\n- Python services\
  \ publishing/consuming events.\n- Data pipelines feeding analytics.\n- ML feature streams from Kafka\
  \ topics.\n\n## Real commands\n\n```bash\n# Install\npip install confluent-kafka\n\n# Create topic\n\
  kafka-topics.sh --bootstrap-server localhost:9092 \\\n  --create --topic events --partitions 6 --replication-factor\
  \ 1\n\n# Produce\npython producer.py --topic events --count 500\n\n# Consume\npython consumer.py --topic\
  \ events --group analytics\n\n# CLI verification\nkafka-console-consumer.sh --bootstrap-server localhost:9092\
  \ \\\n  --topic events --from-beginning --max-messages 3\nkafka-consumer-groups.sh --bootstrap-server\
  \ localhost:9092 \\\n  --describe --group analytics\n```\n\n## Producer example\n\n```python\nfrom confluent_kafka\
  \ import SerializingProducer\nfrom confluent_kafka.serialization import StringSerializer\n\nproducer\
  \ = SerializingProducer({\n    'bootstrap.servers': 'localhost:9092',\n    'key.serializer': StringSerializer('utf_8'),\n\
  \    'value.serializer': StringSerializer('utf_8'),\n    'acks': 'all',\n})\n\nproducer.produce('events',\
  \ key='user-1', value='{\"action\":\"click\"}')\nproducer.flush()\n```\n\n## Testing\n\n```bash\npython\
  \ -m pytest tests/\n```\n\n## Best practices\n\n- Always flush() before exiting to avoid losing buffered\
  \ messages.\n- Set enable.auto.offset.store=false when committing offsets after processing.\n- Use librdkafka\
  \ config keys exactly; unknown keys raise errors.\n"
examples:
- input: Stream click events from Python
  output: pip install confluent-kafka, create the events topic, then python producer.py --topic events
    --count 500
- input: Consume with a named group
  output: python consumer.py --topic events --group analytics, then check lag with kafka-consumer-groups.sh
    --describe --group analytics.
