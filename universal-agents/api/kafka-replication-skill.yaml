name: kafka-replication
display_name: Kafka Replication
category: api
subcategory: general
description: 'Manage Kafka replica health, trigger leader elections, reassign partitions across brokers, and configure throttle rates.'
version: 2.0.0
tags:
- api
author: Mehul Wagde
license: MIT
prerequisites:
- kafka-configs.sh
- kafka-leader-election.sh
- kafka-reassign-partitions.sh
- kafka-topics.sh
capabilities:
- name: replica-health
  description: 'Inspect replication health: ISR state, under-replicated partitions, and unclean leaders.'
  commands:
  - kafka-topics.sh --bootstrap-server localhost:9092 --describe --topic orders
  - kafka-topics.sh --bootstrap-server localhost:9092 --describe --under-replicated-partitions
  - kafka-topics.sh --bootstrap-server localhost:9092 --describe --unclean-offset-leader-available
  - kafka-topics.sh --bootstrap-server localhost:9092 --describe --topics-with-overrides
  examples:
  - kafka-topics.sh --bootstrap-server localhost:9092 --describe --under-replicated-partitions
  - kafka-topics.sh --bootstrap-server localhost:9092 --describe --topic orders | head -10
  - kafka-topics.sh --bootstrap-server localhost:9092 --describe --unclean-offset-leader-available
  parameters:
  - name: topic
    type: string
    description: Topic to inspect.
  - name: bootstrap
    type: string
    description: Bootstrap server address.
- name: leader-and-reassign
  description: Trigger leader elections and reassign replicas around failed brokers.
  commands:
  - kafka-leader-election.sh --bootstrap-server localhost:9092 --election-type preferred --all-topic-partitions
  - kafka-leader-election.sh --bootstrap-server localhost:9092 --election-type preferred --topic orders
    --partition 0
  - kafka-reassign-partitions.sh --bootstrap-server localhost:9092 --generate --topics-to-move-json-file
    topics.json --broker-list "1,2,3"
  - kafka-reassign-partitions.sh --bootstrap-server localhost:9092 --reassignment-json-file reassignment.json
    --execute
  - kafka-configs.sh --bootstrap-server localhost:9092 --entity-type brokers --entity-name 1 --alter --add-config
    "leader.replication.throttled.rate=10000000,follower.replication.throttled.rate=10000000"
  examples:
  - kafka-leader-election.sh --bootstrap-server localhost:9092 --election-type preferred --all-topic-partitions
  - kafka-reassign-partitions.sh --bootstrap-server localhost:9092 --generate --topics-to-move-json-file
    topics.json --broker-list "1,2,3"
  - kafka-configs.sh --bootstrap-server localhost:9092 --entity-type brokers --entity-name 1 --alter --add-config
    "leader.replication.throttled.rate=10000000"
  parameters:
  - name: election_type
    type: string
    description: preferred or unclean.
  - name: brokers
    type: string
    description: Broker ids for reassignment.
  - name: throttle_rate
    type: integer
    description: Replication throttle bytes/sec.
knowledge:
- title: Kafka Replication
  type: documentation
  source: https://kafka.apache.org/documentation/#replication
  description: Official replication, ISR, and leader election documentation.
- title: kafka-leader-election.sh
  type: documentation
  source: https://kafka.apache.org/documentation/#tools
  description: Leader election tool usage.
instructions: "# Kafka Replication\n\nOperate replication: keep ISRs healthy, fail over leaders, and heal\
  \ replicas.\n\n## What this skill does\n\n- Detects under-replicated partitions and unclean leader states.\n\
  - Runs preferred leader elections.\n- Reassigns replicas away from dead brokers with throttling.\n\n\
  ## When to use\n\n- Broker outages and recovery.\n- Verifying RF=3 actually tolerates failures.\n- Rebalancing\
  \ replicas after adding brokers.\n\n## Real commands\n\n```bash\n# Find under-replicated partitions\n\
  kafka-topics.sh --bootstrap-server localhost:9092 \\\n  --describe --under-replicated-partitions\n\n\
  # Find partitions with unclean leader elections\nkafka-topics.sh --bootstrap-server localhost:9092 \\\
  \n  --describe --unclean-offset-leader-available\n\n# Inspect ISR for a topic\nkafka-topics.sh --bootstrap-server\
  \ localhost:9092 --describe --topic orders\n\n# Preferred leader election (all topics)\nkafka-leader-election.sh\
  \ --bootstrap-server localhost:9092 \\\n  --election-type preferred --all-topic-partitions\n\n# Single\
  \ partition election\nkafka-leader-election.sh --bootstrap-server localhost:9092 \\\n  --election-type\
  \ preferred --topic orders --partition 0\n\n# Reassign replicas off a dead broker (1) onto 2,3,4\nkafka-reassign-partitions.sh\
  \ --bootstrap-server localhost:9092 \\\n  --generate --topics-to-move-json-file topics.json --broker-list\
  \ \"2,3,4\"\n\n# Throttle replication during reassignment\nkafka-configs.sh --bootstrap-server localhost:9092\
  \ \\\n  --entity-type brokers --entity-name 1 --alter \\\n  --add-config \"leader.replication.throttled.rate=10000000,follower.replication.throttled.rate=10000000\"\
  \n```\n\n## topics.json example\n\n```json\n{\"topics\":[{\"topic\":\"orders\"}],\"version\":1}\n```\n\
  \n## Testing\n\n```bash\nkafka-reassign-partitions.sh --bootstrap-server localhost:9092 \\\n  --reassignment-json-file\
  \ reassignment.json --verify\n```\n\n## Best practices\n\n- Watch ISR shrink as the first sign of broker\
  \ trouble.\n- Set unclean.leader.election.enable=false on critical topics.\n- Remove throttle configs\
  \ after reassignment completes.\n"
examples:
- input: Broker 1 died; fix replication for orders
  output: Generate a reassignment onto 2,3,4, execute with throttling, verify, then remove the throttle.
- input: Find topics at risk
  output: kafka-topics.sh --bootstrap-server localhost:9092 --describe --under-replicated-partitions
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: kafka-replication.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-kafka-replication
  generic:
    system_prompt: 'Your lane is Kafka Replication. You do it through replica-health: Inspect replication
      health: ISR state, under-replicated partitions, and unclean leaders. The commands are real, e.g.
      `kafka-topics.sh --bootstrap-server localhost:9092 --describe --topic orders`. You work hands-on
      and only report outcomes you have observed.'
    available_tools:
    - bash
    - read
    - write
    - edit
