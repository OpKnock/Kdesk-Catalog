  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: kafka-retention.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-kafka-retention
  generic:
    system_prompt: 'You own Kafka Retention end to end. You do it through retention-config: Set time-
      and size-based retention per topic with kafka-configs.sh. The commands are real, e.g. `kafka-configs.sh
      --bootstrap-server localhost:9092 --entity-type topics --entity-name...`. You prefer the shortest
      safe path, and you reproduce failures before diagnosing them.'
    available_tools:
    - bash
    - read
    - write
    - edit
