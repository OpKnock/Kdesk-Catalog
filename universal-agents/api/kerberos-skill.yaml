capabilities:
- name: session-mgmt
  description: Obtain, list, and destroy Kerberos tickets.
  commands:
  - kinit alice@STAGING.MYAPP.TEST
  - kinit -l 10h alice@STAGING.MYAPP.TEST
  - klist
  - klist -f
  - kdestroy
  examples:
  - kinit alice@STAGING.MYAPP.TEST
  - klist -f
  - kdestroy
  parameters:
  - name: principal
    type: string
    description: User principal, e.g. alice@STAGING.MYAPP.TEST.
  - name: lifetime
    type: string
    description: Ticket lifetime, e.g. 10h.
- name: admin-ops
  description: Create principals and manage keytabs with kadmin.
  commands:
  - kadmin -p admin/admin@STAGING.MYAPP.TEST -q "addprinc -pw s3cret bob@STAGING.MYAPP.TEST"
  - kadmin -p admin/admin@STAGING.MYAPP.TEST -q "ktadd -k /etc/krb5.keytab host/web-01.staging.myapp.test@STAGING.MYAPP.TEST"
  - kadmin -p admin/admin@STAGING.MYAPP.TEST -q "listprincs"
  - kadmin -p admin/admin@STAGING.MYAPP.TEST -q "delprinc bob@STAGING.MYAPP.TEST"
  - klist -kt /etc/krb5.keytab
  examples:
  - kadmin -p admin/admin@STAGING.MYAPP.TEST -q "addprinc -pw s3cret bob@STAGING.MYAPP.TEST"
  - kadmin -p admin/admin@STAGING.MYAPP.TEST -q "ktadd -k /etc/krb5.keytab host/web-01.staging.myapp.test@STAGING.MYAPP.TEST"
  - klist -kt /etc/krb5.keytab
  parameters:
  - name: principal
    type: string
    description: Principal to create or add to keytab.
  - name: keytab
    type: string
    description: Keytab file path.
  - name: password
    type: string
    description: Password for new principals.
knowledge:
- title: MIT Kerberos Documentation
  type: documentation
  source: https://web.mit.edu/kerberos/krb5-latest/doc/
  description: Official MIT Kerberos user and admin documentation.
- title: kinit/klist man pages
  type: documentation
  source: https://web.mit.edu/kerberos/krb5-latest/doc/user/user_commands/kinit.html
  description: User command reference.
instructions: "# Kerberos\n\nAuthenticate and administer MIT Kerberos realms.\n\n## What this skill does\n\
  \n- Obtains and manages TGT/ticket sessions with kinit/klist/kdestroy.\n- Creates principals and keytabs\
  \ with kadmin.\n- Troubleshoots ticket expiry and preauth errors.\n\n## When to use\n\n- SSO authentication\
  \ for Hadoop, NFS, or LDAP.\n- Service principals for hosts and daemons.\n- Debugging kinit failures\
  \ (KDC unreachable, clock skew, preauth).\n\n## Real commands\n\n```bash\n# Obtain a ticket (prompts\
  \ for password)\nkinit alice@STAGING.MYAPP.TEST\n\n# Ticket with explicit lifetime\nkinit -l 10h alice@STAGING.MYAPP.TEST\n\
  \n# List active tickets\nklist\nklist -f    # with flags (A=preauth, F=forwardable)\n\n# Keytab tickets\n\
  klist -kt /etc/krb5.keytab\n\n# Destroy the ticket cache\nkdestroy\n\n# Admin: create a user principal\n\
  kadmin -p admin/admin@STAGING.MYAPP.TEST \\\n  -q \"addprinc -pw s3cret bob@STAGING.MYAPP.TEST\"\n\n# Admin: add service\
  \ principal to a keytab\nkadmin -p admin/admin@STAGING.MYAPP.TEST \\\n  -q \"ktadd -k /etc/krb5.keytab host/web-01.staging.myapp.test@STAGING.MYAPP.TEST\"\
  \n\n# List principals\nkadmin -p admin/admin@STAGING.MYAPP.TEST -q \"listprincs\"\n```\n\n## krb5.conf example\n\
  \n```ini\n[libdefaults]\n  default_realm = STAGING.MYAPP.TEST\n  dns_lookup_realm = false\n  dns_lookup_kdc\
  \ = false\n  ticket_lifetime = 24h\n[realms]\n  STAGING.MYAPP.TEST = {\n    kdc = kdc1.staging.myapp.test\n    admin_server\
  \ = kdc1.staging.myapp.test\n  }\n[domain_realm]\n  .staging.myapp.test = STAGING.MYAPP.TEST\n```\n\n## Testing\n\n```bash\n\
  # Verify the service ticket works\nkvno host/web-01.staging.myapp.test@STAGING.MYAPP.TEST\n```\n\n## Best practices\n\
  \n- Never embed passwords in scripts; use keytabs with restricted principals.\n- Keep the clock in sync;\
  \ skew > 5 minutes breaks preauth.\n- Use -l and -r lifetimes matching service requirements; renew with\
  \ kinit -R.\n"
examples:
- input: 'Can''t authenticate: kinit fails with clock skew'
  output: Sync time with chrony/ntpd on both client and KDC; skew beyond 5 minutes fails preauth.
- input: Add host/web-01 to a keytab
  output: kadmin -p admin/admin@STAGING.MYAPP.TEST -q "ktadd -k /etc/krb5.keytab host/web-01.staging.myapp.test@STAGING.MYAPP.TEST"
