name: koa
display_name: Koa
category: api
subcategory: general
description: 'Build async web applications with Koa: middleware composition, routers, body parsing, and
  error handling with the koa ecosystem.'
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
prerequisites:
- node
- npm
capabilities:
- name: koa-app
  description: Scaffold and run a Koa application with router and bodyparser.
  commands:
  - npm init -y
  - npm install koa koa-router koa-bodyparser
  - node app.js
  - node --watch app.js
  - npm install -D nodemon
  examples:
  - npm init -y && npm install koa koa-router koa-bodyparser
  - node app.js
  - node --watch app.js
  parameters:
  - name: port
    type: integer
    description: Listen port, default 3000.
  - name: framework
    type: string
    description: 'Package set: koa, koa-router, koa-bodyparser.'
- name: verify-endpoints
  description: Test Koa endpoints with curl including JSON bodies and errors.
  commands:
  - curl -i http://localhost:3000/
  - 'curl -i -X POST http://localhost:3000/api/users -H ''Content-Type: application/json'' -d ''{"name":"alice"}'''
  - curl -s -o /dev/null -w '%{http_code}\n' http://localhost:3000/not-found
  - curl -i http://localhost:3000/api/users/1
  examples:
  - curl -i http://localhost:3000/
  - 'curl -i -X POST http://localhost:3000/api/users -H ''Content-Type: application/json'' -d ''{"name":"alice"}'''
  - curl -s -o /dev/null -w '%{http_code}\n' http://localhost:3000/not-found
  parameters:
  - name: endpoint
    type: string
    description: Path to test.
  - name: method
    type: string
    description: HTTP method.
  - name: body
    type: string
    description: JSON request body.
knowledge:
- title: Koa Documentation
  type: documentation
  source: https://koajs.com/
  description: 'Official Koa docs: middleware, context, examples.'
- title: koa-router
  type: documentation
  source: https://github.com/koajs/router
  description: Router middleware documentation.
instructions: "# Koa\n\nBuild async Node.js web apps with Koa's onion-style middleware.\n\n## What this\
  \ skill does\n\n- Scaffolds Koa projects with router and bodyparser.\n- Implements cascading middleware\
  \ and error handling.\n- Tests endpoints with curl.\n\n## When to use\n\n- Lightweight APIs that need\
  \ async-first middleware.\n- Serving as a BFF layer in Node microservice architectures.\n- Learning\
  \ middleware composition and ctx lifecycle.\n\n## Real commands\n\n```bash\n# Scaffold\nnpm init -y\n\
  npm install koa koa-router koa-bodyparser\n\n# Run\nnode app.js\n\n# Watch mode\nnode --watch app.js\n\
  \n# Test endpoints\ncurl -i http://localhost:3000/\ncurl -i -X POST http://localhost:3000/api/users\
  \ \\\n  -H 'Content-Type: application/json' -d '{\"name\":\"alice\"}'\ncurl -s -o /dev/null -w '%{http_code}\\\
  n' http://localhost:3000/not-found\n```\n\n## app.js example\n\n```js\nconst Koa = require('koa');\n\
  const Router = require('koa-router');\nconst bodyParser = require('koa-bodyparser');\n\nconst app =\
  \ new Koa();\nconst router = new Router();\n\napp.use(async (ctx, next) => {\n  const start = Date.now();\n\
  \  await next();\n  ctx.set('X-Response-Time', String(Date.now() - start));\n});\n\napp.use(bodyParser());\n\
  \nrouter.get('/', ctx => { ctx.body = { ok: true }; });\nrouter.post('/api/users', ctx => {\n  ctx.status\
  \ = 201;\n  ctx.body = { id: 1, ...ctx.request.body };\n});\n\napp.use(router.routes());\napp.use(router.allowedMethods());\n\
  \napp.listen(3000);\n```\n\n## Testing\n\n```bash\nnode --check app.js   # syntax check\n```\n\n## Best\
  \ practices\n\n- Keep middleware small and ordered: logger, errors, body, then routes.\n- Set ctx.body\
  \ before awaiting downstream to avoid double sends.\n- Use koa-jwt for auth and koa-helmet for security\
  \ headers.\n"
examples:
- input: Scaffold a Koa API with one route
  output: npm init -y && npm install koa koa-router, write app.js with a router, then node app.js and
    curl -i http://localhost:3000/.
- input: Return 404 for unknown routes
  output: Add router.allowedMethods() and a final catch-all middleware setting ctx.status = 404.
