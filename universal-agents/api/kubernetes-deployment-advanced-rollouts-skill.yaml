  github_copilot:
    prompt_file: kubernetes-deployment-advanced-rollouts.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-kubernetes-deployment-advanced-rollouts
  generic:
