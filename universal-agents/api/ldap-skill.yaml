name: ldap
display_name: Ldap
category: api
subcategory: general
description: 'Query and administer OpenLDAP directories using ldapsearch, ldapadd, and ldapmodify to manage entries, apply LDIF-based changes, and perform authenticated binds.'
version: 2.0.0
tags:
- api
author: Mehul Wagde
license: MIT
created_at: '2025-06-15T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
prerequisites:
- ldapadd
- ldapdelete
- ldapmodify
- ldappasswd
- ldapsearch
capabilities:
- name: ldap-query
  description: Search and read directory entries with ldapsearch.
  commands:
  - ldapsearch -x -H ldap://localhost:389 -D 'cn=admin,dc=myapp,dc=test' -w secret -b 'dc=myapp,dc=test'
    '(uid=alice)'
  - ldapsearch -x -LLL -b 'ou=people,dc=myapp,dc=test' '(&(objectClass=inetOrgPerson)(mail=*@myapp.test))'
    cn mail
  - ldapsearch -x -b 'dc=myapp,dc=test' '(objectClass=*)' -s base
  - ldapsearch -x -H ldaps://localhost:636 -D 'cn=admin,dc=myapp,dc=test' -w secret -b 'dc=myapp,dc=test'
    '(cn=bob)'
  examples:
  - ldapsearch -x -H ldap://localhost:389 -D 'cn=admin,dc=myapp,dc=test' -w secret -b 'dc=myapp,dc=test'
    '(uid=alice)'
  - ldapsearch -x -LLL -b 'ou=people,dc=myapp,dc=test' '(mail=*@myapp.test)' cn mail
  - ldapsearch -x -b 'dc=myapp,dc=test' '(objectClass=*)' -s base
  parameters:
  - name: base
    type: string
    description: Search base DN.
  - name: filter
    type: string
    description: LDAP filter, e.g. (uid=alice).
  - name: bind_dn
    type: string
    description: Bind DN for authenticated search.
  - name: password
    type: string
    description: Bind password (-w).
- name: ldap-write
  description: Add, modify, and delete entries with LDIF files.
  commands:
  - ldapadd -x -H ldap://localhost:389 -D 'cn=admin,dc=myapp,dc=test' -w secret -f alice.ldif
  - ldapmodify -x -H ldap://localhost:389 -D 'cn=admin,dc=myapp,dc=test' -w secret -f change.ldif
  - ldapdelete -x -H ldap://localhost:389 -D 'cn=admin,dc=myapp,dc=test' -w secret 'uid=bob,ou=people,dc=myapp,dc=test'
  - ldappasswd -x -H ldap://localhost:389 -D 'cn=admin,dc=myapp,dc=test' -w secret -s newpass 'uid=alice,ou=people,dc=myapp,dc=test'
  examples:
  - ldapadd -x -H ldap://localhost:389 -D 'cn=admin,dc=myapp,dc=test' -w secret -f alice.ldif
  - ldapmodify -x -H ldap://localhost:389 -D 'cn=admin,dc=myapp,dc=test' -w secret -f change.ldif
  - ldapdelete -x -H ldap://localhost:389 -D 'cn=admin,dc=myapp,dc=test' -w secret 'uid=bob,ou=people,dc=myapp,dc=test'
  parameters:
  - name: ldif
    type: string
    description: LDIF file path for add/modify.
  - name: dn
    type: string
    description: Entry DN for delete/password ops.
knowledge:
- title: OpenLDAP Admin Guide
  type: documentation
  source: https://www.openldap.org/doc/admin24/
  description: Official OpenLDAP administration guide.
- title: ldapsearch man page
  type: documentation
  source: https://man7.org/linux/man-pages/man1/ldapsearch.1.html
  description: ldapsearch command reference.
instructions: "# LDAP (OpenLDAP)\n\nQuery and administer LDAP directories with the OpenLDAP client tools.\n\
  \n## What this skill does\n\n- Searches entries with ldapsearch (anonymous and bound).\n- Adds/modifies/deletes\
  \ entries via LDIF.\n- Resets passwords with ldappasswd.\n\n## When to use\n\n- Integrating apps with\
  \ corporate directory auth.\n- Provisioning and auditing users/groups.\n- Debugging bind and search\
  \ filter issues.\n\n## Real commands\n\n```bash\n# Authenticated search\nldapsearch -x -H ldap://localhost:389\
  \ \\\n  -D 'cn=admin,dc=myapp,dc=test' -w secret \\\n  -b 'dc=myapp,dc=test' '(uid=alice)'\n\n# Minimal\
  \ output, specific attributes\nldapsearch -x -LLL -b 'ou=people,dc=myapp,dc=test' \\\n  '(&(objectClass=inetOrgPerson)(mail=*@myapp.test))'\
  \ cn mail\n\n# Root DSE (capabilities)\nldapsearch -x -b 'dc=myapp,dc=test' '(objectClass=*)' -s base\n\
  \n# Add from LDIF\nldapadd -x -H ldap://localhost:389 \\\n  -D 'cn=admin,dc=myapp,dc=test' -w secret\
  \ -f alice.ldif\n\n# Modify from LDIF\nldapmodify -x -H ldap://localhost:389 \\\n  -D 'cn=admin,dc=myapp,dc=test'\
  \ -w secret -f change.ldif\n\n# Delete\nldapdelete -x -H ldap://localhost:389 \\\n  -D 'cn=admin,dc=myapp,dc=test'\
  \ -w secret \\\n  'uid=bob,ou=people,dc=myapp,dc=test'\n\n# Password reset\nldappasswd -x -H ldap://localhost:389\
  \ \\\n  -D 'cn=admin,dc=myapp,dc=test' -w secret -s newpass \\\n  'uid=alice,ou=people,dc=myapp,dc=test'\n\
  ```\n\n## alice.ldif example\n\n```ldif\ndn: uid=alice,ou=people,dc=myapp,dc=test\nobjectClass: inetOrgPerson\n\
  objectClass: posixAccount\ncn: Alice Smith\nsn: Smith\nuid: alice\nuidNumber: 1001\ngidNumber: 100\n\
  homeDirectory: /home/alice\nmail: alice@myapp.test\nuserPassword: {SSHA}encrypted-hash\n```\n\n## Testing\n\
  \n```bash\nldapsearch -x -b 'ou=people,dc=myapp,dc=test' '(uid=alice)' dn\n```\n\n## Best practices\n\
  \n- Use -LLL for scriptable output and -w for bind passwords only on trusted hosts.\n- Never store plaintext\
  \ userPassword in LDIF; use hashed values.\n- Test filters with the smallest scope (ou=) before running\
  \ on the full tree.\n"
examples:
- input: Find alice's email
  output: ldapsearch -x -LLL -b 'ou=people,dc=myapp,dc=test' '(uid=alice)' mail
- input: Add a new user
  output: Write alice.ldif with inetOrgPerson attributes and run ldapadd -x -D 'cn=admin,dc=myapp,dc=test' -w secret -f alice.ldif.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ldap.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-ldap
  generic:
    system_prompt: 'You take the Ldap seat. You do it through ldap-query: Search and read directory entries
      with ldapsearch. The commands are real, e.g. `ldapsearch -x -H ldap://localhost:389 -D cn=admin,dc=myapp,dc=test
      -w secret -b...`. You work hands-on and only report outcomes you have observed.'
    available_tools:
    - bash
    - read
    - write
    - edit
