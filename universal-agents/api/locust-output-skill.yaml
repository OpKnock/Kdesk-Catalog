name: locust-output
display_name: Locust Output
category: api
subcategory: general
description: 'Load testing with Locust: HttpUser task files, headless runs, web UI, CSV collection, and
  distributed execution for large-scale tests.'
version: 2.0.0
tags:
- api
author: Kdesk
license: MIT
created_at: '2025-06-15T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
prerequisites:
- locust
capabilities:
- name: locust-run
  description: Run locust tests headless or with the web UI.
  commands:
  - locust -f locustfile.py --headless -u 1000 -r 100 --host https://httpbin.org
  - locust -f locustfile.py
  - locust -f locustfile.py --web-port 8089
  - locust -f locustfile.py --headless -u 200 -r 20 -t 2m
  examples:
  - locust -f locustfile.py --headless -u 1000 -r 100 --host https://httpbin.org
  - locust -f locustfile.py
  - locust -f locustfile.py --headless -u 200 -r 20 -t 2m
  parameters:
  - name: file
    type: string
    description: Locustfile path.
  - name: users
    type: integer
    description: Peak number of users (-u).
  - name: spawn_rate
    type: integer
    description: Users spawned per second (-r).
  - name: time
    type: string
    description: Stop time, e.g. 2m (-t).
- name: locust-output
  description: Collect CSV results and run distributed tests.
  commands:
  - locust -f locustfile.py --headless -u 500 -r 50 --csv=results --csv-full-history -t 5m
  - locust -f locustfile.py --master --master-bind-port=5557 --csv=dist-results
  - locust -f locustfile.py --worker --master-host=10.0.0.10
  - ls results_*.csv
  examples:
  - locust -f locustfile.py --headless -u 500 -r 50 --csv=results --csv-full-history -t 5m
  - locust -f locustfile.py --worker --master-host=10.0.0.10
  - ls results_*.csv
  parameters:
  - name: csv
    type: string
    description: CSV output prefix.
  - name: csv_full_history
    type: boolean
    description: Log every stats sample, not just final.
  - name: master_bind_port
    type: integer
    description: Master port, default 5557.
knowledge:
- title: Locust Documentation
  type: documentation
  source: https://docs.locust.io/en/stable/
  description: 'Official Locust docs: users, tasks, configuration.'
- title: Locust Running Distributed
  type: documentation
  source: https://docs.locust.io/en/stable/running-distributed.html
  description: Master/worker distributed execution guide.
instructions: "# Locust\n\nLoad test with Python-defined user behavior.\n\n## What this skill does\n\n\
  - Runs Locust with HttpUser task classes.\n- Executes headless or interactive web UI runs.\n- Exports\
  \ CSV stats and distributes load with master/workers.\n\n## When to use\n\n- Simulating realistic user\
  \ journeys (login, browse, checkout).\n- Tests that need Python logic in the workload.\n- Distributed\
  \ load generation from many machines.\n\n## Real commands\n\n```bash\n# Headless: 1000 users, spawn\
  \ 100/s, 10 minutes\nlocust -f locustfile.py --headless -u 1000 -r 100 -t 10m \\\n  --host https://httpbin.org\n\
  \n# Web UI mode (http://localhost:8089)\nlocust -f locustfile.py\nlocust -f locustfile.py --web-port\
  \ 8089\n\n# CSV with full history\nlocust -f locustfile.py --headless -u 500 -r 50 \\\n  --csv=results\
  \ --csv-full-history -t 5m\n\n# Distributed\nlocust -f locustfile.py --master --master-bind-port=5557\n\
  locust -f locustfile.py --worker --master-host=10.0.0.10\n```\n\n## locustfile.py example\n\n```python\n\
  from locust import HttpUser, task, between\n\nclass CheckoutUser(HttpUser):\n    wait_time = between(1,\
  \ 5)\n\n    @task(3)\n    def browse(self):\n        self.client.get(\"/products\")\n\n    @task(1)\n\
  \    def checkout(self):\n        self.client.post(\"/api/orders\", json={\"product_id\": 7, \"qty\"\
  : 2})\n```\n\n## Testing\n\n```bash\nlocust -f locustfile.py --headless -u 10 -r 2 -t 30s   # smoke\
  \ run\n```\n\n## Best practices\n\n- Weight tasks with @task(n) to model realistic ratios.\n- Use wait_time\
  \ between requests; instant requests aren't realistic.\n- In distributed mode, scale workers until the\
  \ master's CPU stays under load.\n"
examples:
- input: Simulate 1000 shoppers for 10 minutes
  output: locust -f locustfile.py --headless -u 1000 -r 100 -t 10m --host https://httpbin.org
- input: Save full stats to CSV
  output: locust -f locustfile.py --headless --csv=results --csv-full-history -t 5m
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: locust-output.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-locust-output
  generic:
    system_prompt: 'You are the Locust Output specialist. You do it through locust-run: Run locust tests
      headless or with the web UI. The commands are real, e.g. `locust -f locustfile.py --headless -u
      1000 -r 100 --host https://httpbin.org`. You run and verify the real CLI commands before you
      claim anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
