  commands:
  - openssl rand -base64 32
  - python3 -c "import jwt,datetime; print(jwt.encode({'sub':'alice@example.com','aud':'magic-link','exp':datetime.datetime.utcnow()+datetime.timedelta(minutes=15)},
    open('private.pem').read(), algorithm='RS256'))"
  - 'npx jwt-cli encode --secret=dev-secret -P sub=alice@example.com -P exp=... '
  - python3 -c "import secrets; print(secrets.token_urlsafe(32))"
  examples:
  - python3 -c "import jwt,datetime; print(jwt.encode({'sub':'alice@example.com','aud':'magic-link','exp':datetime.datetime.utcnow()+datetime.timedelta(minutes=15)},
    open('private.pem').read(), algorithm='RS256'))"
  - openssl rand -base64 32
  - python3 -c "import secrets; print(secrets.token_urlsafe(32))"
