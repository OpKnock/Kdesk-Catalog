  - curl -s http://localhost:8080/auth/verify?token=TOKEN
  - redis-cli SETEX magic:alice@example.com 900 TOKEN
  - redis-cli GET magic:alice@example.com
  - curl -s http://localhost:8080/auth/verify?token=USED_TOKEN
  examples:
  - 'curl -s -X POST http://localhost:8080/auth/magic-link -H ''Content-Type: application/json'' -d ''{"email":"alice@example.com"}'''
  - curl -s http://localhost:8080/auth/verify?token=TOKEN
  - redis-cli SETEX magic:alice@example.com 900 TOKEN
