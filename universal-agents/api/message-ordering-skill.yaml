name: message-ordering
display_name: Message Ordering
category: api
subcategory: general
description: 'Ensure and verify ordered message delivery in Kafka: single-partition ordering, key-based
  partitioning, sequence checking, and the pitfalls of partition scaling.'
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
prerequisites:
- kafka-configs.sh
- kafka-console-consumer.sh
- kafka-console-producer.sh
- kafka-consumer-groups.sh
- kafka-topics.sh
- python3
capabilities:
- name: ordering-setup
  description: Configure topics and producers for strict ordering.
  commands:
  - kafka-topics.sh --bootstrap-server localhost:9092 --create --topic events --partitions 1 --replication-factor
    1
  - kafka-topics.sh --bootstrap-server localhost:9092 --create --topic orders --partitions 6 --replication-factor
    3
  - 'kafka-console-producer.sh --bootstrap-server localhost:9092 --topic orders --property parse.key=true
    --property key.separator=:'
  - kafka-configs.sh --bootstrap-server localhost:9092 --entity-type topics --entity-name orders --alter
    --add-config "max.in.flight.requests.per.connection=1"
  examples:
  - kafka-topics.sh --bootstrap-server localhost:9092 --create --topic events --partitions 1 --replication-factor
    1
  - 'kafka-console-producer.sh --bootstrap-server localhost:9092 --topic orders --property parse.key=true
    --property key.separator=:'
  - kafka-topics.sh --bootstrap-server localhost:9092 --create --topic orders --partitions 6 --replication-factor
    3
  parameters:
  - name: topic
    type: string
    description: Topic name.
  - name: partitions
    type: integer
    description: Partition count (1 = global ordering).
- name: ordering-verify
  description: Verify sequence integrity with consumers and scripts.
  commands:
  - kafka-console-consumer.sh --bootstrap-server localhost:9092 --topic events --from-beginning --max-messages
    100
  - kafka-console-consumer.sh --bootstrap-server localhost:9092 --topic orders --from-beginning --property
    print.key=true --property print.value=true --max-messages 50
  - kafka-consumer-groups.sh --bootstrap-server localhost:9092 --describe --group seq-check
  - python3 check_seq.py events
  examples:
  - kafka-console-consumer.sh --bootstrap-server localhost:9092 --topic events --from-beginning --max-messages
    100
  - kafka-console-consumer.sh --bootstrap-server localhost:9092 --topic orders --from-beginning --property
    print.key=true --property print.value=true --max-messages 50
  - python3 check_seq.py events
  parameters:
  - name: topic
    type: string
    description: Topic to verify.
  - name: max_messages
    type: integer
    description: Messages to read.
  - name: script
    type: string
    description: Sequence-checking script.
knowledge:
- title: Kafka Ordering Guarantees
  type: documentation
  source: https://kafka.apache.org/documentation/#semantics
  description: Kafka delivery semantics and ordering guarantees.
- title: Exactly-once semantics
  type: documentation
  source: https://kafka.apache.org/documentation/#semantics_exactlyonce
  description: Ordering with idempotent producers.
instructions: "# Message Ordering\n\nGuarantee and verify ordered delivery in Kafka.\n\n## What this skill\
  \ does\n\n- Sets up topics with the partition layout that preserves order.\n- Produces keyed records\
  \ so keys land in one partition.\n- Verifies sequence integrity with consumers and scripts.\n\n## When\
  \ to use\n\n- Event sourcing where event order matters.\n- State-machine events per entity (order lifecycle).\n\
  - Auditing whether a pipeline lost or reordered records.\n\n## Real commands\n\n```bash\n# Global ordering:\
  \ single partition\nkafka-topics.sh --bootstrap-server localhost:9092 \\\n  --create --topic events\
  \ --partitions 1 --replication-factor 1\n\n# Per-key ordering: partition by key\nkafka-topics.sh --bootstrap-server\
  \ localhost:9092 \\\n  --create --topic orders --partitions 6 --replication-factor 3\n\n# Produce keyed\
  \ records (key:value)\nkafka-console-producer.sh --bootstrap-server localhost:9092 \\\n  --topic orders\
  \ --property parse.key=true --property key.separator=:\n\n# Ordering with retries: keep in-flight requests\
  \ low\nkafka-configs.sh --bootstrap-server localhost:9092 \\\n  --entity-type topics --entity-name orders\
  \ --alter \\\n  --add-config \"max.in.flight.requests.per.connection=1\"\n\n# Verify: read with keys\n\
  kafka-console-consumer.sh --bootstrap-server localhost:9092 \\\n  --topic orders --from-beginning \\\
  \n  --property print.key=true --property print.value=true --max-messages 50\n\n# Verify: sequence check\
  \ via script\npython3 check_seq.py events\n```\n\n## Producer key example\n\n```bash\n# Same key =>\
  \ same partition => preserved order per entity\necho \"order-42:created\" | kafka-console-producer.sh\
  \ --bootstrap-server localhost:9092 --topic orders --property parse.key=true --property key.separator=:\n\
  echo \"order-42:paid\" | kafka-console-producer.sh --bootstrap-server localhost:9092 --topic orders\
  \ --property parse.key=true --property key.separator=:\n```\n\n## Testing\n\n```bash\n# check_seq.py\
  \ logic: seq must be strictly increasing per (topic, partition, key)\nkafka-console-consumer.sh --bootstrap-server\
  \ localhost:9092 \\\n  --topic events --from-beginning --max-messages 100 | \\\n  awk -F'[,:]' 'NR>1\
  \ && $2 <= prev {print \"OUT OF ORDER at \" NR} {prev=$2}'\n```\n\n## Best practices\n\n- Ordering is\
  \ per partition only: choose partitions=1 or a stable key.\n- Idempotent producers + acks=all avoid\
  \ duplicates without reordering.\n- Never reorder by retrying with a different key; the partition is\
  \ the order contract.\n"
examples:
- input: Guarantee order for order lifecycle events
  output: Use key=order-<id> with partitions=6; all events for one order land in the same partition in
    order.
- input: Verify events arrive in order
  output: kafka-console-consumer.sh --bootstrap-server localhost:9092 --topic events --from-beginning
    --max-messages 100 and check sequence numbers.
