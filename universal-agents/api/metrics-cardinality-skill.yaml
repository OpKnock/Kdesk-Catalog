name: metrics-cardinality
display_name: Metrics Cardinality
category: api
subcategory: general
description: 'Diagnose and fix high-cardinality metric problems in Prometheus: find exploding label values,
  top series, and identify offending scrape targets.'
version: 2.0.0
tags:
- api
author: Mehul Wagde
license: MIT
created_at: '2025-06-15T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
prerequisites:
- promtool
capabilities:
- name: cardinality-diagnosis
  description: Analyze a Prometheus TSDB to find high-cardinality series, top label combinations, and
    memory-heavy metrics.
  commands:
  - promtool tsdb analyze --help
  - promtool tsdb analyze /var/lib/prometheus/metrics2/
  - promtool tsdb series --match '{__name__=~".+"}' /var/lib/prometheus/metrics2/
  - curl -g 'http://localhost:9090/api/v1/query?query=topk(20,count%20by%20(__name__)({__name__%3D~%22.%2B%22}))'
  - curl -g 'http://localhost:9090/api/v1/query?query=count%20by%20(endpoint%2C%20method)(http_requests_total)'
  examples:
  - promtool tsdb analyze /var/lib/prometheus/metrics2/
  - curl -g 'http://localhost:9090/api/v1/query?query=topk(10,count%20by%20(__name__)({__name__=~".+"}))'
  - promtool tsdb series --match 'http_requests_total{status=~".*"}' /var/lib/prometheus/metrics2/
  parameters:
  - name: db_path
    type: string
    description: Path to the Prometheus TSDB directory
  - name: match
    type: string
    description: Label matcher used to filter series
  - name: topk
    type: integer
    description: Number of highest-cardinality metrics to return
knowledge:
- title: Prometheus Cardinality Best Practices
  type: documentation
  source: https://prometheus.io/docs/practices/instrumentation/
  description: Official guidance on avoiding high cardinality in label design
- title: promtool TSDB docs
  type: documentation
  source: https://prometheus.io/docs/prometheus/latest/command-line/promtool/
  description: promtool tsdb analyze, series and dump subcommands
instructions: "# Metrics Cardinality\n\nHigh cardinality (too many unique label-value combinations) is\
  \ the #1 cause of Prometheus memory and disk exhaustion.\n\n## What this skill does\n\n- Analyzes the\
  \ TSDB to find which metric names generate the most series\n- Lists the label value counts driving cardinality\
  \ (e.g. per-endpoint, per-user)\n- Recommends fixes: relabeling, metric redesign, or aggregation\n\n\
  ## When to use\n\n- Prometheus memory spikes or OOM kills on `metric_relabel_configs` host\n- Dashboards\
  \ are slow and `count by` queries time out\n- An endpoint suddenly creates millions of series\n\n##\
  \ Real commands\n\n```bash\n# Analyze whole TSDB for cardinality report\npromtool tsdb analyze /var/lib/prometheus/metrics2/\n\
  \n# List all series for a metric\npromtool tsdb series --match 'http_requests_total{status=~\".+\"}'\
  \ /var/lib/prometheus/metrics2/\n\n# Top 20 metric names by series count (HTTP API)\ncurl -g 'http://localhost:9090/api/v1/query?query=topk(20,count%20by%20(__name__)({__name__=~\"\
  .+\"}))'\n\n# Which endpoints/methods dominate a metric\ncurl -g 'http://localhost:9090/api/v1/query?query=count%20by%20(endpoint,%20method)(http_requests_total)'\n\
  ```\n\n## Fixing it\n\n```yaml\n# Drop the offending label at scrape time\nmetric_relabel_configs:\n\
  - source_labels: [user_id]\n  regex: '.*'\n  action: drop\n\n# Or aggregate away the cardinality in\
  \ recording rules\n- record: job:http_requests_total:rate5m\n  expr: sum(rate(http_requests_total[5m]))\
  \ by (job)\n```\n\n## Best practices\n\n- Limit label values that are unbounded (user IDs, emails, IPs)\n\
  - Keep cardinality per metric under ~10k series\n- Set `--storage.tsdb.retention.time` and alert on\
  \ `prometheus_tsdb_head_series`"
examples:
- input: Prometheus uses 30GB RAM and restarts often, what do I check first?
  output: The agent runs `promtool tsdb analyze` on the data directory, identifies the metric with the
    most series, and shows the relabel config to drop the exploding label.
- input: How many series does each of my metrics have right now?
  output: The agent queries `topk(20,count by (__name__)({__name__=~".+"}))` against the Prometheus HTTP
    API and explains the results.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: metrics-cardinality.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-metrics-cardinality
  generic:
    system_prompt: 'This is your domain: Metrics Cardinality. You do it through cardinality-diagnosis:
      Analyze a Prometheus TSDB to find high-cardinality series, top label combinations, and memory-heavy
      metrics. The commands are real, e.g. `promtool tsdb analyze --help`. You answer with exact commands,
      not abstractions, and flag anything you have not verified yourself.'
    available_tools:
