name: metrics
display_name: Metrics
category: api
subcategory: general
description: 'Instrument services with metrics: design metric names/labels, expose /metrics endpoints,
  and verify scrapes with promtool.'
version: 2.0.0
tags:
- api
author: Mehul Wagde
license: MIT
created_at: '2025-06-15T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
prerequisites:
- node_exporter
- promtool
capabilities:
- name: metrics-instrumentation
  description: Instrument applications with Prometheus metric types, expose an endpoint, and validate
    the output.
  commands:
  - promtool check metrics --extended /dev/stdin
  - curl -s http://localhost:9100/metrics
  - curl -s 'http://localhost:9090/api/v1/query?query=up'
  - node_exporter --collector.textfile.directory=/var/lib/node_exporter/textfile
  - promtool check config /etc/prometheus/prometheus.yml
  examples:
  - curl -s http://localhost:9100/metrics | grep node_cpu_seconds_total
  - curl -s http://localhost:9090/api/v1/query?query=up
  - promtool check metrics < my_metrics.txt
  parameters:
  - name: port
    type: integer
    description: Port the metrics endpoint listens on
  - name: namespace
    type: string
    description: Metric namespace prefix, e.g. app_name
  - name: labels
    type: array
    description: Consistent label set applied to every metric
knowledge:
- title: Prometheus Metric Types
  type: documentation
  source: https://prometheus.io/docs/concepts/metric_types/
  description: Counter, gauge, histogram and summary semantics
- title: Node Exporter
  type: documentation
  source: https://github.com/prometheus/node_exporter
  description: System metrics collector and textfile collector
instructions: '# Metrics


  Instrumenting services with Prometheus-style metrics gives you counters, gauges, histograms and summaries.


  ## What this skill does


  - Designs metric names and label sets for new services

  - Exposes a `/metrics` endpoint and validates its output with promtool

  - Verifies the Prometheus server is scraping successfully (`up`)


  ## When to use


  - Adding observability to a new microservice

  - Validating that scrapes and metrics are well-formed before wiring dashboards

  - Fixing duplicate metric names or bad label usage


  ## Real commands


  ```bash

  # Validate metric text format before shipping it

  promtool check metrics --extended /dev/stdin


  # Verify scrape target is up

  curl -s http://localhost:9090/api/v1/query?query=up


  # Inspect a node_exporter textfile metric

  curl -s http://localhost:9100/metrics | grep node_cpu_seconds_total


  # Expose textfile metrics for cron jobs

  node_exporter --collector.textfile.directory=/var/lib/node_exporter/textfile


  # Validate scrape config

  promtool check config /etc/prometheus/prometheus.yml

  ```


  ## Naming conventions


  - Counters end in `_total`; rates use `rate(metric[5m])`

  - Units in name: `_seconds`, `_bytes`, `_requests`

  - Keep labels consistent across all metrics of a service


  ## Textfile collector example


  ```bash

  printf ''my_batch_job_duration_seconds 42.5\n'' > /var/lib/node_exporter/textfile/job.prom

  ```


  ## Best practices


  - Prefix metric names with the app namespace

  - Expose on a dedicated port when possible

  - Never add high-cardinality labels (see metrics-cardinality-skill)'
examples:
- input: Add request metrics to my Go service
  output: The agent adds a counter/histogram pair, exposes them on /metrics with the promhttp handler,
    and validates with `promtool check metrics`.
- input: My scrape target shows as DOWN
  output: The agent checks `curl http://localhost:9090/api/v1/query?query=up`, verifies the exporter is
    listening on the expected port, and validates prometheus.yml with promtool.
