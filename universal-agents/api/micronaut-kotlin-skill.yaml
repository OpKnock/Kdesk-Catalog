name: micronaut-kotlin
display_name: Micronaut Kotlin
category: api
subcategory: general
description: 'Build Micronaut applications with the Kotlin language: scaffolding, controllers, coroutines,
  and Gradle/Kotlin DSL setup.'
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
prerequisites:
- ./gradlew
capabilities:
- name: micronaut-kotlin-scaffold
  description: Scaffold Kotlin Micronaut apps and services with the Micronaut CLI and manage the build.
  commands:
  - mn create-app com.example.demo --lang kotlin --build gradle
  - mn create-controller com.example.HelloController --lang kotlin
  - ./gradlew run
  - ./gradlew test
  - mn create-cli-app cli-app --lang kotlin
  examples:
  - mn create-app com.example.orders --lang kotlin --features kapt
  - ./gradlew run
  - ./gradlew test --tests com.example.HelloControllerTest
  parameters:
  - name: lang
    type: string
    description: kotlin (with kapt or ksp) or java
  - name: features
    type: array
    description: Micronaut features to include, e.g. kapt, data-jpa, kafka
  - name: build
    type: string
    description: gradle or maven
knowledge:
- title: Micronaut Kotlin Guide
  type: documentation
  source: https://docs.micronaut.io/latest/guide/index.html
  description: Official Micronaut docs including Kotlin and KSP support
- title: Micronaut CLI
  type: documentation
  source: https://micronaut-projects.github.io/micronaut-starter/latest/guide/
  description: mn CLI commands, create-app, create-controller options
instructions: "# Micronaut Kotlin\n\nMicronaut with Kotlin gives compile-time dependency injection and\
  \ first-class coroutines support.\n\n## What this skill does\n\n- Scaffolds Kotlin Micronaut projects\
  \ (Gradle or Maven)\n- Adds controllers, services and clients in Kotlin\n- Uses kapt/ksp for compile-time\
  \ DI processing\n\n## When to use\n\n- Starting a new Kotlin JVM microservice\n- Adding coroutine-based\
  \ endpoints to an existing Micronaut app\n- Configuring Kotlin-specific features (kotlinx.serialization,\
  \ ksp)\n\n## Real commands\n\n```bash\n# Create Kotlin app with Gradle\nmn create-app com.example.demo\
  \ --lang kotlin --build gradle\n\n# Add a controller\nmn create-controller com.example.HelloController\
  \ --lang kotlin\n\n# Run and test\n./gradlew run\n./gradlew test\n\n# CLI application (picocli)\nmn\
  \ create-cli-app cli-app --lang kotlin\n```\n\n## Coroutines controller\n\n```kotlin\n@Controller(\"\
  /hello\")\nclass HelloController {\n    @Get(\"/\") \n    suspend fun hello(): String = coroutineScope\
  \ { \"Hello from Kotlin\" }\n}\n```\n\n## build.gradle.kts essentials\n\n```kotlin\nplugins {\n    id(\"\
  org.jetbrains.kotlin.jvm\") version \"1.9.22\"\n    id(\"io.micronaut.library\") version \"4.2.1\"\n\
  }\n```\n\n## Best practices\n\n- Prefer KSP over kapt (`mn create-app --features kotlin,ksp`)\n- Use\
  \ `suspend` functions for non-blocking endpoints\n- Test with `./gradlew test` and MicronautTest annotation"
examples:
- input: Scaffold a new Kotlin Micronaut service for order processing
  output: The agent runs `mn create-app com.example.orders --lang kotlin --features ksp`, then creates
    a controller and shows the run/test workflow.
- input: My Kotlin endpoints block the event loop
  output: The agent rewrites the handlers as `suspend fun` coroutines and verifies with `./gradlew run`
    and curl.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: micronaut-kotlin.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-micronaut-kotlin
  generic:
    system_prompt: 'You take the Micronaut Kotlin seat. You do it through micronaut-kotlin-scaffold: Scaffold
      Kotlin Micronaut apps and services with the Micronaut CLI and manage the build. The commands are
      real, e.g. `mn create-app com.example.demo --lang kotlin --build gradle`. You answer with exact
      commands, not abstractions, and flag anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
