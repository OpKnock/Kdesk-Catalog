name: micronaut
display_name: Micronaut
category: api
subcategory: general
description: 'Create and operate Micronaut applications: project scaffolding, HTTP endpoints, config,
  and the mn CLI lifecycle.'
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
prerequisites:
- ./mvnw
capabilities:
- name: micronaut-project
  description: Scaffold, build, run and extend Micronaut projects using the mn CLI and build tools.
  commands:
  - mn create-app com.example.app --features data-jpa,mysql,kafka
  - mn create-graal-app com.example.native --features graalvm
  - ./mvnw mn:run
  - ./mvnw test
  - curl -s http://localhost:8080/health
  examples:
  - mn create-app com.example.books --features data-jpa,mysql
  - ./mvnw mn:run
  - curl -s http://localhost:8080/health
  parameters:
  - name: features
    type: array
    description: Comma-separated Micronaut features to enable
  - name: package
    type: string
    description: Base package for generated sources
  - name: build
    type: string
    description: maven or gradle
knowledge:
- title: Micronaut Documentation
  type: documentation
  source: https://docs.micronaut.io/latest/guide/
  description: 'Core guide: configuration, HTTP server, DI, AOP'
- title: Micronaut Health Endpoints
  type: documentation
  source: https://micronaut-projects.github.io/micronaut-micrometer/latest/guide/
  description: Health, readiness and liveness endpoint behavior
instructions: "# Micronaut\n\nMicronaut is a modern JVM microservice framework with compile-time dependency\
  \ injection and low startup memory.\n\n## What this skill does\n\n- Creates new Micronaut projects with\
  \ the `mn` CLI\n- Builds and runs them with Maven or Gradle\n- Explains config-driven HTTP servers,\
  \ health checks, and features\n\n## When to use\n\n- Greenfield JVM microservices where memory matters\n\
  - Moving from Spring Boot to a lighter runtime\n- Generating GraalVM native images\n\n## Real commands\n\
  \n```bash\n# Create app with features\nmn create-app com.example.app --features data-jpa,mysql,kafka\n\
  \n# Run via Maven wrapper\n./mvnw mn:run\n\n# Run tests\n./mvnw test\n\n# Health check\ncurl -s http://localhost:8080/health\n\
  \n# GraalVM native build\nmn create-graal-app com.example.native --features graalvm\n```\n\n## application.yml\n\
  \n```yaml\nmicronaut:\n  application:\n    name: app\n  server:\n    port: 8080\n```\n\n## REST controller\n\
  \n```java\n@Controller(\"/books\")\npublic class BookController {\n    @Get(\"/\")\n    public List<Book>\
  \ list() { return repo.findAll(); }\n}\n```\n\n## Best practices\n\n- Use `mn create-app --features`\
  \ to pull in only what you need\n- Verify readiness via `/health` before routing traffic\n- Keep config\
  \ externalized in environment variables"
examples:
- input: Create a new Micronaut REST API with MySQL persistence
  output: The agent runs `mn create-app com.example.books --features data-jpa,mysql`, then builds the
    entity/repository/controller and starts it with `./mvnw mn:run`.
- input: Which features does the mn CLI support?
  output: The agent runs `mn create-app --help` and summarizes available features like kafka, redis, graphql,
    and native-image.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: micronaut.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-micronaut
  generic:
    system_prompt: 'Your lane is Micronaut. You do it through micronaut-project: Scaffold, build, run
      and extend Micronaut projects using the mn CLI and build tools. The commands are real, e.g. `mn
      create-app com.example.app --features data-jpa,mysql,kafka`. You answer with exact commands, not
      abstractions, and flag anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
