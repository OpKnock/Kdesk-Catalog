name: mqtt-emqx
display_name: Mqtt Emqx
category: api
subcategory: general
description: 'Operate EMQX MQTT brokers: start/stop, cluster status, publish/subscribe via emqx ctl, and
  dashboard access.'
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
prerequisites:
- emqx
capabilities:
- name: emqx-broker-operations
  description: Control the EMQX broker daemon and inspect clusters, subscriptions and message traffic
    with emqx ctl.
  commands:
  - emqx start
  - emqx ctl status
  - emqx ctl broker pub test/topic "hello"
  - emqx ctl broker sub test/topic
  - emqx ctl cluster status
  examples:
  - emqx ctl broker pub demo/temp "21.5" --qos 1
  - emqx ctl broker sub demo/temp --qos 1
  - emqx ctl listener list
  parameters:
  - name: topic
    type: string
    description: MQTT topic to publish or subscribe to
  - name: qos
    type: integer
    description: Quality of service level 0, 1 or 2
  - name: payload
    type: string
    description: Message payload to publish
