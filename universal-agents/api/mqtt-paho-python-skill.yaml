capabilities:
- name: paho-python-client
  description: Install paho-mqtt and build pub/sub clients with the callback-based Python API.
  commands:
  - pip install paho-mqtt
  - python3 -m pip show paho-mqtt
  - python3 pub.py -h localhost -t sensors/temp -m 21.5
  - python3 sub.py -h localhost -t sensors/#
  - python3 -c "import paho.mqtt.client as mqtt; print(mqtt.__version__ if hasattr(mqtt,'__version__')
    else 'ok')"
  examples:
  - python3 sub.py -h broker.example.com -p 8883 --cafile ca.crt -t '#'
  - python3 pub.py -t orders/new -m '{"id":1}' -q 1
  - python3 -c "import paho.mqtt.client as mqtt; c=mqtt.Client(); c.connect('localhost',1883); c.publish('t','m');
    c.disconnect()"
