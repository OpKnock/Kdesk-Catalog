  description: Installation and version history
instructions: "# Paho MQTT Python\n\npaho-mqtt is the standard Python MQTT client, used in IoT scripts\
  \ and backend services alike.\n\n## What this skill does\n\n- Installs paho-mqtt and verifies the import\n\
  - Writes publish/subscribe scripts with the callback model\n- Configures TLS and retained messages\n\
  \n## When to use\n\n- Quick IoT prototypes and data pipelines\n- Python services that emit or consume\
  \ events\n\n## Real commands\n\n```bash\n# Install\npip install paho-mqtt\npython3 -m pip show paho-mqtt\n\
  \n# Run scripts (write pub.py / sub.py)\npython3 pub.py -h localhost -t sensors/temp -m 21.5\npython3\
  \ sub.py -h localhost -t sensors/#\n```\n\n## Publisher\n\n```python\nimport paho.mqtt.client as mqtt\n\
  c = mqtt.Client()\nc.connect(\"localhost\", 1883)\nc.publish(\"sensors/temp\", \"21.5\", qos=1)\nc.disconnect()\n\
  ```\n\n## Subscriber with callbacks\n\n```python\ndef on_message(client, userdata, msg):\n    print(f\"\
  {msg.topic}: {msg.payload.decode()}\")\n\nc = mqtt.Client()\nc.on_message = on_message\nc.connect(\"\
  localhost\", 1883)\nc.subscribe(\"sensors/#\", qos=0)\nc.loop_forever()\n```\n\n## TLS\n\n```python\n\
  c.tls_set(ca_certs=\"ca.crt\", certfile=\"client.crt\", keyfile=\"client.key\")\nc.connect(\"broker.example.com\"\
  , 8883)\n```\n\n## Best practices\n\n- Call `loop_start()`/`loop_forever()` consistently\n- Set a Client\
  \ ID for persistent sessions\n- Keep QoS 0 for telemetry, QoS 1 for events that matter"
examples:
- input: Send device telemetry to my broker every 10 seconds
  output: The agent writes a loop script using paho-mqtt with a retained QoS 1 publish and verifies it
    with a mosquitto_sub listener.
- input: My Python subscriber stops receiving after a network blip
  output: The agent adds reconnect logic via `client.on_disconnect` + `loop_forever(retry_first_connection=True)`.
