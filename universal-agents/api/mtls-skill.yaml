name: mtls
display_name: Mtls
category: api
subcategory: general
description: 'Mutual TLS (mTLS) setup: CA creation, server/client certificates, TLS verification, and
  enforcing mutual authentication.'
version: 2.0.0
tags:
- api
author: Kdesk
license: MIT
prerequisites:
- openssl
capabilities:
- name: mtls-certificates
  description: Create a CA and issue server/client certificates, then verify mTLS handshakes with curl
    and openssl.
  commands:
  - openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.crt -days 365 -subj "/CN=my-ca"
  - openssl req -newkey rsa:2048 -nodes -keyout server.key -out server.csr -subj "/CN=localhost"
  - openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out server.crt -days 365
  - curl --cacert ca.crt --cert client.crt --key client.key https://localhost:8443/api
  - openssl s_client -connect localhost:8443 -cert client.crt -key client.key -CAfile ca.crt
  examples:
  - openssl verify -CAfile ca.crt server.crt
  - curl -v --cacert ca.crt --cert client.crt --key client.key https://localhost:8443/health
  - openssl s_client -connect localhost:8443 -CAfile ca.crt 2>&1 | grep -i 'verify return'
  parameters:
  - name: ca_cert
    type: string
    description: Path to the CA certificate bundle
  - name: client_cert
    type: string
    description: Client certificate for mutual auth
  - name: endpoint
    type: string
    description: TLS endpoint URL to verify
knowledge:
- title: OpenSSL man pages
  type: documentation
  source: https://www.openssl.org/docs/manmaster/man1/
  description: openssl req, x509, s_client and verify reference
- title: mTLS Explained (Cloudflare)
  type: documentation
  source: https://www.cloudflare.com/learning/access-management/what-is-mutual-tls/
  description: Conceptual overview of mutual TLS
instructions: "# mTLS\n\nMutual TLS authenticates both peers: the server presents a cert and the client\
  \ presents its own, both verified against a shared CA.\n\n## What this skill does\n\n- Generates a CA\
  \ and issues server/client certificates\n- Configures services to require client certificates\n- Verifies\
  \ handshakes and certificate chains\n\n## When to use\n\n- Service-to-service authentication in production\n\
  - Replacing API tokens with certificate identity\n- Zero-trust network segmentation\n\n## Real commands\n\
  \n```bash\n# 1. CA\nopenssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.crt -days 365 -subj\
  \ \"/CN=my-ca\"\n\n# 2. Server certificate signed by CA\nopenssl req -newkey rsa:2048 -nodes -keyout\
  \ server.key -out server.csr -subj \"/CN=localhost\"\nopenssl x509 -req -in server.csr -CA ca.crt -CAkey\
  \ ca.key -CAcreateserial -out server.crt -days 365\n\n# 3. Client certificate (same flow, CN=client-1)\n\
  openssl req -newkey rsa:2048 -nodes -keyout client.key -out client.csr -subj \"/CN=client-1\"\nopenssl\
  \ x509 -req -in client.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out client.crt -days 365\n\n# 4.\
  \ Verify chain\nopenssl verify -CAfile ca.crt server.crt client.crt\n\n# 5. Test the handshake\ncurl\
  \ --cacert ca.crt --cert client.crt --key client.key https://localhost:8443/api\nopenssl s_client -connect\
  \ localhost:8443 -cert client.crt -key client.key -CAfile ca.crt\n```\n\n## Server-side enforcement\
  \ (nginx example)\n\n```nginx\nserver {\n    listen 8443 ssl;\n    ssl_certificate     server.crt;\n\
  \    ssl_certificate_key server.key;\n    ssl_client_certificate ca.crt;\n    ssl_verify_client on;\n\
  \    ssl_verify_depth 2;\n}\n```\n\n## Best practices\n\n- Keep the CA key offline; issue certs with\
  \ short lifetimes\n- Set `ssl_verify_client optional` during rollout, then `on`\n- Verify with `openssl\
  \ s_client` before wiring clients"
examples:
- input: Set up mTLS between my API and a batch worker
  output: The agent creates the CA and both certificates, configures the API to require client certs,
    and tests with curl using --cert/--key.
- input: A client fails with certificate verify failed
  output: The agent runs `openssl verify -CAfile ca.crt client.crt` and checks hostname/CN matching and
    CA mismatch.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: mtls.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-mtls
  generic:
    system_prompt: 'You take the Mtls seat. You do it through mtls-certificates: Create a CA and issue
      server/client certificates, then verify mTLS handshakes with curl and openssl. The commands are
      real, e.g. `openssl req -x509 -newkey rsa:2048 -nodes -keyout ca.key -out ca.crt -days 365 -subj...`.
      You prefer the shortest safe path, and you reproduce failures before diagnosing them.'
    available_tools:
    - bash
    - read
    - write
    - edit
