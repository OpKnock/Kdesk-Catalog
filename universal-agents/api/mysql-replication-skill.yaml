name: mysql-replication
display_name: Mysql Replication
category: api
subcategory: general
description: 'Set up and manage MySQL source/replica replication: binary log config, CHANGE REPLICATION
  SOURCE TO, and replica health checks.'
version: 2.0.0
tags:
- api
author: Kdesk
license: MIT
prerequisites:
- mysql
capabilities:
- name: mysql-replication-setup
  description: Configure binary logging, start/stop replicas, and monitor replication lag using mysql
    client SQL.
  commands:
  - mysql -u root -p -e "SHOW MASTER STATUS;"
  - mysql -u root -p -e "SHOW BINARY LOGS;"
  - mysql -u root -p -e "SHOW REPLICA STATUS\G"
  - mysql -u root -p -e "START REPLICA;"
  - mysql -u root -p -e "STOP REPLICA; RESET REPLICA ALL;"
  examples:
  - mysql -u root -p -e "CHANGE REPLICATION SOURCE TO SOURCE_HOST='10.0.0.2', SOURCE_USER='repl', SOURCE_PASSWORD='secret',
    SOURCE_LOG_FILE='mysql-bin.000123', SOURCE_LOG_POS=154;"
  - mysqldump -u root -p --all-databases --source-data=2 > dump.sql
  - mysql -u root -p -e "SELECT * FROM performance_schema.replication_connection_status\G"
  parameters:
  - name: source_host
    type: string
    description: Host of the replication source
  - name: source_log_file
    type: string
    description: Binary log file from SHOW MASTER STATUS
  - name: source_log_pos
    type: integer
    description: Binary log position to replicate from
knowledge:
- title: MySQL Replication docs
  type: documentation
  source: https://dev.mysql.com/doc/refman/8.0/en/replication.html
  description: Replication configuration, SQL statements and troubleshooting
- title: CHANGE REPLICATION SOURCE TO
  type: documentation
  source: https://dev.mysql.com/doc/refman/8.0/en/change-replication-source-to.html
  description: Full syntax reference for configuring a replica
instructions: '# MySQL Replication


  MySQL replication copies changes from a source server to one or more replicas via the binary log.


  ## What this skill does


  - Enables binary logging and creates a replication user

  - Points a replica at a source with CHANGE REPLICATION SOURCE TO

  - Monitors lag, errors and thread state


  ## When to use


  - Read scaling and HA architectures

  - Migrating to a new server with minimal downtime

  - Backing up without locking the source


  ## Real commands


  ```bash

  # On the source: check binlog position

  mysql -u root -p -e "SHOW MASTER STATUS;"

  mysql -u root -p -e "SHOW BINARY LOGS;"


  # Create replication user on source

  mysql -u root -p -e "CREATE USER ''repl''@''%'' IDENTIFIED BY ''secret''; GRANT REPLICATION SLAVE ON
  *.* TO ''repl''@''%'';"


  # On the replica: point at source

  mysql -u root -p -e "CHANGE REPLICATION SOURCE TO SOURCE_HOST=''10.0.0.2'', SOURCE_USER=''repl'', SOURCE_PASSWORD=''secret'',
  SOURCE_LOG_FILE=''mysql-bin.000123'', SOURCE_LOG_POS=154;"


  # Start and verify

  mysql -u root -p -e "START REPLICA;"

  mysql -u root -p -e "SHOW REPLICA STATUS\G"

  ```


  ## Initial snapshot


  ```bash

  mysqldump -u root -p --all-databases --source-data=2 > dump.sql

  mysql -u root -p < dump.sql

  ```


  ## Config (source)


  ```ini

  [mysqld]

  server-id=1

  log_bin=mysql-bin

  binlog_format=ROW

  gtid_mode=ON

  enforce_gtid_consistency=ON

  ```


  ## Best practices


  - Use GTID-based replication on 8.x

  - Watch `Seconds_Behind_Source` and `Last_SQL_Errno`

  - Test failover by promoting the replica before you need it'
examples:
- input: Set up a read replica for my production database
  output: The agent configures server-id/log_bin on the source, dumps with --source-data=2, and issues
    CHANGE REPLICATION SOURCE TO on the replica.
- input: Replication stopped with an SQL error
  output: The agent reads SHOW REPLICA STATUS output, identifies Last_SQL_Errno, and shows how to skip
    or re-seed the affected statement.
