- pip
- python3
capabilities:
- name: nats-python-client
  description: Install nats-py and write async Python clients for core NATS and JetStream.
  commands:
  - pip install nats-py
  - python3 -m pip show nats-py
  - python3 pub.py
  - python3 sub.py
  - python3 -c "import nats; print(nats.__version__)"
  examples:
  - python3 sub.py
  - python3 -m asyncio
  - python3 req.py
  parameters:
  - name: url
    type: string
    description: Server URL including user/pass if needed
  - name: subject
    type: string
    description: Subject or wildcard filter
  - name: queue
    type: string
    description: Queue group name
knowledge:
- title: nats.py GitHub
  type: documentation
