- title: nats-py on PyPI
  type: documentation
  source: https://pypi.org/project/nats-py/
  description: Package metadata and version history
instructions: "# NATS Python Client\n\nnats-py is the official asyncio-based NATS client for Python.\n\
  \n## What this skill does\n\n- Connects asynchronously with reconnect policies\n- Publishes/subscribes\
  \ and does request-reply\n- Consumes from JetStream streams\n\n## When to use\n\n- Python data pipelines\
  \ and workers\n- Async services in the NATS ecosystem\n\n## Real commands\n\n```bash\npip install nats-py\n\
  python3 -m pip show nats-py\npython3 pub.py\npython3 sub.py\n```\n\n## Subscribe\n\n```python\nimport\
  \ asyncio, nats\n\nasync def main():\n    nc = await nats.connect(\"nats://localhost:4222\")\n    sub\
  \ = await nc.subscribe(\"orders.*\")\n    async for msg in sub:\n        print(f\"{msg.subject}: {msg.data.decode()}\"\
  )\n        await msg.ack()\n\nasyncio.run(main())\n```\n\n## Publish + request\n\n```python\nawait nc.publish(\"\
  orders.created\", b\"{\\\"id\\\":1}\")\nresp = await nc.request(\"service.echo\", b\"ping\", timeout=2)\n\
  print(resp.data)\n```\n\n## JetStream consumer\n\n```python\njs = nc.jetstream()\npull = await js.pull_subscribe(\"\
  orders\", \"worker\")\nmsgs = await pull.fetch(10)\n```\n\n## Best practices\n\n- Use `await nc.drain()`\
  \ on shutdown to flush pending\n- Prefer async contexts; avoid blocking calls in the loop\n- Use queue\
  \ groups for competing consumers"
examples:
- input: Write a Python worker that processes order events
  output: The agent writes an asyncio subscriber on orders.* with ack handling and a queue group for scaling.
- input: Send a request to a NATS service from Python
  output: The agent uses nc.request with a timeout and shows the reply handler.
