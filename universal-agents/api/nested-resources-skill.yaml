name: nested-resources
display_name: Nested Resources
category: api
subcategory: general
description: 'Designs and tests REST API nested resource hierarchies with URI structures, depth limits, pagination, and RFC 8288 Link headers for client navigation.'
version: 2.0.0
tags:
- api
author: Kdesk
license: MIT
capabilities:
- name: nested-resource-design
  description: 'Design and test nested REST resources: URI structure, sub-resources, and linked navigation.'
  commands:
  - 'curl -s https://api.your-app.test/v1/users/42/posts'
  - 'curl -s https://api.your-app.test/v1/users/42/posts/7/comments'
  - 'curl -sI https://api.your-app.test/v1/users/42/posts'
  - 'curl -s https://api.your-app.test/v1/users/42/posts?page=2&per_page=20'
  - 'curl -s https://api.your-app.test/v1/users/42/posts/7 | jq ''.links'''
  examples:
  - 'curl -s https://api.your-app.test/v1/teams/3/members/5 | jq .'
  - 'curl -s ''https://api.your-app.test/v1/users/42/posts?sort=created_at.desc'' | jq ''.data'''
  - 'curl -sI -X POST -H ''Content-Type: application/json'' -d ''{"title":"t"}'' https://api.your-app.test/v1/users/42/posts | grep -i location'
  parameters:
  - name: base_url
    type: string
    description: API base URL
  - name: parent_resource
    type: string
    description: Parent resource path segment
  - name: depth
    type: integer
    description: Maximum nesting depth allowed
knowledge:
- title: Microsoft REST API design
  type: documentation
  source: https://learn.microsoft.com/en-us/azure/architecture/best-practices/api-design
  description: URI design, nesting and resource modeling guidance
- title: RESTful API Design (Fowler)
  type: documentation
  source: https://restfulapi.net/resource-naming/
  description: Resource naming and sub-resource conventions
instructions: "# Nested Resources\n\nNested resources model parent-child relationships directly in the\
  \ URI, e.g. /users/{id}/posts/{postId}.\n\n## What this skill does\n\n- Designs URI hierarchies that\
  \ mirror domain relationships\n- Decides when nesting is appropriate vs top-level resources\n- Tests\
  \ endpoints and link relations with curl\n\n## When to use\n\n- Designing a new REST API from scratch\n\
  - Reviewing an API where nesting is inconsistent\n\n## Real commands\n\n```bash\n# Collection under\
  \ a parent\ncurl -s https://api.your-app.test/v1/users/42/posts\n\n# Deep nesting (avoid beyond 2 levels)\n\
  curl -s https://api.your-app.test/v1/users/42/posts/7/comments\n\n# Pagination on a nested collection\n\
  curl -s 'https://api.your-app.test/v1/users/42/posts?page=2&per_page=20'\n\n# Inspect links for navigation\n\
  curl -s https://api.your-app.test/v1/users/42/posts/7 | jq '.links'\n\n# Create returns 201 + Location\n\
  curl -sI -X POST -H 'Content-Type: application/json' \\\n  -d '{\"title\":\"t\"}' https://api.your-app.test/v1/users/42/posts\
  \ | grep -i location\n```\n\n## Design rules\n\n- Nest only genuine compositions (posts belong to user)\n\
  - Never nest more than 2 levels; use query params for filters\n- Reference cross-aggregates by ID (e.g.\
  \ /posts/{id}/author)\n\n## Alternative when flat\n\n```\nGET /posts?author=42\nPOST /posts { \"user_id\"\
  : 42 }\n```\n\n## Best practices\n\n- Return `Link` headers or a `links` object for navigation\n- Keep\
  \ names plural and consistent across levels\n- Document depth limit in the OpenAPI spec"
examples:
- input: Should comments be nested under posts?
  output: The agent evaluates the relationship and recommends /posts/{id}/comments, with pagination and
    Link headers.
- input: My API has /users/1/orders/1/items/1, is that too deep?
  output: The agent explains the 2-level rule and shows how to flatten to /items?order=1.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: nested-resources.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-nested-resources
  generic:
    system_prompt: 'You are the Nested Resources specialist. You do it through nested-resource-design:
      Design and test nested REST resources: URI structure, sub-resources, and linked navigation. The
      commands are real, e.g. `curl -s https://api.your-app.test/v1/users/42/posts`. You run and verify
      the real CLI commands before you claim anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
