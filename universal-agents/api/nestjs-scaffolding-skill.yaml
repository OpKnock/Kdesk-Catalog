name: nestjs-scaffolding
display_name: Nestjs Scaffolding
category: api
subcategory: general
description: 'Build NestJS applications: scaffolding, modules, controllers, providers, guards, and CLI
  code generation.'
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
prerequisites:
- nest
- npm
capabilities:
- name: nestjs-scaffolding
  description: Scaffold NestJS projects and generate modules, controllers, services and guards with the
    Nest CLI.
  commands:
  - nest new my-app --package-manager npm
  - nest g module auth
  - nest g controller users
  - nest g service users
  - npm run start:dev
  examples:
  - nest g guard roles --flat
  - nest g interceptor logging --flat
  - npm run lint
  parameters:
  - name: package_manager
    type: string
    description: npm, yarn or pnpm
  - name: name
    type: string
    description: Component name for code generation
  - name: flat
    type: boolean
    description: Skip the subdirectory when generating
knowledge:
- title: NestJS Documentation
  type: documentation
  source: https://docs.nestjs.com/
  description: Modules, controllers, providers, guards, interceptors
- title: Nest CLI Reference
  type: documentation
  source: https://docs.nestjs.com/cli/usages
  description: nest new and nest g usage details
instructions: "# NestJS\n\nNestJS is a progressive Node.js framework with TypeScript, dependency injection\
  \ and a modular architecture.\n\n## What this skill does\n\n- Scaffolds projects and generates components\
  \ with the CLI\n- Structures modules, controllers and providers\n- Adds guards, interceptors and validation\n\
  \n## When to use\n\n- TypeScript backend services with structure\n- Teams that want conventions and\
  \ DI\n\n## Real commands\n\n```bash\n# New project\nnest new my-app --package-manager npm\n\n# Generate\
  \ components\nnest g module auth\nnest g controller users\nnest g service users\nnest g guard roles\
  \ --flat\n\n# Develop\nnpm run start:dev\nnpm run lint\n```\n\n## Minimal controller\n\n```typescript\n\
  @Controller('users')\nexport class UsersController {\n  constructor(private readonly users: UsersService)\
  \ {}\n  @Get(':id')\n  findOne(@Param('id') id: string) { return this.users.findOne(id); }\n}\n```\n\
  \n## Module wiring\n\n```typescript\n@Module({\n  controllers: [UsersController],\n  providers: [UsersService],\n\
  })\nexport class UsersModule {}\n```\n\n## Best practices\n\n- One module per domain feature\n- Use\
  \ guards for auth, pipes for validation\n- Run `npm run lint` and `npm run build` before commit"
examples:
- input: Create a users API with CRUD in NestJS
  output: The agent scaffolds with nest new, generates module/controller/service, and shows the CRUD endpoints.
- input: Add JWT auth to my NestJS app
  output: The agent creates an auth module with a guard, wires the JWT strategy and protects routes with
    @UseGuards.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: nestjs-scaffolding.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-nestjs-scaffolding
  generic:
    system_prompt: 'You are the Nestjs Scaffolding specialist. You do it through nestjs-scaffolding: Scaffold
      NestJS projects and generate modules, controllers, services and guards with the Nest CLI. The commands
      are real, e.g. `nest new my-app --package-manager npm`. You run and verify the real CLI commands
      before you claim anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
