name: network-partition-testing
display_name: Network Partition Testing
category: api
subcategory: general
description: 'Injects network faults with tc netem for latency and packet loss, drops traffic via iptables, and captures packets with tcpdump to validate service resilience under partitions.'
version: 2.0.0
tags:
- api
author: Kdesk
license: MIT
prerequisites:
- iptables
- tcpdump
capabilities:
- name: network-fault-injection
  description: Inject link loss/latency with tc netem, drop traffic with iptables, and capture traffic
    with tcpdump.
  commands:
  - tc qdisc add dev eth0 root netem loss 100%
  - tc qdisc change dev eth0 root netem loss 10% latency 200ms
  - tc qdisc del dev eth0 root
  - iptables -A INPUT -s 10.0.0.2 -j DROP
  - tcpdump -i eth0 -c 20 host 10.0.0.2 -w capture.pcap
  examples:
  - tc qdisc add dev eth0 root netem delay 500ms 100ms distribution normal
  - iptables -D INPUT -s 10.0.0.2 -j DROP
  - tc qdisc show dev eth0
  parameters:
  - name: interface
    type: string
    description: Network interface to modify
  - name: loss_percent
    type: integer
    description: Packet loss percentage
  - name: target_host
    type: string
    description: Host IP for iptables/tcpdump rules
knowledge:
- title: tc-netem man page
  type: documentation
  source: https://man7.org/linux/man-pages/man8/tc-netem.8.html
  description: Latency, loss, duplication and corruption emulation
- title: tcpdump man page
  type: documentation
  source: https://man7.org/linux/man-pages/man8/tcpdump.8.html
  description: Traffic capture and filtering options
instructions: "# Network Partition Testing\n\nVerify that services survive partitions, latency and packet\
  \ loss before they happen in production.\n\n## What this skill does\n\n- Emulates packet loss/latency\
  \ with tc netem\n- Drops traffic selectively with iptables\n- Captures traffic to confirm behavior\n\
  \n## When to use\n\n- Chaos engineering for distributed systems\n- Validating retries, timeouts and\
  \ circuit breakers\n\n## Real commands\n\n```bash\n# Full partition: drop all packets on the link\n\
  \ tc qdisc add dev eth0 root netem loss 100%\n\n# Partial failure: 10% loss + 200ms latency\n tc qdisc\
  \ change dev eth0 root netem loss 10% latency 200ms\n\n# Restore\n tc qdisc del dev eth0 root\n\n# Drop\
  \ all traffic from one host (test cluster isolation)\n iptables -A INPUT -s 10.0.0.2 -j DROP\n iptables\
  \ -D INPUT -s 10.0.0.2 -j DROP   # undo\n\n# Capture for verification\n tcpdump -i eth0 -c 20 host 10.0.0.2\
  \ -w capture.pcap\n```\n\n## Verify impact\n\n```bash\nping -c 5 10.0.0.2\ncurl -s -o /dev/null -w \"\
  %{time_total}\\n\" http://10.0.0.2:8080/health\n```\n\n## Best practices\n\n- Start with small loss\
  \ percentages, then escalate\n- Always schedule automatic revert (tc qdisc del)\n- Run against staging,\
  \ never production without care"
examples:
- input: Simulate a 5-minute total partition between app and database
  output: The agent drops the link with netem 100% for the window, monitors the app's reconnect behavior,
    then restores it.
- input: My service crashes on 200ms latency
  output: The agent injects latency with netem, observes timeouts, and fixes client timeouts/retries.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: network-partition-testing.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-network-partition-testing
  generic:
    system_prompt: 'You own Network Partition Testing end to end. You do it through network-fault-injection:
      Inject link loss/latency with tc netem, drop traffic with iptables, and capture traffic with tcpdump.
      The commands are real, e.g. `tc qdisc add dev eth0 root netem loss 100%`. You verify each step you
      report and stay honest about what you have not run.'
    available_tools:
    - bash
    - read
    - write
    - edit
