name: newrelic-monitoring
display_name: Newrelic Monitoring
category: api
subcategory: general
description: 'Operates New Relic APM agents, runs NRQL queries against telemetry, searches entities, and manages dashboards and alert conditions via the New Relic CLI.'
version: 2.0.0
tags:
- api
author: Kdesk
license: MIT
prerequisites:
- newrelic
capabilities:
- name: newrelic-apm-operations
  description: Install APM agents, query telemetry with NRQL, and inspect entities via the New Relic CLI.
  commands:
  - newrelic entity search --name "my-app"
  - newrelic nrql "SELECT count(*) FROM Transaction SINCE 1 hour ago"
  - 'newrelic nerdgraph query --apiKey $NR_API_KEY --query ''{ actor { account(id: 1) { name } } }'''
  - newrelic diagnostics run
  - 'curl -s ''https://api.newrelic.com/v2/applications.json'' -H ''Api-Key: $NR_API_KEY'''
  examples:
  - newrelic nrql "SELECT average(duration) FROM Transaction WHERE appName = 'my-app' SINCE 1 day ago"
  - newrelic entity search --domain APM --type APPLICATION
  - newrelic diagnostics run
  parameters:
  - name: nrql
    type: string
    description: NRQL query string
  - name: app_name
    type: string
    description: APM application name
  - name: api_key
    type: string
    description: New Relic API key
knowledge:
- title: New Relic Documentation
  type: documentation
  source: https://docs.newrelic.com/
  description: APM agents, NRQL, dashboards and alerts
- title: New Relic CLI GitHub
  type: documentation
  source: https://github.com/newrelic/newrelic-cli
  description: newrelic entity/nrql/nerdgraph command reference
instructions: "# New Relic Monitoring\n\nInstrument apps with New Relic APM and drive it from the CLI\
  \ for instant answers.\n\n## What this skill does\n\n- Installs and configures APM agents\n- Runs NRQL\
  \ queries against telemetry\n- Manages entities and dashboards\n\n## When to use\n\n- Debugging slow\
  \ transactions\n- Verifying agent health after deployment\n\n## Real commands\n\n```bash\n# Entity search\n\
  newrelic entity search --name \"my-app\"\nnewrelic entity search --domain APM --type APPLICATION\n\n\
  # NRQL queries\nnewrelic nrql \"SELECT count(*) FROM Transaction SINCE 1 hour ago\"\nnewrelic nrql \"\
  SELECT average(duration) FROM Transaction WHERE appName = 'my-app' SINCE 1 day ago\"\n\n# GraphQL access\n\
  newrelic nerdgraph query --apiKey $NR_API_KEY \\\n  --query '{ actor { account(id: 1) { name } } }'\n\
  \n# Agent diagnostics\nnewrelic diagnostics run\n```\n\n## APM agent config (Node example)\n\n```env\n\
  NEW_RELIC_LICENSE_KEY=xxxx\nNEW_RELIC_APP_NAME=my-app\nNEW_RELIC_LOG_LEVEL=info\n```\n\n```js\nrequire('newrelic');\n\
  ```\n\n## Best practices\n\n- Use the same app name across all instances\n- Query with explicit SINCE\
  \ windows to bound cost\n- Alert on NRQL conditions, not static thresholds"
examples:
- input: Which transactions are slow in the last hour?
  output: The agent runs a NRQL query for slow Transaction segments and drills into the worst ones.
- input: My app stopped reporting to New Relic
  output: The agent runs newrelic diagnostics run and checks license key and app name config.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: newrelic-monitoring.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-newrelic-monitoring
  generic:
    system_prompt: 'You are the Newrelic Monitoring specialist. You do it through newrelic-apm-operations:
      Install APM agents, query telemetry with NRQL, and inspect entities via the New Relic CLI. The commands
      are real, e.g. `newrelic entity search --name my-app`. You verify each step you report and stay
      honest about what you have not run.'
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2025-06-15T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
