name: oauth2-introspection
display_name: Oauth2 Introspection
category: api
subcategory: general
description: 'Validates OAuth2 access and refresh tokens against RFC 7662 introspection endpoints. Checks token active status, scopes, and expiration with client credentials authentication.'
version: 2.0.0
tags:
- api
author: Kdesk
license: MIT
capabilities:
- name: token-introspection
  description: Introspect access/refresh tokens against RFC 7662 endpoints to check validity and scopes.
  commands:
  - curl -X POST https://auth.your-app.test/introspect -d "token=eyJhbGciOi..." -u client-id:client-secret
  - curl -X POST https://auth.your-app.test/introspect -d "token=eyJhbGciOi..." -d "token_type_hint=access_token"
    -u client-id:client-secret
  - curl -X POST http://localhost:8080/realms/myrealm/protocol/openid-connect/token/introspect -d "token=eyJhbGciOi..."
    -u client-id:client-secret
  - 'curl -X POST https://auth.your-app.test/introspect -H "Authorization: Basic $(echo -n client:secret
    | base64)" -d "token=xyz"'
  - curl -s http://localhost:8080/realms/myrealm/protocol/openid-connect/certs
  examples:
  - curl -X POST https://auth.your-app.test/introspect -d "token=xyz" -d "token_type_hint=access_token"
    -u api-client:secret | jq .
  - curl -X POST http://localhost:8080/realms/myrealm/protocol/openid-connect/token/introspect -d "token=xyz"
    -u svc:svcsecret | jq '.active,.scope'
  parameters:
  - name: endpoint
    type: string
    description: Introspection endpoint URL
  - name: token
    type: string
    description: Token value to introspect
  - name: client_auth
    type: string
    description: client_id:client_secret for basic auth
knowledge:
- title: RFC 7662 Token Introspection
  type: documentation
  source: https://datatracker.ietf.org/doc/html/rfc7662
  description: Specification for the introspection endpoint and response fields
- title: Keycloak Token Introspection
  type: documentation
  source: https://www.keycloak.org/docs/latest/securing_apps/
  description: Keycloak introspection endpoint path and usage
instructions: "# OAuth2 Token Introspection\n\nIntrospection (RFC 7662) lets a resource server ask the\
  \ authorization server whether a token is still valid.\n\n## What this skill does\n\n- Calls introspection\
  \ endpoints with client credentials\n- Reads active/scope/exp fields in responses\n- Tests with Keycloak\
  \ and generic endpoints\n\n## When to use\n\n- Validating opaque (non-JWT) access tokens\n- Checking\
  \ token expiry and scope server-side\n\n## Real commands\n\n```bash\n# Basic introspection\ncurl -X\
  \ POST https://auth.your-app.test/introspect \\\n  -d \"token=eyJhbGciOi...\" -u client-id:client-secret\n\
  \n# With token_type_hint\ncurl -X POST https://auth.your-app.test/introspect \\\n  -d \"token=eyJhbGciOi...\"\
  \ -d \"token_type_hint=access_token\" -u client-id:client-secret\n\n# Keycloak\ncurl -X POST http://localhost:8080/realms/myrealm/protocol/openid-connect/token/introspect\
  \ \\\n  -d \"token=xyz\" -u svc:svcsecret\n\n# Basic auth header form\ncurl -X POST https://auth.your-app.test/introspect\
  \ \\\n  -H \"Authorization: Basic $(echo -n client:secret | base64)\" -d \"token=xyz\"\n```\n\n## Response\
  \ fields\n\n```json\n{ \"active\": true, \"scope\": \"read write\", \"client_id\": \"api\", \"exp\"\
  : 1710000000 }\n```\n\n## Best practices\n\n- `active: false` means reject; never cache long\n- Include\
  \ `token_type_hint` for faster lookup\n- Use HTTPS and client authentication on introspection"
examples:
- input: Verify a token before letting the request through my API gateway
  output: The agent calls the introspection endpoint with curl, checks .active, and shows the gateway
    policy snippet.
- input: Introspect a token against Keycloak
  output: The agent uses the Keycloak protocol/openid-connect/token/introspect path with client basic
    auth.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: oauth2-introspection.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-oauth2-introspection
  generic:
    system_prompt: 'You take the Oauth2 Introspection seat. You do it through token-introspection: Introspect
      access/refresh tokens against RFC 7662 endpoints to check validity and scopes. The commands are
      real, e.g. `curl -X POST https://auth.your-app.test/introspect -d token=eyJhbGciOi... -u...`. You
      work hands-on and only report outcomes you have observed.'
    available_tools:
    - bash
    - read
    - write
    - edit
