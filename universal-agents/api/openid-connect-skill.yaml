name: openid-connect
display_name: Openid Connect
category: api
subcategory: general
description: 'OpenID Connect flows: discovery, authorization code flow, JWKS validation, ID tokens and
  userinfo.'
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
capabilities:
- name: oidc-flows
  description: Discover OIDC metadata, exchange codes for tokens, validate JWTs against JWKS and call
    userinfo.
  commands:
  - curl -s https://auth.example.com/.well-known/openid-configuration | jq .
  - curl -s https://auth.example.com/.well-known/jwks.json | jq '.keys[].alg'
  - curl -X POST https://auth.example.com/realms/realm/protocol/openid-connect/token -d "grant_type=authorization_code"
    -d "code=AUTH_CODE" -d "redirect_uri=https://app.example.com/callback" -d "client_id=app" -d "client_secret=secret"
  - 'curl -s https://auth.example.com/realms/realm/protocol/openid-connect/userinfo -H "Authorization:
    Bearer ACCESS_TOKEN"'
  - curl -s https://auth.example.com/realms/realm/protocol/openid-connect/token -d "grant_type=client_credentials"
    -d "client_id=svc" -d "client_secret=secret"
  examples:
  - curl -s https://auth.example.com/.well-known/openid-configuration | jq '.issuer,.authorization_endpoint'
  - 'curl -s https://auth.example.com/realms/realm/protocol/openid-connect/userinfo -H "Authorization:
    Bearer $TOKEN" | jq .'
  - curl -X POST https://auth.example.com/realms/realm/protocol/openid-connect/token -d "grant_type=authorization_code"
    -d "code=$CODE" -d "redirect_uri=..." -d "client_id=app"
  parameters:
  - name: issuer
    type: string
    description: OIDC issuer URL
  - name: client_id
    type: string
    description: Client identifier
  - name: grant_type
    type: string
    description: authorization_code, client_credentials or refresh_token
knowledge:
- title: OpenID Connect Core 1.0
  type: documentation
  source: https://openid.net/specs/openid-connect-core-1_0.html
  description: Flows, ID token claims, userinfo spec
- title: OIDC Discovery 1.0
  type: documentation
  source: https://openid.net/specs/openid-connect-discovery-1_0.html
  description: OpenID configuration metadata and JWKS
instructions: "# OpenID Connect\n\nOIDC builds on OAuth2 by adding an ID token with verified identity\
  \ claims.\n\n## What this skill does\n\n- Discovers issuer metadata and JWKS\n- Runs the authorization\
  \ code flow\n- Validates ID tokens and fetches userinfo\n\n## When to use\n\n- SSO for web apps (Keycloak,\
  \ Okta, Auth0)\n- Verifying JWTs with a public key\n\n## Real commands\n\n```bash\n# Discovery\ncurl\
  \ -s https://auth.example.com/.well-known/openid-configuration | jq .\ncurl -s https://auth.example.com/.well-known/jwks.json\
  \ | jq '.keys[].alg'\n\n# Token exchange (authorization code flow)\ncurl -X POST https://auth.example.com/realms/realm/protocol/openid-connect/token\
  \ \\\n  -d \"grant_type=authorization_code\" \\\n  -d \"code=AUTH_CODE\" \\\n  -d \"redirect_uri=https://app.example.com/callback\"\
  \ \\\n  -d \"client_id=app\" -d \"client_secret=secret\"\n\n# Service-to-service\ncurl -X POST https://auth.example.com/realms/realm/protocol/openid-connect/token\
  \ \\\n  -d \"grant_type=client_credentials\" -d \"client_id=svc\" -d \"client_secret=secret\"\n\n# Userinfo\n\
  curl -s https://auth.example.com/realms/realm/protocol/openid-connect/userinfo \\\n  -H \"Authorization:\
  \ Bearer ACCESS_TOKEN\"\n```\n\n## ID token validation\n\n- Verify signature with JWKS keys (`kid` match)\n\
  - Check `iss`, `aud`, `exp`, `nonce`\n\n## Best practices\n\n- Always validate the signature, not just\
  \ decode\n- Use PKCE for public clients\n- Cache JWKS and discovery metadata"
examples:
- input: Log a user in with Keycloak from my web app
  output: The agent shows the authorize URL redirect, the token exchange curl, and ID token validation
    steps.
- input: Verify the ID token signature in my backend
  output: The agent fetches JWKS, shows how to match kid and verify with the public key.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: openid-connect.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-openid-connect
  generic:
    system_prompt: 'You own Openid Connect end to end. You do it through oidc-flows: Discover OIDC metadata,
      exchange codes for tokens, validate JWTs against JWKS and call userinfo. The commands are real,
      e.g. `curl -s https://auth.example.com/.well-known/openid-configuration | jq .`. You prefer the
      shortest safe path, and you reproduce failures before diagnosing them.'
    available_tools:
    - bash
    - read
    - write
    - edit
