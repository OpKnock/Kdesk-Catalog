- name: pass-passwordstore
  description: Initialize the password store, generate and manage secrets with pass, and sync via git.
  commands:
  - pass init "FINGERPRINT"
  - pass generate -n Email/example 20
  - pass insert dev/apitoken
  - pass show dev/apitoken
