name: passwordless
display_name: Passwordless
category: api
subcategory: general
description: 'Passwordless authentication: magic links, email OTPs, TOTP codes, and verification endpoints.'
version: 2.0.0
tags:
- api
author: Kdesk
license: MIT
prerequisites:
- oathtool
capabilities:
- name: passwordless-flows
  description: 'Implement magic-link and OTP flows: request codes, verify codes, and TOTP generation.'
  commands:
  - 'curl -X POST http://localhost:3000/auth/magic-link -d ''{"email":"alice@example.org"}'' -H "Content-Type:
    application/json"'
  - 'curl -X POST http://localhost:3000/auth/verify-token -d ''{"email":"alice@example.org","token":"847291"}''
    -H "Content-Type: application/json"'
  - oathtool --totp -b JBSWY3DPEHPK3PXP
  - oathtool --totp --time-step-size 60 -b JBSWY3DPEHPK3PXP
  - 'curl -X POST http://localhost:3000/auth/request-otp -d ''{"phone":"+14155550123"}'' -H "Content-Type:
    application/json"'
  examples:
  - oathtool --totp -b JBSWY3DPEHPK3PXP
  - curl -X POST http://localhost:3000/auth/verify-token -d '{"email":"user@example.com","token":"123456"}'
  - curl -X POST http://localhost:3000/auth/magic-link -d '{"email":"user@example.com"}'
  parameters:
  - name: channel
    type: string
    description: email, sms or authenticator app
  - name: secret
    type: string
    description: TOTP base32 secret
  - name: token
    type: string
    description: Verification code
knowledge:
- title: RFC 6238 TOTP
  type: documentation
  source: https://datatracker.ietf.org/doc/html/rfc6238
  description: Time-based one-time password algorithm
- title: Passwordless Authentication (Auth0)
  type: documentation
  source: https://auth0.com/docs/authenticate/passwordless
  description: Magic link and email/SMS OTP flows
instructions: "# Passwordless\n\nPasswordless auth exchanges knowledge (passwords) for possession: email\
  \ links, SMS codes, or TOTP apps.\n\n## What this skill does\n\n- Implements magic-link and OTP request/verify\
  \ endpoints\n- Generates and validates TOTP codes\n- Handles token expiry and rate limiting\n\n## When\
  \ to use\n\n- Reducing password theft and phishing\n- Low-friction onboarding\n\n## Real commands\n\n\
  ```bash\n# Request a magic link\ncurl -X POST http://localhost:3000/auth/magic-link -d '{\"email\":\"\
  user@example.com\"}' -H \"Content-Type: application/json\"\n\n# Verify the token\ncurl -X POST http://localhost:3000/auth/verify-token\
  \ -d '{\"email\":\"user@example.com\",\"token\":\"123456\"}' -H \"Content-Type: application/json\"\n\
  \n# Generate a TOTP code locally\n oathtool --totp -b JBSWY3DPEHPK3PXP\n```\n\n## Flow rules\n\n- Tokens\
  \ expire in 5-15 minutes and are single-use\n- Rate-limit request endpoints per email/phone\n- Always\
  \ bind tokens to the verified identity\n\n## Best practices\n\n- Return generic responses to avoid enumeration\n\
  - Log login events for audit\n- Fall back to TOTP when email/SMS channels are unreliable"
examples:
- input: Users keep forgetting passwords, switch to magic links
  output: The agent adds a magic-link request/verify flow with expiry and rate limiting.
- input: Verify a TOTP code from an authenticator app
  output: The agent shows how to compare the provided code with `oathtool --totp -b JBSWY3DPEHPK3PXP`.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: passwordless.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-passwordless
  generic:
    system_prompt: 'You are the Passwordless specialist. You do it through passwordless-flows: Implement
      magic-link and OTP flows: request codes, verify codes, and TOTP generation. The commands are real,
      e.g. `curl -X POST http://localhost:3000/auth/magic-link -d {email:user@example.com} -H...`. You
      run and verify the real CLI commands before you claim anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2025-06-15T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
