name: play-framework
display_name: Play Framework
category: api
subcategory: general
description: 'Play Framework (Scala): sbt project setup, routes, controllers, and test/build lifecycle.'
version: 2.0.0
tags:
- api
author: Mehul Wagde
license: MIT
prerequisites:
- sbt
capabilities:
- name: play-scala-workflow
  description: Scaffold Play Framework apps with sbt, add routes/controllers, and run the test-build cycle.
  commands:
  - sbt new playframework/play-scala-seed.g8
  - sbt run
  - sbt test
  - sbt compile
  - sbt dist
  examples:
  - sbt run -Dhttp.port=9001
  - sbt test
  - sbt dist
  parameters:
  - name: port
    type: integer
    description: HTTP port for sbt run
  - name: seed
    type: string
    description: giter8 seed template name
  - name: sbt_task
    type: string
    description: 'sbt task: compile, test, dist, run'
knowledge:
- title: Play Framework Docs
  type: documentation
  source: https://www.playframework.com/documentation/latest/Home
  description: Routes, controllers, templates and config
- title: play-scala-seed template
  type: documentation
  source: https://github.com/playframework/play-scala-seed.g8
  description: giter8 template for new Scala apps
instructions: "# Play Framework\n\nPlay is a reactive web framework for Scala and Java with hot reloading\
  \ and type-safe routes.\n\n## What this skill does\n\n- Scaffolds projects from giter8 seeds\n- Defines\
  \ routes and controllers\n- Runs tests and builds distributions\n\n## When to use\n\n- Scala HTTP services\n\
  - Teams already on the JVM\n\n## Real commands\n\n```bash\n# New project\nsbt new playframework/play-scala-seed.g8\n\
  \n# Run with hot reload\nsbt run\nsbt run -Dhttp.port=9001\n\n# Test / build\nsbt test\nsbt compile\n\
  sbt dist\n```\n\n## Routes (conf/routes)\n\n```scala\nGET     /users              controllers.UserController.list\n\
  GET     /users/:id          controllers.UserController.show(id: Long)\nPOST    /users              controllers.UserController.create\n\
  ```\n\n## Controller\n\n```scala\nclass UserController @Inject()(cc: ControllerComponents) extends AbstractController(cc)\
  \ {\n  def list = Action { Ok(Json.toJson(List(\"alice\", \"bob\"))) }\n}\n```\n\n## Best practices\n\
  \n- Keep routes type-safe with path params\n- Write tests with PlaySpecification + ScalaTest\n- Use\
  \ `sbt dist` for production zips"
examples:
- input: Create a new Play Framework API for users
  output: The agent scaffolds with sbt new, adds routes and a controller, and runs sbt run to verify.
- input: Deploy my Play app
  output: The agent runs sbt dist and shows the zip layout and startup command.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: play-framework.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-play-framework
  generic:
    system_prompt: 'You own Play Framework end to end. You do it through play-scala-workflow: Scaffold
      Play Framework apps with sbt, add routes/controllers, and run the test-build cycle. The commands
      are real, e.g. `sbt new playframework/play-scala-seed.g8`. You verify each step you report and stay
      honest about what you have not run.'
    available_tools:
    - bash
    - read
    - write
    - edit
