name: postman
display_name: Postman
category: api
subcategory: general
description: 'Postman workflows: collections via the Postman CLI, newman runs in CI, environments, and
  API testing.'
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
prerequisites:
- newman
- postman
capabilities:
- name: postman-collection-testing
  description: Run Postman collections locally and in CI with newman, manage environments and generate
    reports.
  commands:
  - newman run collection.json -e environment.json
  - newman run collection.json --folder "auth" --env-var baseUrl=http://localhost:8080
  - newman run collection.json --reporters cli,json --reporter-json-export report.json
  - postman login --with-api-key $POSTMAN_API_KEY
  - postman collection run "My Collection" --environment "Staging"
  examples:
  - newman run api.postman_collection.json -e staging.postman_environment.json --bail
  - newman run collection.json --reporters junit --reporter-junit-export results.xml
  - postman collection run "Order API" --env-var token=abc123
  parameters:
  - name: collection
    type: string
    description: Collection file path or name
  - name: environment
    type: string
    description: Environment file or name
  - name: reporters
    type: array
    description: cli, json, junit, html reporters
knowledge:
- title: Postman CLI Docs
  type: documentation
  source: https://learning.postman.com/docs/postman-cli/postman-cli-overview/
  description: postman login, run, collection commands
- title: newman Docs
  type: documentation
  source: https://learning.postman.com/docs/collections/running-collections/using-newman-cli/
  description: newman options and reporters
instructions: '# Postman


  Postman turns request collections into repeatable API tests you can run anywhere.


  ## What this skill does


  - Runs collections with newman in CI

  - Manages environments and variables

  - Generates reports for review


  ## When to use


  - API regression testing

  - Smoke tests after deploys


  ## Real commands


  ```bash

  # Local run

  newman run collection.json -e environment.json


  # Folder + env override

  newman run collection.json --folder "auth" --env-var baseUrl=http://localhost:8080


  # Reports

  newman run collection.json --reporters cli,json --reporter-json-export report.json

  newman run collection.json --reporters junit --reporter-junit-export results.xml


  # Postman CLI (cloud sync)

  postman login --with-api-key $POSTMAN_API_KEY

  postman collection run "My Collection" --environment "Staging"

  ```


  ## CI snippet (GitHub Actions)


  ```yaml

  - run: npm install -g newman

  - run: newman run api.postman_collection.json -e staging.postman_environment.json --bail

  ```


  ## Best practices


  - Store secrets as environment variables, never inline

  - Use --bail to stop on first failure in CI

  - Keep collections in git for review'
examples:
- input: Run my API tests in the CI pipeline
  output: The agent installs newman and adds a run step with the collection and staging environment.
- input: Only test the auth folder of my collection
  output: The agent runs newman with --folder auth and env vars for the token.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: postman.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-postman
  generic:
    system_prompt: 'You own Postman end to end. You do it through postman-collection-testing: Run Postman
      collections locally and in CI with newman, manage environments and generate reports. The commands
      are real, e.g. `newman run collection.json -e environment.json`. You work hands-on and only report
      outcomes you have observed.'
    available_tools:
    - bash
    - read
    - write
    - edit
