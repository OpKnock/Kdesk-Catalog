name: priority-rate-limiting
display_name: Priority Rate Limiting
category: api
subcategory: general
description: 'Priority-aware rate limiting: separate limits for high/low-priority clients with Kong plugins
  and nginx maps.'
version: 2.0.0
tags:
- api
author: Mehul Wagde
license: MIT
capabilities:
- name: priority-rate-limiting
  description: Enforce different rate limits per priority tier using Kong rate-limiting plugins and nginx
    map-based configs.
  commands:
  - 'curl -X POST http://localhost:8001/plugins -H "Content-Type: application/json" -d ''{"name":"rate-limiting","config":{"minute":60,"policy":"redis"}}'''
  - 'curl -X POST http://localhost:8001/consumers/priority-high/plugins -H "Content-Type: application/json"
    -d ''{"name":"rate-limiting","config":{"minute":600}}'''
  - curl -s http://localhost:8001/consumers | jq .
  - 'curl -s -o /dev/null -w "%{http_code}\n" -H "X-Priority: low" http://localhost:8080/api'
  - 'curl -s -o /dev/null -w "%{http_code}\n" -H "X-Priority: high" http://localhost:8080/api'
  examples:
  - curl -X POST http://localhost:8001/plugins -d '{"name":"rate-limiting","config":{"hour":1000,"policy":"local"}}'
  - 'curl -s -o /dev/null -w "%{http_code}\n" -H "X-Priority: high" http://localhost:8080/api'
  - curl -X PATCH http://localhost:8001/plugins/PLUGIN_ID -d '{"config":{"minute":120}}'
  parameters:
  - name: priority_header
    type: string
    description: Header marking client priority
  - name: low_limit
    type: integer
    description: Rate limit for low priority
  - name: high_limit
    type: integer
    description: Rate limit for high priority
knowledge:
- title: Kong rate-limiting plugin
  type: documentation
  source: https://docs.konghq.com/hub/kong-inc/rate-limiting/
  description: Plugin params, policies and headers
- title: nginx limit_req module
  type: documentation
  source: https://nginx.org/en/docs/http/ngx_http_limit_req_module.html
  description: limit_req_zone and burst handling
instructions: "# Priority Rate Limiting\n\nNot all clients are equal: grant premium/high-priority traffic\
  \ more headroom than default tiers.\n\n## What this skill does\n\n- Applies tiered limits with Kong\
  \ plugins per consumer\n- Uses nginx map + limit_req for header-based tiers\n- Verifies 429 behavior\
  \ per tier\n\n## When to use\n\n- API plans with different quotas\n- Protecting critical traffic during\
  \ overload\n\n## Real commands\n\n```bash\n# Kong: global plugin\ncurl -X POST http://localhost:8001/plugins\
  \ -H \"Content-Type: application/json\" \\\n  -d '{\"name\":\"rate-limiting\",\"config\":{\"minute\"\
  :60,\"policy\":\"redis\"}}'\n\n# Kong: higher limit for a specific consumer\ncurl -X POST http://localhost:8001/consumers/priority-high/plugins\
  \ \\\n  -H \"Content-Type: application/json\" -d '{\"name\":\"rate-limiting\",\"config\":{\"minute\"\
  :600}}'\n\n# Verify tier behavior\ncurl -s -o /dev/null -w \"%{http_code}\\n\" -H \"X-Priority: low\"\
  \ http://localhost:8080/api\ncurl -s -o /dev/null -w \"%{http_code}\\n\" -H \"X-Priority: high\" http://localhost:8080/api\n\
  ```\n\n## nginx map approach\n\n```nginx\nmap $http_x_priority $req_limit {\n    default   10r/s;\n\
  \    high      100r/s;\n}\nlimit_req_zone $binary_remote_addr zone=api:10m rate=$req_limit;\n```\n\n\
  ## Best practices\n\n- Return 429 with Retry-After header\n- Use Redis policy when running multiple\
  \ gateways\n- Document tier limits in the developer portal"
examples:
- input: Give paying customers 10x the rate limit
  output: The agent sets a base Kong rate-limiting plugin and a higher consumer-level plugin for the premium
    tier.
- input: Low-priority clients should be throttled first during overload
  output: The agent configures nginx limit_req with a map keyed on the priority header.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: priority-rate-limiting.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-priority-rate-limiting
  generic:
    system_prompt: 'You work Priority Rate Limiting hands-on. You do it through priority-rate-limiting:
      Enforce different rate limits per priority tier using Kong rate-limiting plugins and nginx map-based
      configs. The commands are real, e.g. `curl -X POST http://localhost:8001/plugins -H Content-Type:
      application/json -d...`. You verify each step you report and stay honest about what you have not
      run.'
    available_tools:
    - bash
    - read
    - write
    - edit
