name: promtail
display_name: Promtail
category: api
subcategory: general
description: 'Promtail log shipping to Loki: config, file discovery, labels, pipeline stages and logcli
  queries.'
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
prerequisites:
- logcli
- promtail
capabilities:
- name: promtail-log-shipping
  description: Run promtail with configs, process log lines with pipelines, and query Loki with logcli.
  commands:
  - promtail -config.file=promtail.yaml
  - 'curl -X POST http://localhost:3100/loki/api/v1/push -H "Content-Type: application/json" -d ''{"streams":[{"stream":{"job":"app"},"values":[["1710000000000000000","log
    line"]]}]}'''
  - logcli query '{job="app"}' --limit 50
  - logcli query '{job="app"} |= "error"' --from "1h ago"
  - logcli labels
  examples:
  - logcli query '{service="orders"} |= "exception" | json' --limit 100
  - promtail -config.file=promtail.yaml -dry-run
  - logcli query '{job="app"} |= "500"' --since 24h | wc -l
  parameters:
  - name: config_file
    type: string
    description: Promtail config file path
  - name: query
    type: string
    description: LogQL query string
  - name: label
    type: string
    description: Log label key or value
knowledge:
- title: Promtail Docs
  type: documentation
  source: https://grafana.com/docs/loki/latest/send-data/promtail/
  description: Config, file targets, pipeline stages and labels
- title: LogQL Reference
  type: documentation
  source: https://grafana.com/docs/loki/latest/query/
  description: Query language and logcli usage
instructions: "# Promtail\n\nPromtail tails log files, adds labels, and pushes them to Loki for querying.\n\
  \n## What this skill does\n\n- Configures file discovery and labels\n- Transforms lines with pipeline\
  \ stages\n- Queries Loki with logcli\n\n## When to use\n\n- Shipping app logs to Loki\n- Parsing structured\
  \ fields from log lines\n\n## Real commands\n\n```bash\n# Run promtail\npromtail -config.file=promtail.yaml\n\
  promtail -config.file=promtail.yaml -dry-run\n\n# Push test entry (Loki push API)\ncurl -X POST http://localhost:3100/loki/api/v1/push\
  \ -H \"Content-Type: application/json\" \\\n  -d '{\"streams\":[{\"stream\":{\"job\":\"app\"},\"values\"\
  :[[\"1710000000000000000\",\"log line\"]]}]}'\n\n# Query\nlogcli query '{job=\"app\"}' --limit 50\n\
  logcli query '{job=\"app\"} |= \"error\"' --from \"1h ago\"\nlogcli labels\n```\n\n## promtail.yaml\n\
  \n```yaml\nserver:\n  http_listen_port: 9080\nclients:\n- url: http://localhost:3100/loki/api/v1/push\n\
  scrape_configs:\n- job_name: app\n  static_configs:\n  - targets: [localhost]\n    labels:\n      job:\
  \ app\n      __path__: /var/log/app/*.log\n```\n\n## Best practices\n\n- Keep labels low-cardinality\
  \ (job, env, service)\n- Use -dry-run to preview labels before pushing\n- Use json/regex stages to extract\
  \ structured fields"
examples:
- input: Ship my app logs to Loki
  output: The agent writes a promtail config with the log path, starts promtail, and verifies with logcli
    query.
- input: Search all errors from the last hour
  output: The agent runs logcli query with |= "error" and a time window.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: promtail.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-promtail
  generic:
    system_prompt: 'You work Promtail hands-on. You do it through promtail-log-shipping: Run promtail
      with configs, process log lines with pipelines, and query Loki with logcli. The commands are real,
      e.g. `promtail -config.file=promtail.yaml`. You verify each step you report and stay honest about
      what you have not run.'
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2024-01-01T00:00:00Z'
updated_at: '2024-01-01T00:00:00Z'
