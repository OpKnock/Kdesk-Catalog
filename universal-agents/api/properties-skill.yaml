name: properties
display_name: Properties
category: api
subcategory: general
description: 'Java properties files: parsing, editing, encoding conversions (native2ascii), and config
  management in apps.'
version: 2.0.0
tags:
- api
author: Mehul Wagde
license: MIT
prerequisites:
- grep
- java
- native2ascii
- python3
- sed
capabilities:
- name: properties-management
  description: Inspect, edit and convert Java .properties files including encoding with native2ascii.
  commands:
  - grep -n 'db.url' application.properties
  - sed -i 's/^db.url=.*/db.url=jdbc:mysql://localhost:3306/app/' application.properties
  - native2ascii -encoding UTF-8 input.properties output.properties
  - python3 -c "import configparser; c=configparser.ConfigParser(); c.read('application.properties');
    print(dict(c['default']))"
  - java -XshowSettings:properties -version
  examples:
  - grep -n -E '^(server|db)\.' application.properties
  - sed -i 's/^app.mode=dev/app.mode=prod/' application.properties
  - native2ascii -encoding UTF-8 messages_zh.properties messages_zh_escaped.properties
  parameters:
  - name: file
    type: string
    description: Path to the .properties file
  - name: key
    type: string
    description: Property key to inspect or modify
  - name: encoding
    type: string
    description: Source encoding for native2ascii
knowledge:
- title: java.util.Properties
  type: documentation
  source: https://docs.oracle.com/javase/8/docs/api/java/util/Properties.html
  description: Properties file format and escaping rules
- title: native2ascii tool
  type: documentation
  source: https://docs.oracle.com/javase/8/docs/technotes/tools/unix/native2ascii.html
  description: Unicode escape conversion for properties files
instructions: "# Properties\n\nJava .properties files configure JVM apps: key=value pairs with ISO-8859-1\
  \ default encoding.\n\n## What this skill does\n\n- Locates and edits keys safely\n- Converts encodings\
  \ with native2ascii\n- Parses files for automation\n\n## When to use\n\n- Config changes in Java services\n\
  - Localizing message bundles\n\n## Real commands\n\n```bash\n# Find keys\n grep -n 'db.url' application.properties\n\
  \ grep -n -E '^(server|db)\\.' application.properties\n\n# Edit in place\n sed -i 's/^db.url=.*/db.url=jdbc:mysql:\\\
  /\\/localhost:3306\\/app/' application.properties\n sed -i 's/^app.mode=dev/app.mode=prod/' application.properties\n\
  \n# Encoding conversion\n native2ascii -encoding UTF-8 messages_zh.properties messages_zh_escaped.properties\n\
  \n# Parse programmatically\n python3 -c \"import configparser; c=configparser.ConfigParser(); c.read('application.properties');\
  \ print(dict(c['default']))\"\n```\n\n## Escaping rules\n\n- `\\` escapes special characters\n- Unicode\
  \ as \\uXXXX sequences\n- Continue long values with trailing backslash\n\n## Best practices\n\n- Keep\
  \ secrets out of properties; use env vars\n- Use native2ascii for non-Latin message bundles\n- Validate\
  \ with `java -jar -Dconfig.file=... app.jar` smoke tests"
examples:
- input: Change the database URL in my app's config
  output: The agent finds the key with grep, updates it with sed, and suggests a restart check.
- input: My Chinese message bundle shows garbled text
  output: The agent converts the file with native2ascii -encoding UTF-8 and explains the escaping.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: properties.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-properties
  generic:
    system_prompt: 'You take the Properties seat. You do it through properties-management: Inspect, edit
      and convert Java .properties files including encoding with native2ascii. The commands are real,
      e.g. `grep -n db.url application.properties`. You run and verify the real CLI commands before you
      claim anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2025-06-15T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
