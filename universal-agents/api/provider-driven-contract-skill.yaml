name: provider-driven-contract
display_name: Provider Driven Contract
category: api
subcategory: general
description: 'Provider-driven contract testing with Pact: publish pacts, verify against providers, and
  gate deploys.'
version: 2.0.0
tags:
- api
author: Mehul Wagde
license: MIT
prerequisites:
- pact-broker
- pact-provider-verifier
capabilities:
- name: pact-contract-testing
  description: Publish pact files to a broker, verify provider endpoints, and run can-i-deploy checks.
  commands:
  - pact-broker publish ./pacts -b http://localhost:9292 -c 1.0.0 -a main
  - pact-broker list-latest-pact-versions -b http://localhost:9292
  - pact-broker can-i-deploy --pacticipant orders-api --version 1.0.0 --to prod -b http://localhost:9292
  - pact-provider-verifier --provider-base-url=http://localhost:8080 --pact-urls=./pacts/consumer-orders-api.json
  - curl -s http://localhost:9292/pacts/provider/orders-api/latest | jq .
  examples:
  - pact-broker publish ./pacts -b http://localhost:9292 -c 1.0.0
  - pact-provider-verifier --provider-base-url=http://localhost:8080 --pact-urls=./pacts/*.json --provider-version
    1.0.0
  - pact-broker can-i-deploy --pacticipant orders-api --version 1.0.0 --to prod
  parameters:
  - name: broker_url
    type: string
    description: Pact broker base URL
  - name: version
    type: string
    description: Consumer/provider version
  - name: pacts_dir
    type: string
    description: Directory with generated pact files
knowledge:
- title: Pact Docs
  type: documentation
  source: https://docs.pact.io/
  description: Contract testing concepts, verification and brokers
- title: Pact Broker Client
  type: documentation
  source: https://github.com/pact-foundation/pact_broker-client
  description: pact-broker CLI commands
instructions: "# Provider-Driven Contracts\n\nContract testing (Pact) verifies that a provider's API satisfies\
  \ what consumers actually expect.\n\n## What this skill does\n\n- Publishes pacts generated by consumers\n\
  - Verifies provider endpoints against pacts\n- Gates deployments with can-i-deploy\n\n## When to use\n\
  \n- Many consumers of one API\n- Catching contract breaks before deploys\n\n## Real commands\n\n```bash\n\
  # Publish pacts\npact-broker publish ./pacts -b http://localhost:9292 -c 1.0.0 -a main\n\n# List latest\n\
  pact-broker list-latest-pact-versions -b http://localhost:9292\n\n# Verify provider\npact-provider-verifier\
  \ --provider-base-url=http://localhost:8080 \\\n  --pact-urls=./pacts/consumer-orders-api.json --provider-version\
  \ 1.0.0\n\n# Deploy gate\npact-broker can-i-deploy --pacticipant orders-api --version 1.0.0 --to prod\
  \ -b http://localhost:9292\n```\n\n## Verification in CI\n\n```yaml\n- run: pact-provider-verifier --provider-base-url=$BASE_URL\
  \ --pact-urls=$PACT_URLS\n- run: pact-broker can-i-deploy --pacticipant orders-api --version $VERSION\
  \ --to prod\n```\n\n## Best practices\n\n- Verify provider on every PR\n- Use can-i-deploy as the final\
  \ gate\n- Tag versions for environment promotion"
examples:
- input: Publish my consumer's pact for the orders API
  output: The agent runs pact-broker publish with a version and tag, then shows the broker record.
- input: Can I safely deploy my provider?
  output: The agent verifies against latest pacts and runs can-i-deploy to prod.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: provider-driven-contract.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-provider-driven-contract
  generic:
    system_prompt: 'This is your domain: Provider Driven Contract. You do it through pact-contract-testing:
      Publish pact files to a broker, verify provider endpoints, and run can-i-deploy checks. The commands
      are real, e.g. `pact-broker publish ./pacts -b http://localhost:9292 -c 1.0.0 -a main`. You answer
      with exact commands, not abstractions, and flag anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2025-06-15T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
