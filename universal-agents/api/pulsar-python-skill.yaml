instructions: "# Pulsar Python\n\nProduce and consume Pulsar messages in Python with the official client.\n\
  \n## What this skill does\n\n- Installs the client wheel\n- Writes producer and consumer scripts\n-\
  \ Handles schemas and acking\n\n## When to use\n\n- Data pipelines in Python\n- Quick integrations with\
  \ Pulsar\n\n## Real commands\n\n```bash\npip install pulsar-client\npython3 -m pip show pulsar-client\n\
  python3 producer.py\npython3 consumer.py\n```\n\n## Producer\n\n```python\nimport pulsar\nclient = pulsar.Client(\"\
  pulsar://localhost:6650\")\nproducer = client.create_producer(\"my-topic\")\nproducer.send((\"hello\"\
  ).encode(\"utf-8\"))\nclient.close()\n```\n\n## Consumer\n\n```python\nconsumer = client.subscribe(\"\
  my-topic\", subscription_name=\"worker\")\nwhile True:\n    msg = consumer.receive()\n    print(msg.data().decode())\n\
  \    consumer.acknowledge(msg)\n```\n\n## Best practices\n\n- Use JsonSchema for structured data\n-\
  \ Always acknowledge messages after processing\n- Close the client on exit to flush pending"
examples:
- input: Consume events from Pulsar in a Python worker
  output: The agent writes a consumer with ack handling and runs it against the topic.
- input: Publish a JSON payload from Python
  output: The agent uses a JsonSchema producer and sends serialized records.
