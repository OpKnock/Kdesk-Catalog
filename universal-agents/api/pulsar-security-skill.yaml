name: pulsar-security
display_name: Pulsar Security
category: api
subcategory: general
description: 'Secure Pulsar: token authentication, namespace permissions, TLS encryption, and broker config.'
version: 2.0.0
tags:
- api
author: Kdesk
license: MIT
prerequisites:
- bin/pulsar
- bin/pulsar-admin
capabilities:
- name: pulsar-security-hardening
  description: Configure token auth, TLS, and role-based namespace permissions with pulsar-admin.
  commands:
  - bin/pulsar tokens create --secret-key my-secret.key --subject admin
  - bin/pulsar-admin brokers update-dynamic-config --config authenticationEnabled --value true
  - bin/pulsar-admin namespaces grant-permission --role svc-orders --actions produce,consume public/default/orders-topic
  - bin/pulsar-admin namespaces revoke-permission --role svc-orders public/default/orders-topic
  - bin/pulsar-admin namespaces permissions public/default
  examples:
  - bin/pulsar tokens create --secret-key my-secret.key --subject svc-orders | tee svc-orders.token
  - bin/pulsar-admin namespaces grant-permission --role admin --actions produce,consume public/default
  - bin/pulsar-admin namespaces permissions public/default | jq .
  parameters:
  - name: role
    type: string
    description: Subject/role the token or permission is for
  - name: actions
    type: string
    description: produce, consume, or functions
  - name: namespace
    type: string
    description: Target namespace
knowledge:
- title: Pulsar Security Overview
  type: documentation
  source: https://pulsar.apache.org/docs/3.0.x/security-overview/
  description: Auth, authorization, encryption and proxies
- title: Token Auth
  type: documentation
  source: https://pulsar.apache.org/docs/3.0.x/security-token-auth/
  description: Token generation and client configuration
instructions: "# Pulsar Security\n\nLock down Pulsar with tokens, roles and TLS so only authorized clients\
  \ touch topics.\n\n## What this skill does\n\n- Generates JWT tokens per service\n- Grants/revokes namespace\
  \ permissions\n- Configures TLS endpoints\n\n## When to use\n\n- Production cluster rollout\n- Restricting\
  \ topic access per team\n\n## Real commands\n\n```bash\n# Token for a role\nbin/pulsar tokens create\
  \ --secret-key my-secret.key --subject admin\nbin/pulsar tokens create --secret-key my-secret.key --subject\
  \ svc-orders\n\n# Enable auth\nbin/pulsar-admin brokers update-dynamic-config --config authenticationEnabled\
  \ --value true\n\n# Permissions\nbin/pulsar-admin namespaces grant-permission --role svc-orders \\\n\
  \  --actions produce,consume public/default/orders-topic\nbin/pulsar-admin namespaces revoke-permission\
  \ --role svc-orders public/default/orders-topic\nbin/pulsar-admin namespaces permissions public/default\n\
  ```\n\n## Client with token\n\n```go\npulsar.ClientOptions{URL: \"pulsar+ssl://localhost:6651\", Authentication:\
  \ pulsar.NewAuthenticationToken(token)}\n```\n\n## broker.conf security\n\n```conf\nauthenticationEnabled=true\n\
  authenticationProviders=org.apache.pulsar.broker.authentication.AuthenticationProviderToken\ntlsEnabled=true\n\
  tlsCertificateFilePath=/etc/pulsar/server.crt\ntlsKeyFilePath=/etc/pulsar/server.key\n```\n\n## Best\
  \ practices\n\n- One token per service, one role per service\n- Rotate tokens on a schedule\n- Use pulsar+ssl://\
  \ and client certs for TLS"
examples:
- input: Restrict the orders topic to the orders service only
  output: The agent creates a svc-orders token, grants produce/consume on the topic namespace, and shows
    client config.
- input: Enable TLS on my Pulsar broker
  output: The agent configures TLS paths in broker.conf and tests with a pulsar+ssl client.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: pulsar-security.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-pulsar-security
  generic:
    system_prompt: 'This is your domain: Pulsar Security. You do it through pulsar-security-hardening:
      Configure token auth, TLS, and role-based namespace permissions with pulsar-admin. The commands
      are real, e.g. `bin/pulsar tokens create --secret-key my-secret.key --subject admin`. You verify
      each step you report and stay honest about what you have not run.'
    available_tools:
    - bash
    - read
    - write
    - edit
