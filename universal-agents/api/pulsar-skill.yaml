name: pulsar
display_name: Pulsar
category: api
subcategory: general
description: 'Core Pulsar operations: standalone cluster, topics, admin APIs, producers/consumers and
  messaging concepts.'
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
prerequisites:
- bin/pulsar
- bin/pulsar-admin
- bin/pulsar-client
capabilities:
- name: pulsar-core-operations
  description: Run a standalone Pulsar, manage topics, and produce/consume messages via the CLI tools.
  commands:
  - bin/pulsar standalone
  - bin/pulsar-admin topics create persistent://public/default/my-topic
  - bin/pulsar-client produce my-topic --messages "Hello World"
  - bin/pulsar-client consume my-topic -s my-sub --num-messages 5
  - bin/pulsar-admin topics list public/default
  examples:
  - bin/pulsar standalone --num-brokers 2
  - bin/pulsar-admin topics create-partitioned-topic persistent://public/default/my-topic -p 3
  - bin/pulsar-client produce my-topic --messages "one" "two" "three" -n 1
  parameters:
  - name: topic
    type: string
    description: Persistent topic name
  - name: subscription
    type: string
    description: Subscription name
  - name: num_messages
    type: integer
    description: Messages to consume
knowledge:
- title: Apache Pulsar Docs
  type: documentation
  source: https://pulsar.apache.org/docs/
  description: Concepts, admin, client libraries and CLI tools
- title: Pulsar CLI tools
  type: documentation
  source: https://pulsar.apache.org/docs/3.0.x/reference-cli-tools/
  description: pulsar, pulsar-admin, pulsar-client and pulsar-perf
instructions: '# Pulsar


  Apache Pulsar is a multi-tenant pub/sub and streaming platform with per-topic backpressure and geo-replication.


  ## What this skill does


  - Runs a standalone cluster for dev

  - Creates and inspects topics

  - Produces/consumes via CLI tools


  ## When to use


  - Evaluating or adopting Pulsar

  - Day-to-day topic operations


  ## Real commands


  ```bash

  # Standalone cluster

  bin/pulsar standalone


  # Topic management

  bin/pulsar-admin topics create persistent://public/default/my-topic

  bin/pulsar-admin topics list public/default

  bin/pulsar-admin topics create-partitioned-topic persistent://public/default/my-topic -p 3


  # Produce / consume

  bin/pulsar-client produce my-topic --messages "Hello World"

  bin/pulsar-client consume my-topic -s my-sub --num-messages 5

  ```


  ## Concepts


  - Topic: persistent://tenant/namespace/topic

  - Subscription: cursor over a topic (Exclusive/Shared/Failover/Key_Shared)

  - Broker + BookKeeper: serving and storage split


  ## Best practices


  - Use persistent topics for durable workloads

  - Partition topics before heavy traffic

  - Manage via pulsar-admin, not ad-hoc scripts'
examples:
- input: Start Pulsar locally and send a test message
  output: The agent starts bin/pulsar standalone, creates a topic, and publishes/consumes via pulsar-client.
- input: Check which topics exist
  output: The agent runs bin/pulsar-admin topics list for the namespace.
