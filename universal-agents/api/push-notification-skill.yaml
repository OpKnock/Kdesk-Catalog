name: push-notification
display_name: Push Notification
category: api
subcategory: general
description: 'Send push notifications: FCM v1 and legacy HTTP APIs, APNs HTTP/2, tokens, and payload formatting.'
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
prerequisites:
- gcloud
capabilities:
- name: push-notification-delivery
  description: Send notifications via FCM and APNs using curl and the gcloud token flow.
  commands:
  - gcloud auth application-default print-access-token
  - 'curl -X POST -H "Authorization: Bearer $FCM_TOKEN" -H "Content-Type: application/json" -d @fcm.json
    "https://fcm.googleapis.com/v1/projects/my-project/messages:send"'
  - 'curl -X POST -H "Authorization: key=$FCM_LEGACY_KEY" -H "Content-Type: application/json" -d ''{"to":"DEVICE_TOKEN","notification":{"title":"Hi","body":"Hello"}}''
    https://fcm.googleapis.com/fcm/send'
  - 'curl -d ''{"aps":{"alert":"Hello","sound":"default"}}'' -H "apns-topic: com.example.app" --cert apns.pem
    https://api.push.apple.com/3/device/DEVICE_TOKEN'
  - 'curl -s -X POST -H "Authorization: Bearer $FCM_TOKEN" -H "Content-Type: application/json" -d @fcm.json
    "https://fcm.googleapis.com/v1/projects/my-project/messages:send" | jq .'
  examples:
  - 'curl -X POST -H "Authorization: key=$FCM_LEGACY_KEY" -H "Content-Type: application/json" -d ''{"to":"DEVICE_TOKEN","data":{"type":"order"}}''
    https://fcm.googleapis.com/fcm/send'
  - 'curl -d ''{"aps":{"alert":"Order shipped"}}'' -H "apns-topic: com.example.app" --cert apns.pem https://api.push.apple.com/3/device/DEVICE_TOKEN'
  - gcloud auth application-default print-access-token > /tmp/fcm_token
  parameters:
  - name: token
    type: string
    description: Device push token
  - name: title
    type: string
    description: Notification title
  - name: platform
    type: string
    description: fcm or apns
knowledge:
- title: FCM HTTP v1 API
  type: documentation
  source: https://firebase.google.com/docs/reference/fcm/rest/v1/projects.messages
  description: FCM v1 send endpoint and message format
- title: APNs Provider API
  type: documentation
  source: https://developer.apple.com/documentation/usernotifications/sending_push_notifications_using_command-line_tools
  description: APNs HTTP/2 push endpoint and aps payload
instructions: "# Push Notifications\n\nSend notifications to iOS and Android devices through FCM and APNs.\n\
  \n## What this skill does\n\n- Sends FCM v1 messages with OAuth tokens\n- Sends legacy FCM requests\n\
  - Pushes to APNs over HTTP/2\n\n## When to use\n\n- Triggering notifications from backend events\n-\
  \ Testing delivery with curl before building\n\n## Real commands\n\n```bash\n# FCM v1: get OAuth token,\
  \ then send\n gcloud auth application-default print-access-token\ncurl -X POST -H \"Authorization: Bearer\
  \ $FCM_TOKEN\" -H \"Content-Type: application/json\" \\\n  -d @fcm.json \"https://fcm.googleapis.com/v1/projects/my-project/messages:send\"\
  \n\n# FCM legacy\ncurl -X POST -H \"Authorization: key=$FCM_LEGACY_KEY\" -H \"Content-Type: application/json\"\
  \ \\\n  -d '{\"to\":\"DEVICE_TOKEN\",\"notification\":{\"title\":\"Hi\",\"body\":\"Hello\"}}' \\\n \
  \ https://fcm.googleapis.com/fcm/send\n\n# APNs\ncurl -d '{\"aps\":{\"alert\":\"Hello\",\"sound\":\"\
  default\"}}' \\\n  -H \"apns-topic: com.example.app\" --cert apns.pem \\\n  https://api.push.apple.com/3/device/DEVICE_TOKEN\n\
  ```\n\n## fcm.json (v1)\n\n```json\n{\n  \"message\": {\n    \"token\": \"DEVICE_TOKEN\",\n    \"notification\"\
  : { \"title\": \"Hi\", \"body\": \"Hello\" },\n    \"data\": { \"screen\": \"orders\" }\n  }\n}\n```\n\
  \n## Best practices\n\n- Store device tokens per user and refresh on invalid-token errors\n- Use data\
  \ payloads for background handling\n- Send to topic groups (FCM) instead of one-by-one at scale"
examples:
- input: Notify iOS and Android when an order ships
  output: The agent sends the FCM v1 message for Android and the APNs request for iOS.
- input: My FCM send returns 401
  output: The agent refreshes the OAuth token with gcloud and checks the project ID in the URL.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: push-notification.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-push-notification
  generic:
    system_prompt: 'You are the Push Notification specialist. You do it through push-notification-delivery:
      Send notifications via FCM and APNs using curl and the gcloud token flow. The commands are real,
      e.g. `gcloud auth application-default print-access-token`. You verify each step you report and stay
      honest about what you have not run.'
    available_tools:
    - bash
    - read
    - write
    - edit
