name: quarkus
display_name: Quarkus
category: api
subcategory: general
description: 'Quarkus application development: CLI scaffolding, extensions, dev mode, testing and packaging.'
version: 2.0.0
tags:
- api
author: Kdesk
license: MIT
prerequisites:
- ./mvnw
- quarkus
capabilities:
- name: quarkus-workflow
  description: Create, extend, run and test Quarkus apps with the quarkus CLI and Maven.
  commands:
  - quarkus create app hello-world
  - quarkus dev
  - quarkus ext add resteasy-reactive,resteasy-reactive-jackson
  - quarkus build
  - ./mvnw test
  examples:
  - quarkus create app -P io.quarkus.platform:quarkus-bom:3.10.0 hello
  - quarkus dev --port 8081
  - quarkus build --native
  parameters:
  - name: extensions
    type: array
    description: Extensions to add via quarkus ext add
  - name: port
    type: integer
    description: Dev mode port
  - name: package_type
    type: string
    description: fast-jar, uber-jar or native
knowledge:
- title: Quarkus Guides
  type: documentation
  source: https://quarkus.io/guides/
  description: Getting started, REST, config and deployment guides
- title: Quarkus CLI
  type: documentation
  source: https://quarkus.io/guides/cli-tooling
  description: quarkus create, dev, build, ext commands
instructions: "# Quarkus\n\nQuarkus is a Kubernetes-native Java stack with fast startup, low RSS, and\
  \ developer joy.\n\n## What this skill does\n\n- Scaffolds apps with the quarkus CLI\n- Adds extensions\
  \ for REST, persistence, messaging\n- Runs dev mode and builds artifacts\n\n## When to use\n\n- New\
  \ Java microservices\n- Serverless/native deployments\n\n## Real commands\n\n```bash\n# Create\nquarkus\
  \ create app hello-world\nquarkus create app -P io.quarkus.platform:quarkus-bom:3.10.0 hello\n\n# Dev\
  \ mode\nquarkus dev\nquarkus dev --port 8081\n\n# Extensions\nquarkus ext add resteasy-reactive,resteasy-reactive-jackson\n\
  quarkus ext add hibernate-orm-panache,postgresql-client\n\n# Build and test\nquarkus build\n./mvnw test\n\
  quarkus build --native\n```\n\n## REST endpoint\n\n```java\n@Path(\"/hello\")\npublic class HelloResource\
  \ {\n    @GET\n    @Produces(MediaType.TEXT_PLAIN)\n    public String hello() { return \"Hello Quarkus\"\
  ; }\n}\n```\n\n## application.properties\n\n```properties\nquarkus.http.port=8080\nquarkus.datasource.db-kind=postgresql\n\
  quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/app\n```\n\n## Best practices\n\n- Use\
  \ dev mode's continuous testing\n- Profile and size before native builds\n- Pin the BOM version in CI"
examples:
- input: Scaffold a REST API with Quarkus and PostgreSQL
  output: The agent creates the app, adds panache/postgres extensions, and starts quarkus dev.
- input: Package my Quarkus app as a container image
  output: The agent builds with quarkus build and shows the container build via Jib or the CLI.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: quarkus.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-quarkus
  generic:
    system_prompt: 'You work Quarkus hands-on. You do it through quarkus-workflow: Create, extend, run
      and test Quarkus apps with the quarkus CLI and Maven. The commands are real, e.g. `quarkus create
      app hello-world`. You run and verify the real CLI commands before you claim anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
