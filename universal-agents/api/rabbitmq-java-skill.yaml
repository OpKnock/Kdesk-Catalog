instructions: "# RabbitMQ Java\n\nThe amqp-client library is the official RabbitMQ client for the JVM.\n\
  \n## What this skill does\n\n- Configures ConnectionFactory\n- Declares queues/exchanges and binds\n\
  - Publishes/consumes with callbacks\n\n## When to use\n\n- JVM services on RabbitMQ\n- RPC over AMQP\n\
  \n## Real commands\n\n```bash\nmvn compile\nmvn exec:java -Dexec.mainClass=com.example.Publisher\nmvn\
  \ package\nmvn dependency:tree -Dincludes=com.rabbitmq\n```\n\n## Publish\n\n```java\nConnectionFactory\
  \ f = new ConnectionFactory();\nf.setUri(\"amqp://guest:guest@localhost:5672/\");\nConnection c = f.newConnection();\n\
  Channel ch = c.createChannel();\nch.queueDeclare(\"tasks\", true, false, false, null);\nch.basicPublish(\"\
  \", \"tasks\", null, \"job\".getBytes());\n```\n\n## Consume\n\n```java\nchannel.basicConsume(\"tasks\"\
  , true, (tag, delivery) -> {\n    System.out.println(new String(delivery.getBody()));\n}, tag -> {});\n\
  ```\n\n## pom.xml\n\n```xml\n<dependency>\n  <groupId>com.rabbitmq</groupId>\n  <artifactId>amqp-client</artifactId>\n\
  \  <version>5.20.0</version>\n</dependency>\n```\n\n## Best practices\n\n- Use one channel per thread\n\
  - Set basicQos for fair dispatch\n- Close connections on shutdown hooks"
examples:
- input: Send a message from a Java service
  output: The agent writes a publisher with a durable queue and verifies with rabbitmqctl.
- input: Implement RPC over RabbitMQ in Java
  output: The agent shows the replyTo/correlationId RPC pattern with a callback.
