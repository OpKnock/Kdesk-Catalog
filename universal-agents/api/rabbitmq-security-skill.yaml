name: rabbitmq-security
display_name: Rabbitmq Security
category: api
subcategory: general
description: 'Harden RabbitMQ with least-privilege users, vhost isolation, TLS listeners, and renamed dangerous commands for production readiness.'
version: 2.0.0
tags:
- api
author: Kdesk
license: MIT
prerequisites:
- rabbitmqctl
capabilities:
- name: rabbitmq-security-config
  description: Manage users, vhosts and permissions, and configure TLS with rabbitmq.conf.
  commands:
  - rabbitmqctl add_user svc-orders s3cret
  - rabbitmqctl set_permissions -p orders-vhost svc-orders ".*" ".*" ".*"
  - rabbitmqctl set_user_tags svc-orders monitoring
  - rabbitmqctl add_vhost orders-vhost
  - rabbitmqctl list_permissions -p orders-vhost
  examples:
  - rabbitmqctl add_user admin strongpass && rabbitmqctl set_user_tags admin administrator
  - rabbitmqctl list_users
  - rabbitmqctl clear_permissions -p orders-vhost svc-orders
  parameters:
  - name: user
    type: string
    description: RabbitMQ username
  - name: vhost
    type: string
    description: Virtual host
  - name: permissions
    type: array
    description: configure, write, read regex patterns
knowledge:
- title: RabbitMQ Access Control
  type: documentation
  source: https://www.rabbitmq.com/access-control.html
  description: Users, vhosts, permissions and authentication
- title: TLS for RabbitMQ
  type: documentation
  source: https://www.rabbitmq.com/ssl.html
  description: TLS listener configuration
instructions: '# RabbitMQ Security


  Restrict who can touch what: users, vhosts, and per-vhost configure/write/read permissions.


  ## What this skill does


  - Creates users and vhosts

  - Grants minimal permissions

  - Enables TLS


  ## When to use


  - Multi-team brokers

  - Compliance requirements


  ## Real commands


  ```bash

  # Users

  rabbitmqctl add_user svc-orders s3cret

  rabbitmqctl set_user_tags svc-orders monitoring

  rabbitmqctl list_users


  # Vhosts

  rabbitmqctl add_vhost orders-vhost


  # Permissions (configure, write, read)

  rabbitmqctl set_permissions -p orders-vhost svc-orders ".*" ".*" ".*"

  rabbitmqctl list_permissions -p orders-vhost

  rabbitmqctl clear_permissions -p orders-vhost svc-orders

  ```


  ## rabbitmq.conf TLS


  ```conf

  listeners.ssl.default = 5671

  ssl_options.cacertfile = /etc/rabbitmq/ca.crt

  ssl_options.certfile   = /etc/rabbitmq/server.crt

  ssl_options.keyfile    = /etc/rabbitmq/server.key

  ssl_options.verify     = verify_peer

  ssl_options.fail_if_no_peer_cert = true

  ```


  ## Best practices


  - One user per service; rotate secrets regularly

  - Give read-only access where possible

  - Use 5671 with client certs for production'
examples:
- input: Create a read-only user for a monitoring tool
  output: The agent adds the user, sets the monitoring tag and grants read-only permission on the vhost.
- input: Enable TLS on RabbitMQ
  output: The agent configures listeners.ssl.default and ssl_options in rabbitmq.conf and restarts.
