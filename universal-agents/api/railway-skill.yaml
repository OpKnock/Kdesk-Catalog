instructions: '# Railway


  Railway deploys apps with zero config: push code, it runs.


  ## What this skill does


  - Logs in and links projects

  - Deploys from the current directory

  - Manages variables and runs commands in the environment


  ## When to use


  - Heroku-style deploys without the lock-in

  - Preview environments per PR


  ## Real commands


  ```bash

  # Auth

  railway login

  railway init

  railway link


  # Deploy

  railway up

  railway deploy


  # Variables

  railway variables

  railway variables --set FOO=bar

  railway variables --delete FOO


  # Run in project env

  railway run npm run migrate

  railway run python manage.py migrate


  # Logs

  railway logs

  railway logs --deployment

  ```


  ## Best practices


  - Keep secrets in variables, never in git

  - Use railway up for quick deploys, railway deploy for pinned environments

  - Run migrations via railway run before releases'
examples:
- input: Deploy my Node app to Railway
  output: The agent links the project and runs railway up, then checks logs.
- input: Add DATABASE_URL to my production environment
  output: The agent sets the variable with railway variables --set and redeploys.
