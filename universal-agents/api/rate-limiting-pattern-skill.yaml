name: rate-limiting-pattern
display_name: Rate Limiting Pattern
category: api
subcategory: general
description: 'Rate limiting architecture patterns: edge vs service-level, distributed limits with Redis,
  and Envoy filter setup.'
version: 2.0.0
tags:
- api
author: Kdesk
license: MIT
prerequisites:
- envoy
- redis-cli
capabilities:
- name: rate-limit-patterns
  description: Implement distributed rate limiting patterns with Redis sliding window and Envoy rate limit
    filters.
  commands:
  - envoy --config-path envoy.yaml
  - redis-cli ZREMRANGEBYSCORE user:42:rl 0 $(date +%s000 -d '-60 seconds')
  - redis-cli ZADD user:42:rl $(date +%s000) $(date +%s000)
  - redis-cli ZCARD user:42:rl
  - curl -s -o /dev/null -w "%{http_code}\n" http://localhost:10000/api
  examples:
  - redis-cli ZADD user:42:rl 1710000000000 1710000000000; redis-cli ZCARD user:42:rl
  - curl -s -o /dev/null -w "%{http_code}\n" http://localhost:10000/api
  - redis-cli ZREMRANGEBYSCORE user:42:rl 0 1710000000000
  parameters:
  - name: key
    type: string
    description: Redis sorted set key for the window
  - name: window_seconds
    type: integer
    description: Sliding window size
  - name: limit
    type: integer
    description: Max requests per window
knowledge:
- title: Envoy Rate Limit Filter
  type: documentation
  source: https://www.envoyproxy.io/docs/envoy/latest/configuration/http/http_filters/rate_limit_filter
  description: Envoy local and global rate limiting
- title: Redis sliding window pattern
  type: documentation
  source: https://redis.io/glossary/rate-limiting/
  description: Sliding window with sorted sets
instructions: "# Rate Limiting Patterns\n\nRate limits live at different layers: reverse proxy, gateway,\
  \ or application.\n\n## What this skill does\n\n- Builds distributed limits with Redis sorted sets\n\
  - Configures Envoy rate limit filters\n- Chooses the right layer per use case\n\n## When to use\n\n\
  - Multi-instance apps need shared limits\n- Offloading limits to the edge\n\n## Real commands\n\n```bash\n\
  # Envoy\nenvoy --config-path envoy.yaml\n\n# Redis sliding window\nredis-cli ZREMRANGEBYSCORE user:42:rl\
  \ 0 $(date +%s000 -d '-60 seconds')\nredis-cli ZADD user:42:rl $(date +%s000) $(date +%s000)\nredis-cli\
  \ ZCARD user:42:rl\n\n# Verify\ncurl -s -o /dev/null -w \"%{http_code}\\n\" http://localhost:10000/api\n\
  ```\n\n## Envoy filter\n\n```yaml\nhttp_filters:\n- name: envoy.filters.http.local_ratelimit\n  typed_config:\n\
  \    \"@type\": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit\n\
  \    stat_prefix: http_local_rate_limiter\n    token_bucket:\n      max_tokens: 100\n      tokens_per_fill:\
  \ 10\n      fill_interval: 1s\n    status:\n      code: TooManyRequests\n```\n\n## Pattern guidance\n\
  \n- Edge limits protect the whole fleet\n- App-level limits enable business quotas\n- Use Redis when\
  \ instances are stateless\n\n## Best practices\n\n- Combine edge and service-level limits\n- Use ZSETs\
  \ with timestamps for sliding windows\n- Return 429 + Retry-After consistently"
examples:
- input: My 10 instances each allow 100 r/min, so clients get 1000 r/min
  output: The agent implements a shared Redis sliding window so the limit is global.
- input: Add rate limiting at the Envoy edge
  output: The agent configures the local_ratelimit filter with a token bucket.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: rate-limiting-pattern.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-rate-limiting-pattern
  generic:
    system_prompt: 'You own Rate Limiting Pattern end to end. You do it through rate-limit-patterns: Implement
      distributed rate limiting patterns with Redis sliding window and Envoy rate limit filters. The commands
      are real, e.g. `envoy --config-path envoy.yaml`. You verify each step you report and stay honest
      about what you have not run.'
    available_tools:
    - bash
    - read
    - write
    - edit
