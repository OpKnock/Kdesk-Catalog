name: rate-limiting
display_name: Rate Limiting
category: api
subcategory: general
description: 'Core rate limiting: nginx limit_req/limit_conn, 429 responses, headers, and per-IP vs per-key
  scoping.'
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
prerequisites:
- nginx
capabilities:
- name: rate-limiting-basics
  description: Configure nginx request and connection limits with burst handling and verify 429 responses.
  commands:
  - nginx -t
  - nginx -s reload
  - curl -s -o /dev/null -w "%{http_code}\n" http://localhost:8080/api
  - ab -n 200 -c 20 http://localhost:8080/api
  - curl -sI http://localhost:8080/api | grep -i retry-after
  examples:
  - nginx -t && nginx -s reload
  - ab -n 300 -c 30 http://localhost:8080/api
  - curl -s -o /dev/null -w "%{http_code}\n" http://localhost:8080/api
  parameters:
  - name: rate
    type: string
    description: Rate like 10r/s or 30r/m
  - name: burst
    type: integer
    description: Queue capacity for excess requests
  - name: key
    type: string
    description: 'Scoping key: IP, header, query param'
knowledge:
- title: nginx limit_req
  type: documentation
  source: https://nginx.org/en/docs/http/ngx_http_limit_req_module.html
  description: limit_req_zone, burst and nodelay
- title: HTTP 429 semantics
  type: documentation
  source: https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/429
  description: Too Many Requests and Retry-After
instructions: "# Rate Limiting\n\nLimit how often clients may hit endpoints, protecting services from\
  \ abuse and overload.\n\n## What this skill does\n\n- Configures nginx rate and connection limits\n\
  - Handles 429s with Retry-After\n- Scopes limits per IP or API key\n\n## When to use\n\n- Protecting\
  \ endpoints from bursts\n- Enforcing fair usage\n\n## Real commands\n\n```bash\n# Apply config\nnginx\
  \ -t && nginx -s reload\n\n# Verify limits\ncurl -s -o /dev/null -w \"%{http_code}\\n\" http://localhost:8080/api\n\
  ab -n 200 -c 20 http://localhost:8080/api\ncurl -sI http://localhost:8080/api | grep -i retry-after\n\
  ```\n\n## nginx config\n\n```nginx\nlimit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;\nlimit_conn_zone\
  \ $binary_remote_addr zone=conn:10m;\n\nserver {\n    location /api {\n        limit_req zone=api burst=20\
  \ nodelay;\n        limit_conn conn 10;\n        limit_req_status 429;\n    }\n}\n```\n\n## Scoping\n\
  \n- `$binary_remote_addr` - per IP\n- `$http_x_api_key` - per key\n- Combine with `limit_conn` for connection\
  \ caps\n\n## Best practices\n\n- Always return 429 with Retry-After\n- Test with ab/curl before going\
  \ live\n- Log limit hits for abuse analysis"
examples:
- input: Limit /api to 10 requests per second per IP
  output: The agent configures limit_req_zone and location block, then verifies with ab.
- input: Clients should know when they are throttled
  output: The agent adds limit_req_status 429 and Retry-After headers.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: rate-limiting.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
