name: real-user-monitoring
display_name: Real User Monitoring
category: api
subcategory: general
description: 'Capture real-user Core Web Vitals with Grafana Faro, run Lighthouse lab audits, and correlate field versus lab performance signals.'
version: 2.0.0
tags:
- api
author: Mehul Wagde
license: MIT
prerequisites:
- npm
- npx
capabilities:
- name: rum-instrumentation
  description: Instrument web apps for RUM with Faro, measure Core Web Vitals, and run lighthouse audits.
  commands:
  - npm install @grafana/faro-web-sdk @grafana/faro-web-tracing
  - npx lighthouse https://staging.your-app.test --output=json --output-path=report.json
  - npx lighthouse https://staging.your-app.test --preset=desktop --quiet --output=json
  - curl -s https://cdn.jsdelivr.net/npm/@grafana/faro-web-sdk/dist/core/index.js -o /dev/null -w "%{http_code}\n"
  - npm install web-vitals
  examples:
  - npx lighthouse https://staging.your-app.test --output=json --output-path=report.json | jq '.categories.performance.score'
  - npm install web-vitals
  - npx lighthouse https://staging.your-app.test --preset=desktop
  parameters:
  - name: url
    type: string
    description: Page URL to audit
  - name: preset
    type: string
    description: 'lighthouse preset: desktop or mobile'
  - name: output_path
    type: string
    description: Where to write the report
knowledge:
- title: Grafana Faro
  type: documentation
  source: https://grafana.com/docs/grafana-cloud/monitor-applications/frontend-observability/faro-web-sdk/
  description: Web SDK setup, transports and instrumentation
- title: Lighthouse CLI
  type: documentation
  source: https://github.com/GoogleChrome/lighthouse
  description: Lab-based performance audits from the CLI
instructions: "# Real User Monitoring\n\nRUM captures how actual browsers experience your app: LCP, CLS,\
  \ INP, errors and page loads.\n\n## What this skill does\n\n- Instruments web apps with Faro SDK\n-\
  \ Tracks Core Web Vitals\n- Runs lighthouse as a lab baseline\n\n## When to use\n\n- Performance budgets\
  \ and alerting\n- Comparing lab vs field data\n\n## Real commands\n\n```bash\n# Instrument\nnpm install\
  \ @grafana/faro-web-sdk @grafana/faro-web-tracing\nnpm install web-vitals\n\n# Lab check\nnpx lighthouse\
  \ https://staging.your-app.test --output=json --output-path=report.json\nnpx lighthouse https://staging.your-app.test --preset=desktop\
  \ --quiet\n```\n\n## Faro init\n\n```js\nimport { initializeFaro } from '@grafana/faro-web-sdk';\nimport\
  \ { TracingInstrumentation } from '@grafana/faro-web-tracing';\n\ninitializeFaro({\n  url: 'https://faro-collector.staging.your-app.test/collect',\n\
  \  app: { name: 'shop-web', version: '1.2.0' },\n  instrumentations: [new TracingInstrumentation()],\n\
  });\n```\n\n## Reading vitals\n\n- LCP under 2.5s, CLS under 0.1, INP under 200ms\n\n## Best practices\n\
  \n- Sample field data at scale (5-10%)\n- Correlate lab (lighthouse) and field (RUM) numbers\n- Alert\
  \ on LCP regressions from releases"
examples:
- input: Track real-user performance on my storefront
  output: The agent adds the Faro SDK and web-vitals collection, then verifies the collector receives
    events.
- input: Is my site fast enough? Check performance score
  output: The agent runs lighthouse and reads the performance category score.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: real-user-monitoring.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-real-user-monitoring
  generic:
    system_prompt: 'You are the Real User Monitoring specialist. You do it through rum-instrumentation:
      Instrument web apps for RUM with Faro, measure Core Web Vitals, and run lighthouse audits. The commands
      are real, e.g. `npm install @grafana/faro-web-sdk @grafana/faro-web-tracing`. You answer with exact
      commands, not abstractions, and flag anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2025-06-15T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
