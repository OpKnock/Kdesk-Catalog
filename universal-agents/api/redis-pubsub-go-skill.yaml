name: redis-pubsub-go
display_name: Redis Pubsub Go
category: api
subcategory: general
description: 'Publish and subscribe to Redis channels from Go using go-redis: channel and pattern subscriptions with graceful shutdown handling.'
version: 2.0.0
tags:
- api
author: Kdesk
license: MIT
prerequisites:
- redis-cli
capabilities:
- name: go-redis-pubsub
  description: Publish and subscribe to Redis channels from Go with the go-redis PubSub API
  commands:
  - go get github.com/redis/go-redis/v9
  - go mod init app && go mod tidy
  - go run main.go
  - redis-cli -p 6379 publish events:orders '{"id":1,"total":99}'
  - redis-cli -p 6379 pubsub channels
  examples:
  - redis-cli -p 6379 publish events:orders '{"id":1}'
  - redis-cli -p 6379 pubsub channels events:*
  - go run main.go
  parameters:
  - name: channel
    type: string
    description: Channel name to publish to or subscribe on
  - name: pattern
    type: string
    description: Glob pattern like events:* used with PSubscribe
  - name: poolSize
    type: integer
    description: go-redis connection pool size (default 10)
knowledge:
- title: go-redis PubSub docs
  type: documentation
  source: https://pkg.go.dev/github.com/redis/go-redis/v9#PubSub
  description: Subscribe, ReceiveMessage, ReceiveTimeout and channel lifecycle
- title: Redis pub/sub documentation
  type: documentation
  source: https://redis.io/docs/latest/develop/data-types/pubsub/
  description: Pub/sub semantics, pattern matching, and delivery guarantees
instructions: "# Redis Pub/Sub in Go\n\nHand-crafted skill for Redis publish/subscribe messaging with\
  \ the go-redis client.\n\n## What this skill does\n\n- Subscribes to exact channels and glob patterns\
  \ from Go\n- Publishes JSON messages from redis-cli or other producers\n- Handles ReceiveMessage timeouts\
  \ and reconnects in subscriber loops\n\n## When to use\n\n- Fanning out order events to multiple Go\
  \ services\n- Replacing polling with push notifications between services\n- Testing channel traffic\
  \ during a release\n\n## Real commands\n\n```bash\n# Add the client\ngo get github.com/redis/go-redis/v9\n\
  go mod init app && go mod tidy\n\n# Produce from the CLI while the Go subscriber runs\nredis-cli -p\
  \ 6379 publish events:orders '{\"id\":1,\"total\":99}'\n\n# Inspect live channels\nredis-cli -p 6379\
  \ pubsub channels\nredis-cli -p 6379 pubsub numsub events:orders\n\n# Run the subscriber\ngo run main.go\n\
  ```\n\n## Minimal subscriber\n\n```go\nimport \"github.com/redis/go-redis/v9\"\n\nsub := rdb.Subscribe(ctx,\
  \ \"events:orders\")\ndefer sub.Close()\n\nfor {\n    msg, err := sub.ReceiveMessage(ctx)\n    if err\
  \ != nil {\n        log.Println(\"recv:\", err)\n        continue\n    }\n    log.Printf(\"order event:\
  \ %s\", msg.Payload)\n}\n```\n\n## Testing\n\n```bash\n# Publish from a second terminal and watch the\
  \ subscriber print\nredis-cli -p 6379 publish events:orders '{\"id\":2,\"total\":49}'\nredis-cli -p\
  \ 6379 psubscribe 'events:*'\n```\n\n## Best practices\n\n- Always Close() the PubSub object to avoid\
  \ leaking the connection\n- Run one subscriber goroutine per channel with a select on ctx.Done()\n-\
  \ JSON-encode payloads so every consumer can decode them safely\n"
examples:
- input: How do I subscribe to all order events from Go?
  output: Use sub := rdb.Subscribe(ctx, "events:orders") in a loop with sub.ReceiveMessage(ctx), and verify
    with redis-cli -p 6379 pubsub channels.
- input: Send a test message to my subscriber
  output: redis-cli -p 6379 publish events:orders '{"id":1,"total":99}' and watch the Go subscriber log
    it.
