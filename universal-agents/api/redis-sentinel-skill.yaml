name: redis-sentinel
display_name: Redis Sentinel
category: api
subcategory: general
description: 'Run Redis high availability with Sentinel: monitor masters, trigger quorum-based failover, and discover the current master endpoint for clients.'
version: 2.0.0
tags:
- api
author: Mehul Wagde
license: MIT
prerequisites:
- redis-cli
- redis-sentinel
capabilities:
- name: sentinel-operations
  description: 'Operate Redis Sentinel: monitor, failover, and inspect master/replica state'
  commands:
  - redis-sentinel /etc/redis/sentinel.conf
  - redis-cli -p 26379 SENTINEL masters
  - redis-cli -p 26379 SENTINEL get-master-addr-by-name mymaster
  - redis-cli -p 26379 SENTINEL monitor mymaster 127.0.0.1 6379 2
  - redis-cli -p 26379 SENTINEL failover mymaster
  - redis-cli -p 26379 SENTINEL replica mymaster 127.0.0.1 6380
  examples:
  - redis-cli -p 26379 SENTINEL get-master-addr-by-name mymaster
  - redis-cli -p 26379 SENTINEL ckquorum mymaster
  - redis-cli -p 26379 SENTINEL failover mymaster
  parameters:
  - name: master_name
    type: string
    description: Logical name of the monitored master, e.g. mymaster
  - name: quorum
    type: integer
    description: Number of sentinels that must agree before failover
  - name: down_after_milliseconds
    type: integer
    description: How long a master must be unreachable before it is flagged
