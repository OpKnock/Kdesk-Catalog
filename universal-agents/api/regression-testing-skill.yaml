name: regression-testing
display_name: Regression Testing
category: api
subcategory: general
description: 'Hand-crafted regression testing skill: pytest focused reruns, flaky test triage, git bisect
  for bug introduction, and CI gating with junitxml.'
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
prerequisites:
- git
- pytest
capabilities:
- name: regression-guard
  description: Find and prevent regressions with pytest and git bisect
  commands:
  - pytest tests/ -q
  - pytest tests/ --lf --tb=short
  - pytest tests/ -k 'auth or billing' --junitxml=report.xml
  - git bisect start && git bisect bad && git bisect good v1.2.0
  - git log --oneline -15
  examples:
  - pytest tests/ --lf -x
  - git bisect run pytest tests/ -q
  - pytest tests/ --durations=10 -q
  parameters:
  - name: last_failed
    type: boolean
    description: 'pytest --lf: only rerun tests that failed last run'
  - name: junitxml
    type: string
    description: Path to write JUnit XML for CI
  - name: expression
    type: string
    description: pytest -k expression to select tests
knowledge:
- title: pytest usage docs
  type: documentation
  source: https://docs.pytest.org/en/stable/how-to/usage.html
  description: --lf, -k, junitxml, and selection options
- title: git bisect docs
  type: documentation
  source: https://git-scm.com/docs/git-bisect
  description: Binary search across history to find the breaking commit
instructions: "# Regression Testing\n\nHand-crafted skill for catching and diagnosing regressions in API\
  \ codebases.\n\n## What this skill does\n\n- Runs the full suite and reruns only last-failed tests after\
  \ a fix\n- Isolates tests with -k expressions for fast local iteration\n- Uses git bisect to pinpoint\
  \ the commit that introduced a regression\n\n## When to use\n\n- A feature change broke unrelated behavior\n\
  - A flaky test is blocking CI\n- You need to identify exactly which commit broke an endpoint\n\n## Real\
  \ commands\n\n```bash\n# Full suite, quiet\npytest tests/ -q\n\n# Rerun only the tests that failed last\
  \ time\npytest tests/ --lf --tb=short\n\n# Targeted subset with JUnit output for CI\npytest tests/ -k\
  \ 'auth or billing' --junitxml=report.xml\n\n# Slowest tests to spot perf regressions\npytest tests/\
  \ --durations=10 -q\n\n# Find the breaking commit\ngit bisect start\ngit bisect bad            # current\
  \ HEAD is broken\ngit bisect good v1.2.0    # this tag was fine\ngit bisect run pytest tests/ -q\n```\n\
  \n## Flaky test triage\n\n```bash\n# Repeat a single test many times\npytest tests/test_auth.py::test_login\
  \ -x --count=20\n```\n\n## Testing in CI\n\n```yaml\n- name: Regression suite\n  run: pytest tests/\
  \ -q --junitxml=junit.xml --maxfail=3\n```\n\n## Best practices\n\n- Keep the suite green on main; --lf\
  \ makes local reruns fast\n- JUnit XML lets CI dashboards track flakiness over time\n- Automate git\
  \ bisect with `git bisect run` so no manual builds are needed\n"
examples:
- input: A fix is in; rerun only what failed
  output: pytest tests/ --lf --tb=short reruns the previously failed tests and shows short tracebacks.
- input: Which commit broke the login flow?
  output: git bisect start && git bisect bad && git bisect good <last-known-good> && git bisect run pytest
    tests/test_auth.py -q.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: regression-testing.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-regression-testing
  generic:
    system_prompt: 'You are the Regression Testing specialist. You do it through regression-guard: Find
      and prevent regressions with pytest and git bisect. The commands are real, e.g. `pytest tests/ -q`.
      You prefer the shortest safe path, and you reproduce failures before diagnosing them.'
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2024-01-01T00:00:00Z'
updated_at: '2024-01-01T00:00:00Z'
