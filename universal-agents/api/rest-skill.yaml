name: rest
display_name: Rest
category: api
subcategory: general
description: 'Hand-crafted core REST skill: resource modeling, curl CRUD flows, status code semantics,
  and JSON handling with jq for daily API work.'
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
capabilities:
- name: rest-crud
  description: Execute and debug REST CRUD flows with curl and jq
  commands:
  - 'curl -s -X POST https://api.example.com/v1/orders -H ''Content-Type: application/json'' -d ''{"customer":7,"total":199}'''
  - 'curl -s -X PUT https://api.example.com/v1/orders/7 -H ''Content-Type: application/json'' -d ''{"status":"shipped"}'''
  - curl -s https://api.example.com/v1/orders/7 | jq '.total'
  - curl -s -o /dev/null -w '%{http_code}\n' -X DELETE https://api.example.com/v1/orders/7
  - curl -i https://api.example.com/v1/orders?page=2
  examples:
  - curl -s https://api.example.com/v1/orders | jq '.items[] | {id, total}'
  - curl -s -X PATCH https://api.example.com/v1/orders/7 -d '{"status":"canceled"}'
  - curl -s -o /dev/null -w '%{http_code}\n' https://api.example.com/v1/orders/999
  parameters:
  - name: url
    type: string
    description: Endpoint URL including path and query
  - name: method
    type: string
    description: 'HTTP verb: GET, POST, PUT, PATCH, DELETE'
  - name: body
    type: string
    description: JSON request body for mutating requests
knowledge:
- title: MDN HTTP methods
  type: documentation
  source: https://developer.mozilla.org/en-US/docs/Web/HTTP/Methods
  description: Semantics of GET, POST, PUT, PATCH, DELETE
- title: curl man page
  type: documentation
  source: https://curl.se/docs/manpage.html
  description: All curl flags used for API debugging
instructions: '# REST APIs


  Hand-crafted skill for building and debugging REST APIs.


  ## What this skill does


  - Models resources and picks the right verb per operation

  - Exercises CRUD flows end-to-end with curl

  - Reads and asserts on JSON responses with jq


  ## When to use


  - Designing a new resource endpoint

  - Reproducing a bug report against a running API

  - Verifying behavior before writing tests


  ## Real commands


  ```bash

  # Create (expect 201)

  curl -s -X POST https://api.example.com/v1/orders -H ''Content-Type: application/json'' -d ''{"customer":7,"total":199}''


  # Read one (expect 200)

  curl -s https://api.example.com/v1/orders/7 | jq ''.total''


  # List with query params

  curl -i https://api.example.com/v1/orders?page=2


  # Full update vs partial update

  curl -s -X PUT https://api.example.com/v1/orders/7 -H ''Content-Type: application/json'' -d ''{"customer":7,"total":199,"status":"shipped"}''

  curl -s -X PATCH https://api.example.com/v1/orders/7 -d ''{"status":"canceled"}''


  # Delete (expect 204)

  curl -s -o /dev/null -w ''%{http_code}\n'' -X DELETE https://api.example.com/v1/orders/7


  # Not found check

  curl -s -o /dev/null -w ''%{http_code}\n'' https://api.example.com/v1/orders/999

  ```


  ## Status code semantics


  - 200 success, 201 created, 204 no content

  - 400 client error, 401 unauthenticated, 403 forbidden, 404 not found

  - 409 conflict, 422 validation, 429 rate limited, 500 server error


  ## Testing


  ```bash

  curl -s https://api.example.com/v1/orders | jq ''.items | length''

  ```


  ## Best practices


  - Use nouns for resources, not verbs: /orders not /getOrders

  - Return 201 + Location header on create, 204 on delete

  - Keep GET endpoints side-effect free

  '
examples:
- input: Create an order and confirm it was stored
  output: 'curl -s -X POST https://api.example.com/v1/orders -H ''Content-Type: application/json'' -d
    ''{"customer":7,"total":199}'' expecting 201, then curl -s https://api.example.com/v1/orders/7 | jq
    ''.total''.'
- input: Why do I get 404 on a valid-looking URL?
  output: Verify the resource id and route prefix; curl -i shows the path; check /v1 exists and the id
    is numeric.
