- name: rest-versioning
  description: 'Versioned REST design: media types, cursors, conditional requests'
  commands:
  - 'curl -s -H ''Accept: application/vnd.myapi.v2+json'' https://api.example.com/users'
  - curl -s 'https://api.example.com/users?cursor=abc123&limit=100' | jq '.next_cursor'
  - curl -i https://api.example.com/users/42
  - 'curl -s -H ''If-None-Match: "etag-42"'' https://api.example.com/users/42'
  - 'curl -s -H ''Prefer: return=representation'' -X PATCH https://api.example.com/users/42 -d ''{"name":"Ada"}'''
  examples:
  - curl -s 'https://api.example.com/users?cursor=abc123&limit=100'
  - 'curl -i -H ''Accept: application/vnd.myapi.v2+json'' https://api.example.com/users'
  - 'curl -s -H ''If-None-Match: "etag-42"'' -o /dev/null -w ''%{http_code}\n'' https://api.example.com/users/42'
  parameters:
  - name: accept_header
    type: string
    description: Media type selecting the API version, e.g. application/vnd.myapi.v2+json
  - name: cursor
    type: string
    description: Opaque pagination token from the previous page
  - name: limit
    type: integer
    description: Page size for list endpoints
