  description: 'Prefer: return=representation/minimal semantics'
instructions: '# REST API Versioning (v2 conventions)


  Hand-crafted skill for versioned REST APIs with cursor pagination and conditional requests.


  ## What this skill does


  - Version APIs via Accept media types instead of URL breaking changes

  - Paginates with opaque cursors instead of page numbers

  - Uses ETags, If-None-Match, and Prefer headers to save bandwidth


  ## When to use


  - Launching a breaking change to an existing API

  - Adding fields that existing clients must not see

  - Optimizing list endpoints used by mobile clients


  ## Real commands


  ```bash

  # Pick the version with the Accept header

  curl -s -H ''Accept: application/vnd.myapi.v2+json'' https://api.example.com/users


  # Cursor pagination: read the next cursor from the response

  curl -s ''https://api.example.com/users?cursor=abc123&limit=100'' | jq ''.next_cursor''


  # Conditional GET: 304 if nothing changed

  curl -i https://api.example.com/users/42

  curl -s -H ''If-None-Match: "etag-42"'' -o /dev/null -w ''%{http_code}\n'' https://api.example.com/users/42


  # Ask the server to return the updated representation

  curl -s -H ''Prefer: return=representation'' -X PATCH https://api.example.com/users/42 -d ''{"name":"Ada"}''

  ```


  ## Design rules


  - Never change response shape of a live version; add a new version

  - Cursors are opaque: clients must not decode or construct them

  - List endpoints return {items, next_cursor} and drop cursor support at the end


  ## Testing


  ```bash

  # Paginate until next_cursor is null

  curl -s ''https://api.example.com/users?limit=100''

  curl -s ''https://api.example.com/users?cursor=abc123&limit=100''

  ```


  ## Best practices


  - Keep at least one version overlapping during migrations

  - Deprecate old versions with a Sunset header and changelog

  - Validate ETags on writes with If-Match to prevent lost updates

  '
examples:
- input: Add a breaking field without breaking old clients
  output: Keep v1 responses unchanged and serve new fields under application/vnd.myapi.v2+json; old clients
    keep defaulting to v1.
- input: Walk all pages of a list
  output: Loop curl -s 'https://api.example.com/users?cursor=<next_cursor>&limit=100' until the next_cursor
    field is null.
