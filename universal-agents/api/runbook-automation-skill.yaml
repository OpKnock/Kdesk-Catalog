name: runbook-automation
display_name: Runbook Automation
category: api
subcategory: general
description: 'Expert reference for automating incident runbooks end to end with kubectl/journalctl checks, Slack webhook alerts, PagerDuty event API, and scripted remediation playbooks.'
version: 2.0.0
tags:
- api
author: Kdesk
license: MIT
prerequisites:
- ansible-playbook
- journalctl
- kubectl
capabilities:
- name: incident-runbook
  description: 'Automate incident response: diagnose, alert, remediate'
  commands:
  - kubectl describe pod api-7d9f -n prod | tail -40
  - journalctl -u api -n 100 --no-pager
  - 'curl -X POST https://hooks.slack.com/services/T123456/B789012/XYZ789 -H ''Content-Type: application/json''
    -d ''{"text":":fire: API latency above 5s"}'''
  - 'curl -X POST -H ''Content-Type: application/json'' -H ''X-Routing-Key: rk_abc123def456'' -d ''{"event_type":"trigger","payload":{"summary":"API
    down","source":"probe"}}'' https://events.pagerduty.com/v2/enqueue'
  - ansible-playbook -i inventory.ini runbooks/restart-api.yml
  examples:
  - journalctl -u api -n 100 --no-pager -f
  - 'curl -X POST https://hooks.slack.com/services/T123456/B789012/XYZ789 -H ''Content-Type: application/json''
    -d ''{"text":"deploy finished"}'''
  - kubectl get events -n prod --sort-by=.lastTimestamp | tail -20
  parameters:
  - name: webhook_url
    type: string
    description: Slack incoming webhook URL
  - name: service
    type: string
    description: systemd unit or k8s service name
  - name: playbook
    type: string
    description: Ansible playbook path
knowledge:
- title: Slack incoming webhooks
  type: documentation
  source: https://api.slack.com/messaging/webhooks
  description: Message payloads and webhook URLs
- title: PagerDuty Events API v2
  type: documentation
  source: https://developer.pagerduty.com/docs/events-api-v2/trigger-events/
  description: trigger/resolve event JSON
instructions: "# Runbook Automation\n\nExpert skill for automating incident runbooks end to end.\n\
  \n## What this skill does\n\n- Gathers diagnostics fast: pod state, logs, recent events\n- Pages humans\
  \ with Slack webhooks and PagerDuty events\n- Runs scripted remediation with Ansible or shell\n\n##\
  \ When to use\n\n- On-call pages for symptoms that have known fixes\n- Standardizing what the first\
  \ responder actually runs\n- Wiring probes to paging instead of manual checks\n\n## Real commands\n\n\
  ```bash\n# Diagnose\nkubectl describe pod api-7d9f -n prod | tail -40\nkubectl get events -n prod --sort-by=.lastTimestamp\
  \ | tail -20\njournalctl -u api -n 100 --no-pager\n\n# Alert to Slack\ncurl -X POST https://hooks.slack.com/services/T123456/B789012/XYZ789\
  \ -H 'Content-Type: application/json' -d '{\"text\":\":fire: API latency above 5s\"}'\n\n# Page via\
  \ PagerDuty Events API v2\ncurl -X POST -H 'Content-Type: application/json' -H 'X-Routing-Key: rk_abc123def456'\
  \ -d '{\"event_type\":\"trigger\",\"payload\":{\"summary\":\"API down\",\"source\":\"probe\"}}' https://events.pagerduty.com/v2/enqueue\n\
  \n# Remediate\nansible-playbook -i inventory.ini runbooks/restart-api.yml\n```\n\n## Playbook skeleton\n\
  \n```yaml\n- hosts: api\n  tasks:\n    - name: Restart api service\n      ansible.builtin.service:\n\
  \        name: api\n        state: restarted\n```\n\n## Testing\n\n```bash\n# Dry-run remediation\n\
  ansible-playbook -i inventory.ini runbooks/restart-api.yml --check\n# Test the webhook with a benign\
  \ message\ncurl -X POST https://hooks.slack.com/services/T123456/B789012/XYZ789 -H 'Content-Type: application/json'\
  \ -d '{\"text\":\"test\"}'\n```\n\n## Best practices\n\n- Every runbook step must be a single command\
  \ or script\n- Test webhooks before incidents; use pagerduty resolve on recovery\n- Log which runbook\
  \ fired and its outcome to your ops store\n"
examples:
- input: Automate the page when /healthz fails 3 times
  output: A probe script curls /healthz, and on failure posts to the Slack webhook and PagerDuty trigger
    endpoint, then runs the restart playbook.
- input: What should the first responder run?
  output: 'Point them at the runbook: kubectl describe pod <pod> -n prod, journalctl -u api -n 100, then
    the Ansible restart playbook.'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: runbook-automation.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-runbook-automation
  generic:
    system_prompt: 'You are the Runbook Automation specialist. You do it through incident-runbook: Automate
      incident response: diagnose, alert, remediate. The commands are real, e.g. `kubectl describe pod
      api-7d9f -n prod | tail -40`. You run and verify the real CLI commands before you claim anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
