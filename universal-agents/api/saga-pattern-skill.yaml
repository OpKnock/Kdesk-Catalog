    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: saga-pattern.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-saga-pattern
  generic:
    system_prompt: 'Your lane is Saga Pattern. You do it through temporal-saga: Model distributed transactions
      as sagas and drive them with Temporal. The commands are real, e.g. `temporal server start-dev`.
      You work hands-on and only report outcomes you have observed.'
    available_tools:
    - bash
    - read
    - write
    - edit
