- title: Salvo repo
  type: documentation
  source: https://github.com/salvo-rs/salvo
  description: Examples and feature flags
instructions: "# Salvo (Rust web framework)\n\nExpert skill for building async web APIs with Salvo.\n\
  \n## What this skill does\n\n- Wires handler functions into a Router tree\n- Starts an async HTTP server\
  \ on a TcpListener\n- Adds middleware for logging, CORS, and tracing\n\n## When to use\n\n- High-throughput\
  \ Rust APIs that prefer hyper over full frameworks\n- Services where handler composition with Router\
  \ chains fits the design\n- Replacing Actix for smaller, hyper-native deployments\n\n## Real commands\n\
  \n```bash\n# Scaffold\ncargo new salvo-app && cd salvo-app && cargo add salvo\n\n# Run\ncargo run\n\n\
  # Exercise routes\ncurl -s http://localhost:5800/hello\ncurl -s -X POST http://localhost:5800/api/echo\
  \ -d 'ping'\n```\n\n## Main example\n\n```rust\nuse salvo::prelude::*;\n\n#[handler]\nasync fn hello()\
  \ -> &'static str {\n    \"Hello from Salvo\"\n}\n\n#[handler]\nasync fn echo(req: &mut Request) ->\
  \ String {\n    req.parse_body::<String>().await.unwrap_or_default()\n}\n\n#[tokio::main]\nasync fn\
  \ main() {\n    let router = Router::new()\n        .get(hello)\n        .push(Router::with_path(\"\
  api\").push(Router::with_path(\"echo\").post(echo)));\n    Server::new(TcpListener::bind(\"0.0.0.0:5800\"\
  )).serve(router).await;\n}\n```\n\n## Testing\n\n```bash\ncargo run\ncurl -s http://localhost:5800/hello\n\
  curl -s -X POST http://localhost:5800/api/echo -d 'ping'\n```\n\n## Best practices\n\n- Push path segments\
  \ into Router::with_path chains for readable trees\n- Use the #[handler] attribute so functions gain\
  \ the trait impls\n- Enable the features you need in cargo add to keep compile time low\n"
examples:
- input: Stand up a Salvo API quickly
  output: 'cargo new salvo-app && cargo add salvo, write a #[handler] fn, mount it on Router::new(), then
    cargo run and curl localhost:5800/hello.'
- input: Add a POST echo endpoint
  output: 'Add #[handler] async fn echo, mount Router::with_path("api").push(Router::with_path("echo").post(echo)),
    and test with curl -X POST -d ''ping''.'
