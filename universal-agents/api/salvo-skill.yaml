description: 'Expert Salvo (Rust) reference covering handler functions, Router chains, middleware, and Server startup suited to building async web APIs in Rust.'
version: 2.0.0
tags:
- api
author: Mehul Wagde
license: MIT
prerequisites:
- cargo
capabilities:
- name: salvo-web
  description: Build async Rust web APIs with the Salvo framework
  commands:
  - cargo new salvo-app && cd salvo-app && cargo add salvo
  - cargo run
  - curl -s http://localhost:5800/hello
  - curl -s -X POST http://localhost:5800/api/echo -d 'ping'
  - cargo add tokio --features rt-multi-thread,macros
  examples:
  - cargo run
  - curl -s http://localhost:5800/hello
  - curl -s -X POST http://localhost:5800/api/echo -d 'ping'
  parameters:
  - name: path
    type: string
    description: Router path like hello or api/<id>
  - name: port
    type: integer
    description: Bind port passed to TcpListener
  - name: handler
    type: string
    description: Handler function name registered on the router
knowledge:
- title: Salvo documentation
  type: documentation
