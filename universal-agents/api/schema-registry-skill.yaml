knowledge:
- title: Schema Registry API reference
  type: documentation
  source: https://docs.confluent.io/platform/current/schema-registry/develop/api.html
  description: Subjects, versions, compatibility endpoints
- title: Schema Registry docs
  type: documentation
  source: https://docs.confluent.io/platform/current/schema-registry/index.html
  description: 'Concepts: subjects, versions, compatibility modes'
instructions: '# Schema Registry
 
 
  Expert skill for managing Avro schemas with Confluent Schema Registry.


  ## What this skill does


  - Lists subjects and versions registered in the registry

  - Registers new schema versions over the REST API

  - Pre-checks compatibility before a schema can break consumers


  ## When to use


  - Releasing a new Kafka message format

  - Enforcing backward compatibility on shared topics

  - Investigating schema-not-found producer errors


  ## Real commands


  ```bash

  # List subjects

  curl -s http://localhost:8081/subjects


  # Latest version of one subject

  curl -s http://localhost:8081/subjects/orders-value/versions/latest | jq .version


  # Register a new version (payload: {"schema": "..."})

  curl -X POST http://localhost:8081/subjects/orders-value/versions -H ''Content-Type: application/vnd.schemaregistry.v1+json''
  -d @new-schema.json


  # Compatibility check against latest (BACKWARD by default)

  curl -s -H ''Content-Type: application/vnd.schemaregistry.v1+json'' ''http://localhost:8081/compat/subjects/orders-value/versions/latest''
  -d @candidate.json


  # Produce with the registry

  kafka-avro-console-producer --broker-list localhost:9092 --topic orders --property schema.registry.url=http://localhost:8081
  --property value.schema="$(cat order.avsc)"

  ```


  ## Config


  ```json

  // candidate.json

  { "schema": "{"type":"record","name":"Order","fields":[{"name":"id","type":"long"},{"name":"email","type":"string","default":""}]}"
  }

  ```


  ## Testing


  ```bash

  curl -s http://localhost:8081/subjects/orders-value/versions | jq

  curl -s http://localhost:8081/config | jq   # current compatibility mode

  ```


  ## Best practices


  - Set compatibility per subject before the first breaking need: BACKWARD

  - Check /compat before registering, not after producers fail

  - Version consumers with the same tag as the schema version

  '
examples:
- input: Register the initial orders schema
  output: 'curl -X POST http://localhost:8081/subjects/orders-value/versions -H ''Content-Type: application/vnd.schemaregistry.v1+json''
    -d @new-schema.json returns the assigned version 1.'
- input: Will my new schema break existing consumers?
  output: 'curl -s -H ''Content-Type: application/vnd.schemaregistry.v1+json'' ''http://localhost:8081/compat/subjects/orders-value/versions/latest''
    -d @candidate.json returns is_compatible: true or the failure reason.'
