- name: schema-registry-api
  description: Register and validate schemas against the Confluent Schema Registry
  commands:
  - curl -s http://localhost:8081/subjects
  - curl -s http://localhost:8081/subjects/orders-value/versions/latest | jq .version
  - 'curl -X POST http://localhost:8081/subjects/orders-value/versions -H ''Content-Type: application/vnd.schemaregistry.v1+json''
    -d @new-schema.json'
  - 'curl -s -H ''Content-Type: application/vnd.schemaregistry.v1+json'' ''http://localhost:8081/compat/subjects/orders-value/versions/latest''
    -d @candidate.json'
  - kafka-avro-console-producer --broker-list localhost:9092 --topic orders --property schema.registry.url=http://localhost:8081
    --property value.schema="$(cat order.avsc)"
  examples:
  - curl -s http://localhost:8081/subjects/orders-value/versions | jq
  - 'curl -X POST http://localhost:8081/subjects/orders-value/versions -H ''Content-Type: application/vnd.schemaregistry.v1+json''
    -d @new-schema.json'
  - curl -s http://localhost:8081/config | jq
