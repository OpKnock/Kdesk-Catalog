name: sdk-generation
display_name: Sdk Generation
category: api
subcategory: general
description: 'Expert reference for producing typed client SDKs for Go, Java, TypeScript, and Python from OpenAPI specs with openapi-generator and autorest.'
version: 2.0.0
tags:
- api
author: Mehul Wagde
license: MIT
prerequisites:
- npx
capabilities:
- name: multi-language-sdk
  description: Generate and validate client SDKs in multiple languages
  commands:
  - npx @openapitools/openapi-generator-cli generate -i openapi.yaml -g go -o sdk/go
  - npx @openapitools/openapi-generator-cli generate -i openapi.yaml -g java -o sdk/java --library=okhttp-gson
  - npx @openapitools/openapi-generator-cli generate -i openapi.yaml -g typescript-fetch -o sdk/ts --additional-properties=supportsES6=true
  - npx @openapitools/openapi-generator-cli generate -i openapi.yaml -g python -o sdk/python
  - npx @openapitools/openapi-generator-cli config-help -g python
  examples:
  - npx @openapitools/openapi-generator-cli generate -i openapi.yaml -g java -o sdk/java --library=okhttp-gson
  - npx @openapitools/openapi-generator-cli generate -i openapi.yaml -g typescript-fetch -o sdk/ts
  - npx autorest --input-file=swagger.json --csharp --output-folder=./sdk/csharp
  parameters:
  - name: language
    type: string
    description: Target language and library, e.g. java + okhttp-gson
  - name: input
    type: string
    description: OpenAPI or Swagger input file
  - name: output
    type: string
    description: Output directory for the generated SDK
knowledge:
- title: OpenAPI Generator generators list
  type: documentation
  source: https://openapi-generator.tech/docs/generators
  description: All supported languages, libraries, and config options
- title: AutoRest docs
  type: documentation
  source: https://github.com/Azure/autorest
  description: C# SDK generation from OpenAPI/Swagger
instructions: '# SDK Generation
 
 
  Expert skill for generating client SDKs from API specs.


  ## What this skill does


  - Generates typed clients for Go, Java, TypeScript, and Python

  - Configures libraries and code style per generator

  - Compiles the output to verify the SDK is usable


  ## When to use


  - Publishing a public API and shipping official clients

  - Internal services that share one contract with many teams

  - Avoiding hand-maintained HTTP wrappers


  ## Real commands


  ```bash

  # Go SDK

  npx @openapitools/openapi-generator-cli generate -i openapi.yaml -g go -o sdk/go


  # Java with OkHttp/Gson

  npx @openapitools/openapi-generator-cli generate -i openapi.yaml -g java -o sdk/java --library=okhttp-gson


  # TypeScript with fetch

  npx @openapitools/openapi-generator-cli generate -i openapi.yaml -g typescript-fetch -o sdk/ts --additional-properties=supportsES6=true


  # Python

  npx @openapitools/openapi-generator-cli generate -i openapi.yaml -g python -o sdk/python


  # Inspect generator options before generating

  npx @openapitools/openapi-generator-cli config-help -g python


  # C# with AutoRest

  npx autorest --input-file=swagger.json --csharp --output-folder=./sdk/csharp

  ```


  ## Verify the output


  ```bash

  cd sdk/python && pip install -e . && python -c ''from openapi_client.api.orders_api import OrdersApi;
  print(OrdersApi)''

  cd sdk/go && go build ./...

  cd sdk/ts && npm i && npx tsc --noEmit

  ```


  ## Versioning the SDK


  - Tag releases with the API version: sdk-v1.2.0

  - Regenerate only from tagged specs


  ## Best practices


  - Pin the generator version for reproducible output

  - Commit generated code to give consumers stable imports

  - Add a smoke test that calls the live API with the generated client

  '
examples:
- input: Ship a Java SDK for our API
  output: npx @openapitools/openapi-generator-cli generate -i openapi.yaml -g java -o sdk/java --library=okhttp-gson,
    then publish the generated maven project.
- input: Why is my generated SDK missing an endpoint?
  output: 'Re-validate the spec: npx @openapitools/openapi-generator-cli validate -i openapi.yaml; unregistered
    paths never reach the generators.'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: sdk-generation.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-sdk-generation
  generic:
    system_prompt: 'Your lane is Sdk Generation. You do it through multi-language-sdk: Generate and validate
      client SDKs in multiple languages. The commands are real, e.g. `npx @openapitools/openapi-generator-cli
      generate -i openapi.yaml -g go -o sdk/go`. You verify each step you report and stay honest about
      what you have not run.'
    available_tools:
    - bash
    - read
    - write
    - edit
