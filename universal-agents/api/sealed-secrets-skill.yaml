name: sealed-secrets
display_name: Sealed Secrets
category: api
subcategory: general
description: 'Expert reference for kubeseal encryption of Kubernetes Secrets, cert fetch/management, sealed secret creation, and GitOps-safe secret commits.'
version: 2.0.0
tags:
- api
author: Mehul Wagde
license: MIT
prerequisites:
- kubectl
- kubeseal
capabilities:
- name: kubeseal
  description: Encrypt Kubernetes Secrets with kubeseal and manage sealing certs
  commands:
  - kubeseal --fetch-cert --controller-name sealed-secrets --controller-namespace kube-system > pub-cert.pem
  - kubectl create secret generic db --from-literal=password=hunter2 --dry-run=client -o yaml | kubeseal
    --cert pub-cert.pem --format yaml > sealed-db.yaml
  - kubectl apply -f sealed-db.yaml
  - kubectl get sealedsecrets -o yaml
  - kubectl get secret db -o yaml
  examples:
  - kubectl create secret generic api --from-literal=API_KEY=xxx --dry-run=client -o yaml | kubeseal --format
    yaml > sealed-api.yaml
  - kubeseal --fetch-cert --controller-name sealed-secrets --controller-namespace kube-system > pub-cert.pem
  - kubectl apply -f sealed-db.yaml
  parameters:
  - name: controller_name
    type: string
    description: Sealed Secrets controller deployment name
  - name: namespace
    type: string
    description: Namespace the sealed secret will be created in
  - name: secret_name
    type: string
    description: Name of the target Kubernetes Secret
knowledge:
- title: Sealed Secrets repo
  type: documentation
  source: https://github.com/bitnami-labs/sealed-secrets
  description: kubeseal CLI, controller, and cert management
- title: kubeseal reference
  type: documentation
  source: https://github.com/bitnami-labs/sealed-secrets/tree/main/cmd/kubeseal
  description: All kubeseal flags and formats
instructions: "# Sealed Secrets\n\nExpert skill for GitOps-safe secrets with Bitnami Sealed Secrets.\n\
  \n## What this skill does\n\n- Encrypts Kubernetes Secrets into SealedSecret manifests with kubeseal\n\
  - Fetches the controller's public cert for offline sealing\n- Applies sealed manifests that the controller\
  \ unseals at runtime\n\n## When to use\n\n- Storing secrets in a git repository safely\n- Cluster bootstrap\
  \ where Vault is not available\n- Giving developers access to secret creation without the cluster key\n\
  \n## Real commands\n\n```bash\n# Fetch the controller public cert once\nkubeseal --fetch-cert --controller-name\
  \ sealed-secrets --controller-namespace kube-system > pub-cert.pem\n\n# Create and seal a secret\nkubectl\
  \ create secret generic db --from-literal=password=hunter2 --dry-run=client -o yaml | kubeseal --cert\
  \ pub-cert.pem --format yaml > sealed-db.yaml\n\n# Apply it; the controller decrypts into a regular\
  \ Secret\nkubectl apply -f sealed-db.yaml\n\n# Inspect results\nkubectl get sealedsecrets -o yaml\n\
  kubectl get secret db -o yaml\n```\n\n## SealedSecret example\n\n```yaml\napiVersion: bitnami.com/v1alpha1\n\
  kind: SealedSecret\nmetadata:\n  name: db\n  namespace: default\nspec:\n  encryptedData:\n    password:\
  \ AgBy3i4OJSWK+PiTySYZ...\n```\n\n## Testing\n\n```bash\nkubectl apply -f sealed-db.yaml\nkubectl get\
  \ secret db -o jsonpath='{.data.password}' | base64 -d\n```\n\n## Best practices\n\n- Seal with a scope\
  \ that includes the target namespace (default)\n- Back up the controller's private key: it is irreplaceable\n\
  - Commit only .yaml SealedSecrets, never plain Secrets\n"
examples:
- input: Commit a database password to git safely
  output: kubectl create secret generic db --from-literal=password=hunter2 --dry-run=client -o yaml |
    kubeseal --format yaml > sealed-db.yaml, commit that file, and kubectl apply -f sealed-db.yaml.
- input: Can I seal secrets offline?
  output: 'Yes: kubeseal --fetch-cert ... > pub-cert.pem once, then seal with kubeseal --cert pub-cert.pem
    without cluster access.'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: sealed-secrets.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-sealed-secrets
  generic:
    system_prompt: 'You own Sealed Secrets end to end. You do it through kubeseal: Encrypt Kubernetes
      Secrets with kubeseal and manage sealing certs. The commands are real, e.g. `kubeseal --fetch-cert
      --controller-name sealed-secrets --controller-namespace kube-system...`. You prefer the shortest
      safe path, and you reproduce failures before diagnosing them.'
    available_tools:
    - bash
    - read
    - write
    - edit
