name: serialization
display_name: Serialization
version: 2.0.0
type: skill
category: api
subcategory: general
description: "Generates typed code from Protocol Buffers and FlatBuffers schemas, validates and pretty-prints JSON payloads, and compares wire formats for size and schema evolution fit. Supports Go, Python, TypeScript, and Rust code generation pipelines."
author: Mehul Wagde
created_at: '2025-06-15T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
tags:
  - api
  - protobuf
  - flatbuffers
  - json
  - code-generation
prerequisites:
  - protoc
  - flatc
  - python
  - jq
capabilities:
- name: serialization-toolchain
  description: Compile and inspect serialization schemas and payloads
  commands:
  - protoc --version
  - protoc --python_out=. --proto_path=. user.proto
  - flatc --ts user.fbs
  - python -m json.tool payload.json
  - jq -c '.items[] | select(.price > 10)' data.json
  examples:
  - protoc --go_out=. --go_opt=paths=source_relative user.proto
  - flatc --ts user.fbs
  - python -m json.tool payload.json
  parameters:
  - name: schema_file
    type: string
    description: Input .proto or .fbs schema
  - name: language
    type: string
    description: Target language for code generation
  - name: input_file
    type: string
    description: Data file to validate or pretty-print
knowledge:
  - title: Protocol Buffers Documentation
    type: documentation
    source: https://protobuf.dev/
    description: proto3 language guide, code generation, and best practices
  - title: FlatBuffers Documentation
    type: documentation
    source: https://flatbuffers.dev/
    description: Schema language, compiler usage, and zero-copy access patterns
  - title: jq Manual
    type: documentation
    source: https://jqlang.github.io/jq/manual/
    description: Filter, transform, and validate JSON from the command line
instructions: "# Serialization\n\nHand-crafted skill for choosing and operating serialization formats.\n\
  \n## What this skill does\n\n- Generates typed code from protobuf and flatbuffers schemas\n- Validates\
  \ and pretty-prints JSON payloads\n- Compares formats for size and schema evolution fit\n\n## When to\
  \ use\n\n- Picking a wire format for a new service-to-service contract\n- Regenerating code after a\
  \ schema change\n- Debugging malformed JSON in API logs\n\n## Real commands\n\n```bash\n# Protobuf codegen\n\
  protoc --version\nprotoc --python_out=. --proto_path=. user.proto\nprotoc --go_out=. --go_opt=paths=source_relative\
  \ user.proto\n\n# FlatBuffers\nflatc --ts user.fbs\n\n# JSON tooling\npython -m json.tool payload.json\n\
  jq -c '.items[] | select(.price > 10)' data.json\njq '.data | keys' response.json\n```\n\n## Schema\
  \ example\n\n```proto\nsyntax = \"proto3\";\nmessage User {\n  string id = 1;\n  string email = 2;\n\
  \  int64 created_at = 3;\n}\n```\n\n```fbs\nnamespace app;\ntable User {\n  id: string;\n  email: string;\n\
  }\nroot_type User;\n```\n\n## Testing\n\n```bash\nprotoc --python_out=. --proto_path=. user.proto &&\
  \ python -c 'import user_pb2; print(user_pb2.User(id=\"1\", email=\"a@b.c\"))'\npython -m json.tool\
  \ payload.json > /dev/null && echo valid\n```\n\n## Best practices\n\n- Protobuf for high-traffic RPC\
  \ payloads; JSON for external APIs\n- Keep field numbers stable; they are the wire contract\n- Validate\
  \ JSON with jq or json.tool before it reaches consumers\n"
examples:
  - input: Generate Go structs from user.proto
    output: protoc --go_out=. --go_opt=paths=source_relative user.proto generates user.pb.go with typed structs.
  - input: Is this API response valid JSON?
    output: python -m json.tool payload.json prints the parsed document or the exact syntax error.
platforms:
  claude_code:
    tools:
      - Bash
      - Read
      - Write
      - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: serialization.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
      - bash
      - read
      - write
      - edit
  opencode:
    plugin: opencode-serialization
  generic:
    system_prompt: "You own Serialization end to end. You do it through serialization-toolchain: Compile and inspect serialization schemas and payloads. The commands are real, e.g. `protoc --version`. You prefer the shortest safe path, and you reproduce failures before diagnosing them."
    available_tools:
      - bash
      - read
      - write
      - edit
