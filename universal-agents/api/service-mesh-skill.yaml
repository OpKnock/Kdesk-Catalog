  description: "Installs and operates Istio or Linkerd service meshes in Kubernetes. Verifies sidecar injection, analyzes configuration, routes traffic with VirtualServices, and enables mTLS between services without application changes."
instructions: "# Service Mesh\n\nHand-crafted skill for installing and operating a service mesh.\n\n##\
  \ What this skill does\n\n- Installs Istio or Linkerd into a cluster\n- Verifies proxies are connected\
  \ and sidecars injected\n- Routes traffic with VirtualService rules\n\n## When to use\n\n- Enabling\
  \ mTLS between services without app changes\n- Adding fine-grained traffic routing or canaries\n- Rolling\
  \ out mesh observability (metrics, tracing)\n\n## Real commands\n\n```bash\n# Istio install (demo profile\
  \ for evaluation)\nistioctl install --set profile=demo -y\n\n# Static analysis of your config\nistioctl\
  \ analyze\n\n# Are proxies synced?\nistioctl proxy-status\n\n# Traffic rules\nkubectl get virtualservices\
  \ -A\nkubectl get virtualservices -A -o yaml\n\n# Linkerd bootstrap\nlinkerd check --pre && linkerd\
  \ install | kubectl apply -f -\nlinkerd check\nkubectl get deploy -n <ns> -o yaml | linkerd inject -\
  \ | kubectl apply -f -\n```\n\n## VirtualService example\n\n```yaml\napiVersion: networking.istio.io/v1beta1\n\
  kind: VirtualService\nmetadata:\n  name: api-routes\nspec:\n  hosts: [api]\n  http:\n    - match: [{\
  \ headers: { version: { exact: canary } } }]\n      route: [{ destination: { host: api, subset: v2 }\
  \ }]\n    - route: [{ destination: { host: api, subset: v1 } }]\n```\n\n## Testing\n\n```bash\nistioctl\
  \ proxy-status\nkubectl exec deploy/api -c istio-proxy -- curl -s localhost:15090/stats/prometheus |\
  \ grep istio_requests_total | head\n```\n\n## Best practices\n\n- Run istioctl analyze before and after\
  \ config changes\n- Inject sidecars namespace-wide with labels, not pod by pod\n- Validate mesh health\
  \ with linkerd check or istioctl proxy-status\n"
examples:
- input: Install Istio and verify it
  output: istioctl install --set profile=demo -y, then istioctl analyze and istioctl proxy-status to verify
    health.
- input: Route 10% of traffic to a canary subset
  output: Create a DestinationRule with subsets v1/v2 and a VirtualService with weighted routes, then
    kubectl apply -f and istioctl analyze.
