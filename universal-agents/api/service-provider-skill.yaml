name: service-provider
display_name: Service Provider
category: api
subcategory: general
description: 'Hand-crafted OIDC service provider skill: discovery document, authorization code exchange,
  userinfo, and JWKS validation for SP-side integration.'
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
capabilities:
- name: oidc-sp-integration
  description: 'Integrate as an OIDC service provider: discovery, tokens, userinfo'
  commands:
  - curl -s https://idp.example.com/.well-known/openid-configuration | jq -r '.authorization_endpoint,
    .token_endpoint, .jwks_uri'
  - curl -s -X POST https://idp.example.com/token -d "grant_type=authorization_code&code=$CODE&redirect_uri=https://app.example.com/cb&client_id=app1&client_secret=$CLIENT_SECRET"
    | jq -r .access_token
  - 'curl -s -H "Authorization: Bearer $TOKEN" https://idp.example.com/userinfo'
  - curl -s https://idp.example.com/.well-known/jwks.json | jq -r '.keys[0].kid'
  examples:
  - curl -s https://idp.example.com/.well-known/openid-configuration | jq -r '.authorization_endpoint'
  - 'curl -s -H "Authorization: Bearer $TOKEN" https://idp.example.com/userinfo | jq'
  - curl -s https://idp.example.com/.well-known/jwks.json | jq -r '.keys[].alg'
  parameters:
  - name: issuer
    type: string
    description: IdP issuer URL for discovery
  - name: client_id
    type: string
    description: Registered SP client ID
  - name: redirect_uri
    type: string
    description: Callback URL registered with the IdP
knowledge:
- title: OIDC Core spec
  type: documentation
  source: https://openid.net/specs/openid-connect-core-1_0.html
  description: Authorization code flow and userinfo
- title: OIDC discovery spec
  type: documentation
  source: https://openid.net/specs/openid-connect-discovery-1_0.html
  description: Discovery document fields
instructions: '# OIDC Service Provider


  Hand-crafted skill for integrating an application as an OIDC service provider.


  ## What this skill does


  - Discovers IdP endpoints from the well-known configuration

  - Exchanges authorization codes for tokens

  - Fetches userinfo and validates signatures with JWKS


  ## When to use


  - Wiring a new app into corporate SSO as the SP side

  - Debugging token endpoint failures

  - Verifying user claims after login


  ## Real commands


  ```bash

  # Discovery: find all endpoints dynamically

  curl -s https://idp.example.com/.well-known/openid-configuration | jq -r ''.authorization_endpoint,
  .token_endpoint, .jwks_uri''


  # Exchange the authorization code

  curl -s -X POST https://idp.example.com/token -d "grant_type=authorization_code&code=$CODE&redirect_uri=https://app.example.com/cb&client_id=app1&client_secret=$CLIENT_SECRET"
  | jq -r .access_token


  # Read the user''s claims

  curl -s -H "Authorization: Bearer $TOKEN" https://idp.example.com/userinfo | jq


  # Inspect signing keys

  curl -s https://idp.example.com/.well-known/jwks.json | jq -r ''.keys[].kid''

  ```


  ## SP checklist


  - Redirect to the authorization_endpoint with scope=openid profile email

  - Validate the id_token signature against JWKS and the issuer claim

  - Use userinfo only for non-critical profile data


  ## Testing


  ```bash

  curl -s https://idp.example.com/.well-known/openid-configuration | jq -r ''.token_endpoint''

  curl -s -H "Authorization: Bearer $TOKEN" https://idp.example.com/userinfo | jq ''.email''

  ```


  ## Best practices


  - Never hardcode endpoints; resolve them from discovery

  - Store client_secret server-side only

  - Cache JWKS and refresh on kid changes

  '
examples:
- input: Set up login with my company IdP
  output: Read /.well-known/openid-configuration for endpoints, register client_id/redirect_uri, then
    exchange the code at the token endpoint and read userinfo.
- input: Token endpoint returned invalid_grant
  output: 'Check the code was used once, redirect_uri matches exactly, and the client secret is current:
    replay with curl -X POST -d "grant_type=authorization_code&code=...".'
