name: sidecar-pattern
display_name: Sidecar Pattern
category: api
subcategory: general
description: "Operates sidecar containers in Kubernetes pods. Inspects container lists to confirm sidecar presence, reads sidecar logs and local stats endpoints, and runs standalone Envoy for local proxy configuration iteration."
version: 2.0.0
type: skill
tags:
- api
author: Mehul Wagde
license: MIT
prerequisites:
- envoy
- kubectl
capabilities:
- name: sidecar-ops
  description: "Operates sidecar containers in Kubernetes pods. Inspects container lists to confirm sidecar presence, reads sidecar logs and local stats endpoints, and runs standalone Envoy for local proxy configuration iteration."
  commands:
  - kubectl get pods -l app=api -o jsonpath='{.items[0].spec.containers[*].name}'
  - kubectl logs pod/api-7d9f -c istio-proxy --tail=50
  - kubectl exec -it pod/api-7d9f -c istio-proxy -- curl -s localhost:15090/stats/prometheus
  - kubectl exec -it pod/api-7d9f -c istio-proxy -- curl -s localhost:15020/healthz
  - envoy --config-path envoy.yaml
  examples:
  - kubectl get pods -l app=api -o jsonpath='{.items[0].spec.containers[*].name}'
  - kubectl logs pod/api-7d9f -c istio-proxy --tail=50
  - kubectl exec -it pod/api-7d9f -c istio-proxy -- curl -s localhost:15020/healthz
  - envoy --config-path envoy.yaml
  parameters:
  - name: pod_name
    type: string
    description: Kubernetes pod name containing the sidecar
  - name: sidecar_name
    type: string
    description: Sidecar container name (e.g., istio-proxy)
  - name: config_path
    type: string
    description: Path to Envoy config file for local testing
knowledge:
- title: Azure sidecar pattern
  type: documentation
  source: https://learn.microsoft.com/en-us/azure/architecture/patterns/sidecar
  description: "Operates sidecar containers in Kubernetes pods. Inspects container lists to confirm sidecar presence, reads sidecar logs and local stats endpoints, and runs standalone Envoy for local proxy configuration iteration."
instructions: "# Sidecar Pattern\n\nHand-crafted skill for operating sidecar containers in Kubernetes.\n\
  \n## What this skill does\n\n- Lists containers inside a pod to confirm the sidecar\n- Reads sidecar\
  \ logs and hits its local stats endpoints\n- Runs standalone envoy with a custom config for local testing\n\
  \n## When to use\n\n- Verifying istio-proxy or log-shipper sidecars are healthy\n- Debugging a sidecar\
  \ that restarts in a crash loop\n- Prototyping a proxy sidecar locally before deploying\n\n## Real commands\n\
  \n```bash\n# What containers run in the pod?\nkubectl get pods -l app=api -o jsonpath='{.items[0].spec.containers[*].name}'\n\
  \n# Sidecar logs\nkubectl logs pod/api-7d9f -c istio-proxy --tail=50\n\n# Stats from inside the sidecar\n\
  kubectl exec -it pod/api-7d9f -c istio-proxy -- curl -s localhost:15090/stats/prometheus | head -5\n\
  \n# Health check endpoint of the sidecar\nkubectl exec -it pod/api-7d9f -c istio-proxy -- curl -s localhost:15020/healthz\n\
  \n# Standalone envoy for local config iteration\nenvoy --config-path envoy.yaml\n```\n\n## Pod spec\n\
  \n```yaml\nspec:\n  containers:\n    - name: api\n      image: ghcr.io/example/api:v2.1\n    -\
  \ name: istio-proxy\n      image: proxyv2\n```\n\n## Testing\n\n```bash\nkubectl logs pod/api-7d9f -c\
  \ istio-proxy --tail=20\nkubectl exec -it pod/api-7d9f -c istio-proxy -- curl -s localhost:15090/stats/prometheus\
  \ | grep istio_requests_total | head\n```\n\n## Best practices\n\n- Give every sidecar a name and liveness\
  \ probe in the pod spec\n- Share volumes and localhost networking between app and sidecar\n- Never let\
  \ the app depend on the sidecar being the source of truth\n"
examples:
- input: Is the istio-proxy sidecar healthy?
  output: kubectl exec -it pod/api-7d9f -c istio-proxy -- curl -s localhost:15020/healthz, and tail logs
    with kubectl logs pod/api-7d9f -c istio-proxy --tail=50.
- input: Why is my log sidecar crash-looping?
  output: kubectl logs pod/api-7d9f -c log-shipper --previous shows the last run's stderr; check the shared
    volume path in the pod spec.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: sidecar-pattern.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-sidecar-pattern
  generic:
    system_prompt: 'You work Sidecar Pattern hands-on. You do it through sidecar-ops: Operate sidecar
      containers: inspect, log, configure, restart. The commands are real, e.g. `kubectl get pods -l app=api
      -o jsonpath={.items[0].spec.containers[*].name}`. You run and verify the real CLI commands before
      you claim anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
