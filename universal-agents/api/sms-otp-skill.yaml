  - curl -X POST "https://verify.twilio.com/v2/Services/$VERIFY_SID/VerificationChecks" -u "$TWILIO_ACCOUNT_SID:$TWILIO_AUTH_TOKEN" --data-urlencode "To=+15551234567" --data-urlencode "Code=123456"
