knowledge:
- title: Spring Boot docs
  type: documentation
  source: https://docs.spring.io/spring-boot/index.html
  description: "Scaffolds, runs, and tests Spring Boot applications written in Kotlin with Gradle. Generates projects from start.spring.io with selected starters, runs via bootRun, probes actuator health endpoints, and executes Kotlin test classes."
instructions: "# Spring Boot with Kotlin\n\nHand-crafted skill for Spring Boot applications written in\
  \ Kotlin.\n\n## What this skill does\n\n- Generates a Kotlin + Gradle project from start.spring.io\n\
  - Runs the app with bootRun and checks actuator health\n- Runs Kotlin test classes and builds the jar\n\
  \n## When to use\n\n- Starting a new Kotlin service on Spring Boot\n- Verifying a generated project\
  \ boots before writing code\n- Running the suite in CI with Gradle\n\n## Real commands\n\n```bash\n\
  # Scaffold: Kotlin + Gradle + web/data-jpa/actuator\ncurl -s https://start.spring.io/starter.zip -d\
  \ language=kotlin -d type=gradle-project -d dependencies=web,data-jpa,actuator -o demo.zip && unzip\
  \ demo.zip\n\n# Run the app\n./gradlew bootRun\n\n# Health check\ncurl -s localhost:8080/actuator/health\
  \ | jq .status\n\n# Run tests\n./gradlew test --tests 'com.example.demo.DemoApplicationTests'\n\n# Build\
  \ and run the jar\n./gradlew build && java -jar build/libs/demo-0.0.1-SNAPSHOT.jar\n```\n\n## Controller\
  \ example\n\n```kotlin\npackage com.example.demo\n\nimport org.springframework.web.bind.annotation.GetMapping\n\
  import org.springframework.web.bind.annotation.RestController\n\n@RestController\nclass HelloController\
  \ {\n    @GetMapping(\"/hello\")\n    fun hello() = mapOf(\"message\" to \"Hello from Kotlin\")\n}\n\
  ```\n\n## Testing\n\n```bash\n./gradlew bootRun &\ncurl -s localhost:8080/hello | jq .message\ncurl\
  \ -s localhost:8080/actuator/health | jq .status\n./gradlew test\n```\n\n## Best practices\n\n- Keep\
  \ controller code in Kotlin but services testable via interfaces\n- Use application.yaml for per-environment\
  \ profiles\n- Let Gradle handle the Spring plugin version via the wrapper\n"
examples:
- input: Bootstrap a Kotlin Spring Boot API
  output: curl the start.spring.io starter.zip endpoint with language=kotlin and dependencies=web,actuator,
    unzip, then ./gradlew bootRun and curl localhost:8080/actuator/health.
- input: Run just my unit tests
  output: ./gradlew test --tests 'com.example.demo.*' runs only the project's own test classes.
