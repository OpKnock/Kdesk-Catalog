name: starlette
display_name: Starlette
category: api
subcategory: general
description: "Build lightweight ASGI APIs with Starlette and uvicorn. Composes async route handlers, runs a dev server with hot reload, and validates endpoints using the in-process TestClient — no live server required."
version: 2.0.0
tags:
- api
author: Mehul Wagde
license: MIT
prerequisites:
- pip
- python
- uvicorn
capabilities:
- name: starlette-apps
  description: Build and test ASGI APIs with Starlette and uvicorn
  commands:
  - pip install starlette uvicorn
  - uvicorn app:app --reload --port 8000
  - curl -s localhost:8000/health
  - 'curl -s -X POST localhost:8000/items -H ''Content-Type: application/json'' -d ''{"name":"widget"}'''
  - python -c 'from starlette.testclient import TestClient; from app import app; c=TestClient(app); r=c.get("/health");
    print(r.status_code, r.json())'
  examples:
  - uvicorn app:app --reload --port 8000
  - curl -s localhost:8000/health
  - python -c 'from starlette.testclient import TestClient; from app import app; c=TestClient(app); print(c.get("/health").json())'
  parameters:
  - name: host
    type: string
    description: Bind host for uvicorn
  - name: port
    type: integer
    description: Bind port for uvicorn
  - name: reload
    type: boolean
    description: Auto-reload on source changes
knowledge:
- title: Starlette docs
  type: documentation
  source: https://www.starlette.io/
  description: Routing, middleware, and TestClient
- title: uvicorn docs
  type: documentation
  source: https://www.uvicorn.org/
  description: ASGI server settings
instructions: "# Starlette\n\nHand-crafted skill for building ASGI APIs with Starlette.\n\n## What this\
  \ skill does\n\n- Composes routes into an ASGI application\n- Serves it with uvicorn including reload\
  \ for dev\n- Tests handlers with the Starlette TestClient\n\n## When to use\n\n- Lightweight Python\
  \ APIs without framework magic\n- Services that need async performance\n- Building up to FastAPI from\
  \ its foundation\n\n## Real commands\n\n```bash\n# Install\npip install starlette uvicorn\n\n# Dev server\
  \ with reload\nuvicorn app:app --reload --port 8000\n\n# Exercise endpoints\ncurl -s localhost:8000/health\n\
  curl -s -X POST localhost:8000/items -H 'Content-Type: application/json' -d '{\"name\":\"widget\"}'\n\
  \n# In-process tests\npython -c 'from starlette.testclient import TestClient; from app import app; c=TestClient(app);\
  \ r=c.get(\"/health\"); print(r.status_code, r.json())'\n```\n\n## App example\n\n```python\nfrom starlette.applications\
  \ import Starlette\nfrom starlette.routing import Route\nfrom starlette.responses import JSONResponse\n\
  \nasync def health(request):\n    return JSONResponse({\"status\": \"ok\"})\n\nasync def create_item(request):\n\
  \    body = await request.json()\n    return JSONResponse({\"id\": 1, \"name\": body[\"name\"]}, status_code=201)\n\
  \napp = Starlette(routes=[\n    Route(\"/health\", health),\n    Route(\"/items\", create_item, methods=[\"\
  POST\"]),\n])\n```\n\n## Testing\n\n```bash\npython -m pytest -q\n# or\ncurl -s localhost:8000/health\n\
  ```\n\n## Best practices\n\n- Keep handlers async; use request.json() with await\n- Run uvicorn workers\
  \ = CPU count in production\n- Test with TestClient (httpx-based) before deploying\n"
examples:
- input: Serve a Starlette app locally
  output: uvicorn app:app --reload --port 8000, then curl -s localhost:8000/health.
- input: Test the app without a server
  output: python -c 'from starlette.testclient import TestClient; from app import app; c=TestClient(app);
    print(c.get("/health").status_code)'.
