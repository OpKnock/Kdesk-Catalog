name: timeout-pattern
display_name: Timeout Pattern
category: api
subcategory: general
description: "Apply timeouts at every layer of the call stack: HTTP client connect/read deadlines with curl and requests, gRPC deadlines with grpcurl, and proxy timeouts in nginx. Establishes a timeout ladder (client < proxy < backend) so hung downstreams fail fast without burning worker pools."
version: 2.0.0
tags:
- api
author: Kdesk
license: MIT
prerequisites:
- grpcurl
- python
capabilities:
- name: timeout-application
  description: Apply timeouts at client, proxy, and application layers
  commands:
  - curl --connect-timeout 5 --max-time 15 http://localhost:8080/slow
  - grpcurl -max-time 10 -d '{}' localhost:8080 svc.Health.Check
  - python -c 'import requests; requests.get("http://localhost:8080", timeout=(3.05, 15))'
  - curl -s -o /dev/null -w '%{http_code} %{time_total}\n' http://localhost:8080/health
  examples:
  - curl --connect-timeout 5 --max-time 15 http://localhost:8080/slow
  - grpcurl -max-time 10 -d '{}' localhost:8080 svc.Health.Check
  - python -c 'import requests; requests.get("http://localhost:8080", timeout=(3.05, 15))'
  parameters:
  - name: connect_timeout
    type: integer
    description: Seconds to establish the connection
  - name: total_timeout
    type: integer
    description: Seconds for the whole call
  - name: layer
    type: string
    description: client, proxy, or application
knowledge:
- title: nginx proxy module timeouts
  type: documentation
  source: https://nginx.org/en/docs/http/ngx_http_proxy_module.html#proxy_read_timeout
  description: proxy_connect/read/send_timeout
- title: curl timeouts
  type: documentation
  source: https://curl.se/docs/manpage.html#--max-time
  description: --max-time and --connect-timeout
instructions: "# Timeout Pattern\n\nHand-crafted skill for bounding call durations end to end.\n\n## What\
  \ this skill does\n\n- Sets connect and total timeouts on HTTP clients\n- Applies gRPC deadlines for\
  \ RPC calls\n- Configures proxy timeouts so backends cannot hang forever\n\n## When to use\n\n- A downstream\
  \ API occasionally hangs and burns workers\n- Proxies keep connections open to dead backends\n- Adding\
  \ timeout hygiene to a service before load\n\n## Real commands\n\n```bash\n# curl: 5s connect, 15s total\n\
  curl --connect-timeout 5 --max-time 15 https://api.example.com/slow\n\n# gRPC: 10s deadline\ngrpcurl\
  \ -max-time 10 -d '{}' localhost:8080 svc.Health.Check\n\n# Python requests: connect + read timeouts\n\
  python -c 'import requests; requests.get(\"https://api.example.com\", timeout=(3.05, 15))'\n\n# Measure\
  \ what the endpoint actually takes\ncurl -s -o /dev/null -w '%{http_code} %{time_total}\\n' https://api.example.com/health\n\
  ```\n\n## nginx config\n\n```nginx\nlocation /api/ {\n  proxy_connect_timeout 5s;\n  proxy_send_timeout\
  \ 30s;\n  proxy_read_timeout 30s;\n}\n```\n\n## Timeout ladder\n\n- connect: 2-5s, first byte: 5-10s,\
  \ total: 15-30s\n- gRPC deadlines slightly above expected p99 latency\n- Proxy read timeout longer than\
  \ the slowest valid response\n\n## Testing\n\n```bash\n# Simulate a hang with a slow endpoint, then:\n\
  curl --connect-timeout 5 --max-time 15 https://api.example.com/slow\n```\n\n## Best practices\n\n- Always\
  \ set both connect and total timeouts\n- Return 504 from proxies when the backend times out\n- Timeouts\
  \ should ladder: client < proxy < backend\n"
examples:
- input: Stop my workers hanging on a slow API
  output: Set curl --connect-timeout 5 --max-time 15 or requests.get(..., timeout=(3.05, 15)) so hung
    calls fail fast.
- input: nginx holds connections to a dead backend
  output: Set proxy_connect_timeout 5s and proxy_read_timeout 30s in the location block.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: timeout-pattern.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-timeout-pattern
  generic:
    system_prompt: 'You work Timeout Pattern hands-on. You do it through timeout-application: Apply timeouts
      at client, proxy, and application layers. The commands are real, e.g. `curl --connect-timeout 5
      --max-time 15 https://api.example.com/slow`. You verify each step you report and stay honest about
      what you have not run.'
    available_tools:
    - bash
    - read
    - write
    - edit
