name: toml
display_name: Toml
category: api
subcategory: general
description: "Query, validate, and format TOML configuration files using tomlq, yq, Python's stdlib tomllib, and taplo. Reads Cargo.toml and pyproject.toml values, enforces consistent formatting in CI, and parses TOML safely without external dependencies."
version: 2.0.0
tags:
- api
author: Mehul Wagde
license: MIT
prerequisites:
- python
- taplo
- tomlq
capabilities:
- name: toml-tooling
  description: Query, validate, and format TOML files
  commands:
  - tomlq -r '.package.name' Cargo.toml
  - yq -p toml '.tool.pytest.ini_options' pyproject.toml
  - python -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['package']['name'])"
  - taplo fmt Cargo.toml
  - taplo lint Cargo.toml
  examples:
  - tomlq -r '.package.version' Cargo.toml
  - yq -p toml '.dependencies.rocket' Cargo.toml
  - python -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); print(d['project']['dependencies'])"
  parameters:
  - name: file
    type: string
    description: TOML file to query or format
  - name: expression
    type: string
    description: jq-style path like .package.name
  - name: format
    type: boolean
    description: taplo fmt or --check
knowledge:
- title: TOML spec v1.0
  type: documentation
  source: https://toml.io/en/v1.0.0
  description: Table, array, and type syntax
- title: taplo CLI
  type: documentation
  source: https://taplo.tamasfe.dev/cli/introduction.html
  description: TOML formatter and linter
instructions: '# TOML


  Hand-crafted skill for reading and editing TOML configuration files.


  ## What this skill does


  - Queries TOML with tomlq and yq''s toml parser

  - Reads config with Python''s stdlib tomllib

  - Formats and lints with taplo


  ## When to use


  - Cargo.toml or pyproject.toml config questions

  - Editing .toml configs in CI scripts

  - Enforcing consistent formatting on TOML files


  ## Real commands


  ```bash

  # Query values

  tomlq -r ''.package.name'' Cargo.toml

  tomlq -r ''.package.version'' Cargo.toml


  # yq handles toml with -p toml

  yq -p toml ''.tool.pytest.ini_options'' pyproject.toml

  yq -p toml ''.dependencies.rocket'' Cargo.toml


  # Python stdlib (3.11+)

  python -c "import tomllib; print(tomllib.load(open(''Cargo.toml'',''rb''))[''package''][''name''])"

  python -c "import tomllib; d=tomllib.load(open(''pyproject.toml'',''rb'')); print(d[''project''][''dependencies''])"


  # Format and lint

  taplo fmt Cargo.toml

  taplo lint Cargo.toml

  taplo fmt --check .   # CI gate

  ```


  ## TOML basics


  ```toml

  [package]

  name = "demo"

  version = "0.1.0"


  [dependencies]

  rocket = "0.5.1"

  ```


  ## Testing


  ```bash

  tomlq -r ''.package.name'' Cargo.toml

  python -c "import tomllib; tomllib.load(open(''pyproject.toml'',''rb'')); print(''valid'')"

  ```


  ## Best practices


  - Prefer tomllib (read-only) over toml package for safety

  - Use yq -p toml to pipe TOML into other jq-style processing

  - Run taplo fmt --check in CI to keep formatting consistent

  '
examples:
- input: What version is my Rust crate?
  output: tomlq -r '.package.version' Cargo.toml or python -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['package']['version'])".
- input: Is this TOML file valid?
  output: python -c "import tomllib; tomllib.load(open('file.toml','rb')); print('valid')" reports the
    exact line of any syntax error.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: toml.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-toml
  generic:
    system_prompt: 'You take the Toml seat. You do it through toml-tooling: Query, validate, and format
      TOML files. The commands are real, e.g. `tomlq -r .package.name Cargo.toml`. You answer with exact
      commands, not abstractions, and flag anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
