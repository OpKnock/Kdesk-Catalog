name: totp
display_name: Totp
category: api
subcategory: general
description: "Generate and verify RFC 6238 time-based one-time passwords using oathtool and Python's pyotp. Produces 6 or 8-digit codes from base32 secrets, verifies with configurable time windows for clock skew, and outputs otpauth URIs for QR code enrollment — all without a physical authenticator device."
version: 2.0.0
tags:
- api
author: Kdesk
license: MIT
prerequisites:
- oathtool
- python
capabilities:
- name: totp-codes
  description: Generate and verify RFC 6238 TOTP codes
  commands:
  - oathtool --totp --base32 "JBSWY3DPEHPK3PXP"
  - oathtool --totp -d 8 --base32 "JBSWY3DPEHPK3PXP"
  - oathtool --totp --window 3 --base32 "JBSWY3DPEHPK3PXP"
  - python -c 'import pyotp; print(pyotp.TOTP("JBSWY3DPEHPK3PXP").now())'
  - python -c 'import pyotp; print(pyotp.TOTP("JBSWY3DPEHPK3PXP").verify("123456"))'
  examples:
  - oathtool --totp --base32 "JBSWY3DPEHPK3PXP"
  - python -c 'import pyotp; print(pyotp.TOTP("JBSWY3DPEHPK3PXP").now())'
  - python -c 'import pyotp; print(pyotp.TOTP("JBSWY3DPEHPK3PXP", interval=30).verify(input()))'
  parameters:
  - name: secret_base32
    type: string
    description: Base32-encoded shared secret
  - name: digits
    type: integer
    description: Code length, 6 or 8
  - name: window
    type: integer
    description: Steps before/after current allowed for verification
knowledge:
- title: RFC 6238 TOTP
  type: documentation
  source: https://www.rfc-editor.org/rfc/rfc6238
  description: TOTP algorithm and time step definition
- title: oathtool manual
  type: documentation
  source: https://www.nongnu.org/oath-toolkit/oathtool.1.html
  description: oathtool flags
instructions: '# TOTP


  Hand-crafted skill for time-based one-time passwords (RFC 6238).


  ## What this skill does


  - Generates 6/8-digit codes from a base32 secret

  - Verifies codes with a time window for clock skew

  - Produces secrets and codes from Python with pyotp


  ## When to use


  - Testing 2FA flows without a phone

  - Verifying TOTP secrets during onboarding

  - Building authenticator-app compatible logins


  ## Real commands


  ```bash

  # Current 6-digit code

  oathtool --totp --base32 "JBSWY3DPEHPK3PXP"


  # 8 digits

  oathtool --totp -d 8 --base32 "JBSWY3DPEHPK3PXP"


  # Verify including +/- 3 steps for skew

  oathtool --totp --window 3 --base32 "JBSWY3DPEHPK3PXP"


  # Python

  python -c ''import pyotp; print(pyotp.TOTP("JBSWY3DPEHPK3PXP").now())''

  python -c ''import pyotp; print(pyotp.TOTP("JBSWY3DPEHPK3PXP").verify("123456"))''

  ```


  ## Secret handling


  - Secrets are base32-encoded (A-Z 2-7)

  - The QR code URI: otpauth://totp/App:user?secret=JBSWY3DPEHPK3PXP&issuer=App

  - Never log secrets; derive them from key material at rest


  ## Testing


  ```bash

  CODE=$(oathtool --totp --base32 "JBSWY3DPEHPK3PXP")

  python -c "import pyotp; print(pyotp.TOTP(''JBSWY3DPEHPK3PXP'').verify(''$CODE''))"

  ```


  ## Best practices


  - Use a window of 1-3 steps only; larger windows weaken security

  - Hash secrets and codes at rest, never store plaintext

  - Accept one code once: track used codes per 30s step

  '
examples:
- input: Get the current TOTP code
  output: oathtool --totp --base32 "JBSWY3DPEHPK3PXP" prints the current 6-digit code.
- input: Verify a code a user typed
  output: python -c 'import pyotp; print(pyotp.TOTP("JBSWY3DPEHPK3PXP").verify("<typed>"))' returns True
    when within the valid step.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: totp.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-totp
  generic:
    system_prompt: 'You are the Totp specialist. You do it through totp-codes: Generate and verify RFC
      6238 TOTP codes. The commands are real, e.g. `oathtool --totp --base32 JBSWY3DPEHPK3PXP`. You answer
      with exact commands, not abstractions, and flag anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
