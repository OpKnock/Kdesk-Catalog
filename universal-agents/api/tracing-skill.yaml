name: tracing
display_name: Tracing
category: api
subcategory: general
description: Run the OTel Collector and route traces to backends.
version: 2.0.0
tags:
- api
author: Kdesk
license: MIT
prerequisites:
- docker
- otelcol-contrib
capabilities:
- name: otel-pipeline
  description: Run the OTel Collector and route traces to backends
  commands:
  - otelcol-contrib --config otel-collector.yaml
  - 'curl -X POST localhost:4318/v1/traces -H ''Content-Type: application/json'' -d ''{"resourceSpans":[]}'''
  - docker run -d -p 16686:16686 jaegertracing/all-in-one
  - docker run -d -p 9411:9411 openzipkin/zipkin
  - 'curl -X POST -H ''Content-Type: application/json'' localhost:9411/api/v2/spans -d ''[]'''
  examples:
  - otelcol-contrib --config otel-collector.yaml
  - docker run -d -p 16686:16686 jaegertracing/all-in-one
  - 'curl -X POST localhost:4318/v1/traces -H ''Content-Type: application/json'' -d ''{"resourceSpans":[]}'''
  parameters:
  - name: config
    type: string
    description: Collector config file path
  - name: backend
    type: string
    description: jaeger or zipkin
  - name: endpoint
    type: string
    description: OTLP endpoint, e.g. localhost:4318
knowledge:
- title: OpenTelemetry Collector docs
  type: documentation
  source: https://opentelemetry.io/docs/collector/
  description: Pipelines, receivers, exporters
- title: Jaeger docs
  type: documentation
  source: https://www.jaegertracing.io/docs/
  description: All-in-one and query UI
instructions: "# Tracing\n\nHand-crafted skill for running a complete tracing pipeline.\n\n## What this\
  \ skill does\n\n- Boots the OpenTelemetry Collector with a full pipeline\n- Ingests OTLP traces and\
  \ ships them to backends\n- Runs Jaeger and Zipkin backends locally for debugging\n\n## When to use\n\
  \n- Standing up tracing from scratch (SDK -> collector -> backend)\n- Verifying collectors accept and\
  \ export traces\n- Local reproduction of a distributed request\n\n## Real commands\n\n```bash\n# Run\
  \ the collector\notelcol-contrib --config otel-collector.yaml\n\n# Ingest a minimal trace (validates\
  \ the OTLP endpoint)\ncurl -X POST localhost:4318/v1/traces -H 'Content-Type: application/json' -d '{\"\
  resourceSpans\":[]}'\n\n# Backends\ndocker run -d -p 16686:16686 jaegertracing/all-in-one\ndocker run\
  \ -d -p 9411:9411 openzipkin/zipkin\n\n# Zipkin ingest check\ncurl -X POST -H 'Content-Type: application/json'\
  \ localhost:9411/api/v2/spans -d '[]'\n```\n\n## Collector config\n\n```yaml\nreceivers:\n  otlp:\n\
  \    protocols:\n      http:\n        endpoint: 0.0.0.0:4318\nprocessors:\n  batch:\nexporters:\n  jaeger:\n\
  \    endpoint: localhost:14250\n    tls:\n      insecure: true\nservice:\n  pipelines:\n    traces:\n\
  \      receivers: [otlp]\n      processors: [batch]\n      exporters: [jaeger]\n```\n\n## Testing\n\n\
  ```bash\ncurl -X POST localhost:4318/v1/traces -H 'Content-Type: application/json' -d '{\"resourceSpans\"\
  :[]}'\ncurl -s localhost:16686/api/services | jq '.data'\n```\n\n## Best practices\n\n- Always add a\
  \ batch processor before exporters\n- Buffer to a local file or Kafka when backends are flaky\n- Set\
  \ sampling before the collector, not after\n"
examples:
- input: Send traces from my app to Jaeger
  output: Export OTLP to the collector on 4318, which forwards to the jaeger exporter; check services
    at localhost:16686/api/services.
- input: Is the collector accepting traces?
  output: 'curl -X POST localhost:4318/v1/traces -H ''Content-Type: application/json'' -d ''{"resourceSpans":[]}''
    returns 200 when the OTLP receiver is up.'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: tracing.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-tracing
  generic:
    system_prompt: 'This is your domain: Tracing. You do it through otel-pipeline: Run the OTel Collector
      and route traces to backends. The commands are real, e.g. `otelcol-contrib --config otel-collector.yaml`.
      You prefer the shortest safe path, and you reproduce failures before diagnosing them.'
    available_tools:
    - bash
    - read
    - write
    - edit
