name: twirp-go
display_name: Twirp Go
category: api
subcategory: general
description: 'Hand-crafted Twirp Go skill: protoc code generation, server implementation, and client calls
  for Go Twirp services.'
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
prerequisites:
- protoc
capabilities:
- name: go-codegen
  description: Generate Twirp Go code and call the service
  commands:
  - protoc --go_out=. --twirp_out=. --go_opt=paths=source_relative types.proto
  - go get github.com/twitchtv/twirp
  - go generate ./...
  - go run ./cmd/server
  - go test ./...
  examples:
  - protoc --go_out=. --twirp_out=. types.proto
  - go run ./cmd/server
  - go test ./...
  parameters:
  - name: proto
    type: string
    description: Input .proto file
  - name: package
    type: string
    description: Go package path for output
  - name: service
    type: string
    description: Service name from the proto
knowledge:
- title: Twirp Go quickstart
  type: documentation
  source: https://github.com/twitchtv/twirp/tree/main/example
  description: End-to-end Go example
- title: protoc-go-twirp plugin
  type: documentation
  source: https://github.com/twitchtv/twirp/tree/main/protoc-gen-twirp
  description: Plugin flags and usage
instructions: "# Twirp Go\n\nHand-crafted skill for building Twirp services in Go.\n\n## What this skill\
  \ does\n\n- Generates Go + Twirp bindings from protos\n- Produces a server skeleton and typed clients\n\
  - Runs the server and tests locally\n\n## When to use\n\n- Go services with protobuf contracts\n- RPC\
  \ clients that must stay dependency-light\n- Migrating from net/rpc or raw JSON to protobuf\n\n## Real\
  \ commands\n\n```bash\n# Generate Go and Twirp code\nprotoc --go_out=. --twirp_out=. --go_opt=paths=source_relative\
  \ types.proto\n\n# Fetch the runtime\ngo get github.com/twitchtv/twirp\n\n# Generate via go:generate\
  \ if annotated\ngo generate ./...\n\n# Build, run, test\ngo run ./cmd/server\ngo test ./...\n```\n\n\
  ## Server skeleton\n\n```go\ntype server struct{}\n\nfunc (s *server) MakeHat(ctx context.Context, size\
  \ *twirp.example.Size) (*twirp.example.Hat, error) {\n\tif size.Inches <= 0 {\n\t\treturn nil, twirp.InvalidArgumentError(\"\
  inches\", \"must be positive\")\n\t}\n\treturn &twirp.example.Hat{Inches: size.Inches}, nil\n}\n\nfunc\
  \ main() {\n\thandler := twirp.example.NewHaberdasherServer(&server{})\n\thttp.ListenAndServe(\":8080\"\
  , handler)\n}\n```\n\n## Client\n\n```go\nclient := twirp.example.NewHaberdasherClient(\"http://localhost:8080\"\
  , http.DefaultClient)\nhat, err := client.MakeHat(ctx, &twirp.example.Size{Inches: 12})\n```\n\n## Testing\n\
  \n```bash\ngo run ./cmd/server &\ncurl -X POST http://localhost:8080/twirp/twirp.example.Haberdasher/MakeHat\
  \ -H 'Content-Type: application/json' -d '{\"inches\": 12}'\ngo test ./...\n```\n\n## Best practices\n\
  \n- Keep proto-generated files out of manual editing\n- Return typed twirp errors from handlers\n- Test\
  \ client and server together in integration tests\n"
examples:
- input: Generate Go code for my proto
  output: protoc --go_out=. --twirp_out=. --go_opt=paths=source_relative types.proto, then implement the
    handler interface.
- input: Test the running server
  output: 'go run ./cmd/server then curl -X POST http://localhost:8080/twirp/twirp.example.Haberdasher/MakeHat
    -d ''{"inches": 12}''.'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: twirp-go.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-twirp-go
  generic:
    system_prompt: 'You own Twirp Go end to end. You do it through go-codegen: Generate Twirp Go code
      and call the service. The commands are real, e.g. `protoc --go_out=. --twirp_out=. --go_opt=paths=source_relative
      types.proto`. You answer with exact commands, not abstractions, and flag anything you have not verified
      yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
