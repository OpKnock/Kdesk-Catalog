instructions: '# Usage Analytics


  Hand-crafted skill for product usage analytics.


  ## What this skill does


  - Ingests custom events (signups, upgrades, clicks)

  - Queries aggregates and time series over pageviews

  - Loads historical events into Mixpanel-style services


  ## When to use


  - Instrumenting a feature with custom events

  - Answering "how many X in the last 30 days?"

  - Wiring analytics into CI or dashboards


  ## Real commands


  ```bash

  # Send a custom event to Plausible

  curl -X POST https://plausible.io/api/event -H ''Content-Type: application/json'' -d ''{"domain":"app.example.com","name":"signup","url":"https://app.example.com/signup","props":{"plan":"pro"}}''


  # Aggregate stats

  curl -s ''https://plausible.io/api/v1/stats/aggregate?site_id=app.example.com&period=30d&metrics=visitors,pageviews''
  -H ''Authorization: Bearer YOUR_API_KEY'' | jq


  # Time series for charts

  curl -s ''https://plausible.io/api/v1/stats/timeseries?site_id=app.example.com&period=30d&metrics=pageviews''
  -H ''Authorization: Bearer KEY'' | jq


  # Mixpanel import of historical events

  curl -s ''https://api.mixpanel.com/import?strict=1'' -H ''Authorization: Basic BASE64'' -H ''Content-Type:
  application/json'' -d ''[{"event":"signup","properties":{"token":"TOKEN","distinct_id":"u1","time":1700000000}}]''

  ```


  ## Event schema


  - name: action verb (signup, upgrade, invite_sent)

  - url: canonical page for the event

  - props: flat custom properties

  - user_id/distinct_id: stable per user


  ## Testing


  ```bash

  curl -X POST https://plausible.io/api/event -H ''Content-Type: application/json'' -d ''{"domain":"app.example.com","name":"test_event","url":"https://app.example.com/"}''

  # then confirm it in the stats API timeseries

  ```


  ## Best practices


  - Keep event names a small controlled vocabulary

  - Never send PII in props

  - Use one canonical URL format to avoid dupes

  '
examples:
- input: How many visitors in the last 30 days?
  output: 'curl -s ''https://plausible.io/api/v1/stats/aggregate?site_id=app.example.com&period=30d&metrics=visitors''
    -H ''Authorization: Bearer KEY'' | jq.'
- input: Track a signup event
  output: POST to /api/event with name=signup and the current page URL; add props for plan type.
