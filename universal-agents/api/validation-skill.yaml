name: validation
display_name: Validation
category: api
subcategory: general
description: 'Hand-crafted data validation skill: JSON Schema validation with ajv/jq, request validation,
  and regression-guard checks across payloads.'
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
prerequisites:
- npx
- python
capabilities:
- name: schema-validate
  description: Validate JSON payloads against JSON Schema
  commands:
  - npx ajv-cli validate -s schema.json -d data.json --strict=false
  - python -c "import json, jsonschema; jsonschema.validate(json.load(open('data.json')), json.load(open('schema.json')));
    print('valid')"
  - jq 'type == "object" and (.id | type == "string") and (.price | type == "number")' data.json
  - npx ajv-cli compile -s schema.json
  - python -m jsonschema -i data.json schema.json
  examples:
  - npx ajv-cli validate -s schema.json -d data.json --strict=false
  - python -m jsonschema -i data.json schema.json
  - jq 'has("required_field")' data.json
  parameters:
  - name: schema
    type: string
    description: Path to JSON Schema file
  - name: data
    type: string
    description: Path to data file to validate
  - name: strict
    type: boolean
    description: Reject unknown keywords
knowledge:
- title: JSON Schema spec
  type: documentation
  source: https://json-schema.org/
  description: Draft 2020-12 keywords
- title: Ajv CLI docs
  type: documentation
  source: https://ajv.js.org/guide/cli.html
  description: validate and compile commands
instructions: "# Validation\n\nHand-crafted skill for schema validation of JSON payloads.\n\n## What this\
  \ skill does\n\n- Validates payloads against JSON Schema (draft 2020-12)\n- Compiles schemas to check\
  \ them before shipping\n- Guards pipelines and webhooks against bad shapes\n\n## When to use\n\n- CI\
  \ gates on API response shapes\n- Validating webhook payloads before processing\n- Enforcing contracts\
  \ between producers and consumers\n\n## Real commands\n\n```bash\n# Validate a document\nnpx ajv-cli\
  \ validate -s schema.json -d data.json --strict=false\n\n# Python alternative\npython -m jsonschema\
  \ -i data.json schema.json\npython -c \"import json, jsonschema; jsonschema.validate(json.load(open('data.json')),\
  \ json.load(open('schema.json'))); print('valid')\"\n\n# Compile-only check (schema itself must be valid)\n\
  npx ajv-cli compile -s schema.json\n\n# Quick jq shape checks\njq 'type == \"object\" and (.id | type\
  \ == \"string\") and (.price | type == \"number\")' data.json\njq 'has(\"required_field\")' data.json\n\
  ```\n\n## Example schema\n\n```json\n{\n  \"$schema\": \"https://json-schema.org/draft/2020-12/schema\"\
  ,\n  \"type\": \"object\",\n  \"required\": [\"id\", \"price\"],\n  \"properties\": {\n    \"id\": {\"\
  type\": \"string\"},\n    \"price\": {\"type\": \"number\", \"minimum\": 0}\n  }\n}\n```\n\n## Testing\n\
  \n```bash\nnpx ajv-cli validate -s schema.json -d data.json --strict=false\nnpx ajv-cli compile -s schema.json\n\
  ```\n\n## Best practices\n\n- Ship the schema with the contract, not after\n- Keep --strict off only\
  \ when schemas use unknown extensions\n- Fail CI on invalid payloads, never warn\n"
examples:
- input: Is my response shape correct?
  output: npx ajv-cli validate -s schema.json -d response.json --strict=false prints errors per failing
    keyword.
- input: Is this schema itself valid?
  output: npx ajv-cli compile -s schema.json compiles or prints the meta-schema error.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: validation.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-validation
  generic:
    system_prompt: 'You take the Validation seat. You do it through schema-validate: Validate JSON payloads
      against JSON Schema. The commands are real, e.g. `npx ajv-cli validate -s schema.json -d data.json
      --strict=false`. You answer with exact commands, not abstractions, and flag anything you have not
      verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2024-01-01T00:00:00Z'
updated_at: '2024-01-01T00:00:00Z'
