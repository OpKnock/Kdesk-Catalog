name: webhook-delivery
display_name: Webhook Delivery
category: api
subcategory: general
description: 'Deliver webhooks reliably: configure delivery endpoints, use smee for local forwarding,
  monitor delivery status, and replay failed deliveries.'
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
prerequisites:
- smee
capabilities:
- name: webhook-delivery
  description: Forward, deliver, and monitor webhook events
  commands:
  - smee --url https://smee.io/your-channel
  - 'curl -X POST -H ''Content-Type: application/json'' -d ''{"event":"order.created","id":42}'' http://localhost:8080/webhooks/orders'
  - curl -s http://localhost:8080/webhooks/deliveries | jq '.[0].status'
  - curl -s -X POST http://localhost:8080/webhooks/deliveries/DELIVERY_ID/retry | jq '.attempts'
  - curl -s http://localhost:8080/webhooks/deliveries?status=failed | jq 'length'
  examples:
  - smee --url https://smee.io/your-channel --port 8080
  - 'curl -s -X POST http://localhost:8080/webhooks/orders -H ''X-Event-ID: evt_1'' -d ''{"event":"payment.succeeded"}'''
  - curl -s http://localhost:8080/webhooks/endpoints | jq '.[].url'
  parameters:
  - name: url
    type: string
    description: smee.io channel URL for local forwarding
  - name: port
    type: integer
    description: Local port smee forwards to (default 3000)
  - name: status
    type: string
    description: 'Filter deliveries by status: pending, delivered, failed'
knowledge:
- title: Webhooks.fyi
  type: documentation
  source: https://webhooks.fyi/
  description: How webhooks work, security, and provider differences
- title: GitHub Webhooks Docs
  type: documentation
  source: https://docs.github.com/en/webhooks
  description: Delivery history, redelivery, and headers
instructions: "# Webhook Delivery\n\n## What this skill does\nSet up and operate webhook delivery for\
  \ your API: register endpoints, forward events locally with smee, send test deliveries, inspect delivery\
  \ status, and replay failures.\n\n## When to use\n- Building a webhook feature for customers\n- Debugging\
  \ undelivered events\n- Replaying deliveries after an outage\n\n## Real commands\n```bash\n# Forward\
  \ remote webhooks to localhost\nsmee --url https://smee.io/your-channel --port 8080\n\n# Simulate an\
  \ event POST\ncurl -X POST -H 'Content-Type: application/json' \\\n  -d '{\"event\":\"order.created\"\
  ,\"id\":42}' \\\n  http://localhost:8080/webhooks/orders\n\n# Delivery status\ncurl -s http://localhost:8080/webhooks/deliveries\
  \ | jq '.[0].status'\n\n# Count failed deliveries\ncurl -s 'http://localhost:8080/webhooks/deliveries?status=failed'\
  \ | jq 'length'\n\n# Retry a delivery\ncurl -s -X POST http://localhost:8080/webhooks/deliveries/DELIVERY_ID/retry\
  \ | jq '.attempts'\n\n# List registered endpoints\ncurl -s http://localhost:8080/webhooks/endpoints\
  \ | jq '.[].url'\n```\n\n## Delivery record fields\n- delivery_id, event_id, endpoint_id\n- status,\
  \ attempts, last_error\n- request_headers, request_body, response_body\n- created_at, next_retry_at\n\
  \n## Best practices\n- Sign payloads (see webhook-signature-skill)\n- Include `X-Event-ID` and `X-Delivery-ID`\
  \ headers\n- Retry with exponential backoff, cap at ~5 attempts\n- Dead-letter events that exceed retry\
  \ limits\n- Keep delivery logs for at least 30 days\n\n## Testing\n```bash\nsmee --url https://smee.io/test-channel\
  \ --port 8080 &\ncurl -s -X POST http://localhost:8080/webhooks/orders -d '{\"event\":\"test\"}'\ncurl\
  \ -s http://localhost:8080/webhooks/deliveries | jq '.[0]'\n```"
examples:
- input: Debug a missing order.created webhook
  output: Lists recent deliveries, finds the failed attempt, and shows the last_error and retry schedule.
- input: Replay all failed deliveries
  output: Iterates failed deliveries and POSTs to each retry endpoint.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: webhook-delivery.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-webhook-delivery
  generic:
    system_prompt: 'You are the Webhook Delivery specialist. You do it through webhook-delivery: Forward,
      deliver, and monitor webhook events. The commands are real, e.g. `smee --url https://smee.io/your-channel`.
      You verify each step you report and stay honest about what you have not run.'
    available_tools:
    - bash
    - read
    - write
    - edit
