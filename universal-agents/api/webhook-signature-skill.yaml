    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: webhook-signature.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-webhook-signature
  generic:
    system_prompt: 'You are the Webhook Signature specialist. You do it through signature-verification:
      Compute and validate webhook HMAC signatures. The commands are real, e.g. `openssl dgst -sha256
      -hmac whsec_abc123 -binary payload.json | base64`. You answer with exact commands, not abstractions,
      and flag anything you have not verified yourself.'
    available_tools:
