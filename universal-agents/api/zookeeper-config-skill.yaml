name: zookeeper-config
display_name: Zookeeper Config
category: api
subcategory: general
description: 'Manage ZooKeeper-backed configuration: zkCli CRUD on config nodes, watch-based updates,
  and service discovery registration.'
version: 2.0.0
tags:
- api
author: Kdesk-Catalog
license: MIT
prerequisites:
- zkcli.sh
capabilities:
- name: zk-config
  description: Read, write, and watch configuration in ZooKeeper
  commands:
  - zkCli.sh -server localhost:2181
  - zkCli.sh create /config/app '{"port":8080}'
  - zkCli.sh get /config/app
  - zkCli.sh set /config/app '{"port":9090}'
  - zkCli.sh ls /config
  examples:
  - zkCli.sh -server zk1:2181,zk2:2181,zk3:2181 create /config/feature-flags '{"newUi":true}'
  - zkCli.sh get -s /config/app
  - zkCli.sh deleteall /config/app
  parameters:
  - name: server
    type: string
    description: ZooKeeper ensemble, e.g. host1:2181,host2:2181
  - name: path
    type: string
    description: ZNode path, e.g. /config/app
  - name: data
    type: string
