name: ar-vr-development
version: 2.0.0
type: skill
category: emerging
description: 'Develops AR/VR experiences: Three.js scene building with Vite, glTF asset optimization with
  gltf-transform, Blender headless rendering, and WebXR deployment.'
keywords:
- ar-vr
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ar-vr-development.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-ar-vr-development
  generic:
    system_prompt: 'This is your domain: ar-vr-development. You do it through threejs-setup: Scaffold
      and build Three.js scenes. The commands are real, e.g. `npm create vite@latest my-scene -- --template
      vanilla`. You verify each step you report and stay honest about what you have not run.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: threejs-setup
  description: Scaffold and build Three.js scenes
  commands:
  - npm create vite@latest my-scene -- --template vanilla
  - npm install three @types/three
  - npm install vite
  - npx vite build
  - npx vite preview
  examples:
  - vite scaffold starts a vanilla JS project
  - npm install three adds the 3D engine
  - vite build bundles the scene for production
  parameters:
  - name: template
    type: string
    description: Vite template name
  - name: asset
    type: string
    description: 3D asset file to load
  - name: output-dir
    type: string
    description: Build output directory
- name: asset-pipeline
  description: Optimize 3D assets for the web
  commands:
  - npm install -g @gltf-transform/cli
  - gltf-transform optimize model.glb -o model-optimized.glb
  - gltf-transform draco model.glb model-draco.glb
  - gltf-transform inspect model.glb
  - blender -b scene.blend -o //render -E CYCLES -f 1
  examples:
  - gltf-transform optimize reduces file size
  - gltf-transform draco compresses geometry
  - blender -b renders headlessly
  parameters:
  - name: input
    type: string
    description: Input glTF file
  - name: output
    type: string
    description: Optimized output file
  - name: compression
    type: string
    description: draco, meshopt
prerequisites:
- unity
- unreal
- blender
- three-js
tools:
- unity
- unreal
- blender
- three-js
- webxr
examples:
- input: Build a VR scene
  output: Scaffolds a Vite project, adds Three.js, and serves a 3D scene
- input: Optimize a 3D model
  output: Runs gltf-transform optimize and verifies the size reduction
instructions: '# AR/VR Development


  Web-based AR/VR with Three.js.


  ## What This Skill Does

  - Builds 3D scenes with Three.js

  - Optimizes glTF assets for performance

  - Deploys WebXR experiences


  ## When to Use

  - Web AR/VR prototypes

  - 3D product visualization

  - Immersive training demos


  ## Real Commands


  ```bash

  npm create vite@latest my-scene -- --template vanilla

  npm install three @types/three

  npx vite build

  npm install -g @gltf-transform/cli

  gltf-transform optimize model.glb -o model-optimized.glb

  ```


  ## Scene Example


  ```js

  import * as THREE from ''three'';

  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);

  const renderer = new THREE.WebGLRenderer();

  renderer.setSize(innerWidth, innerHeight);

  document.body.appendChild(renderer.domElement);

  ```


  ## Testing

  - Inspect asset sizes before deploy

  - Verify Draco decoding at runtime

  - Test with WebXR device emulation



  ## Best Practices

  - Compress glTF with draco

  - Use LODs for complex scenes

  - Keep framerates above 60fps on target devices'
display_name: ar-vr-development
