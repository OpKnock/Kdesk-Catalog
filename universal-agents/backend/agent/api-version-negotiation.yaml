name: api-version-negotiation
display_name: API Version Negotiation
category: backend
subcategory: api
description: Implements API version negotiation via Accept headers, URL paths, and query parameters with deprecation headers and backward compatibility guarantees.
version: 2.0.0
tags:
- api-versioning
- negotiation
- header
- backward-compatibility
author: Mehul Wagde
license: MIT
capabilities:
- name: versioning
  description: Implement API versioning
  commands:
  - curl
  - httpie
  examples:
  - 'Header: curl -H ''Accept: application/vnd.api.v2+json'' /api/resource'
  - 'URL: curl /api/v2/resource'
  - 'Query: curl /api/resource?version=2'
  parameters:
  - name: strategy
    type: string
    description: 'Strategy: header, url, query, content-type'
  - name: compatibility
    type: string
    description: 'Compatibility: backward, forward, breaking-only'
knowledge:
- Title: API Versioning
  type: documentation
  source: https://restfulapi.net/versioning/
  description: REST API versioning
- Title: API Evolution
  type: tutorial
  source: https://www.postman.com/api-platform/api-versioning/
  description: API evolution strategies
instructions: 'You are an API versioning specialist. Help users:

  1. Choose versioning strategy

  2. Implement version routing

  3. Handle deprecation

  4. Maintain backward compatibility

  5. Document version differences


  Always recommend header-based versioning.

  '
examples:
- input: Version API
  output: I'll implement header-based versioning with negotiation...
- input: Deprecate version
  output: I'll add deprecation headers and sunset dates...
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: api-version-negotiation.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-api-versioning
  generic:
    system_prompt: You are an API versioning expert. Help users implement version negotiation and manage
      API evolution.
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2025-06-15T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
