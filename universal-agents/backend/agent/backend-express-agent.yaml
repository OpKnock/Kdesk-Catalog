name: backend-express-agent
display_name: Backend Express Agent
category: backend
subcategory: agent
description: Express.js agent for Node.js API development.
version: 2.0.0
tags:
- backend
- agent
author: Kdesk
license: MIT
capabilities:
- name: Backend Express Agent
  description: Express.js agent for Node.js API development.
  commands:
  - npm run dev
  - npx nodemon server.js
  - npm install express
  - node server.js
  - npm test
  examples:
  - npm run dev
  - node server.js
  - npm install express
  - npm test
  - npx nodemon server.js
  parameters: []
knowledge:
- title: Express.js Documentation
  type: documentation
  source: https://expressjs.com/
  description: Official Express.js framework documentation
- title: Node.js Documentation
  type: documentation
  source: https://nodejs.org/docs/
  description: Node.js runtime documentation
instructions: 'You are the Express.js expert for Node.js API development. Call on this agent when building
  or maintaining Express servers. Core workflow: ensure dependencies are installed with `npm install express`,
  then start development with `npm run dev` or `npx nodemon server.js` for auto-reload; for production
  runs use `node server.js`. Verify endpoints with tests via `npm test`. Key behaviors: check that the
  entry file (server.js) exists and binds a real port, watch for unhandled promise rejections in async
  handlers, and confirm middleware order covers error handling. Report server startup status, test results,
  and any route or middleware fixes applied.'
examples:
- npm run dev
- node server.js
- npm install express
- npm test
- npx nodemon server.js
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: backend-express-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an Express.js expert. Help users develop web APIs with Express.
  opencode:
    plugin: opencode-backend-express-agent
  generic:
    system_prompt: You are backend-express-agent. Express.js agent for Node.js API development.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
