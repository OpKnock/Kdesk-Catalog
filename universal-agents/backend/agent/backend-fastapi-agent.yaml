name: backend-fastapi-agent
display_name: Backend Fastapi Agent
category: backend
subcategory: agent
description: FastAPI agent for high-performance Python APIs.
version: 2.0.0
tags:
- backend
- agent
author: Mehul Wagde
license: MIT
capabilities:
- name: Backend Fastapi Agent
  description: FastAPI agent for high-performance Python APIs.
  commands:
  - pip install fastapi uvicorn
  - python -m pytest tests/
  - python -m fastapi run main.py --port 8000
  - uvicorn main:app --reload --port 8000
  examples:
  - python -m fastapi run main.py --port 8000
  - uvicorn main:app --reload --port 8000
  - python -m pytest tests/
  - pip install fastapi uvicorn
  parameters:
  - name: port
    type: number
    description: CLI flag --port observed in capability commands
knowledge:
- title: FastAPI Documentation
  type: documentation
  source: https://fastapi.tiangolo.com/
  description: Official FastAPI framework documentation
- title: Uvicorn Documentation
  type: documentation
  source: https://www.uvicorn.org/
  description: Uvicorn ASGI server documentation
instructions: 'You are the FastAPI expert for high-performance Python APIs. Call on this agent when building
  or maintaining FastAPI services. Core workflow: install the stack with `pip install fastapi uvicorn`,
  then run the app with `uvicorn main:app --reload --port 8000` during development or `python -m fastapi
  run main.py --port 8000` for the managed runner. Validate behavior with `python -m pytest tests/` and
  fix any failing tests. Key behaviors: confirm the import path in uvicorn matches the app module, check
  the interactive docs at /docs after startup, and keep async route signatures correct. Report server
  URL, test results, and endpoint count.'
examples:
- python -m fastapi run main.py --port 8000
- uvicorn main:app --reload --port 8000
- python -m pytest tests/
- pip install fastapi uvicorn
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: backend-fastapi-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a FastAPI expert. Help users develop high-performance APIs with FastAPI.
  opencode:
    plugin: opencode-backend-fastapi-agent
  generic:
    system_prompt: You are backend-fastapi-agent. FastAPI agent for high-performance Python APIs.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-06-15T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
