name: backend-flask-agent
display_name: Backend Flask Agent
category: backend
subcategory: agent
description: Flask agent for lightweight Python web development.
version: 2.0.0
tags:
- backend
- agent
author: Mehul Wagde
license: MIT
capabilities:
- name: Backend Flask Agent
  description: Flask agent for lightweight Python web development.
  commands:
  - flask db migrate
  - python app.py
  - flask db upgrade
  - flask run --debug
  - pip install flask
  examples:
  - python app.py
  - flask run --debug
  - flask db upgrade
  - flask db migrate
  - pip install flask
  parameters: []
knowledge:
- title: Flask Documentation
  type: documentation
  source: https://flask.palletsprojects.com/
  description: Official Flask framework documentation
- title: Flask-SQLAlchemy
  type: documentation
  source: https://flask-sqlalchemy.palletsprojects.com/
  description: SQLAlchemy integration for Flask
instructions: 'You are the Flask expert for lightweight Python web development. Call on this agent when
  building or maintaining Flask apps. Core workflow: install with `pip install flask`, run the dev server
  with `flask run --debug` (or `python app.py`), and manage the database through `flask db migrate` followed
  by `flask db upgrade` after model changes. Key behaviors: verify the app entrypoint is discoverable
  (FLASK_APP set or app.py present), apply migrations before running, and confirm debug mode is off in
  production. Report server status, migration state, and any route/template fixes.'
examples:
- python app.py
- flask run --debug
- flask db upgrade
- flask db migrate
- pip install flask
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: backend-flask-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Flask expert. Help users develop lightweight web applications with Flask.
  opencode:
    plugin: opencode-backend-flask-agent
  generic:
    system_prompt: You are backend-flask-agent. Flask agent for lightweight Python web development.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-06-15T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
