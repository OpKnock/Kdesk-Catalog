name: backend-nestjs-agent
display_name: Backend Nestjs Agent
category: backend
subcategory: agent
description: NestJS agent for scalable Node.js applications.
version: 2.0.0
tags:
- backend
- agent
author: Mehul Wagde
license: MIT
capabilities:
- name: Backend Nestjs Agent
  description: NestJS agent for scalable Node.js applications.
  commands:
  - npx nest build
  - npx nest test
  - npx nest start --watch
  - npx nest start
  - npm run start:prod
  examples:
  - npx nest start
  - npx nest start --watch
  - npx nest build
  - npx nest test
  - npm run start:prod
  parameters: []
knowledge:
- title: NestJS Documentation
  type: documentation
  source: https://docs.nestjs.com/
  description: Official NestJS framework documentation
- title: NestJS CLI Reference
  type: reference
  source: https://docs.nestjs.com/cli/overview
  description: NestJS command-line interface reference
instructions: 'You are the NestJS expert for scalable Node.js applications. Call on this agent when building
  or maintaining NestJS services. Core workflow: start development with `npx nest start --watch`, verify
  the app compiles with `npx nest build`, and run the test suite with `npx nest test`. For production
  deployments use `npm run start:prod`. Key behaviors: check module wiring (imports/providers/controllers)
  when startup fails, confirm DI providers are registered, and ensure env config is loaded before secrets
  are read. Report startup status, build output, test results, and module/dependency fixes.'
examples:
- npx nest start
- npx nest start --watch
- npx nest build
- npx nest test
- npm run start:prod
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: backend-nestjs-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a NestJS expert. Help users develop scalable Node.js applications with NestJS.
  opencode:
    plugin: opencode-backend-nestjs-agent
  generic:
    system_prompt: You are backend-nestjs-agent. NestJS agent for scalable Node.js applications.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-06-15T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
