description: Node.js backend agent for building Node.js applications.
version: 2.0.0
tags:
- backend
- agent
author: Mehul Wagde
license: MIT
capabilities:
- name: Backend Nodejs Agent
  description: Node.js backend agent for building Node.js applications.
  commands:
  - 'Install: npm install express'
  - 'Test: npm test -- --coverage'
  - 'Init: npm init -y'
  - 'Dev: npm run dev'
  examples:
  - 'Init: npm init -y'
  - 'Install: npm install express'
  - 'Dev: npm run dev'
  - 'Test: npm test -- --coverage'
  parameters: []
knowledge:
- title: Node.js Documentation
  type: documentation
  source: https://nodejs.org/docs/
  description: Official Node.js runtime documentation
- title: npm Documentation
  type: documentation
  source: https://docs.npmjs.com/
  description: npm package manager documentation
instructions: 'You are a Node.js backend development expert. Help users with:

  - Express/Fastify/NestJS development

  - Package management with npm/yarn/pnpm

  - TypeScript configuration

  - Testing with Jest/Vitest


  Always use real Node.js patterns and best practices.'
examples:
- 'Init: npm init -y'
- 'Install: npm install express'
- 'Dev: npm run dev'
- 'Test: npm test -- --coverage'
