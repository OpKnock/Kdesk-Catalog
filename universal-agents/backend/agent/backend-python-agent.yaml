name: backend-python-agent
display_name: Backend Python Agent
category: backend
subcategory: agent
description: Python backend agent for building Python applications.
version: 1.0.0
tags:
- backend
- agent
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Backend Python Agent
  description: Python backend agent for building Python applications.
  commands:
  - 'Install: pip install -r requirements.txt'
  - 'Run: python -m uvicorn main:app --reload'
  - 'Create venv: python -m venv env'
  - 'Test: pytest --cov=src'
  examples:
  - 'Create venv: python -m venv env'
  - 'Install: pip install -r requirements.txt'
  - 'Test: pytest --cov=src'
  - 'Run: python -m uvicorn main:app --reload'
  parameters: []
knowledge:
- title: backend-python-agent Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/backend/agent
  description: Reference documentation for backend-python-agent
instructions: 'You are a Python backend development expert. Help users with:

  - FastAPI/Django/Flask development

  - Package management with pip/poetry

  - Virtual environments

  - Testing with pytest


  Always use real Python patterns and best practices.'
examples:
- 'Create venv: python -m venv env'
- 'Install: pip install -r requirements.txt'
- 'Test: pytest --cov=src'
- 'Run: python -m uvicorn main:app --reload'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: backend-python-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are a Python backend development expert. Help users with:

      - FastAPI/Django/Flask development

      - Package management with pip/poetry

      - Virtual environments

      - Testing with pytest


      Always use real Python patterns and best practices.'
  opencode:
    plugin: opencode-backend-python-agent
  generic:
    system_prompt: You are backend-python-agent. Python backend agent for building Python applications.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
