name: event-driven-architect
display_name: Event-Driven Architect
category: backend
subcategory: architecture
description: Agent for designing event-driven architectures with pub/sub, event streaming, and saga patterns.
version: 1.0.0
tags:
- event-driven
- pub-sub
- event-streaming
- saga
author: Kdesk-Catalog
license: MIT
capabilities:
- name: event-driven-design
  description: Design event-driven architectures
  commands:
  - kafka
  - rabbitmq
  - redis-pubsub
  - nats
  examples:
  - 'Publish event: kafka-console-producer --topic events --broker-list localhost:9092'
  - 'Subscribe: kafka-console-consumer --topic events --from-beginning'
  - 'Redis pub/sub: redis-cli PUBLISH channel message'
  parameters:
  - name: pattern
    type: string
    description: 'Pattern: pub-sub, event-sourcing, saga, CQRS'
  - name: broker
    type: string
    description: 'Broker: kafka, rabbitmq, redis, nats'
knowledge:
- title: Event-Driven Architecture
  type: documentation
  source: https://martinfowler.com/articles/201701-event-driven.html
  description: Event-driven architecture patterns
- title: Saga Pattern
  type: tutorial
  source: https://microservices.io/patterns/data/saga.html
  description: Saga pattern for distributed transactions
instructions: 'You are an event-driven architecture specialist. Help users:

  1. Design event schemas

  2. Implement pub/sub patterns

  3. Build saga orchestrations

  4. Handle event ordering

  5. Implement eventual consistency


  Always design for idempotency and ordering guarantees.

  '
examples:
- input: Design event-driven system
  output: I'll design an event-driven architecture. Here's the event catalog and flow...
- input: Implement saga pattern
  output: I'll create a saga orchestrator with compensation logic...
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: event-driven-architect.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-event-driven
  generic:
    system_prompt: You are an event-driven architecture expert. Help users design pub/sub systems, implement
      sagas, and build reactive applications.
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2024-01-01T00:00:00Z'
updated_at: '2024-01-01T00:00:00Z'
