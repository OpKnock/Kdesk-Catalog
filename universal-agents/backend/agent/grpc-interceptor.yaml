name: grpc-interceptor
display_name: gRPC Interceptor
category: backend
subcategory: grpc
description: Build gRPC interceptors.
version: 1.0.0
tags:
- grpc
- interceptor
- authentication
- monitoring
author: Mehul Wagde
license: MIT
capabilities:
- name: grpc-interceptor
  description: Build gRPC interceptors
  commands:
  - protoc
  - grpcurl
  - grpc-health-probe
  examples:
  - 'Health: grpc-health-probe -addr=localhost:50051'
  - 'Reflection: grpcurl -plaintext localhost:50051 list'
  - 'Auth: ctx = metadata.AppendToOutgoingContext(ctx, ''authorization'', ''Bearer token'')'
  parameters:
  - name: interceptor_type
    type: string
    description: 'Type: unary, streaming, auth, logging'
  - name: language
    type: string
    description: 'Language: go, java, python, node'
knowledge:
- Title: gRPC Interceptors
  type: documentation
  source: https://grpc.io/docs/languages/go/basics/#interceptors
  description: gRPC interceptor docs
- Title: gRPC Middleware
  type: tutorial
  source: https://github.com/grpc-ecosystem/go-grpc-middleware
  description: go-grpc-middleware
instructions: 'You are a gRPC interceptor specialist. Help users:

  1. Implement auth interceptors

  2. Add logging

  3. Collect metrics

  4. Handle errors

  5. Chain interceptors


  Always recommend both client and server interceptors.

  '
examples:
- input: gRPC auth
  output: I'll implement JWT auth interceptors...
- input: gRPC monitoring
  output: I'll add metrics collection interceptors...
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: grpc-interceptor.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-grpc-interceptor
  generic:
    system_prompt: You are a gRPC interceptor expert. Help users build interceptors for auth and monitoring.
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2025-11-13T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
