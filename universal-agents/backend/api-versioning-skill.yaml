name: api-versioning
display_name: Api Versioning
category: backend
subcategory: general
description: 'Implements general API versioning across backend services: strategy selection, version headers,
  backward compatibility, and version-aware routing.'
version: 2.0.0
tags:
- backend
author: Kdesk-Catalog
license: MIT
prerequisites:
- git
capabilities:
- name: version-headers
  description: Serve versions via headers and negotiation
  commands:
  - 'curl -s -H ''Accept: application/vnd.github.v3+json'' https://api.github.com/repos/octocat/Hello-World
    | jq ''.full_name'''
  - 'curl -s -H ''X-API-Version: 2'' http://localhost:3000/api/users | jq ''.version'''
  - 'curl -s -H ''X-API-Version: 1'' http://localhost:3000/api/users | jq ''.version'''
  - 'curl -s -D- -H ''Accept: application/vnd.api.v2+json'' http://localhost:3000/api/users | grep -i
    ''^vary:'''
  examples:
  - Accept headers negotiate media-type versions
  - X-API-Version selects explicit versions
  - 'Vary: Accept protects caches'
  parameters:
  - name: header
    type: string
    description: Version header name
  - name: version
    type: string
    description: Version value
  - name: media-type
    type: string
    description: Vendor media type
- name: compatibility
  description: Maintain backward compatibility
  commands:
  - curl -s -o /dev/null -w '%{http_code}\n' http://localhost:3000/v1/users
  - curl -s http://localhost:3000/v2/users | jq '.fields | keys'
  - curl -s -o /dev/null -w '%{http_code}\n' http://localhost:3000/v9/users
  - git tag -l 'v*' --sort=-v:refname | head -3
  examples: []
  parameters: []
knowledge:
- title: Microsoft API Versioning Guidance
  type: documentation
  source: https://learn.microsoft.com/en-us/azure/architecture/best-practices/api-design#versioning
  description: API versioning best practices
- title: GitHub REST Versions
  type: documentation
  source: https://docs.github.com/en/rest/about-the-rest-api/api-versions
  description: Header-based versioning example
instructions: '# API Versioning


  Versioning across backend services.


  ## What This Skill Does

  - Selects and implements versioning strategies

  - Keeps old versions compatible

  - Routes versioned traffic correctly


  ## When to Use

  - Multiple client generations

  - Breaking changes with legacy consumers

  - Version-aware gateway routing


  ## Real Commands


  ```bash

  curl -s -H ''Accept: application/vnd.github.v3+json'' https://api.github.com/repos/octocat/Hello-World
  | jq ''.full_name''

  curl -s -H ''X-API-Version: 2'' http://localhost:3000/api/users | jq ''.version''

  ```


  ## Strategy Selection

  - URL: /v1, /v2 - visible and simple

  - Header: clean URLs, explicit selection

  - Media type: RESTful negotiation


  ## Testing

  - Verify every version endpoint

  - Test unknown versions fail cleanly

  - Confirm caching honors Vary



  ## Best Practices

  - Deprecate slowly with sunset dates

  - Keep defaults stable

  - Document versions in OpenAPI'
examples:
- input: Add version headers to an API
  output: Implements X-API-Version routing and verifies both versions
- input: Plan a major version release
  output: Maps breaking changes and deprecation windows for v2
platforms:
  claude_code:
    tools:
