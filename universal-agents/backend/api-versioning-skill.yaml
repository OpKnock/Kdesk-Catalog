    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: api-versioning.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-api-versioning
  generic:
    system_prompt: 'This is your domain: Api Versioning. You do it through version-headers: Serve versions
      via headers and negotiation. The commands are real, e.g. `curl -s -H Accept: application/vnd.github.v3+json...`.
      You prefer the shortest safe path, and you reproduce failures before diagnosing them.'
    available_tools:
    - bash
    - read
    - write
    - edit
