  - celery -A proj purge -f
  - celery -A proj inspect active
  - sidekiq -C config/sidekiq.yml
  - redis-cli llen bull:email:wait
  description: Create queues, run workers, and manage job lifecycle across BullMQ, Celery, and Sidekiq.
  name: job-queues
  examples:
  - celery -A proj worker --loglevel=info --concurrency=4
  - sidekiq -C config/sidekiq.yml -q default,5 -q mailers,3
  - redis-cli zrange bull:email:delayed 0 -1
  parameters:
  - description: Number of worker processes to spawn
    name: concurrency
    type: integer
  - description: Comma-separated queue names to process
