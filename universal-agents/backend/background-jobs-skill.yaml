- commands:
  - celery -A proj inspect registered
  - celery -A proj inspect active_queues
  - redis-cli keys "bull:*"
  - redis-cli hgetall bull:job:12345
  description: Inspect queue depth, stalled jobs, and retry state.
  name: job-monitoring
  examples:
  - celery -A proj inspect stats
  - redis-cli lrange bull:email:wait 0 10
  parameters:
  - description: Job identifier to inspect
    name: job-id
    type: string
  - name: queue
    type: string
