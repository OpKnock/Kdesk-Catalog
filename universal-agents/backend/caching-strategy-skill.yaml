instructions: "# Caching Strategy\n\nDesign multi-layer caches and keep them consistent.\n\n## When to\
  \ Use\n\n- Serving the same read-heavy data repeatedly\n- Protecting databases from hot keys and read\
  \ amplification\n- Storing sessions, rate counters, or computed aggregates\n- Reducing latency on slow\
  \ third-party lookups\n\n## Patterns\n\n- Cache-aside: read cache, on miss load from DB and populate,\
  \ invalidate on write\n- Read-through: cache loads from DB automatically on miss\n- Write-through: writes\
  \ go to cache and DB together\n- TTL-based expiry with jitter to avoid thundering herd\n- Setnx lock-based\
  \ stampede protection for expensive recompute\n\n## Commands\n\n```bash\n# Basic set with TTL (seconds)\n\
  redis-cli set user:123 \"{\\\"name\\\":\\\"alice\\\"}\" EX 300\n\n# Inspect TTL remaining\nredis-cli\
  \ ttl user:123\nredis-cli pttl user:123\n\n# Scan keys by pattern\nredis-cli --scan --pattern \"user:*\"\
  \n\n# Check memory usage of a key\nredis-cli memory usage user:123\n\n# Cache stats\nredis-cli info\
  \ keyspace\nredis-cli dbsize\n\n# Invalidate\nredis-cli unlink user:123\nredis-cli del user:123\n\n\
  # Stampede lock\nredis-cli setnx lock:regen:report \"1\" EX 30\n```\n\n## Example\n\n```python\nimport\
  \ redis\nr = redis.Redis(host=\"localhost\")\n\ndef get_user(user_id):\n    cached = r.get(f\"user:{user_id}\"\
  )\n    if cached:\n        return cached\n    data = db.fetch_user(user_id)  # miss: load from DB\n\
  \    r.set(f\"user:{user_id}\", data, ex=300)\n    return data\n```\n\n## Best Practices\n\n- Add random\
  \ jitter (e.g. 5-10% of TTL) to keys to prevent expiry stampedes\n- Use unlink instead of del for large\
  \ values to avoid blocking Redis\n- Evict with LRU/LFU policies appropriate to access patterns\n- Never\
  \ cache unauthenticated or per-user secrets without authorization checks\n- Profile hit rate with redis-cli\
  \ info stats before and after tuning"
examples:
- input: My Redis cache hit rate is low. How do I diagnose it?
  output: Agent checks redis-cli info stats for keyspace_hits/keyspace_misses, inspects key usage with
    --scan --pattern, and suggests TTL tuning with jitter.
- input: How do I prevent a cache stampede?
  output: Agent shows setnx lock pattern, explains TTL jitter, and recommends prefetch/recompute-in-background
    strategies.
