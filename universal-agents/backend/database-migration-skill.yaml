name: database-migration
display_name: Database Migration
category: backend
subcategory: general
description: Manages schema evolution with Alembic, Prisma Migrate, and Flyway including autogeneration,
  review, rollbacks, and CI deploy.
version: 2.0.0
tags:
- backend
author: Mehul Wagde
license: MIT
prerequisites:
- alembic
- npx
capabilities:
- commands:
  - alembic init migrations
  - alembic revision --autogenerate -m "add users table"
  - alembic upgrade head
  - alembic downgrade -1
  - alembic history
  description: Create and apply SQLAlchemy migrations.
  name: alembic-migrations
  examples:
  - alembic revision --autogenerate -m "add email index"
  - alembic upgrade +2
  - alembic downgrade base
  parameters:
  - description: Target revision id or head/base
    name: revision
    type: string
  - description: Migration name
    name: message
    type: string
- commands:
  - npx prisma migrate dev --name init
  - npx prisma migrate deploy
  - npx prisma migrate status
  - npx prisma db push
  - npx prisma migrate resolve --applied 20240101000000_init
  description: Evolve the database schema from the Prisma schema.
  name: prisma-migrate
  examples:
  - npx prisma migrate dev --name add_profile
  - npx prisma migrate reset --force
  - npx prisma migrate status
  parameters:
  - description: Migration name
    name: name
    type: string
  - description: Skip confirmation prompts
    name: force
    type: boolean
knowledge:
- title: Alembic Docs
  description: Migration framework for SQLAlchemy
  source: https://alembic.sqlalchemy.org/en/latest/
  type: documentation
- title: Prisma Migrate
  description: Schema migrations for Prisma ORM
  source: https://www.prisma.io/docs/orm/prisma-migrate
  type: documentation
- title: Flyway Docs
  description: Database migrations for Java and SQL
  source: https://documentation.red-gate.com/fd
  type: documentation
instructions: '# Database Migration


  Evolve relational schemas safely across environments.


  ## When to Use


  - Adding, altering, or dropping tables and columns

  - Backfilling data as part of a deploy

  - Reproducing schema state across dev, staging, and prod

  - Enabling zero-downtime deploys with expand-contract steps


  ## Alembic Commands


  ```bash

  # Init migration env

  alembic init migrations


  # Autogenerate from model changes

  alembic revision --autogenerate -m "add users table"


  # Review the generated file, then apply

  alembic upgrade head


  # Roll back one step

  alembic downgrade -1


  # History and current revision

  alembic history

  alembic current

  ```


  ## Prisma Commands


  ```bash

  # Create + apply migration from schema.prisma

  npx prisma migrate dev --name init


  # Apply migrations in prod (no interactive prompts)

  npx prisma migrate deploy


  # Check drift

  npx prisma migrate status


  # Sync schema without migration history

  npx prisma db push

  ```


  ## Best Practices


  - Never edit applied migrations; create a new one

  - Review autogenerated migrations by hand before committing

  - Keep one migration per logical change for clean rollbacks

  - Backfill data in a separate data migration from the DDL

  - Run migrate deploy in CI before releasing new code

  - Add down-revisions for every up-revision where possible'
examples:
- input: I changed my Prisma model; how do I migrate?
  output: Agent runs npx prisma migrate dev --name <change>, inspects the generated SQL, and runs npx
    prisma migrate deploy in staging.
- input: A production migration is out of sync
  output: Agent runs alembic current vs alembic history, identifies the drift, and applies the pending
    revisions with alembic upgrade head after review.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: database-migration.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-database-migration
  generic:
    system_prompt: 'You are the Database Migration specialist. You do it through alembic-migrations: Create
      and apply SQLAlchemy migrations. The commands are real, e.g. `alembic init migrations`. You work
      hands-on and only report outcomes you have observed.'
    available_tools:
    - bash
    - read
    - write
    - edit
