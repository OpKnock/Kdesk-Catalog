name: deno
display_name: Deno
category: backend
subcategory: general
description: Builds secure TypeScript services with the Deno runtime using built-in permissions, std library,
  test runner, and compilation.
version: 2.0.0
tags:
- backend
author: Kdesk-Catalog
license: MIT
prerequisites:
- deno
capabilities:
- commands:
  - deno init
  - deno run main.ts
  - deno run --allow-net --allow-env main.ts
  - deno check main.ts
  - deno compile --allow-net -o app main.ts
  description: Scaffold, run, and compile Deno projects.
  name: deno-runtime
  examples:
  - deno run --allow-net --allow-read=./data main.ts
  - deno compile --target x86_64-unknown-linux-gnu -o app main.ts
  - deno check --all src/
  parameters:
  - description: --allow-net, --allow-read, etc.
    name: permissions
    type: string
  - description: Compile target triple
    name: target
    type: string
  - description: Output binary path
    name: output
    type: string
- commands:
  - deno fmt
  - deno fmt --check
  - deno lint
  - deno test
  - deno test --coverage
  description: Format, lint, and test Deno code.
  name: deno-quality
  examples:
  - deno fmt --check src/
  - deno lint --rules-exclude=no-explicit-any
  - deno test test/ --coverage=coverage
  parameters:
  - description: File or directory to check
    name: path
    type: string
  - name: rules
    type: string
    description: Lint rules to include or exclude
knowledge:
- title: Deno Docs
  description: Runtime, std library, permissions, and deploy
  source: https://docs.deno.com
  type: documentation
- title: Deno Deploy
  description: Global edge hosting for Deno apps
  source: https://docs.deno.com/deploy/
  type: documentation
instructions: "# Deno\n\nSecure TypeScript runtime with built-in tooling.\n\n## When to Use\n\n- TypeScript-first\
  \ services without npm toolchain overhead\n- Edge functions and serverless workloads on Deno Deploy\n\
  - Scripts that need explicit permission grants (network, fs)\n- Single-file tools distributed as compiled\
  \ binaries\n\n## Commands\n\n```bash\n# Scaffold\ndeno init\n\n# Run with explicit permissions\ndeno\
  \ run --allow-net main.ts\ndeno run --allow-net --allow-read=./data main.ts\n\n# Type-check without\
  \ running\ndeno check main.ts\n\n# Formatting and linting\ndeno fmt\ndeno fmt --check\ndeno lint\n\n\
  # Testing\ndeno test\ndeno test --coverage\n\n# Benchmark\ndeno bench\n\n# Compile to a standalone binary\n\
  deno compile --allow-net -o app main.ts\n\n# Task runner from deno.json\ndeno task dev\n```\n\n## Server\
  \ Example\n\n```typescript\nDeno.serve((req) => {\n  const url = new URL(req.url);\n  return new Response(`Hello\
  \ ${url.pathname}`);\n});\n```\n\n## Best Practices\n\n- Grant the narrowest permissions: prefer --allow-net=host:port\
  \ over full access\n- Put scripts and deps in deno.json; use deno task for commands\n- Check imports\
  \ with deno check --all before pushing\n- Pin import versions; Deno supports npm: specifiers for interop\n\
  - Use deno compile in CI to ship native binaries"
examples:
- input: Run my Deno server in production
  output: Agent reviews permission flags, compiles with deno compile --allow-net, and recommends deno
    task scripts plus a Dockerfile using deno image.
- input: Add tests to my Deno project
  output: Agent writes test files using Deno.test and asserts, then runs deno test --coverage and shows
    coverage output.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: deno.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-deno
  generic:
    system_prompt: 'You take the Deno seat. You do it through deno-runtime: Scaffold, run, and compile
      Deno projects. The commands are real, e.g. `deno init`. You answer with exact commands, not abstractions,
      and flag anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2024-01-01T00:00:00Z'
updated_at: '2024-01-01T00:00:00Z'
