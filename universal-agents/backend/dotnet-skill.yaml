name: dotnet
display_name: Dotnet
category: backend
subcategory: general
description: 'Develops .NET backend services with the dotnet CLI: projects, EF Core migrations, tests,
  and publish workflows.'
version: 2.0.0
tags:
- backend
author: Kdesk
license: MIT
prerequisites:
- dotnet
capabilities:
- commands:
  - dotnet new webapi -n MyApi
  - dotnet run
  - dotnet build
  - dotnet watch run
  - dotnet publish -c Release -o ./publish
  description: Create, build, and run .NET projects.
  name: dotnet-cli
  examples:
  - dotnet new sln -n App
  - dotnet watch run --launch-profile https
  - dotnet publish -c Release --self-contained -r win-x64
  parameters:
  - description: 'Template name: webapi, console, classlib'
    name: template
    type: string
  - description: Project or solution name
    name: name
    type: string
- commands:
  - dotnet ef migrations add InitialCreate
  - dotnet ef database update
  - dotnet ef migrations remove
  - dotnet ef migrations list
  - dotnet ef dbcontext info
  description: Manage Entity Framework Core migrations and schema.
  name: dotnet-ef
  examples:
  - dotnet ef migrations add AddUserIndex --context AppDbContext
  - dotnet ef database update --no-build
  - dotnet ef migrations script
  parameters:
  - description: Migration name
    name: name
    type: string
  - description: DbContext type
    name: context
    type: string
- commands:
  - dotnet test
  - dotnet test --filter TestCategory=Unit
  - dotnet format
  - dotnet add package Newtonsoft.Json
  description: Run tests and format code.
  name: dotnet-testing
  examples:
  - dotnet test --logger "console;verbosity=detailed"
  - dotnet format --verify-no-changes
  - dotnet test -p:CollectCoverage=true
  parameters:
  - description: Test filter expression
    name: filter
    type: string
  - name: coverage
    type: boolean
    description: Collect code coverage with Coverlet
knowledge:
- title: .NET Docs
  description: CLI reference, SDK, and language guides
  source: https://learn.microsoft.com/dotnet
  type: documentation
- title: EF Core Docs
  description: Entity Framework Core migrations and querying
  source: https://learn.microsoft.com/ef/core/
  type: documentation
- title: ASP.NET Core Docs
  description: Web APIs, minimal APIs, and hosting
  source: https://learn.microsoft.com/aspnet/core
  type: documentation
instructions: '# .NET


  Backend services with the dotnet CLI and ASP.NET Core.


  ## When to Use


  - REST APIs with ASP.NET Core minimal APIs or controllers

  - Enterprise services needing strong typing and EF Core ORM

  - Cross-platform console tools and workers

  - gRPC services with the built-in gRPC stack


  ## Commands


  ```bash

  # Create a Web API project

  dotnet new webapi -n MyApi


  # Add to a solution

  dotnet new sln -n App

  dotnet sln add src/MyApi/MyApi.csproj


  # Build, run, and watch

  dotnet build

  dotnet run

  dotnet watch run


  # Publish

  dotnet publish -c Release -o ./publish


  # Add packages

  dotnet add package Newtonsoft.Json


  # EF Core migrations

  dotnet ef migrations add InitialCreate

  dotnet ef database update

  dotnet ef migrations list


  # Tests

  dotnet test

  dotnet test --filter "FullyQualifiedName~OrderTests"


  # Format

  dotnet format

  dotnet format --verify-no-changes

  ```


  ## Minimal API Example


  ```csharp

  var builder = WebApplication.CreateBuilder(args);

  var app = builder.Build();


  app.MapGet("/health", () => Results.Ok(new { status = "ok" }));


  app.Run();

  ```


  ## Best Practices


  - Use minimal APIs for small services, controllers for larger teams

  - Enable nullable reference types and treat warnings as errors in CI

  - Use EF Core migrations for schema and dotnet ef database update in deploys

  - Pin target frameworks and run dotnet format --verify-no-changes in CI

  - Use appsettings per-environment config with user secrets in dev'
examples:
- input: Create a new .NET Web API with EF Core
  output: Agent runs dotnet new webapi, adds EF Core packages, defines a DbContext, and applies dotnet
    ef migrations add InitialCreate.
- input: Why is my build failing in CI only?
  output: Agent checks SDK version alignment, dotnet build -c Release, and warns about OS-specific paths
    and reference assemblies.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: dotnet.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-dotnet
  generic:
    system_prompt: 'Your lane is Dotnet. You do it through dotnet-cli: Create, build, and run .NET projects.
      The commands are real, e.g. `dotnet new webapi -n MyApi`. You prefer the shortest safe path, and
      you reproduce failures before diagnosing them.'
    available_tools:
    - bash
    - read
    - write
    - edit
