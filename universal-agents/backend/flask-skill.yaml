name: flask
display_name: Flask
category: backend
subcategory: general
description: 'Builds Python web apps with Flask: routes, templates, blueprints, CLI commands, and testing
  with pytest.'
version: 2.0.0
tags:
- backend
author: Kdesk
license: MIT
prerequisites:
- flask
- pip
- pytest
capabilities:
- commands:
  - flask --app app run --debug
  - flask --app app run --host 0.0.0.0 --port 5001
  - flask --app app routes
  - flask --app app shell
  - flask --app app --help
  description: Run the Flask dev server and app CLI commands.
  name: flask-cli
  examples:
  - flask --app app:create_app run --debug
  - flask --app app routes --sort rule
  - python -m flask --app app run
  parameters:
  - description: App import path
    name: import
    type: string
  - description: Enable debugger and reloader
    name: debug
    type: boolean
- commands:
  - pip install Flask-SQLAlchemy flask-migrate
  - flask --app app db init
  - flask --app app db migrate -m "add users"
  - flask --app app db upgrade
  - pytest
  description: Manage extensions like migrate, SQLAlchemy, and testing.
  name: flask-extensions
  examples:
  - flask --app app db downgrade -1
  - flask --app app db history
  - pytest -q tests/
  parameters:
  - description: Migration message
    name: message
    type: string
  - name: app-import
    type: string
    description: Flask app import path for CLI commands
knowledge:
- title: Flask Docs
  description: Quickstart, CLI, blueprints, and deployment
  source: https://flask.palletsprojects.com
  type: documentation
- title: Flask Migrate Docs
  description: Alembic-based migrations for Flask
  source: https://flask-migrate.readthedocs.io
  type: documentation
instructions: "# Flask\n\nLightweight Python web framework.\n\n## When to Use\n\n- Small to medium web\
  \ apps and JSON APIs\n- Server-rendered pages with Jinja templates\n- Internal tools and admin dashboards\n\
  - Applications that grow cleanly with blueprints\n\n## Commands\n\n```bash\npip install flask\n\n# Run\
  \ with debug\nflask --app app run --debug\n\n# Run with create_app factory\nflask --app app:create_app\
  \ run --debug\n\n# List routes\nflask --app app routes\n\n# Interactive shell\nflask --app app shell\n\
  \n# Database migrations (flask-migrate)\nflask --app app db init\nflask --app app db migrate -m \"add\
  \ users\"\nflask --app app db upgrade\nflask --app app db downgrade -1\n```\n\n## App Example\n\n```python\n\
  # app.py\nfrom flask import Flask, jsonify, request\n\napp = Flask(__name__)\n\n@app.get(\"/health\"\
  )\ndef health():\n    return jsonify(status=\"ok\")\n\n@app.post(\"/items\")\ndef create_item():\n \
  \   data = request.get_json()\n    return jsonify(received=data), 201\n```\n\n## Best Practices\n\n\
  - Use an app factory with create_app for testability\n- Structure larger apps with blueprints per domain\n\
  - Run flask --app app routes to keep the surface area visible\n- Enable debug only in development; never\
  \ in production\n- Add pytest tests with the app.test_client()"
examples:
- input: Add a health endpoint to my Flask app
  output: Agent adds a route with @app.get("/health"), uses jsonify, and verifies with flask --app app
    routes and curl.
- input: Add database migrations to Flask
  output: Agent installs flask-migrate, runs db init/migrate/upgrade, and shows the generated migration.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: flask.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-flask
  generic:
    system_prompt: 'You work Flask hands-on. You do it through flask-cli: Run the Flask dev server and
      app CLI commands. The commands are real, e.g. `flask --app app run --debug`. You run and verify
      the real CLI commands before you claim anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2026-01-20T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
