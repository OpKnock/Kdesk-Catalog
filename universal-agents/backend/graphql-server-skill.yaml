    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: graphql-server.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-graphql-server
  generic:
    system_prompt: 'You take the Graphql Server seat. You do it through graphql-servers: Scaffold and
      run popular GraphQL server frameworks. The commands are real, e.g. `npm install @apollo/server graphql`.
      You work hands-on and only report outcomes you have observed.'
    available_tools:
    - bash
    - read
    - write
    - edit
