name: gunicorn
display_name: gunicorn
category: backend
subcategory: general
description: 'Serves Python WSGI apps in production with gunicorn: workers, preloading, timeouts, and
  systemd/container integration.'
version: 2.0.0
tags:
- backend
author: Kdesk
license: MIT
prerequisites:
- gunicorn
- kill
capabilities:
- commands:
  - gunicorn myapp:app
  - gunicorn -w 4 -b 0.0.0.0:8000 myapp:app
  - gunicorn -k gthread --threads 8 -w 2 myapp:app
  - gunicorn -c gunicorn.conf.py myapp:app
  - gunicorn --worker-class gevent --worker-connections 1000 myapp:app
  description: Run WSGI applications with tuned worker configurations.
  name: gunicorn-serving
  examples:
  - gunicorn -w 4 --timeout 30 -b 127.0.0.1:8000 myapp:app
  - gunicorn -k gthread --threads 4 -w 4 --max-requests 1000 myapp:app
  - gunicorn --preload -c gunicorn.conf.py myapp:app
  parameters:
  - description: Number of worker processes
    name: workers
    type: integer
  - description: Host:port to bind
    name: bind
    type: string
  - description: sync, gthread, gevent, eventlet
    name: worker-class
    type: string
- commands:
  - kill -HUP $(cat /tmp/gunicorn.pid)
  - kill -TERM $(cat /tmp/gunicorn.pid)
  - curl -s http://localhost:8000/health
  - ps aux | grep gunicorn
  description: Send signals and check worker health.
  name: gunicorn-monitoring
  examples:
  - kill -HUP 12345
  - systemctl reload myapp
  - curl -sI http://localhost:8000 | head -1
  parameters:
  - description: Path to pidfile
    name: pid-file
    type: string
  - name: signal
    type: string
    description: 'Signal to send: HUP, TERM, INT'
