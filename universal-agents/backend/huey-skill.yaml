name: huey
display_name: huey
category: backend
subcategory: general
description: 'Runs lightweight task queues with Huey: in-process or Redis-backed workers, cron scheduling,
  retries, and lock management.'
version: 2.0.0
tags:
- backend
author: Kdesk
license: MIT
prerequisites:
- huey_consumer
- python
- redis-cli
capabilities:
- commands:
  - huey_consumer tasks.huey
  - huey_consumer tasks.huey -w 4
  - huey_consumer tasks.huey --workers 2 --threads 8
  - python -m huey.consumer tasks.huey
  - redis-cli keys "huey*"
  description: Run Huey consumers for Redis or in-memory brokers.
  name: huey-workers
  examples:
  - huey_consumer tasks.huey -k thread
  - huey_consumer tasks.huey -w 4 -l debug
  - huey_consumer tasks.huey --queues default,email
  parameters:
  - description: Worker process count
    name: workers
    type: integer
  - description: Threads per process
    name: threads
    type: integer
  - description: Queue names to consume
    name: queues
    type: string
- commands:
  - redis-cli llen huey:queue
  - redis-cli hgetall huey:results:123
  - python -c "from tasks import send_mail; send_mail(\"a@b.c\")"
  - redis-cli --scan --pattern "huey:*"
  description: Schedule periodic tasks and manage task state.
  name: huey-scheduling
  examples:
  - redis-cli llen huey:queue
  - redis-cli zrange huey:scheduled 0 -1
  parameters:
  - description: Queue name
    name: queue
    type: string
  - name: pattern
    type: string
    description: Redis key pattern to scan
knowledge:
- title: Huey Docs
  description: 'Task queue reference: tasks, crontab, locks, consumer CLI'
  source: https://huey.readthedocs.io
  type: documentation
- title: Huey on GitHub
  description: Source and changelog
  source: https://github.com/coleifer/huey
  type: documentation
instructions: "# Huey\n\nLightweight task queue for Python.\n\n## When to Use\n\n- Simple apps needing\
  \ background tasks without Celery overhead\n- Redis-backed or even in-process queues\n- Cron-style scheduling\
  \ with the built-in crontab support\n- Atomic locks for guarding shared resources\n\n## Setup\n\n```bash\n\
  pip install huey[redis]\n```\n\n## Commands\n\n```bash\n# Start the consumer\nhuey_consumer tasks.huey\n\
  \n# 4 worker processes\nhuey_consumer tasks.huey -w 4\n\n# Thread pool with 8 threads\nhuey_consumer\
  \ tasks.huey -k thread --threads 8\n\n# Debug logging\nhuey_consumer tasks.huey -l debug\n\n# Inspect\
  \ queues\nredis-cli llen huey:queue\nredis-cli --scan --pattern \"huey:*\"\n```\n\n## Task Example\n\
  \n```python\n# tasks.py\nfrom huey import RedisHuey\nfrom huey.contrib.djhuey import task  # Django\
  \ users\n\nhuey = RedisHuey(\"myapp\")\n\n@huey.task(retries=3, retry_delay=10)\ndef send_email(to,\
  \ subject):\n    send(to, subject)\n\n@huey.periodic_task(huey.crontab(minute=\"0\", hour=\"6\"))\n\
  def daily_report():\n    generate_report()\n```\n\n## Enqueue\n\n```python\nfrom tasks import send_email\n\
  send_email(\"user@example.com\", \"Hello\")\n```\n\n## Best Practices\n\n- Set retries and retry_delay\
  \ on tasks touching external services\n- Use lock_task for idempotent periodic jobs\n- Choose thread\
  \ or process worker types per task workload\n- Monitor huey:queue length to size workers\n- Keep the\
  \ consumer running under a process manager"
examples:
- input: Run a task every night at 2am with Huey
  output: Agent adds @huey.periodic_task(huey.crontab(hour=2, minute=0)) and starts huey_consumer.
- input: My Huey tasks are piling up
  output: Agent checks redis-cli llen huey:queue and scales with -w and --threads flags.
