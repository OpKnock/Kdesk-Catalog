name: laravel
display_name: laravel
category: backend
subcategory: general
description: 'Builds PHP web applications with Laravel: artisan commands, migrations, queues, scheduling,
  and testing.'
version: 2.0.0
tags:
- backend
author: Mehul Wagde
license: MIT
prerequisites:
- composer
- php
capabilities:
- commands:
  - composer create-project laravel/laravel myapp
  - php artisan serve
  - php artisan make:model Order -m
  - php artisan migrate
  - php artisan tinker
  description: Scaffold and manage Laravel applications.
  name: laravel-artisan
  examples:
  - php artisan make:controller OrderController --resource
  - php artisan migrate:fresh --seed
  - php artisan route:list --path=api
  parameters:
  - description: Artisan make target name
    name: name
    type: string
  - description: Artisan flags like -m --resource
    name: flags
    type: string
- commands:
  - php artisan queue:work
  - php artisan queue:listen --tries=3
  - php artisan schedule:work
  - php artisan queue:table
  - php artisan schedule:list
  description: Run queue workers and the scheduler.
  name: laravel-queues
  examples:
  - php artisan queue:work redis --timeout=60
  - php artisan schedule:test
  - php artisan queue:retry all
  parameters:
  - description: 'Queue driver: redis, database'
    name: connection
    type: string
  - description: Max attempts
    name: tries
    type: integer
knowledge:
- title: Laravel Docs
  description: Artisan, Eloquent, queues, and scheduling reference
  source: https://laravel.com/docs
  type: documentation
- title: Laravel Queues
  description: Queue drivers, jobs, and workers
  source: https://laravel.com/docs/queues
  type: documentation
instructions: "# Laravel\n\nPHP web framework with batteries included.\n\n## When to Use\n\n- Full-stack\
  \ PHP apps with Eloquent ORM\n- REST APIs with built-in auth and validation\n- Apps needing queues,\
  \ caching, and scheduling out of the box\n\n## Commands\n\n```bash\n# Create app\ncomposer create-project\
  \ laravel/laravel myapp\n\n# Dev server\nphp artisan serve\n\n# Scaffolding\nphp artisan make:model\
  \ Order -m\nphp artisan make:controller OrderController --resource\n\n# Database\nphp artisan migrate\n\
  php artisan migrate:fresh --seed\n\n# Shell\nphp artisan tinker\n\n# Routes\nphp artisan route:list\n\
  \n# Queues\nphp artisan queue:work\nphp artisan queue:listen --tries=3\nphp artisan queue:retry all\n\
  \n# Scheduler\nphp artisan schedule:work\nphp artisan schedule:list\n```\n\n## Job Example\n\n```php\n\
  // app/Jobs/SendEmail.php\nclass SendEmail implements ShouldQueue\n{\n    public function handle():\
  \ void\n    {\n        Mail::to($this->user)->send(new WelcomeMail());\n    }\n}\n```\n\n## Best Practices\n\
  \n- Run migrations via deploy pipelines, never ad-hoc in prod\n- Keep controllers thin; push logic into\
  \ services and jobs\n- Use queue:work under supervisor in production\n- Schedule tasks in the kernel\
  \ and run schedule:run via cron once\n- Cache config/routes in prod: php artisan config:cache"
examples:
- input: Scaffold a resource API in Laravel
  output: Agent runs make:model/make:controller --resource, wires routes, and shows php artisan route:list
    output.
- input: Process email jobs in the background
  output: Agent creates a ShouldQueue job and starts php artisan queue:work with retry settings.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: laravel.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-laravel
  generic:
    system_prompt: 'You take the laravel seat. You do it through laravel-artisan: Scaffold and manage
      Laravel applications. The commands are real, e.g. `composer create-project laravel/laravel myapp`.
      You verify each step you report and stay honest about what you have not run.'
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2025-05-08T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
