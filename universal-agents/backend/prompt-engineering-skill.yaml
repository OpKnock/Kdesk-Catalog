name: prompt-engineering
display_name: Prompt Engineering
category: backend
subcategory: general
description: 'Crafts effective LLM prompts: system/user context design, few-shot examples, structured
  outputs, and iteration with evals.'
version: 2.0.0
tags:
- backend
author: Kdesk-Catalog
license: MIT
prerequisites:
- npx
- python
capabilities:
- commands:
  - npx promptfoo eval -c promptfooconfig.yaml
  - npx promptfoo run -c promptfooconfig.yaml
  - python -c "from openai import OpenAI; c=OpenAI(); r=c.chat.completions.create(model=\"gpt-4o-mini\",
    messages=[{\"role\":\"system\",\"content\":\"You are a terse assistant\"},{\"role\":\"user\",\"content\":\"Hi\"}]);
    print(r.choices[0].message.content)"
  description: Structure system prompts and few-shot examples.
  name: prompt-design
  examples:
  - npx promptfoo init
  - npx promptfoo eval --no-cache
  - 'curl -s https://api.openai.com/v1/chat/completions -H "Authorization: Bearer $OPENAI_API_KEY" -H
    "Content-Type: application/json" -d "{\"model\":\"gpt-4o-mini\",\"messages\":[{\"role\":\"user\",\"content\":\"Name
    3 colors\"}],\"temperature\":0}"'
  parameters:
  - description: Sampling temperature
    name: temperature
    type: number
  - description: json_object or json_schema output
    name: format
    type: string
- commands:
  - npx promptfoo eval
  - npx promptfoo view
  - npx promptfoo share
  - python -m venv .venv && .venv/bin/pip install openai
  description: Evaluate prompt variants with automated test cases.
  name: prompt-eval
  examples:
  - npx promptfoo eval -c eval.yaml --max-concurrency 8
  - npx promptfoo view --port 3000
  parameters:
  - description: Eval config path
    name: config
    type: string
  - description: Viewer port
    name: port
    type: integer
knowledge:
- title: OpenAI Prompt Guide
  description: Tactics for better responses
  source: https://platform.openai.com/docs/guides/prompt-engineering
  type: documentation
- title: Anthropic Prompt Engineering
  description: Claude-specific prompting techniques
  source: https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering/overview
  type: documentation
- title: Promptfoo Docs
  description: Eval-driven prompt development
  source: https://www.promptfoo.dev/docs/
  type: documentation
instructions: "# Prompt Engineering\n\nDesign and iterate on LLM prompts systematically.\n\n## When to\
  \ Use\n\n- Building any feature where model output quality matters\n- Diagnosing inconsistent or off-format\
  \ model responses\n- Comparing prompt variants or model versions\n- Reducing cost by cutting redundant\
  \ context\n\n## Structure\n\n- System: role, constraints, and behavior for the whole session\n- Context:\
  \ facts the model needs (docs, schema, examples)\n- Task: clear instruction with the expected output\
  \ shape\n- Few-shot: 2-3 concrete examples of input/output pairs\n- Guardrails: what to do when input\
  \ is out of scope\n\n## Commands\n\n```bash\n# Eval setup\nnpx promptfoo init\nnpx promptfoo eval -c\
  \ promptfooconfig.yaml\nnpx promptfoo view\n\n# Quick probe of a model\ncurl -s https://api.openai.com/v1/chat/completions\
  \ \\\n  -H \"Authorization: Bearer $OPENAI_API_KEY\" \\\n  -H \"Content-Type: application/json\" \\\n\
  \  -d '{\"model\":\"gpt-4o-mini\",\"messages\":[{\"role\":\"user\",\"content\":\"Name 3 colors\"}],\"\
  temperature\":0}'\n```\n\n## Prompt Example\n\n```\nSystem: You extract structured fields from invoices.\
  \ Reply with JSON only.\nUser: Invoice #1042, dated 2026-01-15, total $129.99, vendor \"Acme Corp\"\n\
  Assistant: {\"number\":\"1042\",\"date\":\"2026-01-15\",\"total\":129.99,\"vendor\":\"Acme Corp\"}\n\
  ```\n\n## Best Practices\n\n- Always test with real negative examples, not just happy paths\n- Keep\
  \ instructions specific; vague prompts produce vague output\n- Use temperature 0 for extraction, higher\
  \ only for creative tasks\n- Require structured output (JSON schema) for machine consumption\n- Track\
  \ prompt versions and eval scores in the repo\n- Trim context ruthlessly; token cost scales with input\
  \ length"
examples:
- input: The model ignores my output format instructions
  output: Agent switches to structured JSON output mode, adds a one-shot example, and verifies with promptfoo
    assertions.
- input: Compare two prompt variants
  output: Agent creates a promptfooconfig.yaml with both prompts and identical test cases, runs eval,
    and compares scores.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: prompt-engineering.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-prompt-engineering
  generic:
    system_prompt: 'You own Prompt Engineering end to end. You do it through prompt-design: Structure
      system prompts and few-shot examples. The commands are real, e.g. `npx promptfoo eval -c promptfooconfig.yaml`.
      You answer with exact commands, not abstractions, and flag anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
