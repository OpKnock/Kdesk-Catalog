instructions: '# Uvicorn


  ASGI server for Python async apps.


  ## When to Use


  - Serving FastAPI, Starlette, and other ASGI apps

  - Development with hot reload

  - Production serving with multiple workers


  ## Commands


  ```bash

  # Dev with reload

  uvicorn main:app --reload


  # Watch a directory

  uvicorn main:app --reload --reload-dir app


  # Production: 4 workers

  uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4


  # HTTP/2 support

  uvicorn main:app --http2


  # App factory pattern

  uvicorn --factory main:create_app


  # Keep-alive tuning

  uvicorn main:app --timeout-keep-alive 65


  # Debug logging

  uvicorn main:app --log-level debug

  ```


  ## Deployment


  ```dockerfile

  FROM python:3.12-slim

  WORKDIR /app

  COPY requirements.txt .

  RUN pip install --no-cache-dir -r requirements.txt

  COPY . .

  CMD ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]

  ```


  ## Best Practices


  - Workers > 1 only when the app is async and dependency-free of globals

  - Use uvloop loop for better throughput on Linux

  - Terminate cleanly on SIGTERM; uvicorn handles it

  - Put a proxy (nginx/traefik) in front for TLS and buffering

  - Verify with curl before declaring deploy healthy'
examples:
- input: My FastAPI app is slow in production
  output: Agent checks worker count and loop type, suggests uvicorn --workers 4 --loop uvloop, and verifies
    with curl latency checks.
- input: Why does my reload not trigger?
  output: Agent fixes the import path, uses --reload-dir for the source tree, and confirms the app factory
    target.
