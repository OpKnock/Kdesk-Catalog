- title: MDN WebSockets
  description: Browser WebSocket API
  source: https://developer.mozilla.org/en-US/docs/Web/API/WebSocket
  type: documentation
- title: Socket.IO Docs
  description: Realtime framework with fallbacks
  source: https://socket.io/docs/
  type: documentation
instructions: "# WebSocket Management\n\nBuild and operate realtime WebSocket services.\n\n## When to\
  \ Use\n\n- Live notifications, chat, and collaborative editing\n- Real-time dashboards and streaming\
  \ updates\n- Bidirectional protocols where polling is wasteful\n\n## Core Concerns\n\n- Heartbeat: ping/pong\
  \ to detect dead connections\n- Reconnect: exponential backoff with jitter on the client\n- Broadcasting:\
  \ fan out messages to rooms or all clients\n- Scaling: one instance cannot hold every connection\n\n\
  ## Commands\n\n```bash\n# Test a server\nnpx wscat -c ws://localhost:3000\nnpx wscat -c wss://example.com/socket\n\
  \n# With headers\nnpx wscat -c ws://localhost:3000 -H \"Authorization: Bearer token\"\n\n# Alternative\
  \ client\nwebsocat ws://localhost:3000\n\n# Cross-instance broadcast via Redis\nredis-cli publish ws:channel\
  \ '{\"userId\":1,\"msg\":\"hi\"}'\nredis-cli pubsub numsub ws:channel\n```\n\n## Node Example\n\n```javascript\n\
  const { WebSocketServer } = require(\"ws\");\nconst wss = new WebSocketServer({ port: 3000 });\n\nwss.on(\"\
  connection\", (ws) => {\n  ws.isAlive = true;\n  ws.on(\"pong\", () => (ws.isAlive = true));\n  ws.on(\"\
  message\", (data) => wss.clients.forEach((c) => c.send(data)));\n});\n\nsetInterval(() => {\n  wss.clients.forEach((ws)\
  \ => {\n    if (!ws.isAlive) return ws.terminate();\n    ws.isAlive = false;\n    ws.ping();\n  });\n\
  }, 30000);\n```\n\n## Best Practices\n\n- Heartbeat every 20-30s and terminate silent sockets\n- Limit\
  \ payload size and rate per connection\n- Authenticate on the upgrade request, not after connect\n-\
  \ Use Redis pub/sub to broadcast across instances\n- Handle backpressure; do not buffer unbounded\n\
  - Load test with many concurrent connections before launch"
examples:
- input: Clients disconnect randomly from my socket
  output: Agent adds ping/pong heartbeat with termination, checks proxies for idle timeouts, and tunes
    keep-alive.
- input: Broadcast to all connected users
  output: Agent implements a broadcast loop and scales it with Redis pub/sub across instances.
