name: websocket-mgmt
display_name: Websocket Mgmt
category: backend
subcategory: general
description: 'Implements and operates WebSocket servers: connections, heartbeats, reconnects, broadcasting,
  and scaling with Redis pub/sub.'
version: 2.0.0
tags:
- backend
author: Kdesk
license: MIT
prerequisites:
- docker
- node
- npx
- redis-cli
- websocat
capabilities:
- commands:
  - npx wscat -c ws://localhost:3000
  - npx wscat -c wss://localhost/socket
  - websocat ws://localhost:3000
  - node server.js
  description: Run WebSocket servers and inspect traffic.
  name: ws-servers
  examples:
  - 'npx wscat -c ws://localhost:3000 -H "Authorization: Bearer token"'
  - websocat -t ws://localhost:3000
  - 'wscat -c wss://localhost --header "Origin: http://localhost:8080"'
  parameters:
  - description: WebSocket URL
    name: url
    type: string
  - description: Extra header
    name: header
    type: string
- commands:
  - redis-cli publish ws:channel "event"
  - redis-cli pubsub numsub ws:channel
  - redis-cli llen ws:connections
  - docker compose up -d redis
  description: Scale WebSocket apps across instances.
  name: ws-scaling
  examples:
  - redis-cli publish notifications "{\"userId\":1,\"msg\":\"hi\"}"
  - redis-cli psubscribe "ws:*"
  parameters:
  - description: Pub/sub channel
    name: channel
    type: string
  - name: payload
    type: string
    description: Message payload to publish
