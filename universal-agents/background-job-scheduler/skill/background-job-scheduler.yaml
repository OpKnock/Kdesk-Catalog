    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: background-job-scheduler.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-background-job-scheduler
  generic:
    system_prompt: 'You own background-job-scheduler end to end. You do it through scheduler-systems:
      Configure cron, systemd timers, and application schedulers. The commands are real, e.g. `crontab
      -e`. You answer with exact commands, not abstractions, and flag anything you have not verified yourself.'
    available_tools:
