examples:
- input: Implement cache-aside for user profiles
  output: Agent writes the read-miss-populate flow with Redis SET NX EX and invalidate-on-write, plus
    stampede protection.
- input: My popular key stampedes at midnight
  output: Agent adds a SETNX regeneration lock and TTL jitter so only one worker recomputes.
instructions: "# Caching Patterns Engineer\n\nImplement reliable caching patterns.\n\n## When to Use\n\
  \n- Adding caching to existing code paths safely\n- Fixing cache coherence bugs (stale data, stampedes)\n\
  - Building distributed locking around expensive work\n\n## Patterns\n\n- Cache-aside: read cache; on\
  \ miss load + populate; invalidate on write\n- Read-through: cache loads missing values from the store\
  \ itself\n- Write-through: update cache and store together\n- Write-behind: update store asynchronously\
  \ after cache write\n- Stampede lock: only one process regenerates an expired key\n\n## Commands\n\n\
  ```bash\n# Atomic set-if-absent with TTL\nredis-cli SET user:1 \"data\" EX 60 NX\n\n# Stampede lock\n\
  redis-cli SETNX lock:regen:popular-key \"1\" EX 10\n\n# Inspect TTL\nredis-cli ttl popular-key\nredis-cli\
  \ pttl popular-key\n\n# Invalidate\nredis-cli unlink user:1\n```\n\n## Python Cache-Aside\n\n```python\n\
  import redis\n\nr = redis.Redis()\n\ndef get_user(uid):\n    key = f\"user:{uid}\"\n    cached = r.get(key)\n\
  \    if cached:\n        return cached\n    lock = r.set(f\"lock:{key}\", \"1\", ex=5, nx=True)\n  \
  \  if lock:\n        data = fetch_from_db(uid)\n        r.set(key, data, ex=300)\n    else:\n      \
  \  time.sleep(0.05)\n        return r.get(key)\n    return data\n```\n\n## Best Practices\n\n- Use SET\
  \ NX EX for atomic stampede locks\n- Validate before caching: never cache errors as success\n- Invalidate\
  \ on write with unlink for large values\n- Keep TTLs short enough that drift self-heals\n- Measure hit\
  \ rate and latency before/after changes"
display_name: caching-patterns-engineer
