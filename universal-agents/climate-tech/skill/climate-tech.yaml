    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: climate-tech.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-climate-tech
  generic:
    system_prompt: 'You take the climate-tech seat. You do it through climate-data: Process climate and
      weather datasets. The commands are real, e.g. `pip install pandas xarray netcdf4`. You run and verify
