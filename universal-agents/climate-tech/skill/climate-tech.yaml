capabilities:
- commands:
  - pip install pandas xarray netcdf4
  - python -c "import xarray as xr; ds=xr.open_dataset(\"data.nc\"); print(ds)"
  - python -c "import pandas as pd; print(pd.read_csv(\"emissions.csv\").head())"
  - pip install rasterio
  - python -c "import rasterio; print(rasterio.open(\"tif/raster.tif\"))"
  description: Process climate and weather datasets.
  name: climate-data
  examples:
  - python -c "import xarray as xr; print(xr.open_dataset(\"data.nc\").mean(dim=\"time\"))"
  - python -c "import pandas as pd; df=pd.read_csv(\"emissions.csv\"); print(df.groupby(\"year\").co2.sum())"
  parameters:
  - description: NetCDF, CSV, or GeoTIFF path
    name: file
    type: string
  - name: engine
    type: string
    description: 'Backend: xarray, pandas, or rasterio'
- commands:
  - python -c "import pandas as pd; df=pd.read_csv(\"emissions.csv\"); df[\"co2e\"]=df.co2*df.gwp; print(df.groupby(\"sector\").co2e.sum())"
  - python -m venv .venv && source .venv/bin/activate
  - pip install openpyxl
  - python -c "import pandas as pd; pd.DataFrame({\"x\":[1]}).to_excel(\"report.xlsx\"); print(\"ok\")"
  description: Compute and report emissions metrics.
  name: emissions-accounting
  examples:
  - python -c "import pandas as pd; df=pd.read_csv(\"emissions.csv\"); print(df.pivot_table(index=\"year\",
    columns=\"sector\", values=\"co2e\", aggfunc=\"sum\"))"
  - python -c "import pandas as pd; print(pd.read_excel(\"report.xlsx\"))"
  parameters:
  - description: Emissions dataset path
    name: dataset
    type: string
  - name: unit
    type: string
    description: 'Units: tCO2e, kgCO2e, or MtCO2e'
prerequisites:
- node.js
- python
- prometheus
- grafana
tools:
- node.js
- python
- prometheus
- grafana
- aws
examples:
- input: Compute regional temperature trends from NetCDF
  output: Agent opens the dataset with xarray, resamples to annual means, masks by region, and plots or
    exports the trend.
- input: Convert emissions data to CO2e
  output: Agent multiplies by GWP factors per gas with pandas and aggregates by sector and year.
instructions: '# Climate Tech


  Analyze climate, weather, and energy data.


  ## When to Use


  - Processing NetCDF/CMIP model output

  - Emissions accounting and scenario analysis

  - Geospatial raster analysis (land cover, solar irradiance)

  - Building energy and grid data pipelines


  ## Commands


  ```bash

  pip install pandas xarray netcdf4 rasterio


  # Inspect a NetCDF dataset

  python -c "import xarray as xr; ds=xr.open_dataset(''data.nc''); print(ds)"


  # Time-averaged means

  python -c "import xarray as xr; print(xr.open_dataset(''data.nc'').mean(dim=''time''))"


  # Emissions aggregation

  python -c "import pandas as pd; df=pd.read_csv(''emissions.csv''); print(df.groupby(''year'').co2.sum())"


  # GWP-weighted CO2e

  python -c "import pandas as pd; df=pd.read_csv(''emissions.csv''); df[''co2e'']=df.co2*df.gwp; print(df.groupby(''sector'').co2e.sum())"


  # Raster inspection

  python -c "import rasterio; print(rasterio.open(''raster.tif''))"

  ```


  ## Analysis Example


  ```python

  import xarray as xr


  ds = xr.open_dataset("temp_2m.nc")

  annual_mean = ds.t2m.groupby("time.year").mean()

  print(annual_mean.isel(year=-1))

  ```


  ## Best Practices


  - Check units and coordinate systems before arithmetic

  - Use xarray for labeled N-D data, pandas for tabular

  - Prefer chunked reads for large CMIP files

  - Record data provenance (source, version, processing steps)

  - Validate against published figures before reporting

  - Pin scientific package versions for reproducibility'
display_name: climate-tech
knowledge:
- title: xarray Docs
  description: N-D labeled arrays for climate data
  source: https://docs.xarray.dev
  type: documentation
- title: Rasterio Docs
  description: Geospatial raster I/O
  source: https://rasterio.readthedocs.io
  type: documentation
- title: IPCC GWP Values
  description: Global warming potential factors
  source: https://www.ipcc.ch/report/ar6/wg1/
  type: documentation
