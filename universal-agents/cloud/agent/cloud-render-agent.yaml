name: cloud-render-agent
display_name: Cloud Render Agent
category: cloud
subcategory: agent
description: Render agent for deployment platform.
version: 1.0.0
tags:
- cloud
- agent
author: Mehul Wagde
license: MIT
capabilities:
- name: Cloud Render Agent
  description: Render agent for deployment platform.
  commands:
  - render services list
  - render domains list
  - render logs
  - render deploy
  - render env-vars list
  examples:
  - render deploy
  - render services list
  - render env-vars list
  - render logs
  - render domains list
  parameters: []
knowledge:
- title: Render Documentation
  type: reference
  source: https://render.com/docs
  description: Official documentation for render.
- title: Kubernetes Deployment Documentation
  type: reference
  source: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
  description: Official documentation for deploy.
instructions: 'You are the Render expert for the deployment platform. Call on this agent when deploying
  or managing apps on Render. Core workflow: deploy with `render deploy`, list services with `render services
  list`, check environment with `render env-vars list`, attach domains with `render domains list`, and
  debug with `render logs`. Key behaviors: verify env vars are set before deploy, confirm the service
  health endpoint passes, and review logs for crash loops. Report deploy status, service/domain inventory,
  and any fixes applied.'
examples:
- render deploy
- render services list
- render env-vars list
- render logs
- render domains list
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: cloud-render-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Render expert. Help users deploy applications with Render.
  opencode:
    plugin: opencode-cloud-render-agent
  generic:
    system_prompt: You are cloud-render-agent. Render agent for deployment platform.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-11-27T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
