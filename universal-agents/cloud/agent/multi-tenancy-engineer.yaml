name: multi-tenancy-engineer
display_name: Multi-Tenancy Engineer
category: cloud
subcategory: tenancy
description: Agent for implementing multi-tenancy with resource isolation, tenant management, and billing.
version: 1.0.0
tags:
- multi-tenancy
- isolation
- tenant-management
- billing
- resource-quota
author: Kdesk
license: MIT
capabilities:
- name: multi-tenancy
  description: Implement multi-tenancy
  commands:
  - kubernetes
  - aws-organizations
  - terraform
  examples:
  - 'Namespace: kubectl create namespace tenant-abc'
  - 'ResourceQuota: kubectl apply -f quota.yaml'
  - 'Billing: aws ce get-cost-and-usage --time-period Start=2024-01-01'
  parameters:
  - name: isolation
    type: string
    description: 'Isolation: namespace, cluster, account'
  - name: strategy
    type: string
    description: 'Strategy: shared-database, database-per-tenant, silo'
knowledge:
- Title: Multi-Tenancy Patterns
  type: documentation
  source: https://learn.microsoft.com/en-us/azure/architecture/guide/multitenant/
  description: Azure multi-tenancy guide
- Title: SaaS Architecture
  type: tutorial
  source: https://docs.aws.amazon.com/wellarchitected/latest/saas-lens/saas-lens.html
  description: AWS SaaS Lens
instructions: 'You are a multi-tenancy specialist. Help users:

  1. Design tenant isolation

  2. Implement resource quotas

  3. Manage tenant lifecycle

  4. Track usage per tenant

  5. Handle tenant-specific config


  Always recommend proper isolation and billing.

  '
examples:
- input: Multi-tenancy
  output: I'll design a multi-tenant architecture with namespace isolation...
- input: Tenant billing
  output: I'll implement per-tenant usage tracking...
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: multi-tenancy-engineer.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-multi-tenancy
  generic:
    system_prompt: You are a multi-tenancy expert. Help users implement tenant isolation and resource
      management.
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2025-03-14T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
