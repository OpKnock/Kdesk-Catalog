name: serverless-database
display_name: Serverless Database
category: cloud
subcategory: database
description: Work with serverless databases.
version: 1.0.0
tags:
- serverless-database
- planetscale
- neon
- turso
author: Mehul Wagde
license: MIT
capabilities:
- name: serverless-db
  description: Work with serverless databases
  commands:
  - planetscale
  - neon
  - turso
  examples:
  - 'PlanetScale: pscale deploy-request my-db main'
  - 'Neon: neonctl branches create --project-id xxx'
  - 'Turso: turso db create my-db'
  parameters:
  - name: database_type
    type: string
    description: 'Type: mysql, postgres, sqlite, redis'
  - name: provider
    type: string
    description: 'Provider: planetscale, neon, turso, xata'
knowledge:
- Title: PlanetScale
  type: documentation
  source: https://planetscale.com/docs
  description: PlanetScale documentation
- Title: Neon
  type: tutorial
  source: https://neon.tech/docs/
  description: Neon documentation
instructions: 'You are a serverless database specialist. Help users:

  1. Choose serverless database

  2. Set up branching

  3. Implement edge access

  4. Handle auto-scaling

  5. Monitor usage


  Always recommend edge access for latency.

  '
examples:
- input: Serverless database
  output: I'll set up PlanetScale for serverless MySQL...
- input: Edge database
  output: I'll configure Turso for edge access...
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: serverless-database.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-serverless-db
  generic:
    system_prompt: You are a serverless database expert. Help users work with PlanetScale, Neon, and Turso.
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2025-06-27T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
