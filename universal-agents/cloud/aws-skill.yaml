name: aws
display_name: aws
category: cloud
subcategory: general
description: 'Operates AWS services with the AWS CLI: EC2, S3, IAM, Lambda, EKS, and CloudWatch across
  accounts and regions.'
version: 2.0.0
tags:
- cloud
author: Kdesk
license: MIT
prerequisites:
- aws
- kubectl
capabilities:
- commands:
  - aws s3 ls
  - aws s3 cp file.txt s3://my-bucket/
  - aws ec2 describe-instances --query "Reservations[*].Instances[*].[InstanceId,State.Name]"
  - aws ec2 describe-regions
  - aws sts get-caller-identity
  description: Manage core AWS resources from the CLI.
  name: aws-core
  examples:
  - aws s3 sync ./dist s3://my-bucket/ --delete
  - aws ec2 describe-instances --filters Name=instance-state-name,Values=running --query "Reservations[*].Instances[*].PublicIpAddress"
  - aws iam list-users --output table
  parameters:
  - description: AWS region
    name: region
    type: string
  - description: Named profile
    name: profile
    type: string
  - description: JMESPath query
    name: query
    type: string
- commands:
  - aws lambda list-functions --region us-east-1
  - aws lambda invoke --function-name myfunc --payload "{}" out.json
  - aws lambda update-function-code --function-name myfunc --zip-file fileb://func.zip
  - aws logs tail /aws/lambda/myfunc
  - aws logs describe-log-groups
  description: Deploy and manage Lambda functions.
  name: aws-serverless
  examples:
  - aws lambda invoke --cli-binary-format raw-in-base64-out --function-name myfunc --payload "{\"key\":\"v\"}"
    out.json
  - aws logs tail /aws/lambda/myfunc --follow
  - aws lambda get-function-configuration --function-name myfunc
  parameters:
  - description: Lambda function name
    name: function
    type: string
  - name: region
    type: string
    description: AWS region
- commands:
  - aws eks update-kubeconfig --name my-cluster --region us-east-1
  - aws eks list-clusters
  - aws eks describe-cluster --name my-cluster --query "cluster.status"
  - kubectl get nodes
  description: Manage EKS clusters and kubeconfigs.
  name: aws-kubernetes
  examples:
  - aws eks update-kubeconfig --name my-cluster --alias prod
  - aws eks list-nodegroups --cluster-name my-cluster
  parameters:
  - description: EKS cluster name
    name: cluster
    type: string
  - name: region
    type: string
    description: AWS region
