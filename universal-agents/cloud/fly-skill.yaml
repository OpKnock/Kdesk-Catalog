name: fly
display_name: Fly
category: cloud
subcategory: general
description: 'Deploys applications to Fly.io with the flyctl CLI: app creation, scaling machines, volumes,
  secrets, and wireguard VPN.'
version: 2.0.0
tags:
- cloud
author: Kdesk
license: MIT
prerequisites:
- fly
capabilities:
- commands:
  - fly launch
  - fly deploy
  - fly status
  - fly apps create myapp
  - fly scale count app=3
  description: Create apps, launch machines, and deploy.
  name: fly-deploy
  examples:
  - fly launch --name myapp --region lhr --no-deploy
  - fly deploy --image nginx:alpine
  - fly scale count app=5 --max-per-region 2
  parameters:
  - description: Fly app name
    name: app
    type: string
  - description: Fly region code
    name: region
    type: string
- commands:
  - fly machines list -a myapp
  - fly volume create data -a myapp --region lhr --size 5
  - fly secrets set DATABASE_URL=postgres://...
  - fly secrets list -a myapp
  - fly ssh console -a myapp
  description: Manage machines, volumes, and secrets.
  name: fly-ops
  examples:
  - fly machines destroy 123abc -a myapp --force
  - fly volumes list -a myapp
  - fly secrets set --detach AUTH_TOKEN=abc123
  parameters:
  - description: Machine id
    name: machine-id
    type: string
  - description: KEY=VALUE pair
    name: secret
    type: string
knowledge:
- title: Fly.io Docs
  description: Deployment, machines, and volumes reference
  source: https://fly.io/docs/
  type: documentation
- title: flyctl Reference
  description: CLI command reference
  source: https://fly.io/docs/flyctl/
  type: documentation
instructions: '# Fly.io


  Deploy apps to edge infrastructure with flyctl.


  ## When to Use


  - Quick global deploys for Dockerized apps

  - Stateful services with volumes

  - Regional scaling (machines per region)

  - Replacement for Heroku-style workflows


  ## Commands


  ```bash

  # Launch a new app

  fly launch

  fly launch --name myapp --region lhr --no-deploy


  # Deploy

  fly deploy

  fly deploy --image nginx:alpine


  # Status

  fly status


  # Scale

  fly scale count app=3

  fly scale count app=5 --max-per-region 2


  # Machines

  fly machines list -a myapp

  fly machines destroy 123abc -a myapp --force


  # Volumes

  fly volume create data -a myapp --region lhr --size 5

  fly volumes list -a myapp


  # Secrets

  fly secrets set DATABASE_URL=postgres://...

  fly secrets list -a myapp


  # Shell access

  fly ssh console -a myapp

  ```


  ## Best Practices


  - Set fly.toml app name, internal_port, and min_machines_running

  - Use volumes only for stateful data; keep apps stateless

  - Manage secrets with fly secrets, never in code

  - Test with fly deploy --no-cache for clean builds

  - Monitor with fly status and the dashboard metrics

  - Pin the primary region; place dependent services together'
examples:
- input: Deploy my Node app to Fly.io
  output: Agent runs fly launch, reviews fly.toml, deploys with fly deploy, and verifies with fly status.
- input: Add persistent storage to my Fly app
  output: Agent creates a volume with fly volume create, mounts it in fly.toml, and redeploys.
