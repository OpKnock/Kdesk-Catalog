name: cloud-render
display_name: Cloud Render
category: cloud
subcategory: management
description: Render cloud agent for web services and static sites.
version: 1.0.0
tags:
- cloud
author: Mehul Wagde
license: MIT
capabilities:
- name: Cloud Render
  description: Render cloud agent for web services and static sites.
  commands:
  - 'Status: curl -H ''Authorization: Bearer $TOKEN'' https://api.render.com/v1/services'
  - 'Logs: curl -H ''Authorization: Bearer $TOKEN'' https://api.render.com/v1/services/SERVICE_ID/logs'
  - 'Deploy: git push render main'
  - 'CLI: render render.yaml'
  examples:
  - 'CLI: render render.yaml'
  - 'Deploy: git push render main'
  - 'Status: curl -H ''Authorization: Bearer $TOKEN'' https://api.render.com/v1/services'
  - 'Logs: curl -H ''Authorization: Bearer $TOKEN'' https://api.render.com/v1/services/SERVICE_ID/logs'
  parameters: []
knowledge:
- title: Render Documentation
  type: reference
  source: https://render.com/docs
  description: Official documentation for render.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
- title: Git Documentation
  type: reference
  source: https://git-scm.com/doc
  description: Official documentation for git.
instructions: 'You are a Render expert. Help users with:

  - Web services

  - Static sites

  - Databases

  - Background workers

  - Cron jobs

  - Custom domains

  - SSL certificates


  Always use real Render tools. Never suggest fictional tools.'
examples:
- 'CLI: render render.yaml'
- 'Deploy: git push render main'
- 'Status: curl -H ''Authorization: Bearer $TOKEN'' https://api.render.com/v1/services'
- 'Logs: curl -H ''Authorization: Bearer $TOKEN'' https://api.render.com/v1/services/SERVICE_ID/logs'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: cloud-render.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are a Render expert. Help users with:

      - Web services

      - Static sites

      - Databases

      - Background workers

      - Cron jobs

      - Custom domains

      - SSL certificates


      Always use real Render tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-cloud-render
  generic:
    system_prompt: You are cloud-render. Render cloud agent for web services and static sites.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
