name: supabase
display_name: supabase
category: cloud
subcategory: general
description: 'Builds apps with Supabase: local development, migrations, auth, storage, and database operations
  with the supabase CLI.'
version: 2.0.0
tags:
- cloud
author: Kdesk-Catalog
license: MIT
prerequisites:
- npx
- psql
capabilities:
- commands:
  - npx supabase init
  - npx supabase start
  - npx supabase stop
  - npx supabase status
  - npx supabase db reset
  description: Run the local Supabase stack.
  name: supabase-local
  examples:
  - npx supabase start --exclude auth
  - npx supabase status -o env
  - npx supabase stop --no-backup
  parameters:
  - description: Project reference
    name: project-ref
    type: string
  - name: db
    type: string
    description: Local database name
- commands:
  - npx supabase migration new create_users
  - npx supabase db push
  - npx supabase db diff --linked
  - npx supabase db lint
  - psql "postgresql://postgres:postgres@localhost:54322/postgres" -c "SELECT 1"
  description: Manage migrations and database operations.
  name: supabase-db
  examples:
  - npx supabase db diff -f users_table --linked
  - npx supabase migration list
  - npx supabase db reset --no-seed
  parameters:
  - description: Migration name
    name: name
    type: string
  - description: Diff against linked project
    name: linked
    type: boolean
- commands:
  - npx supabase functions deploy myfunc
  - npx supabase functions serve
  - npx supabase storage create-bucket avatars --public
  - npx supabase projects list
  - npx supabase link --project-ref abcdef
  description: Manage auth users, storage buckets, and functions.
  name: supabase-auth-storage
  examples:
  - npx supabase functions deploy myfunc --project-ref abcdef
  - npx supabase storage empty-bucket avatars
  - npx supabase projects list
  parameters:
  - description: Storage bucket name
    name: bucket
    type: string
  - description: Edge function name
    name: function
    type: string
knowledge:
- title: Supabase Docs
  description: Database, auth, storage, and functions
  source: https://supabase.com/docs
  type: documentation
- title: Supabase CLI
  description: Local dev and migration workflow
  source: https://supabase.com/docs/guides/cli
  type: documentation
instructions: '# Supabase


  Backend-as-a-service on Postgres.


  ## When to Use


  - Postgres-backed apps without server management

  - Auth (email, OAuth) and Row Level Security

  - Storage buckets for user files

  - Edge functions for custom logic


  ## Commands


  ```bash

  # Local stack

  npx supabase init

  npx supabase start

  npx supabase status

  npx supabase stop

  npx supabase db reset


  # Migrations

  npx supabase migration new create_users

  npx supabase db push

  npx supabase db diff -f users_table --linked

  npx supabase migration list


  # Link to a hosted project

  npx supabase link --project-ref abcdef

  npx supabase projects list


  # Functions

  npx supabase functions serve

  npx supabase functions deploy myfunc


  # Storage

  npx supabase storage create-bucket avatars --public

  ```


  ## Best Practices


  - Do all schema work via migrations, never ad-hoc SQL in prod

  - Use RLS policies for row-level security by default

  - Keep the local stack in sync with prod via db diff

  - Run supabase functions serve for local edge function dev

  - Rotate service role keys; use anon key on clients

  - Reset local DB from migrations, not snapshots'
examples:
- input: Add a table to my Supabase project
  output: Agent writes a migration with npx supabase migration new, fills in SQL, and applies with db
    push.
- input: Deploy an edge function
  output: Agent serves it locally with functions serve, then deploys with functions deploy against the
    linked project.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: supabase.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-supabase
  generic:
    system_prompt: 'You take the supabase seat. You do it through supabase-local: Run the local Supabase
      stack. The commands are real, e.g. `npx supabase init`. You answer with exact commands, not abstractions,
      and flag anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
