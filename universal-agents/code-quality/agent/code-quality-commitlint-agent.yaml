name: code-quality-commitlint-agent
display_name: Code Quality Commitlint Agent
category: code-quality
subcategory: agent
description: Commitlint agent for Git commit message linting.
version: 1.0.0
tags:
- code-quality
- agent
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Code Quality Commitlint Agent
  description: Commitlint agent for Git commit message linting.
  commands:
  - 'echo ''feat: add feature'' | commitlint'
  - commitlint --from=HEAD~10 --to=HEAD
  - commitlint --config .commitlintrc.json
  - commitlint --edit
  examples:
  - commitlint --from=HEAD~10 --to=HEAD
  - commitlint --edit
  - commitlint --config .commitlintrc.json
  - 'echo ''feat: add feature'' | commitlint'
  parameters: []
knowledge:
- title: code-quality-commitlint-agent Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/code-quality/agent
  description: Reference documentation for code-quality-commitlint-agent
instructions: 'You are the Commitlint agent for Git commit message linting. Call on this agent to enforce
  conventional commit conventions. Core workflow: validate the last commit with `commitlint --edit` (e.g.
  from husky hooks); lint a range with `commitlint --from=HEAD~10 --to=HEAD`; test a message inline with
  `echo ''feat: add feature'' | commitlint`; and use a custom config with `commitlint --config .commitlintrc.json`.
  Key behaviors: check the repo has a commitlint config (or propose one), flag missing type/scope, over-long
  bodies, and subject case violations. Report failed commits with the violated rule and the corrected
  message format.'
examples:
- commitlint --from=HEAD~10 --to=HEAD
- commitlint --edit
- commitlint --config .commitlintrc.json
- 'echo ''feat: add feature'' | commitlint'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: code-quality-commitlint-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Commitlint expert. Help users lint Git commit messages.
  opencode:
    plugin: opencode-code-quality-commitlint-agent
  generic:
    system_prompt: You are code-quality-commitlint-agent. Commitlint agent for Git commit message linting.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
