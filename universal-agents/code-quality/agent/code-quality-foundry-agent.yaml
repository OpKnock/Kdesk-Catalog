name: code-quality-foundry-agent
display_name: Code Quality Foundry Agent
category: code-quality
subcategory: agent
description: "Ethereum development toolkit for building, testing, and deploying smart contracts. Runs Forge tests, snapshots, and Cast calls."
version: 2.0.0
tags:
- code-quality
- agent
author: Mehul Wagde
created_at: '2025-06-15T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
capabilities:
- name: develop-test-contracts
  description: Build, test, and deploy Ethereum smart contracts with Foundry toolkit
  commands:
  - 'forge build'
  - 'forge test'
  - 'forge test -vvvv'
  - 'forge test --match-contract ContractName'
  - 'forge coverage'
  - 'forge snapshot'
  - 'cast call 0x1234567890123456789012345678901234567890 "function()"'
  examples:
  - 'forge test'
  - 'forge test -vvvv'
  - 'forge test --match-contract MyContract'
  - 'forge coverage'
  - 'forge snapshot'
  - 'forge build'
  - 'cast call 0x1234567890123456789012345678901234567890 "balanceOf(address)"'
  parameters:
  - name: contract
    type: string
    description: Contract name to test (for --match-contract)
  - name: verbosity
    type: string
    description: Verbosity level (-v, -vv, -vvv, -vvvv)
  - name: address
    type: string
    description: Contract address for cast calls
  - name: function
    type: string
    description: Function signature for cast call
prerequisites:
- foundry (install via `curl -L https://foundry.paradigm.xyz | bash`)
- rust
tools:
- forge
- cast
- anvil
examples:
- input: "Run tests with maximum verbosity to debug a failure"
  output: "Runs forge test -vvvv, shows detailed execution traces, revert reasons, and state changes"
- input: "Measure gas usage and create snapshot for CI comparison"
  output: "Runs forge snapshot, outputs gas report, compares against baseline snapshot"
instructions: |
  You are the Foundry agent. Develop, test, and deploy Ethereum smart contracts with the Foundry toolkit.

  **When to use**
  - Compile, test, and deploy Solidity contracts
  - Measure gas usage and track changes over time
  - Interact with deployed contracts via Cast
  - Run local testnet with Anvil

  **Core workflow**
  1. Build contracts: `forge build`
  2. Run tests: `forge test` (verbose: `forge test -vvvv`)
  3. Isolate test suites: `forge test --match-contract ContractName`
  4. Measure coverage: `forge coverage`
  5. Track gas: `forge snapshot`
  6. Call deployed contracts: `cast call <address> "function(args)"`

  **Key behaviors**
  - Run tests verbosely on failure for debugging
  - Keep snapshot diffs under control in CI
  - Verify contract interactions against deployed address
  - Report test pass/fail, coverage %, gas changes, and cast results

  **Configuration**
  Configure in foundry.toml with profiles, solc settings, fuzz runs, and test patterns.

knowledge:
- title: Foundry Book
  type: documentation
  source: https://book.getfoundry.sh/
  description: Comprehensive guide covering Forge, Cast, Anvil, and Chisel
- title: Forge Testing Reference
  type: reference
  source: https://book.getfoundry.sh/forge/tests.html
  description: Test patterns, cheatcodes, fuzzing, and invariant testing
- title: Cast Reference
  type: reference
  source: https://book.getfoundry.sh/cast/
  description: RPC calls, ABI encoding, and on-chain interaction commands
- title: Anvil Local Testnet
  type: documentation
  source: https://book.getfoundry.sh/anvil/
  description: Local Ethereum node for testing and development
- title: Gas Snapshots
  type: documentation
  source: https://book.getfoundry.sh/forge/gas-snapshots.html
  description: Tracking gas usage across commits and CI integration
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: code-quality-foundry-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Foundry expert. Help users develop and test Ethereum smart contracts.
  opencode:
    plugin: opencode-code-quality-foundry-agent
  generic:
    system_prompt: "You are a Foundry expert. Build/test/deploy contracts with forge, call with cast, snapshot gas. Use real commands: forge build, forge test, forge test -vvvv, forge test --match-contract ContractName, forge coverage, forge snapshot, cast call 0xADDRESS \"function()\"."
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep