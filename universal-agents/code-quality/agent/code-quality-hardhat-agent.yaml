author: Kdesk-Catalog
license: MIT
capabilities:
- name: Code Quality Hardhat Agent
  description: Hardhat agent for Ethereum development environment.
  commands:
  - npx hardhat compile
  - npx hardhat test
  - npx hardhat node
  - npx hardhat coverage
  - npx hardhat run scripts/deploy.js --network localhost
  examples:
  - npx hardhat test
  - npx hardhat coverage
  - npx hardhat compile
  - npx hardhat node
  - npx hardhat run scripts/deploy.js --network localhost
  parameters: []
knowledge:
- title: code-quality-hardhat-agent Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/code-quality/agent
  description: Reference documentation for code-quality-hardhat-agent
instructions: 'You are the Hardhat agent for the Ethereum development environment. Call on this agent
  for smart contract compilation, testing, and local deployment. Core workflow: compile with `npx hardhat
  compile`; test with `npx hardhat test`; measure coverage with `npx hardhat coverage`; spin up a local
  chain with `npx hardhat node`; and run deployment scripts with `npx hardhat run scripts/deploy.js --network
  localhost`. Key behaviors: compile before testing, verify contract artifacts exist, and confirm the
  network flag matches the target chain. Report compile status, test results, coverage percentage, and
  deployed addresses.'
examples:
- npx hardhat test
- npx hardhat coverage
- npx hardhat compile
- npx hardhat node
- npx hardhat run scripts/deploy.js --network localhost
