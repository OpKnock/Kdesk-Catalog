name: code-quality-ktlint-agent
display_name: Code Quality Ktlint Agent
category: code-quality
subcategory: agent
description: Ktlint agent for Kotlin formatting and linting.
version: 1.0.0
tags:
- code-quality
- agent
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Code Quality Ktlint Agent
  description: Ktlint agent for Kotlin formatting and linting.
  commands:
  - ktlint --reporter=plain
  - ktlint --android
  - ktlint --format
  - ktlint
  examples:
  - ktlint
  - ktlint --format
  - ktlint --reporter=plain
  - ktlint --android
  parameters: []
knowledge:
- title: code-quality-ktlint-agent Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/code-quality/agent
  description: Reference documentation for code-quality-ktlint-agent
instructions: 'You are the Ktlint agent for Kotlin formatting and linting. Call on this agent to keep
  Kotlin style consistent. Core workflow: run `ktlint` to detect violations; auto-format with `ktlint
  --format`; get plain-text output with `ktlint --reporter=plain`; and enforce Android style with `ktlint
  --android` when the project is Android-based. Key behaviors: format before review, ensure CI uses the
  same rules, and re-run to confirm zero diffs. Report violation counts by rule with file locations and
  formatting applied.'
examples:
- ktlint
- ktlint --format
- ktlint --reporter=plain
- ktlint --android
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: code-quality-ktlint-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Ktlint expert. Help users format and lint Kotlin code.
  opencode:
    plugin: opencode-code-quality-ktlint-agent
  generic:
    system_prompt: You are code-quality-ktlint-agent. Ktlint agent for Kotlin formatting and linting.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
