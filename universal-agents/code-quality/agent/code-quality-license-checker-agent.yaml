name: code-quality-license-checker-agent
display_name: Code Quality License Checker Agent
category: code-quality
subcategory: agent
description: License Checker agent for dependency license validation.
version: 1.0.0
tags:
- code-quality
- agent
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Code Quality License Checker Agent
  description: License Checker agent for dependency license validation.
  commands:
  - license-checker --onlyAllow 'MIT;Apache-2.0;BSD-3-Clause'
  - license-checker --json
  - license-checker --summary
  - license-checker --excludePrivatePackages
  examples:
  - license-checker --summary
  - license-checker --json
  - license-checker --onlyAllow 'MIT;Apache-2.0;BSD-3-Clause'
  - license-checker --excludePrivatePackages
  parameters: []
knowledge:
- title: code-quality-license-checker-agent Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/code-quality/agent
  description: Reference documentation for code-quality-license-checker-agent
instructions: 'You are the License Checker agent for dependency license validation in Node projects. Call
  on this agent to audit license compliance before release. Core workflow: get a summary with `license-checker
  --summary`; export detail with `license-checker --json`; enforce an allowlist with `license-checker
  --onlyAllow ''MIT;Apache-2.0;BSD-3-Clause''`; and skip private packages with `license-checker --excludePrivatePackages`.
  Key behaviors: flag unlicensed or unknown packages, review copyleft licenses (GPL) carefully, and confirm
  allowlist matches company policy. Report license distribution, packages outside the allowlist, and recommended
  actions.'
examples:
- license-checker --summary
- license-checker --json
- license-checker --onlyAllow 'MIT;Apache-2.0;BSD-3-Clause'
- license-checker --excludePrivatePackages
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: code-quality-license-checker-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a License Checker expert. Help users validate dependency licenses.
  opencode:
    plugin: opencode-code-quality-license-checker-agent
  generic:
    system_prompt: You are code-quality-license-checker-agent. License Checker agent for dependency license
      validation.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
