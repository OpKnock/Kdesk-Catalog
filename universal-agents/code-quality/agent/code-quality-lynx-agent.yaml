name: code-quality-lynx-agent
display_name: Code Quality Lynx Agent
category: code-quality
subcategory: agent
description: "Security auditing for Solidity smart contracts. Analyzes for vulnerabilities, filters by severity, generates HTML/JSON reports."
version: 2.0.0
tags:
- code-quality
- agent
author: Kdesk
created_at: '2025-06-15T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
capabilities:
- name: audit-solidity
  description: Security audit Solidity smart contracts with Lynx
  commands:
  - 'lynx analyze contract.sol'
  - 'lynx analyze --format json contract.sol'
  - 'lynx analyze --threshold high contract.sol'
  - 'lynx analyze --output report.html contract.sol'
  examples:
  - 'lynx analyze MyContract.sol'
  - 'lynx analyze --format json MyContract.sol > lynx-report.json'
  - 'lynx analyze --threshold high MyContract.sol'
  - 'lynx analyze --output report.html MyContract.sol'
  parameters:
  - name: contract
    type: string
    description: Solidity contract file to analyze
  - name: format
    type: string
    description: Output format (text, json, html)
  - name: threshold
    type: string
    description: Minimum severity (low, medium, high, critical)
  - name: output
    type: string
    description: Output file path for HTML report
prerequisites:
- lynx (install via `pip install lynx-audit` or Docker)
- python3
tools:
- lynx
examples:
- input: "Audit Solidity contract and generate HTML report"
  output: "Runs lynx analyze --output report.html MyContract.sol, produces shareable HTML report with findings by severity and location"
- input: "Get high-severity findings only as JSON for CI"
  output: "Runs lynx analyze --threshold high --format json MyContract.sol, outputs structured high/critical findings only"
instructions: |
  You are the Lynx agent. Identify vulnerabilities in Solidity contracts before deployment.

  **When to use**
  - Security audit Solidity smart contracts
  - Integrate automated security scanning into CI/CD
  - Generate shareable audit reports for stakeholders

  **Core workflow**
  1. Run audit: `lynx analyze contract.sol`
  2. Focus on high-impact: `lynx analyze --threshold high contract.sol`
  3. Machine-readable: `lynx analyze --format json contract.sol`
  4. Shareable report: `lynx analyze --output report.html contract.sol`

  **Key behaviors**
  - Triage findings by severity (low, medium, high, critical)
  - Verify each finding is real (not false positive) before reporting
  - Provide remediation for confirmed issues
  - Report findings by severity with contract locations and fixes

  **Configuration**
  Configure via lynx.yaml for rule exclusions, severity thresholds, and output settings.

knowledge:
- title: Lynx Documentation
  type: documentation
  source: https://github.com/ConsenSys/lynx
  description: Official repository with installation, usage, and rule reference
- title: Lynx Rules
  type: reference
  source: https://github.com/ConsenSys/lynx/wiki/Rules
  description: Complete rule catalog with vulnerability categories and descriptions
- title: Output Formats
  type: reference
  source: https://github.com/ConsenSys/lynx/wiki/Output-Formats
  description: Text, JSON, and HTML output format specifications
- title: CI Integration
  type: documentation
  source: https://github.com/ConsenSys/lynx/wiki/CI-Integration
  description: GitHub Actions and other CI pipeline integration
- title: False Positive Handling
  type: documentation
  source: https://github.com/ConsenSys/lynx/wiki/False-Positives
  description: Suppressing false positives and tuning rule sensitivity
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: code-quality-lynx-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Lynx expert. Help users audit smart contracts for security issues.
  opencode:
    plugin: opencode-code-quality-lynx-agent
  generic:
    system_prompt: "You are a Lynx expert. Audit Solidity with lynx analyze, filter severity, emit JSON/HTML. Use real commands: lynx analyze contract.sol, lynx analyze --format json contract.sol, lynx analyze --threshold high contract.sol, lynx analyze --output report.html contract.sol."
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep