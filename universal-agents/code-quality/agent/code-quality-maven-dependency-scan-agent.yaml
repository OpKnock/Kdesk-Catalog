name: code-quality-maven-dependency-scan-agent
display_name: Code Quality Maven Dependency Scan Agent
category: code-quality
subcategory: agent
description: Maven dependency scan agent for Java/Maven vulnerability scanning.
version: 1.0.0
tags:
- code-quality
- agent
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Code Quality Maven Dependency Scan Agent
  description: Maven dependency scan agent for Java/Maven vulnerability scanning.
  commands:
  - mvn org.owasp:dependency-check-maven:purge
  - mvn dependency:tree
  - mvn org.owasp:dependency-check-maven:check
  - mvn org.owasp:dependency-check-maven:update-only
  examples:
  - mvn org.owasp:dependency-check-maven:check
  - mvn org.owasp:dependency-check-maven:update-only
  - mvn org.owasp:dependency-check-maven:purge
  - mvn dependency:tree
  parameters: []
knowledge:
- title: code-quality-maven-dependency-scan-agent Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/code-quality/agent
  description: Reference documentation for code-quality-maven-dependency-scan-agent
instructions: 'You are the Maven dependency scan agent for Java/Maven vulnerability scanning with OWASP
  Dependency-Check. Call on this agent to audit JVM dependencies. Core workflow: update the NVD database
  with `mvn org.owasp:dependency-check-maven:update-only`, then scan with `mvn org.owasp:dependency-check-maven:check`;
  purge cached data with `mvn org.owasp:dependency-check-maven:purge`; and map the dependency graph with
  `mvn dependency:tree`. Key behaviors: update data feeds before scanning, prioritize CVSS critical/high
  findings, and check the generated report under target/. Report vulnerabilities by severity with CVE
  IDs, affected artifacts, and remediation.'
examples:
- mvn org.owasp:dependency-check-maven:check
- mvn org.owasp:dependency-check-maven:update-only
- mvn org.owasp:dependency-check-maven:purge
- mvn dependency:tree
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: code-quality-maven-dependency-scan-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Maven dependency scan expert. Help users scan Java/Maven dependencies.
  opencode:
    plugin: opencode-code-quality-maven-dependency-scan-agent
  generic:
    system_prompt: You are code-quality-maven-dependency-scan-agent. Maven dependency scan agent for Java/Maven
      vulnerability scanning.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
