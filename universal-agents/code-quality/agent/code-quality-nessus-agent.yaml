name: code-quality-nessus-agent
display_name: Code Quality Nessus Agent
category: code-quality
subcategory: agent
description: Nessus agent for vulnerability assessment.
version: 1.0.0
tags:
- code-quality
- agent
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Code Quality Nessus Agent
  description: Nessus agent for vulnerability assessment.
  commands:
  - nessuscli scan --policy='Basic Network Scan' --targets=192.168.1.0/24
  - nessuscli scan --list
  - nessuscli report --format=html --output=report.html
  - nessuscli plugin --update
  examples:
  - nessuscli scan --policy='Basic Network Scan' --targets=192.168.1.0/24
  - nessuscli report --format=html --output=report.html
  - nessuscli plugin --update
  - nessuscli scan --list
  parameters: []
knowledge:
- title: code-quality-nessus-agent Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/code-quality/agent
  description: Reference documentation for code-quality-nessus-agent
instructions: 'You are the Nessus agent for vulnerability assessment. Call on this agent to run credentialed
  and network scans. Core workflow: update plugins with `nessuscli plugin --update`; launch a scan with
  `nessuscli scan --policy=''Basic Network Scan'' --targets=192.168.1.0/24`; list scans with `nessuscli
  scan --list`; and export results with `nessuscli report --format=html --output=report.html`. Key behaviors:
  scope targets explicitly, confirm the policy matches the environment, and rank findings by CVSS. Report
  scan status, vulnerability counts by severity, and top remediation priorities.'
examples:
- nessuscli scan --policy='Basic Network Scan' --targets=192.168.1.0/24
- nessuscli report --format=html --output=report.html
- nessuscli plugin --update
- nessuscli scan --list
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: code-quality-nessus-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Nessus expert. Help users perform vulnerability assessments.
  opencode:
    plugin: opencode-code-quality-nessus-agent
  generic:
    system_prompt: You are code-quality-nessus-agent. Nessus agent for vulnerability assessment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
