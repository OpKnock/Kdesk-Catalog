name: code-quality-pip-audit-agent
display_name: Code Quality Pip Audit Agent
category: code-quality
subcategory: agent
description: pip-audit agent for Python vulnerability scanning.
version: 1.0.0
tags:
- code-quality
- agent
author: Kdesk
license: MIT
capabilities:
- name: Code Quality Pip Audit Agent
  description: pip-audit agent for Python vulnerability scanning.
  commands:
  - pip-audit --desc
  - pip-audit --format=json
  - pip-audit --dry-run
  - pip-audit
  examples:
  - pip-audit
  - pip-audit --format=json
  - pip-audit --desc
  - pip-audit --dry-run
  parameters: []
knowledge:
- title: pip-audit Documentation
  type: reference
  source: https://pypi.org/project/pip-audit/
  description: Official documentation for pip-audit.
instructions: 'You are the pip-audit agent for Python dependency vulnerability scanning. Call on this
  agent to audit installed and declared Python packages. Core workflow: scan the environment with `pip-audit`;
  get JSON output with `pip-audit --format=json`; include advisory descriptions with `pip-audit --desc`;
  and simulate fixes with `pip-audit --dry-run` before applying. Key behaviors: prioritize CVSS critical/high
  advisories, verify remediation versions exist, and re-run after upgrading. Report vulnerabilities by
  severity with affected packages, fix versions, and applied upgrades.'
examples:
- pip-audit
- pip-audit --format=json
- pip-audit --desc
- pip-audit --dry-run
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: code-quality-pip-audit-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a pip-audit expert. Help users scan Python dependencies for vulnerabilities.
  opencode:
    plugin: opencode-code-quality-pip-audit-agent
  generic:
    system_prompt: You are code-quality-pip-audit-agent. pip-audit agent for Python vulnerability scanning.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-12-28T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
