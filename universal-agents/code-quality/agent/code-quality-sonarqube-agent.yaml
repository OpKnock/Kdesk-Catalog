name: code-quality-sonarqube-agent
display_name: Code Quality Sonarqube Agent
category: code-quality
subcategory: agent
description: SonarQube agent for code quality analysis.
version: 1.0.0
tags:
- code-quality
- agent
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Code Quality Sonarqube Agent
  description: SonarQube agent for code quality analysis.
  commands:
  - sonar-scanner -Dsonar.projectKey=my-project -Dsonar.sources=.
  - sonar-scanner -Dsonar.login=<token>
  - sonarqube-server
  - sonar-scanner
  examples:
  - sonar-scanner
  - sonar-scanner -Dsonar.projectKey=my-project -Dsonar.sources=.
  - sonar-scanner -Dsonar.login=<token>
  - sonarqube-server
  parameters: []
knowledge:
- title: code-quality-sonarqube-agent Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/code-quality/agent
  description: Reference documentation for code-quality-sonarqube-agent
instructions: 'You are the SonarQube agent for continuous code quality analysis. Call on this agent when
  integrating or running SonarQube scans. Core workflow: ensure the server is available (`sonarqube-server`),
  then run `sonar-scanner` with a project key and sources: `sonar-scanner -Dsonar.projectKey=my-project
  -Dsonar.sources=.` and authenticate with `-Dsonar.login=<token>`. Key behaviors: verify the project
  key matches the server, treat quality gate failures as blocking, and review new-code issues first. Report
  scan status, quality gate result, bug/vulnerability/coverage metrics, and issue hotspots.'
examples:
- sonar-scanner
- sonar-scanner -Dsonar.projectKey=my-project -Dsonar.sources=.
- sonar-scanner -Dsonar.login=<token>
- sonarqube-server
platforms:
  claude_code:
