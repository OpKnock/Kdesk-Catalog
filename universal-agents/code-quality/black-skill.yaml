name: black
display_name: black
category: code-quality
subcategory: general
description: 'Formats Python code with Black: deterministic formatting, config control, diff previews,
  and CI enforcement.'
version: 2.0.0
tags:
- code-quality
author: Mehul Wagde
license: MIT
prerequisites:
- black
capabilities:
- commands:
  - black --safe src/
  - black --check src/
  - black --diff src/
  - black file1.py file2.py
  - black --line-length 100 src/
  description: Format Python files and preview changes.
  name: black-format
  examples:
  - black --check --diff src/
  - black --line-length 88 --target-version py312 src/
  - black --fast src/
  parameters:
  - description: Files or directories
    name: paths
    type: string
  - description: Line length (default 88)
    name: line-length
    type: integer
  - description: Check without writing
    name: check
    type: boolean
- commands:
  - black --version
  - black --help | grep line-length
  - black --exclude "/(\\.venv|node_modules)/" src/
  - black --include "\\.pyi?$" src/
  description: Configure Black per project.
  name: black-config
  examples:
  - black --exclude "/migrations/" src/
  - python -m black src/
  parameters:
  - description: Regex of files to exclude
    name: exclude
    type: string
  - name: config
    type: string
    description: pyproject.toml or setup.cfg path
knowledge:
- title: Black Docs
  description: Usage, config, and code style
  source: https://black.readthedocs.io
  type: documentation
- title: Black on GitHub
  description: The uncompromising formatter
  source: https://github.com/psf/black
  type: documentation
instructions: '# Black


  The uncompromising Python formatter.


  ## When to Use


  - Enforcing one consistent style across a Python codebase

  - Ending format debates (Black has no style options)

  - Pre-commit and CI format gates

  - Pairing with isort for import ordering


  ## Commands


  ```bash

  # Format a directory

  black src/


  # Check without modifying

  black --check src/


  # Show the diff only

  black --diff src/


  # Line length control

  black --line-length 100 src/


  # Exclude paths

  black --exclude "/(\.venv|node_modules|migrations)/" src/


  # Specific files

  black file1.py file2.py

  ```


  ## Config Example


  ```toml

  # pyproject.toml

  [tool.black]

  line-length = 88

  target-version = ["py312"]

  extend-exclude = """

  /(migrations|\.venv)/

  """

  ```


  ## Best Practices


  - Use --check --diff in CI; format on pre-commit

  - Keep Black config in pyproject.toml, not CLI flags

  - Pair with isort --profile black for compatible sorting

  - Run Black on everything including tests

  - Pin the Black version to avoid churn between releases

  - Never mix hand-formatted code with Black-formatted code'
examples:
- input: Format my Python project
  output: Agent runs black src/ tests/, reviews the diff, and adds pyproject.toml config with line length.
- input: CI keeps failing on formatting
  output: Agent runs black --check --diff, shows the failing hunks, and applies black --write or fixes
    by hand.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: black.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-black
  generic:
    system_prompt: 'You own black end to end. You do it through black-format: Format Python files and
      preview changes. The commands are real, e.g. `black --safe src/`. You prefer the shortest safe path,
      and you reproduce failures before diagnosing them.'
    available_tools:
    - bash
    - read
    - write
    - edit
