name: cargo-audit
display_name: Cargo Audit
category: code-quality
subcategory: general
description: 'Audits Rust dependencies for known vulnerabilities with cargo-audit: advisories, fix suggestions,
  and CI gating.'
version: 2.0.0
tags:
- code-quality
author: Mehul Wagde
license: MIT
prerequisites:
- cargo
capabilities:
- commands:
  - cargo install cargo-audit
  - cargo audit
  - cargo audit --ignore RUSTSEC-2024-0001
  - cargo audit -n
  - cargo audit --version
  description: Scan dependency trees for vulnerabilities.
  name: cargo-audit-scan
  examples:
  - cargo audit --file Cargo.lock
  - cargo audit --ignore RUSTSEC-2023-0021,RUSTSEC-2024-0010
  - cargo audit --db ~/.cargo/advisory-db
  parameters:
  - description: Comma-separated RUSTSEC ids to ignore
    name: ignore
    type: string
  - description: Lockfile path
    name: file
    type: string
- commands:
  - cargo update -p vulnerable-crate
  - cargo update --precise 1.2.3
  - cargo tree -i vulnerable-crate
  - cargo outdated
  description: Update vulnerable dependencies.
  name: cargo-fix
  examples:
  - cargo tree -i openssl
  - cargo update -p openssl --precise 0.10.66
  - cargo audit && echo "clean"
  parameters:
  - description: Crate name
    name: crate
    type: string
  - description: Exact version
    name: precise
    type: string
knowledge:
- title: cargo-audit on GitHub
  description: CLI usage and advisory database
  source: https://github.com/rustsec/rustsec
  type: documentation
- title: RustSec Advisory DB
  description: Published vulnerability advisories
  source: https://rustsec.org/advisories/
  type: documentation
instructions: "# cargo-audit\n\nAudit Rust dependencies for vulnerabilities.\n\n## When to Use\n\n- Before\
  \ every release\n- In CI on every merge\n- When adding or upgrading dependencies\n- Investigating reported\
  \ CVEs affecting your crates\n\n## Commands\n\n```bash\n# Install\ncargo install cargo-audit\n\n# Scan\
  \ the lockfile\ncargo audit\n\n# No network (use cached advisory db)\ncargo audit -n\n\n# Ignore known\
  \ accepted advisories\ncargo audit --ignore RUSTSEC-2024-0001\n\n# Update a vulnerable crate\ncargo\
  \ update -p vulnerable-crate\n\n# Find who depends on a crate\ncargo tree -i openssl\n\n# Preview dependency\
  \ updates\ncargo outdated\n```\n\n## CI Example\n\n```yaml\n- name: Audit dependencies\n  run: cargo\
  \ audit --deny warnings\n```\n\n## Best Practices\n\n- Keep Cargo.lock committed for applications\n\
  - Run cargo audit --deny warnings in CI\n- Review ignored advisories; never ignore silently\n- Update\
  \ directly vulnerable crates first (cargo update -p)\n- Check the advisory details for patched versions\n\
  - Pin the cargo-audit version in CI for stable output"
examples:
- input: Check my Rust project for vulnerabilities
  output: Agent runs cargo audit, explains each RUSTSEC finding, and updates vulnerable crates with cargo
    update -p.
- input: A transitive dependency is flagged
  output: Agent runs cargo tree -i to find the path, updates the direct dep or patches with cargo update
    --precise.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: cargo-audit.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-cargo-audit
  generic:
    system_prompt: 'You work Cargo Audit hands-on. You do it through cargo-audit-scan: Scan dependency
      trees for vulnerabilities. The commands are real, e.g. `cargo install cargo-audit`. You answer with
      exact commands, not abstractions, and flag anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2025-11-04T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
