name: echidna
display_name: Echidna
category: code-quality
subcategory: general
description: 'Fuzzes Ethereum smart contracts with Echidna: property-based invariant testing, corpus,
  and CI integration.'
version: 2.0.0
tags:
- code-quality
author: Kdesk
license: MIT
prerequisites:
- echidna
capabilities:
- commands:
  - echidna test/Invariants.sol
  - echidna test/Invariants.sol --test-mode assertion
  - echidna test/Invariants.sol --test-limit 100000
  - echidna test/Invariants.sol --config echidna.yaml
  - echidna test/Invariants.sol --corpus-dir corpus
  description: Run property-based fuzzing campaigns.
  name: echidna-fuzz
  examples:
  - echidna test/Invariants.sol --test-mode assertion --test-limit 50000
  - echidna test/Invariants.sol --config echidna.yaml --corpus-dir corpus
  - echidna test/Invariants.sol --seq-len 100
  parameters:
  - description: Solidity file
    name: contract
    type: string
  - description: Max test calls
    name: test-limit
    type: integer
  - description: Config yaml path
    name: config
    type: string
- commands:
  - echidna test/Invariants.sol --test-mode property --test-limit 0
  - echidna test/Invariants.sol --format text
  - echidna test/Invariants.sol --list-tests
  - echidna test/Invariants.sol --deployer 0x30000
  description: Analyze and shrink failing sequences.
  name: echidna-analysis
  examples:
  - echidna test/Invariants.sol --test-limit 0 --format text
  - echidna test/Invariants.sol --seq-len 100 --test-limit 5000
  parameters:
  - description: Deployer address
    name: deployer
    type: string
  - description: text or json
    name: format
    type: string
knowledge:
- title: Echidna Docs
  description: Testing guide and config reference
  source: https://echidna.readthedocs.io
  type: documentation
- title: Echidna on GitHub
  description: Install and examples
  source: https://github.com/crytic/echidna
  type: documentation
instructions: "# Echidna\n\nFuzz EVM smart contracts with property testing.\n\n## When to Use\n\n- Verifying\
  \ invariants (balance sums, roles, limits)\n- Finding assertion failures in complex contracts\n- Testing\
  \ upgrade and reentrancy scenarios\n- Pre-audit and CI regression checks\n\n## Invariant Example\n\n\
  ```solidity\n// test/Invariants.sol\nimport \"echidna/Test.sol\";\n\ncontract Invariants is Test {\n\
  \    Vault vault;\n\n    function setUp() public {\n        vault = new Vault();\n    }\n\n    // total\
  \ supply must equal sum of balances\n    function echidna_total_never_changes() public view returns\
  \ (bool) {\n        return vault.total() == vault.balanceOf(address(this));\n    }\n}\n```\n\n## Commands\n\
  \n```bash\n# Property fuzzing\nechidna test/Invariants.sol\n\n# Assertion mode (fail on assert failures)\n\
  echidna test/Invariants.sol --test-mode assertion\n\n# Limit the campaign\nechidna test/Invariants.sol\
  \ --test-limit 100000\n\n# Config driven\nechidna test/Invariants.sol --config echidna.yaml\n\n# Corpus\
  \ for reuse\nechidna test/Invariants.sol --corpus-dir corpus\n```\n\n## Config Example\n\n```yaml\n\
  # echidna.yaml\ntestMode: assertion\ntestLimit: 50000\nseqLen: 100\ndeployer: \"0x30000\"\nsender: [\"\
  0x10000\", \"0x20000\"]\n```\n\n## Best Practices\n\n- Write invariants as named echidna_* functions\n\
  - Use --test-mode assertion for existing assert tests\n- Save corpora to accelerate future runs\n- Run\
  \ a long campaign (millions of calls) before audits\n- Shrink sequences on failure to find minimal repro\n\
  - Integrate into CI with a fixed fuzz budget"
examples:
- input: Fuzz my token contract for invariant violations
  output: Agent writes echidna_ invariants, runs echidna with a config, and analyzes any failed sequences.
- input: Echidna found a failure; what now?
  output: Agent extracts the minimized call sequence, replays it in a unit test, and fixes the underlying
    logic.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: echidna.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-echidna
  generic:
    system_prompt: 'You are the Echidna specialist. You do it through echidna-fuzz: Run property-based
      fuzzing campaigns. The commands are real, e.g. `echidna test/Invariants.sol`. You answer with exact
      commands, not abstractions, and flag anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
