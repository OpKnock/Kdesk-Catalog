name: flake8
display_name: flake8
category: code-quality
subcategory: general
description: 'Lints Python with flake8 (pyflakes + pycodestyle + mccabe): style, complexity, and bug checks
  with plugins and configs.'
version: 2.0.0
tags:
- code-quality
author: Mehul Wagde
license: MIT
prerequisites:
- flake8
- pip
capabilities:
- commands:
  - flake8 src/
  - flake8 src/main.py --max-line-length 100
  - flake8 --max-complexity 10 src/
  - flake8 --extend-ignore E203,W503 src/
  - flake8 --count src/
  description: Run flake8 checks with configuration.
  name: flake8-lint
  examples:
  - flake8 --statistics src/
  - flake8 --select E,F,W src/
  - flake8 --show-source src/
  parameters:
  - description: Files or directories
    name: paths
    type: string
  - description: Line length limit
    name: max-line-length
    type: integer
  - description: Complexity threshold
    name: max-complexity
    type: integer
- commands:
  - pip install flake8-bugbear
  - pip install flake8-docstrings
  - pip install flake8-annotations
  - flake8 --version
  description: Extend flake8 with plugins.
  name: flake8-plugins
  examples:
  - pip install flake8-print flake8-builtins
  - flake8 --select B,D,ANN src/
  parameters:
  - description: Comma-separated codes to run
    name: select
    type: string
  - name: plugin
    type: string
    description: PyPI plugin package, e.g. flake8-bugbear
knowledge:
- title: Flake8 Docs
  description: Usage, options, and configuration
  source: https://flake8.pycqa.org
  type: documentation
- title: Pycodestyle Docs
  description: Style check codes E/W
  source: https://pycodestyle.pycqa.org
  type: documentation
- title: Pyflakes Docs
  description: Logic error checks F
  source: https://github.com/PyCQA/pyflakes
  type: documentation
instructions: '# Flake8


  Python style and logic linting.


  ## When to Use


  - Enforcing PEP 8 style consistently

  - Catching unused imports, undefined names (pyflakes)

  - Complexity budgets with mccabe

  - Fast CI linting with minimal config


  ## Commands


  ```bash

  # Basic

  flake8 src/


  # Tuning

  flake8 src/ --max-line-length 100

  flake8 src/ --max-complexity 10


  # Selection and stats

  flake8 --select E,F,W src/

  flake8 --statistics src/

  flake8 --count src/


  # Ignore codes

  flake8 --extend-ignore E203,W503 src/


  # Plugins

  pip install flake8-bugbear flake8-docstrings

  flake8 --select B,D src/

  ```


  ## Config Example


  ```toml

  # setup.cfg

  [flake8]

  max-line-length = 100

  max-complexity = 12

  extend-ignore = E203,W503

  exclude = .git,__pycache__,migrations

  ```


  ## Best Practices


  - Pair with black: ignore E203/W503 which conflict with black

  - Keep the complexity threshold low (10-12)

  - Use pyflakes code F catches for real bugs

  - Add bugbear plugin for common footguns

  - Run flake8 --statistics in CI for trend tracking

  - Exclude generated and vendored directories'
examples:
- input: Lint my Python package
  output: Agent runs flake8 src/ with the repo config and fixes style and unused-import findings.
- input: flake8 conflicts with black formatting
  output: Agent adds E203,W503 to extend-ignore and aligns line-length with black settings.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: flake8.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-flake8
  generic:
    system_prompt: 'This is your domain: flake8. You do it through flake8-lint: Run flake8 checks with
      configuration. The commands are real, e.g. `flake8 src/`. You work hands-on and only report outcomes
      you have observed.'
    available_tools:
    - bash
    - read
    - write
    - edit
