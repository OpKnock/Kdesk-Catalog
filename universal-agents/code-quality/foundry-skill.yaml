name: foundry
display_name: Foundry
category: code-quality
subcategory: general
description: 'Develops Solidity with Foundry: forge build/test/fuzz, cast interactions, anvil local node,
  and deployment scripts.'
version: 2.0.0
tags:
- code-quality
author: Mehul Wagde
license: MIT
prerequisites:
- anvil
- cast
- forge
capabilities:
- commands:
  - forge init myapp
  - forge build
  - forge test
  - forge test -vvv
  - forge test --fuzz-runs 1000
  description: Build, test, and fuzz contracts.
  name: forge-build-test
  examples:
  - forge test --match-test testOnlyOwner -vvvv
  - forge test --gas-report
  - forge build --sizes
  parameters:
  - description: Test name filter
    name: match-test
    type: string
  - description: Fuzz iterations
    name: fuzz-runs
    type: integer
- commands:
  - cast call 0xToken --rpc-url $RPC_URL "symbol()(string)"
  - cast send 0xToken --private-key $PK "transfer(address,uint256)" 0xTo 1000
  - cast balance 0xAddress
  - cast block latest
  - cast code 0xContract
  description: Interact with chains and contracts.
  name: cast-ops
  examples:
  - cast call --rpc-url $RPC_URL 0xToken "balanceOf(address)(uint256)" 0xAccount
  - cast receipt 0xtxhash --rpc-url $RPC_URL
  - cast sig "transfer(address,uint256)"
  parameters:
  - description: Contract address
    name: address
    type: string
  - description: Function signature
    name: signature
    type: string
  - description: RPC endpoint
    name: rpc-url
    type: string
- commands:
  - forge create src/Token.sol:Token --rpc-url $RPC_URL --private-key $PK
  - forge script script/Deploy.s.sol:Deploy --rpc-url $RPC_URL --broadcast
  - forge script script/Deploy.s.sol --fork-url $RPC_URL --verify
  - anvil
  description: Deploy contracts and run scripts.
  name: forge-deploy
  examples:
  - forge script script/Deploy.s.sol --rpc-url $RPC_URL --broadcast --slow
  - anvil --fork-url $RPC_URL
  - forge create src/Token.sol:Token --constructor-args "MyToken" "MTK" 18
  parameters:
  - description: Contract path:Name
    name: contract
    type: string
  - description: Broadcast the transaction
    name: broadcast
    type: boolean
knowledge:
- title: Foundry Book
  description: forge, cast, and anvil reference
  source: https://book.getfoundry.sh
  type: documentation
- title: Forge Test Reference
  description: Testing patterns and cheatcodes
  source: https://book.getfoundry.sh/forge/test-examples
  type: documentation
instructions: "# Foundry\n\nRust-based Solidity development toolkit.\n\n## When to Use\n\n- Fast contract\
  \ compilation and tests\n- Fuzz and invariant testing\n- On-chain interaction without custom tooling\n\
  - Local forking with anvil\n\n## Commands\n\n```bash\n# Project\nforge init myapp\nforge build\nforge\
  \ build --sizes\n\n# Test\nforge test\nforge test -vvv\nforge test --fuzz-runs 1000\nforge test --gas-report\n\
  \n# Deploy\nforge create src/Token.sol:Token --rpc-url $RPC_URL --private-key $PK\nforge script script/Deploy.s.sol:Deploy\
  \ --rpc-url $RPC_URL --broadcast\n\n# Interact\ncast call 0xToken --rpc-url $RPC_URL \"symbol()(string)\"\
  \ncast send 0xToken --private-key $PK \"transfer(address,uint256)\" 0xTo 1000\ncast balance 0xAddress\n\
  cast block latest\ncast sig \"transfer(address,uint256)\"\n\n# Local node\nanvil\nanvil --fork-url $RPC_URL\n\
  ```\n\n## Test Example\n\n```solidity\nfunction testMintOnlyOwner() public {\n    vm.prank(owner);\n\
  \    token.mint(address(this), 100);\n    assertEq(token.balanceOf(address(this)), 100);\n}\n```\n\n\
  ## Best Practices\n\n- Never put private keys in command history; use env vars\n- Use vm.prank/vm.expectRevert\
  \ in tests\n- Run fuzz campaigns before audits\n- Test against an anvil fork of mainnet for integration\n\
  - Use cast sig to double-check selectors\n- Keep scripts idempotent; verify with --slow on mainnet"
examples:
- input: Set up Foundry and write first tests
  output: Agent runs forge init, writes a test with vm.prank, and runs forge test -vvv.
- input: Check the token balance of an address
  output: Agent runs cast call with the balanceOf signature and the RPC URL.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: foundry.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-foundry
  generic:
    system_prompt: 'You take the Foundry seat. You do it through forge-build-test: Build, test, and fuzz
      contracts. The commands are real, e.g. `forge init myapp`. You run and verify the real CLI commands
      before you claim anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2026-07-13T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
