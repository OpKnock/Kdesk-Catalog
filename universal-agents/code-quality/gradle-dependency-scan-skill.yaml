name: gradle-dependency-scan
display_name: Gradle Dependency Scan
category: code-quality
subcategory: general
description: Scans Gradle dependencies for vulnerabilities and licenses with OWASP dependency-check and
  Gradle plugins.
version: 2.0.0
tags:
- code-quality
author: Kdesk-Catalog
license: MIT
prerequisites:
- gradle
capabilities:
- commands:
  - gradle dependencyCheckAnalyze
  - gradle dependencyCheckUpdate
  - gradle dependencyCheckAggregate
  - gradle dependencies
  - gradle dependencyUpdates
  description: Run vulnerability scans on Gradle projects.
  name: gradle-scan
  examples:
  - gradle dependencyCheckAnalyze --scan
  - gradle dependencyCheckAggregate -DfailBuildOnCVSS=7
  - gradle dependencies --configuration runtimeClasspath
  parameters:
  - description: CVSS threshold to fail build
    name: failBuildOnCVSS
    type: number
  - name: format
    type: string
    description: 'Report format: html, json, sarif'
- commands:
  - gradle dependencyInsight --dependency log4j-core
  - gradle dependencies --configuration compileClasspath
  - gradle dependencyInsight --dependency jackson --configuration runtimeClasspath
  - gradle -q dependencies > deps.txt
  description: Inspect dependency trees and updates.
  name: dependency-analysis
  examples:
  - gradle dependencyInsight --dependency spring-web
  - gradle dependencies --write-verification-metadata sha256
  parameters:
  - description: Dependency coordinate to inspect
    name: dependency
    type: string
  - name: configuration
    type: string
    description: Gradle configuration to inspect
knowledge:
- title: OWASP Dependency-Check
  description: NVD-backed vulnerability scanner
  source: https://jeremylong.github.io/DependencyCheck/
  type: documentation
- title: Gradle Dependency Verification
  description: Checksum verification guide
  source: https://docs.gradle.org/current/userguide/dependency_verification.html
  type: documentation
instructions: "# Gradle Dependency Scan\n\nFind vulnerable and outdated Gradle dependencies.\n\n## When\
  \ to Use\n\n- Before releases and in CI on every change\n- Tracking CVE exposure in transitive dependencies\n\
  - License compliance checks\n- Keeping the dependency tree understandable\n\n## Setup\n\n```groovy\n\
  // build.gradle\nplugins {\n  id \"org.owasp.dependencycheck\" version \"10.0.0\"\n}\ndependencyCheck\
  \ {\n  failBuildOnCVSS = 7\n  suppressionFiles = [\"dependency-check-suppressions.xml\"]\n}\n```\n\n\
  ## Commands\n\n```bash\n# Analyze the project\ngradle dependencyCheckAnalyze\n\n# Update the NVD database\n\
  gradle dependencyCheckUpdate\n\n# Aggregate across subprojects\ngradle dependencyCheckAggregate\n\n\
  # Inspect the tree\ngradle dependencies\ngradle dependencies --configuration runtimeClasspath\n\n# Find\
  \ a specific dependency path\ngradle dependencyInsight --dependency log4j-core\n\n# Preview updates\n\
  gradle dependencyUpdates\n```\n\n## Best Practices\n\n- Fail the build on CVSS >= 7 in CI\n- Run scans\
  \ on every commit, not just releases\n- Review suppression files; never blanket-suppress\n- Pin plugin\
  \ versions and update the NVD feed regularly\n- Use dependencyInsight to trace transitive paths\n- Enable\
  \ dependency verification metadata in security-sensitive repos"
examples:
- input: Scan my Gradle project for CVEs
  output: Agent runs gradle dependencyCheckAnalyze, reviews the HTML report, and upgrades or suppresses
    findings.
- input: Which dependency brings in log4j?
  output: Agent runs gradle dependencyInsight --dependency log4j-core to trace the path and update the
    top-level dep.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: gradle-dependency-scan.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-gradle-dependency-scan
  generic:
    system_prompt: 'This is your domain: Gradle Dependency Scan. You do it through gradle-scan: Run vulnerability
      scans on Gradle projects. The commands are real, e.g. `gradle dependencyCheckAnalyze`. You prefer
      the shortest safe path, and you reproduce failures before diagnosing them.'
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2024-01-01T00:00:00Z'
updated_at: '2024-01-01T00:00:00Z'
