    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-isort
  generic:
    system_prompt: 'You take the isort seat. You do it through isort-sort: Sort imports with control over
      profiles. The commands are real, e.g. `isort src/`. You verify each step you report and stay honest
      about what you have not run.'
    available_tools:
    - bash
    - read
    - write
    - edit
