name: linting
display_name: linting
category: code-quality
subcategory: general
description: Generic linting skill that sets up and runs ESLint across JS/TS projects, fixing problems
  and wiring checks into CI.
version: 2.0.0
tags:
- code-quality
author: Kdesk
license: MIT
prerequisites:
- npx
capabilities:
- name: eslint-linting
  description: Configure ESLint, run checks, auto-fix, and integrate with CI for JavaScript and TypeScript
  commands:
  - npx eslint src/
  - npx eslint --fix .
  - npx eslint --ext .js,.jsx,.ts,.tsx --max-warnings 0
  - npx eslint --cache --report-unused-disable-directives
  - npx eslint --format json --output-file eslint-report.json src/
  examples:
  - 'npx eslint src/ --rule ''no-console: error'''
  - npx eslint . --fix --ext .ts --quiet
  - npx eslint --print-config src/index.ts | jq '.rules["no-console"]'
  parameters:
  - name: ext
    type: string
    description: File extensions to lint, e.g. .js,.jsx,.ts,.tsx
  - name: max-warnings
    type: integer
    description: Exit non-zero when warnings exceed this count; 0 means no warnings allowed
  - name: quiet
    type: boolean
    description: Report only errors, hiding warnings
knowledge:
- title: ESLint user guide
  type: documentation
  source: https://eslint.org/docs/latest/user-guide/
  description: CLI options, config files, and rules documentation
- title: typescript-eslint docs
  type: documentation
  source: https://typescript-eslint.io/
  description: Parser and recommended rulesets for TypeScript codebases
instructions: "# Linting\n\nGeneral-purpose linting skill centered on ESLint for JavaScript/TypeScript\
  \ projects,\ncovering setup, auto-fix, rulesets, and CI wiring.\n\n## When to Use\n\n- Setting up linting\
  \ from scratch in a JS/TS project\n- Applying auto-fixes to a codebase with thousands of violations\n\
  - Adding TypeScript-aware lint rules\n- Making linting a blocking gate in CI\n\n## Real Commands\n\n\
  ```bash\n# Initialize ESLint interactively\nnpm init @eslint/config\n\n# Lint a directory\nnpx eslint\
  \ src/\n\n# Auto-fix everything possible\nnpx eslint --fix .\n\n# Strict gate: no warnings allowed\n\
  npx eslint --ext .js,.ts --max-warnings 0\n\n# Cache results for speed on big repos\nnpx eslint --cache\
  \ --cache-location node_modules/.cache/eslint\n\n# Machine-readable output\nnpx eslint --format json\
  \ --output-file eslint-report.json .\n```\n\n## Example Config (eslint.config.js)\n\n```js\nexport default\
  \ [\n  { ignores: [\"dist/\", \"coverage/\"] },\n  ...js.configs.recommended,\n  ...tseslint.configs.recommended,\n\
  \  {\n    rules: {\n      \"no-unused-vars\": \"error\",\n      \"@typescript-eslint/no-explicit-any\"\
  : \"warn\"\n    }\n  }\n];\n```\n\n## CI Gate\n\n```yaml\n- name: Lint\n  run: npx eslint . --max-warnings\
  \ 0\n```\n\n## Best Practices\n\n- Use `--max-warnings 0` in CI so warnings can't accumulate\n- Turn\
  \ on `--cache` locally for speed, but allow cache to be written in CI\n- Prefer flat config (`eslint.config.js`)\
  \ over deprecated `.eslintrc`\n- Run `--fix` first, then review the remaining errors manually"
examples:
- input: This repo has no linting setup
  output: Runs npm init @eslint/config, generates eslint.config.js with typescript-eslint recommended,
    runs npx eslint . --fix to baseline, and reports the remaining error count
- input: CI keeps passing with warnings
  output: Updates the CI step to npx eslint . --max-warnings 0 and fixes the current warning backlog
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: linting.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-linting
  generic:
    system_prompt: 'Your lane is linting. You do it through eslint-linting: Configure ESLint, run checks,
      auto-fix, and integrate with CI for JavaScript and TypeScript. The commands are real, e.g. `npx
      eslint src/`. You run and verify the real CLI commands before you claim anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2025-07-07T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
