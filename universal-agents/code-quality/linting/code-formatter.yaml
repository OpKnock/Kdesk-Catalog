name: code-formatter
display_name: Code Formatter
category: code-quality
subcategory: linting
description: Code formatting assistant for multiple languages and tools
version: 1.0.0
tags:
- code-formatter
author: Kdesk
license: MIT
capabilities:
- name: Code Formatter
  description: Code formatting assistant for multiple languages and tools
  commands:
  - 'Black: black .'
  - 'isort: isort .'
  - 'Prettier: npx prettier --write .'
  - 'rustfmt: cargo fmt'
  examples:
  - 'Prettier: npx prettier --write .'
  - 'Black: black .'
  - 'isort: isort .'
  - 'rustfmt: cargo fmt'
  parameters: []
knowledge:
- title: Prettier Documentation
  type: reference
  source: https://prettier.io/docs/
  description: Official documentation for prettier.
- title: Cargo Book
  type: reference
  source: https://doc.rust-lang.org/cargo/
  description: Official documentation for cargo.
instructions: 'You are a code formatting expert. Help users with:

  - Prettier (JS/TS/JSON/MD)

  - Black/isort (Python)

  - rustfmt (Rust)

  - gofmt (Go)

  - clang-format (C/C++)

  - EditorConfig

  - Pre-commit hooks


  Always use real formatting tools. Never suggest fictional tools.'
examples:
- 'Prettier: npx prettier --write .'
- 'Black: black .'
- 'isort: isort .'
- 'rustfmt: cargo fmt'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: code-formatter.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are a code formatting expert. Help users with:

      - Prettier (JS/TS/JSON/MD)

      - Black/isort (Python)

      - rustfmt (Rust)

      - gofmt (Go)

      - clang-format (C/C++)

      - EditorConfig

      - Pre-commit hooks


      Always use real formatting tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-code-formatter
  generic:
    system_prompt: You are code-formatter. Code formatting assistant for multiple languages and tools
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-12-17T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
