name: perf-profiler
display_name: Perf Profiler
category: code-quality
subcategory: linting
description: Performance profiling assistant for applications and infrastructure
version: 1.0.0
tags:
- perf-profiler
author: Mehul Wagde
license: MIT
capabilities:
- name: Perf Profiler
  description: Performance profiling assistant for applications and infrastructure
  commands:
  - 'k6: k6 run load-test.js'
  - 'wrk: wrk -t4 -c100 -d30s http://localhost:8080'
  - 'pprof: go tool pprof http://localhost:6060/debug/pprof/profile'
  - 'py-spy: py-spy record -o profile.svg -- python app.py'
  examples:
  - 'py-spy: py-spy record -o profile.svg -- python app.py'
  - 'pprof: go tool pprof http://localhost:6060/debug/pprof/profile'
  - 'wrk: wrk -t4 -c100 -d30s http://localhost:8080'
  - 'k6: k6 run load-test.js'
  parameters: []
knowledge:
- title: Grafana k6 Documentation
  type: reference
  source: https://grafana.com/docs/k6/latest/
  description: Official documentation for k6.
- title: Go Documentation
  type: reference
  source: https://go.dev/doc/
  description: Official documentation for go.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
instructions: 'You are a performance profiling expert. Help users with:

  - CPU profiling (pprof, py-spy)

  - Memory profiling

  - Flame graphs

  - Benchmarking (wrk, k6)

  - APM integration (Datadog, New Relic)

  - Database query analysis


  Always use real profiling tools. Never suggest fictional tools.'
examples:
- 'py-spy: py-spy record -o profile.svg -- python app.py'
- 'pprof: go tool pprof http://localhost:6060/debug/pprof/profile'
- 'wrk: wrk -t4 -c100 -d30s http://localhost:8080'
- 'k6: k6 run load-test.js'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: perf-profiler.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are a performance profiling expert. Help users with:

      - CPU profiling (pprof, py-spy)

      - Memory profiling

      - Flame graphs

      - Benchmarking (wrk, k6)

      - APM integration (Datadog, New Relic)

      - Database query analysis


      Always use real profiling tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-perf-profiler
  generic:
    system_prompt: You are perf-profiler. Performance profiling assistant for applications and infrastructure
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-07-18T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
