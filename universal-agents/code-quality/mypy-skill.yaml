name: mypy
display_name: mypy
category: code-quality
subcategory: general
description: Static type checking of Python code with mypy, including strict mode, incremental builds,
  and CI integration.
version: 2.0.0
tags:
- code-quality
author: Kdesk
license: MIT
prerequisites:
- mypy
capabilities:
- name: type-check-python
  description: Run mypy with configurable strictness, scopes, and output formats
  commands:
  - mypy src/
  - mypy --strict src/
  - mypy --ignore-missing-imports --no-incremental src/
  - mypy --python-version 3.11 --config-file mypy.ini app/
  - mypy --warn-unused-configs --check-untyped-defs src/
  examples:
  - mypy src tests
  - mypy --strict --show-error-codes src/
  - mypy --cache-dir=.mypy_cache --pretty src/
  parameters:
  - name: strict
    type: boolean
    description: Enable all strict mode flags (no untyped defs, disallow Any, etc.)
  - name: python-version
    type: string
    description: Python version to type check against, e.g. 3.11
  - name: ignore-missing-imports
    type: boolean
    description: Silence errors for packages without type stubs
knowledge:
- title: mypy documentation
  type: documentation
  source: https://mypy.readthedocs.io/
  description: CLI options, config file reference, and error code catalog
- title: mypy strict mode
  type: documentation
  source: https://mypy.readthedocs.io/en/stable/command_line.html
  description: Explanation of --strict and all flags it enables
instructions: "# MyPy\n\nStatic type checker for Python. Finds type errors before runtime, on both typed\
  \ and\nuntyped codebases.\n\n## When to Use\n\n- Verifying type safety of a Python application or library\n\
  - Enforcing strict typing on core modules while onboarding old code\n- Checking that refactors did not\
  \ break type contracts\n\n## Real Commands\n\n```bash\n# Install\npip install mypy\n\n# Basic check\n\
  mypy src/\n\n# Strict mode (all checks on)\nmypy --strict src/\n\n# Check specific packages, ignore\
  \ missing stubs\nmypy --ignore-missing-imports app tests\n\n# Target a specific Python version\nmypy\
  \ --python-version 3.11 --config-file mypy.ini .\n\n# No caching for CI runs\nmypy --no-incremental\
  \ --cache-dir=/dev/null src/\n\n# Show error codes to suppress selectively\nmypy --show-error-codes\
  \ src/\n```\n\n## Config (mypy.ini)\n\n```ini\n[mypy]\npython_version = 3.11\nstrict = true\nignore_missing_imports\
  \ = true\nexclude = (venv|build)/\n\n[mypy.plugins]\nplugins = pydantic.mypy\n```\n\n## CI\n\n```yaml\n\
  - name: Type check\n  run: mypy src/ --no-incremental\n```\n\n## Best Practices\n\n- Adopt `--strict`\
  \ per-module via `# mypy: disable-error-code` only when needed\n- Use `--show-error-codes` to address\
  \ each code class once\n- Disable incremental cache in CI for determinism\n- Use `--exclude` for generated\
  \ code instead of `--ignore-missing-imports` everywhere"
examples:
- input: Add type checking to this Python project
  output: Creates mypy.ini with strict = true and excludes, runs mypy src/ to get a baseline error count,
    then fixes or annotates incrementally
- input: CI is too slow for mypy
  output: Changes the CI command to mypy --no-incremental src/ and adds --cache-dir to a persisted location
    for local speed
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: mypy.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-mypy
  generic:
    system_prompt: 'You take the mypy seat. You do it through type-check-python: Run mypy with configurable
      strictness, scopes, and output formats. The commands are real, e.g. `mypy src/`. You answer with
      exact commands, not abstractions, and flag anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
