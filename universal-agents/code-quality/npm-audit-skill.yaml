name: npm-audit
display_name: Npm Audit
category: code-quality
subcategory: general
description: Audits npm dependency trees for known vulnerabilities and fixes them with npm audit fix.
version: 2.0.0
tags:
- code-quality
author: Kdesk-Catalog
license: MIT
prerequisites:
- npm
capabilities:
- name: npm-audit
  description: Run npm audits, fix vulnerable packages, and enforce severity thresholds
  commands:
  - npm audit
  - npm audit --production
  - npm audit fix
  - npm audit fix --force
  - npm audit --json > audit-report.json
  examples:
  - npm audit --audit-level=high
  - npm audit fix --dry-run
  - npm audit --omit=dev --json | jq '.metadata.vulnerabilities'
  parameters:
  - name: audit-level
    type: string
    description: 'Minimum severity to fail: info, low, moderate, high, critical'
  - name: omit
    type: string
    description: Exclude dependency types, e.g. dev
  - name: force
    type: boolean
    description: Apply breaking semver-major fixes
knowledge:
- title: npm audit docs
  type: documentation
  source: https://docs.npmjs.com/cli/v10/commands/npm-audit
  description: CLI reference, flags, and exit codes
- title: npm audit fix docs
  type: documentation
  source: https://docs.npmjs.com/cli/v10/commands/npm-audit-fix
  description: How --force, --dry-run, and --package-lock-only behave
instructions: "# npm Audit\n\nChecks your installed dependency tree against the npm advisory database\
  \ and reports\nknown vulnerabilities with severities and fix versions.\n\n## When to Use\n\n- Before\
  \ release to catch critical advisories\n- After adding new dependencies\n- In CI as a security gate\n\
  \n## Real Commands\n\n```bash\n# Full audit\nnpm audit\n\n# Audit production dependencies only\nnpm\
  \ audit --production\n\n# Automatically fix non-breaking upgrades\nnpm audit fix\n\n# Preview the changes\
  \ without applying\nnpm audit fix --dry-run\n\n# Force semver-major (breaking) fixes\nnpm audit fix\
  \ --force\n\n# Machine-readable report\nnpm audit --json > audit-report.json\n\n# Fail on moderate+\
  \ only in CI\nnpm audit --audit-level=moderate\n```\n\n## Fix Strategy\n\n1. Run `npm audit fix --dry-run`\
  \ and review what would change\n2. Apply `npm audit fix` for safe patches\n3. For remaining items, upgrade\
  \ the direct dependency manually and re-audit\n4. Use `--force` only when you accept breaking changes;\
  \ verify with the test suite\n\n## CI\n\n```yaml\n- name: Audit deps\n  run: npm audit --audit-level=high\
  \ --omit=dev\n```\n\n## Best Practices\n\n- Run `npm audit --omit=dev` for production builds\n- Never\
  \ blanket-apply `--force`; review the diff first\n- If no fix exists, the advisory page shows mitigations\
  \ - document the decision\n\n## Example Response\n\nLists each vulnerable package as name@version ->\
  \ Patched in X, with severity and\nadvisory URL; then proposes the fix command."
examples:
- input: Check our dependencies for vulnerabilities
  output: Runs npm audit --omit=dev and reports the count per severity plus recommended npm audit fix
- input: CI must block critical vulnerabilities
  output: Adds npm audit --audit-level=critical --omit=dev to CI and fixes existing critical findings
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: npm-audit.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-npm-audit
  generic:
    system_prompt: 'You take the Npm Audit seat. You do it through npm-audit: Run npm audits, fix vulnerable
      packages, and enforce severity thresholds. The commands are real, e.g. `npm audit`. You verify each
      step you report and stay honest about what you have not run.'
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2024-01-01T00:00:00Z'
updated_at: '2024-01-01T00:00:00Z'
