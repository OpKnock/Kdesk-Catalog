name: performance
display_name: performance
category: code-quality
subcategory: general
description: 'Web performance analysis: Lighthouse audits, load testing, and request timing measurements.'
version: 2.0.0
tags:
- code-quality
author: Mehul Wagde
license: MIT
prerequisites:
- npx
- wrk
capabilities:
- name: web-performance
  description: Measure page performance with Lighthouse, curl timing, and load tests
  commands:
  - npx lighthouse http://localhost:8080 --output=json --output-path=./lh-report.json
  - 'curl -o /dev/null -s -w ''total: %{time_total}s ttfb: %{time_starttransfer}s

    '' https://example.com'
  - npx lighthouse http://localhost:8080 --only-categories=performance --budget-path=budget.json
  - wrk -t4 -c100 -d30s http://localhost:3000/
  - k6 run load-test.js
  examples:
  - npx lighthouse http://localhost:8080 --chrome-flags='--headless' --output=html
  - curl -w '%{http_code} %{time_total}' -o /dev/null http://localhost:8080/api/health
  - wrk -t8 -c200 -d60s http://localhost:8080/api --latency
  parameters:
  - name: only-categories
    type: string
    description: 'Lighthouse categories to audit: performance, accessibility, seo, best-practices'
  - name: budget-path
    type: string
    description: JSON file with performance budgets (timings, sizes)
  - name: output-path
    type: string
    description: Where to write the report (html/json)
knowledge:
- title: Lighthouse docs
  type: documentation
  source: https://developer.chrome.com/docs/lighthouse/
  description: Audit categories, scoring, and CLI usage
- title: Web.dev measure
  type: documentation
  source: https://web.dev/measure/
  description: Guides for Core Web Vitals and performance budgets
instructions: "# Performance\n\nMeasures and diagnoses web performance: lab audits (Lighthouse), load\
  \ tests, and\nraw request timing.\n\n## When to Use\n\n- Auditing Core Web Vitals (LCP, INP, CLS)\n\
  - Comparing page speed before/after a change\n- Capacity testing an API or web server\n\n## Real Commands\n\
  \n```bash\n# Lighthouse JSON audit\nnpx lighthouse https://example.com --output=json --output-path=./lh.json\n\
  \n# HTML report for sharing\nnpx lighthouse https://example.com --output=html --output-path=./lh.html\n\
  \n# Performance-only with a budget\nnpx lighthouse https://example.com --only-categories=performance\
  \ --budget-path=budget.json\n\n# Quick TTFB measurement\ncurl -o /dev/null -s -w '%{time_total}s ttfb=%{time_starttransfer}s\n\
  ' https://example.com\n\n# Load test with wrk\nwrk -t4 -c100 -d30s http://localhost:3000/ --latency\n\
  \n# Scripted load test with k6\nk6 run load-test.js\n```\n\n## Budget Example (budget.json)\n\n```json\n\
  {\n  \"timings\": [{\"metric\": \"lcp\", \"budget\": 2500}],\n  \"resourceSizes\": [{\"resourceType\"\
  : \"script\", \"budget\": 200}]\n}\n```\n\n## k6 Script Example\n\n```js\nimport http from 'k6/http';\n\
  import { check } from 'k6';\n\nexport const options = { vus: 50, duration: '60s' };\n\nexport default\
  \ function () {\n  const res = http.get('https://example.com/');\n  check(res, { 'status 200': (r) =>\
  \ r.status === 200 });\n}\n```\n\n## Best Practices\n\n- Run Lighthouse on a fixed device profile (Moto\
  \ G Power / slow 4G) for comparability\n- Measure before and after; one-off numbers are noisy\n- Use\
  \ `wrk --latency` to see percentile tails, not just averages\n- Combine lab (Lighthouse) and field (RUM)\
  \ data for the full picture\n\n## Example Response\n\nReturns Lighthouse scores per category with the\
  \ top 5 performance opportunities\n(LCP, TBT, CLS), plus curl timing breakdown and load-test percentile\
  \ latencies."
examples:
- input: Why is our homepage slow?
  output: Runs npx lighthouse https://example.com --output=json, then reports scores, LCP/TBT/CLS values,
    and the top performance opportunities
- input: Can the API handle 500 concurrent users?
  output: Runs wrk -t8 -c500 -d60s http://localhost:8080 --latency and reports RPS, p50/p99 latencies,
    and error count
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: performance.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-performance
  generic:
    system_prompt: 'You own performance end to end. You do it through web-performance: Measure page performance
      with Lighthouse, curl timing, and load tests. The commands are real, e.g. `npx lighthouse https://example.com
      --output=json --output-path=./lh-report.json`. You prefer the shortest safe path, and you reproduce
      failures before diagnosing them.'
    available_tools:
    - bash
    - read
    - write
    - edit
