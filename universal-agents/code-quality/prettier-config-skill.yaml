name: prettier-config
display_name: prettier-config
category: code-quality
subcategory: general
description: Creates and validates Prettier configuration files (.prettierrc) shared across projects.
version: 2.0.0
tags:
- code-quality
author: Kdesk-Catalog
license: MIT
prerequisites:
- npx
capabilities:
- name: prettier-config
  description: Generate, validate, and extend Prettier configs
  commands:
  - npx prettier --config .prettierrc.json --check src/
  - npx prettier --config-precedence cli-override --single-quote --print-width 100 --write .
  - npx prettier --debug-check src/app.js
  - npx prettier --find-config-path src/app.js
  - npx prettier --ignore-path .gitignore --list-different .
  examples:
  - npx prettier --config .prettierrc.yml --check 'src/**/*.js'
  - npx prettier --print-config .prettierrc.json
  - 'echo ''{"semi": false}'' | npx prettier --config - --check /dev/stdin'
  parameters:
  - name: config
    type: string
    description: Path to the config file to use
  - name: config-precedence
    type: string
    description: 'Priority: cli-override or file-override'
  - name: find-config-path
    type: string
    description: Print the resolved config path for a file
knowledge:
- title: Prettier configuration docs
  type: documentation
  source: https://prettier.io/docs/en/configuration.html
  description: Supported file types, resolution order, and options
- title: Prettier options reference
  type: documentation
  source: https://prettier.io/docs/en/options.html
  description: 'Every option: semi, singleQuote, printWidth, trailingComma, and more'
instructions: "# Prettier Config\n\nSpecializes in authoring and validating Prettier configuration files\
  \ so formatting\nis deterministic across developers and CI.\n\n## When to Use\n\n- Creating a project's\
  \ first .prettierrc\n- Extending a shared config package across a monorepo\n- Verifying the config resolves\
  \ the same way in CI as locally\n\n## Real Commands\n\n```bash\n# Create a JSON config\nnpx prettier\
  \ --single-quote --semi false --write . && cat .prettierrc.json\n\n# Verify which config a file resolves\
  \ to\nnpx prettier --find-config-path src/app.js\n\n# Print the fully resolved config\nnpx prettier\
  \ --print-config .prettierrc.json\n\n# Validate formatting against the config\nnpx prettier --config\
  \ .prettierrc.json --check src/\n\n# Debug-check a single file (no writes, no output on success)\nnpx\
  \ prettier --debug-check src/app.js\n```\n\n## Config Example (.prettierrc.json)\n\n```json\n{\n  \"\
  semi\": false,\n  \"singleQuote\": true,\n  \"printWidth\": 100,\n  \"trailingComma\": \"all\",\n  \"\
  plugins\": [\"prettier-plugin-tailwindcss\"]\n}\n```\n\n## Shared Config Package\n\n```json\n{\n  \"\
  prettier\": \"@acme/prettier-config\"\n}\n```\n\n```js\n// @acme/prettier-config/index.js\nmodule.exports\
  \ = { semi: false, singleQuote: true, printWidth: 100 };\n```\n\n## Best Practices\n\n- Commit the config\
  \ and never mix configs across environments\n- Use `--config-precedence cli-override` for one-off experiments\
  \ only\n- Test config changes with `--check` before rolling out\n- Keep editor/CI versions of Prettier\
  \ in sync; configs can break across majors\n\n## Example Response\n\nConfirms the resolved config (shows\
  \ the effective options), then reports how many\nfiles would change formatting when the config is applied."
examples:
- input: Set up Prettier for our repo
  output: Creates .prettierrc.json with team options plus .prettierignore, runs npx prettier --write .
    to format, and validates with --check
- input: Why does CI format differently than locally?
  output: Runs npx prettier --print-config and --find-config-path in both environments to diff the resolved
    options and versions
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: prettier-config.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-prettier-config
  generic:
    system_prompt: 'You work prettier-config hands-on. You do it through prettier-config: Generate, validate,
      and extend Prettier configs. The commands are real, e.g. `npx prettier --config .prettierrc.json
      --check src/`. You run and verify the real CLI commands before you claim anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
