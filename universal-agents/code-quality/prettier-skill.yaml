name: prettier
display_name: prettier
category: code-quality
subcategory: general
description: Formats JavaScript, TypeScript, CSS, JSON, and Markdown with Prettier, including check mode
  for CI.
version: 2.0.0
tags:
- code-quality
author: Kdesk-Catalog
license: MIT
prerequisites:
- npx
capabilities:
- name: prettier-formatting
  description: Format and verify files with Prettier in write or check mode
  commands:
  - npx prettier --write .
  - npx prettier --check src/
  - npx prettier "src/**/*.{ts,tsx}" --write
  - npx prettier --list-different "**/*.{js,json,md}"
  - npx prettier --debug-check src/index.ts
  examples:
  - npx prettier --check . --ignore-path .prettierignore
  - npx prettier --write package.json README.md
  - npx prettier --plugin=prettier-plugin-organize-imports --write src/
  parameters:
  - name: write
    type: boolean
    description: Rewrite files in place; without it, only print to stdout
  - name: check
    type: boolean
    description: Verify formatting, exit 1 if files need formatting
  - name: list-different
    type: boolean
    description: Print file names that differ from Prettier output
knowledge:
- title: Prettier docs
  type: documentation
  source: https://prettier.io/docs/en/
  description: CLI usage, options, and plugins
- title: Prettier CLI reference
  type: documentation
  source: https://prettier.io/docs/en/cli.html
  description: All CLI flags including --check, --write, --ignore-path
instructions: "# Prettier\n\nOpinionated code formatter for JS/TS/CSS/JSON/Markdown with a strict check\
  \ mode\nfor CI.\n\n## When to Use\n\n- Standardizing formatting across a team\n- Enforcing formatting\
  \ in CI without write access\n- One-time formatting of a legacy codebase\n\n## Real Commands\n\n```bash\n\
  # Format everything\nnpx prettier --write .\n\n# Check mode (CI): fails if anything is unformatted\n\
  npx prettier --check .\n\n# Format only TS/TSX in src\nnpx prettier \"src/**/*.{ts,tsx}\" --write\n\n\
  # List files that need formatting\nnpx prettier --list-different .\n\n# Dry-run via stdout only\nnpx\
  \ prettier src/app.ts\n\n# With custom options\nnpx prettier --write --single-quote --trailing-comma\
  \ all src/\n```\n\n## Ignore Files (.prettierignore)\n\n```\ndist/\nbuild/\npackage-lock.json\n*.min.js\n\
  ```\n\n## CI\n\n```yaml\n- name: Format check\n  run: npx prettier --check . --ignore-path .prettierignore\n\
  ```\n\n## Integration\n\n- ESLint: use `eslint-plugin-prettier` or run Prettier after ESLint\n- Pre-commit:\
  \ `npx prettier --write` on staged files via lint-staged\n- Editor: enable format-on-save with the Prettier\
  \ extension\n\n## Best Practices\n\n- Never mix Prettier with other formatters (black, gofmt) on the\
  \ same files\n- Run `--write` before `--check` in migration; then enforce check in CI\n- Keep `.prettierignore`\
  \ in sync with `.gitignore`\n- Pin the Prettier major version to avoid churn"
examples:
- input: Format the whole codebase
  output: Runs npx prettier --write . and reports the number of files formatted
- input: Make CI fail on unformatted code
  output: Adds npx prettier --check . --ignore-path .prettierignore to CI and fixes the current list-different
    files
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: prettier.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-prettier
  generic:
    system_prompt: 'You work prettier hands-on. You do it through prettier-formatting: Format and verify
      files with Prettier in write or check mode. The commands are real, e.g. `npx prettier --write .`.
      You work hands-on and only report outcomes you have observed.'
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2024-01-01T00:00:00Z'
updated_at: '2024-01-01T00:00:00Z'
