name: refactoring
display_name: refactoring
category: code-quality
subcategory: general
description: 'Guides safe refactoring: detecting duplication, measuring complexity, and validating with
  tests after each change.'
version: 2.0.0
tags:
- code-quality
author: Kdesk-Catalog
license: MIT
prerequisites:
- git
- npx
- pytest
- python
capabilities:
- name: refactoring-workflow
  description: Analyze, refactor, and verify code changes using duplication and dependency tools
  commands:
  - npx jscpd src/
  - npx madge --circular src/
  - git diff -M --stat
  - python -m compileall src/
  - pytest -q --cov=src
  examples:
  - npx jscpd --min-lines 10 --min-tokens 50 src/
  - npx madge --circular --extensions ts src/
  - git diff --word-diff main...HEAD
  parameters:
  - name: min-lines
    type: integer
    description: Minimum duplicate block length in lines for jscpd
  - name: circular
    type: boolean
    description: Report circular dependencies with madge
  - name: extensions
    type: string
    description: File extensions madge should analyze, e.g. ts,tsx,js
knowledge:
- title: Martin Fowler Refactoring
  type: documentation
  source: https://martinfowler.com/refactoring/
  description: Catalog of refactorings and when to apply them
- title: Working Effectively with Legacy Code summary
  type: documentation
  source: https://www.oreilly.com/library/view/working-effectively-with/0131177052/
  description: Characterization tests and seam-based refactoring strategies
instructions: '# Refactoring


  Improves code structure without changing behavior, using tests as a safety net

  and tooling to find hot spots.


  ## When to Use


  - Removing duplicated code before adding a feature

  - Breaking apart god classes and long functions

  - Reducing circular dependencies


  ## Real Commands


  ```bash

  # Find duplicated blocks

  npx jscpd --min-lines 8 --min-tokens 40 src/


  # Find circular imports

  npx madge --circular --extensions ts src/


  # List modules with too many dependencies

  npx madge --json src/ | jq ''to_entries | map(select(.value|length>10))''


  # Verify the tree still compiles

  python -m compileall -q src/


  # Confirm tests still pass

  pytest -q


  # Review rename scope with move detection

  git diff -M --stat

  ```


  ## Safe Refactoring Workflow


  1. **Baseline**: run the full test suite and note failures (must be green)

  2. **Characterize**: if no tests exist, write characterization tests first

  3. **Small steps**: extract a function, run tests, commit - repeat

  4. **Verify**: compare behavior before/after with tests and a quick smoke run

  5. **Cleanup**: remove dead code detected by the compiler/type-checker


  ## Anti-Patterns


  - Refactoring and adding features in the same commit

  - Renaming public APIs without updating all call sites

  - ''Big-bang'' rewrites without characterization tests


  ## Example Response


  Maps the duplication clusters and circular dependencies found by jscpd/madge, then

  proposes an order of refactorings with the test command to run after each step.'
examples:
- input: This service class is 800 lines and duplicated
  output: Runs jscpd to locate duplicates and madge for dependencies, then proposes extracting the duplicated
    logic into a helper with a test-then-extract plan
- input: Refactor without breaking anything
  output: Runs the test suite for a baseline, then applies one extract-method change at a time, re-running
    pytest after each
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: refactoring.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-refactoring
  generic:
    system_prompt: 'This is your domain: refactoring. You do it through refactoring-workflow: Analyze,
      refactor, and verify code changes using duplication and dependency tools. The commands are real,
      e.g. `npx jscpd src/`. You work hands-on and only report outcomes you have observed.'
    available_tools:
    - bash
    - read
    - write
    - edit
