name: shellcheck
display_name: shellcheck
category: code-quality
subcategory: general
description: Finds bugs and portability issues in shell scripts with ShellCheck, including CI and JSON
  output.
version: 2.0.0
tags:
- code-quality
author: Mehul Wagde
license: MIT
prerequisites:
- shellcheck
capabilities:
- name: shellcheck
  description: Analyze shell scripts with severity levels, excludes, and CI formats
  commands:
  - shellcheck script.sh
  - shellcheck -x scripts/*.sh
  - shellcheck --severity=warning scripts/
  - shellcheck --format=json script.sh > sc.json
  - shellcheck -e SC2086,SC1091 deploy.sh
  examples:
  - find . -name '*.sh' -exec shellcheck {} +
  - shellcheck --shell=bash --external-sources setup.sh
  - shellcheck --exclude=SC2317 --format=gcc ci.sh
  parameters:
  - name: severity
    type: string
    description: 'Minimum severity: error, warning, info, style'
  - name: exclude
    type: string
    description: Comma-separated SC codes to ignore
  - name: shell
    type: string
    description: 'Shell dialect: bash, sh, dash, ksh, zsh'
knowledge:
- title: ShellCheck docs
  type: documentation
  source: https://www.shellcheck.net/
  description: Online checker, install options, and CLI usage
- title: ShellCheck wiki
  type: documentation
  source: https://github.com/koalaman/shellcheck/wiki
  description: Explanation of every SC code with examples
instructions: "# ShellCheck\n\nStatic analysis for shell scripts: quoting bugs, unportable syntax, and\
  \ undefined\nvariable misuse.\n\n## When to Use\n\n- Reviewing CI scripts, deploy scripts, and init\
  \ scripts\n- Enforcing shell hygiene across a repo\n- Catching quote bugs that fail only at runtime\n\
  \n## Real Commands\n\n```bash\n# Install (apt/brew)\nsudo apt install shellcheck\n\n# Check one script\n\
  shellcheck deploy.sh\n\n# Follow sourced files with -x\nshellcheck -x scripts/*.sh\n\n# Only warnings\
  \ and above\nshellcheck --severity=warning scripts/\n\n# Ignore specific codes (e.g. SC2086 unquoted\
  \ vars you accept)\nshellcheck -e SC2086,SC1091 scripts/start.sh\n\n# JSON output for dashboards\nshellcheck\
  \ --format=json scripts/ > shellcheck-report.json\n\n# gcc-format for editor integration\nshellcheck\
  \ --format=gcc scripts/*.sh\n```\n\n## CI\n\n```yaml\n- name: ShellCheck\n  run: shellcheck --severity=warning\
  \ --exclude=SC1091 scripts/*.sh\n```\n\n## Best Practices\n\n- Always quote variable expansions (`\"\
  $var\"`) - SC2086\n- Use `[[ ]]` instead of `[ ]` in bash scripts\n- Add `set -euo pipefail` at the\
  \ top of every script\n- Exclude codes with a comment, never silently: `# shellcheck disable=SC2154`\n\
  - Run on the CI platform shell, not just locally\n\n## Example Response\n\nLists findings as `file:line:col:\
  \ severity: message [SC-code]` with the explanation\nlink, then the agent applies the suggested fix\
  \ and re-runs until clean."
examples:
- input: Check our deploy scripts
  output: Runs shellcheck -x scripts/*.sh, reports each SC code with file:line, and fixes the quoting
    and pipefail issues
- input: Add shell linting to CI
  output: Adds shellcheck --severity=warning scripts/ step to CI and fixes the current warnings
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: shellcheck.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-shellcheck
  generic:
    system_prompt: 'You take the shellcheck seat. You do it through shellcheck: Analyze shell scripts
      with severity levels, excludes, and CI formats. The commands are real, e.g. `shellcheck script.sh`.
      You answer with exact commands, not abstractions, and flag anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2025-07-28T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
