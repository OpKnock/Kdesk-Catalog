name: simple-git-hooks
display_name: simple-git-hooks
category: code-quality
subcategory: general
description: Configures git hooks via package.json with simple-git-hooks, a zero-dependency alternative
  to husky.
version: 2.0.0
tags:
- code-quality
author: Mehul Wagde
license: MIT
prerequisites:
- npm
- npx
capabilities:
- name: simple-git-hooks
  description: Install, validate, and update git hooks declared in package.json
  commands:
  - npx simple-git-hooks
  - npx simple-git-hooks --validate
  - npx simple-git-hooks --remove
  - npm pkg set simple-git-hooks.pre-commit="npx lint-staged"
  - npx simple-git-hooks --config .simple-git-hooks.json
  examples:
  - npm pkg set simple-git-hooks.pre-push="npm test"
  - npx simple-git-hooks --validate
  - node -e "require('simple-git-hooks')()"
  parameters:
  - name: config
    type: string
    description: Path to an alternative config file
  - name: validate
    type: boolean
    description: Check that installed hooks match the config
  - name: remove
    type: boolean
    description: Remove all git hooks managed by simple-git-hooks
knowledge:
- title: simple-git-hooks GitHub
  type: documentation
  source: https://github.com/toplenboren/simple-git-hooks
  description: Setup, config format, and all options
- title: Git hooks reference
  type: documentation
  source: https://git-scm.com/docs/githooks
  description: Every git hook event and its semantics
instructions: "# Simple Git Hooks\n\nDeclares git hooks directly in package.json without husky's shell\
  \ wrapper or\nadditional dependencies.\n\n## When to Use\n\n- Lightweight pre-commit/pre-push hooks\
  \ for JS projects\n- Teams that want hook config visible in package.json\n- Replacing husky in projects\
  \ that avoid extra deps\n\n## Real Commands\n\n```bash\n# Install the tool\nnpm install --save-dev simple-git-hooks\n\
  \n# Configure hooks in package.json\nnpm pkg set simple-git-hooks.pre-commit=\"npx lint-staged\"\nnpm\
  \ pkg set simple-git-hooks.pre-push=\"npm test\"\n\n# Install the hooks into .git/hooks\nnpx simple-git-hooks\n\
  \n# Verify installed hooks match config\nnpx simple-git-hooks --validate\n\n# Remove all managed hooks\n\
  npx simple-git-hooks --remove\n```\n\n## Config in package.json\n\n```json\n{\n  \"simple-git-hooks\"\
  : {\n    \"pre-commit\": \"npx lint-staged\",\n    \"pre-push\": \"npm test\",\n    \"commit-msg\":\
  \ \"npx commitlint --edit $1\"\n  }\n}\n```\n\n## postinstall for teammates\n\n```json\n{\n  \"scripts\"\
  : {\n    \"postinstall\": \"node -e \\\"try{require('simple-git-hooks')()}catch(e){}\\\"\"\n  }\n}\n\
  ```\n\n## Best Practices\n\n- Always run `npx simple-git-hooks --validate` after changing config\n-\
  \ Add the postinstall script so `npm install` refreshes hooks\n- Keep hook commands fast; move heavy\
  \ checks to pre-push or CI\n- Note that hooks are per-clone (in .git/hooks) - reinstall after fresh\
  \ clone\n\n## Example Response\n\nConfirms which hooks were installed (pre-commit, pre-push), validates\
  \ them against\npackage.json, and shows the command each hook will run."
examples:
- input: Set up git hooks without husky
  output: Installs simple-git-hooks, sets pre-commit to lint-staged and pre-push to npm test via npm pkg
    set, then runs npx simple-git-hooks and validates
- input: Hooks stopped running on this machine
  output: Runs npx simple-git-hooks --validate; if hooks are missing, reinstalls with npx simple-git-hooks
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: simple-git-hooks.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-simple-git-hooks
  generic:
    system_prompt: 'You take the simple-git-hooks seat. You do it through simple-git-hooks: Install, validate,
      and update git hooks declared in package.json. The commands are real, e.g. `npx simple-git-hooks`.
      You work hands-on and only report outcomes you have observed.'
    available_tools:
    - bash
    - read
    - write
    - edit
