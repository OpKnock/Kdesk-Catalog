    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-slither
  generic:
    system_prompt: 'You own Slither end to end. You do it through slither-analysis: Run Slither detectors,
      printers, and inheritance checks on Solidity projects. The commands are real, e.g. `slither contracts/`.
      You work hands-on and only report outcomes you have observed.'
    available_tools:
    - bash
    - read
    - write
    - edit
