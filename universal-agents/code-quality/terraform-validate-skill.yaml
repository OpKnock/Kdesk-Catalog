name: terraform-validate
display_name: Terraform Validate
category: code-quality
subcategory: general
description: 'Validates Terraform configurations: formatting, syntax, and plan validation against real
  providers.'
version: 2.0.0
tags:
- code-quality
author: Mehul Wagde
license: MIT
prerequisites:
- terraform
capabilities:
- name: terraform-validate
  description: Init, validate, format-check, and plan Terraform configurations
  commands:
  - terraform init -backend=false
  - terraform validate
  - terraform validate -json
  - terraform fmt -check -recursive
  - terraform plan -detailed-exitcode -out=plan.tfplan
  examples:
  - terraform init -backend=false -upgrade
  - terraform fmt -recursive
  - terraform plan -var-file=environments/dev.tfvars -input=false
  parameters:
  - name: backend
    type: boolean
    description: Whether to initialize the backend (false = local only, no state access)
  - name: detailed-exitcode
    type: boolean
    description: Exit 2 if the plan contains changes
  - name: var-file
    type: string
    description: Variable definitions file, e.g. dev.tfvars
knowledge:
- title: terraform validate command
  type: documentation
  source: https://developer.hashicorp.com/terraform/cli/commands/validate
  description: CLI reference for validate and its -json flag
- title: Terraform CLI docs
  type: documentation
  source: https://developer.hashicorp.com/terraform/cli/commands
  description: 'All commands: init, plan, apply, fmt'
instructions: "# Terraform Validate\n\nStatic validation of Terraform configurations: syntax, internal\
  \ consistency, and\nprovider schema correctness.\n\n## When to Use\n\n- CI checks before terraform plan\n\
  - Catching invalid resource references early\n- Verifying fmt compliance without modifying files\n\n\
  ## Real Commands\n\n```bash\n# Init without remote backend access (safe in CI)\nterraform init -backend=false\n\
  \n# Core validation\nterraform validate\n\n# JSON output for CI parsing\nterraform validate -json |\
  \ jq .valid\n\n# Format check\nterraform fmt -check -recursive\n\n# Apply formatting\nterraform fmt\
  \ -recursive\n\n# Full plan (requires providers to be initialized)\nterraform plan -detailed-exitcode\
  \ -out=plan.tfplan\n\n# With environment-specific variables\nterraform plan -var-file=environments/dev.tfvars\
  \ -input=false\n```\n\n## CI Workflow\n\n```yaml\n- name: Validate\n  run: |\n    terraform fmt -check\
  \ -recursive\n    terraform init -backend=false\n    terraform validate\n```\n\n## Notes\n\n- `terraform\
  \ validate` needs initialized providers unless `-backend=false` is used\n- `-json` output has `valid`\
  \ and `diagnostics` fields\n- Exit code 2 from `plan -detailed-exitcode` means changes are pending\n\
  \n## Best Practices\n\n- Run `fmt -check` before `validate` so diffs are readable\n- Never run `terraform\
  \ apply` from CI without a human-approved plan\n- Use `-input=false` everywhere in automation\n- Validate\
  \ on the CI agent with the same Terraform version as prod\n\n## Example Response\n\nReturns the validation\
  \ verdict, any diagnostics with `path:line` (error/warning),\nand the fmt compliance status."
examples:
- input: Validate our infra config in CI
  output: Runs terraform fmt -check -recursive, terraform init -backend=false, terraform validate and
    reports diagnostics
- input: Will this config change anything?
  output: Runs terraform plan -detailed-exitcode -var-file=environments/dev.tfvars -input=false and summarizes
    resources to add/change/destroy
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: terraform-validate.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-terraform-validate
  generic:
    system_prompt: 'You work Terraform Validate hands-on. You do it through terraform-validate: Init,
      validate, format-check, and plan Terraform configurations. The commands are real, e.g. `terraform
      init -backend=false`. You run and verify the real CLI commands before you claim anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
