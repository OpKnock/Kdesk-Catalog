name: type-checking
display_name: type-checking
category: code-quality
subcategory: general
description: 'Static type checking with TypeScript: strictness, incremental builds, and monorepo project
  references.'
version: 2.0.0
tags:
- code-quality
author: Kdesk
license: MIT
prerequisites:
- tsc
capabilities:
- name: tsc-checking
  description: Type-check TypeScript projects with configurable strictness and outputs
  commands:
  - tsc --noEmit
  - tsc -p tsconfig.json --pretty false
  - tsc --noEmit --strict --noUnusedLocals
  - tsc --noEmit --incremental --tsBuildInfoFile .cache/tsconfig.tsbuildinfo
  - tsc --noEmit --project tsconfig.build.json
  examples:
  - npx vue-tsc --noEmit
  - tsc --noEmit --composite false
  - tsc --build --force
  parameters:
  - name: noEmit
    type: boolean
    description: Type-check without emitting files
  - name: project
    type: string
    description: Path to tsconfig.json to use
  - name: strict
    type: boolean
    description: Enable all strict type-checking options
knowledge:
- title: TypeScript compiler options
  type: documentation
  source: https://www.typescriptlang.org/tsconfig
  description: Every tsconfig option with defaults
- title: TypeScript handbook
  type: documentation
  source: https://www.typescriptlang.org/docs/handbook/
  description: Type checking guide and strict mode explanation
instructions: "# Type Checking\n\nRuns the TypeScript compiler in no-emit mode to validate types across\
  \ the project,\nwith strictness tuned per codebase.\n\n## When to Use\n\n- Pre-merge type gate in CI\n\
  - Verifying a refactor didn't break type contracts\n- Onboarding strict mode incrementally\n\n## Real\
  \ Commands\n\n```bash\n# Basic check\nnpx tsc --noEmit\n\n# Strict + unused checks\nnpx tsc --noEmit\
  \ --strict --noUnusedLocals --noUnusedParameters\n\n# Fast re-checks with incremental cache\nnpx tsc\
  \ --noEmit --incremental --tsBuildInfoFile node_modules/.cache/tsbuildinfo\n\n# CI-friendly output\n\
  npx tsc -p tsconfig.json --pretty false\n\n# Vue SFC projects\nnpx vue-tsc --noEmit\n\n# Monorepo with\
  \ project references\nnpx tsc --build\n```\n\n## CI\n\n```yaml\n- name: Type check\n  run: npx tsc --noEmit\
  \ --pretty false\n```\n\n## Strict-mode rollout\n\n```json\n{\n  \"compilerOptions\": {\n    \"strict\"\
  : true,\n    \"noImplicitAny\": true,\n    \"strictNullChecks\": true\n  }\n}\n```\n\n## Best Practices\n\
  \n- Enforce `strict` in new projects; migrate old ones package by package\n- Use `--incremental` locally,\
  \ disable or persist cache in CI\n- Add `skipLibCheck: true` to avoid slow .d.ts checking\n- Fail CI\
  \ on any error: `tsc --noEmit --pretty false` exit code is 1 on errors\n\n## Example Response\n\nReports\
  \ each error as `path(file):line:col - TSxxxx: message`, grouped by file,\nplus the total error count\
  \ and suggestions for fixing each category."
examples:
- input: Check types before merging
  output: Runs npx tsc --noEmit --pretty false and reports all TSxxxx errors with file:line
- input: Make type errors fail CI
  output: Adds npx tsc --noEmit --pretty false to CI and fixes the current error backlog
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: type-checking.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-type-checking
  generic:
    system_prompt: 'You are the type-checking specialist. You do it through tsc-checking: Type-check TypeScript
      projects with configurable strictness and outputs. The commands are real, e.g. `tsc --noEmit`. You
      prefer the shortest safe path, and you reproduce failures before diagnosing them.'
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2026-05-15T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
