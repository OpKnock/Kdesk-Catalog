name: yarn-audit
display_name: Yarn Audit
category: code-quality
subcategory: general
description: Audits Yarn-managed dependencies for known vulnerabilities using yarn audit / yarn npm audit.
version: 2.0.0
tags:
- code-quality
author: Kdesk-Catalog
license: MIT
prerequisites:
- yarn
capabilities:
- name: yarn-audit
  description: Audit Yarn v1 and Berry dependency trees with severity gates
  commands:
  - yarn audit
  - yarn audit --level high
  - yarn audit --json
  - yarn npm audit --environment production
  - yarn npm audit --recursive
  examples:
  - yarn audit --groups dependencies
  - yarn audit --json > audit.json
  - yarn npm audit --severity high
  parameters:
  - name: level
    type: string
    description: 'Minimum severity to report: info, low, moderate, high, critical (v1)'
  - name: environment
    type: string
    description: 'Berry: production or development'
  - name: json
    type: boolean
    description: Machine-readable JSON output
knowledge:
- title: yarn audit docs (v1)
  type: documentation
  source: https://classic.yarnpkg.com/lang/en/docs/cli/audit/
  description: Yarn v1 audit command reference
- title: yarn npm audit docs (Berry)
  type: documentation
  source: https://yarnpkg.com/cli/npm/audit
  description: Yarn Berry audit flags and semantics
instructions: "# Yarn Audit\n\nScans Yarn-managed dependencies against vulnerability advisories. Syntax\
  \ differs\nbetween Yarn v1 (classic) and Berry (v2+).\n\n## When to Use\n\n- Pre-release security check\
  \ for Yarn projects\n- CI security gate\n- After a dependency bump to confirm no new advisories\n\n\
  ## Real Commands\n\n```bash\n# Yarn v1 (classic)\nyarn audit\n\n# Only high+ in v1\nyarn audit --level\
  \ high\n\n# JSON in v1\nyarn audit --json > audit.json\n\n# Yarn Berry: production deps only\nyarn npm\
  \ audit --environment production\n\n# Berry: recursive (dependencies of dependencies)\nyarn npm audit\
  \ --recursive\n\n# Berry: minimum severity\nyarn npm audit --severity high\n```\n\n## Fixing Findings\n\
  \n```bash\n# v1: no auto-fix; upgrade the direct dependency\nyarn upgrade lodash@^4.17.21\n\n# Berry:\
  \ upgrade with constraints\nyarn up lodash@^4.17.21 --exact\n```\n\n## CI\n\n```yaml\n# v1\n- name:\
  \ Audit\n  run: yarn audit --level high --json || exit 0 # capture and parse\n```\n\n## Best Practices\n\
  \n- Know which Yarn major you run: `yarn --version` before choosing flags\n- In Berry, prefer `--environment\
  \ production` for release checks\n- There is no `yarn audit fix`; upgrade packages explicitly and re-audit\n\
  - Audit after every lockfile change\n\n## Example Response\n\nReports each advisory with package, severity,\
  \ and patched range, then proposes\nthe exact `yarn upgrade` command per vulnerable package."
examples:
- input: Audit our dependencies
  output: Detects the Yarn version, runs yarn audit (v1) or yarn npm audit (Berry), and summarizes findings
    by severity
- input: Block high-severity vulnerabilities in CI
  output: Adds yarn audit --level high (or yarn npm audit --severity high) to CI and fixes current findings
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: yarn-audit.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-yarn-audit
  generic:
    system_prompt: 'You take the Yarn Audit seat. You do it through yarn-audit: Audit Yarn v1 and Berry
      dependency trees with severity gates. The commands are real, e.g. `yarn audit`. You run and verify
      the real CLI commands before you claim anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
