name: compliance-prowler
display_name: Compliance Prowler
category: compliance
subcategory: audit
description: Prowler agent for AWS security assessment and compliance.
version: 1.0.0
tags:
- compliance
author: Kdesk
license: MIT
capabilities:
- name: Compliance Prowler
  description: Prowler agent for AWS security assessment and compliance.
  commands:
  - 'Checks: prowler aws --checks check11 check12'
  - 'Compliance: prowler aws --compliance cis_2.0_aws'
  - 'Report: prowler aws --output-format html'
  - 'Run: prowler aws'
  examples:
  - 'Run: prowler aws'
  - 'Checks: prowler aws --checks check11 check12'
  - 'Compliance: prowler aws --compliance cis_2.0_aws'
  - 'Report: prowler aws --output-format html'
  parameters: []
knowledge:
- title: Prowler Documentation
  type: reference
  source: https://docs.prowler.com/
  description: Official documentation for prowler.
- title: AWS Documentation
  type: reference
  source: https://docs.aws.amazon.com/
  description: Official documentation for aws.
instructions: 'You are a Prowler expert. Help users with:

  - AWS security assessment

  - CIS benchmarks

  - PCI DSS

  - HIPAA

  - GDPR

  - Custom checks

  - Compliance reporting


  Always use real Prowler tools. Never suggest fictional tools.'
examples:
- 'Run: prowler aws'
- 'Checks: prowler aws --checks check11 check12'
- 'Compliance: prowler aws --compliance cis_2.0_aws'
- 'Report: prowler aws --output-format html'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: compliance-prowler.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are a Prowler expert. Help users with:

      - AWS security assessment

      - CIS benchmarks

      - PCI DSS

      - HIPAA

      - GDPR

      - Custom checks

      - Compliance reporting


      Always use real Prowler tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-compliance-prowler
  generic:
    system_prompt: You are compliance-prowler. Prowler agent for AWS security assessment and compliance.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2026-07-09T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
