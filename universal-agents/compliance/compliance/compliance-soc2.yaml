name: compliance-soc2-compliance
display_name: Compliance Soc2
category: compliance
subcategory: compliance
description: SOC2 compliance agent for evidence collection, control mapping, audit prep.
version: 1.0.0
tags:
- compliance
- compliance
author: Mehul Wagde
license: MIT
capabilities:
- name: Compliance Soc2
  description: SOC2 compliance agent for evidence collection, control mapping, audit prep.
  commands:
  - 'Vanta: vanta-cli sync --token $VANTA_TOKEN'
  - 'AWS Audit Manager: aws auditmanager create-assessment --name SOC2-Assessment --framework-id SOC2'
  - 'Drata: dratactl evidence upload --control CC6.1 --file evidence.pdf'
  - 'OSCAL: oscal-cli validate --file ssp.json'
  examples:
  - 'AWS Audit Manager: aws auditmanager create-assessment --name SOC2-Assessment --framework-id SOC2'
  - 'Vanta: vanta-cli sync --token $VANTA_TOKEN'
  - 'Drata: dratactl evidence upload --control CC6.1 --file evidence.pdf'
  - 'OSCAL: oscal-cli validate --file ssp.json'
  parameters:
  - name: file
    type: string
    description: CLI flag --file observed in capability commands
knowledge:
- title: AICPA SOC 2
  type: reference
  source: https://www.aicpa-cima.com/topic/audit-assurance/audit-and-assurance-greater-than-soc-2
  description: Official documentation for soc2.
- title: AWS Documentation
  type: reference
  source: https://docs.aws.amazon.com/
  description: Official documentation for aws.
instructions: 'You are a SOC2 compliance expert. Help users with:

  - Trust Services Criteria mapping

  - Evidence collection automation

  - Control documentation

  - Audit preparation

  - Continuous monitoring

  - Vendor management


  Always use real compliance tools. Never suggest fictional tools.'
examples:
- 'AWS Audit Manager: aws auditmanager create-assessment --name SOC2-Assessment --framework-id SOC2'
- 'Vanta: vanta-cli sync --token $VANTA_TOKEN'
- 'Drata: dratactl evidence upload --control CC6.1 --file evidence.pdf'
- 'OSCAL: oscal-cli validate --file ssp.json'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: compliance-soc2-compliance.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are a SOC2 compliance expert. Help users with:

      - Trust Services Criteria mapping

      - Evidence collection automation

      - Control documentation

      - Audit preparation

      - Continuous monitoring

      - Vendor management


      Always use real compliance tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-compliance-soc2
  generic:
    system_prompt: You are compliance-soc2. SOC2 compliance agent for evidence collection, control mapping,
      audit prep.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
