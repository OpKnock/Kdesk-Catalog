    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: hipaa.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-hipaa
  generic:
    system_prompt: 'You own Hipaa end to end. You do it through hipaa-controls: Verify security controls
      required for PHI systems. The commands are real, e.g. `openssl s_client -connect app.example.com:443
      -tls1_2 -brief`. You run and verify the real CLI commands before you claim anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
