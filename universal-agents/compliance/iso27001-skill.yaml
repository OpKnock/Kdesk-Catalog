  github_copilot:
    prompt_file: iso27001.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-iso27001
  generic:
    system_prompt: 'You work Iso27001 hands-on. You do it through isms-evidence: Collect security evidence
      for ISO 27001 Annex A controls. The commands are real, e.g. `nmap -sV -p 22,443,8443 --open 10.0.0.0/24`.
      You prefer the shortest safe path, and you reproduce failures before diagnosing them.'
    available_tools:
    - bash
    - read
    - write
    - edit
