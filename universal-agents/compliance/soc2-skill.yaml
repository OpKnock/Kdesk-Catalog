name: soc2
display_name: Soc2
category: compliance
subcategory: general
description: 'Readiness support for SOC 2 Type I/II: mapping Trust Services Criteria to controls and collecting
  evidence.'
version: 2.0.0
tags:
- soc2
author: Kdesk
license: MIT
prerequisites:
- kubectl
- terraform
capabilities:
- name: soc2-evidence
  description: Gather evidence for the five Trust Services Criteria categories
  commands:
  - gh api repos/$GITHUB_REPO/actions/workflows --paginate | jq '.workflows[].path'
  - terraform plan -no-color -out=/tmp/plan.tfplan && terraform show -json /tmp/plan.tfplan
  - curl -s http://localhost:8080/metrics | grep -E 'job_last_success|up' | head -10
  - kubectl get networkpolicies -A
  - rg -i "auto.?scal|replica" terraform/ k8s/ | head -20
  examples:
  - gh api repos/$GITHUB_REPO/actions/runs --paginate | jq '.workflow_runs[0:5]'
  - gitleaks detect --source . --report-path gitleaks-soc2.json
  - kubectl get secrets -A | grep -c -v NAME
  parameters:
  - name: paginate
    type: boolean
    description: Fetch all pages of the GitHub API result
  - name: report-path
    type: string
    description: Output file for the evidence report
  - name: no-color
    type: boolean
    description: Plain terraform output for logs
knowledge:
- title: AICPA SOC 2 overview
  type: documentation
  source: https://www.aicpa-cima.com/topic/audit-assurance/audit-and-assurance-greater-than-soc-2
  description: SOC 2 reporting framework and TSC explanation
- title: Trust Services Criteria
  type: documentation
  source: https://www.aicpa-cima.com/topic/audit-assurance/audit-and-assurance-greater-than-soc-2-soc-3-greater-than-trust-services-criteria
  description: CC (common criteria), A, C, I, L, P criteria sets
instructions: '# SOC 2


  System and Organization Controls 2 readiness: demonstrate the security, availability,

  processing integrity, confidentiality, and privacy criteria.


  ## When to Use


  - Preparing a SOC 2 Type I readiness assessment

  - Collecting continuous evidence before the Type II period

  - Responding to auditor requests for control artifacts


  ## Real Commands


  ```bash

  # CC7.2 access control: who can deploy

  gh api repos/$GITHUB_REPO/actions/workflows --paginate | jq ''.workflows[].path''


  # CC6.1/CC7.1: IaC review and change management

  terraform plan -no-color -out=/tmp/plan.tfplan

  terraform show -json /tmp/plan.tfplan | jq ''.resource_changes | length''


  # CC7.3 monitoring

  curl -s http://localhost:8080/metrics | grep -E ''job_last_success|up''


  # CC6.6 secrets

  sudo gitleaks detect --source . --report-path gitleaks-soc2.json


  # A1.2/A1.3 availability: scaling and failover config

  rg -i "autoscal|replica|failover" terraform/ k8s/

  ```


  ## Criteria Mapping Cheat Sheet


  - Security (CC1-CC9): access control, monitoring, change management

  - Availability (A1): uptime, redundancy, backup testing

  - Confidentiality (C1): encryption, access scope

  - Processing integrity (PI1): validations, error handling

  - Privacy (P1-P6): notice, choice, retention, disclosure


  ## Evidence Playbook


  1. Enumerate controls per criterion

  2. For each control, capture 1-2 artifacts (config, logs, reports)

  3. Store evidence with timestamps for the Type II window

  4. Run recurring checks so the evidence stream is continuous


  ## Best Practices


  - Start 6-9 months before the Type II audit window

  - Map every control to an owner and a system

  - Automate evidence collection (cron + versioned reports)

  - Review access lists quarterly and keep review records


  ## Example Response


  The agent returns a criteria-to-control matrix with evidence artifacts, owner

  assignments, and gaps flagged for the readiness call.'
examples:
- input: Prep for our SOC 2 readiness assessment
  output: Builds the control matrix, collects deployment/access/monitoring evidence, and lists gaps with
    owners
- input: Show auditor evidence of change management
  output: Exports GH Actions workflow list, terraform plan diffs, and review history as an evidence bundle
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: soc2.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-soc2
  generic:
    system_prompt: 'You own Soc2 end to end. You do it through soc2-evidence: Gather evidence for the
      five Trust Services Criteria categories. The commands are real, e.g. `gh api repos/$GITHUB_REPO/actions/workflows
      --paginate | jq .workflows[].path`. You work hands-on and only report outcomes you have observed.'
    available_tools:
    - bash
    - read
    - write
    - edit
