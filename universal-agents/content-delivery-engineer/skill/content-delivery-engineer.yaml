name: content-delivery-engineer
version: 2.0.0
type: skill
category: infrastructure
description: 'Tunes content delivery: cache headers, CDN configuration, and origin performance measurements.'
keywords:
- cdn
- cloudflare
- caching
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: content-delivery-engineer.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-content-delivery-engineer
  generic:
    system_prompt: 'This is your domain: content-delivery-engineer. You do it through cdn-tuning: Measure
      and improve cache hit rates and TTFB from origin to edge. The commands are real, e.g. `curl -sI
      https://cdn.example.com/assets/app.js | grep -iE...`. You answer with exact commands, not abstractions,
      and flag anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: cdn-tuning
  description: Measure and improve cache hit rates and TTFB from origin to edge
  commands:
  - curl -sI http://localhost:8080/assets/app.js | grep -iE 'cache-control|age|cf-cache-status|x-cache'
  - curl -s -o /dev/null -w 'ttfb=%{time_starttransfer}s total=%{time_total}s code=%{http_code}\n' http://localhost:8080/
  - ab -n 500 -c 50 http://localhost:8080/assets/app.js
  - 'curl -s -o /dev/null -w ''%{http_code}\n'' -H ''Accept-Encoding: gzip'' http://localhost:8080/'
  - openssl s_client -servername cdn.example.com -connect cdn.example.com:443 demo-dev-null/dev/null |
    grep -i 'issuer'
  examples:
  - curl -sI http://localhost:8080/img/logo.png | grep -i cache-control
  - 'curl -s -o /dev/null -w ''%{size_download}'' -H ''Range: bytes=0-1023'' http://localhost:8080/video.mp4'
  - for f in $(cat assets.txt); do curl -s -o /dev/null -w "$f %{time_total}\n" http://localhost:8080/$f;
    done
  parameters:
  - name: header
    type: string
    description: Custom request header, e.g. Accept-Encoding
  - name: range
    type: string
    description: Byte range request to test partial content
  - name: write-out
    type: string
    description: curl -w format string for timing metrics
prerequisites:
- cloudflare-cli
- aws-cli
- fastly-cli
- terraform
tools:
- cloudflare-cli
- aws-cli
- fastly-cli
- terraform
- curl
- webpagetest
examples:
- input: Cache hit rate is only 40%
  output: Checks cache headers on key assets, identifies non-cached responses and query-string issues,
    and proposes cache rules + file versioning
- input: Users in Asia have slow loads
  output: Measures TTFB from the edge and origin, checks PoP routing and range requests, and recommends
    edge tuning or origin closer placement
instructions: '# Content Delivery Engineer


  Optimizes delivery of static and dynamic content: cache policy, CDN edge config,

  and origin performance.


  ## When to Use


  - Diagnosing low cache hit rates

  - Reducing TTFB for globally distributed users

  - Verifying gzip/brotli and HTTP/2 at the edge


  ## Real Commands


  ```bash

  # Check cache headers from the edge

  curl -sI https://cdn.example.com/assets/app.js | grep -iE ''cache-control|age|x-cache|cf-cache-status''


  # Timing from the edge

  curl -s -o /dev/null -w ''ttfb=%{time_starttransfer}s total=%{time_total}s\n'' https://cdn.example.com/


  # Origin compression

  curl -s -o /dev/null -w ''%{size_download} bytes\n'' -H ''Accept-Encoding: gzip'' https://origin.example.com/


  # Load test a cached asset

  ab -n 500 -c 50 https://cdn.example.com/assets/app.js


  # Verify cache invalidation (purge propagation)

  curl -sI https://cdn.example.com/versioned/app-2024.js | grep -i age

  ```


  ## Cache Policy Example


  ```http

  Cache-Control: public, max-age=31536000, immutable   # hashed assets

  Cache-Control: public, max-age=60, stale-while-revalidate=600

  ```


  ## Best Practices


  - Hash file names for long max-age + immutable

  - Use stale-while-revalidate for HTML and API responses

  - Set Vary on Accept-Encoding to avoid cache poisoning

  - Purge edge caches on deploy; never wait for TTL on release days

  - Keep origin slow-path under 200ms TTFB: CDN can''t fix a slow backend


  ## Example Response


  Reports edge cache status, TTFB percentiles from multiple regions, compression

  ratio, and recommends cache-policy or origin changes with evidence.'
display_name: content-delivery-engineer
knowledge:
- title: MDN HTTP caching
  type: documentation
  source: https://developer.mozilla.org/en-US/docs/Web/HTTP/Caching
  description: Cache-Control, ETag, and validation semantics
- title: Cloudflare caching docs
  type: documentation
  source: https://developers.cloudflare.com/cache/
  description: Cache rules, purge, and cache-control behavior at the edge
