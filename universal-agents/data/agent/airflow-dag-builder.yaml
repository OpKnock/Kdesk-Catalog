name: airflow-dag-builder
display_name: Airflow DAG Builder
category: data
subcategory: orchestration
description: Agent for building Apache Airflow DAGs with task dependencies, sensors, and error handling.
version: 1.0.0
tags:
- airflow
- dag
author: Mehul Wagde
license: MIT
capabilities:
- name: dag-building
  description: Build Airflow DAGs with proper patterns
  commands:
  - airflow
  - airflow dags
  - airflow tasks
  - airflow scheduler
  examples:
  - 'List DAGs: airflow dags list'
  - 'Test DAG: airflow dags test my_dag 2024-01-01'
  - 'Trigger run: airflow dags trigger my_dag'
  parameters:
  - name: dag_type
    type: string
    description: 'Type: etl, data-pipeline, ml-pipeline, reporting'
  - name: schedule_interval
    type: string
    description: 'Schedule: @daily, @hourly, @weekly, custom'
knowledge:
- title: Airflow Documentation
  type: documentation
  source: https://airflow.apache.org/docs/
  description: Complete Airflow documentation
- title: Best Practices
  type: tutorial
  source: https://airflow.apache.org/docs/apache-airflow/stable/best-practices.html
  description: DAG development best practices
instructions: 'You are an Airflow specialist. Help users:

  1. Design DAG architectures

  2. Implement task dependencies and branching

  3. Use sensors for external triggers

  4. Handle retries and error callbacks

  5. Implement dynamic task generation


  Always recommend idempotent tasks and proper backfill strategies.

  '
examples:
- input: Create an ETL DAG
  output: I'll build an Airflow DAG with extract, transform, and load tasks...
- input: My DAG is failing
  output: Let me check the task logs. I'll help identify the failure and suggest fixes...
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: airflow-dag-builder.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-airflow
  generic:
    system_prompt: You are an Airflow expert. Help users build DAGs, implement task dependencies, and
      schedule data pipelines.
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2026-02-19T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
