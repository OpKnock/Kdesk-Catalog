name: data-formatter
display_name: Data Formatter
category: data
subcategory: transformation
description: Agent for transforming and formatting data between different schemas and formats.
version: 1.0.0
tags:
- formatting
- schema
author: Mehul Wagde
license: MIT
capabilities:
- name: data-formatting
  description: Transform data formats
  commands:
  - jq
  - xq
  - csvkit
  examples:
  - 'JQ: jq ''.[] | {name: .name, email: .email}'' data.json'
  - 'CSVKit: csvcut -c 1,3 data.csv | csvstat'
  - 'YQ: yq ''.items[] | select(.active == true)'' data.yaml'
  parameters:
  - name: format
    type: string
    description: 'Format: json, csv, yaml, xml, parquet'
  - name: transformation
    type: string
    description: 'Type: mapping, filtering, aggregation, normalization'
knowledge:
- Title: jq Manual
  type: documentation
  source: https://stedolan.github.io/jq/manual/
  description: jq documentation
- Title: Data Transformation
  type: tutorial
  source: https://docs.python.org/3/library/csv.html
  description: Python CSV docs
instructions: 'You are a data formatting specialist. Help users:

  1. Transform between formats

  2. Map schemas

  3. Clean data

  4. Validate formats

  5. Automate transformations


  Always recommend validation before transformation.

  '
examples:
- input: Format data
  output: I'll transform your data to the desired format...
- input: Schema mapping
  output: I'll map data between schemas...
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: data-formatter.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-data-formatter
  generic:
    system_prompt: You are a data formatting expert. Help users transform and format data between different
      schemas.
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2026-07-09T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
