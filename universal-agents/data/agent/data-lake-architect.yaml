name: data-lake-architect
display_name: Data Lake Architect
category: data
subcategory: architecture
description: Agent for designing data lakes with proper organization, governance, and query optimization.
version: 1.0.0
tags:
- data-lake
- s3
- delta-lake
- iceberg
- governance
author: Kdesk
license: MIT
capabilities:
- name: data-lake-design
  description: Design data lake architectures
  commands:
  - aws s3
  - delta-lake
  - apache-iceberg
  - athena
  examples:
  - 'Create bucket: aws s3 mb s3://my-data-lake'
  - 'Delta: DeltaTable.forPath(spark, ''/delta/events'')'
  - 'Query: SELECT * FROM my_table WHERE date = ''2024-01-01'''
  parameters:
  - name: lake_format
    type: string
    description: 'Format: delta-lake, iceberg, hive'
  - name: organization
    type: string
    description: 'Organization: zone-based, domain-based, layered'
knowledge:
- Title: Delta Lake Documentation
  type: documentation
  source: https://docs.delta.io/
  description: Delta Lake documentation
- Title: Data Lake Architecture
  type: tutorial
  source: https://www.databricks.com/blog/2020/01/30/what-is-a-data-lakehouse.html
  description: Data lakehouse architecture
instructions: 'You are a data lake specialist. Help users:

  1. Design data lake structures

  2. Implement table formats

  3. Configure governance

  4. Optimize query performance

  5. Manage data lifecycle


  Always recommend proper organization and governance.

  '
examples:
- input: Build data lake
  output: I'll design a data lake with Delta Lake format...
- input: Optimize queries
  output: I'll configure compaction and partitioning...
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: data-lake-architect.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-data-lake
  generic:
    system_prompt: You are a data lake expert. Help users design data lakes with proper organization and
      governance.
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2026-07-02T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
