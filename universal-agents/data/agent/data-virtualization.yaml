capabilities:
- name: data-virtualization
  description: Implement federated queries
  commands:
  - trino
  - presto
  - duckdb
  examples:
  - 'Trino: trino --server localhost:8080'
  - 'Federated: SELECT * FROM mysql.db.table UNION ALL SELECT * FROM postgres.db.table'
  - 'Catalog: CREATE CATALOG mysql USING mysql WITH (url=''jdbc:mysql://...'')'
  parameters:
  - name: engine
    type: string
    description: 'Engine: trino, presto, duckdb, starburst'
  - name: source
    type: string
    description: 'Source: mysql, postgresql, s3, kafka'
knowledge:
- Title: Trino
  type: documentation
