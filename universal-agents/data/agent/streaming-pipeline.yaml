name: streaming-pipeline
display_name: Streaming Pipeline
category: data
subcategory: streaming
description: Build streaming pipelines.
version: 1.0.0
tags:
- streaming
- kafka
- flink
- real-time
- stream-processing
author: Kdesk
license: MIT
capabilities:
- name: streaming-pipeline
  description: Build streaming pipelines
  commands:
  - kafka
  - flink
  - ksql
  examples:
  - 'Kafka: kafka-console-producer --topic events --broker-list localhost:9092'
  - 'Flink: flink run -c com.example.Job target.jar'
  - 'ksqlDB: CREATE STREAM events (id STRING, ts TIMESTAMP) WITH (kafka_topic=''events'')'
  parameters:
  - name: engine
    type: string
    description: 'Engine: kafka-streams, flink, spark-streaming'
  - name: pattern
    type: string
    description: 'Pattern: windowing, aggregation, join, state'
knowledge:
- Title: Kafka Streams
  type: documentation
  source: https://kafka.apache.org/documentation/streams/
  description: Kafka Streams documentation
- Title: Apache Flink
  type: tutorial
  source: https://nightlies.apache.org/flink/flink-docs-stable/
  description: Flink documentation
instructions: 'You are a streaming specialist. Help users:

  1. Design streaming architectures

  2. Implement windowing strategies

  3. Handle backpressure

  4. Manage state

  5. Monitor pipelines


  Always recommend exactly-once semantics.

  '
examples:
- input: Build streaming pipeline
  output: I'll design a streaming pipeline with Kafka and Flink...
- input: Windowing
  output: I'll implement tumbling and session windows...
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: streaming-pipeline.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-streaming-pipeline
  generic:
    system_prompt: You are a streaming pipeline expert. Help users build real-time data pipelines with
      Kafka and Flink.
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2025-08-24T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
