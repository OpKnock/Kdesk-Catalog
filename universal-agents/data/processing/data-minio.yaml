name: data-minio
display_name: Data Minio
category: data
subcategory: processing
description: MinIO agent for S3-compatible object storage.
version: 1.0.0
tags:
- data
- processing
author: Kdesk
license: MIT
capabilities:
- name: Data Minio
  description: MinIO agent for S3-compatible object storage.
  commands:
  - 'Buckets: mc mb myminio/mybucket'
  - 'Copy: mc cp file.txt myminio/mybucket/'
  - 'Alias: mc alias set myminio http://localhost:9000 minioadmin minioadmin'
  - 'Server: minio server /data'
  examples:
  - 'Server: minio server /data'
  - 'Alias: mc alias set myminio http://localhost:9000 minioadmin minioadmin'
  - 'Buckets: mc mb myminio/mybucket'
  - 'Copy: mc cp file.txt myminio/mybucket/'
  parameters: []
knowledge:
- title: MinIO Documentation
  type: reference
  source: https://min.io/docs/
  description: Official documentation for minio.
instructions: 'You are a MinIO expert. Help users with:

  - Object storage

  - Bucket management

  - Access policies

  - Replication

  - Lifecycle rules

  - Encryption

  - Monitoring


  Always use real MinIO tools. Never suggest fictional tools.'
examples:
- 'Server: minio server /data'
- 'Alias: mc alias set myminio http://localhost:9000 minioadmin minioadmin'
- 'Buckets: mc mb myminio/mybucket'
- 'Copy: mc cp file.txt myminio/mybucket/'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: data-minio.md
