  - 'Datafold: datafold diff'
  - 'Great Expectations: great_expectations checkpoint run'
  - 'Soda: soda scan -d my_db checks.yml'
  examples:
  - 'Great Expectations: great_expectations checkpoint run'
  - 'Monte Carlo: monte-carlo diagnose'
  - 'Datafold: datafold diff'
  - 'Soda: soda scan -d my_db checks.yml'
