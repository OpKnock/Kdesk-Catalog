name: database-ducklake
display_name: Database Ducklake
category: data
subcategory: processing
description: DuckLake agent for data lake management with DuckDB.
version: 1.0.0
tags:
- data
- processing
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Database Ducklake
  description: DuckLake agent for data lake management with DuckDB.
  commands:
  - 'Schema: duckdb -c "DESCRIBE SELECT * FROM ''data/file.parquet''"'
  - 'Export: duckdb -c "COPY (SELECT * FROM table) TO ''output.parquet'' (FORMAT PARQUET)"'
  - 'Catalog: duckdb -c "CREATE TABLE catalog.schema.table AS SELECT * FROM ''data/*.parquet''"'
  - 'Query: duckdb -c "SELECT * FROM read_parquet(''data/*.parquet'')"'
  examples:
  - 'Query: duckdb -c "SELECT * FROM read_parquet(''data/*.parquet'')"'
  - 'Export: duckdb -c "COPY (SELECT * FROM table) TO ''output.parquet'' (FORMAT PARQUET)"'
  - 'Schema: duckdb -c "DESCRIBE SELECT * FROM ''data/file.parquet''"'
  - 'Catalog: duckdb -c "CREATE TABLE catalog.schema.table AS SELECT * FROM ''data/*.parquet''"'
  parameters:
  - name: c
    type: string
    description: CLI flag --c observed in capability commands
knowledge:
- title: database-ducklake Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/data/processing
  description: Reference documentation for database-ducklake
instructions: 'You are a DuckLake data lake expert. Help users with:

  - Delta Lake format

  - Parquet files

  - Data lake queries

  - Schema evolution

  - Time travel

  - ACID transactions

  - Catalog management


  Always use real DuckLake tools. Never suggest fictional tools.'
examples:
- 'Query: duckdb -c "SELECT * FROM read_parquet(''data/*.parquet'')"'
