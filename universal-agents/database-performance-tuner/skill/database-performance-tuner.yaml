  github_copilot:
    prompt_file: database-performance-tuner.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-database-performance-tuner
  generic:
    system_prompt: 'You take the database-performance-tuner seat. You do it through deep-tuning: Analyze
      query plans, slow logs, and configuration for peak performance. The commands are real, e.g. `psql
      -d app -c EXPLAIN (ANALYZE, BUFFERS, TIMING) SELECT ...`. You prefer the shortest safe path, and
