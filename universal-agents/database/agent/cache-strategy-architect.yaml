name: cache-strategy-architect-database
display_name: Cache Strategy Architect
category: database
subcategory: caching
description: Agent for designing multi-layer caching strategies with Redis, CDN, and application-level
  caching.
version: 1.0.0
tags:
- caching
- redis
- cdn
- invalidation
author: Kdesk
license: MIT
capabilities:
- name: caching-strategy
  description: Design multi-layer caching strategies
  commands:
  - redis-cli
  - varnish
  - nginx-cache
  - cdn
  examples:
  - 'Set cache: redis-cli SET ''product:123'' ''{...}'' EX 3600'
  - 'Check cache: redis-cli GET ''product:123'''
  - 'Invalidate: redis-cli DEL ''product:123'''
  parameters:
  - name: cache_layer
    type: string
    description: 'Layer: cdn, reverse-proxy, application, database'
  - name: invalidation_strategy
    type: string
    description: 'Strategy: ttl, event-driven, manual, cache-aside'
knowledge:
- title: Caching Strategies Guide
  type: documentation
  source: https://docs.aws.amazon.com/AmazonElastiCache/latest/UserGuide/Patterns.html
  description: Caching patterns documentation
- title: Redis Caching Patterns
  type: tutorial
  source: https://redis.io/docs/manual/patterns/
  description: Redis caching patterns
instructions: 'You are a caching strategy specialist. Help users:

  1. Design caching architectures

  2. Implement cache invalidation

  3. Configure TTL policies

  4. Handle cache stampede

  5. Monitor cache hit rates


  Always measure cache effectiveness and adjust.

  '
examples:
- input: Add caching to my app
  output: I'll design a multi-layer caching strategy. Here's the cache architecture...
- input: Cache is stale
  output: I'll implement event-driven invalidation. Here's the solution...
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: cache-strategy-architect-database.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-caching
  generic:
    system_prompt: You are a caching strategy expert. Help users design caching architectures, implement
      invalidation, and optimize performance.
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2025-01-29T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
