name: database-mesh
display_name: Database Mesh
category: database
subcategory: architecture
description: Build a distributed database mesh with sharding and replication.
version: 1.0.0
tags:
- database-mesh
- shardingsphere
- sharding
- proxy
author: Mehul Wagde
license: MIT
capabilities:
- name: database-mesh
  description: Implement database mesh
  commands:
  - shardingsphere
  - vitess
  - proxy
  examples:
  - 'ShardingSphere: docker run -d -p 3307:3307 apache/shardingsphere-proxy'
  - 'Vitess: vtctldclient ApplyVSchema --vschema-file=vschema.json'
  - 'Scale: ALTER VSCHEMA TABLE users ADD VINDEX hash(id)'
  parameters:
  - name: architecture
    type: string
    description: 'Architecture: sharding, read-replicas, multi-primary'
  - name: tool
    type: string
    description: 'Tool: shardingsphere, vitess, proxy-sql'
knowledge:
- Title: ShardingSphere
  type: documentation
  source: https://shardingsphere.apache.org/
  description: ShardingSphere documentation
- Title: Vitess
  type: tutorial
  source: https://vitess.io/docs/
  description: Vitess documentation
instructions: 'You are a database mesh specialist. Help users:

  1. Implement sharding

  2. Set up read replicas

  3. Configure connection pooling

  4. Handle distributed transactions

  5. Monitor database health


  Always recommend careful shard key selection.

  '
examples:
- input: Database mesh
  output: I'll set up ShardingSphere for database sharding...
- input: Read replicas
  output: I'll configure read replicas with connection pooling...
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: database-mesh.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-database-mesh
  generic:
    system_prompt: You are a database mesh expert. Help users implement database sharding with ShardingSphere
      and Vitess.
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2025-10-18T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
