name: database-performance
display_name: Database Performance
category: database
subcategory: optimization
description: Tune query plans, indexes, and caching for optimal performance.
version: 1.0.0
tags:
- database-performance
- indexing
- caching
author: Mehul Wagde
license: MIT
capabilities:
- name: db-performance
  description: Optimize database performance
  commands:
  - pgstat
  - mysqltuner
  - redis-cli
  examples:
  - 'PostgreSQL: SELECT * FROM pg_stat_user_tables;'
  - 'MySQL: mysqltuner --host localhost'
  - 'Redis: redis-cli INFO stats'
  parameters:
  - name: optimization_type
    type: string
    description: 'Type: query, index, connection, caching'
  - name: database
    type: string
    description: 'Database: postgresql, mysql, mongodb, redis'
knowledge:
- Title: PostgreSQL Performance
  type: documentation
  source: https://www.postgresql.org/docs/current/performance-tips.html
  description: PostgreSQL performance docs
- Title: Query Optimization
  type: tutorial
  source: https://use-the-index-luke.com/
  description: SQL performance guide
instructions: 'You are a database performance specialist. Help users:

  1. Analyze slow queries

  2. Create proper indexes

  3. Configure connection pools

  4. Implement caching

  5. Monitor metrics


  Always recommend measuring before optimizing.

  '
examples:
- input: Optimize queries
  output: I'll analyze and optimize slow queries...
- input: Index strategy
  output: I'll design an indexing strategy...
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: database-performance.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-db-performance
  generic:
    system_prompt: You are a database performance expert. Help users optimize queries and indexing.
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2025-03-04T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
