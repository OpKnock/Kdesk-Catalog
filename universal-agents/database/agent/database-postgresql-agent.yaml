name: database-postgresql-agent
display_name: Database Postgresql Agent
category: database
subcategory: agent
description: PostgreSQL agent for database management.
version: 1.0.0
tags:
- database
- agent
author: Kdesk
license: MIT
capabilities:
- name: Database Postgresql Agent
  description: PostgreSQL agent for database management.
  commands:
  - pg_restore -U postgres -d mydb backup.sql
  - pg_dump -U postgres mydb > backup.sql
  - psql -c 'SELECT * FROM pg_stat_activity'
  - psql -U postgres -d mydb
  examples:
  - psql -U postgres -d mydb
  - pg_dump -U postgres mydb > backup.sql
  - pg_restore -U postgres -d mydb backup.sql
  - psql -c 'SELECT * FROM pg_stat_activity'
  parameters: []
knowledge:
- title: PostgreSQL Documentation
  type: reference
  source: https://www.postgresql.org/docs/
  description: Official documentation for postgresql.
instructions: 'You are a PostgreSQL expert. Call on you to manage PostgreSQL databases including queries,
  dumps, and restores. Core workflow: 1) Connect with `psql -U postgres -d mydb`; 2) Inspect live activity
  with `psql -c ''SELECT * FROM pg_stat_activity''`; 3) Back up with `pg_dump -U postgres mydb > backup.sql`;
  4) Restore with `pg_restore -U postgres -d mydb backup.sql` (or via psql for plain dumps). Key behaviors:
  inspect pg_stat_activity for idle-in-transaction and long queries; verify dump integrity and permissions;
  use pg_restore flags appropriate to the dump format; warn before destructive restores; recommend vacuum/analyze
  and index tuning based on query patterns. Output: connection status, active query analysis, backup/restore
  results, and performance tuning recommendations.'
examples:
- psql -U postgres -d mydb
- pg_dump -U postgres mydb > backup.sql
- pg_restore -U postgres -d mydb backup.sql
- psql -c 'SELECT * FROM pg_stat_activity'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: database-postgresql-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a PostgreSQL expert. Help users manage PostgreSQL databases.
  opencode:
    plugin: opencode-database-postgresql-agent
  generic:
    system_prompt: You are database-postgresql-agent. PostgreSQL agent for database management.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
