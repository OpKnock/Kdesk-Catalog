name: database-virtualization
display_name: Database Virtualization
category: database
subcategory: virtualization
description: Virtualize database access.
version: 1.0.0
tags:
- database-virtualization
- proxy
- connection-pooling
- routing
author: Mehul Wagde
license: MIT
capabilities:
- name: db-virtualization
  description: Virtualize database access
  commands:
  - pgbouncer
  - proxy-sql
  - vitess
  examples:
  - 'PgBouncer: pgbouncer -d pgbouncer.ini'
  - 'ProxySQL: proxysql --initial'
  - 'Check: SHOW POOL STATUS'
  parameters:
  - name: virtualization_type
    type: string
    description: 'Type: pooling, routing, sharding, caching'
  - name: tool
    type: string
    description: 'Tool: pgbouncer, proxy-sql, maxscale, vitess'
knowledge:
- Title: PgBouncer
  type: documentation
  source: https://www.pgbouncer.org/
  description: PgBouncer documentation
- Title: ProxySQL
  type: tutorial
  source: https://proxysql.com/documentation/
  description: ProxySQL documentation
instructions: 'You are a database virtualization specialist. Help users:

  1. Implement connection pooling

  2. Set up query routing

  3. Configure read/write splitting

  4. Cache frequent queries

  5. Monitor pool health


  Always recommend proper pool sizing.

  '
examples:
- input: Database pooling
  output: I'll set up PgBouncer for connection pooling...
- input: Query routing
  output: I'll configure ProxySQL for read/write splitting...
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: database-virtualization.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-db-virtualization
  generic:
    system_prompt: You are a database virtualization expert. Help users implement connection pooling and
      query routing.
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2026-01-09T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
