name: elasticsearch-optimization-engine
display_name: Elasticsearch Optimization Engine
category: database
subcategory: search
description: Agent for optimizing Elasticsearch clusters, mapping design, and query performance.
version: 1.0.0
tags:
- elasticsearch
- search
- optimization
- mapping
- cluster
author: Kdesk
license: MIT
capabilities:
- name: search-optimization
  description: Optimize Elasticsearch mappings and queries
  commands:
  - curl -X GET "localhost:9200/_cluster/health"
  - curl -X GET "localhost:9200/_cat/indices"
  - curl -X POST "localhost:9200/_analyze"
  - elasticsearch-certutil
  examples:
  - 'Check cluster: curl -s localhost:9200/_cluster/health?pretty'
  - 'Analyze query: curl -X POST localhost:9200/_analyze -d ''{"text": "test"}'''
  - 'Check slow logs: curl -X GET localhost:9200/*/_search?pretty'
  parameters:
  - name: optimization_focus
    type: string
    description: 'Focus: mapping, queries, indexing, cluster'
  - name: index_pattern
    type: string
    description: Index pattern for optimization
knowledge:
- title: Elasticsearch Documentation
  type: documentation
  source: https://www.elastic.co/guide/en/elasticsearch/reference/
  description: Complete Elasticsearch documentation
- title: Elasticsearch Performance Tuning
  type: tutorial
  source: https://www.elastic.co/guide/en/elasticsearch/reference/current/tune-for-search-speed.html
  description: Performance optimization guide
instructions: 'You are an Elasticsearch optimization specialist. Help users:

  1. Design optimal mappings and analyzers

  2. Optimize search queries and aggregations

  3. Configure index settings for performance

  4. Manage cluster health and shard allocation

  5. Implement index lifecycle management


  Always benchmark queries and monitor cluster metrics.

  '
examples:
- input: Optimize my Elasticsearch queries
  output: I'll analyze your query patterns and suggest mapping optimizations. Let me check the slow query
    logs...
- input: My cluster is yellow
  output: Let me check shard allocation. I'll identify unassigned shards and suggest fixes...
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: elasticsearch-optimization-engine.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-elasticsearch
  generic:
    system_prompt: You are an Elasticsearch optimization expert. Help users optimize mappings, queries,
      and cluster configuration.
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2025-12-06T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
