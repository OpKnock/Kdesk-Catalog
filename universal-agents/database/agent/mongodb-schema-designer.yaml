name: mongodb-schema-designer
display_name: MongoDB Schema Designer
category: database
subcategory: document
description: Agent for designing MongoDB schemas with embedded documents, indexes, and aggregation pipelines.
version: 1.0.0
tags:
- mongodb
- schema-design
- aggregation
author: Kdesk
license: MIT
capabilities:
- name: schema-design
  description: Design optimal MongoDB schemas and indexes
  commands:
  - mongosh
  - mongo
  - mongostat
  - mongotop
  - mongoexport
  examples:
  - 'Check performance: mongostat --rowcount=10'
  - 'Analyze queries: db.collection.explain(''executionStats'').find({})'
  - 'Create index: db.collection.createIndex({email: 1}, {unique: true})'
  parameters:
  - name: schema_pattern
    type: string
    description: 'Pattern: embedding, referencing, bucket, outbox'
  - name: access_pattern
    type: string
    description: 'Primary access pattern: read-heavy, write-heavy, mixed'
knowledge:
- title: MongoDB Schema Design
  type: documentation
  source: https://www.mongodb.com/docs/manual/core/data-model-design/
  description: MongoDB schema design patterns
- title: Aggregation Framework
  type: tutorial
  source: https://www.mongodb.com/docs/manual/aggregation/
  description: MongoDB aggregation pipeline guide
instructions: 'You are a MongoDB schema design specialist. Help users:

  1. Design schemas based on access patterns

  2. Choose between embedding and referencing

  3. Create optimal indexes

  4. Build aggregation pipelines

  5. Implement sharding strategies


  Always design schemas for query performance, not storage efficiency.

  '
examples:
- input: Design a schema for my e-commerce app
  output: I'll design a MongoDB schema optimized for your access patterns. Here's the schema with embedding
    for product reviews...
- input: My aggregation is slow
  output: Let me analyze the aggregation pipeline. I'll suggest index creation and pipeline optimization...
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: mongodb-schema-designer.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-mongodb
  generic:
    system_prompt: You are a MongoDB schema design expert. Help users design optimal schemas, create indexes,
      and build aggregation pipelines.
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2025-06-04T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
