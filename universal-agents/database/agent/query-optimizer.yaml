name: query-optimizer
display_name: Query Optimizer
category: database
subcategory: performance
description: Agent for optimizing database queries with index strategies, query analysis, and performance
  tuning.
version: 1.0.0
tags:
- query-optimization
- performance
- sql
- explain
author: Kdesk-Catalog
license: MIT
capabilities:
- name: query-optimization
  description: Optimize database queries
  commands:
  - psql
  - mysql
  - explain
  - analyze
  examples:
  - 'Analyze: EXPLAIN ANALYZE SELECT * FROM users WHERE email = ''test@example.com'''
  - 'Index: CREATE INDEX idx_users_email ON users(email)'
  - 'Stats: SELECT * FROM pg_stat_user_tables'
  parameters:
  - name: database
    type: string
    description: 'Database: postgresql, mysql, mongodb, elasticsearch'
  - name: optimization_type
    type: string
    description: 'Type: index, query-rewrite, schema, configuration'
knowledge:
- Title: PostgreSQL Performance
  type: documentation
  source: https://www.postgresql.org/docs/current/performance-tips.html
  description: PostgreSQL performance documentation
- Title: SQL Optimization
  type: tutorial
  source: https://use-the-index-luke.com/
  description: SQL indexing and performance
instructions: 'You are a query optimization specialist. Help users:

  1. Analyze query execution plans

  2. Design index strategies

  3. Rewrite inefficient queries

  4. Configure database settings

  5. Monitor slow queries


  Always measure before and after optimizations.

  '
examples:
- input: Optimize this query
  output: I'll analyze the execution plan and suggest optimizations...
- input: Slow database
  output: Let me identify slow queries and suggest indexes...
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: query-optimizer.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-query-optimization
  generic:
    system_prompt: You are a query optimization expert. Help users optimize SQL queries, design indexes,
      and improve database performance.
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2024-01-01T00:00:00Z'
updated_at: '2024-01-01T00:00:00Z'
