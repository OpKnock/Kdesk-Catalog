name: database-migration-database-2
display_name: database-migration-database-2
category: database
subcategory: general
description: 'Version-controlled database schema changes with Flyway and Liquibase: migrate, validate,
  and rollback.'
version: 2.0.0
tags:
- database
author: Mehul Wagde
license: MIT
prerequisites:
- flyway
- liquibase
capabilities:
- name: flyway-migrations
  description: Apply, validate, and manage Flyway schema migrations
  commands:
  - flyway migrate
  - flyway info
  - flyway validate
  - flyway repair
  - flyway migrate -target=20240115 -placeholders.env=prod
  examples:
  - flyway migrate -configFiles=conf/flyway.prod.conf
  - flyway baseline -baselineVersion=20231201
  - flyway info -outputType=json
  parameters:
  - name: target
    type: string
    description: Migration version to migrate to
  - name: configFiles
    type: string
    description: Comma-separated config files
  - name: outputType
    type: string
    description: 'info output: json, csv, sarif'
- name: liquibase-migrations
  description: Apply and rollback Liquibase changesets
  commands:
  - liquibase update --changelog-file=db/changelog.yml
  - liquibase status --verbose --changelog-file=db/changelog.yml
  - liquibase rollback --tag v1.2 --changelog-file=db/changelog.yml
  - liquibase update-sql --changelog-file=db/changelog.yml > preview.sql
  - liquibase validate --changelog-file=db/changelog.yml
  examples:
  - liquibase update --url=jdbc:postgresql://localhost/app --username app --password pass
  - liquibase history --changelog-file=db/changelog.yml
  - liquibase changelog-sync --changelog-file=db/changelog.yml
  parameters:
  - name: changelog-file
    type: string
    description: Path to the changelog file
  - name: tag
    type: string
    description: Tag to roll back to
  - name: url
    type: string
    description: JDBC URL of the target database
knowledge:
- title: Flyway docs
  type: documentation
  source: https://documentation.red-gate.com/flyway/
  description: Migration lifecycle, naming, and config
- title: Liquibase docs
  type: documentation
  source: https://docs.liquibase.com/
  description: Changelogs, changesets, and rollback
instructions: '# Database Migration


  Version-controlled schema migrations with Flyway or Liquibase, applied the same

  way in dev, staging, and prod.


  ## When to Use


  - Adding/altering tables in a controlled way

  - Rolling out schema changes with deploys

  - Recovering from failed migrations


  ## Real Commands


  ```bash

  # Flyway

  sudo flyway migrate -configFiles=conf/flyway.conf

  sudo flyway info -outputType=json

  sudo flyway validate

  sudo flyway repair

  sudo flyway migrate -target=20240115

  sudo flyway baseline -baselineVersion=20231201


  # Liquibase

  sudo liquibase update --changelog-file=db/changelog.yml

  sudo liquibase status --verbose --changelog-file=db/changelog.yml

  sudo liquibase update-sql --changelog-file=db/changelog.yml > preview.sql

  sudo liquibase rollback --tag v1.2 --changelog-file=db/changelog.yml

  sudo liquibase validate --changelog-file=db/changelog.yml

  ```


  ## Flyway Naming Convention


  ```

  V1__create_users.sql

  V2__add_email_column.sql

  R__view_active_users.sql   # repeatable

  ```


  ## Best Practices


  - Never edit applied migrations; add new ones

  - Run `flyway validate` in CI before deploy

  - Use `liquibase update-sql` to review generated SQL first

  - Test migrations against a copy of prod data

  - One migration per logical change; keep them small


  ## Example Response


  For a failed migration: runs info/status to find the applied point, suggests

  repair or a compensating migration, and re-runs to target.'
examples:
- input: Apply pending migrations to prod
  output: Runs flyway info to preview, then flyway migrate with the prod config; reports applied versions
- input: A migration failed halfway
  output: Inspects flyway info, runs repair if checksum/state is off, and applies a fix migration
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: database-migration-database-2.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-database-migration
  generic:
    system_prompt: 'You work database-migration-database-2 hands-on. You do it through flyway-migrations:
      Apply, validate, and manage Flyway schema migrations. The commands are real, e.g. `flyway migrate`.
      You work hands-on and only report outcomes you have observed.'
    available_tools:
    - bash
    - read
    - write
    - edit
