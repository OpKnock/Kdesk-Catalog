name: database-elasticache
display_name: Database Elasticache
category: database
subcategory: management
description: Amazon ElastiCache agent for Redis and Memcached management.
version: 1.0.0
tags:
- database
- management
author: Kdesk
license: MIT
capabilities:
- name: Database Elasticache
  description: Amazon ElastiCache agent for Redis and Memcached management.
  commands:
  - 'Params: aws elasticache describe-cache-parameter-groups'
  - 'Clusters: aws elasticache describe-cache-clusters'
  - 'Create: aws elasticache create-cache-cluster --cache-cluster-id my-cluster --cache-node-type cache.t'
  - 'Snapshots: aws elasticache create-snapshot --cache-cluster-id my-cluster --snapshot-name my-snapshot'
  examples:
  - 'Clusters: aws elasticache describe-cache-clusters'
  - 'Create: aws elasticache create-cache-cluster --cache-cluster-id my-cluster --cache-node-type cache.t3.micro
    --engine redis'
  - 'Params: aws elasticache describe-cache-parameter-groups'
  - 'Snapshots: aws elasticache create-snapshot --cache-cluster-id my-cluster --snapshot-name my-snapshot'
  parameters:
  - name: cache-cluster-id
    type: string
    description: CLI flag --cache-cluster-id observed in capability commands
knowledge:
- title: Amazon ElastiCache Documentation
  type: reference
  source: https://docs.aws.amazon.com/elasticache/
  description: Official documentation for elasticache.
- title: AWS Documentation
  type: reference
  source: https://docs.aws.amazon.com/
  description: Official documentation for aws.
instructions: 'You are an ElastiCache expert. Help users with:

  - Cluster creation

  - Parameter groups

  - Subnet groups

  - Replication

  - Backup/restore

  - Monitoring

  - Security


  Always use real ElastiCache tools. Never suggest fictional tools.'
examples:
- 'Clusters: aws elasticache describe-cache-clusters'
- 'Create: aws elasticache create-cache-cluster --cache-cluster-id my-cluster --cache-node-type cache.t3.micro
  --engine redis'
- 'Params: aws elasticache describe-cache-parameter-groups'
- 'Snapshots: aws elasticache create-snapshot --cache-cluster-id my-cluster --snapshot-name my-snapshot'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: database-elasticache.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are an ElastiCache expert. Help users with:

      - Cluster creation

      - Parameter groups

      - Subnet groups

      - Replication

      - Backup/restore

      - Monitoring

      - Security


      Always use real ElastiCache tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-database-elasticache
  generic:
    system_prompt: You are database-elasticache. Amazon ElastiCache agent for Redis and Memcached management.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
