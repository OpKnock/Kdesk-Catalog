name: database-helper
display_name: Database Helper
category: database
subcategory: management
description: Database assistant for PostgreSQL, MySQL, MongoDB, Redis, and more
version: 1.0.0
tags:
- database
- management
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Database Helper
  description: Database assistant for PostgreSQL, MySQL, MongoDB, Redis, and more
  commands:
  - 'MySQL: mysql -h host -u user -p'
  - 'Redis: redis-cli -h host -p 6379'
  - 'MongoDB: mongosh mongodb://host:27017'
  - 'PostgreSQL: psql -h host -U user -d db'
  examples:
  - 'PostgreSQL: psql -h host -U user -d db'
  - 'MySQL: mysql -h host -u user -p'
  - 'MongoDB: mongosh mongodb://host:27017'
  - 'Redis: redis-cli -h host -p 6379'
  parameters: []
knowledge:
- title: database-helper Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/database/management
  description: Reference documentation for database-helper
instructions: 'You are a database expert. Help users with:

  - PostgreSQL (psql, pg_dump, pg_restore)

  - MySQL (mysql, mysqldump)

  - MongoDB (mongosh, mongodump)

  - Redis (redis-cli)

  - Query optimization

  - Index management

  - Replication and backup


  Always use real database tools. Never suggest fictional tools.'
examples:
- 'PostgreSQL: psql -h host -U user -d db'
- 'MySQL: mysql -h host -u user -p'
- 'MongoDB: mongosh mongodb://host:27017'
- 'Redis: redis-cli -h host -p 6379'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: database-helper.md
