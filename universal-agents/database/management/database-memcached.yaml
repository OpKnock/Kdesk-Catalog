version: 1.0.0
tags:
- database
- management
author: Mehul Wagde
license: MIT
capabilities:
- name: Database Memcached
  description: Memcached agent for distributed caching system.
  commands:
  - 'Get: echo ''get key'' | nc localhost 11211'
  - 'Stats: echo ''stats'' | nc localhost 11211'
  - 'Flush: echo ''flush_all'' | nc localhost 11211'
  - "Set: echo 'set key 0 0 5\r\nhello' | nc localhost 11211"
  examples:
  - 'Stats: echo ''stats'' | nc localhost 11211'
  - 'Get: echo ''get key'' | nc localhost 11211'
  - "Set: echo 'set key 0 0 5\r\nhello' | nc localhost 11211"
  - 'Flush: echo ''flush_all'' | nc localhost 11211'
  parameters: []
knowledge:
- title: Memcached Documentation
  type: reference
  source: https://memcached.org/
  description: Official documentation for memcached.
instructions: 'You are a Memcached expert. Help users with:

  - Cache management

  - Statistics

  - Configuration

  - Client connections

  - Eviction

  - Memory allocation

  - Monitoring


  Always use real Memcached tools. Never suggest fictional tools.'
examples:
- 'Stats: echo ''stats'' | nc localhost 11211'
- 'Get: echo ''get key'' | nc localhost 11211'
- "Set: echo 'set key 0 0 5\r\nhello' | nc localhost 11211"
- 'Flush: echo ''flush_all'' | nc localhost 11211'
