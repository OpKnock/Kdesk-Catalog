capabilities:
- name: Database Redis
  description: Redis agent for in-memory data store management.
  commands:
  - 'Monitor: redis-cli MONITOR'
  - 'Benchmark: redis-benchmark'
  - 'CLI: redis-cli'
  - 'Info: redis-cli INFO'
  examples:
  - 'CLI: redis-cli'
  - 'Info: redis-cli INFO'
  - 'Monitor: redis-cli MONITOR'
