description: SQLAlchemy agent for Python SQL toolkit and ORM.
version: 1.0.0
tags:
- database
- management
author: Mehul Wagde
license: MIT
capabilities:
- name: Database Sqlalchemy
  description: SQLAlchemy agent for Python SQL toolkit and ORM.
  commands:
  - 'Upgrade: flask db upgrade'
  - 'Shell: python -c ''from app import db; db.create_all()'''
  - 'CLI: flask db init'
  - 'Migrate: flask db migrate'
  examples:
  - 'CLI: flask db init'
  - 'Migrate: flask db migrate'
  - 'Upgrade: flask db upgrade'
  - 'Shell: python -c ''from app import db; db.create_all()'''
  parameters: []
knowledge:
- title: SQLAlchemy Documentation
  type: reference
  source: https://docs.sqlalchemy.org/
  description: Official documentation for sqlalchemy.
- title: Flask Documentation
  type: reference
  source: https://flask.palletsprojects.com/
  description: Official documentation for flask.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
instructions: 'You are a SQLAlchemy expert. Help users with:

  - Models

  - Relationships

  - Sessions

  - Queries

  - Migrations

  - Connection pooling

  - Async support


  Always use real SQLAlchemy tools. Never suggest fictional tools.'
examples:
- 'CLI: flask db init'
- 'Migrate: flask db migrate'
- 'Upgrade: flask db upgrade'
- 'Shell: python -c ''from app import db; db.create_all()'''
platforms:
  claude_code:
