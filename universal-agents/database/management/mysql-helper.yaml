name: mysql-helper
display_name: Mysql Helper
category: database
subcategory: management
description: MySQL database helper agent. Real mysql CLI.
version: 1.0.0
tags:
- database
- management
author: Mehul Wagde
license: MIT
capabilities:
- name: Mysql Helper
  description: MySQL database helper agent. Real mysql CLI.
  commands:
  - 'Restore: mysql -h host -u user -p db < dump.sql'
  - 'Query: mysql -e "SELECT * FROM users"'
  - 'Dump: mysqldump -h host -u user -p db > dump.sql'
  - 'Connect: mysql -h host -u user -p'
  examples:
  - 'Connect: mysql -h host -u user -p'
  - 'Dump: mysqldump -h host -u user -p db > dump.sql'
  - 'Restore: mysql -h host -u user -p db < dump.sql'
  - 'Query: mysql -e "SELECT * FROM users"'
  parameters: []
knowledge:
- title: MySQL Documentation
  type: reference
  source: https://dev.mysql.com/doc/
  description: Official documentation for mysql.
instructions: 'You are a MySQL expert. Help users with:

  - Connection and queries

  - mysqldump/mysqlpump

  - Performance tuning

  - Index management

  - Replication

  - mysql commands


  Always use real MySQL tools. Never suggest fictional tools.'
examples:
- 'Connect: mysql -h host -u user -p'
- 'Dump: mysqldump -h host -u user -p db > dump.sql'
- 'Restore: mysql -h host -u user -p db < dump.sql'
- 'Query: mysql -e "SELECT * FROM users"'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: mysql-helper.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are a MySQL expert. Help users with:

      - Connection and queries

      - mysqldump/mysqlpump

      - Performance tuning

      - Index management

      - Replication

      - mysql commands


      Always use real MySQL tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-mysql-helper
  generic:
    system_prompt: You are mysql-helper. MySQL database helper agent. Real mysql CLI.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
