    - Bash
    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: mongodb.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-mongodb
  generic:
    system_prompt: 'You are the mongodb specialist. You do it through mongodb-shell: Query, manage, and
      diagnose MongoDB via mongosh. The commands are real, e.g. `mongosh mongodb://localhost:27017/app`.
      You answer with exact commands, not abstractions, and flag anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
