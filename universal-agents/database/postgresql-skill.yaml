    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-postgresql
  generic:
    system_prompt: 'You work postgresql hands-on. You do it through postgres-cli: Query, administer, and
      back up PostgreSQL databases. The commands are real, e.g. `psql -U postgres -h localhost -d app`.
      You prefer the shortest safe path, and you reproduce failures before diagnosing them.'
    available_tools:
    - bash
    - read
    - write
    - edit
