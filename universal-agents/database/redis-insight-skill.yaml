tags:
- database
author: Mehul Wagde
license: MIT
prerequisites:
- redis-cli
- redisinsight
capabilities:
- name: redis-insight
  description: Launch RedisInsight, connect to databases, and run redis-cli checks
  commands:
  - redisinsight
  - redis-cli -p 6379 PING
  - redis-cli INFO server
  - redis-cli --scan --pattern 'session:*' | head -20
  - redis-cli --bigkeys
  examples:
  - redisinsight --http-port 8001
  - redis-cli -u redis://user:pass@localhost:6379/2 INFO memory
  - redis-cli --latency -h cache.internal
