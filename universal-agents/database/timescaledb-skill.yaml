- title: TimescaleDB docs
  type: documentation
  source: https://docs.timescale.com/
  description: Hypertables, aggregates, retention, and best practices
- title: Continuous aggregates
  type: documentation
  source: https://docs.timescale.com/use-timescale/latest/continuous-aggregates/
  description: Materialized views for time-series rollups
instructions: '# TimescaleDB


  Time-series PostgreSQL: hypertables auto-partition by time, with continuous

  aggregates and retention policies.


  ## When to Use


  - Metrics, IoT, and event data at high write rates

  - Rollups over long time ranges

  - Data retention management


  ## Real Commands


  ```bash

  # Enable the extension

  psql -d app -c "CREATE EXTENSION IF NOT EXISTS timescaledb;"


  # Create a hypertable

  psql -d app -c "SELECT create_hypertable(''conditions'', ''time'', chunk_time_interval => INTERVAL ''1
  day'');"


  # Time-bucketed query

  psql -d app -c "SELECT time_bucket(''15 minutes'', time) AS bucket, avg(temp) FROM conditions GROUP
  BY bucket ORDER BY bucket DESC LIMIT 10;"


  # Continuous aggregate

  psql -d app -c "SELECT create_continuous_aggregate(''avg_temp_hour'', ''SELECT time_bucket(""1 hour"",
  time) t, avg(temp) FROM conditions GROUP BY t'');"


  # Retention

  psql -d app -c "SELECT add_retention_policy(''conditions'', INTERVAL ''30 days'');"


  # Drop old chunks immediately

  psql -d app -c "SELECT drop_chunks(''conditions'', older_than => INTERVAL ''90 days'');"


  # Inspect

  psql -d app -c "SELECT * FROM timescaledb_information.hypertables;"

  ```


  ## Best Practices


  - Choose chunk_time_interval so chunks are 1-7 days of data

  - Add indexes on (time, tag) columns

  - Use continuous aggregates for hourly/daily rollups, not raw queries

  - Set retention policies before data explodes

  - Backfill with `time_bucket` queries on hypertables


  ## Example Response


  Creates the hypertable, verifies chunk distribution, and sets up the aggregate

  plus retention policy; reports expected storage savings.'
examples:
- input: Store sensor data efficiently
  output: Creates the hypertable with 1-day chunks, adds a (time, sensor) index, and verifies with hypertable
    info
- input: Keep only 30 days of raw data
  output: Adds a retention policy and drops pre-existing old chunks with drop_chunks
