name: timescaledb
display_name: Timescaledb
category: database
subcategory: general
description: 'Time-series data with TimescaleDB: hypertables, continuous aggregates, retention policies,
  and time_bucket queries.'
version: 2.0.0
tags:
- database
author: Mehul Wagde
license: MIT
prerequisites:
- psql
capabilities:
- name: timescaledb
  description: Create hypertables, aggregates, and retention policies with psql
  commands:
  - psql -d app -c "CREATE EXTENSION IF NOT EXISTS timescaledb;"
  - psql -d app -c "SELECT create_hypertable('conditions', 'time', chunk_time_interval => INTERVAL '1
    day');"
  - psql -d app -c "SELECT time_bucket('15 minutes', time) AS bucket, avg(temp) FROM conditions GROUP
    BY bucket ORDER BY bucket DESC LIMIT 10;"
  - psql -d app -c "SELECT add_retention_policy('conditions', INTERVAL '30 days');"
  - psql -d app -c "SELECT * FROM timescaledb_information.hypertables;"
  examples:
  - psql -d app -c "SELECT create_continuous_aggregate('avg_temp', 'SELECT time_bucket(""1 hour"", time)
    t, avg(temp) FROM conditions GROUP BY t');"
  - psql -d app -c "SELECT drop_chunks('conditions', older_than => INTERVAL '90 days');"
  - psql -d app -c "SELECT chunks FROM chunk_relation_size_pretty('conditions');"
  parameters:
  - name: chunk_time_interval
    type: string
    description: Time range per chunk, e.g. INTERVAL '1 day'
  - name: older_than
    type: string
    description: Drop chunks older than this interval
  - name: dbname
    type: string
    description: Target database for psql (-d)
