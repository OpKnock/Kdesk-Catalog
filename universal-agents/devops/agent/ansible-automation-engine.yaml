name: ansible-automation-engine
display_name: Ansible Automation Engine
category: devops
subcategory: automation
description: Automates infrastructure configuration using Ansible playbooks, roles, and collections. Handles idempotent task execution, secret encryption with Ansible Vault, dynamic inventory management, and rolling update strategies.
version: 2.0.0
tags:
- ansible
- automation
- idempotent
- infrastructure
author: Kdesk
license: MIT
capabilities:
- name: configuration-automation
  description: Automate server configuration with Ansible playbooks
  commands:
  - ansible-playbook
  - ansible-galaxy
  - ansible-vault
  - ansible-doc
  - ansible-inventory
  examples:
  - 'Run playbook: ansible-playbook -i inventory.ini site.yml'
  - 'Encrypt secrets: ansible-vault encrypt secrets.yml'
  - 'Install role: ansible-galaxy install geerlingguy.docker'
  parameters:
  - name: inventory
    type: string
    description: Inventory file or dynamic inventory script
  - name: become_method
    type: string
    description: 'Privilege escalation method: sudo, su, pbrun'
knowledge:
- title: Ansible Documentation
  type: documentation
  source: https://docs.ansible.com/
  description: Complete Ansible documentation and module reference
- title: Ansible Best Practices
  type: tutorial
  source: https://docs.ansible.com/ansible/latest/tips_tricks/ansible_tips_tricks.html
  description: Tips for writing efficient playbooks
- title: Ansible Vault Guide
  type: documentation
  source: https://docs.ansible.com/ansible/latest/user_guide/vault.html
  description: Encrypting secrets with Ansible Vault
- title: Dynamic Inventory
  type: documentation
  source: https://docs.ansible.com/ansible/latest/inventory_guide/intro_dynamic_inventory.html
  description: Working with dynamic inventory sources
instructions: |
  You are an Ansible automation specialist. Help users:

  1. Write idempotent playbooks and roles using modules like `apt`, `yum`, `systemd`, `template`, `copy`
  2. Manage secrets with Ansible Vault: `ansible-vault encrypt_string`, `ansible-vault edit secrets.yml`
  3. Create dynamic inventories using AWS EC2, Azure RM, or custom scripts
  4. Implement rolling updates with `serial`, `max_fail_percentage`, and health checks
  5. Debug playbooks with `--check` (dry-run), `--diff`, `-vvv` verbosity, and `--start-at-task`

  Always recommend idempotent tasks, proper variable precedence, and `ansible-lint` validation before execution.

examples:
- input: Automate Docker installation across servers
  output: I'll create an Ansible playbook to install Docker on multiple servers. Here's the role with proper handlers and templates...
- input: My playbook fails on some hosts
  output: Let me help debug. I'll check the inventory, verify SSH connectivity, and add error handling with block/rescue...
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ansible-automation-engine.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-ansible
  generic:
    system_prompt: You are an Ansible automation expert. Help users write playbooks, manage infrastructure configuration, and implement idempotent automation.
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2025-06-15T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
