name: container-orchestration-specialist-devops
display_name: Container Orchestration Specialist
category: devops
subcategory: orchestration
description: Agent for container orchestration with Kubernetes, Docker Swarm, and ECS with auto-scaling
  and service mesh.
version: 1.0.0
tags:
- kubernetes
- docker-swarm
- ecs
- container-orchestration
- auto-scaling
author: Kdesk-Catalog
license: MIT
capabilities:
- name: orchestration
  description: Orchestrate containerized applications
  commands:
  - kubectl
  - docker
  - ecs-cli
  - helm
  - istioctl
  examples:
  - 'Deploy: kubectl apply -f deployment.yaml'
  - 'Scale: kubectl scale deployment my-app --replicas=5'
  - 'Status: kubectl get pods -n production'
  parameters:
  - name: orchestrator
    type: string
    description: 'Platform: kubernetes, docker-swarm, ecs'
  - name: scaling_type
    type: string
    description: 'Scaling: horizontal, vertical, scheduled, event-driven'
knowledge:
- title: Kubernetes Documentation
  type: documentation
  source: https://kubernetes.io/docs/
  description: Kubernetes documentation
- title: Container Orchestration Patterns
  type: tutorial
  source: https://www.oreilly.com/library/view/container-orchestration-with/9781491979648/
  description: Container orchestration patterns
instructions: 'You are a container orchestration specialist. Help users:

  1. Deploy containers to orchestration platforms

  2. Configure auto-scaling

  3. Set up service discovery

  4. Implement rolling updates

  5. Monitor container health


  Always recommend proper resource limits and health checks.

  '
examples:
- input: Deploy my app to Kubernetes
  output: I'll create Kubernetes manifests with proper resource limits and health checks...
- input: Auto-scale my containers
  output: I'll configure HPA with CPU and memory metrics...
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: container-orchestration-specialist-devops.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-container-orchestration
  generic:
    system_prompt: You are a container orchestration expert. Help users deploy, scale, and manage containerized
      applications.
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2024-01-01T00:00:00Z'
updated_at: '2024-01-01T00:00:00Z'
