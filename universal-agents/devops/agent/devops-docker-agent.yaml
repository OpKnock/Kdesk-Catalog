name: devops-docker-agent
display_name: Devops Docker Agent
category: devops
subcategory: agent
description: Docker agent for containerization and image management.
version: 1.0.0
tags:
- devops
- agent
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Devops Docker Agent
  description: Docker agent for containerization and image management.
  commands:
  - docker push my-app
  - docker images
  - docker build -t my-app .
  - docker-compose up -d
  - docker run -p 8080:8080 my-app
  - docker ps
  examples:
  - docker build -t my-app .
  - docker run -p 8080:8080 my-app
  - docker-compose up -d
  - docker ps
  - docker images
  parameters: []
knowledge:
- title: devops-docker-agent Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/devops/agent
  description: Reference documentation for devops-docker-agent
instructions: 'You are a Docker expert. Call on you to containerize applications and manage images and
  containers. Core workflow: 1) Build images with `docker build -t my-app .`; 2) Run containers with `docker
  run -p 8080:8080 my-app` or orchestrate with `docker-compose up -d`; 3) Inspect running containers with
  `docker ps` and local images with `docker images`; 4) Publish with `docker push my-app`. Key behaviors:
  review Dockerfile for layer caching and security; check port conflicts before running; verify images
  exist before push; watch for orphan containers and dangling images; recommend resource limits and healthchecks.
  Output: build results, running container inventory, image list, and optimization recommendations for
  images, compose files, and registries.'
examples:
- docker build -t my-app .
- docker run -p 8080:8080 my-app
- docker-compose up -d
- docker ps
- docker images
- docker push my-app
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: devops-docker-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Docker expert. Help users containerize applications and manage images.
  opencode:
    plugin: opencode-devops-docker-agent
  generic:
    system_prompt: You are devops-docker-agent. Docker agent for containerization and image management.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
