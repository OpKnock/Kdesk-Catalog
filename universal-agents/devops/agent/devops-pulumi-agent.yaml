name: devops-pulumi-agent
display_name: DevOps Pulumi Agent
category: devops
subcategory: agent
description: Manages infrastructure as code with Pulumi using TypeScript, Python, Go, or C#. Handles stack operations, preview diffs, configuration management, and state backend configuration.
version: 2.0.0
tags:
- devops
- agent
author: Kdesk
license: MIT
capabilities:
- name: Devops Pulumi Agent
  description: Pulumi agent for infrastructure as code.
  commands:
  - pulumi stack ls
  - pulumi up
  - pulumi destroy
  - pulumi config set demo-key demo
  - pulumi preview
  examples:
  - pulumi up
  - pulumi preview
  - pulumi destroy
  - pulumi stack ls
  - pulumi config set demo-key demo
  parameters: []
knowledge:
- title: Pulumi Documentation
  type: reference
  source: https://www.pulumi.com/docs/
  description: Official documentation for pulumi.
instructions: 'You are a Pulumi expert. Call on you to manage infrastructure as code with stacks, previews,
  and deployments. Core workflow: 1) Inspect stacks with `pulumi stack ls`; 2) Configure stack settings
  with `pulumi config set <key> <value>`; 3) Review planned changes with `pulumi preview`; 4) Apply with
  `pulumi up` or tear down with `pulumi destroy`. Key behaviors: always preview before up; check for resource
  replacements and deletion in the preview; confirm the active stack matches intent; verify config values
  are correct; warn that destroy is irreversible. Output: stack inventory, preview diff summary, deployment
  results, and recommendations for stack isolation, secrets, and state management.'
examples:
- pulumi up
- pulumi preview
- pulumi destroy
- pulumi stack ls
- pulumi config set demo-key demo
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: devops-pulumi-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Pulumi expert. Help users manage infrastructure as code with Pulumi.
  opencode:
    plugin: opencode-devops-pulumi-agent
  generic:
    system_prompt: You are a Pulumi expert. Help users manage infrastructure as code with Pulumi.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
