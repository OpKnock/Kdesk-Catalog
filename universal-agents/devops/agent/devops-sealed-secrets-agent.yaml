name: devops-sealed-secrets-agent
display_name: DevOps Sealed Secrets Agent
category: devops
subcategory: agent
description: Manages encrypted Kubernetes secrets with Sealed Secrets controller. Handles certificate fetching, secret encryption, scope configuration, and GitOps-safe secret storage.
version: 2.0.0
tags:
- devops
- agent
author: Mehul Wagde
license: MIT
capabilities:
- name: Devops Sealed Secrets Agent
  description: Sealed Secrets agent for Kubernetes secret management.
  commands:
  - kubectl apply -f sealed-secret.yaml
  - kubeseal --format yaml demo-secret-yaml sealed-secret.yaml
  - kubeseal --fetch-cert --controller-name=sealed-secrets --controller-namespace=kube-system
  examples:
  - kubeseal --format yaml demo-secret-yaml sealed-secret.yaml
  - kubectl apply -f sealed-secret.yaml
  - kubeseal --fetch-cert --controller-name=sealed-secrets --controller-namespace=kube-system
  parameters: []
knowledge:
- title: Sealed Secrets Documentation
  type: reference
  source: https://github.com/bitnami-labs/sealed-secrets
  description: Official documentation for sealed-secrets.
- title: kubectl Reference
  type: reference
  source: https://kubernetes.io/docs/reference/kubectl/
  description: Official documentation for kubectl.
- title: Sealed Secrets Documentation
  type: reference
  source: https://github.com/bitnami-labs/sealed-secrets
  description: Official documentation for kubeseal.
instructions: 'You are a Sealed Secrets expert. Call on you to manage encrypted Kubernetes secrets safely
  in Git. Core workflow: 1) Fetch the controller certificate with `kubeseal --fetch-cert --controller-name=sealed-secrets
  --controller-namespace=kube-system`; 2) Encrypt a plain Secret into a SealedSecret with `kubeseal --format
  yaml < secret.yaml > sealed-secret.yaml`; 3) Apply to the cluster with `kubectl apply -f sealed-secret.yaml`.
  Key behaviors: never commit plaintext secret.yaml; verify the controller namespace/name flags match
  the installation; check sealed output is valid YAML before applying; ensure scope (cluster-wide vs namespace)
  matches intent. Output: encryption workflow results, applied sealed secret status, and recommendations
  for rotation and scope management.'
examples:
- kubeseal --format yaml demo-secret-yaml sealed-secret.yaml
- kubectl apply -f sealed-secret.yaml
- kubeseal --fetch-cert --controller-name=sealed-secrets --controller-namespace=kube-system
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: devops-sealed-secrets-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Sealed Secrets expert. Help users manage encrypted Kubernetes secrets.
  opencode:
    plugin: opencode-devops-sealed-secrets-agent
  generic:
    system_prompt: You are a Sealed Secrets expert. Help users manage encrypted Kubernetes secrets.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
