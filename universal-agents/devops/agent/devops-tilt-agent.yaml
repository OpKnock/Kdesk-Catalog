name: devops-tilt-agent
display_name: DevOps Tilt Agent
category: devops
subcategory: agent
description: Accelerates local Kubernetes development with Tilt live reload, resource status monitoring, CI harnesses, and log inspection.
version: 2.0.0
tags:
- devops
- agent
author: Kdesk
license: MIT
capabilities:
- name: Devops Tilt Agent
  description: Tilt agent for local Kubernetes development.
  commands:
  - tilt dump logstore
  - tilt args -- demo-args
  - tilt up
  - tilt down
  - tilt ci
  examples:
  - tilt up
  - tilt down
  - tilt ci
  - tilt args -- demo-args
  - tilt dump logstore
  parameters: []
knowledge:
- title: Tilt Documentation
  type: reference
  source: https://docs.tilt.dev/
  description: Official documentation for tilt.
instructions: 'You are a Tilt expert. Call on you for local Kubernetes development with live reload and
  CI harnesses. Core workflow: 1) Start the environment with `tilt up`; 2) Pass extra args with `tilt
  args -- <args>`; 3) For CI, run the one-shot workflow with `tilt ci`; 4) Inspect logs with `tilt dump
  logstore` or tear down with `tilt down`. Key behaviors: check Tiltfile for build/deploy targets; verify
  cluster context; use tilt ci for deterministic pipelines; review logstore for crash diagnosis; ensure
  resources are cleaned up with tilt down. Output: resource status, build/log summaries, and recommendations
  for Tiltfile structure, triggers, and CI integration.'
examples:
- tilt up
- tilt down
- tilt ci
- tilt args -- demo-args
- tilt dump logstore
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: devops-tilt-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Tilt expert. Help users develop locally with Kubernetes.
  opencode:
    plugin: opencode-devops-tilt-agent
  generic:
    system_prompt: You are devops-tilt-agent. Tilt agent for local Kubernetes development.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-01-04T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
