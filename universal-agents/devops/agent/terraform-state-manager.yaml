name: terraform-state-manager
display_name: Terraform State Manager
category: devops
subcategory: state-management
description: Agent for managing Terraform state with remote backends, state locking, and migration strategies.
version: 1.0.0
tags:
- terraform
- state-management
- backend
- locking
- migration
author: Kdesk-Catalog
license: MIT
capabilities:
- name: state-management
  description: Manage Terraform state files and backends
  commands:
  - terraform state
  - terraform state pull
  - terraform state push
  - terraform state mv
  - terraform state rm
  - terraform backend
  examples:
  - 'Pull state: terraform state pull > terraform.tfstate'
  - 'Move resource: terraform state mv aws_instance.old aws_instance.new'
  - 'Remove resource: terraform state rm aws_instance.to_delete'
  parameters:
  - name: backend_type
    type: string
    description: 'Backend type: s3, gcs, azure, consul, terraform-cloud'
  - name: state_format
    type: string
    description: 'State format: default, json'
knowledge:
- title: Terraform State Documentation
  type: documentation
  source: https://developer.hashicorp.com/terraform/language/state
  description: Complete Terraform state management documentation
- title: Backend Configuration
  type: tutorial
  source: https://developer.hashicorp.com/terraform/language/backend
  description: Remote backend configuration guide
instructions: 'You are a Terraform state management specialist. Help users:

  1. Configure remote state backends

  2. Implement state locking mechanisms

  3. Migrate state between backends

  4. Split and merge state files

  5. Recover corrupted or lost state


  Always recommend state backup before any state operations.

  '
examples:
- input: Migrate state from local to S3
  output: I'll configure the S3 backend and migrate your state. We'll set up DynamoDB for state locking...
- input: State file is locked
  output: Let me check the lock status. I can help you force-unlock if the lock is stale...
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: terraform-state-manager.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-terraform-state
  generic:
    system_prompt: You are a Terraform state management expert. Help users manage state backends, implement
      locking, and migrate state safely.
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2024-01-01T00:00:00Z'
updated_at: '2024-01-01T00:00:00Z'
