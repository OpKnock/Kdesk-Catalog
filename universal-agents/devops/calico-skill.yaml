name: calico
display_name: calico
category: devops
subcategory: general
description: 'Kubernetes networking and security with Calico: network policies, IPAM, and node status
  via calicoctl.'
version: 2.0.0
tags:
- devops
author: Mehul Wagde
license: MIT
prerequisites:
- calicoctl
capabilities:
- name: calicoctl
  description: Manage Calico network policies, IP pools, and node health
  commands:
  - calicoctl node status
  - calicoctl get nodes
  - calicoctl apply -f policy.yaml
  - calicoctl get networkpolicy -o yaml
  - calicoctl ipam show
  examples:
  - calicoctl get ippool -o wide
  - calicoctl delete networkpolicy deny-all --namespace=default
  - calicoctl get bgppeer -o yaml
  parameters:
  - name: namespace
    type: string
    description: Namespace scope for policies
  - name: output
    type: string
    description: 'Output format: yaml, json, wide'
  - name: filename
    type: string
    description: Policy manifest file for apply/delete (-f)
knowledge:
- title: Calico docs
  type: documentation
  source: https://docs.tigera.io/calico/
  description: Networking, policies, and calicoctl reference
- title: Calico network policy guide
  type: documentation
  source: https://docs.tigera.io/calico/latest/network-policy/
  description: Policy types and examples
instructions: "# Calico\n\nKubernetes CNI with policy enforcement: secure network policies, IP pool\n\
  management, and cluster health.\n\n## When to Use\n\n- Enforcing namespace/tenant isolation\n- Controlling\
  \ egress to the internet\n- Diagnosing pod connectivity issues\n\n## Real Commands\n\n```bash\n# Cluster\
  \ state\nsudo calicoctl node status\nsudo calicoctl get nodes\n\n# Policies\nsudo calicoctl apply -f\
  \ policy.yaml\nsudo calicoctl get networkpolicy -o yaml\nsudo calicoctl get networkpolicy --namespace=default\
  \ -o wide\nsudo calicoctl delete networkpolicy deny-all --namespace=default\n\n# IPAM\nsudo calicoctl\
  \ ipam show\nsudo calicoctl get ippool -o wide\n\n# BGP\nsudo calicoctl get bgppeer -o yaml\n```\n\n\
  ## Policy Example (policy.yaml)\n\n```yaml\napiVersion: projectcalico.org/v3\nkind: NetworkPolicy\n\
  metadata:\n  name: app-only-ingress\n  namespace: payments\nspec:\n  selector: app == 'api'\n  ingress:\n\
  \    - action: Allow\n      protocol: TCP\n      source:\n        namespaceSelector: projectcalico.org/name\
  \ == 'web'\n      destination:\n        ports: [8080]\n```\n\n## Best Practices\n\n- Start with default-deny\
  \ per namespace, then allow what's needed\n- Use namespace selectors, not hardcoded IPs\n- Test policy\
  \ changes on staging namespaces first\n- Check `calicoctl node status` when pods can't reach each other\n\
  - Watch IP pool exhaustion with ipam show\n\n## Example Response\n\nFor connectivity failure: checks\
  \ node status, IPAM, and policy selectors, then\napplies the correct policy and verifies traffic."
examples:
- input: Isolate the payments namespace
  output: Applies default-deny plus allow rules, verifies with calicoctl get networkpolicy
- input: Pods can't talk to each other
  output: Checks calicoctl node status and IPAM, reviews policies, and fixes the selector or pool
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: calico.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-calico
  generic:
    system_prompt: 'This is your domain: calico. You do it through calicoctl: Manage Calico network policies,
      IP pools, and node health. The commands are real, e.g. `calicoctl node status`. You run and verify
      the real CLI commands before you claim anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2025-03-20T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
