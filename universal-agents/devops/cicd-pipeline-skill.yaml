name: cicd-pipeline
display_name: Cicd Pipeline
category: devops
subcategory: general
description: Designs pipeline-as-code flows, runs CI locally with act, and enforces pipeline quality gates
  with linters and security scanners.
version: 2.0.0
tags:
- devops
author: Mehul Wagde
license: MIT
prerequisites:
- act
- actionlint
- hadolint
- semgrep
- shellcheck
- trufflehog
capabilities:
- name: local-pipeline-runtime
  description: Execute GitHub Actions workflows locally without a runner using nektos/act.
  commands:
  - act -l
  - act push -j test
  - act pull_request --container-architecture linux/amd64
  - act --secret-file .secrets -W .github/workflows
  - act --reuse
  examples:
  - act -l
  - act push -j test
  - act --secret-file .secrets -W .github/workflows
  parameters:
  - name: event
    type: string
    description: Event to simulate, e.g. push, pull_request, schedule
  - name: job
    type: string
    description: Single job to execute, e.g. -j test
  - name: secret-file
    type: string
    description: File containing secrets for local run
- name: pipeline-quality-gates
  description: Enforce pipeline quality with linting, shell checks, and image scanning in CI.
  commands:
  - actionlint .github/workflows/ci.yml
  - shellcheck scripts/*.sh
  - hadolint Dockerfile
  - trufflehog filesystem --only-verified .
  - semgrep ci --config auto
  examples:
  - actionlint .github/workflows/ci.yml
  - shellcheck deploy.sh && hadolint Dockerfile
  - trufflehog filesystem --only-verified .
  parameters:
  - name: config-path
    type: string
    description: Path to workflow or Dockerfile to lint
  - name: severity
    type: string
    description: Minimum severity threshold for scanners
knowledge:
- title: act - Run GitHub Actions locally
  type: documentation
  source: https://github.com/nektos/act
  description: Local execution of GitHub Actions workflows
- title: GitHub Actions Security Hardening
  type: documentation
  source: https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions
  description: Guards against script injection and unintended secret exposure
- title: Hadolint
  type: documentation
  source: https://github.com/hadolint/hadolint
  description: Dockerfile linter with best-practice rules
instructions: '# Pipeline-as-Code Engineering


  Build reproducible CI/CD pipelines that run the same way in CI and locally.


  ## What This Skill Does


  - Runs GitHub Actions workflows locally with act for fast iteration

  - Adds lint/security gates that fail merges early

  - Converts ad-hoc build scripts into reusable CI steps

  - Validates YAML, shell, and Dockerfile quality in one pass


  ## When to Use


  - Iterating on a workflow without pushing dozens of commits

  - Adding security scanning (secrets, SAST) to a pipeline

  - Standardizing quality gates across repos


  ## Real Commands


  ```bash

  # Local workflow runs

  act -l                                  # list available jobs

  act push -j test                        # run only ''test'' job

  act push --secret-file .secrets         # provide local secrets

  act --reuse                             # reuse containers between runs


  # Quality gates

  actionlint .github/workflows/*.yml      # workflow syntax + anti-patterns

  shellcheck scripts/deploy.sh            # bash correctness

  hadolint Dockerfile                     # Dockerfile lint

  trufflehog filesystem --only-verified . # leaked secrets

  semgrep ci --config auto                # SAST on the repo

  ```


  ## Standard Gate Order


  1. actionlint (workflow validity)

  2. shellcheck (scripts)

  3. hadolint (containers)

  4. unit tests

  5. secret scanning

  6. SAST/container scan

  7. deploy (staging) then promote to prod


  ## Best Practices


  - Keep the pipeline fast: fail lint in under a minute

  - Never interpolate untrusted input directly into a script step (injection)

  - Use `$GITHUB_ACTION_PATH` and quoting around step scripts

  - Run act with the same container image as production runners

  - Add `permissions:` blocks to least-privilege every job'
examples:
- input: I want to test my GitHub Actions workflow locally
  output: Agent installs act, runs act -l to list jobs, then act push -j build to reproduce the failure
    locally
- input: Add security checks to our pipeline
  output: Agent adds actionlint, trufflehog, and semgrep steps to the ci workflow with fail-fast severity
    thresholds
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: cicd-pipeline.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-cicd-pipeline
  generic:
    system_prompt: 'This is your domain: Cicd Pipeline. You do it through local-pipeline-runtime: Execute
      GitHub Actions workflows locally without a runner using nektos/act. The commands are real, e.g.
      `act -l`. You work hands-on and only report outcomes you have observed.'
    available_tools:
    - bash
    - read
    - write
    - edit
