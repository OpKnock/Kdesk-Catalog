name: container-orchestration
display_name: Container Orchestration
category: devops
subcategory: general
description: 'Operates container orchestration platforms (Kubernetes, Docker Swarm, Nomad): cluster bootstrap,
  scheduling, scaling, and health checks.'
version: 2.0.0
tags:
- devops
author: Mehul Wagde
license: MIT
prerequisites:
- docker
- kubeadm
- kubectl
- nomad
capabilities:
- name: kubernetes-cluster-ops
  description: Bootstrap and inspect Kubernetes clusters with kubeadm and kubectl.
  commands:
  - kubeadm init --pod-network-cidr=10.244.0.0/16
  - kubeadm token create --print-join-command
  - kubectl cluster-info
  - kubectl get nodes -o wide
  - kubectl get componentstatuses
  - kubectl top node
  examples:
  - kubeadm init --pod-network-cidr=10.244.0.0/16
  - kubectl cluster-info
  - kubectl get nodes -o wide
  parameters:
  - name: pod-network-cidr
    type: string
    description: CIDR for pod network, must match CNI plugin
  - name: node-name
    type: string
    description: Node to inspect or drain
- name: swarm-and-nomad
  description: Manage Docker Swarm services and HashiCorp Nomad jobs as alternative orchestrators.
  commands:
  - docker swarm init --advertise-addr 10.0.0.5
  - docker service create --name web --replicas 3 nginx
  - docker node ls
  - nomad job run web.nomad
  - nomad job status web
  - nomad node status
  examples:
  - docker service create --name web --replicas 3 nginx
  - nomad job run web.nomad
  - nomad node status
  parameters:
  - name: service-name
    type: string
    description: Swarm service name
  - name: replicas
    type: integer
    description: Desired replica count
  - name: job-file
    type: string
    description: Nomad HCL job file path
knowledge:
- title: Kubernetes Concepts
  type: documentation
  source: https://kubernetes.io/docs/concepts/overview/
  description: Cluster architecture, controllers, scheduling, and workloads
- title: Docker Swarm Documentation
  type: documentation
  source: https://docs.docker.com/engine/swarm/
  description: Swarm mode services, nodes, and stack deployment
- title: Nomad Documentation
  type: documentation
  source: https://developer.hashicorp.com/nomad/docs
  description: Job specs, allocations, and drivers for Nomad
instructions: "# Container Orchestration\n\nRun and troubleshoot container orchestrators: Kubernetes,\
  \ Docker Swarm, and HashiCorp Nomad.\n\n## What This Skill Does\n\n- Bootstraps clusters (kubeadm, swarm\
  \ init, nomad dev agent)\n- Schedules workloads: Deployments, services, jobs, allocations\n- Scales,\
  \ updates, and performs rolling operations\n- Diagnoses node health and scheduling failures\n\n## When\
  \ to Use\n\n- Choosing or operating an orchestrator for a workload\n- Investigating why a workload is\
  \ unschedulable or unhealthy\n- Migrating between Swarm, Kubernetes, or Nomad\n\n## Real Commands\n\n\
  ```bash\n# Kubernetes bootstrap\nkubeadm init --pod-network-cidr=10.244.0.0/16\nkubeadm token create\
  \ --print-join-command\nkubectl cluster-info\nkubectl get nodes -o wide\nkubectl top node\n\n# Docker\
  \ Swarm\ndocker swarm init --advertise-addr 10.0.0.5\ndocker service create --name web --replicas 3\
  \ nginx:alpine\ndocker service ls\ndocker node ls\ndocker stack deploy -c stack.yml app\n\n# Nomad\n\
  nomad agent -dev &\nnomad job run web.nomad\nnomad job status web\nnomad alloc logs <alloc-id>\nnomad\
  \ node status\n```\n\n## Nomad Job Example\n\n```hcl\njob \"web\" {\n  datacenters = [\"dc1\"]\n  group\
  \ \"web\" {\n    count = 3\n    task \"nginx\" {\n      driver = \"docker\"\n      config {\n      \
  \  image = \"nginx:alpine\"\n      }\n      resources {\n        cpu    = 100\n        memory = 128\n\
  \      }\n    }\n  }\n}\n```\n\n## Best Practices\n\n- Use kubeadm's `--print-join-command` for repeatable\
  \ joins\n- Pin CNI and orchestrator versions together\n- Set resource requests/limits for every workload\n\
  - Drain nodes before maintenance; plan for quorum loss in etcd/swarm managers\n- Use stack/job files\
  \ (declarative) over ad-hoc imperative commands"
examples:
- input: Why is my pod pending forever?
  output: Agent checks kubectl describe pod for FailedScheduling events, inspects resource requests vs
    node capacity, and proposes a fix (limits, taints, or node pool sizing)
- input: Set up a 3-node swarm
  output: Agent runs docker swarm init on the manager, then generates worker join tokens and connects
    two workers
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: container-orchestration.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-container-orchestration
  generic:
    system_prompt: 'You own Container Orchestration end to end. You do it through kubernetes-cluster-ops:
      Bootstrap and inspect Kubernetes clusters with kubeadm and kubectl. The commands are real, e.g.
      `kubeadm init --pod-network-cidr=10.244.0.0/16`. You prefer the shortest safe path, and you reproduce
      failures before diagnosing them.'
    available_tools:
    - bash
    - read
    - write
    - edit
