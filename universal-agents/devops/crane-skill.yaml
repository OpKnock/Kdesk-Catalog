name: crane
display_name: crane
category: devops
subcategory: general
description: 'Manipulates container images and registries with google/crane: copy, move, tag, export,
  and validate image manifests and digests.'
version: 2.0.0
tags:
- devops
author: Kdesk-Catalog
license: MIT
prerequisites:
- crane
capabilities:
- name: registry-operations
  description: Copy, move, tag, and delete images across registries without a full daemon.
  commands:
  - crane copy nginx:latest registry.example.com/nginx:latest
  - crane move old.example.com/app:v1 new.example.com/app:v1
  - crane tag nginx:latest v1.0.0
  - crane delete registry.example.com/app:v1
  - crane ls registry.example.com/app
  - crane validate --remote registry.example.com/app
  examples:
  - crane copy nginx:latest registry.example.com/nginx:latest
  - crane tag nginx:latest v1.0.0
  - crane ls registry.example.com/app
  parameters:
  - name: src
    type: string
    description: Source image or repo reference
  - name: dest
    type: string
    description: Destination repo reference
  - name: tag
    type: string
    description: Tag to apply
- name: manifest-and-digest
  description: Inspect manifests, digests, and export images for offline analysis.
  commands:
  - crane manifest nginx:latest | jq .
  - crane digest nginx:latest
  - crane export nginx:latest nginx.tar
  - crane index ls registry.example.com/app
  - crane auth login registry.example.com -u user -p pass
  examples:
  - crane digest nginx:latest
  - crane export nginx:latest /tmp/nginx.tar
  - crane manifest nginx:latest | jq -r .mediaType
  parameters:
  - name: image
    type: string
    description: Image reference to inspect
  - name: output
    type: string
    description: Output tar file for export
knowledge:
- title: crane CLI Reference
  type: documentation
  source: https://github.com/google/go-containerregistry/blob/main/cmd/crane/README.md
  description: 'All crane subcommands: copy, export, digest, ls, validate'
- title: go-containerregistry Project
  type: documentation
  source: https://github.com/google/go-containerregistry
  description: Library and tools for registry interaction
instructions: '# crane Registry Tooling


  Copy, tag, and inspect container images across registries using google/crane — no daemon required.


  ## What This Skill Does


  - Copies and moves images between registries (mirroring, air-gapped transfer)

  - Reads OCI/Docker manifests and computes digests

  - Exports images to tarballs for offline or malware analysis

  - Validates images and lists tags/repos

  - Auth to private registries with plain or credential helpers


  ## When to Use


  - Mirroring images into a private registry

  - Pinning digests for supply-chain safety

  - Verifying that an image was not tampered with

  - Air-gapped environments where `docker pull` is unavailable


  ## Real Commands


  ```bash

  # Copy between registries

  crane copy nginx:latest registry.example.com/nginx:latest

  crane copy nginx:latest registry.example.com/nginx:latest -p     # preserve exact tag list


  # Move / tag / delete

  crane move old.example.com/app:v1 new.example.com/app:v1

  crane tag nginx:latest v1.0.0

  crane delete registry.example.com/app:v1


  # Inspect

  crane manifest nginx:latest

  crane digest nginx:latest

  crane ls registry.example.com/app

  crane index ls registry.example.com/app


  # Export and validate

  crane export nginx:latest /tmp/nginx.tar

  crane validate --remote --tarball /tmp/nginx.tar registry.example.com/app


  # Auth

  crane auth login registry.example.com -u user -p pass

  ```


  ## Best Practices


  - Always pin images by digest in production (`image@sha256:...`)

  - Use `crane validate --remote` in CI to catch broken images early

  - Copy with `-p` when preserving tags matters (e.g. `latest`)

  - Verify registry ACLs with `crane auth login` before large transfers'
examples:
- input: Mirror our public images to an internal registry
  output: Agent writes a script using crane copy for each image, runs crane validate on results, and pins
    digests into deployment manifests
- input: Check what tags exist for app in our registry
  output: Agent runs crane ls registry.example.com/app and presents the tag list with commit info
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: crane.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-crane
  generic:
    system_prompt: 'You are the crane specialist. You do it through registry-operations: Copy, move, tag,
      and delete images across registries without a full daemon. The commands are real, e.g. `crane copy
      nginx:latest registry.example.com/nginx:latest`. You answer with exact commands, not abstractions,
      and flag anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
