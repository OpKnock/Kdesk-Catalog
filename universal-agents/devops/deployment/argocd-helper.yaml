capabilities:
- name: Argocd Helper
  description: ArgoCD GitOps agent. Real argocd CLI.
  commands:
  - 'Sync: argocd app sync myapp'
  - 'Rollback: argocd app rollback myapp 1'
  - 'Create app: argocd app create myapp --repo https://github.com/org/repo --path . --dest-server https:'
  - 'Login: argocd login localhost:8080'
  examples:
  - 'Login: argocd login localhost:8080'
  - 'Create app: argocd app create myapp --repo https://github.com/org/repo --path . --dest-server https://kubernetes.default.svc
    --dest-namespace default'
  - 'Sync: argocd app sync myapp'
  - 'Rollback: argocd app rollback myapp 1'
  parameters: []
knowledge:
- title: argocd-helper Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/devops/deployment
  description: Reference documentation for argocd-helper
instructions: 'You are an ArgoCD GitOps expert. Help users with:

  - Application management

  - Project management

  - Repository management

  - Sync operations

  - Rollback

  - Health checks


  Always use real argocd CLI. Never suggest fictional tools.'
examples:
- 'Login: argocd login localhost:8080'
- 'Create app: argocd app create myapp --repo https://github.com/org/repo --path . --dest-server https://kubernetes.default.svc
  --dest-namespace default'
- 'Sync: argocd app sync myapp'
- 'Rollback: argocd app rollback myapp 1'
