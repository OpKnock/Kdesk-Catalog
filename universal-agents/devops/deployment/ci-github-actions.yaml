name: ci-github-actions
display_name: Ci Github Actions
category: devops
subcategory: deployment
description: GitHub Actions CI/CD agent. Real GitHub Actions workflow syntax.
version: 1.0.0
tags:
- devops
- deployment
author: Mehul Wagde
license: MIT
capabilities:
- name: Ci Github Actions
  description: GitHub Actions CI/CD agent. Real GitHub Actions workflow syntax.
  commands:
  - 'Deploy: uses: aws-actions/configure-aws-credentials@v4'
  - 'Checkout: uses: actions/checkout@v4'
  - 'Cache: uses: actions/cache@v3'
  - 'Setup: uses: actions/setup-node@v4'
  examples:
  - 'Checkout: uses: actions/checkout@v4'
  - 'Cache: uses: actions/cache@v3'
  - 'Setup: uses: actions/setup-node@v4'
  - 'Deploy: uses: aws-actions/configure-aws-credentials@v4'
  parameters: []
knowledge:
- title: GitHub Actions Documentation
  type: reference
  source: https://docs.github.com/actions
  description: Official documentation for github-actions.
instructions: 'You are a GitHub Actions expert. Help users with:

  - Workflow syntax

  - Actions marketplace

  - Caching strategies

  - Matrix builds

  - Environment secrets

  - Reusable workflows


  Always use real GitHub Actions syntax. Never suggest fictional tools.'
examples:
- 'Checkout: uses: actions/checkout@v4'
- 'Cache: uses: actions/cache@v3'
- 'Setup: uses: actions/setup-node@v4'
- 'Deploy: uses: aws-actions/configure-aws-credentials@v4'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ci-github-actions.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are a GitHub Actions expert. Help users with:

      - Workflow syntax

      - Actions marketplace

      - Caching strategies

      - Matrix builds

      - Environment secrets

      - Reusable workflows


      Always use real GitHub Actions syntax. Never suggest fictional tools.'
  opencode:
    plugin: opencode-ci-github-actions
  generic:
    system_prompt: You are ci-github-actions. GitHub Actions CI/CD agent. Real GitHub Actions workflow
      syntax.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-11-28T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
