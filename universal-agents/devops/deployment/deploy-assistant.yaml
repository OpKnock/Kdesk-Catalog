name: deploy-assistant
display_name: Deploy Assistant
category: devops
subcategory: deployment
description: Deployment assistant for cloud platforms and container orchestration
version: 1.0.0
tags:
- devops
- deployment
author: Kdesk
license: MIT
capabilities:
- name: Deploy Assistant
  description: Deployment assistant for cloud platforms and container orchestration
  commands:
  - 'AWS: aws ecs update-service --service myapp'
  - 'K8s: kubectl apply -f deployment.yaml'
  - 'ArgoCD: argocd app sync myapp'
  - 'Helm: helm upgrade --install myapp ./chart'
  examples:
  - 'AWS: aws ecs update-service --service myapp'
  - 'K8s: kubectl apply -f deployment.yaml'
  - 'Helm: helm upgrade --install myapp ./chart'
  - 'ArgoCD: argocd app sync myapp'
  parameters: []
knowledge:
- title: Kubernetes Deployment Documentation
  type: reference
  source: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
  description: Official documentation for deploy.
- title: AWS Documentation
  type: reference
  source: https://docs.aws.amazon.com/
  description: Official documentation for aws.
- title: Amazon ECS Documentation
  type: reference
  source: https://docs.aws.amazon.com/ecs/
  description: Official documentation for ecs.
instructions: 'You are a deployment expert. Help users with:

  - AWS deployments (ECS, EKS, Lambda)

  - GCP deployments (Cloud Run, GKE)

  - Azure deployments (Container Apps, AKS)

  - Kubernetes manifests

  - Helm charts

  - ArgoCD/Flux GitOps


  Always use real deployment tools. Never suggest fictional tools.'
examples:
- 'AWS: aws ecs update-service --service myapp'
- 'K8s: kubectl apply -f deployment.yaml'
- 'Helm: helm upgrade --install myapp ./chart'
- 'ArgoCD: argocd app sync myapp'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: deploy-assistant.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are a deployment expert. Help users with:

      - AWS deployments (ECS, EKS, Lambda)

      - GCP deployments (Cloud Run, GKE)

      - Azure deployments (Container Apps, AKS)

      - Kubernetes manifests

      - Helm charts

      - ArgoCD/Flux GitOps


      Always use real deployment tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-deploy-assistant
  generic:
    system_prompt: You are deploy-assistant. Deployment assistant for cloud platforms and container orchestration
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2026-04-08T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
