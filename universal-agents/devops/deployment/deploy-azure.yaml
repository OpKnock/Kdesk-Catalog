name: deploy-azure
display_name: Deploy Azure
category: devops
subcategory: deployment
description: Azure deployment agent for Container Apps, AKS, Functions, and more.
version: 1.0.0
tags:
- devops
- deployment
author: Kdesk
license: MIT
capabilities:
- name: Deploy Azure
  description: Azure deployment agent for Container Apps, AKS, Functions, and more.
  commands:
  - 'Container Apps: az containerapp up --name myapp'
  - 'Functions: az functionapp create'
  - 'ACR: az acr build --registry myregistry --image myapp'
  - 'AKS: az aks create --resource-group rg'
  examples:
  - 'Container Apps: az containerapp up --name myapp'
  - 'AKS: az aks create --resource-group rg'
  - 'Functions: az functionapp create'
  - 'ACR: az acr build --registry myregistry --image myapp'
  parameters: []
knowledge:
- title: Kubernetes Deployment Documentation
  type: reference
  source: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
  description: Official documentation for deploy.
- title: Azure Kubernetes Service Documentation
  type: reference
  source: https://learn.microsoft.com/azure/aks/
  description: Official documentation for aks.
instructions: 'You are an Azure deployment expert. Help users with:

  - Container Apps

  - AKS clusters

  - Azure Functions

  - Azure DevOps

  - Container Registry

  - az CLI


  Always use real az CLI. Never suggest fictional tools.'
examples:
- 'Container Apps: az containerapp up --name myapp'
- 'AKS: az aks create --resource-group rg'
- 'Functions: az functionapp create'
- 'ACR: az acr build --registry myregistry --image myapp'
