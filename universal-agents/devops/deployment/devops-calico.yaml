name: devops-calico
display_name: Devops Calico
category: devops
subcategory: deployment
description: Calico agent for Kubernetes networking and network policies.
version: 1.0.0
tags:
- devops
- deployment
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Devops Calico
  description: Calico agent for Kubernetes networking and network policies.
  commands:
  - 'IPAM: calicoctl ipam show'
  - 'Apply: calicoctl apply -f policy.yaml'
  - 'Policies: calicoctl get networkpolicy'
  - 'Status: calicoctl node status'
  examples:
  - 'Status: calicoctl node status'
  - 'Policies: calicoctl get networkpolicy'
  - 'IPAM: calicoctl ipam show'
  - 'Apply: calicoctl apply -f policy.yaml'
  parameters: []
knowledge:
- title: devops-calico Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/devops/deployment
  description: Reference documentation for devops-calico
instructions: 'You are a Calico expert. Help users with:

  - Network policies

  - IPAM

  - BGP peering

  - Felix configuration

  - Typha

  - Application layer policies

  - Egress gateway


  Always use real Calico tools. Never suggest fictional tools.'
examples:
- 'Status: calicoctl node status'
- 'Policies: calicoctl get networkpolicy'
- 'IPAM: calicoctl ipam show'
- 'Apply: calicoctl apply -f policy.yaml'
