name: devops-cilium-hubble
display_name: Devops Cilium Hubble
category: devops
subcategory: deployment
description: Hubble agent for Cilium network observability.
version: 1.0.0
tags:
- devops
- deployment
author: Mehul Wagde
license: MIT
capabilities:
- name: Devops Cilium Hubble
  description: Hubble agent for Cilium network observability.
  commands:
  - 'UI: hubble-ui'
  - 'Observe: hubble observe'
  - 'Services: hubble observe --to-service default/my-service'
  - 'Flows: hubble observe --namespace default'
  examples:
  - 'Observe: hubble observe'
  - 'UI: hubble-ui'
  - 'Flows: hubble observe --namespace default'
  - 'Services: hubble observe --to-service default/my-service'
  parameters: []
knowledge:
- title: Hubble Observability
  type: reference
  source: https://docs.cilium.io/en/stable/observability/hubble/
  description: Official documentation for cilium-hubble.
instructions: 'You are a Hubble expert. Help users with:

  - Network flow visualization

  - Service dependency mapping

  - DNS monitoring

  - HTTP monitoring

  - Network policy verification

  - Performance metrics


  Always use real Hubble tools. Never suggest fictional tools.'
examples:
- 'Observe: hubble observe'
- 'UI: hubble-ui'
- 'Flows: hubble observe --namespace default'
- 'Services: hubble observe --to-service default/my-service'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: devops-cilium-hubble.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are a Hubble expert. Help users with:

      - Network flow visualization

      - Service dependency mapping

      - DNS monitoring

      - HTTP monitoring

      - Network policy verification

      - Performance metrics


      Always use real Hubble tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-devops-cilium-hubble
  generic:
    system_prompt: You are devops-cilium-hubble. Hubble agent for Cilium network observability.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
