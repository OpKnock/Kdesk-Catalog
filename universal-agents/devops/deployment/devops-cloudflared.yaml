name: devops-cloudflared
display_name: Devops Cloudflared
category: devops
subcategory: deployment
description: Cloudflare Tunnel agent for secure access.
version: 1.0.0
tags:
- devops
- deployment
author: Kdesk
license: MIT
capabilities:
- name: Devops Cloudflared
  description: Cloudflare Tunnel agent for secure access.
  commands:
  - 'Login: cloudflared tunnel login'
  - 'Create: cloudflared tunnel create my-tunnel'
  - 'Route: cloudflared tunnel route dns my-tunnel hostname.example.com'
  - 'Run: cloudflared tunnel run my-tunnel'
  examples:
  - 'Login: cloudflared tunnel login'
  - 'Create: cloudflared tunnel create my-tunnel'
  - 'Route: cloudflared tunnel route dns my-tunnel hostname.example.com'
  - 'Run: cloudflared tunnel run my-tunnel'
  parameters: []
knowledge:
- title: Cloudflare Tunnel Documentation
  type: reference
  source: https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/
  description: Official documentation for cloudflared.
- title: DNS and BIND Documentation
  type: reference
  source: https://bind9.readthedocs.io/
  description: Official documentation for dns.
instructions: 'You are a Cloudflare Tunnel expert. Help users with:

  - Tunnel creation

  - Route configuration

  - DNS management

  - Access policies

  - WARP

  - Certificates

  - Monitoring


  Always use real Cloudflare Tunnel tools. Never suggest fictional tools.'
examples:
- 'Login: cloudflared tunnel login'
- 'Create: cloudflared tunnel create my-tunnel'
- 'Route: cloudflared tunnel route dns my-tunnel hostname.example.com'
- 'Run: cloudflared tunnel run my-tunnel'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: devops-cloudflared.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are a Cloudflare Tunnel expert. Help users with:

      - Tunnel creation

      - Route configuration

      - DNS management

      - Access policies

      - WARP

      - Certificates

      - Monitoring


      Always use real Cloudflare Tunnel tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-devops-cloudflared
  generic:
    system_prompt: You are devops-cloudflared. Cloudflare Tunnel agent for secure access.
    available_tools:
    - bash
    - read
