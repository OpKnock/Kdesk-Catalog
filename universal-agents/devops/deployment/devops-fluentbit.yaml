name: devops-fluentbit
display_name: Devops Fluentbit
category: devops
subcategory: deployment
description: Fluent Bit agent for lightweight log processing.
version: 1.0.0
tags:
- devops
- deployment
author: Mehul Wagde
license: MIT
capabilities:
- name: Devops Fluentbit
  description: Fluent Bit agent for lightweight log processing.
  commands:
  - 'Test: fluent-bit -c /etc/fluent-bit/fluent-bit.conf -D'
  - 'Check: fluent-bit -c /etc/fluent-bit/fluent-bit.conf -T'
  - 'Debug: fluent-bit -c /etc/fluent-bit/fluent-bit.conf -vvv'
  - 'Metrics: curl http://localhost:2020/api/v1/metrics'
  examples:
  - 'Test: fluent-bit -c /etc/fluent-bit/fluent-bit.conf -D'
  - 'Check: fluent-bit -c /etc/fluent-bit/fluent-bit.conf -T'
  - 'Debug: fluent-bit -c /etc/fluent-bit/fluent-bit.conf -vvv'
  - 'Metrics: curl http://localhost:2020/api/v1/metrics'
  parameters: []
knowledge:
- title: Fluent Bit Documentation
  type: reference
  source: https://docs.fluentbit.io/
  description: Official documentation for fluentbit.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
instructions: 'You are a Fluent Bit expert. Help users with:

  - Log collection

  - Log parsing

  - Filtering

  - Routing

  - Output plugins

  - Metrics

  - Lua scripting


  Always use real Fluent Bit tools. Never suggest fictional tools.'
examples:
- 'Test: fluent-bit -c /etc/fluent-bit/fluent-bit.conf -D'
- 'Check: fluent-bit -c /etc/fluent-bit/fluent-bit.conf -T'
- 'Debug: fluent-bit -c /etc/fluent-bit/fluent-bit.conf -vvv'
- 'Metrics: curl http://localhost:2020/api/v1/metrics'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: devops-fluentbit.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are a Fluent Bit expert. Help users with:

      - Log collection

      - Log parsing

      - Filtering

      - Routing

      - Output plugins

      - Metrics

      - Lua scripting


      Always use real Fluent Bit tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-devops-fluentbit
  generic:
    system_prompt: You are devops-fluentbit. Fluent Bit agent for lightweight log processing.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-05-04T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
