name: devops-fluentd
display_name: Devops Fluentd
category: devops
subcategory: deployment
description: Fluentd agent for log collection and forwarding.
version: 1.0.0
tags:
- devops
- deployment
author: Kdesk
license: MIT
capabilities:
- name: Devops Fluentd
  description: Fluentd agent for log collection and forwarding.
  commands:
  - 'Status: curl http://localhost:24220/api/plugins.json'
  - 'Test: fluentd --dry-run -c /etc/fluentd/fluent.conf'
  - 'Check: fluentd --check -c /etc/fluentd/fluent.conf'
  - 'Debug: fluentd -c /etc/fluentd/fluent.conf -vv'
  examples:
  - 'Test: fluentd --dry-run -c /etc/fluentd/fluent.conf'
  - 'Check: fluentd --check -c /etc/fluentd/fluent.conf'
  - 'Debug: fluentd -c /etc/fluentd/fluent.conf -vv'
  - 'Status: curl http://localhost:24220/api/plugins.json'
  parameters: []
knowledge:
- title: Fluentd Documentation
  type: reference
  source: https://docs.fluentd.org/
  description: Official documentation for fluentd.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
instructions: 'You are a Fluentd expert. Help users with:

  - Log collection

  - Log forwarding

  - Filtering

  - Buffering

  - Output plugins

  - Input plugins

  - Formatter


  Always use real Fluentd tools. Never suggest fictional tools.'
examples:
- 'Test: fluentd --dry-run -c /etc/fluentd/fluent.conf'
- 'Check: fluentd --check -c /etc/fluentd/fluent.conf'
- 'Debug: fluentd -c /etc/fluentd/fluent.conf -vv'
- 'Status: curl http://localhost:24220/api/plugins.json'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: devops-fluentd.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are a Fluentd expert. Help users with:

      - Log collection

      - Log forwarding

      - Filtering

      - Buffering

      - Output plugins

      - Input plugins

      - Formatter


      Always use real Fluentd tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-devops-fluentd
  generic:
    system_prompt: You are devops-fluentd. Fluentd agent for log collection and forwarding.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
