name: devops-infracost
display_name: Devops Infracost
category: devops
subcategory: deployment
description: Infracost agent for cloud cost estimates in CI/CD.
version: 1.0.0
tags:
- devops
- deployment
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Devops Infracost
  description: Infracost agent for cloud cost estimates in CI/CD.
  commands:
  - 'CI: infracost ci run'
  - 'Diff: infracost diff --path .'
  - 'Budget: infracost budget check --path .'
  - 'Estimate: infracost breakdown --path .'
  - infracost output --path . --format html --out cost-report.html
  examples:
  - 'Estimate: infracost breakdown --path .'
  - 'Diff: infracost diff --path .'
  - 'Budget: infracost budget check --path .'
  - 'CI: infracost ci run'
  parameters:
  - name: path
    type: string
    description: CLI flag --path observed in capability commands
knowledge:
- title: devops-infracost Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/devops/deployment
  description: Reference documentation for devops-infracost
instructions: 'You are an Infracost expert. Help users with:

  - Cost estimates

  - Budget checks

  - Diff comparisons

  - CI/CD integration

  - Custom pricing

  - Policy as code

  - Slack notifications


  Always use real Infracost tools. Never suggest fictional tools.'
examples:
- 'Estimate: infracost breakdown --path .'
- 'Diff: infracost diff --path .'
- 'Budget: infracost budget check --path .'
- 'CI: infracost ci run'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: devops-infracost.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are an Infracost expert. Help users with:

      - Cost estimates

      - Budget checks

      - Diff comparisons

      - CI/CD integration

      - Custom pricing

      - Policy as code

      - Slack notifications


      Always use real Infracost tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-devops-infracost
  generic:
    system_prompt: You are devops-infracost. Infracost agent for cloud cost estimates in CI/CD.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2024-01-01T00:00:00Z'
updated_at: '2024-01-01T00:00:00Z'
