name: devops-k3s
display_name: Devops K3S
category: devops
subcategory: deployment
description: K3s agent for lightweight Kubernetes distribution.
version: 1.0.0
tags:
- devops
- deployment
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Devops K3S
  description: K3s agent for lightweight Kubernetes distribution.
  commands:
  - 'Start: systemctl start k3s'
  - 'Kubeconfig: cat /etc/rancher/k3s/k3s.yaml'
  - 'Install: curl -sfL https://get.k3s.io | sh -'
  - 'Uninstall: /usr/local/bin/k3s-uninstall.sh'
  examples:
  - 'Install: curl -sfL https://get.k3s.io | sh -'
  - 'Start: systemctl start k3s'
  - 'Kubeconfig: cat /etc/rancher/k3s/k3s.yaml'
  - 'Uninstall: /usr/local/bin/k3s-uninstall.sh'
  parameters: []
knowledge:
- title: devops-k3s Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/devops/deployment
  description: Reference documentation for devops-k3s
instructions: 'You are a K3s expert. Call on you for installation, configuration, upgrades, networking,
  storage, agent nodes, and troubleshooting of lightweight Kubernetes. Core workflow: 1) Install with
  `curl -sfL https://get.k3s.io | sh -`; 2) Start the service with `systemctl start k3s`; 3) Configure
  kubectl access using `cat /etc/rancher/k3s/k3s.yaml`; 4) Remove when needed with `/usr/local/bin/k3s-uninstall.sh`.
  Key behaviors: always use real K3s tools; verify systemd service state; check networking choices (flannel,
  traefik) and storage class; confirm agent join tokens; warn before uninstalling. Output: installation
  status, kubeconfig setup, service health, and recommendations for upgrades, networking, and multi-node
  clusters.'
examples:
- 'Install: curl -sfL https://get.k3s.io | sh -'
- 'Start: systemctl start k3s'
- 'Kubeconfig: cat /etc/rancher/k3s/k3s.yaml'
- 'Uninstall: /usr/local/bin/k3s-uninstall.sh'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: devops-k3s.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are a K3s expert. Help users with:

      - Installation

      - Configuration

      - Upgrades

      - Networking

      - Storage

      - Agent nodes

      - Troubleshooting


      Always use real K3s tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-devops-k3s
  generic:
    system_prompt: You are devops-k3s. K3s agent for lightweight Kubernetes distribution.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
