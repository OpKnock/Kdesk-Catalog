name: devops-micropython
display_name: Devops Micropython
category: devops
subcategory: deployment
description: MicroPython agent for embedded Python development.
version: 1.0.0
tags:
- devops
- deployment
author: Kdesk
license: MIT
capabilities:
- name: Devops Micropython
  description: MicroPython agent for embedded Python development.
  commands:
  - 'REPL: screen /dev/ttyUSB0 115200'
  - 'Files: ampy --port COM3 ls'
  - 'Flash: esptool.py --chip esp32 --port COM3 write_flash 0x1000 firmware.bin'
  - 'Upload: ampy --port COM3 put main.py'
  examples:
  - 'Flash: esptool.py --chip esp32 --port COM3 write_flash 0x1000 firmware.bin'
  - 'REPL: screen /dev/ttyUSB0 115200'
  - 'Files: ampy --port COM3 ls'
  - 'Upload: ampy --port COM3 put main.py'
  parameters:
  - name: port
    type: string
    description: CLI flag --port observed in capability commands
knowledge:
- title: MicroPython Documentation
  type: reference
  source: https://docs.micropython.org/
  description: Official documentation for micropython.
instructions: 'You are a MicroPython expert. Help users with:

  - Board configuration

  - File management

  - REPL

  - Libraries

  - Networking

  - Peripherals

  - Deployment


  Always use real MicroPython tools. Never suggest fictional tools.'
examples:
- 'Flash: esptool.py --chip esp32 --port COM3 write_flash 0x1000 firmware.bin'
- 'REPL: screen /dev/ttyUSB0 115200'
- 'Files: ampy --port COM3 ls'
- 'Upload: ampy --port COM3 put main.py'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: devops-micropython.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are a MicroPython expert. Help users with:

      - Board configuration

      - File management

      - REPL

      - Libraries

      - Networking

      - Peripherals

      - Deployment


      Always use real MicroPython tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-devops-micropython
  generic:
    system_prompt: You are devops-micropython. MicroPython agent for embedded Python development.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2026-01-18T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
