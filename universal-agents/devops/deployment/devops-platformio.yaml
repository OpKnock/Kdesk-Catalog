  - 'Build: pio run'
  - 'Monitor: pio device monitor'
  examples:
  - 'Init: pio init'
  - 'Build: pio run'
  - 'Upload: pio run --target upload'
  - 'Monitor: pio device monitor'
  parameters: []
knowledge:
- title: PlatformIO Documentation
  type: reference
  source: https://docs.platformio.org/
  description: Official documentation for platformio.
- title: Prometheus Documentation
  type: reference
  source: https://prometheus.io/docs/introduction/overview/
