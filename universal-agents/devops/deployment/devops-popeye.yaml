name: devops-popeye
display_name: Devops Popeye
category: devops
subcategory: deployment
description: Popeye agent for Kubernetes cluster resource sanitizer.
version: 1.0.0
tags:
- devops
- deployment
author: Mehul Wagde
license: MIT
capabilities:
- name: Devops Popeye
  description: Popeye agent for Kubernetes cluster resource sanitizer.
  commands:
  - 'Output: popeye -k ~/.kube/config -o json'
  - 'Spinach: popeye -k ~/.kube/config -f spinach.yaml'
  - 'Namespace: popeye -k ~/.kube/config -n default'
  - 'Scan: popeye -k ~/.kube/config'
  examples:
  - 'Scan: popeye -k ~/.kube/config'
  - 'Namespace: popeye -k ~/.kube/config -n default'
  - 'Output: popeye -k ~/.kube/config -o json'
  - 'Spinach: popeye -k ~/.kube/config -f spinach.yaml'
  parameters:
  - name: k
    type: string
    description: CLI flag --k observed in capability commands
knowledge:
- title: Popeye Documentation
  type: reference
  source: https://popeye.fairwinds.com/
  description: Official documentation for popeye.
instructions: 'You are a Popeye expert. Help users with:

  - Cluster scanning

  - Resource validation

  - Best practices

  - Security checks

  - Performance issues

  - Reporting


  Always use real Popeye tools. Never suggest fictional tools.'
examples:
- 'Scan: popeye -k ~/.kube/config'
- 'Namespace: popeye -k ~/.kube/config -n default'
- 'Output: popeye -k ~/.kube/config -o json'
- 'Spinach: popeye -k ~/.kube/config -f spinach.yaml'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: devops-popeye.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are a Popeye expert. Help users with:

      - Cluster scanning

      - Resource validation

      - Best practices

      - Security checks

      - Performance issues

      - Reporting


      Always use real Popeye tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-devops-popeye
  generic:
    system_prompt: You are devops-popeye. Popeye agent for Kubernetes cluster resource sanitizer.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-01-13T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
