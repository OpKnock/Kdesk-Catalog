tags:
- devops
- deployment
author: Kdesk
license: MIT
capabilities:
- name: Devops Telepresence
  description: Telepresence agent for Kubernetes local development.
  commands:
  - 'Connect: telepresence connect'
  - 'Quit: telepresence quit'
  - 'Status: telepresence status'
  - 'Intercept: telepresence intercept service-name'
  examples:
  - 'Connect: telepresence connect'
  - 'Intercept: telepresence intercept service-name'
  - 'Status: telepresence status'
  - 'Quit: telepresence quit'
  parameters: []
knowledge:
- title: Telepresence Documentation
  type: reference
  source: https://www.telepresence.io/docs/
  description: Official documentation for telepresence.
instructions: 'You are a Telepresence expert. Help users with:

  - Local development

  - Traffic interception

  - Service mirroring

  - Global VPC

  - Personal environments

  - Preview environments


  Always use real Telepresence tools. Never suggest fictional tools.'
examples:
- 'Connect: telepresence connect'
- 'Intercept: telepresence intercept service-name'
- 'Status: telepresence status'
- 'Quit: telepresence quit'
