    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are a Telepresence expert. Help users with:

      - Local development

      - Traffic interception

      - Service mirroring

      - Global VPC

      - Personal environments

      - Preview environments


      Always use real Telepresence tools. Never suggest fictional tools.'
  opencode:
