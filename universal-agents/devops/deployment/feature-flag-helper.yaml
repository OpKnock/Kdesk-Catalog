name: feature-flag-helper
display_name: Feature Flag Helper
category: devops
subcategory: deployment
description: Feature flag assistant for LaunchDarkly, Unleash, Flagsmith, and homegrown solutions
version: 1.0.0
tags:
- devops
- deployment
author: Mehul Wagde
license: MIT
capabilities:
- name: Feature Flag Helper
  description: Feature flag assistant for LaunchDarkly, Unleash, Flagsmith, and homegrown solutions
  commands:
  - 'SDK: ldclient.variation(''flag'', user, false)'
  - 'Unleash: unleash-cli feature create'
  - 'Flags: curl -X POST /api/admin/features'
  - 'LaunchDarkly: ldcli flags create --key new-feature'
  examples:
  - 'LaunchDarkly: ldcli flags create --key new-feature'
  - 'Unleash: unleash-cli feature create'
  - 'Flags: curl -X POST /api/admin/features'
  - 'SDK: ldclient.variation(''flag'', user, false)'
  parameters: []
knowledge:
- title: LaunchDarkly Documentation
  type: reference
  source: https://docs.launchdarkly.com/
  description: Official documentation for feature-flag.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
instructions: 'You are a feature flag expert. Help users with:

  - Flag creation and targeting

  - LaunchDarkly SDKs

  - Unleash self-hosted

  - Flagsmith open source

  - Percentage rollouts

  - Kill switches

  - Experimentation


  Always use real feature flag tools. Never suggest fictional tools.'
examples:
- 'LaunchDarkly: ldcli flags create --key new-feature'
- 'Unleash: unleash-cli feature create'
- 'Flags: curl -X POST /api/admin/features'
- 'SDK: ldclient.variation(''flag'', user, false)'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: feature-flag-helper.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are a feature flag expert. Help users with:

      - Flag creation and targeting

      - LaunchDarkly SDKs

      - Unleash self-hosted

      - Flagsmith open source

      - Percentage rollouts

      - Kill switches

      - Experimentation


      Always use real feature flag tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-feature-flag-helper
  generic:
    system_prompt: You are feature-flag-helper. Feature flag assistant for LaunchDarkly, Unleash, Flagsmith,
      and homegrown solutions
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-02-12T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
