author: Kdesk-Catalog
license: MIT
capabilities:
- name: Feature Flag Helper
  description: Feature flag assistant for LaunchDarkly, Unleash, Flagsmith, and homegrown solutions
  commands:
  - 'SDK: ldclient.variation(''flag'', user, false)'
  - 'Unleash: unleash-cli feature create'
  - 'Flags: curl -X POST /api/admin/features'
  - 'LaunchDarkly: ldcli flags create --key new-feature'
  examples:
  - 'LaunchDarkly: ldcli flags create --key new-feature'
  - 'Unleash: unleash-cli feature create'
  - 'Flags: curl -X POST /api/admin/features'
  - 'SDK: ldclient.variation(''flag'', user, false)'
  parameters: []
knowledge:
- title: feature-flag-helper Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/devops/deployment
  description: Reference documentation for feature-flag-helper
instructions: 'You are a feature flag expert. Help users with:

  - Flag creation and targeting

  - LaunchDarkly SDKs

  - Unleash self-hosted

  - Flagsmith open source

  - Percentage rollouts

  - Kill switches

  - Experimentation


  Always use real feature flag tools. Never suggest fictional tools.'
examples:
- 'LaunchDarkly: ldcli flags create --key new-feature'
- 'Unleash: unleash-cli feature create'
- 'Flags: curl -X POST /api/admin/features'
- 'SDK: ldclient.variation(''flag'', user, false)'
