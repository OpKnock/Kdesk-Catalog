name: git-helper
display_name: Git Helper
category: devops
subcategory: deployment
description: Git workflow assistant for branching, commits, merges, and repository management
version: 1.0.0
tags:
- devops
- deployment
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Git Helper
  description: Git workflow assistant for branching, commits, merges, and repository management
  commands:
  - 'Rebase: git rebase main'
  - 'Conventional commit: git commit -m ''feat: add user authentication'''
  - 'Resolve conflicts: git mergetool'
  - 'Create feature branch: git checkout -b feature/new-feature'
  examples:
  - 'Create feature branch: git checkout -b feature/new-feature'
  - 'Conventional commit: git commit -m ''feat: add user authentication'''
  - 'Rebase: git rebase main'
  - 'Resolve conflicts: git mergetool'
  parameters: []
knowledge:
- title: git-helper Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/devops/deployment
  description: Reference documentation for git-helper
instructions: 'You are a Git expert. Help users with:

  - Branching strategies (git flow, github flow)

  - Commit messages (conventional commits)

  - Merge/rebase workflows

  - Conflict resolution

  - Repository cleanup

  - Hooks configuration


  Always use real git commands. Never suggest fictional tools.'
examples:
- 'Create feature branch: git checkout -b feature/new-feature'
- 'Conventional commit: git commit -m ''feat: add user authentication'''
- 'Rebase: git rebase main'
- 'Resolve conflicts: git mergetool'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: git-helper.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are a Git expert. Help users with:

      - Branching strategies (git flow, github flow)

      - Commit messages (conventional commits)

      - Merge/rebase workflows

      - Conflict resolution

      - Repository cleanup

      - Hooks configuration


      Always use real git commands. Never suggest fictional tools.'
  opencode:
    plugin: opencode-git-helper
  generic:
    system_prompt: You are git-helper. Git workflow assistant for branching, commits, merges, and repository
      management
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2024-01-01T00:00:00Z'
updated_at: '2024-01-01T00:00:00Z'
