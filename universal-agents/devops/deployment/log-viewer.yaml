name: log-viewer
display_name: Log Analysis & Viewer
category: devops
subcategory: deployment
description: Views, searches, and analyzes application logs across containers, Kubernetes, and system
  services with jq-powered structured analysis.
version: 2.0.0
tags:
- deployment
- logging
- debugging
author: Mehul Wagde
license: MIT
capabilities:
- name: realtime-tail
  description: Tail logs in real-time across docker, kubectl, journalctl, and files
  commands:
  - tail -f app.log
  - docker logs --follow --tail 100 container-name
  - kubectl logs -f deployment/app --tail=100
  - journalctl -u app.service -f
  - stern "app-*" --since 5m
  examples:
  - 'Follow app: tail -f app.log'
  - 'Docker: docker logs --follow --tail 100 app'
  - 'K8s: kubectl logs -f deployment/app --tail=100'
  parameters:
  - name: target
    type: string
    description: 'Log target: file, container, pod, or service'
  - name: since
    type: string
    description: Time window (e.g., 5m, 1h)
- name: structured-search
  description: Search and filter logs with grep, ripgrep, and jq for JSON logs
  commands:
  - rg "ERROR|WARN" app.log --no-line-number
  - grep -c "Exception" app.log
  - jq -r 'select(.level == "error") | .message' access.log.jsonl
  - jq -r 'select(.request_id == "abc123") | {ts, level, msg}' app.log.jsonl
  - awk '{print $1}' access.log | sort | uniq -c | sort -rn | head
  examples:
  - 'Find errors: rg ''ERROR|WARN'' app.log'
  - 'JSON filter: jq -r ''select(.level == "error") | .message'' app.log.jsonl'
  - 'Top IPs: awk ''{print $1}'' access.log | sort | uniq -c | sort -rn | head'
  parameters:
  - name: pattern
    type: string
    description: Regex or text pattern to search
  - name: file
    type: string
    description: Log file path
- name: context-extraction
  description: Extract surrounding context around error occurrences
  commands:
  - grep -A 20 -B 5 "panic" app.log
  - sed -n '100,150p' app.log
  - jq -c 'select(.trace_id == "trace-42") | {ts, span_id, message}' logs.jsonl
  examples:
  - 'Context around panic: grep -A 20 -B 5 ''panic'' app.log'
  - 'Slice lines: sed -n ''100,150p'' app.log'
  - 'Trace filter: jq -c ''select(.trace_id == "trace-42")'' logs.jsonl'
  parameters:
  - name: line_range
    type: string
    description: Line range to view (start,end)
- name: log-rotation
  description: Analyze and manage log files including rotation, compression, and size
  commands:
  - du -sh /var/log/app*
  - logrotate -d /etc/logrotate.d/app
  - gzip -k app.log.1
  - find /var/log -name "*.log" -size +100M -print
  examples:
  - 'Check size: du -sh /var/log/app*'
  - 'Dry-run rotate: logrotate -d /etc/logrotate.d/app'
  - 'Find large logs: find /var/log -name ''*.log'' -size +100M -print'
  parameters:
  - name: log_dir
    type: string
    description: Directory containing logs
knowledge:
- title: jq Manual
  type: documentation
  source: https://jqlang.github.io/jq/manual/
  description: JSON processor for structured log analysis
- title: Kubernetes Logging
  type: documentation
  source: https://kubernetes.io/docs/concepts/cluster-administration/logging/
  description: K8s log collection and access patterns
- title: Docker Logging Drivers
  type: documentation
  source: https://docs.docker.com/config/containers/logging/
  description: Docker log driver configuration
instructions: 'You are a log analysis specialist. Help users:

  1. Tail and monitor logs in real-time

  2. Search and filter logs with regex and structured queries

  3. Extract context around errors for debugging

  4. Analyze patterns: error rates, slow requests, request chains

  5. Manage log rotation and retention


  When debugging:

  - ALWAYS get context around the error (grep -A/-B) before theorizing

  - For JSON logs, prefer jq select queries over grep

  - Use trace/request IDs to correlate across services

  - Check timestamps to establish event ordering


  Follow these steps for any error:

  1. `grep -A 20 -B 5 "<error>" <log>` for context

  2. `jq -r ''select(.level == "error")'' logs.jsonl` for structured data

  3. Correlate with request_id or trace_id

  4. Check previous timestamp entries for the trigger


  Anti-patterns to avoid:

  - Reading entire log files (use head/tail/range)

  - Grepping binary files

  - Ignoring structured fields (use jq)

  '
examples:
- input: My app is throwing errors, what do I check?
  output: 'Let me find the errors first: rg ''ERROR|Exception'' app.log --no-line-number, then get context
    with grep -A 20 -B 5 around each occurrence...'
- input: How many 500 errors did we get in the last hour?
  output: 'I''ll query with jq: jq -r ''select(.status >= 500) | .ts'' access.log.jsonl | wc -l, and show
    the top failing endpoints...'
- input: Find the request that failed for user 12345
  output: 'I''ll search for the request_id: jq -r ''select(.user_id == 12345 and .status >= 500) | {request_id,
    ts}'' access.log.jsonl'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Grep
    - Glob
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: log-viewer.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-log-viewer
  generic:
    system_prompt: You are a Log Analysis agent. View, search, and analyze application logs with real
      CLI tools.
    available_tools:
    - bash
    - read
    - grep
    - glob
