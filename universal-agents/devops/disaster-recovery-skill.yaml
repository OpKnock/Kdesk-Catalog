name: disaster-recovery
display_name: Disaster Recovery
category: devops
subcategory: general
description: 'Implements Kubernetes disaster recovery with Velero: schedule backups, perform restores,
  migrate clusters, and verify RTO/RPO.'
version: 2.0.0
tags:
- devops
author: Mehul Wagde
license: MIT
prerequisites:
- velero
capabilities:
- name: velero-backups
  description: Create on-demand and scheduled backups of cluster resources and persistent volumes.
  commands:
  - velero install --provider aws --bucket velero-backups --secret-file ./credentials-velero
  - velero backup create full-$(date +%F) --include-namespaces app,db
  - velero schedule create nightly --schedule='0 2 * * *' --include-namespaces app
  - velero backup get
  - velero backup describe full-2026-08-10
  - velero backup logs full-2026-08-10
  examples:
  - velero backup create full-$(date +%F)
  - velero schedule create nightly --schedule='0 2 * * *'
  - velero backup describe full-2026-08-10 --details
  parameters:
  - name: schedule
    type: string
    description: Cron expression for scheduled backups
  - name: include-namespaces
    type: string
    description: Comma-separated namespaces to back up
- name: velero-restores
  description: Restore clusters from backups and migrate between clusters.
  commands:
  - velero restore create --from-backup full-2026-08-10
  - velero restore get
  - velero restore describe restore-20260810120000
  - velero restore logs restore-20260810120000
  - velero backup create restore --from-backup full-2026-08-10 --include-namespaces db
  examples:
  - velero restore create --from-backup full-2026-08-10
  - velero restore describe restore-20260810120000
  - velero restore logs restore-20260810120000
  parameters:
  - name: from-backup
    type: string
    description: Source backup name
  - name: namespace-mappings
    type: object
    description: Map old namespace to new namespace
