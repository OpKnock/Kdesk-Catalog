name: docker
display_name: docker
category: devops
subcategory: general
description: 'Builds, runs, and manages containers and images with the docker CLI: images, volumes, networks,
  and container lifecycle.'
version: 2.0.0
tags:
- devops
author: Mehul Wagde
license: MIT
prerequisites:
- docker
capabilities:
- name: container-lifecycle
  description: Run, stop, exec into, and remove containers with full flag control.
  commands:
  - docker run -d --name web -p 8080:80 nginx:1.26
  - docker ps -a
  - docker stop web && docker rm web
  - docker exec -it web bash
  - docker logs --tail 100 web
  - docker inspect web
  examples:
  - docker run -d --name web -p 8080:80 nginx:1.26
  - docker exec -it web bash
  - docker logs --tail 100 web
  parameters:
  - name: name
    type: string
    description: Container name
  - name: ports
    type: string
    description: Port mapping, e.g. 8080:80
  - name: image
    type: string
    description: Image reference
- name: images-and-storage
  description: Build images, manage image lifecycle, and work with volumes and networks.
  commands:
  - docker build -t myapp:1.0 .
  - docker images
  - docker pull node:20-alpine
  - docker push ghcr.io/myapp:1.0
  - docker volume create pgdata
  - docker network create backend
  - docker system df
  examples:
  - docker build -t myapp:1.0 .
  - docker volume create pgdata && docker run -v pgdata:/data postgres
  - docker system df
  parameters:
  - name: tag
    type: string
    description: Image tag, e.g. myapp:1.0
  - name: path
    type: string
    description: Build context path
knowledge:
- title: Docker Engine CLI Reference
  type: documentation
  source: https://docs.docker.com/engine/reference/commandline/docker/
  description: Every docker command, flag, and example
- title: Dockerfile Reference
  type: documentation
  source: https://docs.docker.com/engine/reference/builder/
  description: 'Dockerfile instructions: FROM, RUN, COPY, ENTRYPOINT, HEALTHCHECK'
- title: Docker Best Practices
  type: documentation
  source: https://docs.docker.com/develop/develop-images/dockerfile_best-practices/
  description: Layer caching, image size, and security guidance
instructions: '# Docker CLI Operations


  Build, run, and troubleshoot containers with the docker command line.


  ## What This Skill Does


  - Runs containers with ports, volumes, env, and resource limits

  - Builds efficient images with proper layering

  - Manages images, volumes, and networks

  - Inspects container state and logs for debugging

  - Cleans up orphaned resources


  ## When to Use


  - Any container build/run/debug task

  - Image optimization and registry pushes

  - Disk cleanup on build machines


  ## Real Commands


  ```bash

  # Run and manage containers

  docker run -d --name web -p 8080:80 -e APP_ENV=prod --restart unless-stopped nginx:1.26

  docker ps -a

  docker exec -it web bash

  docker logs --tail 100 web

  docker inspect web | jq ''.[0].State''

  docker stop web && docker rm web


  # Images

  docker build -t myapp:1.0 .

  docker images

  docker pull node:20-alpine

  docker push ghcr.io/myapp:1.0


  # Storage and networking

  docker volume create pgdata

  docker network create backend

  docker run --network backend --volume pgdata:/data postgres:16


  # Cleanup

  docker system df

  docker image prune -a

  docker volume prune --filter label=tmp

  ```


  ## Efficient Dockerfile


  ```dockerfile

  FROM node:20-alpine

  WORKDIR /app

  COPY package*.json ./

  RUN npm ci --omit=dev

  COPY . .

  ENV NODE_ENV=production

  EXPOSE 3000

  CMD ["node", "server.js"]

  ```


  ## Best Practices


  - Combine RUN commands to reduce layers; copy deps before source for cache hits

  - Run as non-root; add HEALTHCHECK to images

  - Pin base image digests for supply chain safety

  - Prefer named volumes over bind mounts for data

  - Prune regularly: `docker system prune -af` on CI runners'
examples:
- input: Run a Postgres container with a volume for local dev
  output: Agent creates a named volume, runs postgres:16 with env credentials and healthcheck, and shows
    docker ps output
- input: Reduce our image size
  output: Agent switches to alpine base, chains RUN layers, adds .dockerignore, and rebuilds, reporting
    before/after sizes
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: docker.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-docker
  generic:
    system_prompt: 'This is your domain: docker. You do it through container-lifecycle: Run, stop, exec
      into, and remove containers with full flag control. The commands are real, e.g. `docker run -d --name
      web -p 8080:80 nginx:1.26`. You prefer the shortest safe path, and you reproduce failures before
      diagnosing them.'
    available_tools:
    - bash
    - read
    - write
    - edit
