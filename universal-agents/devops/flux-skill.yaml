    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: flux-devops.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-flux
  generic:
    system_prompt: 'You take the flux-devops seat. You do it through flux-bootstrap: Bootstrap Flux into
      a cluster and create Git sources for repositories. The commands are real, e.g. `flux check --pre`.
      You answer with exact commands, not abstractions, and flag anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
