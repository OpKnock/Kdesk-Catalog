name: git-advanced
display_name: git-advanced
category: devops
subcategory: general
description: 'Performs advanced git surgery: bisect debugging, reflog recovery, history rewriting with
  filter-repo, subtrees, worktrees, and partial clones.'
version: 2.0.0
tags:
- devops
author: Kdesk-Catalog
license: MIT
prerequisites:
- git
capabilities:
- name: bisect-and-recovery
  description: Find the commit that introduced a bug and recover lost work.
  commands:
  - git bisect start
  - git bisect good v1.0 && git bisect bad HEAD
  - git bisect run npm test
  - git reflog
  - git reset --hard HEAD@{3}
  - git fsck --lost-found
  examples:
  - git bisect start && git bisect bad && git bisect good v1.0
  - git bisect run npm test
  - git reflog --date=iso
  parameters:
  - name: command
    type: string
    description: Test command for git bisect run
  - name: revision
    type: string
    description: Reflog entry, e.g. HEAD@{3}
- name: history-and-trees
  description: Rewrite history, split repos, and manage subtree and worktree workflows.
  commands:
  - git filter-repo --path server/ --invert-paths
  - git filter-repo --strip-blobs-bigger-than 10M
  - git subtree add --prefix=vendor/libs vendor-repo main
  - git worktree add ../hotfix v1.2.3
  - git worktree list
  - git replace --graft HEAD~5
  examples:
  - git filter-repo --path secrets/ --invert-paths
  - git worktree add ../hotfix v1.2.3
  - git subtree pull --prefix=vendor/libs vendor-repo main
  parameters:
  - name: path
    type: string
    description: Path to remove or add via subtree
  - name: remote
    type: string
    description: Remote repo URL for subtree operations
knowledge:
- title: git-filter-repo
  type: documentation
  source: https://github.com/newren/git-filter-repo
  description: Fast history rewriting tool and manual
- title: git reflog
  type: documentation
  source: https://git-scm.com/docs/git-reflog
  description: Reflog reference for recovering lost commits
- title: git worktree
  type: documentation
  source: https://git-scm.com/docs/git-worktree
  description: Work with multiple working trees simultaneously
instructions: '# Advanced Git Techniques


  Master git beyond everyday commits: debugging, recovery, and history rewriting.


  ## What This Skill Does


  - Binary-searches history with git bisect to find regressions

  - Recovers lost work via reflog and fsck

  - Rewrites history safely with git filter-repo (no filter-branch)

  - Splits/mirrors repos with subtree and submodules

  - Works on multiple branches at once with worktrees

  - Optimizes clones with partial and shallow fetches


  ## When to Use


  - A regression appeared and the culprit commit is unknown

  - Secrets or huge files are in history and must be purged

  - You deleted a branch or reset and lost commits

  - You need to work on two branches simultaneously


  ## Real Commands


  ```bash

  # Bisect

  git bisect start

  git bisect bad HEAD

  git bisect good v1.0

  git bisect run npm test        # automate with exit codes

  git bisect reset


  # Recovery

  git reflog --date=iso

  git reset --hard HEAD@{3}

  git fsck --lost-found


  # Rewriting

  git filter-repo --path server/ --invert-paths

  git filter-repo --strip-blobs-bigger-than 10M

  git filter-repo --replace-text <(echo ''password==>REDACTED'')


  # Worktrees

  git worktree add ../hotfix v1.2.3

  git worktree list

  git worktree remove ../hotfix


  # Subtree

  git subtree add --prefix=vendor/libs vendor-repo main

  git subtree pull --prefix=vendor/libs vendor-repo main

  ```


  ## Best Practices


  - Never rewrite history on shared branches without coordination

  - Clone a fresh copy before filter-repo (it rewrites all refs)

  - Use worktrees instead of stash juggling for parallel fixes

  - `git bisect run` expects a command that exits 0 for good, non-zero for bad

  - Keep reflog expiry generous on important repos: `git config gc.reflogExpire 90.days`'
examples:
- input: The login flow broke somewhere in the last 200 commits
  output: Agent starts git bisect, marks good/bad, runs the login test automatically with bisect run,
    and reports the guilty commit
- input: I accidentally reset and lost my feature branch
  output: Agent inspects git reflog, identifies the branch tip entry, and runs git reset --hard or git
    branch recovery to restore it
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: git-advanced.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-git-advanced
  generic:
    system_prompt: 'Your lane is git-advanced. You do it through bisect-and-recovery: Find the commit
      that introduced a bug and recover lost work. The commands are real, e.g. `git bisect start`. You
      prefer the shortest safe path, and you reproduce failures before diagnosing them.'
    available_tools:
    - bash
    - read
    - write
    - edit
