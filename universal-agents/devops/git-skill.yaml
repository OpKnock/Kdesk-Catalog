name: git
display_name: Git
category: devops
subcategory: general
description: 'Covers everyday git: repository creation, staging, commits, branching, merging, remotes,
  and history inspection.'
version: 2.0.0
tags:
- devops
author: Kdesk
license: MIT
prerequisites:
- git
capabilities:
- name: basic-repository-ops
  description: Initialize, clone, stage, and commit with clean workflows.
  commands:
  - git init -b main
  - git clone https://github.com/org/repo.git
  - git status
  - git add -A
  - 'git commit -m ''feat: add login endpoint'''
  - git log --oneline --graph -10
  examples:
  - git init -b main && git add . && git commit -m 'init'
  - git clone git@github.com:org/repo.git
  - git log --oneline --graph -10
  parameters:
  - name: message
    type: string
    description: Commit message
  - name: url
    type: string
    description: Remote repository URL
- name: branch-and-merge
  description: Create branches, merge changes, and resolve conflicts.
  commands:
  - git branch feature/checkout
  - git checkout -b feature/checkout
  - git switch main && git merge feature/checkout
  - git branch -d feature/checkout
  - git diff main...feature/checkout
  - git merge --abort
  examples:
  - git checkout -b feature/checkout
  - git merge feature/checkout
  - git branch -d feature/checkout
  parameters:
  - name: branch
    type: string
    description: Branch name
  - name: target
    type: string
    description: Branch to merge into
- name: remotes-and-sharing
  description: 'Sync with remote repositories: fetch, pull, push, and remote management.'
  commands:
  - git remote -v
  - git remote add origin https://github.com/org/repo.git
  - git push -u origin main
  - git pull --ff-only
  - git fetch --all --prune
  - git push --tags
  examples:
  - git push -u origin main
  - git pull --ff-only
  - git fetch --all --prune
  parameters:
  - name: remote
    type: string
    description: Remote name, e.g. origin
  - name: branch
    type: string
    description: Branch to push/pull
knowledge:
- title: git Reference Manual
  type: documentation
  source: https://git-scm.com/docs
  description: Official git command reference
- title: Pro Git Book
  type: documentation
  source: https://git-scm.com/book/en/v2
  description: 'Complete git guide: basics through advanced topics'
- title: GitHub Docs
  type: documentation
  source: https://docs.github.com/en/get-started
  description: Getting started with git and GitHub
instructions: '# Everyday Git


  Handle daily version control tasks: commits, branches, merges, and remotes.


  ## What This Skill Does


  - Creates and clones repositories

  - Stages and commits changes with clean messages

  - Branches, merges, and resolves conflicts

  - Syncs with remotes (fetch, pull, push)

  - Reads history and diffs to understand change


  ## When to Use


  - Initializing or cloning a project

  - Saving work in logical commits

  - Sharing and syncing branches

  - Understanding what changed and why


  ## Real Commands


  ```bash

  # Setup and clone

  git init -b main

  git clone git@github.com:org/repo.git

  git config user.name "Jane" && git config user.email jane@example.com


  # Daily loop

  git status

  git diff

  git add src/server.ts

  git commit -m "feat: add health endpoint"

  git log --oneline --graph -10


  # Branches

  git switch -c feature/checkout

  git switch main

  git merge feature/checkout

  git branch -d feature/checkout


  # Remotes

  git remote -v

  git fetch --all --prune

  git pull --ff-only

  git push -u origin main

  ```


  ## Commit Message Style


  ```

  <type>: <subject>          # feat, fix, refactor, docs, test, chore

  feat: add login endpoint

  fix(api): return 404 for unknown ids

  ```


  ## Best Practices


  - Commit small, single-purpose changes; write imperative messages

  - Pull with --ff-only to keep history linear

  - Resolve conflicts with `git merge --abort` if unsure, then retry

  - Never force-push shared branches; use --force-with-lease if needed

  - Review `git diff` before staging to avoid accidental inclusions'
examples:
- input: Start a new project with git
  output: Agent initializes the repo with main branch, adds .gitignore, makes the first commit, and adds
    a remote
- input: Merge the feature branch and clean up
  output: Agent switches to main, merges the feature branch, deletes it, and pushes the updated main
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: git.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-git
  generic:
    system_prompt: 'You work Git hands-on. You do it through basic-repository-ops: Initialize, clone,
      stage, and commit with clean workflows. The commands are real, e.g. `git init -b main`. You answer
      with exact commands, not abstractions, and flag anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
