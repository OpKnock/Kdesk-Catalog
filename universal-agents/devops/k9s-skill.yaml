name: k9s
display_name: k9s
category: devops
subcategory: general
description: 'Navigates Kubernetes clusters with the k9s terminal UI: pod inspection, log streaming, resource
  editing, and context switching.'
version: 2.0.0
tags:
- devops
author: Kdesk
license: MIT
prerequisites:
- k9s
capabilities:
- name: terminal-ui-navigation
  description: Launch k9s scoped to namespaces, resources, or contexts, and use hotkeys for views.
  commands:
  - k9s
  - k9s -n production
  - k9s -A
  - k9s -c deployments
  - k9s --context staging
  - k9s --headless -c pods
  examples:
  - k9s -n production
  - k9s -A -c secrets
  - k9s --context staging
  parameters:
  - name: namespace
    type: string
    description: Namespace to scope to
  - name: context
    type: string
    description: Kubeconfig context
  - name: resource
    type: string
    description: Initial resource view, e.g. deployments
- name: live-observability
  description: Stream logs, exec shells, and drill into resource details from the UI (keybindings).
  commands:
  - k9s --logoless
  - k9s --readonly
  - k9s --command deploy/web
  - k9s --kubeconfig ~/.kube/config2
  - k9s --plugins myplugin.yaml
  examples:
  - k9s --readonly
  - k9s --command deploy/web
  - k9s --plugins myplugin.yaml
  parameters:
  - name: command
    type: string
    description: Initial view command like deploy/web
  - name: kubeconfig
    type: string
    description: Alternate kubeconfig path
knowledge:
- title: k9s CLI Documentation
  type: documentation
  source: https://k9scli.io/
  description: Install, keybindings, skins, and plugin docs
- title: k9s GitHub
  type: documentation
  source: https://github.com/derailed/k9s
  description: Source, releases, and configuration examples
instructions: '# k9s Terminal UI


  Operate Kubernetes from a fast terminal dashboard instead of long kubectl pipelines.


  ## What This Skill Does


  - Views resources per namespace or all namespaces

  - Streams pod logs live and exec into containers

  - Edits manifests inline and watches rollouts

  - Switches contexts/clusters and uses custom skins

  - Extends behavior with plugins and hotkeys


  ## When to Use


  - Rapid triage across many namespaces

  - Following a deployment rollout in real time

  - Terminal-only environments (SSH boxes, bastion hosts)


  ## Real Commands


  ```bash

  # Launch variants

  k9s

  k9s -n production

  k9s -A

  k9s -c deployments

  k9s --context staging

  k9s --readonly

  k9s --command deploy/web

  k9s --kubeconfig ~/.kube/config2

  ```


  ## Key Bindings (in-app)


  - `0-9` switch resource views (pods, deploys, svc, ...)

  - `l` logs, `s` shell/exec, `d` describe, `e` edit

  - `ctrl-d` delete, `ctrl-k` kill

  - `:ctx` switch context, `:ns` switch namespace

  - `?` full keymap reference


  ## Best Practices


  - Use `--readonly` in production sessions to avoid fat-finger deletes

  - Alias it: `alias k=k9s -n` in daily shells

  - Use skins (config/skins/) for high-contrast terminals

  - Combine with kubectx contexts for multi-cluster hops

  - Prefer k9s for triage, kubectl for scripting and automation'
examples:
- input: Watch the new release rollout live
  output: Agent launches k9s -c deployments, selects the deployment, and follows the rollout with the
    describe/pods drill-down
- input: Check errors across all namespaces
  output: Agent runs k9s -A -c events and filters by Warning severity in the UI
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: k9s.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-k9s
  generic:
    system_prompt: 'You take the k9s seat. You do it through terminal-ui-navigation: Launch k9s scoped
      to namespaces, resources, or contexts, and use hotkeys for views. The commands are real, e.g. `k9s`.
      You run and verify the real CLI commands before you claim anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
