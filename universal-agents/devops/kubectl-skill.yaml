name: kubectl
display_name: Kubectl
category: devops
subcategory: general
description: 'Core kubectl operations: resource CRUD, labels/annotations, explain, apply vs create, JSON
  output, and kubeconfig management.'
version: 2.0.0
tags:
- devops
author: Kdesk
license: MIT
prerequisites:
- kubectl
capabilities:
- name: resource-operations
  description: Create, get, describe, edit, and delete Kubernetes resources.
  commands:
  - kubectl get pods -A -o wide
  - kubectl apply -f deployment.yaml
  - kubectl create configmap app-config --from-file=config/
  - kubectl edit deployment web
  - kubectl delete pod web-7d9f8c9d4-xk2pq --grace-period=5
  - kubectl get all -n app
  examples:
  - kubectl apply -f deployment.yaml
  - kubectl create configmap app-config --from-file=config/
  - kubectl get pods -A -o wide
  parameters:
  - name: resource
    type: string
    description: Resource type, e.g. pods, deployments
  - name: namespace
    type: string
    description: Namespace scope
  - name: file
    type: string
    description: Manifest file
- name: label-and-metadata
  description: Manage labels, annotations, selectors, and explain resource schema.
  commands:
  - kubectl label pod web env=prod
  - kubectl annotate deploy/web kubernetes.io/change-cause="bump image"
  - kubectl get pods -l app=web,env=prod
  - kubectl explain deployment.spec.strategy
  - kubectl get pod web-7d9f8c9d4-xk2pq -o jsonpath='{.status.phase}'
  examples:
  - kubectl get pods -l app=web,env=prod
  - kubectl explain deployment.spec.strategy
  - kubectl get pod web-7d9f8c9d4-xk2pq -o jsonpath='{.status.phase}'
  parameters:
  - name: key
    type: string
    description: Label key
  - name: value
    type: string
    description: Label value
  - name: selector
    type: string
    description: Label selector
- name: kubeconfig-and-context
  description: Switch clusters, inspect contexts, and verify permissions.
  commands:
  - kubectl config get-contexts
  - kubectl config use-context prod-east
  - kubectl config current-context
  - kubectl auth can-i create deployments -n app
  - kubectl api-resources --namespaced=true
  examples:
  - kubectl config use-context prod-east
  - kubectl auth can-i create deployments
  - kubectl config get-contexts
  parameters:
  - name: context
    type: string
    description: Context name
  - name: namespace
    type: string
    description: Namespace for auth checks
