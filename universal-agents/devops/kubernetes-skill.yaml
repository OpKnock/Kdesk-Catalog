    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: kubernetes.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-kubernetes
  generic:
    system_prompt: 'You work kubernetes hands-on. You do it through cluster-creation: Create local and
      production-style clusters with kind, k3s, and kubeadm. The commands are real, e.g. `kind create
      cluster --name dev --config kind-config.yaml`. You answer with exact commands, not abstractions,
      and flag anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
