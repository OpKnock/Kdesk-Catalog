name: load-balancing
display_name: Load Balancing
category: devops
subcategory: general
description: 'Configures load balancing tiers: HAProxy and NGINX proxies, Kubernetes Services (ClusterIP/NodePort/LoadBalancer),
  MetalLB, and keepalived.'
version: 2.0.0
tags:
- devops
author: Mehul Wagde
license: MIT
prerequisites:
- haproxy
- kubectl
- nginx
- systemctl
capabilities:
- name: proxy-configuration
  description: Configure and validate HAProxy and NGINX frontends and backends.
  commands:
  - haproxy -c -f /etc/haproxy/haproxy.cfg
  - systemctl reload haproxy
  - nginx -t
  - nginx -s reload
  - haproxy -f /etc/haproxy/haproxy.cfg -p /var/run/haproxy.pid
  - curl -s http://127.0.0.1:8404/stats
  examples:
  - haproxy -c -f /etc/haproxy/haproxy.cfg
  - nginx -t
  - nginx -s reload
  parameters:
  - name: config
    type: string
    description: Proxy config file path
  - name: backend
    type: string
    description: Backend pool name
- name: kubernetes-lb
  description: Expose workloads with Services and MetalLB bare-metal load balancers.
  commands:
  - kubectl expose deployment web --type=LoadBalancer --port=80
  - kubectl get svc -o wide
  - kubectl apply -f metallb-config.yaml
  - kubectl get ipaddresspool -n metallb-system
  - kubectl apply -f svc-nodeport.yaml
  - kubectl get endpointslices -l kubernetes.io/service-name=web
  examples:
  - kubectl expose deployment web --type=LoadBalancer --port=80
  - kubectl apply -f metallb-config.yaml
  - kubectl get endpointslices -l kubernetes.io/service-name=web
  parameters:
  - name: type
    type: string
    description: 'Service type: ClusterIP, NodePort, LoadBalancer'
  - name: port
    type: integer
    description: Service port
knowledge:
- title: HAProxy Documentation
  type: documentation
  source: https://www.haproxy.org/documentation/
  description: HAProxy configuration manual and management
- title: NGINX Load Balancing
  type: documentation
  source: https://docs.nginx.com/nginx/admin-guide/load-balancer/http-load-balancer/
  description: HTTP load balancing with upstream blocks
- title: MetalLB
  type: documentation
  source: https://metallb.universe.tf/
  description: Bare-metal LoadBalancer services for Kubernetes
instructions: "# Load Balancing\n\nBuild and tune load balancing across proxy layers and Kubernetes Services.\n\
  \n## What This Skill Does\n\n- Configures HAProxy/NGINX frontends, backends, health checks, and stickiness\n\
  - Exposes Kubernetes workloads via Service types\n- Provides external IPs on bare metal with MetalLB\n\
  - Validates configs before reload and checks stats\n- Diagnoses uneven distribution and backend failures\n\
  \n## When to Use\n\n- Running HAProxy or NGINX as an edge or internal balancer\n- Bare-metal clusters\
  \ needing LoadBalancer IPs\n- Tuning session affinity and health checks\n\n## Real Commands\n\n```bash\n\
  # HAProxy\nhaproxy -c -f /etc/haproxy/haproxy.cfg\nsystemctl reload haproxy\ncurl -s http://127.0.0.1:8404/stats\
  \ | grep -c \"UP\"\n\n# NGINX\nnginx -t\nnginx -s reload\n\n# Kubernetes Services\nkubectl expose deployment\
  \ web --type=LoadBalancer --port=80\nkubectl get svc -o wide\nkubectl apply -f metallb-config.yaml\n\
  kubectl get ipaddresspool -n metallb-system\nkubectl get endpointslices -l kubernetes.io/service-name=web\n\
  ```\n\n## HAProxy Backend\n\n```\nbackend web_servers\n  balance roundrobin\n  option httpchk GET /health\n\
  \  server web1 10.0.0.11:8080 check inter 3s fall 3 rise 2\n  server web2 10.0.0.12:8080 check inter\
  \ 3s fall 3 rise 2\n```\n\n## Best Practices\n\n- Validate (`-c` / `nginx -t`) before reloading — never\
  \ reload broken config\n- Pair health checks with sticky sessions only when required\n- Prefer L4 services\
  \ (ClusterIP + LB) for internal traffic, L7 only at the edge\n- In bare-metal, MetalLB + Service of\
  \ type LoadBalancer beats hostPort hacks\n- Watch backend UP counts in stats endpoints for capacity\
  \ signals"
examples:
- input: Add a second web server to our HAProxy pool
  output: Agent appends the server line, validates with haproxy -c, reloads, and confirms both show UP
    in stats
- input: Give the app a stable external IP on bare metal
  output: Agent installs MetalLB with an IPAddressPool, exposes the deployment as LoadBalancer, and verifies
    EXTERNAL-IP
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: load-balancing.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-load-balancing
  generic:
    system_prompt: 'This is your domain: Load Balancing. You do it through proxy-configuration: Configure
      and validate HAProxy and NGINX frontends and backends. The commands are real, e.g. `haproxy -c -f
      /etc/haproxy/haproxy.cfg`. You answer with exact commands, not abstractions, and flag anything you
      have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
