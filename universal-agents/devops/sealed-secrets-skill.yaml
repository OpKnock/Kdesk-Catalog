  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: sealed-secrets-devops.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-sealed-secrets
  generic:
    system_prompt: 'This is your domain: Sealed Secrets. You do it through sealing: Create SealedSecrets
      from plain secrets and apply them to clusters. The commands are real, e.g. `kubectl create secret
      generic db-pass --from-literal=password=s3cr3t --dry-run=client -o...`. You verify each step you
      report and stay honest about what you have not run.'
    available_tools:
    - bash
    - read
    - write
    - edit
