name: secret-management-devops
display_name: Secret Management
category: devops
subcategory: general
description: 'Manages secrets across platforms with HashiCorp Vault, SOPS, and cloud secret managers:
  creation, rotation, policies, and injection.'
version: 2.0.0
tags:
- devops
author: Kdesk
license: MIT
prerequisites:
- aws
- gcloud
- sops
- vault
capabilities:
- name: vault-operations
  description: Enable engines, write/read secrets, and manage policies and tokens.
  commands:
  - vault secrets enable -path=kv kv-v2
  - vault kv put kv/app/db password=s3cr3t user=app
  - vault kv get kv/app/db
  - vault policy write app-reader policy.hcl
  - vault token create -policy=app-reader -ttl=24h
  - vault kv rotate kv/app/db
  examples:
  - vault kv put kv/app/db password=s3cr3t
  - vault kv get kv/app/db
  - vault policy write app-reader policy.hcl
  parameters:
  - name: path
    type: string
    description: Secret path, e.g. kv/app/db
  - name: policy-file
    type: string
    description: HCL policy file
- name: sops-and-cloud
  description: Encrypt files with SOPS and manage cloud secret manager entries.
  commands:
  - sops --encrypt --age $(cat ~/.config/sops/age/keys.txt | head -1) secrets.yaml
  - sops -e --in-place secrets.yaml
  - sops -d secrets.yaml
  - aws secretsmanager put-secret-value --secret-id app/db --secret-string '{"password":"s3cr3t"}'
  - aws secretsmanager get-secret-value --secret-id app/db --query SecretString --output text
  - gcloud secrets create db-password --data-file=./pw.txt
  examples:
  - sops -e --in-place secrets.yaml
  - aws secretsmanager get-secret-value --secret-id app/db
  - gcloud secrets create db-password --data-file=./pw.txt
  parameters:
  - name: file
    type: string
    description: File to encrypt/decrypt
  - name: secret-id
    type: string
    description: Cloud secret identifier
knowledge:
- title: Vault Documentation
  type: documentation
  source: https://developer.hashicorp.com/vault/docs
  description: Secrets engines, auth methods, policies
- title: SOPS (getsops)
  type: documentation
  source: https://github.com/getsops/sops
  description: SOPS file encryption with age/KMS/PGP
- title: AWS Secrets Manager
  type: documentation
  source: https://docs.aws.amazon.com/secretsmanager/
  description: AWS secret storage and rotation
instructions: "# Secret Management\n\nStore, rotate, and inject secrets across Vault, SOPS, and cloud\
  \ managers.\n\n## What This Skill Does\n\n- Operates Vault KV engines, policies, and tokens\n- Encrypts\
  \ repo files with SOPS (age/KMS/PGP)\n- Reads/writes cloud secret manager entries\n- Applies least-privilege\
  \ policies per workload\n- Automates rotation workflows\n\n## When to Use\n\n- Choosing a secret storage\
  \ strategy for an app\n- Moving secrets out of env vars and git history\n- Rotating credentials safely\n\
  \n## Real Commands\n\n```bash\n# Vault\nvault secrets enable -path=kv kv-v2\nvault kv put kv/app/db\
  \ password=s3cr3t user=app\nvault kv get kv/app/db\nvault kv delete kv/app/db\nvault policy write app-reader\
  \ policy.hcl\nvault token create -policy=app-reader -ttl=24h\nvault kv rotate kv/app/db\n\n# SOPS (age)\n\
  sops --encrypt --age $(cat age-public-key) secrets.yaml\nsops -e --in-place secrets.yaml\nsops -d secrets.yaml\n\
  sops --set '[\"db\"][\"password\"] \"newpass\"' secrets.yaml\n\n# Cloud\naws secretsmanager put-secret-value\
  \ --secret-id app/db --secret-string '{\"password\":\"s3cr3t\"}'\naws secretsmanager get-secret-value\
  \ --secret-id app/db --query SecretString --output text\ngcloud secrets create db-password --data-file=./pw.txt\n\
  ```\n\n## Vault Policy\n\n```hcl\npath \"kv/data/app/db\" {\n  capabilities = [\"read\"]\n}\n```\n\n\
  ## Best Practices\n\n- Never store plaintext secrets in git; use SOPS or SealedSecrets\n- Use Vault\
  \ short-TTL tokens and approle auth for services\n- Rotate on a schedule; verify rotation with versioning\n\
  - Keep KMS/age keys in hardware or isolated credential stores\n- Audit access: cloud managers and Vault\
  \ both log reads"
examples:
- input: Move our .env secrets into Vault
  output: Agent enables kv-v2, writes each key, creates a read-only policy, and issues short-lived app
    tokens
- input: Encrypt secrets.yaml for the repo
  output: Agent generates an age keypair, encrypts the file with SOPS, and configures the key in CI
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: secret-management-devops.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-secret-management
  generic:
    system_prompt: 'You own Secret Management end to end. You do it through vault-operations: Enable engines,
      write/read secrets, and manage policies and tokens. The commands are real, e.g. `vault secrets enable
      -path=kv kv-v2`. You run and verify the real CLI commands before you claim anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
