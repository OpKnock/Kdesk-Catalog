name: skopeo
display_name: skopeo
category: devops
subcategory: general
description: Inspects, copies, and signs container images with skopeo — registry operations without a
  daemon, including sync and list-tags.
version: 2.0.0
tags:
- devops
author: Kdesk
license: MIT
prerequisites:
- skopeo
capabilities:
- name: image-inspection
  description: Inspect images and registries without pulling layers locally.
  commands:
  - skopeo inspect docker://nginx:latest
  - skopeo inspect --raw docker://nginx:latest
  - skopeo list-tags docker://ghcr.io/app
  - skopeo inspect docker://ghcr.io/app:v1 --config
  - skopeo inspect --format '{{.Digest}}' docker://nginx:latest
  examples:
  - skopeo inspect docker://nginx:latest
  - skopeo list-tags docker://ghcr.io/app
  - skopeo inspect --format '{{.Digest}}' docker://nginx:latest
  parameters:
  - name: image
    type: string
    description: Image reference
  - name: format
    type: string
    description: Go template for output
- name: copy-and-sync
  description: Copy images between transports/registries and sync repositories.
  commands:
  - skopeo copy docker://nginx:latest docker://ghcr.io/nginx:latest
  - skopeo copy --all --preserve-digests docker://ghcr.io/org/app:1.0 docker://ghcr.io/org/app:1.0
  - skopeo sync --src docker --dest dir nginx:latest /opt/images
  - skopeo delete docker://ghcr.io/old-app:v0.9
  - skopeo login ghcr.io -u ci -p $(cat /run/secrets/registry)
  examples:
  - skopeo copy docker://nginx:latest docker://ghcr.io/nginx:latest
  - skopeo sync --src docker --dest dir nginx:latest /opt/images
  - skopeo delete docker://ghcr.io/old-app:v0.9
  parameters:
  - name: src
    type: string
    description: Source image reference
  - name: dest
    type: string
    description: Destination reference
knowledge:
- title: skopeo GitHub
  type: documentation
  source: https://github.com/containers/skopeo
  description: skopeo commands, transports, and examples
- title: containers-common Transports
  type: documentation
  source: https://github.com/containers/image/blob/main/docs/containers-transports.5.md
  description: 'Image transports: docker, dir, oci, docker-archive'
instructions: '# skopeo Registry Operations


  Inspect, copy, and sign images between registries without a container daemon.


  ## What This Skill Does


  - Inspects image metadata (digest, config, layers) remotely

  - Lists tags and copies multi-arch images

  - Syncs whole repositories to air-gapped targets

  - Deletes remote images and manages auth

  - Works with docker://, oci:, dir:, docker-archive: transports


  ## When to Use


  - Mirroring images into private registries

  - CI where no daemon is available (common in hardened runners)

  - Verifying image digests for supply chain audit


  ## Real Commands


  ```bash

  # Inspect

  skopeo inspect docker://nginx:latest

  skopeo inspect --raw docker://nginx:latest | jq .

  skopeo inspect --format ''{{.Digest}}'' docker://nginx:latest

  skopeo list-tags docker://ghcr.io/app


  # Copy

  skopeo copy docker://nginx:latest docker://ghcr.io/nginx:latest

  skopeo copy --all --preserve-digests docker://ghcr.io/org/app:1.0 docker://ghcr.io/org/app:1.0


  # Sync to air gap

  skopeo sync --src docker --dest dir nginx:latest /opt/images

  skopeo sync --src yaml --dest docker sync.yaml


  # Auth and delete

  skopeo login ghcr.io -u ci -p $REGISTRY_PASS

  skopeo delete docker://ghcr.io/old-app:v0.9

  ```


  ## Best Practices


  - Use --all to preserve multi-arch manifests on copy

  - Prefer --preserve-digests when mirroring to keep provenance

  - Use `skopeo inspect --format ''{{.Digest}}''` to pin digests in GitOps

  - For air-gapped clusters, sync to dir transport, then load offline

  - Scope CI credentials to pull-only on the source registry'
examples:
- input: Mirror a list of images to our private registry
  output: Agent writes a sync.yaml with sources, runs skopeo sync, and validates digests with inspect
- input: Get the exact digest of nginx:latest for pinning
  output: Agent runs skopeo inspect with a digest format template and outputs the sha256 for manifest
    pinning
