name: sops
display_name: Sops
category: devops
subcategory: general
description: 'Encrypts YAML/JSON/ENV files with SOPS keys (age, KMS, PGP): edit, set values, decrypt,
  and GitOps integration.'
version: 2.0.0
tags:
- devops
author: Kdesk
license: MIT
prerequisites:
- sops
capabilities:
- name: encrypt-decrypt
  description: Encrypt and decrypt files with configured key services.
  commands:
  - sops -e -i secrets.yaml
  - sops -d secrets.yaml
  - sops --encrypt --age age1xyz... secrets.env
  - sops --decrypt secrets.yaml | kubectl apply -f -
  - sops --input-type yaml --output-type json -e config.yaml > config.json
  examples:
  - sops -e -i secrets.yaml
  - sops --decrypt secrets.yaml | kubectl apply -f -
  - sops --encrypt --age age1xyz... secrets.env
  parameters:
  - name: file
    type: string
    description: File to encrypt/decrypt
  - name: key
    type: string
    description: age or key-service identifier
- name: edit-and-manage
  description: Edit encrypted values in place and manage key services.
  commands:
  - sops secrets.yaml
  - sops --set '["db"]["password"] "newpass"' secrets.yaml
  - sops --set --encrypt '["db"]["password"] "raw-new"' secrets.yaml
  - sops --decrypt --output decrypted.yaml secrets.yaml
  - sops updatekeys --yes secrets.yaml
  - sops --verbose -e secrets.yaml
  examples:
  - sops secrets.yaml
  - sops --set '["db"]["password"] "newpass"' secrets.yaml
  - sops updatekeys --yes secrets.yaml
  parameters:
  - name: path
    type: string
    description: JSON path to value, e.g. ["db"]["password"]
  - name: value
    type: string
    description: New value
knowledge:
- title: SOPS (getsops)
  type: documentation
  source: https://github.com/getsops/sops
  description: Installation, key services, CLI reference
- title: SOPS for GitOps
  type: documentation
  source: https://fluxcd.io/flux/guides/mozilla-sops/
  description: Flux SOPS integration guide
instructions: "# SOPS Secret Encryption\n\nKeep secrets encrypted in git with SOPS while keeping them\
  \ usable in CI and clusters.\n\n## What This Skill Does\n\n- Encrypts/decrypts YAML, JSON, ENV, and\
  \ INI files\n- Works with age, AWS/GCP/Azure KMS, and PGP keys\n- Edits encrypted files safely (sops\
  \ opens the editor with decryption)\n- Sets individual values without exposing the rest\n- Integrates\
  \ with Flux/Kustomize decryption providers\n\n## When to Use\n\n- Secrets in GitOps repositories\n-\
  \ Encrypted env files for CI\n- Preferring file-level encryption over cluster-only encryption\n\n##\
  \ Real Commands\n\n```bash\n# Encrypt / decrypt\nsops -e -i secrets.yaml\nsops -d secrets.yaml\nsops\
  \ --encrypt --age age1xyz... secrets.env > secrets.enc.env\nsops --decrypt secrets.yaml | kubectl apply\
  \ -f -\n\n# Edit in place\nsops secrets.yaml                          # opens editor, saves encrypted\n\
  sops --set '[\"db\"][\"password\"] \"newpass\"' secrets.yaml\nsops --set --encrypt '[\"db\"][\"password\"\
  ] \"raw-new-pass\"' secrets.yaml\n\n# Convert and manage\nsops --input-type yaml --output-type json\
  \ -e config.yaml > config.json\nsops --decrypt --output decrypted.yaml secrets.yaml\nsops updatekeys\
  \ --yes secrets.yaml          # re-encrypt for new keys\nsops --verbose -e secrets.yaml\n```\n\n## .sops.yaml\
  \ Example\n\n```yaml\ncreation_rules:\n  - path_regex: \\.secrets\\.yaml$\n    age: age1xyz...\n  -\
  \ path_regex: \\.env$\n    kms: arn:aws:kms:us-east-1:123456789012:key/abc\n```\n\n## Best Practices\n\
  \n- Set creation_rules per path and key service\n- Keep recipient keys (public) in the repo; private\
  \ keys in CI secrets\n- Decrypt to stdout, never write plaintext copies to disk\n- Use sops exec-env\
  \ to load decrypted envs into processes\n- Rotate keys by running updatekeys after key changes"
examples:
- input: Encrypt our prod env file for CI
  output: Agent adds a creation rule, encrypts the env file with age, and shows how CI decrypts via SOPS_AGE_KEY_FILE
- input: Update one password without opening the editor
  output: Agent sets the value with --set --encrypt and verifies with sops -d
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: sops.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-sops
  generic:
    system_prompt: 'This is your domain: Sops. You do it through encrypt-decrypt: Encrypt and decrypt
      files with configured key services. The commands are real, e.g. `sops -e -i secrets.yaml`. You run
      and verify the real CLI commands before you claim anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
