name: stern
display_name: stern
category: devops
subcategory: general
description: 'Tails and aggregates logs from multiple Kubernetes pods with regex matching using stern:
  multi-pod, multi-container, and namespace-wide views.'
version: 2.0.0
tags:
- devops
author: Kdesk
license: MIT
prerequisites:
- stern
capabilities:
- name: multi-pod-tailing
  description: Tail logs from pod groups matched by regex across namespaces.
  commands:
  - stern web-*
  - stern '^api-.*' -n app
  - stern web --all-namespaces
  - stern web -A -e 'ERROR'
  - stern web -c sidecar
  - stern web --tail 200
  examples:
  - stern web-*
  - stern '^api-.*' -n app
  - stern web -A -e 'ERROR'
  parameters:
  - name: pattern
    type: string
    description: Pod name regex, e.g. web-*
  - name: namespace
    type: string
    description: Namespace scope
  - name: exclude
    type: string
    description: Regex to exclude lines
- name: filtering-and-format
  description: Filter lines, colorize, and control timestamps and output.
  commands:
  - stern web -i 'GET /health'
  - stern web -n app --timestamps
  - stern web --since 30m
  - stern web --no-color
  - stern web --template '{{.PodName}} {{.Message}}'
  - stern web --max-log-requests 20
  examples:
  - stern web -i 'GET /health'
  - stern web --since 30m
  - stern web --template '{{.PodName}} {{.Message}}'
  parameters:
  - name: include
    type: string
    description: Regex to include lines
  - name: since
    type: string
    description: Look back window, e.g. 30m
  - name: template
    type: string
    description: Go template for output
knowledge:
- title: stern GitHub
  type: documentation
  source: https://github.com/stern/stern
  description: stern flags, templating, and configuration
- title: stern Documentation
  type: documentation
  source: https://stern.io/
  description: Usage guide and examples
instructions: '# stern Multi-Pod Logging


  Tail logs across many pods at once with regex matching.


  ## What This Skill Does


  - Matches multiple pods with a single regex

  - Aggregates logs chronologically with pod prefixes

  - Filters by include/exclude regexes

  - Supports multi-container pods and all-namespace scans

  - Customizes output with Go templates


  ## When to Use


  - Debugging across a deployment''s replicas

  - Correlation across API + worker pods

  - Live log monitoring during incidents


  ## Real Commands


  ```bash

  # Basic tailing

  stern web-*                      # all web pods

  stern ''^api-.*'' -n app

  stern web -A                     # all namespaces

  stern web -c sidecar             # specific container

  stern web --tail 200


  # Filtering

  stern web -i ''ERROR|WARN''        # include

  stern web -e ''health-check''      # exclude

  stern web --since 30m


  # Format

  stern web --timestamps

  stern web --no-color

  stern web --template ''{{.PodName}} {{.Message}}''

  stern web --max-log-requests 20

  ```


  ## Templates


  - `{{.Namespace}} {{.PodName}} {{.ContainerName}} {{.Message}}`


  ## Best Practices


  - Quote regexes containing special chars: `stern ''web-[0-9]+''`

  - Use -e to drop noisy health-check lines during incidents

  - Pin --max-log-requests to avoid API throttling on big deployments

  - Pair with --since for bounded time windows

  - Use --timestamps when correlating with metrics dashboards'
examples:
- input: Watch all web replicas for errors right now
  output: Agent runs stern web-* -n app -i 'ERROR' and monitors the aggregated stream
- input: Correlate api and worker logs during an incident
  output: Agent tails stern '^api-|^worker-' --since 1h --timestamps and spots the ordering
platforms:
