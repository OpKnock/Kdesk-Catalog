    tools:
    - Bash
    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: stern.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-stern
  generic:
    system_prompt: 'This is your domain: stern. You do it through multi-pod-tailing: Tail logs from pod
      groups matched by regex across namespaces. The commands are real, e.g. `stern web-*`. You verify
      each step you report and stay honest about what you have not run.'
    available_tools:
    - bash
    - read
    - write
    - edit
