name: terraform-docs
display_name: terraform-docs
category: devops
subcategory: general
description: 'Generates and maintains Terraform module documentation with terraform-docs: markdown tables,
  JSON, and CI enforcement of freshness.'
version: 2.0.0
tags:
- devops
author: Kdesk-Catalog
license: MIT
prerequisites:
- terraform-docs
capabilities:
- name: docs-generation
  description: Generate README and JSON docs from Terraform code.
  commands:
  - terraform-docs markdown table .
  - terraform-docs markdown table --output-file README.md .
  - terraform-docs json . > docs.json
  - terraform-docs markdown . --sort-by-required
  - terraform-docs --config .terraform-docs.yml markdown table .
  examples:
  - terraform-docs markdown table --output-file README.md .
  - terraform-docs json . > docs.json
  - terraform-docs --config .terraform-docs.yml markdown table .
  parameters:
  - name: output-file
    type: string
    description: File to write docs to
  - name: config
    type: string
    description: Config file path
- name: fmt-and-verify
  description: Format output and verify docs are up to date in CI.
  commands:
  - terraform-docs fmt ./README.md
  - terraform-docs markdown table --check .
  - terraform-docs markdown table --footer-from=./templates/footer.md .
  - terraform-docs markdown table --show inputs,outputs .
  - terraform-docs version
  examples:
  - terraform-docs fmt ./README.md
  - terraform-docs markdown table --check .
  - terraform-docs markdown table --show inputs,outputs .
  parameters:
  - name: check
    type: boolean
    description: Fail if docs are stale
  - name: show
    type: string
    description: 'Sections to show: inputs, outputs, providers, requirements'
knowledge:
- title: terraform-docs Documentation
  type: documentation
  source: https://terraform-docs.io/
  description: Formats, config file, and CLI reference
- title: terraform-docs GitHub
  type: documentation
  source: https://github.com/terraform-docs/terraform-docs
  description: Installation and usage examples
instructions: "# terraform-docs\n\nKeep Terraform module documentation generated, consistent, and fresh.\n\
  \n## What This Skill Does\n\n- Renders inputs/outputs/providers tables into README sections\n- Supports\
  \ markdown table, JSON, and Asciidoc formats\n- Sorts sections and filters by required fields\n- Fails\
  \ CI when docs are stale (--check)\n- Formats generated docs with terraform-docs fmt\n\n## When to Use\n\
  \n- Publishing reusable modules with accurate usage docs\n- CI gate ensuring README matches the code\n\
  - Onboarding docs for internal modules\n\n## Real Commands\n\n```bash\n# Generate\nterraform-docs markdown\
  \ table .\nterraform-docs markdown table --output-file README.md .\nterraform-docs json . > docs.json\n\
  terraform-docs markdown . --sort-by-required\nterraform-docs markdown table --show inputs,outputs .\n\
  terraform-docs markdown table --footer-from=./templates/footer.md .\n\n# Format and verify\nterraform-docs\
  \ fmt ./README.md\nterraform-docs markdown table --check .     # exit 1 when stale\nterraform-docs version\n\
  ```\n\n## .terraform-docs.yml Example\n\n```yaml\nformatter: markdown table\noutput:\n  file: README.md\n\
  \  mode: inject\nsort:\n  enabled: true\nsettings:\n  anchor: true\n  hide-empty: true\n```\n\n## Best\
  \ Practices\n\n- Add `--check` to CI so docs cannot drift\n- Use output mode inject to keep hand-written\
  \ sections\n- Commit generated docs (do not regenerate at apply time)\n- Keep `examples/` directories\
  \ in sync with README usage blocks\n- Run terraform-docs after every module change, same commit"
examples:
- input: Our module README is out of date
  output: Agent runs terraform-docs markdown table --output-file README.md, reviews the diff, and adds
    --check to CI
- input: Generate JSON docs for tooling
  output: Agent emits terraform-docs json and pipes it into a schema checker
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: terraform-docs.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-terraform-docs
  generic:
    system_prompt: 'You take the terraform-docs seat. You do it through docs-generation: Generate README
      and JSON docs from Terraform code. The commands are real, e.g. `terraform-docs markdown table .`.
      You run and verify the real CLI commands before you claim anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2024-01-01T00:00:00Z'
updated_at: '2024-01-01T00:00:00Z'
