name: terraform
display_name: Terraform
category: devops
subcategory: general
description: 'Writes and applies Terraform configurations: init, plan, apply, format, validate, workspaces,
  providers, and outputs.'
version: 2.0.0
tags:
- devops
author: Mehul Wagde
license: MIT
prerequisites:
- terraform
capabilities:
- name: core-workflow
  description: Initialize, plan, apply, and destroy infrastructure.
  commands:
  - terraform init
  - terraform plan -out plan.tfplan
  - terraform apply plan.tfplan
  - terraform destroy -auto-approve
  - terraform fmt -recursive
  - terraform validate
  examples:
  - terraform init
  - terraform plan -out plan.tfplan
  - terraform apply plan.tfplan
  parameters:
  - name: plan-file
    type: string
    description: Saved plan file
  - name: dir
    type: string
    description: Config directory
- name: modules-and-workspaces
  description: Work with modules, workspaces, outputs, and provider configs.
  commands:
  - terraform get -update
  - terraform workspace new prod
  - terraform workspace select dev
  - terraform output -json
  - terraform providers
  - terraform providers lock -platform=linux_amd64
  examples:
  - terraform get -update
  - terraform workspace select prod
  - terraform output -json
  parameters:
  - name: workspace
    type: string
    description: Workspace name
  - name: output
    type: string
    description: Output name to query
