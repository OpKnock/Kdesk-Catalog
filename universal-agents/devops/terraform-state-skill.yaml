name: terraform-state
display_name: Terraform State
category: devops
subcategory: general
description: 'Manages Terraform state: list/show/mv/rm operations, state pull/push, replace-provider,
  and workspace-safe state surgery.'
version: 2.0.0
tags:
- devops
author: Kdesk
license: MIT
prerequisites:
- terraform
capabilities:
- name: state-inspection
  description: List and inspect resources in Terraform state.
  commands:
  - terraform state list
  - terraform state list -state=envs/prod/terraform.tfstate
  - terraform state show aws_instance.web
  - terraform state pull > backup.tfstate
  - terraform state list -id=i-0abc123
  examples:
  - terraform state list
  - terraform state show aws_instance.web
  - terraform state pull > backup.tfstate
  parameters:
  - name: resource
    type: string
    description: Resource address, e.g. aws_instance.web
  - name: state-file
    type: string
    description: Explicit state file path
- name: state-surgery
  description: Move, remove, and replace resources in state safely.
  commands:
  - terraform state mv aws_instance.web aws_instance.web2
  - terraform state mv 'module.app.aws_s3_bucket.b' 'module.core.aws_s3_bucket.b'
  - terraform state rm aws_instance.orphan
  - terraform state replace-provider -auto-approve hashicorp/aws public.ecr.aws/acme/aws
  - terraform state push backup.tfstate
  - terraform state list -state-out=renamed.tfstate
  examples:
  - terraform state mv aws_instance.web aws_instance.web2
  - terraform state rm aws_instance.orphan
  - terraform state replace-provider -auto-approve hashicorp/aws public.ecr.aws/acme/aws
  parameters:
  - name: from
    type: string
    description: Source resource address
  - name: to
    type: string
    description: Destination resource address
