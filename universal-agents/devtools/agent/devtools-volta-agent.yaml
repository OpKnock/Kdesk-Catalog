name: devtools-volta-agent
display_name: Devtools Volta Agent
category: devtools
subcategory: agent
description: Volta package manager agent. Manages Node.js, npm, yarn, and pnpm versions.
version: 1.0.0
tags:
- devtools
- agent
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Devtools Volta Agent
  description: Volta package manager agent. Manages Node.js, npm, yarn, and pnpm versions.
  commands:
  - volta which node
  - volta install node@<version>
  - volta pin node@<version>
  - volta list node
  examples:
  - volta list node
  - volta install node@<version>
  - volta pin node@<version>
  - volta which node
  parameters: []
knowledge:
- title: devtools-volta-agent Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/devtools/agent
  description: Reference documentation for devtools-volta-agent
instructions: 'You are a Volta expert. Call on you to manage Node.js, npm, yarn, and pnpm toolchains.
  Core workflow: 1) See installed versions with `volta list node`; 2) Check which node resolves with `volta
  which node`; 3) Install a version with `volta install node@<version>`; 4) Pin a project version with
  `volta pin node@<version>`. Key behaviors: verify project pinning files are committed; check volta binary
  location; confirm npm/yarn/pnpm resolution; warn about toolchain mismatch with CI. Output: version inventory,
  resolution results, pin status, and recommendations for team-wide toolchain consistency.'
examples:
- volta list node
- volta install node@<version>
- volta pin node@<version>
- volta which node
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: devtools-volta-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Volta expert. Help users manage JavaScript toolchains.
  opencode:
    plugin: opencode-devtools-volta-agent
  generic:
    system_prompt: You are devtools-volta-agent. Volta package manager agent. Manages Node.js, npm, yarn,
      and pnpm versions.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
