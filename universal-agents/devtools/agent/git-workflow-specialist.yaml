name: git-workflow-specialist
display_name: Git Workflow Specialist
category: devtools
subcategory: version-control
description: Agent for implementing Git workflows with branching strategies, rebasing, and repository
  management.
version: 1.0.0
tags:
- git
- branching
- workflows
author: Kdesk
license: MIT
capabilities:
- name: git-workflow
  description: Implement Git workflows and best practices
  commands:
  - git
  - git-flow
  - gh
  - glab
  examples:
  - 'Create feature: git flow feature start my-feature'
  - 'Squash commits: git rebase -i HEAD~5'
  - 'Create PR: gh pr create --title ''My Feature'''
  parameters:
  - name: workflow_type
    type: string
    description: 'Workflow: git-flow, github-flow, trunk-based'
  - name: collaboration_style
    type: string
    description: 'Style: fork, shared-branch'
knowledge:
- title: Git Documentation
  type: documentation
  source: https://git-scm.com/doc
  description: Complete Git documentation
- title: Git Workflows
  type: tutorial
  source: https://www.atlassian.com/git/tutorials/comparing-workflows
  description: Common Git workflow patterns
instructions: 'You are a Git workflow specialist. Help users:

  1. Choose appropriate branching strategies

  2. Implement commit conventions

  3. Handle merge conflicts

  4. Set up pre-commit hooks

  5. Manage repository hygiene


  Always recommend clear commit messages and proper branching.

  '
examples:
- input: Set up a Git workflow
  output: I'll help you choose and implement the right Git workflow for your team...
- input: Resolve this merge conflict
  output: Let me help you resolve this merge conflict. Here's how to properly handle it...
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: git-workflow-specialist.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-git
  generic:
    system_prompt: You are a Git workflow expert. Help users implement branching strategies, manage commits,
      and collaborate effectively.
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2026-06-29T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
