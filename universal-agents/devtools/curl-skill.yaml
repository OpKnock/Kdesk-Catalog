name: curl-devtools
display_name: curl-devtools
category: devtools
subcategory: general
description: 'Makes HTTP requests with curl: headers, methods, auth, redirects, timeouts, retries, and
  output formatting for API debugging.'
version: 2.0.0
tags:
- devtools
author: Kdesk
license: MIT
capabilities:
- name: http-requests
  description: Send GET/POST/PUT requests with headers, bodies, and auth.
  commands:
  - curl -I http://localhost:8080
  - 'curl -X POST http://localhost:8080/items -H ''Content-Type: application/json'' -d ''{"name":"x"}'''
  - curl -u user:pass http://localhost:8080/me
  - 'curl -H ''Authorization: Bearer token123'' http://localhost:8080/data'
  - curl -k https://selfsigned.local
  - curl -L http://localhost:8080/redirect
  examples:
  - curl -X POST http://localhost:8080/items -d '{"name":"x"}'
  - 'curl -H ''Authorization: Bearer token123'' http://localhost:8080/data'
  - curl -I http://localhost:8080
  parameters:
  - name: method
    type: string
    description: HTTP method via -X
  - name: data
    type: string
    description: Request body via -d
  - name: header
    type: string
    description: Request header via -H
- name: downloads-and-metrics
  description: Download files and measure request timing and status.
  commands:
  - curl -o file.zip http://localhost:8080/file.zip
  - curl -O http://localhost:8080/file.zip
  - curl -w '%{http_code} %{time_total}\n' -o /dev/null http://localhost:8080
  - curl --retry 5 --retry-delay 2 --retry-all-errors http://localhost:8080/flaky
  - curl --max-time 30 http://localhost:8080/slow
  - curl -s http://localhost:8080/api | jq .
  examples:
  - curl -w '%{http_code} %{time_total}\n' -o /dev/null http://localhost:8080
  - curl --retry 5 --retry-delay 2 http://localhost:8080/flaky
  - curl -s http://localhost:8080/api | jq .
  parameters:
  - name: output
    type: string
    description: Output file via -o
  - name: retry
    type: integer
    description: Retry count
  - name: max-time
    type: integer
    description: Timeout in seconds
knowledge:
- title: curl Manual
  type: documentation
  source: https://curl.se/docs/manpage.html
  description: Every curl flag explained
- title: curl Everything Guide
  type: documentation
  source: https://everything.curl.dev/
  description: Deep dive into curl usage and HTTP
instructions: '# curl HTTP Client


  Interact with HTTP APIs and download files using curl.


  ## What This Skill Does


  - Sends requests with methods, headers, and bodies

  - Handles auth (basic, bearer, cookies)

  - Follows redirects and handles TLS variations

  - Measures latency and status with -w

  - Retries flaky requests and enforces timeouts


  ## When to Use


  - Debugging REST APIs from the shell

  - Health checks and smoke tests in scripts

  - Downloads with headers/redirects


  ## Real Commands


  ```bash

  # Requests

  curl -I https://example.com

  curl -X POST https://api.example.com/items   -H ''Content-Type: application/json'' -d ''{"name":"x"}''

  curl -u user:pass https://api.example.com/me

  curl -H ''Authorization: Bearer token123'' https://api.example.com/data

  curl -L https://example.com/redirect


  # Downloads

  curl -O https://example.com/file.zip

  curl -o file.zip https://example.com/file.zip


  # Timing and resilience

  curl -w ''%{http_code} %{time_total}\n'' -o /dev/null https://example.com

  curl --retry 5 --retry-delay 2 --retry-all-errors https://example.com/flaky

  curl --max-time 30 https://example.com/slow

  curl -s https://api.example.com/data | jq .

  ```


  ## Best Practices


  - Use -w with -o /dev/null for clean timing checks

  - Always set --max-time in scripts to avoid hangs

  - Use -f to fail on HTTP errors for scripting exit codes

  - Never put credentials in URLs; use -u or Authorization headers

  - Add -sS to suppress progress but keep errors visible in cron'
examples:
- input: Check if the API is healthy and fast
  output: Agent runs curl -w with status and timing, outputting a health summary
- input: POST a JSON payload to create a resource
  output: Agent sends the POST with content-type and body, then validates the response code and body
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: curl-devtools.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-curl
  generic:
    system_prompt: 'This is your domain: curl-devtools. You do it through http-requests: Send GET/POST/PUT
      requests with headers, bodies, and auth. The commands are real, e.g. `curl -I https://example.com`.
      You answer with exact commands, not abstractions, and flag anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
