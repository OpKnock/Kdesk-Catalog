- title: asdf Documentation
  type: documentation
  source: https://asdf-vm.com/
  description: Multi-language version manager docs
- title: direnv
  type: documentation
  source: https://direnv.net/
  description: Per-directory environment loading
- title: mise
  type: documentation
  source: https://mise.jdx.dev/
  description: dev tools, env vars, and tasks manager
instructions: '# Environment Engineering


  Set up and standardize development environments across machines.


  ## What This Skill Does


  - Installs and manages runtime versions (asdf/mise)

  - Loads project-specific env vars with direnv

  - Writes .tool-versions/.mise.toml for repo pinning

  - Bootstraps shell configs (bash/zsh/fish)

  - Debugs PATH and environment variable issues


  ## When to Use


  - Onboarding a new machine or teammate

  - Multiple projects needing different runtime versions

  - Environment variable chaos between projects


  ## Real Commands


  ```bash

  # asdf

  asdf plugin add nodejs

  asdf install nodejs 20.11.0

  asdf global nodejs 20.11.0

  asdf local nodejs 20.11.0   # writes .tool-versions

  asdf current


  # mise

  mise use node@22

  mise use --global node@lts

  mise install

  mise ls


  # direnv

  direnv allow .

  direnv edit .          # edit .envrc

  direnv status

  direnv reload

  ```


  ## .envrc Example


  ```bash

  export API_URL=http://localhost:8080

  export NODE_ENV=development

  use asdf

  ```


  ## Best Practices


  - Commit .tool-versions or .mise.toml to pin runtimes per repo

  - Keep dotfiles in a git repo with a bootstrap script

  - Use direnv to scope secrets to directories, not shells

  - Document the golden PATH in the repo README

  - Test environment bootstrap in CI with a clean container'
examples:
- input: Projects need different Node versions
  output: Agent sets up asdf with .tool-versions per project and verifies version switching
- input: API keys keep leaking between projects
  output: Agent moves secrets into .envrc per project and enforces direnv allow
