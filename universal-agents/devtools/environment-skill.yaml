name: environment
display_name: environment
category: devtools
subcategory: general
description: 'Manages development environments: dotfiles, asdf/mise version managers, direnv environment
  switching, and shell init configs.'
version: 2.0.0
tags:
- devtools
author: Kdesk
license: MIT
prerequisites:
- asdf
- direnv
- env
- mise
- source
capabilities:
- name: runtime-version-managers
  description: Install and switch tool versions with asdf/mise.
  commands:
  - asdf plugin add nodejs https://github.com/asdf-vm/asdf-nodejs.git
  - asdf install nodejs 20.11.0
  - asdf global nodejs 20.11.0
  - asdf current
  - mise use node@22
  - mise install
  examples:
  - asdf install nodejs 20.11.0
  - asdf global nodejs 20.11.0
  - mise use node@22
  parameters:
  - name: tool
    type: string
    description: Tool name, e.g. nodejs, python, ruby
  - name: version
    type: string
    description: Version to install or set
- name: directory-env-and-shell
  description: Load environment variables per directory with direnv and manage shell init.
  commands:
  - direnv allow .
  - direnv edit .
  - direnv status
  - direnv reload
  - env | grep -i api
  - source .env
  examples:
  - direnv allow .
  - direnv edit .
  - direnv status
  parameters:
  - name: dir
    type: string
    description: Directory with .envrc
  - name: env-var
    type: string
    description: Environment variable to inspect or set
