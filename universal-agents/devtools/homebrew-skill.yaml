name: homebrew
display_name: Homebrew
category: devtools
subcategory: general
description: 'Installs and manages macOS/Linux software with Homebrew: formulae, casks, services, cleanup,
  and Brewfile workflows.'
version: 2.0.0
tags:
- devtools
author: Mehul Wagde
license: MIT
prerequisites:
- brew
capabilities:
- name: package-operations
  description: Install, search, upgrade, and uninstall formulae and casks.
  commands:
  - brew search postgres
  - brew install postgresql@16
  - brew install --cask docker
  - brew upgrade
  - brew uninstall --cask docker
  - brew list
  examples:
  - brew install postgresql@16
  - brew install --cask docker
  - brew upgrade
  parameters:
  - name: package
    type: string
    description: Formula or cask name
  - name: cask
    type: boolean
    description: Treat package as a GUI cask
- name: services-and-cleanup
  description: Run background services and maintain a clean brew state.
  commands:
  - brew services start postgresql@16
  - brew services list
  - brew services stop redis
  - brew cleanup --prune=7
  - brew autoremove
  - brew doctor
  examples:
  - brew services start postgresql@16
  - brew cleanup --prune=7
  - brew doctor
  parameters:
  - name: service
    type: string
    description: Service name
  - name: prune
    type: string
    description: Cache age to prune
knowledge:
- title: Homebrew Documentation
  type: documentation
  source: https://docs.brew.sh/
  description: Formulae, casks, commands, and taps
- title: Homebrew Formulae Search
  type: documentation
  source: https://formulae.brew.sh/
  description: Search installed formulae and casks
instructions: '# Homebrew Package Management


  Install and manage open-source software on macOS/Linux with Homebrew.


  ## What This Skill Does


  - Installs formulae (CLI tools) and casks (GUI apps)

  - Searches, upgrades, and uninstalls packages

  - Manages background services (brew services)

  - Cleans caches and orphaned dependencies

  - Creates Brewfiles for machine bootstrapping


  ## When to Use


  - Installing dev tools on macOS

  - Bootstrapping a new machine from a Brewfile

  - Managing services like postgres/redis locally


  ## Real Commands


  ```bash

  # Install

  brew search postgres

  brew install postgresql@16

  brew install --cask docker

  brew install --formula jq yq


  # Update

  brew update

  brew upgrade

  brew upgrade postgresql@16


  # Uninstall

  brew uninstall postgresql@16

  brew uninstall --cask docker


  # Services

  brew services start postgresql@16

  brew services list

  brew services stop redis

  brew services restart --all


  # Maintenance

  brew cleanup --prune=7

  brew autoremove

  brew doctor

  brew list --cask

  ```


  ## Brewfile Example


  ```ruby

  tap "homebrew/cask"

  brew "jq"

  brew "postgresql@16", link: true

  cask "docker"

  cask "visual-studio-code"

  ```


  ## Best Practices


  - Commit a Brewfile and run `brew bundle` on new machines

  - Prefer `brew services` over launchctl for background tools

  - Run brew doctor after major macOS upgrades

  - Use versioned formulae (postgresql@16) for project parity

  - Clean up weekly: cleanup + autoremove'
examples:
- input: Set up a new Mac with all our tools
  output: Agent writes a Brewfile from brew list and brew list --cask, then runs brew bundle
- input: Start postgres as a background service
  output: Agent installs the formula, starts the service, and verifies with brew services list
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: homebrew.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-homebrew
  generic:
    system_prompt: 'You own Homebrew end to end. You do it through package-operations: Install, search,
      upgrade, and uninstall formulae and casks. The commands are real, e.g. `brew search postgres`. You
      verify each step you report and stay honest about what you have not run.'
    available_tools:
    - bash
    - read
    - write
    - edit
