name: minifier
display_name: minifier
category: devtools
subcategory: general
description: Minify and mangle JS bundles with terser and esbuild. Minify CSS/HTML and apply gzip/brotli handling transfer size.
  and gzip/brotli compression.'
version: 2.0.0
tags:
- devtools
author: Mehul Wagde
license: MIT
prerequisites:
- brotli
- esbuild
- gzip
- npx
- terser
capabilities:
- name: javascript-minification
  description: Minify and mangle JS bundles with terser and esbuild.
  commands:
  - terser input.js -o output.min.js
  - npx terser input.js --compress --mangle --source-map
  - esbuild app.js --minify --bundle --outfile=app.min.js
  - esbuild --minify --target=es2020 app.js -o app.min.js
  - npx uglifyjs input.js -c -m -o output.min.js
  examples:
  - terser input.js -o output.min.js
  - esbuild app.js --minify --bundle --outfile=app.min.js
  - npx uglifyjs input.js -c -m -o output.min.js
  parameters:
  - name: input
    type: string
    description: Input file
  - name: output
    type: string
    description: Output file
  - name: mangle
    type: boolean
    description: Rename variables to short names
- name: css-html-and-compression
  description: Minify CSS/HTML and apply gzip/brotli for transfer size.
  commands:
  - npx cssnano styles.css styles.min.css
  - npx html-minifier-terser --collapse-whitespace --remove-comments index.html -o index.min.html
  - gzip -9 -k -c bundle.js > bundle.js.gz
  - brotli -q 11 -o bundle.js.br bundle.js
  - npx svgo -f assets/icons -o assets/icons-min
  examples:
  - npx cssnano styles.css styles.min.css
  - npx html-minifier-terser --collapse-whitespace index.html -o index.min.html
  - brotli -q 11 -o bundle.js.br bundle.js
  parameters:
  - name: level
    type: integer
    description: Compression level (gzip 1-9, brotli 0-11)
  - name: quality
    type: integer
    description: SVG/asset quality
knowledge:
- title: Terser
  type: documentation
  source: https://terser.org/
  description: 'Terser options: compress, mangle, source maps'
- title: esbuild Minify
  type: documentation
  source: https://esbuild.github.io/api/#minify
  description: esbuild minify flags and targets
- title: cssnano
  type: documentation
  source: https://cssnano.co/
  description: CSS minifier plugins and presets
- title: html-minifier-terser
  type: documentation
  source: https://github.com/terser/html-minifier-terser
  description: HTML minification options
instructions: '# Asset Minification


  Shrink JavaScript, CSS, HTML, and images for production delivery.


  ## What This Skill Does


  - Minifies and mangles JS (terser/esbuild/uglify)

  - Compresses CSS (cssnano) and HTML

  - Optimizes SVG (svgo)

  - Applies gzip/brotli transfer encodings

  - Measures before/after sizes


  ## When to Use


  - Build pipeline release steps

  - Reducing bundle size for page speed budgets

  - Preparing static assets for CDN upload


  ## Real Commands


  ```bash

  # JavaScript

  terser input.js -o output.min.js

  npx terser input.js --compress --mangle --source-map

  esbuild app.js --minify --bundle --outfile=app.min.js

  esbuild --minify --target=es2020 app.js -o app.min.js

  npx uglifyjs input.js -c -m -o output.min.js


  # CSS / HTML / SVG

  npx cssnano styles.css styles.min.css

  npx html-minifier-terser --collapse-whitespace --remove-comments index.html -o index.min.html

  npx svgo -f assets/icons -o assets/icons-min


  # Transfer compression

  gzip -9 -k -c bundle.js > bundle.js.gz

  brotli -q 11 -o bundle.js.br bundle.js


  # Verify

  ls -lh input.js output.min.js output.min.js.gz

  ```


  ## Best Practices


  - Generate source maps in staging builds for debugging

  - Minify at build time, not runtime

  - Precompress with brotli for HTTP servers that support it

  - Check bundle budgets in CI after minification

  - Verify no behavior change: diff runtime tests before/after'
examples:
- input: Shrink our 2MB JS bundle
  output: Agent runs esbuild with minify + bundle, compares sizes, and adds brotli precompression
- input: Minify all SVGs in a folder
  output: Agent runs svgo over the directory and reports total savings
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: minifier.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-minifier
  generic:
    system_prompt: 'You take the minifier seat. You do it through javascript-minification: Minify and
      mangle JS bundles with terser and esbuild. The commands are real, e.g. `terser input.js -o output.min.js`.
      You verify each step you report and stay honest about what you have not run.'
    available_tools:
    - bash
    - read
    - write
    - edit
