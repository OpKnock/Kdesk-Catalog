name: monorepo
display_name: monorepo
category: devtools
subcategory: general
description: 'Manages monorepo builds with pnpm workspaces, Turborepo, and Nx: task orchestration, affected
  builds, versioning, and changesets.'
version: 2.0.0
tags:
- devtools
author: Mehul Wagde
license: MIT
prerequisites:
- npx
- pnpm
capabilities:
- name: workspace-commands
  description: Run commands across workspace packages with pnpm.
  commands:
  - pnpm -r test
  - pnpm --filter @org/api test
  - pnpm -r --workspace-concurrency=4 build
  - pnpm -F @org/web add lodash
  - pnpm list -r --depth=-1
  examples:
  - pnpm -r test
  - pnpm --filter @org/api test
  - pnpm -F @org/web add lodash
  parameters:
  - name: filter
    type: string
    description: Package filter, e.g. @org/api
  - name: recursive
    type: boolean
    description: Run in all workspaces (-r)
- name: task-orchestration
  description: Orchestrate build tasks and version packages with Turborepo/Nx and changesets.
  commands:
  - npx turbo run build
  - npx turbo run lint --filter=@org/api
  - npx turbo run test --affected --base=origin/main
  - nx affected -t build --base=main
  - npx changeset add
  - npx changeset version
  examples:
  - npx turbo run build
  - npx turbo run test --affected --base=origin/main
  - npx changeset version
  parameters:
  - name: task
    type: string
    description: Task name, e.g. build, test, lint
  - name: affected
    type: boolean
    description: Run only for changed packages
knowledge:
- title: Turborepo Documentation
  type: documentation
  source: https://turborepo.dev/docs
  description: Task pipelines, caching, and remote caching
- title: Nx Documentation
  type: documentation
  source: https://nx.dev/
  description: affected commands, project graphs, generators
- title: pnpm Workspaces
  type: documentation
  source: https://pnpm.io/workspaces
  description: Workspace config and filter syntax
- title: Changesets
  type: documentation
  source: https://github.com/changesets/changesets
  description: Versioning and publishing monorepo packages
instructions: '# Monorepo Engineering


  Structure and run multi-package repositories efficiently.


  ## What This Skill Does


  - Manages pnpm workspaces and package filters

  - Orchestrates tasks with Turborepo/Nx caching

  - Runs affected-only tasks on CI

  - Versions packages with changesets

  - Handles cross-package dependency graphs


  ## When to Use


  - Multi-package JS/TS repos sharing tooling

  - CI builds taking too long (caching/affected)

  - Publishing multiple packages in lockstep


  ## Real Commands


  ```bash

  # pnpm workspaces

  pnpm -r test

  pnpm --filter @org/api test

  pnpm -r --workspace-concurrency=4 build

  pnpm -F @org/web add lodash

  pnpm list -r --depth=-1


  # Turborepo

  npx turbo run build

  npx turbo run lint --filter=@org/api

  npx turbo run test --affected --base=origin/main

  npx turbo run dev --parallel


  # Nx

  nx affected -t build --base=main

  nx run-many -t test --projects=@org/api,@org/web

  nx graph


  # Versioning

  npx changeset add

  npx changeset version

  npx changeset publish

  ```


  ## Best Practices


  - Use filter/affected to keep CI fast and focused

  - Commit turbo/nx cache config; enable remote caching

  - One lockfile, consistent dependency versions across packages

  - Use changesets for atomic version decisions

  - Keep build-time dependencies shallow; use workspace:* protocols'
examples:
- input: CI tests keep running for unchanged packages
  output: Agent sets up turbo affected pipelines against origin/main and rewires CI
- input: Release two packages together
  output: Agent creates a changeset, versions both packages, and publishes with tags
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: monorepo.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-monorepo
  generic:
    system_prompt: 'Your lane is monorepo. You do it through workspace-commands: Run commands across workspace
      packages with pnpm. The commands are real, e.g. `pnpm -r test`. You answer with exact commands,
      not abstractions, and flag anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
