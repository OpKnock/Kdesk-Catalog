name: package-management
display_name: package-management
category: devtools
subcategory: general
description: 'Manages dependencies across ecosystems: npm/pnpm/yarn, pip/uv, cargo, and go modules — install,
  update, audit, and CI strategies.'
version: 2.0.0
tags:
- devtools
author: Mehul Wagde
license: MIT
prerequisites:
- cargo
- npm
- pip
- pip-audit
- pnpm
- yarn
capabilities:
- name: js-package-managers
  description: Install and audit JavaScript dependencies with npm/pnpm/yarn.
  commands:
  - npm install
  - npm ci
  - npm audit --audit-level=high
  - npm outdated
  - pnpm dlx create-vite@latest myapp
  - yarn upgrade-interactive
  examples:
  - npm ci
  - npm audit --audit-level=high
  - pnpm dlx create-vite@latest myapp
  parameters:
  - name: package
    type: string
    description: Package name
  - name: audit-level
    type: string
    description: Audit severity threshold
- name: python-and-system
  description: Manage Python, Rust, and Go dependencies.
  commands:
  - pip install -r requirements.txt
  - pip-audit -r requirements.txt
  - uv pip install -r pyproject.toml
  - cargo add serde --features derive
  - cargo audit
  - go mod tidy
  - go get -u ./...
  examples:
  - pip-audit -r requirements.txt
  - cargo audit
  - go mod tidy
  parameters:
  - name: file
    type: string
    description: Requirements/manifest file
  - name: crate
    type: string
    description: Crate name for cargo add
knowledge:
- title: npm CLI
  type: documentation
  source: https://docs.npmjs.com/cli/
  description: npm install, ci, audit, outdated reference
- title: pip-audit
  type: documentation
  source: https://github.com/pypa/pip-audit
  description: Python dependency vulnerability scanner
- title: cargo-audit
  type: documentation
  source: https://rustsec.org/
  description: RustSec advisory database and cargo audit
- title: uv
  type: documentation
  source: https://docs.astral.sh/uv/
  description: Fast Python package manager
instructions: '# Cross-Ecosystem Package Management


  Install, update, and audit dependencies across languages.


  ## What This Skill Does


  - Manages JS deps (npm/pnpm/yarn) with lockfiles

  - Manages Python deps (pip/uv) and virtualenvs

  - Manages Rust (cargo) and Go modules

  - Audits all ecosystems for vulnerabilities

  - Advises on lockfile and CI strategies


  ## When to Use


  - Setting up dependency management for a project

  - Responding to vulnerability advisories

  - Standardizing package manager workflows


  ## Real Commands


  ```bash

  # JavaScript

  npm install

  npm ci                          # clean lockfile install

  npm audit --audit-level=high

  npm outdated

  pnpm dlx create-vite@latest myapp

  yarn upgrade-interactive


  # Python

  python -m venv .venv

  pip install -r requirements.txt

  pip-audit -r requirements.txt

  uv pip install -e ".[dev]"


  # Rust / Go

  cargo add serde --features derive

  cargo audit

  cargo update

  go mod tidy

  go get -u ./...

  ```


  ## Best Practices


  - Commit lockfiles and use npm ci / pnpm install --frozen-lockfile in CI

  - Run audits on every merge (npm audit, pip-audit, cargo audit)

  - Prefer one package manager per repo; do not mix

  - Pin direct deps, let transitive resolve from lockfile

  - Use uv for speed on large Python projects

  - Add `dependabot` or Renovate for automated update PRs'
examples:
- input: A high-severity advisory hit our JS deps
  output: Agent runs npm audit --audit-level=high, identifies the chain, updates the package, and re-audits
- input: Set up Python deps with reproducible installs
  output: Agent creates requirements with pinned versions, tests pip-audit, and adds a CI audit step
