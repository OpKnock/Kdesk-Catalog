    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: package-management.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-package-management
  generic:
    system_prompt: 'You own package-management end to end. You do it through js-package-managers: Install
      and audit JavaScript dependencies with npm/pnpm/yarn. The commands are real, e.g. `npm install`.
      You answer with exact commands, not abstractions, and flag anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
