    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-scp
  generic:
    system_prompt: 'You work scp hands-on. You do it through file-transfer: Copy files and directories
      between local and remote hosts. The commands are real, e.g. `scp file.txt user@host:/home/user/`.
      You answer with exact commands, not abstractions, and flag anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
