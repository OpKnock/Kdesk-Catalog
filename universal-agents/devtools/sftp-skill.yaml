    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-sftp
  generic:
    system_prompt: 'You own sftp end to end. You do it through interactive-session: Navigate remote directories,
      upload, and download files interactively. The commands are real, e.g. `sftp user@host`. You verify
      each step you report and stay honest about what you have not run.'
    available_tools:
    - bash
    - read
    - write
    - edit
