name: sftp
display_name: sftp
category: devtools
subcategory: general
description: 'Interacts with remote filesystems over SFTP: interactive sessions, batch mode, uploads/downloads,
  and permission management.'
version: 2.0.0
tags:
- devtools
author: Kdesk-Catalog
license: MIT
prerequisites:
- bye
- get
- ls,
- mkdir
- put
- sftp
capabilities:
- name: interactive-session
  description: Navigate remote directories, upload, and download files interactively.
  commands:
  - sftp user@host
  - sftp -oPort=2222 user@host
  - sftp -i ~/.ssh/id_ed25519 user@host
  - ls, cd, pwd, lcd, lls
  - get -r /srv/logs/ ./logs/
  - put -P report.pdf /tmp/
  examples:
  - sftp user@host
  - get -r /srv/logs/ ./logs/
  - put -P report.pdf /tmp/
  parameters:
  - name: host
    type: string
    description: Remote host
  - name: port
    type: integer
    description: SSH port
- name: batch-and-management
  description: Run scripted transfers and manage remote files.
  commands:
  - sftp -b batch.txt user@host
  - sftp -b - user@host <<< $'put f.txt\nbye'
  - sftp user@host <<< $'mget /data/*.csv'
  - mkdir /backups/new && chmod 700 /backups
  - rm /tmp/old.log
  - bye
  examples:
  - sftp -b batch.txt user@host
  - sftp user@host <<< $'mget /data/*.csv'
  - mkdir /backups/new
  parameters:
  - name: batch-file
    type: string
    description: File with sftp commands
  - name: remote-path
    type: string
    description: Remote path for operations
knowledge:
- title: sftp Manual (OpenBSD)
  type: documentation
  source: https://man.openbsd.org/sftp
  description: sftp commands and options
- title: sftp Linux Manual
  type: documentation
  source: https://man7.org/linux/man-pages/man1/sftp.1.html
  description: Linux sftp reference
instructions: '# SFTP Operations


  Work with remote files over secure FTP.


  ## What This Skill Does


  - Starts interactive SFTP sessions with custom ports/keys

  - Uploads (put) and downloads (get) files and trees

  - Navigates remote and local dirs (cd, lcd, ls, lls)

  - Manages remote files: mkdir, rm, chmod, rename

  - Runs scripted batch transfers non-interactively


  ## When to Use


  - Interactive remote file management

  - Scripted nightly uploads/downloads

  - When rsync is unavailable on the remote


  ## Real Commands


  ```bash

  # Session

  sftp user@host

  sftp -oPort=2222 user@host

  sftp -i ~/.ssh/id_ed25519 user@host


  # Interactive commands (inside sftp)

  ls, pwd

  lcd ./downloads, lls

  get file.txt

  get -r /srv/logs/ ./logs/

  put report.pdf /tmp/

  put -P report.pdf /tmp/          # preserve times

  mkdir /backups/new

  chmod 700 /backups

  rm /tmp/old.log

  bye


  # Batch mode

  sftp -b batch.txt user@host

  sftp -b - user@host <<< $''put f.txt

  bye''

  sftp user@host <<< $''mget /data/*.csv''

  ```


  ## batch.txt Example


  ```

  lcd ./out

  put build.tar.gz /srv/app/

  chmod 644 /srv/app/build.tar.gz

  bye

  ```


  ## Best Practices


  - Use -P flag on put to preserve modification times

  - Test batch files with a dry list-only first

  - Use get -r for recursive pulls

  - Prefer rsync when you need delta sync or delete mirroring

  - Always end batch files with bye to close cleanly'
examples:
- input: Pull all CSVs from /data on the remote
  output: Agent runs an sftp batch with mget, local cd, and bye
- input: Upload a release artifact with correct perms
  output: Agent puts the tar with -P and chmods it to 755 in one batch
