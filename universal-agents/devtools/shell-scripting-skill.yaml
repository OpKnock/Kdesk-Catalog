name: shell-scripting
display_name: shell-scripting
category: devtools
subcategory: general
description: 'Writes robust POSIX/bash scripts: syntax checking, shellcheck linting, error handling with
  set -euo pipefail, and cross-platform portability.'
version: 2.0.0
tags:
- devtools
author: Kdesk
license: MIT
prerequisites:
- bash
- checkbashisms
- command
- local
- readonly
- set
- shellcheck
- shfmt
- timeout
- trap
capabilities:
- name: script-quality
  description: Validate and lint shell scripts for correctness.
  commands:
  - bash -n script.sh
  - shellcheck script.sh
  - shellcheck -x -S warning script.sh
  - shfmt -w script.sh
  - bash -x script.sh
  - checkbashisms script.sh
  examples:
  - bash -n script.sh
  - shellcheck -x -S warning script.sh
  - shfmt -w script.sh
  parameters:
  - name: script
    type: string
    description: Script file path
  - name: severity
    type: string
    description: 'Minimum severity: error, warning, info, style'
- name: robust-patterns
  description: Write error-safe scripts with strict mode and defensive patterns.
  commands:
  - set -euo pipefail
  - trap 'echo failed at line $LINENO; exit 1' ERR
  - timeout 60 curl -sS http://localhost:8080
  - command -v jq >/dev/null || { echo 'jq required'; exit 1; }
  - readonly CONFIG=/etc/app.conf
  - local TMPFILE=$(mktemp)
  examples:
  - set -euo pipefail
  - trap 'echo failed at line $LINENO' ERR
  - command -v jq >/dev/null || exit 1
  parameters:
  - name: var
    type: string
    description: Variable name for readonly/local
  - name: timeout-seconds
    type: integer
    description: Timeout for guarded commands
knowledge:
- title: ShellCheck
  type: documentation
  source: https://www.shellcheck.net/
  description: Shell script linting tool and rule catalog
- title: Bash Reference Manual
  type: documentation
  source: https://www.gnu.org/software/bash/manual/bash.html
  description: Bash language reference
- title: POSIX Shell Utilities
  type: documentation
  source: https://pubs.opengroup.org/onlinepubs/9699919799/utilities/contents.html
  description: Portable shell command definitions
instructions: '# Shell Scripting


  Write correct, portable, debuggable shell scripts.


  ## What This Skill Does


  - Checks syntax and lints with shellcheck

  - Formats consistently with shfmt

  - Enforces strict error handling (set -euo pipefail)

  - Uses traps for cleanup and error reporting

  - Handles args, env vars, and external tool checks


  ## When to Use


  - Automating CI steps, deploys, or ops tasks

  - Porting scripts between bash/sh environments

  - Debugging subtle quoting and expansion bugs


  ## Real Commands


  ```bash

  # Validate

  bash -n script.sh

  shellcheck script.sh

  shellcheck -x -S warning script.sh    # follow sources, min severity

  shfmt -w script.sh

  checkbashisms script.sh               # POSIX portability


  # Debug

  bash -x script.sh

  bash -x -v script.sh


  # Strict patterns

  set -euo pipefail

  trap ''echo failed at line $LINENO'' ERR

  command -v jq >/dev/null || { echo ''jq is required''; exit 1; }

  readonly CONFIG=/etc/app.conf

  local TMPFILE=$(mktemp)

  trap ''rm -f "$TMPFILE"'' EXIT

  ```


  ## Script Skeleton


  ```bash

  #!/usr/bin/env bash

  set -euo pipefail


  usage() { echo "usage: $0 <env>"; exit 1; }

  [[ $# -eq 1 ]] || usage


  env="$1"

  echo "deploying to $env"

  ```


  ## Best Practices


  - Always lint with shellcheck before committing

  - Quote every expansion: "$var", "$(cmd)"

  - Use -euo pipefail in every non-interactive script

  - Use local in functions; mktemp + EXIT trap for temp files

  - Prefer bash -n in CI pre-commit hooks'
examples:
- input: My deploy script fails mysteriously on quoting
  output: Agent runs shellcheck, fixes SC2086-style unquoted expansions, and tests with bash -x
- input: Make a script portable to POSIX sh
  output: Agent replaces bashisms flagged by checkbashisms and re-lints
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: shell-scripting.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-shell-scripting
  generic:
    system_prompt: 'Your lane is shell-scripting. You do it through script-quality: Validate and lint
      shell scripts for correctness. The commands are real, e.g. `bash -n script.sh`. You run and verify
      the real CLI commands before you claim anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
