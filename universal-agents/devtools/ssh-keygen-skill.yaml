name: ssh-keygen
display_name: ssh-keygen
category: devtools
subcategory: general
description: 'Generates and manages SSH key pairs: ed25519/RSA creation, fingerprinting, passphrase changes,
  host key verification, and known_hosts.'
version: 2.0.0
tags:
- devtools
author: Kdesk-Catalog
license: MIT
prerequisites:
- ssh-keygen
- ssh-keyscan
capabilities:
- name: key-generation
  description: Generate strong key pairs and export public keys.
  commands:
  - ssh-keygen -t ed25519 -C "jane@example.com"
  - ssh-keygen -t rsa -b 4096 -f ~/.ssh/id_rsa
  - ssh-keygen -y -f ~/.ssh/id_ed25519
  - ssh-keygen -t ed25519 -N '' -f /tmp/testkey
  - ssh-keygen -p -f ~/.ssh/id_ed25519
  examples:
  - ssh-keygen -t ed25519 -C "jane@example.com"
  - ssh-keygen -t rsa -b 4096 -f ~/.ssh/id_rsa
  - ssh-keygen -p -f ~/.ssh/id_ed25519
  parameters:
  - name: type
    type: string
    description: 'Key type: ed25519, rsa, ecdsa'
  - name: bits
    type: integer
    description: Key bits for rsa (-b)
  - name: file
    type: string
    description: Key file path (-f)
  - name: comment
    type: string
    description: Key comment (-C)
- name: host-and-fingerprints
  description: Verify host keys and manage known_hosts.
  commands:
  - ssh-keygen -l -f ~/.ssh/id_ed25519.pub
  - ssh-keygen -l -E sha256 -f /etc/ssh/ssh_host_ed25519_key.pub
  - ssh-keygen -F github.com
  - ssh-keygen -R github.com
  - ssh-keygen -H -F github.com
  - ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
  examples:
  - ssh-keygen -l -f ~/.ssh/id_ed25519.pub
  - ssh-keygen -R github.com
  - ssh-keyscan -t ed25519 github.com
  parameters:
  - name: host
    type: string
    description: Host name for known_hosts ops
  - name: file
    type: string
    description: Public key file for fingerprinting
knowledge:
- title: ssh-keygen Manual
  type: documentation
  source: https://man.openbsd.org/ssh-keygen
  description: Full ssh-keygen option reference
- title: GitHub SSH Docs
  type: documentation
  source: https://docs.github.com/en/authentication/connecting-to-github-with-ssh
  description: Generating and adding keys to GitHub
instructions: '# SSH Key Management


  Create and manage SSH keys: generation, fingerprints, passphrases, known_hosts.


  ## What This Skill Does


  - Generates ed25519/RSA key pairs

  - Exports and fingerprints keys

  - Changes passphrases and re-keys

  - Manages known_hosts entries

  - Verifies host keys before connecting


  ## When to Use


  - Setting up SSH auth for a new machine

  - Auditing key fingerprints

  - Fixing host key mismatch errors


  ## Real Commands


  ```bash

  # Generation

  ssh-keygen -t ed25519 -C "jane@example.com"

  ssh-keygen -t rsa -b 4096 -f ~/.ssh/id_rsa

  ssh-keygen -t ed25519 -N '''' -f /tmp/ci-key


  # Public key and fingerprints

  ssh-keygen -y -f ~/.ssh/id_ed25519

  ssh-keygen -l -f ~/.ssh/id_ed25519.pub

  ssh-keygen -l -E sha256 -f /etc/ssh/ssh_host_ed25519_key.pub


  # Passphrase

  ssh-keygen -p -f ~/.ssh/id_ed25519


  # known_hosts

  ssh-keygen -F github.com

  ssh-keygen -R github.com

  ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

  ```


  ## Best Practices


  - Prefer ed25519; use RSA 4096 only for legacy servers

  - Always set a comment (-C) identifying the key owner

  - Verify fingerprints against official channels before trusting hosts

  - Use ssh-keygen -R to purge stale host entries

  - Never share private keys; public keys travel safely'
examples:
- input: Set up SSH for GitHub
  output: Agent generates an ed25519 key, prints the pub key for GitHub, and tests with ssh -T git@github.com
- input: Host key changed on our server
  output: Agent verifies the new fingerprint, removes the old entry, and re-adds the fresh one
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ssh-keygen.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-ssh-keygen
  generic:
    system_prompt: 'Your lane is ssh-keygen. You do it through key-generation: Generate strong key pairs
      and export public keys. The commands are real, e.g. `ssh-keygen -t ed25519 -C jane@example.com`.
      You answer with exact commands, not abstractions, and flag anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
