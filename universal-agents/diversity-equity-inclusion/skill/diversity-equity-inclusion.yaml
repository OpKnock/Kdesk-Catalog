  description: Org members, teams, and events API
- title: EEOC Employer Guidance
  type: documentation
  source: https://www.eeoc.gov/employers
  description: Legal frameworks for workplace equity
- title: Inclusive Language Guide
  type: documentation
  source: https://developers.google.com/style/inclusive-documentation
  description: Google inclusive documentation guidance
