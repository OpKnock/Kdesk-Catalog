  description: Repository supply-chain security scoring
- title: Microsoft Presidio
  type: documentation
  source: https://microsoft.github.io/presidio/
  description: PII detection and anonymization
- title: NIST AI RMF
  type: documentation
  source: https://www.nist.gov/itl/ai-risk-management-framework
  description: AI risk management framework
