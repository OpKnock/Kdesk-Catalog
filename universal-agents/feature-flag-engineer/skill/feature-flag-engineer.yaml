- name: launchdarkly
  description: Manage LaunchDarkly feature flags, environments, and segments via ldcli.
  commands:
  - ldcli config --access-token $LD_ACCESS_TOKEN
  - ldcli feature-flags list --project-key my-project --environment-key production
  - ldcli feature-flags create --project-key my-project --key dark-mode --name 'Dark Mode' --description
