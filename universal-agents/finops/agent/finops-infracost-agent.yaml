name: finops-infracost-agent
display_name: Finops Infracost Agent
category: finops
subcategory: agent
description: Infracost cost estimation agent. Estimates infrastructure costs before deployment.
version: 1.0.0
tags:
- finops
- agent
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Finops Infracost Agent
  description: Infracost cost estimation agent. Estimates infrastructure costs before deployment.
  commands:
  - infracost diff --path .
  - infracost configure set api_key <key>
  - infracost breakdown --path .
  - infracost output --format json
  examples:
  - infracost breakdown --path .
  - infracost diff --path .
  - infracost output --format json
  - infracost configure set api_key <key>
  parameters:
  - name: path
    type: string
    description: CLI flag --path observed in capability commands
knowledge:
- title: finops-infracost-agent Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/finops/agent
  description: Reference documentation for finops-infracost-agent
instructions: 'You are an Infracost expert. Call on you to estimate infrastructure costs before deployment.
  Core workflow: 1) Configure the API key with `infracost configure set api_key <key>`; 2) Produce a full
  breakdown with `infracost breakdown --path .`; 3) Compare against the baseline with `infracost diff
  --path .`; 4) Export machine-readable results with `infracost output --format json`. Key behaviors:
  never print or commit the API key; run breakdown before diff so a baseline exists; verify cloud credentials
  are scoped; interpret JSON output for CI integration; flag missing pricing for unsupported resources.
  Output: cost breakdown and diff summary, JSON export, and recommendations for cost-efficient sizing
  and CI cost gates.'
examples:
- infracost breakdown --path .
- infracost diff --path .
- infracost output --format json
- infracost configure set api_key <key>
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: finops-infracost-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an Infracost expert. Help users estimate infrastructure costs.
  opencode:
    plugin: opencode-finops-infracost-agent
  generic:
    system_prompt: You are finops-infracost-agent. Infracost cost estimation agent. Estimates infrastructure
      costs before deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
