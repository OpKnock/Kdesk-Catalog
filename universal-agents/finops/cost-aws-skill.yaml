name: cost-aws
display_name: Cost Aws
category: finops
subcategory: general
description: Analyzes and reduces AWS spend with Cost Explorer, Budgets, Compute Optimizer, and Cost Optimization
  Hub CLI queries.
version: 2.0.0
tags:
- cost-aws
author: Mehul Wagde
license: MIT
prerequisites:
- aws
capabilities:
- name: cost-explorer
  description: Query AWS cost and usage data, forecasts, and reservations via the ce API.
  commands:
  - aws ce get-cost-and-usage --time-period Start=2026-07-01,End=2026-08-01 --granularity MONTHLY --metrics
    UnblendedCost --group-by Type=DIMENSION,Key=SERVICE
  - aws ce get-cost-forecast --time-period Start=2026-08-01,End=2026-09-01 --metric UNBLENDED_COST --granularity
    MONTHLY
  - aws ce get-reservation-coverage --time-period Start=2026-07-01,End=2026-08-01
  - aws ce get-reservation-utilization --time-period Start=2026-07-01,End=2026-08-01 --granularity DAILY
  - aws ce get-anomalies --monitor-arn arn:aws:ce::123456789012:anomalymonitor/abc --date-interval Start=2026-07-01
  examples:
  - aws ce get-cost-and-usage --time-period Start=2026-07-01,End=2026-08-01 --granularity DAILY --metrics
    UnblendedCost --group-by Type=TAG,Key=team
  - aws ce get-cost-and-usage --time-period Start=2026-07-01,End=2026-08-01 --granularity MONTHLY --metrics
    UnblendedCost --filter '{"Dimensions":{"Key":"SERVICE","Values":["Amazon Simple Storage Service"]}}'
  - aws ce get-cost-forecast --metric UNBLENDED_COST --granularity DAILY
  parameters:
  - name: time-period
    type: string
    description: Start and end dates in YYYY-MM-DD format
  - name: granularity
    type: string
    description: DAILY, MONTHLY, or HOURLY aggregation
  - name: metrics
    type: string
    description: Metrics like UnblendedCost, BlendedCost, UsageQuantity
- name: optimization
  description: Find rightsizing and cost optimization recommendations.
  commands:
  - aws cost-optimization-hub list-recommendations --category Compute
  - aws compute-optimizer get-ec2-instance-recommendations --account-ids 123456789012
  - aws compute-optimizer get-ebs-volume-recommendations --account-ids 123456789012
  - aws savingsplans list-savings-plans
  - aws budgets describe-budgets --account-id 123456789012
  examples:
  - aws cost-optimization-hub list-recommendations --category Storage --implementation-effort High | jq
    '.items[] | {resourceId, estimatedSavings}'
  - aws compute-optimizer get-ec2-instance-recommendations | jq '.instanceRecommendations[] | {instanceArn,
    finding}'
  - aws budgets describe-budgets --account-id 123456789012 --budget-type COST
  parameters:
  - name: category
    type: string
    description: 'Optimization category: Compute, Storage, License'
  - name: account-ids
    type: string
    description: AWS account id list to scan
  - name: implementation-effort
    type: string
    description: Low, Medium, High effort filter for recommendations
knowledge:
- title: AWS Cost Management Docs
  type: documentation
  source: https://docs.aws.amazon.com/cost-management/
  description: Cost Explorer, Budgets, and anomaly detection guides
- title: Compute Optimizer
  type: documentation
  source: https://docs.aws.amazon.com/compute-optimizer/
  description: Rightsizing recommendations for EC2, EBS, and Lambda
- title: Cost Optimization Hub
  type: documentation
  source: https://docs.aws.amazon.com/aws-cost-management/latest/userguide/cost-optimization-hub.html
  description: Centralized optimization recommendations
instructions: "# AWS Cost Optimization\n\nFind and eliminate AWS waste using native Cost Explorer and\
  \ optimization APIs.\n\n## When to Use\n\n- Monthly cost review by service or team\n- Detecting spend\
  \ anomalies before they compound\n- Rightsizing EC2, RDS, and EBS resources\n- Validating reservations\
  \ and Savings Plans coverage\n\n## Cost exploration\n\n```bash\naws ce get-cost-and-usage --time-period\
  \ Start=2026-07-01,End=2026-08-01 --granularity DAILY --metrics UnblendedCost --group-by Type=DIMENSION,Key=SERVICE\n\
  ```\n\nGroup by `Type=TAG,Key=team` when your org enforces cost-allocation tags.\n\n## Find savings\n\
  \n```bash\naws cost-optimization-hub list-recommendations --category Compute\naws compute-optimizer\
  \ get-ec2-instance-recommendations\n```\n\nRightsize only after 14 days of steady-state utilization\
  \ data; avoid churning on bursty jobs.\n\n## Budgets and alerts\n\n```bash\naws budgets create-budget\
  \ --account-id 123456789012 --budget file://budget.json --notifications-with-subscribers file://notifications.json\n\
  ```\n\nBudget JSON example:\n\n```json\n{\n  \"BudgetLimit\": {\"Amount\": \"10000\", \"Unit\": \"USD\"\
  },\n  \"BudgetName\": \"monthly-engineering\",\n  \"BudgetType\": \"COST\",\n  \"TimeUnit\": \"MONTHLY\"\
  ,\n  \"TimePeriod\": {\"Start\": \"2026-08-01\"}\n}\n```\n\n## Anomaly detection\n\n```bash\naws ce\
  \ get-anomalies --monitor-arn <monitor-arn> --date-interval Start=2026-07-01\naws ce get-anomaly-monitors\n\
  ```\n\n## Best practices\n\n- Tag everything; untagged resources are invisible to owners.\n- Use Savings\
  \ Plans for steady compute and Spot for interruptible work.\n- Archive old S3 objects with lifecycle\
  \ policies before buying more storage.\n- Review the weekly cost anomaly report and close monitors with\
  \ known reasons."
examples:
- input: Find the top 5 services driving this month's AWS bill.
  output: Runs get-cost-and-usage grouped by SERVICE, sorts by UnblendedCost desc, and presents top 5
    with month-over-month deltas.
- input: Recommend how to cut EC2 spend for the analytics cluster.
  output: Runs compute-optimizer recommendations, identifies idle t3.large instances, and proposes m5.large
    rightsizing with estimated savings.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: cost-aws.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-cost-aws
  generic:
    system_prompt: 'You take the Cost Aws seat. You do it through cost-explorer: Query AWS cost and usage
      data, forecasts, and reservations via the ce API. The commands are real, e.g. `aws ce get-cost-and-usage
      --time-period Start=2026-07-01,End=2026-08-01 --granularity...`. You work hands-on and only report
      outcomes you have observed.'
    available_tools:
    - bash
    - read
    - write
    - edit
