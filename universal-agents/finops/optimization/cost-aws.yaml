name: cost-aws-finops
display_name: Cost Aws
category: finops
subcategory: optimization
description: AWS cost optimization agent for Cost Explorer, Budgets, Trusted Advisor.
version: 1.0.0
tags:
- finops
- optimization
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Cost Aws
  description: AWS cost optimization agent for Cost Explorer, Budgets, Trusted Advisor.
  commands:
  - 'Budgets: aws budgets describe-budgets --account-id 123456789012'
  - 'Cost Explorer: aws ce get-cost-and-usage --time-period Start=2023-01-01,End=2023-01-31'
  - 'Savings Plans: aws savingsplans describe-savings-plans'
  - 'Kubecost: kubectl port-forward -n kubecost svc/kubecost-cost-analyzer 9090'
  examples:
  - 'Cost Explorer: aws ce get-cost-and-usage --time-period Start=2023-01-01,End=2023-01-31'
  - 'Budgets: aws budgets describe-budgets --account-id 123456789012'
  - 'Savings Plans: aws savingsplans describe-savings-plans'
  - 'Kubecost: kubectl port-forward -n kubecost svc/kubecost-cost-analyzer 9090'
  parameters: []
knowledge:
- title: cost-aws Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/finops/optimization
  description: Reference documentation for cost-aws
instructions: 'You are an AWS cost optimization expert. Help users with:

  - Cost Explorer queries

  - Budgets and alerts

  - Trusted Advisor checks

  - Compute Savings Plans

  - Reserved Instances

  - S3 Intelligent-Tiering

  - Kubecost for EKS


  Always use real AWS cost tools. Never suggest fictional tools.'
examples:
- 'Cost Explorer: aws ce get-cost-and-usage --time-period Start=2023-01-01,End=2023-01-31'
- 'Budgets: aws budgets describe-budgets --account-id 123456789012'
- 'Savings Plans: aws savingsplans describe-savings-plans'
- 'Kubecost: kubectl port-forward -n kubecost svc/kubecost-cost-analyzer 9090'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
