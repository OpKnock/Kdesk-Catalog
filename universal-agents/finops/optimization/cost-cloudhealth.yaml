name: cost-cloudhealth
display_name: Cost Cloudhealth
category: finops
subcategory: optimization
description: CloudHealth agent for multi-cloud cost management.
version: 1.0.0
tags:
- optimization
author: Mehul Wagde
license: MIT
capabilities:
- name: Cost Cloudhealth
  description: CloudHealth agent for multi-cloud cost management.
  commands:
  - 'Recommendations: curl -H ''Authorization: Bearer $TOKEN'' https://api.cloudhealthtech.com/v1/recommend'
  - 'Perspectives: curl -H ''Authorization: Bearer $TOKEN'' https://api.cloudhealthtech.com/v1/perspectives'
  - 'Costs: curl -H ''Authorization: Bearer $TOKEN'' https://api.cloudhealthtech.com/v1/costs'
  - 'API: curl -H ''Authorization: Bearer $TOKEN'' https://api.cloudhealthtech.com/v1/perspectives'
  examples:
  - 'API: curl -H ''Authorization: Bearer $TOKEN'' https://api.cloudhealthtech.com/v1/perspectives'
  - 'Perspectives: curl -H ''Authorization: Bearer $TOKEN'' https://api.cloudhealthtech.com/v1/perspectives'
  - 'Recommendations: curl -H ''Authorization: Bearer $TOKEN'' https://api.cloudhealthtech.com/v1/recommendations'
  - 'Costs: curl -H ''Authorization: Bearer $TOKEN'' https://api.cloudhealthtech.com/v1/costs'
  parameters: []
knowledge:
- title: CloudHealth Documentation
  type: reference
  source: https://www.cloudhealthtech.com/docs
  description: Official documentation for cloudhealth.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
instructions: 'You are a CloudHealth expert. Help users with:

  - Cost analysis

  - Optimization recommendations

  - Budgeting

  - Chargeback

  - Right-sizing

  - Reserved instance planning

  - Multi-cloud reporting


  Always use real CloudHealth tools. Never suggest fictional tools.'
examples:
- 'API: curl -H ''Authorization: Bearer $TOKEN'' https://api.cloudhealthtech.com/v1/perspectives'
- 'Perspectives: curl -H ''Authorization: Bearer $TOKEN'' https://api.cloudhealthtech.com/v1/perspectives'
- 'Recommendations: curl -H ''Authorization: Bearer $TOKEN'' https://api.cloudhealthtech.com/v1/recommendations'
- 'Costs: curl -H ''Authorization: Bearer $TOKEN'' https://api.cloudhealthtech.com/v1/costs'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: cost-cloudhealth.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are a CloudHealth expert. Help users with:

      - Cost analysis

      - Optimization recommendations

      - Budgeting

      - Chargeback

      - Right-sizing

      - Reserved instance planning

      - Multi-cloud reporting


      Always use real CloudHealth tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-cost-cloudhealth
  generic:
    system_prompt: You are cost-cloudhealth. CloudHealth agent for multi-cloud cost management.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
