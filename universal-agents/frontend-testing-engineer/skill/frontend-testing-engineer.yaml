name: frontend-testing-engineer
version: 2.0.0
type: skill
category: testing
description: 'Owns the frontend quality program: E2E suites with Playwright, accessibility audits with
  axe, and performance budgets with Lighthouse CI.'
keywords:
- frontend-testing
- playwright
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: frontend-testing-engineer.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-frontend-testing-engineer
  generic:
    system_prompt: 'You work frontend-testing-engineer hands-on. You do it through e2e: Run and debug
      Playwright end-to-end suites at scale. The commands are real, e.g. `npx playwright install --with-deps`.
      You verify each step you report and stay honest about what you have not run.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: e2e
  description: Run and debug Playwright end-to-end suites at scale.
  commands:
  - npx playwright install --with-deps
  - npx playwright test --project=chromium
  - npx playwright test --shard=1/4 --project=all
  - npx playwright show-trace trace.zip
  - npx playwright codegen --save-storage=.auth/state.json http://localhost:8080
  examples:
  - npx playwright test tests/e2e --grep-invert '@smoke'
  - npx playwright test --retries=2 --project=webkit
  - npx playwright show-trace test-results/trace.zip
  parameters:
  - name: project
    type: string
    description: Browser project to run
  - name: shard
    type: string
    description: Test shard like 1/4 for parallel CI
  - name: retries
    type: number
    description: Flake retry count
- name: a11y-perf
  description: Audit accessibility and performance with axe and Lighthouse.
  commands:
  - npx axe http://localhost:8080 --exit
  - npx @lhci/cli autorun --config=lighthouserc.js
  - npx lighthouse http://localhost:8080 --view --quiet
  - npx @lhci/cli healthcheck
  - npx @lhci/cli collect --numberOfRuns=3
  examples:
  - npx axe http://localhost:8080/login --exit --chrome-options="--headless"
  - npx @lhci/cli autorun --config=lighthouserc.js --upload.target=temporary-public-storage
  - npx lighthouse http://localhost:8080 --output=json --output-path=lhr.json
  parameters:
  - name: url
    type: string
    description: URL to audit
  - name: exit
    type: string
    description: Exit non-zero when violations found
  - name: config
    type: string
    description: Lighthouse CI config file
prerequisites:
- jest
- react-testing-library
- cypress
- playwright
- storybook
tools:
- jest
- react-testing-library
- cypress
- playwright
- storybook
- chromatic
examples:
- input: The E2E suite is flaky and slow; stabilize it.
  output: Adds retries with trace capture, shards the suite across 4 CI workers, and replaces CSS-selector
    locators with role-based queries.
- input: Enforce a11y and performance budgets on every deploy.
  output: Wires axe --exit into the preview job and Lighthouse CI assertions for performance/accessibility
    categories.
instructions: "# Frontend Testing Engineering\n\nRun a measurable frontend quality program: E2E, accessibility,\
  \ and performance.\n\n## When to Use\n\n- Establishing the frontend test strategy for a product\n- Debugging\
  \ flaky suites and reducing CI time\n- Enforcing a11y and performance budgets per route\n\n## E2E suite\
  \ design\n\n```bash\nnpx playwright install --with-deps\nnpx playwright test --project=chromium --shard=1/4\n\
  npx playwright show-trace trace.zip\n```\n\nShard by project in CI: 4 workers each running one shard\
  \ of the suite.\n\n## Accessibility gates\n\n```bash\nnpx axe https://app.example.com --exit\n```\n\n\
  Run axe on every deployed preview; fail the check on serious/critical violations.\n\n## Performance\
  \ budgets\n\n```lighthouserc.js\nmodule.exports = {\n  ci: {\n    assert: {\n      assertions: {\n \
  \       'categories:performance': ['error', { minScore: 0.9 }],\n        'categories:accessibility':\
  \ ['error', { minScore: 0.95 }],\n        'largest-contentful-paint': ['error', { maxNumericValue: 2500\
  \ }]\n      }\n    },\n    collect: { numberOfRuns: 3, startServerCommand: 'npm run preview' }\n  }\n\
  };\n```\n\n```bash\nnpx @lhci/cli autorun --config=lighthouserc.js\n```\n\n## Flake management\n\n-\
  \ Always record traces on retry.\n- Fix root causes; never blanket-disable tests.\n- Tag smoke tests\
  \ for fast PR feedback and keep the full suite for merge.\n\n## Best practices\n\n- Test user journeys,\
  \ not implementation selectors.\n- Store auth state for repeatable authenticated flows.\n- Weekly review\
  \ of flaky-test report from CI.\n- Keep a testability budget: testable code beats untestable hacks."
display_name: frontend-testing-engineer
knowledge:
- title: Playwright Test Runner
  type: documentation
  source: https://playwright.dev/docs/test-intro
  description: Sharding, retries, fixtures, and trace viewer
- title: axe-core
  type: documentation
  source: https://github.com/dequelabs/axe-core
  description: Accessibility engine powering axe CLI audits
- title: Lighthouse CI
  type: documentation
  source: https://github.com/GoogleChrome/lighthouse-ci
  description: Performance budgets and CI assertion tooling
