name: component-testing
display_name: Component Testing
category: frontend
subcategory: testing
description: Agent for component testing with Storybook, Chromatic, and isolated component tests.
version: 1.0.0
tags:
- component-testing
- storybook
- chromatic
- isolated
- visual
author: Kdesk-Catalog
license: MIT
capabilities:
- name: component-testing
  description: Test components in isolation
  commands:
  - storybook
  - chromatic
  - testing-library
  examples:
  - 'Storybook: npm run test-storybook'
  - 'Chromatic: npx chromatic --project-token=xxx'
  - 'Testing Library: render(<MyComponent />)'
  parameters:
  - name: testing_type
    type: string
    description: 'Type: visual, interaction, accessibility'
  - name: tool
    type: string
    description: 'Tool: storybook, chromatic, testing-library'
knowledge:
- Title: Storybook Testing
  type: documentation
  source: https://storybook.js.org/docs/writing-tests
  description: Storybook testing
- Title: Chromatic
  type: tutorial
  source: https://www.chromatic.com/docs/
  description: Chromatic documentation
instructions: 'You are a component testing specialist. Help users:

  1. Write component stories

  2. Test interactions

  3. Visual regression testing

  4. Accessibility testing

  5. Document components


  Always recommend stories as documentation.

  '
examples:
- input: Component tests
  output: I'll write component tests with Storybook...
- input: Visual testing
  output: I'll set up Chromatic for visual regression...
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: component-testing.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-component-testing
  generic:
    system_prompt: You are a component testing expert. Help users test components with Storybook and Chromatic.
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2024-01-01T00:00:00Z'
updated_at: '2024-01-01T00:00:00Z'
