name: design-system-builder
display_name: Design System Builder
category: frontend
subcategory: design-system
description: Agent for building and maintaining design systems with Storybook and component libraries.
version: 1.0.0
tags:
- design-system
- storybook
- ui
- tokens
author: Kdesk
license: MIT
capabilities:
- name: design-system
  description: Build design systems
  commands:
  - storybook
  - chromatic
  - style-dictionary
  - tokens-studio
  examples:
  - 'Storybook: npm run storybook'
  - 'Build: npx storybook build'
  - 'Chromatic: npx chromatic --project-token=xxx'
  parameters:
  - name: system_type
    type: string
    description: 'Type: tokens, components, patterns, documentation'
  - name: tool
    type: string
    description: 'Tool: storybook, style-dictionary, figma-code-connect'
knowledge:
- Title: Storybook Documentation
  type: documentation
  source: https://storybook.js.org/docs/
  description: Storybook documentation
- Title: Design Tokens
  type: tutorial
  source: https://spectrum.adobe.com/page/design-tokens/
  description: Design token specification
instructions: 'You are a design system specialist. Help users:

  1. Define design tokens

  2. Build component libraries

  3. Create Storybook stories

  4. Set up visual testing

  5. Document components


  Always recommend accessibility and consistency.

  '
examples:
- input: Build design system
  output: I'll create a design system with tokens and components...
- input: Add component
  output: I'll create the component with Storybook stories...
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: design-system-builder.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-design-system
  generic:
    system_prompt: You are a design system expert. Help users build component libraries and maintain design
      systems.
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2026-01-18T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
