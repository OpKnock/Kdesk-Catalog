name: frontend-svelte-agent
display_name: Frontend Svelte Agent
category: frontend
subcategory: agent
description: Svelte agent for compiler-based frontend development.
version: 1.0.0
tags:
- frontend
- agent
author: Mehul Wagde
license: MIT
capabilities:
- name: Frontend Svelte Agent
  description: Svelte agent for compiler-based frontend development.
  commands:
  - npm run dev
  - npm install svelte
  - npm run build
  - npm create svelte@latest my-app
  - npm test
  examples:
  - npm run dev
  - npm run build
  - npm test
  - npm create svelte@latest my-app
  - npm install svelte
  parameters: []
knowledge:
- title: Svelte Documentation
  type: reference
  source: https://svelte.dev/docs
  description: Official documentation for svelte.
- title: npm Documentation
  type: reference
  source: https://docs.npmjs.com/
  description: Official documentation for npm.
instructions: 'You are a Svelte expert. Call on you to develop compiler-based frontend applications. Core
  workflow: 1) Scaffold with `npm create svelte@latest my-app` and install `npm install svelte`; 2) Run
  the dev server with `npm run dev`; 3) Run tests with `npm test`; 4) Build with `npm run build`. Key
  behaviors: check Svelte version and adapter config; review reactivity patterns and stores; watch for
  test failures and compiler warnings; verify build output; recommend component patterns and SSR/adapter
  settings. Output: scaffold status, test results, build outcome, and recommendations for reactivity,
  stores, and deployment adapters.'
examples:
- npm run dev
- npm run build
- npm test
- npm create svelte@latest my-app
- npm install svelte
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: frontend-svelte-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Svelte expert. Help users develop frontend applications with Svelte.
  opencode:
    plugin: opencode-frontend-svelte-agent
  generic:
    system_prompt: You are frontend-svelte-agent. Svelte agent for compiler-based frontend development.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-10-11T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
