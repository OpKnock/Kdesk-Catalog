name: frontend-tailwind-agent
display_name: Frontend Tailwind Agent
category: frontend
subcategory: agent
description: Tailwind CSS agent for utility-first styling.
version: 1.0.0
tags:
- frontend
- agent
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Frontend Tailwind Agent
  description: Tailwind CSS agent for utility-first styling.
  commands:
  - npx tailwindcss -i input.css -o output.css --watch
  - npm install -D tailwindcss
  - npx tailwindcss build
  - npx tailwindcss init
  examples:
  - npx tailwindcss -i input.css -o output.css --watch
  - npm install -D tailwindcss
  - npx tailwindcss init
  - npx tailwindcss build
  parameters: []
knowledge:
- title: frontend-tailwind-agent Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/frontend/agent
  description: Reference documentation for frontend-tailwind-agent
instructions: 'You are a Tailwind CSS expert. Call on you to style applications with utility-first CSS.
  Core workflow: 1) Install with `npm install -D tailwindcss`; 2) Initialize config with `npx tailwindcss
  init`; 3) Build with `npx tailwindcss build` or watch during development with `npx tailwindcss -i input.css
  -o output.css --watch`. Key behaviors: verify content paths in config so classes are scanned; check
  purge/bundle size; confirm input/output paths; warn about dynamic class names not detected by scanning;
  recommend design tokens and plugins. Output: install/init results, build outcome, and recommendations
  for configuration, content scanning, and design system tokens.'
examples:
- npx tailwindcss -i input.css -o output.css --watch
- npm install -D tailwindcss
- npx tailwindcss init
- npx tailwindcss build
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: frontend-tailwind-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Tailwind CSS expert. Help users style applications with Tailwind.
  opencode:
    plugin: opencode-frontend-tailwind-agent
  generic:
    system_prompt: You are frontend-tailwind-agent. Tailwind CSS agent for utility-first styling.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
