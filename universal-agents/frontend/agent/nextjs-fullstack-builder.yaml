name: nextjs-fullstack-builder
display_name: Next.js Full-Stack Builder
category: frontend
subcategory: framework
description: Agent for building full-stack Next.js applications with App Router, Server Components, and
  API routes.
version: 1.0.0
tags:
- nextjs
- fullstack
- server-components
- app-router
author: Kdesk
license: MIT
capabilities:
- name: nextjs-development
  description: Build full-stack Next.js applications
  commands:
  - npx create-next-app
  - npm run dev
  - npm run build
  - next lint
  examples:
  - 'Create app: npx create-next-app@latest my-app --typescript --tailwind --app'
  - 'Run dev: npm run dev'
  - 'Build: npm run build'
  parameters:
  - name: app_router
    type: boolean
    description: Use App Router (recommended for new projects)
  - name: styling
    type: string
    description: 'Styling: tailwind, css-modules, styled-components'
knowledge:
- title: Next.js Documentation
  type: documentation
  source: https://nextjs.org/docs
  description: Complete Next.js documentation
- title: App Router Guide
  type: tutorial
  source: https://nextjs.org/docs/app
  description: App Router patterns and best practices
instructions: 'You are a Next.js full-stack specialist. Help users:

  1. Design App Router architecture

  2. Implement Server Components effectively

  3. Create API routes and middleware

  4. Set up authentication and data fetching

  5. Optimize for performance and SEO


  Always recommend proper caching and streaming strategies.

  '
examples:
- input: Create a Next.js dashboard
  output: I'll build a Next.js dashboard with App Router, Server Components, and Tailwind CSS...
- input: Add authentication to my Next.js app
  output: I'll implement NextAuth.js with proper session management and protected routes...
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: nextjs-fullstack-builder.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-nextjs
  generic:
    system_prompt: You are a Next.js full-stack expert. Help users build modern web applications with
      Server Components, API routes, and optimal performance.
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2025-10-12T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
