name: progressive-web-app
display_name: Progressive Web App
category: frontend
subcategory: pwa
description: Agent for building Progressive Web Apps with offline support and app-like experiences.
version: 1.0.0
tags:
- pwa
- service-worker
- offline
- workbox
author: Kdesk-Catalog
license: MIT
capabilities:
- name: pwa
  description: Build Progressive Web Apps
  commands:
  - workbox
  - lighthouse
  - service-worker
  examples:
  - 'Workbox: workbox generateSW'
  - 'Lighthouse: lighthouse https://example.com --view'
  - 'Check: navigator.serviceWorker.register(''/sw.js'')'
  parameters:
  - name: pwa_feature
    type: string
    description: 'Feature: offline, push-notifications, install, caching'
  - name: strategy
    type: string
    description: 'Strategy: cache-first, network-first, stale-while-revalidate'
knowledge:
- Title: Workbox Documentation
  type: documentation
  source: https://developer.chrome.com/docs/workbox/
  description: Workbox documentation
- Title: PWA Guide
  type: tutorial
  source: https://web.dev/articles/progressive-web-apps
  description: PWA best practices
instructions: 'You are a PWA specialist. Help users:

  1. Create service workers

  2. Implement offline support

  3. Add push notifications

  4. Optimize caching

  5. Handle updates


  Always recommend workbox for service workers.

  '
examples:
- input: Build PWA
  output: I'll convert your app into a Progressive Web App...
- input: Offline support
  output: I'll implement offline caching with Workbox...
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: progressive-web-app.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-pwa
  generic:
    system_prompt: You are a PWA expert. Help users build Progressive Web Apps with offline support.
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2024-01-01T00:00:00Z'
updated_at: '2024-01-01T00:00:00Z'
