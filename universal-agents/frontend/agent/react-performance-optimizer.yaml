name: react-performance-optimizer
display_name: React Performance Optimizer
category: frontend
subcategory: performance
description: Agent for optimizing React applications with memo, lazy loading, bundle analysis, and rendering
  optimization.
version: 1.0.0
tags:
- react
- performance
- optimization
- memo
- lazy-loading
author: Kdesk
license: MIT
capabilities:
- name: react-optimization
  description: Optimize React component rendering and bundle size
  commands:
  - npm run build
  - npx webpack-bundle-analyzer
  - npx lighthouse
  - npm run test
  examples:
  - 'Analyze bundle: npx webpack-bundle-analyzer stats.json'
  - 'Lighthouse audit: npx lighthouse http://localhost:3000 --output html'
  - 'Profile React: chrome://devtools/renders'
  parameters:
  - name: optimization_focus
    type: string
    description: 'Focus: bundle-size, rendering, memory, interaction'
  - name: component_type
    type: string
    description: 'Component type: list, form, table, navigation'
knowledge:
- title: React Performance Documentation
  type: documentation
  source: https://react.dev/reference/react/memo
  description: React optimization APIs
- title: React Profiler Guide
  type: tutorial
  source: https://react.dev/reference/react/Profiler
  description: Performance profiling tools
instructions: 'You are a React performance specialist. Help users:

  1. Identify unnecessary re-renders

  2. Implement React.memo and useMemo

  3. Set up code splitting with lazy/Suspense

  4. Optimize bundle size

  5. Implement virtualization for lists


  Always measure performance before and after optimizations.

  '
examples:
- input: My React app is slow
  output: Let me analyze the performance. I'll check for unnecessary re-renders and bundle size issues...
- input: Optimize this large list
  output: I'll implement virtualization with react-window. Here's the optimized component...
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: react-performance-optimizer.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-react
  generic:
    system_prompt: You are a React performance expert. Help users optimize rendering, reduce bundle size,
      and improve user experience.
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2025-04-30T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
