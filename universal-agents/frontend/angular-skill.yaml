name: angular
display_name: angular
category: frontend
subcategory: general
description: 'Builds, tests, and deploys Angular applications with the Angular CLI: components, signals,
  routing, and standalone APIs.'
version: 2.0.0
tags:
- frontend
author: Kdesk-Catalog
license: MIT
prerequisites:
- ng
capabilities:
- name: scaffold
  description: Create Angular workspaces, components, and services.
  commands:
  - ng new my-app --style=scss --routing --ssr=false
  - ng generate component dashboard
  - ng generate service api/orders
  - ng add @angular/material
  - ng generate component dashboard --standalone --inline-template --inline-style
  examples:
  - ng new store --style=scss --routing --ssr=false
  - ng generate component checkout/payment --standalone
  - ng generate service auth/token
  parameters:
  - name: style
    type: string
    description: 'CSS preprocessor: scss, sass, less, css'
  - name: routing
    type: string
    description: true/false to add the router
  - name: ssr
    type: string
    description: true/false server-side rendering support
- name: build-test
  description: Build, serve, test, and analyze Angular apps.
  commands:
  - ng serve --port 4200 --hmr
  - ng build --configuration=production
  - ng test --watch=false --browsers=ChromeHeadless
  - ng lint --fix
  - ng build --configuration=production --stats-json
  examples:
  - ng serve --open
  - ng test --watch=false --code-coverage
  - ng build --configuration=staging --output-path dist/staging
  parameters:
  - name: configuration
    type: string
    description: production, development, or custom config
  - name: watch
    type: string
    description: true/false test watch mode
  - name: browsers
    type: string
    description: Karma browser launcher, e.g. ChromeHeadless
knowledge:
- title: Angular CLI
  type: documentation
  source: https://angular.dev/tools/cli
  description: 'Angular CLI reference: generate, build, serve, test'
- title: Angular Guide
  type: documentation
  source: https://angular.dev/guide/components
  description: Components, signals, and change detection
- title: Angular Router
  type: documentation
  source: https://angular.dev/guide/routing
  description: Routing, guards, lazy loading, and providers
instructions: "# Angular\n\nDevelop Angular apps with the Angular CLI and modern standalone APIs.\n\n\
  ## When to Use\n\n- Enterprise SPAs needing strong structure and DI\n- Teams standardized on TypeScript\
  \ and RxJS/signals\n- Apps with complex forms and routing\n\n## Create a workspace\n\n```bash\nng new\
  \ my-app --style=scss --routing --ssr=false\n```\n\nPrefer standalone components (default) - modules\
  \ are only needed for legacy code.\n\n## Generate code\n\n```bash\nng generate component dashboard --standalone\
  \ --inline-template --inline-style\nng generate service api/orders\nng generate guard auth/requires-login\n\
  ng add @angular/material\n```\n\n## Development loop\n\n```bash\nng serve --port 4200 --hmr\nng test\
  \ --watch=false --browsers=ChromeHeadless\nng lint --fix\nng build --configuration=production\n```\n\
  \n## Signals instead of observables where possible\n\n```typescript\nexport class CartComponent {\n\
  \  items = signal<Item[]>([]);\n  total = computed(() => this.items().reduce((s, i) => s + i.price,\
  \ 0));\n}\n```\n\n## Routing with lazy loading\n\n```typescript\nexport const routes: Routes = [\n \
  \ { path: 'checkout', loadComponent: () => import('./checkout/checkout.component').then(m => m.CheckoutComponent)\
  \ },\n  { path: '', loadChildren: () => import('./home/routes').then(m => m.routes) }\n];\n```\n\n##\
  \ Best practices\n\n- Use OnPush change detection with signals.\n- Keep components small; extract presentational\
  \ vs. container roles.\n- Run `ng build` with a strict TypeScript config in CI.\n- Use `inject()` instead\
  \ of constructor injection for readability.\n\n## Testing\n\n```bash\nng test --watch=false --code-coverage\n\
  ```\n\nTarget 80%+ coverage on services and reducers, not templates."
examples:
- input: Scaffold a new Angular storefront with routing and Material.
  output: Runs ng new with scss and routing, ng add @angular/material, and generates a dashboard component
    with lazy-loaded checkout route.
- input: Fix lint issues and run headless tests before CI.
  output: Runs ng lint --fix then ng test --watch=false --browsers=ChromeHeadless to verify the suite
    passes locally.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: angular.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-angular
  generic:
    system_prompt: 'You work angular hands-on. You do it through scaffold: Create Angular workspaces,
      components, and services. The commands are real, e.g. `ng new my-app --style=scss --routing --ssr=false`.
      You work hands-on and only report outcomes you have observed.'
    available_tools:
    - bash
    - read
    - write
    - edit
