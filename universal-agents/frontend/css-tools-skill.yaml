name: css-tools
display_name: css-tools
category: frontend
subcategory: general
description: Processes, lints, and optimizes CSS with PostCSS, Stylelint, Sass, Lightning CSS, and PurgeCSS
  pipelines.
version: 2.0.0
tags:
- frontend
author: Kdesk-Catalog
license: MIT
prerequisites:
- npx
capabilities:
- name: lint
  description: Lint and auto-fix CSS and SCSS with Stylelint.
  commands:
  - npx stylelint 'src/**/*.css'
  - npx stylelint 'src/**/*.scss' --config .stylelintrc.json
  - npx stylelint --fix 'src/**/*.css'
  - npx stylelint --formatter json 'src/**/*.css'
  - npx stylelint --max-warnings 0 'src/**/*.css'
  examples:
  - npx stylelint 'src/**/*.css' --max-warnings 0
  - npx stylelint --fix 'src/**/*.scss'
  - npx stylelint 'src/**/*.css' --formatter=json > stylelint-report.json
  parameters:
  - name: config
    type: string
    description: Path to Stylelint config
  - name: max-warnings
    type: number
    description: Exit non-zero beyond this many warnings
  - name: formatter
    type: string
    description: stylish, json, compact output
- name: process
  description: Compile and optimize CSS with PostCSS, Sass, and Lightning CSS.
  commands:
  - npx postcss src/styles.css -o dist/styles.css --use autoprefixer
  - npx sass src/scss/main.scss dist/main.css --style compressed
  - npx lightningcss --minify --browserslist '>= 0.5%' src/styles.css -o dist/styles.css
  - npx purgecss --css dist/styles.css --content 'dist/**/*.html' --output dist/
  - npx postcss --watch src/styles.css -o dist/styles.css
  examples:
  - npx sass src/scss/main.scss dist/main.css --watch --style compressed
  - npx purgecss --css build/*.css --content 'build/**/*.{html,js}' --output build/
  - npx lightningcss --minify --targets '>= 0.5%' src/a.css src/b.css -o dist/out.css
  parameters:
  - name: output
    type: string
    description: Output CSS path or directory
  - name: watch
    type: string
    description: Rebuild on file changes
  - name: style
    type: string
    description: expanded or compressed output style
knowledge:
- title: Stylelint
  type: documentation
  source: https://stylelint.io/
  description: Linter for CSS/SCSS with rules and custom configs
- title: PostCSS
  type: documentation
  source: https://postcss.org/
  description: Plugin-based CSS transformation pipeline
- title: Sass Docs
  type: documentation
  source: https://sass-lang.com/documentation/cli/dart-sass
  description: Dart Sass CLI compilation options
instructions: "# CSS Tooling\n\nCompile, lint, and minify CSS with a production-grade toolchain.\n\n##\
  \ When to Use\n\n- Enforcing consistent CSS quality across a codebase\n- Building Sass/PostCSS pipelines\
  \ with vendor prefixing\n- Shrinking shipped CSS by purging unused rules\n\n## Stylelint\n\n```css\n\
  /* .stylelintrc.json */\n{\n  \"extends\": \"stylelint-config-standard\",\n  \"rules\": { \"declaration-block-no-duplicate-properties\"\
  : true }\n}\n```\n\n```bash\nnpx stylelint 'src/**/*.css' --max-warnings 0\nnpx stylelint --fix 'src/**/*.css'\n\
  ```\n\n## Sass pipeline\n\n```bash\nnpx sass src/scss/main.scss dist/main.css --style compressed --watch\n\
  ```\n\n## PostCSS + autoprefixer\n\n```bash\nnpx postcss src/styles.css -o dist/styles.css --use autoprefixer\n\
  ```\n\n## PurgeCSS for shipped CSS\n\n```bash\nnpx purgecss --css dist/main.css --content 'dist/**/*.{html,js}'\
  \ --output dist/\n```\n\nOnly purge on final production builds, never in dev.\n\n## Lightning CSS (alternative\
  \ bundler-level pipeline)\n\n```bash\nnpx lightningcss --minify --targets '>= 0.5%' src/styles.css -o\
  \ dist/styles.css\n```\n\n## Best practices\n\n- Run Stylelint in CI with `--max-warnings 0`.\n- Keep\
  \ nesting depth under 3 levels.\n- Prefer CSS custom properties over Sass variables for runtime theming.\n\
  - Measure CSS bytes with a size budget per route."
examples:
- input: Add Stylelint with auto-fix to a legacy CSS codebase.
  output: Configures stylelint-config-standard, runs --fix in a migration commit, then gates CI on --max-warnings
    0.
- input: Build minified CSS with vendor prefixes and purge unused classes.
  output: Runs sass --style compressed, pipes through postcss with autoprefixer, then purgecss against
    built HTML.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: css-tools.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-css-tools
  generic:
    system_prompt: 'You are the css-tools specialist. You do it through lint: Lint and auto-fix CSS and
      SCSS with Stylelint. The commands are real, e.g. `npx stylelint src/**/*.css`. You prefer the shortest
      safe path, and you reproduce failures before diagnosing them.'
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2024-01-01T00:00:00Z'
updated_at: '2024-01-01T00:00:00Z'
