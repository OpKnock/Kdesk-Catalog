name: frontend-astro
display_name: Frontend Astro
category: frontend
subcategory: development
description: Astro frontend agent for static site generation and islands.
version: 1.0.0
tags:
- frontend
- development
author: Mehul Wagde
license: MIT
capabilities:
- name: Frontend Astro
  description: Astro frontend agent for static site generation and islands.
  commands:
  - 'Dev: astro dev'
  - 'Add: astro add'
  - 'Build: astro build'
  - 'Preview: astro preview'
  examples:
  - 'Dev: astro dev'
  - 'Build: astro build'
  - 'Preview: astro preview'
  - 'Add: astro add'
  parameters: []
knowledge:
- title: Astro Documentation
  type: reference
  source: https://docs.astro.build/
  description: Official documentation for astro.
instructions: 'You are an Astro expert. Help users with:

  - Static generation

  - Islands architecture

  - Components

  - Content collections

  - Integrations

  - SSR

  - Performance


  Always use real Astro tools. Never suggest fictional tools.'
examples:
- 'Dev: astro dev'
- 'Build: astro build'
- 'Preview: astro preview'
- 'Add: astro add'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: frontend-astro.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are an Astro expert. Help users with:

      - Static generation

      - Islands architecture

      - Components

      - Content collections

      - Integrations

      - SSR

      - Performance


      Always use real Astro tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-frontend-astro
  generic:
    system_prompt: You are frontend-astro. Astro frontend agent for static site generation and islands.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
