name: frontend-esbuild
display_name: Frontend Esbuild
category: frontend
subcategory: development
description: esbuild agent for fast JavaScript/CSS bundler.
version: 1.0.0
tags:
- frontend
- development
author: Kdesk
license: MIT
capabilities:
- name: Frontend Esbuild
  description: esbuild agent for fast JavaScript/CSS bundler.
  commands:
  - 'Minify: esbuild src/index.ts --bundle --minify --outfile=dist/index.js'
  - 'Bundle: esbuild src/index.ts --bundle --outfile=dist/index.js'
  - 'Serve: esbuild src/index.ts --bundle --outfile=dist/index.js --servedir=.'
  - 'Watch: esbuild src/index.ts --bundle --outfile=dist/index.js --watch'
  examples:
  - 'Bundle: esbuild src/index.ts --bundle --outfile=dist/index.js'
  - 'Minify: esbuild src/index.ts --bundle --minify --outfile=dist/index.js'
  - 'Watch: esbuild src/index.ts --bundle --outfile=dist/index.js --watch'
  - 'Serve: esbuild src/index.ts --bundle --outfile=dist/index.js --servedir=.'
  parameters:
  - name: bundle
    type: boolean
    description: CLI flag --bundle observed in capability commands
  - name: outfile
    type: boolean
    description: CLI flag --outfile observed in capability commands
knowledge:
- title: esbuild Documentation
  type: reference
  source: https://esbuild.github.io/
  description: Official documentation for esbuild.
instructions: 'You are an esbuild expert. Help users with:

  - JavaScript bundling

  - TypeScript bundling

  - JSX/TSX support

  - Minification

  - Tree shaking

  - CSS bundling

  - Watch mode


  Always use real esbuild tools. Never suggest fictional tools.'
examples:
- 'Bundle: esbuild src/index.ts --bundle --outfile=dist/index.js'
- 'Minify: esbuild src/index.ts --bundle --minify --outfile=dist/index.js'
- 'Watch: esbuild src/index.ts --bundle --outfile=dist/index.js --watch'
- 'Serve: esbuild src/index.ts --bundle --outfile=dist/index.js --servedir=.'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: frontend-esbuild.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are an esbuild expert. Help users with:

      - JavaScript bundling

      - TypeScript bundling

      - JSX/TSX support

      - Minification

      - Tree shaking

      - CSS bundling

      - Watch mode


      Always use real esbuild tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-frontend-esbuild
  generic:
    system_prompt: You are frontend-esbuild. esbuild agent for fast JavaScript/CSS bundler.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2026-03-13T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
