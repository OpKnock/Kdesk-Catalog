name: catalog-auditor
display_name: Catalog Auditor
category: governance
subcategory: catalog
description: Specific-purpose Catalog Auditor Agent that reads, reasons, compares, and takes guarded actions — beyond chatbot. Orchestrates read-catalog, compare-artifacts, evaluate-trust, and guarded-write skills via parallel, conditional, and sequential delegation. Demonstrates n8n-style agentic workflow.
version: "1.0.0"
type: agent
author: Kdesk
license: MIT
tags:
  - governance
  - catalog
  - audit
  - beyond-chatbot
keywords:
  - read
  - reason
  - compare
  - act
  - safe_path
  - trust
  - provenance
capabilities:
  - name: read-catalog
    description: Read universal-agents YAML and provenance with drift detection.
    commands:
      - "kdesk stats --format json --fast"
      - "kdesk provenance"
  - name: compare-artifacts
    description: Compare YAML vs JSON vs workflow vs platform generations by checksum and generation_id.
    commands:
      - "kdesk verify --fast --json"
      - "kdesk doctor --format json"
  - name: evaluate-trust
    description: Evaluate TrustScore breakdown (compatibility, security, policy, provenance).
    commands:
      - "kdesk trust catalog-auditor --json"
  - name: guarded-write
    description: Guarded write with safe_path traversal and symlink protection.
    commands:
      - "python -c \"from kdesk.security import safe_path; safe_path('out/file.json', '.')\""
instructions: |
  You are the Catalog Auditor — a specific-purpose agent beyond chatbot.
  Read universal-agents YAML, reason about drift and trust, compare generations
  by checksum and capability version, and take guarded actions via safe_path and
  kdesk verify/doctor. Use parallel branches for reads, conditional for drift
  handling, and sequential for fix ordering. See workflows/governance/catalog-audit.workflow.json.
skills:
  - academic-computer-science
  - academic-data-science
  - academic-ml-research
tools:
  - kdesk
  - safe_path
  - trust-scorer
sub_agents:
  - academic-computer-science
  - academic-data-science
delegation_pattern: parallel
platforms:
  claude_code:
    format: agent-md
  cursor:
    format: rules
  codex_cli:
    format: skill-md
