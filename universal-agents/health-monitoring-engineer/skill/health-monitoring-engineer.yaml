name: health-monitoring-engineer
version: 2.0.0
type: skill
category: sre
description: 'Turns service health into metrics: exposes /metrics endpoints, validates with promtool,
  and answers ad-hoc queries against Prometheus.'
keywords:
- health-monitoring
- rum
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: health-monitoring-engineer.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-health-monitoring-engineer
  generic:
    system_prompt: 'You work health-monitoring-engineer hands-on. You do it through metrics-endpoints:
      Expose and validate Prometheus-format metrics. The commands are real, e.g. `promtool check metrics
      http://localhost:9100/metrics`. You answer with exact commands, not abstractions, and flag anything
      you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: metrics-endpoints
  description: Expose and validate Prometheus-format metrics.
  commands:
  - promtool check metrics http://localhost:9100/metrics
  - curl -s http://localhost:9100/metrics | head -40
  - promtool check metric-label http://localhost:9100/metrics '^up$'
  - node_exporter --collector.textfile.directory=/var/lib/node_exporter/textfile
  - curl -s http://localhost:9100/metrics | grep -E '^process_cpu_seconds_total'
  examples:
  - promtool check metrics http://localhost:9090/metrics --lint=error
  - curl -s http://localhost:9100/metrics | grep '^node_memory_' | head
  - node_exporter --web.listen-address=:9100 --collector.filesystem
  parameters:
  - name: metrics-url
    type: string
    description: URL of the /metrics endpoint
  - name: lint
    type: string
    description: 'Lint level for metric families: none, warning, error'
  - name: collector
    type: string
    description: node_exporter collector to enable
- name: query
  description: Query Prometheus for health signals.
  commands:
  - promtool query instant http://localhost:9090 'up'
  - promtool query range http://localhost:9090 'rate(http_requests_total[5m])' --start=-30m
  - curl -G http://localhost:9090/api/v1/query --data-urlencode 'query=up{job="api"}'
  - promtool query instant http://localhost:9090 '100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))
    * 100)'
  - curl -G http://localhost:9090/api/v1/targets | jq '.data.activeTargets | length'
  examples:
  - promtool query instant http://localhost:9090 'sum by (job) (up)'
  - curl -G http://localhost:9090/api/v1/query --data-urlencode 'query=up' | jq '.data.result'
  - promtool query range http://localhost:9090 'histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m]))'
  parameters:
  - name: query
    type: string
    description: PromQL expression
  - name: start
    type: string
    description: Range start like --start=-30m
  - name: endpoint
    type: string
    description: Prometheus base URL
prerequisites:
- prometheus
- grafana
- blackbox-exporter
- node.js
tools:
- prometheus
- grafana
- blackbox-exporter
- node.js
- python
- curl
examples:
- input: Why is the API target down in Prometheus?
  output: Checks activeTargets via the API, then curls the /metrics endpoint and inspects listener/port
    config, fixing the scrape target.
- input: Expose node health metrics for the fleet.
  output: Starts node_exporter with textfile collectors and validates the /metrics output with promtool
    check metrics.
instructions: '# Health Monitoring


  Instrument services with /metrics and validate the pipeline end-to-end.


  ## When to Use


  - Adding Prometheus-format metrics to a service

  - Verifying metric quality before dashboards rely on them

  - Answering quick health questions from production data


  ## Expose metrics


  Standard HTTP server + prometheus client:


  ```go

  http.Handle("/metrics", promhttp.Handler())

  log.Fatal(http.ListenAndServe(":9100", nil))

  ```


  ```bash

  curl -s http://localhost:9100/metrics | head -40

  ```


  ## Validate with promtool


  ```bash

  promtool check metrics http://localhost:9100/metrics --lint=error

  ```


  Lint catches bad naming, missing units, and duplicate families before dashboards break.


  ## Node-level health


  ```bash

  node_exporter --web.listen-address=:9100 --collector.filesystem

  curl -s http://localhost:9100/metrics | grep ''^node_load1''

  ```


  ## Answer queries


  ```bash

  promtool query instant http://localhost:9090 ''up{job="api"}''

  promtool query instant http://localhost:9090 ''100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))
  * 100)''

  ```


  ## Best practices


  - Follow Prometheus naming: `unit_verb`, e.g. `http_requests_total`.

  - Add `_total` for counters and document HELP lines.

  - Keep high-cardinality labels (user_id, path) out of metrics.

  - Scrape from a sidecar or scraper; never rely on curl alone in prod.


  ## Testing


  ```bash

  promtool check metrics http://localhost:9100/metrics --lint=error

  curl -s http://localhost:9090/api/v1/targets | jq ''.data.activeTargets | length''

  ```


  Verify targets are up after every scrape-config change.'
display_name: health-monitoring-engineer
knowledge:
- title: Promtool
  type: documentation
  source: https://prometheus.io/docs/prometheus/latest/command-line/promtool/
  description: promtool check metrics and query commands
- title: node_exporter
  type: documentation
  source: https://github.com/prometheus/node_exporter
  description: Host metrics exporter and collectors
- title: Prometheus HTTP API
  type: documentation
  source: https://prometheus.io/docs/prometheus/latest/querying/api/
  description: Instant and range query API
