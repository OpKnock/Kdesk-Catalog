name: incident-management
version: 2.0.0
type: skill
category: sre
description: 'Runs incident response with PagerDuty CLI: declare, acknowledge, communicate, and resolve
  incidents with timeline notes.'
keywords:
- incident-management
- response
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: incident-management.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-incident-management
  generic:
    system_prompt: 'You work incident-management hands-on. You do it through pagerduty: Manage incidents
      end-to-end with the PagerDuty CLI. The commands are real, e.g. `pd incident:list --status=triggered`.
      You run and verify the real CLI commands before you claim anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: pagerduty
  description: Manage incidents end-to-end with the PagerDuty CLI.
  commands:
  - pd incident:list --status=triggered
  - pd incident:acknowledge INCIDENT_ID
  - pd incident:resolve INCIDENT_ID
  - pd incident:create --service-name 'Checkout' --title 'Checkout 500s' --urgency high
  - 'pd note:create INCIDENT_ID --content ''Root cause: DB replica lag; mitigation in progress'''
  examples:
  - pd incident:list --status=triggered --status=acknowledged --format=json | jq '.incidents[].id'
  - pd incident:acknowledge PXXXXX
  - pd incident:resolve PXXXXX --note 'Resolved by autoscaler recovery'
  parameters:
  - name: status
    type: string
    description: triggered, acknowledged, or resolved
  - name: service-name
    type: string
    description: Service to attach the incident to
  - name: urgency
    type: string
    description: high or low severity
- name: timeline
  description: Keep an auditable incident timeline with notes and comms.
  commands:
  - pd note:list INCIDENT_ID
  - pd incident:update INCIDENT_ID --status=acknowledged
  - pd incident:list --team='Platform' --since=$(date -I) --until=$(date -I -d '+7 days')
  - pd schedule:oncall --time=$(date -I)
  - pd escalation_policy:list
  examples:
  - pd note:list PXXXXX --format=json | jq '.notes[].content'
  - pd incident:update PXXXXX --status=acknowledged
  - pd schedule:oncall --time=2026-08-10T14:00:00Z
  parameters:
  - name: incident
    type: string
    description: Incident id like PXXXXX
  - name: note
    type: string
    description: Timeline note content
  - name: team
    type: string
    description: Team name filter for incident queries
prerequisites:
- pagerduty
- opsgenie
- slack
- jira
tools:
- pagerduty
- opsgenie
- slack
- jira
- statuspage
examples:
- input: Checkout is erroring at 30% - handle the incident.
  output: Creates a high-urgency incident on the Checkout service, acknowledges it, adds mitigation notes
    as the rollback proceeds, and resolves with evidence.
- input: Who is on call this week for Platform?
  output: Queries pd schedule:oncall for the current time and pd escalation_policy:list to map the escalation
    chain.
instructions: '# Incident Management


  Respond to production incidents with a clear, auditable lifecycle.


  ## When to Use


  - A service is down or degraded in production

  - Coordinating on-call response and escalation

  - Post-incident review with full timeline data


  ## Lifecycle


  Declare -> Acknowledge -> Mitigate -> Resolve -> Review.


  ## Declare


  ```bash

  pd incident:create --service-name ''Checkout'' --title ''Checkout 500s'' --urgency high

  ```


  Include severity, affected scope, and the paging path in the title.


  ## Acknowledge and communicate


  ```bash

  pd incident:acknowledge PXXXXX

  pd note:create PXXXXX --content ''Mitigation: rolled back deploy to v2.14.3''

  ```


  Post every material fact as a note - the timeline is the incident record.


  ## Resolve


  ```bash

  pd incident:resolve PXXXXX --note ''Verified 10 min of 0% error rate; resolved by rollback''

  ```


  ## On-call context


  ```bash

  pd schedule:oncall --time=$(date -I)

  pd escalation_policy:list

  ```


  ## Post-incident review


  - Timeline integrity: every mitigation step has a note.

  - Classify severity and trigger conditions accurately.

  - Create action items and track them as issues.

  - Run blameless review: fix process, not people.


  ## Best practices


  - Never resolve without a note describing the fix evidence.

  - Keep incident titles prefixed by severity for search.

  - Automate the alert route: alert -> incident creation.

  - Rehearse with Game Days so the flow is muscle memory.


  ## Testing


  Use the sandbox environment to practice the full declare-acknowledge-resolve loop.'
display_name: incident-management
