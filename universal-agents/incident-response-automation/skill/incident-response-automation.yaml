name: incident-response-automation
version: 2.0.0
type: skill
category: sre
description: 'Automates incident response: webhook triggers, runbook dispatch via GitHub Actions, and
  remediation playbooks executed from alerts.'
keywords:
- incident-response
- pagerduty
- slack
- runbook
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: incident-response-automation.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-incident-response-automation
  generic:
    system_prompt: 'You are the incident-response-automation specialist. You do it through runbook-dispatch:
      Trigger and monitor automated runbooks in CI pipelines. The commands are real, e.g. `gh workflow
      run runbook.yml -f severity=sev1 -f service=checkout`. You run and verify the real CLI commands
      before you claim anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: runbook-dispatch
  description: Trigger and monitor automated runbooks in CI pipelines.
  commands:
  - gh workflow run runbook.yml -f severity=sev1 -f service=checkout
  - gh run watch $(gh run list --workflow=runbook.yml --limit 1 --json databaseId -q '.[0].databaseId')
  - gh workflow run mitigate.yml -f incident_id=P12345 -f action=rollback
  - gh run list --workflow=runbook.yml --status=in_progress
  - gh api repos/{owner}/{repo}/actions/runs/{run_id} | jq '.status'
  examples:
  - gh workflow run runbook.yml -f severity=sev1 -f service=checkout --ref main
  - gh run watch --exit-status
  - gh workflow run mitigate.yml -f incident_id=P12345
  parameters:
  - name: severity
    type: string
    description: sev1-sev4 classification
  - name: service
    type: string
    description: Affected service name
  - name: action
    type: string
    description: 'Remediation action: rollback, scale, failover'
- name: webhooks
  description: Wire alerts to chat and ticketing systems via webhooks.
  commands:
  - 'curl -X POST -H ''Content-Type: application/json'' -d ''{"text":"SEV-1: checkout 500s"}'' $SLACK_WEBHOOK_URL'
  - 'curl -X POST -H ''Content-Type: application/json'' -d ''{"summary":"checkout down","priority":"high"}''
    $PAGERDUTY_V2_URL'
  - 'curl -X POST -H ''Content-Type: application/json'' -H ''Authorization: Bearer $LINEAR_TOKEN'' -d
    ''{"teamId":"...","title":"SEV-1 checkout"}'' https://api.linear.app/graphql'
  - curl -s -X POST $WEBHOOK_RECEIVER -d '{"event":"incident.created","id":"P12345"}'
  - 'curl -i -X POST -H ''Content-Type: application/json'' -d ''{"incident":"P12345","status":"mitigated"}''
    $RUNBOOK_HOOK'
  examples:
  - 'curl -X POST -H ''Content-Type: application/json'' -d ''{"text":"Rollback complete for P12345"}''
    $SLACK_WEBHOOK_URL'
  - curl -X POST -d '{}' $PAGERDUTY_V2_URL
  - curl -s -X POST $RUNBOOK_HOOK -d '{"severity":"sev2"}'
  parameters:
  - name: webhook-url
    type: string
    description: Slack/PD/ticketing webhook endpoint
  - name: payload
    type: string
    description: JSON alert payload
  - name: incident-id
    type: string
    description: Incident identifier for correlation
prerequisites:
- pagerduty-cli
- opsgenie-cli
- slack-cli
- terraform
tools:
- pagerduty-cli
- opsgenie-cli
- slack-cli
- terraform
- jinja2
- python
examples:
- input: Auto-page and post to Slack when an alert fires.
  output: Wires the alert to the PagerDuty v2 events URL and a Slack webhook, deduplicating on the incident
    id.
- input: Roll back a bad deploy automatically for a known failure signature.
  output: Adds a workflow_dispatch runbook that runs rollback when severity=sev1 with human approval gate
    and posts completion to Slack.
instructions: "# Incident Response Automation\n\nAutomate the mechanical parts of incident response so\
  \ humans handle judgment.\n\n## When to Use\n\n- Alert routing and runbook execution on page\n- Automated\
  \ rollback/scaling of known failure modes\n- Post-incident status updates across channels\n\n## Webhook\
  \ fan-out\n\nAlert -> webhook -> channels + ticketing + runbook:\n\n```bash\ncurl -X POST -H 'Content-Type:\
  \ application/json' -d '{\"text\":\"SEV-1: checkout 500s\"}' $SLACK_WEBHOOK_URL\ncurl -X POST -H 'Content-Type:\
  \ application/json' -d '{\"summary\":\"checkout down\",\"priority\":\"high\"}' $PAGERDUTY_V2_URL\n```\n\
  \n## Runbook dispatch\n\n```bash\ngh workflow run runbook.yml -f severity=sev1 -f service=checkout\n\
  gh run watch --exit-status\n```\n\nRunbook steps: gather evidence -> stabilize (rollback/scale) -> verify\
  \ -> notify.\n\n## A minimal rollback workflow\n\n```yaml\nname: runbook\non:\n  workflow_dispatch:\n\
  \    inputs:\n      severity: { type: choice, options: [sev1, sev2, sev3, sev4] }\n      action: { type:\
  \ choice, options: [rollback, scale-up, noop] }\njobs:\n  mitigate:\n    runs-on: ubuntu-latest\n  \
  \  steps:\n      - run: echo \"Running ${{ github.event.inputs.action }} for ${{ github.event.inputs.severity\
  \ }}\"\n      - run: curl -s -X POST ${{ secrets.RUNBOOK_HOOK }} -d '{\"action\":\"${{ github.event.inputs.action\
  \ }}\"}'\n```\n\n## Safe automation rules\n\n- Destructive actions always require a human approval step.\n\
  - Every automation logs its action with the incident id.\n- Idempotent remediation: running twice must\
  \ not double the damage.\n- Keep a dead-man switch: abort automation if it exceeds a time budget.\n\n\
  ## Testing\n\nDry-run the full webhook chain in staging: simulate an alert and verify channel posts,\
  \ ticket creation, and runbook dispatch order."
display_name: incident-response-automation
knowledge:
- title: GitHub Actions
  type: documentation
  source: https://docs.github.com/en/actions
  description: Workflow dispatch, runs, and event payloads
- title: Slack incoming webhooks
  type: documentation
  source: https://api.slack.com/messaging/webhooks
  description: Post messages to channels from automation
- title: PagerDuty Events API v2
  type: documentation
  source: https://developer.pagerduty.com/docs/events-api-v2/
  description: Create and resolve incidents programmatically
