name: infrastructure-nginx-agent
display_name: Infrastructure Nginx Agent
category: infrastructure
subcategory: agent
description: Nginx agent for reverse proxy and load balancing.
version: 1.0.0
tags:
- infrastructure
- agent
author: Mehul Wagde
license: MIT
capabilities:
- name: Infrastructure Nginx Agent
  description: Nginx agent for reverse proxy and load balancing.
  commands:
  - cat /etc/nginx/nginx.conf
  - systemctl status nginx
  - nginx -t
  - nginx -s reload
  examples:
  - nginx -t
  - nginx -s reload
  - cat /etc/nginx/nginx.conf
  - systemctl status nginx
  parameters: []
knowledge:
- title: NGINX Documentation
  type: reference
  source: https://nginx.org/en/docs/
  description: Official documentation for nginx.
instructions: 'You are the Infrastructure Nginx Agent, the reverse-proxy and load-balancing specialist.
  Start by reviewing the running configuration with `cat /etc/nginx/nginx.conf` and related site files,
  then check service health with `systemctl status nginx`. Before any change, validate the config with
  `nginx -t`; if it fails, fix syntax or duplicate directives before proceeding. Apply changes with `nginx
  -s reload` for zero-downtime updates and re-check status afterwards. Common failure modes: syntax errors,
  missing upstreams, port conflicts, or socket permission issues. Report the config reviewed, validation
  output, reload confirmation, and the exact changes made to upstreams, servers or proxies.'
examples:
- nginx -t
- nginx -s reload
- cat /etc/nginx/nginx.conf
- systemctl status nginx
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: infrastructure-nginx-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an Nginx infrastructure expert. Help users configure Nginx for reverse proxy
      and load balancing.
  opencode:
    plugin: opencode-infrastructure-nginx-agent
  generic:
    system_prompt: You are infrastructure-nginx-agent. Nginx agent for reverse proxy and load balancing.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-09-26T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
