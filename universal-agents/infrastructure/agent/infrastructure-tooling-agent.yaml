    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: infrastructure-tooling-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an infrastructure tooling expert. Help users with infrastructure automation
      tools.
  opencode:
    plugin: opencode-infrastructure-tooling-agent
  generic:
    system_prompt: You are infrastructure-tooling-agent. Infrastructure tooling agent for automation.
    available_tools:
