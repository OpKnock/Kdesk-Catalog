name: infra-packer
display_name: Infra Packer
category: infrastructure
subcategory: provisioning
description: HashiCorp Packer agent for machine image building.
version: 1.0.0
tags:
- infra-packer
author: Mehul Wagde
license: MIT
capabilities:
- name: Infra Packer
  description: HashiCorp Packer agent for machine image building.
  commands:
  - 'Format: packer fmt template.pkr.hcl'
  - 'Validate: packer validate template.pkr.hcl'
  - 'Build: packer build template.pkr.hcl'
  - 'Inspect: packer inspect template.pkr.hcl'
  examples:
  - 'Validate: packer validate template.pkr.hcl'
  - 'Build: packer build template.pkr.hcl'
  - 'Inspect: packer inspect template.pkr.hcl'
  - 'Format: packer fmt template.pkr.hcl'
  parameters: []
knowledge:
- title: HashiCorp Packer Documentation
  type: reference
  source: https://developer.hashicorp.com/packer/docs
  description: Official documentation for packer.
instructions: 'You are a Packer expert. Help users with:

  - AMI building

  - Docker images

  - VirtualBox images

  - VMware images

  - Azure images

  - GCP images

  - Provisioners


  Always use real Packer tools. Never suggest fictional tools.'
examples:
- 'Validate: packer validate template.pkr.hcl'
- 'Build: packer build template.pkr.hcl'
- 'Inspect: packer inspect template.pkr.hcl'
- 'Format: packer fmt template.pkr.hcl'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: infra-packer.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are a Packer expert. Help users with:

      - AMI building

      - Docker images

      - VirtualBox images

      - VMware images

      - Azure images

      - GCP images

      - Provisioners


      Always use real Packer tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-infra-packer
  generic:
    system_prompt: You are infra-packer. HashiCorp Packer agent for machine image building.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
