  - 'SSH: vagrant ssh'
  - 'Destroy: vagrant destroy -f'
  - 'Up: vagrant up'
  examples:
  - 'Up: vagrant up'
  - 'SSH: vagrant ssh'
  - 'Status: vagrant status'
  - 'Destroy: vagrant destroy -f'
  parameters: []
