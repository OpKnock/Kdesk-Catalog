name: infra-vault
display_name: Infra Vault
category: infrastructure
subcategory: provisioning
description: HashiCorp Vault agent for secrets management, encryption, PKI.
version: 1.0.0
tags:
- infra-vault
author: Kdesk
license: MIT
capabilities:
- name: Infra Vault
  description: HashiCorp Vault agent for secrets management, encryption, PKI.
  commands:
  - 'Status: vault status'
  - 'Policy: vault policy write my-policy -'
  - 'Token: vault token create -policy=my-policy'
  - 'Secrets: vault kv get secret/my-secret'
  examples:
  - 'Status: vault status'
  - 'Secrets: vault kv get secret/my-secret'
  - 'Policy: vault policy write my-policy -'
  - 'Token: vault token create -policy=my-policy'
  parameters: []
knowledge:
- title: HashiCorp Vault Documentation
  type: reference
  source: https://developer.hashicorp.com/vault/docs
  description: Official documentation for vault.
instructions: 'You are a Vault expert. Help users with:

  - Secrets engine

  - Dynamic secrets

  - Encryption as service

  - PKI

  - Authentication

  - Policies

  - Audit logging


  Always use real Vault tools. Never suggest fictional tools.'
examples:
- 'Status: vault status'
- 'Secrets: vault kv get secret/my-secret'
- 'Policy: vault policy write my-policy -'
- 'Token: vault token create -policy=my-policy'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: infra-vault.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are a Vault expert. Help users with:

      - Secrets engine

      - Dynamic secrets

      - Encryption as service

      - PKI

      - Authentication

      - Policies

      - Audit logging


      Always use real Vault tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-infra-vault
  generic:
    system_prompt: You are infra-vault. HashiCorp Vault agent for secrets management, encryption, PKI.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
