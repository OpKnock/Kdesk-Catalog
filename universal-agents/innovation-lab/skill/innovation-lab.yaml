name: innovation-lab
version: 2.0.0
type: skill
category: strategy
description: 'Runs rapid prototyping experiments: quick scaffolds, local servers, and disposable environments
  to validate ideas fast.'
keywords:
- innovation-lab
- prototyping
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: innovation-lab.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-innovation-lab
  generic:
    system_prompt: 'You work innovation-lab hands-on. You do it through prototype: Spin up throwaway prototypes
      in minutes. The commands are real, e.g. `npm create vite@latest idea -- --template react-ts`. You
      answer with exact commands, not abstractions, and flag anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: prototype
  description: Spin up throwaway prototypes in minutes.
  commands:
  - npm create vite@latest idea -- --template react-ts
  - python -m http.server 8000
  - python -m venv .venv && .venv/Scripts/pip install fastapi uvicorn
  - docker compose up -d redis
  - npm create astro@latest -- --template minimal
  examples:
  - python -m http.server 8000 --directory public
  - npm create vite@latest idea -- --template vanilla-ts
  - docker compose up -d postgres redis
  parameters:
  - name: port
    type: number
    description: Local server port
  - name: directory
    type: string
    description: Directory to serve
  - name: template
    type: string
    description: Scaffold template
- name: experiment
  description: Track experiments and measure results.
  commands:
  - jupyter lab --port 8888 --no-browser
  - jupyter nbconvert --to notebook --execute experiment.ipynb --output executed.ipynb
  - git tag experiment/2026-08-cache-vs-nocache
  - git log --oneline --graph -15
  - pip install pytest && python -m pytest tests/ -q
  examples:
  - jupyter nbconvert --to script --output exp experiment.ipynb
  - git tag -a experiment/v1 -m 'cache-vs-nocache baseline'
  - python -m pytest tests/ -q --tb=short
  parameters:
  - name: notebook
    type: string
    description: Jupyter notebook path
  - name: tag
    type: string
    description: Git tag for the experiment
  - name: execute
    type: string
    description: Execute notebooks headlessly
prerequisites:
- figma
- notion
- slack
- github
tools:
- figma
- notion
- slack
- github
- miro
examples:
- input: Test whether Redis Streams beats RabbitMQ for our event flow.
  output: Spins up both via docker compose, writes a load comparison script, tags the experiment branch,
    and summarizes throughput/latency for the decision.
- input: Build a clickable demo for the dashboard idea.
  output: Scaffolds a Vite React app, mocks the data with a local JSON server, and serves it on port 8000
    for the demo.
instructions: '# Innovation Lab


  Validate ideas with the cheapest possible experiment.


  ## When to Use


  - Evaluating a new framework, library, or pattern

  - Building a demo for stakeholders

  - Testing a hypothesis with data


  ## Fast scaffolds


  ```bash

  npm create vite@latest idea -- --template react-ts

  python -m http.server 8000

  ```


  Match the scaffold to the question: static HTML for copy, Vite for UI interaction, FastAPI for API behavior.


  ## Disposable dependencies


  ```bash

  docker compose up -d redis postgres

  ```


  Use containers for deps so teardown is `docker compose down -v`.


  ## Data experiments


  ```bash

  jupyter lab --port 8888 --no-browser

  jupyter nbconvert --to notebook --execute experiment.ipynb --output executed.ipynb

  ```


  Executed notebooks are the experiment record.


  ## Keep a history


  ```bash

  git tag experiment/2026-08-cache-vs-nocache

  git log --oneline --graph -15

  ```


  ## Rules for prototypes


  - Timebox: one day max; the goal is a decision, not production code.

  - Document the decision: what changed your mind?

  - Kill or promote: delete the spike or re-build properly.

  - Never let a prototype accumulate production load.


  ## Testing


  ```bash

  python -m pytest tests/ -q

  npm run build

  ```


  Even a spike should compile and pass its unit checks before the review.'
display_name: innovation-lab
knowledge:
- title: Vite
  type: documentation
  source: https://vite.dev/guide/
  description: Instant scaffolding for prototypes
- title: Jupyter
  type: documentation
  source: https://jupyter.org/documentation
  description: Interactive notebooks for data experiments
- title: FastAPI
  type: documentation
  source: https://fastapi.tiangolo.com/
  description: Quick API prototyping in Python
