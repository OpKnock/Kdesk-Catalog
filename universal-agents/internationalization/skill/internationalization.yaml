name: internationalization
version: 2.0.0
type: skill
category: frontend
description: 'Localizes applications with gettext and i18next: extraction, translation catalogs, pluralization,
  and locale builds.'
keywords:
- i18n
- translation
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: internationalization.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-internationalization
  generic:
    system_prompt: 'You work internationalization hands-on. You do it through gettext: Extract and compile
      translations with GNU gettext tools. The commands are real, e.g. `xgettext -o locale/messages.pot
      src/**/*.js --keyword=_`. You run and verify the real CLI commands before you claim anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: gettext
  description: Extract and compile translations with GNU gettext tools.
  commands:
  - xgettext -o locale/messages.pot src/**/*.js --keyword=_
  - msginit -i locale/messages.pot -o locale/de/LC_MESSAGES/messages.po -l de
  - msgfmt -o locale/de/LC_MESSAGES/messages.mo locale/de/LC_MESSAGES/messages.po
  - msgmerge --update locale/de/LC_MESSAGES/messages.po locale/messages.pot
  - msguniq -o deduped.po locale/de/LC_MESSAGES/messages.po
  examples:
  - xgettext -o messages.pot src/**/*.py --keyword=_ --language=Python
  - msgmerge --backup=off --update de.po messages.pot
  - msgfmt --check-format -o de.mo de.po
  parameters:
  - name: keyword
    type: string
    description: Translation function to extract
  - name: language
    type: string
    description: 'Source language: Python, C, JavaScript'
  - name: locale
    type: string
    description: Target locale, e.g. de, fr_FR
- name: i18next
  description: Manage JSON translation catalogs with i18next tooling.
  commands:
  - npx i18next -c i18next-parser.config.js 'src/**/*.tsx'
  - npx i18next 'src/**/*.tsx' --locales en,de,fr --defaultLocale en
  - npm install i18next react-i18next i18next-browser-languagedetector
  - npx lingui extract
  - npx lingui compile
  examples:
  - npx i18next 'src/**/*.tsx' --locales en,de --output public/locales
  - npx lingui extract --clean
  - npx i18next --namespace translation --locales en,ja
  parameters:
  - name: locales
    type: string
    description: Locale list to extract catalogs for
  - name: namespace
    type: string
    description: i18next namespace name
  - name: config
    type: string
    description: Parser config file
prerequisites:
- node.js
- react
- i18next
- formatjs
tools:
- node.js
- react
- i18next
- formatjs
- crowdin
examples:
- input: Add German and French to a Python CLI.
  output: Extracts with xgettext, initializes de/fr catalogs with msginit, translates, and compiles .mo
    files with msgfmt.
- input: Extract new React strings after a feature release.
  output: Runs npx i18next across the tsx sources, merges catalogs, and flags untranslated keys in CI.
instructions: '# Internationalization


  Localize apps with the standard message catalog workflow.


  ## When to Use


  - Shipping a product in multiple languages

  - Centralizing user-facing strings for translators

  - Handling plurals and dates correctly per locale


  ## gettext workflow


  1. Extract:

  ```bash

  xgettext -o locale/messages.pot src/**/*.js --keyword=_

  ```


  2. Initialize a locale:

  ```bash

  msginit -i locale/messages.pot -o locale/de/LC_MESSAGES/messages.po -l de

  ```


  3. Translate (human or machine) then compile:

  ```bash

  msgfmt -o locale/de/LC_MESSAGES/messages.mo locale/de/LC_MESSAGES/messages.po

  ```


  4. Merge new strings:

  ```bash

  msgmerge --update locale/de/LC_MESSAGES/messages.po locale/messages.pot

  ```


  ## Plurals


  ```po

  msgid "%d item"

  msgid_plural "%d items"

  msgstr[0] "%d Element"

  msgstr[1] "%d Elemente"

  ```


  ## i18next JSON catalogs


  ```bash

  npx i18next ''src/**/*.tsx'' --locales en,de,fr --defaultLocale en

  ```


  Extract keys like `t(''checkout.title'')` into `locales/en/translation.json`.


  ## Best practices


  - Never concatenate translated strings; use placeholders.

  - Keep dates/numbers via Intl APIs, not string formats.

  - Key by semantic id (checkout.title) or English source text consistently.

  - Run extraction in CI and fail on missing translations for ship locales.


  ## Testing


  ```bash

  msgfmt --check-format -o de.mo de.po

  node -e "const {t}=require(''./i18n''); t(''checkout.title'')" | grep -v checkout.title

  ```


  A missing key must fail the build.'
display_name: internationalization
knowledge:
- title: GNU gettext manual
  type: documentation
  source: https://www.gnu.org/software/gettext/manual/
  description: xgettext, msginit, msgfmt, msgmerge workflow
- title: i18next
  type: documentation
  source: https://www.i18next.com/
  description: JavaScript internationalization framework
- title: Lingui
  type: documentation
  source: https://lingui.dev/
  description: Message extraction and compilation for JS
