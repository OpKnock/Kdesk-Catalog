name: iot-backend
version: 2.0.0
type: skill
category: infrastructure
description: 'Builds IoT backends: MQTT brokers with mosquitto/EMQX, device data ingestion, and AWS IoT
  Core integration.'
keywords:
- iot
- mqtt
- telemetry
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: iot-backend.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-iot-backend
  generic:
    system_prompt: 'You own iot-backend end to end. You do it through mqtt: Publish and subscribe to MQTT
      topics for device traffic. The commands are real, e.g. `mosquitto_sub -h localhost -t sensors/#
      -v`. You work hands-on and only report outcomes you have observed.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: mqtt
  description: Publish and subscribe to MQTT topics for device traffic.
  commands:
  - mosquitto_sub -h localhost -t 'sensors/#' -v
  - mosquitto_pub -h localhost -t sensors/temp -m '{"device":"d1","temp":22.4}'
  - mosquitto_pub -h localhost -t sensors/+/temp -r -m '{"temp":22.4}'
  - mosquitto -c mosquitto.conf -v
  - mosquitto_pub -h localhost -t devices/d1/cmd -m '{"action":"reboot"}' -q 2
  examples:
  - mosquitto_sub -h broker.example.com -t 'devices/+/telemetry' -u device01 -P secret
  - mosquitto_pub -h localhost -t sensors/d1/temp -m '{"t":21.8}' -r
  - mosquitto_pub -h localhost -t alerts -m 'high-temp d1' --will-topic devices/d1/status --will-payload
    offline
  parameters:
  - name: topic
    type: string
    description: MQTT topic with wildcards
  - name: qos
    type: number
    description: Quality of service 0, 1, or 2
  - name: retain
    type: string
    description: Retain the message with -r
- name: aws-iot
  description: Manage AWS IoT Core endpoints and publish device data.
  commands:
  - aws iot describe-endpoint --endpoint-type iot:Data-ATS
  - aws iot-data publish --topic sensors/d1 --payload '{"temp":22.4}' --cli-binary-format raw-in-base64-out
  - aws iot list-things
  - aws iot describe-thing --thing-name d1
  - aws iot-data get-thing-shadow --thing-name d1
  examples:
  - aws iot-data publish --topic devices/d1/telemetry --payload '{"temp":22.4,"hum":55}'
  - aws iot list-things --attribute-name firmware --attribute-value 2.1
  - aws iot describe-endpoint --endpoint-type iot:Data-ATS
  parameters:
  - name: topic
    type: string
    description: Device topic to publish to
  - name: payload
    type: string
    description: JSON payload
  - name: thing-name
    type: string
    description: IoT thing name
prerequisites:
- node.js
- python
- mosquitto
- influxdb
tools:
- node.js
- python
- mosquitto
- influxdb
- grafana
examples:
- input: Ingest temperature readings from 1,000 sensors.
  output: Sets up sensors/# subscription on mosquitto, publishes retained telemetry per device, and routes
    batches to a queue for storage.
- input: Command a device fleet to reboot via AWS IoT.
  output: Publishes a reboot command to devices/{id}/cmd and tracks responses via thing shadows.
instructions: '# IoT Backend


  Ingest and control device traffic with MQTT and AWS IoT.


  ## When to Use


  - Collecting telemetry from sensors and devices

  - Sending commands back to fleets

  - Managing device identity and state (shadows)


  ## MQTT basics


  ```bash

  mosquitto_sub -h localhost -t ''sensors/#'' -v

  mosquitto_pub -h localhost -t sensors/temp -m ''{"device":"d1","temp":22.4}''

  ```


  Use topic hierarchy: `fleet/device/metric` (e.g. `sensors/d1/temp`).


  ## QoS and retained messages


  - QoS 0: fire and forget

  - QoS 1: at least once

  - QoS 2: exactly once (costly, use sparingly)

  - Retained (`-r`): last known state on subscribe


  ```bash

  mosquitto_pub -h localhost -t sensors/d1/status -m online -r

  ```


  ## Will messages


  Declare a will topic so disconnects are detected:


  ```bash

  mosquitto_pub ... --will-topic devices/d1/status --will-payload offline

  ```


  ## AWS IoT Core


  ```bash

  aws iot describe-endpoint --endpoint-type iot:Data-ATS

  aws iot-data publish --topic sensors/d1 --payload ''{"temp":22.4}'' --cli-binary-format raw-in-base64-out

  aws iot-data get-thing-shadow --thing-name d1

  ```


  ## Backend design


  - Broker at edge, raw data to a queue, fan-out to processing.

  - Keep commands idempotent; devices reconnect often.

  - Batch telemetry per device; never per-message JSON logging.


  ## Best practices


  - TLS everywhere; auth devices with certificates.

  - Alert on will-topic offline events.

  - Keep payloads small; devices have constrained bandwidth.

  - Test with real QoS semantics, not plain pub/sub.


  ## Testing


  ```bash

  mosquitto_sub -h localhost -t ''sensors/#'' -v &

  mosquitto_pub -h localhost -t sensors/d1/temp -m ''{"t":21.8}'' -q 1

  ```


  Verify delivery at each QoS level.'
