name: kubernetes-network-policy-engineer
version: 2.0.0
type: skill
category: infrastructure
description: 'Designs zero-trust pod networking with Kubernetes NetworkPolicies: default-deny, allowlists,
  and verification of actual traffic flow.'
keywords:
- kubernetes
- network-policy
- cilium
- zero-trust
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: kubernetes-network-policy-engineer.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-kubernetes-network-policy-engineer
  generic:
    system_prompt: 'You work kubernetes-network-policy-engineer hands-on. You do it through policies:
      Create and inspect NetworkPolicies. The commands are real, e.g. `kubectl get networkpolicies -A`.
      You run and verify the real CLI commands before you claim anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: policies
  description: Create and inspect NetworkPolicies.
  commands:
  - kubectl get networkpolicies -A
  - kubectl apply -f default-deny.yaml
  - kubectl describe netpol checkout-allow --namespace payments
  - 'kubectl get networkpolicies --all-namespaces -o json | jq ''.items[] | {name: .metadata.name, ns:
    .metadata.namespace}'''
  - kubectl delete netpol legacy-allow --namespace legacy
  examples:
  - kubectl get networkpolicies -n payments -o wide
  - kubectl apply -f allow-api.yaml --dry-run=client -o yaml
  - kubectl describe networkpolicies -n ingress | grep -E 'PolicyTypes|To|From'
  parameters:
  - name: namespace
    type: string
    description: Namespace to scope queries
  - name: manifest
    type: string
    description: Policy YAML file
  - name: output
    type: string
    description: 'Output format: wide, yaml, json'
- name: verify
  description: Prove policy behavior with real traffic probes.
  commands:
  - kubectl run nettest --image=curlimages/curl -it --rm -- curl -s http://payments:8080/healthz
  - kubectl run probe --image=busybox -it --rm -- wget -qO- http://auth-service:80
  - kubectl exec deploy/payments -- wget -qO- http://db:5432 -T 2 || echo 'blocked'
  - kubectl run probe --image=curlimages/curl -it --rm --timeout 5s -- curl -s https://api.example.com
  - kubectl logs deploy/probe -n kube-system --tail=20
  examples:
  - kubectl run nettest --image=curlimages/curl -it --rm --namespace payments -- curl -s http://web:80
  - kubectl exec deploy/api -- wget -T 2 -qO- http://redis:6379 && echo allowed
  - kubectl run probe --image=busybox --rm -it -- wget -T 3 -qO- http://auth:80
  parameters:
  - name: image
    type: string
    description: Probe container image
  - name: timeout
    type: number
    description: Connection timeout to detect blocking
  - name: namespace
    type: string
    description: Namespace for the probe pod
prerequisites:
- kubectl
- helm
tools:
- kubectl
- helm
- calicoctl
- cilium-cli
- netshoot
- k9s
examples:
- input: Lock down the payments namespace.
  output: Applies default-deny, then allow rules for api->payments:8080 and DNS egress, verifying each
    path with curl probes.
- input: New policy broke service-to-service calls.
  output: Runs kubectl describe netpol and targeted wget probes to identify the missing allow rule and
    port.
instructions: "# Kubernetes Network Policies\n\nLock down pod-to-pod traffic with NetworkPolicies and\
  \ prove it.\n\n## When to Use\n\n- Zero-trust segmentation between services\n- PCI/HIPAA namespace isolation\n\
  - Debugging why a policy blocks legitimate traffic\n\n## Default-deny first\n\n```yaml\napiVersion:\
  \ networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name: default-deny\n  namespace: payments\n\
  spec:\n  podSelector: {}\n  policyTypes: [Ingress, Egress]\n```\n\n```bash\nkubectl apply -f default-deny.yaml\n\
  ```\n\nStart with default-deny, then add allow rules - never the reverse.\n\n## Allow ingress from api\n\
  \n```yaml\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name: allow-api\n  namespace:\
  \ payments\nspec:\n  podSelector:\n    matchLabels: { app: payments }\n  policyTypes: [Ingress]\n  ingress:\n\
  \    - from:\n        - podSelector:\n            matchLabels: { app: api }\n      ports:\n        -\
  \ port: 8080\n```\n\n## Verify with real traffic\n\n```bash\nkubectl run nettest --image=curlimages/curl\
  \ -it --rm --namespace payments -- curl -s http://api:80/healthz\nkubectl exec deploy/payments -- wget\
  \ -qO- http://db:5432 -T 2 || echo 'blocked'\n```\n\nA timeout (not connection refused) usually means\
  \ the policy dropped the packet.\n\n## Egress for DNS and TLS\n\nAllow kube-dns egress, plus explicit\
  \ egress targets with ports.\n\n## Best practices\n\n- Enforce default-deny globally via an admission\
  \ controller.\n- Policy as code: review in the same PR as the workload.\n- Test both allowed and blocked\
  \ paths in CI.\n- Use Cilium/KubeArmor for L7 rules where L4 is not enough.\n\n## Testing\n\nRun the\
  \ probe matrix after every policy change: expected-allow and expected-block cases."
display_name: kubernetes-network-policy-engineer
knowledge:
- title: Kubernetes NetworkPolicies
  type: documentation
  source: https://kubernetes.io/docs/concepts/services-networking/network-policies/
  description: Policy spec, selectors, and policyTypes
- title: Cilium Network Policy docs
  type: documentation
  source: https://docs.cilium.io/en/stable/security/policy/
  description: Kubernetes + Cilium enhanced policies
- title: kubectl cheatsheet
  type: documentation
  source: https://kubernetes.io/docs/reference/kubectl/cheatsheet/
  description: kubectl run and exec patterns for probes
