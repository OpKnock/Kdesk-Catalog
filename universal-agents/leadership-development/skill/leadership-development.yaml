name: leadership-development
version: 2.0.0
type: skill
category: management
description: 'Develops engineering leaders: PR review practice, contribution metrics, and team-level operational
  habits grounded in real GitHub workflows.'
keywords:
- leadership
- feedback
- development
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: leadership-development.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-leadership-development
  generic:
    system_prompt: 'You take the leadership-development seat. You do it through review-practice: Build
      review habits and track team contribution patterns. The commands are real, e.g. `gh pr list --repo
      owner/repo --search reviewed-by:@me --state all`. You prefer the shortest safe path, and you reproduce
      failures before diagnosing them.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: review-practice
  description: Build review habits and track team contribution patterns.
  commands:
  - gh pr list --repo owner/repo --search 'reviewed-by:@me' --state all
  - gh pr list --review-requested @me
  - gh api repos/{owner}/{repo}/stats/participation | jq '.all'
  - gh api repos/{owner}/{repo}/contributors -q '.[] | {login, contributions}'
  - gh pr diff 123 --repo owner/repo | wc -l
  examples:
  - gh pr list --repo owner/repo --search 'reviewed-by:@me created:>=2026-07-01'
  - gh api repos/{owner}/{repo}/contributors -q '.[:10][] | {login, contributions}'
  - gh pr list --review-requested @me --state open
  parameters:
  - name: repo
    type: string
    description: owner/repo pair
  - name: reviewed-by
    type: string
    description: Reviewer login filter
  - name: search
    type: string
    description: GitHub search query
- name: team-habits
  description: Run 1:1s and team operations with tangible artifacts.
  commands:
  - 'gh issue create --title ''1:1 notes - 2026-08-10'' --body ''Skip: roadmap; focus: growth areas''
    --repo owner/repo --label 1-1'
  - gh issue list --label 1-1 --state open --repo owner/repo
  - gh api repos/{owner}/{repo}/issues/42/timeline -q '.[] | select(.event=="closed") | .actor.login'
  - gh repo view owner/repo --json description,homepageUrl
  - 'gh issue comment 42 --body ''Action item complete - evidence: PR #88'''
  examples:
  - 'gh issue create --title ''1:1 - ada'' --body ''Follow-ups: onboarding checklist'' --repo owner/repo'
  - gh issue list --label 1-1 --search 'state:open' --repo owner/repo
  - 'gh issue comment 42 --body ''Resolution: agreed in retro'''
  parameters:
  - name: label
    type: string
    description: Issue label like 1-1 or action-item
  - name: title
    type: string
    description: Issue title
  - name: body
    type: string
    description: Issue body
prerequisites:
- lattic
- 15five
- slack
- zoom
tools:
- lattic
- 15five
- slack
- zoom
- greenhouse
examples:
- input: Set up weekly 1:1s with tracked action items.
  output: Creates a 1-1 issue template, generates issues per person, and closes items with evidence comments.
- input: Clear the review queue before the weekend.
  output: Lists open review requests via gh, reviews the smallest diffs first, and tracks response-time
    trend.
instructions: '# Leadership Development


  Build measurable leadership habits with tangible artifacts.


  ## When to Use


  - New leads establishing review and 1:1 cadence

  - Tracking team health and contribution trends

  - Converting feedback into tracked action items


  ## Review practice


  ```bash

  gh pr list --review-requested @me --state open

  gh pr diff 123 --repo owner/repo | wc -l

  ```


  Keep a review budget: every open request gets a response within one business day.


  ## 1:1s with artifacts


  Create an issue per 1:1 with a shared template:


  ```bash

  gh issue create --title ''1:1 notes - 2026-08-10'' --body ''Skip: roadmap; focus: growth areas'' --label
  1-1

  gh issue list --label 1-1 --state open

  ```


  Follow-ups become tracked issues, not conversational memory.


  ## Team metrics


  ```bash

  gh api repos/{owner}/{repo}/stats/participation | jq ''.all''

  gh api repos/{owner}/{repo}/contributors -q ''.[:10][] | {login, contributions}''

  ```


  Use trends (not snapshots) to spot burnout or bus-factor risk.


  ## Feedback mechanics


  - Specific: cite the PR/commit, not a vibe.

  - Timely: within the same week.

  - Balanced: behavior and impact, with a concrete ask.

  - Tracked: every feedback item becomes an action item.


  ## Best practices


  - Protect focus time; reviews are a queue, not an inbox.

  - Rotate incident leadership so everyone practices command.

  - Run a lightweight retrospective cadence (2 weeks).

  - Publish team norms as docs, review quarterly.


  ## Testing


  Audit your own habits monthly: review response time, 1:1 cadence, action-item closure rate.'
