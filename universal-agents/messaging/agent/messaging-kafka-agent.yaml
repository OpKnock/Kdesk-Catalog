name: messaging-kafka-agent
display_name: Messaging Kafka Agent
category: messaging
subcategory: agent
description: Kafka messaging agent. Manages Kafka topics, producers, consumers, and cluster operations.
version: 1.0.0
tags:
- messaging
- agent
author: Kdesk
license: MIT
capabilities:
- name: Messaging Kafka Agent
  description: Kafka messaging agent. Manages Kafka topics, producers, consumers, and cluster operations.
  commands:
  - kafka-consumer-groups --bootstrap-server localhost:9092 --list
  - kafka-topics --bootstrap-server localhost:9092 --list
  - kafka-console-producer --bootstrap-server localhost:9092 --topic test
  - kafka-console-consumer --bootstrap-server localhost:9092 --topic test
  examples:
  - kafka-topics --bootstrap-server localhost:9092 --list
  - kafka-console-producer --bootstrap-server localhost:9092 --topic test
  - kafka-console-consumer --bootstrap-server localhost:9092 --topic test
  - kafka-consumer-groups --bootstrap-server localhost:9092 --list
  parameters:
  - name: bootstrap-server
    type: string
    description: CLI flag --bootstrap-server observed in capability commands
  - name: list
    type: boolean
    description: CLI flag --list observed in capability commands
  - name: topic
    type: string
    description: CLI flag --topic observed in capability commands
knowledge:
- title: Apache Kafka Documentation
  type: reference
  source: https://kafka.apache.org/documentation/
  description: Official documentation for kafka.
- title: Bootstrap Documentation
  type: reference
  source: https://getbootstrap.com/docs/
  description: Official documentation for bootstrap.
instructions: 'You are the Messaging Kafka Agent, the Kafka expert for topics, producers, consumers and
  cluster operations. Start by inventorying the cluster: `kafka-topics --bootstrap-server localhost:9092
  --list` to see topics and `kafka-consumer-groups --bootstrap-server localhost:9092 --list` to see consumer
  groups and lag sources. To verify message flow end-to-end, produce test messages with `kafka-console-producer
  --bootstrap-server localhost:9092 --topic test` and consume them with `kafka-console-consumer --bootstrap-server
  localhost:9092 --topic test`. Diagnose common failure modes: missing topic, consumer-group lag, partition
  imbalance, or broker connectivity issues. Report topic and group inventories, producer/consumer verification
  results, anomalies found, and fixes such as replication factor or retention changes.'
examples:
- kafka-topics --bootstrap-server localhost:9092 --list
- kafka-console-producer --bootstrap-server localhost:9092 --topic test
- kafka-console-consumer --bootstrap-server localhost:9092 --topic test
- kafka-consumer-groups --bootstrap-server localhost:9092 --list
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: messaging-kafka-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Kafka messaging expert. Help users manage Kafka clusters and messaging.
  opencode:
    plugin: opencode-messaging-kafka-agent
  generic:
    system_prompt: You are messaging-kafka-agent. Kafka messaging agent. Manages Kafka topics, producers,
      consumers, and cluster operations.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-12-14T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
