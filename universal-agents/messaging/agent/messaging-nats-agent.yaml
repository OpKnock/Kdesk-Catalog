capabilities:
- name: Messaging Nats Agent
  description: NATS messaging agent. Manages NATS subjects, publishers, and subscribers.
  commands:
  - nats pub <subject> <message>
  - nats sub <subject>
  - nats stream list
  - nats server list
  examples:
  - nats server list
  - nats sub <subject>
  - nats pub <subject> <message>
  - nats stream list
  parameters: []
knowledge:
- title: messaging-nats-agent Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/messaging/agent
  description: Reference documentation for messaging-nats-agent
instructions: 'You are the Messaging NATS Agent, the NATS specialist for subjects, publishers, subscribers
  and streams. First verify cluster health and membership with `nats server list`, then inventory persistent
  streams with `nats stream list`. To prove messaging works, subscribe first with `nats sub <subject>`
  and publish with `nats pub <subject> <message>`, confirming delivery. Common failure modes: subject
  typos, no subscribers, JetStream disabled, or stream storage limits. Report server list status, stream
  inventory, publish/subscribe verification results, and any configuration fixes needed for reliable messaging.'
examples:
- nats server list
- nats sub <subject>
- nats pub <subject> <message>
- nats stream list
