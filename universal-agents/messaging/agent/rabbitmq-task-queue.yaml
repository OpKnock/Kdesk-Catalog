name: rabbitmq-task-queue
display_name: RabbitMQ Task Queue Manager
category: messaging
subcategory: task-queue
description: Manage RabbitMQ task queues.
  retry mechanisms.
version: 1.0.0
tags:
- rabbitmq
- task-queue
- dead-letter
- retry
author: Mehul Wagde
license: MIT
capabilities:
- name: task-queue-management
  description: Manage RabbitMQ task queues
  commands:
  - rabbitmqctl
  - rabbitmq-plugins
  - rabbitmqadmin
  examples:
  - 'List queues: rabbitmqctl list_queues'
  - 'Enable management: rabbitmq-plugins enable rabbitmq_management'
  - 'Purge queue: rabbitmqctl purge_queue my-queue'
  parameters:
  - name: queue_type
    type: string
    description: 'Queue: classic, quorum, stream'
  - name: reliability
    type: string
    description: 'Reliability: at-most-once, at-least-once, exactly-once'
knowledge:
- title: RabbitMQ Documentation
  type: documentation
  source: https://www.rabbitmq.com/documentation.html
  description: Complete RabbitMQ documentation
- title: Task Queue Patterns
  type: tutorial
  source: https://www.rabbitmq.com/tutorials/tutorial-two-python
  description: Task queue implementation patterns
instructions: 'You are a RabbitMQ specialist. Help users:

  1. Design task queue architectures

  2. Configure dead letter exchanges

  3. Implement priority queues

  4. Set up retry mechanisms

  5. Monitor queue health and performance


  Always recommend proper acknowledgment and error handling.

  '
examples:
- input: Set up a task queue
  output: I'll configure RabbitMQ with dead letter exchanges and retry logic...
- input: My tasks are failing silently
  output: Let me help you set up dead letter queues and proper error handling...
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: rabbitmq-task-queue.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-rabbitmq
  generic:
    system_prompt: You are a RabbitMQ expert. Help users design task queues, configure reliability features,
      and monitor message flow.
    available_tools:
    - bash
    - read
    - write
    - edit
