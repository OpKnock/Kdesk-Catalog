capabilities:
- name: topics
  description: Create, describe, and alter Kafka topics.
  commands:
  - kafka-topics.sh --bootstrap-server localhost:9092 --create --topic events --partitions 12 --replication-factor
    3
  - kafka-topics.sh --bootstrap-server localhost:9092 --list
  - kafka-topics.sh --bootstrap-server localhost:9092 --describe --topic events
  - kafka-topics.sh --bootstrap-server localhost:9092 --alter --topic events --partitions 24
  - kafka-topics.sh --bootstrap-server localhost:9092 --delete --topic legacy_events
  examples:
  - kafka-topics.sh --bootstrap-server localhost:9092 --describe --topic events --topics-with-overrides
  - kafka-topics.sh --bootstrap-server localhost:9092 --list | grep -v internal
  - kafka-topics.sh --bootstrap-server localhost:9092 --alter --topic events --config retention.ms=604800000
  parameters:
  - name: partitions
    type: number
    description: Partition count
  - name: replication-factor
    type: number
    description: Replication factor
  - name: config
    type: string
    description: Topic config like retention.ms
- name: console
  description: Produce and consume messages from the CLI.
  commands:
  - kafka-console-producer.sh --bootstrap-server localhost:9092 --topic events
  - kafka-console-consumer.sh --bootstrap-server localhost:9092 --topic events --from-beginning
  - kafka-console-consumer.sh --bootstrap-server localhost:9092 --topic events --group debug-group --property
    print.offset=true --max-messages 10
  - 'kafka-console-producer.sh --bootstrap-server localhost:9092 --topic events --property parse.key=true
    --property key.separator=:'
  - kafka-consumer-groups.sh --bootstrap-server localhost:9092 --group debug-group --describe
  examples:
  - kafka-console-consumer.sh --bootstrap-server localhost:9092 --topic events --from-beginning --max-messages
    5
  - 'echo ''key1:value1'' | kafka-console-producer.sh --bootstrap-server localhost:9092 --topic events
    --property parse.key=true --property key.separator=:'
  - kafka-consumer-groups.sh --bootstrap-server localhost:9092 --list
  parameters:
  - name: topic
    type: string
    description: Topic to produce/consume
  - name: group
    type: string
    description: Consumer group id
  - name: max-messages
    type: number
    description: Consume N messages then exit
