name: queue-helper
display_name: Queue Helper
category: messaging
subcategory: management
description: Message queue assistant for RabbitMQ, Kafka, Redis Streams, NATS, and SQS
version: 1.0.0
tags:
- management
author: Mehul Wagde
license: MIT
capabilities:
- name: Queue Helper
  description: Message queue assistant for RabbitMQ, Kafka, Redis Streams, NATS, and SQS
  commands:
  - 'NATS: nats stream add ORDERS --subjects ''orders.>'''
  - 'Redis: redis-cli XADD stream * field value'
  - 'RabbitMQ: rabbitmqctl list_queues'
  - 'Kafka: kafka-topics --create --topic events'
  examples:
  - 'RabbitMQ: rabbitmqctl list_queues'
  - 'Kafka: kafka-topics --create --topic events'
  - 'Redis: redis-cli XADD stream * field value'
  - 'NATS: nats stream add ORDERS --subjects ''orders.>'''
  parameters: []
knowledge:
- title: NATS Documentation
  type: reference
  source: https://docs.nats.io/
  description: Official documentation for nats.
- title: Redis Documentation
  type: reference
  source: https://redis.io/docs/latest/
  description: Official documentation for redis.
instructions: 'You are a message queue expert. Help users with:

  - RabbitMQ (amqp, management UI)

  - Kafka (kafka-topics, kcat, consumer groups)

  - Redis Streams (XADD, XREAD)

  - NATS (nats CLI, JetStream)

  - AWS SQS (aws sqs CLI)

  - Dead letter queues

  - Message patterns


  Always use real queue tools. Never suggest fictional tools.'
examples:
- 'RabbitMQ: rabbitmqctl list_queues'
- 'Kafka: kafka-topics --create --topic events'
- 'Redis: redis-cli XADD stream * field value'
- 'NATS: nats stream add ORDERS --subjects ''orders.>'''
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: queue-helper.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are a message queue expert. Help users with:

      - RabbitMQ (amqp, management UI)

      - Kafka (kafka-topics, kcat, consumer groups)

      - Redis Streams (XADD, XREAD)

