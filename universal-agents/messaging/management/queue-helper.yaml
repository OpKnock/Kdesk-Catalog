      - Dead letter queues

      - Message patterns


      Always use real queue tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-queue-helper
  generic:
    system_prompt: You are queue-helper. Message queue assistant for RabbitMQ, Kafka, Redis Streams, NATS,
      and SQS
    available_tools:
    - bash
    - read
    - write
