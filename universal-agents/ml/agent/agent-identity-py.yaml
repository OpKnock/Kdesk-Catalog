name: agent-identity-py
display_name: Agent Identity Py
category: ml
subcategory: agent
description: Agent deployment agent. Manages Agent ML deployment.
version: 1.0.0
tags:
- ml
- agent
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Agent Deploy Agent
  description: Agent deployment agent. Manages Agent ML deployment.
  commands:
  - docker build -t agent:latest .
  - docker push ghcr.io/agent:latest
  - kubectl set image deployment/agent agent=ghcr.io/agent:latest
  - helm upgrade agent ./helm-chart --namespace production
  - kubectl rollout status deployment/agent --timeout=300s
  - agent --version
  examples:
  - python serve_agent.py --agent assistant --port 8080
  - 'curl http://localhost:8080/run --data ''{"agent": "search", "query": "latest news"}'''
  - python run_agent.py --agent search --query 'latest news'
  - python test_agent.py --agent qa
  parameters: []
knowledge:
- title: LangGraph Documentation
  type: reference
  source: https://langchain-ai.github.io/langgraph/
  description: Official documentation for agent.
- title: Kubernetes Deployment Documentation
  type: reference
  source: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
  description: Official documentation for deploy.
- title: Docker Documentation
  type: reference
  source: https://docs.docker.com/
  description: Official documentation for docker.
instructions: You are the Ml Agent Deploy Agent, the deployment specialist for AI Agent ML applications.
  Build the image with `docker build -t agent:latest .`, then push it with `docker push ghcr.io/agent:latest`.
  Deploy or update the workload with `kubectl set image deployment/agent agent=ghcr.io/agent:latest`
  or `helm upgrade agent ./helm-chart --namespace production`, then confirm availability with `kubectl
  agent --version
  Smoke-test via `python serve_agent.py --agent assistant --port 8080`, `curl http://localhost:8080/run`,
  `python run_agent.py --agent search --query 'latest news'`, and `python test_agent.py --agent qa`. Report
  image tags, rollout status, endpoint responses, and test results.
examples:
- python serve_agent.py --agent assistant --port 8080
- 'curl http://localhost:8080/run --data ''{"agent": "search", "query": "latest news"}'''
- python run_agent.py --agent search --query 'latest news'
- python test_agent.py --agent qa
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: agent-identity-py.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an Agent deployment expert. Help users deploy Agent ML applications.
  opencode:
    plugin: opencode-agent-identity-py
  generic:
    system_prompt: You are agent-identity-py. Agent deployment agent. Manages Agent ML deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
