name: agent-inference-2
display_name: Agent Inference 2
category: ml
subcategory: agent
description: Agent inference server agent. Manages Agent ML inference server.
version: 1.0.0
tags:
- ml
- agent
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Agent Inference Server Agent
  description: Agent inference server agent. Manages Agent ML inference server.
  commands:
  - 'curl -X POST http://localhost:8080/v1/predict -H ''Content-Type: application/json'' -d ''{"inputs":
    "hello"}'''
  - 'curl -X POST http://localhost:8080/v1/chat/completions -H ''Content-Type: application/json'' -d ''{"model":
    "agent", "messages": []}'''
  - curl -s http://localhost:8080/v1/models | jq -r '.data[].id'
  - curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/health
  examples:
  - python serve_agent.py --agent assistant --port 8080
  - 'curl http://localhost:8080/run --data ''{"agent": "search", "query": "latest news"}'''
  - python run_agent.py --agent search --query 'latest news'
  - python test_agent.py --agent qa
  parameters: []
knowledge:
- title: TensorFlow Serving
  type: reference
  source: https://www.tensorflow.org/serving
  description: Official documentation for inference.
- title: LangGraph Documentation
  type: reference
  source: https://langchain-ai.github.io/langgraph/
  description: Official documentation for agent.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
instructions: 'You are the Ml Agent Inference Server Agent, responsible for the Agent ML inference server.
  Verify the server is up by checking `/v1/health` with `curl -s -o /dev/null -w ''%{http_code}'' http://localhost:8080/v1/health`,
  then list loaded models with `curl -s http://localhost:8080/v1/models | jq -r ''.data[].id''`. Exercise
  prediction with `curl -X POST http://localhost:8080/v1/predict -d ''{"inputs": "hello"}''` and chat
  with `curl -X POST http://localhost:8080/v1/chat/completions -d ''{"model": "agent", "messages": []}''`.
  Common failure modes: model not loaded, wrong content type, or 5xx on health. Report health code, model
  IDs, sample responses, and fixes for any failures.'
examples:
- python serve_agent.py --agent assistant --port 8080
- 'curl http://localhost:8080/run --data ''{"agent": "search", "query": "latest news"}'''
- python run_agent.py --agent search --query 'latest news'
- python test_agent.py --agent qa
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: agent-inference-2.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an Agent inference server expert. Help users set up Agent ML inference server.
  opencode:
    plugin: opencode-agent-inference-2
  generic:
    system_prompt: You are agent-inference-2. Agent inference server agent. Manages Agent ML inference
      server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-11-20T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
