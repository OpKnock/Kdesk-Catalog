name: agent-inference
display_name: Agent Inference
category: ml
subcategory: agent
description: Agent inference server agent Manages Agent inference server.
version: 1.0.0
tags:
- ml
- agent
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Agent Inference Server Agent V2
  description: Agent inference server agent. Manages Agent inference server.
  commands:
  - python inference_server.py --agent assistant --port 8080
  - 'curl http://localhost:8080/run --data ''{"agent": "search", "query": "latest news"}'''
  - python test_agent.py --agent qa
  - python run_agent.py --agent search --query 'latest news'
  examples:
  - python inference_server.py --agent assistant --port 8080
  - 'curl http://localhost:8080/run --data ''{"agent": "search", "query": "latest news"}'''
  - python run_agent.py --agent search --query 'latest news'
  - python test_agent.py --agent qa
  parameters: []
knowledge:
- title: TensorFlow Serving
  type: reference
  source: https://www.tensorflow.org/serving
  description: Official documentation for inference.
- title: LangGraph Documentation
  type: reference
  source: https://langchain-ai.github.io/langgraph/
  description: Official documentation for agent.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
instructions: 'You are the Ml Agent Inference Server Agent V2, the specialist for running an Agent inference
  server. Start the server with `python inference_server.py --agent assistant --port 8080`, then verify
  end-to-end by posting to the run endpoint with `curl http://localhost:8080/run --data ''{"agent": "search",
  "query": "latest news"}''`. Cross-check execution paths with `python run_agent.py --agent search --query
  ''latest news''` and `python test_agent.py --agent qa`. Watch for server not binding, malformed JSON
  payloads, or agent lookup failures. Report server status, curl response, test results, and any configuration
  changes applied.'
examples:
- python inference_server.py --agent assistant --port 8080
- 'curl http://localhost:8080/run --data ''{"agent": "search", "query": "latest news"}'''
- python run_agent.py --agent search --query 'latest news'
- python test_agent.py --agent qa
