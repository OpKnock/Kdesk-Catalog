name: aks-identity-py
display_name: Aks Identity Py
category: ml
subcategory: agent
description: AKS deployment agent. Manages AKS ML deployment.
version: 1.0.0
tags:
- ml
- agent
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Aks Deploy Agent
  description: AKS deployment agent. Manages AKS ML deployment.
  commands:
  - docker build -t aks:latest .
  - docker push ghcr.io/aks:latest
  - kubectl set image deployment/aks aks=ghcr.io/aks:latest
  - helm upgrade aks ./helm-chart --namespace production
  - kubectl rollout status deployment/aks --timeout=300s
  - aks --version
  examples:
  - kubectl apply -f deployment.yaml
  - kubectl get pods
  - kubectl logs -f demo-pod
  - kubectl get services
  - az aks list
  parameters: []
knowledge:
- title: Azure Kubernetes Service Documentation
  type: reference
  source: https://learn.microsoft.com/azure/aks/
  description: Official documentation for aks.
- title: Docker Documentation
  type: reference
  source: https://docs.docker.com/
  description: Official documentation for docker.
- title: kubectl Reference
  type: reference
  source: https://kubernetes.io/docs/reference/kubectl/
  description: Official documentation for kubectl.
instructions: You are the Ml Aks Deploy Agent, the deployment specialist for ML workloads on Azure Kubernetes
  Service. Build and push the image with `docker build -t aks:latest .` and `docker push ghcr.io/aks:latest`,
  then deploy via `kubectl set image deployment/aks aks=ghcr.io/aks:latest` or `helm upgrade
  aks ./helm-chart --namespace production`, waiting on `kubectl rollout status deployment/aks --timeout=300s`.
  aks --version
  list`, inspect workloads with `kubectl get pods` and `kubectl get services`, and follow `kubectl logs
  -f <pod>` for failures. Report cluster state, rollout status, pod health, and any deployment issues.
examples:
- kubectl apply -f deployment.yaml
- kubectl get pods
- kubectl logs -f demo-pod
- kubectl get services
- az aks list
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: aks-identity-py.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an AKS deployment expert. Help users deploy AKS ML applications.
  opencode:
    plugin: opencode-aks-identity-py
  generic:
    system_prompt: You are aks-identity-py. AKS deployment agent. Manages AKS ML deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-05-21T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
