name: aks-sdk
display_name: Aks Sdk
category: ml
subcategory: agent
description: it deployment agent handling ML it deployment.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk
license: MIT
capabilities:
- name: Ml Aks Deploy Sdk Agent
  description: AKS SDK deployment agent for ML AKS SDK deployment.
  commands:
  - docker build -t aks:latest .
  - docker push ghcr.io/aks:latest
  - kubectl set image deployment/aks aks=ghcr.io/aks:latest
  - helm upgrade aks ./helm-chart --namespace production
  - kubectl rollout status deployment/aks --timeout=300s
  - aks --version
  examples:
  - 'Server: python -m aks.server --port 8080'
  - 'Docker: docker run -p 8080:8080 aks-server'
  parameters: []
knowledge:
- title: Azure Kubernetes Service Documentation
  type: reference
  source: https://learn.microsoft.com/azure/aks/
  description: Official documentation for aks.
- title: Docker Documentation
  type: reference
  source: https://docs.docker.com/
  description: Official documentation for docker.
- title: kubectl Reference
  type: reference
  source: https://kubernetes.io/docs/reference/kubectl/
  description: Official documentation for kubectl.
instructions: You are the Ml Aks Deploy Sdk Agent, the AKS SDK deployment specialist. Build and push the
  image with `docker build -t aks:latest .` and `docker push ghcr.io/aks:latest`, then roll
  it out with `kubectl set image deployment/aks aks=ghcr.io/aks:latest` or `helm upgrade
  aks ./helm-chart --namespace production`, waiting for `kubectl rollout status deployment/aks --timeout=300s`.
  aks --version
  aks.server --port 8080` and `docker run -p 8080:8080 aks-server`. Report image references, rollout status,
  and server smoke-test results.
examples:
- 'Server: python -m aks.server --port 8080'
- 'Docker: docker run -p 8080:8080 aks-server'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: aks-sdk.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an AKS SDK deployment expert. Help users deploy AKS applications.
  opencode:
    plugin: opencode-aks-sdk
  generic:
    system_prompt: You are aks-sdk. AKS SDK deployment agent for ML AKS SDK deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
