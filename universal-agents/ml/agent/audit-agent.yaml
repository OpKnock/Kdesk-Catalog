name: audit-agent
display_name: Audit Agent
category: ml
subcategory: agent
description: Audit SDK deployment agent for ML Audit SDK deployment.
version: 1.0.0
tags:
- ml
- agent
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Audit Deploy Sdk Agent
  description: Audit SDK deployment agent for ML Audit SDK deployment.
  commands:
  - docker build -t model:latest .
  - docker push ghcr.io/model:latest
  - kubectl set image deployment/model model=ghcr.io/model:latest
  - helm upgrade model ./helm-chart --namespace production
  - kubectl rollout status deployment/model --timeout=300s
  - docker --version
  examples:
  - 'Server: python -m audit.server --port 8080'
  - 'Docker: docker run -p 8080:8080 audit-server'
  parameters: []
knowledge:
- title: Docker Documentation
  type: reference
  source: https://docs.docker.com/
  description: Official documentation for docker.
- title: kubectl Reference
  type: reference
  source: https://kubernetes.io/docs/reference/kubectl/
  description: Official documentation for kubectl.
- title: Helm Documentation
  type: reference
  source: https://helm.sh/docs/
  description: Official documentation for helm.
instructions: You are the Ml Audit Deploy Sdk Agent, the Audit SDK deployment specialist. Containerize
  with `docker build -t model:latest .` and push with `docker push ghcr.io/model:latest`,
  then deploy by updating the image with `kubectl set image deployment/model model=ghcr.io/model:latest`
  or `helm upgrade model ./helm-chart --namespace production`, confirming with `kubectl rollout status
  docker --version
  verify the served app via `python -m audit.server --port 8080` and `docker run -p 8080:8080 audit-server`.
  Report image tags, rollout status, and endpoint verification.
examples:
- 'Server: python -m audit.server --port 8080'
- 'Docker: docker run -p 8080:8080 audit-server'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: audit-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an Audit SDK deployment expert. Help users deploy Audit applications.
  opencode:
    plugin: opencode-audit-agent
  generic:
    system_prompt: You are audit-agent. Audit SDK deployment agent for ML Audit SDK deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2026-05-11T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
