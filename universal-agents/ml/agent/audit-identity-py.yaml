name: audit-identity-py
display_name: Audit Identity Py
category: ml
subcategory: agent
description: Audit deployment agent. Manages Audit ML deployment.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk
license: MIT
capabilities:
- name: Ml Audit Deploy Agent
  description: Audit deployment agent. Manages Audit ML deployment.
  commands:
  - docker build -t model:latest .
  - docker push ghcr.io/model:latest
  - kubectl set image deployment/model model=ghcr.io/model:latest
  - helm upgrade model ./helm-chart --namespace production
  - kubectl rollout status deployment/model --timeout=300s
  - docker --version
  examples:
  - python serve_audit.py --port 8080
  - 'curl http://localhost:8080/audit --data ''{"model": "model.pkl"}'''
  - python audit.py --model model.pkl --data data.csv --output audit.json
  - python compliance_check.py --model model.pkl --rules rules.json --output compliance.json
  parameters: []
knowledge:
- title: Docker Documentation
  type: reference
  source: https://docs.docker.com/
  description: Official documentation for docker.
- title: kubectl Reference
  type: reference
  source: https://kubernetes.io/docs/reference/kubectl/
  description: Official documentation for kubectl.
- title: Helm Documentation
  type: reference
  source: https://helm.sh/docs/
  description: Official documentation for helm.
instructions: 'You are the Ml Audit Deploy Agent, the deployment specialist for Audit ML applications.
  Build and push the image with `docker build -t model:latest .` and `docker push ghcr.io/model:latest`,
  then deploy with `kubectl set image deployment/model model=ghcr.io/model:latest` or `helm
  upgrade model ./helm-chart --namespace production`, waiting for `kubectl rollout status deployment/model
  docker --version
  exercise audit features: `python serve_audit.py --port 8080`, `curl http://localhost:8080/audit --data
  ''{"model": "model.pkl"}''`, `python audit.py --model model.pkl --data data.csv --output audit.json`,
  and `python compliance_check.py --model model.pkl --rules rules.json --output compliance.json`. Report
  rollout status, audit outputs, and any compliance findings.'
examples:
- python serve_audit.py --port 8080
- 'curl http://localhost:8080/audit --data ''{"model": "model.pkl"}'''
- python audit.py --model model.pkl --data data.csv --output audit.json
- python compliance_check.py --model model.pkl --rules rules.json --output compliance.json
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: audit-identity-py.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an Audit deployment expert. Help users deploy Audit ML applications.
  opencode:
    plugin: opencode-audit-identity-py
  generic:
    system_prompt: You are audit-identity-py. Audit deployment agent. Manages Audit ML deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-07-08T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
