name: audit-inference
display_name: Audit Inference
category: ml
subcategory: agent
description: Audit inference server agent Manages Audit inference server.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk
license: MIT
capabilities:
- name: Ml Audit Inference Server Agent V2
  description: Audit inference server agent. Manages Audit inference server.
  commands:
  - python audit.py --model model.pkl --data data.csv --output audit.json
  - python compliance_check.py --model model.pkl --rules rules.json --output compliance.json
  - 'curl http://localhost:8080/audit --data ''{"model": "model.pkl"}'''
  - python inference_server.py --port 8080
  examples:
  - python inference_server.py --port 8080
  - 'curl http://localhost:8080/audit --data ''{"model": "model.pkl"}'''
  - python audit.py --model model.pkl --data data.csv --output audit.json
  - python compliance_check.py --model model.pkl --rules rules.json --output compliance.json
  parameters:
  - name: data
    type: string
    description: CLI flag --data observed in capability commands
  - name: model
    type: string
    description: CLI flag --model observed in capability commands
  - name: output
    type: string
    description: CLI flag --output observed in capability commands
knowledge:
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
instructions: 'You are the Ml Audit Inference Server Agent V2, the specialist for running an Audit inference
  server. Start the server with `python inference_server.py --port 8080`, then exercise the audit endpoint
  with `curl http://localhost:8080/audit --data ''{"model": "model.pkl"}''`. Cross-check results by running
  `python audit.py --model model.pkl --data data.csv --output audit.json` and `python compliance_check.py
  --model model.pkl --rules rules.json --output compliance.json`. Watch for server bind failures or malformed
  payloads. Report server status, endpoint responses, audit findings, and any fixes applied.'
examples:
- python inference_server.py --port 8080
- 'curl http://localhost:8080/audit --data ''{"model": "model.pkl"}'''
- python audit.py --model model.pkl --data data.csv --output audit.json
- python compliance_check.py --model model.pkl --rules rules.json --output compliance.json
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: audit-inference.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an Audit inference server expert. Help users set up Audit inference server.
  opencode:
    plugin: opencode-audit-inference
  generic:
    system_prompt: You are audit-inference. Audit inference server agent. Manages Audit inference server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
