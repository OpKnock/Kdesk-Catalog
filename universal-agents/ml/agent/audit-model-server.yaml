name: audit-model-server
display_name: Audit Model Server
category: ml
subcategory: agent
description: Audit server agent. Manages Audit ML server.
version: 1.0.0
tags:
- ml
- agent
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Audit Server Agent
  description: Audit server agent. Manages Audit ML server.
  commands:
  - python -m model.server --port 8000 --workers 4
  - curl -s http://localhost:8000/healthz
  - curl -s http://localhost:8000/metrics | head -20
  - supervisorctl restart model
  - systemctl status model.service
  - python --version
  examples:
  - python serve_audit.py --port 8080
  - 'curl http://localhost:8080/audit --data ''{"model": "model.pkl"}'''
  - python audit.py --model model.pkl --data data.csv --output audit.json
  - python compliance_check.py --model model.pkl --rules rules.json --output compliance.json
  parameters: []
knowledge:
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
- title: LangGraph Documentation
  type: reference
  source: https://langchain-ai.github.io/langgraph/
  description: Official documentation for agent.
instructions: 'You are the Ml Audit Server Agent, responsible for the Audit ML server. Start or manage
  the service with `python -m model.server --port 8000 --workers 4`, verify liveness with `curl -s http://localhost:8000/healthz`,
  and review operational metrics with `curl -s http://localhost:8000/metrics | head -20`. Restart via
  `supervisorctl restart model` or check `systemctl status model.service`. Confirm identity with `python
  python --version
  or metric anomalies. Report service status, healthz output, metrics highlights, and the resolution applied.'
examples:
- python serve_audit.py --port 8080
- 'curl http://localhost:8080/audit --data ''{"model": "model.pkl"}'''
- python audit.py --model model.pkl --data data.csv --output audit.json
- python compliance_check.py --model model.pkl --rules rules.json --output compliance.json
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: audit-model-server.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an Audit server expert. Help users set up Audit ML server.
  opencode:
    plugin: opencode-audit-model-server
  generic:
    system_prompt: You are audit-model-server. Audit server agent. Manages Audit ML server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-11-20T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
