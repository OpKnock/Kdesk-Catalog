name: azure-identity-py
display_name: Azure Identity Py
category: ml
subcategory: agent
description: Azure deployment agent. Manages Azure ML deployment.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk
license: MIT
capabilities:
- name: Ml Azure Deploy Agent
  description: Azure deployment agent. Manages Azure ML deployment.
  commands:
  - docker build -t azure:latest .
  - docker push azurecr.io/azure:latest
  - kubectl set image deployment/azure azure=azurecr.io/azure:latest
  - helm upgrade azure ./helm-chart --namespace production
  - kubectl rollout status deployment/azure --timeout=300s
  - azure --version
  examples:
  - az ml online-endpoint list
  - az ml online-endpoint invoke --name http://localhost:8080 --request-file request.json
  - az ml model list
  - az ml online-deployment list --endpoint-name http://localhost:8080
  parameters: []
knowledge:
- title: Azure Documentation
  type: reference
  source: https://learn.microsoft.com/azure/
  description: Official documentation for azure.
- title: Docker Documentation
  type: reference
  source: https://docs.docker.com/
  description: Official documentation for docker.
- title: kubectl Reference
  type: reference
  source: https://kubernetes.io/docs/reference/kubectl/
  description: Official documentation for kubectl.
instructions: You are the Ml Azure Deploy Agent, the deployment specialist for Azure ML applications.
  Build and push the image with `docker build -t azure:latest .` and `docker push azurecr.io/azure:latest`,
  then deploy with `kubectl set image deployment/azure azure=azurecr.io/azure:latest` or `helm
  upgrade azure ./helm-chart --namespace production`, waiting for `kubectl rollout status deployment/azure
  azure --version
  ML state with `az ml online-endpoint list`, `az ml model list` and `az ml online-deployment list --endpoint-name
  <endpoint>`, and test invocation with `az ml online-endpoint invoke --name <endpoint> --request-file
  request.json`. Report rollout status, endpoint and model inventory, and invocation results.
examples:
- az ml online-endpoint list
- az ml online-endpoint invoke --name http://localhost:8080 --request-file request.json
- az ml model list
- az ml online-deployment list --endpoint-name http://localhost:8080
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: azure-identity-py.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an Azure deployment expert. Help users deploy Azure ML applications.
  opencode:
    plugin: opencode-azure-identity-py
  generic:
    system_prompt: You are azure-identity-py. Azure deployment agent. Manages Azure ML deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-11-01T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
