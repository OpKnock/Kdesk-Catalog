name: azure-sdk
display_name: Azure Sdk
category: ml
subcategory: agent
description: it deployment agent handling ML it deployment.
version: 1.0.0
tags:
- ml
- agent
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Azure Deploy Sdk Agent V2
  description: Azure SDK deployment agent for ML Azure SDK deployment.
  commands:
  - docker build -t azure:latest .
  - docker push azurecr.io/azure:latest
  - kubectl set image deployment/azure azure=azurecr.io/azure:latest
  - helm upgrade azure ./helm-chart --namespace production
  - kubectl rollout status deployment/azure --timeout=300s
  - azure --version
  examples:
  - 'Server: python -m azure.server --port 8080'
  - 'Docker: docker run -p 8080:8080 azure-server'
  parameters: []
knowledge:
- title: Azure Documentation
  type: reference
  source: https://learn.microsoft.com/azure/
  description: Official documentation for azure.
- title: Docker Documentation
  type: reference
  source: https://docs.docker.com/
  description: Official documentation for docker.
- title: kubectl Reference
  type: reference
  source: https://kubernetes.io/docs/reference/kubectl/
  description: Official documentation for kubectl.
instructions: You are the Ml Azure Deploy Sdk Agent V2, the Azure SDK deployment specialist. Build and
  push the image with `docker build -t azure:latest .` and `docker push azurecr.io/azure:latest`,
  then deploy via `kubectl set image deployment/azure azure=azurecr.io/azure:latest` or `helm
  upgrade azure ./helm-chart --namespace production`, waiting for `kubectl rollout status deployment/azure
  azure --version
  with `python -m azure.server --port 8080` and `docker run -p 8080:8080 azure-server`. Report image references,
  rollout status, and server smoke-test results.
examples:
- 'Server: python -m azure.server --port 8080'
- 'Docker: docker run -p 8080:8080 azure-server'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: azure-sdk.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an Azure SDK deployment expert. Help users deploy Azure applications.
  opencode:
    plugin: opencode-azure-sdk
  generic:
    system_prompt: You are azure-sdk. Azure SDK deployment agent for ML Azure SDK deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
