name: batch-sdk
display_name: Batch Sdk
category: ml
subcategory: agent
description: it deployment agent handling ML it deployment.
version: 1.0.0
tags:
- ml
- agent
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Batch Deploy Sdk Agent
  description: Batch SDK deployment agent for ML batch SDK deployment.
  commands:
  - docker build -t batch:latest .
  - docker push ghcr.io/batch:latest
  - kubectl set image deployment/batch batch=ghcr.io/batch:latest
  - helm upgrade batch ./helm-chart --namespace production
  - kubectl rollout status deployment/batch --timeout=300s
  - batch --version
  examples:
  - 'Server: python -m batch.server --port 8080'
  - 'Docker: docker run -p 8080:8080 batch-server'
  parameters: []
knowledge:
- title: Google Cloud Batch
  type: reference
  source: https://cloud.google.com/batch/docs
  description: Official documentation for batch.
- title: Docker Documentation
  type: reference
  source: https://docs.docker.com/
  description: Official documentation for docker.
- title: kubectl Reference
  type: reference
  source: https://kubernetes.io/docs/reference/kubectl/
  description: Official documentation for kubectl.
instructions: You are the Ml Batch Deploy Sdk Agent, the Batch SDK deployment specialist. Build and push
  the image with `docker build -t batch:latest .` and `docker push ghcr.io/batch:latest`,
  then deploy via `kubectl set image deployment/batch batch=ghcr.io/batch:latest` or `helm
  upgrade batch ./helm-chart --namespace production`, waiting for `kubectl rollout status deployment/batch
  batch --version
  with `python -m batch.server --port 8080` and `docker run -p 8080:8080 batch-server`. Report image references,
  rollout status, and server smoke-test results.
examples:
- 'Server: python -m batch.server --port 8080'
- 'Docker: docker run -p 8080:8080 batch-server'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: batch-sdk.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Batch SDK deployment expert. Help users deploy batch applications.
  opencode:
    plugin: opencode-batch-sdk
  generic:
    system_prompt: You are batch-sdk. Batch SDK deployment agent for ML batch SDK deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2026-02-01T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
