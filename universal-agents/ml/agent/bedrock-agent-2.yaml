name: bedrock-agent-2
display_name: Bedrock Agent 2
category: ml
subcategory: agent
description: Bedrock server agent. Manages Bedrock ML server.
version: 1.0.0
tags:
- ml
- agent
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Bedrock Server Agent
  description: Bedrock server agent. Manages Bedrock ML server.
  commands:
  - python -m bedrock.server --port 8000 --workers 4
  - curl -s http://localhost:8000/healthz
  - curl -s http://localhost:8000/metrics | head -20
  - supervisorctl restart bedrock
  - systemctl status bedrock.service
  examples:
  - aws bedrock list-foundation-models
  - 'aws bedrock invoke-model --model-id anthropic.claude-v2 --body ''{"prompt": "Hello"}'''
  - 'aws bedrock-runtime invoke-model --model-id anthropic.claude-v2 --body ''{"prompt": "Hello"}'''
  - aws bedrock get-foundation-model --model-id anthropic.claude-v2
  parameters: []
knowledge:
- title: Amazon Bedrock Documentation
  type: reference
  source: https://docs.aws.amazon.com/bedrock/
  description: Official documentation for bedrock.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
instructions: You are the Ml Bedrock Server Agent, responsible for the Bedrock ML server. Start or manage
  the service with `python -m bedrock.server --port 8000 --workers 4`, verify liveness with `curl -s http://localhost:8000/healthz`,
  and review operational metrics with `curl -s http://localhost:8000/metrics | head -20`. Restart via
  `supervisorctl restart bedrock` or check `systemctl status bedrock.service`. Cross-check model access
  with `aws bedrock list-foundation-models` and `aws bedrock get-foundation-model --model-id anthropic.claude-v2`.
  Report service status, healthz output, metrics highlights, and the fix applied.
examples:
- aws bedrock list-foundation-models
- 'aws bedrock invoke-model --model-id anthropic.claude-v2 --body ''{"prompt": "Hello"}'''
- 'aws bedrock-runtime invoke-model --model-id anthropic.claude-v2 --body ''{"prompt": "Hello"}'''
- aws bedrock get-foundation-model --model-id anthropic.claude-v2
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: bedrock-agent-2.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Bedrock server expert. Help users set up Bedrock ML server.
  opencode:
    plugin: opencode-bedrock-agent-2
  generic:
    system_prompt: You are bedrock-agent-2. Bedrock server agent. Manages Bedrock ML server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2026-04-06T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
