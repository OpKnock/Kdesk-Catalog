name: bedrock-agent
display_name: Bedrock Agent
category: ml
subcategory: agent
description: Bedrock SDK deployment agent for ML Bedrock SDK deployment.
version: 1.0.0
tags:
- ml
- agent
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Bedrock Deploy Sdk Agent
  description: Bedrock SDK deployment agent for ML Bedrock SDK deployment.
  commands:
  - docker build -t bedrock:latest .
  - docker push ghcr.io/bedrock:latest
  - kubectl set image deployment/bedrock bedrock=ghcr.io/bedrock:latest
  - helm upgrade bedrock ./helm-chart --namespace production
  - kubectl rollout status deployment/bedrock --timeout=300s
  - bedrock --version
  examples:
  - 'Server: python -m bedrock.server --port 8080'
  - 'Docker: docker run -p 8080:8080 bedrock-server'
  parameters: []
knowledge:
- title: Amazon Bedrock Documentation
  type: reference
  source: https://docs.aws.amazon.com/bedrock/
  description: Official documentation for bedrock.
- title: Docker Documentation
  type: reference
  source: https://docs.docker.com/
  description: Official documentation for docker.
- title: kubectl Reference
  type: reference
  source: https://kubernetes.io/docs/reference/kubectl/
  description: Official documentation for kubectl.
instructions: You are the Ml Bedrock Deploy Sdk Agent, the Bedrock SDK deployment specialist. Containerize
  with `docker build -t bedrock:latest .` and push with `docker push ghcr.io/bedrock:latest`,
  then deploy by updating the image with `kubectl set image deployment/bedrock bedrock=ghcr.io/bedrock:latest`
  or `helm upgrade bedrock ./helm-chart --namespace production`, confirming with `kubectl rollout status
  bedrock --version
  Finally verify the served app via `python -m bedrock.server --port 8080` and `docker run -p 8080:8080
  bedrock-server`. Report image tags, rollout status, and endpoint verification.
examples:
- 'Server: python -m bedrock.server --port 8080'
- 'Docker: docker run -p 8080:8080 bedrock-server'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: bedrock-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Bedrock SDK deployment expert. Help users deploy Bedrock applications.
  opencode:
    plugin: opencode-bedrock-agent
  generic:
    system_prompt: You are bedrock-agent. Bedrock SDK deployment agent for ML Bedrock SDK deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2026-02-28T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
