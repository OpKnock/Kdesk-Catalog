name: bedrock-identity-py
display_name: Bedrock Identity Py
category: ml
subcategory: agent
description: Bedrock deployment agent. Manages Bedrock ML deployment.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk
license: MIT
capabilities:
- name: Ml Bedrock Deploy Agent
  description: Bedrock deployment agent. Manages Bedrock ML deployment.
  commands:
  - docker build -t bedrock:latest .
  - docker push ghcr.io/bedrock:latest
  - kubectl set image deployment/bedrock bedrock=ghcr.io/bedrock:latest
  - helm upgrade bedrock ./helm-chart --namespace production
  - kubectl rollout status deployment/bedrock --timeout=300s
  - bedrock --version
  examples:
  - aws bedrock list-foundation-models
  - 'aws bedrock invoke-model --model-id anthropic.claude-v2 --body ''{"prompt": "Hello"}'''
  - 'aws bedrock-runtime invoke-model --model-id anthropic.claude-v2 --body ''{"prompt": "Hello"}'''
  - aws bedrock get-foundation-model --model-id anthropic.claude-v2
  parameters: []
knowledge:
- title: Amazon Bedrock Documentation
  type: reference
  source: https://docs.aws.amazon.com/bedrock/
  description: Official documentation for bedrock.
- title: Docker Documentation
  type: reference
  source: https://docs.docker.com/
  description: Official documentation for docker.
- title: kubectl Reference
  type: reference
  source: https://kubernetes.io/docs/reference/kubectl/
  description: Official documentation for kubectl.
instructions: 'You are the Ml Bedrock Deploy Agent, the deployment specialist for Bedrock ML applications
  on AWS. Build and push the image with `docker build -t bedrock:latest .` and `docker push ghcr.io/bedrock:latest`,
  then deploy via `kubectl set image deployment/bedrock bedrock=ghcr.io/bedrock:latest` or
  `helm upgrade bedrock ./helm-chart --namespace production`, waiting for `kubectl rollout status deployment/bedrock
  bedrock --version
  access with `aws bedrock list-foundation-models` and `aws bedrock get-foundation-model --model-id anthropic.claude-v2`,
  and test with `aws bedrock invoke-model --model-id anthropic.claude-v2 --body ''{"prompt": "Hello"}''`.
  Report rollout status, model availability, and invocation results.'
examples:
- aws bedrock list-foundation-models
- 'aws bedrock invoke-model --model-id anthropic.claude-v2 --body ''{"prompt": "Hello"}'''
- 'aws bedrock-runtime invoke-model --model-id anthropic.claude-v2 --body ''{"prompt": "Hello"}'''
- aws bedrock get-foundation-model --model-id anthropic.claude-v2
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: bedrock-identity-py.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Bedrock deployment expert. Help users deploy Bedrock ML applications.
  opencode:
    plugin: opencode-bedrock-identity-py
  generic:
    system_prompt: You are bedrock-identity-py. Bedrock deployment agent. Manages Bedrock ML deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-06-09T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
