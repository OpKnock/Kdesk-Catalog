name: bedrock-inference
display_name: Bedrock Inference
category: ml
subcategory: agent
description: Bedrock inference server agent. Manages Bedrock ML inference server.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk
license: MIT
capabilities:
- name: Ml Bedrock Inference Server Agent
  description: Bedrock inference server agent. Manages Bedrock ML inference server.
  commands:
  - 'curl -X POST http://localhost:8080/v1/predict -H ''Content-Type: application/json'' -d ''{"inputs":
    "hello"}'''
  - 'curl -X POST http://localhost:8080/v1/chat/completions -H ''Content-Type: application/json'' -d ''{"model":
    "bedrock", "messages": []}'''
  - curl -s http://localhost:8080/v1/models | jq -r '.data[].id'
  - curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/health
  - bedrock --version
  examples:
  - aws bedrock list-foundation-models
  - 'aws bedrock invoke-model --model-id anthropic.claude-v2 --body ''{"prompt": "Hello"}'''
  - 'aws bedrock-runtime invoke-model --model-id anthropic.claude-v2 --body ''{"prompt": "Hello"}'''
  - aws bedrock get-foundation-model --model-id anthropic.claude-v2
  parameters: []
knowledge:
- title: Amazon Bedrock Documentation
  type: reference
  source: https://docs.aws.amazon.com/bedrock/
  description: Official documentation for bedrock.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
- title: jq Manual
  type: reference
  source: https://jqlang.github.io/jq/
  description: Official documentation for jq.
instructions: You are the Ml Bedrock Inference Server Agent, responsible for the Bedrock ML inference
  server. Check liveness with `curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/health`,
  list loaded models with `curl -s http://localhost:8080/v1/models | jq -r '.data[].id'`, and test prediction
  bedrock --version
  --agent bedrock-inference`. Cross-check with `aws bedrock list-foundation-models` and `aws bedrock-runtime
  invoke-model`. Report health status, model IDs, responses, and root-cause fixes for serving failures.
examples:
- aws bedrock list-foundation-models
- 'aws bedrock invoke-model --model-id anthropic.claude-v2 --body ''{"prompt": "Hello"}'''
- 'aws bedrock-runtime invoke-model --model-id anthropic.claude-v2 --body ''{"prompt": "Hello"}'''
- aws bedrock get-foundation-model --model-id anthropic.claude-v2
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: bedrock-inference.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Bedrock inference server expert. Help users set up Bedrock ML inference server.
  opencode:
    plugin: opencode-bedrock-inference
  generic:
    system_prompt: You are bedrock-inference. Bedrock inference server agent. Manages Bedrock ML inference
      server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-10-11T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
