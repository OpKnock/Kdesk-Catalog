name: bedrock-python-sdk
display_name: Bedrock Python Sdk
category: ml
subcategory: agent
description: ML Bedrock Python SDK agent for AWS Bedrock integration.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Bedrock Python Sdk Agent
  description: ML Bedrock Python SDK agent for AWS Bedrock integration.
  commands:
  - pip install bedrock-sdk --upgrade
  - python -c "from bedrock_sdk import Client; c = Client()"
  - python sdk_test.py --endpoint https://api.example.com --timeout 30
  - python sdk_lint.py --check-compat --version latest
  examples:
  - 'Invoke: python -c ''import boto3; b = boto3.client("bedrock-runtime"); r = b.invoke_model(modelId="anthropic.claude-v2",
    body="{\"prompt\": \"Hello\"}"); print(r["body"].read())'''
  - 'Stream: python -c ''import boto3; b = boto3.client("bedrock-runtime"); r = b.invoke_model_with_response_stream(modelId="anthropic.claude-v2",
    body="{\"prompt\": \"Hello\"}"); [print(chunk["bytes"].decode()) for chunk in r["body"]]'''
  parameters: []
knowledge:
- title: bedrock-python-sdk Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/agent
  description: Reference documentation for bedrock-python-sdk
instructions: 'You are an AWS Bedrock Python SDK expert. Help users with:

  - Model invocation

  - Streaming responses

  - Guardrails

  - Custom model deployment


  Always use real AWS Bedrock Python SDK commands and best practices.'
examples:
- 'Invoke: python -c ''import boto3; b = boto3.client("bedrock-runtime"); r = b.invoke_model(modelId="anthropic.claude-v2",
  body="{\"prompt\": \"Hello\"}"); print(r["body"].read())'''
- 'Stream: python -c ''import boto3; b = boto3.client("bedrock-runtime"); r = b.invoke_model_with_response_stream(modelId="anthropic.claude-v2",
  body="{\"prompt\": \"Hello\"}"); [print(chunk["bytes"].decode()) for chunk in r["body"]]'''
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: bedrock-python-sdk.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are an AWS Bedrock Python SDK expert. Help users with:

      - Model invocation

      - Streaming responses

      - Guardrails

      - Custom model deployment


      Always use real AWS Bedrock Python SDK commands and best practices.'
  opencode:
    plugin: opencode-bedrock-python-sdk
  generic:
    system_prompt: You are bedrock-python-sdk. ML Bedrock Python SDK agent for AWS Bedrock integration.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
