name: coding-agent
display_name: Coding Agent
category: ml
subcategory: agent
description: Coding inference server agent. Manages Coding ML inference server.
version: 1.0.0
tags:
- ml
- agent
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Coding Inference Server Agent
  description: Coding inference server agent. Manages Coding ML inference server.
  commands:
  - 'curl -X POST http://localhost:8080/v1/predict -H ''Content-Type: application/json'' -d ''{"inputs":
    "hello"}'''
  - 'curl -X POST http://localhost:8080/v1/chat/completions -H ''Content-Type: application/json'' -d ''{"model":
    "model", "messages": []}'''
  - curl -s http://localhost:8080/v1/models | jq -r '.data[].id'
  - curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/health
  - curl --version
  examples:
  - python serve_coding.py --port 8080
  - 'curl http://localhost:8080/code --data ''{"model": "model.pkl"}'''
  - python generate_code.py --model model.pkl --output model.py
  - python refactor.py --model model.pkl --output refactored_model.py
  parameters: []
knowledge:
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
- title: jq Manual
  type: reference
  source: https://jqlang.github.io/jq/
  description: Official documentation for jq.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
instructions: You are the Ml Coding Inference Server Agent, responsible for the Coding ML inference server.
  Verify the server with `curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/health`, list
  models with `curl -s http://localhost:8080/v1/models | jq -r '.data[].id'`, and exercise prediction
  curl --version
  --agent coding-agent`. Cross-check coding behavior with `python generate_code.py --model model.pkl --output
  model.py` and `python refactor.py --model model.pkl --output refactored_model.py`. Report health code,
  model IDs, responses, and coding outputs.
examples:
- python serve_coding.py --port 8080
- 'curl http://localhost:8080/code --data ''{"model": "model.pkl"}'''
- python generate_code.py --model model.pkl --output model.py
- python refactor.py --model model.pkl --output refactored_model.py
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: coding-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Coding inference server expert. Help users set up Coding ML inference server.
  opencode:
    plugin: opencode-coding-agent
  generic:
    system_prompt: You are coding-agent. Coding inference server agent. Manages Coding ML inference server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-03-30T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
