name: coding-inference
display_name: Coding Inference
category: ml
subcategory: agent
description: Coding inference server agent Manages Coding inference server.
version: 1.0.0
tags:
- ml
- agent
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Coding Inference Server Agent V2
  description: Coding inference server agent. Manages Coding inference server.
  commands:
  - 'curl http://localhost:8080/code --data ''{"model": "model.pkl"}'''
  - python generate_code.py --model model.pkl --output model.py
  - python refactor.py --model model.pkl --output refactored_model.py
  - python inference_server.py --port 8080
  examples:
  - python inference_server.py --port 8080
  - 'curl http://localhost:8080/code --data ''{"model": "model.pkl"}'''
  - python generate_code.py --model model.pkl --output model.py
  - python refactor.py --model model.pkl --output refactored_model.py
  parameters:
  - name: model
    type: string
    description: CLI flag --model observed in capability commands
  - name: output
    type: string
    description: CLI flag --output observed in capability commands
knowledge:
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
instructions: 'You are the Ml Coding Inference Server Agent V2, the specialist for running a Coding inference
  server. Start the server with `python inference_server.py --port 8080`, then exercise the code endpoint
  with `curl http://localhost:8080/code --data ''{"model": "model.pkl"}''`. Cross-check generation and
  refactoring with `python generate_code.py --model model.pkl --output model.py` and `python refactor.py
  --model model.pkl --output refactored_model.py`. Watch for bind failures or malformed payloads. Report
  server status, endpoint responses, generated artifacts, and any fixes applied.'
examples:
- python inference_server.py --port 8080
- 'curl http://localhost:8080/code --data ''{"model": "model.pkl"}'''
- python generate_code.py --model model.pkl --output model.py
- python refactor.py --model model.pkl --output refactored_model.py
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: coding-inference.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Coding inference server expert. Help users set up Coding inference server.
  opencode:
    plugin: opencode-coding-inference
  generic:
    system_prompt: You are coding-inference. Coding inference server agent. Manages Coding inference server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2026-06-19T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
