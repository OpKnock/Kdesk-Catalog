name: collaboration-agent
display_name: Collaboration Agent
category: ml
subcategory: agent
description: Collaboration inference server agent. Manages Collaboration ML inference server.
version: 1.0.0
tags:
- ml
- agent
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Collaboration Inference Server Agent
  description: Collaboration inference server agent. Manages Collaboration ML inference server.
  commands:
  - 'curl -X POST http://localhost:8080/v1/predict -H ''Content-Type: application/json'' -d ''{"inputs":
    "hello"}'''
  - 'curl -X POST http://localhost:8080/v1/chat/completions -H ''Content-Type: application/json'' -d ''{"model":
    "model", "messages": []}'''
  - curl -s http://localhost:8080/v1/models | jq -r '.data[].id'
  - curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/health
  - collaboration --version
  examples:
  - python serve_collaboration.py --port 8080
  - 'curl http://localhost:8080/collaborate --data ''{"model": "model.pkl"}'''
  - python collaborate.py --model model.pkl --team team.json --output collaboration.json
  - python share.py --model model.pkl --users users.json
  parameters: []
knowledge:
- title: Hugging Face Hub Documentation
  type: reference
  source: https://huggingface.co/docs/hub/
  description: Official documentation for collaboration.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
- title: jq Manual
  type: reference
  source: https://jqlang.github.io/jq/
  description: Official documentation for jq.
instructions: You are the Ml Collaboration Inference Server Agent, responsible for the Collaboration ML
  inference server. Verify the server with `curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/health`,
  list models with `curl -s http://localhost:8080/v1/models | jq -r '.data[].id'`, and exercise prediction
  collaboration --version
  --agent collaboration-agent`. Cross-check with `python collaborate.py --model model.pkl --team team.json
  --output collaboration.json` and `python share.py --model model.pkl --users users.json`. Report health
  code, model IDs, responses, and collaboration outputs.
examples:
- python serve_collaboration.py --port 8080
- 'curl http://localhost:8080/collaborate --data ''{"model": "model.pkl"}'''
- python collaborate.py --model model.pkl --team team.json --output collaboration.json
- python share.py --model model.pkl --users users.json
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: collaboration-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Collaboration inference server expert. Help users set up Collaboration ML
      inference server.
  opencode:
    plugin: opencode-collaboration-agent
  generic:
    system_prompt: You are collaboration-agent. Collaboration inference server agent. Manages Collaboration
      ML inference server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2026-07-03T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
