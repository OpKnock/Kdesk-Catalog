name: communication-identity-py
display_name: Communication Identity Py
category: ml
subcategory: agent
description: Communication deployment agent. Manages Communication ML deployment.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk
license: MIT
capabilities:
- name: Ml Communication Deploy Agent
  description: Communication deployment agent. Manages Communication ML deployment.
  commands:
  - docker build -t model:latest .
  - docker push ghcr.io/model:latest
  - kubectl set image deployment/model model=ghcr.io/model:latest
  - helm upgrade model ./helm-chart --namespace production
  - kubectl rollout status deployment/model --timeout=300s
  - communication --version
  examples:
  - python serve_communication.py --port 8080
  - 'curl http://localhost:8080/communicate --data ''{"model": "model.pkl"}'''
  - python report.py --model model.pkl --results results.json --output report.html
  - python visualize.py --model model.pkl --data data.csv --output visualization.html
  parameters: []
knowledge:
- title: arXiv
  type: reference
  source: https://arxiv.org/
  description: Official documentation for communication.
- title: Kubernetes Deployment Documentation
  type: reference
  source: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
  description: Official documentation for deploy.
- title: Docker Documentation
  type: reference
  source: https://docs.docker.com/
  description: Official documentation for docker.
instructions: 'You are the Ml Communication Deploy Agent, the deployment specialist for Communication
  ML applications. Build and push the image with `docker build -t model:latest .` and `docker push ghcr.io/model:latest`,
  then deploy with `kubectl set image deployment/model model=ghcr.io/model:latest` or `helm
  upgrade model ./helm-chart --namespace production`, waiting for `kubectl rollout status deployment/model
  communication --version
  serve and exercise communication features: `python serve_communication.py --port 8080`, `curl http://localhost:8080/communicate
  --data ''{"model": "model.pkl"}''`, `python report.py --model model.pkl --results results.json --output
  report.html`, and `python visualize.py --model model.pkl --data data.csv --output visualization.html`.
  Report rollout status, generated reports, and visualizations.'
examples:
- python serve_communication.py --port 8080
- 'curl http://localhost:8080/communicate --data ''{"model": "model.pkl"}'''
- python report.py --model model.pkl --results results.json --output report.html
- python visualize.py --model model.pkl --data data.csv --output visualization.html
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: communication-identity-py.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Communication deployment expert. Help users deploy Communication ML applications.
  opencode:
    plugin: opencode-communication-identity-py
  generic:
    system_prompt: You are communication-identity-py. Communication deployment agent. Manages Communication
      ML deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
