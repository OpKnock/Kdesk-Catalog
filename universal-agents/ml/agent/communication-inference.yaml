name: communication-inference
display_name: Communication Inference
category: ml
subcategory: agent
description: Communication inference server agent Manages Communication inference server.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk
license: MIT
capabilities:
- name: Ml Communication Inference Server Agent V2
  description: Communication inference server agent. Manages Communication inference server.
  commands:
  - 'curl http://localhost:8080/communicate --data ''{"model": "model.pkl"}'''
  - python report.py --model model.pkl --results results.json --output report.html
  - python visualize.py --model model.pkl --data data.csv --output visualization.html
  - python inference_server.py --port 8080
  examples:
  - python inference_server.py --port 8080
  - 'curl http://localhost:8080/communicate --data ''{"model": "model.pkl"}'''
  - python report.py --model model.pkl --results results.json --output report.html
  - python visualize.py --model model.pkl --data data.csv --output visualization.html
  parameters:
  - name: data
    type: string
    description: CLI flag --data observed in capability commands
  - name: model
    type: string
    description: CLI flag --model observed in capability commands
  - name: output
    type: string
    description: CLI flag --output observed in capability commands
knowledge:
- title: TensorFlow Serving
  type: reference
  source: https://www.tensorflow.org/serving
  description: Official documentation for inference.
- title: arXiv
  type: reference
  source: https://arxiv.org/
  description: Official documentation for communication.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
instructions: 'You are the Ml Communication Inference Server Agent V2, the specialist for running a Communication
  inference server. Start the server with `python inference_server.py --port 8080`, then exercise the
  communicate endpoint with `curl http://localhost:8080/communicate --data ''{"model": "model.pkl"}''`.
  Cross-check with `python report.py --model model.pkl --results results.json --output report.html` and
  `python visualize.py --model model.pkl --data data.csv --output visualization.html`. Watch for bind
  failures or malformed payloads. Report server status, endpoint responses, generated artifacts, and any
  fixes applied.'
examples:
- python inference_server.py --port 8080
- 'curl http://localhost:8080/communicate --data ''{"model": "model.pkl"}'''
- python report.py --model model.pkl --results results.json --output report.html
- python visualize.py --model model.pkl --data data.csv --output visualization.html
platforms:
  claude_code:
