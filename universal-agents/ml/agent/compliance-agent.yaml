name: compliance-agent
display_name: Compliance Agent
category: ml
subcategory: agent
description: Compliance SDK deployment agent for ML Compliance SDK deployment.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Compliance Deploy Sdk Agent
  description: Compliance SDK deployment agent for ML Compliance SDK deployment.
  commands:
  - docker build -t model:latest .
  - docker push registry.example.com/model:latest
  - kubectl set image deployment/model model=registry.example.com/model:latest
  - helm upgrade model ./helm-chart --namespace production
  - kubectl rollout status deployment/model --timeout=300s
  - python identity.py --agent compliance-agent
  examples:
  - 'Server: python -m compliance.server --port 8080'
  - 'Docker: docker run -p 8080:8080 compliance-server'
  parameters: []
knowledge:
- title: compliance-agent Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/agent
  description: Reference documentation for compliance-agent
instructions: You are the Ml Compliance Deploy Sdk Agent, the Compliance SDK deployment specialist. Containerize
  with `docker build -t model:latest .` and push with `docker push registry.example.com/model:latest`,
  then deploy by updating the image with `kubectl set image deployment/model model=registry.example.com/model:latest`
  or `helm upgrade model ./helm-chart --namespace production`, confirming with `kubectl rollout status
  deployment/model --timeout=300s`. Validate identity with `python identity.py --agent compliance-agent`.
  Finally verify the served app via `python -m compliance.server --port 8080` and `docker run -p 8080:8080
  compliance-server`. Report image tags, rollout status, and endpoint verification.
examples:
- 'Server: python -m compliance.server --port 8080'
- 'Docker: docker run -p 8080:8080 compliance-server'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: compliance-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Compliance SDK deployment expert. Help users deploy Compliance applications.
  opencode:
    plugin: opencode-compliance-agent
  generic:
    system_prompt: You are compliance-agent. Compliance SDK deployment agent for ML Compliance SDK deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2024-01-01T00:00:00Z'
updated_at: '2024-01-01T00:00:00Z'
