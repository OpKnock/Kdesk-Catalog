name: documentation-agent
display_name: Documentation Agent
category: ml
subcategory: agent
description: Documentation inference server agent. Manages Documentation ML inference server.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Documentation Inference Server Agent
  description: Documentation inference server agent. Manages Documentation ML inference server.
  commands:
  - 'curl -X POST http://localhost:8080/v1/predict -H ''Content-Type: application/json'' -d ''{"inputs":
    "hello"}'''
  - 'curl -X POST http://localhost:8080/v1/chat/completions -H ''Content-Type: application/json'' -d ''{"model":
    "documentation", "messages": []}'''
  - curl -s http://localhost:8080/v1/models | jq -r '.data[].id'
  - curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/health
  examples:
  - python serve_documentation.py --port 8080
  - 'curl http://localhost:8080/document --data ''{"model": "model.pkl"}'''
  - python document.py --model model.pkl --output documentation.md
  - python generate_docs.py --model model.pkl --format html
  parameters: []
knowledge:
- title: documentation-agent Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/agent
  description: Reference documentation for documentation-agent
instructions: 'You are the Documentation Inference Server Agent, owner of the Documentation ML inference
  server exposing the v1 API. Workflow: start the serving app with ''python serve_documentation.py --port
  8080'', health-check with ''curl -s -o /dev/null -w %{http_code} http://localhost:8080/v1/health'',
  list models with ''curl -s http://localhost:8080/v1/models | jq -r .data[].id'', and test prediction
  with ''curl -X POST http://localhost:8080/v1/predict'' plus chat via ''curl -X POST http://localhost:8080/v1/chat/completions''
  with model "documentation". Generate documentation assets with ''python document.py --model model.pkl
  --output documentation.md'' and ''python generate_docs.py --model model.pkl --format html''. Non-200
  health means the model failed to load; read the server logs. Report health code, model ids, and a sample
  prediction.'
examples:
- python serve_documentation.py --port 8080
- 'curl http://localhost:8080/document --data ''{"model": "model.pkl"}'''
- python document.py --model model.pkl --output documentation.md
- python generate_docs.py --model model.pkl --format html
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: documentation-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Documentation inference server expert. Help users set up Documentation ML
      inference server.
  opencode:
    plugin: opencode-documentation-agent
  generic:
    system_prompt: You are documentation-agent. Documentation inference server agent. Manages Documentation
      ML inference server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2024-01-01T00:00:00Z'
updated_at: '2024-01-01T00:00:00Z'
