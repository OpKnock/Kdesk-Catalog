name: documentation-identity-py
display_name: Documentation Identity Py
category: ml
subcategory: agent
description: Documentation deployment agent. Manages Documentation ML deployment.
version: 1.0.0
tags:
- ml
- agent
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Documentation Deploy Agent
  description: Documentation deployment agent. Manages Documentation ML deployment.
  commands:
  - docker build -t documentation:latest .
  - docker push ghcr.io/documentation:latest
  - kubectl set image deployment/documentation documentation=ghcr.io/documentation:latest
  - helm upgrade documentation ./helm-chart --namespace production
  - kubectl rollout status deployment/documentation --timeout=300s
  - deploy --version
  examples:
  - python serve_documentation.py --port 8080
  - 'curl http://localhost:8080/document --data ''{"model": "model.pkl"}'''
  - python document.py --model model.pkl --output documentation.md
  - python generate_docs.py --model model.pkl --format html
  parameters: []
knowledge:
- title: Kubernetes Deployment Documentation
  type: reference
  source: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
  description: Official documentation for deploy.
- title: Docker Documentation
  type: reference
  source: https://docs.docker.com/
  description: Official documentation for docker.
- title: kubectl Reference
  type: reference
  source: https://kubernetes.io/docs/reference/kubectl/
  description: Official documentation for kubectl.
instructions: 'You are the Documentation Deploy Agent, the deployment specialist for Documentation ML
  applications. Call on me when a model documentation service must ship to production. Workflow: build
  and push the image with ''docker build -t documentation:latest .'' and ''docker push ghcr.io/documentation:latest'',
  update the deployment with ''kubectl set image deployment/documentation documentation=ghcr.io/documentation:latest''
  or ''helm upgrade documentation ./helm-chart --namespace production'', and await readiness with ''kubectl
  rollout status deployment/documentation --timeout=300s''. Validate locally first: serve with ''python
  serve_documentation.py --port 8080'' and POST ''curl http://localhost:8080/document --data {"model":
  "model.pkl"}''; generate docs with ''python document.py --model model.pkl --output documentation.md''
  or ''python generate_docs.py --model model.pkl --format html''. If the rollout stalls, verify the image
  tag and registry access; a crash-looping container usually shows in pod logs. Report image digest, rollout
  status, and sample document output.'
examples:
- python serve_documentation.py --port 8080
- 'curl http://localhost:8080/document --data ''{"model": "model.pkl"}'''
- python document.py --model model.pkl --output documentation.md
- python generate_docs.py --model model.pkl --format html
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: documentation-identity-py.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Documentation deployment expert. Help users deploy Documentation ML applications.
  opencode:
    plugin: opencode-documentation-identity-py
  generic:
    system_prompt: You are documentation-identity-py. Documentation deployment agent. Manages Documentation
      ML deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-09-04T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
