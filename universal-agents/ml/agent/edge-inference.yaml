name: edge-inference
display_name: Edge Inference
category: ml
subcategory: agent
description: Edge inference server agent. Manages edge ML inference server.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk
license: MIT
capabilities:
- name: Ml Edge Inference Server Agent
  description: Edge inference server agent. Manages edge ML inference server.
  commands:
  - 'curl -X POST http://localhost:8080/v1/predict -H ''Content-Type: application/json'' -d ''{"inputs":
    "hello"}'''
  - 'curl -X POST http://localhost:8080/v1/chat/completions -H ''Content-Type: application/json'' -d ''{"model":
    "edge", "messages": []}'''
  - curl -s http://localhost:8080/v1/models | jq -r '.data[].id'
  - curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/health
  examples:
  - python edge_server.py --model model.tflite --port 8080
  - 'curl http://localhost:8080/predict --data ''{"input": "Hello"}'''
  - python test_edge_server.py --endpoint http://localhost:8080
  - python config_edge.py --model model.tflite --device raspberry-pi
  parameters: []
knowledge:
- title: KubeEdge
  type: reference
  source: https://github.com/kubeedge/kubeedge
  description: Official documentation for edge.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
- title: jq Manual
  type: reference
  source: https://jqlang.github.io/jq/
  description: Official documentation for jq.
instructions: 'You are the Edge Inference Server Agent, operator of the edge ML inference server. Workflow:
  configure the device with ''python config_edge.py --model model.tflite --device raspberry-pi'', start
  the server with ''python edge_server.py --model model.tflite --port 8080'', test with ''python test_edge_server.py
  --endpoint http://localhost:8080'', and send a live request with ''curl http://localhost:8080/predict
  --data {"input": "Hello"}''. Validate the v1 API too: health code via ''curl -s -o /dev/null -w %{http_code}
  http://localhost:8080/v1/health'', models via ''curl -s http://localhost:8080/v1/models | jq -r .data[].id'',
  and chat completions with model "edge". Failure modes: the TFLite model failing to load, wrong device
  runtime, or an unreachable endpoint; check logs and device config. Report server status, health code,
  model ids, and prediction output.'
examples:
- python edge_server.py --model model.tflite --port 8080
- 'curl http://localhost:8080/predict --data ''{"input": "Hello"}'''
- python test_edge_server.py --endpoint http://localhost:8080
- python config_edge.py --model model.tflite --device raspberry-pi
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: edge-inference.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an edge inference server expert. Help users set up edge ML inference server.
  opencode:
    plugin: opencode-edge-inference
  generic:
    system_prompt: You are edge-inference. Edge inference server agent. Manages edge ML inference server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-01-11T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
