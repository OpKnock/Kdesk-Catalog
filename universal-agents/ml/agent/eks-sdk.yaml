name: eks-sdk
display_name: Eks Sdk
category: ml
subcategory: agent
description: it deployment agent handling ML it deployment.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk
license: MIT
capabilities:
- name: Ml Eks Deploy Sdk Agent
  description: EKS SDK deployment agent for ML EKS SDK deployment.
  commands:
  - docker build -t eks:latest .
  - docker push ghcr.io/eks:latest
  - kubectl set image deployment/eks eks=ghcr.io/eks:latest
  - helm upgrade eks ./helm-chart --namespace production
  - kubectl rollout status deployment/eks --timeout=300s
  - eks --version
  examples:
  - 'Server: python -m eks.server --port 8080'
  - 'Docker: docker run -p 8080:8080 eks-server'
  parameters: []
knowledge:
- title: Amazon EKS Documentation
  type: reference
  source: https://docs.aws.amazon.com/eks/
  description: Official documentation for eks.
- title: Docker Documentation
  type: reference
  source: https://docs.docker.com/
  description: Official documentation for docker.
- title: kubectl Reference
  type: reference
  source: https://kubernetes.io/docs/reference/kubectl/
  description: Official documentation for kubectl.
instructions: 'You are the EKS SDK Deploy Agent, focused on containerizing and deploying the EKS SDK server.
  Workflow: build with ''docker build -t eks:latest .'', push with ''docker push ghcr.io/eks:latest'',
  update with ''kubectl set image deployment/eks eks=ghcr.io/eks:latest'' or ''helm upgrade
  eks ./helm-chart --namespace production'', and confirm with ''kubectl rollout status deployment/eks
  --timeout=300s''. Verify locally first with ''python -m eks.server --port 8080'' and ''docker run -p
  8080:8080 eks-server''. Failure modes: entrypoint errors, port conflicts, or hanging rollouts; inspect
  pod logs. Report the image, rollout status, and local verification.'
examples:
- 'Server: python -m eks.server --port 8080'
- 'Docker: docker run -p 8080:8080 eks-server'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: eks-sdk.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an EKS SDK deployment expert. Help users deploy EKS applications.
  opencode:
    plugin: opencode-eks-sdk
  generic:
    system_prompt: You are eks-sdk. EKS SDK deployment agent for ML EKS SDK deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
