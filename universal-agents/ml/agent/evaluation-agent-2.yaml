name: evaluation-agent-2
display_name: Evaluation Agent 2
category: ml
subcategory: agent
description: Evaluation inference server agent. Manages Evaluation ML inference server.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk
license: MIT
capabilities:
- name: Ml Evaluation Inference Server Agent
  description: Evaluation inference server agent. Manages Evaluation ML inference server.
  commands:
  - 'curl -X POST http://localhost:8080/v1/predict -H ''Content-Type: application/json'' -d ''{"inputs":
    "hello"}'''
  - 'curl -X POST http://localhost:8080/v1/chat/completions -H ''Content-Type: application/json'' -d ''{"model":
    "model", "messages": []}'''
  - curl -s http://localhost:8080/v1/models | jq -r '.data[].id'
  - curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/health
  - evaluation --version
  examples:
  - python serve_evaluation.py --model model.pkl --port 8080
  - 'curl http://localhost:8080/evaluate --data ''{"model": "model.pkl", "data": "test.csv"}'''
  - python evaluate.py --model model.pkl --data test.csv --metrics accuracy,f1
  - python benchmark.py --model model.pkl --dataset benchmark.json
  parameters: []
knowledge:
- title: MLflow LLM Evaluation
  type: reference
  source: https://mlflow.org/docs/latest/llms/llm-evaluate/
  description: Official documentation for evaluation.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
- title: jq Manual
  type: reference
  source: https://jqlang.github.io/jq/
  description: Official documentation for jq.
instructions: 'You are the Evaluation Inference Server Agent, owner of the Evaluation ML inference server
  exposing the v1 API. Workflow: start with ''python serve_evaluation.py --model model.pkl --port 8080'',
  health-check with ''curl -s -o /dev/null -w %{http_code} http://localhost:8080/v1/health'', list models
  with ''curl -s http://localhost:8080/v1/models | jq -r .data[].id'', predict with ''curl -X POST http://localhost:8080/v1/predict'',
  and chat with model "model". Evaluate with ''python evaluate.py --model model.pkl --data test.csv --metrics
  accuracy,f1'' and benchmark with ''python benchmark.py --model model.pkl --dataset benchmark.json'';
  exercise the endpoint with ''curl http://localhost:8080/evaluate''. Failure modes: model load failures
  and non-200 health; read logs. Report health code, model ids, prediction output, and metrics.'
examples:
- python serve_evaluation.py --model model.pkl --port 8080
- 'curl http://localhost:8080/evaluate --data ''{"model": "model.pkl", "data": "test.csv"}'''
- python evaluate.py --model model.pkl --data test.csv --metrics accuracy,f1
- python benchmark.py --model model.pkl --dataset benchmark.json
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: evaluation-agent-2.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an Evaluation inference server expert. Help users set up Evaluation ML inference
      server.
  opencode:
    plugin: opencode-evaluation-agent-2
  generic:
    system_prompt: You are evaluation-agent-2. Evaluation inference server agent. Manages Evaluation ML
      inference server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-07-27T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
