name: evaluation-agent
display_name: Evaluation Agent
category: ml
subcategory: agent
description: Evaluation SDK deployment agent for ML Evaluation SDK deployment.
version: 1.0.0
tags:
- ml
- agent
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Evaluation Deploy Sdk Agent
  description: Evaluation SDK deployment agent for ML Evaluation SDK deployment.
  commands:
  - docker build -t model:latest .
  - docker push ghcr.io/model:latest
  - kubectl set image deployment/model model=ghcr.io/model:latest
  - helm upgrade model ./helm-chart --namespace production
  - kubectl rollout status deployment/model --timeout=300s
  - evaluation --version
  examples:
  - 'Server: python -m evaluation.server --port 8080'
  - 'Docker: docker run -p 8080:8080 evaluation-server'
  parameters: []
knowledge:
- title: MLflow LLM Evaluation
  type: reference
  source: https://mlflow.org/docs/latest/llms/llm-evaluate/
  description: Official documentation for evaluation.
- title: Docker Documentation
  type: reference
  source: https://docs.docker.com/
  description: Official documentation for docker.
- title: kubectl Reference
  type: reference
  source: https://kubernetes.io/docs/reference/kubectl/
  description: Official documentation for kubectl.
instructions: 'You are the Evaluation Deploy SDK Agent, focused on containerizing and shipping the Evaluation
  SDK server. Workflow: build with ''docker build -t model:latest .'', push with ''docker push ghcr.io/model:latest'',
  update with ''kubectl set image deployment/model model=ghcr.io/model:latest'' or ''helm
  upgrade model ./helm-chart --namespace production'', and confirm with ''kubectl rollout status deployment/model
  --timeout=300s''. Verify locally with ''python -m evaluation.server --port 8080'' and ''docker run -p
  8080:8080 evaluation-server''. Failure modes: entrypoint errors, port conflicts, or rollouts that hang
  because the container exits; inspect container logs. Report the image, rollout result, and local verification.'
examples:
- 'Server: python -m evaluation.server --port 8080'
- 'Docker: docker run -p 8080:8080 evaluation-server'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: evaluation-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an Evaluation SDK deployment expert. Help users deploy Evaluation applications.
  opencode:
    plugin: opencode-evaluation-agent
  generic:
    system_prompt: You are evaluation-agent. Evaluation SDK deployment agent for ML Evaluation SDK deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-03-30T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
