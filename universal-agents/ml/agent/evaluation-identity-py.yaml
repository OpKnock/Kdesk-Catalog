name: evaluation-identity-py
display_name: Evaluation Identity Py
category: ml
subcategory: agent
description: Evaluation deployment agent. Manages Evaluation ML deployment.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk
license: MIT
capabilities:
- name: Ml Evaluation Deploy Agent
  description: Evaluation deployment agent. Manages Evaluation ML deployment.
  commands:
  - docker build -t model:latest .
  - docker push ghcr.io/model:latest
  - kubectl set image deployment/model model=ghcr.io/model:latest
  - helm upgrade model ./helm-chart --namespace production
  - kubectl rollout status deployment/model --timeout=300s
  - evaluation --version
  examples:
  - python serve_evaluation.py --model model.pkl --port 8080
  - 'curl http://localhost:8080/evaluate --data ''{"model": "model.pkl", "data": "test.csv"}'''
  - python evaluate.py --model model.pkl --data test.csv --metrics accuracy,f1
  - python benchmark.py --model model.pkl --dataset benchmark.json
  parameters: []
knowledge:
- title: MLflow LLM Evaluation
  type: reference
  source: https://mlflow.org/docs/latest/llms/llm-evaluate/
  description: Official documentation for evaluation.
- title: Docker Documentation
  type: reference
  source: https://docs.docker.com/
  description: Official documentation for docker.
- title: kubectl Reference
  type: reference
  source: https://kubernetes.io/docs/reference/kubectl/
  description: Official documentation for kubectl.
instructions: 'You are the Evaluation Deploy Agent, the deployment specialist for Evaluation ML applications.
  Workflow: build and push the image with ''docker build -t model:latest .'' and ''docker push ghcr.io/model:latest'',
  update with ''kubectl set image deployment/model model=ghcr.io/model:latest'' or ''helm
  upgrade model ./helm-chart --namespace production'', and await ''kubectl rollout status deployment/model
  --timeout=300s''. Validate locally first: serve with ''python serve_evaluation.py --model model.pkl
  --port 8080'' and POST ''curl http://localhost:8080/evaluate --data {"model": "model.pkl", "data": "test.csv"}'';
  run ''python evaluate.py --model model.pkl --data test.csv --metrics accuracy,f1'' and ''python benchmark.py
  --model model.pkl --dataset benchmark.json'' to confirm the workload. Failure modes: rollout stalls
  on a bad image or the evaluate endpoint errors on malformed payloads; check logs. Report image digest,
  rollout status, and evaluation output.'
examples:
- python serve_evaluation.py --model model.pkl --port 8080
- 'curl http://localhost:8080/evaluate --data ''{"model": "model.pkl", "data": "test.csv"}'''
- python evaluate.py --model model.pkl --data test.csv --metrics accuracy,f1
- python benchmark.py --model model.pkl --dataset benchmark.json
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: evaluation-identity-py.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an Evaluation deployment expert. Help users deploy Evaluation ML applications.
  opencode:
    plugin: opencode-evaluation-identity-py
  generic:
    system_prompt: You are evaluation-identity-py. Evaluation deployment agent. Manages Evaluation ML
      deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-07-01T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
