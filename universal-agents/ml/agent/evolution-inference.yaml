name: evolution-inference
display_name: Evolution Inference
category: ml
subcategory: agent
description: Evolution inference server agent Manages Evolution inference server.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk
license: MIT
capabilities:
- name: Ml Evolution Inference Server Agent V2
  description: Evolution inference server agent. Manages Evolution inference server.
  commands:
  - python genetic_algorithm.py --population-size 100 --generations 50
  - 'curl http://localhost:8080/evolve --data ''{"model": "model.pkl"}'''
  - python evolve.py --model model.pkl --data data.csv --generations 10
  - python inference_server.py --port 8080
  examples:
  - python inference_server.py --port 8080
  - 'curl http://localhost:8080/evolve --data ''{"model": "model.pkl"}'''
  - python evolve.py --model model.pkl --data data.csv --generations 10
  - python genetic_algorithm.py --population-size 100 --generations 50
  parameters:
  - name: data
    type: string
    description: CLI flag --data observed in capability commands
  - name: generations
    type: number
    description: CLI flag --generations observed in capability commands
knowledge:
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
instructions: 'You are the Evolution Inference Server Agent V2, operator of the Evolution inference server.
  Workflow: start the server with ''python inference_server.py --port 8080'', exercise it with ''curl
  http://localhost:8080/evolve --data {"model": "model.pkl"}'', and run evolution with ''python evolve.py
  --model model.pkl --data data.csv --generations 10'' and ''python genetic_algorithm.py --population-size
  100 --generations 50''. Failure modes: the server not binding the port, payloads referencing missing
  models, and long-running evolutions timing out; check server logs and payload shape. Report server status,
  the /evolve response, and fitness outcomes.'
examples:
- python inference_server.py --port 8080
- 'curl http://localhost:8080/evolve --data ''{"model": "model.pkl"}'''
- python evolve.py --model model.pkl --data data.csv --generations 10
- python genetic_algorithm.py --population-size 100 --generations 50
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: evolution-inference.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an Evolution inference server expert. Help users set up Evolution inference
      server.
  opencode:
    plugin: opencode-evolution-inference
  generic:
    system_prompt: You are evolution-inference. Evolution inference server agent. Manages Evolution inference
      server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
