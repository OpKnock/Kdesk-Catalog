name: explainability-agent-2
display_name: Explainability Agent 2
category: ml
subcategory: agent
description: Explainability inference server agent. Manages Explainability ML inference server.
version: 1.0.0
tags:
- ml
- agent
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Explainability Inference Server Agent
  description: Explainability inference server agent. Manages Explainability ML inference server.
  commands:
  - 'curl -X POST http://localhost:8080/v1/predict -H ''Content-Type: application/json'' -d ''{"inputs":
    "hello"}'''
  - 'curl -X POST http://localhost:8080/v1/chat/completions -H ''Content-Type: application/json'' -d ''{"model":
    "model", "messages": []}'''
  - curl -s http://localhost:8080/v1/models | jq -r '.data[].id'
  - curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/health
  - explainability --version
  examples:
  - python serve_explainability.py --port 8080
  - 'curl http://localhost:8080/explain --data ''{"model": "model.pkl", "input": "sample.json"}'''
  - python explain.py --model model.pkl --input sample.json --output explanation.json
  - python shap_explain.py --model model.pkl --data data.csv --output shap_values.json
  parameters: []
knowledge:
- title: SHAP Documentation
  type: reference
  source: https://shap.readthedocs.io/en/latest/
  description: Official documentation for explainability.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
- title: jq Manual
  type: reference
  source: https://jqlang.github.io/jq/
  description: Official documentation for jq.
instructions: 'You are the Explainability Inference Server Agent, owner of the Explainability ML inference
  server exposing the v1 API. Workflow: start with ''python serve_explainability.py --port 8080'', health-check
  with ''curl -s -o /dev/null -w %{http_code} http://localhost:8080/v1/health'', list models with ''curl
  -s http://localhost:8080/v1/models | jq -r .data[].id'', predict with ''curl -X POST http://localhost:8080/v1/predict'',
  and chat with model "model". Compute explanations with ''python explain.py --model model.pkl --input
  sample.json --output explanation.json'' and ''python shap_explain.py --model model.pkl --data data.csv
  --output shap_values.json''; exercise ''curl http://localhost:8080/explain''. Failure modes: model load
  failures and non-200 health; read logs. Report health code, model ids, prediction output, and explanation
  summaries.'
examples:
- python serve_explainability.py --port 8080
- 'curl http://localhost:8080/explain --data ''{"model": "model.pkl", "input": "sample.json"}'''
- python explain.py --model model.pkl --input sample.json --output explanation.json
- python shap_explain.py --model model.pkl --data data.csv --output shap_values.json
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: explainability-agent-2.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an Explainability inference server expert. Help users set up Explainability
      ML inference server.
  opencode:
    plugin: opencode-explainability-agent-2
  generic:
    system_prompt: You are explainability-agent-2. Explainability inference server agent. Manages Explainability
      ML inference server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-11-13T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
