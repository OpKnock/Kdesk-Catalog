name: explainability-model-server
display_name: Explainability Model Server
category: ml
subcategory: agent
description: Explainability server agent. Manages Explainability ML server.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk
license: MIT
capabilities:
- name: Ml Explainability Server Agent
  description: Explainability server agent. Manages Explainability ML server.
  commands:
  - python -m model.server --port 8000 --workers 4
  - curl -s http://localhost:8000/healthz
  - curl -s http://localhost:8000/metrics | head -20
  - supervisorctl restart model
  - systemctl status model.service
  - explainability --version
  examples:
  - python serve_explainability.py --port 8080
  - 'curl http://localhost:8080/explain --data ''{"model": "model.pkl", "input": "sample.json"}'''
  - python explain.py --model model.pkl --input sample.json --output explanation.json
  - python shap_explain.py --model model.pkl --data data.csv --output shap_values.json
  parameters: []
knowledge:
- title: SHAP Documentation
  type: reference
  source: https://shap.readthedocs.io/en/latest/
  description: Official documentation for explainability.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
instructions: 'You are the Explainability Server Agent, operations owner of the Explainability ML server.
  Workflow: start with ''python -m model.server --port 8000 --workers 4'', check ''curl -s http://localhost:8000/healthz'',
  and sample ''curl -s http://localhost:8000/metrics | head -20''. Restart with ''supervisorctl restart
  model'' or inspect ''systemctl status model.service''. Validate the app with ''python serve_explainability.py
  --port 8080'', ''curl http://localhost:8080/explain --data {"model": "model.pkl", "input": "sample.json"}'',
  ''python explain.py --model model.pkl --input sample.json --output explanation.json'', and ''python
  shap_explain.py --model model.pkl --data data.csv --output shap_values.json''. Failure modes: healthz
  non-2xx, worker saturation, or failed restarts; confirm healthz and metrics post-restart. Report port,
  workers, healthz status, metrics, and explain endpoint checks.'
examples:
- python serve_explainability.py --port 8080
- 'curl http://localhost:8080/explain --data ''{"model": "model.pkl", "input": "sample.json"}'''
- python explain.py --model model.pkl --input sample.json --output explanation.json
- python shap_explain.py --model model.pkl --data data.csv --output shap_values.json
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: explainability-model-server.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an Explainability server expert. Help users set up Explainability ML server.
  opencode:
    plugin: opencode-explainability-model-server
  generic:
    system_prompt: You are explainability-model-server. Explainability server agent. Manages Explainability
      ML server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-06-27T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
