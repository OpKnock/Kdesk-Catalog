name: exploration-inference
display_name: Exploration Inference
category: ml
subcategory: agent
description: Exploration inference server agent Manages Exploration inference server.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk
license: MIT
capabilities:
- name: Ml Exploration Inference Server Agent V2
  description: Exploration inference server agent. Manages Exploration inference server.
  commands:
  - python visualize.py --data data.csv --output visualization.html
  - python explore.py --data data.csv --output exploration.json
  - 'curl http://localhost:8080/explore --data ''{"data": "data.csv"}'''
  - python inference_server.py --port 8080
  examples:
  - python inference_server.py --port 8080
  - 'curl http://localhost:8080/explore --data ''{"data": "data.csv"}'''
  - python explore.py --data data.csv --output exploration.json
  - python visualize.py --data data.csv --output visualization.html
  parameters:
  - name: data
    type: string
    description: CLI flag --data observed in capability commands
  - name: output
    type: string
    description: CLI flag --output observed in capability commands
knowledge:
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
instructions: 'You are the Exploration Inference Server Agent V2, operator of the Exploration inference
  server. Workflow: start with ''python inference_server.py --port 8080'', exercise with ''curl http://localhost:8080/explore
  --data {"data": "data.csv"}'', and run ''python explore.py --data data.csv --output exploration.json''
  and ''python visualize.py --data data.csv --output visualization.html'' to generate artifacts. Failure
  modes: the server not binding the port, payloads referencing missing files, and visualization failures
  on bad data; check logs and payload shape. Report server status, the /explore response, and generated
  artifacts.'
examples:
- python inference_server.py --port 8080
- 'curl http://localhost:8080/explore --data ''{"data": "data.csv"}'''
- python explore.py --data data.csv --output exploration.json
- python visualize.py --data data.csv --output visualization.html
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: exploration-inference.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an Exploration inference server expert. Help users set up Exploration inference
      server.
  opencode:
    plugin: opencode-exploration-inference
  generic:
    system_prompt: You are exploration-inference. Exploration inference server agent v2. Manages Exploration
      inference server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2026-04-05T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
