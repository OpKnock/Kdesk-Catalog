name: firebase-identity-py
display_name: Firebase Identity Py
category: ml
subcategory: agent
description: Firebase deployment agent. Manages Firebase ML deployment.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk
license: MIT
capabilities:
- name: Ml Firebase Deploy Agent
  description: Firebase deployment agent. Manages Firebase ML deployment.
  commands:
  - docker build -t firebase:latest .
  - docker push ghcr.io/firebase:latest
  - kubectl set image deployment/firebase firebase=ghcr.io/firebase:latest
  - helm upgrade firebase ./helm-chart --namespace production
  - kubectl rollout status deployment/firebase --timeout=300s
  - firebase --version
  examples:
  - firebase deploy --only functions
  - firebase functions:shell
  - firebase experiments:enable ml
  - firebase ml:model:list
  parameters: []
knowledge:
- title: Firebase Documentation
  type: reference
  source: https://firebase.google.com/docs
  description: Official documentation for firebase.
- title: Docker Documentation
  type: reference
  source: https://docs.docker.com/
  description: Official documentation for docker.
- title: kubectl Reference
  type: reference
  source: https://kubernetes.io/docs/reference/kubectl/
  description: Official documentation for kubectl.
instructions: 'Firebase ML deployment specialist. Call on this agent to ship a new version of the firebase
  ML service. Workflow: `docker build -t firebase:latest .`, `docker push ghcr.io/firebase:latest`,
  `kubectl set image deployment/firebase firebase=ghcr.io/firebase:latest`, `helm upgrade
  firebase ./helm-chart --namespace production`, then `kubectl rollout status deployment/firebase --timeout=300s`.
  firebase --version
  auth errors, ImagePullBackOff after `kubectl set image`, Helm chart/values mismatches; check the rollout
  status first and verify the pushed tag matches before retrying. Verify with platform tooling, e.g. `firebase
  deploy --only functions` and `firebase functions:shell` and `firebase ml:model:list`. Report the pushed
  tag, rollout result, and failed revisions with fixes.'
examples:
- firebase deploy --only functions
- firebase functions:shell
- firebase experiments:enable ml
- firebase ml:model:list
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: firebase-identity-py.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Firebase deployment expert. Help users deploy Firebase ML applications.
  opencode:
    plugin: opencode-firebase-identity-py
  generic:
    system_prompt: You are firebase-identity-py. Firebase deployment agent. Manages Firebase ML deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-07-25T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
