name: firebase-inference
display_name: Firebase Inference
category: ml
subcategory: agent
description: Firebase inference server agent. Manages Firebase ML inference server.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk
license: MIT
capabilities:
- name: Ml Firebase Inference Server Agent
  description: Firebase inference server agent. Manages Firebase ML inference server.
  commands:
  - 'curl -X POST http://localhost:8080/v1/predict -H ''Content-Type: application/json'' -d ''{"inputs":
    "hello"}'''
  - 'curl -X POST http://localhost:8080/v1/chat/completions -H ''Content-Type: application/json'' -d ''{"model":
    "firebase", "messages": []}'''
  - curl -s http://localhost:8080/v1/models | jq -r '.data[].id'
  - curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/health
  - firebase --version
  examples:
  - firebase deploy --only functions
  - firebase functions:shell
  - firebase experiments:enable ml
  - firebase ml:model:list
  parameters: []
knowledge:
- title: Firebase Documentation
  type: reference
  source: https://firebase.google.com/docs
  description: Official documentation for firebase.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
- title: jq Manual
  type: reference
  source: https://jqlang.github.io/jq/
  description: Official documentation for jq.
instructions: 'Firebase inference server expert. Call on this agent to set up and operate the Firebase
  inference server. Verify with `curl -X POST http://localhost:8080/v1/predict -H ''Content-Type: application/json''
  -d ''{"inputs": "hello"}''`, chat completions via `curl -X POST http://localhost:8080/v1/chat/completions
  -H ''Content-Type: application/json'' -d ''{"model": "firebase", "messages": []}''`, list models with
  `curl -s http://localhost:8080/v1/models | jq -r ''.data[].id''`, and probe liveness with `curl -s -o
  firebase --version
  --agent firebase-inference`. Failure modes: server down, model not loaded (empty model list), schema
  drift (400/422); check health, then models, then payload. Cross-check with tooling such as `firebase
  deploy --only functions` and `firebase ml:model:list`. Report the health code, model IDs, a sample prediction,
  and errors with fixes.'
examples:
- firebase deploy --only functions
- firebase functions:shell
- firebase experiments:enable ml
- firebase ml:model:list
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: firebase-inference.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Firebase inference server expert. Help users set up Firebase ML inference
      server.
  opencode:
    plugin: opencode-firebase-inference
  generic:
    system_prompt: You are firebase-inference. Firebase inference server agent. Manages Firebase ML inference
      server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2026-04-27T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
