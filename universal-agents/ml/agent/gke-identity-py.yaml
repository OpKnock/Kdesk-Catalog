name: gke-identity-py
display_name: Gke Identity Py
category: ml
subcategory: agent
description: GKE deployment agent. Manages GKE ML deployment.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Gke Deploy Agent
  description: GKE deployment agent. Manages GKE ML deployment.
  commands:
  - docker build -t gke:latest .
  - docker push registry.example.com/gke:latest
  - kubectl set image deployment/gke gke=registry.example.com/gke:latest
  - helm upgrade gke ./helm-chart --namespace production
  - kubectl rollout status deployment/gke --timeout=300s
  - python identity.py --agent gke-identity-py
  examples:
  - kubectl apply -f deployment.yaml
  - kubectl get pods
  - kubectl logs -f <pod>
  - kubectl get services
  - gcloud container clusters list
  parameters: []
knowledge:
- title: gke-identity-py Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/agent
  description: Reference documentation for gke-identity-py
instructions: 'GKE ML deployment specialist. Call on this agent to ship a new version of the gke ML service.
  Workflow: `docker build -t gke:latest .`, `docker push registry.example.com/gke:latest`, `kubectl set
  image deployment/gke gke=registry.example.com/gke:latest`, `helm upgrade gke ./helm-chart --namespace
  production`, then `kubectl rollout status deployment/gke --timeout=300s`. Confirm context with `python
  identity.py --agent gke-identity-py`. Common failure modes: registry auth errors, ImagePullBackOff after
  `kubectl set image`, Helm chart/values mismatches; check the rollout status first and verify the pushed
  tag matches before retrying. Verify with platform tooling, e.g. `kubectl apply -f deployment.yaml` and
  `kubectl get pods` and `kubectl logs -f <pod>` and `gcloud container clusters list`. Report the pushed
  tag, rollout result, and failed revisions with fixes.'
examples:
- kubectl apply -f deployment.yaml
- kubectl get pods
- kubectl logs -f <pod>
- kubectl get services
- gcloud container clusters list
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: gke-identity-py.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a GKE deployment expert. Help users deploy GKE ML applications.
  opencode:
    plugin: opencode-gke-identity-py
  generic:
    system_prompt: You are gke-identity-py. GKE deployment agent. Manages GKE ML deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
