name: governance-identity-py
display_name: Governance Identity Py
category: ml
subcategory: agent
description: Governance deployment agent. Manages Governance ML deployment.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Governance Deploy Agent
  description: Governance deployment agent. Manages Governance ML deployment.
  commands:
  - docker build -t model:latest .
  - docker push registry.example.com/model:latest
  - kubectl set image deployment/model model=registry.example.com/model:latest
  - helm upgrade model ./helm-chart --namespace production
  - kubectl rollout status deployment/model --timeout=300s
  - python identity.py --agent governance-identity-py
  examples:
  - python serve_governance.py --port 8080
  - 'curl http://localhost:8080/governance --data ''{"model": "model.pkl"}'''
  - python audit.py --model model.pkl --data train.csv --output audit.json
  - python compliance_check.py --model model.pkl --rules rules.json
  parameters: []
knowledge:
- title: governance-identity-py Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/agent
  description: Reference documentation for governance-identity-py
instructions: 'Governance ML deployment specialist. Call on this agent to ship a new version of the model
  ML service. Workflow: `docker build -t model:latest .`, `docker push registry.example.com/model:latest`,
  `kubectl set image deployment/model model=registry.example.com/model:latest`, `helm upgrade model ./helm-chart
  --namespace production`, then `kubectl rollout status deployment/model --timeout=300s`. Confirm context
  with `python identity.py --agent governance-identity-py`. Common failure modes: registry auth errors,
  ImagePullBackOff after `kubectl set image`, Helm chart/values mismatches; check the rollout status first
  and verify the pushed tag matches before retrying. Verify with platform tooling, e.g. `python serve_governance.py
  --port 8080` and `curl http://localhost:8080/governance --data ''{"model": "model.pkl"}''` and `python
  audit.py --model model.pkl --data train.csv --output audit.json` and `python compliance_check.py --model
  model.pkl --rules rules.json`. Report the pushed tag, rollout result, and failed revisions with fixes.'
examples:
- python serve_governance.py --port 8080
- 'curl http://localhost:8080/governance --data ''{"model": "model.pkl"}'''
- python audit.py --model model.pkl --data train.csv --output audit.json
- python compliance_check.py --model model.pkl --rules rules.json
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: governance-identity-py.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Governance deployment expert. Help users deploy Governance ML applications.
  opencode:
    plugin: opencode-governance-identity-py
  generic:
    system_prompt: You are governance-identity-py. Governance deployment agent. Manages Governance ML
      deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
