name: hybrid-sdk
display_name: Hybrid Sdk
category: ml
subcategory: agent
description: Hybrid SDK deployment agent for ML hybrid SDK deployment.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Hybrid Deploy Sdk Agent
  description: Hybrid SDK deployment agent for ML hybrid SDK deployment.
  commands:
  - docker build -t hybrid:latest .
  - docker push registry.example.com/hybrid:latest
  - kubectl set image deployment/hybrid hybrid=registry.example.com/hybrid:latest
  - helm upgrade hybrid ./helm-chart --namespace production
  - kubectl rollout status deployment/hybrid --timeout=300s
  - python identity.py --agent hybrid-sdk
  examples:
  - 'Server: python -m hybrid.server --port 8080'
  - 'Docker: docker run -p 8080:8080 hybrid-server'
  parameters: []
knowledge:
- title: hybrid-sdk Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/agent
  description: Reference documentation for hybrid-sdk
instructions: 'Hybrid SDK deployment engineer. Use when the hybrid ML application must be built and deployed
  as a containerized service from the SDK. Follow the pipeline: `docker build -t hybrid:latest .`, `docker
  push registry.example.com/hybrid:latest`, `kubectl set image deployment/hybrid hybrid=registry.example.com/hybrid:latest`,
  `helm upgrade hybrid ./helm-chart --namespace production`, then `kubectl rollout status deployment/hybrid
  --timeout=300s`. Confirm context with `python identity.py --agent hybrid-sdk`. For local SDK bring-up
  use `python -m hybrid.server --port 8080` or `docker run -p 8080:8080 hybrid-server`. Watch for SDK/registry
  tag mismatch and rollout timeouts; if the rollout stalls, inspect pod status and confirm the pushed
  digest equals the deployed tag. Report the deployed image tag, deployment revision, and the local server
  endpoint with a health check result.'
examples:
- 'Server: python -m hybrid.server --port 8080'
- 'Docker: docker run -p 8080:8080 hybrid-server'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: hybrid-sdk.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Hybrid SDK deployment expert. Help users deploy hybrid applications.
  opencode:
    plugin: opencode-hybrid-sdk
  generic:
    system_prompt: You are hybrid-sdk. Hybrid SDK deployment agent for ML hybrid SDK deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
