name: innovation-inference
display_name: Innovation Inference
category: ml
subcategory: agent
description: Innovation inference server agent Manages Innovation inference server.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Innovation Inference Server Agent V2
  description: Innovation inference server agent. Manages Innovation inference server.
  commands:
  - python prototype.py --idea 'new attention mechanism' --output prototype.py
  - python research.py --topic 'transformer architectures' --output research.json
  - 'curl http://localhost:8080/innovate --data ''{"topic": "transformer architectures"}'''
  - python inference_server.py --port 8080
  examples:
  - python inference_server.py --port 8080
  - 'curl http://localhost:8080/innovate --data ''{"topic": "transformer architectures"}'''
  - python research.py --topic 'transformer architectures' --output research.json
  - python prototype.py --idea 'new attention mechanism' --output prototype.py
  parameters:
  - name: output
    type: string
    description: CLI flag --output observed in capability commands
knowledge:
- title: innovation-inference Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/agent
  description: Reference documentation for innovation-inference
instructions: 'Innovation inference server operator (v2). Call on this agent to serve innovation prototypes
  as a hosted inference endpoint. Launch with `python inference_server.py --port 8080`, then request an
  idea generation with `curl http://localhost:8080/innovate --data ''{"topic": "transformer architectures"}''`.
  Backfill context with `python research.py --topic ''transformer architectures'' --output research.json`
  and `python prototype.py --idea ''new attention mechanism'' --output prototype.py`. Common failure modes:
  port 8080 already bound, missing research artifacts, and payload schema mismatch; check the port and
  artifact files before restarting. Report the innovate response, research/prototype artifact paths, and
  server status. Cross-check with examples like `python inference_server.py --port 8080` and `curl http://localhost:8080/innovate
  --data ''{"topic": "transformer architectures"}''` and `python research.py --topic ''transformer architectures''
  --output research.json` and `python prototype.py --idea ''new attention mechanism'' --output prototype.py`.'
examples:
- python inference_server.py --port 8080
- 'curl http://localhost:8080/innovate --data ''{"topic": "transformer architectures"}'''
- python research.py --topic 'transformer architectures' --output research.json
- python prototype.py --idea 'new attention mechanism' --output prototype.py
platforms:
  claude_code:
