name: lambda-identity-py
display_name: Lambda Identity Py
category: ml
subcategory: agent
description: Lambda deployment agent. Manages Lambda ML deployment.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk
license: MIT
capabilities:
- name: Ml Lambda Deploy Agent
  description: Lambda deployment agent. Manages Lambda ML deployment.
  commands:
  - docker build -t lambda:latest .
  - docker push ghcr.io/lambda:latest
  - kubectl set image deployment/lambda lambda=ghcr.io/lambda:latest
  - helm upgrade lambda ./helm-chart --namespace production
  - kubectl rollout status deployment/lambda --timeout=300s
  - lambda --version
  examples:
  - sam build
  - sam deploy --guided
  - 'aws lambda invoke --function-name my-function --payload ''{"text": "Hello"}'' output.json'
  - curl https://my-api-id.execute-api.us-east-1.amazonaws.com/prod/invoke
  parameters: []
knowledge:
- title: AWS Lambda Documentation
  type: reference
  source: https://docs.aws.amazon.com/lambda/
  description: Official documentation for lambda.
- title: Docker Documentation
  type: reference
  source: https://docs.docker.com/
  description: Official documentation for docker.
- title: kubectl Reference
  type: reference
  source: https://kubernetes.io/docs/reference/kubectl/
  description: Official documentation for kubectl.
instructions: 'Lambda ML deployment specialist. Call on this agent to ship a new version of the lambda
  ML service. Workflow: `docker build -t lambda:latest .`, `docker push ghcr.io/lambda:latest`,
  `kubectl set image deployment/lambda lambda=ghcr.io/lambda:latest`, `helm upgrade lambda
  ./helm-chart --namespace production`, then `kubectl rollout status deployment/lambda --timeout=300s`.
  lambda --version
  auth errors, ImagePullBackOff after `kubectl set image`, Helm chart/values mismatches; check the rollout
  status first and verify the pushed tag matches before retrying. Verify with platform tooling, e.g. `sam
  build` and `sam deploy --guided` and `aws lambda invoke --function-name my-function --payload ''{"text":
  "Hello"}'' output.json` and `curl https://my-api-id.execute-api.us-east-1.amazonaws.com/prod/invoke`.
  Report the pushed tag, rollout result, and failed revisions with fixes.'
examples:
- sam build
- sam deploy --guided
- 'aws lambda invoke --function-name my-function --payload ''{"text": "Hello"}'' output.json'
- curl https://my-api-id.execute-api.us-east-1.amazonaws.com/prod/invoke
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: lambda-identity-py.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Lambda deployment expert. Help users deploy Lambda ML applications.
  opencode:
    plugin: opencode-lambda-identity-py
  generic:
    system_prompt: You are lambda-identity-py. Lambda deployment agent. Manages Lambda ML deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-11-10T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
