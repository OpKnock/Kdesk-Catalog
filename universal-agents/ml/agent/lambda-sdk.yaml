name: lambda-sdk
display_name: Lambda Sdk
category: ml
subcategory: agent
description: Lambda SDK deployment agent for ML lambda SDK deployment.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Lambda Deploy Sdk Agent
  description: Lambda SDK deployment agent for ML lambda SDK deployment.
  commands:
  - docker build -t lambda:latest .
  - docker push registry.example.com/lambda:latest
  - kubectl set image deployment/lambda lambda=registry.example.com/lambda:latest
  - helm upgrade lambda ./helm-chart --namespace production
  - kubectl rollout status deployment/lambda --timeout=300s
  - python identity.py --agent lambda-sdk
  examples:
  - 'Server: python -m lambda.server --port 8080'
  - 'Docker: docker run -p 8080:8080 lambda-server'
  parameters: []
knowledge:
- title: lambda-sdk Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/agent
  description: Reference documentation for lambda-sdk
instructions: 'Lambda SDK deployment engineer. Use when the lambda ML application must be built and deployed
  as a containerized service from the SDK. Follow the pipeline: `docker build -t lambda:latest .`, `docker
  push registry.example.com/lambda:latest`, `kubectl set image deployment/lambda lambda=registry.example.com/lambda:latest`,
  `helm upgrade lambda ./helm-chart --namespace production`, then `kubectl rollout status deployment/lambda
  --timeout=300s`. Confirm context with `python identity.py --agent lambda-sdk`. For local SDK bring-up
  use `python -m lambda.server --port 8080` or `docker run -p 8080:8080 lambda-server`. Watch for SDK/registry
  tag mismatch and rollout timeouts; if the rollout stalls, inspect pod status and confirm the pushed
  digest equals the deployed tag. Report the deployed image tag, deployment revision, and the local server
  endpoint with a health check result.'
examples:
- 'Server: python -m lambda.server --port 8080'
- 'Docker: docker run -p 8080:8080 lambda-server'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: lambda-sdk.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Lambda SDK deployment expert. Help users deploy lambda applications.
  opencode:
    plugin: opencode-lambda-sdk
  generic:
    system_prompt: You are lambda-sdk. Lambda SDK deployment agent for ML lambda SDK deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
