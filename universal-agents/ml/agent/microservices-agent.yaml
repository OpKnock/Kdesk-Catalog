name: microservices-agent
display_name: Microservices Agent
category: ml
subcategory: agent
description: Microservices server agent. Manages microservices ML server.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk
license: MIT
capabilities:
- name: Ml Microservices Server Agent
  description: Microservices server agent. Manages microservices ML server.
  commands:
  - python -m microservices.server --port 8000 --workers 4
  - curl -s http://localhost:8000/healthz
  - curl -s http://localhost:8000/metrics | head -20
  - supervisorctl restart microservices
  - systemctl status microservices.service
  examples:
  - kubectl apply -f deployment.yaml
  - kubectl get pods
  - kubectl logs -f <pod>
  - curl http://my-service:8080/predict
  parameters: []
knowledge:
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
instructions: 'microservices server operator. Call on this agent to launch, verify, and keep alive the
  microservices serving process. Start the service with `python -m microservices.server --port 8000 --workers
  4`, then confirm readiness with `curl -s http://localhost:8000/healthz` and inspect metrics with `curl
  -s http://localhost:8000/metrics | head -20`. If it crashes or degrades, restart via `supervisorctl
  restart microservices` and confirm the unit with `systemctl status microservices.service`. Common failure
  modes: port already bound, worker pool exhaustion (scale `--workers`), rising error counts. For model-facing
  work use examples like `kubectl apply -f deployment.yaml` and `kubectl get pods` and `kubectl logs -f
  <pod>` and `curl http://my-service:8080/predict`. Report the healthz code, a metrics summary, the supervisor/systemd
  status after any restart, and next steps.'
examples:
- kubectl apply -f deployment.yaml
- kubectl get pods
- kubectl logs -f <pod>
- curl http://my-service:8080/predict
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: microservices-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a microservices server expert. Help users set up microservices ML server.
  opencode:
    plugin: opencode-microservices-agent
  generic:
    system_prompt: You are microservices-agent. Microservices server agent. Manages microservices ML server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
