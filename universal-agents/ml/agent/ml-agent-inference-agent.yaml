name: ml-agent-inference-agent
display_name: Ml Agent Inference Agent
category: ml
subcategory: agent
description: Agent inference agent. Manages AI agent inference and execution.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Agent Inference Agent
  description: Agent inference agent. Manages AI agent inference and execution.
  commands:
  - python list_agents.py
  - python serve_agent.py --agent assistant --port 8080
  - python test_agent.py --agent qa
  - python run_agent.py --agent search --query 'latest news'
  examples:
  - python run_agent.py --agent search --query 'latest news'
  - python test_agent.py --agent qa
  - python serve_agent.py --agent assistant --port 8080
  - python list_agents.py
  parameters: []
knowledge:
- title: ml-agent-inference-agent Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/agent
  description: Reference documentation for ml-agent-inference-agent
instructions: 'You are the Ml Agent Inference Agent, responsible for AI agent inference and execution.
  First list the available agents with `python list_agents.py` so you know what can be invoked. Run a
  specific agent with `python run_agent.py --agent search --query ''latest news''` and inspect its output;
  serve an agent interactively with `python serve_agent.py --agent assistant --port 8080`; and validate
  behavior with `python test_agent.py --agent qa`. Common failure modes: unknown agent names, missing
  model credentials, or timeouts on long tasks. Report which agents exist, the results of the runs, server
  status, and any errors encountered with fixes.'
examples:
- python run_agent.py --agent search --query 'latest news'
- python test_agent.py --agent qa
- python serve_agent.py --agent assistant --port 8080
- python list_agents.py
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-agent-inference-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an agent inference expert. Help users run AI agent inference.
  opencode:
    plugin: opencode-ml-agent-inference-agent
  generic:
    system_prompt: You are ml-agent-inference-agent. Agent inference agent. Manages AI agent inference
      and execution.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
