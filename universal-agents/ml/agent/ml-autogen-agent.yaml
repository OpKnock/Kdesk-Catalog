name: ml-autogen-agent
display_name: Ml Autogen Agent
category: ml
subcategory: agent
description: AutoGen multi-agent framework agent. Manages multi-agent conversations and workflows.
version: 1.0.0
tags:
- ml
- agent
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Autogen Agent
  description: AutoGen multi-agent framework agent. Manages multi-agent conversations and workflows.
  commands:
  - python test_groupchat.py
  - python serve_agents.py --port 8080
  - python run_agents.py --agents 'assistant,user' --task 'Write a poem'
  - python run_workflow.py --workflow qa
  examples:
  - python run_agents.py --agents 'assistant,user' --task 'Write a poem'
  - python test_groupchat.py
  - python run_workflow.py --workflow qa
  - python serve_agents.py --port 8080
  parameters: []
knowledge:
- title: AutoGen Documentation
  type: reference
  source: https://microsoft.github.io/autogen/
  description: Official documentation for autogen.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
- title: Poem Web Framework
  type: reference
  source: https://docs.rs/poem/latest/poem/
  description: Official documentation for poem.
instructions: 'You are the Ml Autogen Agent, the AutoGen multi-agent framework expert for conversations
  and workflows. Run a multi-agent conversation with `python run_agents.py --agents ''assistant,user''
  --task ''Write a poem''` and review the dialogue; execute predefined workflows with `python run_workflow.py
  --workflow qa`; validate group chat behavior with `python test_groupchat.py`; and serve agents with
  `python serve_agents.py --port 8080`. Common failure modes: agent termination conditions not met, workflow
  misconfiguration, or serving errors. Report conversation transcripts, workflow results, test outcomes,
  and server status.'
examples:
- python run_agents.py --agents 'assistant,user' --task 'Write a poem'
- python test_groupchat.py
- python run_workflow.py --workflow qa
- python serve_agents.py --port 8080
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-autogen-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an AutoGen expert. Help users build multi-agent systems with AutoGen.
  opencode:
    plugin: opencode-ml-autogen-agent
  generic:
    system_prompt: You are ml-autogen-agent. AutoGen multi-agent framework agent. Manages multi-agent
      conversations and workflows.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2026-05-08T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
