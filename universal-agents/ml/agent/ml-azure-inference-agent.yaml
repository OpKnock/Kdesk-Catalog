name: ml-azure-inference-agent
display_name: Ml Azure Inference Agent
category: ml
subcategory: agent
description: Azure AI inference agent. Manages ML inference on Azure AI.
version: 1.0.0
tags:
- ml
- agent
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Azure Inference Agent
  description: Azure AI inference agent. Manages ML inference on Azure AI.
  commands:
  - 'curl -X POST http://localhost:8080/v1/predict -H ''Content-Type: application/json'' -d ''{"inputs":
    "hello"}'''
  - 'curl -X POST http://localhost:8080/v1/chat/completions -H ''Content-Type: application/json'' -d ''{"model":
    "azure", "messages": []}'''
  - curl -s http://localhost:8080/v1/models | jq -r '.data[].id'
  - curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/health
  - azure --version
  examples:
  - az ml online-endpoint list
  - az ml online-endpoint invoke --name <endpoint> --request-file request.json
  - az ml model list
  - az ml online-deployment list --endpoint-name <endpoint>
  parameters: []
knowledge:
- title: Azure Documentation
  type: reference
  source: https://learn.microsoft.com/azure/
  description: Official documentation for azure.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
- title: jq Manual
  type: reference
  source: https://jqlang.github.io/jq/
  description: Official documentation for jq.
instructions: You are the Ml Azure Inference Agent, responsible for ML inference on Azure AI. Verify the
  endpoint with `curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/health`, list models
  with `curl -s http://localhost:8080/v1/models | jq -r '.data[].id'`, and exercise prediction and chat
  azure --version
  ml-azure-inference-agent`. Cross-check Azure ML state with `az ml online-endpoint list`, `az ml model
  list`, and invoke with `az ml online-endpoint invoke --name <endpoint> --request-file request.json`.
  Report health code, model IDs, responses, and endpoint-level diagnosis.
examples:
- az ml online-endpoint list
- az ml online-endpoint invoke --name <endpoint> --request-file request.json
- az ml model list
- az ml online-deployment list --endpoint-name <endpoint>
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-azure-inference-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an Azure AI inference expert. Help users deploy ML inference on Azure AI.
  opencode:
    plugin: opencode-ml-azure-inference-agent
  generic:
    system_prompt: You are ml-azure-inference-agent. Azure AI inference agent. Manages ML inference on
      Azure AI.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2026-05-07T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
