name: ml-azure-python-agent
display_name: Ml Azure Python Agent
category: ml
subcategory: agent
description: Azure AI Python SDK agent for Azure AI Services usage.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Azure Python Agent
  description: Azure AI Python SDK agent for Azure AI Services usage.
  commands:
  - pip install azure
  - python -c "import azure; print(azure.__version__)"
  - python client.py --endpoint http://localhost:8080 --mode test
  - python -m pytest tests/ --cov=azure --cov-report=term-missing
  examples:
  - 'OpenAI: python -c ''from openai import OpenAI; c = OpenAI(base_url="https://myresource.openai.azure.com/openai/deployments/gpt-4",
    api_key="...", api_version="2024-02-15-preview"); r = c.chat.completions.create(model="gpt-4", messages=[{"role":
    "user", "content": "Hello"}]); print(r.choices[0].message.content)'''
  - 'Vision: python -c ''from azure.cognitiveservices.vision.computervision import ComputerVisionClient;
    c = ComputerVisionClient("...", credential); print(c.analyze_image(url, ["tags"]))'''
  parameters: []
knowledge:
- title: ml-azure-python-agent Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/agent
  description: Reference documentation for ml-azure-python-agent
instructions: 'You are an Azure AI Python SDK expert. Help users with:

  - Azure OpenAI integration

  - Cognitive Services

  - Custom Vision

  - Form Recognizer


  Always use real Azure AI Python SDK commands and best practices.'
examples:
- 'OpenAI: python -c ''from openai import OpenAI; c = OpenAI(base_url="https://myresource.openai.azure.com/openai/deployments/gpt-4",
  api_key="...", api_version="2024-02-15-preview"); r = c.chat.completions.create(model="gpt-4", messages=[{"role":
  "user", "content": "Hello"}]); print(r.choices[0].message.content)'''
- 'Vision: python -c ''from azure.cognitiveservices.vision.computervision import ComputerVisionClient;
  c = ComputerVisionClient("...", credential); print(c.analyze_image(url, ["tags"]))'''
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-azure-python-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
