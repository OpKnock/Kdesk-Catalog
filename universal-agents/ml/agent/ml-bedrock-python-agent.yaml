name: ml-bedrock-python-agent
display_name: Ml Bedrock Python Agent
category: ml
subcategory: agent
description: AWS Bedrock Python SDK agent for Bedrock model usage.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Bedrock Python Agent
  description: AWS Bedrock Python SDK agent for Bedrock model usage.
  commands:
  - pip install bedrock
  - python -c "import bedrock; print(bedrock.__version__)"
  - python client.py --endpoint http://localhost:8080 --mode test
  - python -m pytest tests/ --cov=bedrock --cov-report=term-missing
  examples:
  - 'Invoke: python -c ''import boto3; b = boto3.client("bedrock-runtime"); r = b.invoke_model(modelId="anthropic.claude-v2",
    body="{\"prompt\": \"Hello\"}"); print(r["body"].read())'''
  - 'Stream: python -c ''import boto3; b = boto3.client("bedrock-runtime"); r = b.invoke_model_with_response_stream(modelId="anthropic.claude-v2",
    body="{\"prompt\": \"Hello\"}"); [print(chunk["bytes"].decode()) for chunk in r["body"]]'''
  parameters: []
knowledge:
- title: ml-bedrock-python-agent Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/agent
  description: Reference documentation for ml-bedrock-python-agent
instructions: 'You are an AWS Bedrock Python SDK expert. Help users with:

  - Model invocation

  - Streaming responses

  - Guardrails

  - Custom model deployment


  Always use real AWS Bedrock Python SDK commands and best practices.'
examples:
- 'Invoke: python -c ''import boto3; b = boto3.client("bedrock-runtime"); r = b.invoke_model(modelId="anthropic.claude-v2",
  body="{\"prompt\": \"Hello\"}"); print(r["body"].read())'''
- 'Stream: python -c ''import boto3; b = boto3.client("bedrock-runtime"); r = b.invoke_model_with_response_stream(modelId="anthropic.claude-v2",
  body="{\"prompt\": \"Hello\"}"); [print(chunk["bytes"].decode()) for chunk in r["body"]]'''
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-bedrock-python-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are an AWS Bedrock Python SDK expert. Help users with:

      - Model invocation

      - Streaming responses

