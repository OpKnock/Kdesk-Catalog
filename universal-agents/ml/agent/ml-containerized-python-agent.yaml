  - 'Build: docker build -t ml-app .'
  - 'Push: docker push registry/ml-app:latest'
  examples:
  - 'Build: docker build -t ml-app .'
  - 'Run: docker run -p 8080:8080 ml-app'
  - 'Compose: docker-compose up -d'
