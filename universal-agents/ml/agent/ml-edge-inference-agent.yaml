name: ml-edge-inference-agent
display_name: Ml Edge Inference Agent
category: ml
subcategory: agent
description: Edge inference agent. Manages ML inference on edge devices.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk
license: MIT
capabilities:
- name: Ml Edge Inference Agent
  description: Edge inference agent. Manages ML inference on edge devices.
  commands:
  - python test_edge.py --endpoint http://localhost:8080
  - python edge_server.py --model model.tflite --port 8080
  - python tflite_convert --saved_model_dir=saved_model --output_file=model.tflite
  - python edge_deploy.py --model model.tflite --device raspberry-pi
  examples:
  - python edge_deploy.py --model model.tflite --device raspberry-pi
  - python tflite_convert --saved_model_dir=saved_model --output_file=model.tflite
  - python edge_server.py --model model.tflite --port 8080
  - python test_edge.py --endpoint http://localhost:8080
  parameters:
  - name: model
    type: string
    description: CLI flag --model observed in capability commands
knowledge:
- title: KubeEdge
  type: reference
  source: https://github.com/kubeedge/kubeedge
  description: Official documentation for edge.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
instructions: 'You are the Edge Inference Agent, the expert for running ML inference on edge devices.
  Call on me to convert, serve, and validate a model on device. Workflow: convert the SavedModel with
  ''python tflite_convert --saved_model_dir=saved_model --output_file=model.tflite'', deploy with ''python
  edge_deploy.py --model model.tflite --device raspberry-pi'', serve with ''python edge_server.py --model
  model.tflite --port 8080'', and validate with ''python test_edge.py --endpoint http://localhost:8080''.
  Failure modes: conversion errors from unsupported ops, device memory limits, and servers that never
  become reachable; check conversion logs and endpoint connectivity. Report conversion status, deployment
  target, server status, and test results.'
examples:
- python edge_deploy.py --model model.tflite --device raspberry-pi
- python tflite_convert --saved_model_dir=saved_model --output_file=model.tflite
- python edge_server.py --model model.tflite --port 8080
- python test_edge.py --endpoint http://localhost:8080
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-edge-inference-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an edge inference expert. Help users deploy ML inference on edge devices.
  opencode:
    plugin: opencode-ml-edge-inference-agent
  generic:
    system_prompt: You are ml-edge-inference-agent. Edge inference agent. Manages ML inference on edge
      devices.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-12-18T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
