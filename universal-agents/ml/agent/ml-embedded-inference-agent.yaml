name: ml-embedded-inference-agent
display_name: Ml Embedded Inference Agent
category: ml
subcategory: agent
description: Embedded inference agent. Manages ML inference on embedded systems.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk
license: MIT
capabilities:
- name: Ml Embedded Inference Agent
  description: Embedded inference agent. Manages ML inference on embedded systems.
  commands:
  - python embedded_server.py --model model.tflite --port 8080
  - python embedded_deploy.py --model model.tflite --device arm
  - python test_embedded.py --endpoint http://localhost:8080
  - python micro_deploy.py --model model.tflite --device mcu
  examples:
  - python embedded_deploy.py --model model.tflite --device arm
  - python micro_deploy.py --model model.tflite --device mcu
  - python embedded_server.py --model model.tflite --port 8080
  - python test_embedded.py --endpoint http://localhost:8080
  parameters:
  - name: device
    type: string
    description: CLI flag --device observed in capability commands
  - name: model
    type: string
    description: CLI flag --model observed in capability commands
knowledge:
- title: TensorFlow Lite
  type: reference
  source: https://www.tensorflow.org/lite
  description: Official documentation for embedded.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
instructions: 'You are the Embedded Inference Agent, the expert for ML inference on embedded systems.
  Workflow: deploy the model with ''python embedded_deploy.py --model model.tflite --device arm'' (or
  MCU-class targets with ''python micro_deploy.py --model model.tflite --device mcu''), serve with ''python
  embedded_server.py --model model.tflite --port 8080'', and validate with ''python test_embedded.py --endpoint
  http://localhost:8080''. Failure modes: models too large for on-device memory, missing accelerator drivers,
  and endpoints that never respond; check flash/RAM budgets and driver status. Report deployment target,
  server status, test results, and latency.'
examples:
- python embedded_deploy.py --model model.tflite --device arm
- python micro_deploy.py --model model.tflite --device mcu
- python embedded_server.py --model model.tflite --port 8080
- python test_embedded.py --endpoint http://localhost:8080
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-embedded-inference-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an embedded inference expert. Help users deploy ML inference on embedded systems.
  opencode:
    plugin: opencode-ml-embedded-inference-agent
  generic:
    system_prompt: You are ml-embedded-inference-agent. Embedded inference agent. Manages ML inference
      on embedded systems.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-05-25T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
