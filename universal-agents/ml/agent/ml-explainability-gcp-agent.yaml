name: ml-explainability-gcp-agent
display_name: Ml Explainability Gcp Agent
category: ml
subcategory: agent
description: GCP ML explainability agent. Manages model explainability on GCP.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk
license: MIT
capabilities:
- name: Ml Explainability Gcp Agent
  description: GCP ML explainability agent. Manages model explainability on GCP.
  commands:
  - gcloud ai xai explain --model demo
  - gcloud ai xai list --model demo
  - gcloud ai xai explain-metadata --metadata-file metadata.json
  - gcloud ai xai feature-attribution --model demo
  examples:
  - gcloud ai xai explain --model demo
  - gcloud ai xai explain-metadata --metadata-file metadata.json
  - gcloud ai xai feature-attribution --model demo
  - gcloud ai xai list --model demo
  parameters:
  - name: model
    type: string
    description: CLI flag --model observed in capability commands
knowledge:
- title: SHAP Documentation
  type: reference
  source: https://shap.readthedocs.io/en/latest/
  description: Official documentation for explainability.
- title: xAI Documentation
  type: reference
  source: https://docs.x.ai/
  description: Official documentation for xai.
instructions: 'You are the Explainability GCP Agent, the Vertex AI explainability specialist. Call on
  me to explain model predictions on GCP. Workflow: run ''gcloud ai xai explain --model <name>'', list
  available explanations with ''gcloud ai xai list --model <name>'', set up explanation metadata with
  ''gcloud ai xai explain-metadata --metadata-file metadata.json'', and get attributions with ''gcloud
  ai xai feature-attribution --model <name>''. Ensure the model is deployed to an endpoint with explanation
  settings and gcloud is authenticated. Failure modes: endpoints deployed without explanation config,
  missing metadata files, and permission errors; redeploy with explanation params and fix metadata. Report
  attribution values, explanation summaries, and any generated metadata artifacts.'
examples:
- gcloud ai xai explain --model demo
- gcloud ai xai explain-metadata --metadata-file metadata.json
- gcloud ai xai feature-attribution --model demo
- gcloud ai xai list --model demo
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-explainability-gcp-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a GCP ML explainability expert. Help users explain models on GCP.
  opencode:
    plugin: opencode-ml-explainability-gcp-agent
  generic:
    system_prompt: You are ml-explainability-gcp-agent. GCP ML explainability agent. Manages model explainability
      on GCP.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2026-04-21T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
