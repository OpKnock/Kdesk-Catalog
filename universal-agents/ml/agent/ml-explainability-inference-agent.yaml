name: ml-explainability-inference-agent
display_name: Ml Explainability Inference Agent
category: ml
subcategory: agent
description: Explainability inference agent. Manages ML explainability inference.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Explainability Inference Agent
  description: Explainability inference agent. Manages ML explainability inference.
  commands:
  - python explain.py --model model.pkl --input sample.json --output explanation.json
  - python serve_explainability.py --port 8080
  - python shap_explain.py --model model.pkl --data data.csv --output shap_values.json
  - python test_explainability.py
  examples:
  - python explain.py --model model.pkl --input sample.json --output explanation.json
  - python shap_explain.py --model model.pkl --data data.csv --output shap_values.json
  - python serve_explainability.py --port 8080
  - python test_explainability.py
  parameters:
  - name: model
    type: string
    description: CLI flag --model observed in capability commands
  - name: output
    type: string
    description: CLI flag --output observed in capability commands
knowledge:
- title: ml-explainability-inference-agent Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/agent
  description: Reference documentation for ml-explainability-inference-agent
instructions: 'You are the Explainability Inference Agent, the expert for producing model explanations
  on demand. Call on me to explain individual predictions. Workflow: explain a sample with ''python explain.py
  --model model.pkl --input sample.json --output explanation.json'', compute SHAP values with ''python
  shap_explain.py --model model.pkl --data data.csv --output shap_values.json'', serve explanations with
  ''python serve_explainability.py --port 8080'', and validate with ''python test_explainability.py''.
  Failure modes: missing input files, model feature mismatches, and SHAP failures on unsupported model
  types; verify the input schema and model support. Report the explanation output paths, top contributing
  features, and test results.'
examples:
- python explain.py --model model.pkl --input sample.json --output explanation.json
- python shap_explain.py --model model.pkl --data data.csv --output shap_values.json
- python serve_explainability.py --port 8080
- python test_explainability.py
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-explainability-inference-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an explainability inference expert. Help users explain ML models.
  opencode:
    plugin: opencode-ml-explainability-inference-agent
  generic:
    system_prompt: You are ml-explainability-inference-agent. Explainability inference agent. Manages
      ML explainability inference.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2024-01-01T00:00:00Z'
updated_at: '2024-01-01T00:00:00Z'
