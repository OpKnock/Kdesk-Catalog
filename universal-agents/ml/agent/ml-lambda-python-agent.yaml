name: ml-lambda-python-agent
display_name: Ml Lambda Python Agent
category: ml
subcategory: agent
description: it handling AWS Lambda deployment.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk
license: MIT
capabilities:
- name: Ml Lambda Python Agent
  description: ML Lambda Python agent for AWS Lambda deployment.
  commands:
  - 'Invoke: aws lambda invoke --function-name ml-inference --payload ''{"input": [1,2,3]}'' output.json'
  - 'Deploy: aws lambda create-function --function-name ml-inference --runtime python3.9 --handler handle'
  - 'Update: aws lambda update-function-code --function-name ml-inference --zip-file fileb://deploy.zip'
  - 'Layers: aws lambda publish-layer-version --layer-name ml-deps --zip-file fileb://layers.zip'
  examples:
  - 'Deploy: aws lambda create-function --function-name ml-inference --runtime python3.9 --handler handler.predict
    --zip-file fileb://deploy.zip'
  - 'Invoke: aws lambda invoke --function-name ml-inference --payload ''{"input": [1,2,3]}'' output.json'
  - 'Layers: aws lambda publish-layer-version --layer-name ml-deps --zip-file fileb://layers.zip'
  - 'Update: aws lambda update-function-code --function-name ml-inference --zip-file fileb://deploy.zip'
  parameters:
  - name: function-name
    type: string
    description: CLI flag --function-name observed in capability commands
  - name: zip-file
    type: string
    description: CLI flag --zip-file observed in capability commands
knowledge:
- title: AWS Lambda Documentation
  type: reference
  source: https://docs.aws.amazon.com/lambda/
  description: Official documentation for lambda.
- title: AWS Documentation
  type: reference
  source: https://docs.aws.amazon.com/
  description: Official documentation for aws.
- title: TensorFlow Serving
  type: reference
  source: https://www.tensorflow.org/serving
  description: Official documentation for inference.
instructions: 'You are a Python ML Lambda expert. Help users with:

  - Lambda function creation

  - Layer management

  - Cold start optimization

  - API Gateway integration


  Always use real Python Lambda tools and best practices.'
examples:
- 'Deploy: aws lambda create-function --function-name ml-inference --runtime python3.9 --handler handler.predict
  --zip-file fileb://deploy.zip'
- 'Invoke: aws lambda invoke --function-name ml-inference --payload ''{"input": [1,2,3]}'' output.json'
- 'Layers: aws lambda publish-layer-version --layer-name ml-deps --zip-file fileb://layers.zip'
- 'Update: aws lambda update-function-code --function-name ml-inference --zip-file fileb://deploy.zip'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-lambda-python-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are a Python ML Lambda expert. Help users with:

      - Lambda function creation

      - Layer management

      - Cold start optimization

      - API Gateway integration


      Always use real Python Lambda tools and best practices.'
  opencode:
    plugin: opencode-ml-lambda-python-agent
  generic:
    system_prompt: You are ml-lambda-python-agent. ML Lambda Python agent for AWS Lambda deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
