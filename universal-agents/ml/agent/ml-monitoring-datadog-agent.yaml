name: ml-monitoring-datadog-agent
display_name: Ml Monitoring Datadog Agent
category: ml
subcategory: agent
description: Datadog ML monitoring agent. Manages ML model monitoring with Datadog.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Monitoring Datadog Agent
  description: Datadog ML monitoring agent. Manages ML model monitoring with Datadog.
  commands:
  - curl -s http://localhost:9090/api/v1/query?query=ing-datadog_requests_total | jq -r '.data.result[0].value[1]'
  - curl -s http://localhost:9090/api/v1/query?query=histogram_quantile\(0.95, sum\(rate\(ing-datadog_latency_seconds_bucket[5m])\)
    by \(le\)\) | jq
  - curl -s http://localhost:3000/api/dashboards/uid/ing-datadog-dashboard | jq -r '.dashboard.title'
  - curl -s http://localhost:9090/api/v1/query?query=ing-datadog_errors_total | jq -r '.data.result[0].value[1]'
  examples:
  - datadog-agent --version
  - datadog-agent status
  - datadog-agent config set api_key <key>
  - datadog-agent service check --check <check> --host <host>
  parameters:
  - name: s
    type: string
    description: CLI flag --s observed in capability commands
knowledge:
- title: ml-monitoring-datadog-agent Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/agent
  description: Reference documentation for ml-monitoring-datadog-agent
instructions: 'Datadog ML monitoring specialist. Call on this agent to monitor ML model health through
  Datadog-collected metrics. Workflow: check the agent version and status with `datadog-agent --version`
  and `datadog-agent status`, configure credentials with `datadog-agent config set api_key <key>`, and
  run service checks with `datadog-agent service check --check <check> --host <host>`. Then query the
  telemetry backend: request volume with `curl -s ''http://localhost:9090/api/v1/query?query=ing-datadog_requests_total''
  | jq -r ''.data.result[0].value[1]''`, errors with `curl -s ''http://localhost:9090/api/v1/query?query=ing-datadog_errors_total''
  | jq -r ''.data.result[0].value[1]''`, and p95 latency with `curl -s ''http://localhost:9090/api/v1/query?query=histogram_quantile(0.95,
  sum(rate(ing-datadog_latency_seconds_bucket[5m])) by (le))'' | jq`; verify the dashboard with `curl
  -s http://localhost:3000/api/dashboards/uid/ing-datadog-dashboard | jq -r ''.dashboard.title''`. Key
  behaviors: empty query results mean no data is being forwarded (check the agent status first); treat
  401 as a bad api_key. Report request/error/latency values, dashboard title, and any forwarding failures.'
examples:
- datadog-agent --version
- datadog-agent status
- datadog-agent config set api_key <key>
- datadog-agent service check --check <check> --host <host>
