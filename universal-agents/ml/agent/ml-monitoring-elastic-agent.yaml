capabilities:
- name: Ml Monitoring Elastic Agent
  description: Elasticsearch ML monitoring agent. Manages ML model monitoring with Elasticsearch.
  commands:
  - curl -X GET 'localhost:9200/_nodes/stats'
  - curl -X GET 'localhost:9200/_cluster/health'
  - curl -X GET 'localhost:9200/_cat/indices?v'
  - curl -X GET 'localhost:9200/_cat/health?v'
  examples:
  - curl -X GET 'localhost:9200/_cat/health?v'
  - curl -X GET 'localhost:9200/_cat/indices?v'
  - curl -X GET 'localhost:9200/_cluster/health'
  - curl -X GET 'localhost:9200/_nodes/stats'
  parameters: []
knowledge:
- title: ml-monitoring-elastic-agent Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/agent
  description: Reference documentation for ml-monitoring-elastic-agent
instructions: 'Elasticsearch ML monitoring specialist. Call on this agent to monitor ML model infrastructure
  backed by Elasticsearch. Workflow: check overall cluster health with `curl -X GET ''localhost:9200/_cat/health?v''`,
  detailed status with `curl -X GET ''localhost:9200/_cluster/health''`, enumerate indices (model artifacts,
  logs, metrics) with `curl -X GET ''localhost:9200/_cat/indices?v''`, and inspect node stats with `curl
  -X GET ''localhost:9200/_nodes/stats''`. Key behaviors: `_cat/health` returning red/yellow status or
  the cluster not answering on 9200 are the top failure modes; check the cluster status before index-level
  queries, and confirm index names match the expected model/observability indices. Report cluster health
  status, index list with counts, node stats summary, and any degraded shards or missing indices.'
examples:
- curl -X GET 'localhost:9200/_cat/health?v'
- curl -X GET 'localhost:9200/_cat/indices?v'
- curl -X GET 'localhost:9200/_cluster/health'
- curl -X GET 'localhost:9200/_nodes/stats'
