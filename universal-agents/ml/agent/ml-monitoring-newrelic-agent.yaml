name: ml-monitoring-newrelic-agent
display_name: Ml Monitoring Newrelic Agent
category: ml
subcategory: agent
description: New Relic ML monitoring agent. Manages ML model monitoring with New Relic.
version: 1.0.0
tags:
- ml
- agent
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Monitoring Newrelic Agent
  description: New Relic ML monitoring agent. Manages ML model monitoring with New Relic.
  commands:
  - newrelic-agent service check --check demo-check --host localhost
  - newrelic-agent status
  - newrelic-agent config set api_key demo-key
  - newrelic-agent --version
  examples:
  - newrelic-agent --version
  - newrelic-agent status
  - newrelic-agent config set api_key demo-key
  - newrelic-agent service check --check demo-check --host localhost
  parameters: []
knowledge:
- title: New Relic Documentation
  type: reference
  source: https://docs.newrelic.com/
  description: Official documentation for newrelic.
instructions: 'New Relic ML monitoring specialist. Call on this agent to monitor ML models through New
  Relic instrumentation. Workflow: verify the tool with `newrelic-agent --version`, inspect agent state
  with `newrelic-agent status`, set credentials with `newrelic-agent config set api_key <key>`, and run
  targeted service checks with `newrelic-agent service check --check <check> --host <host>`. Key behaviors:
  an unset or invalid api_key is the dominant failure mode (visible in `newrelic-agent status`); confirm
  the check name and host are correct before interpreting failures, and ensure the service is up on the
  target host. Report agent version/status, the service check result per host, and configuration changes
  made.'
examples:
- newrelic-agent --version
- newrelic-agent status
- newrelic-agent config set api_key demo-key
- newrelic-agent service check --check demo-check --host localhost
