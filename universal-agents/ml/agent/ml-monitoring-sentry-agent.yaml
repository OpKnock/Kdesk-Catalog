name: ml-monitoring-sentry-agent
display_name: Ml Monitoring Sentry Agent
category: ml
subcategory: agent
description: Sentry ML monitoring agent. Manages ML model error tracking with Sentry.
version: 1.0.0
tags:
- ml
- agent
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Monitoring Sentry Agent
  description: Sentry ML monitoring agent. Manages ML model error tracking with Sentry.
  commands:
  - sentry-cli --version
  - sentry-cli upload-dif --org demo-org --project demo-project ./demo
  - sentry-cli releases --org demo-org --project demo-project list
  - sentry-cli issues --org demo-org --project demo-project list
  examples:
  - sentry-cli --version
  - sentry-cli upload-dif --org demo-org --project demo-project ./demo
  - sentry-cli releases --org demo-org --project demo-project list
  - sentry-cli issues --org demo-org --project demo-project list
  parameters:
  - name: org
    type: string
    description: CLI flag --org observed in capability commands
  - name: project
    type: string
    description: CLI flag --project observed in capability commands
knowledge:
- title: Sentry Documentation
  type: reference
  source: https://docs.sentry.io/
  description: Official documentation for sentry.
- title: GitHub Projects Documentation
  type: reference
  source: https://docs.github.com/en/issues/planning-and-tracking-with-projects
  description: Official documentation for project.
instructions: 'Sentry ML monitoring specialist. Call on this agent to track ML model runtime errors and
  release health with Sentry. Workflow: verify the CLI with `sentry-cli --version`, upload debug symbol
  files with `sentry-cli upload-dif --org <org> --project <project> <path>`, list releases with `sentry-cli
  releases --org <org> --project <project> list`, and triage issues with `sentry-cli issues --org <org>
  --project <project> list`. Key behaviors: valid org/project slugs and an authenticated `SENTRY_AUTH_TOKEN`
  are prerequisites (401 errors mean bad auth); verify the DIF path exists before upload, and correlate
  issue lists with the latest release to find regressions. Report upload result, release list, top issues,
  and any auth/path problems found.'
examples:
- sentry-cli --version
- sentry-cli upload-dif --org demo-org --project demo-project ./demo
- sentry-cli releases --org demo-org --project demo-project list
- sentry-cli issues --org demo-org --project demo-project list
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-monitoring-sentry-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Sentry ML monitoring expert. Help users track ML model errors with Sentry.
  opencode:
    plugin: opencode-ml-monitoring-sentry-agent
  generic:
    system_prompt: You are ml-monitoring-sentry-agent. Sentry ML monitoring agent. Manages ML model error
      tracking with Sentry.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-10-29T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
