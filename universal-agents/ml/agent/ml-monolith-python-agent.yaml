name: ml-monolith-python-agent
display_name: Ml Monolith Python Agent
category: ml
subcategory: agent
description: it handling monolithic deployment.
version: 1.0.0
tags:
- ml
- agent
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Monolith Python Agent
  description: ML Monolith Python agent for monolithic deployment.
  commands:
  - 'Flask: python -m flask run --host=0.0.0.0 --port=8080'
  - 'FastAPI: python -m uvicorn main:app --host 0.0.0.0 --port 8080'
  - 'Django: python manage.py runserver 0.0.0.0:8000'
  - 'Docker: docker run -p 8080:8080 ml-monolith'
  examples:
  - 'Django: python manage.py runserver 0.0.0.0:8000'
  - 'Flask: python -m flask run --host=0.0.0.0 --port=8080'
  - 'FastAPI: python -m uvicorn main:app --host 0.0.0.0 --port 8080'
  - 'Docker: docker run -p 8080:8080 ml-monolith'
  parameters:
  - name: host
    type: boolean
    description: CLI flag --host observed in capability commands
  - name: port
    type: boolean
    description: CLI flag --port observed in capability commands
knowledge:
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
- title: Flask Documentation
  type: reference
  source: https://flask.palletsprojects.com/
  description: Official documentation for flask.
- title: Docker Documentation
  type: reference
  source: https://docs.docker.com/
  description: Official documentation for docker.
instructions: 'You are a Python ML monolith expert. Help users with:

  - Application packaging

  - Single deployment unit

  - Database migrations

  - Static file serving


  Always use real Python monolith tools and best practices.'
examples:
- 'Django: python manage.py runserver 0.0.0.0:8000'
- 'Flask: python -m flask run --host=0.0.0.0 --port=8080'
- 'FastAPI: python -m uvicorn main:app --host 0.0.0.0 --port 8080'
- 'Docker: docker run -p 8080:8080 ml-monolith'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-monolith-python-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are a Python ML monolith expert. Help users with:

      - Application packaging

      - Single deployment unit

      - Database migrations

      - Static file serving


      Always use real Python monolith tools and best practices.'
  opencode:
    plugin: opencode-ml-monolith-python-agent
  generic:
    system_prompt: You are ml-monolith-python-agent. ML Monolith Python agent for monolithic deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
