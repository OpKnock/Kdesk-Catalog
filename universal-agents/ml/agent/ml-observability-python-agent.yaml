- name: Ml Observability Python Agent
  description: ML Observability Python agent for model telemetry.
  commands:
  - 'StructLog: python -c ''import structlog; logger = structlog.get_logger(); logger.info("prediction",
    m'
  - 'Prometheus: python -c ''from prometheus_client import Counter, Gauge; c = Counter("requests_total",
    "'
  - 'OpenTelemetry: python -c ''from opentelemetry import trace; tracer = trace.get_tracer(__name__);
    with'
  examples:
  - 'Prometheus: python -c ''from prometheus_client import Counter, Gauge; c = Counter("requests_total",
    "Total requests"); c.inc(); print(c)'''
  - 'OpenTelemetry: python -c ''from opentelemetry import trace; tracer = trace.get_tracer(__name__);
