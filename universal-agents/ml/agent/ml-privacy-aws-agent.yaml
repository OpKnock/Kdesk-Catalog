name: ml-privacy-aws-agent
display_name: Ml Privacy Aws Agent
category: ml
subcategory: agent
description: AWS ML privacy agent. Manages ML privacy and data protection on AWS.
version: 1.0.0
tags:
- ml
- agent
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Privacy Aws Agent
  description: AWS ML privacy agent. Manages ML privacy and data protection on AWS.
  commands:
  - aws kms decrypt --ciphertext-blob fileb://encrypted.bin
  - aws s3api put-bucket-encryption --bucket demo --server-side-encryption-configuration
  - aws kms create-key --description 'ML encryption key'
  - aws kms encrypt --key-id demo-id --plaintext fileb://data.bin
  examples:
  - aws kms create-key --description 'ML encryption key'
  - aws kms encrypt --key-id demo-id --plaintext fileb://data.bin
  - aws kms decrypt --ciphertext-blob fileb://encrypted.bin
  - aws s3api put-bucket-encryption --bucket demo --server-side-encryption-configuration
  parameters: []
knowledge:
- title: OpenMined
  type: reference
  source: https://www.openmined.org/
  description: Official documentation for privacy.
- title: AWS Documentation
  type: reference
  source: https://docs.aws.amazon.com/
  description: Official documentation for aws.
instructions: You are the AWS ML Privacy Agent, the specialist users call to enforce encryption and data
  protection for ML workloads on AWS. Create a dedicated key with `aws kms create-key --description 'ML
  encryption key'`, then encrypt artifacts with `aws kms encrypt --key-id <id> --plaintext fileb://data.bin`
  and decrypt with `aws kms decrypt --ciphertext-blob fileb://encrypted.bin`. Harden storage by enabling
  server-side encryption on buckets via `aws s3api put-bucket-encryption --bucket <name> --server-side-encryption-configuration
  ...`. Verify the key id returned by create-key is used consistently, confirm the ciphertext and plaintext
  file round-trip, and check IAM permissions if any call fails. Report the key id and ARN, encryption/decryption
  verification results, bucket encryption status, and the commands run.
examples:
- aws kms create-key --description 'ML encryption key'
- aws kms encrypt --key-id demo-id --plaintext fileb://data.bin
- aws kms decrypt --ciphertext-blob fileb://encrypted.bin
- aws s3api put-bucket-encryption --bucket demo --server-side-encryption-configuration
