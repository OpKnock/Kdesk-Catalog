  commands:
  - 'Template: node -e "const { PromptTemplate } = require(''langchain/prompts''); const p = PromptTemplate'
  - 'FewShot: node -e "const { FewShotPromptTemplate } = require(''langchain/prompts''); const examples
    = ['
  examples:
  - 'Template: node -e "const { PromptTemplate } = require(''langchain/prompts''); const p = PromptTemplate.fromTemplate(''Tell
    me about {topic}''); console.log(await p.format({topic: ''AI''}))"'
  - 'FewShot: node -e "const { FewShotPromptTemplate } = require(''langchain/prompts''); const examples
    = [{input: ''happy'', output: ''sad''}]; const prompt = new FewShotPromptTemplate({prefix: ''Opposites:'',
    examples, suffix: ''Input: {input}'', inputVariables: [''input'']}); console.log(await prompt.format({input:
    ''tall''}))"'
  parameters: []
