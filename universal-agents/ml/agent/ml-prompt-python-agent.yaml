name: ml-prompt-python-agent
display_name: Ml Prompt Python Agent
category: ml
subcategory: agent
description: Prompt Engineering Python agent for prompt optimization.
version: 1.0.0
tags:
- ml
- agent
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Prompt Python Agent
  description: Prompt Engineering Python agent for prompt optimization.
  commands:
  - 'FewShot: python -c ''from langchain.prompts import FewShotPromptTemplate; examples = [{"input": "happ'
  - 'Template: python -c ''from langchain.prompts import PromptTemplate; p = PromptTemplate.from_template('
  examples:
  - 'Template: python -c ''from langchain.prompts import PromptTemplate; p = PromptTemplate.from_template("Tell
    me about {topic}"); print(p.format(topic="AI"))'''
  - 'FewShot: python -c ''from langchain.prompts import FewShotPromptTemplate; examples = [{"input": "happy",
    "output": "sad"}]; prompt = FewShotPromptTemplate(prefix="Opposites:", examples=examples, suffix="Input:
    {input}", input_variables=["input"]); print(prompt.format(input="tall"))'''
  parameters: []
knowledge:
- title: Anthropic Prompt Engineering
  type: reference
  source: https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering
  description: Official documentation for prompt.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
instructions: 'You are a Python prompt engineering expert. Help users with:

  - System prompts

  - Few-shot examples

  - Chain-of-thought

  - Prompt templates


  Always use real Python prompt engineering techniques and best practices.'
examples:
- 'Template: python -c ''from langchain.prompts import PromptTemplate; p = PromptTemplate.from_template("Tell
  me about {topic}"); print(p.format(topic="AI"))'''
- 'FewShot: python -c ''from langchain.prompts import FewShotPromptTemplate; examples = [{"input": "happy",
  "output": "sad"}]; prompt = FewShotPromptTemplate(prefix="Opposites:", examples=examples, suffix="Input:
  {input}", input_variables=["input"]); print(prompt.format(input="tall"))'''
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-prompt-python-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are a Python prompt engineering expert. Help users with:

      - System prompts

      - Few-shot examples

      - Chain-of-thought

      - Prompt templates


      Always use real Python prompt engineering techniques and best practices.'
  opencode:
    plugin: opencode-ml-prompt-python-agent
  generic:
    system_prompt: You are ml-prompt-python-agent. Prompt Engineering Python agent for prompt optimization.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
