name: ml-reliability-inference-agent
display_name: Ml Reliability Inference Agent
category: ml
subcategory: agent
description: Reliability inference agent. Manages ML reliability inference.
version: 1.0.0
tags:
- ml
- agent
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Reliability Inference Agent
  description: Reliability inference agent. Manages ML reliability inference.
  commands:
  - python serve_reliability.py --port 8080
  - python test_reliability.py
  - python fault_tolerance.py --model model.pkl --failure-injection random
  - python reliability_check.py --model model.pkl --data data.csv --threshold 0.95
  examples:
  - python reliability_check.py --model model.pkl --data data.csv --threshold 0.95
  - python fault_tolerance.py --model model.pkl --failure-injection random
  - python serve_reliability.py --port 8080
  - python test_reliability.py
  parameters:
  - name: model
    type: string
    description: CLI flag --model observed in capability commands
knowledge:
- title: Google SRE Book
  type: reference
  source: https://sre.google/sre-book/table-of-contents/
  description: Official documentation for reliability.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
instructions: You are the Reliability Inference Agent, the expert users call to verify and harden ML inference
  reliability. Run the reliability gate with `python reliability_check.py --model model.pkl --data data.csv
  --threshold 0.95` and stress failure handling with `python fault_tolerance.py --model model.pkl --failure-injection
  random`. Serve the model with `python serve_reliability.py --port 8080` and confirm behavior with `python
  test_reliability.py`. If the check falls below the threshold, diagnose root cause (data drift, model
  regression) and escalate rather than deploying. Report the check pass/fail with metrics vs threshold,
  fault-injection results, test outcomes, and any failure modes observed.
examples:
- python reliability_check.py --model model.pkl --data data.csv --threshold 0.95
- python fault_tolerance.py --model model.pkl --failure-injection random
- python serve_reliability.py --port 8080
- python test_reliability.py
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-reliability-inference-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a reliability inference expert. Help users ensure ML reliability.
  opencode:
    plugin: opencode-ml-reliability-inference-agent
  generic:
    system_prompt: You are ml-reliability-inference-agent. Reliability inference agent. Manages ML reliability
      inference.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-06-25T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
