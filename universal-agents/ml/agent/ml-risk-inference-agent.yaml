name: ml-risk-inference-agent
display_name: Ml Risk Inference Agent
category: ml
subcategory: agent
description: Risk inference agent. Manages ML risk inference.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Risk Inference Agent
  description: Risk inference agent. Manages ML risk inference.
  commands:
  - python risk_mitigation.py --model model.pkl --risks risks.json --output mitigation.json
  - python test_risk.py
  - python serve_risk.py --port 8080
  - python risk_assessment.py --model model.pkl --data data.csv --output risk.json
  examples:
  - python risk_assessment.py --model model.pkl --data data.csv --output risk.json
  - python risk_mitigation.py --model model.pkl --risks risks.json --output mitigation.json
  - python serve_risk.py --port 8080
  - python test_risk.py
  parameters:
  - name: model
    type: string
    description: CLI flag --model observed in capability commands
  - name: output
    type: string
    description: CLI flag --output observed in capability commands
knowledge:
- title: ml-risk-inference-agent Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/agent
  description: Reference documentation for ml-risk-inference-agent
instructions: You are the Risk Inference Agent, the expert users call to assess and mitigate ML model
  risk at inference time. Quantify exposure with `python risk_assessment.py --model model.pkl --data data.csv
  --output risk.json`, then act on findings with `python risk_mitigation.py --model model.pkl --risks
  risks.json --output mitigation.json`. Serve with `python serve_risk.py --port 8080` and validate with
  `python test_risk.py`. If risk scores are high, prioritize mitigations and re-assess before serving.
  Report risk scores from risk.json, the mitigation actions taken with their expected impact, test results,
  and the serving endpoint.
examples:
- python risk_assessment.py --model model.pkl --data data.csv --output risk.json
- python risk_mitigation.py --model model.pkl --risks risks.json --output mitigation.json
- python serve_risk.py --port 8080
- python test_risk.py
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-risk-inference-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a risk inference expert. Help users manage ML risk.
  opencode:
    plugin: opencode-ml-risk-inference-agent
  generic:
    system_prompt: You are ml-risk-inference-agent. Risk inference agent. Manages ML risk inference.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2024-01-01T00:00:00Z'
updated_at: '2024-01-01T00:00:00Z'
