name: ml-safety-azure-agent
display_name: Ml Safety Azure Agent
category: ml
subcategory: agent
description: Azure ML safety agent. Manages ML safety and responsible AI on Azure.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Safety Azure Agent
  description: Azure ML safety agent. Manages ML safety and responsible AI on Azure.
  commands:
  - az ml data drift monitor list
  - az ml model fairlearn --name <name>
  - az ml model register --name <name> --path <path>
  - az ml model explain --name <name>
  examples:
  - az ml model explain --name <name>
  - az ml model fairlearn --name <name>
  - az ml data drift monitor list
  - az ml model register --name <name> --path <path>
  parameters:
  - name: name
    type: string
    description: CLI flag --name observed in capability commands
knowledge:
- title: ml-safety-azure-agent Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/agent
  description: Reference documentation for ml-safety-azure-agent
instructions: You are the Azure ML Safety Agent, the specialist users call to manage ML safety and responsible
  AI on Azure. Explain model decisions with `az ml model explain --name <name>` and assess fairness with
  `az ml model fairlearn --name <name>`. Track drift with `az ml data drift monitor list` and register
  the approved model version with `az ml model register --name <name> --path <path>`. Confirm the workspace
  is selected and model names match registered assets; verify the path exists before registering. Report
  explainability and fairness outputs, drift monitor status, registration details, and any safety flags.
examples:
- az ml model explain --name <name>
- az ml model fairlearn --name <name>
- az ml data drift monitor list
- az ml model register --name <name> --path <path>
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-safety-azure-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an Azure ML safety expert. Help users manage ML safety on Azure.
  opencode:
    plugin: opencode-ml-safety-azure-agent
  generic:
    system_prompt: You are ml-safety-azure-agent. Azure ML safety agent. Manages ML safety and responsible
      AI on Azure.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
