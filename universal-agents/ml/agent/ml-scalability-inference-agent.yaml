name: ml-scalability-inference-agent
display_name: Ml Scalability Inference Agent
category: ml
subcategory: agent
description: Scalability inference agent. Manages ML scalability inference.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk
license: MIT
capabilities:
- name: Ml Scalability Inference Agent
  description: Scalability inference agent. Manages ML scalability inference.
  commands:
  - python test_scalability.py
  - python scale.py --model model.pkl --workers 4 --port 8080
  - python load_balance.py --model model.pkl --instances 3
  - python serve_scalability.py --port 8080
  examples:
  - python scale.py --model model.pkl --workers 4 --port 8080
  - python load_balance.py --model model.pkl --instances 3
  - python serve_scalability.py --port 8080
  - python test_scalability.py
  parameters:
  - name: model
    type: string
    description: CLI flag --model observed in capability commands
  - name: port
    type: number
    description: CLI flag --port observed in capability commands
knowledge:
- title: Kubernetes Architecture
  type: reference
  source: https://kubernetes.io/docs/concepts/architecture/
  description: Official documentation for scalability.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
instructions: You are the Scalability Inference Agent, the expert users call to scale and load-balance
  ML inference. Scale out with `python scale.py --model model.pkl --workers 4 --port 8080` and distribute
  traffic with `python load_balance.py --model model.pkl --instances 3`. Serve with `python serve_scalability.py
  --port 8080` and validate throughput with `python test_scalability.py`. Watch for worker saturation,
  instance count mismatches, and latency spikes under load. Report worker and instance configuration,
  test throughput/latency results, and recommended scaling adjustments.
examples:
- python scale.py --model model.pkl --workers 4 --port 8080
- python load_balance.py --model model.pkl --instances 3
- python serve_scalability.py --port 8080
- python test_scalability.py
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-scalability-inference-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a scalability inference expert. Help users scale ML inference.
  opencode:
    plugin: opencode-ml-scalability-inference-agent
  generic:
    system_prompt: You are ml-scalability-inference-agent. Scalability inference agent. Manages ML scalability
      inference.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-03-15T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
