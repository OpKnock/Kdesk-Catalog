name: ml-scalability-python-agent
display_name: Ml Scalability Python Agent
category: ml
subcategory: agent
description: it handling distributed ML training.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk
license: MIT
capabilities:
- name: Ml Scalability Python Agent
  description: ML Scalability Python agent for distributed ML training.
  commands:
  - 'DDP: python -m torch.distributed.launch --nproc_per_node=4 train.py'
  - 'FSDP: python -m torch.distributed.launch --nproc_per_node=4 train_fsdp.py'
  - 'DeepSpeed: deepspeed --num_gpus=4 train.py --deepspeed ds_config.json'
  - 'Ray: python -c ''import ray; ray.init(); @ray.remote def train(): return 1; print(ray.get(train.remot'
  examples:
  - 'DDP: python -m torch.distributed.launch --nproc_per_node=4 train.py'
  - 'DeepSpeed: deepspeed --num_gpus=4 train.py --deepspeed ds_config.json'
  - 'FSDP: python -m torch.distributed.launch --nproc_per_node=4 train_fsdp.py'
  - 'Ray: python -c ''import ray; ray.init(); @ray.remote def train(): return 1; print(ray.get(train.remote()))'''
  parameters:
  - name: nproc
    type: string
    description: CLI flag --nproc observed in capability commands
knowledge:
- title: Kubernetes Architecture
  type: reference
  source: https://kubernetes.io/docs/concepts/architecture/
  description: Official documentation for scalability.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
- title: DeepSpeed Documentation
  type: reference
  source: https://www.deepspeed.ai/
  description: Official documentation for deepspeed.
instructions: 'You are a Python ML scalability expert. Help users with:

  - Distributed training

  - Multi-GPU training

  - Model parallelism

  - Data parallelism


  Always use real Python scalability tools and best practices.'
examples:
- 'DDP: python -m torch.distributed.launch --nproc_per_node=4 train.py'
- 'DeepSpeed: deepspeed --num_gpus=4 train.py --deepspeed ds_config.json'
- 'FSDP: python -m torch.distributed.launch --nproc_per_node=4 train_fsdp.py'
- 'Ray: python -c ''import ray; ray.init(); @ray.remote def train(): return 1; print(ray.get(train.remote()))'''
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-scalability-python-agent.md
