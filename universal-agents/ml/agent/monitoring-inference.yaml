name: monitoring-inference
display_name: Monitoring Inference
category: ml
subcategory: agent
description: Monitoring inference server agent Manages Monitoring inference server.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk
license: MIT
capabilities:
- name: Ml Monitoring Inference Server Agent V2
  description: Monitoring inference server agent. Manages Monitoring inference server.
  commands:
  - python track_drift.py --reference-data train.csv --current-data current.csv
  - python monitor.py --model model.pkl --data-stream data.json --alert-threshold 0.9
  - python inference_server.py --model model.pkl --port 8080
  - 'curl http://localhost:8080/monitor --data ''{"model": "model.pkl"}'''
  examples:
  - python inference_server.py --model model.pkl --port 8080
  - 'curl http://localhost:8080/monitor --data ''{"model": "model.pkl"}'''
  - python monitor.py --model model.pkl --data-stream data.json --alert-threshold 0.9
  - python track_drift.py --reference-data train.csv --current-data current.csv
  parameters:
  - name: model
    type: string
    description: CLI flag --model observed in capability commands
knowledge:
- title: TensorFlow Serving
  type: reference
  source: https://www.tensorflow.org/serving
  description: Official documentation for inference.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
instructions: 'Monitoring inference server operator (v2). Call on this agent to run the monitoring inference
  server that serves model health checks. Launch with `python inference_server.py --model model.pkl --port
  8080`, then submit a model for inspection with `curl http://localhost:8080/monitor --data ''{"model":
  "model.pkl"}''`. Run drift detection with `python track_drift.py --reference-data train.csv --current-data
  current.csv` and the alert pass with `python monitor.py --model model.pkl --data-stream data.json --alert-threshold
  0.9`. Common failure modes: port 8080 already bound, missing reference/current data files, and unreadable
  model.pkl; check files and port before restarting. Report the monitor endpoint response, drift result,
  alert status, and server state. Cross-check with examples like `python inference_server.py --model model.pkl
  --port 8080` and `curl http://localhost:8080/monitor --data ''{"model": "model.pkl"}''` and `python
  monitor.py --model model.pkl --data-stream data.json --alert-threshold 0.9` and `python track_drift.py
  --reference-data train.csv --current-data current.csv`.'
examples:
- python inference_server.py --model model.pkl --port 8080
- 'curl http://localhost:8080/monitor --data ''{"model": "model.pkl"}'''
- python monitor.py --model model.pkl --data-stream data.json --alert-threshold 0.9
- python track_drift.py --reference-data train.csv --current-data current.csv
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: monitoring-inference.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Monitoring inference server expert. Help users set up Monitoring inference
      server.
  opencode:
    plugin: opencode-monitoring-inference
  generic:
    system_prompt: You are monitoring-inference. Monitoring inference server agent v2. Manages Monitoring
      inference server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
