name: monolith-inference
display_name: Monolith Inference
category: ml
subcategory: agent
description: Monolith inference server agent. Manages monolith ML inference server.
version: 1.0.0
tags:
- ml
- agent
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Monolith Inference Server Agent
  description: Monolith inference server agent. Manages monolith ML inference server.
  commands:
  - 'curl -X POST http://localhost:8080/v1/predict -H ''Content-Type: application/json'' -d ''{"inputs":
    "hello"}'''
  - 'curl -X POST http://localhost:8080/v1/chat/completions -H ''Content-Type: application/json'' -d ''{"model":
    "monolith", "messages": []}'''
  - curl -s http://localhost:8080/v1/models | jq -r '.data[].id'
  - curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/health
  - curl --version
  examples:
  - python app.py --model model.pkl --port 8080
  - 'curl http://localhost:8080/predict --data ''{"text": "Hello"}'''
  - python test_app.py --endpoint http://localhost:8080
  - python app_config.py --model-path /models/model.pkl
  parameters: []
knowledge:
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
- title: jq Manual
  type: reference
  source: https://jqlang.github.io/jq/
  description: Official documentation for jq.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
instructions: 'Monolith inference server expert. Call on this agent to set up and operate the Monolith
  inference server. Verify with `curl -X POST http://localhost:8080/v1/predict -H ''Content-Type: application/json''
  -d ''{"inputs": "hello"}''`, chat completions via `curl -X POST http://localhost:8080/v1/chat/completions
  -H ''Content-Type: application/json'' -d ''{"model": "monolith", "messages": []}''`, list models with
  `curl -s http://localhost:8080/v1/models | jq -r ''.data[].id''`, and probe liveness with `curl -s -o
  curl --version
  --agent monolith-inference`. Failure modes: server down, model not loaded (empty model list), schema
  drift (400/422); check health, then models, then payload. Cross-check with tooling such as `python app.py
  --model model.pkl --port 8080` and `curl http://localhost:8080/predict --data ''{"text": "Hello"}''`
  and `python test_app.py --endpoint http://localhost:8080` and `python app_config.py --model-path /models/model.pkl`.
  Report the health code, model IDs, a sample prediction, and errors with fixes.'
examples:
- python app.py --model model.pkl --port 8080
- 'curl http://localhost:8080/predict --data ''{"text": "Hello"}'''
- python test_app.py --endpoint http://localhost:8080
- python app_config.py --model-path /models/model.pkl
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: monolith-inference.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a monolith inference server expert. Help users set up monolith ML inference
      server.
  opencode:
    plugin: opencode-monolith-inference
  generic:
    system_prompt: You are monolith-inference. Monolith inference server agent. Manages monolith ML inference
      server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-08-18T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
