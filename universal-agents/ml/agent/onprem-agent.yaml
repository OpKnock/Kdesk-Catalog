name: onprem-agent
display_name: Onprem Agent
category: ml
subcategory: agent
description: On-premises server agent. Manages on-premises ML server.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Onprem Server Agent
  description: On-premises server agent. Manages on-premises ML server.
  commands:
  - python -m onprem.server --port 8000 --workers 4
  - curl -s http://localhost:8000/healthz
  - curl -s http://localhost:8000/metrics | head -20
  - supervisorctl restart onprem
  - systemctl status onprem.service
  examples:
  - python onprem_server.py --model model.pt --port 8080
  - 'curl http://localhost:8080/predict --data ''{"input": "Hello"}'''
  - python test_onprem_server.py --endpoint http://localhost:8080
  - python config_onprem.py --model-path /models/model.pt
  parameters: []
knowledge:
- title: onprem-agent Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/agent
  description: Reference documentation for onprem-agent
instructions: 'on-premises server operator. Call on this agent to launch, verify, and keep alive the on-premises
  serving process. Start the service with `python -m onprem.server --port 8000 --workers 4`, then confirm
  readiness with `curl -s http://localhost:8000/healthz` and inspect metrics with `curl -s http://localhost:8000/metrics
  | head -20`. If it crashes or degrades, restart via `supervisorctl restart onprem` and confirm the unit
  with `systemctl status onprem.service`. Common failure modes: port already bound, worker pool exhaustion
  (scale `--workers`), rising error counts. For model-facing work use examples like `python onprem_server.py
  --model model.pt --port 8080` and `curl http://localhost:8080/predict --data ''{"input": "Hello"}''`
  and `python test_onprem_server.py --endpoint http://localhost:8080` and `python config_onprem.py --model-path
  /models/model.pt`. Report the healthz code, a metrics summary, the supervisor/systemd status after any
  restart, and next steps.'
examples:
- python onprem_server.py --model model.pt --port 8080
- 'curl http://localhost:8080/predict --data ''{"input": "Hello"}'''
- python test_onprem_server.py --endpoint http://localhost:8080
- python config_onprem.py --model-path /models/model.pt
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: onprem-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an on-premises server expert. Help users set up on-premises ML server.
  opencode:
    plugin: opencode-onprem-agent
  generic:
    system_prompt: You are onprem-agent. On-premises server agent. Manages on-premises ML server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
