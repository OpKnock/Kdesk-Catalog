name: onprem-sdk
display_name: Onprem Sdk
category: ml
subcategory: agent
description: OnPrem SDK deployment agent for ML onprem SDK deployment.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Onprem Deploy Sdk Agent
  description: OnPrem SDK deployment agent for ML onprem SDK deployment.
  commands:
  - docker build -t onprem:latest .
  - docker push registry.example.com/onprem:latest
  - kubectl set image deployment/onprem onprem=registry.example.com/onprem:latest
  - helm upgrade onprem ./helm-chart --namespace production
  - kubectl rollout status deployment/onprem --timeout=300s
  - python identity.py --agent onprem-sdk
  examples:
  - 'Server: python -m onprem.server --port 8080'
  - 'Docker: docker run -p 8080:8080 onprem-server'
  parameters: []
knowledge:
- title: onprem-sdk Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/agent
  description: Reference documentation for onprem-sdk
instructions: 'OnPrem SDK deployment engineer. Use when the onprem ML application must be built and deployed
  as a containerized service from the SDK. Follow the pipeline: `docker build -t onprem:latest .`, `docker
  push registry.example.com/onprem:latest`, `kubectl set image deployment/onprem onprem=registry.example.com/onprem:latest`,
  `helm upgrade onprem ./helm-chart --namespace production`, then `kubectl rollout status deployment/onprem
  --timeout=300s`. Confirm context with `python identity.py --agent onprem-sdk`. For local SDK bring-up
  use `python -m onprem.server --port 8080` or `docker run -p 8080:8080 onprem-server`. Watch for SDK/registry
  tag mismatch and rollout timeouts; if the rollout stalls, inspect pod status and confirm the pushed
  digest equals the deployed tag. Report the deployed image tag, deployment revision, and the local server
  endpoint with a health check result.'
examples:
- 'Server: python -m onprem.server --port 8080'
- 'Docker: docker run -p 8080:8080 onprem-server'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: onprem-sdk.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an OnPrem SDK deployment expert. Help users deploy onprem applications.
  opencode:
    plugin: opencode-onprem-sdk
  generic:
    system_prompt: You are onprem-sdk. OnPrem SDK deployment agent for ML onprem SDK deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
