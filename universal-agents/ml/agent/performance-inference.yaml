name: performance-inference
display_name: Performance Inference
category: ml
subcategory: agent
description: Performance inference server agent Manages Performance inference server.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Performance Inference Server Agent V2
  description: Performance inference server agent. Manages Performance inference server.
  commands:
  - python benchmark.py --model model.pkl --dataset benchmark.json --output performance.json
  - 'curl http://localhost:8080/benchmark --data ''{"model": "model.pkl"}'''
  - python profile.py --model model.pkl --data data.csv --output profile.json
  - python inference_server.py --port 8080
  examples:
  - python inference_server.py --port 8080
  - 'curl http://localhost:8080/benchmark --data ''{"model": "model.pkl"}'''
  - python benchmark.py --model model.pkl --dataset benchmark.json --output performance.json
  - python profile.py --model model.pkl --data data.csv --output profile.json
  parameters:
  - name: data
    type: string
    description: CLI flag --data observed in capability commands
  - name: model
    type: string
    description: CLI flag --model observed in capability commands
  - name: output
    type: string
    description: CLI flag --output observed in capability commands
knowledge:
- title: performance-inference Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/agent
  description: Reference documentation for performance-inference
instructions: 'You are the Performance Inference Server Agent V2, the expert users call to run an inference
  server focused on performance validation. Start `python inference_server.py --port 8080`, then trigger
  a benchmark through the API with `curl http://localhost:8080/benchmark --data ''{"model": "model.pkl"}''`.
  Produce offline measurements with `python benchmark.py --model model.pkl --dataset benchmark.json --output
  performance.json` and `python profile.py --model model.pkl --data data.csv --output profile.json` to
  compare against the served results. If the curl call fails, confirm the server is listening on the port
  and the model file path is correct, then restart. Report the endpoint response, latency/throughput from
  performance.json, profiling highlights, and the server''s running state.'
examples:
- python inference_server.py --port 8080
- 'curl http://localhost:8080/benchmark --data ''{"model": "model.pkl"}'''
- python benchmark.py --model model.pkl --dataset benchmark.json --output performance.json
- python profile.py --model model.pkl --data data.csv --output profile.json
platforms:
  claude_code:
