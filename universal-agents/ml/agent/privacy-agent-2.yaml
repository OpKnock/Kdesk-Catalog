name: privacy-agent-2
display_name: Privacy Agent 2
category: ml
subcategory: agent
description: Privacy inference server agent. Manages Privacy ML inference server.
version: 1.0.0
tags:
- ml
- agent
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Privacy Inference Server Agent
  description: Privacy inference server agent. Manages Privacy ML inference server.
  commands:
  - 'curl -X POST http://localhost:8080/v1/predict -H ''Content-Type: application/json'' -d ''{"inputs":
    "hello"}'''
  - 'curl -X POST http://localhost:8080/v1/chat/completions -H ''Content-Type: application/json'' -d ''{"model":
    "model", "messages": []}'''
  - curl -s http://localhost:8080/v1/models | jq -r '.data[].id'
  - curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/health
  - privacy --version
  examples:
  - python serve_privacy.py --port 8080
  - 'curl http://localhost:8080/privacy --data ''{"model": "model.pkl"}'''
  - python privacy_check.py --model model.pkl --data data.csv --privacy-budget 1.0
  - python differential_privacy.py --model model.pkl --data data.csv --epsilon 0.1
  parameters: []
knowledge:
- title: OpenMined
  type: reference
  source: https://www.openmined.org/
  description: Official documentation for privacy.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
- title: jq Manual
  type: reference
  source: https://jqlang.github.io/jq/
  description: Official documentation for jq.
instructions: 'You are the Privacy Inference Server Agent, the operator users call to run a privacy-aware
  ML inference server with an OpenAI-compatible API. Launch `python serve_privacy.py --port 8080` and
  verify all endpoints: POST `/v1/predict` with `curl -X POST http://localhost:8080/v1/predict -H ''Content-Type:
  application/json'' -d ''{"inputs": "hello"}''`, POST `/v1/chat/completions` with `{"model": "model",
  "messages": []}`, list models with `curl -s http://localhost:8080/v1/models | jq -r ''.data[].id''`,
  and health with `curl -s -o /dev/null -w ''%{http_code}'' http://localhost:8080/v1/health`; confirm
  privacy --version
  is down. Report health code, model ids, sample responses, and any privacy policy violations observed.'
examples:
- python serve_privacy.py --port 8080
- 'curl http://localhost:8080/privacy --data ''{"model": "model.pkl"}'''
- python privacy_check.py --model model.pkl --data data.csv --privacy-budget 1.0
- python differential_privacy.py --model model.pkl --data data.csv --epsilon 0.1
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: privacy-agent-2.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Privacy inference server expert. Help users set up Privacy ML inference server.
  opencode:
    plugin: opencode-privacy-agent-2
  generic:
    system_prompt: You are privacy-agent-2. Privacy inference server agent. Manages Privacy ML inference
      server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2026-07-17T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
