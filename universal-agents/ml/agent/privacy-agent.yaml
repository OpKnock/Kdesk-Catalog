name: privacy-agent
display_name: Privacy Agent
category: ml
subcategory: agent
description: Privacy SDK deployment agent for ML Privacy SDK deployment.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk
license: MIT
capabilities:
- name: Ml Privacy Deploy Sdk Agent
  description: Privacy SDK deployment agent for ML Privacy SDK deployment.
  commands:
  - docker build -t model:latest .
  - docker push ghcr.io/model:latest
  - kubectl set image deployment/model model=ghcr.io/model:latest
  - helm upgrade model ./helm-chart --namespace production
  - kubectl rollout status deployment/model --timeout=300s
  - privacy --version
  examples:
  - 'Server: python -m privacy.server --port 8080'
  - 'Docker: docker run -p 8080:8080 privacy-server'
  parameters: []
knowledge:
- title: OpenMined
  type: reference
  source: https://www.openmined.org/
  description: Official documentation for privacy.
- title: Docker Documentation
  type: reference
  source: https://docs.docker.com/
  description: Official documentation for docker.
- title: kubectl Reference
  type: reference
  source: https://kubernetes.io/docs/reference/kubectl/
  description: Official documentation for kubectl.
instructions: You are the Privacy Deploy SDK Agent, the specialist users call to package and deploy the
  Privacy SDK application on containers. Build and publish with `docker build -t model:latest .` and `docker
  push ghcr.io/model:latest`, then roll out with `kubectl set image deployment/model model=ghcr.io/model:latest`
  or `helm upgrade model ./helm-chart --namespace production`. Confirm with `kubectl rollout status deployment/model
  privacy --version
  `python -m privacy.server --port 8080` and `docker run -p 8080:8080 privacy-server` work. If the rollout
  fails, check registry credentials and namespace. Report image tag, rollout result, and local verification
  output.
examples:
- 'Server: python -m privacy.server --port 8080'
- 'Docker: docker run -p 8080:8080 privacy-server'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: privacy-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Privacy SDK deployment expert. Help users deploy Privacy applications.
  opencode:
    plugin: opencode-privacy-agent
  generic:
    system_prompt: You are privacy-agent. Privacy SDK deployment agent for ML Privacy SDK deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2026-04-29T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
