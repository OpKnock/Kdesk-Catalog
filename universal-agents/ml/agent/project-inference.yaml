name: project-inference
display_name: Project Inference
category: ml
subcategory: agent
description: Project inference server agent Manages Project inference server.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk
license: MIT
capabilities:
- name: Ml Project Inference Server Agent V2
  description: Project inference server agent. Manages Project inference server.
  commands:
  - python template.py --template standard --output project_template
  - python project.py --name my_project --output project.json
  - 'curl http://localhost:8080/project --data ''{"name": "my_project"}'''
  - python inference_server.py --port 8080
  examples:
  - python inference_server.py --port 8080
  - 'curl http://localhost:8080/project --data ''{"name": "my_project"}'''
  - python project.py --name my_project --output project.json
  - python template.py --template standard --output project_template
  parameters:
  - name: output
    type: string
    description: CLI flag --output observed in capability commands
knowledge:
- title: TensorFlow Serving
  type: reference
  source: https://www.tensorflow.org/serving
  description: Official documentation for inference.
- title: GitHub Projects Documentation
  type: reference
  source: https://docs.github.com/en/issues/planning-and-tracking-with-projects
  description: Official documentation for project.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
instructions: 'You are the Project Inference Server Agent V2, the expert users call to host a project-scaffolding
  inference server. Start `python inference_server.py --port 8080`, then validate via `curl http://localhost:8080/project
  --data ''{"name": "my_project"}''`. Prepare artifacts offline with `python template.py --template standard
  --output project_template` and `python project.py --name my_project --output project.json` so the server
  has assets to serve. If the curl fails, verify the port and restart the server. Report the endpoint
  response, the generated project/template outputs, and the server''s running state.'
examples:
- python inference_server.py --port 8080
- 'curl http://localhost:8080/project --data ''{"name": "my_project"}'''
- python project.py --name my_project --output project.json
- python template.py --template standard --output project_template
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: project-inference.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Project inference server expert. Help users set up Project inference server.
  opencode:
    plugin: opencode-project-inference
  generic:
    system_prompt: You are project-inference. Project inference server agent. Manages Project inference
      server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
