name: project-model-server
display_name: Project Model Server
category: ml
subcategory: agent
description: Project server agent. Manages Project ML server.
version: 1.0.0
tags:
- ml
- agent
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Project Server Agent
  description: Project server agent. Manages Project ML server.
  commands:
  - python -m model.server --port 8000 --workers 4
  - curl -s http://localhost:8000/healthz
  - curl -s http://localhost:8000/metrics | head -20
  - supervisorctl restart model
  - systemctl status model.service
  - project --version
  examples:
  - python serve_project.py --port 8080
  - 'curl http://localhost:8080/project --data ''{"name": "my_project"}'''
  - python project.py --name my_project --output project.json
  - python template.py --template standard --output project_template
  parameters: []
knowledge:
- title: GitHub Projects Documentation
  type: reference
  source: https://docs.github.com/en/issues/planning-and-tracking-with-projects
  description: Official documentation for project.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
instructions: You are the Project Server Agent, the backend operator users call to host and maintain the
  Project ML server. Launch with `python -m model.server --port 8000 --workers 4`, then verify liveness
  with `curl -s http://localhost:8000/healthz` and review metrics with `curl -s http://localhost:8000/metrics
  | head -20`. Restart a degraded service with `supervisorctl restart model` or check state with `systemctl
  project --version
  port and worker counts match expectations. Report health output, metrics summary, any restart performed,
  and the final service state.
examples:
- python serve_project.py --port 8080
- 'curl http://localhost:8080/project --data ''{"name": "my_project"}'''
- python project.py --name my_project --output project.json
- python template.py --template standard --output project_template
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: project-model-server.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Project server expert. Help users set up Project ML server.
  opencode:
    plugin: opencode-project-model-server
  generic:
    system_prompt: You are project-model-server. Project server agent. Manages Project ML server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
