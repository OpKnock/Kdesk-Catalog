name: prompt-agent-2
display_name: Prompt Agent 2
category: ml
subcategory: agent
description: Prompt inference server agent. Manages Prompt ML inference server.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk
license: MIT
capabilities:
- name: Ml Prompt Inference Server Agent
  description: Prompt inference server agent. Manages Prompt ML inference server.
  commands:
  - 'curl -X POST http://localhost:8080/v1/predict -H ''Content-Type: application/json'' -d ''{"inputs":
    "hello"}'''
  - 'curl -X POST http://localhost:8080/v1/chat/completions -H ''Content-Type: application/json'' -d ''{"model":
    "model", "messages": []}'''
  - curl -s http://localhost:8080/v1/models | jq -r '.data[].id'
  - curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/health
  - prompt --version
  examples:
  - python serve_prompt.py --prompt-template template.txt --port 8080
  - 'curl http://localhost:8080/predict --data ''{"prompt": "What is AI?"}'''
  - python test_prompt.py --prompt 'What is AI?' --model gpt-4
  - python optimize_prompt.py --template template.txt --test-data test.json
  parameters: []
knowledge:
- title: Anthropic Prompt Engineering
  type: reference
  source: https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering
  description: Official documentation for prompt.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
- title: jq Manual
  type: reference
  source: https://jqlang.github.io/jq/
  description: Official documentation for jq.
instructions: 'You are the Prompt Inference Server Agent, the operator users call to run a prompt-serving
  ML inference server with an OpenAI-compatible API. Launch `python serve_prompt.py --prompt-template
  template.txt --port 8080` and validate: POST `/v1/predict` with `curl -X POST http://localhost:8080/v1/predict
  -H ''Content-Type: application/json'' -d ''{"inputs": "hello"}''`, POST `/v1/chat/completions` with
  `{"model": "model", "messages": []}`, list models with `curl -s http://localhost:8080/v1/models | jq
  -r ''.data[].id''`, and health with `curl -s -o /dev/null -w ''%{http_code}'' http://localhost:8080/v1/health`;
  prompt --version
  responses, and any errors.'
examples:
- python serve_prompt.py --prompt-template template.txt --port 8080
- 'curl http://localhost:8080/predict --data ''{"prompt": "What is AI?"}'''
- python test_prompt.py --prompt 'What is AI?' --model gpt-4
- python optimize_prompt.py --template template.txt --test-data test.json
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: prompt-agent-2.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Prompt inference server expert. Help users set up Prompt ML inference server.
  opencode:
    plugin: opencode-prompt-agent-2
  generic:
    system_prompt: You are prompt-agent-2. Prompt inference server agent. Manages Prompt ML inference
      server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-02-15T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
