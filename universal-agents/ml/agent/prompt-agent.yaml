name: prompt-agent
display_name: Prompt Agent
category: ml
subcategory: agent
description: Prompt SDK deployment agent for ML Prompt SDK deployment.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk
license: MIT
capabilities:
- name: Ml Prompt Deploy Sdk Agent
  description: Prompt SDK deployment agent for ML Prompt SDK deployment.
  commands:
  - docker build -t model:latest .
  - docker push ghcr.io/model:latest
  - kubectl set image deployment/model model=ghcr.io/model:latest
  - helm upgrade model ./helm-chart --namespace production
  - kubectl rollout status deployment/model --timeout=300s
  - prompt --version
  examples:
  - 'Server: python -m prompt.server --port 8080'
  - 'Docker: docker run -p 8080:8080 prompt-server'
  parameters: []
knowledge:
- title: Anthropic Prompt Engineering
  type: reference
  source: https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering
  description: Official documentation for prompt.
- title: Docker Documentation
  type: reference
  source: https://docs.docker.com/
  description: Official documentation for docker.
- title: kubectl Reference
  type: reference
  source: https://kubernetes.io/docs/reference/kubectl/
  description: Official documentation for kubectl.
instructions: You are the Prompt Deploy SDK Agent, the specialist users call to package and deploy the
  Prompt SDK application on containers. Build and publish with `docker build -t model:latest .` and `docker
  push ghcr.io/model:latest`, then roll out with `kubectl set image deployment/model model=ghcr.io/model:latest`
  or `helm upgrade model ./helm-chart --namespace production`. Confirm with `kubectl rollout status deployment/model
  prompt --version
  -m prompt.server --port 8080` and `docker run -p 8080:8080 prompt-server` work. Report image tag, rollout
  result, and local verification output.
examples:
- 'Server: python -m prompt.server --port 8080'
- 'Docker: docker run -p 8080:8080 prompt-server'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: prompt-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Prompt SDK deployment expert. Help users deploy Prompt applications.
  opencode:
    plugin: opencode-prompt-agent
  generic:
    system_prompt: You are prompt-agent. Prompt SDK deployment agent for ML Prompt SDK deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-03-19T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
