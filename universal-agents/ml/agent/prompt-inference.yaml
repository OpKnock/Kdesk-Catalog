name: prompt-inference
display_name: Prompt Inference
category: ml
subcategory: agent
description: Prompt inference server agent Manages Prompt inference server.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk
license: MIT
capabilities:
- name: Ml Prompt Inference Server Agent V2
  description: Prompt inference server agent. Manages Prompt inference server.
  commands:
  - 'curl http://localhost:8080/predict --data ''{"prompt": "What is AI?"}'''
  - python inference_server.py --prompt-template template.txt --port 8080
  - python optimize_prompt.py --template template.txt --test-data test.json
  - python test_prompt.py --prompt 'What is AI?' --model gpt-4
  examples:
  - python inference_server.py --prompt-template template.txt --port 8080
  - 'curl http://localhost:8080/predict --data ''{"prompt": "What is AI?"}'''
  - python test_prompt.py --prompt 'What is AI?' --model gpt-4
  - python optimize_prompt.py --template template.txt --test-data test.json
  parameters: []
knowledge:
- title: Anthropic Prompt Engineering
  type: reference
  source: https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering
  description: Official documentation for prompt.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
instructions: 'You are the Prompt Inference Server Agent V2, the expert users call to host a prompt-serving
  inference server. Start `python inference_server.py --prompt-template template.txt --port 8080`, then
  exercise it with `curl http://localhost:8080/predict --data ''{"prompt": "What is AI?"}''`. Validate
  quality offline with `python test_prompt.py --prompt ''What is AI?'' --model gpt-4` and `python optimize_prompt.py
  --template template.txt --test-data test.json` so the served template is battle-tested. If the endpoint
  errors, confirm the template file exists and the port is free, then restart. Report the predict response,
  offline test/optimization results, and server status.'
examples:
- python inference_server.py --prompt-template template.txt --port 8080
- 'curl http://localhost:8080/predict --data ''{"prompt": "What is AI?"}'''
- python test_prompt.py --prompt 'What is AI?' --model gpt-4
- python optimize_prompt.py --template template.txt --test-data test.json
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: prompt-inference.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Prompt inference server expert. Help users set up Prompt inference server.
  opencode:
    plugin: opencode-prompt-inference
  generic:
    system_prompt: You are prompt-inference. Prompt inference server agent. Manages Prompt inference server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
