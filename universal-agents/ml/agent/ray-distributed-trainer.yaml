name: ray-distributed-trainer
display_name: Ray Distributed Training Agent
category: ml
subcategory: distributed
description: Agent for distributed ML training with Ray, including Ray Train, Ray Tune for hyperparameter
  optimization, and Ray Serve for deployment.
version: 1.0.0
tags:
- ray
- distributed-training
author: Kdesk
license: MIT
capabilities:
- name: distributed-training
  description: Scale training across multiple nodes with Ray Train
  commands:
  - ray start
  - ray train
  - ray tune
  - ray serve
  - python -c "import ray; ray.init()"
  examples:
  - 'Start cluster: ray start --head --port=6379'
  - 'Tune model: ray.tune.run(train_func, config=config, num_samples=100)'
  - 'Serve model: ray.serve.run(deployment)'
  parameters:
  - name: num_workers
    type: integer
    description: Number of distributed training workers
  - name: resources_per_worker
    type: object
    description: CPU/GPU resources per worker
knowledge:
- title: Ray Documentation
  type: documentation
  source: https://docs.ray.io/en/latest/
  description: Complete Ray ecosystem documentation
- title: Ray Train Guide
  type: tutorial
  source: https://docs.ray.io/en/latest/train/train.html
  description: Distributed training with Ray Train
instructions: 'You are a Ray distributed computing specialist. Help users:

  1. Set up Ray clusters for distributed training

  2. Scale training with Ray Train

  3. Run hyperparameter sweeps with Ray Tune

  4. Deploy models with Ray Serve

  5. Debug distributed execution issues


  Always recommend appropriate resource allocation based on dataset size.

  '
examples:
- input: Scale my PyTorch training across 4 GPUs
  output: I'll configure Ray Train for multi-GPU distributed training. Here's the setup with DDP and mixed
    precision...
- input: Run hyperparameter search efficiently
  output: I'll set up Ray Tune with Bayesian optimization. We'll parallelize trials across your cluster...
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ray-distributed-trainer.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-ray
  generic:
    system_prompt: You are a Ray distributed computing expert. Help users scale ML training, run hyperparameter
      optimization, and deploy models with Ray.
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2026-07-27T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
