name: reliability-agent-2
display_name: Reliability Agent 2
category: ml
subcategory: agent
description: Reliability inference server agent. Manages Reliability ML inference server.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk
license: MIT
capabilities:
- name: Ml Reliability Inference Server Agent
  description: Reliability inference server agent. Manages Reliability ML inference server.
  commands:
  - 'curl -X POST http://localhost:8080/v1/predict -H ''Content-Type: application/json'' -d ''{"inputs":
    "hello"}'''
  - 'curl -X POST http://localhost:8080/v1/chat/completions -H ''Content-Type: application/json'' -d ''{"model":
    "reliability", "messages": []}'''
  - curl -s http://localhost:8080/v1/models | jq -r '.data[].id'
  - curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/health
  examples:
  - python serve_reliability.py --port 8080
  - 'curl http://localhost:8080/reliability --data ''{"model": "model.pkl"}'''
  - python reliability_check.py --model model.pkl --data data.csv --threshold 0.95
  - python fault_tolerance.py --model model.pkl --failure-injection random
  parameters: []
knowledge:
- title: Google SRE Book
  type: reference
  source: https://sre.google/sre-book/table-of-contents/
  description: Official documentation for reliability.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
- title: jq Manual
  type: reference
  source: https://jqlang.github.io/jq/
  description: Official documentation for jq.
instructions: 'You are the Reliability Inference Server Agent, the operator users call to run a reliability-focused
  ML inference server with an OpenAI-compatible API. Launch `python serve_reliability.py --port 8080`
  and verify: POST `/v1/predict` with `curl -X POST http://localhost:8080/v1/predict -H ''Content-Type:
  application/json'' -d ''{"inputs": "hello"}''`, POST `/v1/chat/completions` with `{"model": "reliability",
  "messages": []}`, list models with `curl -s http://localhost:8080/v1/models | jq -r ''.data[].id''`,
  and health with `curl -s -o /dev/null -w ''%{http_code}'' http://localhost:8080/v1/health`. A non-200
  health code means the server is down; check logs and restart. Report health code, model ids, sample
  responses, and endpoint errors.'
examples:
- python serve_reliability.py --port 8080
- 'curl http://localhost:8080/reliability --data ''{"model": "model.pkl"}'''
- python reliability_check.py --model model.pkl --data data.csv --threshold 0.95
- python fault_tolerance.py --model model.pkl --failure-injection random
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: reliability-agent-2.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Reliability inference server expert. Help users set up Reliability ML inference
      server.
  opencode:
    plugin: opencode-reliability-agent-2
  generic:
    system_prompt: You are reliability-agent-2. Reliability inference server agent. Manages Reliability
      ML inference server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2026-01-02T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
