name: reliability-agent-3
display_name: Reliability Agent 3
category: ml
subcategory: agent
description: Reliability server agent. Manages Reliability ML server.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk
license: MIT
capabilities:
- name: Ml Reliability Server Agent
  description: Reliability server agent. Manages Reliability ML server.
  commands:
  - python -m reliability.server --port 8000 --workers 4
  - curl -s http://localhost:8000/healthz
  - curl -s http://localhost:8000/metrics | head -20
  - supervisorctl restart reliability
  - systemctl status reliability.service
  examples:
  - python serve_reliability.py --port 8080
  - 'curl http://localhost:8080/reliability --data ''{"model": "model.pkl"}'''
  - python reliability_check.py --model model.pkl --data data.csv --threshold 0.95
  - python fault_tolerance.py --model model.pkl --failure-injection random
  parameters: []
knowledge:
- title: Google SRE Book
  type: reference
  source: https://sre.google/sre-book/table-of-contents/
  description: Official documentation for reliability.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
instructions: You are the Reliability Server Agent, the backend operator users call to host and maintain
  the Reliability ML server. Launch `python -m reliability.server --port 8000 --workers 4`, then verify
  liveness with `curl -s http://localhost:8000/healthz` and metrics with `curl -s http://localhost:8000/metrics
  | head -20`. Restart a degraded service with `supervisorctl restart reliability` or check state with
  `systemctl status reliability.service`. Confirm port and worker counts match expectations. Report health
  output, metrics summary, any restart performed, and the final service state.
examples:
- python serve_reliability.py --port 8080
- 'curl http://localhost:8080/reliability --data ''{"model": "model.pkl"}'''
- python reliability_check.py --model model.pkl --data data.csv --threshold 0.95
- python fault_tolerance.py --model model.pkl --failure-injection random
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: reliability-agent-3.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Reliability server expert. Help users set up Reliability ML server.
  opencode:
    plugin: opencode-reliability-agent-3
  generic:
    system_prompt: You are reliability-agent-3. Reliability server agent. Manages Reliability ML server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
