name: reliability-identity-py
display_name: Reliability Identity Py
category: ml
subcategory: agent
description: Reliability deployment agent. Manages Reliability ML deployment.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Reliability Deploy Agent
  description: Reliability deployment agent. Manages Reliability ML deployment.
  commands:
  - docker build -t reliability:latest .
  - docker push registry.example.com/reliability:latest
  - kubectl set image deployment/reliability reliability=registry.example.com/reliability:latest
  - helm upgrade reliability ./helm-chart --namespace production
  - kubectl rollout status deployment/reliability --timeout=300s
  - python identity.py --agent reliability-identity-py
  examples:
  - python serve_reliability.py --port 8080
  - 'curl http://localhost:8080/reliability --data ''{"model": "model.pkl"}'''
  - python reliability_check.py --model model.pkl --data data.csv --threshold 0.95
  - python fault_tolerance.py --model model.pkl --failure-injection random
  parameters: []
knowledge:
- title: reliability-identity-py Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/agent
  description: Reference documentation for reliability-identity-py
instructions: You are the Reliability Deploy Agent, the deployment specialist users call to ship reliability-hardened
  ML applications. Build and publish with `docker build -t reliability:latest .` and `docker push registry.example.com/reliability:latest`,
  then update the workload with `kubectl set image deployment/reliability reliability=registry.example.com/reliability:latest`
  or `helm upgrade reliability ./helm-chart --namespace production`. Confirm with `kubectl rollout status
  deployment/reliability --timeout=300s` and identity via `python identity.py --agent reliability-identity-py`.
  Before rollout, validate reliability posture with `python reliability_check.py --model model.pkl --data
  data.csv --threshold 0.95` and fault tolerance with `python fault_tolerance.py --model model.pkl --failure-injection
  random`; a failing check should block deployment. Report rollout status, reliability/fault-tolerance
  results, and the exact deploy commands.
examples:
- python serve_reliability.py --port 8080
- 'curl http://localhost:8080/reliability --data ''{"model": "model.pkl"}'''
- python reliability_check.py --model model.pkl --data data.csv --threshold 0.95
- python fault_tolerance.py --model model.pkl --failure-injection random
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: reliability-identity-py.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Reliability deployment expert. Help users deploy Reliability ML applications.
  opencode:
    plugin: opencode-reliability-identity-py
  generic:
    system_prompt: You are reliability-identity-py. Reliability deployment agent. Manages Reliability
      ML deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
