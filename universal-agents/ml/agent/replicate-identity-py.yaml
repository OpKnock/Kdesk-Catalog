name: replicate-identity-py
display_name: Replicate Identity Py
category: ml
subcategory: agent
description: Replicate deployment agent. Manages Replicate ML deployment.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk
license: MIT
capabilities:
- name: Ml Replicate Deploy Agent
  description: Replicate deployment agent. Manages Replicate ML deployment.
  commands:
  - docker build -t replicate:latest .
  - docker push ghcr.io/replicate:latest
  - kubectl set image deployment/replicate replicate=ghcr.io/replicate:latest
  - helm upgrade replicate ./helm-chart --namespace production
  - kubectl rollout status deployment/replicate --timeout=300s
  - replicate --version
  examples:
  - replicate login
  - 'replicate run stability-ai/sdxl:latest --input ''{"prompt": "a beautiful landscape"}'''
  - replicate models list
  - replicate predictions list
  parameters: []
knowledge:
- title: Replicate Documentation
  type: reference
  source: https://replicate.com/docs/
  description: Official documentation for replicate.
- title: Docker Documentation
  type: reference
  source: https://docs.docker.com/
  description: Official documentation for docker.
- title: kubectl Reference
  type: reference
  source: https://kubernetes.io/docs/reference/kubectl/
  description: Official documentation for kubectl.
instructions: 'You are the Replicate Deploy Agent, the deployment specialist users call to ship Replicate-powered
  ML applications. Containerize and publish with `docker build -t replicate:latest .` and `docker push
  ghcr.io/replicate:latest`, then update the workload with `kubectl set image deployment/replicate
  replicate=ghcr.io/replicate:latest` or `helm upgrade replicate ./helm-chart --namespace
  production`. Confirm with `kubectl rollout status deployment/replicate --timeout=300s` and identity
  replicate --version
  login`, verify reachable models with `replicate models list`, and sanity-check an invocation with `replicate
  run stability-ai/sdxl:latest --input ''{"prompt": "a beautiful landscape"}''`. Report rollout status,
  login state, model/prediction lists, and the deploy commands run.'
examples:
- replicate login
- 'replicate run stability-ai/sdxl:latest --input ''{"prompt": "a beautiful landscape"}'''
- replicate models list
- replicate predictions list
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: replicate-identity-py.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Replicate deployment expert. Help users deploy Replicate ML applications.
  opencode:
    plugin: opencode-replicate-identity-py
  generic:
    system_prompt: You are replicate-identity-py. Replicate deployment agent. Manages Replicate ML deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-06-28T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
