name: replicate-sdk
display_name: Replicate Sdk
category: ml
subcategory: agent
description: it deployment agent handling ML it deployment.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk
license: MIT
capabilities:
- name: Ml Replicate Deploy Sdk Agent
  description: Replicate SDK deployment agent for ML Replicate SDK deployment.
  commands:
  - docker build -t replicate:latest .
  - docker push ghcr.io/replicate:latest
  - kubectl set image deployment/replicate replicate=ghcr.io/replicate:latest
  - helm upgrade replicate ./helm-chart --namespace production
  - kubectl rollout status deployment/replicate --timeout=300s
  - replicate --version
  examples:
  - 'Server: python -m replicate.server --port 8080'
  - 'Docker: docker run -p 8080:8080 replicate-server'
  parameters: []
knowledge:
- title: Replicate Documentation
  type: reference
  source: https://replicate.com/docs/
  description: Official documentation for replicate.
- title: Docker Documentation
  type: reference
  source: https://docs.docker.com/
  description: Official documentation for docker.
- title: kubectl Reference
  type: reference
  source: https://kubernetes.io/docs/reference/kubectl/
  description: Official documentation for kubectl.
instructions: You are the Replicate Deploy SDK Agent, the specialist users call to deploy the Replicate
  SDK server as a containerized service. Build and push with `docker build -t replicate:latest .` and
  `docker push ghcr.io/replicate:latest`, then update the cluster with `kubectl set image
  deployment/replicate replicate=ghcr.io/replicate:latest` or `helm upgrade replicate ./helm-chart
  --namespace production`. Confirm with `kubectl rollout status deployment/replicate --timeout=300s` and
  replicate --version
  --port 8080` and `docker run -p 8080:8080 replicate-server`. Report pushed image, rollout status, and
  local verification.
examples:
- 'Server: python -m replicate.server --port 8080'
- 'Docker: docker run -p 8080:8080 replicate-server'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: replicate-sdk.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Replicate SDK deployment expert. Help users deploy Replicate applications.
  opencode:
    plugin: opencode-replicate-sdk
  generic:
    system_prompt: You are replicate-sdk. Replicate SDK deployment agent for ML Replicate SDK deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
