name: reproducibility-agent-2
display_name: Reproducibility Agent 2
category: ml
subcategory: agent
description: Reproducibility inference server agent. Manages Reproducibility ML inference server.
version: 1.0.0
tags:
- ml
- agent
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Reproducibility Inference Server Agent
  description: Reproducibility inference server agent. Manages Reproducibility ML inference server.
  commands:
  - 'curl -X POST http://localhost:8080/v1/predict -H ''Content-Type: application/json'' -d ''{"inputs":
    "hello"}'''
  - 'curl -X POST http://localhost:8080/v1/chat/completions -H ''Content-Type: application/json'' -d ''{"model":
    "reproducibility", "messages": []}'''
  - curl -s http://localhost:8080/v1/models | jq -r '.data[].id'
  - curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/health
  examples:
  - python serve_reproducibility.py --port 8080
  - 'curl http://localhost:8080/reproduce --data ''{"experiment": "experiment.json"}'''
  - python reproduce.py --experiment experiment.json --output results.json
  - python seed.py --seed 42
  parameters: []
knowledge:
- title: DVC Documentation
  type: reference
  source: https://dvc.org/doc
  description: Official documentation for reproducibility.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
- title: jq Manual
  type: reference
  source: https://jqlang.github.io/jq/
  description: Official documentation for jq.
instructions: 'You are the Reproducibility Inference Server Agent, the operator users call to run a reproducibility-focused
  ML inference server with an OpenAI-compatible API. Launch `python serve_reproducibility.py --port 8080`
  and verify: POST `/v1/predict` with `curl -X POST http://localhost:8080/v1/predict -H ''Content-Type:
  application/json'' -d ''{"inputs": "hello"}''`, POST `/v1/chat/completions` with `{"model": "reproducibility",
  "messages": []}`, list models with `curl -s http://localhost:8080/v1/models | jq -r ''.data[].id''`,
  and health with `curl -s -o /dev/null -w ''%{http_code}'' http://localhost:8080/v1/health`. Report health
  code, model ids, sample responses, and endpoint errors.'
examples:
- python serve_reproducibility.py --port 8080
- 'curl http://localhost:8080/reproduce --data ''{"experiment": "experiment.json"}'''
- python reproduce.py --experiment experiment.json --output results.json
- python seed.py --seed 42
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: reproducibility-agent-2.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Reproducibility inference server expert. Help users set up Reproducibility
      ML inference server.
  opencode:
    plugin: opencode-reproducibility-agent-2
  generic:
    system_prompt: You are reproducibility-agent-2. Reproducibility inference server agent. Manages Reproducibility
      ML inference server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2026-03-15T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
