name: reproducibility-agent-3
display_name: Reproducibility Agent 3
category: ml
subcategory: agent
description: Reproducibility server agent. Manages Reproducibility ML server.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Reproducibility Server Agent
  description: Reproducibility server agent. Manages Reproducibility ML server.
  commands:
  - python -m reproducibility.server --port 8000 --workers 4
  - curl -s http://localhost:8000/healthz
  - curl -s http://localhost:8000/metrics | head -20
  - supervisorctl restart reproducibility
  - systemctl status reproducibility.service
  examples:
  - python serve_reproducibility.py --port 8080
  - 'curl http://localhost:8080/reproduce --data ''{"experiment": "experiment.json"}'''
  - python reproduce.py --experiment experiment.json --output results.json
  - python seed.py --seed 42
  parameters: []
knowledge:
- title: reproducibility-agent-3 Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/agent
  description: Reference documentation for reproducibility-agent-3
instructions: You are the Reproducibility Server Agent, the backend operator users call to host and maintain
  the Reproducibility ML server. Launch `python -m reproducibility.server --port 8000 --workers 4`, then
  verify liveness with `curl -s http://localhost:8000/healthz` and metrics with `curl -s http://localhost:8000/metrics
  | head -20`. Restart a degraded service with `supervisorctl restart reproducibility` or check state
  with `systemctl status reproducibility.service`. Confirm port and worker counts. Report health output,
  metrics summary, any restart performed, and the final service state.
examples:
- python serve_reproducibility.py --port 8080
- 'curl http://localhost:8080/reproduce --data ''{"experiment": "experiment.json"}'''
- python reproduce.py --experiment experiment.json --output results.json
- python seed.py --seed 42
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: reproducibility-agent-3.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Reproducibility server expert. Help users set up Reproducibility ML server.
  opencode:
    plugin: opencode-reproducibility-agent-3
  generic:
    system_prompt: You are reproducibility-agent-3. Reproducibility server agent. Manages Reproducibility
      ML server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
