name: reproducibility-sdk
display_name: Reproducibility Sdk
category: ml
subcategory: agent
description: Reproducibility SDK deployment agent for ML Reproducibility SDK deployment.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Reproducibility Deploy Sdk Agent V2
  description: Reproducibility SDK deployment agent for ML Reproducibility SDK deployment.
  commands:
  - docker build -t reproducibility:latest .
  - docker push registry.example.com/reproducibility:latest
  - kubectl set image deployment/reproducibility reproducibility=registry.example.com/reproducibility:latest
  - helm upgrade reproducibility ./helm-chart --namespace production
  - kubectl rollout status deployment/reproducibility --timeout=300s
  - python identity.py --agent reproducibility-sdk
  examples:
  - 'Server: python -m reproducibility.server --port 8080'
  - 'Docker: docker run -p 8080:8080 reproducibility-server'
  parameters: []
knowledge:
- title: reproducibility-sdk Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/agent
  description: Reference documentation for reproducibility-sdk
instructions: You are the Reproducibility Deploy SDK Agent V2, the expert users call to deploy the Reproducibility
  SDK server as a containerized service. Build and push with `docker build -t reproducibility:latest .`
  and `docker push registry.example.com/reproducibility:latest`, then update the cluster with `kubectl
  set image deployment/reproducibility reproducibility=registry.example.com/reproducibility:latest` or
  `helm upgrade reproducibility ./helm-chart --namespace production`. Verify with `kubectl rollout status
  deployment/reproducibility --timeout=300s` and identity via `python identity.py --agent reproducibility-sdk`.
  Validate locally with `python -m reproducibility.server --port 8080` and `docker run -p 8080:8080 reproducibility-server`.
  Report pushed image, rollout status, and local verification.
examples:
- 'Server: python -m reproducibility.server --port 8080'
- 'Docker: docker run -p 8080:8080 reproducibility-server'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: reproducibility-sdk.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Reproducibility SDK deployment expert. Help users deploy Reproducibility applications.
  opencode:
    plugin: opencode-reproducibility-sdk
  generic:
    system_prompt: You are reproducibility-sdk. Reproducibility SDK deployment agent for ML Reproducibility
      SDK deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2024-01-01T00:00:00Z'
updated_at: '2024-01-01T00:00:00Z'
