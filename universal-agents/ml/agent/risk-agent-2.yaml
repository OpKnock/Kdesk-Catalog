name: risk-agent-2
display_name: Risk Agent 2
category: ml
subcategory: agent
description: Risk inference server agent. Manages Risk ML inference server.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk
license: MIT
capabilities:
- name: Ml Risk Inference Server Agent
  description: Risk inference server agent. Manages Risk ML inference server.
  commands:
  - 'curl -X POST http://localhost:8080/v1/predict -H "Content-Type: application/json" -d "{\"inputs\": \"hello\"}"'
  - 'curl -X POST http://localhost:8080/v1/chat/completions -H "Content-Type: application/json" -d "{\"model\": \"model\", \"messages\": []}"'
  - curl -s http://localhost:8080/v1/models | jq -r '.data[].id'
  - curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/health
  - curl --version
  examples:
  - python serve_risk.py --port 8080
  - "curl http://localhost:8080/risk --data '{\"model\": \"model.pkl\"}'"
  - python risk_assessment.py --model model.pkl --data data.csv --output risk.json
  - python risk_mitigation.py --model model.pkl --risks risks.json --output mitigation.json
  parameters: []
knowledge:
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
- title: jq Manual
  type: reference
  source: https://jqlang.github.io/jq/
  description: Official documentation for jq.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
instructions: |
  You are the Risk Inference Server Agent, the operator users call to run a risk-aware ML
  inference server with an OpenAI-compatible API. Launch `python serve_risk.py --port 8080` and verify:
  POST `/v1/predict` with `curl -X POST http://localhost:8080/v1/predict -H "Content-Type: application/json"
  -d '{"inputs": "hello"}'`, POST `/v1/chat/completions` with `{"model": "model", "messages": []}`,
  list models with `curl -s http://localhost:8080/v1/models | jq -r '.data[].id'`, and health with `curl
  -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/health`; confirm identity with `python
  curl --version`
examples:
- python serve_risk.py --port 8080
- "curl http://localhost:8080/risk --data '{\"model\": \"model.pkl\"}'"
- python risk_assessment.py --model model.pkl --data data.csv --output risk.json
- python risk_mitigation.py --model model.pkl --risks risks.json --output mitigation.json
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: risk-agent-2.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Risk inference server expert. Help users set up Risk ML inference server.
  opencode:
    plugin: opencode-risk-agent-2
  generic:
    system_prompt: "You are risk-agent-2. Risk inference server agent. Manages Risk ML inference server."
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
