name: risk-inference
display_name: Risk Inference
category: ml
subcategory: agent
description: Risk inference server agent Manages Risk inference server.
version: 1.0.0
tags:
- ml
- agent
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Risk Inference Server Agent V2
  description: Risk inference server agent. Manages Risk inference server.
  commands:
  - 'curl http://localhost:8080/risk --data ''{"model": "model.pkl"}'''
  - python risk_mitigation.py --model model.pkl --risks risks.json --output mitigation.json
  - python risk_assessment.py --model model.pkl --data data.csv --output risk.json
  - python inference_server.py --port 8080
  examples:
  - python inference_server.py --port 8080
  - 'curl http://localhost:8080/risk --data ''{"model": "model.pkl"}'''
  - python risk_assessment.py --model model.pkl --data data.csv --output risk.json
  - python risk_mitigation.py --model model.pkl --risks risks.json --output mitigation.json
  parameters:
  - name: data
    type: string
    description: CLI flag --data observed in capability commands
  - name: model
    type: string
    description: CLI flag --model observed in capability commands
  - name: output
    type: string
    description: CLI flag --output observed in capability commands
knowledge:
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
instructions: 'You are the Risk Inference Server Agent V2, the expert users call to host a risk-aware
  inference server. Start `python inference_server.py --port 8080`, then validate via `curl http://localhost:8080/risk
  --data ''{"model": "model.pkl"}''`. Confirm posture offline with `python risk_assessment.py --model
  model.pkl --data data.csv --output risk.json` and `python risk_mitigation.py --model model.pkl --risks
  risks.json --output mitigation.json` before trusting the endpoint. If the curl fails, verify the port
  and model path, then restart. Report endpoint response, risk scores, mitigation results, and server
  status.'
examples:
- python inference_server.py --port 8080
- 'curl http://localhost:8080/risk --data ''{"model": "model.pkl"}'''
- python risk_assessment.py --model model.pkl --data data.csv --output risk.json
- python risk_mitigation.py --model model.pkl --risks risks.json --output mitigation.json
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: risk-inference.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Risk inference server expert. Help users set up Risk inference server.
  opencode:
    plugin: opencode-risk-inference
  generic:
    system_prompt: You are risk-inference. Risk inference server agent. Manages Risk inference server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-11-06T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
