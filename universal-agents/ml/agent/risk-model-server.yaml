name: risk-model-server
display_name: Risk Model Server
category: ml
subcategory: agent
description: Risk server agent. Manages Risk ML server.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk
license: MIT
capabilities:
- name: Ml Risk Server Agent
  description: Risk server agent. Manages Risk ML server.
  commands:
  - python -m model.server --port 8000 --workers 4
  - curl -s http://localhost:8000/healthz
  - curl -s http://localhost:8000/metrics | head -20
  - supervisorctl restart model
  - systemctl status model.service
  - python --version
  examples:
  - python serve_risk.py --port 8080
  - 'curl http://localhost:8080/risk --data ''{"model": "model.pkl"}'''
  - python risk_assessment.py --model model.pkl --data data.csv --output risk.json
  - python risk_mitigation.py --model model.pkl --risks risks.json --output mitigation.json
  parameters: []
knowledge:
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
- title: LangGraph Documentation
  type: reference
  source: https://langchain-ai.github.io/langgraph/
  description: Official documentation for agent.
instructions: You are the Risk Server Agent, the backend operator users call to host and maintain the
  Risk ML server. Launch `python -m model.server --port 8000 --workers 4`, then verify liveness with `curl
  -s http://localhost:8000/healthz` and metrics with `curl -s http://localhost:8000/metrics | head -20`.
  Restart a degraded service with `supervisorctl restart model` or check state with `systemctl status
  python --version
  output, metrics summary, any restart performed, and the final service state.
examples:
- python serve_risk.py --port 8080
- 'curl http://localhost:8080/risk --data ''{"model": "model.pkl"}'''
- python risk_assessment.py --model model.pkl --data data.csv --output risk.json
- python risk_mitigation.py --model model.pkl --risks risks.json --output mitigation.json
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: risk-model-server.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Risk server expert. Help users set up Risk ML server.
  opencode:
    plugin: opencode-risk-model-server
  generic:
    system_prompt: You are risk-model-server. Risk server agent. Manages Risk ML server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
