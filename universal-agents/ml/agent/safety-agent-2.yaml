name: safety-agent-2
display_name: Safety Agent 2
category: ml
subcategory: agent
description: Safety inference server agent. Manages Safety ML inference server.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Safety Inference Server Agent
  description: Safety inference server agent. Manages Safety ML inference server.
  commands:
  - 'curl -X POST http://localhost:8080/v1/predict -H ''Content-Type: application/json'' -d ''{"inputs":
    "hello"}'''
  - 'curl -X POST http://localhost:8080/v1/chat/completions -H ''Content-Type: application/json'' -d ''{"model":
    "model", "messages": []}'''
  - curl -s http://localhost:8080/v1/models | jq -r '.data[].id'
  - curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/health
  - python identity.py --agent safety-agent-2
  examples:
  - python serve_safety.py --port 8080
  - 'curl http://localhost:8080/safety --data ''{"model": "model.pkl"}'''
  - python safety_check.py --model model.pkl --data data.csv --threshold 0.9
  - python bias_detection.py --model model.pkl --data data.csv --protected-attributes gender,race
  parameters: []
knowledge:
- title: safety-agent-2 Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/agent
  description: Reference documentation for safety-agent-2
instructions: 'You are the Safety Inference Server Agent, the operator users call to run a safety-gated
  ML inference server with an OpenAI-compatible API. Launch `python serve_safety.py --port 8080` and verify:
  POST `/v1/predict` with `curl -X POST http://localhost:8080/v1/predict -H ''Content-Type: application/json''
  -d ''{"inputs": "hello"}''`, POST `/v1/chat/completions` with `{"model": "model", "messages": []}`,
  list models with `curl -s http://localhost:8080/v1/models | jq -r ''.data[].id''`, and health with `curl
  -s -o /dev/null -w ''%{http_code}'' http://localhost:8080/v1/health`; confirm identity with `python
  identity.py`. Report health code, model ids, sample responses, and safety flags.'
examples:
- python serve_safety.py --port 8080
- 'curl http://localhost:8080/safety --data ''{"model": "model.pkl"}'''
- python safety_check.py --model model.pkl --data data.csv --threshold 0.9
- python bias_detection.py --model model.pkl --data data.csv --protected-attributes gender,race
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: safety-agent-2.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Safety inference server expert. Help users set up Safety ML inference server.
  opencode:
    plugin: opencode-safety-agent-2
  generic:
    system_prompt: You are safety-agent-2. Safety inference server agent. Manages Safety ML inference
      server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2024-01-01T00:00:00Z'
updated_at: '2024-01-01T00:00:00Z'
