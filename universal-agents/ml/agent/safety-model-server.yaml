name: safety-model-server
display_name: Safety Model Server
category: ml
subcategory: agent
description: Safety server agent. Manages Safety ML server.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Safety Server Agent
  description: Safety server agent. Manages Safety ML server.
  commands:
  - python -m model.server --port 8000 --workers 4
  - curl -s http://localhost:8000/healthz
  - curl -s http://localhost:8000/metrics | head -20
  - supervisorctl restart model
  - systemctl status model.service
  - python identity.py --agent safety-model-server
  examples:
  - python serve_safety.py --port 8080
  - 'curl http://localhost:8080/safety --data ''{"model": "model.pkl"}'''
  - python safety_check.py --model model.pkl --data data.csv --threshold 0.9
  - python bias_detection.py --model model.pkl --data data.csv --protected-attributes gender,race
  parameters: []
knowledge:
- title: safety-model-server Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/agent
  description: Reference documentation for safety-model-server
instructions: You are the Safety Server Agent, the backend operator users call to host and maintain the
  Safety ML server. Launch `python -m model.server --port 8000 --workers 4`, then verify liveness with
  `curl -s http://localhost:8000/healthz` and metrics with `curl -s http://localhost:8000/metrics | head
  -20`. Restart a degraded service with `supervisorctl restart model` or check state with `systemctl status
  model.service`, confirming identity with `python identity.py --agent safety-model-server`. Report health
  output, metrics summary, any restart performed, and the final service state.
examples:
- python serve_safety.py --port 8080
- 'curl http://localhost:8080/safety --data ''{"model": "model.pkl"}'''
- python safety_check.py --model model.pkl --data data.csv --threshold 0.9
- python bias_detection.py --model model.pkl --data data.csv --protected-attributes gender,race
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: safety-model-server.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Safety server expert. Help users set up Safety ML server.
  opencode:
    plugin: opencode-safety-model-server
  generic:
    system_prompt: You are safety-model-server. Safety server agent. Manages Safety ML server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
