name: scalability-sdk
display_name: Scalability Sdk
category: ml
subcategory: agent
description: it deployment agent handling ML it deployment.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk
license: MIT
capabilities:
- name: Ml Scalability Deploy Sdk Agent V2
  description: Scalability SDK deployment agent for ML Scalability SDK deployment.
  commands:
  - docker build -t scalability:latest .
  - docker push ghcr.io/scalability:latest
  - kubectl set image deployment/scalability scalability=ghcr.io/scalability:latest
  - helm upgrade scalability ./helm-chart --namespace production
  - kubectl rollout status deployment/scalability --timeout=300s
  - scalability --version
  examples:
  - 'Server: python -m scalability.server --port 8080'
  - 'Docker: docker run -p 8080:8080 scalability-server'
  parameters: []
knowledge:
- title: Kubernetes Architecture
  type: reference
  source: https://kubernetes.io/docs/concepts/architecture/
  description: Official documentation for scalability.
- title: Docker Documentation
  type: reference
  source: https://docs.docker.com/
  description: Official documentation for docker.
- title: kubectl Reference
  type: reference
  source: https://kubernetes.io/docs/reference/kubectl/
  description: Official documentation for kubectl.
instructions: You are the Scalability Deploy SDK Agent V2, the expert users call to deploy the Scalability
  SDK server as a containerized service. Build and push with `docker build -t scalability:latest .` and
  `docker push ghcr.io/scalability:latest`, then update the cluster with `kubectl set image
  deployment/scalability scalability=ghcr.io/scalability:latest` or `helm upgrade scalability
  ./helm-chart --namespace production`. Verify with `kubectl rollout status deployment/scalability --timeout=300s`
  scalability --version
  --port 8080` and `docker run -p 8080:8080 scalability-server`. Report pushed image, rollout status,
  and local verification.
examples:
- 'Server: python -m scalability.server --port 8080'
- 'Docker: docker run -p 8080:8080 scalability-server'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: scalability-sdk.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Scalability SDK deployment expert. Help users deploy Scalability applications.
  opencode:
    plugin: opencode-scalability-sdk
  generic:
    system_prompt: You are scalability-sdk. Scalability SDK deployment agent for ML Scalability SDK deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
