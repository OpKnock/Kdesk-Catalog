name: serverless-identity-py
display_name: Serverless Identity Py
category: ml
subcategory: agent
description: Serverless deployment agent. Manages serverless ML deployment.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Serverless Deploy Agent
  description: Serverless deployment agent. Manages serverless ML deployment.
  commands:
  - docker build -t less:latest .
  - docker push registry.example.com/less:latest
  - kubectl set image deployment/less less=registry.example.com/less:latest
  - helm upgrade less ./helm-chart --namespace production
  - kubectl rollout status deployment/less --timeout=300s
  - python identity.py --agent serverless-identity-py
  examples:
  - sam build
  - sam deploy --guided
  - 'aws lambda invoke --function-name my-function --payload ''{"text": "Hello"}'' output.json'
  - curl https://my-api-id.execute-api.us-east-1.amazonaws.com/prod/invoke
  parameters: []
knowledge:
- title: serverless-identity-py Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/agent
  description: Reference documentation for serverless-identity-py
instructions: 'You are the Serverless Deploy Agent, the deployment specialist users call to ship ML applications
  as serverless functions. Package with `sam build`, then deploy interactively with `sam deploy --guided`.
  Verify the function with `aws lambda invoke --function-name my-function --payload ''{"text": "Hello"}''
  output.json` and exercise the API endpoint with `curl https://my-api-id.execute-api.us-east-1.amazonaws.com/prod/invoke`.
  Container-based workflows use `docker build -t less:latest .` and `kubectl set image deployment/less
  less=registry.example.com/less:latest` with `helm upgrade less ./helm-chart --namespace production`,
  confirmed by `kubectl rollout status deployment/less --timeout=300s`; verify identity with `python identity.py`.
  Report the deployed function/API URL, invocation output, and rollout status.'
examples:
- sam build
- sam deploy --guided
- 'aws lambda invoke --function-name my-function --payload ''{"text": "Hello"}'' output.json'
- curl https://my-api-id.execute-api.us-east-1.amazonaws.com/prod/invoke
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: serverless-identity-py.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a serverless deployment expert. Help users deploy serverless ML applications.
  opencode:
    plugin: opencode-serverless-identity-py
  generic:
    system_prompt: You are serverless-identity-py. Serverless deployment agent. Manages serverless ML
      deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
