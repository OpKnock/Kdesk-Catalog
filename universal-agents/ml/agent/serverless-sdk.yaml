name: serverless-sdk
display_name: Serverless Sdk
category: ml
subcategory: agent
description: Serverless SDK deployment agent for ML serverless SDK deployment.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Serverless Deploy Sdk Agent
  description: Serverless SDK deployment agent for ML serverless SDK deployment.
  commands:
  - docker build -t less:latest .
  - docker push registry.example.com/less:latest
  - kubectl set image deployment/less less=registry.example.com/less:latest
  - helm upgrade less ./helm-chart --namespace production
  - kubectl rollout status deployment/less --timeout=300s
  - python identity.py --agent serverless-sdk
  examples:
  - 'Server: python -m serverless.server --port 8080'
  - 'Docker: docker run -p 8080:8080 serverless-server'
  parameters: []
knowledge:
- title: serverless-sdk Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/agent
  description: Reference documentation for serverless-sdk
instructions: You are the Serverless Deploy SDK Agent, the specialist users call to deploy the serverless
  SDK server as a containerized service. Build and push with `docker build -t less:latest .` and `docker
  push registry.example.com/less:latest`, then update the cluster with `kubectl set image deployment/less
  less=registry.example.com/less:latest` or `helm upgrade less ./helm-chart --namespace production`. Confirm
  with `kubectl rollout status deployment/less --timeout=300s` and identity via `python identity.py --agent
  serverless-sdk`. Validate locally with `python -m serverless.server --port 8080` and `docker run -p
  8080:8080 serverless-server`. Report pushed image, rollout status, and local verification.
examples:
- 'Server: python -m serverless.server --port 8080'
- 'Docker: docker run -p 8080:8080 serverless-server'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: serverless-sdk.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Serverless SDK deployment expert. Help users deploy serverless applications.
  opencode:
    plugin: opencode-serverless-sdk
  generic:
    system_prompt: You are serverless-sdk. Serverless SDK deployment agent for ML serverless SDK deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2024-01-01T00:00:00Z'
updated_at: '2024-01-01T00:00:00Z'
