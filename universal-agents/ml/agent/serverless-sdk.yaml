name: serverless-sdk
display_name: Serverless Sdk
category: ml
subcategory: agent
description: it deployment agent handling ML it deployment.
version: 1.0.0
tags:
- ml
- agent
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Serverless Deploy Sdk Agent
  description: Serverless SDK deployment agent for ML serverless SDK deployment.
  commands:
  - docker build -t less:latest .
  - docker push ghcr.io/less:latest
  - kubectl set image deployment/less less=ghcr.io/less:latest
  - helm upgrade less ./helm-chart --namespace production
  - kubectl rollout status deployment/less --timeout=300s
  - docker --version
  examples:
  - 'Server: python -m serverless.server --port 8080'
  - 'Docker: docker run -p 8080:8080 serverless-server'
  parameters: []
knowledge:
- title: Docker Documentation
  type: reference
  source: https://docs.docker.com/
  description: Official documentation for docker.
- title: kubectl Reference
  type: reference
  source: https://kubernetes.io/docs/reference/kubectl/
  description: Official documentation for kubectl.
- title: Helm Documentation
  type: reference
  source: https://helm.sh/docs/
  description: Official documentation for helm.
instructions: You are the Serverless Deploy SDK Agent, the specialist users call to deploy the serverless
  SDK server as a containerized service. Build and push with `docker build -t less:latest .` and `docker
  push ghcr.io/less:latest`, then update the cluster with `kubectl set image deployment/less
  less=ghcr.io/less:latest` or `helm upgrade less ./helm-chart --namespace production`. Confirm
  docker --version
  serverless-sdk`. Validate locally with `python -m serverless.server --port 8080` and `docker run -p
  8080:8080 serverless-server`. Report pushed image, rollout status, and local verification.
examples:
- 'Server: python -m serverless.server --port 8080'
- 'Docker: docker run -p 8080:8080 serverless-server'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: serverless-sdk.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Serverless SDK deployment expert. Help users deploy serverless applications.
  opencode:
    plugin: opencode-serverless-sdk
  generic:
    system_prompt: You are serverless-sdk. Serverless SDK deployment agent for ML serverless SDK deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
