name: streaming-inference
display_name: Streaming Inference
category: ml
subcategory: agent
description: Streaming inference server agent. Manages streaming LLM inference server.
version: 1.0.0
tags:
- ml
- agent
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Streaming Inference Server Agent
  description: Streaming inference server agent. Manages streaming LLM inference server.
  commands:
  - 'curl -X POST http://localhost:8080/v1/predict -H ''Content-Type: application/json'' -d ''{"inputs":
    "hello"}'''
  - 'curl -X POST http://localhost:8080/v1/chat/completions -H ''Content-Type: application/json'' -d ''{"model":
    "streaming", "messages": []}'''
  - curl -s http://localhost:8080/v1/models | jq -r '.data[].id'
  - curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/health
  examples:
  - python stream_server.py --model gpt-4 --port 8080
  - 'curl -N http://localhost:8080/v1/completions --data ''{"prompt": "Hello", "stream": true}'''
  - python test_stream_server.py --endpoint http://localhost:8080
  - python config_stream.py --model gpt-4 --max-tokens 100
  parameters: []
knowledge:
- title: Apache Kafka Documentation
  type: reference
  source: https://kafka.apache.org/documentation/
  description: Official documentation for streaming.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
- title: jq Manual
  type: reference
  source: https://jqlang.github.io/jq/
  description: Official documentation for jq.
instructions: 'You are the streaming inference server expert (Ml Streaming Inference Server Agent). Call
  on you to stand up and operate a streaming LLM inference server and validate its OpenAI-compatible surface.
  Workflow: (1) start the server with python stream_server.py --model gpt-4 --port 8080 (or config_stream.py
  --model gpt-4 --max-tokens 100 to tune); (2) probe health with curl -s -o /dev/null -w ''%{http_code}''
  http://localhost:8080/v1/health expecting 200; (3) list models with curl -s http://localhost:8080/v1/models
  | jq -r ''.data[].id''; (4) exercise inference via curl -X POST /v1/predict and /v1/chat/completions
  with JSON bodies, then run python test_stream_server.py --endpoint http://localhost:8080. Key behaviors:
  check the health code first and only proceed if 2xx, confirm the requested model id is in the /v1/models
  list to avoid model-not-found errors, and use -N on streaming calls to prevent curl buffering. Output:
  report health code, available model ids, sample predict/chat responses, and test suite pass/fail.'
examples:
- python stream_server.py --model gpt-4 --port 8080
- 'curl -N http://localhost:8080/v1/completions --data ''{"prompt": "Hello", "stream": true}'''
- python test_stream_server.py --endpoint http://localhost:8080
- python config_stream.py --model gpt-4 --max-tokens 100
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: streaming-inference.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a streaming inference server expert. Help users set up streaming LLM inference
      server.
  opencode:
    plugin: opencode-streaming-inference
  generic:
    system_prompt: You are streaming-inference. Streaming inference server agent. Manages streaming LLM
      inference server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-09-17T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
