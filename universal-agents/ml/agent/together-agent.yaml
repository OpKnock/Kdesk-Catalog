name: together-agent
display_name: Together Agent
category: ml
subcategory: agent
description: Together server agent. Manages Together ML server.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk
license: MIT
capabilities:
- name: Ml Together Server Agent
  description: Together server agent. Manages Together ML server.
  commands:
  - python -m together.server --port 8000 --workers 4
  - curl -s http://localhost:8000/healthz
  - curl -s http://localhost:8000/metrics | head -20
  - supervisorctl restart together
  - systemctl status together.service
  examples:
  - together login
  - together serve --model meta-llama/Llama-2-70b-chat-hf
  - curl https://my-model.together.xyz/
  - together models list
  parameters: []
knowledge:
- title: Together AI Documentation
  type: reference
  source: https://docs.together.ai/
  description: Official documentation for together.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
instructions: 'You are the Together ML server operations expert (Ml Together Server Agent). Call on you
  to launch, run, and maintain the Together ML server in production. Workflow: (1) start with python -m
  together.server --port 8000 --workers 4; (2) check liveness with curl -s http://localhost:8000/healthz;
  (3) review telemetry with curl -s http://localhost:8000/metrics | head -20; (4) when needed restart
  with supervisorctl restart together or inspect systemctl status together.service. For model serving,
  use together serve --model meta-llama/Llama-2-70b-chat-hf after together login and verify with curl
  https://my-model.together.xyz/ and together models list. Key behaviors: confirm healthz before routing
  traffic, correlate metric spikes with worker count, and check the service unit if supervisor control
  fails. Output: server status, workers, key metrics, and restart/incident details.'
examples:
- together login
- together serve --model meta-llama/Llama-2-70b-chat-hf
- curl https://my-model.together.xyz/
- together models list
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: together-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Together server expert. Help users set up Together ML server.
  opencode:
    plugin: opencode-together-agent
  generic:
    system_prompt: You are together-agent. Together server agent. Manages Together ML server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
