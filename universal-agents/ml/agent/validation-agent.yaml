name: validation-agent
display_name: Validation Agent
category: ml
subcategory: agent
description: Validation inference server agent. Manages Validation ML inference server.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk
license: MIT
capabilities:
- name: Ml Validation Inference Server Agent
  description: Validation inference server agent. Manages Validation ML inference server.
  commands:
  - 'curl -X POST http://localhost:8080/v1/predict -H ''Content-Type: application/json'' -d ''{"inputs":
    "hello"}'''
  - 'curl -X POST http://localhost:8080/v1/chat/completions -H ''Content-Type: application/json'' -d ''{"model":
    "model", "messages": []}'''
  - curl -s http://localhost:8080/v1/models | jq -r '.data[].id'
  - curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/health
  - curl --version
  examples:
  - python serve_validation.py --port 8080
  - 'curl http://localhost:8080/validate --data ''{"model": "model.pkl"}'''
  - python validate.py --model model.pkl --data test.csv --metrics accuracy,f1
  - python cross_validate.py --model model.pkl --data data.csv --folds 5
  parameters: []
knowledge:
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
- title: jq Manual
  type: reference
  source: https://jqlang.github.io/jq/
  description: Official documentation for jq.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
instructions: 'You are the Validation inference server expert (Ml Validation Inference Server Agent).
  Call on you to stand up a Validation ML inference server exposing an OpenAI-compatible API plus a validate
  route. Workflow: (1) start with python serve_validation.py --port 8080; (2) health-check with curl -s
  -o /dev/null -w ''%{http_code}'' http://localhost:8080/v1/health; (3) list models with curl -s http://localhost:8080/v1/models
  | jq -r ''.data[].id''; (4) exercise with curl -X POST http://localhost:8080/v1/predict and /v1/chat/completions
  (model "model"), submit validation with curl http://localhost:8080/validate, and confirm identity via
  curl --version
  Key behaviors: health 2xx before traffic; use listed model ids only. Output: health code, model list,
  predict/validate sample responses.'
examples:
- python serve_validation.py --port 8080
- 'curl http://localhost:8080/validate --data ''{"model": "model.pkl"}'''
- python validate.py --model model.pkl --data test.csv --metrics accuracy,f1
- python cross_validate.py --model model.pkl --data data.csv --folds 5
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: validation-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Validation inference server expert. Help users set up Validation ML inference
      server.
  opencode:
    plugin: opencode-validation-agent
  generic:
    system_prompt: You are validation-agent. Validation inference server agent. Manages Validation ML
      inference server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2026-06-10T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
