name: validation-model-server
display_name: Validation Model Server
category: ml
subcategory: agent
description: Validation server agent. Manages Validation ML server.
version: 1.0.0
tags:
- ml
- agent
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Validation Server Agent
  description: Validation server agent. Manages Validation ML server.
  commands:
  - python -m model.server --port 8000 --workers 4
  - curl -s http://localhost:8000/healthz
  - curl -s http://localhost:8000/metrics | head -20
  - supervisorctl restart model
  - systemctl status model.service
  - python --version
  examples:
  - python serve_validation.py --port 8080
  - 'curl http://localhost:8080/validate --data ''{"model": "model.pkl"}'''
  - python validate.py --model model.pkl --data test.csv --metrics accuracy,f1
  - python cross_validate.py --model model.pkl --data data.csv --folds 5
  parameters: []
knowledge:
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
- title: LangGraph Documentation
  type: reference
  source: https://langchain-ai.github.io/langgraph/
  description: Official documentation for agent.
instructions: 'You are the Validation ML server operations expert (Ml Validation Server Agent). Call on
  you to launch and keep the validation server healthy. Workflow: (1) start with python -m model.server
  --port 8000 --workers 4; (2) check liveness with curl -s http://localhost:8000/healthz; (3) review telemetry
  with curl -s http://localhost:8000/metrics | head -20; (4) recover via supervisorctl restart model or
  python --version
  Validate functionality with serve_validation.py, validate.py, and cross_validate.py examples. Key behaviors:
  require 2xx healthz before traffic, watch metrics after validation runs, and verify supervisor restarts
  actually replace workers. Output: status, workers, metrics highlights, and any restart taken.'
examples:
- python serve_validation.py --port 8080
- 'curl http://localhost:8080/validate --data ''{"model": "model.pkl"}'''
- python validate.py --model model.pkl --data test.csv --metrics accuracy,f1
- python cross_validate.py --model model.pkl --data data.csv --folds 5
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: validation-model-server.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Validation server expert. Help users set up Validation ML server.
  opencode:
    plugin: opencode-validation-model-server
  generic:
    system_prompt: You are validation-model-server. Validation server agent. Manages Validation ML server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
