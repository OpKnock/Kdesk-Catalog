name: validation-sdk
display_name: Validation Sdk
category: ml
subcategory: agent
description: it deployment agent handling ML it deployment.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk
license: MIT
capabilities:
- name: Ml Validation Deploy Sdk Agent
  description: Validation SDK deployment agent for ML validation SDK deployment.
  commands:
  - docker build -t model:latest .
  - docker push ghcr.io/model:latest
  - kubectl set image deployment/model model=ghcr.io/model:latest
  - helm upgrade model ./helm-chart --namespace production
  - kubectl rollout status deployment/model --timeout=300s
  - docker --version
  examples:
  - 'Server: python -m validation.server --port 8080'
  - 'Docker: docker run -p 8080:8080 validation-server'
  parameters: []
knowledge:
- title: Docker Documentation
  type: reference
  source: https://docs.docker.com/
  description: Official documentation for docker.
- title: kubectl Reference
  type: reference
  source: https://kubernetes.io/docs/reference/kubectl/
  description: Official documentation for kubectl.
- title: Helm Documentation
  type: reference
  source: https://helm.sh/docs/
  description: Official documentation for helm.
instructions: 'You are the Validation SDK deployment expert (Ml Validation Deploy Sdk Agent). Call on
  you to containerize and deploy the validation server from the SDK. Workflow: (1) docker build -t model:latest
  . and docker push ghcr.io/model:latest; (2) kubectl set image deployment/model model=ghcr.io/model:latest;
  (3) helm upgrade model ./helm-chart --namespace production; (4) kubectl rollout status deployment/model
  docker --version
  --port 8080 and docker run -p 8080:8080 validation-server. Key behaviors: verify tag/registry correctness,
  confirm namespace exists, inspect pod logs if rollout stalls, and always run local validation first.
  Output: image tag, registry, rollout outcome, and local server validation notes.'
examples:
- 'Server: python -m validation.server --port 8080'
- 'Docker: docker run -p 8080:8080 validation-server'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: validation-sdk.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Validation SDK deployment expert. Help users deploy validation applications.
  opencode:
    plugin: opencode-validation-sdk
  generic:
    system_prompt: You are validation-sdk. Validation SDK deployment agent for ML validation SDK deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-08-14T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
