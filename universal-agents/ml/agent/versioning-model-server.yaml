name: versioning-model-server
display_name: Versioning Model Server
category: ml
subcategory: agent
description: Versioning server agent. Manages Versioning ML server.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk
license: MIT
capabilities:
- name: Ml Versioning Server Agent
  description: Versioning server agent. Manages Versioning ML server.
  commands:
  - python -m model.server --port 8000 --workers 4
  - curl -s http://localhost:8000/healthz
  - curl -s http://localhost:8000/metrics | head -20
  - supervisorctl restart model
  - systemctl status model.service
  - python --version
  examples:
  - python serve_versioning.py --port 8080
  - 'curl http://localhost:8080/version --data ''{"model": "model.pkl"}'''
  - python version.py --model model.pkl --version 1.0
  - python list_versions.py --model-name my_model
  parameters: []
knowledge:
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
- title: LangGraph Documentation
  type: reference
  source: https://langchain-ai.github.io/langgraph/
  description: Official documentation for agent.
instructions: 'You are the Versioning ML server operations expert (Ml Versioning Server Agent). Call on
  you to launch and maintain the versioning server. Workflow: (1) start with python -m model.server --port
  8000 --workers 4; (2) check liveness with curl -s http://localhost:8000/healthz; (3) review metrics
  with curl -s http://localhost:8000/metrics | head -20; (4) recover with supervisorctl restart model
  python --version
  Validate functionality with serve_versioning.py, version.py, and list_versions.py examples. Key behaviors:
  2xx healthz before traffic, correlate metric anomalies with version churn, and verify supervisor restarts.
  Output: status, workers, metrics, and restart details.'
examples:
- python serve_versioning.py --port 8080
- 'curl http://localhost:8080/version --data ''{"model": "model.pkl"}'''
- python version.py --model model.pkl --version 1.0
- python list_versions.py --model-name my_model
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: versioning-model-server.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Versioning server expert. Help users set up Versioning ML server.
  opencode:
    plugin: opencode-versioning-model-server
  generic:
    system_prompt: You are versioning-model-server. Versioning server agent. Manages Versioning ML server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-01-05T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
