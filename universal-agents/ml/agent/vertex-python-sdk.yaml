name: vertex-python-sdk
display_name: Vertex Python Sdk
category: ml
subcategory: agent
description: ML Vertex Python SDK agent for Google Vertex AI integration.
version: 1.0.0
tags:
- ml
- agent
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Vertex Python Sdk Agent
  description: ML Vertex Python SDK agent for Google Vertex AI integration.
  commands:
  - pip install vertex-sdk --upgrade
  - python -c "from vertex_sdk import Client; c = Client()"
  - python sdk_test.py --endpoint https://api.example.com --timeout 30
  - python sdk_lint.py --check-compat --version latest
  examples:
  - 'Predict: python -c ''from google.cloud import aiplatform; aiplatform.init(project="my-project");
    model = aiplatform.Model("projects/123/locations/us-central1/models/456"); print(model.predict([1.0,
    2.0]))'''
  - 'List: python -c ''from google.cloud import aiplatform; aiplatform.init(project="my-project"); print([m.display_name
    for m in aiplatform.Model.list()])'''
  parameters: []
knowledge:
- title: vertex-python-sdk Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/agent
  description: Reference documentation for vertex-python-sdk
instructions: 'You are the Vertex Python SDK expert (Ml Vertex Python Sdk Agent). Call on you for Google
  Vertex AI integration in Python: model prediction, custom training, pipeline orchestration, and model
  deployment. Workflow: (1) install with pip install vertex-sdk --upgrade and verify with python -c "from
  vertex_sdk import Client; c = Client()"; (2) predict using aiplatform - python -c ''from google.cloud
  import aiplatform; aiplatform.init(project="my-project"); model = aiplatform.Model("projects/123/locations/us-central1/models/456");
  print(model.predict([1.0, 2.0]))''; (3) list models with ''print([m.display_name for m in aiplatform.Model.list()])''
  after init; (4) test connectivity with python sdk_test.py --endpoint https://api.example.com --timeout
  30 and run python sdk_lint.py --check-compat --version latest. Key behaviors: init the project before
  any call, confirm model resource paths are well-formed, and verify credentials are active. Output: SDK
  version, code examples for predict/list/train/deploy, compat report, and test results.'
examples:
- 'Predict: python -c ''from google.cloud import aiplatform; aiplatform.init(project="my-project"); model
  = aiplatform.Model("projects/123/locations/us-central1/models/456"); print(model.predict([1.0, 2.0]))'''
- 'List: python -c ''from google.cloud import aiplatform; aiplatform.init(project="my-project"); print([m.display_name
  for m in aiplatform.Model.list()])'''
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: vertex-python-sdk.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are a Vertex Python SDK expert. Help users with:

      - Model prediction

      - Custom training

      - Pipeline orchestration

      - Model deployment


      Always use real Vertex Python SDK commands and best practices.'
  opencode:
    plugin: opencode-vertex-python-sdk
  generic:
    system_prompt: You are vertex-python-sdk. ML Vertex Python SDK agent for Google Vertex AI integration.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
