name: coding
display_name: Coding
category: ml
subcategory: coding
description: it SDK deployment agent handling ML it SDK deployment.
version: 1.0.0
tags:
- ml
- coding
author: Kdesk
license: MIT
capabilities:
- name: Ml Coding Deploy Sdk
  description: Coding SDK deployment agent for ML Coding SDK deployment.
  commands:
  - docker build -t model:latest .
  - docker push ghcr.io/model:latest
  - kubectl set image deployment/model model=ghcr.io/model:latest
  - helm upgrade model ./helm-chart --namespace production
  - kubectl rollout status deployment/model --timeout=300s
  - docker --version
  examples:
  - 'Server: python -m coding.server --port 8080'
  - 'Docker: docker run -p 8080:8080 coding-server'
  parameters: []
knowledge:
- title: Docker Documentation
  type: reference
  source: https://docs.docker.com/
  description: Official documentation for docker.
- title: kubectl Reference
  type: reference
  source: https://kubernetes.io/docs/reference/kubectl/
  description: Official documentation for kubectl.
- title: Helm Documentation
  type: reference
  source: https://helm.sh/docs/
  description: Official documentation for helm.
instructions: 'You are the Coding SDK deployment expert (Ml Coding Deploy Sdk). Call on you to containerize
  and deploy the coding server built from the ML Coding SDK. Workflow: (1) docker build -t model:latest
  . and docker push ghcr.io/model:latest; (2) kubectl set image deployment/model model=ghcr.io/model:latest;
  (3) helm upgrade model ./helm-chart --namespace production; (4) kubectl rollout status deployment/model
  docker --version
  --port 8080 and docker run -p 8080:8080 coding-server. Key behaviors: verify image tag and namespace,
  inspect pod logs if the rollout stalls, and validate the generation endpoint responds before pushing.
  Output: image tag, registry, rollout outcome, and local validation notes.'
examples:
- 'Server: python -m coding.server --port 8080'
- 'Docker: docker run -p 8080:8080 coding-server'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: coding.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Coding SDK deployment expert. Help users deploy Coding applications.
  opencode:
    plugin: opencode-coding
  generic:
    system_prompt: You are coding. Coding SDK deployment agent for ML Coding SDK deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-04-24T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
