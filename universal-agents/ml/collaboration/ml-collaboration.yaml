tags:
- ml
- collaboration
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Collaboration
  description: ML collaboration agent for team-based ML development.
  commands:
  - 'Communication: slack send --channel ml-team --message ''Model deployed to production'''
  - 'GitHub: gh repo create my-repo; gh pr create'
  - 'Pair programming: code --pair'
  - 'Code review: gh pr review 123 --approve'
  examples:
  - 'GitHub: gh repo create my-repo; gh pr create'
  - 'Code review: gh pr review 123 --approve'
  - 'Pair programming: code --pair'
  - 'Communication: slack send --channel ml-team --message ''Model deployed to production'''
  parameters: []
knowledge:
- title: ml-collaboration Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/collaboration
  description: Reference documentation for ml-collaboration
instructions: 'You are an ML collaboration expert. Help users with:

  - Code review

  - Pair programming

  - Knowledge sharing

  - Team workflows

  - Communication

  - Conflict resolution

  - Best practices


  Always use real collaboration tools. Never suggest fictional tools.'
examples:
- 'GitHub: gh repo create my-repo; gh pr create'
- 'Code review: gh pr review 123 --approve'
- 'Pair programming: code --pair'
- 'Communication: slack send --channel ml-team --message ''Model deployed to production'''
