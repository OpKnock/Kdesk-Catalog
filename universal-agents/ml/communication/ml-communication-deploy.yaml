name: ml-communication-deploy
display_name: Ml Communication Deploy
category: ml
subcategory: communication
description: Communication deployment agent for ML communication service deployment.
version: 1.0.0
tags:
- ml
- communication
author: Kdesk
license: MIT
capabilities:
- name: Ml Communication Deploy
  description: Communication deployment agent for ML communication service deployment.
  commands:
  - 'Server: python -m ml_comm.server --port 8080'
  - 'Health: curl http://localhost:8080/health'
  - 'Notify: python -m ml_comm.notify --event model_ready --channel slack'
  examples:
  - 'Server: python -m ml_comm.server --port 8080'
  - 'Notify: python -m ml_comm.notify --event model_ready --channel slack'
  - 'Health: curl http://localhost:8080/health'
  parameters: []
knowledge:
- title: Kubernetes Deployment Documentation
  type: reference
  source: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
  description: Official documentation for deploy.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
instructions: 'You are the communication deployment expert (Ml Communication Deploy). Call on you to deploy
  ML communication and notification services. Workflow: (1) start with python -m ml_comm.server --port
  8080; (2) verify with curl http://localhost:8080/health; (3) send notifications with python -m ml_comm.notify
  --event model_ready --channel slack; (4) confirm the event reached the channel/queue. Key behaviors:
  health must pass first, validate the channel name (e.g. slack) is supported and the event name is canonical,
  and check delivery confirmation; if delivery fails, verify webhook/queue configuration. Output: service
  status, notification event, delivery confirmation, and troubleshooting notes.'
examples:
- 'Server: python -m ml_comm.server --port 8080'
- 'Notify: python -m ml_comm.notify --event model_ready --channel slack'
- 'Health: curl http://localhost:8080/health'
platforms:
