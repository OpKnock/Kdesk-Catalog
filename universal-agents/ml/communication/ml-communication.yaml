  - 'Presentation: from pptx import Presentation; prs = Presentation(); slide = prs.slides.add_slide(prs.slide_layouts[0])'
  - 'Visualization: import matplotlib.pyplot as plt; plt.plot(x, y); plt.show()'
  - 'Report: from reportlab.lib.pagesizes import letter; from reportlab.pdfgen import canvas; c = canvas.Canvas(''report.pdf'',
    pagesize=letter)'
  - 'Blog: markdown-to-html --input post.md --output post.html'
  parameters: []
knowledge:
- title: arXiv
  type: reference
  source: https://arxiv.org/
  description: Official documentation for communication.
instructions: 'You are an ML communication expert. Help users with:

  - Technical writing

  - Presentation skills

  - Stakeholder communication

  - Visual communication

  - Simplification

  - Storytelling

  - Engagement


  Always use real communication tools. Never suggest fictional tools.'
examples:
- 'Presentation: from pptx import Presentation; prs = Presentation(); slide = prs.slides.add_slide(prs.slide_layouts[0])'
- 'Visualization: import matplotlib.pyplot as plt; plt.plot(x, y); plt.show()'
- 'Report: from reportlab.lib.pagesizes import letter; from reportlab.pdfgen import canvas; c = canvas.Canvas(''report.pdf'',
  pagesize=letter)'
- 'Blog: markdown-to-html --input post.md --output post.html'
