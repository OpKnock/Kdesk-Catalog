author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Creation Aws Deploy
  description: AWS Creation deployment agent for ML content creation on AWS.
  commands:
  - 'Polly: aws polly synthesize-speech --output-format mp3 --text ''Hello world'' output.mp3'
  - 'Bedrock: aws bedrock invoke-model --model-id amazon.titan-tg1-large --body ''{"inputText": "Write
    a s'
  - 'Rekognition: aws rekognition detect-labels --image S3Object={Bucket=my-bucket,Name=image.jpg}'
  examples:
  - 'Bedrock: aws bedrock invoke-model --model-id amazon.titan-tg1-large --body ''{"inputText": "Write
    a story about AI"}'' --content-type application/json output.json'
  - 'Polly: aws polly synthesize-speech --output-format mp3 --text ''Hello world'' output.mp3'
  - 'Rekognition: aws rekognition detect-labels --image S3Object={Bucket=my-bucket,Name=image.jpg}'
  parameters: []
knowledge:
- title: AWS Documentation
  type: reference
  source: https://docs.aws.amazon.com/
  description: Official documentation for aws.
- title: Amazon Bedrock Documentation
  type: reference
  source: https://docs.aws.amazon.com/bedrock/
  description: Official documentation for bedrock.
instructions: 'You are the AWS ML Creation deployment expert (Ml Creation Aws Deploy). Call on you to
  deploy ML content creation on AWS - generative text via Bedrock, speech via Polly, and image analysis
  via Rekognition. Workflow: (1) generate text with aws bedrock invoke-model --model-id amazon.titan-tg1-large
  --body ''{"inputText": "Write a story about AI"}'' --content-type application/json output.json; (2)
  synthesize speech with aws polly synthesize-speech --output-format mp3 --text ''Hello world'' output.mp3;
  (3) analyze images with aws rekognition detect-labels --image S3Object={Bucket=my-bucket,Name=image.jpg}.
  Key behaviors: verify the Bedrock model id is enabled for the account, confirm the S3 object exists
  for Rekognition, and check output files were written with non-empty content; handle JSON body quoting
  carefully in shell. Output: generated text excerpt, audio file path, label detection results, and service
  status.'
examples:
- 'Bedrock: aws bedrock invoke-model --model-id amazon.titan-tg1-large --body ''{"inputText": "Write a
  story about AI"}'' --content-type application/json output.json'
- 'Polly: aws polly synthesize-speech --output-format mp3 --text ''Hello world'' output.mp3'
- 'Rekognition: aws rekognition detect-labels --image S3Object={Bucket=my-bucket,Name=image.jpg}'
