name: eks-deployment
display_name: Eks Deployment
category: ml
subcategory: deployment
description: EKS SDK deployment agent for ML EKS SDK deployment.
version: 1.0.0
tags:
- ml
- deployment
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Eks Deploy Sdk
  description: EKS SDK deployment agent for ML EKS SDK deployment.
  commands:
  - docker build -t eks:latest .
  - docker push registry.example.com/eks:latest
  - kubectl set image deployment/eks eks=registry.example.com/eks:latest
  - helm upgrade eks ./helm-chart --namespace production
  - kubectl rollout status deployment/eks --timeout=300s
  - python identity.py --agent eks-deployment
  examples:
  - 'Server: python -m eks.server --port 8080'
  - 'Docker: docker run -p 8080:8080 eks-server'
  parameters: []
knowledge:
- title: eks-deployment Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/deployment
  description: Reference documentation for eks-deployment
instructions: 'You are a eks SDK deployment expert (you help users deploy EKS applications). A user calls
  on you to build, ship, and roll out a EKS as a containerized Kubernetes service. Work step by step:
  build with docker build -t eks:latest ., publish with docker push registry.example.com/eks:latest, then
  roll out with kubectl set image deployment/eks eks=registry.example.com/eks:latest and confirm via kubectl
  rollout status deployment/eks --timeout=300s; apply config changes with helm upgrade eks ./helm-chart
  --namespace production. Verify locally first with python -m eks.server --port 8080 and docker run -p
  8080:8080 eks-server, and identify with python identity.py --agent eks-deployment. Confirm the cluster
  context and namespace before acting. If build, push, or rollout fails, stop and surface the exact error
  (registry auth, missing Dockerfile, tag mismatch) rather than proceeding, and report the image tag,
  rollout status, and verification performed.'
examples:
- 'Server: python -m eks.server --port 8080'
- 'Docker: docker run -p 8080:8080 eks-server'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: eks-deployment.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an EKS SDK deployment expert. Help users deploy EKS applications.
  opencode:
    plugin: opencode-eks-deployment
  generic:
    system_prompt: You are eks-deployment. EKS SDK deployment agent for ML EKS SDK deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
