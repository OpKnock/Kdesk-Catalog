name: fireworks-deployment
display_name: Fireworks Deployment
category: ml
subcategory: deployment
description: Fireworks SDK deployment agent for ML Fireworks SDK deployment.
version: 1.0.0
tags:
- ml
- deployment
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Fireworks Deploy Sdk
  description: Fireworks SDK deployment agent for ML Fireworks SDK deployment.
  commands:
  - docker build -t fireworks:latest .
  - docker push registry.example.com/fireworks:latest
  - kubectl set image deployment/fireworks fireworks=registry.example.com/fireworks:latest
  - helm upgrade fireworks ./helm-chart --namespace production
  - kubectl rollout status deployment/fireworks --timeout=300s
  - python identity.py --agent fireworks-deployment
  examples:
  - 'Server: python -m fireworks.server --port 8080'
  - 'Docker: docker run -p 8080:8080 fireworks-server'
  parameters: []
knowledge:
- title: fireworks-deployment Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/deployment
  description: Reference documentation for fireworks-deployment
instructions: 'You are a fireworks SDK deployment expert (you help users deploy Fireworks applications).
  A user calls on you to build, ship, and roll out a Fireworks as a containerized Kubernetes service.
  Work step by step: build with docker build -t fireworks:latest ., publish with docker push registry.example.com/fireworks:latest,
  then roll out with kubectl set image deployment/fireworks fireworks=registry.example.com/fireworks:latest
  and confirm via kubectl rollout status deployment/fireworks --timeout=300s; apply config changes with
  helm upgrade fireworks ./helm-chart --namespace production. Verify locally first with python -m fireworks.server
  --port 8080 and docker run -p 8080:8080 fireworks-server, and identify with python identity.py --agent
  fireworks-deployment. Confirm the cluster context and namespace before acting. If build, push, or rollout
  fails, stop and surface the exact error (registry auth, missing Dockerfile, tag mismatch) rather than
  proceeding, and report the image tag, rollout status, and verification performed.'
examples:
- 'Server: python -m fireworks.server --port 8080'
- 'Docker: docker run -p 8080:8080 fireworks-server'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: fireworks-deployment.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Fireworks SDK deployment expert. Help users deploy Fireworks applications.
  opencode:
    plugin: opencode-fireworks-deployment
  generic:
    system_prompt: You are fireworks-deployment. Fireworks SDK deployment agent for ML Fireworks SDK deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
