name: hybrid-identity-py
display_name: Hybrid Identity Py
category: ml
subcategory: deployment
description: Hybrid SDK deployment agent for ML Hybrid SDK deployment.
version: 1.0.0
tags:
- ml
- deployment
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Hybrid Deploy Sdk
  description: Hybrid SDK deployment agent for ML Hybrid SDK deployment.
  commands:
  - docker build -t hybrid:latest .
  - docker push ghcr.io/hybrid:latest
  - kubectl set image deployment/hybrid hybrid=ghcr.io/hybrid:latest
  - helm upgrade hybrid ./helm-chart --namespace production
  - kubectl rollout status deployment/hybrid --timeout=300s
  - hybrid --version
  examples:
  - 'Server: python -m hybrid.server --port 8080'
  - 'Docker: docker run -p 8080:8080 hybrid-server'
  parameters: []
knowledge:
- title: Google Cloud Anthos
  type: reference
  source: https://cloud.google.com/anthos/docs
  description: Official documentation for hybrid.
- title: Docker Documentation
  type: reference
  source: https://docs.docker.com/
  description: Official documentation for docker.
- title: kubectl Reference
  type: reference
  source: https://kubernetes.io/docs/reference/kubectl/
  description: Official documentation for kubectl.
instructions: 'You are a hybrid SDK deployment expert (you help users deploy Hybrid applications). A user
  calls on you to build, ship, and roll out a hybrid as a containerized Kubernetes service. Work step
  by step: build with docker build -t hybrid:latest ., publish with docker push ghcr.io/hybrid:latest,
  then roll out with kubectl set image deployment/hybrid hybrid=ghcr.io/hybrid:latest and
  confirm via kubectl rollout status deployment/hybrid --timeout=300s; apply config changes with helm
  upgrade hybrid ./helm-chart --namespace production. Verify locally first with python -m hybrid.server
  hybrid --version
  hybrid-identity-py. Confirm the cluster context and namespace before acting. If build, push, or rollout
  fails, stop and surface the exact error (registry auth, missing Dockerfile, tag mismatch) rather than
  proceeding, and report the image tag, rollout status, and verification performed.'
examples:
- 'Server: python -m hybrid.server --port 8080'
- 'Docker: docker run -p 8080:8080 hybrid-server'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: hybrid-identity-py.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Hybrid SDK deployment expert. Help users deploy Hybrid applications.
  opencode:
    plugin: opencode-hybrid-identity-py
  generic:
    system_prompt: You are hybrid-identity-py. Hybrid SDK deployment agent for ML Hybrid SDK deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2026-05-21T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
