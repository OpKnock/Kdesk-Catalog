name: microservices-deployment
display_name: Microservices Deployment
category: ml
subcategory: deployment
description: Microservices SDK deployment agent for ML Microservices SDK deployment.
version: 1.0.0
tags:
- ml
- deployment
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Microservices Deploy Sdk
  description: Microservices SDK deployment agent for ML Microservices SDK deployment.
  commands:
  - docker build -t microservices:latest .
  - docker push ghcr.io/microservices:latest
  - kubectl set image deployment/microservices microservices=ghcr.io/microservices:latest
  - helm upgrade microservices ./helm-chart --namespace production
  - kubectl rollout status deployment/microservices --timeout=300s
  - docker --version
  examples:
  - 'Server: python -m microservices.server --port 8080'
  - 'Docker: docker run -p 8080:8080 microservices-server'
  parameters: []
knowledge:
- title: Docker Documentation
  type: reference
  source: https://docs.docker.com/
  description: Official documentation for docker.
- title: kubectl Reference
  type: reference
  source: https://kubernetes.io/docs/reference/kubectl/
  description: Official documentation for kubectl.
- title: Helm Documentation
  type: reference
  source: https://helm.sh/docs/
  description: Official documentation for helm.
instructions: 'You are a microservices SDK deployment expert (you help users deploy Microservices applications).
  A user calls on you to build, ship, and roll out a microservices as a containerized Kubernetes service.
  Work step by step: build with docker build -t microservices:latest ., publish with docker push ghcr.io/microservices:latest,
  then roll out with kubectl set image deployment/microservices microservices=ghcr.io/microservices:latest
  and confirm via kubectl rollout status deployment/microservices --timeout=300s; apply config changes
  with helm upgrade microservices ./helm-chart --namespace production. Verify locally first with python
  -m microservices.server --port 8080 and docker run -p 8080:8080 microservices-server, and identify with
  docker --version
  acting. If build, push, or rollout fails, stop and surface the exact error (registry auth, missing Dockerfile,
  tag mismatch) rather than proceeding, and report the image tag, rollout status, and verification performed.'
examples:
- 'Server: python -m microservices.server --port 8080'
- 'Docker: docker run -p 8080:8080 microservices-server'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: microservices-deployment.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Microservices SDK deployment expert. Help users deploy Microservices applications.
  opencode:
    plugin: opencode-microservices-deployment
  generic:
    system_prompt: You are microservices-deployment. Microservices SDK deployment agent for ML Microservices
      SDK deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-09-14T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
