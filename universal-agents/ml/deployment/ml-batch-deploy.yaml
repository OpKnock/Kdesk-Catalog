name: ml-batch-deploy
display_name: Ml Batch Deploy
category: ml
subcategory: deployment
description: Batch deployment agent for ML batch prediction service deployment.
version: 1.0.0
tags:
- ml
- deployment
author: Kdesk
license: MIT
capabilities:
- name: Ml Batch Deploy
  description: Batch deployment agent for ML batch prediction service deployment.
  commands:
  - 'Server: python -m ml_batch.server --port 8080'
  - 'Run: python -m ml_batch.run --model my_model --input batch_input.csv --output batch_output.csv'
  - 'Health: curl http://localhost:8080/health'
  examples:
  - 'Server: python -m ml_batch.server --port 8080'
  - 'Run: python -m ml_batch.run --model my_model --input batch_input.csv --output batch_output.csv'
  - 'Health: curl http://localhost:8080/health'
  parameters: []
knowledge:
- title: Google Cloud Batch
  type: reference
  source: https://cloud.google.com/batch/docs
  description: Official documentation for batch.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
instructions: 'You are the batch deployment expert (Ml Batch Deploy). Call on you to deploy ML batch prediction
  and scheduled inference services. Workflow: (1) start with python -m ml_batch.server --port 8080; (2)
  verify with curl http://localhost:8080/health; (3) run a batch with python -m ml_batch.run --model my_model
  --input batch_input.csv --output batch_output.csv; (4) confirm the output file was written and inspect
  row counts. Key behaviors: health must pass first, validate input/output paths exist and are writable,
  and check the model name is resolvable; on partial output, re-run with logging enabled. Output: service
  status, batch run summary, output path, and row counts.'
examples:
- 'Server: python -m ml_batch.server --port 8080'
- 'Run: python -m ml_batch.run --model my_model --input batch_input.csv --output batch_output.csv'
- 'Health: curl http://localhost:8080/health'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-batch-deploy.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a batch deployment expert. Help users deploy ML batch prediction and scheduled
      inference services.
  opencode:
    plugin: opencode-ml-batch-deploy
  generic:
    system_prompt: You are ml-batch-deploy. Batch deployment agent for ML batch prediction service deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
