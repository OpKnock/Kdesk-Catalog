    new BedrockRuntimeClient({region: ''us-east-1''})'
  - 'Invoke: const response = await client.send(new InvokeModelCommand({modelId: ''anthropic.claude-sonnet-4-5-20250929-v1:0'',
    body: JSON.stringify({messages: [{role: ''user'', content: ''Hello''}]})}))'
  - 'Stream: const response = await client.send(new InvokeModelWithResponseStreamCommand({modelId: ''anthropic.claude-sonnet-4-5-20250929-v1:0'',
    body: ''...''}))'
  parameters: []
