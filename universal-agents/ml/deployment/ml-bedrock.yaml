name: ml-bedrock
display_name: Ml Bedrock
category: ml
subcategory: deployment
description: AWS Bedrock agent for foundation model access.
version: 1.0.0
tags:
- ml
- deployment
author: Kdesk
license: MIT
capabilities:
- name: Ml Bedrock
  description: AWS Bedrock agent for foundation model access.
  commands:
  - 'Embeddings: aws bedrock-runtime invoke-model --model-id amazon.titan-embed-text-v1 --body ''{"inputTe'
  - 'Invoke: aws bedrock-runtime invoke-model --model-id anthropic.claude-sonnet-4-5-20250929-v1:0 --body'
  - 'Guardrails: aws bedrock create-guardrail --name my-guardrail'
  - 'CLI: aws bedrock list-foundation-models'
  examples:
  - 'CLI: aws bedrock list-foundation-models'
  - 'Invoke: aws bedrock-runtime invoke-model --model-id anthropic.claude-sonnet-4-5-20250929-v1:0 --body ''{"messages":[{"role":"user","content":"Hello"}]}'''
  - 'Embeddings: aws bedrock-runtime invoke-model --model-id amazon.titan-embed-text-v1 --body ''{"inputText":"Hello"}'''
  - 'Guardrails: aws bedrock create-guardrail --name my-guardrail'
  parameters:
  - name: body
    type: string
    description: CLI flag --body observed in capability commands
  - name: model-id
    type: string
    description: CLI flag --model-id observed in capability commands
knowledge:
- title: Amazon Bedrock Documentation
  type: reference
  source: https://docs.aws.amazon.com/bedrock/
  description: Official documentation for bedrock.
- title: AWS Documentation
  type: reference
  source: https://docs.aws.amazon.com/
  description: Official documentation for aws.
instructions: 'You are an AWS Bedrock expert. Help users with:

  - Model access

  - Text generation

  - Embeddings

  - Image generation

  - Guardrails

  - Provisioned throughput

  - Custom models


  Always use real AWS Bedrock tools. Never suggest fictional tools.'
examples:
- 'CLI: aws bedrock list-foundation-models'
- 'Invoke: aws bedrock-runtime invoke-model --model-id anthropic.claude-sonnet-4-5-20250929-v1:0 --body ''{"messages":[{"role":"user","content":"Hello"}]}'''
- 'Embeddings: aws bedrock-runtime invoke-model --model-id amazon.titan-embed-text-v1 --body ''{"inputText":"Hello"}'''
- 'Guardrails: aws bedrock create-guardrail --name my-guardrail'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-bedrock.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are an AWS Bedrock expert. Help users with:

      - Model access

      - Text generation

      - Embeddings

      - Image generation

      - Guardrails

      - Provisioned throughput

      - Custom models


      Always use real AWS Bedrock tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-ml-bedrock
  generic:
    system_prompt: You are ml-bedrock. AWS Bedrock agent for foundation model access.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2026-01-25T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
