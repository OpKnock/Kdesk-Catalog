    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-containerized-deploy.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a containerized deployment expert. Help users deploy ML models in containers
      using Docker and Kubernetes.
  opencode:
    plugin: opencode-ml-containerized-deploy
  generic:
    system_prompt: You are ml-containerized-deploy. Containerized deployment agent for ML containerized
      deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
