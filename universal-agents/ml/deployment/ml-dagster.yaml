capabilities:
- name: Ml Dagster
  description: Dagster agent for data orchestration and assets.
  commands:
  - 'UI: http://localhost:3000'
  - 'Jobs: dagster job list'
  - 'Dev: dagster dev'
  - 'Assets: dagster asset materialize --select all'
  examples:
  - 'Dev: dagster dev'
  - 'UI: http://localhost:3000'
  - 'Assets: dagster asset materialize --select all'
