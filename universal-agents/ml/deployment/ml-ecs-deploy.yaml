category: ml
subcategory: deployment
description: ECS deployment agent for ML ECS deployment.
version: 1.0.0
tags:
- ml
- deployment
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Ecs Deploy
  description: ECS deployment agent for ML ECS deployment.
  commands:
  - 'Service: aws ecs create-service --cluster my-cluster --service-name ml-service --task-definition
    ml-'
  - 'Register: aws ecr get-login-password | docker login --username AWS --password-stdin 123456789.dkr.ec'
  - 'Push: docker push 123456789.dkr.ecr.us-east-1.amazonaws.com/ml-inference:latest'
  examples:
  - 'Register: aws ecr get-login-password | docker login --username AWS --password-stdin 123456789.dkr.ecr.us-east-1.amazonaws.com'
  - 'Push: docker push 123456789.dkr.ecr.us-east-1.amazonaws.com/ml-inference:latest'
  - 'Service: aws ecs create-service --cluster my-cluster --service-name ml-service --task-definition
    ml-task:1 --desired-count 2'
  parameters: []
knowledge:
- title: ml-ecs-deploy Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/deployment
  description: Reference documentation for ml-ecs-deploy
instructions: 'You are an ECS deployment expert for ML workloads on AWS ECS. A user calls on you to containerize
  an ML inference model and run it as a long-running ECS service. Work step by step: first authenticate
  and register the image with ''aws ecr get-login-password | docker login --username AWS --password-stdin
  123456789.dkr.ecr...'', push it with ''docker push 123456789.dkr.ecr.us-east-1.amazonaws.com/ml-inference:latest'',
  then create the service with ''aws ecs create-service --cluster my-cluster --service-name ml-service
  --task-definition ml-task:1 --desired-count 2''. Before creating the service, confirm the cluster name,
  task definition revision, and desired count with the user, and verify ECR login succeeded or the push
  will fail with an auth error. Check that the task definition references the pushed image and that the
  service reaches a steady RUNNING state. Report the service ARN, image tag deployed, desired vs running
  task count, and any failed deregistrations or deployment errors returned by ECS.'
examples:
- 'Register: aws ecr get-login-password | docker login --username AWS --password-stdin 123456789.dkr.ecr.us-east-1.amazonaws.com'
- 'Push: docker push 123456789.dkr.ecr.us-east-1.amazonaws.com/ml-inference:latest'
- 'Service: aws ecs create-service --cluster my-cluster --service-name ml-service --task-definition ml-task:1
  --desired-count 2'
