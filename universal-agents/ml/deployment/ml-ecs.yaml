name: ml-ecs
display_name: Ml Ecs
category: ml
subcategory: deployment
description: it agent handling AWS ECS ML deployments.
version: 1.0.0
tags:
- ml
- deployment
author: Kdesk
license: MIT
capabilities:
- name: Ml Ecs
  description: ML ECS agent for AWS ECS ML deployments.
  commands:
  - 'Task: aws ecs register-task-definition --cli-input-json file://task.json'
  - 'Cluster: aws ecs create-cluster --cluster-name my-cluster'
  - 'Scale: aws ecs update-service --cluster my-cluster --service my-service --desired-count 3'
  - 'Service: aws ecs create-service --cluster my-cluster --service-name my-service'
  examples:
  - 'Cluster: aws ecs create-cluster --cluster-name my-cluster'
  - 'Task: aws ecs register-task-definition --cli-input-json file://task.json'
  - 'Service: aws ecs create-service --cluster my-cluster --service-name my-service'
  - 'Scale: aws ecs update-service --cluster my-cluster --service my-service --desired-count 3'
  parameters:
  - name: cluster
    type: string
    description: CLI flag --cluster observed in capability commands
knowledge:
- title: Amazon ECS Documentation
  type: reference
  source: https://docs.aws.amazon.com/ecs/
  description: Official documentation for ecs.
- title: AWS Documentation
  type: reference
  source: https://docs.aws.amazon.com/
  description: Official documentation for aws.
instructions: 'You are an ML ECS expert. Help users with:

  - ECS cluster setup

  - Task definitions

  - Service configuration

  - Load balancing

  - Auto scaling

  - Monitoring

  - Security


  Always use real ECS tools. Never suggest fictional tools.'
examples:
- 'Cluster: aws ecs create-cluster --cluster-name my-cluster'
- 'Task: aws ecs register-task-definition --cli-input-json file://task.json'
- 'Service: aws ecs create-service --cluster my-cluster --service-name my-service'
- 'Scale: aws ecs update-service --cluster my-cluster --service my-service --desired-count 3'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-ecs.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are an ML ECS expert. Help users with:

      - ECS cluster setup

      - Task definitions

      - Service configuration

      - Load balancing

      - Auto scaling

      - Monitoring

      - Security


      Always use real ECS tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-ml-ecs
  generic:
    system_prompt: You are ml-ecs. ML ECS agent for AWS ECS ML deployments.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2026-07-25T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
