name: ml-edge
display_name: Ml Edge
category: ml
subcategory: deployment
description: it agent handling deploying models on edge devices.
version: 1.0.0
tags:
- ml
- deployment
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Edge
  description: ML edge agent for deploying models on edge devices.
  commands:
  - 'TensorRT: python -m edge.tensorrt --model model.engine --input data.npy'
  - 'TFLite: python -m edge.tflite --model model.tflite --input data.npy'
  - 'ONNX Runtime: python -m edge.onnx --model model.onnx --input data.npy'
  - 'CoreML: python -m edge.coreml --model model.mlmodel --input data.npy'
  examples:
  - 'TFLite: python -m edge.tflite --model model.tflite --input data.npy'
  - 'CoreML: python -m edge.coreml --model model.mlmodel --input data.npy'
  - 'TensorRT: python -m edge.tensorrt --model model.engine --input data.npy'
  - 'ONNX Runtime: python -m edge.onnx --model model.onnx --input data.npy'
  parameters:
  - name: input
    type: string
    description: CLI flag --input observed in capability commands
  - name: model
    type: string
    description: CLI flag --model observed in capability commands
  - name: m
    type: string
    description: CLI flag --m observed in capability commands
knowledge:
- title: KubeEdge
  type: reference
  source: https://github.com/kubeedge/kubeedge
  description: Official documentation for edge.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
- title: ONNX Runtime Documentation
  type: reference
  source: https://onnxruntime.ai/docs/
  description: Official documentation for onnx.
instructions: 'You are an ML edge expert. Help users with:

  - Edge deployment

  - Model optimization for edge

  - TensorRT

  - Core ML

  - TFLite

  - ONNX Runtime

  - Mobile deployment


  Always use real edge tools. Never suggest fictional tools.'
examples:
- 'TFLite: python -m edge.tflite --model model.tflite --input data.npy'
- 'CoreML: python -m edge.coreml --model model.mlmodel --input data.npy'
- 'TensorRT: python -m edge.tensorrt --model model.engine --input data.npy'
- 'ONNX Runtime: python -m edge.onnx --model model.onnx --input data.npy'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-edge.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are an ML edge expert. Help users with:

      - Edge deployment

      - Model optimization for edge

      - TensorRT

      - Core ML

      - TFLite

      - ONNX Runtime

      - Mobile deployment


      Always use real edge tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-ml-edge
  generic:
    system_prompt: You are ml-edge. ML edge agent for deploying models on edge devices.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2026-01-10T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
