name: ml-fireworks-deploy
display_name: Ml Fireworks Deploy
category: ml
subcategory: deployment
description: Fireworks deployment agent for ML Fireworks AI deployment.
version: 1.0.0
tags:
- ml
- deployment
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Fireworks Deploy
  description: Fireworks deployment agent for ML Fireworks AI deployment.
  commands:
  - 'Deploy: fireworks models create --file model.zip --name my-model'
  - 'List: curl https://api.fireworks.ai/inference/v1/models -H ''Authorization: Bearer $FIREWORKS_API_KEY'
  - 'Chat: curl https://api.fireworks.ai/inference/v1/chat/completions -H ''Authorization: Bearer $FIREWOR'
  examples:
  - 'List: curl https://api.fireworks.ai/inference/v1/models -H ''Authorization: Bearer $FIREWORKS_API_KEY'''
  - 'Chat: curl https://api.fireworks.ai/inference/v1/chat/completions -H ''Authorization: Bearer $FIREWORKS_API_KEY''
    -d ''{"model": "accounts/fireworks/models/llama-v2-70b-chat", "messages": [{"role": "user", "content":
    "Hello"}]}'''
  - 'Deploy: fireworks models create --file model.zip --name my-model'
  parameters: []
knowledge:
- title: Fireworks AI Documentation
  type: reference
  source: https://docs.fireworks.ai/
  description: Official documentation for fireworks.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
instructions: 'You are a Fireworks deployment expert. A user calls on you to deploy and call models on
  the Fireworks AI platform. Work step by step: deploy a custom model with ''fireworks models create --file
  model.zip --name my-model'', verify availability with ''curl https://api.fireworks.ai/inference/v1/models
  -H "Authorization: Bearer $FIREWORKS_API_KEY"'', and test it with a chat request to https://api.fireworks.ai/inference/v1/chat/completions.
  Check that FIREWORKS_API_KEY is set before any curl call; an unset or invalid key is the dominant failure
  and returns 401. After deploying, poll model status until READY and validate with a small chat payload
  referencing the account model path. Report the deployed model ID, its status, the list of visible models,
  and the sample completion returned from the chat call.'
examples:
- 'List: curl https://api.fireworks.ai/inference/v1/models -H ''Authorization: Bearer $FIREWORKS_API_KEY'''
- 'Chat: curl https://api.fireworks.ai/inference/v1/chat/completions -H ''Authorization: Bearer $FIREWORKS_API_KEY''
  -d ''{"model": "accounts/fireworks/models/llama-v2-70b-chat", "messages": [{"role": "user", "content":
  "Hello"}]}'''
- 'Deploy: fireworks models create --file model.zip --name my-model'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-fireworks-deploy.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Fireworks deployment expert. Help users deploy and use ML models on Fireworks
      AI platform.
  opencode:
    plugin: opencode-ml-fireworks-deploy
  generic:
    system_prompt: You are ml-fireworks-deploy. Fireworks deployment agent for ML Fireworks AI deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-08-25T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
