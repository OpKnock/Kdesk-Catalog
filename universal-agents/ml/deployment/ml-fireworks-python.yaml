name: ml-fireworks-python
display_name: Ml Fireworks Python
category: ml
subcategory: deployment
description: Fireworks Python SDK agent for fast model inference.
version: 1.0.0
tags:
- ml
- deployment
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Fireworks Python
  description: Fireworks Python SDK agent for fast model inference.
  commands:
  - 'Chat: client.chat.completions.create(model=''accounts/fireworks/models/llama-v3p3-70b-instruct'',
    mess'
  - 'Client: from fireworks.client import Client; client = Client()'
  - 'Embed: client.embeddings.create(model=''accounts/fireworks/models/nomic-embed-text-v1'', input=''Hello'''
  - 'Install: pip install fireworks-ai'
  examples:
  - 'Install: pip install fireworks-ai'
  - 'Client: from fireworks.client import Client; client = Client()'
  - 'Chat: client.chat.completions.create(model=''accounts/fireworks/models/llama-v3p3-70b-instruct'',
    messages=[{''role'': ''user'', ''content'': ''Hello''}])'
  - 'Embed: client.embeddings.create(model=''accounts/fireworks/models/nomic-embed-text-v1'', input=''Hello'')'
  parameters: []
knowledge:
- title: Fireworks AI Documentation
  type: reference
  source: https://docs.fireworks.ai/
  description: Official documentation for fireworks.
instructions: 'You are a Fireworks Python SDK expert. Help users with:

  - Client initialization

  - Chat completions

  - Text completions

  - Embeddings

  - Image generation

  - Model selection

  - Rate limiting


  Always use real Fireworks Python SDK tools. Never suggest fictional tools.'
examples:
- 'Install: pip install fireworks-ai'
- 'Client: from fireworks.client import Client; client = Client()'
- 'Chat: client.chat.completions.create(model=''accounts/fireworks/models/llama-v3p3-70b-instruct'', messages=[{''role'':
  ''user'', ''content'': ''Hello''}])'
- 'Embed: client.embeddings.create(model=''accounts/fireworks/models/nomic-embed-text-v1'', input=''Hello'')'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-fireworks-python.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are a Fireworks Python SDK expert. Help users with:

      - Client initialization

      - Chat completions

      - Text completions

      - Embeddings

      - Image generation

      - Model selection

      - Rate limiting


      Always use real Fireworks Python SDK tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-ml-fireworks-python
  generic:
    system_prompt: You are ml-fireworks-python. Fireworks Python SDK agent for fast model inference.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
