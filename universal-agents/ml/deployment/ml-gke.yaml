    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are an ML GKE expert. Help users with:

      - GKE cluster setup

      - Node pools

      - GPU support

      - TPU support

      - Auto scaling

      - Monitoring

      - Security


      Always use real GKE tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-ml-gke
  generic:
    system_prompt: You are ml-gke. ML GKE agent for Google Kubernetes Engine ML deployments.
    available_tools:
    - bash
    - read
    - write
    - edit
