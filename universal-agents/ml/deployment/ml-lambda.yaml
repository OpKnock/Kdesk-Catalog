name: ml-lambda
display_name: Ml Lambda
category: ml
subcategory: deployment
description: ML Lambda agent for AWS Lambda ML deployments.
version: 1.0.0
tags:
- ml
- deployment
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Lambda
  description: ML Lambda agent for AWS Lambda ML deployments.
  commands:
  - 'API Gateway: aws apigateway create-rest-api --name my-api'
  - 'Invoke: aws lambda invoke --function-name my-function --payload ''{"input": "data"}'' output.json'
  - 'Create: aws lambda create-function --function-name my-function --zip-file fileb://function.zip'
  - 'Monitor: aws logs filter-log-events --log-group-name /aws/lambda/my-function'
  examples:
  - 'Create: aws lambda create-function --function-name my-function --zip-file fileb://function.zip'
  - 'Invoke: aws lambda invoke --function-name my-function --payload ''{"input": "data"}'' output.json'
  - 'API Gateway: aws apigateway create-rest-api --name my-api'
  - 'Monitor: aws logs filter-log-events --log-group-name /aws/lambda/my-function'
  parameters:
  - name: function-name
    type: string
    description: CLI flag --function-name observed in capability commands
knowledge:
- title: ml-lambda Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/deployment
  description: Reference documentation for ml-lambda
instructions: 'You are an ML Lambda expert. Help users with:

  - Lambda function creation

  - Model packaging

  - API Gateway integration

  - Cold start optimization

  - Cost optimization

  - Monitoring

  - Security


  Always use real Lambda tools. Never suggest fictional tools.'
examples:
- 'Create: aws lambda create-function --function-name my-function --zip-file fileb://function.zip'
- 'Invoke: aws lambda invoke --function-name my-function --payload ''{"input": "data"}'' output.json'
- 'API Gateway: aws apigateway create-rest-api --name my-api'
- 'Monitor: aws logs filter-log-events --log-group-name /aws/lambda/my-function'
