name: ml-microservices
display_name: Ml Microservices
category: ml
subcategory: deployment
description: ML microservices agent for microservice-based ML architectures.
version: 1.0.0
tags:
- ml
- deployment
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Microservices
  description: ML microservices agent for microservice-based ML architectures.
  commands:
  - 'API: python -m microservices.api --service inference --port 8080'
  - 'Deployment: kubectl apply -f deployment.yaml'
  - 'Testing: pytest tests/ -v --cov=.'
  - 'Communication: python -m microservices.communication --protocol grpc --service inference'
  examples:
  - 'API: python -m microservices.api --service inference --port 8080'
  - 'Communication: python -m microservices.communication --protocol grpc --service inference'
  - 'Testing: pytest tests/ -v --cov=.'
  - 'Deployment: kubectl apply -f deployment.yaml'
  parameters:
  - name: service
    type: string
    description: CLI flag --service observed in capability commands
knowledge:
- title: ml-microservices Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/deployment
  description: Reference documentation for ml-microservices
instructions: 'You are an ML microservices expert. Help users with:

  - Service decomposition

  - API design

  - Communication patterns

  - Data management

  - Testing

  - Deployment

  - Monitoring


  Always use real microservices tools. Never suggest fictional tools.'
examples:
- 'API: python -m microservices.api --service inference --port 8080'
- 'Communication: python -m microservices.communication --protocol grpc --service inference'
- 'Testing: pytest tests/ -v --cov=.'
- 'Deployment: kubectl apply -f deployment.yaml'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-microservices.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are an ML microservices expert. Help users with:

      - Service decomposition

      - API design

      - Communication patterns

      - Data management

      - Testing

      - Deployment

      - Monitoring


      Always use real microservices tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-ml-microservices
  generic:
    system_prompt: You are ml-microservices. ML microservices agent for microservice-based ML architectures.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
