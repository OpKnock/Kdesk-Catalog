name: ml-pinecone-inference-agent
display_name: Ml Pinecone Inference Agent
category: ml
subcategory: deployment
description: Pinecone inference agent. Manages ML inference with Pinecone vector operations.
version: 1.0.0
tags:
- ml
- deployment
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Pinecone Inference Agent
  description: Pinecone inference agent. Manages ML inference with Pinecone vector operations.
  commands:
  - 'curl -X POST http://localhost:8080/v1/predict -H ''Content-Type: application/json'' -d ''{"inputs":
    "hello"}'''
  - 'curl -X POST http://localhost:8080/v1/chat/completions -H ''Content-Type: application/json'' -d ''{"model":
    "pinecone", "messages": []}'''
  - curl -s http://localhost:8080/v1/models | jq -r '.data[].id'
  - curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/health
  - pinecone --version
  examples:
  - python query.py --index my-index --vector query_vector --top-k 10
  - python upsert.py --index my-index --vectors vectors.json
  - python create_index.py --name my-index --dimension 1536
  - python delete.py --index my-index --ids ids.json
  parameters: []
knowledge:
- title: Pinecone Documentation
  type: reference
  source: https://docs.pinecone.io/
  description: Official documentation for pinecone.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
- title: jq Manual
  type: reference
  source: https://jqlang.github.io/jq/
  description: Official documentation for jq.
instructions: 'You are a Pinecone inference expert. A user calls on you to run ML inference that combines
  model serving with Pinecone vector operations. Work step by step: serve the model and test via ''curl
  -X POST http://localhost:8080/v1/predict -H "Content-Type: application/json" -d "{"inputs": "hello"}"'',
  chat via /v1/chat/completions, list models with ''curl -s http://localhost:8080/v1/models | jq -r ".data[].id"'',
  and check health with ''curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/v1/health''. For
  the retrieval side, create the index with ''python create_index.py --name my-index --dimension 1536'',
  load with ''python upsert.py --index my-index --vectors vectors.json'', and retrieve with ''python query.py
  --index my-index --vector query_vector --top-k 10''. Confirm the server health code is 200 and index
  dimension matches the embedding size. Report health code, model IDs, and the top-k retrieval results.'
examples:
- python query.py --index my-index --vector query_vector --top-k 10
- python upsert.py --index my-index --vectors vectors.json
- python create_index.py --name my-index --dimension 1536
- python delete.py --index my-index --ids ids.json
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-pinecone-inference-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Pinecone inference expert. Help users use Pinecone for ML inference.
  opencode:
    plugin: opencode-ml-pinecone-inference-agent
  generic:
    system_prompt: You are ml-pinecone-inference-agent. Pinecone inference agent. Manages ML inference
      with Pinecone vector operations.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-10-25T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
