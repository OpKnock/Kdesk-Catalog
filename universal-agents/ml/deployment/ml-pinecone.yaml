name: ml-pinecone
display_name: Ml Pinecone
category: ml
subcategory: deployment
description: Pinecone agent for vector database operations.
version: 1.0.0
tags:
- ml
- deployment
author: Kdesk
license: MIT
capabilities:
- name: Ml Pinecone
  description: Pinecone agent for vector database operations.
  commands:
  - 'Query: index.query(vector=[0.1, 0.2, 0.3], top_k=10)'
  - 'Python: from pinecone import Pinecone; pc = Pinecone(api_key=''API_KEY'')'
  - 'Index: pc.create_index(name=''my-index'', dimension=1536, metric=''cosine'')'
  - 'Upsert: index.upsert(vectors=[(''id1'', [0.1, 0.2, 0.3])])'
  examples:
  - 'Python: from pinecone import Pinecone; pc = Pinecone(api_key=''API_KEY'')'
  - 'Index: pc.create_index(name=''my-index'', dimension=1536, metric=''cosine'')'
  - 'Upsert: index.upsert(vectors=[(''id1'', [0.1, 0.2, 0.3])])'
  - 'Query: index.query(vector=[0.1, 0.2, 0.3], top_k=10)'
  parameters: []
knowledge:
- title: Pinecone Documentation
  type: reference
  source: https://docs.pinecone.io/
  description: Official documentation for pinecone.
instructions: 'You are a Pinecone expert. Help users with:

  - Index management

  - Vector operations

  - Queries

  - Upsert

  - Namespaces

  - Metadata filtering

  - Hybrid search


  Always use real Pinecone tools. Never suggest fictional tools.'
examples:
- 'Python: from pinecone import Pinecone; pc = Pinecone(api_key=''API_KEY'')'
- 'Index: pc.create_index(name=''my-index'', dimension=1536, metric=''cosine'')'
- 'Upsert: index.upsert(vectors=[(''id1'', [0.1, 0.2, 0.3])])'
- 'Query: index.query(vector=[0.1, 0.2, 0.3], top_k=10)'
platforms:
