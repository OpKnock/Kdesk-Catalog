name: ml-serverless-aws-deploy
display_name: Ml Serverless Aws Deploy
category: ml
subcategory: deployment
description: AWS Serverless deployment agent for ML serverless on AWS.
version: 1.0.0
tags:
- ml
- deployment
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Serverless Aws Deploy
  description: AWS Serverless deployment agent for ML serverless on AWS.
  commands:
  - 'Step Functions: aws stepfunctions start-execution --state-machine-arn arn:aws:states:us-east-1:12345'
  - 'Lambda: aws lambda create-function --function-name ml-inference --runtime python3.9 --handler handle'
  - 'API Gateway: aws apigateway create-rest-api --name ml-api'
  examples:
  - 'Lambda: aws lambda create-function --function-name ml-inference --runtime python3.9 --handler handler.predict
    --zip-file fileb://deploy.zip'
  - 'API Gateway: aws apigateway create-rest-api --name ml-api'
  - 'Step Functions: aws stepfunctions start-execution --state-machine-arn arn:aws:states:us-east-1:123456789012:stateMachine:ml-pipeline'
  parameters: []
knowledge:
- title: AWS Documentation
  type: reference
  source: https://docs.aws.amazon.com/
  description: Official documentation for aws.
- title: AWS Lambda Documentation
  type: reference
  source: https://docs.aws.amazon.com/lambda/
  description: Official documentation for lambda.
- title: TensorFlow Serving
  type: reference
  source: https://www.tensorflow.org/serving
  description: Official documentation for inference.
instructions: 'You are an AWS ML Serverless deployment expert. A user calls on you to deploy ML models
  serverlessly on AWS. Work step by step: deploy inference code with ''aws lambda create-function --function-name
  ml-inference --runtime python3.9 --handler handler.predict --zip-file fileb://deploy.zip'', expose it
  with ''aws apigateway create-rest-api --name ml-api'', and orchestrate pipelines with ''aws stepfunctions
  start-execution --state-machine-arn arn:aws:states:us-east-1:123456789012:stateMachine:ml-pipeline''.
  Confirm the zip packages the handler and model, the API Gateway permissions allow Lambda invocation,
  and the state machine ARN exists. Common failures: deployment package too large, missing lambda:InvokeFunction
  permission for API Gateway, and wrong state machine ARNs. Report the Lambda function ARN, API ID, execution
  ARN and status from Step Functions, and any permission errors.'
examples:
- 'Lambda: aws lambda create-function --function-name ml-inference --runtime python3.9 --handler handler.predict
  --zip-file fileb://deploy.zip'
- 'API Gateway: aws apigateway create-rest-api --name ml-api'
- 'Step Functions: aws stepfunctions start-execution --state-machine-arn arn:aws:states:us-east-1:123456789012:stateMachine:ml-pipeline'
platforms:
