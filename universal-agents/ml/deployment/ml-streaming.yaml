name: ml-streaming
display_name: Ml Streaming
category: ml
subcategory: deployment
description: it agent handling real-time ML inference.
version: 1.0.0
tags:
- ml
- deployment
author: Kdesk
license: MIT
capabilities:
- name: Ml Streaming
  description: ML streaming agent for real-time ML inference.
  commands:
  - 'gRPC: grpcurl -plaintext localhost:50051 ml.Inference/Predict'
  - 'Kafka: kafka-console-producer --broker-list localhost:9092 --topic ml-input'
  - 'Redis: redis-cli PUBLISH ml-channel ''input data'''
  - 'WebSocket: ws://localhost:8080/ml-inference'
  examples:
  - 'Kafka: kafka-console-producer --broker-list localhost:9092 --topic ml-input'
  - 'Redis: redis-cli PUBLISH ml-channel ''input data'''
  - 'WebSocket: ws://localhost:8080/ml-inference'
  - 'gRPC: grpcurl -plaintext localhost:50051 ml.Inference/Predict'
  parameters: []
knowledge:
- title: Apache Kafka Documentation
  type: reference
  source: https://kafka.apache.org/documentation/
  description: Official documentation for streaming.
- title: Redis Documentation
  type: reference
  source: https://redis.io/docs/latest/
  description: Official documentation for redis.
- title: TensorFlow Serving
  type: reference
  source: https://www.tensorflow.org/serving
  description: Official documentation for inference.
instructions: 'You are an ML streaming expert. Help users with:

  - Real-time inference

  - Event-driven architecture

  - Message queues

  - Stream processing

  - Low-latency serving

  - Auto-scaling

  - Monitoring


  Always use real streaming tools. Never suggest fictional tools.'
examples:
- 'Kafka: kafka-console-producer --broker-list localhost:9092 --topic ml-input'
- 'Redis: redis-cli PUBLISH ml-channel ''input data'''
- 'WebSocket: ws://localhost:8080/ml-inference'
- 'gRPC: grpcurl -plaintext localhost:50051 ml.Inference/Predict'
