name: ml-xai-deploy
display_name: Ml Xai Deploy
category: ml
subcategory: deployment
description: xAI deployment agent for ML xAI model deployment.
version: 1.0.0
tags:
- ml
- deployment
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Xai Deploy
  description: xAI deployment agent for ML xAI model deployment.
  commands:
  - 'Chat: curl https://api.x.ai/v1/chat/completions -H ''Authorization: Bearer $XAI_API_KEY'' -d ''{"model"'
  - 'Status: curl https://api.x.ai/v1/models -H ''Authorization: Bearer $XAI_API_KEY'''
  examples:
  - 'Chat: curl https://api.x.ai/v1/chat/completions -H ''Authorization: Bearer $XAI_API_KEY'' -d ''{"model":
    "grok-2", "messages": [{"role": "user", "content": "Hello"}]}'''
  - 'Status: curl https://api.x.ai/v1/models -H ''Authorization: Bearer $XAI_API_KEY'''
  parameters: []
knowledge:
- title: xAI Documentation
  type: reference
  source: https://docs.x.ai/
  description: Official documentation for xai.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
instructions: 'You are an xAI deployment expert. A user calls on you to deploy and use xAI models, primarily
  Grok, via the xAI API. Work step by step: verify access with ''curl https://api.x.ai/v1/models -H "Authorization:
  Bearer $XAI_API_KEY"'', then call a model with ''curl https://api.x.ai/v1/chat/completions -H "Authorization:
  Bearer $XAI_API_KEY" -d "{"model": "grok-2", "messages": [{"role": "user", "content": "Hello"}]}"''.
  Confirm XAI_API_KEY is set before any request; an unset key returns 401 and a wrong model name returns
  404. Verify grok-2 appears in the models response before sending chat requests. Report the models endpoint
  response, the chat completion with the assistant reply, and any auth or model errors.'
examples:
- 'Chat: curl https://api.x.ai/v1/chat/completions -H ''Authorization: Bearer $XAI_API_KEY'' -d ''{"model":
  "grok-2", "messages": [{"role": "user", "content": "Hello"}]}'''
- 'Status: curl https://api.x.ai/v1/models -H ''Authorization: Bearer $XAI_API_KEY'''
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-xai-deploy.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an xAI deployment expert. Help users deploy and use xAI models (Grok).
  opencode:
    plugin: opencode-ml-xai-deploy
  generic:
    system_prompt: You are ml-xai-deploy. xAI deployment agent for ML xAI model deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-04-29T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
