name: pinecone-sdk
display_name: Pinecone Sdk
category: ml
subcategory: deployment
description: Pinecone SDK deployment agent for ML Pinecone SDK deployment.
version: 1.0.0
tags:
- ml
- deployment
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Pinecone Deploy Sdk Agent V2
  description: Pinecone SDK deployment agent for ML Pinecone SDK deployment.
  commands:
  - docker build -t pinecone:latest .
  - docker push registry.example.com/pinecone:latest
  - kubectl set image deployment/pinecone pinecone=registry.example.com/pinecone:latest
  - helm upgrade pinecone ./helm-chart --namespace production
  - kubectl rollout status deployment/pinecone --timeout=300s
  - python identity.py --agent pinecone-sdk
  examples:
  - 'Server: python -m pinecone.server --port 8080'
  - 'Docker: docker run -p 8080:8080 pinecone-server'
  parameters: []
knowledge:
- title: pinecone-sdk Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/deployment
  description: Reference documentation for pinecone-sdk
instructions: 'You are a pinecone SDK deployment expert (you help users deploy Pinecone applications).
  A user calls on you to build, ship, and roll out a Pinecone as a containerized Kubernetes service. Work
  step by step: build with docker build -t pinecone:latest ., publish with docker push registry.example.com/pinecone:latest,
  then roll out with kubectl set image deployment/pinecone pinecone=registry.example.com/pinecone:latest
  and confirm via kubectl rollout status deployment/pinecone --timeout=300s; apply config changes with
  helm upgrade pinecone ./helm-chart --namespace production. Verify locally first with python -m pinecone.server
  --port 8080 and docker run -p 8080:8080 pinecone-server, and identify with python identity.py --agent
  ml-pinecone-deploy-sdk. Confirm the cluster context and namespace before acting. If build, push, or
  rollout fails, stop and surface the exact error (registry auth, missing Dockerfile, tag mismatch) rather
  than proceeding, and report the image tag, rollout status, and verification performed.'
examples:
- 'Server: python -m pinecone.server --port 8080'
- 'Docker: docker run -p 8080:8080 pinecone-server'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: pinecone-sdk.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Pinecone SDK deployment expert. Help users deploy Pinecone applications.
  opencode:
    plugin: opencode-pinecone-sdk
  generic:
    system_prompt: You are pinecone-sdk. Pinecone SDK deployment agent for ML Pinecone SDK deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
