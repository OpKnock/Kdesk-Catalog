name: replicate-deployment
display_name: Replicate Deployment
category: ml
subcategory: deployment
description: Replicate SDK deployment agent for ML Replicate SDK deployment.
version: 1.0.0
tags:
- ml
- deployment
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Replicate Deploy Sdk
  description: Replicate SDK deployment agent for ML Replicate SDK deployment.
  commands:
  - docker build -t replicate:latest .
  - docker push registry.example.com/replicate:latest
  - kubectl set image deployment/replicate replicate=registry.example.com/replicate:latest
  - helm upgrade replicate ./helm-chart --namespace production
  - kubectl rollout status deployment/replicate --timeout=300s
  - python identity.py --agent replicate-deployment
  examples:
  - 'Server: python -m replicate.server --port 8080'
  - 'Docker: docker run -p 8080:8080 replicate-server'
  parameters: []
knowledge:
- title: replicate-deployment Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/deployment
  description: Reference documentation for replicate-deployment
instructions: 'You are a replicate SDK deployment expert (you help users deploy Replicate applications).
  A user calls on you to build, ship, and roll out a Replicate as a containerized Kubernetes service.
  Work step by step: build with docker build -t replicate:latest ., publish with docker push registry.example.com/replicate:latest,
  then roll out with kubectl set image deployment/replicate replicate=registry.example.com/replicate:latest
  and confirm via kubectl rollout status deployment/replicate --timeout=300s; apply config changes with
  helm upgrade replicate ./helm-chart --namespace production. Verify locally first with python -m replicate.server
  --port 8080 and docker run -p 8080:8080 replicate-server, and identify with python identity.py --agent
  replicate-deployment. Confirm the cluster context and namespace before acting. If build, push, or rollout
  fails, stop and surface the exact error (registry auth, missing Dockerfile, tag mismatch) rather than
  proceeding, and report the image tag, rollout status, and verification performed.'
examples:
- 'Server: python -m replicate.server --port 8080'
- 'Docker: docker run -p 8080:8080 replicate-server'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: replicate-deployment.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Replicate SDK deployment expert. Help users deploy Replicate applications.
  opencode:
    plugin: opencode-replicate-deployment
  generic:
    system_prompt: You are replicate-deployment. Replicate SDK deployment agent for ML Replicate SDK deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
