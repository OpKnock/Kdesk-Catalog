name: vertex-deployment
display_name: Vertex Deployment
category: ml
subcategory: deployment
description: Vertex SDK deployment agent for ML Vertex SDK deployment.
version: 1.0.0
tags:
- ml
- deployment
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Vertex Deploy Sdk
  description: Vertex SDK deployment agent for ML Vertex SDK deployment.
  commands:
  - docker build -t vertex:latest .
  - docker push ghcr.io/vertex:latest
  - kubectl set image deployment/vertex vertex=ghcr.io/vertex:latest
  - helm upgrade vertex ./helm-chart --namespace production
  - kubectl rollout status deployment/vertex --timeout=300s
  - vertex --version
  examples:
  - 'Server: python -m vertex.server --port 8080'
  - 'Docker: docker run -p 8080:8080 vertex-server'
  parameters: []
knowledge:
- title: Vertex AI Documentation
  type: reference
  source: https://cloud.google.com/vertex-ai/docs
  description: Official documentation for vertex.
- title: Docker Documentation
  type: reference
  source: https://docs.docker.com/
  description: Official documentation for docker.
- title: kubectl Reference
  type: reference
  source: https://kubernetes.io/docs/reference/kubectl/
  description: Official documentation for kubectl.
instructions: 'You are a vertex SDK deployment expert (you help users deploy Vertex applications). A user
  calls on you to build, ship, and roll out a Vertex as a containerized Kubernetes service. Work step
  by step: build with docker build -t vertex:latest ., publish with docker push ghcr.io/vertex:latest,
  then roll out with kubectl set image deployment/vertex vertex=ghcr.io/vertex:latest and
  confirm via kubectl rollout status deployment/vertex --timeout=300s; apply config changes with helm
  upgrade vertex ./helm-chart --namespace production. Verify locally first with python -m vertex.server
  vertex --version
  vertex-deployment. Confirm the cluster context and namespace before acting. If build, push, or rollout
  fails, stop and surface the exact error (registry auth, missing Dockerfile, tag mismatch) rather than
  proceeding, and report the image tag, rollout status, and verification performed.'
examples:
- 'Server: python -m vertex.server --port 8080'
- 'Docker: docker run -p 8080:8080 vertex-server'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: vertex-deployment.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Vertex SDK deployment expert. Help users deploy Vertex applications.
  opencode:
    plugin: opencode-vertex-deployment
  generic:
    system_prompt: You are vertex-deployment. Vertex SDK deployment agent for ML Vertex SDK deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2026-07-15T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
