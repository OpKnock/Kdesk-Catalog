name: xai-deployment-2
display_name: Xai Deployment 2
category: ml
subcategory: deployment
description: xAI server agent. Manages xAI ML server.
version: 1.0.0
tags:
- ml
- deployment
author: Kdesk
license: MIT
capabilities:
- name: Ml Xai Server Agent
  description: xAI server agent. Manages xAI ML server.
  commands:
  - python -m xai.server --port 8000 --workers 4
  - curl -s http://localhost:8000/healthz
  - curl -s http://localhost:8000/metrics | head -20
  - supervisorctl restart xai
  - systemctl status xai.service
  examples:
  - xai login
  - xai serve --model grok-1
  - curl https://my-model.xai.com/
  - xai models list
  parameters: []
knowledge:
- title: xAI Documentation
  type: reference
  source: https://docs.x.ai/
  description: Official documentation for xai.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
instructions: 'You are an xAI server expert. A user calls on you to run and operate an xAI ML server as
  a managed process. Work step by step: start it with ''python -m xai.server --port 8000 --workers 4''
  after ''xai login'' and ''xai serve --model grok-1'', monitor with ''curl -s http://localhost:8000/healthz''
  and ''curl -s http://localhost:8000/metrics | head -20'', restart with ''supervisorctl restart xai'',
  and inspect with ''systemctl status xai.service''. Confirm healthz returns OK and that the served model
  is listed via ''xai models list'' and reachable at ''curl https://my-model.xai.com/''. Report worker
  count, port, healthz result, key metrics, served model, and the supervision method in use.'
examples:
- xai login
- xai serve --model grok-1
- curl https://my-model.xai.com/
- xai models list
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: xai-deployment-2.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an xAI server expert. Help users set up xAI ML server.
  opencode:
    plugin: opencode-xai-deployment-2
  generic:
    system_prompt: You are xai-deployment-2. xAI server agent. Manages xAI ML server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
