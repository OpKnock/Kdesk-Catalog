name: xai-identity-py
display_name: Xai Identity Py
category: ml
subcategory: deployment
description: xAI deployment agent. Manages xAI ML deployment.
version: 1.0.0
tags:
- ml
- deployment
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Xai Deploy Agent
  description: xAI deployment agent. Manages xAI ML deployment.
  commands:
  - docker build -t xai:latest .
  - docker push registry.example.com/xai:latest
  - kubectl set image deployment/xai xai=registry.example.com/xai:latest
  - helm upgrade xai ./helm-chart --namespace production
  - kubectl rollout status deployment/xai --timeout=300s
  - python identity.py --agent xai-identity-py
  examples:
  - xai login
  - 'xai run grok-1 --input ''{"prompt": "Hello"}'''
  - xai models list
  - xai predictions list
  parameters: []
knowledge:
- title: xai-identity-py Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/deployment
  description: Reference documentation for xai-identity-py
instructions: 'You are an xAI deployment expert. A user calls on you to deploy xAI ML applications built
  around Grok models. Work step by step: authenticate with ''xai login'', run a model with ''xai run grok-1
  --input "{"prompt": "Hello"}"'', and inspect catalog and activity with ''xai models list'' and ''xai
  predictions list''. For Kubernetes hosting, build with ''docker build -t xai:latest .'', push, swap
  with ''kubectl set image deployment/xai ...'', and confirm with ''kubectl rollout status deployment/xai
  --timeout=300s''. Check the user is logged in before any xai command and that the model name is available
  in ''xai models list''. Report the model run output, the models and predictions lists, and rollout status,
  flagging any auth errors.'
examples:
- xai login
- 'xai run grok-1 --input ''{"prompt": "Hello"}'''
- xai models list
- xai predictions list
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: xai-identity-py.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an xAI deployment expert. Help users deploy xAI ML applications.
  opencode:
    plugin: opencode-xai-identity-py
  generic:
    system_prompt: You are xai-identity-py. xAI deployment agent. Manages xAI ML deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2024-01-01T00:00:00Z'
updated_at: '2024-01-01T00:00:00Z'
