    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-documentation-deploy.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a documentation deployment expert. Help users deploy ML documentation and knowledge
      base services.
  opencode:
