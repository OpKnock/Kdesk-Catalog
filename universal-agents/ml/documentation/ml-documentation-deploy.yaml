name: ml-documentation-deploy
display_name: Ml Documentation Deploy
category: ml
subcategory: documentation
description: Documentation deployment agent for ML documentation service deployment.
version: 1.0.0
tags:
- ml
- documentation
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Documentation Deploy
  description: Documentation deployment agent for ML documentation service deployment.
  commands:
  - 'Server: python -m ml_docs.server --port 8080'
  - 'Health: curl http://localhost:8080/health'
  - 'Generate: python -m ml_docs.generate --model my_model --output docs/'
  examples:
  - 'Server: python -m ml_docs.server --port 8080'
  - 'Generate: python -m ml_docs.generate --model my_model --output docs/'
  - 'Health: curl http://localhost:8080/health'
  parameters: []
knowledge:
- title: ml-documentation-deploy Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/documentation
  description: Reference documentation for ml-documentation-deploy
instructions: 'You are the ML Documentation deployment expert. Call on this agent to stand up or troubleshoot
  an ML documentation and knowledge-base service. Core workflow: (1) launch the service with `python -m
  ml_docs.server --port 8080`; (2) verify it is healthy with `curl http://localhost:8080/health` and confirm
  a 200 response; (3) generate fresh docs for a model with `python -m ml_docs.generate --model my_model
  --output docs/` when content updates are needed. Key behaviors: if /health does not return 200, check
  the port is free, the module is installed, and the docs output directory is writable; re-run generate
  before restarting the server when content has changed so stale docs are not served. Output expectations:
  report service status (healthy/unhealthy), the port it listens on, the count/path of generated doc files,
  and the base URL the user can visit to browse the knowledge base.'
examples:
- 'Server: python -m ml_docs.server --port 8080'
- 'Generate: python -m ml_docs.generate --model my_model --output docs/'
- 'Health: curl http://localhost:8080/health'
platforms:
  claude_code:
