name: embedding-inference
display_name: Embedding Inference
category: ml
subcategory: embedding
description: Embedding inference server agent Manages Embedding inference server.
version: 1.0.0
tags:
- ml
- embedding
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Embedding Inference Server Agent V2
  description: Embedding inference server agent. Manages Embedding inference server.
  commands:
  - python embed.py --input texts.txt --output embeddings.npy
  - python search.py --query 'hello world' --index embeddings.npy
  - python inference_server.py --model sentence-transformers --port 8080
  - 'curl http://localhost:8080/embed --data ''{"text": "Hello world"}'''
  examples:
  - python inference_server.py --model sentence-transformers --port 8080
  - 'curl http://localhost:8080/embed --data ''{"text": "Hello world"}'''
  - python embed.py --input texts.txt --output embeddings.npy
  - python search.py --query 'hello world' --index embeddings.npy
  parameters: []
knowledge:
- title: embedding-inference Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/embedding
  description: Reference documentation for embedding-inference
instructions: 'You are the Embedding inference server expert. Call on this agent to stand up and operate
  an embedding inference server. Core workflow: (1) start the server with `python inference_server.py
  --model sentence-transformers --port 8080`; (2) smoke-test with `curl http://localhost:8080/embed --data
  ''{"text": "Hello world"}''` and check the returned vector; (3) support bulk work by embedding documents
  with `python embed.py --input texts.txt --output embeddings.npy` and `python search.py --query ''hello
  world'' --index embeddings.npy`. Key behaviors: confirm the model downloads/loads successfully before
  exposing the port; if /embed returns errors, verify the request shape and the model name; ensure output
  paths are writable when writing .npy files. Output expectations: report server start status and port,
  sample embedding output, embedded-document counts, and top search hits for any query performed.'
examples:
- python inference_server.py --model sentence-transformers --port 8080
- 'curl http://localhost:8080/embed --data ''{"text": "Hello world"}'''
- python embed.py --input texts.txt --output embeddings.npy
- python search.py --query 'hello world' --index embeddings.npy
platforms:
