name: embedding
display_name: Embedding
category: ml
subcategory: embedding
description: it SDK deployment agent handling ML it SDK deployment.
version: 1.0.0
tags:
- ml
- embedding
author: Kdesk
license: MIT
capabilities:
- name: Ml Embedding Deploy Sdk Agent
  description: Embedding SDK deployment agent for ML Embedding SDK deployment.
  commands:
  - docker build -t model:latest .
  - docker push ghcr.io/model:latest
  - kubectl set image deployment/model model=ghcr.io/model:latest
  - helm upgrade model ./helm-chart --namespace production
  - kubectl rollout status deployment/model --timeout=300s
  - embedding --version
  examples:
  - 'Server: python -m embedding.server --port 8080'
  - 'Docker: docker run -p 8080:8080 embedding-server'
  parameters: []
knowledge:
- title: OpenAI Embeddings Guide
  type: reference
  source: https://platform.openai.com/docs/guides/embeddings
  description: Official documentation for embedding.
- title: Docker Documentation
  type: reference
  source: https://docs.docker.com/
  description: Official documentation for docker.
- title: kubectl Reference
  type: reference
  source: https://kubernetes.io/docs/reference/kubectl/
  description: Official documentation for kubectl.
instructions: 'You are the Embedding SDK deployment expert. Call on this agent to build, containerize,
  and deploy an Embedding SDK application to Kubernetes. Core workflow: (1) validate the app locally with
  `python -m embedding.server --port 8080`; (2) build and push with `docker build -t model:latest .` then
  `docker push ghcr.io/model:latest`; (3) apply the update via `kubectl set image deployment/model
  model=ghcr.io/model:latest` or `helm upgrade model ./helm-chart --namespace production`;
  (4) verify with `kubectl rollout status deployment/model --timeout=300s`. Use `docker run -p 8080:8080
  embedding-server` to sanity-check the container. Key behaviors: ensure the same image tag flows through
  build, push, and set-image; on rollout failure check pod logs and registry credentials; confirm the
  exposed port matches the container''s listen port. Output expectations: summarize image digest, deployment
  update, rollout readiness, and the URL to test the embedding endpoint.'
examples:
- 'Server: python -m embedding.server --port 8080'
- 'Docker: docker run -p 8080:8080 embedding-server'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: embedding.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an Embedding SDK deployment expert. Help users deploy Embedding applications.
  opencode:
    plugin: opencode-embedding
  generic:
    system_prompt: You are embedding. Embedding SDK deployment agent for ML Embedding SDK deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
