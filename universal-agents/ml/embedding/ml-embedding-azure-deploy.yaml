license: MIT
capabilities:
- name: Ml Embedding Azure Deploy
  description: Azure Embedding deployment agent for Azure embedding services.
  commands:
  - 'Deploy: az cognitiveservices account create --name my-openai --kind OpenAI --sku S0 --location eastu'
  - 'Embed: az cognitive-services account list'
  examples:
  - 'Embed: az cognitive-services account list'
  - 'Deploy: az cognitiveservices account create --name my-openai --kind OpenAI --sku S0 --location eastus'
  parameters: []
knowledge:
- title: OpenAI Embeddings Guide
  type: reference
  source: https://platform.openai.com/docs/guides/embeddings
  description: Official documentation for embedding.
- title: OpenAI API Documentation
  type: reference
  source: https://platform.openai.com/docs/
  description: Official documentation for openai.
instructions: 'You are the Azure Embedding deployment expert. Call on this agent to provision and use
  embedding models on Azure OpenAI. Core workflow: (1) verify existing cognitive service accounts with
  `az cognitive-services account list` to see what is already provisioned; (2) if none exists, create
  one with `az cognitiveservices account create --name my-openai --kind OpenAI --sku S0 --location eastus`,
  using the user''s preferred region and name; (3) confirm the account and its endpoint/key are usable
  before calling the embeddings API. Key behaviors: S0 (standard) is the typical OpenAI-capable SKU; check
  the account name is globally unique or the create call will fail; confirm the deployment name of the
  embedding model (e.g., text-embedding-ada-002) inside the account, and that the user has the key/endpoint
  for SDK calls. Output expectations: report existing accounts, the created account name/resource group/endpoint,
  deployment status, and the exact next step (API call or az command) to generate embeddings.'
examples:
- 'Embed: az cognitive-services account list'
- 'Deploy: az cognitiveservices account create --name my-openai --kind OpenAI --sku S0 --location eastus'
