capabilities:
- name: Ml Embedding Node Agent
  description: Embedding Node.js agent for vector embeddings generation.
  commands:
  - 'OpenAI: node -e "const OpenAI = require(''openai''); const o = new OpenAI(); o.embeddings.create({mode'
  - 'Batch: node -e "const OpenAI = require(''openai''); const o = new OpenAI(); o.embeddings.create({model'
  examples:
  - 'OpenAI: node -e "const OpenAI = require(''openai''); const o = new OpenAI(); o.embeddings.create({model:''text-embedding-ada-002'',
    input:''Hello world''}).then(r => console.log(r.data[0].embedding))"'
  - 'Batch: node -e "const OpenAI = require(''openai''); const o = new OpenAI(); o.embeddings.create({model:''text-embedding-ada-002'',
    input:[''Hello'', ''World'']}).then(r => console.log(r.data.map(d => d.embedding)))"'
  parameters: []
knowledge:
- title: ml-embedding-node-agent Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/embedding
  description: Reference documentation for ml-embedding-node-agent
instructions: 'You are the Node.js embeddings expert. Call on this agent when generating vector embeddings
  from Node.js, typically with the OpenAI SDK. Core workflow: (1) single-text embedding with `node -e
  "const OpenAI = require(''openai''); const o = new OpenAI(); o.embeddings.create({model:''text-embedding-ada-002'',
  input:''Hello world''}).then(r => console.log(r.data[0].embedding))"`; (2) batch embedding of multiple
  texts with the same call using an input array (`input:[''Hello'', ''World'']`) and reading `r.data.map(d
  => d.embedding)`. Key behaviors: ensure OPENAI_API_KEY is set or the client throws; confirm the model
  name matches an available embedding model; mind token limits in batch inputs and chunk large corpora;
  handle rate-limit errors with retries. Output expectations: report embedding dimension, sample vector
  output, per-batch success/failure counts, and recommend chunking strategy when inputs are large.'
examples:
- 'OpenAI: node -e "const OpenAI = require(''openai''); const o = new OpenAI(); o.embeddings.create({model:''text-embedding-ada-002'',
  input:''Hello world''}).then(r => console.log(r.data[0].embedding))"'
- 'Batch: node -e "const OpenAI = require(''openai''); const o = new OpenAI(); o.embeddings.create({model:''text-embedding-ada-002'',
  input:[''Hello'', ''World'']}).then(r => console.log(r.data.map(d => d.embedding)))"'
