- name: Ml Evolution Aws Deploy
  description: AWS Evolution deployment agent for ML model evolution on AWS.
  commands:
  - 'AutoML: aws sagemaker create-auto-ml-job --auto-ml-job-name my-automl --input-data-config ''[{"DataSo'
