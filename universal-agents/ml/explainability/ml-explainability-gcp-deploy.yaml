name: ml-explainability-gcp-deploy
display_name: Ml Explainability Gcp Deploy
category: ml
subcategory: explainability
description: GCP Explainability deployment agent for ML explainability on GCP.
version: 1.0.0
tags:
- ml
- explainability
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Explainability Gcp Deploy
  description: GCP Explainability deployment agent for ML explainability on GCP.
  commands:
  - 'Explain: gcloud ai explain-prediction --project my-project --region us-central1 --model my-model
    --j'
  - 'Metadata: gcloud ai explain-metadata --project my-project --region us-central1 --metadata-schema
    sch'
  examples:
  - 'Explain: gcloud ai explain-prediction --project my-project --region us-central1 --model my-model
    --json-instance instance.json'
  - 'Metadata: gcloud ai explain-metadata --project my-project --region us-central1 --metadata-schema
    schema.yaml'
  parameters:
  - name: project
    type: string
    description: CLI flag --project observed in capability commands
  - name: region
    type: string
    description: CLI flag --region observed in capability commands
knowledge:
- title: SHAP Documentation
  type: reference
  source: https://shap.readthedocs.io/en/latest/
  description: Official documentation for explainability.
- title: GitHub Projects Documentation
  type: reference
  source: https://docs.github.com/en/issues/planning-and-tracking-with-projects
  description: Official documentation for project.
instructions: 'You are the GCP ML Explainability deployment expert. Call on this agent to run explainability
  on Vertex AI. Core workflow: (1) prepare the explanation metadata with `gcloud ai explain-metadata --project
  my-project --region us-central1 --metadata-schema schema.yaml`, validating the schema file; (2) run
  explanations with `gcloud ai explain-prediction --project my-project --region us-central1 --model my-model
  --json-instance instance.json`. Key behaviors: the model must be deployed with explanation settings
  enabled or explain-prediction fails; confirm the instance JSON matches the model''s input signature;
  verify the region and project flags on every call; check IAM roles (aiplatform.user). Output expectations:
  report the metadata schema validation result, the attribution values returned per feature for the prediction,
  and any model/explanation configuration errors.'
examples:
- 'Explain: gcloud ai explain-prediction --project my-project --region us-central1 --model my-model --json-instance
  instance.json'
- 'Metadata: gcloud ai explain-metadata --project my-project --region us-central1 --metadata-schema schema.yaml'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-explainability-gcp-deploy.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a GCP ML Explainability deployment expert. Help users deploy ML explainability
      on Vertex AI.
  opencode:
    plugin: opencode-ml-explainability-gcp-deploy
  generic:
    system_prompt: You are ml-explainability-gcp-deploy. GCP Explainability deployment agent for ML explainability
      on GCP.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
