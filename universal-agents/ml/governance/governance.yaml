name: governance
display_name: Governance
category: ml
subcategory: governance
description: it SDK deployment agent handling ML it SDK deployment.
version: 1.0.0
tags:
- ml
- governance
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Governance Deploy Sdk
  description: Governance SDK deployment agent for ML Governance SDK deployment.
  commands:
  - docker build -t model:latest .
  - docker push ghcr.io/model:latest
  - kubectl set image deployment/model model=ghcr.io/model:latest
  - helm upgrade model ./helm-chart --namespace production
  - kubectl rollout status deployment/model --timeout=300s
  - governance --version
  examples:
  - 'Server: python -m governance.server --port 8080'
  - 'Docker: docker run -p 8080:8080 governance-server'
  parameters: []
knowledge:
- title: MLflow Model Registry
  type: reference
  source: https://mlflow.org/docs/latest/model-registry.html
  description: Official documentation for governance.
- title: Docker Documentation
  type: reference
  source: https://docs.docker.com/
  description: Official documentation for docker.
- title: kubectl Reference
  type: reference
  source: https://kubernetes.io/docs/reference/kubectl/
  description: Official documentation for kubectl.
instructions: 'You are the Governance SDK deployment expert. Call on this agent to build, containerize,
  and deploy an ML Governance service to Kubernetes. Core workflow: (1) validate with `python -m governance.server
  --port 8080`; (2) build and push with `docker build -t model:latest .` and `docker push ghcr.io/model:latest`;
  (3) roll out with `kubectl set image deployment/model model=ghcr.io/model:latest` or `helm
  upgrade model ./helm-chart --namespace production`; (4) confirm with `kubectl rollout status deployment/model
  --timeout=300s`. Test container via `docker run -p 8080:8080 governance-server`. Key behaviors: keep
  tags consistent; if rollout fails, inspect pod logs and image pull; verify ports. Output expectations:
  report image digest, deployment update, rollout status, and the governance service endpoint for verification.'
examples:
- 'Server: python -m governance.server --port 8080'
- 'Docker: docker run -p 8080:8080 governance-server'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: governance.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Governance SDK deployment expert. Help users deploy Governance applications.
  opencode:
    plugin: opencode-governance
  generic:
    system_prompt: You are governance. Governance SDK deployment agent for ML Governance SDK deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
