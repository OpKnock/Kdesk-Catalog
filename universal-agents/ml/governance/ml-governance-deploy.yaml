name: ml-governance-deploy
display_name: Ml Governance Deploy
category: ml
subcategory: governance
description: Governance deployment agent for ML governance service deployment.
version: 1.0.0
tags:
- ml
- governance
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Governance Deploy
  description: Governance deployment agent for ML governance service deployment.
  commands:
  - 'API: curl http://localhost:8080/governance -X POST -H ''Content-Type: application/json'' -d ''{"model":'
  - 'Health: curl http://localhost:8080/health'
  - 'Server: python -m governance.server --port 8080'
  - 'Status: python -m governance.status --server http://localhost:8080'
  examples:
  - 'Server: python -m governance.server --port 8080'
  - 'API: curl http://localhost:8080/governance -X POST -H ''Content-Type: application/json'' -d ''{"model":
    "my_model", "policy": "compliance"}'''
  - 'Health: curl http://localhost:8080/health'
  - 'Status: python -m governance.status --server http://localhost:8080'
  parameters: []
knowledge:
- title: ml-governance-deploy Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/governance
  description: Reference documentation for ml-governance-deploy
instructions: 'You are a governance deployment expert. Help users with:

  - Governance service deployment

  - API server

  - Scaling

  - Monitoring

  - Backup/restore

  - Security

  - Cost optimization


  Always use real governance deployment tools. Never suggest fictional tools.'
examples:
- 'Server: python -m governance.server --port 8080'
- 'API: curl http://localhost:8080/governance -X POST -H ''Content-Type: application/json'' -d ''{"model":
  "my_model", "policy": "compliance"}'''
- 'Health: curl http://localhost:8080/health'
- 'Status: python -m governance.status --server http://localhost:8080'
