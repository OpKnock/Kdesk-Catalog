name: langchain-inference-3
display_name: Langchain Inference 3
category: ml
subcategory: inference
description: LangChain server agent. Manages LangChain ML server.
version: 1.0.0
tags:
- ml
- inference
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Langchain Server Agent
  description: LangChain server agent. Manages LangChain ML server.
  commands:
  - python -m langchain.server --port 8000 --workers 4
  - curl -s http://localhost:8000/healthz
  - curl -s http://localhost:8000/metrics | head -20
  - supervisorctl restart langchain
  - systemctl status langchain.service
  examples:
  - python -m langchain serve --port 8080
  - python run_chain.py --chain qa --query 'What is AI?'
  - python run_agent.py --agent search --query 'latest news'
  - python test_chain.py --chain qa
  parameters: []
knowledge:
- title: langchain-inference-3 Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/inference
  description: Reference documentation for langchain-inference-3
instructions: 'You are the LangChain server expert. Call on this agent to operate a LangChain ML server
  in production-like conditions. Core workflow: (1) start with `python -m langchain.server --port 8000
  --workers 4`; (2) verify liveness with `curl -s http://localhost:8000/healthz` and inspect load with
  `curl -s http://localhost:8000/metrics | head -20`; (3) on failures restart via `supervisorctl restart
  langchain` or check `systemctl status langchain.service`. Key behaviors: treat non-200 healthz as down;
  inspect metrics before restarting; confirm worker count fits resources; if supervisorctl/systemctl are
  unavailable use the project''s process manager. Output expectations: report process state, healthz response,
  notable metrics, and the restart/status commands run plus their results.'
examples:
- python -m langchain serve --port 8080
- python run_chain.py --chain qa --query 'What is AI?'
- python run_agent.py --agent search --query 'latest news'
- python test_chain.py --chain qa
