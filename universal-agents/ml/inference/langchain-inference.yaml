name: langchain-inference
display_name: Langchain Inference
category: ml
subcategory: inference
description: LangChain SDK deployment agent for ML LangChain SDK deployment.
version: 1.0.0
tags:
- ml
- inference
author: Kdesk
license: MIT
capabilities:
- name: Ml Langchain Deploy Sdk Agent
  description: LangChain SDK deployment agent for ML LangChain SDK deployment.
  commands:
  - docker build -t langchain:latest .
  - docker push ghcr.io/langchain:latest
  - kubectl set image deployment/langchain langchain=ghcr.io/langchain:latest
  - helm upgrade langchain ./helm-chart --namespace production
  - kubectl rollout status deployment/langchain --timeout=300s
  - langchain --version
  examples:
  - 'Server: python -m langchain.server --port 8080'
  - 'Docker: docker run -p 8080:8080 langchain-server'
  parameters: []
knowledge:
- title: LangChain Documentation
  type: reference
  source: https://python.langchain.com/docs/
  description: Official documentation for langchain.
- title: Docker Documentation
  type: reference
  source: https://docs.docker.com/
  description: Official documentation for docker.
- title: kubectl Reference
  type: reference
  source: https://kubernetes.io/docs/reference/kubectl/
  description: Official documentation for kubectl.
instructions: 'You are the LangChain SDK deployment expert. Call on this agent to build, containerize,
  and deploy a LangChain SDK application to Kubernetes. Core workflow: (1) validate locally with `python
  -m langchain.server --port 8080`; (2) build and push with `docker build -t langchain:latest .` and `docker
  push ghcr.io/langchain:latest`; (3) update with `kubectl set image deployment/langchain
  langchain=ghcr.io/langchain:latest` or `helm upgrade langchain ./helm-chart --namespace
  production`; (4) confirm with `kubectl rollout status deployment/langchain --timeout=300s`. Test the
  container with `docker run -p 8080:8080 langchain-server`. Key behaviors: maintain tag consistency;
  if rollout fails, inspect pod logs and registry credentials; verify the container port maps to 8080.
  Output expectations: report image digest, deployment update, rollout readiness, and the URL to verify
  the LangChain service.'
examples:
- 'Server: python -m langchain.server --port 8080'
- 'Docker: docker run -p 8080:8080 langchain-server'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: langchain-inference.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a LangChain SDK deployment expert. Help users deploy LangChain applications.
  opencode:
    plugin: opencode-langchain-inference
  generic:
    system_prompt: You are langchain-inference. LangChain SDK deployment agent for ML LangChain SDK deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-11-02T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
