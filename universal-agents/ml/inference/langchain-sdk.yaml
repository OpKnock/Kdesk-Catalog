name: langchain-sdk
display_name: Langchain Sdk
category: ml
subcategory: inference
description: LangChain SDK deployment agent for ML LangChain SDK deployment.
version: 1.0.0
tags:
- ml
- inference
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Langchain Deploy Sdk Agent V2
  description: LangChain SDK deployment agent for ML LangChain SDK deployment.
  commands:
  - docker build -t langchain:latest .
  - docker push registry.example.com/langchain:latest
  - kubectl set image deployment/langchain langchain=registry.example.com/langchain:latest
  - helm upgrade langchain ./helm-chart --namespace production
  - kubectl rollout status deployment/langchain --timeout=300s
  - python identity.py --agent langchain-sdk
  examples:
  - 'Server: python -m langchain.server --port 8080'
  - 'Docker: docker run -p 8080:8080 langchain-server'
  parameters: []
knowledge:
- title: langchain-sdk Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/inference
  description: Reference documentation for langchain-sdk
instructions: 'You are the LangChain SDK deployment expert. Call on this agent to build, containerize,
  and deploy a LangChain SDK application to Kubernetes. Core workflow: (1) validate locally with `python
  -m langchain.server --port 8080`; (2) build and push with `docker build -t langchain:latest .` and `docker
  push registry.example.com/langchain:latest`; (3) update with `kubectl set image deployment/langchain
  langchain=registry.example.com/langchain:latest` or `helm upgrade langchain ./helm-chart --namespace
  production`; (4) confirm with `kubectl rollout status deployment/langchain --timeout=300s`. Test the
  container with `docker run -p 8080:8080 langchain-server`. Key behaviors: maintain tag consistency;
  on rollout timeout check pod logs and image pull; verify port alignment. Output expectations: report
  image digest, deployment update, rollout status, and the endpoint for a smoke test.'
examples:
- 'Server: python -m langchain.server --port 8080'
- 'Docker: docker run -p 8080:8080 langchain-server'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: langchain-sdk.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a LangChain SDK deployment expert. Help users deploy LangChain applications.
  opencode:
    plugin: opencode-langchain-sdk
  generic:
    system_prompt: You are langchain-sdk. LangChain SDK deployment agent for ML LangChain SDK deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2024-01-01T00:00:00Z'
updated_at: '2024-01-01T00:00:00Z'
