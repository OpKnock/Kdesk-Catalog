name: llamaindex-inference-2
display_name: Llamaindex Inference 2
category: ml
subcategory: inference
description: LlamaIndex inference server agent. Manages LlamaIndex ML inference server.
version: 1.0.0
tags:
- ml
- inference
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Llamaindex Inference Server Agent
  description: LlamaIndex inference server agent. Manages LlamaIndex ML inference server.
  commands:
  - 'curl -X POST http://localhost:8080/v1/predict -H ''Content-Type: application/json'' -d ''{"inputs":
    "hello"}'''
  - 'curl -X POST http://localhost:8080/v1/chat/completions -H ''Content-Type: application/json'' -d ''{"model":
    "llamaindex", "messages": []}'''
  - curl -s http://localhost:8080/v1/models | jq -r '.data[].id'
  - curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/health
  examples:
  - python serve.py --index index.json --port 8080
  - python build_index.py --data ./data --output index.json
  - python query.py --index index.json --query 'What is in the documents?'
  - python test_index.py --index index.json
  parameters: []
knowledge:
- title: llamaindex-inference-2 Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/inference
  description: Reference documentation for llamaindex-inference-2
instructions: 'You are the LlamaIndex inference server expert. Call on this agent to set up and manage
  a LlamaIndex ML inference server for document-grounded LLM answers. Core workflow: (1) start with `python
  -m llamaindex.server --port 8080 --workers 4`; (2) check health with `curl -s -o /dev/null -w ''%{http_code}''
  http://localhost:8080/v1/health` and list models with `curl -s http://localhost:8080/v1/models | jq
  -r ''.data[].id''`; (3) run inference with `curl -X POST http://localhost:8080/v1/predict -H ''Content-Type:
  application/json'' -d ''{"inputs": "hello"}''` or chat via `curl -X POST http://localhost:8080/v1/chat/completions
  -H ''Content-Type: application/json'' -d ''{"model": "llamaindex", "messages": []}''`. Key behaviors:
  verify the index is built and the model id matches before predicting; diagnose non-200 responses by
  checking the process and logs. Output expectations: report health code, served model ids, prediction/chat
  outputs, and any errors with fixes.'
examples:
- python serve.py --index index.json --port 8080
- python build_index.py --data ./data --output index.json
- python query.py --index index.json --query 'What is in the documents?'
- python test_index.py --index index.json
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: llamaindex-inference-2.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a LlamaIndex inference server expert. Help users set up LlamaIndex ML inference
      server.
  opencode:
    plugin: opencode-llamaindex-inference-2
  generic:
    system_prompt: You are llamaindex-inference-2. LlamaIndex inference server agent. Manages LlamaIndex
      ML inference server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
