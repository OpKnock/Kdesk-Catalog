name: llamaindex-rag
display_name: Llamaindex Rag
category: ml
subcategory: inference
description: LlamaIndex RAG agent. Manages retrieval-augmented generation with LlamaIndex.
version: 1.0.0
tags:
- ml
- inference
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Llamaindex Rag Agent
  description: LlamaIndex RAG agent. Manages retrieval-augmented generation with LlamaIndex.
  commands:
  - python build_rag_index.py --data ./docs --collection llamaindex-rag --chunk 512
  - python query_rag.py --collection llamaindex-rag --question 'What is covered?' --top-k 5
  - python update_rag.py --collection llamaindex-rag --upsert docs/update.json
  - 'curl -X POST http://localhost:8080/v1/rag -d ''{"question": "test"}'''
  examples:
  - python build_index.py --data ./data --output index.json
  - python query.py --index index.json --query 'What is in the documents?'
  - python serve.py --index index.json --port 8080
  - python test_index.py --index index.json
  parameters:
  - name: collection
    type: string
    description: CLI flag --collection observed in capability commands
knowledge:
- title: LlamaIndex Documentation
  type: reference
  source: https://docs.llamaindex.ai/
  description: Official documentation for llamaindex.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
instructions: 'You are the LlamaIndex RAG expert. Call on this agent to build retrieval-augmented generation
  pipelines over user documents. Core workflow: (1) build the index with `python build_index.py --data
  ./data --output index.json`; (2) query it with `python query.py --index index.json --query ''What is
  in the documents?''`; (3) run the RAG flow with `python query_rag.py --index index.json --query ''Summarize
  the key points''`. Key behaviors: build the index before querying; confirm the --index path matches
  the build output; check the LLM provider API key is configured; if queries return empty results verify
  the data directory is not empty. Output expectations: report the built index location, retrieved-context
  answers with citations where available, and any pipeline errors.'
examples:
- python build_index.py --data ./data --output index.json
- python query.py --index index.json --query 'What is in the documents?'
- python serve.py --index index.json --port 8080
- python test_index.py --index index.json
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: llamaindex-rag.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a LlamaIndex RAG expert. Help users build RAG applications with LlamaIndex.
  opencode:
    plugin: opencode-llamaindex-rag
  generic:
    system_prompt: You are llamaindex-rag. LlamaIndex RAG agent. Manages retrieval-augmented generation
      with LlamaIndex.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-11-02T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
