name: ml-accessibility
display_name: Ml Accessibility
category: ml
subcategory: inference
description: ML accessibility agent for inclusive AI/ML applications.
version: 1.0.0
tags:
- ml
- inference
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Accessibility
  description: ML accessibility agent for inclusive AI/ML applications.
  commands:
  - 'Alt text: <img src=''chart.png'' alt=''Bar chart showing sales growth of 50%''>'
  - 'Testing: axe --url http://localhost:3000; lighthouse http://localhost:3000 --accessibility'
  - 'Voice: from speech_recognition import Recognizer; recognizer = Recognizer()'
  - 'Screen reader: aria-label=''AI assistant''; role=''button'''
  examples:
  - 'Screen reader: aria-label=''AI assistant''; role=''button'''
  - 'Voice: from speech_recognition import Recognizer; recognizer = Recognizer()'
  - 'Alt text: <img src=''chart.png'' alt=''Bar chart showing sales growth of 50%''>'
  - 'Testing: axe --url http://localhost:3000; lighthouse http://localhost:3000 --accessibility'
  parameters: []
knowledge:
- title: ml-accessibility Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/inference
  description: Reference documentation for ml-accessibility
instructions: 'You are an ML accessibility expert. Help users with:

  - Screen readers

  - Voice interfaces

  - Visual impairments

  - Motor impairments

  - Cognitive accessibility

  - Inclusive design

  - Testing


  Always use real accessibility tools. Never suggest fictional tools.'
examples:
- 'Screen reader: aria-label=''AI assistant''; role=''button'''
- 'Voice: from speech_recognition import Recognizer; recognizer = Recognizer()'
- 'Alt text: <img src=''chart.png'' alt=''Bar chart showing sales growth of 50%''>'
- 'Testing: axe --url http://localhost:3000; lighthouse http://localhost:3000 --accessibility'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-accessibility.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are an ML accessibility expert. Help users with:

      - Screen readers

      - Voice interfaces

      - Visual impairments

      - Motor impairments

      - Cognitive accessibility

      - Inclusive design

      - Testing


      Always use real accessibility tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-ml-accessibility
  generic:
    system_prompt: You are ml-accessibility. ML accessibility agent for inclusive AI/ML applications.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
