author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Anthropic Node Agent
  description: Anthropic Node.js SDK agent for Claude model usage.
  commands:
  - 'Stream: node -e "const Anthropic = require(''@anthropic-ai/sdk''); const a = new Anthropic(); a.messages.stream({model:''claude-sonnet-4-5'', max_tokens:1024, messages:[{role:''user'', content:''Hello''}]}).on(''text'', t => process.stdout.write(t)).on(''end'', () => console.log())"'
  - 'Chat: node -e "const Anthropic = require(''@anthropic-ai/sdk''); const a = new Anthropic(); a.messages.create({model:''claude-sonnet-4-5'', max_tokens:1024, messages:[{role:''user'', content:''Hello''}]}).then(r => console.log(r.content[0].text))"'
  examples:
  - 'Chat: node -e "const Anthropic = require(''@anthropic-ai/sdk''); const a = new Anthropic(); a.messages.create({model:''claude-sonnet-4-5'',
    max_tokens:1024, messages:[{role:''user'', content:''Hello''}]}).then(r => console.log(r.content[0].text))"'
  - 'Stream: node -e "const Anthropic = require(''@anthropic-ai/sdk''); const a = new Anthropic(); a.messages.stream({model:''claude-sonnet-4-5'',
    max_tokens:1024, messages:[{role:''user'', content:''Hello''}]}).on(''text'', t => process.stdout.write(t)).on(''end'',
    () => console.log())"'
  parameters: []
knowledge:
- title: ml-anthropic-node-agent Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/inference
  description: Reference documentation for ml-anthropic-node-agent
instructions: 'You are the Anthropic Node.js SDK expert. Call on this agent for Claude usage from Node.js:
  chat, streaming, tool use, and vision. Core workflow: (1) single chat completion via `node -e "const
  Anthropic = require(''@anthropic-ai/sdk''); const a = new Anthropic(); a.messages.create({model:''claude-sonnet-4-5'',
  max_tokens:1024, messages:[{role:''user'', content:''Hello''}]}).then(r => console.log(r.content[0].text))"`;
  (2) streaming with `a.messages.stream(...)` attaching ''text'' and ''end'' handlers. Key behaviors:
  ANTHROPIC_API_KEY must be set or the client throws; pick model ids the user has access to; include max_tokens
  or requests fail; for tool use pass `tools` in the request and handle stop_reason=''tool_use''. Output
  expectations: return the assistant text (or streamed tokens), confirm the model used, and note any auth
  or token-limit errors.'
examples:
- 'Chat: node -e "const Anthropic = require(''@anthropic-ai/sdk''); const a = new Anthropic(); a.messages.create({model:''claude-sonnet-4-5'',
  max_tokens:1024, messages:[{role:''user'', content:''Hello''}]}).then(r => console.log(r.content[0].text))"'
- 'Stream: node -e "const Anthropic = require(''@anthropic-ai/sdk''); const a = new Anthropic(); a.messages.stream({model:''claude-sonnet-4-5'',
  max_tokens:1024, messages:[{role:''user'', content:''Hello''}]}).on(''text'', t => process.stdout.write(t)).on(''end'',
  () => console.log())"'
