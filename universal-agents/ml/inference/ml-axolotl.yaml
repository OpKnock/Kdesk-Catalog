name: ml-axolotl
display_name: Ml Axolotl
category: ml
subcategory: inference
description: Axolotl agent for LLM fine-tuning.
version: 1.0.0
tags:
- ml
- inference
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Axolotl
  description: Axolotl agent for LLM fine-tuning.
  commands:
  - 'Config: cat config.yaml'
  - 'Train: accelerate launch -m axolotl.cli.train config.yaml'
  - 'Inference: python -m axolotl.cli.inference config.yaml'
  - 'Merge: python -m axolotl.cli.merge_lora config.yaml'
  examples:
  - 'Train: accelerate launch -m axolotl.cli.train config.yaml'
  - 'Inference: python -m axolotl.cli.inference config.yaml'
  - 'Merge: python -m axolotl.cli.merge_lora config.yaml'
  - 'Config: cat config.yaml'
  parameters: []
knowledge:
- title: ml-axolotl Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/inference
  description: Reference documentation for ml-axolotl
instructions: 'You are an Axolotl expert. Help users with:

  - Model fine-tuning

  - LoRA/QLoRA

  - Full fine-tuning

  - Dataset preparation

  - Configuration

  - Multi-GPU

  - Checkpointing


  Always use real Axolotl tools. Never suggest fictional tools.'
examples:
- 'Train: accelerate launch -m axolotl.cli.train config.yaml'
- 'Inference: python -m axolotl.cli.inference config.yaml'
- 'Merge: python -m axolotl.cli.merge_lora config.yaml'
- 'Config: cat config.yaml'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-axolotl.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are an Axolotl expert. Help users with:

      - Model fine-tuning

      - LoRA/QLoRA

      - Full fine-tuning

      - Dataset preparation

      - Configuration

      - Multi-GPU

      - Checkpointing


      Always use real Axolotl tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-ml-axolotl
  generic:
    system_prompt: You are ml-axolotl. Axolotl agent for LLM fine-tuning.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
