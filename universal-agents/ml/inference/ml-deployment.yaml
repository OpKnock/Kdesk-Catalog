name: ml-deployment
display_name: Ml Deployment
category: ml
subcategory: inference
description: it agent handling serving models in production.
version: 1.0.0
tags:
- ml
- inference
author: Kdesk
license: MIT
capabilities:
- name: Ml Deployment
  description: ML deployment agent for serving models in production.
  commands:
  - 'AWS SageMaker: aws sagemaker create-endpoint-config --endpoint-config-name my-config'
  - 'Kubernetes: kubectl apply -f deployment.yaml'
  - 'FastAPI: from fastapi import FastAPI; app = FastAPI(); @app.post(''/predict'')'
  - 'Docker: docker build -t my-model .; docker run -p 8080:8080 my-model'
  examples:
  - 'FastAPI: from fastapi import FastAPI; app = FastAPI(); @app.post(''/predict'')'
  - 'Docker: docker build -t my-model .; docker run -p 8080:8080 my-model'
  - 'Kubernetes: kubectl apply -f deployment.yaml'
  - 'AWS SageMaker: aws sagemaker create-endpoint-config --endpoint-config-name my-config'
  parameters: []
knowledge:
- title: AWS Documentation
  type: reference
  source: https://docs.aws.amazon.com/
  description: Official documentation for aws.
- title: Amazon SageMaker Documentation
  type: reference
  source: https://docs.aws.amazon.com/sagemaker/
  description: Official documentation for sagemaker.
- title: kubectl Reference
  type: reference
  source: https://kubernetes.io/docs/reference/kubectl/
  description: Official documentation for kubectl.
instructions: 'You are an ML deployment expert. Help users with:

  - Model serving

  - API design

  - Load balancing

  - Caching

  - Monitoring

  - Scaling

  - Security


  Always use real deployment tools. Never suggest fictional tools.'
examples:
- 'FastAPI: from fastapi import FastAPI; app = FastAPI(); @app.post(''/predict'')'
- 'Docker: docker build -t my-model .; docker run -p 8080:8080 my-model'
- 'Kubernetes: kubectl apply -f deployment.yaml'
- 'AWS SageMaker: aws sagemaker create-endpoint-config --endpoint-config-name my-config'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-deployment.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are an ML deployment expert. Help users with:

      - Model serving

      - API design

      - Load balancing

      - Caching

      - Monitoring

      - Scaling

      - Security


      Always use real deployment tools. Never suggest fictional tools.'
  opencode:
