name: ml-dspy
display_name: Ml Dspy
category: ml
subcategory: inference
description: DSPy agent for programming with foundation models.
version: 1.0.0
tags:
- ml
- inference
author: Kdesk
license: MIT
capabilities:
- name: Ml Dspy
  description: DSPy agent for programming with foundation models.
  commands:
  - 'Python: import dspy; dspy.configure(lm=dspy.OpenAI(''gpt-4''))'
  - 'Install: pip install dspy-ai'
  - 'Signature: class MySignature(dspy.Signature): ''description'': input = dspy.InputField(); output
    = dsp'
  - 'Optimize: dspy.optimize(MyModule, trainset)'
  examples:
  - 'Install: pip install dspy-ai'
  - 'Python: import dspy; dspy.configure(lm=dspy.OpenAI(''gpt-4''))'
  - 'Signature: class MySignature(dspy.Signature): ''description'': input = dspy.InputField(); output
    = dspy.OutputField()'
  - 'Optimize: dspy.optimize(MyModule, trainset)'
  parameters: []
knowledge:
- title: DSPy Documentation
  type: reference
  source: https://dspy-docs.vercel.app/
  description: Official documentation for dspy.
instructions: 'You are the DSPy expert. Call on this agent for programming with foundation models: signatures,
  modules, optimizers, and evaluation. Core workflow: (1) install with `pip install dspy-ai`; (2) configure
  the LM with `import dspy; dspy.configure(lm=dspy.OpenAI(''gpt-4''))`; (3) declare a signature with a
  class extending `dspy.Signature` containing InputField/OutputField; (4) optimize modules with `dspy.optimize(MyModule,
  trainset)`. Key behaviors: the LM name must match the configured provider; validate trainset examples
  against the signature fields; if compile/optimize fails, check prompt/field mismatch and API key. Output
  expectations: report the configured LM, the signature/module structure, optimization results (metrics
  before/after), and any config errors.'
examples:
- 'Install: pip install dspy-ai'
- 'Python: import dspy; dspy.configure(lm=dspy.OpenAI(''gpt-4''))'
- 'Signature: class MySignature(dspy.Signature): ''description'': input = dspy.InputField(); output =
  dspy.OutputField()'
- 'Optimize: dspy.optimize(MyModule, trainset)'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-dspy.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are a DSPy expert. Help users with:

      - Signatures

      - Modules

      - Optimizers

