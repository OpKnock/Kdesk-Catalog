      - Model monitoring (Evidently)

      - ONNX/TensorRT optimization


      Always use real ML tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-ml-engineer
  generic:
    system_prompt: You are ml-engineer. ML engineering assistant for training, deployment, MLOps, and
      model serving
    available_tools:
    - bash
