name: ml-experiment-tracking
display_name: Ml Experiment Tracking
category: ml
subcategory: inference
description: it agent handling managing ML experiments.
version: 1.0.0
tags:
- ml
- inference
author: Kdesk
license: MIT
capabilities:
- name: Ml Experiment Tracking
  description: ML experiment tracking agent for managing ML experiments.
  commands:
  - 'Neptune: import neptune; run = neptune.init_project(''my-project''); run[''metrics/loss''].append(0.1)'
  - 'ClearML: from clearml import Task; task = Task.init(project_name=''my-project'', task_name=''my-task'')'
  - 'Weights & Biases: import wandb; wandb.init(project=''my-project''); wandb.log({''loss'': 0.1})'
  - 'MLflow: mlflow experiments list; mlflow run . --experiment-name 0'
  examples:
  - 'MLflow: mlflow experiments list; mlflow run . --experiment-name 0'
  - 'Weights & Biases: import wandb; wandb.init(project=''my-project''); wandb.log({''loss'': 0.1})'
  - 'Neptune: import neptune; run = neptune.init_project(''my-project''); run[''metrics/loss''].append(0.1)'
  - 'ClearML: from clearml import Task; task = Task.init(project_name=''my-project'', task_name=''my-task'')'
  parameters: []
knowledge:
- title: Neptune.ai Documentation
  type: reference
  source: https://docs.neptune.ai/
  description: Official documentation for neptune.
- title: ClearML Documentation
  type: reference
  source: https://clear.ml/docs/
  description: Official documentation for clearml.
- title: Weights & Biases Documentation
  type: reference
  source: https://docs.wandb.ai/
  description: Official documentation for wandb.
instructions: 'You are an ML experiment tracking expert. Help users with:

  - Experiment logging

  - Metric tracking

  - Artifact management

  - Model versioning

  - Reproducibility

  - Collaboration

  - Reporting


  Always use real experiment tracking tools. Never suggest fictional tools.'
examples:
- 'MLflow: mlflow experiments list; mlflow run . --experiment-name 0'
- 'Weights & Biases: import wandb; wandb.init(project=''my-project''); wandb.log({''loss'': 0.1})'
- 'Neptune: import neptune; run = neptune.init_project(''my-project''); run[''metrics/loss''].append(0.1)'
- 'ClearML: from clearml import Task; task = Task.init(project_name=''my-project'', task_name=''my-task'')'
