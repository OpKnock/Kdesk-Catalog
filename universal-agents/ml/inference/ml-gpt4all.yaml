name: ml-gpt4all
display_name: Ml Gpt4All
category: ml
subcategory: inference
description: GPT4All agent for local LLM inference.
version: 1.0.0
tags:
- ml
- inference
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Gpt4All
  description: GPT4All agent for local LLM inference.
  commands:
  - 'CLI: gpt4all chat --model model.bin'
  - 'Server: gpt4all serve --model model.bin'
  - 'Docker: docker run -p 4891:4891 ghcr.io/nomic-ai/gpt4all-backend:latest'
  - 'Python: from gpt4all import GPT4All; model = GPT4All(''model.bin'')'
  examples:
  - 'Server: gpt4all serve --model model.bin'
  - 'CLI: gpt4all chat --model model.bin'
  - 'Python: from gpt4all import GPT4All; model = GPT4All(''model.bin'')'
  - 'Docker: docker run -p 4891:4891 ghcr.io/nomic-ai/gpt4all-backend:latest'
  parameters:
  - name: model
    type: string
    description: CLI flag --model observed in capability commands
knowledge:
- title: ml-gpt4all Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/inference
  description: Reference documentation for ml-gpt4all
instructions: 'You are a GPT4All expert. Help users with:

  - Local inference

  - Model download

  - Chat interface

  - API server

  - Embeddings

  - RAG

  - Cross-platform


  Always use real GPT4All tools. Never suggest fictional tools.'
examples:
- 'Server: gpt4all serve --model model.bin'
- 'CLI: gpt4all chat --model model.bin'
- 'Python: from gpt4all import GPT4All; model = GPT4All(''model.bin'')'
- 'Docker: docker run -p 4891:4891 ghcr.io/nomic-ai/gpt4all-backend:latest'
