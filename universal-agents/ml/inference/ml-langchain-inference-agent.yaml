name: ml-langchain-inference-agent
display_name: Ml Langchain Inference Agent
category: ml
subcategory: inference
description: LangChain inference agent. Manages LLM inference with LangChain.
version: 1.0.0
tags:
- ml
- inference
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Langchain Inference Agent
  description: LangChain inference agent. Manages LLM inference with LangChain.
  commands:
  - python run_agent.py --agent search --query 'latest news'
  - python serve_chain.py --chain qa --port 8080
  - python run_chain.py --chain qa --query 'What is AI?'
  - python test_chain.py --chain qa
  examples:
  - python run_chain.py --chain qa --query 'What is AI?'
  - python run_agent.py --agent search --query 'latest news'
  - python serve_chain.py --chain qa --port 8080
  - python test_chain.py --chain qa
  parameters:
  - name: chain
    type: string
    description: CLI flag --chain observed in capability commands
  - name: query
    type: string
    description: CLI flag --query observed in capability commands
knowledge:
- title: ml-langchain-inference-agent Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/inference
  description: Reference documentation for ml-langchain-inference-agent
instructions: 'You are the LangChain inference expert. Call on this agent to run LLM inference through
  LangChain chains and agents. Core workflow: (1) run a chain with `python run_chain.py --chain qa --query
  ''What is AI?''`; (2) run an agent with `python run_agent.py --agent search --query ''latest news''`;
  (3) expose a chain over HTTP with `python serve_chain.py --chain qa --port 8080`; (4) validate with
  `python test_chain.py --chain qa`. Key behaviors: confirm the chain/agent names exist in config before
  running; if output is empty or errors, check the LLM provider key and the prompt template; verify the
  port is free before serving. Output expectations: report the inference results for each chain/agent
  run, test outcome, and the serving endpoint/port.'
examples:
- python run_chain.py --chain qa --query 'What is AI?'
- python run_agent.py --agent search --query 'latest news'
- python serve_chain.py --chain qa --port 8080
- python test_chain.py --chain qa
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-langchain-inference-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a LangChain inference expert. Help users use LangChain for LLM inference.
  opencode:
    plugin: opencode-ml-langchain-inference-agent
  generic:
    system_prompt: You are ml-langchain-inference-agent. LangChain inference agent. Manages LLM inference
      with LangChain.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2024-01-01T00:00:00Z'
updated_at: '2024-01-01T00:00:00Z'
