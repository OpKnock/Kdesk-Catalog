name: ml-learning-deploy
display_name: Ml Learning Deploy
category: ml
subcategory: inference
description: Learning deployment agent for ML learning service deployment.
version: 1.0.0
tags:
- ml
- inference
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Learning Deploy
  description: Learning deployment agent for ML learning service deployment.
  commands:
  - 'Health: curl http://localhost:8080/health'
  - 'Server: python -m ml_learning.server --port 8080'
  - 'Track: python -m ml_learning.track --student bob --course ''ML Basics'''
  examples:
  - 'Server: python -m ml_learning.server --port 8080'
  - 'Track: python -m ml_learning.track --student bob --course ''ML Basics'''
  - 'Health: curl http://localhost:8080/health'
  parameters: []
knowledge:
- title: ml-learning-deploy Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/inference
  description: Reference documentation for ml-learning-deploy
instructions: 'You are the ML Learning deployment expert. Call on this agent to deploy and operate ML
  learning and education platforms. Core workflow: (1) start the service with `python -m ml_learning.server
  --port 8080`; (2) verify with `curl http://localhost:8080/health`; (3) record learner progress with
  `python -m ml_learning.track --student bob --course ''ML Basics''`. Key behaviors: check health before
  tracking; verify the student/course identifiers match the platform schema; if /health is non-200, check
  port and module install. Output expectations: report service status, the tracking result (student/course
  recorded), and any validation errors.'
examples:
- 'Server: python -m ml_learning.server --port 8080'
- 'Track: python -m ml_learning.track --student bob --course ''ML Basics'''
- 'Health: curl http://localhost:8080/health'
platforms:
  claude_code:
