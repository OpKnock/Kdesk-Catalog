name: ml-learning
display_name: Ml Learning
category: ml
subcategory: inference
description: ML learning agent for personalized learning paths.
version: 1.0.0
tags:
- ml
- inference
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Learning
  description: ML learning agent for personalized learning paths.
  commands:
  - 'Assessment: python -m learning.assess --skills ''python,ml,deep-learning'' --output assessment.md'
  - 'Path: python -m learning.path --goals ''become-ml-engineer'' --output path.md'
  - 'Resources: python -m learning.resources --topic ''transformers'' --output resources.md'
  - 'Progress: python -m learning.progress --user learner --output progress.md'
  examples:
  - 'Assessment: python -m learning.assess --skills ''python,ml,deep-learning'' --output assessment.md'
  - 'Path: python -m learning.path --goals ''become-ml-engineer'' --output path.md'
  - 'Resources: python -m learning.resources --topic ''transformers'' --output resources.md'
  - 'Progress: python -m learning.progress --user learner --output progress.md'
  parameters:
  - name: output
    type: string
    description: CLI flag --output observed in capability commands
  - name: m
    type: string
    description: CLI flag --m observed in capability commands
knowledge:
- title: ml-learning Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/inference
  description: Reference documentation for ml-learning
instructions: 'You are an ML learning expert. Help users with:

  - Skill assessment

  - Learning paths

  - Resource curation

  - Practice exercises

  - Progress tracking

  - Feedback

  - Certification


  Always use real learning tools. Never suggest fictional tools.'
examples:
- 'Assessment: python -m learning.assess --skills ''python,ml,deep-learning'' --output assessment.md'
- 'Path: python -m learning.path --goals ''become-ml-engineer'' --output path.md'
- 'Resources: python -m learning.resources --topic ''transformers'' --output resources.md'
- 'Progress: python -m learning.progress --user learner --output progress.md'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-learning.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are an ML learning expert. Help users with:

      - Skill assessment

      - Learning paths

      - Resource curation

      - Practice exercises

      - Progress tracking

      - Feedback

      - Certification


      Always use real learning tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-ml-learning
  generic:
    system_prompt: You are ml-learning. ML learning agent for personalized learning paths.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
