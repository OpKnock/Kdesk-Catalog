name: ml-llama-cpp-inference-agent
display_name: Ml Llama Cpp Inference Agent
category: ml
subcategory: inference
description: llama.cpp inference agent. Manages LLM inference with llama.cpp.
version: 1.0.0
tags:
- ml
- inference
author: Kdesk
license: MIT
capabilities:
- name: Ml Llama Cpp Inference Agent
  description: llama.cpp inference agent. Manages LLM inference with llama.cpp.
  commands:
  - 'curl -X POST http://localhost:8080/v1/predict -H ''Content-Type: application/json'' -d ''{"inputs":
    "hello"}'''
  - 'curl -X POST http://localhost:8080/v1/chat/completions -H ''Content-Type: application/json'' -d ''{"model":
    "llama-cpp", "messages": []}'''
  - curl -s http://localhost:8080/v1/models | jq -r '.data[].id'
  - curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/health
  - llama-cpp --version
  examples:
  - ./main -m models/llama-2-7b.bin -p 'Hello' -n 100
  - ./server -m models/llama-2-7b.bin --port 8080
  - ./main -m models/llama-2-7b.bin --interactive
  - ./quantize models/llama-2-7b.bin models/llama-2-7b-q4_0.bin q4_0
  parameters: []
knowledge:
- title: llama.cpp Documentation
  type: reference
  source: https://github.com/ggerganov/llama.cpp
  description: Official documentation for llama-cpp.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
- title: jq Manual
  type: reference
  source: https://jqlang.github.io/jq/
  description: Official documentation for jq.
instructions: 'You are the llama.cpp inference expert. Call on this agent to run LLM inference with llama.cpp
  and GGUF models. Core workflow: (1) verify the serving endpoint with `curl -s -o /dev/null -w ''%{http_code}''
  http://localhost:8080/v1/health`; (2) generate with `curl -X POST http://localhost:8080/v1/predict -H
  ''Content-Type: application/json'' -d ''{"inputs": "hello"}''` or chat with `curl -X POST http://localhost:8080/v1/chat/completions
  -H ''Content-Type: application/json'' -d ''{"model": "llama-cpp", "messages": []}''`; (3) list loaded
  models with `curl -s http://localhost:8080/v1/models | jq -r ''.data[].id''`; (4) for offline work use
  `./main -m models/llama-2-7b.bin -p ''Hello'' -n 100` or quantize with `./quantize`. Key behaviors:
  diagnose before predicting if health is non-200; match model ids from /v1/models. Output expectations:
  report health, model ids, generation output, and any endpoint errors.'
examples:
- ./main -m models/llama-2-7b.bin -p 'Hello' -n 100
- ./server -m models/llama-2-7b.bin --port 8080
- ./main -m models/llama-2-7b.bin --interactive
- ./quantize models/llama-2-7b.bin models/llama-2-7b-q4_0.bin q4_0
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-llama-cpp-inference-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a llama.cpp inference expert. Help users use llama.cpp for LLM inference.
  opencode:
    plugin: opencode-ml-llama-cpp-inference-agent
  generic:
    system_prompt: You are ml-llama-cpp-inference-agent. llama.cpp inference agent. Manages LLM inference
      with llama.cpp.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2026-01-28T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
