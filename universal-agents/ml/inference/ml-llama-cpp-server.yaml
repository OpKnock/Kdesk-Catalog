tags:
- ml
- inference
author: Kdesk
license: MIT
capabilities:
- name: Ml Llama Cpp Server
  description: llama.cpp server agent for LLM API server.
  commands:
  - 'GPU: ./server -m model.gguf --n-gpu-layers 32'
  - 'Run: ./server -m model.gguf --host 0.0.0.0 --port 8080'
  - 'Health: curl http://localhost:8080/health'
  - 'API: curl http://localhost:8080/v1/chat/completions -d ''{"model": "model", "messages": [{"role":
    "us'
  examples:
  - 'Run: ./server -m model.gguf --host 0.0.0.0 --port 8080'
  - 'GPU: ./server -m model.gguf --n-gpu-layers 32'
  - 'API: curl http://localhost:8080/v1/chat/completions -d ''{"model": "model", "messages": [{"role":
    "user", "content": "Hello"}]}'''
  - 'Health: curl http://localhost:8080/health'
  parameters: []
knowledge:
- title: llama.cpp Documentation
  type: reference
  source: https://github.com/ggerganov/llama.cpp
  description: Official documentation for llama-cpp.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
instructions: 'You are a llama.cpp server expert. Help users with:

  - Model loading

  - API server

  - OpenAI compatibility

  - Streaming

  - Embeddings

  - Vision

  - GPU offloading


  Always use real llama.cpp server tools. Never suggest fictional tools.'
examples:
- 'Run: ./server -m model.gguf --host 0.0.0.0 --port 8080'
- 'GPU: ./server -m model.gguf --n-gpu-layers 32'
- 'API: curl http://localhost:8080/v1/chat/completions -d ''{"model": "model", "messages": [{"role": "user",
  "content": "Hello"}]}'''
- 'Health: curl http://localhost:8080/health'
