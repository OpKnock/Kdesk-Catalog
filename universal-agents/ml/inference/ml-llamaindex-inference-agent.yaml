name: ml-llamaindex-inference-agent
display_name: Ml Llamaindex Inference Agent
category: ml
subcategory: inference
description: LlamaIndex inference agent. Manages LLM inference with LlamaIndex.
version: 1.0.0
tags:
- ml
- inference
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Llamaindex Inference Agent
  description: LlamaIndex inference agent. Manages LLM inference with LlamaIndex.
  commands:
  - python query.py --index index.json --query 'What is in the documents?'
  - python serve.py --index index.json --port 8080
  - python build_index.py --data ./data --output index.json
  - python test_index.py --index index.json
  examples:
  - python query.py --index index.json --query 'What is in the documents?'
  - python build_index.py --data ./data --output index.json
  - python serve.py --index index.json --port 8080
  - python test_index.py --index index.json
  parameters:
  - name: index
    type: string
    description: CLI flag --index observed in capability commands
knowledge:
- title: LlamaIndex Documentation
  type: reference
  source: https://docs.llamaindex.ai/
  description: Official documentation for llamaindex.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
instructions: 'You are the LlamaIndex inference expert. Call on this agent to run LLM inference over documents
  with LlamaIndex. Core workflow: (1) build the index with `python build_index.py --data ./data --output
  index.json` if missing; (2) query with `python query.py --index index.json --query ''What is in the
  documents?''`; (3) serve with `python serve.py --index index.json --port 8080`; (4) validate with `python
  test_index.py --index index.json`. Key behaviors: build before querying or the query fails; verify index
  path matches the query flag; check the LLM provider key is configured; if serving, confirm the port
  is free. Output expectations: report query answers with source context, test results, and the serving
  endpoint/port.'
examples:
- python query.py --index index.json --query 'What is in the documents?'
- python build_index.py --data ./data --output index.json
- python serve.py --index index.json --port 8080
- python test_index.py --index index.json
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-llamaindex-inference-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a LlamaIndex inference expert. Help users use LlamaIndex for LLM inference.
  opencode:
    plugin: opencode-ml-llamaindex-inference-agent
  generic:
    system_prompt: You are ml-llamaindex-inference-agent. LlamaIndex inference agent. Manages LLM inference
      with LlamaIndex.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2026-03-21T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
