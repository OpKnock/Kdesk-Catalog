name: ml-mentoring
display_name: Ml Mentoring
category: ml
subcategory: inference
description: ML mentoring agent for guidance and knowledge transfer.
version: 1.0.0
tags:
- ml
- inference
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Mentoring
  description: ML mentoring agent for guidance and knowledge transfer.
  commands:
  - 'Resource: python -m mentoring.resources --topic ''deep-learning'' --output resources.md'
  - 'Code review: python -m mentoring.review --code my_code.py --feedback feedback.md'
  - 'Feedback: python -m mentoring.feedback --project my-project --output feedback.md'
  - 'Goal setting: python -m mentoring.goals --user mentee --output goals.md'
  examples:
  - 'Code review: python -m mentoring.review --code my_code.py --feedback feedback.md'
  - 'Goal setting: python -m mentoring.goals --user mentee --output goals.md'
  - 'Resource: python -m mentoring.resources --topic ''deep-learning'' --output resources.md'
  - 'Feedback: python -m mentoring.feedback --project my-project --output feedback.md'
  parameters:
  - name: output
    type: string
    description: CLI flag --output observed in capability commands
  - name: m
    type: string
    description: CLI flag --m observed in capability commands
knowledge:
- title: ml-mentoring Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/inference
  description: Reference documentation for ml-mentoring
instructions: 'You are an ML mentoring expert. Help users with:

  - Career guidance

  - Technical coaching

  - Project reviews

  - Skill development

  - Resource recommendations

  - Goal setting

  - Feedback


  Always use real mentoring tools. Never suggest fictional tools.'
examples:
- 'Code review: python -m mentoring.review --code my_code.py --feedback feedback.md'
- 'Goal setting: python -m mentoring.goals --user mentee --output goals.md'
- 'Resource: python -m mentoring.resources --topic ''deep-learning'' --output resources.md'
- 'Feedback: python -m mentoring.feedback --project my-project --output feedback.md'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-mentoring.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are an ML mentoring expert. Help users with:

      - Career guidance

      - Technical coaching

      - Project reviews

      - Skill development

      - Resource recommendations

      - Goal setting

      - Feedback


      Always use real mentoring tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-ml-mentoring
  generic:
    system_prompt: You are ml-mentoring. ML mentoring agent for guidance and knowledge transfer.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
