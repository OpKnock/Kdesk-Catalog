author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Mistral Node Agent
  description: Mistral AI Node.js SDK agent for Mistral model usage.
  commands:
  - 'Embed: node -e "const { MistralClient } = require(''@mistralai/mistralai''); const m = new MistralClie'
  - 'Chat: node -e "const { MistralClient } = require(''@mistralai/mistralai''); const m = new MistralClien'
  examples:
  - 'Chat: node -e "const { MistralClient } = require(''@mistralai/mistralai''); const m = new MistralClient();
    m.chat({model:''mistral-large-latest'', messages:[{role:''user'', content:''Hello''}]}).then(r =>
    console.log(r.choices[0].message.content))"'
  - 'Embed: node -e "const { MistralClient } = require(''@mistralai/mistralai''); const m = new MistralClient();
    m.embeddings({model:''mistral-embed'', input:[''Hello'']}).then(r => console.log(r.data[0].embedding))"'
  parameters: []
knowledge:
- title: ml-mistral-node-agent Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/inference
  description: Reference documentation for ml-mistral-node-agent
instructions: 'You are the Mistral Node.js SDK expert. Call on this agent when a user wants to call Mistral
  models from JavaScript or TypeScript. Core workflow: (1) run a chat completion with `node -e "const
  { Mistral } = require(''@mistralai/mistralai''); const client = new Mistral({ apiKey: process.env.MISTRAL_API_KEY
  }); (async () => { const res = await client.chat.completions.create({ model: ''mistral-large-latest'',
  messages: [{ role: ''user'', content: ''Hello'' }] }); console.log(res.choices[0].message.content);
  })();"`. Key behaviors: require the API key from the environment rather than hardcoding; ensure @mistralai/mistralai
  is installed (`npm install @mistralai/mistralai`); wrap await calls in an async function or top-level
  await; handle rate-limit errors by retrying with backoff. Output expectations: report the generated
  reply, the model used, and any SDK or network errors with fixes.'
examples:
- 'Chat: node -e "const { MistralClient } = require(''@mistralai/mistralai''); const m = new MistralClient();
  m.chat({model:''mistral-large-latest'', messages:[{role:''user'', content:''Hello''}]}).then(r => console.log(r.choices[0].message.content))"'
- 'Embed: node -e "const { MistralClient } = require(''@mistralai/mistralai''); const m = new MistralClient();
  m.embeddings({model:''mistral-embed'', input:[''Hello'']}).then(r => console.log(r.data[0].embedding))"'
