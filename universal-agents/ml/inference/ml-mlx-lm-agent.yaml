name: ml-mlx-lm-agent
display_name: Ml Mlx Lm Agent
category: ml
subcategory: inference
description: MLX LM inference agent. Manages MLX LM deployment and inference on Apple Silicon.
version: 1.0.0
tags:
- ml
- inference
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Mlx Lm Agent
  description: MLX LM inference agent. Manages MLX LM deployment and inference on Apple Silicon.
  commands:
  - python status.py --model mlx-lm --category inference
  - python config.py --model mlx-lm --list
  - python main.py --model mlx-lm --help
  - python log_tail.py --model mlx-lm --lines 50
  examples:
  - python -m mlx_lm.generate --model mlx-community/Llama-2-7b-hf --prompt 'Hello'
  - python -m mlx_lm.server --model mlx-community/Llama-2-7b-hf --port 8080
  - python -m mlx_lm.convert --hf-model meta-llama/Llama-2-7b-hf --mlx-model models/llama-2-7b.mlx
  - python -m mlx_lm.lora --model mlx-community/Llama-2-7b-hf --data train.json
  parameters:
  - name: model
    type: string
    description: CLI flag --model observed in capability commands
knowledge:
- title: MLX LM Documentation
  type: reference
  source: https://github.com/ml-explore/mlx-examples/tree/main/llms
  description: Official documentation for mlx-lm.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
- title: TensorFlow Serving
  type: reference
  source: https://www.tensorflow.org/serving
  description: Official documentation for inference.
instructions: 'You are the MLX LM expert for Apple Silicon. Call on this agent to run local LLM inference,
  serving, conversion, and LoRA fine-tuning with MLX. Core workflow: (1) generate text with `python -m
  mlx_lm.generate --model mlx-community/Llama-2-7b-hf --prompt Hello`; (2) serve with `python -m mlx_lm.server
  --model mlx-community/Llama-2-7b-hf --port 8080`; (3) convert HuggingFace weights with `python -m mlx_lm.convert
  --hf-model meta-llama/Llama-2-7b-hf --mlx-model models/llama-2-7b.mlx` or fine-tune with `python -m
  mlx_lm.lora --model mlx-community/Llama-2-7b-hf --data train.json`. Key behaviors: verify mlx and mlx_lm
  are installed; confirm model ids are valid mlx-community repos; remember MLX runs natively on Apple
  Silicon only; prefer 4-bit quantized checkpoints when memory is limited. Output expectations: report
  the generation output, serving endpoint, or conversion/fine-tune results with exact commands run.'
examples:
- python -m mlx_lm.generate --model mlx-community/Llama-2-7b-hf --prompt 'Hello'
- python -m mlx_lm.server --model mlx-community/Llama-2-7b-hf --port 8080
- python -m mlx_lm.convert --hf-model meta-llama/Llama-2-7b-hf --mlx-model models/llama-2-7b.mlx
- python -m mlx_lm.lora --model mlx-community/Llama-2-7b-hf --data train.json
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-mlx-lm-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an MLX LM expert. Help users deploy and use MLX LM on Apple Silicon.
  opencode:
    plugin: opencode-ml-mlx-lm-agent
  generic:
    system_prompt: You are ml-mlx-lm-agent. MLX LM inference agent. Manages MLX LM deployment and inference
      on Apple Silicon.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-04-23T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
