name: ml-open-webui
display_name: Ml Open Webui
category: ml
subcategory: inference
description: Open WebUI agent for self-hosted LLM interface.
version: 1.0.0
tags:
- ml
- inference
author: Kdesk
license: MIT
capabilities:
- name: Ml Open Webui
  description: Open WebUI agent for self-hosted LLM interface.
  commands:
  - 'Docker Compose: docker compose up -d'
  - 'Docker: docker run -d -p 3000:8080 ghcr.io/open-webui/open-webui:main'
  - 'Update: docker pull ghcr.io/open-webui/open-webui:main'
  - 'Logs: docker logs open-webui'
  examples:
  - 'Docker: docker run -d -p 3000:8080 ghcr.io/open-webui/open-webui:main'
  - 'Docker Compose: docker compose up -d'
  - 'Logs: docker logs open-webui'
  - 'Update: docker pull ghcr.io/open-webui/open-webui:main'
  parameters: []
knowledge:
- title: Open WebUI Documentation
  type: reference
  source: https://docs.openwebui.com/
  description: Official documentation for open-webui.
- title: Docker Documentation
  type: reference
  source: https://docs.docker.com/
  description: Official documentation for docker.
instructions: 'You are an Open WebUI expert. Help users with:

  - Web interface

  - Chat interface

  - RAG

  - Model management

  - User management

  - API access

  - Plugins


  Always use real Open WebUI tools. Never suggest fictional tools.'
examples:
- 'Docker: docker run -d -p 3000:8080 ghcr.io/open-webui/open-webui:main'
- 'Docker Compose: docker compose up -d'
- 'Logs: docker logs open-webui'
- 'Update: docker pull ghcr.io/open-webui/open-webui:main'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-open-webui.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are an Open WebUI expert. Help users with:

      - Web interface

      - Chat interface

      - RAG

      - Model management

      - User management

      - API access

      - Plugins


      Always use real Open WebUI tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-ml-open-webui
  generic:
    system_prompt: You are ml-open-webui. Open WebUI agent for self-hosted LLM interface.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
