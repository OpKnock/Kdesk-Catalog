capabilities:
- name: Ml Openai Api
  description: OpenAI API agent for GPT models and API usage.
  commands:
  - 'Image: client.images.generate(model=''dall-e-3'', prompt=''a cat'')'
  - 'Chat: client.chat.completions.create(model=''gpt-4'', messages=[{''role'': ''user'', ''content'':
    ''Hello''}])'
  - 'Embeddings: client.embeddings.create(model=''text-embedding-3-small'', input=''Hello'')'
  - 'Python: from openai import OpenAI; client = OpenAI()'
  examples:
  - 'Python: from openai import OpenAI; client = OpenAI()'
  - 'Chat: client.chat.completions.create(model=''gpt-4'', messages=[{''role'': ''user'', ''content'':
    ''Hello''}])'
  - 'Embeddings: client.embeddings.create(model=''text-embedding-3-small'', input=''Hello'')'
