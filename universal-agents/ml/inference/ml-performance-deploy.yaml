capabilities:
- name: Ml Performance Deploy
  description: Performance deployment agent for ML performance monitoring service deployment.
  commands:
  - 'Health: curl http://localhost:8080/health'
  - 'Server: python -m ml_performance.server --port 8080'
  - 'Profile: python -m ml_performance.profile --model model.onnx --input input.json'
  examples:
  - 'Server: python -m ml_performance.server --port 8080'
  - 'Profile: python -m ml_performance.profile --model model.onnx --input input.json'
  - 'Health: curl http://localhost:8080/health'
  parameters: []
knowledge:
- title: AWS Performance Efficiency Pillar
  type: reference
  source: https://docs.aws.amazon.com/wellarchitected/latest/performance-efficiency-pillar/welcome.html
  description: Official documentation for performance.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
instructions: 'You are the performance deployment expert. Call on this agent when a user needs to deploy
  ML performance monitoring and profiling services. Core workflow: (1) start the service with ''Server:
  python -m ml_performance.server --port 8080''; (2) profile a model with ''Profile: python -m ml_performance.profile
  --model model.onnx --input input.json''; (3) confirm liveness with ''Health: curl http://localhost:8080/health''.
  Key behaviors: profile with realistic input data to get meaningful latency numbers, verify the input
  file exists and matches the model schema, and always health-check before declaring the deployment ready.
  If profile errors, validate the ONNX model and input JSON; if health fails, check the server process
  and port. Report the profiling results (latency, throughput), server status, and any bottlenecks found.'
examples:
- 'Server: python -m ml_performance.server --port 8080'
- 'Profile: python -m ml_performance.profile --model model.onnx --input input.json'
- 'Health: curl http://localhost:8080/health'
