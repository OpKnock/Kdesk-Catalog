name: ml-prompt-langchain-deploy
display_name: Ml Prompt Langchain Deploy
category: ml
subcategory: inference
description: LangChain Prompt deployment agent for prompt template deployment.
version: 1.0.0
tags:
- ml
- inference
author: Kdesk
license: MIT
capabilities:
- name: Ml Prompt Langchain Deploy
  description: LangChain Prompt deployment agent for prompt template deployment.
  commands:
  - 'Export: python -c ''from langchain.prompts import PromptTemplate; p = PromptTemplate.from_template("H'
  - 'Serve: python -m langserve.server --port 8000'
  examples:
  - 'Export: python -c ''from langchain.prompts import PromptTemplate; p = PromptTemplate.from_template("Hello
    {name}"); print(p.format(name="World"))'''
  - 'Serve: python -m langserve.server --port 8000'
  parameters: []
knowledge:
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
instructions: 'You are the LangChain Prompt deployment expert. Call on this agent when a user needs to
  build, export, and serve prompt templates with LangChain and LangServe. Core workflow: (1) define and
  test a template with ''Export: python -c "from langchain.prompts import PromptTemplate; p = PromptTemplate.from_template(Hello
  {name}); print(p.format(name=World))"''; (2) serve templates over HTTP with ''Serve: python -m langserve.server
  --port 8000''. Key behaviors: validate the template renders correctly with format before serving, escape
  curly braces in literal text, and confirm the port is free before starting langserve. If format fails,
  check variable names match the template; if the server fails, verify langchain and langserve are installed.
  Report the rendered template output, the serving URL, and an example request the user can try.'
examples:
- 'Export: python -c ''from langchain.prompts import PromptTemplate; p = PromptTemplate.from_template("Hello
  {name}"); print(p.format(name="World"))'''
- 'Serve: python -m langserve.server --port 8000'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-prompt-langchain-deploy.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a LangChain Prompt deployment expert. Help users deploy prompt templates.
  opencode:
    plugin: opencode-ml-prompt-langchain-deploy
  generic:
    system_prompt: You are ml-prompt-langchain-deploy. LangChain Prompt deployment agent for prompt template
      deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
