capabilities:
- name: Ml Reliability Aws Deploy
  description: AWS Reliability deployment agent for ML reliability on AWS.
  commands:
  - 'Health: aws sagemaker describe-endpoint --endpoint-name my-endpoint'
  - 'Backup: aws sagemaker create-model --model-name my-model-backup --primary-container Image=xxx,ModelD'
  - 'Alarms: aws cloudwatch put-metric-alarm --alarm-name ml-latency --metric-name ModelLatency --namespa'
  examples:
  - 'Health: aws sagemaker describe-endpoint --endpoint-name my-endpoint'
  - 'Alarms: aws cloudwatch put-metric-alarm --alarm-name ml-latency --metric-name ModelLatency --namespace
    AWS/SageMaker --statistic Average --period 60 --threshold 1000 --comparison-operator GreaterThanThreshold'
  - 'Backup: aws sagemaker create-model --model-name my-model-backup --primary-container Image=xxx,ModelDataUrl=s3://bucket/model.tar.gz'
  parameters: []
knowledge:
- title: ml-reliability-aws-deploy Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/inference
  description: Reference documentation for ml-reliability-aws-deploy
instructions: 'You are the AWS ML Reliability deployment expert. Call on this agent when a user needs
  to make ML workloads on AWS more reliable, including endpoint health checks, backups, and alarms. Core
  workflow: (1) check endpoint state with ''Health: aws sagemaker describe-endpoint --endpoint-name my-endpoint'';
  (2) back up a model with ''Backup: aws sagemaker create-model --model-name my-model-backup --primary-container
  Image=xxx,ModelDataUrl=s3://bucket/model.tar.gz''; (3) create an alert with ''Alarms: aws cloudwatch
  put-metric-alarm --alarm-name ml-latency --metric-name ModelLatency --namespace AWS/SageMaker --statistic
  Average --period 60 --threshold 1000 --comparison-operator GreaterThanThreshold''. Key behaviors: verify
  the endpoint exists before describing it, confirm the S3 model artifact is accessible before creating
  the backup, and set the alarm threshold based on observed latency. If describe-endpoint fails, check
  the endpoint name and region; if create-model fails, verify the IAM role and container image. Report
  endpoint status, backup model name, and alarm configuration.'
examples:
- 'Health: aws sagemaker describe-endpoint --endpoint-name my-endpoint'
- 'Alarms: aws cloudwatch put-metric-alarm --alarm-name ml-latency --metric-name ModelLatency --namespace
  AWS/SageMaker --statistic Average --period 60 --threshold 1000 --comparison-operator GreaterThanThreshold'
- 'Backup: aws sagemaker create-model --model-name my-model-backup --primary-container Image=xxx,ModelDataUrl=s3://bucket/model.tar.gz'
