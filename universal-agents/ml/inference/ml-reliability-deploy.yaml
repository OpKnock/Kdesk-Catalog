name: ml-reliability-deploy
display_name: Ml Reliability Deploy
category: ml
subcategory: inference
description: Reliability deployment agent for ML reliability monitoring service deployment.
version: 1.0.0
tags:
- ml
- inference
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Reliability Deploy
  description: Reliability deployment agent for ML reliability monitoring service deployment.
  commands:
  - 'Health: curl http://localhost:8080/health'
  - 'Check: curl http://localhost:8080/health -H ''X-Model-ID: my_model'''
  - 'Server: python -m ml_reliability.server --port 8080'
  examples:
  - 'Server: python -m ml_reliability.server --port 8080'
  - 'Check: curl http://localhost:8080/health -H ''X-Model-ID: my_model'''
  - 'Health: curl http://localhost:8080/health'
  parameters: []
knowledge:
- title: ml-reliability-deploy Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/inference
  description: Reference documentation for ml-reliability-deploy
instructions: 'You are the reliability deployment expert. Call on this agent when a user needs to deploy
  ML reliability monitoring and health check services. Core workflow: (1) start the service with ''Server:
  python -m ml_reliability.server --port 8080''; (2) check overall health with ''Health: curl http://localhost:8080/health'';
  (3) check a specific model with ''Check: curl http://localhost:8080/health -H X-Model-ID: my_model''.
  Key behaviors: always start the server before health checks, include the X-Model-ID header when checking
  a specific model, and treat non-200 responses as service degradation. If health fails, check the server
  process and port; if the model check fails, confirm the model id is registered. Report server status,
  per-model health, and any failures observed.'
examples:
- 'Server: python -m ml_reliability.server --port 8080'
- 'Check: curl http://localhost:8080/health -H ''X-Model-ID: my_model'''
- 'Health: curl http://localhost:8080/health'
