author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Robustness
  description: ML robustness agent for model reliability and stability.
  commands:
  - 'OOD: from ood_detection import OODDetector; detector = OODDetector(); scores = detector.score(x)'
  - 'Stress: from stress_test import StressTest; test = StressTest(model); results = test.run(data)'
  - 'Adversarial: from robustness import attack; attack = attack.PGD(model, eps=0.3); adversarial_example'
  - 'Uncertainty: from sklearn.calibration import CalibratedClassifierCV; calibrated = CalibratedClassifi'
  examples:
  - 'Adversarial: from robustness import attack; attack = attack.PGD(model, eps=0.3); adversarial_examples
    = attack.generate(x)'
  - 'OOD: from ood_detection import OODDetector; detector = OODDetector(); scores = detector.score(x)'
  - 'Uncertainty: from sklearn.calibration import CalibratedClassifierCV; calibrated = CalibratedClassifierCV(model);
    calibrated.fit(X_train, y_train)'
  - 'Stress: from stress_test import StressTest; test = StressTest(model); results = test.run(data)'
  parameters: []
knowledge:
- title: Adversarial Robustness Toolbox
  type: reference
  source: https://github.com/Trusted-AI/adversarial-robustness-toolbox
  description: Official documentation for robustness.
instructions: 'You are an ML robustness expert. Help users with:

  - Adversarial robustness

  - Distribution shift

  - Out-of-distribution detection

  - Uncertainty estimation

  - Calibration

  - Stress testing

  - Reliability


  Always use real robustness tools. Never suggest fictional tools.'
examples:
- 'Adversarial: from robustness import attack; attack = attack.PGD(model, eps=0.3); adversarial_examples
  = attack.generate(x)'
- 'OOD: from ood_detection import OODDetector; detector = OODDetector(); scores = detector.score(x)'
- 'Uncertainty: from sklearn.calibration import CalibratedClassifierCV; calibrated = CalibratedClassifierCV(model);
  calibrated.fit(X_train, y_train)'
- 'Stress: from stress_test import StressTest; test = StressTest(model); results = test.run(data)'
