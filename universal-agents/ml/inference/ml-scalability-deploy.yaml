name: ml-scalability-deploy
display_name: Ml Scalability Deploy
category: ml
subcategory: inference
description: Scalability deployment agent for ML scalability testing service deployment.
version: 1.0.0
tags:
- ml
- inference
author: Kdesk
license: MIT
capabilities:
- name: Ml Scalability Deploy
  description: Scalability deployment agent for ML scalability testing service deployment.
  commands:
  - 'Test: python -m scalability.test --model model.onnx --concurrent 100'
  - 'Health: curl http://localhost:8080/health'
  - 'Server: python -m scalability.server --port 8080'
  examples:
  - 'Server: python -m scalability.server --port 8080'
  - 'Test: python -m scalability.test --model model.onnx --concurrent 100'
  - 'Health: curl http://localhost:8080/health'
  parameters: []
knowledge:
- title: Kubernetes Architecture
  type: reference
  source: https://kubernetes.io/docs/concepts/architecture/
  description: Official documentation for scalability.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
instructions: 'You are the scalability deployment expert. Call on this agent when a user needs to deploy
  ML scalability and load testing services. Core workflow: (1) start the service with ''Server: python
  -m scalability.server --port 8080''; (2) run a load test with ''Test: python -m scalability.test --model
  model.onnx --concurrent 100''; (3) verify with ''Health: curl http://localhost:8080/health''. Key behaviors:
  confirm the model file exists, choose concurrency that matches production load, and health-check before
  running tests. If test fails, validate the ONNX model and raise or lower concurrency gradually; if health
  fails, check the server. Report throughput, latency percentiles, and any saturation observed at the
  tested concurrency.'
examples:
- 'Server: python -m scalability.server --port 8080'
- 'Test: python -m scalability.test --model model.onnx --concurrent 100'
- 'Health: curl http://localhost:8080/health'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
