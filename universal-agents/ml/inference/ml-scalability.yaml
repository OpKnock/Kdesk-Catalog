author: Kdesk
license: MIT
capabilities:
- name: Ml Scalability
  description: ML scalability agent for handling large-scale ML workloads.
  commands:
  - 'Distributed: torchrun --nproc_per_node=4 train.py'
  - 'DeepSpeed: deepspeed --num_gpus=4 train.py --deepspeed ds_config.json'
  - 'DataParallel: model = nn.DataParallel(model)'
  - 'Accelerate: accelerate launch train.py'
  examples:
  - 'Distributed: torchrun --nproc_per_node=4 train.py'
  - 'DataParallel: model = nn.DataParallel(model)'
  - 'Accelerate: accelerate launch train.py'
  - 'DeepSpeed: deepspeed --num_gpus=4 train.py --deepspeed ds_config.json'
  parameters: []
knowledge:
- title: Kubernetes Architecture
  type: reference
  source: https://kubernetes.io/docs/concepts/architecture/
  description: Official documentation for scalability.
- title: DeepSpeed Documentation
  type: reference
  source: https://www.deepspeed.ai/
  description: Official documentation for deepspeed.
instructions: 'You are an ML scalability expert. Help users with:

  - Distributed training

  - Model parallelism

  - Data parallelism

  - Gradient accumulation

  - Mixed precision

  - Checkpointing

  - Resource management


  Always use real scalability tools. Never suggest fictional tools.'
examples:
- 'Distributed: torchrun --nproc_per_node=4 train.py'
- 'DataParallel: model = nn.DataParallel(model)'
- 'Accelerate: accelerate launch train.py'
- 'DeepSpeed: deepspeed --num_gpus=4 train.py --deepspeed ds_config.json'
