name: ml-serving
display_name: Ml Serving
category: ml
subcategory: inference
description: ML model serving agent for Triton, TorchServe, BentoML, vLLM.
version: 1.0.0
tags:
- ml
- inference
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Serving
  description: ML model serving agent for Triton, TorchServe, BentoML, vLLM.
  commands:
  - 'vLLM: python -m vllm.entrypoints.openai.api_server --model meta-llama/Llama-2-7b'
  - 'TorchServe: torchserve --start --model-store=/models --models mymodel=mymodel.mar'
  - 'BentoML: bentoml serve service:svc --production'
  - 'Triton: tritonserver --model-repository=/models'
  examples:
  - 'Triton: tritonserver --model-repository=/models'
  - 'TorchServe: torchserve --start --model-store=/models --models mymodel=mymodel.mar'
  - 'BentoML: bentoml serve service:svc --production'
  - 'vLLM: python -m vllm.entrypoints.openai.api_server --model meta-llama/Llama-2-7b'
  parameters: []
knowledge:
- title: ml-serving Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/inference
  description: Reference documentation for ml-serving
instructions: 'You are an ML model serving expert. Help users with:

  - Triton Inference Server

  - TorchServe

  - BentoML

  - vLLM

  - TensorRT

  - ONNX Runtime

  - FastAPI wrapping


  Always use real ML serving tools. Never suggest fictional tools.'
examples:
- 'Triton: tritonserver --model-repository=/models'
- 'TorchServe: torchserve --start --model-store=/models --models mymodel=mymodel.mar'
- 'BentoML: bentoml serve service:svc --production'
- 'vLLM: python -m vllm.entrypoints.openai.api_server --model meta-llama/Llama-2-7b'
platforms:
  claude_code:
