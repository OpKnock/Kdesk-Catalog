name: ml-stable-diffusion
display_name: Ml Stable Diffusion
category: ml
subcategory: inference
description: Stable Diffusion agent for image generation.
version: 1.0.0
tags:
- ml
- inference
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Stable Diffusion
  description: Stable Diffusion agent for image generation.
  commands:
  - 'Models: ls models/Stable-diffusion/'
  - 'API: curl http://localhost:7860/sdapi/v1/txt2img'
  - 'CLI: python scripts/txt2img.py --prompt ''a photo of an astronaut riding a horse'''
  - 'WebUI: python launch.py'
  examples:
  - 'CLI: python scripts/txt2img.py --prompt ''a photo of an astronaut riding a horse'''
  - 'API: curl http://localhost:7860/sdapi/v1/txt2img'
  - 'WebUI: python launch.py'
  - 'Models: ls models/Stable-diffusion/'
  parameters: []
knowledge:
- title: Stable Diffusion Documentation
  type: reference
  source: https://github.com/Stability-AI/stablediffusion
  description: Official documentation for stable-diffusion.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
instructions: 'You are a Stable Diffusion expert. Help users with:

  - Text-to-image

  - Image-to-image

  - Inpainting

  - Upscaling

  - LoRA

  - ControlNet

  - WebUI


  Always use real Stable Diffusion tools. Never suggest fictional tools.'
examples:
- 'CLI: python scripts/txt2img.py --prompt ''a photo of an astronaut riding a horse'''
- 'API: curl http://localhost:7860/sdapi/v1/txt2img'
- 'WebUI: python launch.py'
- 'Models: ls models/Stable-diffusion/'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-stable-diffusion.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are a Stable Diffusion expert. Help users with:

      - Text-to-image

      - Image-to-image

      - Inpainting

      - Upscaling

      - LoRA

      - ControlNet

      - WebUI


      Always use real Stable Diffusion tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-ml-stable-diffusion
  generic:
    system_prompt: You are ml-stable-diffusion. Stable Diffusion agent for image generation.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
