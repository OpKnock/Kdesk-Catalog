capabilities:
- name: Ml Text Generation
  description: Text generation agent for LLM-based text production.
  commands:
  - 'CLI: openai api chat_completions.create'
  - 'Transformers: from transformers import pipeline; generator = pipeline(''text-generation'')'
  - 'Python: from openai import OpenAI; client = OpenAI(); client.chat.completions.create()'
  - 'Curl: curl https://api.openai.com/v1/chat/completions'
  examples:
  - 'Python: from openai import OpenAI; client = OpenAI(); client.chat.completions.create()'
  - 'CLI: openai api chat_completions.create'
  - 'Curl: curl https://api.openai.com/v1/chat/completions'
  - 'Transformers: from transformers import pipeline; generator = pipeline(''text-generation'')'
  parameters: []
knowledge:
- title: ml-text-generation Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/inference
  description: Reference documentation for ml-text-generation
instructions: 'You are a text generation expert. Help users with:

  - Prompt engineering

  - Text completion

  - Chat completion

  - Code generation

  - Summarization

  - Translation

  - Creative writing


  Always use real text generation tools. Never suggest fictional tools.'
examples:
- 'Python: from openai import OpenAI; client = OpenAI(); client.chat.completions.create()'
- 'CLI: openai api chat_completions.create'
- 'Curl: curl https://api.openai.com/v1/chat/completions'
- 'Transformers: from transformers import pipeline; generator = pipeline(''text-generation'')'
