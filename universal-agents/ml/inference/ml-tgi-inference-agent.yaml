name: ml-tgi-inference-agent
display_name: Ml Tgi Inference Agent
category: ml
subcategory: inference
description: TGI inference agent. Manages LLM inference with Text Generation Inference.
version: 1.0.0
tags:
- ml
- inference
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Tgi Inference Agent
  description: TGI inference agent. Manages LLM inference with Text Generation Inference.
  commands:
  - 'curl -X POST http://localhost:8080/v1/predict -H ''Content-Type: application/json'' -d ''{"inputs":
    "hello"}'''
  - 'curl -X POST http://localhost:8080/v1/chat/completions -H ''Content-Type: application/json'' -d ''{"model":
    "tgi", "messages": []}'''
  - curl -s http://localhost:8080/v1/models | jq -r '.data[].id'
  - curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/health
  - python identity.py --agent ml-tgi-inference-agent
  examples:
  - text-generation-launcher --model-id meta-llama/Llama-2-7b-hf --port 8080
  - 'curl http://localhost:8080/generate --data ''{"inputs": "Hello"}'''
  - text-generation-router --port 8080 --model-id meta-llama/Llama-2-7b-hf
  - docker run -p 8080:80 ghcr.io/huggingface/text-generation-inference:latest --model-id meta-llama/Llama-2-7b-hf
  parameters: []
knowledge:
- title: ml-tgi-inference-agent Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/inference
  description: Reference documentation for ml-tgi-inference-agent
instructions: 'You are the TGI inference expert. Call on this agent when a user needs to run LLM inference
  with Text Generation Inference. Core workflow: (1) verify the service with ''curl -s -o /dev/null -w
  %{http_code} http://localhost:8080/v1/health'' and list models via ''curl -s http://localhost:8080/v1/models
  | jq -r .data[].id''; (2) generate with ''curl http://localhost:8080/generate --data {inputs: Hello}''
  or ''curl -X POST http://localhost:8080/v1/chat/completions -H Content-Type: application/json -d {model:
  tgi, messages: []}''; (3) launch or redeploy with ''text-generation-launcher --model-id meta-llama/Llama-2-7b-hf
  --port 8080'' or the Docker image. Key behaviors: health-check before inference, verify the model id,
  and use the router for multi-instance setups. If health is non-200, start the launcher; if generation
  fails, check logs. Report health status, model ids, and a sample generation.'
examples:
- text-generation-launcher --model-id meta-llama/Llama-2-7b-hf --port 8080
- 'curl http://localhost:8080/generate --data ''{"inputs": "Hello"}'''
- text-generation-router --port 8080 --model-id meta-llama/Llama-2-7b-hf
- docker run -p 8080:80 ghcr.io/huggingface/text-generation-inference:latest --model-id meta-llama/Llama-2-7b-hf
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-tgi-inference-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a TGI inference expert. Help users use TGI for LLM inference.
  opencode:
    plugin: opencode-ml-tgi-inference-agent
  generic:
    system_prompt: You are ml-tgi-inference-agent. TGI inference agent. Manages LLM inference with Text
      Generation Inference.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2024-01-01T00:00:00Z'
updated_at: '2024-01-01T00:00:00Z'
