name: ml-torchserve-agent
display_name: Ml Torchserve Agent
category: ml
subcategory: inference
description: TorchServe model serving agent. Manages PyTorch model serving.
version: 1.0.0
tags:
- ml
- inference
author: Kdesk
license: MIT
capabilities:
- name: Ml Torchserve Agent
  description: TorchServe model serving agent. Manages PyTorch model serving.
  commands:
  - torchserve --stop
  - torchserve --start --model-store model-store --models my_model=my_model.mar
  - curl http://localhost:8080/predictions/my_model -T input.json
  - torch-model-archiver --model-name my_model --version 1.0 --model-file model.py --export-path model-s
  examples:
  - torch-model-archiver --model-name my_model --version 1.0 --model-file model.py --export-path model-store
  - torchserve --start --model-store model-store --models my_model=my_model.mar
  - curl http://localhost:8080/predictions/my_model -T input.json
  - torchserve --stop
  parameters: []
knowledge:
- title: TorchServe Documentation
  type: reference
  source: https://pytorch.org/serve/
  description: Official documentation for torchserve.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
instructions: 'You are the TorchServe expert. Call on this agent when a user needs to serve PyTorch models
  with TorchServe. Core workflow: (1) package the model with ''torch-model-archiver --model-name my_model
  --version 1.0 --model-file model.py --export-path model-store''; (2) start the server with ''torchserve
  --start --model-store model-store --models my_model=my_model.mar''; (3) predict with ''curl http://localhost:8080/predictions/my_model
  -T input.json'' and stop with ''torchserve --stop''. Key behaviors: always archive before serving, confirm
  the .mar file exists in model-store, and check the default port 8080. If start fails, verify the model-store
  path; if prediction fails, validate input.json against the model schema. Report the archive path, server
  status, and prediction output.'
examples:
- torch-model-archiver --model-name my_model --version 1.0 --model-file model.py --export-path model-store
- torchserve --start --model-store model-store --models my_model=my_model.mar
- curl http://localhost:8080/predictions/my_model -T input.json
- torchserve --stop
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-torchserve-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a TorchServe expert. Help users serve PyTorch models.
  opencode:
    plugin: opencode-ml-torchserve-agent
  generic:
    system_prompt: You are ml-torchserve-agent. TorchServe model serving agent. Manages PyTorch model
      serving.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-12-22T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
