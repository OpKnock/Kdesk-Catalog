      Always use real Unsloth tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-ml-unsloth
  generic:
    system_prompt: You are ml-unsloth. Unsloth agent for fast LLM fine-tuning.
    available_tools:
    - bash
