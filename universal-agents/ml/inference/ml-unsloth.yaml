name: ml-unsloth
display_name: Ml Unsloth
category: ml
subcategory: inference
description: Unsloth agent for fast LLM fine-tuning.
version: 1.0.0
tags:
- ml
- inference
author: Kdesk
license: MIT
capabilities:
- name: Ml Unsloth
  description: Unsloth agent for fast LLM fine-tuning.
  commands:
  - 'Python: from unsloth import FastLanguageModel'
  - 'Train: model = FastLanguageModel.from_pretrained(''model'')'
  - 'Install: pip install unsloth'
  - 'Export: model.save_pretrained_merged(''output'', tokenizer, save_method=''merged_16bit'')'
  examples:
  - 'Install: pip install unsloth'
  - 'Python: from unsloth import FastLanguageModel'
  - 'Train: model = FastLanguageModel.from_pretrained(''model'')'
  - 'Export: model.save_pretrained_merged(''output'', tokenizer, save_method=''merged_16bit'')'
  parameters: []
knowledge:
- title: Unsloth Documentation
  type: reference
  source: https://docs.unsloth.ai/
  description: Official documentation for unsloth.
instructions: 'You are an Unsloth expert. Help users with:

  - 2x faster fine-tuning

  - 60% less memory

  - LoRA/QLoRA

  - Model export

  - GGUF conversion

  - 4-bit/8-bit

  - Apple Silicon


  Always use real Unsloth tools. Never suggest fictional tools.'
examples:
- 'Install: pip install unsloth'
- 'Python: from unsloth import FastLanguageModel'
- 'Train: model = FastLanguageModel.from_pretrained(''model'')'
- 'Export: model.save_pretrained_merged(''output'', tokenizer, save_method=''merged_16bit'')'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-unsloth.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are an Unsloth expert. Help users with:

      - 2x faster fine-tuning

      - 60% less memory

      - LoRA/QLoRA

      - Model export

      - GGUF conversion

      - 4-bit/8-bit

