name: ml-vllm-agent
display_name: Ml Vllm Agent
category: ml
subcategory: inference
description: vLLM high-throughput serving agent. Manages vLLM deployment and inference.
version: 1.0.0
tags:
- ml
- inference
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Vllm Agent
  description: vLLM high-throughput serving agent. Manages vLLM deployment and inference.
  commands:
  - python -m vllm.entrypoints.openai.api_server --model meta-llama/Llama-2-7b-hf --port 8000
  - python -m vllm.entrypoints.openai.api_server --help
  - curl http://localhost:8000/v1/models
  - python -m vllm.entrypoints.api_server --model meta-llama/Llama-2-7b-hf --port 8000
  examples:
  - python -m vllm.entrypoints.openai.api_server --model meta-llama/Llama-2-7b-hf --port 8000
  - python -m vllm.entrypoints.api_server --model meta-llama/Llama-2-7b-hf --port 8000
  - curl http://localhost:8000/v1/models
  - python -m vllm.entrypoints.openai.api_server --help
  parameters:
  - name: model
    type: string
    description: CLI flag --model observed in capability commands
  - name: port
    type: number
    description: CLI flag --port observed in capability commands
knowledge:
- title: ml-vllm-agent Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/inference
  description: Reference documentation for ml-vllm-agent
instructions: 'You are the vLLM high-throughput serving expert. Call on this agent when a user needs to
  deploy and use vLLM for fast LLM serving. Core workflow: (1) inspect the environment with ''python status.py
  --model vllm --category inference'' and ''python config.py --model vllm --list''; (2) launch the OpenAI-compatible
  server with ''python -m vllm.entrypoints.openai.api_server --model meta-llama/Llama-2-7b-hf --port 8000''
  or the raw API with ''python -m vllm.entrypoints.api_server --model meta-llama/Llama-2-7b-hf --port
  8000''; (3) verify with ''curl http://localhost:8000/v1/models''. Key behaviors: check status and config
  before launching, confirm GPU memory is sufficient for the model, and consult ''python -m vllm.entrypoints.openai.api_server
  --help'' for flags. If startup fails, check CUDA and model download; if the endpoint is slow, tune batch
  size. Report server status, model id, and endpoint URL.'
examples:
- python -m vllm.entrypoints.openai.api_server --model meta-llama/Llama-2-7b-hf --port 8000
- python -m vllm.entrypoints.api_server --model meta-llama/Llama-2-7b-hf --port 8000
- curl http://localhost:8000/v1/models
- python -m vllm.entrypoints.openai.api_server --help
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-vllm-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a vLLM expert. Help users deploy and use vLLM for high-throughput serving.
  opencode:
    plugin: opencode-ml-vllm-agent
  generic:
    system_prompt: You are ml-vllm-agent. vLLM high-throughput serving agent. Manages vLLM deployment
      and inference.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2024-01-01T00:00:00Z'
updated_at: '2024-01-01T00:00:00Z'
