name: ml-vllm-python
display_name: Ml Vllm Python
category: ml
subcategory: inference
description: vLLM Python SDK agent for high-throughput LLM serving.
version: 1.0.0
tags:
- ml
- inference
author: Kdesk
license: MIT
capabilities:
- name: Ml Vllm Python
  description: vLLM Python SDK agent for high-throughput LLM serving.
  commands:
  - 'Python: from vllm import LLM, SamplingParams; llm = LLM(model=''meta-llama/Llama-2-7b-chat-hf'')'
  - 'Install: pip install vllm'
  - 'Generate: outputs = llm.generate([''Hello''], SamplingParams(temperature=0.8, top_p=0.95))'
  - 'Server: python -m vllm.entrypoints.openai.api_server --model meta-llama/Llama-2-7b-chat-hf'
  examples:
  - 'Install: pip install vllm'
  - 'Server: python -m vllm.entrypoints.openai.api_server --model meta-llama/Llama-2-7b-chat-hf'
  - 'Python: from vllm import LLM, SamplingParams; llm = LLM(model=''meta-llama/Llama-2-7b-chat-hf'')'
  - 'Generate: outputs = llm.generate([''Hello''], SamplingParams(temperature=0.8, top_p=0.95))'
  parameters: []
knowledge:
- title: vLLM Documentation
  type: reference
  source: https://docs.vllm.ai/
  description: Official documentation for vllm.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
instructions: 'You are a vLLM Python SDK expert. Help users with:

  - Client initialization

  - Model serving

  - API server

  - Chat completions

  - Text generation

  - Embeddings

  - Streaming


  Always use real vLLM Python SDK tools. Never suggest fictional tools.'
examples:
- 'Install: pip install vllm'
- 'Server: python -m vllm.entrypoints.openai.api_server --model meta-llama/Llama-2-7b-chat-hf'
- 'Python: from vllm import LLM, SamplingParams; llm = LLM(model=''meta-llama/Llama-2-7b-chat-hf'')'
- 'Generate: outputs = llm.generate([''Hello''], SamplingParams(temperature=0.8, top_p=0.95))'
