name: ml-vllm
display_name: Ml Vllm
category: ml
subcategory: inference
description: vLLM agent for high-throughput LLM serving.
version: 1.0.0
tags:
- ml
- inference
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Vllm
  description: vLLM agent for high-throughput LLM serving.
  commands:
  - 'API: curl http://localhost:8000/v1/models'
  - 'Chat: curl http://localhost:8000/v1/chat/completions'
  - 'Serve: python -m vllm.entrypoints.openai.api_server --model meta-llama/Llama-2-7b-chat-hf'
  - 'Benchmark: python -m vllm.entrypoints.openai.api_server --model meta-llama/Llama-2-7b'
  examples:
  - 'Serve: python -m vllm.entrypoints.openai.api_server --model meta-llama/Llama-2-7b-chat-hf'
  - 'API: curl http://localhost:8000/v1/models'
  - 'Chat: curl http://localhost:8000/v1/chat/completions'
  - 'Benchmark: python -m vllm.entrypoints.openai.api_server --model meta-llama/Llama-2-7b'
  parameters:
  - name: model
    type: string
    description: CLI flag --model observed in capability commands
knowledge:
- title: ml-vllm Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/inference
  description: Reference documentation for ml-vllm
instructions: 'You are a vLLM expert. Help users with:

  - Model serving

  - PagedAttention

  - Continuous batching

  - Tensor parallelism

  - Quantization

  - API server

  - Benchmarking


  Always use real vLLM tools. Never suggest fictional tools.'
examples:
- 'Serve: python -m vllm.entrypoints.openai.api_server --model meta-llama/Llama-2-7b-chat-hf'
- 'API: curl http://localhost:8000/v1/models'
- 'Chat: curl http://localhost:8000/v1/chat/completions'
- 'Benchmark: python -m vllm.entrypoints.openai.api_server --model meta-llama/Llama-2-7b'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-vllm.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are a vLLM expert. Help users with:

      - Model serving

      - PagedAttention

      - Continuous batching

      - Tensor parallelism

      - Quantization

      - API server

      - Benchmarking


      Always use real vLLM tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-ml-vllm
  generic:
    system_prompt: You are ml-vllm. vLLM agent for high-throughput LLM serving.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2024-01-01T00:00:00Z'
updated_at: '2024-01-01T00:00:00Z'
