name: ml-whisper-inference-agent
display_name: Ml Whisper Inference Agent
category: ml
subcategory: inference
description: Whisper inference agent. Manages audio transcription inference.
version: 1.0.0
tags:
- ml
- inference
author: Kdesk
license: MIT
capabilities:
- name: Ml Whisper Inference Agent
  description: Whisper inference agent. Manages audio transcription inference.
  commands:
  - 'curl -X POST http://localhost:8080/v1/predict -H ''Content-Type: application/json'' -d ''{"inputs":
    "hello"}'''
  - 'curl -X POST http://localhost:8080/v1/chat/completions -H ''Content-Type: application/json'' -d ''{"model":
    "whisper", "messages": []}'''
  - curl -s http://localhost:8080/v1/models | jq -r '.data[].id'
  - curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/health
  - whisper --version
  examples:
  - whisper audio.mp3 --model base --language en
  - whisper audio.wav --model small --output_format txt
  - python transcribe.py --model medium --input audio.mp3
  - python serve_whisper.py --model base --port 8080
  parameters: []
knowledge:
- title: OpenAI Whisper
  type: reference
  source: https://github.com/openai/whisper
  description: Official documentation for whisper.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
- title: jq Manual
  type: reference
  source: https://jqlang.github.io/jq/
  description: Official documentation for jq.
instructions: 'You are the Whisper inference expert. Call on this agent when a user needs to run audio
  transcription inference with Whisper. Core workflow: (1) verify the service with ''curl -s -o /dev/null
  -w %{http_code} http://localhost:8080/v1/health'' and list models via ''curl -s http://localhost:8080/v1/models
  | jq -r .data[].id''; (2) transcribe with ''whisper audio.mp3 --model base --language en'' or ''whisper
  audio.wav --model small --output_format txt''; (3) use the Python path ''python transcribe.py --model
  medium --input audio.mp3'' or serve with ''python serve_whisper.py --model base --port 8080''. Key behaviors:
  health-check before inference, confirm the audio file exists, and pick model size by quality versus
  speed. If health is non-200, start the server; if transcription fails, check audio format and language
  flag. Report the transcript, model used, and server status.'
examples:
- whisper audio.mp3 --model base --language en
- whisper audio.wav --model small --output_format txt
- python transcribe.py --model medium --input audio.mp3
- python serve_whisper.py --model base --port 8080
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-whisper-inference-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Whisper inference expert. Help users transcribe audio with Whisper.
  opencode:
    plugin: opencode-ml-whisper-inference-agent
  generic:
    system_prompt: You are ml-whisper-inference-agent. Whisper inference agent. Manages audio transcription
      inference.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-12-07T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
