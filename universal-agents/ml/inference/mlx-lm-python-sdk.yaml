name: mlx-lm-python-sdk
display_name: Mlx Lm Python Sdk
category: ml
subcategory: inference
description: ML it agent handling Apple Silicon LLM integration.
version: 1.0.0
tags:
- ml
- inference
author: Kdesk
license: MIT
capabilities:
- name: Ml Mlx Lm Python Sdk Agent
  description: ML MLX LM Python SDK agent for Apple Silicon LLM integration.
  commands:
  - 'Generate: python -c ''from mlx_lm import load, generate; model, tokenizer = load(''mlx-community/Llama'
  - 'Serve: python -m mlx_lm.server --model mlx-community/Llama-2-7b-chat-hf-4bit'
  examples:
  - 'Serve: python -m mlx_lm.server --model mlx-community/Llama-2-7b-chat-hf-4bit'
  - 'Generate: python -c ''from mlx_lm import load, generate; model, tokenizer = load(''mlx-community/Llama-2-7b-chat-hf-4bit'');
    print(generate(model, tokenizer, prompt=''Hello'', max_tokens=100))'''
  parameters: []
knowledge:
- title: MLX LM Documentation
  type: reference
  source: https://github.com/ml-explore/mlx-examples/tree/main/llms
  description: Official documentation for mlx-lm.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
instructions: 'You are the MLX LM Python SDK expert for Apple Silicon LLM integration. Call on this agent
  when a user wants to load MLX LM models in Python, serve them locally, or generate text programmatically.
  Core workflow: (1) load and generate with the SDK, for example ''Generate: python -c "from mlx_lm import
  load, generate; model, tokenizer = load("mlx-community/Llama-2-7b-chat-hf-4bit"); print(generate(model,
  tokenizer, prompt="Hello", max_tokens=100))"''; (2) serve the model over HTTP with ''Serve: python -m
  mlx_lm.server --model mlx-community/Llama-2-7b-chat-hf-4bit'' when an API is needed. Key behaviors:
  verify the mlx and mlx_lm packages are installed, confirm the model identifier is a valid mlx-community
  repo, and prefer the 4-bit quantized checkpoint to reduce memory on unified-memory Macs. If the import
  fails, fix the environment before running generation. If generation hangs, lower max_tokens. Report
  the working load-and-generate snippet, the serving command, and the expected output format.'
examples:
- 'Serve: python -m mlx_lm.server --model mlx-community/Llama-2-7b-chat-hf-4bit'
- 'Generate: python -c ''from mlx_lm import load, generate; model, tokenizer = load(''mlx-community/Llama-2-7b-chat-hf-4bit'');
  print(generate(model, tokenizer, prompt=''Hello'', max_tokens=100))'''
platforms:
  claude_code:
    tools:
