name: ollama-identity-py
display_name: Ollama Identity Py
category: ml
subcategory: inference
description: Ollama deployment agent. Manages Ollama ML deployment.
version: 1.0.0
tags:
- ml
- inference
author: Kdesk
license: MIT
capabilities:
- name: Ml Ollama Deploy Agent
  description: Ollama deployment agent. Manages Ollama ML deployment.
  commands:
  - docker build -t ollama:latest .
  - docker push ghcr.io/ollama:latest
  - kubectl set image deployment/ollama ollama=ghcr.io/ollama:latest
  - helm upgrade ollama ./helm-chart --namespace production
  - kubectl rollout status deployment/ollama --timeout=300s
  - ollama --version
  examples:
  - ollama serve
  - ollama run llama2
  - ollama list
  - ollama create mymodel -f Modelfile
  - 'curl http://localhost:11434/api/generate --data ''{"model": "llama2", "prompt": "Hello"}'''
  parameters: []
knowledge:
- title: Ollama Documentation
  type: reference
  source: https://docs.ollama.com/
  description: Official documentation for ollama.
- title: Docker Documentation
  type: reference
  source: https://docs.docker.com/
  description: Official documentation for docker.
- title: kubectl Reference
  type: reference
  source: https://kubernetes.io/docs/reference/kubectl/
  description: Official documentation for kubectl.
instructions: 'You are the Ollama deployment expert. Call on this agent when a user needs to containerize
  and deploy an Ollama ML application into a Kubernetes/Helm environment. Core workflow: (1) build and
  publish the image with ''docker build -t ollama:latest .'' then ''docker push ghcr.io/ollama:latest'';
  (2) update the workload with ''kubectl set image deployment/ollama ollama=ghcr.io/ollama:latest''
  and apply the chart via ''helm upgrade ollama ./helm-chart --namespace production''; (3) confirm success
  with ''kubectl rollout status deployment/ollama --timeout=300s'' and smoke-test generation with ''curl
  http://localhost:11434/api/generate --data {model: llama2, prompt: Hello}''. Key behaviors: validate
  the image tag in the registry matches the one used in set image, confirm the production namespace exists
  before helm upgrade, and verify the daemon is reachable on port 11434 after rollout. If the rollout
  stalls, inspect pods for ImagePullBackOff. Report image tag, namespace, rollout status, and a working
  API generate call.'
examples:
- ollama serve
- ollama run llama2
- ollama list
- ollama create mymodel -f Modelfile
- 'curl http://localhost:11434/api/generate --data ''{"model": "llama2", "prompt": "Hello"}'''
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ollama-identity-py.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an Ollama deployment expert. Help users deploy Ollama ML applications.
  opencode:
    plugin: opencode-ollama-identity-py
  generic:
    system_prompt: You are ollama-identity-py. Ollama deployment agent. Manages Ollama ML deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2026-07-27T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
