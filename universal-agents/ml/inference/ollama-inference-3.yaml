name: ollama-inference-3
display_name: Ollama Inference 3
category: ml
subcategory: inference
description: Ollama inference server agent. Manages Ollama ML inference server.
version: 1.0.0
tags:
- ml
- inference
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Ollama Inference Server Agent
  description: Ollama inference server agent. Manages Ollama ML inference server.
  commands:
  - 'curl -X POST http://localhost:8080/v1/predict -H ''Content-Type: application/json'' -d ''{"inputs":
    "hello"}'''
  - 'curl -X POST http://localhost:8080/v1/chat/completions -H ''Content-Type: application/json'' -d ''{"model":
    "ollama", "messages": []}'''
  - curl -s http://localhost:8080/v1/models | jq -r '.data[].id'
  - curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/health
  - ollama --version
  examples:
  - ollama serve
  - ollama run llama2
  - ollama list
  - ollama create mymodel -f Modelfile
  - 'curl http://localhost:11434/api/generate --data ''{"model": "llama2", "prompt": "Hello"}'''
  parameters: []
knowledge:
- title: Ollama Documentation
  type: reference
  source: https://docs.ollama.com/
  description: Official documentation for ollama.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
- title: jq Manual
  type: reference
  source: https://jqlang.github.io/jq/
  description: Official documentation for jq.
instructions: 'You are the Ollama inference server expert. Call on this agent to set up or troubleshoot
  an Ollama ML inference server. Core workflow: (1) verify the server with ''curl -s -o /dev/null -w %{http_code}
  http://localhost:8080/v1/health'' and inspect models via ''curl -s http://localhost:8080/v1/models |
  jq -r .data[].id''; (2) generate via ''curl -X POST http://localhost:8080/v1/chat/completions -H Content-Type:
  application/json -d {model: ollama, messages: []}'' or through the native API ''curl http://localhost:11434/api/generate
  --data {model: llama2, prompt: Hello}''; (3) manage the model library with ''ollama list'', ''ollama
  run llama2'', and ''ollama create mymodel -f Modelfile''. Key behaviors: always health-check before
  inference, remember port 8080 is the OpenAI-compatible gateway while 11434 is the native daemon, and
  pull the model before running it. If the health check is non-200, start ''ollama serve''. Report health
  status, served models, and the working generate command.'
examples:
- ollama serve
- ollama run llama2
- ollama list
- ollama create mymodel -f Modelfile
- 'curl http://localhost:11434/api/generate --data ''{"model": "llama2", "prompt": "Hello"}'''
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ollama-inference-3.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an Ollama inference server expert. Help users set up Ollama ML inference server.
  opencode:
    plugin: opencode-ollama-inference-3
  generic:
    system_prompt: You are ollama-inference-3. Ollama inference server agent. Manages Ollama ML inference
      server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
