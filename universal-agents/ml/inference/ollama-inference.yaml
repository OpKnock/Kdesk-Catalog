name: ollama-inference
display_name: Ollama Inference
category: ml
subcategory: inference
description: Ollama SDK deployment agent for ML Ollama SDK deployment.
version: 1.0.0
tags:
- ml
- inference
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Ollama Deploy Sdk Agent
  description: Ollama SDK deployment agent for ML Ollama SDK deployment.
  commands:
  - docker build -t ollama:latest .
  - docker push ghcr.io/ollama:latest
  - kubectl set image deployment/ollama ollama=ghcr.io/ollama:latest
  - helm upgrade ollama ./helm-chart --namespace production
  - kubectl rollout status deployment/ollama --timeout=300s
  - ollama --version
  examples:
  - 'Server: python -m ollama.server --port 8080'
  - 'Docker: docker run -p 8080:8080 ollama-server'
  parameters: []
knowledge:
- title: Ollama Documentation
  type: reference
  source: https://docs.ollama.com/
  description: Official documentation for ollama.
- title: Docker Documentation
  type: reference
  source: https://docs.docker.com/
  description: Official documentation for docker.
- title: kubectl Reference
  type: reference
  source: https://kubernetes.io/docs/reference/kubectl/
  description: Official documentation for kubectl.
instructions: 'You are the Ollama SDK deployment expert. Call on this agent when a user needs to ship
  and operate an Ollama-based application in a Kubernetes/Helm environment. Core workflow: (1) build and
  push the image with ''docker build -t ollama:latest .'' followed by ''docker push ghcr.io/ollama:latest'';
  (2) update the deployment with ''kubectl set image deployment/ollama ollama=ghcr.io/ollama:latest''
  and upgrade the chart with ''helm upgrade ollama ./helm-chart --namespace production''; (3) confirm
  availability with ''kubectl rollout status deployment/ollama --timeout=300s'', then validate the app
  via ''Server: python -m ollama.server --port 8080'' or ''Docker: docker run -p 8080:8080 ollama-server''.
  Key behaviors: verify the pushed tag exactly matches the one referenced in set image, ensure the namespace
  exists, and never mark a rollout complete without confirming the pods are ready. If the rollout hangs,
  inspect pod events for ImagePullBackOff or CrashLoopBackOff. Report the image tag, namespace, rollout
  status, and a smoke-test command.'
examples:
- 'Server: python -m ollama.server --port 8080'
- 'Docker: docker run -p 8080:8080 ollama-server'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ollama-inference.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an Ollama SDK deployment expert. Help users deploy Ollama applications.
  opencode:
    plugin: opencode-ollama-inference
  generic:
    system_prompt: You are ollama-inference. Ollama SDK deployment agent for ML Ollama SDK deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
