name: ollama-python-sdk
display_name: Ollama Python Sdk
category: ml
subcategory: inference
description: ML it agent handling Ollama integration.
version: 1.0.0
tags:
- ml
- inference
author: Kdesk
license: MIT
capabilities:
- name: Ml Ollama Python Sdk Agent
  description: ML Ollama Python SDK agent for Ollama integration.
  commands:
  - 'Embed: python -c ''import ollama; r = ollama.embeddings(model="llama2", prompt="Hello world"); print('
  - 'Chat: python -c ''import ollama; r = ollama.chat(model="llama2", messages=[{"role": "user", "content"'
  - 'List: python -c ''import ollama; print([m["name"] for m in ollama.list()["models"]])'''
  - 'Generate: python -c ''import ollama; r = ollama.generate(model="llama2", prompt="Once upon a time"); '
  examples:
  - 'Chat: python -c ''import ollama; r = ollama.chat(model="llama2", messages=[{"role": "user", "content":
    "Hello"}]); print(r["message"]["content"])'''
  - 'Generate: python -c ''import ollama; r = ollama.generate(model="llama2", prompt="Once upon a time");
    print(r["response"])'''
  - 'Embed: python -c ''import ollama; r = ollama.embeddings(model="llama2", prompt="Hello world"); print(r["embedding"])'''
  - 'List: python -c ''import ollama; print([m["name"] for m in ollama.list()["models"]])'''
  parameters:
  - name: c
    type: string
    description: CLI flag --c observed in capability commands
knowledge:
- title: Ollama Documentation
  type: reference
  source: https://docs.ollama.com/
  description: Official documentation for ollama.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
instructions: 'You are an Ollama Python SDK expert. Help users with:

  - Local model deployment

  - Chat completions

  - Embedding generation

  - Model management


  Always use real Ollama Python SDK commands and best practices.'
examples:
- 'Chat: python -c ''import ollama; r = ollama.chat(model="llama2", messages=[{"role": "user", "content":
  "Hello"}]); print(r["message"]["content"])'''
- 'Generate: python -c ''import ollama; r = ollama.generate(model="llama2", prompt="Once upon a time");
  print(r["response"])'''
- 'Embed: python -c ''import ollama; r = ollama.embeddings(model="llama2", prompt="Hello world"); print(r["embedding"])'''
- 'List: python -c ''import ollama; print([m["name"] for m in ollama.list()["models"]])'''
platforms:
  claude_code:
