    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ollama-python-sdk.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are an Ollama Python SDK expert. Help users with:

      - Local model deployment

      - Chat completions

      - Embedding generation

      - Model management


      Always use real Ollama Python SDK commands and best practices.'
  opencode:
