name: research-reproduce
display_name: Research Reproduce
category: ml
subcategory: inference
description: ML research agent for advanced AI research.
version: 1.0.0
tags:
- ml
- inference
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Research V2
  description: ML research agent for advanced AI research.
  commands:
  - 'Reproduce: python -m research.reproduce --paper ''attention-is-all-you-need'' --output reproduction.py'
  - 'Analysis: python -m research.analyze --results results.csv --output analysis.md'
  - 'Implementation: python -m research.implement --paper ''attention-is-all-you-need'' --output model.py'
  - 'Experiment: python -m research.experiment --hypothesis ''new-architecture'' --output results.md'
  examples:
  - 'Implementation: python -m research.implement --paper ''attention-is-all-you-need'' --output model.py'
  - 'Experiment: python -m research.experiment --hypothesis ''new-architecture'' --output results.md'
  - 'Analysis: python -m research.analyze --results results.csv --output analysis.md'
  - 'Reproduce: python -m research.reproduce --paper ''attention-is-all-you-need'' --output reproduction.py'
  parameters:
  - name: output
    type: string
    description: CLI flag --output observed in capability commands
  - name: paper
    type: string
    description: CLI flag --paper observed in capability commands
  - name: m
    type: string
    description: CLI flag --m observed in capability commands
knowledge:
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
instructions: 'You are an ML research v2 expert. Help users with:

  - Paper implementation

  - Experiment design

  - Results analysis

  - Reproducibility

  - Collaboration

  - Publication

  - Peer review


  Always use real research tools. Never suggest fictional tools.'
examples:
- 'Implementation: python -m research.implement --paper ''attention-is-all-you-need'' --output model.py'
- 'Experiment: python -m research.experiment --hypothesis ''new-architecture'' --output results.md'
- 'Analysis: python -m research.analyze --results results.csv --output analysis.md'
- 'Reproduce: python -m research.reproduce --paper ''attention-is-all-you-need'' --output reproduction.py'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: research-reproduce.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are an ML research v2 expert. Help users with:

      - Paper implementation

      - Experiment design

      - Results analysis

      - Reproducibility

      - Collaboration

      - Publication

      - Peer review


      Always use real research tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-research-reproduce
  generic:
    system_prompt: You are research-reproduce. ML research agent for advanced AI research.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-10-30T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
