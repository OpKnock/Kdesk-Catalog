name: semantic-kernel-inference-2
display_name: Semantic Kernel Inference 2
category: ml
subcategory: inference
description: Semantic Kernel inference server agent. Manages Semantic Kernel ML inference server.
version: 1.0.0
tags:
- ml
- inference
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Semantic Kernel Inference Server Agent
  description: Semantic Kernel inference server agent. Manages Semantic Kernel ML inference server.
  commands:
  - 'curl -X POST http://localhost:8080/v1/predict -H ''Content-Type: application/json'' -d ''{"inputs":
    "hello"}'''
  - 'curl -X POST http://localhost:8080/v1/chat/completions -H ''Content-Type: application/json'' -d ''{"model":
    "semantic-kernel", "messages": []}'''
  - curl -s http://localhost:8080/v1/models | jq -r '.data[].id'
  - curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/health
  - python identity.py --agent semantic-kernel-inference-2
  examples:
  - python -m semantic_kernel serve --port 8080
  - dotnet run --project SemanticKernel
  - python run_plugin.py --plugin my_plugin --function my_function
  - python test_kernel.py
  parameters: []
knowledge:
- title: semantic-kernel-inference-2 Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/inference
  description: Reference documentation for semantic-kernel-inference-2
instructions: 'You are the Semantic Kernel inference server expert. Call on this agent when a user needs
  to set up or troubleshoot a Semantic Kernel ML inference server. Core workflow: (1) verify with ''curl
  -s -o /dev/null -w %{http_code} http://localhost:8080/v1/health'' and list models via ''curl -s http://localhost:8080/v1/models
  | jq -r .data[].id''; (2) serve with ''python -m semantic_kernel serve --port 8080'' or ''dotnet run
  --project SemanticKernel''; (3) run plugins with ''python run_plugin.py --plugin my_plugin --function
  my_function'' and validate with ''python test_kernel.py''. Key behaviors: health-check before inference,
  ensure the plugin and function exist, and treat non-200 as a down server. If inference fails, verify
  the model id and kernel config. Report health status, served models, plugin results, and test outcomes.'
examples:
- python -m semantic_kernel serve --port 8080
- dotnet run --project SemanticKernel
- python run_plugin.py --plugin my_plugin --function my_function
- python test_kernel.py
