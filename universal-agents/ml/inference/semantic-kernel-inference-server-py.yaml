name: semantic-kernel-inference-server-py
display_name: Semantic Kernel Inference Server Py
category: ml
subcategory: inference
description: Semantic Kernel inference server agent Manages Semantic Kernel inference server.
version: 1.0.0
tags:
- ml
- inference
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Semantic Kernel Inference Server Agent V2
  description: Semantic Kernel inference server agent. Manages Semantic Kernel inference server.
  commands:
  - python inference_server.py --plugin my_plugin --port 8080
  - python config_inference.py --plugin my_plugin
  - python test_inference_server.py --endpoint http://localhost:8080
  - 'curl http://localhost:8080/run --data ''{"plugin": "my_plugin", "function": "my_function"}'''
  examples:
  - python inference_server.py --plugin my_plugin --port 8080
  - 'curl http://localhost:8080/run --data ''{"plugin": "my_plugin", "function": "my_function"}'''
  - python test_inference_server.py --endpoint http://localhost:8080
  - python config_inference.py --plugin my_plugin
  parameters:
  - name: plugin
    type: string
    description: CLI flag --plugin observed in capability commands
knowledge:
- title: Semantic Kernel Documentation
  type: reference
  source: https://learn.microsoft.com/semantic-kernel/
  description: Official documentation for semantic-kernel.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
instructions: 'You are the Semantic Kernel inference server expert (v2). Call on this agent to set up
  and operate a Semantic Kernel inference server that runs plugins as inference functions. Core workflow:
  (1) start the server with ''python inference_server.py --plugin my_plugin --port 8080''; (2) invoke
  a function with ''curl http://localhost:8080/run --data {plugin: my_plugin, function: my_function}'';
  (3) configure with ''python config_inference.py --plugin my_plugin'' and validate with ''python test_inference_server.py
  --endpoint http://localhost:8080''. Key behaviors: configure the plugin before starting the server,
  confirm plugin and function names match the payload, and test the endpoint after any change. If /run
  errors, validate the JSON payload and registered function; if the server fails to start, check the plugin
  path. Report server status, plugin config, and test results.'
examples:
- python inference_server.py --plugin my_plugin --port 8080
- 'curl http://localhost:8080/run --data ''{"plugin": "my_plugin", "function": "my_function"}'''
- python test_inference_server.py --endpoint http://localhost:8080
- python config_inference.py --plugin my_plugin
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: semantic-kernel-inference-server-py.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Semantic Kernel inference server expert. Help users set up Semantic Kernel
      inference server.
  opencode:
