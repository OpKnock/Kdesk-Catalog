license: MIT
capabilities:
- name: Ml Semantic Kernel Deploy Sdk
  description: Semantic Kernel SDK deployment agent for ML Semantic Kernel SDK deployment.
  commands:
  - 'Serve: python -m semantic_kernel.deploy.server --port 8000'
  - 'Deploy: docker run -p 8000:8000 semantic-kernel-app'
  examples:
  - 'Serve: python -m semantic_kernel.deploy.server --port 8000'
  - 'Deploy: docker run -p 8000:8000 semantic-kernel-app'
  parameters: []
knowledge:
- title: semantic-kernel-serve Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/inference
  description: Reference documentation for semantic-kernel-serve
instructions: 'You are the Semantic Kernel SDK deployment expert. Call on this agent when a user needs
  to serve and deploy Semantic Kernel applications. Core workflow: (1) launch the SDK server with ''Serve:
  python -m semantic_kernel.deploy.server --port 8000''; (2) deploy as a container with ''Deploy: docker
  run -p 8000:8000 semantic-kernel-app''. Key behaviors: confirm the port is free before serving, verify
  the Docker image exists locally or can be pulled, and test the endpoint after starting. If serve fails,
  check dependencies and Python version; if the container fails, check the image name and port mapping.
  Report the serving URL, container status, and an example request.'
examples:
- 'Serve: python -m semantic_kernel.deploy.server --port 8000'
- 'Deploy: docker run -p 8000:8000 semantic-kernel-app'
