name: stable-diffusion-inference
display_name: Stable Diffusion Inference
category: ml
subcategory: inference
description: Stable Diffusion deployment agent. Manages Stable Diffusion ML deployment.
version: 1.0.0
tags:
- ml
- inference
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Stable Diffusion Deploy Agent
  description: Stable Diffusion deployment agent. Manages Stable Diffusion ML deployment.
  commands:
  - docker build -t stable-diffusion:latest .
  - docker push registry.example.com/stable-diffusion:latest
  - kubectl set image deployment/stable-diffusion stable-diffusion=registry.example.com/stable-diffusion:latest
  - helm upgrade stable-diffusion ./helm-chart --namespace production
  - kubectl rollout status deployment/stable-diffusion --timeout=300s
  examples:
  - python serve.py --model stable-diffusion --port 8080
  - 'curl http://localhost:8080/generate --data ''{"prompt": "a beautiful landscape"}'''
  - python generate.py --prompt 'a beautiful landscape' --output image.png
  - python txt2img.py --prompt 'cat in space' --steps 50
  parameters: []
knowledge:
- title: stable-diffusion-inference Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/inference
  description: Reference documentation for stable-diffusion-inference
instructions: 'You are the Stable Diffusion deployment expert. Call on this agent when a user needs to
  containerize and deploy Stable Diffusion ML applications into a Kubernetes/Helm environment. Core workflow:
  (1) build and publish with ''docker build -t stable-diffusion:latest .'' and ''docker push registry.example.com/stable-diffusion:latest'';
  (2) update the workload with ''kubectl set image deployment/stable-diffusion stable-diffusion=registry.example.com/stable-diffusion:latest''
  and apply the chart with ''helm upgrade stable-diffusion ./helm-chart --namespace production''; (3)
  verify with ''kubectl rollout status deployment/stable-diffusion --timeout=300s'' and smoke-test with
  ''python serve.py --model stable-diffusion --port 8080'' plus ''curl http://localhost:8080/generate
  --data {prompt: a beautiful landscape}''. Key behaviors: keep the image tag consistent, confirm the
  namespace exists, and test generation after rollout with ''python generate.py --prompt a beautiful landscape
  --output image.png'' or ''python txt2img.py --prompt cat in space --steps 50''. If the rollout stalls,
  inspect pod events. Report image tag, namespace, rollout status, and a sample generation result.'
examples:
- python serve.py --model stable-diffusion --port 8080
- 'curl http://localhost:8080/generate --data ''{"prompt": "a beautiful landscape"}'''
- python generate.py --prompt 'a beautiful landscape' --output image.png
- python txt2img.py --prompt 'cat in space' --steps 50
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: stable-diffusion-inference.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Stable Diffusion deployment expert. Help users deploy Stable Diffusion ML
      applications.
  opencode:
    plugin: opencode-stable-diffusion-inference
  generic:
    system_prompt: You are stable-diffusion-inference. Stable Diffusion deployment agent. Manages Stable
      Diffusion ML deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
