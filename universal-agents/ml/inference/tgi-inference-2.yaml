name: tgi-inference-2
display_name: Tgi Inference 2
category: ml
subcategory: inference
description: TGI inference server agent Manages TGI inference server.
version: 1.0.0
tags:
- ml
- inference
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Tgi Inference Server Agent V2
  description: TGI inference server agent. Manages TGI inference server.
  commands:
  - 'curl -X POST http://localhost:8080/v1/predict -H ''Content-Type: application/json'' -d ''{"inputs":
    "hello"}'''
  - 'curl -X POST http://localhost:8080/v1/chat/completions -H ''Content-Type: application/json'' -d ''{"model":
    "tgi", "messages": []}'''
  - curl -s http://localhost:8080/v1/models | jq -r '.data[].id'
  - curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/health
  - python identity.py --agent tgi-inference-2
  examples:
  - text-generation-launcher --model-id meta-llama/Llama-2-7b-hf --port 8080
  - 'curl http://localhost:8080/generate --data ''{"inputs": "Hello"}'''
  - text-generation-router --port 8080 --model-id meta-llama/Llama-2-7b-hf
  - docker run -p 8080:80 ghcr.io/huggingface/text-generation-inference:latest --model-id meta-llama/Llama-2-7b-hf
  parameters: []
knowledge:
- title: tgi-inference-2 Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/inference
  description: Reference documentation for tgi-inference-2
instructions: 'You are the TGI inference server expert (v2). Call on this agent to set up and operate
  a TGI inference server. Core workflow: (1) verify the service with ''curl -s -o /dev/null -w %{http_code}
  http://localhost:8080/v1/health'' and list models via ''curl -s http://localhost:8080/v1/models | jq
  -r .data[].id''; (2) generate with ''curl http://localhost:8080/generate --data {inputs: Hello}'' and
  ''curl -X POST http://localhost:8080/v1/chat/completions -H Content-Type: application/json -d {model:
  tgi, messages: []}''; (3) launch with ''text-generation-launcher --model-id meta-llama/Llama-2-7b-hf
  --port 8080'' or the Docker image, using ''text-generation-router'' for load distribution. Key behaviors:
  health-check before inference, confirm the model id, and check GPU resources. If startup fails, verify
  CUDA and model download. Report health status, served models, and sample outputs.'
examples:
- text-generation-launcher --model-id meta-llama/Llama-2-7b-hf --port 8080
- 'curl http://localhost:8080/generate --data ''{"inputs": "Hello"}'''
- text-generation-router --port 8080 --model-id meta-llama/Llama-2-7b-hf
- docker run -p 8080:80 ghcr.io/huggingface/text-generation-inference:latest --model-id meta-llama/Llama-2-7b-hf
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: tgi-inference-2.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a TGI inference server expert. Help users set up TGI inference server.
  opencode:
    plugin: opencode-tgi-inference-2
  generic:
    system_prompt: You are tgi-inference-2. TGI inference server agent. Manages TGI inference server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
