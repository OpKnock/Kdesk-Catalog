name: tgi-inference-3
display_name: Tgi Inference 3
category: ml
subcategory: inference
description: TGI inference server agent. Manages TGI ML inference server.
version: 1.0.0
tags:
- ml
- inference
author: Kdesk
license: MIT
capabilities:
- name: Ml Tgi Inference Server Agent
  description: TGI inference server agent. Manages TGI ML inference server.
  commands:
  - 'curl -X POST http://localhost:8080/v1/predict -H ''Content-Type: application/json'' -d ''{"inputs":
    "hello"}'''
  - 'curl -X POST http://localhost:8080/v1/chat/completions -H ''Content-Type: application/json'' -d ''{"model":
    "tgi", "messages": []}'''
  - curl -s http://localhost:8080/v1/models | jq -r '.data[].id'
  - curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/health
  - tgi --version
  examples:
  - text-generation-launcher --model-id meta-llama/Llama-2-7b-hf --port 8080
  - 'curl http://localhost:8080/generate --data ''{"inputs": "Hello"}'''
  - text-generation-router --port 8080 --model-id meta-llama/Llama-2-7b-hf
  - docker run -p 8080:80 ghcr.io/huggingface/text-generation-inference:latest --model-id meta-llama/Llama-2-7b-hf
  parameters: []
knowledge:
- title: Text Generation Inference
  type: reference
  source: https://huggingface.co/docs/text-generation-inference/
  description: Official documentation for tgi.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
- title: jq Manual
  type: reference
  source: https://jqlang.github.io/jq/
  description: Official documentation for jq.
instructions: 'You are the TGI inference server expert. Call on this agent when a user needs to set up
  or troubleshoot a TGI ML inference server. Core workflow: (1) verify with ''curl -s -o /dev/null -w
  %{http_code} http://localhost:8080/v1/health'' and list models via ''curl -s http://localhost:8080/v1/models
  | jq -r .data[].id''; (2) generate with ''curl http://localhost:8080/generate --data {inputs: Hello}''
  or ''curl -X POST http://localhost:8080/v1/chat/completions -H Content-Type: application/json -d {model:
  tgi, messages: []}''; (3) launch with ''text-generation-launcher --model-id meta-llama/Llama-2-7b-hf
  --port 8080'' or the official Docker image. Key behaviors: health-check before inference, confirm the
  model id is valid, and check GPU memory when loading large models. If health is non-200, restart the
  launcher; if generation fails, check logs and model availability. Report health status, served models,
  and a sample generation.'
examples:
- text-generation-launcher --model-id meta-llama/Llama-2-7b-hf --port 8080
- 'curl http://localhost:8080/generate --data ''{"inputs": "Hello"}'''
- text-generation-router --port 8080 --model-id meta-llama/Llama-2-7b-hf
- docker run -p 8080:80 ghcr.io/huggingface/text-generation-inference:latest --model-id meta-llama/Llama-2-7b-hf
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: tgi-inference-3.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a TGI inference server expert. Help users set up TGI ML inference server.
  opencode:
    plugin: opencode-tgi-inference-3
  generic:
    system_prompt: You are tgi-inference-3. TGI inference server agent. Manages TGI ML inference server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-01-27T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
