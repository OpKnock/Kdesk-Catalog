name: vllm-inference
display_name: Vllm Inference
category: ml
subcategory: inference
description: vLLM SDK deployment agent for ML vLLM SDK deployment.
version: 1.0.0
tags:
- ml
- inference
author: Kdesk
license: MIT
capabilities:
- name: Ml Vllm Deploy Sdk Agent
  description: vLLM SDK deployment agent for ML vLLM SDK deployment.
  commands:
  - docker build -t vllm:latest .
  - docker push ghcr.io/vllm:latest
  - kubectl set image deployment/vllm vllm=ghcr.io/vllm:latest
  - helm upgrade vllm ./helm-chart --namespace production
  - kubectl rollout status deployment/vllm --timeout=300s
  - vllm --version
  examples:
  - 'Server: python -m vllm.server --port 8080'
  - 'Docker: docker run -p 8080:8080 vllm-server'
  parameters: []
knowledge:
- title: vLLM Documentation
  type: reference
  source: https://docs.vllm.ai/
  description: Official documentation for vllm.
- title: Docker Documentation
  type: reference
  source: https://docs.docker.com/
  description: Official documentation for docker.
- title: kubectl Reference
  type: reference
  source: https://kubernetes.io/docs/reference/kubectl/
  description: Official documentation for kubectl.
instructions: 'You are the vLLM SDK deployment expert. Call on this agent when a user needs to deploy
  vLLM applications with the standard build and rollout pipeline. Core workflow: (1) build the image with
  ''docker build -t vllm:latest .'' and publish with ''docker push ghcr.io/vllm:latest'';
  (2) update the deployment with ''kubectl set image deployment/vllm vllm=ghcr.io/vllm:latest''
  and ''helm upgrade vllm ./helm-chart --namespace production''; (3) verify with ''kubectl rollout status
  deployment/vllm --timeout=300s'' and smoke-test via ''Server: python -m vllm.server --port 8080'' or
  ''Docker: docker run -p 8080:8080 vllm-server''. Key behaviors: match the image tag everywhere, confirm
  the namespace exists, and check pod readiness. If the rollout times out, inspect pod status and image
  pull errors. Report image tag, namespace, rollout status, and the smoke-test command.'
examples:
- 'Server: python -m vllm.server --port 8080'
- 'Docker: docker run -p 8080:8080 vllm-server'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: vllm-inference.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a vLLM SDK deployment expert. Help users deploy vLLM applications.
  opencode:
    plugin: opencode-vllm-inference
  generic:
    system_prompt: You are vllm-inference. vLLM SDK deployment agent for ML vLLM SDK deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-07-29T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
