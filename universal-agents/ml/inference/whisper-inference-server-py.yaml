name: whisper-inference-server-py
display_name: Whisper Inference Server Py
category: ml
subcategory: inference
description: Whisper inference server agent Manages Whisper inference server.
version: 1.0.0
tags:
- ml
- inference
author: Kdesk
license: MIT
capabilities:
- name: Ml Whisper Inference Server Agent V2
  description: Whisper inference server agent. Manages Whisper inference server.
  commands:
  - python inference_server.py --model base --port 8080
  - 'curl http://localhost:8080/transcribe --data ''{"audio": "audio.mp3"}'''
  - whisper audio.mp3 --model base --language en
  - python transcribe.py --model medium --input audio.mp3
  examples:
  - python inference_server.py --model base --port 8080
  - 'curl http://localhost:8080/transcribe --data ''{"audio": "audio.mp3"}'''
  - whisper audio.mp3 --model base --language en
  - python transcribe.py --model medium --input audio.mp3
  parameters:
  - name: model
    type: string
    description: CLI flag --model observed in capability commands
knowledge:
- title: OpenAI Whisper
  type: reference
  source: https://github.com/openai/whisper
  description: Official documentation for whisper.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
instructions: 'You are the Whisper inference server expert (v2). Call on this agent to set up and operate
  a Whisper inference server. Core workflow: (1) start the server with ''python inference_server.py --model
  base --port 8080''; (2) transcribe via API with ''curl http://localhost:8080/transcribe --data {audio:
  audio.mp3}''; (3) validate with ''whisper audio.mp3 --model base --language en'' or ''python transcribe.py
  --model medium --input audio.mp3''. Key behaviors: confirm the model is registered before starting,
  verify the audio path is valid, and check output after transcription. If /transcribe errors, validate
  the JSON payload and audio path; if the server fails to start, check the port. Report server status,
  transcription result, and sample output.'
examples:
- python inference_server.py --model base --port 8080
- 'curl http://localhost:8080/transcribe --data ''{"audio": "audio.mp3"}'''
- whisper audio.mp3 --model base --language en
- python transcribe.py --model medium --input audio.mp3
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: whisper-inference-server-py.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Whisper inference server expert. Help users set up Whisper inference server.
  opencode:
    plugin: opencode-whisper-inference-server-py
  generic:
    system_prompt: You are whisper-inference-server-py. Whisper inference server agent v2. Manages Whisper
      inference server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
