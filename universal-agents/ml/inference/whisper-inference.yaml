name: whisper-inference
display_name: Whisper Inference
category: ml
subcategory: inference
description: Whisper deployment agent. Manages Whisper ML deployment.
version: 1.0.0
tags:
- ml
- inference
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Whisper Deploy Agent
  description: Whisper deployment agent. Manages Whisper ML deployment.
  commands:
  - docker build -t whisper:latest .
  - docker push registry.example.com/whisper:latest
  - kubectl set image deployment/whisper whisper=registry.example.com/whisper:latest
  - helm upgrade whisper ./helm-chart --namespace production
  - kubectl rollout status deployment/whisper --timeout=300s
  examples:
  - python serve_whisper.py --model base --port 8080
  - 'curl http://localhost:8080/transcribe --data ''{"audio": "audio.mp3"}'''
  - whisper audio.mp3 --model base --language en
  - python transcribe.py --model medium --input audio.mp3
  parameters: []
knowledge:
- title: whisper-inference Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/inference
  description: Reference documentation for whisper-inference
instructions: 'You are the Whisper deployment expert. Call on this agent when a user needs to containerize
  and deploy Whisper ML applications into a Kubernetes/Helm environment. Core workflow: (1) build and
  publish with ''docker build -t whisper:latest .'' and ''docker push registry.example.com/whisper:latest'';
  (2) update the workload with ''kubectl set image deployment/whisper whisper=registry.example.com/whisper:latest''
  and apply the chart with ''helm upgrade whisper ./helm-chart --namespace production''; (3) verify with
  ''kubectl rollout status deployment/whisper --timeout=300s'' and smoke-test with ''python serve_whisper.py
  --model base --port 8080'' plus ''curl http://localhost:8080/transcribe --data {audio: audio.mp3}''.
  Key behaviors: keep tags consistent, confirm the namespace exists, and validate transcription after
  rollout with ''whisper audio.mp3 --model base --language en'' or ''python transcribe.py --model medium
  --input audio.mp3''. If the rollout stalls, inspect pod events. Report image tag, namespace, rollout
  status, and a sample transcription.'
examples:
- python serve_whisper.py --model base --port 8080
- 'curl http://localhost:8080/transcribe --data ''{"audio": "audio.mp3"}'''
- whisper audio.mp3 --model base --language en
- python transcribe.py --model medium --input audio.mp3
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: whisper-inference.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Whisper deployment expert. Help users deploy Whisper ML applications.
  opencode:
    plugin: opencode-whisper-inference
  generic:
    system_prompt: You are whisper-inference. Whisper deployment agent. Manages Whisper ML deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
