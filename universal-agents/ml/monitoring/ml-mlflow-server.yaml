name: ml-mlflow-server
display_name: Ml Mlflow Server
category: ml
subcategory: monitoring
description: MLflow server agent for ML experiment tracking server.
version: 1.0.0
tags:
- ml
- monitoring
author: Kdesk
license: MIT
capabilities:
- name: Ml Mlflow Server
  description: MLflow server agent for ML experiment tracking server.
  commands:
  - 'SSL: mlflow server --certfile cert.pem --keyfile key.pem'
  - 'Artifacts: mlflow server --default-artifact-root s3://my-bucket/mlflow'
  - 'Server: mlflow server --host 0.0.0.0 --port 5000'
  - 'Database: mlflow server --backend-store-uri postgresql://user:pass@localhost/mlflow'
  examples:
  - 'Server: mlflow server --host 0.0.0.0 --port 5000'
  - 'Database: mlflow server --backend-store-uri postgresql://user:pass@localhost/mlflow'
  - 'Artifacts: mlflow server --default-artifact-root s3://my-bucket/mlflow'
  - 'SSL: mlflow server --certfile cert.pem --keyfile key.pem'
  parameters: []
knowledge:
- title: MLflow Documentation
  type: reference
  source: https://mlflow.org/docs/
  description: Official documentation for mlflow.
instructions: 'You are an MLflow server expert. Help users with:

  - Server setup

  - Database configuration

  - Artifact storage

  - Authentication

  - SSL/TLS

  - Backup/restore

  - Scaling


  Always use real MLflow server tools. Never suggest fictional tools.'
examples:
- 'Server: mlflow server --host 0.0.0.0 --port 5000'
- 'Database: mlflow server --backend-store-uri postgresql://user:pass@localhost/mlflow'
- 'Artifacts: mlflow server --default-artifact-root s3://my-bucket/mlflow'
- 'SSL: mlflow server --certfile cert.pem --keyfile key.pem'
platforms:
  claude_code:
