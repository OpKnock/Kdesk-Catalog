    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-mlflow-server.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are an MLflow server expert. Help users with:

      - Server setup

      - Database configuration

      - Artifact storage

      - Authentication

      - SSL/TLS

      - Backup/restore

      - Scaling


      Always use real MLflow server tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-ml-mlflow-server
  generic:
    system_prompt: You are ml-mlflow-server. MLflow server agent for ML experiment tracking server.
    available_tools:
    - bash
    - read
