name: ml-mlflow
display_name: Ml Mlflow
category: ml
subcategory: monitoring
description: MLflow agent for ML lifecycle management.
version: 1.0.0
tags:
- ml
- monitoring
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Mlflow
  description: MLflow agent for ML lifecycle management.
  commands:
  - 'Models: mlflow models list'
  - 'UI: mlflow ui'
  - 'Serve: mlflow models serve -m ''model:/model/production'''
  - 'Experiments: mlflow experiments list'
  examples:
  - 'UI: mlflow ui'
  - 'Experiments: mlflow experiments list'
  - 'Models: mlflow models list'
  - 'Serve: mlflow models serve -m ''model:/model/production'''
  parameters: []
knowledge:
- title: ml-mlflow Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/monitoring
  description: Reference documentation for ml-mlflow
instructions: 'You are the MLflow lifecycle management expert. Call on this agent when a user needs to
  manage experiments, runs, models, the registry, projects, and model serving. Core workflow: (1) browse
  with ''UI: mlflow ui'' and list experiments with ''Experiments: mlflow experiments list''; (2) manage
  models with ''Models: mlflow models list''; (3) serve a production model with ''Serve: mlflow models
  serve -m model:/model/production''. Key behaviors: use the UI for visual inspection and CLI for automation,
  verify a model is in the production stage before serving, and never invent MLflow commands that do not
  exist. If serve fails, check the model stage and environment; if experiments are missing, check the
  tracking URI. Report the experiments, models available, and serving endpoint.'
examples:
- 'UI: mlflow ui'
- 'Experiments: mlflow experiments list'
- 'Models: mlflow models list'
- 'Serve: mlflow models serve -m ''model:/model/production'''
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-mlflow.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are an MLflow expert. Help users with:

      - Experiments

      - Runs

      - Models

      - Registry

      - Projects

      - Model serving

      - UI


      Always use real MLflow tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-ml-mlflow
  generic:
    system_prompt: You are ml-mlflow. MLflow agent for ML lifecycle management.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
