name: ml-monitoring-datadog-deploy
display_name: Ml Monitoring Datadog Deploy
category: ml
subcategory: monitoring
description: Datadog Monitoring deployment agent for ML monitoring with Datadog.
version: 1.0.0
tags:
- ml
- monitoring
author: Kdesk
license: MIT
capabilities:
- name: Ml Monitoring Datadog Deploy
  description: Datadog Monitoring deployment agent for ML monitoring with Datadog.
  commands:
  - 'Metrics: dogstatsd metric submit ml.model.accuracy 0.95 --tags model:gpt-5.6-sol'
  - 'Dashboard: curl -X POST https://api.datadoghq.com/api/v1/dashboard -H ''DD-API-KEY: $DD_API_KEY''
    -d '''
  - 'Agent: datadog-agent start'
  examples:
  - 'Agent: datadog-agent start'
  - 'Metrics: dogstatsd metric submit ml.model.accuracy 0.95 --tags model:gpt-5.6-sol'
  - 'Dashboard: curl -X POST https://api.datadoghq.com/api/v1/dashboard -H ''DD-API-KEY: $DD_API_KEY''
    -d ''{"title": "ML Dashboard"}'''
  parameters: []
knowledge:
- title: Datadog Documentation
  type: reference
  source: https://docs.datadoghq.com/
  description: Official documentation for datadog.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
instructions: 'You are the Datadog ML Monitoring deployment expert. Call on this agent when a user needs
  to deploy ML monitoring with Datadog. Core workflow: (1) start the agent with ''Agent: datadog-agent
  start''; (2) submit custom metrics with ''Metrics: dogstatsd metric submit ml.model.accuracy 0.95 --tags
  model:gpt-5.6-sol''; (3) create a dashboard via ''Dashboard: curl -X POST https://api.datadoghq.com/api/v1/dashboard
  -H DD-API-KEY: $DD_API_KEY -d {title: ML Dashboard}''. Key behaviors: confirm the agent is running before
  submitting metrics, keep the DD_API_KEY in the environment, and tag metrics meaningfully. If dogstatsd
  fails, check the agent and port 8125; if the dashboard call fails, verify the API key. Report submitted
  metrics, tags, and dashboard id.'
examples:
- 'Agent: datadog-agent start'
- 'Metrics: dogstatsd metric submit ml.model.accuracy 0.95 --tags model:gpt-5.6-sol'
- 'Dashboard: curl -X POST https://api.datadoghq.com/api/v1/dashboard -H ''DD-API-KEY: $DD_API_KEY'' -d
  ''{"title": "ML Dashboard"}'''
