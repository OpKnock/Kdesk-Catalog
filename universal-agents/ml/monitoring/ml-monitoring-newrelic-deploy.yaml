name: ml-monitoring-newrelic-deploy
display_name: Ml Monitoring Newrelic Deploy
category: ml
subcategory: monitoring
description: New Relic Monitoring deployment agent for ML monitoring with New Relic.
version: 1.0.0
tags:
- ml
- monitoring
author: Kdesk
license: MIT
capabilities:
- name: Ml Monitoring Newrelic Deploy
  description: New Relic Monitoring deployment agent for ML monitoring with New Relic.
  commands:
  - 'Dashboard: curl -X POST https://api.newrelic.com/v2/dashboards.json -H ''X-Api-Key: $NEW_RELIC_API_KE'
  - 'Agent: newrelic-daemon start'
  - 'Metrics: newrelic-record custom event ''MLPrediction'' --attributes ''{"model":"gpt-5.6-sol","accuracy":0.95}'
  examples:
  - 'Agent: newrelic-daemon start'
  - 'Metrics: newrelic-record custom event ''MLPrediction'' --attributes ''{"model":"gpt-5.6-sol","accuracy":0.95}'''
  - 'Dashboard: curl -X POST https://api.newrelic.com/v2/dashboards.json -H ''X-Api-Key: $NEW_RELIC_API_KEY''
    -d ''{"dashboard": {"title": "ML Metrics"}}'''
  parameters: []
knowledge:
- title: New Relic Documentation
  type: reference
  source: https://docs.newrelic.com/
  description: Official documentation for newrelic.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
instructions: 'You are the New Relic ML Monitoring deployment expert. Call on this agent when a user needs
  to deploy ML monitoring with New Relic. Core workflow: (1) start the agent with ''Agent: newrelic-daemon
  start''; (2) record custom events with ''Metrics: newrelic-record custom event MLPrediction --attributes
  {model:gpt-5.6-sol, accuracy:0.95}''; (3) create a dashboard via ''Dashboard: curl -X POST https://api.newrelic.com/v2/dashboards.json
  -H X-Api-Key: $NEW_RELIC_API_KEY -d {dashboard: {title: ML Metrics}}''. Key behaviors: confirm the daemon
  is running before recording, keep the API key in the environment, and pass attributes as valid JSON.
  If recording fails, check the daemon; if the dashboard call fails, verify the API key. Report recorded
  events, attributes, and dashboard id.'
examples:
- 'Agent: newrelic-daemon start'
- 'Metrics: newrelic-record custom event ''MLPrediction'' --attributes ''{"model":"gpt-5.6-sol","accuracy":0.95}'''
- 'Dashboard: curl -X POST https://api.newrelic.com/v2/dashboards.json -H ''X-Api-Key: $NEW_RELIC_API_KEY''
  -d ''{"dashboard": {"title": "ML Metrics"}}'''
