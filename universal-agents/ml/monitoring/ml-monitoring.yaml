name: ml-monitoring
display_name: Ml Monitoring
category: ml
subcategory: monitoring
description: it agent handling production model observability.
version: 1.0.0
tags:
- ml
- monitoring
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Monitoring
  description: ML monitoring agent for production model observability.
  commands:
  - 'Evidently: from evidently.report import Report; report = Report(metrics=[DataDriftTable()]); report.'
  - 'Whylabs: from whylogs import DatasetProfile; profile = DatasetProfile(); profile.track(data)'
  - 'Grafana: from grafana_api import GrafanaApi; grafana = GrafanaApi(auth=(''admin'', ''admin''), host=''loc'
  - 'Prometheus: prometheus_client.Gauge(''model_accuracy'', ''Model accuracy'').set(0.95)'
  examples:
  - 'Evidently: from evidently.report import Report; report = Report(metrics=[DataDriftTable()]); report.run(reference_data=train,
    current_data=test)'
  - 'Whylabs: from whylogs import DatasetProfile; profile = DatasetProfile(); profile.track(data)'
  - 'Prometheus: prometheus_client.Gauge(''model_accuracy'', ''Model accuracy'').set(0.95)'
  - 'Grafana: from grafana_api import GrafanaApi; grafana = GrafanaApi(auth=(''admin'', ''admin''), host=''localhost'')'
  parameters: []
knowledge:
- title: Prometheus Documentation
  type: reference
  source: https://prometheus.io/docs/introduction/overview/
  description: Official documentation for monitoring.
- title: Grafana Documentation
  type: reference
  source: https://grafana.com/docs/
  description: Official documentation for grafana.
instructions: 'You are an ML monitoring expert. Help users with:

  - Model drift

  - Data drift

  - Performance metrics

  - Alerting

  - Logging

  - Dashboarding

  - Retraining


  Always use real monitoring tools. Never suggest fictional tools.'
examples:
- 'Evidently: from evidently.report import Report; report = Report(metrics=[DataDriftTable()]); report.run(reference_data=train,
  current_data=test)'
- 'Whylabs: from whylogs import DatasetProfile; profile = DatasetProfile(); profile.track(data)'
- 'Prometheus: prometheus_client.Gauge(''model_accuracy'', ''Model accuracy'').set(0.95)'
- 'Grafana: from grafana_api import GrafanaApi; grafana = GrafanaApi(auth=(''admin'', ''admin''), host=''localhost'')'
platforms:
  claude_code:
