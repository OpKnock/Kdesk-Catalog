capabilities:
- name: Ml Privacy Gcp Deploy
  description: GCP Privacy deployment agent for ML privacy on GCP.
  commands:
  - 'KMS: gcloud kms keyrings create ml-keyring --location=global'
  - 'Secrets: gcloud secrets create ml-api-key --replication-policy=automatic'
  - 'Config: gcloud kms keys create ml-key --keyring=ml-keyring --location=global --purpose=encryption'
  examples:
  - 'KMS: gcloud kms keyrings create ml-keyring --location=global'
  - 'Secrets: gcloud secrets create ml-api-key --replication-policy=automatic'
  - 'Config: gcloud kms keys create ml-key --keyring=ml-keyring --location=global --purpose=encryption'
  parameters:
  - name: location
    type: boolean
    description: CLI flag --location observed in capability commands
knowledge:
- title: ml-privacy-gcp-deploy Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/privacy
  description: Reference documentation for ml-privacy-gcp-deploy
instructions: 'You are the GCP ML privacy deployment expert. Call on this agent to deploy encryption and
  secret-management for ML on Google Cloud. Core workflow: (1) create a keyring with ''gcloud kms keyrings
  create ml-keyring --location=global''; (2) register secrets via ''gcloud secrets create ml-api-key --replication-policy=automatic'';
  (3) create the encryption key with ''gcloud kms keys create ml-key --keyring=ml-keyring --location=global
  --purpose=encryption''; (4) grant KMS and Secret Manager access to the ML service account. Key behaviors:
  verify the location and project before running commands, check the keyring does not already exist, ensure
  IAM bindings are least-privilege, and confirm replication policy meets compliance needs. Output: keyring/key/secret
  resource paths, IAM grant summaries, and usage examples for encrypting data and fetching secrets in
  deployments.'
examples:
- 'KMS: gcloud kms keyrings create ml-keyring --location=global'
- 'Secrets: gcloud secrets create ml-api-key --replication-policy=automatic'
- 'Config: gcloud kms keys create ml-key --keyring=ml-keyring --location=global --purpose=encryption'
