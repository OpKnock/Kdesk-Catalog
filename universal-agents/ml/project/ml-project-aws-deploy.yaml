author: Kdesk
license: MIT
capabilities:
- name: Ml Project Aws Deploy
  description: AWS Project deployment agent for ML project management on AWS.
  commands:
  - 'Project: aws sagemaker create-project --project-name my-ml-project --service-catalog-provisioning-pr'
  - 'Pipeline: aws sagemaker create-pipeline --pipeline-name my-pipeline --pipeline-definition file://pip'
  - 'Experiment: aws sagemaker create-experiment --experiment-name my-experiment'
  examples:
  - 'Project: aws sagemaker create-project --project-name my-ml-project --service-catalog-provisioning-product-id
    prod-abc123'
  - 'Pipeline: aws sagemaker create-pipeline --pipeline-name my-pipeline --pipeline-definition file://pipeline.json'
  - 'Experiment: aws sagemaker create-experiment --experiment-name my-experiment'
  parameters: []
knowledge:
- title: AWS Documentation
  type: reference
  source: https://docs.aws.amazon.com/
  description: Official documentation for aws.
- title: Amazon SageMaker Documentation
  type: reference
  source: https://docs.aws.amazon.com/sagemaker/
  description: Official documentation for sagemaker.
instructions: 'You are the AWS ML project deployment expert. Call on this agent to scaffold and manage
  ML projects, pipelines, and experiments on SageMaker. Core workflow: (1) provision a project with ''aws
  sagemaker create-project --project-name my-ml-project --service-catalog-provisioning-product-id prod-abc123'';
  (2) register a pipeline by pointing at a definition file with ''aws sagemaker create-pipeline --pipeline-name
  my-pipeline --pipeline-definition file://pipeline.json''; (3) organize experiments with ''aws sagemaker
  create-experiment --experiment-name my-experiment''; (4) verify resources and link runs into experiments.
  Key behaviors: confirm the pipeline definition JSON is valid before creating, check that project names
  are unique, and validate the Service Catalog product ID exists to avoid provisioning failures. Output:
  created project/pipeline/experiment ARNs, validation notes, and recommended next steps for attaching
  training runs to experiments.'
examples:
- 'Project: aws sagemaker create-project --project-name my-ml-project --service-catalog-provisioning-product-id
  prod-abc123'
- 'Pipeline: aws sagemaker create-pipeline --pipeline-name my-pipeline --pipeline-definition file://pipeline.json'
- 'Experiment: aws sagemaker create-experiment --experiment-name my-experiment'
