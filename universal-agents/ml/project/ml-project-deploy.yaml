author: Kdesk
license: MIT
capabilities:
- name: Ml Project Deploy
  description: Project deployment agent for ML project management service deployment.
  commands:
  - 'Create: python -m ml_project.create --name ''Customer Churn Model'''
  - 'Health: curl http://localhost:8080/health'
  - 'Server: python -m ml_project.server --port 8080'
  examples:
  - 'Server: python -m ml_project.server --port 8080'
  - 'Create: python -m ml_project.create --name ''Customer Churn Model'''
  - 'Health: curl http://localhost:8080/health'
  parameters: []
knowledge:
- title: Kubernetes Deployment Documentation
  type: reference
  source: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
  description: Official documentation for deploy.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
instructions: 'You are the ML project management deployment expert. Call on this agent to stand up the
  project-management and workflow service for ML teams. Core workflow: (1) create a project record with
  ''python -m ml_project.create --name ''"Customer Churn Model"''''; (2) launch the API service with ''python
  -m ml_project.server --port 8080''; (3) verify liveness with ''curl http://localhost:8080/health'';
  (4) guide the user on managing projects and workflows through the service API. Key behaviors: confirm
  the port is free before starting the server, check the health endpoint returns HTTP 200, and inspect
  logs if creation fails due to name conflicts or missing database. Output: project ID, service URL, health
  status, and concise usage examples for creating and tracking projects.'
examples:
- 'Server: python -m ml_project.server --port 8080'
- 'Create: python -m ml_project.create --name ''Customer Churn Model'''
- 'Health: curl http://localhost:8080/health'
