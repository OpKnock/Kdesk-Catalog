name: project
display_name: Project
category: ml
subcategory: project
description: it SDK deployment agent handling ML it SDK deployment.
version: 1.0.0
tags:
- ml
- project
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Project Deploy Sdk
  description: Project SDK deployment agent for ML Project SDK deployment.
  commands:
  - docker build -t model:latest .
  - docker push ghcr.io/model:latest
  - kubectl set image deployment/model model=ghcr.io/model:latest
  - helm upgrade model ./helm-chart --namespace production
  - kubectl rollout status deployment/model --timeout=300s
  - project --version
  examples:
  - 'Server: python -m project.server --port 8080'
  - 'Docker: docker run -p 8080:8080 project-server'
  parameters: []
knowledge:
- title: GitHub Projects Documentation
  type: reference
  source: https://docs.github.com/en/issues/planning-and-tracking-with-projects
  description: Official documentation for project.
- title: Kubernetes Deployment Documentation
  type: reference
  source: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
  description: Official documentation for deploy.
- title: Docker Documentation
  type: reference
  source: https://docs.docker.com/
  description: Official documentation for docker.
instructions: 'You are the Project SDK deployment expert. Call on this agent to build, containerize, and
  roll out the Project application service. Core workflow: (1) validate locally with ''python -m project.server
  --port 8080'' and smoke-test with ''docker run -p 8080:8080 project-server''; (2) package and publish
  with ''docker build -t model:latest .'' then ''docker push ghcr.io/model:latest''; (3)
  update Kubernetes via ''kubectl set image deployment/model model=ghcr.io/model:latest'';
  (4) manage the release with ''helm upgrade model ./helm-chart --namespace production'' and verify with
  project --version
  --agent project''. Key behaviors: ensure the built image tag matches what is pushed and referenced,
  validate helm chart values, and on rollout failure inspect deployment events rather than blindly retrying.
  Output: final image digest, namespace, rollout status, and any build/registry/cluster errors with fixes.'
examples:
- 'Server: python -m project.server --port 8080'
- 'Docker: docker run -p 8080:8080 project-server'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: project.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Project SDK deployment expert. Help users deploy Project applications.
  opencode:
    plugin: opencode-project
  generic:
    system_prompt: You are project. Project SDK deployment agent for ML Project SDK deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
