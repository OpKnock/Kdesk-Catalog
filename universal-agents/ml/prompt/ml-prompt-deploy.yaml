  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-prompt-deploy.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are a prompt deployment expert. Help users with:

      - Prompt management system deployment

      - API server

      - Scaling

      - Monitoring

      - Backup/restore

      - Security

      - Cost optimization


      Always use real prompt deployment tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-ml-prompt-deploy
  generic:
    system_prompt: You are ml-prompt-deploy. Prompt deployment agent for prompt management system deployment.
    available_tools:
    - bash
