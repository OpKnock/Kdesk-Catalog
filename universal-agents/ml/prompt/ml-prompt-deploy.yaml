name: ml-prompt-deploy
display_name: Ml Prompt Deploy
category: ml
subcategory: prompt
description: Prompt deployment agent for prompt management system deployment.
version: 1.0.0
tags:
- ml
- prompt
author: Kdesk
license: MIT
capabilities:
- name: Ml Prompt Deploy
  description: Prompt deployment agent for prompt management system deployment.
  commands:
  - 'Status: python -m prompt.status --server http://localhost:8080'
  - 'Server: python -m prompt.server --port 8080'
  - 'API: curl http://localhost:8080/prompts -X POST -H ''Content-Type: application/json'' -d ''{"name":
    "my'
  - 'Health: curl http://localhost:8080/health'
  examples:
  - 'Server: python -m prompt.server --port 8080'
  - 'API: curl http://localhost:8080/prompts -X POST -H ''Content-Type: application/json'' -d ''{"name":
    "my_prompt", "template": "Hello {name}"}'''
  - 'Health: curl http://localhost:8080/health'
  - 'Status: python -m prompt.status --server http://localhost:8080'
  parameters: []
knowledge:
- title: Anthropic Prompt Engineering
  type: reference
  source: https://docs.anthropic.com/en/docs/build-with-claude/prompt-engineering
  description: Official documentation for prompt.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
instructions: 'You are a prompt deployment expert. Help users with:

  - Prompt management system deployment

  - API server

  - Scaling

  - Monitoring

  - Backup/restore

  - Security

  - Cost optimization


  Always use real prompt deployment tools. Never suggest fictional tools.'
examples:
- 'Server: python -m prompt.server --port 8080'
- 'API: curl http://localhost:8080/prompts -X POST -H ''Content-Type: application/json'' -d ''{"name":
  "my_prompt", "template": "Hello {name}"}'''
- 'Health: curl http://localhost:8080/health'
- 'Status: python -m prompt.status --server http://localhost:8080'
platforms:
  claude_code:
