name: ml-rag-aws-deploy
display_name: AWS RAG Deployer
category: ml
subcategory: rag
description: 'Deploys RAG on AWS: Bedrock Knowledge Bases, OpenSearch Serverless vector search, S3 ingestion, and IAM policies.'
version: 2.0.0
tags:
- ml
- rag
- aws
- bedrock
- opensearch
author: Kdesk
license: MIT
capabilities:
- name: bedrock-kb
  description: Create a Bedrock Knowledge Base over an S3 data source
  commands:
  - aws s3 sync ./docs s3://rag-docs-bucket/ --exclude "*.tmp"
  - 'aws bedrock-agent create-knowledge-base --name rag-kb --role-arn arn:aws:iam::123456789012:role/RagKbRole --knowledge-base-configuration ''{"type":"VECTOR","vectorKnowledgeBaseConfiguration":{"embeddingModelArn":"arn:aws:bedrock:us-east-1::foundation-model/amazon.titan-embed-text-v2:0"}}'' --storage-configuration ''{"type":"OPENSEARCH_SERVERLESS","opensearchServerlessConfiguration":{"collectionArn":"arn:aws:aoss:us-east-1:123456789012:collection/rag-collection","vectorIndexName":"rag-index","fieldMapping":{"metadataField":"metadata","textField":"text"}}}'''
  - aws bedrock-agent start-ingestion-job --knowledge-base-id KB123456 --data-source-id DS123456
  - aws bedrock-agent list-ingestion-jobs --knowledge-base-id KB123456
  examples:
  - start-ingestion-job syncs the S3 data source into the vector index
  - list-ingestion-jobs shows the sync status and failure reasons
  parameters:
  - name: kb-id
    type: string
    description: Knowledge base id
- name: bedrock-retrieve
  description: Retrieve chunks from a Bedrock Knowledge Base and generate answers
  commands:
  - aws bedrock-agent-runtime retrieve --knowledge-base-id KB123456 --retrieval-query '{"text":"What are the retry rules?"}'
  - aws bedrock-runtime invoke-model --model-id anthropic.claude-3-haiku-20240307-v1:0 --body '{"messages":[{"role":"user","content":"Summarize the docs"}]}' --cli-binary-format raw-in-base64-out response.json
  - python -c "import json; print(json.load(open('response.json'))['content'][0]['text'] if 'content' in json.load(open('response.json')) else 'check body shape')"
  examples:
  - bedrock-agent-runtime retrieve returns chunks with score and metadata
  - invoke-model writes the model response to response.json
  parameters:
  - name: model-id
    type: string
    description: Bedrock model id (default anthropic.claude-3-haiku)
knowledge:
- title: Bedrock Knowledge Bases guide
  type: documentation
  source: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base.html
  description: KB setup, ingestion, and retrieval
- title: OpenSearch Serverless docs
  type: documentation
  source: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/serverless.html
  description: Vector collections and indexes
- title: Bedrock runtime API reference
  type: documentation
  source: https://docs.aws.amazon.com/bedrock/latest/APIReference/API_Operations_Amazon_Bedrock_Runtime.html
  description: invoke-model and retrieve endpoints
instructions: 'You are the AWS RAG deployer. You deploy RAG on AWS: Bedrock Knowledge Bases,
  OpenSearch Serverless vector search, S3 ingestion, and IAM policies. Workflow: (1) create the S3
  data source and sync documents; (2) create the knowledge base with a vector index and Titan
  embeddings; (3) run an ingestion job and wait for it to complete; (4) retrieve chunks and generate
  answers with invoke-model. Debug order: ingestion job status, then IAM permissions, then collection
  indexes. Use real commands: aws bedrock-agent create-knowledge-base, start-ingestion-job,
  bedrock-agent-runtime retrieve. Verify IAM roles cover bedrock and aoss before creating resources.'
examples:
- input: 'Put the docs folder behind a Bedrock Knowledge Base'
  output: 'S3 sync, create-knowledge-base, and an ingestion job index the docs'
- input: 'Ingestion jobs fail with access denied'
  output: 'Fixes the knowledge base role policy to include bedrock and aoss actions'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-rag-aws-deploy.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an AWS RAG deployer. Help users deploy RAG on AWS.
  opencode:
    plugin: opencode-ml-rag-aws-deploy
  generic:
    system_prompt: 'You are the AWS RAG deployer. You deploy RAG on AWS: Bedrock Knowledge Bases,
      OpenSearch Serverless vector search, S3 ingestion, and IAM policies. You prefer the shortest safe
      path and reproduce failures before diagnosing them. Commands are real: `aws bedrock-agent
      create-knowledge-base`, `aws bedrock-agent start-ingestion-job`, `aws bedrock-agent-runtime
      retrieve`.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
