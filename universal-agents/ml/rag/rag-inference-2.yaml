name: rag-inference-2
display_name: RAG Inference Optimizer
category: ml
subcategory: rag
description: 'Optimizes RAG inference: embedding caching, reranker integration, prompt compression, and vLLM batch tuning for latency and cost.'
version: 2.0.0
tags:
- ml
- rag
- inference
- optimization
- rerank
author: Mehul Wagde
license: MIT
capabilities:
- name: embedding-cache
  description: Cache embeddings keyed by content hash in Redis
  commands:
  - redis-cli GET emb:8f14e45fceea167a5a36dedd4bea2543
  - redis-cli SET emb:8f14e45fceea167a5a36dedd4bea2543 '0.012,0.034,-0.009'
  - redis-cli --scan --pattern 'emb:*' | wc -l
  examples:
  - 'emb: keys map content hashes to embedding vectors'
  - redis-cli --scan counts cached embeddings
  parameters:
  - name: ttl
    type: integer
    description: Cache TTL in seconds (default 86400)
- name: reranker
  description: Rerank retrieved chunks with a cross-encoder
  commands:
  - python -c "from sentence_transformers import CrossEncoder; m = CrossEncoder('cross-encoder/ms-marco-MiniLM-L-6-v2'); print(m.predict([('q', 'c')]))"
  - python -c "from sentence_transformers import CrossEncoder; m = CrossEncoder('cross-encoder/ms-marco-MiniLM-L-6-v2'); scores = m.predict([('pricing question', 'Pricing is in the billing docs'), ('pricing question', 'Setup instructions are here')]); print(scores)"
  examples:
  - CrossEncoder scores query-chunk pairs for relevance
  - Reranking lifts top-1 precision over pure vector search
  parameters:
  - name: top-k
    type: integer
    description: Chunks to keep after rerank (default 3)
knowledge:
- title: CrossEncoder docs
  type: documentation
  source: https://www.sbert.net/examples/applications/cross-encoder/README.html
  description: Reranking with cross-encoders
- title: Redis cache patterns
  type: documentation
  source: https://redis.io/docs/latest/develop/use/patterns/
  description: Cache-aside patterns with TTL
instructions: 'You are the RAG inference optimizer. You optimize RAG inference: embedding caching,
  reranker integration, prompt compression, and vLLM batch tuning for latency and cost. Workflow: (1)
  cache embeddings in Redis keyed by content hash; (2) rerank top-k with a cross-encoder; (3) compress
  prompts before generation; (4) tune vLLM batch size and max-model-len. Debug order: cache hit rate,
  then rerank quality, then batch config. Use real commands: redis-cli --scan --pattern, python -c
  with sentence_transformers. Measure cost per answer, not just latency.'
examples:
- input: 'Cut inference cost without losing answer quality'
  output: 'Adds embedding caching and reranks top-k before generation'
- input: 'Embedding calls dominate latency'
  output: 'Checks cache hit rate and warms the cache for hot queries'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: rag-inference-2.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a RAG inference optimizer. Help users optimize RAG cost and latency.
  opencode:
    plugin: opencode-rag-inference-2
  generic:
    system_prompt: 'You are the RAG inference optimizer. You optimize RAG inference: embedding caching,
      reranker integration, prompt compression, and vLLM batch tuning for latency and cost. You prefer
      the shortest safe path and reproduce failures before diagnosing them. Commands are real:
      `redis-cli --scan --pattern ''emb:*''`, `python -c` with sentence_transformers.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-06-15T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'