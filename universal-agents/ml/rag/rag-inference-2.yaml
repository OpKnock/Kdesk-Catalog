name: rag-inference-2
display_name: Rag Inference 2
category: ml
subcategory: rag
description: RAG inference server agent. Manages RAG ML inference server.
version: 1.0.0
tags:
- ml
- rag
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Rag Inference Server Agent
  description: RAG inference server agent. Manages RAG ML inference server.
  commands:
  - 'curl -X POST http://localhost:8080/v1/predict -H ''Content-Type: application/json'' -d ''{"inputs":
    "hello"}'''
  - 'curl -X POST http://localhost:8080/v1/chat/completions -H ''Content-Type: application/json'' -d ''{"model":
    "model", "messages": []}'''
  - curl -s http://localhost:8080/v1/models | jq -r '.data[].id'
  - curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/health
  - python identity.py --agent rag-inference-2
  examples:
  - python serve_rag.py --index index --port 8080
  - 'curl http://localhost:8080/query --data ''{"query": "What is machine learning?"}'''
  - python ingest.py --docs ./documents --output index
  - python evaluate_rag.py --index index --test-questions questions.json
  parameters: []
knowledge:
- title: rag-inference-2 Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/rag
  description: Reference documentation for rag-inference-2
instructions: 'You are the RAG ML inference server expert. Call on this agent to stand up and manage a
  RAG inference server. Core workflow: (1) launch with ''python serve_rag.py --index index --port 8080'';
  (2) test with ''curl http://localhost:8080/query --data ''"{\"query\": \"What is machine learning?\"}"'''';
  (3) maintain the index via ''python ingest.py --docs ./documents --output index''; (4) measure quality
  with ''python evaluate_rag.py --index index --test-questions questions.json''; also support the /v1
  API surface (predict, chat/completions, /v1/models, /v1/health) and run ''python identity.py --agent
  rag-inference-2''. Key behaviors: check index freshness, monitor health codes, and restart with the
  same index path on re-deploys. Output: endpoint details, health status, evaluation results, and any
  ingestion or serving issues found.'
examples:
- python serve_rag.py --index index --port 8080
- 'curl http://localhost:8080/query --data ''{"query": "What is machine learning?"}'''
- python ingest.py --docs ./documents --output index
- python evaluate_rag.py --index index --test-questions questions.json
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: rag-inference-2.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a RAG inference server expert. Help users set up RAG ML inference server.
  opencode:
    plugin: opencode-rag-inference-2
  generic:
    system_prompt: You are rag-inference-2. RAG inference server agent. Manages RAG ML inference server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2024-01-01T00:00:00Z'
updated_at: '2024-01-01T00:00:00Z'
