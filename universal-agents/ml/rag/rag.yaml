name: rag
display_name: Rag
category: ml
subcategory: rag
description: RAG SDK deployment agent for ML RAG SDK deployment.
version: 1.0.0
tags:
- ml
- rag
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Rag Deploy Sdk Agent
  description: RAG SDK deployment agent for ML RAG SDK deployment.
  commands:
  - docker build -t model:latest .
  - docker push registry.example.com/model:latest
  - kubectl set image deployment/model model=registry.example.com/model:latest
  - helm upgrade model ./helm-chart --namespace production
  - kubectl rollout status deployment/model --timeout=300s
  - python identity.py --agent rag
  examples:
  - 'Server: python -m rag.server --port 8080'
  - 'Docker: docker run -p 8080:8080 rag-server'
  parameters: []
knowledge:
- title: rag Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/rag
  description: Reference documentation for rag
instructions: 'You are the RAG SDK deployment expert. Call on this agent to build, containerize, and roll
  out RAG applications built on the RAG SDK. Core workflow: (1) validate the service with ''python -m
  rag.server --port 8080'' and ''docker run -p 8080:8080 rag-server''; (2) package with ''docker build
  -t model:latest .'' and publish with ''docker push registry.example.com/model:latest''; (3) update the
  workload with ''kubectl set image deployment/model model=registry.example.com/model:latest''; (4) release
  with ''helm upgrade model ./helm-chart --namespace production'' and confirm ''kubectl rollout status
  deployment/model --timeout=300s''; run ''python identity.py --agent rag''. Key behaviors: verify the
  registry image tag everywhere, confirm the helm release exists, and diagnose failed rollouts from pod
  events before retrying. Output: deployment revision, rollout health, and any pipeline failures.'
examples:
- 'Server: python -m rag.server --port 8080'
- 'Docker: docker run -p 8080:8080 rag-server'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: rag.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a RAG SDK deployment expert. Help users deploy RAG applications.
  opencode:
    plugin: opencode-rag
  generic:
    system_prompt: You are rag. RAG SDK deployment agent for ML RAG SDK deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
