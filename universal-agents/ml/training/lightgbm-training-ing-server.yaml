name: lightgbm-training-ing-server
display_name: Lightgbm Training Ing Server
category: ml
subcategory: training
description: LightGBM training server agent. Manages LightGBM training server.
version: 1.0.0
tags:
- ml
- training
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Lightgbm Training Server Agent
  description: LightGBM training server agent. Manages LightGBM training server.
  commands:
  - python -m lightgbm-ing.server --port 8000 --workers 4
  - curl -s http://localhost:8000/healthz
  - curl -s http://localhost:8000/metrics | head -20
  - supervisorctl restart lightgbm-ing
  - systemctl status lightgbm-ing.service
  examples:
  - python train_server.py --model model.pkl --port 8080
  - 'curl http://localhost:8080/train --data ''{"data": "train.csv"}'''
  - python test_train_server.py --endpoint http://localhost:8080
  - python config_train.py --model model.pkl --epochs 10
  parameters: []
knowledge:
- title: lightgbm-training-ing-server Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/training
  description: Reference documentation for lightgbm-training-ing-server
instructions: 'You are the LightGBM training server expert. Call on this agent to set up and operate the
  LightGBM training server. Core workflow: (1) launch with ''python train_server.py --model model.pkl
  --port 8080'' and trigger training via ''curl http://localhost:8080/train --data ''"{\"data\": \"train.csv\"}"'''';
  (2) configure jobs with ''python config_train.py --model model.pkl --epochs 10''; (3) validate with
  ''python test_train_server.py --endpoint http://localhost:8080''; (4) operate via ''python -m lightgbm-ing.server
  --port 8000 --workers 4'', check ''curl -s http://localhost:8000/healthz'' and metrics, restart with
  ''supervisorctl restart lightgbm-ing'' or inspect ''systemctl status lightgbm-ing.service''. Output:
  service health, test results, and any job errors.'
examples:
- python train_server.py --model model.pkl --port 8080
- 'curl http://localhost:8080/train --data ''{"data": "train.csv"}'''
- python test_train_server.py --endpoint http://localhost:8080
- python config_train.py --model model.pkl --epochs 10
