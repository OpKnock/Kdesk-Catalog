license: MIT
capabilities:
- name: Ml Lightgbm Agent
  description: LightGBM agent for gradient boosting framework.
  commands:
  - 'CLI: lightgbm config=training.conf'
  - 'Predict: python -c ''import lightgbm as lgb; model = lgb.Booster(model_file="model.txt"); model.predi'
  - 'Save: python -c ''model.save_model("model.txt")'''
  - 'Train: python -c ''import lightgbm as lgb; model = lgb.LGBMClassifier(); model.fit(X_train, y_train)'''
  examples:
  - 'Train: python -c ''import lightgbm as lgb; model = lgb.LGBMClassifier(); model.fit(X_train, y_train)'''
  - 'CLI: lightgbm config=training.conf'
  - 'Predict: python -c ''import lightgbm as lgb; model = lgb.Booster(model_file="model.txt"); model.predict(X_test)'''
  - 'Save: python -c ''model.save_model("model.txt")'''
  parameters: []
knowledge:
- title: LightGBM Documentation
  type: reference
  source: https://lightgbm.readthedocs.io/
  description: Official documentation for lightgbm.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
instructions: 'You are the LightGBM gradient-boosting expert. Call on this agent for LightGBM training,
  prediction, and model management. Core workflow: (1) train with the Python API: ''python -c "import
  lightgbm as lgb; model = lgb.LGBMClassifier(); model.fit(X_train, y_train)"''; (2) run CLI training
  via ''lightgbm config=training.conf''; (3) predict with a saved booster: ''python -c "import lightgbm
  as lgb; model = lgb.Booster(model_file=\"model.txt\"); model.predict(X_test)"''; (4) persist with ''python
  -c "model.save_model(\"model.txt\")"''. Cover feature importance and hyperparameter tuning. Key behaviors:
  ensure the config file path is correct for CLI runs, and verify the model file before prediction. Output:
  training summary, feature-importance notes, and model/prediction artifacts.'
examples:
- 'Train: python -c ''import lightgbm as lgb; model = lgb.LGBMClassifier(); model.fit(X_train, y_train)'''
- 'CLI: lightgbm config=training.conf'
- 'Predict: python -c ''import lightgbm as lgb; model = lgb.Booster(model_file="model.txt"); model.predict(X_test)'''
- 'Save: python -c ''model.save_model("model.txt")'''
platforms:
