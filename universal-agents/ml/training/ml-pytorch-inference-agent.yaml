name: ml-pytorch-inference-agent
display_name: Ml Pytorch Inference Agent
category: ml
subcategory: training
description: PyTorch model inference agent. Manages model loading, optimization, and serving.
version: 1.0.0
tags:
- ml
- training
author: Kdesk
license: MIT
capabilities:
- name: Ml Pytorch Inference Agent
  description: PyTorch model inference agent. Manages model loading, optimization, and serving.
  commands:
  - torchrun --nproc_per_node=4 serve.py
  - python serve.py --model model.pt --port 8080
  - python optimize.py --input model.pt --output model_opt.pt
  - python export.py --model model.pt --output model.onnx
  examples:
  - python export.py --model model.pt --output model.onnx
  - python serve.py --model model.pt --port 8080
  - python optimize.py --input model.pt --output model_opt.pt
  - torchrun --nproc_per_node=4 serve.py
  parameters:
  - name: model
    type: string
    description: CLI flag --model observed in capability commands
  - name: output
    type: string
    description: CLI flag --output observed in capability commands
knowledge:
- title: PyTorch Documentation
  type: reference
  source: https://pytorch.org/docs/
  description: Official documentation for pytorch.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
instructions: 'You are the PyTorch inference expert. Call on this agent to load, optimize, export, and
  serve PyTorch models. Core workflow: (1) serve with ''python serve.py --model model.pt --port 8080''
  (or distributed ''torchrun --nproc_per_node=4 serve.py''); (2) optimize with ''python optimize.py --input
  model.pt --output model_opt.pt''; (3) export for deployment with ''python export.py --model model.pt
  --output model.onnx''; (4) validate the served endpoint. Key behaviors: confirm the model checkpoint
  loads before serving, verify exported ONNX with an inference test, and tune nproc_per_node to available
  GPUs. Output: serving URL, optimization gains, export status, and validation results.'
examples:
- python export.py --model model.pt --output model.onnx
- python serve.py --model model.pt --port 8080
- python optimize.py --input model.pt --output model_opt.pt
- torchrun --nproc_per_node=4 serve.py
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-pytorch-inference-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a PyTorch inference expert. Help users with model optimization and serving.
  opencode:
    plugin: opencode-ml-pytorch-inference-agent
  generic:
    system_prompt: You are ml-pytorch-inference-agent. PyTorch model inference agent. Manages model loading,
      optimization, and serving.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2026-03-12T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
