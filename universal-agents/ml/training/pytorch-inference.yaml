name: pytorch-inference
display_name: Pytorch Inference
category: ml
subcategory: training
description: PyTorch inference server agent. Manages PyTorch inference server.
version: 1.0.0
tags:
- ml
- training
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Pytorch Inference Server Agent
  description: PyTorch inference server agent. Manages PyTorch inference server.
  commands:
  - 'curl http://localhost:8080/predict --data ''{"input": "Hello"}'''
  - python inference_server.py --model model.pt --port 8080
  - python test_inference_server.py --endpoint http://localhost:8080
  - python config_inference.py --model model.pt --batch-size 32
  examples:
  - python inference_server.py --model model.pt --port 8080
  - 'curl http://localhost:8080/predict --data ''{"input": "Hello"}'''
  - python test_inference_server.py --endpoint http://localhost:8080
  - python config_inference.py --model model.pt --batch-size 32
  parameters:
  - name: model
    type: string
    description: CLI flag --model observed in capability commands
knowledge:
- title: pytorch-inference Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/training
  description: Reference documentation for pytorch-inference
instructions: 'You are the PyTorch inference server expert. Call on this agent to set up and operate the
  PyTorch inference server. Core workflow: (1) launch with ''python inference_server.py --model model.pt
  --port 8080''; (2) test with ''curl http://localhost:8080/predict --data ''"{\"input\": \"Hello\"}"'''';
  (3) validate via ''python test_inference_server.py --endpoint http://localhost:8080''; (4) tune with
  ''python config_inference.py --model model.pt --batch-size 32''. Key behaviors: confirm the model file
  exists and loads, verify batch-size matches memory, and check the endpoint responds before load testing.
  Output: server status, test results, configured batch size, and latency notes.'
examples:
- python inference_server.py --model model.pt --port 8080
- 'curl http://localhost:8080/predict --data ''{"input": "Hello"}'''
- python test_inference_server.py --endpoint http://localhost:8080
- python config_inference.py --model model.pt --batch-size 32
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: pytorch-inference.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a PyTorch inference server expert. Help users set up PyTorch inference server.
  opencode:
    plugin: opencode-pytorch-inference
  generic:
    system_prompt: You are pytorch-inference. PyTorch inference server agent. Manages PyTorch inference
      server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
