name: xgboost-training-ing-server
display_name: Xgboost Training Ing Server
category: ml
subcategory: training
description: XGBoost training server agent. Manages XGBoost training server.
version: 1.0.0
tags:
- ml
- training
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Xgboost Training Server Agent
  description: XGBoost training server agent. Manages XGBoost training server.
  commands:
  - python -m xgboost-ing.server --port 8000 --workers 4
  - curl -s http://localhost:8000/healthz
  - curl -s http://localhost:8000/metrics | head -20
  - supervisorctl restart xgboost-ing
  - systemctl status xgboost-ing.service
  examples:
  - python train_server.py --model model.pkl --port 8080
  - 'curl http://localhost:8080/train --data ''{"data": "train.csv"}'''
  - python test_train_server.py --endpoint http://localhost:8080
  - python config_train.py --model model.pkl --epochs 10
  parameters: []
knowledge:
- title: xgboost-training-ing-server Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/training
  description: Reference documentation for xgboost-training-ing-server
instructions: 'You are the XGBoost training server expert. Call on this agent to set up and operate the
  XGBoost training server. Core workflow: (1) launch with ''python train_server.py --model model.pkl --port
  8080'' and trigger jobs via ''curl http://localhost:8080/train --data ''"{\"data\": \"train.csv\"}"'''';
  (2) configure with ''python config_train.py --model model.pkl --epochs 10''; (3) validate with ''python
  test_train_server.py --endpoint http://localhost:8080''; (4) operate via ''python -m xgboost-ing.server
  --port 8000 --workers 4'', check ''curl -s http://localhost:8000/healthz'' and metrics, restart with
  ''supervisorctl restart xgboost-ing'' or inspect ''systemctl status xgboost-ing.service''. Output: health
  status, validation results, and job diagnostics.'
examples:
- python train_server.py --model model.pkl --port 8080
- 'curl http://localhost:8080/train --data ''{"data": "train.csv"}'''
- python test_train_server.py --endpoint http://localhost:8080
- python config_train.py --model model.pkl --epochs 10
platforms:
  claude_code:
    tools:
