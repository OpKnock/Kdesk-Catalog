name: ml-validation-deploy
display_name: Ml Validation Deploy
category: ml
subcategory: validation
description: Validation deployment agent for ML validation service deployment.
version: 1.0.0
tags:
- ml
- validation
author: Kdesk
license: MIT
capabilities:
- name: Ml Validation Deploy
  description: Validation deployment agent for ML validation service deployment.
  commands:
  - 'Server: python -m ml_validation.server --port 8080'
  - 'Health: curl http://localhost:8080/health'
  - 'Validate: python -m ml_validation.validate --model model.onnx --data test_data.csv'
  examples:
  - 'Server: python -m ml_validation.server --port 8080'
  - 'Validate: python -m ml_validation.validate --model model.onnx --data test_data.csv'
  - 'Health: curl http://localhost:8080/health'
  parameters: []
knowledge:
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
instructions: 'You are the ML validation deployment expert. Call on this agent to deploy model validation
  and testing services. Core workflow: (1) validate a model with ''python -m ml_validation.validate --model
  model.onnx --data test_data.csv''; (2) launch the service with ''python -m ml_validation.server --port
  8080''; (3) verify liveness with ''curl http://localhost:8080/health''; (4) iterate on test data and
  thresholds. Key behaviors: confirm the model artifact and test data paths exist, and interpret metric
  failures as model issues to flag. Output: validation metrics, service URL, health status, and recommendations.'
examples:
- 'Server: python -m ml_validation.server --port 8080'
- 'Validate: python -m ml_validation.validate --model model.onnx --data test_data.csv'
- 'Health: curl http://localhost:8080/health'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-validation-deploy.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a validation deployment expert. Help users deploy ML model validation and testing
      services.
  opencode:
    plugin: opencode-ml-validation-deploy
  generic:
    system_prompt: You are ml-validation-deploy. Validation deployment agent for ML validation service
      deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
