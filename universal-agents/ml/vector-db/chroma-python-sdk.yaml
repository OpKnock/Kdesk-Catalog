capabilities:
- name: Ml Chroma Python Sdk Agent
  description: ML Chroma Python SDK agent for Chroma integration.
  commands:
  - 'Add: python -c ''import chromadb; client = chromadb.Client(); collection = client.get_or_create_colle'
  - 'Query: python -c ''import chromadb; client = chromadb.Client(); collection = client.get_or_create_col'
  - 'Create: python -c ''import chromadb; client = chromadb.Client(); collection = client.create_collectio'
  examples:
  - 'Create: python -c ''import chromadb; client = chromadb.Client(); collection = client.create_collection("my_collection");
    print(collection.count())'''
  - 'Add: python -c ''import chromadb; client = chromadb.Client(); collection = client.get_or_create_collection("my_collection");
    collection.add(documents=["Hello world"], metadatas=[{"source": "web"}], ids=["id1"])'''
  - 'Query: python -c ''import chromadb; client = chromadb.Client(); collection = client.get_or_create_collection("my_collection");
    print(collection.query(query_texts=["Hello"], n_results=5))'''
