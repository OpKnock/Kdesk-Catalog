name: elasticsearch-identity-py
display_name: Elasticsearch Identity Py
category: ml
subcategory: vector-db
description: Elasticsearch deployment agent. Manages Elasticsearch ML deployment.
version: 1.0.0
tags:
- ml
- vector-db
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Elasticsearch Deploy Agent
  description: Elasticsearch deployment agent. Manages Elasticsearch ML deployment.
  commands:
  - docker build -t elasticsearch:latest .
  - docker push registry.example.com/elasticsearch:latest
  - kubectl set image deployment/elasticsearch elasticsearch=registry.example.com/elasticsearch:latest
  - helm upgrade elasticsearch ./helm-chart --namespace production
  - kubectl rollout status deployment/elasticsearch --timeout=300s
  - python identity.py --agent elasticsearch-identity-py
  examples:
  - python create_index.py --name my-index --dimensions 1536
  - python index_vectors.py --index my-index --vectors vectors.json
  - python search_vectors.py --index my-index --query query_vector --k 10
  - python delete_vectors.py --index my-index --ids ids.json
  parameters: []
knowledge:
- title: elasticsearch-identity-py Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/vector-db
  description: Reference documentation for elasticsearch-identity-py
instructions: 'You are the Elasticsearch ML deployment expert. Call on this agent to deploy Elasticsearch-backed
  ML workloads. Core workflow: (1) package with ''docker build -t elasticsearch:latest .'' and publish
  via ''docker push registry.example.com/elasticsearch:latest''; (2) update the cluster with ''kubectl
  set image deployment/elasticsearch elasticsearch=registry.example.com/elasticsearch:latest'' and release
  via ''helm upgrade elasticsearch ./helm-chart --namespace production''; (3) verify with ''kubectl rollout
  status deployment/elasticsearch --timeout=300s''; (4) prepare indexes with ''python create_index.py
  --name my-index --dimensions 1536'', index with ''python index_vectors.py --index my-index --vectors
  vectors.json'', search with ''python search_vectors.py --index my-index --query query_vector --k 10'',
  and clean with ''python delete_vectors.py --index my-index --ids ids.json''; run ''python identity.py
  --agent elasticsearch-identity-py''. Output: rollout status and vector operation results.'
examples:
- python create_index.py --name my-index --dimensions 1536
- python index_vectors.py --index my-index --vectors vectors.json
- python search_vectors.py --index my-index --query query_vector --k 10
- python delete_vectors.py --index my-index --ids ids.json
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: elasticsearch-identity-py.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an Elasticsearch deployment expert. Help users deploy Elasticsearch ML applications.
  opencode:
    plugin: opencode-elasticsearch-identity-py
  generic:
    system_prompt: You are elasticsearch-identity-py. Elasticsearch deployment agent. Manages Elasticsearch
      ML deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2024-01-01T00:00:00Z'
updated_at: '2024-01-01T00:00:00Z'
