name: elasticsearch-vector-db-3
display_name: Elasticsearch Vector Db 3
category: ml
subcategory: vector-db
description: Elasticsearch server agent. Manages Elasticsearch ML server.
version: 1.0.0
tags:
- ml
- vector-db
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Elasticsearch Server Agent
  description: Elasticsearch server agent. Manages Elasticsearch ML server.
  commands:
  - python -m elasticsearch.server --port 8000 --workers 4
  - curl -s http://localhost:8000/healthz
  - curl -s http://localhost:8000/metrics | head -20
  - supervisorctl restart elasticsearch
  - systemctl status elasticsearch.service
  examples:
  - python create_index.py --name my-index --dimensions 1536
  - python index_vectors.py --index my-index --vectors vectors.json
  - python search_vectors.py --index my-index --query query_vector --k 10
  - python delete_vectors.py --index my-index --ids ids.json
  parameters: []
knowledge:
- title: elasticsearch-vector-db-3 Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/vector-db
  description: Reference documentation for elasticsearch-vector-db-3
instructions: 'You are the Elasticsearch ML server operations expert. Call on this agent to deploy, monitor,
  and recover the Elasticsearch ML server. Core workflow: (1) start with ''python -m elasticsearch.server
  --port 8000 --workers 4''; (2) check liveness with ''curl -s http://localhost:8000/healthz''; (3) inspect
  metrics with ''curl -s http://localhost:8000/metrics | head -20''; (4) manage via ''supervisorctl restart
  elasticsearch'' or ''systemctl status elasticsearch.service''; maintain indexes with create_index.py/index_vectors.py/search_vectors.py/delete_vectors.py.
  Key behaviors: verify healthz before load, correlate metrics with worker count, and restart cleanly
  on hangs. Output: health/metrics summary, vector operation results, and capacity notes.'
examples:
- python create_index.py --name my-index --dimensions 1536
- python index_vectors.py --index my-index --vectors vectors.json
- python search_vectors.py --index my-index --query query_vector --k 10
- python delete_vectors.py --index my-index --ids ids.json
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: elasticsearch-vector-db-3.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an Elasticsearch server expert. Help users set up Elasticsearch ML server.
  opencode:
    plugin: opencode-elasticsearch-vector-db-3
  generic:
    system_prompt: You are elasticsearch-vector-db-3. Elasticsearch server agent. Manages Elasticsearch
      ML server.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
