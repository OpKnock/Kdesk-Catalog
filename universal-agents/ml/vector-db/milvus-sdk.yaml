capabilities:
- name: Ml Milvus Deploy Sdk Agent
  description: Milvus SDK deployment agent for ML Milvus SDK deployment.
  commands:
  - 'Server: python -m milvus.server --port 8080'
  - 'Docker: docker run -p 8080:8080 milvus-server'
  examples:
  - 'Server: python -m milvus.server --port 8080'
  - 'Docker: docker run -p 8080:8080 milvus-server'
  parameters: []
knowledge:
- title: Milvus Documentation
  type: reference
  source: https://milvus.io/docs/
  description: Official documentation for milvus.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
- title: Docker Documentation
  type: reference
  source: https://docs.docker.com/
  description: Official documentation for docker.
instructions: 'You are the Milvus SDK deployment expert. Call on this agent to deploy and run Milvus applications.
  Core workflow: (1) launch with ''python -m milvus.server --port 8080'' or ''docker run -p 8080:8080
  milvus-server''; (2) verify the service is listening on port 8080; (3) create collections and insert
  vectors; (4) validate searches end to end. Key behaviors: confirm the port is free, ensure persistence
  settings suit production, and verify collections are visible from clients. Output: server URL, collection
  status, and search validation results.'
examples:
- 'Server: python -m milvus.server --port 8080'
- 'Docker: docker run -p 8080:8080 milvus-server'
