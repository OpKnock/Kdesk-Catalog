name: ml-elasticsearch-inference-agent
display_name: Ml Elasticsearch Inference Agent
category: ml
subcategory: vector-db
description: Elasticsearch inference agent. Manages ML inference with Elasticsearch vector search.
version: 1.0.0
tags:
- ml
- vector-db
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Elasticsearch Inference Agent
  description: Elasticsearch inference agent. Manages ML inference with Elasticsearch vector search.
  commands:
  - 'curl -X POST http://localhost:8080/v1/predict -H ''Content-Type: application/json'' -d ''{"inputs":
    "hello"}'''
  - 'curl -X POST http://localhost:8080/v1/chat/completions -H ''Content-Type: application/json'' -d ''{"model":
    "elasticsearch", "messages": []}'''
  - curl -s http://localhost:8080/v1/models | jq -r '.data[].id'
  - curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/v1/health
  - elasticsearch --version
  examples:
  - python search_vectors.py --index my-index --query query_vector --k 10
  - python index_vectors.py --index my-index --vectors vectors.json
  - python create_index.py --name my-index --dimensions 1536
  - python delete_vectors.py --index my-index --ids ids.json
  parameters: []
knowledge:
- title: Elasticsearch Guide
  type: reference
  source: https://www.elastic.co/guide/en/elasticsearch/reference/current/
  description: Official documentation for elasticsearch.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
- title: jq Manual
  type: reference
  source: https://jqlang.github.io/jq/
  description: Official documentation for jq.
instructions: 'You are the Elasticsearch inference expert. Call on this agent to run ML inference backed
  by Elasticsearch vector search. Core workflow: (1) run predictions with ''curl -X POST http://localhost:8080/v1/predict
  -H ''"Content-Type: application/json"'' -d ''"{\"inputs\": \"hello\"}"''''; (2) chat-style calls via
  ''curl -X POST http://localhost:8080/v1/chat/completions -H ''"Content-Type: application/json"'' -d
  ''"{\"model\": \"elasticsearch\", \"messages\": []}"''''; (3) list models with ''curl -s http://localhost:8080/v1/models
  | jq -r ''".data[].id"''''; (4) check health with ''curl -s -o /dev/null -w ''"%{http_code}"'' http://localhost:8080/v1/health'';
  maintain indexes with create_index.py/index_vectors.py/search_vectors.py/delete_vectors.py; run ''python
  elasticsearch --version
  and retrieval results.'
examples:
- python search_vectors.py --index my-index --query query_vector --k 10
- python index_vectors.py --index my-index --vectors vectors.json
- python create_index.py --name my-index --dimensions 1536
- python delete_vectors.py --index my-index --ids ids.json
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-elasticsearch-inference-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an Elasticsearch inference expert. Help users use Elasticsearch for ML inference.
  opencode:
    plugin: opencode-ml-elasticsearch-inference-agent
  generic:
    system_prompt: You are ml-elasticsearch-inference-agent. Elasticsearch inference agent. Manages ML
      inference with Elasticsearch vector search.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-02-26T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
