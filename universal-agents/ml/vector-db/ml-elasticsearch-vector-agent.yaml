name: ml-elasticsearch-vector-agent
display_name: Ml Elasticsearch Vector Agent
category: ml
subcategory: vector-db
description: Elasticsearch vector operations agent. Manages Elasticsearch vector search operations.
version: 1.0.0
tags:
- ml
- vector-db
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Elasticsearch Vector Agent
  description: Elasticsearch vector operations agent. Manages Elasticsearch vector search operations.
  commands:
  - python index_vectors.py --collection elasticsearch --dimension 1536 --metric cosine
  - python upsert.py --collection elasticsearch --namespace default --vectors vectors.json
  - python query.py --collection elasticsearch --top-k 10 --include-metadata
  - 'python list_collections.py --filter ''{"name": "elasticsearch"}'''
  examples:
  - python create_index.py --name my-index --dimensions 1536
  - python index_vectors.py --index my-index --vectors vectors.json
  - python search_vectors.py --index my-index --query query_vector --k 10
  - python delete_vectors.py --index my-index --ids ids.json
  parameters:
  - name: collection
    type: string
    description: CLI flag --collection observed in capability commands
knowledge:
- title: Elasticsearch Guide
  type: reference
  source: https://www.elastic.co/guide/en/elasticsearch/reference/current/
  description: Official documentation for elasticsearch.
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
instructions: 'You are the Elasticsearch vector operations expert. Call on this agent to manage Elasticsearch
  vector search. Core workflow: (1) create the index with ''python index_vectors.py --collection elasticsearch
  --dimension 1536 --metric cosine''; (2) upsert vectors with ''python upsert.py --collection elasticsearch
  --namespace default --vectors vectors.json''; (3) query with ''python query.py --collection elasticsearch
  --top-k 10 --include-metadata''; (4) list with ''python list_collections.py --filter ''"{\"name\": \"elasticsearch\"}"''''.
  Key behaviors: keep dimensions consistent with your embedding model, validate vectors.json, and confirm
  namespace names. Output: index status, upsert counts, top-k results, and collection list.'
examples:
- python create_index.py --name my-index --dimensions 1536
- python index_vectors.py --index my-index --vectors vectors.json
- python search_vectors.py --index my-index --query query_vector --k 10
- python delete_vectors.py --index my-index --ids ids.json
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-elasticsearch-vector-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an Elasticsearch vector operations expert. Help users manage Elasticsearch vector
      search.
  opencode:
    plugin: opencode-ml-elasticsearch-vector-agent
  generic:
    system_prompt: You are ml-elasticsearch-vector-agent. Elasticsearch vector operations agent. Manages
      Elasticsearch vector search operations.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-07-26T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
