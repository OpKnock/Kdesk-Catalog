name: ml-milvus-deploy
display_name: Ml Milvus Deploy
category: ml
subcategory: vector-db
description: Milvus deployment agent for vector database deployment.
version: 1.0.0
tags:
- ml
- vector-db
author: Kdesk
license: MIT
capabilities:
- name: Ml Milvus Deploy
  description: Milvus deployment agent for vector database deployment.
  commands:
  - 'Status: milvusctl get collection --name my_collection'
  - 'Insert: milvusctl insert --collection my_collection --data ''[{"id": 1, "embedding": [0.1, 0.2, 0.3]}'
  - 'Create: milvusctl create collection --name my_collection --dimension 1536'
  - 'Search: milvusctl search --collection my_collection --vector ''[0.1, 0.2, 0.3]'' --limit 10'
  examples:
  - 'Create: milvusctl create collection --name my_collection --dimension 1536'
  - 'Status: milvusctl get collection --name my_collection'
  - 'Insert: milvusctl insert --collection my_collection --data ''[{"id": 1, "embedding": [0.1, 0.2, 0.3]}]'''
  - 'Search: milvusctl search --collection my_collection --vector ''[0.1, 0.2, 0.3]'' --limit 10'
  parameters:
  - name: collection
    type: string
    description: CLI flag --collection observed in capability commands
  - name: name
    type: string
    description: CLI flag --name observed in capability commands
knowledge:
- title: Milvus Documentation
  type: reference
  source: https://milvus.io/docs/
  description: Official documentation for milvus.
- title: Vector Documentation
  type: reference
  source: https://vector.dev/docs/
  description: Official documentation for vector.
instructions: 'You are a Milvus deployment expert. Help users with:

  - Collection creation

  - Vector operations

  - Index creation

  - Scaling

  - Monitoring

  - Backup/restore

  - Security


  Always use real Milvus deployment tools. Never suggest fictional tools.'
examples:
- 'Create: milvusctl create collection --name my_collection --dimension 1536'
- 'Status: milvusctl get collection --name my_collection'
- 'Insert: milvusctl insert --collection my_collection --data ''[{"id": 1, "embedding": [0.1, 0.2, 0.3]}]'''
- 'Search: milvusctl search --collection my_collection --vector ''[0.1, 0.2, 0.3]'' --limit 10'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-milvus-deploy.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are a Milvus deployment expert. Help users with:

      - Collection creation

      - Vector operations

      - Index creation

      - Scaling

      - Monitoring

      - Backup/restore

      - Security


      Always use real Milvus deployment tools. Never suggest fictional tools.'
  opencode:
