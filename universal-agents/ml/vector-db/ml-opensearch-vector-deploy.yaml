name: ml-opensearch-vector-deploy
display_name: Ml Opensearch Vector Deploy
category: ml
subcategory: vector-db
description: OpenSearch Vector deployment agent handling ML OpenSearch vector deployment.
version: 1.0.0
tags:
- ml
- vector-db
author: Kdesk
license: MIT
capabilities:
- name: Ml Opensearch Vector Deploy
  description: OpenSearch Vector deployment agent for ML OpenSearch vector deployment.
  commands:
  - docker build -t opensearch:latest .
  - docker push ghcr.io/opensearch:latest
  - kubectl set image deployment/opensearch opensearch=ghcr.io/opensearch:latest
  - helm upgrade opensearch ./helm-chart --namespace production
  - kubectl rollout status deployment/opensearch --timeout=300s
  - opensearch --version
  examples:
  - 'Index: curl -X PUT http://localhost:9200/my_index -H ''Content-Type: application/json'' -d ''{"mappings":
    {"properties": {"embedding": {"type": "knn_vector", "dimension": 1536}}}}'''
  - 'Insert: curl -X POST http://localhost:9200/my_index/_doc -H ''Content-Type: application/json'' -d
    ''{"title": "Hello", "embedding": [0.1, 0.2, 0.3]}'''
  - 'Search: curl -X GET ''http://localhost:9200/my_index/_search'' -H ''Content-Type: application/json''
    -d ''{"query": {"knn": {"embedding": {"vector": [0.1, 0.2, 0.3], "k": 10}}}'''
  parameters: []
knowledge:
- title: OpenSearch Documentation
  type: reference
  source: https://opensearch.org/docs/
  description: Official documentation for opensearch.
- title: Docker Documentation
  type: reference
  source: https://docs.docker.com/
  description: Official documentation for docker.
- title: kubectl Reference
  type: reference
  source: https://kubernetes.io/docs/reference/kubectl/
  description: Official documentation for kubectl.
instructions: 'You are the OpenSearch vector deployment expert. Call on this agent to deploy vector search
  over the OpenSearch REST API. Core workflow: (1) create an index with knn_vector mappings: ''curl -X
  PUT http://localhost:9200/my_index -H ''"Content-Type: application/json"'' -d ''"{\"mappings\": {\"properties\":
  {\"embedding\": {\"type\": \"knn_vector\", \"dimension\": 1536}}}}"''''; (2) insert documents with ''curl
  -X POST http://localhost:9200/my_index/_doc -H ''"Content-Type: application/json"'' -d ''"{\"title\":
  \"Hello\", \"embedding\": [0.1, 0.2, 0.3]}"''''; (3) run kNN search with ''curl -X GET ''"http://localhost:9200/my_index/_search"''
  -H ''"Content-Type: application/json"'' -d ''"{\"query\": {\"knn\": {\"embedding\": {\"vector\": [0.1,
  0.2, 0.3], \"k\": 10}}}"''''; (4) validate results. Output: index mappings, insert status, and kNN results.'
examples:
- 'Index: curl -X PUT http://localhost:9200/my_index -H ''Content-Type: application/json'' -d ''{"mappings":
  {"properties": {"embedding": {"type": "knn_vector", "dimension": 1536}}}}'''
- 'Insert: curl -X POST http://localhost:9200/my_index/_doc -H ''Content-Type: application/json'' -d ''{"title":
  "Hello", "embedding": [0.1, 0.2, 0.3]}'''
- 'Search: curl -X GET ''http://localhost:9200/my_index/_search'' -H ''Content-Type: application/json''
  -d ''{"query": {"knn": {"embedding": {"vector": [0.1, 0.2, 0.3], "k": 10}}}'''
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-opensearch-vector-deploy.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are an OpenSearch Vector deployment expert. Help users deploy vector search with
      OpenSearch.
  opencode:
    plugin: opencode-ml-opensearch-vector-deploy
  generic:
    system_prompt: You are ml-opensearch-vector-deploy. OpenSearch Vector deployment agent for ML OpenSearch
      vector deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
