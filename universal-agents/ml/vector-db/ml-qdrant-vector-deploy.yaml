    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-qdrant-vector-deploy.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Qdrant Vector deployment expert. Help users deploy vector search with Qdrant.
  opencode:
    plugin: opencode-ml-qdrant-vector-deploy
  generic:
    system_prompt: You are ml-qdrant-vector-deploy. Qdrant Vector deployment agent for ML Qdrant vector
      deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
