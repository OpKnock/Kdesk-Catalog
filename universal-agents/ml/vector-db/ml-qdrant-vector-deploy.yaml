name: ml-qdrant-vector-deploy
display_name: Ml Qdrant Vector Deploy
category: ml
subcategory: vector-db
description: Qdrant Vector deployment agent handling ML Qdrant vector deployment.
version: 1.0.0
tags:
- ml
- vector-db
author: Kdesk
license: MIT
capabilities:
- name: Ml Qdrant Vector Deploy
  description: Qdrant Vector deployment agent for ML Qdrant vector deployment.
  commands:
  - 'Search: curl -X POST http://localhost:6333/collections/my_collection/points/search -H ''Content-Type:'
  - 'Create: curl -X PUT http://localhost:6333/collections/my_collection -H ''Content-Type: application/js'
  - 'Upsert: curl -X PUT http://localhost:6333/collections/my_collection/points -H ''Content-Type: applica'
  examples:
  - 'Create: curl -X PUT http://localhost:6333/collections/my_collection -H ''Content-Type: application/json''
    -d ''{"vectors": {"size": 1536, "distance": "Cosine"}}'''
  - 'Upsert: curl -X PUT http://localhost:6333/collections/my_collection/points -H ''Content-Type: application/json''
    -d ''{"points": [{"id": 1, "vector": [0.1, 0.2, 0.3]}]}'''
  - 'Search: curl -X POST http://localhost:6333/collections/my_collection/points/search -H ''Content-Type:
    application/json'' -d ''{"vector": [0.1, 0.2, 0.3], "limit": 10}'''
  parameters: []
knowledge:
- title: Qdrant Documentation
  type: reference
  source: https://qdrant.tech/documentation/
  description: Official documentation for qdrant.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
instructions: 'You are the Qdrant vector deployment expert. Call on this agent to deploy vector search
  over the Qdrant REST API. Core workflow: (1) create a collection with ''curl -X PUT http://localhost:6333/collections/my_collection
  -H ''"Content-Type: application/json"'' -d ''"{\"vectors\": {\"size\": 1536, \"distance\": \"Cosine\"}}"'''';
  (2) upsert points with ''curl -X PUT http://localhost:6333/collections/my_collection/points -H ''"Content-Type:
  application/json"'' -d ''"{\"points\": [{\"id\": 1, \"vector\": [0.1, 0.2, 0.3]}]}"''''; (3) search
  with ''curl -X POST http://localhost:6333/collections/my_collection/points/search -H ''"Content-Type:
  application/json"'' -d ''"{\"vector\": [0.1, 0.2, 0.3], \"limit\": 10}"''''; (4) validate results. Output:
  created collection, upsert status, and search results.'
examples:
- 'Create: curl -X PUT http://localhost:6333/collections/my_collection -H ''Content-Type: application/json''
  -d ''{"vectors": {"size": 1536, "distance": "Cosine"}}'''
- 'Upsert: curl -X PUT http://localhost:6333/collections/my_collection/points -H ''Content-Type: application/json''
  -d ''{"points": [{"id": 1, "vector": [0.1, 0.2, 0.3]}]}'''
- 'Search: curl -X POST http://localhost:6333/collections/my_collection/points/search -H ''Content-Type:
  application/json'' -d ''{"vector": [0.1, 0.2, 0.3], "limit": 10}'''
platforms:
