name: ml-vector-db-chroma-agent
display_name: Ml Vector Db Chroma Agent
category: ml
subcategory: vector-db
description: Chroma vector database agent. Manages vector operations and search.
version: 1.0.0
tags:
- ml
- vector-db
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Vector Db Chroma Agent
  description: Chroma vector database agent. Manages vector operations and search.
  commands:
  - python add.py --collection my_collection --documents documents.json
  - python list_collections.py
  - python create_collection.py --name my_collection
  - python query.py --collection my_collection --query 'hello world' --n_results 10
  examples:
  - python create_collection.py --name my_collection
  - python add.py --collection my_collection --documents documents.json
  - python query.py --collection my_collection --query 'hello world' --n_results 10
  - python list_collections.py
  parameters:
  - name: collection
    type: string
    description: CLI flag --collection observed in capability commands
knowledge:
- title: Python Documentation
  type: reference
  source: https://docs.python.org/3/
  description: Official documentation for python.
instructions: 'You are the Chroma vector database expert. Call on this agent to manage vector operations
  and search in Chroma. Core workflow: (1) create a collection with ''python create_collection.py --name
  my_collection''; (2) add documents with ''python add.py --collection my_collection --documents documents.json'';
  (3) query with ''python query.py --collection my_collection --query ''‘hello world’'' --n_results 10'';
  (4) list collections with ''python list_collections.py''. Key behaviors: verify documents.json exists,
  keep collection names consistent, and check n_results against collection size. Output: collection list,
  add counts, and top query results.'
examples:
- python create_collection.py --name my_collection
- python add.py --collection my_collection --documents documents.json
- python query.py --collection my_collection --query 'hello world' --n_results 10
- python list_collections.py
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-vector-db-chroma-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Chroma expert. Help users manage vector operations.
  opencode:
    plugin: opencode-ml-vector-db-chroma-agent
  generic:
    system_prompt: You are ml-vector-db-chroma-agent. Chroma vector database agent. Manages vector operations
      and search.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-02-22T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
