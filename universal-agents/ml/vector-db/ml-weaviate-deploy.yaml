name: ml-weaviate-deploy
display_name: Ml Weaviate Deploy
category: ml
subcategory: vector-db
description: Weaviate deployment agent for vector database deployment.
version: 1.0.0
tags:
- ml
- vector-db
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Weaviate Deploy
  description: Weaviate deployment agent for vector database deployment.
  commands:
  - 'Schema: curl -X POST http://localhost:8080/v1/schema -H ''Content-Type: application/json'' -d ''{"class'
  - 'Object: curl -X POST http://localhost:8080/v1/objects -H ''Content-Type: application/json'' -d ''{"clas'
  - 'Query: curl -X POST http://localhost:8080/v1/graphql -H ''Content-Type: application/json'' -d ''{"query'
  - 'Status: curl http://localhost:8080/v1/.well-known/ready'
  examples:
  - 'Schema: curl -X POST http://localhost:8080/v1/schema -H ''Content-Type: application/json'' -d ''{"class":
    "Article", "vectorizer": "text2vec-openai"}'''
  - 'Object: curl -X POST http://localhost:8080/v1/objects -H ''Content-Type: application/json'' -d ''{"class":
    "Article", "properties": {"title": "Hello"}}'''
  - 'Query: curl -X POST http://localhost:8080/v1/graphql -H ''Content-Type: application/json'' -d ''{"query":
    "{Get {Article(nearText: {concepts: [\"machine learning\"]}) {title}}}''}'''
  - 'Status: curl http://localhost:8080/v1/.well-known/ready'
  parameters: []
knowledge:
- title: Weaviate Documentation
  type: reference
  source: https://weaviate.io/developers/weaviate/
  description: Official documentation for weaviate.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
- title: GraphQL Specification
  type: reference
  source: https://graphql.org/learn/
  description: Official documentation for graphql.
instructions: 'You are a Weaviate deployment expert. Help users with:

  - Schema creation

  - Object operations

  - Vector search

  - Scaling

  - Monitoring

  - Backup/restore

  - Security


  Always use real Weaviate deployment tools. Never suggest fictional tools.'
examples:
- 'Schema: curl -X POST http://localhost:8080/v1/schema -H ''Content-Type: application/json'' -d ''{"class":
  "Article", "vectorizer": "text2vec-openai"}'''
- 'Object: curl -X POST http://localhost:8080/v1/objects -H ''Content-Type: application/json'' -d ''{"class":
  "Article", "properties": {"title": "Hello"}}'''
- 'Query: curl -X POST http://localhost:8080/v1/graphql -H ''Content-Type: application/json'' -d ''{"query":
  "{Get {Article(nearText: {concepts: [\"machine learning\"]}) {title}}}''}'''
- 'Status: curl http://localhost:8080/v1/.well-known/ready'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ml-weaviate-deploy.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are a Weaviate deployment expert. Help users with:

      - Schema creation

      - Object operations

      - Vector search

      - Scaling

      - Monitoring

      - Backup/restore

      - Security


      Always use real Weaviate deployment tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-ml-weaviate-deploy
  generic:
    system_prompt: You are ml-weaviate-deploy. Weaviate deployment agent for vector database deployment.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
