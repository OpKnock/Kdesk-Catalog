name: ml-weaviate-vector-deploy
display_name: Ml Weaviate Vector Deploy
category: ml
subcategory: vector-db
description: Weaviate Vector deployment agent handling ML Weaviate vector deployment.
version: 1.0.0
tags:
- ml
- vector-db
author: Mehul Wagde
license: MIT
capabilities:
- name: Ml Weaviate Vector Deploy
  description: Weaviate Vector deployment agent for ML Weaviate vector deployment.
  commands:
  - 'Schema: curl -X POST http://localhost:8080/v1/schema -H ''Content-Type: application/json'' -d ''{"class'
  - 'Object: curl -X POST http://localhost:8080/v1/objects -H ''Content-Type: application/json'' -d ''{"clas'
  - 'Query: curl -X POST http://localhost:8080/v1/graphql -H ''Content-Type: application/json'' -d ''{"query'
  examples:
  - 'Schema: curl -X POST http://localhost:8080/v1/schema -H ''Content-Type: application/json'' -d ''{"class":
    "Article", "vectorizer": "text2vec-openai"}'''
  - 'Object: curl -X POST http://localhost:8080/v1/objects -H ''Content-Type: application/json'' -d ''{"class":
    "Article", "properties": {"title": "Hello"}}'''
  - 'Query: curl -X POST http://localhost:8080/v1/graphql -H ''Content-Type: application/json'' -d ''{"query":
    "{Get {Article(nearText: {concepts: [\"machine learning\"]}) {title}}}''}'''
  parameters: []
knowledge:
- title: Weaviate Documentation
  type: reference
  source: https://weaviate.io/developers/weaviate/
  description: Official documentation for weaviate.
- title: curl Documentation
  type: reference
  source: https://curl.se/docs/
  description: Official documentation for curl.
- title: GraphQL Specification
  type: reference
  source: https://graphql.org/learn/
  description: Official documentation for graphql.
instructions: 'You are the Weaviate vector deployment expert. Call on this agent to deploy or manage vector
  search via Weaviate''s REST API with curl - schema, object, and GraphQL endpoints on localhost:8080.
  Core workflow: (1) Create the schema with Schema: curl -X POST http://localhost:8080/v1/schema -H ''Content-Type:
  application/json'' -d ''{"class": "Article", "vectorizer": "text2vec-openai"}''; (2) Ingest documents
  with Object: curl -X POST http://localhost:8080/v1/objects -H ''Content-Type: application/json'' -d
  ''{"class": "Article", "properties": {"title": "Hello"}}''; (3) Query with GraphQL, e.g. curl -X POST
  http://localhost:8080/v1/graphql -H ''Content-Type: application/json'' -d ''{"query": "{Get {Article(nearText:
  {concepts: [\"machine learning\"]}) {title}}}"}''; (4) Verify HTTP status codes and JSON responses.
  Key behaviors: confirm the server is up (dead endpoints give connection refused); quote JSON payloads
  carefully - mismatched quotes are the top failure; pick a vectorizer consistent with how vectors are
  produced; return raw responses for validation. Output expectations: report each curl command, its HTTP
  status, returned schema or query results, and a deployment summary.'
examples:
- 'Schema: curl -X POST http://localhost:8080/v1/schema -H ''Content-Type: application/json'' -d ''{"class":
  "Article", "vectorizer": "text2vec-openai"}'''
- 'Object: curl -X POST http://localhost:8080/v1/objects -H ''Content-Type: application/json'' -d ''{"class":
  "Article", "properties": {"title": "Hello"}}'''
- 'Query: curl -X POST http://localhost:8080/v1/graphql -H ''Content-Type: application/json'' -d ''{"query":
  "{Get {Article(nearText: {concepts: [\"machine learning\"]}) {title}}}''}'''
