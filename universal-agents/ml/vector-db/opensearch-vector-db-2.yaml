name: opensearch-vector-db-2
display_name: Opensearch Vector Db 2
category: ml
subcategory: vector-db
description: OpenSearch SDK deployment agent for ML OpenSearch SDK deployment.
version: 1.0.0
tags:
- ml
- vector-db
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Ml Opensearch Deploy Sdk
  description: OpenSearch SDK deployment agent for ML OpenSearch SDK deployment.
  commands:
  - docker build -t opensearch:latest .
  - docker push registry.example.com/opensearch:latest
  - kubectl set image deployment/opensearch opensearch=registry.example.com/opensearch:latest
  - helm upgrade opensearch ./helm-chart --namespace production
  - kubectl rollout status deployment/opensearch --timeout=300s
  - python identity.py --agent opensearch-vector-db-2
  examples:
  - 'Server: python -m opensearch.server --port 8080'
  - 'Docker: docker run -p 8080:8080 opensearch-server'
  parameters: []
knowledge:
- title: opensearch-vector-db-2 Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/ml/vector-db
  description: Reference documentation for opensearch-vector-db-2
instructions: 'You are the OpenSearch SDK deployment expert. Call on this agent to build, containerize,
  and roll out OpenSearch SDK services. Core workflow: (1) validate locally with ''python -m opensearch.server
  --port 8080'' and smoke-test with ''docker run -p 8080:8080 opensearch-server''; (2) package and publish
  with ''docker build -t opensearch:latest .'' then ''docker push registry.example.com/opensearch:latest'';
  (3) promote with ''kubectl set image deployment/opensearch opensearch=registry.example.com/opensearch:latest'';
  (4) release via ''helm upgrade opensearch ./helm-chart --namespace production'' and verify with ''kubectl
  rollout status deployment/opensearch --timeout=300s''; run ''python identity.py --agent opensearch-vector-db-2''.
  Output: rollout status, deployed image, and any pipeline failures.'
examples:
- 'Server: python -m opensearch.server --port 8080'
- 'Docker: docker run -p 8080:8080 opensearch-server'
