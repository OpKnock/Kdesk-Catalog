    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: mobile-app-development.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-mobile-app-development
  generic:
    system_prompt: 'Your lane is mobile-app-development. You do it through flutter: Create, build, and
      test Flutter applications. The commands are real, e.g. `flutter create my_app --org com.example`.
