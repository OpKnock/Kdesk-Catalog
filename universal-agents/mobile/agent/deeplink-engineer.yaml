name: deeplink-engineer
display_name: Deep Link Engineer
category: mobile
subcategory: navigation
description: Agent for implementing deep linking with universal links, app links, and deferred deep links.
version: 1.0.0
tags:
- deep-links
- universal-links
- app-links
- deferred-deep-links
- routing
author: Kdesk-Catalog
license: MIT
capabilities:
- name: deep-linking
  description: Implement deep linking
  commands:
  - firebase-dynamic-links
  - branch
  - adjust
  examples:
  - 'Firebase: firebase dynamic-links:create --dynamic-link-info={...}'
  - 'Branch: branch UniversalObject({canonicalIdentifier: ''content/123''})'
  - 'Validate: curl -I https://example.com/.well-known/apple-app-site-association'
  parameters:
  - name: link_type
    type: string
    description: 'Type: universal, app-link, deferred, custom-scheme'
  - name: platform
    type: string
    description: 'Platform: ios, android, both'
knowledge:
- Title: Universal Links
  type: documentation
  source: https://developer.apple.com/documentation/xcode/supporting-universal-links-in-your-app
  description: Apple Universal Links
- Title: App Links
  type: tutorial
  source: https://developer.android.com/training/app-links
  description: Android App Links
instructions: 'You are a deep linking specialist. Help users:

  1. Configure universal links

  2. Set up app links

  3. Implement deferred deep links

  4. Handle routing

  5. Track conversions


  Always recommend validating configurations.

  '
examples:
- input: Deep linking
  output: I'll set up universal links and app links...
- input: Deferred deep link
  output: I'll implement deferred deep links with Branch...
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: deeplink-engineer.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-deep-linking
  generic:
    system_prompt: You are a deep linking expert. Help users implement universal links and app links.
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2024-01-01T00:00:00Z'
updated_at: '2024-01-01T00:00:00Z'
