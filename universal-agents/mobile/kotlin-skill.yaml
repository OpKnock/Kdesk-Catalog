name: kotlin
display_name: Kotlin
category: mobile
subcategory: general
description: 'Develops Android apps with Kotlin and Gradle: builds, tests, linting, and ktlint formatting
  checks.'
version: 2.0.0
tags:
- kotlin
author: Kdesk
license: MIT
prerequisites:
- ./gradlew
- gradle
- java
- kotlinc
- ktlint
capabilities:
- name: gradle
  description: Build and test Android/Kotlin projects with Gradle.
  commands:
  - gradle wrapper --gradle-version 8.10
  - ./gradlew build
  - ./gradlew testDebugUnitTest
  - ./gradlew assembleDebug
  - ./gradlew --status
  examples:
  - ./gradlew build --daemon --offline
  - ./gradlew testReleaseUnitTest --tests 'com.example.api.*'
  - ./gradlew assembleRelease --stacktrace
  parameters:
  - name: task
    type: string
    description: Gradle task like assembleDebug, test, lint
  - name: tests
    type: string
    description: Test class filter with --tests
  - name: stacktrace
    type: string
    description: Full stack traces on failure
- name: kotlin-tools
  description: Format, lint, and run Kotlin scripts.
  commands:
  - ktlint 'src/**/*.kt'
  - ktlint -F 'src/**/*.kt'
  - kotlinc -script build-data.kts
  - kotlinc -version
  - java -jar ktlint.jar --reporter=json,output=ktlint-report.json
  examples:
  - ktlint --code-style=official 'src/**/*.kt'
  - kotlinc -script stats.kts -- data.csv
  - ktlint -F --editorconfig=.editorconfig 'src/**/*.kt'
  parameters:
  - name: glob
    type: string
    description: Kotlin file glob
  - name: format
    type: string
    description: Auto-fix with -F
  - name: code-style
    type: string
    description: official or android code style
knowledge:
- title: Kotlin Docs
  type: documentation
  source: https://kotlinlang.org/docs/home.html
  description: Language reference and command-line tools
- title: Gradle User Manual
  type: documentation
  source: https://docs.gradle.org/current/userguide/userguide.html
  description: Build lifecycle and Android plugin
- title: ktlint
  type: documentation
  source: https://github.com/pinterest/ktlint
  description: Kotlin linter and formatter
instructions: '# Kotlin (Android)


  Build Android apps with Kotlin and the Gradle toolchain.


  ## When to Use


  - Android application development

  - Kotlin multiplatform and JVM libraries

  - Enforcing code style across Kotlin sources


  ## Wrapper first


  ```bash

  gradle wrapper --gradle-version 8.10

  ```


  Commit the wrapper; teams should never rely on a local Gradle install.


  ## Core tasks


  ```bash

  ./gradlew assembleDebug

  ./gradlew testDebugUnitTest

  ./gradlew lint

  ```


  `lint` runs Android Lint - treat warnings as errors in CI with `warningsAsErrors`.


  ## Testing


  ```bash

  ./gradlew testDebugUnitTest --tests ''com.example.orders.*''

  ```


  Use Robolectric for JVM unit tests and instrumented tests for UI flows.


  ## ktlint gates


  ```bash

  ktlint ''src/**/*.kt''

  ktlint -F ''src/**/*.kt''

  ```


  Run `ktlint -F` locally, plain `ktlint` in CI.


  ## Kotlin scripts


  ```bash

  kotlinc -script build-data.kts

  ```


  ## Best practices


  - Pin Gradle and Kotlin plugin versions in the wrapper.

  - Keep unit tests JVM-fast; only critical flows instrumented.

  - Use the Android Kotlin style guide consistently.

  - Cache Gradle deps in CI to cut build time.


  ## Testing


  ```bash

  ./gradlew build && ktlint ''src/**/*.kt''

  ```


  Both must pass before merge.'
examples:
- input: Set up a new Android module with tests.
  output: Generates the wrapper, adds the module, writes unit tests, and verifies with ./gradlew testDebugUnitTest.
- input: Enforce Kotlin style on a team repo.
  output: Adds ktlint with official code style to CI, auto-fixes the codebase once, and gates on unformatted
    files.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: kotlin.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-kotlin
  generic:
    system_prompt: 'You own Kotlin end to end. You do it through gradle: Build and test Android/Kotlin
      projects with Gradle. The commands are real, e.g. `gradle wrapper --gradle-version 8.10`. You verify
      each step you report and stay honest about what you have not run.'
    available_tools:
    - bash
    - read
    - write
    - edit
