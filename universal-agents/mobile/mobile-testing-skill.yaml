name: mobile-testing
display_name: Mobile Testing
category: mobile
subcategory: general
description: Tests mobile apps with Maestro flows, Appium, Detox, adb, and simctl across iOS and Android
  devices.
version: 2.0.0
tags:
- mobile
author: Kdesk
license: MIT
prerequisites:
- adb
- maestro
- xcrun
capabilities:
- name: maestro
  description: Author and run declarative mobile UI flows.
  commands:
  - maestro test flows/smoke.yaml
  - maestro record flow.yaml
  - maestro test --device 2 flows/checkout.yaml
  - maestro studio
  - maestro test flows/ --exclude-tags=slow
  examples:
  - maestro record --device=emulator-5554 login.yaml
  - maestro test --include-tags=critical flows/
  - maestro test --env APP_URL=https://staging.example.com flows/checkout.yaml
  parameters:
  - name: device
    type: string
    description: Target device id
  - name: include-tags
    type: string
    description: Only run flows with these tags
  - name: env
    type: string
    description: Environment variables for flows
- name: device-tools
  description: Control emulators and simulators with adb and simctl.
  commands:
  - adb devices
  - adb shell input tap 540 960
  - adb shell am start -n com.example.app/.MainActivity
  - xcrun simctl list devices available
  - xcrun simctl boot 'iPhone 15' && open -a Simulator
  examples:
  - adb install -r app-debug.apk
  - adb logcat -s TestRunner -v brief
  - xcrun simctl io 'iPhone 15' screenshot screen.png
  parameters:
  - name: device
    type: string
    description: Device or simulator name/id
  - name: command
    type: string
    description: adb shell or simctl command
  - name: package
    type: string
    description: Android package name
knowledge:
- title: Maestro
  type: documentation
  source: https://maestro.mobile.dev/
  description: Declarative mobile UI testing flows
- title: Appium
  type: documentation
  source: https://appium.io/docs/en/2.0/
  description: Cross-platform mobile automation server
- title: Detox
  type: documentation
  source: https://wix.github.io/Detox/
  description: Gray-box E2E testing for React Native
instructions: '# Mobile Testing


  Test real user journeys on devices and simulators.


  ## When to Use


  - E2E coverage for critical mobile flows

  - Regression testing across device sizes/OS versions

  - Reproducing reported crashes


  ## Maestro flows


  ```yaml

  appId: com.example.app

  ---

  - launchApp

  - tapOn: "Login"

  - inputText: "user@example.com"

  - tapOn: "Continue"

  - assertVisible: "Orders"

  ```


  ```bash

  maestro record login.yaml

  maestro test flows/smoke.yaml

  ```


  Flows are YAML - readable by QA and engineers alike.


  ## Emulator/simulator control


  ```bash

  adb devices

  adb shell input tap 540 960

  xcrun simctl list devices available

  xcrun simctl boot ''iPhone 15''

  ```


  ## Logs on failure


  ```bash

  adb logcat -s TestRunner -v brief

  xcrun simctl io ''iPhone 15'' screenshot screen.png

  ```


  Capture screenshots automatically in the failure handler.


  ## Strategy


  - Smoke: launch + login + core journey per release.

  - Critical: checkout, sync, auth - every PR.

  - Full suite: nightly on the device matrix.


  ## Best practices


  - Tag flows: critical, slow, broken-on-device.

  - Use env vars for endpoints; never hardcode staging URLs.

  - Keep flows idempotent (reset state first).

  - Test on real devices weekly; simulators miss GPS/perf quirks.


  ## Testing


  ```bash

  maestro test flows/ --include-tags=critical

  ```


  Run the critical set in CI for every merge.'
examples:
- input: Add a login smoke flow for the mobile app.
  output: Records a Maestro flow, parameterizes the env URL, and wires it into the PR pipeline with the
    critical tag.
- input: Reproduce the crash on launch on an iPhone 15 sim.
  output: Boots the simulator, installs the build, launches with simctl, and collects console logs and
    a screenshot.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: mobile-testing.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-mobile-testing
  generic:
    system_prompt: 'You are the Mobile Testing specialist. You do it through maestro: Author and run declarative
      mobile UI flows. The commands are real, e.g. `maestro test flows/smoke.yaml`. You work hands-on
      and only report outcomes you have observed.'
    available_tools:
    - bash
    - read
    - write
    - edit
