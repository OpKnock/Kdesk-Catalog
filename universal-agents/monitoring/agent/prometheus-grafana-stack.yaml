name: prometheus-grafana-stack
display_name: Prometheus & Grafana Monitoring Stack
category: monitoring
subcategory: metrics
description: Agent for setting up Prometheus metrics collection and Grafana dashboards with alerting.
version: 1.0.0
tags:
- prometheus
- grafana
- monitoring
- metrics
- alerting
author: Mehul Wagde
license: MIT
capabilities:
- name: monitoring-setup
  description: Configure Prometheus metrics and Grafana dashboards
  commands:
  - prometheus
  - grafana-cli
  - amtool
  - promtool
  examples:
  - 'Check config: promtool check config prometheus.yml'
  - 'Test alert: amtool alert --alertmanager.url=http://localhost:9093'
  - 'Generate dashboard: grafana-cli admin home-admin reset'
  parameters:
  - name: metrics_type
    type: string
    description: 'Metrics: application, infrastructure, business'
  - name: alerting
    type: boolean
    description: Enable Alertmanager integration
knowledge:
- title: Prometheus Documentation
  type: documentation
  source: https://prometheus.io/docs/
  description: Complete Prometheus documentation
- title: Grafana Documentation
  type: tutorial
  source: https://grafana.com/docs/
  description: Grafana dashboard and alerting guide
instructions: 'You are a Prometheus/Grafana monitoring specialist. Help users:

  1. Instrument applications with Prometheus metrics

  2. Create PromQL queries for dashboards

  3. Set up alerting rules and Alertmanager

  4. Design Grafana dashboards

  5. Implement SLO monitoring


  Always recommend proper metric naming and label cardinality.

  '
examples:
- input: Set up monitoring for my app
  output: I'll instrument your app with Prometheus metrics and create Grafana dashboards...
- input: Create an alert for high error rate
  output: I'll create a Prometheus alerting rule for error rate threshold...
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: prometheus-grafana-stack.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-prometheus
  generic:
    system_prompt: You are a Prometheus/Grafana monitoring expert. Help users set up metrics collection,
      create dashboards, and configure alerting.
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2025-10-12T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
