name: datadog
display_name: Datadog
category: monitoring
subcategory: general
description: 'Operates the Datadog Agent and dashboards: agent status, live checks, monitors, and diagnostics
  via the CLI and API.'
version: 2.0.0
tags:
- datadog
author: Kdesk-Catalog
license: MIT
prerequisites:
- datadog-agent
capabilities:
- name: agent
  description: Manage the Datadog agent locally.
  commands:
  - datadog-agent status
  - datadog-agent check nginx
  - datadog-agent flare --send
  - datadog-agent config show | grep -E 'api_key|hostname'
  - datadog-agent restart
  examples:
  - datadog-agent status | grep -E 'Running|Total Events'
  - datadog-agent check disk -r 3
  - datadog-agent flare --send --local-timeout 30
  parameters:
  - name: check
    type: string
    description: Integrations check name like nginx, disk
  - name: flare
    type: string
    description: Bundle diagnostics for support
  - name: restart
    type: string
    description: Restart the agent service
- name: monitors
  description: Manage monitors and metrics via the Datadog API.
  commands:
  - 'curl -s -H ''DD-API-KEY: $DD_API_KEY'' -H ''DD-APPLICATION-KEY: $DD_APP_KEY'' ''https://api.datadoghq.com/api/v1/monitor''
    | jq ''.[] | {id, name, status}'''
  - 'curl -s -X POST -H ''DD-API-KEY: $DD_API_KEY'' -H ''DD-APPLICATION-KEY: $DD_APP_KEY'' -H ''Content-Type:
    application/json'' -d ''{"type":"metric alert","query":"avg(last_5m):avg:system.cpu.user{*} > 80","name":"High
    CPU","message":"CPU above 80%"}'' https://api.datadoghq.com/api/v1/monitor'
  - 'curl -s -X POST -H ''DD-API-KEY: $DD_API_KEY'' -H ''DD-APPLICATION-KEY: $DD_APP_KEY'' -H ''Content-Type:
    application/json'' -d ''{"query":"system.cpu.user"}'' ''https://api.datadoghq.com/api/v1/query?from=1750000000&to=1750086400'''
  - 'curl -s -X PUT -H ''DD-API-KEY: $DD_API_KEY'' -H ''DD-APPLICATION-KEY: $DD_APP_KEY'' -H ''Content-Type:
    application/json'' -d ''{"status":"Muted"}'' https://api.datadoghq.com/api/v1/monitor/12345/mute'
  - 'curl -s -H ''DD-API-KEY: $DD_API_KEY'' -H ''DD-APPLICATION-KEY: $DD_APP_KEY'' ''https://api.datadoghq.com/api/v1/monitor''
    | jq ''[.[].status] | group_by(.) | map({status: .[0], count: length})'''
  examples:
  - 'curl -s -H ''DD-API-KEY: $K'' -H ''DD-APPLICATION-KEY: $A'' ''https://api.datadoghq.com/api/v1/monitor''
    | jq ''.[] | select(.status != "OK") | {name, status}'''
  - 'curl -s -X POST -H ''DD-API-KEY: $K'' -H ''DD-APPLICATION-KEY: $A'' -H ''Content-Type: application/json''
    -d ''{"type":"service check","query":"\"api.up\".over(\"last_5m\").last(5).count_by_status()","name":"API
    up check"}'' https://api.datadoghq.com/api/v1/monitor'
  - 'curl -s -H ''DD-API-KEY: $K'' -H ''DD-APPLICATION-KEY: $A'' ''https://api.datadoghq.com/api/v1/monitor''
    | jq ''length'''
  parameters:
  - name: api-key
    type: string
    description: Datadog API key
  - name: app-key
    type: string
    description: Datadog application key
  - name: query
    type: string
    description: Metric or event query
knowledge:
- title: Datadog Agent
  type: documentation
  source: https://docs.datadoghq.com/agent/basic_agent_usage/
  description: 'Agent commands: status, check, flare, config'
- title: Datadog API
  type: documentation
  source: https://docs.datadoghq.com/api/latest/monitors/
  description: Monitors and query API reference
- title: Datadog Integrations
  type: documentation
  source: https://docs.datadoghq.com/integrations/
  description: Agent checks for common services
instructions: '# Datadog


  Operate the Datadog agent and monitors from the terminal.


  ## When to Use


  - Agent health and integration debugging

  - Creating monitors without the UI

  - Correlating metrics with incidents


  ## Agent operations


  ```bash

  datadog-agent status

  datadog-agent check nginx

  datadog-agent flare --send

  datadog-agent restart

  ```


  Flare bundles logs + configs for support - redact secrets before sending.


  ## Monitors via API


  ```bash

  curl -s -X POST -H ''DD-API-KEY: $DD_API_KEY'' -H ''DD-APPLICATION-KEY: $DD_APP_KEY'' -H ''Content-Type:
  application/json'' -d ''{"type":"metric alert","query":"avg(last_5m):avg:system.cpu.user{*} > 80","name":"High
  CPU","message":"CPU above 80%"}'' https://api.datadoghq.com/api/v1/monitor

  ```


  ## Monitor hygiene


  - Alert on SLOs and error budgets, not every metric.

  - Mute with a reason and an expiry: mute then unmute in the incident timeline.

  - Review monitor inventory quarterly; delete orphans.


  ## Metric queries


  ```bash

  curl -s -X POST -H ''DD-API-KEY: $DD_API_KEY'' -H ''DD-APPLICATION-KEY: $DD_APP_KEY'' -H ''Content-Type:
  application/json'' -d ''{"query":"system.cpu.user"}'' ''https://api.datadoghq.com/api/v1/query?from=...&to=...''

  ```


  ## Best practices


  - Use service accounts for API keys, rotated regularly.

  - Keep agent tags consistent across the fleet.

  - Export monitor configs to IaC where possible.

  - Verify agent version pinning across hosts.


  ## Testing


  ```bash

  datadog-agent status | grep -E ''Running|Errors''

  datadog-agent check disk

  ```


  Confirm checks pass after config changes.'
examples:
- input: The nginx integration isn't reporting metrics.
  output: Runs datadog-agent check nginx, inspects the check config and permissions, and restarts the
    agent.
- input: Create a CPU alert for the API fleet.
  output: Posts a metric alert monitor via the API and mutes it during the maintenance window.
