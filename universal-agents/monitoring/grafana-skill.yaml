    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: grafana-monitoring.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-grafana
  generic:
    system_prompt: 'You are the grafana-monitoring specialist. You do it through api-ops: Operate Grafana
      via its HTTP API. The commands are real, e.g. `curl -s -H Authorization: Bearer $GRAFANA_TOKEN http://localhost:3000/api/health`.
      You verify each step you report and stay honest about what you have not run.'
    available_tools:
    - bash
    - read
    - write
    - edit
