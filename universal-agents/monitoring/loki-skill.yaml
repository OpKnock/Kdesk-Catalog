name: loki-monitoring
display_name: loki-monitoring
category: monitoring
subcategory: general
description: 'Operates Grafana Loki for log monitoring: LogQL queries, label discovery, and live log tails.'
version: 2.0.0
tags:
- monitoring
author: Kdesk-Catalog
license: MIT
prerequisites:
- logcli
capabilities:
- name: logcli
  description: Query Loki logs with logcli.
  commands:
  - logcli query '{app="api"}' --since 1h
  - logcli query '{app="api"} |= "error"' --since 24h --limit 100
  - logcli labels --since 24h
  - logcli series '{app=~".+"}' --since 1h
  - logcli live '{app="api"}'
  examples:
  - logcli query '{namespace="prod"} |~ "panic|fatal"' --since 6h --limit 200
  - logcli query '{app="checkout"} | json | status_code >= 500' --since 1h | head -30
  - logcli labels job --since 6h
  parameters:
  - name: since
    type: string
    description: 'Time window: 1h, 24h, 7d'
  - name: limit
    type: number
    description: Max log lines
  - name: selector
    type: string
    description: Stream selector in braces
- name: api
  description: Query Loki's HTTP API directly.
  commands:
  - curl -G -s 'http://localhost:3100/loki/api/v1/query_range' --data-urlencode 'query={app="api"}' --data-urlencode
    'start=2026-08-10T08:00:00Z' --data-urlencode 'end=2026-08-10T09:00:00Z'
  - curl -s 'http://localhost:3100/ready'
  - curl -s 'http://localhost:3100/loki/api/v1/labels' | jq '.data'
  - curl -G -s 'http://localhost:3100/loki/api/v1/query' --data-urlencode 'query=sum(rate({app="api"}[5m]))'
  - curl -s 'http://localhost:3100/metrics' | grep -E 'loki_request_duration_seconds_sum' | head -3
  examples:
  - curl -s 'http://localhost:3100/ready' | jq
  - curl -G -s 'http://localhost:3100/loki/api/v1/query_range' --data-urlencode 'query={app="api"} |=
    "ERROR"' --data-urlencode 'limit=50' | jq '.data.result[0].values | length'
  - curl -s 'http://localhost:3100/loki/api/v1/labels' | jq -r '.data[]'
  parameters:
  - name: query
    type: string
    description: LogQL expression
  - name: start
    type: string
    description: Range start (RFC3339 or unix)
  - name: end
    type: string
    description: Range end (RFC3339 or unix)
knowledge:
- title: Loki LogQL
  type: documentation
  source: https://grafana.com/docs/loki/latest/query/log_queries/
  description: Stream selectors and pipeline expressions
- title: logcli
  type: documentation
  source: https://grafana.com/docs/loki/latest/reference/cli/logcli/
  description: logcli query and labels reference
- title: Loki API
  type: documentation
  source: https://grafana.com/docs/loki/latest/reference/api/
  description: HTTP API for query and ingestion
instructions: '# Loki


  Search and analyze logs at scale with LogQL.


  ## When to Use


  - Incident log search across services

  - Metrics from logs (rates, error counts)

  - Live debugging during rollouts


  ## Stream selectors


  ```bash

  logcli query ''{app="api"}'' --since 1h

  ```


  Match labels with `=`, `!=`, `=~`, `!~`.


  ## Pipelines


  ```bash

  logcli query ''{app="api"} |= "error"'' --since 24h

  logcli query ''{app="checkout"} | json | status_code >= 500'' --since 1h

  logcli query ''{app="api"} |~ "panic|fatal"'' --since 6h

  ```


  `|=` substring, `|~` regex, `| json` parses structured logs, then filter on parsed fields.


  ## Metric queries


  ```bash

  logcli query ''sum(rate({app="api"} |~ "ERROR" [5m]))'' --since 1h

  ```


  Turn log lines into series for dashboards and alerts.


  ## Live tail


  ```bash

  logcli live ''{app="api"}''

  ```


  ## Label hygiene


  - Labels = high-cardinality cost; keep to app, namespace, pod.

  - Put variable data (user_id, order_id) in the log body, not labels.

  - Discover what exists: `logcli labels --since 24h`.


  ## Best practices


  - Standardize structured JSON logs for pipeline filtering.

  - Embed trace_id to jump from logs to traces.

  - Set retention by tier: 7d hot, 30d cold.

  - Alert on rates derived from logs, never raw log spam.


  ## Testing


  ```bash

  logcli query ''{app="api"}'' --since 10m | wc -l

  ```


  Verify expected log flow after a release.'
examples:
- input: Find all 500 errors for checkout in the last hour.
  output: Runs logcli query with json parsing and status_code >= 500 filter, then formats fields for reading.
- input: Track error rate from logs on a dashboard.
  output: Creates a LogQL metric query with rate() and wires it to a Grafana panel.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: loki-monitoring.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-loki
  generic:
    system_prompt: 'You own loki-monitoring end to end. You do it through logcli: Query Loki logs with
      logcli. The commands are real, e.g. `logcli query {app=api} --since 1h`. You run and verify the
      real CLI commands before you claim anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
