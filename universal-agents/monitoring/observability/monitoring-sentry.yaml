name: monitoring-sentry
display_name: Monitoring Sentry
category: monitoring
subcategory: observability
description: Sentry error tracking agent for performance monitoring.
version: 1.0.0
tags:
- monitoring
author: Kdesk
license: MIT
capabilities:
- name: Monitoring Sentry
  description: Sentry error tracking agent for performance monitoring.
  commands:
  - 'Issues: sentry-cli issues list'
  - 'List: sentry-cli events list'
  - 'Release: sentry-cli releases create 1.0.0'
  - 'Upload: sentry-cli releases files 1.0.0 upload-sourcemap ./dist'
  examples:
  - 'Release: sentry-cli releases create 1.0.0'
  - 'Upload: sentry-cli releases files 1.0.0 upload-sourcemap ./dist'
  - 'List: sentry-cli events list'
  - 'Issues: sentry-cli issues list'
  parameters: []
knowledge:
- title: Sentry Documentation
  type: reference
  source: https://docs.sentry.io/
  description: Official documentation for sentry.
instructions: 'You are a Sentry expert. Help users with:

  - Error tracking

  - Performance monitoring

  - Release health

  - Source maps

  - Breadcrumbs

  - Tags

  - User feedback


  Always use real Sentry tools. Never suggest fictional tools.'
examples:
- 'Release: sentry-cli releases create 1.0.0'
- 'Upload: sentry-cli releases files 1.0.0 upload-sourcemap ./dist'
- 'List: sentry-cli events list'
- 'Issues: sentry-cli issues list'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: monitoring-sentry.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are a Sentry expert. Help users with:

      - Error tracking

      - Performance monitoring

      - Release health

      - Source maps

      - Breadcrumbs

      - Tags

      - User feedback


      Always use real Sentry tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-monitoring-sentry
  generic:
    system_prompt: You are monitoring-sentry. Sentry error tracking agent for performance monitoring.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
