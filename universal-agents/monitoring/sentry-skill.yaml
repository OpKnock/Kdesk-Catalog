name: sentry
display_name: Sentry
category: monitoring
subcategory: general
description: Create releases and associate commits with it-cli. Upload source maps handling readable stack traces.
  and deploy notifications.'
version: 2.0.0
tags:
- monitoring
author: Kdesk
license: MIT
prerequisites:
- sentry-cli
capabilities:
- name: releases
  description: Create releases and associate commits with sentry-cli.
  commands:
  - sentry-cli releases new -p my-project 3.2.0
  - sentry-cli releases set-commits --auto 3.2.0
  - sentry-cli releases finalize 3.2.0
  - sentry-cli releases deploy 3.2.0 -e production
  - sentry-cli releases list -p my-project | head -10
  examples:
  - sentry-cli releases new -p web-app $(git rev-parse --short HEAD)
  - sentry-cli releases set-commits --auto $(git rev-parse --short HEAD)
  - sentry-cli releases deploy $(git rev-parse --short HEAD) -e staging
  parameters:
  - name: release
    type: string
    description: Release version string
  - name: env
    type: string
    description: 'Deploy environment: production, staging'
  - name: project
    type: string
    description: Sentry project slug
- name: sourcemaps
  description: Upload source maps for readable stack traces.
  commands:
  - sentry-cli sourcemaps upload -o my-org -p my-project dist/
  - sentry-cli sourcemaps explain dist/app.9f2c1a.js
  - sentry-cli sourcemaps list -o my-org -p my-project
  - sentry-cli debug-files upload -o my-org -p my-project dist/*.dSYM
  - sentry-cli sourcemaps upload --url-prefix '~/static/js' -o my-org -p my-project dist/
  examples:
  - sentry-cli sourcemaps upload -o my-org -p my-project dist/ --release 3.2.0
  - sentry-cli debug-files upload -o my-org -p my-project ios/build/Release-iphoneos/app.app.dSYM
  - sentry-cli sourcemaps explain dist/app.js
  parameters:
  - name: org
    type: string
    description: Sentry organization slug
  - name: project
    type: string
    description: Sentry project slug
  - name: release
    type: string
    description: Release to associate files with
knowledge:
- title: Sentry CLI
  type: documentation
  source: https://docs.sentry.io/cli/
  description: releases, sourcemaps, and debug-files commands
- title: Sentry Releases
  type: documentation
  source: https://docs.sentry.io/product/releases/
  description: Release health, commits, and deploy tracking
- title: Source Maps
  type: documentation
  source: https://docs.sentry.io/platforms/javascript/sourcemaps/
  description: Uploading and verifying source maps
instructions: '# Sentry


  Track errors to releases and readable stack traces.


  ## When to Use


  - Release rollout with regression detection

  - Fixing minified JS stack traces

  - Correlating error spikes with deploys


  ## Release workflow


  ```bash

  sentry-cli releases new -p my-project 3.2.0

  sentry-cli releases set-commits --auto 3.2.0

  sentry-cli releases deploy 3.2.0 -e production

  sentry-cli releases finalize 3.2.0

  ```


  Use short commit shas for CI-generated releases.


  ## Source maps


  ```bash

  sentry-cli sourcemaps upload -o my-org -p my-project dist/ --release 3.2.0

  sentry-cli sourcemaps explain dist/app.9f2c1a.js

  ```


  Upload maps with the same release tag as the deploy.


  ## Verify


  ```bash

  sentry-cli releases list -p my-project | head -10

  ```


  Confirm the release exists before deploys.


  ## Best practices


  - One release per deploy; use the commit sha.

  - Upload source maps immediately after build, before deploy.

  - Use environment tags consistently for filters.

  - Alert on new issues spike per release, not per issue.


  ## Testing


  ```bash

  sentry-cli releases new -p my-project $(git rev-parse --short HEAD) --force

  sentry-cli releases set-commits --auto $(git rev-parse --short HEAD)

  ```


  Dry-run the flow in staging first.'
examples:
- input: Attach this deploy to a Sentry release for tracking.
  output: Creates the release from the commit sha, sets commits automatically, and marks the production
    deploy.
- input: Stack traces show minified code - fix it.
  output: Uploads source maps with the release and verifies with sentry-cli sourcemaps explain.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: sentry.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-sentry
  generic:
    system_prompt: 'You work Sentry hands-on. You do it through releases: Create releases and associate
      commits with sentry-cli. The commands are real, e.g. `sentry-cli releases new -p my-project 3.2.0`.
      You answer with exact commands, not abstractions, and flag anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
