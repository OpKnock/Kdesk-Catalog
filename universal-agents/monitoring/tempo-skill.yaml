name: tempo
display_name: tempo
category: monitoring
subcategory: general
description: Query traces with the it CLI. Search and query traces via the it HTTP API.
  and trace correlation.'
version: 2.0.0
tags:
- tempo
author: Kdesk
license: MIT
prerequisites:
- tempo-cli
capabilities:
- name: tempo-cli
  description: Query traces with the Tempo CLI.
  commands:
  - tempo-cli query trace 00000000000000000000000000000000 --host localhost:3200
  - tempo-cli search --host localhost:3200 '{resource.service.name="checkout"}' --limit 10
  - tempo-cli query blocks --host localhost:3200 --since 1h
  - tempo-cli query trace 00000000000000000000000000000000 --host localhost:3200 --format json | jq '.spans | length'
  - tempo-cli search --host localhost:3200 '{resource.service.name=~"api|checkout"} && duration > 1s'
    --limit 20
  examples:
  - tempo-cli query trace 5f3a1c9e0000000000000001 --host localhost:3200 | jq '.rootSpan'
  - tempo-cli search --host localhost:3200 '{span.http.status_code >= 500}' --limit 50
  - tempo-cli query blocks --host localhost:3200 --since 24h | head
  parameters:
  - name: trace-id
    type: string
    description: 16 or 32 hex char trace id
  - name: host
    type: string
    description: Tempo query-frontend address
  - name: limit
    type: number
    description: Max results
- name: http-api
  description: Search and query traces via the Tempo HTTP API.
  commands:
  - curl -G -s 'http://localhost:3200/api/search' --data-urlencode 'tags=service.name=checkout' --data-urlencode
    'limit=10'
  - curl -s 'http://localhost:3200/api/traces/00000000000000000000000000000000' | jq '.traceID'
  - curl -s 'http://localhost:3200/ready' | jq
  - curl -G -s 'http://localhost:3200/api/search/tags' | jq '.tagNames'
  - curl -G -s 'http://localhost:3200/api/search' --data-urlencode 'tags=error=true' --data-urlencode
    'minDuration=500ms' | jq '.traces | length'
  examples:
  - curl -G -s 'http://localhost:3200/api/search' --data-urlencode 'tags=service.name=api' | jq '.traces[0].traceID'
  - curl -s 'http://localhost:3200/api/traces/5f3a1c9e0000000000000001' | jq '.spans[0].name'
  - curl -s 'http://localhost:3200/ready'
  parameters:
  - name: tags
    type: string
    description: Tag filters like service.name=x
  - name: minDuration
    type: string
    description: Minimum span duration filter
  - name: trace-id
    type: string
    description: Trace id to fetch
knowledge:
- title: Tempo Docs
  type: documentation
  source: https://grafana.com/docs/tempo/latest/
  description: Trace search, query-frontend, and storage
- title: tempo-cli
  type: documentation
  source: https://grafana.com/docs/tempo/latest/reference/tempo-cli/
  description: tempo-cli query and search commands
- title: Tempo API
  type: documentation
  source: https://grafana.com/docs/tempo/latest/api_docs/
  description: Search and trace query HTTP endpoints
instructions: '# Tempo


  Find slow and failed requests by their traces.


  ## When to Use


  - Correlating logs to full request paths

  - Root-causing latency regressions

  - Auditing cross-service failures


  ## Search traces


  ```bash

  tempo-cli search --host localhost:3200 ''{resource.service.name="checkout"}'' --limit 10

  ```


  ## Fetch a trace


  ```bash

  tempo-cli query trace <trace-id> --host localhost:3200 | jq ''.spans | length''

  ```


  ## Via HTTP API


  ```bash

  curl -G -s ''http://localhost:3200/api/search'' --data-urlencode ''tags=service.name=checkout'' --data-urlencode
  ''limit=10''

  curl -s ''http://localhost:3200/api/traces/<trace-id>''

  ```


  ## Correlate with logs


  Logs carry `trace_id`; logs to traces via the same id in Grafana.


  ## Best practices


  - Sample strategically: 100% for errors, lower for happy paths.

  - Set a duration filter to skip noisy fast traces.

  - Keep span names short and standardized.

  - Instrument every outbound call (DB, HTTP, queue).


  ## Testing


  ```bash

  curl -s ''http://localhost:3200/ready''

  tempo-cli query blocks --host localhost:3200 --since 1h

  ```


  Verify blocks are flushed and queryable after load.'
examples:
- input: Why did checkout requests get slower after release?
  output: Searches traces by service and duration, fetches the slowest trace, and identifies the hot span
    (DB vs external call).
- input: Find failed requests for the API in the last hour.
  output: Searches with error=true tag and minDuration, then inspects the top trace's spans.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: tempo.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-tempo
  generic:
    system_prompt: 'You own tempo end to end. You do it through tempo-cli: Query traces with the Tempo
      CLI. The commands are real, e.g. `tempo-cli query trace <trace-id> --host localhost:3200`. You run
      and verify the real CLI commands before you claim anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
