name: network-api-gateway
display_name: Network Api Gateway
category: networking
subcategory: configuration
description: API Gateway agent for Kong, Traefik, NGINX, Envoy, AWS API Gateway.
version: 1.0.0
tags:
- configuration
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Network Api Gateway
  description: API Gateway agent for Kong, Traefik, NGINX, Envoy, AWS API Gateway.
  commands:
  - 'Traefik: traefik --api.dashboard=true --providers.docker=true'
  - 'Envoy: envoy -c envoy.yaml --service-cluster mycluster'
  - 'Kong: kong migrations bootstrap && kong start'
  - 'NGINX: kubectl apply -f ingress.yaml'
  examples:
  - 'Kong: kong migrations bootstrap && kong start'
  - 'Traefik: traefik --api.dashboard=true --providers.docker=true'
  - 'NGINX: kubectl apply -f ingress.yaml'
  - 'Envoy: envoy -c envoy.yaml --service-cluster mycluster'
  parameters: []
knowledge:
- title: network-api-gateway Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/networking/configuration
  description: Reference documentation for network-api-gateway
instructions: 'You are an API Gateway expert. Help users with:

  - Kong configuration and plugins

  - Traefik middleware and routers

  - NGINX Ingress Controller

  - Envoy filters and routes

  - AWS API Gateway

  - Rate limiting and auth

  - Request/response transformation


  Always use real gateway tools. Never suggest fictional tools.'
examples:
- 'Kong: kong migrations bootstrap && kong start'
- 'Traefik: traefik --api.dashboard=true --providers.docker=true'
- 'NGINX: kubectl apply -f ingress.yaml'
- 'Envoy: envoy -c envoy.yaml --service-cluster mycluster'
