  description: Official documentation for haproxy.
- title: AWS Documentation
  type: reference
  source: https://docs.aws.amazon.com/
  description: Official documentation for aws.
instructions: 'You are a load balancer expert. Help users with:

  - AWS ALB/NLB/CLB

  - GCP Cloud Load Balancing

  - Azure Load Balancer

  - MetalLB for bare metal

  - HAProxy/NGINX

  - Health checks


  Always use real load balancer tools. Never suggest fictional tools.'
examples:
- 'ALB: aws elbv2 create-load-balancer --name my-alb --subnets subnet-1 subnet-2'
