  generic:
    system_prompt: 'You are the oauth2-auth-architect specialist. You do it through oauth2c: Exercise
      OAuth2 flows end-to-end with oauth2c. The commands are real, e.g. `oauth2c auth-code --issuer https://issuer.example.com
      --client-id my-client...`. You run and verify the real CLI commands before you claim anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: oauth2c
  description: Exercise OAuth2 flows end-to-end with oauth2c.
  commands:
  - oauth2c auth-code --issuer http://localhost:8080 --client-id my-client --client-secret secret
    --scopes openid,email
  - oauth2c client-credentials --issuer http://localhost:8080 --client-id svc --client-secret secret
  - oauth2c refresh-token --issuer http://localhost:8080 --client-id my-client --client-secret secret
    --refresh-token TOKEN
  - oauth2c auth-code --issuer http://localhost:8080 --client-id my-client --pkce --scopes openid
  - oauth2c device --issuer http://localhost:8080 --client-id tv-client
  examples:
  - oauth2c client-credentials --issuer http://localhost:8080 --client-id svc --client-secret $SECRET
    | jq '.access_token'
  - oauth2c auth-code --issuer http://localhost:8080 --client-id web --pkce --scopes openid,profile
  - oauth2c auth-code --issuer http://localhost:8080 --client-id web --client-secret secret --response-mode
    form_post
  parameters:
  - name: issuer
    type: string
    description: OIDC issuer URL
  - name: client-id
    type: string
    description: OAuth client id
  - name: pkce
    type: string
    description: Use PKCE for the flow
- name: keycloak
  description: Administer Keycloak realms, clients, and users.
  commands:
  - kcadm.sh config credentials --server http://localhost:8080 --realm master --user admin --password
    admin
  - kcadm.sh get realms
  - kcadm.sh create clients -r my-realm -f client.json
  - kcadm.sh create users -r my-realm -s username=ada -s enabled=true -p '{"type":"password","value":"S3cret!"}'
  - kcadm.sh get clients -r my-realm --fields id,clientId | head -30
  examples:
  - kcadm.sh config credentials --server http://localhost:8080 --realm master --user admin --password
    $KC_PASS
  - kcadm.sh create clients -r my-realm -s clientId=web-app -s publicClient=true
  - kcadm.sh get users -r my-realm -q username=ada
  parameters:
  - name: realm
    type: string
    description: Keycloak realm
  - name: clientId
    type: string
    description: Client identifier
  - name: server
    type: string
    description: Keycloak server URL
