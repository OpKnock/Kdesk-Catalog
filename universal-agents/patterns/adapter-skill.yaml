name: adapter
display_name: Adapter
category: patterns
subcategory: general
description: 'Implements the Adapter pattern in TypeScript: converting interfaces between incompatible
  systems with minimal coupling.'
version: 2.0.0
tags:
- adapter
author: Kdesk-Catalog
license: MIT
prerequisites:
- node
- npm
- npx
capabilities:
- name: typescript
  description: Implement and test Adapter pattern examples.
  commands:
  - npx tsc --strict --outDir dist adapter.ts
  - node --test dist/adapter.test.js
  - npm init -y && npm install --save-dev typescript @types/node
  - npx tsc --watch
  - node dist/main.js
  examples:
  - npx tsc --strict adapter.ts main.ts --outDir dist
  - node --test dist/*.test.js
  - npx tsc --noEmit --strict adapter.ts
  parameters:
  - name: strict
    type: string
    description: Enable strict type checking
  - name: outDir
    type: string
    description: Compile output directory
  - name: watch
    type: string
    description: Rebuild on change
knowledge:
- title: 'Refactoring Guru: Adapter'
  type: documentation
  source: https://refactoring.guru/design-patterns/adapter
  description: Adapter intent, structure, and applicability
- title: TypeScript Handbook
  type: documentation
  source: https://www.typescriptlang.org/docs/
  description: Interfaces and structural typing
instructions: "# Adapter Pattern\n\nLet incompatible interfaces collaborate without rewriting them.\n\n\
  ## When to Use\n\n- Wrapping a third-party SDK behind your own contract\n- Bridging legacy systems with\
  \ new APIs\n- Keeping domain code independent of vendor types\n\n## Example (TypeScript)\n\n```typescript\n\
  interface PaymentGateway {\n  charge(amountCents: number): Promise<string>;\n}\n\nclass StripeSDK {\n\
  \  createCharge(opts: { amount: number; currency: string }): Promise<{ id: string }> {\n    return Promise.resolve({\
  \ id: 'ch_' + Math.random() });\n  }\n}\n\nclass StripeAdapter implements PaymentGateway {\n  constructor(private\
  \ sdk: StripeSDK) {}\n  charge(amountCents: number): Promise<string> {\n    return this.sdk.createCharge({\
  \ amount: amountCents, currency: 'usd' }).then(c => c.id);\n  }\n}\n```\n\n## Test\n\n```typescript\n\
  import { test } from 'node:test';\nimport assert from 'node:assert';\n\ntest('adapter maps currency\
  \ and amounts', async () => {\n  const gateway: PaymentGateway = new StripeAdapter(new StripeSDK());\n\
  \  const id = await gateway.charge(199);\n  assert.match(id, /^ch_/);\n});\n```\n\n```bash\nnpx tsc\
  \ --strict --outDir dist adapter.ts adapter.test.ts\nnode --test dist/*.test.js\n```\n\n## Variants\n\
  \n- Object adapter: composition (shown above).\n- Class adapter: multiple inheritance (language-limited).\n\
  - Prefer object adapters - testable and flexible.\n\n## Best practices\n\n- Keep the adapter thin: translate,\
  \ don't add business logic.\n- Program against your interface, never the SDK directly.\n- Unit test\
  \ the adapter with a fake SDK.\n- Name adapters by source: StripeAdapter, LegacyOrderAdapter.\n\n##\
  \ Testing\n\nTest that all interface methods translate correctly, including error paths."
examples:
- input: Wrap a legacy order API behind a modern interface.
  output: Creates a LegacyOrderAdapter implementing the OrderSource interface and verifies translation
    with unit tests.
- input: Swap payment providers without touching checkout code.
  output: Implements a new PaymentGateway adapter and swaps the wiring at the composition root.
