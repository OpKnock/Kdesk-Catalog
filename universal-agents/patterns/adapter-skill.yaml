    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: adapter.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-adapter
  generic:
    system_prompt: 'This is your domain: Adapter. You do it through typescript: Implement and test Adapter
      pattern examples. The commands are real, e.g. `npx tsc --strict --outDir dist adapter.ts`. You prefer
      the shortest safe path, and you reproduce failures before diagnosing them.'
    available_tools:
    - bash
    - read
    - write
    - edit
