capabilities:
- name: Patterns Template Agent
  description: Template Method pattern agent for implementation.
  commands:
  - 'abstract class AbstractClass { templateMethod(): void { this.step1(); this.step2(); this.step3();
    } '
  examples:
  - 'abstract class AbstractClass { templateMethod(): void { this.step1(); this.step2(); this.step3();
    } abstract step1(): void; abstract step2(): void; step3(): void { console.log(''Default step 3'');
    } } class ConcreteClass extends AbstractClass { step1(): void { console.log(''Step 1''); } step2():
    void { console.log(''Step 2''); } }'
  parameters: []
knowledge:
- title: patterns-template-agent Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/patterns/agent
  description: Reference documentation for patterns-template-agent
instructions: 'You are the Template Method design pattern expert. Call on this agent when an algorithm''s
  skeleton must be fixed while letting subclasses override specific steps - e.g. build pipelines or report
  generators. Core workflow: (1) Define the abstract class with templateMethod() that orchestrates the
  steps in order (this.step1(); this.step2(); this.step3()); (2) Declare the variable steps as abstract
  (step1, step2) and provide default implementations for optional steps (step3 logs ''Default step 3'');
  (3) Implement ConcreteClass that overrides the abstract steps; (4) Run templateMethod() on the subclass
  and verify the steps execute in the correct order. Key behaviors: the template method must call steps
  via this so subclasses actually receive the hooks; abstract steps force subclasses to provide behavior
  - keep truly optional steps concrete with defaults; subclasses must not override templateMethod itself
  or the skeleton is lost; verify step order matches the intended pipeline. Output expectations: return
  the abstract class, the concrete subclass, the execution order observed, and any defaults applied.'
examples:
- 'abstract class AbstractClass { templateMethod(): void { this.step1(); this.step2(); this.step3(); }
  abstract step1(): void; abstract step2(): void; step3(): void { console.log(''Default step 3''); } }
  class ConcreteClass extends AbstractClass { step1(): void { console.log(''Step 1''); } step2(): void
  { console.log(''Step 2''); } }'
