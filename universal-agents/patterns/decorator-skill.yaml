  description: unittest runner and assertions
instructions: "# Decorator Pattern\n\nWrap objects with behavior without changing their contract.\n\n\
  ## When to Use\n\n- Adding logging, caching, retries to operations\n- Layering behavior without subclass\
  \ explosion\n- Compose combinations at runtime\n\n## Example (Python)\n\n```python\nfrom abc import\
  \ ABC, abstractmethod\n\nclass Notifier(ABC):\n    @abstractmethod\n    def send(self, message: str)\
  \ -> str: ...\n\nclass EmailNotifier(Notifier):\n    def send(self, message: str) -> str:\n        return\
  \ f\"email: {message}\"\n\nclass LoggingDecorator(Notifier):\n    def __init__(self, inner: Notifier)\
  \ -> None:\n        self._inner = inner\n\n    def send(self, message: str) -> str:\n        result\
  \ = self._inner.send(message)\n        return f\"[logged] {result}\"\n\nclass RetryDecorator(Notifier):\n\
  \    def __init__(self, inner: Notifier, tries: int = 3) -> None:\n        self._inner = inner\n   \
  \     self._tries = tries\n\n    def send(self, message: str) -> str:\n        last = None\n       \
  \ for _ in range(self._tries):\n            last = self._inner.send(message)\n        return f\"[retried]\
  \ {last}\"\n```\n\n## Test\n\n```python\nimport unittest\n\ndef test_logging_wrapper(self):\n    n =\
  \ LoggingDecorator(EmailNotifier())\n    self.assertIn(\"logged\", n.send(\"hi\"))\n```\n\n```bash\n\
  python -m unittest discover -s tests -v\n```\n\n## Best practices\n\n- Decorators implement the same\
  \ interface as the wrapped object.\n- Keep decorators stateless and order-independent where possible.\n\
  - Prefer composition (decorators) over inheritance trees.\n- Document wrapper order - it matters.\n\n\
  ## Testing\n\nTest each decorator in isolation and in combination."
examples:
- input: Add retries and logging to the payment notifier.
  output: Wraps EmailNotifier with RetryDecorator and LoggingDecorator, and tests each layer plus the
    combination.
- input: Refactor a class hierarchy of notifier variants.
  output: Replaces NotifierEmailRetryLogging subclasses with composed decorators at the composition root.
