knowledge:
- title: 'Refactoring Guru: Factory Method'
  type: documentation
  source: https://refactoring.guru/design-patterns/factory-method
  description: Factory intent, structure, and usage
- title: Go by Example
  type: documentation
  source: https://gobyexample.com/interfaces
  description: Interfaces in Go
instructions: "# Factory Pattern\n\nCreate objects without coupling callers to concrete types.\n\n## When\
  \ to Use\n\n- Object creation varies by config/context\n- Decoupling construction from usage\n- Encapsulating\
  \ complex initialization\n\n## Example (Go)\n\n```go\npackage factory\n\ntype Payment interface {\n\t\
  Charge(amount int) string\n}\n\ntype CardPayment struct{}\n\nfunc (CardPayment) Charge(amount int) string\
  \ { return \"card:\" + fmt.Sprint(amount) }\n\ntype WalletPayment struct{}\n\nfunc (WalletPayment) Charge(amount\
  \ int) string { return \"wallet:\" + fmt.Sprint(amount) }\n\nfunc NewPayment(kind string) Payment {\n\
  \tswitch kind {\n\tcase \"card\":\n\t\treturn CardPayment{}\n\tcase \"wallet\":\n\t\treturn WalletPayment{}\n\
  \t}\n\tpanic(\"unknown payment kind: \" + kind)\n}\n```\n\n## Test\n\n```go\nfunc TestNewPayment(t *testing.T)\
  \ {\n\tif got := NewPayment(\"card\").Charge(100); got != \"card:100\" {\n\t\tt.Errorf(\"unexpected:\
  \ %s\", got)\n\t}\n}\n```\n\n```bash\ngo test ./...\n```\n\n## Variants\n\n- Factory Method: one creation\
  \ point, subclasses decide.\n- Abstract Factory: families of related objects.\n- In Go, a plain function\
  \ returning an interface is the idiomatic factory.\n\n## Best practices\n\n- Return interfaces, consume\
  \ interfaces.\n- Validate inputs in the factory and fail fast.\n- Keep factories side-effect free where\
  \ possible.\n- Test every product the factory can produce.\n\n## Testing\n\nTable-test all kinds, including\
  \ unknown kind panics."
examples:
- input: Create payments based on provider config.
  output: Implements NewPayment(kind) returning the Payment interface and table-tests card/wallet branches.
- input: Add a new provider without touching callers.
  output: Adds the new product type and one case to the factory; callers unchanged.
