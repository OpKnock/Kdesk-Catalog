  description: Implement and test observer examples.
  commands:
  - node --test tests/
  - node --test tests/observer.test.mjs
  - node --test --test-name-pattern 'stock' tests/
  - node -e "const {EventEmitter}=require('events'); const e=new EventEmitter(); e.on('x',()=>console.log('fired'));
    e.emit('x');"
  - node --test --watch tests/
