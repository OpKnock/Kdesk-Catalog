instructions: "# Observer Pattern\n\nNotify many subscribers when state changes.\n\n## When to Use\n\n\
  - UI updates on data changes\n- Event-driven architectures\n- Decoupling producers from consumers\n\n\
  ## Example (Node.js)\n\n```js\nimport { EventEmitter } from 'node:events';\n\nclass StockTracker extends\
  \ EventEmitter {\n  setPrice(symbol, price) {\n    this.emit('price', { symbol, price });\n  }\n}\n\n\
  const tracker = new StockTracker();\ntracker.on('price', ({ symbol, price }) => console.log(`${symbol}:\
  \ $${price}`));\ntracker.setPrice('ACME', 42.5);\n```\n\n## Test\n\n```js\nimport { test } from 'node:test';\n\
  import assert from 'node:assert';\n\ntest('notifies subscribers on price change', () => {\n  const tracker\
  \ = new StockTracker();\n  const seen = [];\n  tracker.on('price', (p) => seen.push(p));\n  tracker.setPrice('ACME',\
  \ 42.5);\n  assert.deepEqual(seen, [{ symbol: 'ACME', price: 42.5 }]);\n});\n```\n\n```bash\nnode --test\
  \ tests/\n```\n\n## Best practices\n\n- Emit events with payload objects, not positional args.\n- Use\
  \ 'error' events for error propagation.\n- Clean up listeners to prevent leaks (`off()`).\n- Name events\
  \ as past-tense facts: 'priceChanged'.\n\n## Testing\n\nVerify delivery order, payload shape, and listener\
  \ cleanup."
examples:
- input: Notify UI and audit log when an order is placed.
  output: Emits orderPlaced from the order service; UI and audit subscribe independently.
- input: Debug why a subscriber fires twice.
  output: Checks listener registration sites and tests listenerCount before/after subscribe.
