name: singleton
display_name: Singleton
category: patterns
subcategory: general
description: 'Implements the Singleton pattern in Java with javac: controlled single instance creation
  and its thread-safety trade-offs.'
version: 2.0.0
tags:
- singleton
author: Kdesk
license: MIT
prerequisites:
- java
- javac
capabilities:
- name: java
  description: Implement and verify singleton examples.
  commands:
  - javac -d out Singleton.java Main.java
  - java -cp out Main
  - javac -Xlint:all -d out Singleton.java
  - java -cp out com.example.singleton.Main
  - javac -d out SingletonTest.java && java -cp out -ea SingletonTest
  examples:
  - javac -d out Singleton.java && java -cp out com.example.Main
  - javac -Xlint:all -d out *.java
  - java -cp out com.example.Main | grep -c 'same instance'
  parameters:
  - name: cp
    type: string
    description: Classpath directory
  - name: Xlint
    type: string
    description: Compiler warnings
  - name: ea
    type: string
    description: Enable assertions
knowledge:
- title: 'Refactoring Guru: Singleton'
  type: documentation
  source: https://refactoring.guru/design-patterns/singleton
  description: Singleton intent and controversy
- title: JLS Enum
  type: documentation
  source: https://docs.oracle.com/javase/specs/jls/se17/html/jls-8.html
  description: Enum-based singletons in Java
instructions: "# Singleton Pattern\n\nEnsure one instance and one access point.\n\n## When to Use\n\n\
  - Shared resources: config, connection pools, caches\n- Logging and audit infrastructure\n- Cross-cutting\
  \ services with no state needs\n\n## Example (Java)\n\n```java\npublic final class Config {\n    private\
  \ static final Config INSTANCE = new Config();\n    private Config() {}\n    public static Config getInstance()\
  \ { return INSTANCE; }\n\n    private String env = \"prod\";\n    public String env() { return env;\
  \ }\n}\n```\n\nEager init via `static final` is thread-safe without locks.\n\n## Verify\n\n```java\n\
  public class Main {\n    public static void main(String[] args) {\n        Config a = Config.getInstance();\n\
  \        Config b = Config.getInstance();\n        System.out.println(a == b ? \"same instance\" : \"\
  different\");\n    }\n}\n```\n\n```bash\njavac -d out Singleton.java Main.java\njava -cp out Main\n\
  ```\n\n## When NOT to use\n\n- Global mutable state hides dependencies.\n- Testing becomes harder -\
  \ inject dependencies instead.\n- Prefer dependency injection containers over singletons.\n\n## Best\
  \ practices\n\n- Keep singletons stateless or read-only after init.\n- Prefer enum singleton in Java\
  \ for serialization safety.\n- If lazily initialized, guard double-checked locking carefully.\n- Limit\
  \ to genuinely system-wide resources.\n\n## Testing\n\nTest that repeated getInstance returns identical\
  \ references."
examples:
- input: Centralize app config access.
  output: Implements a stateless Config singleton and verifies identity with an assertion run.
- input: Refactor accidental global state into an injectable service.
  output: Replaces the singleton usage with constructor injection at the composition root.
platforms:
