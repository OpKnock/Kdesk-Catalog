- title: 'Refactoring Guru: Strategy'
  type: documentation
  source: https://refactoring.guru/design-patterns/strategy
  description: Strategy intent, structure, and usage
- title: pytest
  type: documentation
  source: https://docs.pytest.org/
  description: pytest fixtures and assertions
instructions: "# Strategy Pattern\n\nSwap algorithms at runtime behind one interface.\n\n## When to Use\n\
  \n- Multiple ways to do one thing (pricing, auth, format)\n- Avoiding conditional chains in business\
  \ logic\n- Testing algorithms independently\n\n## Example (Python)\n\n```python\nfrom dataclasses import\
  \ dataclass\nfrom typing import Protocol\n\nclass DiscountStrategy(Protocol):\n    def apply(self, amount:\
  \ float) -> float: ...\n\nclass NoDiscount:\n    def apply(self, amount: float) -> float:\n        return\
  \ amount\n\nclass TenPercent:\n    def apply(self, amount: float) -> float:\n        return amount *\
  \ 0.9\n\nclass HolidayDiscount:\n    def apply(self, amount: float) -> float:\n        return amount\
  \ * 0.75\n\ndef apply_discount(amount: float, kind: str) -> float:\n    strategies: dict[str, DiscountStrategy]\
  \ = {\n        \"none\": NoDiscount(),\n        \"10pct\": TenPercent(),\n        \"holiday\": HolidayDiscount(),\n\
  \    }\n    return strategies[kind].apply(amount)\n```\n\n## Test\n\n```python\nimport pytest\nfrom\
  \ strategy import apply_discount\n\ndef test_holiday_discount():\n    assert apply_discount(100, \"\
  holiday\") == 75.0\n\ndef test_unknown_strategy():\n    with pytest.raises(KeyError):\n        apply_discount(100,\
  \ \"nope\")\n```\n\n```bash\npython -m pytest tests/ -v\n```\n\n## Best practices\n\n- Strategies implement\
  \ the same protocol - no type checks.\n- Register strategies in a lookup, not if/elif chains.\n- Make\
  \ strategies stateless when possible.\n- Name by behavior: TenPercent, not Strategy1.\n\n## Testing\n\
  \nTest each strategy and the registry lookups, including unknown keys."
examples:
- input: Apply different discount rules per campaign.
  output: Implements strategy classes behind one protocol and routes via a strategy registry.
- input: Add a new shipping calculator without touching checkout.
  output: Adds a new strategy class and one registry entry; checkout logic untouched.
