name: real-time-systems
version: 2.0.0
type: skill
category: embedded
description: 'Builds real-time features: WebSockets with wscat/websocat, SSE streams, and gRPC bidirectional
  streaming.'
keywords:
- real-time
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: real-time-systems.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-real-time-systems
  generic:
    system_prompt: 'Your lane is real-time-systems. You do it through websocket: Test and debug WebSocket
      endpoints. The commands are real, e.g. `wscat -c ws://localhost:8080/ws`. You prefer the shortest
      safe path, and you reproduce failures before diagnosing them.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: websocket
  description: Test and debug WebSocket endpoints.
  commands:
  - wscat -c ws://localhost:8080/ws
  - websocat ws://localhost:8080/ws
  - 'wscat -c wss://api.example.com/ws -H ''Authorization: Bearer $TOKEN'''
  - websocat -n ws://localhost:8080/ws --protocol json
  - curl -N http://localhost:8080/events
  examples:
  - wscat -c ws://localhost:8080/ws --wait 10
  - echo '{"type":"ping"}' | websocat -n ws://localhost:8080/ws
  - 'curl -N -H ''Accept: text/event-stream'' http://localhost:8080/events'
  parameters:
  - name: url
    type: string
    description: ws/wss endpoint
  - name: protocol
    type: string
    description: Subprotocol header
  - name: header
    type: string
    description: Extra HTTP headers
- name: grpc-streams
  description: Exercise streaming gRPC services.
  commands:
  - grpcurl -plaintext localhost:50051 list
  - grpcurl -plaintext -d '{"message":"hello"}' localhost:50051 chat.ChatService/Chat
  - grpcurl -plaintext -d '{"query":"tail"}' localhost:50051 logs.LogService/Stream
  - grpcurl -plaintext -import-path proto -proto chat/chat.proto localhost:50051 chat.ChatService/Chat
  - curl -N -G http://localhost:8080/api/events
  examples:
  - grpcurl -plaintext -d '{"message":"hi"}' localhost:50051 chat.ChatService/Chat | head -20
  - grpcurl -plaintext -d '{}' localhost:50051 logs.LogService/Stream --max-msg-sz 10000000
  - 'curl -N -H ''Accept: text/event-stream'' http://localhost:8080/stream'
  parameters:
  - name: service
    type: string
    description: Service/Method name
  - name: data
    type: string
    description: Request JSON
  - name: max-msg-sz
    type: number
    description: Max message size
prerequisites:
- c
- rust
- rtos
- linux
tools:
- c
- rust
- rtos
- linux
- gdb
examples:
- input: Test the chat WebSocket before release.
  output: Connects with wscat, exchanges ping/pong frames, and verifies the auth header path.
- input: Debug why the gRPC event stream disconnects.
  output: Streams with grpcurl, raises the message size limit, and checks server logs for idle timeouts.
instructions: '# Real-Time Systems


  Build and verify live-updating systems.


  ## When to Use


  - Chat, notifications, live dashboards

  - Streaming logs and metrics

  - Bidirectional sync between clients


  ## WebSocket testing


  ```bash

  wscat -c ws://localhost:8080/ws

  echo ''{"type":"ping"}'' | websocat -n ws://localhost:8080/ws

  ```


  ## SSE (server-sent events)


  ```bash

  curl -N -H ''Accept: text/event-stream'' http://localhost:8080/events

  ```


  SSE is one-way and auto-reconnects - simpler than WebSockets for feeds.


  ## gRPC streams


  ```bash

  grpcurl -plaintext -d ''{"message":"hello"}'' localhost:50051 chat.ChatService/Chat

  ```


  ## Architecture decisions


  - WebSocket: full-duplex, persistent connections.

  - SSE: server push only, HTTP-native, automatic reconnect.

  - gRPC streaming: typed, efficient, for internal services.

  - Protocol choice drives load balancer config (sticky vs plain HTTP).


  ## Reliability


  - Heartbeats/pings to detect dead connections.

  - Reconnect with exponential backoff and jitter.

  - Buffer/ack server-side for unreliable clients.

  - Scale: keep-alive connections need LB support and idle timeouts.


  ## Testing


  ```bash

  wscat -c ws://localhost:8080/ws --wait 10

  curl -N http://localhost:8080/events | head -5

  ```


  Verify reconnect behavior by killing the client mid-stream.'
