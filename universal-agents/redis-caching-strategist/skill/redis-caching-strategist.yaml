  - redis-cli SET session:abc123 '{"user":42}' EX 900
  - redis-cli TTL session:abc123
  - redis-cli INFO stats | grep -E 'keyspace_hits|keyspace_misses'
  - redis-cli --scan --pattern 'cache:*' --count 1000 | head -20
