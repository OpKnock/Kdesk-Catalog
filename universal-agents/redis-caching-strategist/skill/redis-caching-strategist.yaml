  commands:
  - redis-benchmark -t set,get -n 100000 -c 50 -P 16
  - redis-benchmark -t lpush,incr -n 50000 -c 100 -d 128
  - redis-benchmark -q -t set,get
  - redis-cli --latency -h cache-1.example.com
  - redis-cli --stat -i 1
