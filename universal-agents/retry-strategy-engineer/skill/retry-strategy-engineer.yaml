capabilities:
- name: curl-retry
  description: Test and apply curl-level retry policies.
  commands:
  - curl --retry 5 --retry-delay 2 --retry-all-errors -fsS https://api.example.com/healthz
  - curl --retry 3 --retry-connrefused --retry-delay 1 http://service:8080/
  - curl --retry 5 --retry-delay 3 --retry-max-time 60 https://api.example.com/data
  - curl -w '%{http_code} %{num_retries}\n' --retry 3 --retry-all-errors -o /dev/null http://service:8080/
  - curl --retry 2 --retry-all-errors --max-time 5 https://api.example.com/
  examples:
  - curl --retry 5 --retry-delay 2 --retry-all-errors -fsS https://api.example.com/healthz
  - curl --retry 3 --retry-connrefused -s -o /dev/null -w '%{http_code} %{num_retries}\n' http://service:8080/
  - curl --retry-max-time 30 --retry 4 --retry-delay 1 https://api.example.com/upload
  parameters:
  - name: retry
    type: number
    description: Max retry count
  - name: retry-delay
    type: number
    description: Delay between retries
  - name: retry-all-errors
    type: string
    description: Retry on 4xx/5xx and transport errors
- name: netem
  description: Inject network faults to test resilience.
  commands:
  - tc qdisc add dev eth0 root netem loss 10%
  - tc qdisc add dev eth0 root netem delay 100ms 20ms distribution normal
  - tc qdisc change dev eth0 root netem loss 30% delay 200ms
  - tc qdisc del dev eth0 root
  - tc qdisc show dev eth0
  examples:
  - tc qdisc add dev eth0 root netem loss 10% delay 100ms
  - tc qdisc change dev eth0 root netem loss 50%
  - tc qdisc del dev eth0 root && tc qdisc show dev eth0
