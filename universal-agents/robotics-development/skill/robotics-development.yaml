name: robotics-development
version: 2.0.0
type: skill
category: robotics
description: 'Develops ROS 2 systems: topics, nodes, launch files, parameter control, and rosbag recording/playback.'
keywords:
- robotics
- ros
- control
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: robotics-development.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-robotics-development
  generic:
    system_prompt: 'You work robotics-development hands-on. You do it through ros2-cli: Inspect and operate
      the ROS 2 graph. The commands are real, e.g. `ros2 topic list`. You verify each step you report
      and stay honest about what you have not run.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: ros2-cli
  description: Inspect and operate the ROS 2 graph.
  commands:
  - ros2 topic list
  - ros2 topic echo /odom --field linear.x
  - ros2 node list
  - ros2 node info /turtlebot
  - ros2 param set /turtlebot background_r 255
  examples:
  - ros2 topic info /cmd_vel -v
  - ros2 topic echo /scan --once | head -20
  - ros2 node list | grep -E 'nav|move'
  parameters:
  - name: topic
    type: string
    description: Topic name
  - name: node
    type: string
    description: Node name
  - name: field
    type: string
    description: Message field to echo
- name: launch-bags
  description: Launch systems and record/playback data.
  commands:
  - ros2 launch turtlebot3_gazebo turtlebot3_world.launch.py
  - ros2 bag record -a -o rosbag2_2026_08_10
  - ros2 bag record /odom /scan /cmd_vel -o nav_run1
  - ros2 bag play rosbag2_2026_08_10
  - ros2 bag info rosbag2_2026_08_10
  examples:
  - ros2 bag record -a -o run_$(date +%F)
  - ros2 bag play rosbag2_2026_08_10 --rate 0.5
  - ros2 bag info rosbag2_2026_08_10 | head -20
  parameters:
  - name: bag
    type: string
    description: Bag directory
  - name: rate
    type: number
    description: Playback rate
  - name: topics
    type: string
    description: Topics to record
prerequisites:
- python
- c++
- ros
- moveit
tools:
- python
- c++
- ros
- moveit
- gazebo
examples:
- input: Inspect why the robot isn't publishing odometry.
  output: Lists topics and nodes, echoes /odom, and checks node info for the publisher state.
- input: Replay yesterday's navigation run for analysis.
  output: Records a bag on the run, then plays it back at half rate while observing /scan and /odom.
instructions: '# Robotics Development


  Build and debug robot software with ROS 2.


  ## When to Use


  - Robot perception, navigation, and control

  - Simulated robot stacks (Gazebo)

  - Logging and replay of robot runs


  ## Inspect the graph


  ```bash

  ros2 topic list

  ros2 node list

  ros2 topic echo /odom --field linear.x

  ```


  ## Control and params


  ```bash

  ros2 param set /turtlebot background_r 255

  ros2 topic pub /cmd_vel geometry_msgs/msg/Twist ''{"linear": {"x": 0.1}}'' --once

  ```


  ## Launch


  ```bash

  ros2 launch turtlebot3_gazebo turtlebot3_world.launch.py

  ```


  Launch files bring up nodes, params, and remappings together.


  ## Record and replay


  ```bash

  ros2 bag record /odom /scan /cmd_vel -o nav_run1

  ros2 bag info nav_run1

  ros2 bag play nav_run1 --rate 0.5

  ```


  Replays let you debug perception without hardware.


  ## Best practices


  - Namespace topics by robot id for multi-robot.

  - Use lifecycle nodes for deterministic startup.

  - Record bags for every on-robot experiment.

  - Simulate first; hardware time is precious.


  ## Testing


  Run the stack in simulation, record a bag, replay, and compare metrics.'
display_name: robotics-development
