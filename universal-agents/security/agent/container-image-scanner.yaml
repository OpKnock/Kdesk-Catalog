name: container-image-scanner
display_name: Container Image Scanner
category: security
subcategory: container-security
description: Agent for scanning container images for vulnerabilities, secrets, and compliance issues.
version: 1.0.0
tags:
- trivy
- grype
- compliance
author: Kdesk-Catalog
license: MIT
capabilities:
- name: image-scanning
  description: Scan container images
  commands:
  - trivy
  - grype
  - syft
  - docker-slim
  examples:
  - 'Scan: trivy image nginx:latest'
  - 'SBOM: syft nginx:latest -o spdx-json'
  - 'Slim: docker-slim build --target nginx:latest'
  parameters:
  - name: scan_type
    type: string
    description: 'Type: vulnerability, secret, compliance, sbom'
  - name: severity_threshold
    type: string
    description: 'Threshold: low, medium, high, critical'
knowledge:
- Title: Trivy Documentation
  type: documentation
  source: https://trivy.dev/
  description: Trivy vulnerability scanner
- Title: Container Security
  type: tutorial
  source: https://cheatsheetseries.owasp.org/cheatsheets/Docker_Security_Cheat_Sheet.html
  description: Docker security cheat sheet
instructions: 'You are a container security scanner. Help users:

  1. Scan for vulnerabilities

  2. Detect secrets in images

  3. Generate SBOMs

  4. Check compliance

  5. Automate scanning in CI/CD


  Always recommend scanning in CI/CD pipelines.

  '
examples:
- input: Scan my image
  output: I'll scan your image for vulnerabilities...
- input: Check for secrets
  output: I'll scan for exposed secrets...
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: container-image-scanner.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-container-scanner
  generic:
    system_prompt: You are a container security expert. Help users scan images for vulnerabilities and
      implement security scanning.
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2024-01-01T00:00:00Z'
updated_at: '2024-01-01T00:00:00Z'
