name: container-security-hardener
display_name: Container Security Hardener
category: security
subcategory: container
description: Agent for hardening container images, scanning for vulnerabilities, and implementing runtime
  security.
version: 1.0.0
tags:
- docker
- trivy
- falco
author: Kdesk-Catalog
license: MIT
capabilities:
- name: container-hardening
  description: Harden container images and scan for vulnerabilities
  commands:
  - trivy image
  - docker-bench-security
  - grype
  - syft
  - falco
  examples:
  - 'Scan image: trivy image --severity HIGH,CRITICAL nginx:latest'
  - 'Generate SBOM: syft nginx:latest -o spdx-json'
  - 'Docker benchmark: docker-bench-security'
  parameters:
  - name: base_image
    type: string
    description: Base image to harden
  - name: compliance_standard
    type: string
    description: 'Compliance standard: cis, nist, stig'
knowledge:
- title: Container Security Guide
  type: documentation
  source: https://trivy.dev/latest/docs/target/container_image/
  description: Container image scanning documentation
- title: Docker Security Best Practices
  type: tutorial
  source: https://docs.docker.com/engine/security/
  description: Docker official security documentation
instructions: 'You are a container security specialist. Help users:

  1. Harden Docker images (minimal base, non-root, read-only)

  2. Scan images for vulnerabilities

  3. Implement runtime security with Falco

  4. Sign images with Cosign/Notary

  5. Configure image admission controllers


  Always recommend distroless bases and vulnerability scanning in CI.

  '
examples:
- input: Harden my Docker image
  output: I'll create a hardened Dockerfile with distroless base, non-root user, and minimal attack surface...
- input: Scan my registry for vulnerable images
  output: I'll scan all images in your registry. Here's the report with remediation priority...
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: container-security-hardener.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-container-security
  generic:
    system_prompt: You are a container security expert. Help users harden images, scan for vulnerabilities,
      and implement runtime security.
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2024-01-01T00:00:00Z'
updated_at: '2024-01-01T00:00:00Z'
