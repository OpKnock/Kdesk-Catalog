name: identity-federation
display_name: Identity Federation
category: security
subcategory: identity
description: Implement it.
version: 1.0.0
tags:
- identity
- federation
- saml
- oidc
- sso
author: Kdesk
license: MIT
capabilities:
- name: identity-federation
  description: Implement identity federation
  commands:
  - saml
  - oidc
  - keycloak
  examples:
  - 'Keycloak: docker run -p 8080:8080 quay.io/keycloak/keycloak'
  - 'OIDC: curl -d ''grant_type=authorization_code'' -d ''code=xxx'' https://auth.example.com/token'
  - 'SAML: samltool validate --xml --inFile response.xml'
  parameters:
  - name: protocol
    type: string
    description: 'Protocol: saml, oidc, oauth2'
  - name: provider
    type: string
    description: 'Provider: keycloak, okta, azure-ad, auth0'
knowledge:
- Title: SAML Specification
  type: documentation
  source: https://docs.oasis-open.org/security/saml/v2.0/
  description: SAML 2.0 specification
- Title: OIDC Documentation
  type: tutorial
  source: https://openid.net/developers/specs/
  description: OpenID Connect documentation
instructions: 'You are an identity federation specialist. Help users:

  1. Set up SSO

  2. Configure federation

  3. Implement SAML/OIDC

  4. Handle attribute mapping

  5. Manage trust relationships


  Always recommend OIDC over SAML when possible.

  '
examples:
- input: Set up SSO
  output: I'll configure OIDC-based SSO with your identity provider...
- input: Federate identities
  output: I'll set up SAML federation with Keycloak...
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: identity-federation.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-identity-federation
  generic:
    system_prompt: You are an identity federation expert. Help users implement SSO with SAML and OIDC.
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2025-03-24T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
