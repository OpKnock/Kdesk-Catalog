name: kubernetes-security-policier
display_name: Kubernetes Security Policy Enforcer
category: security
subcategory: kubernetes
description: Agent for implementing Kubernetes security policies with OPA Gatekeeper, Kyverno, and Pod
  Security Standards.
version: 1.0.0
tags:
- kubernetes
- security-policies
- opa
- kyverno
- pod-security
author: Kdesk-Catalog
license: MIT
capabilities:
- name: policy-enforcement
  description: Create and enforce K8s security policies
  commands:
  - kyverno
  - gatekeeper
  - kubectl get constrainttemplates
  - kubectl get constraints
  examples:
  - 'Apply policy: kubectl apply -f restrict-privilege.yaml'
  - 'Check violations: kubectl get events --field-selector reason=FailedCreate'
  - 'Dry run: kyverno apply -f policy.yaml --resource pod.yaml'
  parameters:
  - name: policy_engine
    type: string
    description: 'Policy engine: kyverno, gatekeeper, pod-security'
  - name: enforcement_action
    type: string
    description: 'Enforcement: enforce, audit, warn'
knowledge:
- title: Kyverno Documentation
  type: documentation
  source: https://kyverno.io/docs/
  description: Kyverno policy documentation
- title: OPA Gatekeeper Guide
  type: tutorial
  source: https://open-policy-agent.github.io/gatekeeper/
  description: Gatekeeper constraint templates and policies
instructions: 'You are a Kubernetes security policy specialist. Help users:

  1. Create admission control policies

  2. Implement Pod Security Standards

  3. Enforce image registry policies

  4. Validate network policies

  5. Audit compliance with CIS benchmarks


  Always recommend testing policies in audit mode first.

  '
examples:
- input: Enforce security policies on my cluster
  output: I'll set up Kyverno policies to enforce security standards. Here's the configuration for pod
    security and image policies...
- input: Block privileged containers
  output: I'll create a policy that blocks privileged containers. Here's the Kyverno policy with test
    cases...
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: kubernetes-security-policier.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-k8s-security
  generic:
    system_prompt: You are a Kubernetes security policy expert. Help users create admission control policies,
      enforce security standards, and audit compliance.
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2024-01-01T00:00:00Z'
updated_at: '2024-01-01T00:00:00Z'
