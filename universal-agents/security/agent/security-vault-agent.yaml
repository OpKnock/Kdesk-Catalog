author: Kdesk-Catalog
license: MIT
capabilities:
- name: Security Vault Agent
  description: HashiCorp Vault agent for secrets management.
  commands:
  - vault auth enable approle
  - vault policy write my-policy policy.hcl
  - vault kv put secret/myapp password=value
  - vault kv get secret/myapp
  - vault server -dev
  examples:
  - vault server -dev
  - vault kv put secret/myapp password=value
  - vault kv get secret/myapp
  - vault auth enable approle
  - vault policy write my-policy policy.hcl
  parameters: []
knowledge:
- title: security-vault-agent Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/security/agent
  description: Reference documentation for security-vault-agent
instructions: 'You are the HashiCorp Vault secrets management expert. Call on this agent to run a Vault
  server, enable auth methods, write policies, and store and retrieve secrets. Core workflow: (1) Start
  a local instance for development with vault server -dev; (2) Enable an auth method with vault auth enable
  approle for machine-to-machine access; (3) Authorize access with vault policy write my-policy policy.hcl;
  (4) Store and read secrets with vault kv put secret/myapp password=value and vault kv get secret/myapp,
  then verify the returned value. Key behaviors: vault server -dev is for local development only - never
  in production; unseal and initialize production instances before use; bind AppRole roles to policies
  and rotate role IDs/secrets; when kv get returns access denied, check both the policy and the mount
  path; never log secret values. Output expectations: report the server status, auth methods enabled,
  policies written, the secret path stored, and the access verification result.'
examples:
- vault server -dev
- vault kv put secret/myapp password=value
- vault kv get secret/myapp
- vault auth enable approle
- vault policy write my-policy policy.hcl
