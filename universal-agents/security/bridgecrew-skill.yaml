name: bridgecrew
display_name: bridgecrew
category: security
subcategory: general
description: Run it scans locally over directories and files with framework selection. Upload results to it SaaS handling dashboards, PR comments, and fix tracking.
  results for centralized fix tracking.
version: 2.0.0
tags:
- security
author: Mehul Wagde
license: MIT
prerequisites:
- bridgecrew
- checkov
capabilities:
- name: bridgecrew-scan
  description: Run Bridgecrew scans locally over directories and files with framework selection.
  commands:
  - bridgecrew --directory .
  - bridgecrew -d terraform/ --framework terraform
  - bridgecrew -f main.tf -o json
  - bridgecrew -d . --skip-check CKV_AWS_79
  - bridgecrew -d . --output junitxml
  examples:
  - bridgecrew --directory ./infra --framework terraform --output cli
  - bridgecrew -f serverless.yml --framework serverless
  - bridgecrew -d . --compact
  parameters:
  - name: directory
    type: string
    description: Directory to scan recursively
  - name: framework
    type: string
    description: 'IaC framework: terraform, cloudformation, serverless, arm'
  - name: output
    type: string
    description: 'Report format: cli, json, junitxml, sarif'
- name: platform-integration
  description: Upload results to Bridgecrew SaaS for dashboards, PR comments, and fix tracking.
  commands:
  - bridgecrew --bc-api-key $BRIDGECREW_API_KEY --repo-id myorg/infra
  - checkov -d . --bc-api-key $BRIDGECREW_API_KEY --repo-id myorg/infra --repo-branch main
  - bridgecrew --bc-api-key $BRIDGECREW_API_KEY --directory . --skip-fixes
  examples:
  - bridgecrew --bc-api-key $BRIDGECREW_API_KEY --repo-id acme/infra
  - checkov -d . --bc-api-key $BRIDGECREW_API_KEY --repo-id acme/infra --download-external-modules
  parameters:
  - name: apiKey
    type: string
    description: 'Bridgecrew API key (env: BRIDGECREW_API_KEY)'
  - name: repoId
    type: string
    description: Repository identifier for result upload, e.g. org/repo
knowledge:
- title: Bridgecrew Documentation
  type: documentation
  source: https://docs.bridgecrew.io/
  description: CLI usage, policies, and platform integration
- title: Prisma Cloud IaC Docs
  type: documentation
  source: https://docs.prismacloud.io/en/enterprise-edition/content/iac
  description: IaC scanning engine, policy library, and fix workflow
instructions: '# Bridgecrew IaC Security


  Scan infrastructure-as-code against Bridgecrew/Prisma Cloud policies for misconfigurations.


  ## What This Skill Does


  - Scans Terraform, CloudFormation, Serverless, ARM, and Kubernetes manifests

  - Reports policy violations with fix guidance in multiple formats

  - Integrates with the Bridgecrew SaaS platform for dashboards and PR gatekeeping

  - Excludes false positives per policy or per check


  ## When to Use


  - Pre-deploy IaC review for misconfigurations

  - CI gate that fails on high-severity policy violations

  - Centralized compliance reporting for cloud infrastructure


  ## Real Commands


  ```bash

  # Basic directory scan

  bridgecrew --directory .


  # Framework-scoped scan with JSON output

  bridgecrew -d terraform/ --framework terraform -o json


  # Single-file scan

  bridgecrew -f main.tf -o cli


  # Skip a noisy policy and output SARIF for GitHub code scanning

  bridgecrew -d . --skip-check CKV_AWS_79 --output sarif


  # Upload to the platform

  bridgecrew --bc-api-key $BRIDGECREW_API_KEY --repo-id myorg/infra


  # Modern engine: checkov with platform key

  checkov -d . --bc-api-key $BRIDGECREW_API_KEY --repo-id myorg/infra

  ```


  ## Best Practices


  - Run in CI on every PR; fail only on HIGH/CRITICAL to start

  - Keep baseline results reviewed and suppress known-false positives explicitly

  - Scan Kubernetes YAML with the k8s framework as part of the same pipeline

  - Prefer checkov for newer policy features; bridgecrew CLI is legacy

  - Store the API key in CI secrets, never in the repo'
examples:
- input: Scan my Terraform before a production deploy
  output: Agent runs bridgecrew -d terraform/ --framework terraform -o json, summarizes HIGH/CRITICAL
    findings with check IDs, and proposes fixes for the top issues.
- input: Wire Bridgecrew into CI to block insecure PRs
  output: Agent adds bridgecrew -d . --framework terraform --output junitxml with BRIDGECREW_API_KEY secret
    and fails the job on CRITICAL findings.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: bridgecrew.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-bridgecrew
  generic:
    system_prompt: 'Your lane is bridgecrew. You do it through bridgecrew-scan: Run Bridgecrew scans locally
      over directories and files with framework selection. The commands are real, e.g. `bridgecrew --directory
      .`. You verify each step you report and stay honest about what you have not run.'
    available_tools:
    - bash
    - read
    - write
    - edit
