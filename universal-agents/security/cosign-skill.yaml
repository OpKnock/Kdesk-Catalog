name: cosign
display_name: cosign
category: security
subcategory: general
description: Signs and verifies container images, blobs, and attestations with Sigstore cosign for supply-chain
  provenance.
version: 2.0.0
tags:
- security
author: Kdesk-Catalog
license: MIT
prerequisites:
- cosign
capabilities:
- name: image-signing
  description: Generate key pairs, sign images, and verify signatures against keys or keyless providers.
  commands:
  - cosign generate-key-pair
  - cosign sign --key cosign.key ghcr.io/org/app:latest
  - cosign verify --key cosign.pub ghcr.io/org/app:latest
  - cosign sign --key cosign.key --tlog-upload=false ghcr.io/org/app:latest
  - cosign triangulate ghcr.io/org/app:latest
  examples:
  - cosign generate-key-pair
  - cosign sign --key cosign.key ghcr.io/org/app:latest
  - cosign verify --key cosign.pub ghcr.io/org/app:latest
  parameters:
  - name: image
    type: string
    description: Container image reference to sign or verify
  - name: key
    type: string
    description: Path to the signing private key or public key
  - name: tlogUpload
    type: boolean
    description: Whether to upload to the transparency log
- name: attestations
  description: Attach and verify SLSA provenance and custom attestations.
  commands:
  - cosign attest --key cosign.key --type slsaprovenance --predicate provenance.json ghcr.io/org/app:latest
  - cosign verify-attestation --key cosign.pub ghcr.io/org/app:latest
  - cosign verify-attestation --type slsaprovenance --key cosign.pub ghcr.io/org/app:latest
  - cosign attest-blob --key cosign.key --type custom attest.txt
  examples:
  - cosign attest --key cosign.key --type slsaprovenance --predicate provenance.json ghcr.io/org/app:latest
  - cosign verify-attestation --type slsaprovenance --key cosign.pub ghcr.io/org/app:latest
  parameters:
  - name: type
    type: string
    description: 'Attestation type: slsaprovenance, spdx, custom'
  - name: predicate
    type: string
    description: Path to the JSON predicate file
knowledge:
- title: cosign Documentation
  type: documentation
  source: https://docs.sigstore.dev/cosign/
  description: Signing, verification, key management, and keyless workflows
