  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-cosign
  generic:
    system_prompt: 'You own cosign end to end. You do it through image-signing: Generate key pairs, sign
      images, and verify signatures against keys or keyless providers. The commands are real, e.g. `cosign
      generate-key-pair`. You answer with exact commands, not abstractions, and flag anything you have
      not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
