name: detect-secrets
display_name: detect-secrets
category: security
subcategory: general
description: Scans codebases for high-entropy strings and known secret patterns, maintaining a reviewed
  baseline to prevent secret leaks in CI.
version: 2.0.0
tags:
- security
author: Kdesk-Catalog
license: MIT
prerequisites:
- detect-secrets
- detect-secrets-hook
- git
- pre-commit
capabilities:
- name: baseline-scanning
  description: Scan repositories and manage the .secrets.baseline allowlist.
  commands:
  - detect-secrets scan . > .secrets.baseline
  - detect-secrets scan --baseline .secrets.baseline .
  - detect-secrets scan --exclude-files 'tests/*' .
  - detect-secrets scan --update .secrets.baseline
  examples:
  - detect-secrets scan . > .secrets.baseline
  - detect-secrets scan --baseline .secrets.baseline .
  - detect-secrets scan --update .secrets.baseline
  parameters:
  - name: baseline
    type: string
    description: Path to the baseline JSON file
  - name: excludeFiles
    type: string
    description: Regex of files to exclude
- name: audit-and-hooks
  description: Audit findings, resolve them as true/false positives, and run pre-commit hooks.
  commands:
  - detect-secrets audit .secrets.baseline
  - detect-secrets-hook --baseline .secrets.baseline .env
  - git diff | detect-secrets-hook --baseline .secrets.baseline --stdin
  - pre-commit install
  examples:
  - detect-secrets audit .secrets.baseline
  - git diff | detect-secrets-hook --baseline .secrets.baseline --stdin
  - pre-commit run --all-files
  parameters:
  - name: stdin
    type: boolean
    description: Read content from stdin (used with git diff)
  - name: baseline
    type: string
    description: Baseline file used by the hook
knowledge:
- title: detect-secrets GitHub
  type: documentation
  source: https://github.com/Yelp/detect-secrets
  description: Plugins, baselines, and hook integration
- title: pre-commit Framework
  type: documentation
  source: https://pre-commit.com/
  description: Git hook framework for running detect-secrets in CI
instructions: "# detect-secrets\n\nFind and manage secrets in code with entropy detection and baseline\
  \ workflows.\n\n## What This Skill Does\n\n- Scans for AWS keys, tokens, private keys, and high-entropy\
  \ strings\n- Generates a reviewed baseline so legacy findings are tracked, not hidden\n- Runs as a pre-commit\
  \ hook to block new secrets\n- Audits findings interactively and updates the baseline\n\n## When to\
  \ Use\n\n- Onboarding a repo that may contain committed secrets\n- Enforcing a no-secrets-in-diffs policy\
  \ in CI\n- Investigating a potential secret leak\n\n## Real Commands\n\n```bash\n# Initial baseline\n\
  cd repo\ndetect-secrets scan . > .secrets.baseline\n\n# Audit the baseline (mark true/false positives)\n\
  detect-secrets audit .secrets.baseline\n\n# CI: fail only on NEW secrets\ndetect-secrets scan --baseline\
  \ .secrets.baseline .\n\n# Pre-commit hook on staged content\npre-commit install\ngit diff | detect-secrets-hook\
  \ --baseline .secrets.baseline --stdin\n\n# Update baseline after removing a secret\ndetect-secrets\
  \ scan --update .secrets.baseline\n```\n\n## .pre-commit-config.yaml\n\n```yaml\nrepos:\n  - repo: https://github.com/Yelp/detect-secrets\n\
  \    rev: v1.5.0\n    hooks:\n      - id: detect-secrets\n        args: [\"--baseline\", \".secrets.baseline\"\
  ]\n```\n\n## Best Practices\n\n- Never delete the baseline without auditing it first\n- Rotate any secret\
  \ that already leaked before removing it from the repo\n- Keep the hook fast by excluding vendored code\
  \ and generated files\n- Run a full scan in CI weekly, hook on every commit\n- Audit with two reviewers\
  \ for new baselines in sensitive repos"
examples:
- input: I think I committed an AWS key
  output: Agent runs detect-secrets scan . in the repo, isolates the finding, verifies with the AWS CLI
    whether it's live, and guides rotation plus baseline update.
- input: Block secrets from being committed going forward
  output: Agent generates the baseline, adds the pre-commit hook config, installs hooks, and wires detect-secrets
    scan --baseline into CI.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: detect-secrets.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-detect-secrets
  generic:
    system_prompt: 'You own detect-secrets end to end. You do it through baseline-scanning: Scan repositories
      and manage the .secrets.baseline allowlist. The commands are real, e.g. `detect-secrets scan . >
      .secrets.baseline`. You prefer the shortest safe path, and you reproduce failures before diagnosing
      them.'
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2024-01-01T00:00:00Z'
updated_at: '2024-01-01T00:00:00Z'
