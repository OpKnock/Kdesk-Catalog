name: external-secrets-security
display_name: external-secrets-security
category: security
subcategory: general
description: Synchronizes secrets from external providers (AWS, Vault, GCP, Azure) into Kubernetes with
  External Secrets Operator and secret stores.
version: 2.0.0
tags:
- security
author: Kdesk
license: MIT
prerequisites:
- helm
- kubectl
capabilities:
- name: secretstore-management
  description: Deploy and inspect SecretStores and ClusterSecretStores.
  commands:
  - helm repo add external-secrets https://charts.external-secrets.io
  - helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace
  - kubectl get secretstores -A
  - kubectl get clustersecretstores
  - kubectl describe secretstore aws-secretsmanager
  examples:
  - helm install external-secrets external-secrets/external-secrets -n external-secrets
  - kubectl get clustersecretstores
  - kubectl describe secretstore vault-store
  parameters:
  - name: name
    type: string
    description: SecretStore name
  - name: provider
    type: string
    description: 'Backend provider: aws, vault, gcp, azure, onepassword'
- name: externalsecret-sync
  description: Create ExternalSecrets, sync them, and read generated Kubernetes Secrets.
  commands:
  - kubectl apply -f externalsecret.yaml
  - kubectl get externalsecrets -A
  - kubectl describe externalsecret db-credentials
  - kubectl get secret db-credentials -o jsonpath='{.data.username}' | base64 -d
  - kubectl get pushsecrets
  examples:
  - kubectl apply -f externalsecret.yaml
  - kubectl get externalsecrets -A
  - kubectl describe externalsecret db-credentials
  parameters:
  - name: name
    type: string
    description: ExternalSecret name
  - name: namespace
    type: string
    description: Namespace where the secret should sync
knowledge:
- title: External Secrets Documentation
  type: documentation
  source: https://external-secrets.io/
  description: SecretStore providers, ExternalSecret spec, and deployment guides
- title: Provider Reference
  type: documentation
  source: https://external-secrets.io/latest/provider/
  description: AWS, Vault, GCP, Azure, and other provider configuration
instructions: "# External Secrets\n\nSynchronize Kubernetes Secrets from external secret management systems.\n\
  \n## What This Skill Does\n\n- Installs External Secrets Operator via Helm\n- Configures SecretStore/ClusterSecretStore\
  \ backends (AWS, Vault, GCP, Azure, 1Password)\n- Defines ExternalSecret resources that pull named keys\
  \ into Kubernetes Secrets\n- Refreshes secrets on a schedule and reports sync conditions\n\n## When\
  \ to Use\n\n- Kubernetes workloads need secrets from an external provider\n- Rotating secrets centrally\
  \ instead of editing YAML by hand\n- Multi-cluster secret management with a single source of truth\n\
  \n## Real Commands\n\n```bash\n# Install\nhelm repo add external-secrets https://charts.external-secrets.io\n\
  helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace\n\
  \n# Inspect stores\nkubectl get secretstores -A\nkubectl get clustersecretstores\nkubectl describe secretstore\
  \ aws-secretsmanager\n\n# Sync and verify\nkubectl apply -f externalsecret.yaml\nkubectl get externalsecrets\
  \ -A\nkubectl describe externalsecret db-credentials\nkubectl get secret db-credentials -o jsonpath='{.data.username}'\
  \ | base64 -d\n```\n\n## Sample ExternalSecret\n\n```yaml\napiVersion: external-secrets.io/v1beta1\n\
  kind: ExternalSecret\nmetadata:\n  name: db-credentials\nspec:\n  refreshInterval: 1h\n  secretStoreRef:\n\
  \    name: aws-secretsmanager\n    kind: ClusterSecretStore\n  target:\n    name: db-credentials\n \
  \ data:\n    - secretKey: username\n      remoteRef:\n        key: prod/db\n        property: username\n\
  ```\n\n## Best Practices\n\n- Use ClusterSecretStore for shared backends, SecretStore for namespaced\
  \ control\n- Grant the operator minimal IAM/Vault permissions per store\n- Set refreshInterval to balance\
  \ drift detection and API cost\n- Check the Secret.Status.Conditions for sync errors before releasing\n\
  - Never mix plain data in the same target Secret as synced keys"
examples:
- input: Sync my Vault secrets into Kubernetes
  output: Agent installs the operator, writes a SecretStore pointing at Vault with token auth, creates
    an ExternalSecret mapping keys, and verifies kubectl get secret output.
- input: My secret won't sync, condition shows AuthFailed
  output: Agent inspects kubectl describe secretstore and externalsecret, checks the Vault token permissions
    and store endpoint, then fixes auth and re-applies.
