    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: external-secrets-security.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-external-secrets
  generic:
    system_prompt: 'You are the external-secrets-security specialist. You do it through secretstore-management:
      Deploy and inspect SecretStores and ClusterSecretStores. The commands are real, e.g. `helm repo
      add external-secrets https://charts.external-secrets.io`. You run and verify the real CLI commands
      before you claim anything.'
    available_tools:
