name: kics
display_name: kics
category: security
subcategory: general
description: Scans IaC files (Terraform, Docker, K8s, Ansible, CloudFormation) with KICS static analysis
  queries for cloud misconfigurations.
version: 2.0.0
tags:
- security
author: Kdesk-Catalog
license: MIT
prerequisites:
- kics
capabilities:
- name: kics-scan
  description: Scan directories or files across supported platforms.
  commands:
  - kics scan -p .
  - kics scan -p terraform/ -i terraform
  - kics scan -p Dockerfile -q ./queries
  - kics scan -p . --exclude-queries 0684d1ba-9253-4bc1-8f1f-6d1c8e8b5e00
  - kics scan -p . --ignore-on-exit results
  examples:
  - kics scan -p .
  - kics scan -p terraform/ -i terraform
  - kics scan -p k8s/ -i kubernetes
  parameters:
  - name: path
    type: string
    description: Path to scan (file or directory)
  - name: inputType
    type: string
    description: 'IaC type: terraform, dockerfile, kubernetes, ansible, cloudformation'
  - name: queries
    type: string
    description: Custom queries path
- name: reporting-and-gating
  description: Emit reports and control exit codes for CI integration.
  commands:
  - kics scan -p . -o results.json --output-path results/
  - kics scan -p . -o sarif
  - kics scan -p . --report-formats json,html
  - kics list-platforms
  - kics scan -p . --disable-full-descriptions
  examples:
  - kics scan -p . --report-formats json,sarif --output-path ./reports
  - kics scan -p . --fail-on high
  - kics list-platforms
  parameters:
  - name: output
    type: string
    description: 'Report format: json, sarif, html, glsast'
  - name: failOn
    type: string
    description: 'Exit nonzero on findings at or above severity: low, medium, high, critical'
knowledge:
- title: KICS Documentation
  type: documentation
  source: https://docs.kics.io/
  description: Installation, scanning, and query authoring
- title: KICS GitHub
  type: documentation
  source: https://github.com/Checkmarx/kics
  description: Supported platforms and query catalog
instructions: '# KICS


  Keep Infrastructure as Code Secure with static query scanning.


  ## What This Skill Does


  - Scans Terraform, Kubernetes, Docker, Ansible, CloudFormation, and more

  - Applies 2000+ security, compliance, and best-practice queries

  - Emits SARIF, JSON, HTML, and GitLab SAST reports

  - Supports custom query packs written in Rego-like syntax


  ## When to Use


  - Pre-merge IaC misconfiguration checks

  - Multi-platform IaC repos where one tool should cover everything

  - Compliance evidence for CSPM baselines


  ## Real Commands


  ```bash

  # Basic scan

  kics scan -p .


  # Platform-scoped scan

  kics scan -p terraform/ -i terraform

  kics scan -p k8s/ -i kubernetes


  # Custom queries and exclusions

  kics scan -p . -q ./custom-queries

  kics scan -p . --exclude-queries 0684d1ba-9253-4bc1-8f1f-6d1c8e8b5e00


  # Reports

  kics scan -p . --report-formats json,sarif --output-path ./reports


  # CI gating

  kics scan -p . --fail-on high

  ```


  ## Best Practices


  - Pin KICS version in CI to keep query results stable

  - Start with --fail-on high and relax after reviewing noise

  - Track exclusions in config rather than hiding output

  - Feed SARIF into GitHub code scanning for inline PR annotations

  - Pair with runtime scanning (Falco/Gatekeeper) for defense in depth'
examples:
- input: Scan my Terraform and Kubernetes configs
  output: Agent runs kics scan -p terraform/ -i terraform and kics scan -p k8s/ -i kubernetes, then summarizes
    HIGH findings with query IDs and remediation.
- input: Get SARIF output for code scanning
  output: Agent runs kics scan -p . --report-formats sarif --output-path ./reports and uploads the .sarif
    artifact to code scanning.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: kics.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-kics
  generic:
    system_prompt: 'Your lane is kics. You do it through kics-scan: Scan directories or files across supported
      platforms. The commands are real, e.g. `kics scan -p .`. You work hands-on and only report outcomes
      you have observed.'
    available_tools:
    - bash
    - read
    - write
    - edit
