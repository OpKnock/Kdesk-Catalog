name: popeye-security
display_name: popeye-security
category: security
subcategory: general
description: Diagnoses cluster health and configuration hygiene with Popeye, scanning live clusters for
  best-practice violations and dead resources.
version: 2.0.0
tags:
- security
author: Kdesk
license: MIT
prerequisites:
- popeye
capabilities:
- name: cluster-sanitize
  description: Sanitize live clusters and export reports.
  commands:
  - popeye
  - popeye -n kube-system
  - popeye --context prod
  - popeye -s pod
  - popeye --out txt
  examples:
  - popeye
  - popeye -n kube-system
  - popeye --out json
  parameters:
  - name: context
    type: string
    description: Kubeconfig context to scan
  - name: sections
    type: string
    description: Comma-separated resource types to scan (pod, svc, deploy...)
  - name: out
    type: string
    description: 'Output format: standard, json, yaml, junit'
- name: reporting
  description: Save scan reports to files and enforce score gates.
  commands:
  - popeye --save
  - popeye --out json --output-file report.json
  - popeye --exit-code 3 --score 80
  - popeye --pull
  examples:
  - popeye --save
  - popeye --out json --output-file popeye.json
  - popeye --exit-code 3 --score 75
  parameters:
  - name: outputFile
    type: string
    description: Report destination path
  - name: score
    type: number
    description: Minimum acceptable score before exit-code triggers
  - name: exitCode
    type: number
    description: Exit code to emit when the gate fails
knowledge:
- title: Popeye Documentation
  type: documentation
  source: https://popeyecli.io/
  description: CLI usage, checks, and configuration
- title: Popeye GitHub
  type: documentation
  source: https://github.com/derailed/popeye
  description: Sanitizer checks and report formats
instructions: '# Popeye


  Cluster sanitizer: find misconfigurations and dead weight in live clusters.


  ## What This Skill Does


  - Scans live clusters for best-practice violations

  - Detects unused resources, duplicate config, and risky settings

  - Produces scores and reports per resource type

  - Gated CI runs with exit codes and score thresholds


  ## When to Use


  - Regular cluster hygiene reviews

  - Pre-upgrade cleanup of dead resources

  - Auditing workload configuration consistency


  ## Real Commands


  ```bash

  # Scan the current cluster

  popeye


  # Scope the scan

  popeye -n kube-system

  popeye --context prod

  popeye -s pod,svc,deploy


  # Reports

  popeye --out json --output-file report.json

  popeye --out txt

  popeye --save


  # CI gate

  popeye --exit-code 3 --score 80

  ```


  ## Best Practices


  - Run against a staging cluster copy first to avoid API churn

  - Set score gates in CI; investigate every ERROR-level finding

  - Use --context explicitly to avoid scanning the wrong cluster

  - Pair with Popeye''s fix suggestions before manual remediation

  - Archive reports per release for trend analysis'
examples:
- input: Anything wrong with my cluster config?
  output: Agent runs popeye --out json and summarizes ERROR/WARN findings by resource type with concrete
    fixes.
- input: Clean up before an upgrade
  output: Agent runs popeye -s pod,svc,deploy, lists dead or misconfigured resources, and proposes deletion
    or correction.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: popeye-security.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-popeye
  generic:
    system_prompt: 'This is your domain: popeye-security. You do it through cluster-sanitize: Sanitize
      live clusters and export reports. The commands are real, e.g. `popeye`. You answer with exact commands,
      not abstractions, and flag anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
