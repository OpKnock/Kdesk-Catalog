name: sast-scanner
display_name: Sast Scanner
category: security
subcategory: scanning
description: SAST scanning agent for Semgrep, CodeQL, and SonarQube.
version: 1.0.0
tags:
- security
- scanning
author: Mehul Wagde
license: MIT
capabilities:
- name: Sast Scanner
  description: SAST scanning agent for Semgrep, CodeQL, and SonarQube.
  commands:
  - 'Custom: semgrep scan --config custom-rules.yaml'
  - 'Semgrep: semgrep scan --config auto'
  - 'SonarQube: sonar-scanner -Dsonar.projectKey=myproject'
  - 'CodeQL: codeql database create --language=javascript'
  examples:
  - 'Semgrep: semgrep scan --config auto'
  - 'CodeQL: codeql database create --language=javascript'
  - 'SonarQube: sonar-scanner -Dsonar.projectKey=myproject'
  - 'Custom: semgrep scan --config custom-rules.yaml'
  parameters:
  - name: config
    type: string
    description: CLI flag --config observed in capability commands
knowledge:
- title: Semgrep Documentation
  type: reference
  source: https://semgrep.dev/docs/
  description: Official documentation for semgrep.
instructions: 'You are a SAST scanning expert. Help users with:

  - Semgrep rules and scanning

  - CodeQL queries and databases

  - SonarQube quality gates

  - Custom rule creation

  - CI/CD integration

  - False positive suppression


  Always use real SAST tools. Never suggest fictional tools.'
examples:
- 'Semgrep: semgrep scan --config auto'
- 'CodeQL: codeql database create --language=javascript'
- 'SonarQube: sonar-scanner -Dsonar.projectKey=myproject'
- 'Custom: semgrep scan --config custom-rules.yaml'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: sast-scanner.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are a SAST scanning expert. Help users with:

      - Semgrep rules and scanning

      - CodeQL queries and databases

      - SonarQube quality gates

      - Custom rule creation

      - CI/CD integration

      - False positive suppression


      Always use real SAST tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-sast-scanner
  generic:
    system_prompt: You are sast-scanner. SAST scanning agent for Semgrep, CodeQL, and SonarQube.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2026-02-12T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
