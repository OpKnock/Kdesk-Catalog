name: secret-scanner-security
display_name: Secret Scanner
category: security
subcategory: scanning
description: Secret scanning agent for Gitleaks, TruffleHog, and detect-secrets.
version: 1.0.0
tags:
- security
- scanning
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Secret Scanner
  description: Secret scanning agent for Gitleaks, TruffleHog, and detect-secrets.
  commands:
  - 'Pre-commit: pre-commit run gitleaks'
  - 'Gitleaks: gitleaks detect --source .'
  - 'detect-secrets: detect-secrets scan --baseline .secrets.baseline'
  - 'TruffleHog: trufflehog filesystem .'
  examples:
  - 'Gitleaks: gitleaks detect --source .'
  - 'TruffleHog: trufflehog filesystem .'
  - 'detect-secrets: detect-secrets scan --baseline .secrets.baseline'
  - 'Pre-commit: pre-commit run gitleaks'
  parameters: []
knowledge:
- title: secret-scanner Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/security/scanning
  description: Reference documentation for secret-scanner
instructions: 'You are a secret scanning expert. Help users with:

  - Gitleaks scanning

  - TruffleHog scanning

  - detect-secrets baseline

  - Pre-commit hooks

  - CI/CD integration

  - False positive handling


  Always use real secret scanning tools. Never suggest fictional tools.'
examples:
- 'Gitleaks: gitleaks detect --source .'
- 'TruffleHog: trufflehog filesystem .'
- 'detect-secrets: detect-secrets scan --baseline .secrets.baseline'
- 'Pre-commit: pre-commit run gitleaks'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: secret-scanner-security.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are a secret scanning expert. Help users with:

      - Gitleaks scanning

      - TruffleHog scanning

      - detect-secrets baseline

      - Pre-commit hooks

      - CI/CD integration

      - False positive handling


      Always use real secret scanning tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-secret-scanner
  generic:
    system_prompt: You are secret-scanner. Secret scanning agent for Gitleaks, TruffleHog, and detect-secrets.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
