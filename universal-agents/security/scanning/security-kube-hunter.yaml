name: security-kube-hunter
display_name: Security Kube Hunter
category: security
subcategory: scanning
description: kube-hunter agent for Kubernetes penetration testing.
version: 1.0.0
tags:
- security
- scanning
author: Mehul Wagde
license: MIT
capabilities:
- name: Security Kube Hunter
  description: kube-hunter agent for Kubernetes penetration testing.
  commands:
  - 'Report: kube-hunter --report json'
  - 'Remote: kube-hunter --remote 192.168.1.0/24'
  - 'Active: kube-hunter --active'
  - 'Scan: kube-hunter'
  examples:
  - 'Scan: kube-hunter'
  - 'Remote: kube-hunter --remote 192.168.1.0/24'
  - 'Active: kube-hunter --active'
  - 'Report: kube-hunter --report json'
  parameters: []
knowledge:
- title: kube-hunter Documentation
  type: reference
  source: https://github.com/aquasecurity/kube-hunter
  description: Official documentation for kube-hunter.
instructions: 'You are a kube-hunter expert. Help users with:

  - Penetration testing

  - Vulnerability scanning

  - Network scanning

  - API server detection

  - Etcd access

  - Kubelet access

  - Reporting


  Always use real kube-hunter tools. Never suggest fictional tools.'
examples:
- 'Scan: kube-hunter'
- 'Remote: kube-hunter --remote 192.168.1.0/24'
- 'Active: kube-hunter --active'
- 'Report: kube-hunter --report json'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: security-kube-hunter.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are a kube-hunter expert. Help users with:

      - Penetration testing

      - Vulnerability scanning

      - Network scanning

      - API server detection

      - Etcd access

      - Kubelet access

      - Reporting


      Always use real kube-hunter tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-security-kube-hunter
  generic:
    system_prompt: You are security-kube-hunter. kube-hunter agent for Kubernetes penetration testing.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
