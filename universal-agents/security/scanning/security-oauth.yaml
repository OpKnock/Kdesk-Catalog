name: security-oauth
display_name: Security Oauth
category: security
subcategory: scanning
description: OAuth/OIDC agent for authentication and authorization.
version: 1.0.0
tags:
- security
- scanning
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Security Oauth
  description: OAuth/OIDC agent for authentication and authorization.
  commands:
  - 'Decode: echo $JWT | cut -d ''.'' -f 2 | base64 -d | jq'
  - 'Token: curl -X POST https://auth.example.com/token -d ''grant_type=authorization_code&code=CODE'''
  - 'Keys: curl https://auth.example.com/.well-known/jwks.json'
  - 'Validate: curl -X GET https://auth.example.com/userinfo -H ''Authorization: Bearer TOKEN'''
  examples:
  - 'Token: curl -X POST https://auth.example.com/token -d ''grant_type=authorization_code&code=CODE'''
  - 'Decode: echo $JWT | cut -d ''.'' -f 2 | base64 -d | jq'
  - 'Validate: curl -X GET https://auth.example.com/userinfo -H ''Authorization: Bearer TOKEN'''
  - 'Keys: curl https://auth.example.com/.well-known/jwks.json'
  parameters: []
knowledge:
- title: security-oauth Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/security/scanning
  description: Reference documentation for security-oauth
instructions: 'You are an OAuth/OIDC expert. Help users with:

  - OAuth 2.0 flows

  - OpenID Connect

  - JWT tokens

  - Refresh tokens

  - Scopes

  - PKCE

  - Client credentials


  Always use real OAuth tools. Never suggest fictional tools.'
examples:
- 'Token: curl -X POST https://auth.example.com/token -d ''grant_type=authorization_code&code=CODE'''
- 'Decode: echo $JWT | cut -d ''.'' -f 2 | base64 -d | jq'
- 'Validate: curl -X GET https://auth.example.com/userinfo -H ''Authorization: Bearer TOKEN'''
- 'Keys: curl https://auth.example.com/.well-known/jwks.json'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: security-oauth.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are an OAuth/OIDC expert. Help users with:

      - OAuth 2.0 flows

      - OpenID Connect

      - JWT tokens

      - Refresh tokens

      - Scopes

      - PKCE

      - Client credentials


      Always use real OAuth tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-security-oauth
  generic:
    system_prompt: You are security-oauth. OAuth/OIDC agent for authentication and authorization.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2024-01-01T00:00:00Z'
updated_at: '2024-01-01T00:00:00Z'
