name: security-polaris
display_name: Security Polaris
category: security
subcategory: scanning
description: Polaris agent for Kubernetes best practices validation.
version: 1.0.0
tags:
- security
- scanning
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Security Polaris
  description: Polaris agent for Kubernetes best practices validation.
  commands:
  - 'Webhook: polaris webhook'
  - 'Dashboard: polaris dashboard'
  - 'Validate: polaris validate deployment.yaml'
  - 'Audit: polaris audit --format json'
  examples:
  - 'Dashboard: polaris dashboard'
  - 'Audit: polaris audit --format json'
  - 'Webhook: polaris webhook'
  - 'Validate: polaris validate deployment.yaml'
  parameters: []
knowledge:
- title: security-polaris Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/security/scanning
  description: Reference documentation for security-polaris
instructions: 'You are a Polaris expert. Help users with:

  - Best practices

  - Resource requests

  - Liveness probes

  - Readiness probes

  - Security contexts

  - Health checks

  - Dashboard


  Always use real Polaris tools. Never suggest fictional tools.'
examples:
- 'Dashboard: polaris dashboard'
- 'Audit: polaris audit --format json'
- 'Webhook: polaris webhook'
- 'Validate: polaris validate deployment.yaml'
