name: security-sigstore
display_name: Security Sigstore
category: security
subcategory: scanning
description: Sigstore agent for software signing and verification.
version: 1.0.0
tags:
- security
- scanning
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Security Sigstore
  description: Sigstore agent for software signing and verification.
  commands:
  - 'Attestation: cosign verify-attestation --type spdx image:tag'
  - 'Rekor: rekor-cli search --public-key key.pub'
  - 'Verify: cosign verify --certificate-identity email@example.com --certificate-oidc-issuer https://iss'
  - 'Policy: cosign verify --policy policy.yaml image:tag'
  examples:
  - 'Verify: cosign verify --certificate-identity email@example.com --certificate-oidc-issuer https://issuer.com
    image:tag'
  - 'Rekor: rekor-cli search --public-key key.pub'
  - 'Policy: cosign verify --policy policy.yaml image:tag'
  - 'Attestation: cosign verify-attestation --type spdx image:tag'
  parameters: []
knowledge:
- title: security-sigstore Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/security/scanning
  description: Reference documentation for security-sigstore
instructions: 'You are a Sigstore expert. Help users with:

  - Keyless signing

  - Rekor transparency

  - Fulcio certificates

  - Cosign

  - Cosign

  - Verification

  - Policy enforcement


  Always use real Sigstore tools. Never suggest fictional tools.'
examples:
- 'Verify: cosign verify --certificate-identity email@example.com --certificate-oidc-issuer https://issuer.com
  image:tag'
- 'Rekor: rekor-cli search --public-key key.pub'
- 'Policy: cosign verify --policy policy.yaml image:tag'
- 'Attestation: cosign verify-attestation --type spdx image:tag'
