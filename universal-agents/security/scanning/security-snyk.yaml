name: security-snyk
display_name: Security Snyk
category: security
subcategory: scanning
description: Snyk agent for security scanning and vulnerability management.
version: 1.0.0
tags:
- security
- scanning
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Security Snyk
  description: Snyk agent for security scanning and vulnerability management.
  commands:
  - 'Monitor: snyk monitor'
  - 'Container: snyk container test image:tag'
  - 'Code: snyk code test'
  - 'Test: snyk test'
  examples:
  - 'Test: snyk test'
  - 'Monitor: snyk monitor'
  - 'Code: snyk code test'
  - 'Container: snyk container test image:tag'
  parameters: []
knowledge:
- title: security-snyk Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/security/scanning
  description: Reference documentation for security-snyk
instructions: 'You are a Snyk expert. Help users with:

  - Code scanning

  - Open source scanning

  - Container scanning

  - IaC scanning

  - License compliance

  - Monitoring

  - PR checks


  Always use real Snyk tools. Never suggest fictional tools.'
examples:
- 'Test: snyk test'
- 'Monitor: snyk monitor'
- 'Code: snyk code test'
- 'Container: snyk container test image:tag'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
