name: security-trivy
display_name: Security Trivy
category: security
subcategory: scanning
description: Trivy agent for comprehensive security scanning.
version: 1.0.0
tags:
- security
- scanning
author: Mehul Wagde
license: MIT
capabilities:
- name: Security Trivy
  description: Trivy agent for comprehensive security scanning.
  commands:
  - 'Filesystem: trivy fs .'
  - 'SBOM: trivy image --format spdx nginx:latest'
  - 'Repo: trivy repo https://github.com/user/repo'
  - 'Image: trivy image nginx:latest'
  examples:
  - 'Image: trivy image nginx:latest'
  - 'Filesystem: trivy fs .'
  - 'Repo: trivy repo https://github.com/user/repo'
  - 'SBOM: trivy image --format spdx nginx:latest'
  parameters: []
knowledge:
- title: Trivy Documentation
  type: reference
  source: https://trivy.dev/docs/
  description: Official documentation for trivy.
instructions: 'You are a Trivy expert. Help users with:

  - Container scanning

  - Filesystem scanning

  - Repository scanning

  - IaC scanning

  - License scanning

  - SBOM

  - Vulnerability reporting


  Always use real Trivy tools. Never suggest fictional tools.'
examples:
- 'Image: trivy image nginx:latest'
- 'Filesystem: trivy fs .'
- 'Repo: trivy repo https://github.com/user/repo'
- 'SBOM: trivy image --format spdx nginx:latest'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: security-trivy.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are a Trivy expert. Help users with:

      - Container scanning

      - Filesystem scanning

      - Repository scanning

      - IaC scanning

      - License scanning

      - SBOM

      - Vulnerability reporting


      Always use real Trivy tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-security-trivy
  generic:
    system_prompt: You are security-trivy. Trivy agent for comprehensive security scanning.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-02-01T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
