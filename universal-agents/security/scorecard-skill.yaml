name: scorecard
display_name: scorecard
category: security
subcategory: general
description: Evaluates open-source project health and supply-chain risk with OSSF Scorecard, checking
  CI, code review, and dependency practices.
version: 2.0.0
tags:
- security
author: Mehul Wagde
license: MIT
prerequisites:
- scorecard
capabilities:
- name: repo-assessment
  description: Assess repositories locally or on GitHub.
  commands:
  - scorecard --repo github.com/org/repo
  - scorecard --local .
  - scorecard --repo github.com/org/repo --checks Code-Review,Branch-Protection
  - scorecard --repo github.com/org/repo --show-details
  - scorecard --repo github.com/org/repo --format json
  examples:
  - scorecard --repo github.com/kubernetes/kubernetes
  - scorecard --local .
  - scorecard --repo github.com/org/repo --show-details
  parameters:
  - name: repo
    type: string
    description: GitHub repository in owner/name form
  - name: checks
    type: array
    description: 'Checks to run: Code-Review, Branch-Protection, Signed-Releases, etc.'
  - name: format
    type: string
    description: 'Output: default, json, sarif'
- name: dependency-assessment
  description: Score package dependencies for supply-chain risk.
  commands:
  - scorecard --npm=lodash
  - scorecard --pypi=requests
  - scorecard --npm=express --format json
  - scorecard --local ./node_modules/express
  examples:
  - scorecard --npm=express
  - scorecard --pypi=requests
  - scorecard --npm=lodash --show-details
  parameters:
  - name: package
    type: string
    description: Package name for npm or pypi scoring
  - default: json
    description: 'Output format for package scoring: json, csv, sarif, sonar.'
    name: format
    type: string
knowledge:
- title: OSSF Scorecard GitHub
  type: documentation
  source: https://github.com/ossf/scorecard
  description: Checks, scoring model, and CLI usage
- title: OpenSSF Scorecard Site
  type: documentation
  source: https://securityscorecards.dev/
  description: Project overview and check documentation
instructions: '# OSSF Scorecard


  Automated supply-chain risk scoring for open-source projects and dependencies.


  ## What This Skill Does


  - Scores repos on branch protection, code review, CI, and signing

  - Assesses npm/pypi packages before adoption

  - Reports per-check evidence and remediation guidance

  - Integrates into dependency-review workflows via SARIF


  ## When to Use


  - Vetting a third-party dependency for production use

  - Auditing your own repo''s security posture

  - Supply-chain due diligence reports


  ## Real Commands


  ```bash

  # Assess a repository

  scorecard --repo github.com/org/repo

  scorecard --repo github.com/org/repo --show-details


  # Local directory

  scorecard --local .


  # Targeted checks

  scorecard --repo github.com/org/repo --checks Code-Review,Branch-Protection


  # Packages

  scorecard --npm=express

  scorecard --pypi=requests


  # Machine-readable

  scorecard --repo github.com/org/repo --format json

  ```


  ## Reading Scores


  - 0-4: critical gaps (no CI, no review, no signing)

  - 5-7: partial hygiene (some automation, gaps in release processes)

  - 8-10: strong practices (protected branches, signed releases, fuzzing)


  ## Best Practices


  - Gate dependency adoption on a minimum score (e.g. >= 6)

  - Re-run scorecard quarterly on critical dependencies

  - Fix the highest-weight checks first: Branch-Protection and Code-Review

  - Combine with Dependabot alerts and SBOMs for the full picture

  - Run scorecard on your own repos in CI and track the trend'
examples:
- input: Is library X safe to use?
  output: Agent runs scorecard --npm=X --show-details and summarizes the score with the weakest checks
    and remediation suggestions.
- input: How does my repo score?
  output: Agent runs scorecard --repo github.com/org/repo --format json, maps failures to concrete fixes,
    and prioritizes branch protection.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: scorecard.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-scorecard
  generic:
    system_prompt: 'Your lane is scorecard. You do it through repo-assessment: Assess repositories locally
      or on GitHub. The commands are real, e.g. `scorecard --repo github.com/org/repo`. You work hands-on
      and only report outcomes you have observed.'
    available_tools:
    - bash
    - read
    - write
    - edit
