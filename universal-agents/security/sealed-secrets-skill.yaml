name: sealed-secrets-security
display_name: sealed-secrets-security
category: security
subcategory: general
description: Encrypts Kubernetes Secrets into SealedSecrets so they can be stored in Git and decrypted
  only by the in-cluster controller.
version: 2.0.0
tags:
- security
author: Mehul Wagde
license: MIT
prerequisites:
- helm
- kubectl
- kubeseal
capabilities:
- name: kubeseal-sealing
  description: Seal secrets with kubeseal and manage scopes.
  commands:
  - kubeseal --format yaml demo-secret-yaml sealed-secret.yaml
  - kubeseal --scope cluster-wide -f secret.yaml
  - kubeseal --scope strict -f secret.yaml
  - kubeseal --format json -f secret.yaml -o sealed.json
  - kubeseal --re-encrypt < sealed-secret.yaml
  examples:
  - kubeseal --format yaml demo-secret-yaml sealed-secret.yaml
  - kubeseal --scope cluster-wide -f secret.yaml
  - kubeseal --re-encrypt demo-sealed-yaml re-sealed.yaml
  parameters:
  - name: scope
    type: string
    description: 'Sealing scope: strict, namespace-wide, cluster-wide'
  - name: format
    type: string
    description: 'Output format: yaml or json'
- name: controller-management
  description: Install the controller and inspect sealed/decrypted secrets.
  commands:
  - helm repo add sealed-secrets https://bitnami-labs.github.io/sealed-secrets
  - helm install sealed-secrets sealed-secrets/sealed-secrets -n kube-system
  - kubectl get sealedsecrets -A
  - kubectl get secrets -l sealed-secrets.bitnami.com/namespace=default
  - kubeseal --fetch-cert > pub-cert.pem
  examples:
  - helm install sealed-secrets sealed-secrets/sealed-secrets -n kube-system
  - kubectl get sealedsecrets -A
  - kubeseal --fetch-cert > pub-cert.pem
  parameters:
  - name: namespace
    type: string
    description: Namespace filter for sealed secrets
  - default: pub-cert.pem
    description: Where kubeseal --fetch-cert writes the controller public cert.
    name: certFile
    type: string
knowledge:
- title: Sealed Secrets GitHub
  type: documentation
  source: https://github.com/bitnami-labs/sealed-secrets
  description: kubeseal usage, scopes, and controller setup
- title: Sealed Secrets Helm Chart
  type: documentation
  source: https://artifacthub.io/packages/helm/sealed-secrets/sealed-secrets
  description: Chart installation and configuration
instructions: '# Sealed Secrets


  GitOps-friendly secret management: encrypt once, store anywhere.


  ## What This Skill Does


  - Seals Kubernetes Secrets with a cluster controller public cert

  - Supports strict, namespace-wide, and cluster-wide scopes

  - Lets you commit sealed manifests to Git safely

  - Re-encrypts sealed secrets when the controller key rotates


  ## When to Use


  - Secrets belong in GitOps repos (Flux/ArgoCD)

  - Unsealing by the controller should be the only decryption path

  - Team review of secret changes via PRs


  ## Real Commands


  ```bash

  # Install the controller

  helm repo add sealed-secrets https://bitnami-labs.github.io/sealed-secrets

  helm install sealed-secrets sealed-secrets/sealed-secrets -n kube-system


  # Seal

  kubeseal --format yaml < secret.yaml > sealed-secret.yaml

  kubeseal --scope cluster-wide -f secret.yaml

  kubeseal --scope strict -f secret.yaml


  # Re-encrypt after key rotation

  kubeseal --re-encrypt < sealed-secret.yaml


  # Verify

  kubectl get sealedsecrets -A

  kubectl get secrets -l sealed-secrets.bitnami.com/namespace=default

  ```


  ## Best Practices


  - Use namespace-wide or strict scope so a sealed secret can''t leak across namespaces

  - Only store the public cert in the repo/CI; private key lives in the cluster

  - Re-encrypt all sealed secrets when rotating controller keys

  - Review sealed manifests in PRs; the controller decrypts on apply

  - Never store plaintext Secret manifests in the same repo'
examples:
- input: Commit my DB password to GitOps safely
  output: Agent creates a Secret manifest, seals it with kubeseal --scope cluster-wide, and replaces the
    plaintext file with the sealed YAML.
- input: Our sealed secrets broke after a restore
  output: Agent re-encrypts with kubeseal --re-encrypt using the new controller cert and verifies the
    controller decrypts successfully.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: sealed-secrets-security.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-sealed-secrets
  generic:
    system_prompt: 'Your lane is sealed-secrets-security. You do it through kubeseal-sealing: Seal secrets
      with kubeseal and manage scopes. The commands are real, e.g. `kubeseal --format yaml < secret.yaml
      > sealed-secret.yaml`. You prefer the shortest safe path, and you reproduce failures before diagnosing
      them.'
    available_tools:
    - bash
    - read
    - write
    - edit
