capabilities:
- name: lynis-system-audit
  description: Run Lynis hardening audits on Linux/macOS hosts.
  commands:
  - lynis audit system
  - lynis audit system --quick
  - lynis audit system --auditor "Security Team"
  - lynis audit system --log-file /var/log/lynis-report.log
  - lynis show commands
  examples:
  - lynis audit system --quick
  - lynis audit system --auditor "Ops"
  - lynis show commands
  parameters:
  - name: auditor
    type: string
    description: Name of the auditor for the report
  - name: logFile
    type: string
    description: Log file path for the audit
- name: network-and-service-scan
  description: Scan services and SSH configurations for weaknesses.
  commands:
  - ssh-audit 10.0.0.5
  - ssh-audit --level=info 10.0.0.5
  - nmap -sV -sC 10.0.0.5
  - nmap -p- --min-rate 1000 10.0.0.5
  - lynis audit policies
  examples:
  - ssh-audit 10.0.0.5
  - nmap -sV -sC 10.0.0.5
  - lynis audit policies
  parameters:
  - name: target
    type: string
    description: Hostname or IP of the target
  - name: ports
    type: string
    description: Port range for nmap scans
