name: slsa-verifier
display_name: slsa-verifier
category: security
subcategory: general
description: Verifies SLSA provenance of artifacts and container images with slsa-verifier before deployment.
version: 2.0.0
tags:
- security
author: Kdesk-Catalog
license: MIT
prerequisites:
- slsa-verifier
capabilities:
- name: artifact-verification
  description: Verify binaries and archives against SLSA provenance.
  commands:
  - slsa-verifier verify-artifact dist.tgz --provenance-path dist.intoto.jsonl --source-uri github.com/org/repo
  - slsa-verifier verify-artifact dist.zip --provenance-path provenance.json --source-uri github.com/org/repo
    --source-tag v1.2.3
  - slsa-verifier verify-artifact --provenance-path p.json dist.tgz --source-uri github.com/org/repo --print-provenance
  - 'slsa-verifier verify-artifact --build-workflow-input "repository: org/repo" --provenance-path p.json
    dist.tgz'
  examples:
  - slsa-verifier verify-artifact dist.tgz --provenance-path dist.intoto.jsonl --source-uri github.com/org/repo
  - slsa-verifier verify-artifact dist.tgz --provenance-path p.json --source-uri github.com/org/repo --source-tag
    v1.0.0
  - slsa-verifier verify-artifact dist.tgz --provenance-path p.json --source-uri github.com/org/repo --print-provenance
  parameters:
  - name: provenancePath
    type: string
    description: Path to the intoto.jsonl provenance file
  - name: sourceUri
    type: string
    description: Expected source repo URI
  - name: sourceTag
    type: string
    description: Expected git tag of the build
- name: image-verification
  description: Verify container images with SLSA provenance.
  commands:
  - slsa-verifier verify-image ghcr.io/org/app:latest --source-uri github.com/org/repo
  - slsa-verifier verify-image ghcr.io/org/app:latest --source-uri github.com/org/repo --source-tag v1.2.3
  - slsa-verifier verify-image registry.example.com/app@sha256:abc123 --source-uri github.com/org/repo
  examples:
  - slsa-verifier verify-image ghcr.io/org/app:v1.0.0 --source-uri github.com/org/repo --source-tag v1.0.0
  - slsa-verifier verify-image ghcr.io/org/app:latest --source-uri github.com/org/repo
  parameters:
  - name: image
    type: string
    description: Container image reference with tag or digest
  - default: https://slsa.dev/provenance/v1
    description: Expected SLSA provenance attestation name.
    name: provenance
    type: string
knowledge:
- title: slsa-verifier GitHub
  type: documentation
  source: https://github.com/slsa-framework/slsa-verifier
  description: Usage, verification flags, and supported builders
- title: SLSA Specification
  type: documentation
  source: https://slsa.dev/spec/v1.0/
  description: Supply chain levels and provenance requirements
instructions: "# slsa-verifier\n\nVerify SLSA provenance before trusting artifacts and images.\n\n## What\
  \ This Skill Does\n\n- Verifies artifacts against intoto provenance generated by GitHub Actions\n- Verifies\
  \ OCI images with provenance attestations\n- Checks source URI, tag, and build workflow inputs\n- Prints\
  \ parsed provenance for review\n\n## When to Use\n\n- Deploy gates that require provenance (SLSA Level\
  \ 3)\n- Downloading third-party binaries built by public CI\n- Auditing that artifacts match their declared\
  \ build source\n\n## Real Commands\n\n```bash\n# Verify an artifact\nslsa-verifier verify-artifact dist.tgz\
  \ \\\n  --provenance-path dist.intoto.jsonl \\\n  --source-uri github.com/org/repo \\\n  --source-tag\
  \ v1.2.3\n\n# Verify an image\nslsa-verifier verify-image ghcr.io/org/app:v1.0.0 \\\n  --source-uri\
  \ github.com/org/repo --source-tag v1.0.0\n\n# Inspect the provenance\nslsa-verifier verify-artifact\
  \ --provenance-path p.json dist.tgz \\\n  --source-uri github.com/org/repo --print-provenance\n```\n\
  \n## Pipeline Placement\n\n```yaml\n- name: Verify SLSA provenance\n  run: |\n    slsa-verifier verify-artifact\
  \ dist.tgz \\\n      --provenance-path dist.intoto.jsonl \\\n      --source-uri github.com/org/repo\
  \ --source-tag $GITHUB_REF_NAME\n```\n\n## Best Practices\n\n- Pin --source-tag for release builds,\
  \ not just --source-uri\n- Verify in the deploy environment, not only in CI\n- Require provenance for\
  \ all artifacts produced by the build pipeline\n- Pair with cosign for signature verification of the\
  \ images themselves\n- Fail deploy if verification errors; never warn-and-continue"
examples:
- input: Verify our release tarball before deploying
  output: Agent runs slsa-verifier verify-artifact with the provenance path and source URI/tag, and reports
    PASS/FAIL with provenance details.
- input: Trust only images built from main
  output: Agent wires slsa-verifier verify-image with --source-uri and --source-tag into the deploy job,
    failing on mismatches.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: slsa-verifier.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-slsa-verifier
  generic:
    system_prompt: 'You are the slsa-verifier specialist. You do it through artifact-verification: Verify
      binaries and archives against SLSA provenance. The commands are real, e.g. `slsa-verifier verify-artifact
      dist.tgz --provenance-path dist.intoto.jsonl --source-uri...`. You prefer the shortest safe path,
      and you reproduce failures before diagnosing them.'
    available_tools:
    - bash
    - read
    - write
    - edit
