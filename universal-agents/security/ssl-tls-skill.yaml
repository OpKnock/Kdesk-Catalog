name: ssl-tls
display_name: ssl-tls
category: security
subcategory: general
description: Inspects, validates, and troubleshoots TLS certificates and handshakes with openssl, sslscan,
  and certbot.
version: 2.0.0
tags:
- security
author: Kdesk-Catalog
license: MIT
prerequisites:
- certbot
- nmap
- openssl
- sslscan
capabilities:
- name: certificate-inspection
  description: Inspect certificates, chains, and server handshakes.
  commands:
  - openssl s_client -connect example.com:443 -servername example.com -showcerts
  - openssl x509 -in cert.pem -text -noout
  - openssl x509 -in cert.pem -dates -issuer -subject
  - openssl s_client -connect example.com:443 -servername example.com 2>/dev/null | openssl x509 -noout
    -dates
  - openssl verify -CAfile ca-bundle.pem cert.pem
  examples:
  - openssl s_client -connect example.com:443 -servername example.com | openssl x509 -noout -subject -issuer
    -dates
  - openssl x509 -in cert.pem -text -noout | head -40
  - openssl verify -CAfile ca-bundle.pem server.pem
  parameters:
  - name: host
    type: string
    description: Hostname to connect to
  - name: port
    type: number
    description: Port, default 443
  - name: certFile
    type: string
    description: Path to a certificate file
- name: certificate-generation
  description: Generate CSRs, self-signed certs, and renew with certbot.
  commands:
  - openssl req -new -newkey rsa:2048 -nodes -keyout key.pem -out csr.pem
  - openssl req -x509 -newkey rsa:2048 -nodes -days 365 -keyout key.pem -out cert.pem
  - openssl x509 -req -in csr.pem -signkey key.pem -out cert.pem -days 365
  - certbot certonly --standalone -d example.com
  - certbot renew --dry-run
  examples:
  - openssl req -new -newkey rsa:2048 -nodes -keyout key.pem -out csr.pem
  - certbot certonly --standalone -d example.com
  - certbot renew --dry-run
  parameters:
  - name: keySize
    type: number
    description: RSA key size, e.g. 2048 or 4096
  - name: days
    type: number
    description: Validity in days
- name: protocol-scanning
  description: Check TLS protocol and cipher support.
  commands:
  - sslscan example.com
  - sslscan --tls-min-version 1.2 example.com
  - openssl s_client -connect example.com:443 -tls1_2 -servername example.com
  - nmap --script ssl-enum-ciphers -p 443 example.com
  examples:
  - sslscan example.com
  - nmap --script ssl-enum-ciphers -p 443 example.com
  - openssl s_client -connect example.com:443 -tls1_3 -servername example.com
  parameters:
  - name: tlsVersion
    type: string
    description: 'TLS version to test: tls1_2, tls1_3'
  - default: '443'
    description: TCP port to scan for TLS.
    name: port
    type: integer
knowledge:
- title: OpenSSL Documentation
  type: documentation
  source: https://www.openssl.org/docs/
  description: s_client, x509, and req command references
- title: Let's Encrypt Certbot Docs
  type: documentation
  source: https://certbot.eff.org/docs/
  description: Certificate issuance and renewal workflows
- title: sslscan GitHub
  type: documentation
  source: https://github.com/rbsec/sslscan
  description: TLS protocol and cipher enumeration
instructions: '# SSL/TLS


  Inspect, validate, and troubleshoot TLS certificates and handshakes.


  ## What This Skill Does


  - Reads certificates and verifies chains with openssl

  - Tests live handshakes and ciphers against servers

  - Generates CSRs and self-signed certificates

  - Automates Let''s Encrypt issuance and renewal with certbot


  ## When to Use


  - A certificate fails validation or is about to expire

  - Checking which ciphers a server supports

  - Generating local test certificates


  ## Real Commands


  ```bash

  # Inspect a live cert

  openssl s_client -connect example.com:443 -servername example.com -showcerts

  openssl s_client -connect example.com:443 -servername example.com 2>/dev/null | openssl x509 -noout
  -dates


  # Local cert inspection

  openssl x509 -in cert.pem -text -noout

  openssl verify -CAfile ca-bundle.pem server.pem


  # Generate a CSR and self-signed cert

  openssl req -new -newkey rsa:2048 -nodes -keyout key.pem -out csr.pem

  openssl req -x509 -newkey rsa:2048 -nodes -days 365 -keyout key.pem -out cert.pem


  # Cipher support

  sslscan example.com

  nmap --script ssl-enum-ciphers -p 443 example.com


  # Let''s Encrypt

  certbot certonly --standalone -d example.com

  certbot renew --dry-run

  ```


  ## Best Practices


  - Verify expiry via monitoring; alerts 30 days before renewal

  - Serve full chain; verify with openssl verify -CAfile

  - Disable TLS 1.0/1.1 and weak ciphers

  - Test renewals with certbot renew --dry-run after config changes

  - Use key size 2048+ and pin via SRI/HSTS headers'
examples:
- input: Is my certificate about to expire?
  output: Agent connects with openssl s_client, extracts the dates, and if close to expiry runs certbot
    renew or reissues.
- input: Why does the browser complain about my chain?
  output: Agent fetches the server chain with -showcerts, verifies each link with openssl verify, and
    identifies the missing intermediate.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: ssl-tls.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-ssl-tls
  generic:
    system_prompt: 'Your lane is ssl-tls. You do it through certificate-inspection: Inspect certificates,
      chains, and server handshakes. The commands are real, e.g. `openssl s_client -connect example.com:443
      -servername example.com -showcerts`. You run and verify the real CLI commands before you claim anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
