name: tfsec
display_name: tfsec
category: security
subcategory: general
description: Scans Terraform configurations with tfsec's focused security checks, severity gating, and
  SARIF/JUnit output.
version: 2.0.0
tags:
- security
author: Mehul Wagde
license: MIT
prerequisites:
- tfsec
capabilities:
- name: tfsec-scan
  description: Scan directories and files with severity and check filters.
  commands:
  - tfsec .
  - tfsec ./modules
  - tfsec main.tf
  - tfsec . --minimum-severity CRITICAL
  - tfsec . --exclude-check AWS089
  examples:
  - tfsec .
  - tfsec ./modules --minimum-severity HIGH
  - tfsec . --exclude-check AWS089,AWS096
  parameters:
  - name: path
    type: string
    description: Directory or file to scan
  - name: minimumSeverity
    type: string
    description: 'Minimum severity: LOW, MEDIUM, HIGH, CRITICAL'
  - name: excludeCheck
    type: string
    description: Comma-separated check IDs to exclude
- name: reporting-and-config
  description: Emit CI reports and manage custom configuration.
  commands:
  - tfsec . --format sarif --out scan.sarif
  - tfsec . --format json --out results.json
  - tfsec . --config-file tfsec.yml
  - tfsec . --concise-output
  - tfsec . --no-colour --format junit --out junit.xml
  examples:
  - tfsec . --format sarif --out scan.sarif
  - tfsec . --config-file tfsec.yml
  - tfsec . --no-colour --format junit --out junit.xml
  parameters:
  - name: format
    type: string
    description: 'Output: standard, json, sarif, junit, csv, html'
  - name: out
    type: string
    description: Report output file
  - name: configFile
    type: string
    description: tfsec config YAML path
knowledge:
- title: tfsec GitHub
  type: documentation
  source: https://github.com/aquasecurity/tfsec
  description: Check catalog and CLI reference
- title: tfsec Documentation
  type: documentation
  source: https://aquasecurity.github.io/tfsec/
  description: Configuration, exclusions, and CI examples
instructions: "# tfsec\n\nTerraform-focused static security scanning.\n\n## What This Skill Does\n\n-\
  \ Scans Terraform and Terragrunt for known bad patterns\n- Filters by severity and excludes noisy checks\n\
  - Emits SARIF, JUnit, JSON, CSV, and HTML reports\n- Supports custom config for team policies\n\n##\
  \ When to Use\n\n- Terraform module CI gates\n- Pre-apply security review of plan code\n- Auditing existing\
  \ infrastructure repos\n\n## Real Commands\n\n```bash\n# Basic scans\ntfsec .\ntfsec ./modules\n\n#\
  \ Severity and exclusions\ntfsec . --minimum-severity HIGH\ntfsec . --exclude-check AWS089,AWS096\n\n\
  # Reports\ntfsec . --format sarif --out scan.sarif\ntfsec . --format json --out results.json\ntfsec\
  \ . --no-colour --format junit --out junit.xml\n\n# Custom config\ntfsec . --config-file tfsec.yml\n\
  ```\n\n## tfsec.yml\n\n```yaml\nminimum_severity: HIGH\nexclude:\n  - check: AWS089\n    paths:\n  \
  \    - modules/legacy/**\n```\n\n## Best Practices\n\n- Gate CI on HIGH+; keep CRITICAL as hard fail\n\
  - Exclude checks per path, not globally\n- Pair with plan-time tools for context-dependent findings\n\
  - Use SARIF for GitHub code scanning annotations\n- Keep tfsec.yml in the repo for team consistency"
examples:
- input: Scan my Terraform for high-severity issues
  output: Agent runs tfsec . --minimum-severity HIGH, lists failing checks with resource references, and
    proposes config fixes.
- input: Add tfsec SARIF to my pipeline
  output: Agent adds tfsec . --format sarif --out scan.sarif to CI and uploads the SARIF artifact for
    code scanning.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: tfsec.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-tfsec
  generic:
    system_prompt: 'You own tfsec end to end. You do it through tfsec-scan: Scan directories and files
      with severity and check filters. The commands are real, e.g. `tfsec .`. You prefer the shortest
      safe path, and you reproduce failures before diagnosing them.'
    available_tools:
    - bash
    - read
    - write
    - edit
created_at: '2025-10-24T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
