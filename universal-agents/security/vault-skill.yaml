name: vault
display_name: vault
category: security
subcategory: general
description: Manages secrets, policies, tokens, and dynamic credentials with HashiCorp Vault CLI and KV/transit
  secret engines.
version: 2.0.0
tags:
- security
author: Mehul Wagde
license: MIT
prerequisites:
- vault
capabilities:
- name: kv-secrets
  description: Store, read, and delete secrets in KV engines.
  commands:
  - vault kv put secret/myapp db_password="hunter2" db_user="app"
  - vault kv get secret/myapp
  - vault kv get -field=db_password secret/myapp
  - vault kv delete secret/myapp
  - vault kv list secret/
  - vault secrets enable -path=secret kv-v2
  examples:
  - vault kv put secret/myapp api_key=xyz
  - vault kv get -field=db_password secret/myapp
  - vault kv list secret/
  parameters:
  - name: path
    type: string
    description: Secret path, e.g. secret/myapp
  - name: field
    type: string
    description: Single field to read
- name: policies-and-tokens
  description: Author policies and create scoped tokens.
  commands:
  - vault policy write app-readonly - <<'EOF'
  - vault policy read app-readonly
  - vault token create -policy=app-readonly -ttl=1h
  - vault login -method=token
  - vault token lookup
  examples:
  - vault token create -policy=app-readonly -ttl=1h
  - vault login -method=token
  - vault policy read app-readonly
  parameters:
  - name: policy
    type: string
    description: Policy name
  - name: ttl
    type: string
    description: Token TTL, e.g. 1h
- name: dynamic-secrets
  description: Generate dynamic credentials for databases.
  commands:
  - vault secrets enable database
  - vault write database/config/postgres connection_url="postgresql://root:pass@localhost:5432/postgres"
  - vault read database/creds/readonly
  - vault list database/roles
  - vault lease renew database/creds/readonly/x
  examples:
  - vault read database/creds/readonly
  - vault list database/roles
  - vault write database/roles/readonly db_name=postgres
  parameters:
  - name: role
    type: string
    description: Database role name
  - name: lease
    type: string
    description: Lease ID to renew or revoke
- name: audit-and-ops
  description: Check server status and enable audit logs.
  commands:
  - vault status
  - vault audit enable file file_path=/var/log/vault-audit.log
  - vault audit list
  - vault unseal
  - vault operator init
  examples:
  - vault status
  - vault audit enable file file_path=/var/log/vault-audit.log
  - vault audit list
  parameters:
  - name: auditType
    type: string
    description: 'Audit backend: file, syslog, socket'
  - default: /var/log/vault-audit.log
    description: Log path for the file audit backend.
    name: filePath
    type: string
knowledge:
- title: Vault Documentation
  type: documentation
  source: https://developer.hashicorp.com/vault/docs
  description: CLI reference, secret engines, and policies
- title: Vault KV Engine
  type: documentation
  source: https://developer.hashicorp.com/vault/docs/secrets/kv/kv-v2
  description: KV v1/v2 usage and versioning
instructions: "# Vault\n\nCentralized secrets management with dynamic, revocable credentials.\n\n## What\
  \ This Skill Does\n\n- Stores and reads KV secrets with versioning\n- Writes and tests policies, creates\
  \ scoped tokens\n- Generates dynamic database credentials with leases\n- Enables audit logging and manages\
  \ unsealing\n\n## When to Use\n\n- Centralizing application secrets\n- Issuing short-lived credentials\
  \ instead of static keys\n- Auditing secret access\n\n## Real Commands\n\n```bash\n# KV v2\nvault secrets\
  \ enable -path=secret kv-v2\nvault kv put secret/myapp db_password=\"hunter2\"\nvault kv get -field=db_password\
  \ secret/myapp\nvault kv list secret/\n\n# Policies and tokens\nvault policy write app-readonly - <<'EOF'\n\
  path \"secret/data/myapp\" { capabilities = [\"read\"] }\nEOF\nvault token create -policy=app-readonly\
  \ -ttl=1h\nvault login -method=token\n\n# Dynamic DB credentials\nvault secrets enable database\nvault\
  \ write database/roles/readonly db_name=postgres \\\n  creation_statements=\"SELECT username FROM pg_user\"\
  \ \\\n  default_ttl=1h max_ttl=24h\nvault read database/creds/readonly\n\n# Audit\nvault audit enable\
  \ file file_path=/var/log/vault-audit.log\nvault status\n```\n\n## Best Practices\n\n- Use dynamic credentials\
  \ with short TTLs over static secrets\n- Scope tokens with least-privilege policies\n- Enable audit\
  \ logging in production\n- Rotate the root token after init and store unseal keys offline\n- Never commit\
  \ Vault tokens; inject via agent or sidecar"
examples:
- input: Store the app DB credentials centrally
  output: Agent enables kv-v2, puts the credentials at secret/myapp, and shows how the app reads them
    with a scoped token.
- input: Give CI short-lived DB access
  output: Agent configures the database engine with a role, creates a CI policy, and shows vault read
    database/creds/readonly with lease TTL.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: vault.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-vault
  generic:
    system_prompt: 'You take the vault seat. You do it through kv-secrets: Store, read, and delete secrets
      in KV engines. The commands are real, e.g. `vault kv put secret/myapp db_password=hunter2 db_user=app`.
      You prefer the shortest safe path, and you reproduce failures before diagnosing them.'
    available_tools:
    - bash
    - read
    - write
    - edit
