name: incident
display_name: Incident
category: sre
subcategory: general
description: Coordinates incident response with PagerDuty, incident.io, and status pages, managing acknowledgements,
  escalations, and postmortems.
version: 2.0.0
tags:
- incident
author: Kdesk-Catalog
license: MIT
prerequisites:
- incidentio
capabilities:
- name: pagerduty-management
  description: List, acknowledge, and resolve PagerDuty incidents.
  commands:
  - pd incident list --status trigger
  - pd incident show INCIDENT_ID
  - pd incident update INCIDENT_ID --status acknowledged
  - pd incident update INCIDENT_ID --status resolved
  - pd team list
  examples:
  - pd incident list --status trigger
  - pd incident update INCIDENT_ID --status acknowledged
  - pd incident update INCIDENT_ID --status resolved
  parameters:
  - name: status
    type: string
    description: 'Filter: trigger, acknowledged, resolved'
  - name: incidentId
    type: string
    description: PagerDuty incident ID
- name: incidentio-declarations
  description: Declare and manage incidents with incident.io CLI.
  commands:
  - incidentio incident declare --summary 'API latency spike' --severity critical
  - incidentio incident list --status open
  - incidentio incident update INCIDENT_ID --status mitigating
  - incidentio incident note add INCIDENT_ID --text 'Rolled back v1.2.3'
  - incidentio incident list --severity major
  examples:
  - incidentio incident declare --summary 'DB CPU at 100%' --severity major
  - incidentio incident update INCIDENT_ID --status resolved
  - incidentio incident note add INCIDENT_ID --text 'Root cause identified'
  parameters:
  - name: summary
    type: string
    description: Incident summary
  - name: severity
    type: string
    description: 'Severity: critical, major, minor'
  - name: status
    type: string
    description: 'Status: open, mitigating, monitoring, resolved'
- name: status-pages
  description: Post status updates and component maintenance.
  commands:
  - 'curl -s -X POST https://api.statuspage.io/v1/pages/PAGE_ID/incidents -d ''{"incident":{"name":"...","status":"investigating"}}''
    -H "Authorization: OAuth $KEY"'
  - 'curl -s https://api.statuspage.io/v1/pages/PAGE_ID/incidents -H "Authorization: OAuth $KEY" | jq
    .'
  - 'curl -s -X POST https://api.statuspage.io/v1/pages/PAGE_ID/components -d ''{"component":{"name":"API"}}''
    -H "Authorization: OAuth $KEY" | jq .'
  examples:
  - 'curl -s https://api.statuspage.io/v1/pages/PAGE_ID/incidents -H "Authorization: OAuth $KEY" | jq
    .'
  - 'curl -s -X PATCH https://api.statuspage.io/v1/pages/PAGE_ID/incidents/ID -d ''{"incident":{"status":"monitoring"}}''
    -H "Authorization: OAuth $KEY" | jq .'
  parameters:
  - name: pageId
    type: string
    description: StatusPage page ID
  - name: apiKey
    type: string
    description: StatusPage OAuth API key
knowledge:
- title: PagerDuty API Documentation
  type: documentation
  source: https://developer.pagerduty.com/docs/
  description: Incident and escalation management APIs
- title: incident.io Documentation
  type: documentation
  source: https://incident.io/docs/
  description: Incident lifecycle and CLI commands
- title: Atlassian Statuspage API
  type: documentation
  source: https://developer.atlassian.com/cloud/statuspage/rest/
  description: Incident and component management REST API
instructions: "# Incident Response\n\nOwn the incident lifecycle: detect, acknowledge, mitigate, communicate,\
  \ and learn.\n\n## What This Skill Does\n\n- Triages incidents from PagerDuty and incident.io\n- Moves\
  \ incidents through acknowledge/mitigate/resolve states\n- Posts status page updates for external communication\n\
  - Captures notes and timelines for postmortems\n\n## When to Use\n\n- An alert page triggers and needs\
  \ triage\n- Coordinating on-call response\n- Publishing communication during a major outage\n\n## Real\
  \ Commands\n\n```bash\n# PagerDuty\npd incident list --status trigger\npd incident show INCIDENT_ID\n\
  pd incident update INCIDENT_ID --status acknowledged\npd incident update INCIDENT_ID --status resolved\n\
  \n# incident.io\nincidentio incident declare --summary 'API latency spike' --severity critical\nincidentio\
  \ incident list --status open\nincidentio incident note add INCIDENT_ID --text 'Rolled back v1.2.3'\n\
  \n# Statuspage\ncurl -s -X POST https://api.statuspage.io/v1/pages/PAGE_ID/incidents \\\n  -d '{\"incident\"\
  :{\"name\":\"Degraded API\",\"status\":\"investigating\"}}' \\\n  -H \"Authorization: OAuth $KEY\" |\
  \ jq .\n```\n\n## Response Playbook\n\n1. Acknowledge the alert immediately (pd incident update --status\
  \ acknowledged)\n2. Declare severity and assemble responders\n3. Mitigate first (rollback, scale, isolate),\
  \ investigate second\n4. Update status page every 30 minutes during active incidents\n5. Resolve only\
  \ after monitoring confirms stability\n6. Schedule the postmortem within 48 hours\n\n## Best Practices\n\
  \n- Acknowledge fast; automate acks for known noise\n- Keep communication in one thread (incident channel\
  \ + notes)\n- Never resolve while symptoms persist\n- Track action items from postmortems to completion\n\
  - Rehearse runbooks during low-severity incidents"
examples:
- input: I got paged for high API error rate
  output: Agent lists triggering incidents, acknowledges the one matching the alert, declares it in incident.io,
    and checks the status page for updates.
- input: Publish an outage status
  output: Agent creates an investigating incident on the status page, posts a monitoring update when stabilized,
    and resolves it after verification.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: incident.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-incident
  generic:
    system_prompt: 'Your lane is Incident. You do it through pagerduty-management: List, acknowledge,
      and resolve PagerDuty incidents. The commands are real, e.g. `pd incident list --status trigger`.
      You answer with exact commands, not abstractions, and flag anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
