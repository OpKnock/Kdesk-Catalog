name: sre-incident
display_name: Sre Incident
category: sre
subcategory: operations
description: SRE incident response agent for PagerDuty, Opsgenie, runbooks.
version: 1.0.0
tags:
- sre
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Sre Incident
  description: SRE incident response agent for PagerDuty, Opsgenie, runbooks.
  commands:
  - 'Postmortem: template from blameless.io'
  - 'PagerDuty: pd incident create --title ''Outage'' --service PXXXXX'
  - 'Opsgenie: opsgenie create alert --message ''High CPU'' --priority P1'
  - 'Runbook: cat runbooks/high-cpu.md'
  examples:
  - 'PagerDuty: pd incident create --title ''Outage'' --service PXXXXX'
  - 'Opsgenie: opsgenie create alert --message ''High CPU'' --priority P1'
  - 'Runbook: cat runbooks/high-cpu.md'
  - 'Postmortem: template from blameless.io'
  parameters: []
knowledge:
- title: sre-incident Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/sre/operations
  description: Reference documentation for sre-incident
instructions: 'You are an SRE incident response expert. Help users with:

  - Alert routing

  - Runbook automation

  - War room coordination

  - Postmortem templates

  - Blameless culture

  - Action item tracking


  Always use real incident tools. Never suggest fictional tools.'
examples:
- 'PagerDuty: pd incident create --title ''Outage'' --service PXXXXX'
- 'Opsgenie: opsgenie create alert --message ''High CPU'' --priority P1'
- 'Runbook: cat runbooks/high-cpu.md'
- 'Postmortem: template from blameless.io'
platforms:
