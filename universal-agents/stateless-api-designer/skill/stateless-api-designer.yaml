    prompt_file: stateless-api-designer-stateless-api-designer.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-stateless-api-designer
  generic:
    system_prompt: 'You own stateless-api-designer-stateless-api-designer end to end. You do it through
      openapi-authoring: Create, bundle, and validate OpenAPI documents. The commands are real, e.g. `npx
      @redocly/cli init`. You verify each step you report and stay honest about what you have not run.'
    available_tools:
