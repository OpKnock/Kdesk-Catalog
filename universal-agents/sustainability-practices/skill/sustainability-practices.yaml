name: sustainability-practices
version: 2.0.0
type: skill
category: environment
description: Measures and reduces software carbon footprint with Cloud Carbon Footprint, InfraCost, and
  workload efficiency analysis.
keywords:
- sustainability
- carbon-footprint
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: sustainability-practices.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-sustainability-practices
  generic:
    system_prompt: 'You are the sustainability-practices specialist. You do it through carbon-measurement:
      Estimate cloud carbon emissions and energy usage. The commands are real, e.g. `ccf estimate --configfile
      ccf.config.json --period 2024-01-01 2024-01-31`. You answer with exact commands, not abstractions,
      and flag anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: carbon-measurement
  description: Estimate cloud carbon emissions and energy usage.
  commands:
  - ccf estimate --configfile ccf.config.json --period 2024-01-01 2024-01-31
  - ccf report --configfile ccf.config.json
  - ccf footprint --configfile ccf.config.json
  - ccf recommendations --configfile ccf.config.json
  examples:
  - ccf estimate --configfile ccf.config.json --period 2024-01-01 2024-01-31
  - ccf report --configfile ccf.config.json
  - ccf recommendations --configfile ccf.config.json
  parameters:
  - name: configfile
    type: string
    description: Cloud Carbon Footprint config file
  - name: period
    type: string
    description: Date range for estimation
- name: cost-efficiency
  description: Align efficiency with cost using InfraCost and cloud queries.
  commands:
  - infracost breakdown --path .
  - infracost diff --path . --compare-to=infracost-base.json
  - infracost output --format html --path infracost-base.json
  - infracost breakdown --path . --usage-file infracost-usage.yml
  examples:
  - infracost breakdown --path .
  - infracost diff --path . --compare-to=infracost-base.json
  - infracost output --format html --path infracost-base.json
  parameters:
  - name: path
    type: string
    description: Terraform path to analyze
  - name: format
    type: string
    description: 'Output format: html, json, table'
- name: workload-efficiency
  description: Analyze cluster utilization and right-sizing opportunities.
  commands:
  - kubectl top nodes
  - kubectl top pods -A
  - kubectl get hpa -A
  - kubectl get nodes -o custom-columns=NAME:.metadata.name,CPU:.status.allocatable.cpu,MEM:.status.allocatable.memory
  examples:
  - kubectl top nodes
  - kubectl top pods -A
  - kubectl get hpa -A
  parameters:
  - name: namespace
    type: string
    description: Namespace scope for resource metrics
  - default: wide
    description: 'Output format for kubectl top metrics: wide, json.'
    name: format
    type: string
prerequisites:
- green-software
- cloud-carbon
- energy-api
- prometheus
tools:
- green-software
- cloud-carbon
- energy-api
- prometheus
- grafana
examples:
- input: How much carbon does our AWS footprint produce?
  output: Agent runs ccf estimate with the config for the month and breaks down emissions by service and
    account.
- input: Reduce our cluster's energy use
  output: Agent analyzes kubectl top nodes and hpa status, right-sizes requests, and shows the projected
    reduction with infracost.
instructions: '# Sustainability Practices


  Measure and reduce the environmental impact of software.


  ## What This Skill Does


  - Estimates cloud carbon emissions by service and period

  - Identifies idle and oversized workloads

  - Aligns efficiency work with cost data

  - Promotes right-sizing and autoscaling practices


  ## When to Use


  - Reporting software carbon footprint

  - Reducing cloud waste and emissions

  - Prioritizing efficiency investments


  ## Real Commands


  ```bash

  # Carbon estimation

  ccf estimate --configfile ccf.config.json --period 2024-01-01 2024-01-31

  ccf recommendations --configfile ccf.config.json


  # Cost-efficiency

  infracost breakdown --path .

  infracost diff --path . --compare-to=infracost-base.json


  # Utilization

  kubectl top nodes

  kubectl top pods -A

  kubectl get hpa -A

  kubectl get nodes -o custom-columns=NAME:.metadata.name,CPU:.status.allocatable.cpu

  ```


  ## Reduction Checklist


  - Right-size pods and instances to measured utilization

  - Autoscale everything that can be scaled to zero

  - Prefer ARM and energy-efficient instance families

  - Cache aggressively to reduce compute demand

  - Offload batch work to off-peak hours


  ## Best Practices


  - Measure first: baseline carbon before optimizing

  - Pair carbon savings with cost savings for buy-in

  - Monitor utilization continuously, not just at launch

  - Document efficiency budgets alongside SLIs

  - Revisit instance families when prices and efficiency change'
display_name: sustainability-practices
knowledge:
- title: Cloud Carbon Footprint
  type: documentation
  source: https://github.com/cloud-carbon-footprint/cloud-carbon-footprint
  description: Carbon estimation CLI and config
- title: InfraCost Documentation
  type: documentation
  source: https://www.infracost.io/docs/
  description: Infrastructure cost and efficiency analysis
- title: Green Software Foundation
  type: documentation
  source: https://greensoftware.foundation/
  description: Green software patterns and principles
