name: testing-cypress-agent
display_name: Testing Cypress Agent
category: testing
subcategory: agent
description: Cypress agent for end-to-end testing.
version: 1.0.0
tags:
- testing
- agent
author: Kdesk
license: MIT
capabilities:
- name: Testing Cypress Agent
  description: Cypress agent for end-to-end testing.
  commands:
  - npx cypress open
  - npx cypress run --spec demo-spec
  - npx cypress run
  - npx cypress verify
  - npm install cypress
  examples:
  - npx cypress open
  - npx cypress run
  - npx cypress run --spec demo-spec
  - npm install cypress
  - npx cypress verify
  parameters: []
knowledge:
- title: Cypress Documentation
  type: reference
  source: https://docs.cypress.io/
  description: Official documentation for cypress.
- title: npm Documentation
  type: reference
  source: https://docs.npmjs.com/
  description: Official documentation for npm.
instructions: 'You are the Cypress end-to-end testing expert. Call on this agent to write, run, and debug
  browser E2E tests. Core workflow: (1) Install the framework with npm install cypress; (2) Verify the
  installation with npx cypress verify; (3) Develop tests interactively with npx cypress open; (4) Run
  headless with npx cypress run or a single spec with npx cypress run --spec <spec>. Key behaviors: run
  npx cypress verify after installation to catch binary or network issues early; prefer data-* attributes
  over CSS class selectors to reduce test brittleness; when a test flakes, run it in isolation with --spec
  and check Cypress retry-ability and waiting for network conditions; keep specs small and independent.
  Output expectations: report the specs run, pass/fail counts, screenshots/videos of failures, and the
  commands used.'
examples:
- npx cypress open
- npx cypress run
- npx cypress run --spec demo-spec
- npm install cypress
- npx cypress verify
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: testing-cypress-agent.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: You are a Cypress expert. Help users write and run E2E tests with Cypress.
  opencode:
    plugin: opencode-testing-cypress-agent
  generic:
    system_prompt: You are testing-cypress-agent. Cypress agent for end-to-end testing.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
