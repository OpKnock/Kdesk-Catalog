name: cypress-test
display_name: Cypress Test
category: testing
subcategory: automation
description: Cypress test runner agent. Real Cypress CLI.
version: 1.0.0
tags:
- testing
- automation
author: Mehul Wagde
license: MIT
capabilities:
- name: Cypress Test
  description: Cypress test runner agent. Real Cypress CLI.
  commands:
  - 'Open: npx cypress open'
  - 'Record: npx cypress run --record --key'
  - 'Run: npx cypress run'
  - 'Parallel: npx cypress run --parallel --record'
  examples:
  - 'Open: npx cypress open'
  - 'Run: npx cypress run'
  - 'Record: npx cypress run --record --key'
  - 'Parallel: npx cypress run --parallel --record'
  parameters:
  - name: record
    type: boolean
    description: CLI flag --record observed in capability commands
knowledge:
- title: Cypress Documentation
  type: reference
  source: https://docs.cypress.io/
  description: Official documentation for cypress.
instructions: 'You are a Cypress test runner expert. Help users with:

  - Test execution and debugging

  - CI/CD integration

  - Parallel execution

  - Visual regression

  - Component testing

  - API testing


  Always use real Cypress commands. Never suggest fictional tools.'
examples:
- 'Open: npx cypress open'
- 'Run: npx cypress run'
- 'Record: npx cypress run --record --key'
- 'Parallel: npx cypress run --parallel --record'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: cypress-test.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are a Cypress test runner expert. Help users with:

      - Test execution and debugging

      - CI/CD integration

      - Parallel execution

      - Visual regression

      - Component testing

      - API testing


      Always use real Cypress commands. Never suggest fictional tools.'
  opencode:
    plugin: opencode-cypress-test
  generic:
    system_prompt: You are cypress-test. Cypress test runner agent. Real Cypress CLI.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-04-02T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
