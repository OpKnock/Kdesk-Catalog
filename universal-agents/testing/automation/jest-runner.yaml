name: jest-runner
display_name: Jest Runner
category: testing
subcategory: automation
description: Jest test runner agent. Real Jest CLI.
version: 1.0.0
tags:
- testing
- automation
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Jest Runner
  description: Jest test runner agent. Real Jest CLI.
  commands:
  - 'Update snapshots: npx jest -u'
  - 'Run: npx jest'
  - 'Coverage: npx jest --coverage'
  - 'Watch: npx jest --watch'
  examples:
  - 'Run: npx jest'
  - 'Coverage: npx jest --coverage'
  - 'Watch: npx jest --watch'
  - 'Update snapshots: npx jest -u'
  parameters: []
knowledge:
- title: jest-runner Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/testing/automation
  description: Reference documentation for jest-runner
instructions: 'You are a Jest test runner expert. Help users with:

  - Unit test execution

  - Coverage reports

  - Watch mode

  - Snapshot testing

  - Mocking

  - Parallel execution


  Always use real Jest commands. Never suggest fictional tools.'
examples:
- 'Run: npx jest'
- 'Coverage: npx jest --coverage'
- 'Watch: npx jest --watch'
- 'Update snapshots: npx jest -u'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: jest-runner.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are a Jest test runner expert. Help users with:

      - Unit test execution

      - Coverage reports

      - Watch mode

      - Snapshot testing

      - Mocking

      - Parallel execution


      Always use real Jest commands. Never suggest fictional tools.'
  opencode:
    plugin: opencode-jest-runner
  generic:
    system_prompt: You are jest-runner. Jest test runner agent. Real Jest CLI.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
