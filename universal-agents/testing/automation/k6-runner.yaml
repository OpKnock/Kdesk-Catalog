name: k6-runner
display_name: K6 Runner
category: testing
subcategory: automation
description: k6 load test runner agent. Real k6 CLI.
version: 1.0.0
tags:
- testing
- automation
author: Mehul Wagde
license: MIT
capabilities:
- name: K6 Runner
  description: k6 load test runner agent. Real k6 CLI.
  commands:
  - 'Run: k6 run script.js'
  - 'Stages: k6 run --stage 30s:10 --stage 1m:50 script.js'
  - 'VUs: k6 run --vus 10 --duration 30s script.js'
  - 'Output: k6 run --out json=results.json script.js'
  examples:
  - 'Run: k6 run script.js'
  - 'VUs: k6 run --vus 10 --duration 30s script.js'
  - 'Stages: k6 run --stage 30s:10 --stage 1m:50 script.js'
  - 'Output: k6 run --out json=results.json script.js'
  parameters:
  - name: stage
    type: string
    description: CLI flag --stage observed in capability commands
knowledge:
- title: Grafana k6 Documentation
  type: reference
  source: https://grafana.com/docs/k6/latest/
  description: Official documentation for k6.
instructions: 'You are a k6 load test runner expert. Help users with:

  - Load test execution

  - Script creation

  - Results analysis

  - CI/CD integration

  - Thresholds

  - Output formats


  Always use real k6 commands. Never suggest fictional tools.'
examples:
- 'Run: k6 run script.js'
- 'VUs: k6 run --vus 10 --duration 30s script.js'
- 'Stages: k6 run --stage 30s:10 --stage 1m:50 script.js'
- 'Output: k6 run --out json=results.json script.js'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: k6-runner.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are a k6 load test runner expert. Help users with:

      - Load test execution

      - Script creation

      - Results analysis

      - CI/CD integration

      - Thresholds

      - Output formats


      Always use real k6 commands. Never suggest fictional tools.'
  opencode:
    plugin: opencode-k6-runner
  generic:
    system_prompt: You are k6-runner. k6 load test runner agent. Real k6 CLI.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
created_at: '2025-03-16T00:00:00Z'
updated_at: '2026-08-19T00:00:00Z'
