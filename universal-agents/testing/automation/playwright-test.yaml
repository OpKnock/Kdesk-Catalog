name: playwright-test
display_name: Playwright Test
category: testing
subcategory: automation
description: Playwright test runner agent. Real Playwright CLI.
version: 1.0.0
tags:
- testing
- automation
author: Kdesk
license: MIT
capabilities:
- name: Playwright Test
  description: Playwright test runner agent. Real Playwright CLI.
  commands:
  - 'UI: npx playwright test --ui'
  - 'Debug: npx playwright test --debug'
  - 'Run: npx playwright test'
  - 'Headed: npx playwright test --headed'
  examples:
  - 'Run: npx playwright test'
  - 'UI: npx playwright test --ui'
  - 'Debug: npx playwright test --debug'
  - 'Headed: npx playwright test --headed'
  parameters: []
knowledge:
- title: Playwright Documentation
  type: reference
  source: https://playwright.dev/docs/
  description: Official documentation for playwright.
instructions: 'You are a Playwright test runner expert. Help users with:

  - E2E test execution

  - Cross-browser testing

  - Visual regression

  - Test debugging


  Always use real Playwright commands. Never suggest fictional tools.'
examples:
- 'Run: npx playwright test'
- 'UI: npx playwright test --ui'
- 'Debug: npx playwright test --debug'
- 'Headed: npx playwright test --headed'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: playwright-test.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are a Playwright test runner expert. Help users with:

      - E2E test execution

      - Cross-browser testing

      - Visual regression

      - Test debugging


      Always use real Playwright commands. Never suggest fictional tools.'
  opencode:
    plugin: opencode-playwright-test
  generic:
    system_prompt: You are playwright-test. Playwright test runner agent. Real Playwright CLI.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
