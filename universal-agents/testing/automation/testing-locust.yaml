name: testing-locust
display_name: Testing Locust
category: testing
subcategory: automation
description: Locust agent for load testing with Python.
version: 1.0.0
tags:
- testing
- automation
author: Kdesk-Catalog
license: MIT
capabilities:
- name: Testing Locust
  description: Locust agent for load testing with Python.
  commands:
  - 'Distributed: locust -f locustfile.py --master'
  - 'Headless: locust -f locustfile.py --headless -u 100 -r 10'
  - 'Worker: locust -f locustfile.py --worker --master-host=192.168.1.1'
  - 'Run: locust -f locustfile.py'
  examples:
  - 'Run: locust -f locustfile.py'
  - 'Headless: locust -f locustfile.py --headless -u 100 -r 10'
  - 'Distributed: locust -f locustfile.py --master'
  - 'Worker: locust -f locustfile.py --worker --master-host=192.168.1.1'
  parameters:
  - name: f
    type: string
    description: CLI flag --f observed in capability commands
knowledge:
- title: testing-locust Documentation
  type: reference
  source: https://github.com/kdesk/agents/tree/main/agents/testing/automation
  description: Reference documentation for testing-locust
instructions: 'You are a Locust load testing expert. Help users with:

  - User simulation

  - Distributed testing

  - Web UI

  - Custom tasks

  - Shape loading

  - CSV output

  - Cloud execution


  Always use real Locust tools. Never suggest fictional tools.'
examples:
- 'Run: locust -f locustfile.py'
- 'Headless: locust -f locustfile.py --headless -u 100 -r 10'
- 'Distributed: locust -f locustfile.py --master'
- 'Worker: locust -f locustfile.py --worker --master-host=192.168.1.1'
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: testing-locust.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
    instructions: 'You are a Locust load testing expert. Help users with:

      - User simulation

      - Distributed testing

      - Web UI

      - Custom tasks

      - Shape loading

      - CSV output

      - Cloud execution


      Always use real Locust tools. Never suggest fictional tools.'
  opencode:
    plugin: opencode-testing-locust
  generic:
    system_prompt: You are testing-locust. Locust agent for load testing with Python.
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
