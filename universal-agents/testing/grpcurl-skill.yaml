name: grpcurl
display_name: grpcurl
category: testing
subcategory: general
description: Interacts with gRPC servers from the CLI with grpcurl, including reflection, protobuf imports,
  and metadata headers.
version: 2.0.0
tags:
- testing
author: Mehul Wagde
license: MIT
prerequisites:
- grpcurl
capabilities:
- name: grpc-reflection
  description: List and describe services via server reflection.
  commands:
  - grpcurl -plaintext localhost:50051 list
  - grpcurl -plaintext localhost:50051 list my.package
  - grpcurl -plaintext localhost:50051 describe my.package.Greeter
  - grpcurl -plaintext localhost:50051 describe my.package.HelloRequest
  examples:
  - grpcurl -plaintext localhost:50051 list
  - grpcurl -plaintext localhost:50051 describe my.package.Greeter
  - grpcurl -plaintext localhost:50051 list my.package
  parameters:
  - name: addr
    type: string
    description: Server address host:port
  - name: plaintext
    type: boolean
    description: Use plaintext instead of TLS
  - name: symbol
    type: string
    description: Service or message to describe
- name: grpc-calls
  description: Invoke unary and streaming RPCs with JSON payloads.
  commands:
  - 'grpcurl -plaintext -d ''{"name": "world"}'' localhost:50051 my.package.Greeter/SayHello'
  - 'grpcurl -plaintext -d @ localhost:50051 my.package.Chat/Send <<< ''{"msg": "hi"}'''
  - 'grpcurl -plaintext -d ''{"id": 1}'' -H ''authorization: Bearer TOKEN'' localhost:50051 my.package.Users/Get'
  - grpcurl -plaintext -d '{}' -max-time 30 localhost:50051 my.package.Orders/List
  examples:
  - 'grpcurl -plaintext -d ''{"name": "world"}'' localhost:50051 my.package.Greeter/SayHello'
  - 'grpcurl -plaintext -d ''{"id": 1}'' -H ''authorization: Bearer TOKEN'' localhost:50051 my.package.Users/Get'
  - grpcurl -plaintext -d '{}' -max-time 30 localhost:50051 my.package.Orders/List
  parameters:
  - name: data
    type: object
    description: JSON request body
  - name: header
    type: string
    description: 'Metadata header, e.g. authorization: Bearer X'
  - name: maxTime
    type: number
    description: Request timeout in seconds
- name: protobuf-imports
  description: Call servers without reflection using proto files.
  commands:
  - grpcurl -import-path ./proto -proto hello.proto -plaintext -d '{"name":"x"}' localhost:50051 hello.Greeter/SayHello
  - grpcurl -import-path ./proto -proto hello.proto -plaintext -d '{}' localhost:50051 hello.Greeter/SayHello
    -format json
  - grpcurl -import-path . -proto api/v1/orders.proto -plaintext localhost:50051 list
  examples:
  - grpcurl -import-path ./proto -proto hello.proto -plaintext -d '{"name":"x"}' localhost:50051 hello.Greeter/SayHello
  - grpcurl -import-path . -proto api/v1/orders.proto -plaintext localhost:50051 list
  parameters:
  - name: importPath
    type: string
    description: Proto import root
  - name: proto
    type: string
    description: Proto file path
knowledge:
- title: grpcurl GitHub
  type: documentation
  source: https://github.com/fullstorydev/grpcurl
  description: CLI reference, flags, and usage examples
- title: gRPC Documentation
  type: documentation
  source: https://grpc.io/docs/
  description: Protocol concepts and server reflection
instructions: "# grpcurl\n\nTest and debug gRPC services from the command line.\n\n## What This Skill\
  \ Does\n\n- Lists and describes services via server reflection\n- Invokes unary and streaming RPCs with\
  \ JSON input\n- Sends metadata headers (auth, tracing)\n- Works with proto files when reflection is\
  \ off\n\n## When to Use\n\n- Smoke-testing a gRPC endpoint\n- Exploring an unknown service's API\n-\
  \ Debugging auth or deadline issues\n\n## Real Commands\n\n```bash\n# Reflection\n grpcurl -plaintext\
  \ localhost:50051 list\ngrpcurl -plaintext localhost:50051 describe my.package.Greeter\n\n# Calls\n\
  \ grpcurl -plaintext -d '{\"name\": \"world\"}' localhost:50051 my.package.Greeter/SayHello\ngrpcurl\
  \ -plaintext -d '{\"id\": 1}' -H 'authorization: Bearer TOKEN' localhost:50051 my.package.Users/Get\n\
  \n# Streaming (stdin)\n grpcurl -plaintext -d @ localhost:50051 my.package.Chat/Send <<< '{\"msg\":\
  \ \"hi\"}'\n\n# Proto imports without reflection\n grpcurl -import-path ./proto -proto hello.proto -plaintext\
  \ -d '{\"name\":\"x\"}' localhost:50051 hello.Greeter/SayHello\n```\n\n## Best Practices\n\n- Enable\
  \ server reflection in dev environments\n- Always set -max-time to avoid hangs\n- Verify error details\
  \ in the grpc-status trailer\n- Test with real auth headers against staging\n- Pair with protoc for\
  \ offline schema inspection"
examples:
- input: What services are running on the gRPC server?
  output: Agent runs grpcurl -plaintext localhost:50051 list and describes the interesting service.
- input: Call SayHello with a name
  output: Agent invokes grpcurl -plaintext -d '{"name":"world"}' and shows the JSON response.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: grpcurl.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-grpcurl
  generic:
    system_prompt: 'You take the grpcurl seat. You do it through grpc-reflection: List and describe services
      via server reflection. The commands are real, e.g. `grpcurl -plaintext localhost:50051 list`. You
      answer with exact commands, not abstractions, and flag anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
