name: mockserver
display_name: mockserver
category: testing
subcategory: general
description: Mocks HTTP and HTTPS APIs with MockServer, creating expectations via REST admin API and proxying
  to real backends.
version: 2.0.0
tags:
- testing
author: Mehul Wagde
license: MIT
prerequisites:
- docker
- java
- node
capabilities:
- name: mockserver-start
  description: Start MockServer locally or in Docker.
  commands:
  - java -jar mockserver-netty-jar-with-dependencies.jar -serverPort 1080
  - docker run -d -p 1080:1080 --name mockserver mockserver/mockserver
  - node mockserver-cli.js -serverPort 1080
  - docker run -d -p 1080:1080 -e MOCKSERVER_INITIALIZATION_JSON_PATH=/config/init.json -v ./init.json:/config/init.json
    mockserver/mockserver
  examples:
  - docker run -d -p 1080:1080 --name mockserver mockserver/mockserver
  - java -jar mockserver-netty-jar-with-dependencies.jar -serverPort 1080
  - docker run -d -p 1080:1080 -e MOCKSERVER_INITIALIZATION_JSON_PATH=/config/init.json -v ./init.json:/config/init.json
    mockserver/mockserver
  parameters:
  - name: port
    type: number
    description: Server port
  - name: initFile
    type: string
    description: Initialization JSON path
- name: expectation-management
  description: Create, inspect, and clear expectations via the admin API.
  commands:
  - curl -s -X PUT http://localhost:1080/mockserver/expectation -d '{"httpRequest":{"path":"/api/users","method":"GET"},"httpResponse":{"statusCode":200,"body":"{\"users\":[]}"}}'
  - curl -s -X PUT http://localhost:1080/mockserver/expectation -d '{"httpRequest":{"path":"/api/users/1"},"httpResponse":{"statusCode":404}}'
  - curl -s http://localhost:1080/mockserver/expectation
  - curl -s -X PUT http://localhost:1080/mockserver/reset
  - curl -s -X PUT http://localhost:1080/mockserver/clear -d '{"path":"/api/orders"}'
  examples:
  - curl -s -X PUT http://localhost:1080/mockserver/expectation -d '{"httpRequest":{"path":"/api/users","method":"GET"},"httpResponse":{"statusCode":200,"body":"{\"users\":[]}"}}'
  - curl -s http://localhost:1080/mockserver/expectation
  - curl -s -X PUT http://localhost:1080/mockserver/reset
  parameters:
  - name: expectation
    type: object
    description: Request/response expectation JSON
  - name: path
    type: string
    description: Request path to match
- name: request-verification
  description: Inspect received requests and proxy behavior.
  commands:
  - curl -s http://localhost:1080/mockserver/requests -d '{"path":"/api/users"}'
  - curl -s -X PUT http://localhost:1080/mockserver/expectation -d '{"httpRequest":{"path":"/api/*"},"httpForward":{"host":"real-api","port":8080}}'
  - curl -s -X PUT http://localhost:1080/mockserver/verify -d '{"path":"/api/users","method":"POST","times":{"atLeast":1}}'
  examples:
  - curl -s http://localhost:1080/mockserver/requests -d '{"path":"/api/users"}'
  - curl -s -X PUT http://localhost:1080/mockserver/verify -d '{"path":"/api/users","method":"POST"}'
  parameters:
  - name: path
    type: string
    description: Path filter for requests
  - name: method
    type: string
    description: Method filter
knowledge:
- title: MockServer Documentation
  type: documentation
  source: https://www.mock-server.com/
  description: Expectations, proxying, and admin API
- title: MockServer Docker
  type: documentation
  source: https://www.mock-server.com/mock_server/running_with_docker.html
  description: Container deployment options
instructions: "# MockServer\n\nMock HTTP/HTTPS APIs for development and testing.\n\n## What This Skill\
  \ Does\n\n- Starts MockServer locally or via Docker\n- Creates expectations for paths, methods, and\
  \ bodies\n- Proxies unmatched requests to real backends\n- Verifies which requests were received\n\n\
  ## When to Use\n\n- Frontend development without a backend\n- Testing failure and edge-case responses\n\
  - Contract-ish testing against stubbed APIs\n\n## Real Commands\n\n```bash\n# Start\njava -jar mockserver-netty-jar-with-dependencies.jar\
  \ -serverPort 1080\ndocker run -d -p 1080:1080 --name mockserver mockserver/mockserver\n\n# Create expectation\n\
  curl -s -X PUT http://localhost:1080/mockserver/expectation -d '{\n  \"httpRequest\": {\"path\": \"\
  /api/users\", \"method\": \"GET\"},\n  \"httpResponse\": {\"statusCode\": 200, \"body\": \"{\\\"users\\\
  \":[]}\"}\n}'\n\n# Proxy everything else\ncurl -s -X PUT http://localhost:1080/mockserver/expectation\
  \ -d '{\n  \"httpRequest\": {\"path\": \"/api/*\"},\n  \"httpForward\": {\"host\": \"real-api\", \"\
  port\": 8080}\n}'\n\n# Verify calls\ncurl -s http://localhost:1080/mockserver/requests -d '{\"path\"\
  :\"/api/users\"}'\n\n# Reset\ncurl -s -X PUT http://localhost:1080/mockserver/reset\n```\n\n## Best\
  \ Practices\n\n- Load initial expectations from JSON for reproducible setups\n- Use proxying to mix\
  \ mocked and real endpoints\n- Reset state between test suites\n- Verify request counts for call-order\
  \ assertions\n- Keep mock bodies consistent with the real contract"
examples:
- input: Mock the payments API for frontend dev
  output: Agent starts MockServer with Docker and adds expectations for the payment endpoints with sample
    responses.
- input: Why is my test hitting the real API?
  output: Agent inspects requests with the /mockserver/requests admin endpoint and adds a catch-all proxy
    or expectation.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: mockserver.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-mockserver
  generic:
    system_prompt: 'You are the mockserver specialist. You do it through mockserver-start: Start MockServer
      locally or in Docker. The commands are real, e.g. `java -jar mockserver-netty-jar-with-dependencies.jar
      -serverPort 1080`. You prefer the shortest safe path, and you reproduce failures before diagnosing
      them.'
    available_tools:
    - bash
    - read
    - write
    - edit
