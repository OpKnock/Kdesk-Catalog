instructions: "# supertest\n\nHTTP assertions for Node.js APIs.\n\n## What This Skill Does\n\n- Sends\
  \ requests to an app instance without binding ports\n- Asserts status, headers, and bodies fluently\n\
  - Tests auth headers and JSON content\n- Integrates with jest/mocha runners\n\n## When to Use\n\n- Unit-level\
  \ API tests for Express/Fastify apps\n- Contract checks on endpoints\n- Regression tests for handlers\n\
  \n## Real Commands\n\n```bash\n# With jest\nnpx jest test/api.test.js\n\n# With mocha\nnpx mocha test/api.test.js\n\
  \n# Direct\nnode test/api.test.js\n```\n\n## Sample Test\n\n```js\nconst request = require('supertest');\n\
  const app = require('../app');\n\ndescribe('GET /api/users', () => {\n  it('returns users', async ()\
  \ => {\n    const res = await request(app)\n      .get('/api/users')\n      .set('Authorization', 'Bearer\
  \ tok')\n      .expect(200)\n      .expect('Content-Type', /json/);\n    expect(res.body.users).toBeInstanceOf(Array);\n\
  \  });\n\n  it('rejects unauthenticated', async () => {\n    await request(app).get('/api/users').expect(401);\n\
  \  });\n});\n```\n\n## Best Practices\n\n- Import the app, not a running server\n- Assert status AND\
  \ body shape\n- Test auth and error paths, not just happy paths\n- Use .expect('Content-Type', /json/)\
  \ for contract\n- Keep tests independent of network and databases"
examples:
- input: Test the create-user endpoint
  output: Agent writes supertest assertions for 201, validation errors, and auth, then runs npx jest test/api.test.js.
- input: Verify the health endpoint in CI
  output: Agent adds a minimal supertest spec asserting 200 + JSON and wires it into the test script.
