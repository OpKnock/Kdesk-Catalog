capabilities:
- name: supertest-api-tests
  description: Write and run API assertions with supertest.
  commands:
  - npx jest test/api.test.js
  - npx mocha test/api.test.js
  - node test/api.test.js
  - npm test -- --runInBand
  examples:
  - npx jest test/api.test.js
  - npx mocha test/api.test.js
  - npm test
  parameters:
  - name: testFile
    type: string
    description: Test file path
  - name: runner
    type: string
    description: 'Test runner: jest, mocha, node'
- name: request-assertions
  description: Chain requests and assert responses.
  commands:
  - request(app).get('/api/users').expect(200)
  - 'request(app).post(''/api/users'').send({ name: ''alice'' }).expect(201)'
  - request(app).get('/api/users').set('Authorization', 'Bearer tok').expect(200)
  - request(app).get('/api/users').expect('Content-Type', /json/)
  - request(app).get('/api/stream').pipe(process.stdout)
  examples:
  - 'request(app).get(''/api/users'').expect(200, { users: [] })'
  - 'request(app).post(''/api/users'').send({ name: ''alice'' }).expect(201)'
  - request(app).get('/api/users').set('Authorization', 'Bearer tok').expect(200)
  parameters:
  - name: method
    type: string
    description: HTTP method
  - name: path
    type: string
    description: Endpoint path
  - name: body
    type: object
    description: Request payload
