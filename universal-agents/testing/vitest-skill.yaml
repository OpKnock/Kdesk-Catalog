name: vitest
display_name: vitest
category: testing
subcategory: general
description: 'Runs Vite-native unit tests with Vitest: watch mode, UI, coverage, mocking, and snapshot
  updates.'
version: 2.0.0
tags:
- testing
author: Mehul Wagde
license: MIT
prerequisites:
- npx
capabilities:
- name: vitest-runs
  description: Run tests in watch or one-shot mode.
  commands:
  - npx vitest
  - npx vitest run
  - npx vitest run tests/foo.test.ts
  - npx vitest run --reporter=verbose
  - npx vitest --changed
  examples:
  - npx vitest
  - npx vitest run tests/foo.test.ts
  - npx vitest --changed
  parameters:
  - name: file
    type: string
    description: Test file path
  - name: changed
    type: boolean
    description: Run only changed files
  - name: reporter
    type: string
    description: 'Reporter: default, verbose, json'
- name: coverage-and-ui
  description: Coverage reports and interactive UI.
  commands:
  - npx vitest run --coverage
  - npx vitest run --coverage.thresholds.lines=80
  - npx vitest --ui
  - npx vitest run --coverage.reporter=lcov
  - npx vitest --update
  examples:
  - npx vitest run --coverage
  - npx vitest --ui
  - npx vitest run --coverage.thresholds.lines=80
  parameters:
  - name: coverage
    type: boolean
    description: Enable coverage
  - name: thresholds
    type: object
    description: Coverage thresholds
  - name: update
    type: boolean
    description: Update snapshots
- name: mocking-and-config
  description: Mock modules and configure environments.
  commands:
  - npx vitest run --environment=jsdom
  - npx vitest run --testNamePattern=login
  - npx vitest run --config vitest.config.ts
  - npx vitest --pool=forks
  - npx vitest run --sequence.shuffle
  examples:
  - npx vitest run --environment=jsdom
  - npx vitest run --testNamePattern=login
  - npx vitest run --sequence.shuffle
  parameters:
  - name: environment
    type: string
    description: 'Test environment: node, jsdom, happy-dom'
  - name: testNamePattern
    type: string
    description: Test name filter
knowledge:
- title: Vitest Documentation
  type: documentation
  source: https://vitest.dev/guide/
  description: Getting started and configuration
- title: Vitest CLI Reference
  type: documentation
  source: https://vitest.dev/guide/cli.html
  description: All CLI flags and options
instructions: "# Vitest\n\nFast, Vite-native unit testing for JS/TS.\n\n## What This Skill Does\n\n- Runs\
  \ tests in watch or one-shot mode\n- Uses Vite transforms for instant startup\n- Produces coverage with\
  \ thresholds\n- Mocks modules and supports jsdom environments\n\n\n## When to Use\n\n- Vite/React/Vue\
  \ project unit tests\n- Fast iteration with watch mode\n- Snapshot testing for components\n\n## Real\
  \ Commands\n\n```bash\n# Run\nnpx vitest\nnpx vitest run\nnpx vitest run tests/foo.test.ts\nnpx vitest\
  \ --changed\n\n# Coverage\nnpx vitest run --coverage\nnpx vitest run --coverage.thresholds.lines=80\n\
  \n# Env and UI\nnpx vitest run --environment=jsdom\nnpx vitest --ui\n\n# Snapshots\nnpx vitest --update\n\
  ```\n\n## Sample Test\n\n```ts\nimport { describe, it, expect, vi } from 'vitest';\nimport { fetchUser\
  \ } from './api';\n\nvi.mock('./api', () => ({\n  fetchUser: vi.fn(() => Promise.resolve({ name: 'alice'\
  \ }))\n}));\n\ndescribe('user card', () => {\n  it('renders the name', async () => {\n    const name\
  \ = await fetchUser(1).then(u => u.name);\n    expect(name).toBe('alice');\n  });\n});\n```\n\n## Best\
  \ Practices\n\n- Use vitest run in CI; watch locally\n- Set coverage thresholds in config\n- Mock at\
  \ module boundaries, not inside tests\n- Prefer jsdom over full browser for component tests\n- Run --changed\
  \ in pre-push hooks"
examples:
- input: Run my component tests
  output: Agent runs npx vitest run tests/component/ with jsdom env and reports pass/fail.
- input: Set up coverage gates
  output: Agent configures coverage thresholds in vitest.config.ts and runs npx vitest run --coverage.
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: vitest.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-vitest
  generic:
    system_prompt: 'You work vitest hands-on. You do it through vitest-runs: Run tests in watch or one-shot
      mode. The commands are real, e.g. `npx vitest`. You prefer the shortest safe path, and you reproduce
      failures before diagnosing them.'
    available_tools:
    - bash
    - read
    - write
    - edit
