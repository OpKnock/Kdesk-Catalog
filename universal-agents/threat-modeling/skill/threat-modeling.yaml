name: threat-modeling
version: 2.0.0
type: skill
category: security
description: Create structured threat models, diagram attacks, and document mitigations using OWASP Threat
  Dragon, threatspec, and pytm.
keywords:
- threat-modeling
- stride
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: threat-modeling.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-threat-modeling
  generic:
    system_prompt: 'You own threat-modeling end to end. You do it through Model threats with OWASP Threat
      Dragon: Run the OWASP Threat Dragon web app locally and draw STRIDE-based data-flow diagrams with
      per-element threat notes. The commands are real, e.g. `docker run -d --name threat-dragon -p 3000:3000
      owasp/threat-dragon`. You work hands-on and only report outcomes you have observed.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: Model threats with OWASP Threat Dragon
  description: Run the OWASP Threat Dragon web app locally and draw STRIDE-based data-flow diagrams with
    per-element threat notes.
  commands:
  - docker run -d --name threat-dragon -p 3000:3000 owasp/threat-dragon
  - docker logs -f threat-dragon
  - docker stop threat-dragon && docker rm threat-dragon
  - docker pull owasp/threat-dragon:latest
  examples:
  - docker run -d --name threat-dragon -p 3000:3000 owasp/threat-dragon
  - docker logs -f threat-dragon
  parameters:
  - name: host port
    type: integer
    description: Local port mapped to the container (default 3000).
    default: '3000'
  - name: container name
    type: string
    description: Name for the running container so it can be stopped later.
    default: threat-dragon
- name: Document threats with threatspec
  description: Annotate code with threatspec comments and compile them into reports, graphs, and CI check
    results.
  commands:
  - threatspec init
  - threatspec model --project ./
  - threatspec validate --project ./
  - threatspec report --format markdown --output threat-model.md --project ./
  - threatspec graph --output threat-model.dot
  examples:
  - threatspec init
  - threatspec report --format markdown --output threat-model.md --project ./
  parameters:
  - name: output format
    type: string
    description: 'Report format: markdown, html, json, csv.'
    default: markdown
  - name: project path
    type: string
    description: Root of the project containing the threatspec config.
    default: ./
- name: Generate models with pytm
  description: Describe architecture as Python objects in a threatmodel file, then render diagrams and
    full STRIDE-based reports.
  commands:
  - pytm --rm threatmodel.py --dfd diagram.png --report report.md
  - pytm --rm threatmodel.py --dfd diagram.svg --format svg --levels L1
  - pytm --rm threatmodel.py --list
  - pytm --rm threatmodel.py --dfd diagram.pdf --format pdf --report report.html
  examples:
  - pytm --rm threatmodel.py --dfd diagram.png --report report.md
  - pytm --rm threatmodel.py --list
  parameters:
  - name: dfd format
    type: string
    description: 'Diagram output format: png, svg, pdf.'
    default: png
  - name: levels
    type: string
    description: Only report threats up to the given STRIDE level (L0-L3).
prerequisites:
- drawio
- threat-modeler
- OWASP
- STRIDE
tools:
- drawio
- threat-modeler
- OWASP
- STRIDE
- pytm
examples:
- input: threatspec report --format html --output docs/threats.html --project ./
  output: Threats compiled from inline annotations into an HTML report with each threat's location, category,
    and mitigation.
- input: pytm --rm threatmodel.py --dfd app.png --report app.md
  output: Generated a data-flow diagram (app.png) and a STRIDE report (app.md) from the threatmodel.py
    definition.
instructions: '# Threat Modeling


  Create and maintain threat models that capture data flows, trust boundaries, attack surfaces, and mitigations.


  ## When to Use


  - Design reviews of new features, APIs, and auth flows

  - Security requirements capture before implementation

  - Compliance evidence for standards like PCI-DSS or SOC 2

  - Re-review when architecture changes (new third-party integration, new data store)


  ## Workflow


  1. Draw the system: elements (processes, data stores, external actors) and data-flow arrows crossing
  trust boundaries.

  2. Apply STRIDE: Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation
  of privilege.

  3. For each flow, ask what an attacker gains if they can control the source, the channel, or the destination.

  4. Record each threat with: affected element, STRIDE category, likelihood, impact, and one or more mitigations.

  5. Wire threats to issues or test cases so the model stays actionable.

  6. Validate in CI: fail the build when a new component has no threats or when mitigations are missing.


  ## Tooling


  - Threat Dragon: interactive diagramming, best for stakeholder workshops.

  - threatspec: inline comments in source code keep the model close to the code; run in CI to block unreviewed
  changes.

  - pytm: code-first models that render diagrams and reports, good for large systems with many repeatable
  patterns.


  ## Good Model Qualities


  - Every trust boundary is explicit; label what crosses it and with what authentication.

  - Data at rest, in transit, and in use is called out separately.

  - Defaults are analyzed, not just the happy path.

  - Mitigations reference concrete controls (encryption libraries, authN/authZ services, logging).


  ## Common Pitfalls


  - Modeling the whole enterprise in one diagram; split by feature.

  - Forgetting external actors like batch jobs, cron, and vendor webhooks.

  - Copying OWASP Top 10 text verbatim without tying it to a flow.

  - Leaving the model to rot; update it in the same PR as the architecture change.


  ## CI Integration


  - threatspec validate in the pipeline with a comment bot on failures.

  - Export reports nightly and store them as reviewable artifacts.

  - Alert on new threats that lack an owner or a due date.

  '
