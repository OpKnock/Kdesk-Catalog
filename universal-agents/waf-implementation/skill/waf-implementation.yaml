name: waf-implementation
version: 2.0.0
type: skill
category: security
description: Deploy and tune a Web Application Firewall with ModSecurity and OWASP CRS, block OWASP Top
  10 attacks, and reduce false positives.
keywords:
- waf
- web-application-firewall
- rules
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: waf-implementation.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-waf-implementation
  generic:
    system_prompt: 'You own waf-implementation end to end. You do it through Deploy ModSecurity with OWASP
      CRS: Start an OWASP CRS-enabled ModSecurity container in front of your app and verify it proxies
      traffic and loads rules. The commands are real, e.g. `docker run -d --name crs -p 80:80 -p 443:443
      -e PARANOIA=1 -e BLOCKING_PARANOIA=1...`. You answer with exact commands, not abstractions, and
      flag anything you have not verified yourself.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: Deploy ModSecurity with OWASP CRS
  description: Start an OWASP CRS-enabled ModSecurity container in front of your app and verify it proxies
    traffic and loads rules.
  commands:
  - docker run -d --name crs -p 80:80 -p 443:443 -e PARANOIA=1 -e BLOCKING_PARANOIA=1 owasp/modsecurity-crs:nginx
  - docker exec -it crs bash
  - docker logs crs | grep -i 'ModSecurity'
  - docker stop crs && docker rm crs
  examples:
  - docker run -d --name crs -p 80:80 -p 443:443 -e PARANOIA=1 -e BLOCKING_PARANOIA=1 owasp/modsecurity-crs:nginx
  - docker logs crs | grep -i 'ModSecurity'
  parameters:
  - name: PARANOIA
    type: integer
    description: CRS paranoia level (1-4); higher levels block more but create more false positives.
    default: '1'
  - name: BLOCKING_PARANOIA
    type: integer
    description: Paranoia level at which traffic is actually blocked.
    default: '1'
- name: Configure and reload WAF rules
  description: Check nginx config, reload the WAF, and test that attack payloads are detected and blocked.
  commands:
  - nginx -t
  - nginx -s reload
  - curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost/login --data 'user=admin&pass=1%27%20OR%20%271%27%3D%271'
  - curl -s -o /dev/null -w '%{http_code}' http://localhost/?q=%3Cscript%3Ealert(1)%3C%2Fscript%3E
  - docker exec -it crs cat /var/log/modsec_audit.log | tail -50
  examples:
  - curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost/login --data 'user=admin&pass=1%27%20OR%20%271%27%3D%271'
  - docker exec -it crs cat /var/log/modsec_audit.log | tail -50
  parameters:
  - name: target URL
    type: string
    description: Origin behind the WAF to test, e.g. http://localhost.
    default: http://localhost
  - name: log path
    type: string
    description: Location of the ModSecurity audit log inside the container.
    default: /var/log/modsec_audit.log
- name: Tune rules and reduce false positives
  description: Run in DetectionOnly mode, analyze audit log matches, and disable or adjust the rules that
    misfire on legitimate traffic.
  commands:
  - sed -i 's/SecRuleEngine On/SecRuleEngine DetectionOnly/' /etc/modsecurity.d/modsecurity.conf
  - grep -E 'id "9|rule_id' /var/log/modsec_audit.log | sort | uniq -c | sort -rn
  - sed -i 's/#SecRuleUpdateActionById/SecRuleUpdateActionById 949110:pass/' /etc/modsecurity.d/crs-setup.conf
  - nginx -t && nginx -s reload
  examples:
  - grep -E 'id "9|rule_id' /var/log/modsec_audit.log | sort | uniq -c | sort -rn
  - sed -i 's/#SecRuleUpdateActionById/SecRuleUpdateActionById 949110:pass/' /etc/modsecurity.d/crs-setup.conf
  parameters:
  - name: rule id
    type: integer
    description: CRS rule ID to pass or block (e.g. 949110 for inbound anomalies).
    default: '949110'
  - name: mode
    type: string
    description: 'SecRuleEngine mode: On, DetectionOnly, Off.'
    default: DetectionOnly
prerequisites:
- aws-waf
- cloudflare
- modsecurity
- nginx
tools:
- aws-waf
- cloudflare
- modsecurity
- nginx
- lua-resty-waf
examples:
- input: curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost/login --data 'user=admin&pass=1%27%20OR%20%271%27%3D%271'
  output: '403: the SQL injection probe was blocked by CRS rule 942100 (SQL injection anomaly).'
- input: sed -i 's/#SecRuleUpdateActionById/SecRuleUpdateActionById 949110:pass/' /etc/modsecurity.d/crs-setup.conf
  output: Configured CRS to pass on inbound anomaly (949110), suppressing false positives while keeping
    other rules active.
instructions: '# WAF Implementation


  Put a web application firewall in front of HTTP traffic to detect and block OWASP Top 10 attacks while
  keeping legitimate users flowing.


  ## When to Use


  - Public-facing apps that accept untrusted input (forms, uploads, APIs)

  - Defense-in-depth alongside runtime protections, not as a replacement

  - Compliance requirements that demand a WAF (PCI-DSS often expects one)

  - Rate spikes from botnets and automated attack scanners


  ## Deployment Model


  1. Proxy mode: the WAF sits in front of origin, terminates or forwards TLS, and inspects requests and
  responses.

  2. Inline vs tap: inline blocks; tap (DetectionOnly) only logs. Start in DetectionOnly.

  3. Out-of-band updates: never reload rules mid-traffic without testing; reload only after config validation
  (nginx -t).


  ## Rule Tuning Loop


  1. Run DetectionOnly for 1-2 weeks; collect audit log matches.

  2. Rank rule IDs by frequency; group by application route.

  3. For each misfire, either allowlist the exact payload pattern or disable the rule via SecRuleUpdateActionById
  for the affected path only.

  4. Promote to blocking per-paranoia-level, starting with PARANOIA=1.

  5. Re-run regression traffic after every change.


  ## Logging and Alerts


  - Keep audit logs: full request, matched rule IDs, and the payload snippet.

  - Ship WAF logs to the SIEM; alert on repeated 403s from one source IP.

  - Correlate WAF events with origin access logs to catch bypasses.


  ## Common Pitfalls


  - Default rule set without tuning produces customer-breaking false positives.

  - Blocking on content-encoding issues (gzip) instead of decoding first.

  - Forgetting WebSocket and file-upload endpoints, which bypass classic CRS checks.

  - No test for bypass: always replay the payloads against the live origin.


  ## Verification Checklist


  - SQLi payload returns 403 and appears in audit log

  - XSS payload in query string returns 403

  - Legitimate login flow still works

  - WAF outage falls open or closed deliberately, with a documented decision

  - Rules updated from a pinned CRS version, not latest floating tag

  '
display_name: waf-implementation
knowledge:
- name: OWASP ModSecurity
  url: https://github.com/owasp-modsecurity/ModSecurity
- name: OWASP CRS
  url: https://github.com/coreruleset/coreruleset
- name: CRS documentation
  url: https://coreruleset.org/docs/
