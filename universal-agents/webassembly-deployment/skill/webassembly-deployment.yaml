name: webassembly-deployment
version: 2.0.0
type: skill
category: backend
description: Build, validate, optimize, and run WebAssembly modules and components with wasmtime, wasm-tools,
  and wasm-opt.
keywords:
- webassembly
- wasm
- rust
- wasi
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: webassembly-deployment.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-webassembly-deployment
  generic:
    system_prompt: 'You are the webassembly-deployment specialist. You do it through Run WebAssembly with
      wasmtime: Execute wasm modules and WASI apps locally, serve modules over HTTP, and compile ahead-of-time
      for fast starts. The commands are real, e.g. `wasmtime run hello.wasm`. You run and verify the real
      CLI commands before you claim anything.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: Run WebAssembly with wasmtime
  description: Execute wasm modules and WASI apps locally, serve modules over HTTP, and compile ahead-of-time
    for fast starts.
  commands:
  - wasmtime run hello.wasm
  - wasmtime run --invoke add -- --x 2 --y 3 math.wasm
  - wasmtime serve --addr 127.0.0.1:8080 --enable-wasi server.wasm
  - wasmtime compile -o hello.cwasm hello.wasm
  - wasmtime run --dir .::. --env FOO=bar hello.wasm
  examples:
  - wasmtime run --invoke add -- --x 2 --y 3 math.wasm
  - wasmtime serve --addr 127.0.0.1:8080 --enable-wasi server.wasm
  parameters:
  - name: invoke
    type: string
    description: Name of the exported function to call (reactor modules).
  - name: dir
    type: string
    description: Directory mapping to grant the module filesystem access, e.g. --dir .::.
    default: none
- name: Validate and inspect modules with wasm-tools
  description: Check wasm binary validity, pretty-print internals, and build components from core modules.
  commands:
  - wasm-tools validate module.wasm
  - wasm-tools print module.wasm | head -50
  - wasm-tools component new module.wasm -o component.wasm --adapt wasi_snapshot_preview1.reactor.wasm
  - wasm-tools wit component.wasm
  - wasm-tools parse module.wat -o module.wasm
  examples:
  - wasm-tools validate module.wasm
  - wasm-tools component new module.wasm -o component.wasm --adapt wasi_snapshot_preview1.reactor.wasm
  parameters:
  - name: adapt
    type: string
    description: WASI preview1 adapter module used when wrapping a core module into a component.
  - name: output
    type: string
    description: Output file path for component wrapping or parse conversion.
    default: out.wasm
- name: Optimize binaries with wasm-opt
  description: Shrink and speed up wasm binaries, strip debug info, and produce deployment-ready artifacts.
  commands:
  - wasm-opt -O3 -o app.opt.wasm app.wasm
  - wasm-opt -Os --strip-debug -o app.min.wasm app.wasm
  - wasm-opt --enable-bulk-memory --enable-mutable-globals -O2 -o app.modern.wasm app.wasm
  - wasm-opt --metrics app.wasm
  examples:
  - wasm-opt -Os --strip-debug -o app.min.wasm app.wasm
  - wasm-opt --metrics app.wasm
  parameters:
  - name: optimization level
    type: string
    description: -O0 to -O4 or -Os; -O3 maximizes speed, -Os minimizes size.
    default: -O2
  - name: strip-debug
    type: flag
    description: Remove the debug name section and DWARF info to reduce size.
    default: 'false'
prerequisites:
- rust
- wasm-pack
- wasmtime
- emsdk
tools:
- rust
- wasm-pack
- wasmtime
- emsdk
- wasm-bindgen
examples:
- input: wasm-opt -Os --strip-debug -o app.min.wasm app.wasm
  output: Reduced app.wasm size by ~35% and removed debug symbols, producing the deployment artifact app.min.wasm.
- input: wasmtime serve --addr 127.0.0.1:8080 --enable-wasi server.wasm
  output: Started an HTTP server on port 8080 backed by the WASI-enabled server.wasm module.
instructions: '# WebAssembly Deployment


  Package, verify, optimize, and operate WebAssembly modules and components in production.


  ## When to Use


  - Edge compute: run untrusted plugins at the edge with sandboxing

  - Function-as-a-service runtimes with fast cold starts

  - Plugins and extensions compiled once, run anywhere (browser, server, edge)

  - Sandboxing third-party code where OS isolation is too heavy


  ## Build and Sign Pipeline


  1. Compile source to wasm (Rust with cargo wasm32-wasip2, C with clang --target=wasm32-wasi).

  2. Validate: wasm-tools validate must pass; keep the WAT human-readable copy for reviews.

  3. Optimize: wasm-opt with -Os for size or -O3 for speed; strip debug info for prod.

  4. Wrap into components when composing interfaces (component model).

  5. Sign the artifact and pin the toolchain version in CI for reproducible builds.


  ## Runtime Policy


  - Grant capabilities explicitly: filesystem via --dir, env via --env, network via wasi-http or explicit
  sockets.

  - Deny by default; start with zero capabilities and add only what the module needs.

  - Set explicit timeouts and memory limits at the runtime level.


  ## Serving and Scaling


  - wasmtime serve hosts HTTP in-process; scale horizontally behind a load balancer.

  - Precompile (.cwasm) at build time to avoid JIT compilation on cold start.

  - Cache module artifacts by content hash; invalidate on source change.


  ## Debugging and Observability


  - Enable WASI logging to stdout and forward structured logs.

  - Use --wasm-trace or module instrumentation for panic reproduction.

  - Compare behavior across runtimes (wasmtime vs wasmer vs browser) before promising portability.


  ## Common Pitfalls


  - Forgetting to adapt WASI preview1 modules to preview2 interfaces.

  - Shipping debug symbols to production.

  - Over-granting filesystem access with --dir .::.

  - Assuming a module is deterministic across runtimes without testing.


  ## Rollout Checklist


  - Module validated and size-bounded

  - Capability manifest reviewed

  - Cold-start latency measured

  - Canary deployed with metrics comparison

  - Rollback path: pinned previous artifact hash

  '
