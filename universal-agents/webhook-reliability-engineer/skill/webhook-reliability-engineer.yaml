name: webhook-reliability-engineer
version: 2.0.0
type: skill
category: backend
description: Design, deliver, and debug webhook integrations with retries, signatures, and visibility
  using svix, ngrok, and curl.
keywords:
- webhooks
- signature-verification
- idempotency
platforms:
  claude_code:
    tools:
    - Bash
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    model: inherit
  cursor:
    rule_type: auto
  github_copilot:
    prompt_file: webhook-reliability-engineer.md
    extension: github.copilot
  windsurf:
    model: inherit
    tools:
    - bash
    - read
    - write
    - edit
  opencode:
    plugin: opencode-webhook-reliability-engineer
  generic:
    system_prompt: 'You are the webhook-reliability-engineer specialist. You do it through Expose local
      endpoints with ngrok: Tunnel a local webhook receiver to a public HTTPS URL and inspect incoming
      traffic. The commands are real, e.g. `ngrok http 3000`. You work hands-on and only report outcomes
      you have observed.'
    available_tools:
    - bash
    - read
    - write
    - edit
    - glob
    - grep
capabilities:
- name: Expose local endpoints with ngrok
  description: Tunnel a local webhook receiver to a public HTTPS URL and inspect incoming traffic.
  commands:
  - ngrok http 3000
  - ngrok http --basic-auth=user:pass --host-header=rewrite 3000
  - ngrok status
  - ngrok tunnel list
  examples:
  - ngrok http 3000
  - ngrok http --basic-auth=user:pass --host-header=rewrite 3000
  parameters:
  - name: local port
    type: integer
    description: Port your webhook receiver listens on.
    default: '3000'
  - name: basic-auth
    type: string
    description: user:pass credential protecting the public tunnel URL.
- name: Manage endpoints with svix
  description: Create applications and endpoints, send test messages, and list deliveries from the svix
    CLI.
  commands:
  - svix login
  - svix application create --name my-app
  - svix endpoint create --url https://api.example.com/webhooks --event-types issue.created
  - svix message send --event-type issue.created --payload '{"id":42}' --app my-app
  - svix endpoint list --app my-app
  examples:
  - svix endpoint create --url https://api.example.com/webhooks --event-types issue.created
  - svix message send --event-type issue.created --payload '{"id":42}' --app my-app
  parameters:
  - name: event-types
    type: string
    description: Comma-separated event types the endpoint subscribes to.
  - name: payload
    type: string
    description: JSON payload sent with the test message.
- name: Verify deliveries and retries with curl
  description: Simulate provider webhooks, check signature headers, and replay failed deliveries against
    your receiver.
  commands:
  - 'curl -s -i -X POST https://tunnel.ngrok.io/webhooks -H ''Content-Type: application/json'' -H ''svix-id:
    msg_1'' -H ''svix-signature: v1,<sig>'' -H ''svix-timestamp: 1720000000'' -d ''{"event":"build.failed"}'''
  - curl -s -o /dev/null -w '%{http_code} %{time_total}s' --retry 3 --retry-delay 2 -X POST https://api.example.com/webhooks
    -d '{}'
  - 'curl -s -H ''Authorization: Bearer <token>'' ''https://api.svix.com/api/v1/app/my-app/msg/msg_1/attempt'''
  examples:
  - 'curl -s -i -X POST https://tunnel.ngrok.io/webhooks -H ''Content-Type: application/json'' -H ''svix-id:
    msg_1'' -H ''svix-signature: v1,<sig>'' -H ''svix-timestamp: 1720000000'' -d ''{"event":"build.failed"}'''
  - curl -s -o /dev/null -w '%{http_code} %{time_total}s' --retry 3 --retry-delay 2 -X POST https://api.example.com/webhooks
    -d '{}'
  parameters:
  - name: signature header
    type: string
    description: Header name carrying the HMAC signature (svix-signature, x-hub-signature-256, etc.).
    default: svix-signature
  - name: retries
    type: integer
    description: Number of retry attempts for curl-based delivery checks.
    default: '0'
prerequisites:
- ngrok
- node.js
- python
- redis
tools:
- ngrok
- node.js
- python
- redis
- stripe-cli
- sendgrid-cli
examples:
- input: 'curl -s -i -X POST https://tunnel.ngrok.io/webhooks -H ''Content-Type: application/json'' -H
    ''svix-id: msg_1'' -H ''svix-signature: v1,<sig>'' -H ''svix-timestamp: 1720000000'' -d ''{"event":"build.failed"}'''
  output: Your local receiver answered 200; ngrok inspector captured the full signed request for verification
    against the raw body.
- input: svix message send --event-type issue.created --payload '{"id":42}' --app my-app
  output: Dispatched a test issue.created message to every endpoint subscribed to that event type in app
    my-app.
instructions: '# Webhook Reliability Engineering


  Design webhook integrations that deliver events reliably, verify their authenticity, and fail loudly
  instead of silently.


  ## When to Use


  - Integrating with GitHub, Stripe, Slack, or any provider pushing events

  - Building a webhook dispatch service for your own platform

  - Debugging why a third-party integration stops receiving events


  ## Delivery Contract


  1. Receiver must reply 2xx within the provider timeout, ideally under 10 seconds.

  2. On non-2xx, the provider retries with exponential backoff and jitter; track attempt counts.

  3. Every delivery should carry: event id, event type, timestamp, and payload version.

  4. Duplicate delivery is normal; receivers must be idempotent on event id.


  ## Signature Verification


  1. Compute the HMAC over the raw body (not the parsed JSON) with the shared secret.

  2. Compare using a constant-time comparison; never a plain string equality.

  3. Validate the timestamp window (usually +/- 5 minutes) to stop replay attacks.

  4. Rotate secrets without breaking in-flight deliveries by accepting two active secrets.


  ## Local Debugging Loop


  1. Run your receiver locally on port 3000.

  2. Expose it: ngrok http 3000.

  3. Point the provider''s webhook URL at the tunnel and send a test event.

  4. Inspect the request body, headers, and signature in the ngrok inspector; replay payloads with curl.


  ## Observability


  - Log: event id, attempt number, latency, status code, and failure reason.

  - Alert on: delivery failure rate above threshold, retry queue depth, signature verification failures.

  - Maintain a dead-letter queue for events that exhaust all retries.


  ## Common Pitfalls


  - Verifying signatures against JSON.stringify output instead of the raw body.

  - Receiver doing heavy work (email, DB writes) inline and timing out.

  - No idempotency, so a single retry duplicates side effects.

  - Hardcoding the provider secret in the repo.


  ## Checklist


  - Raw-body HMAC verification with constant-time compare

  - Idempotent handlers keyed on event id

  - 2xx acknowledgment within timeout

  - Retry with backoff + dead-letter queue

  - Failure alerting and delivery dashboards

  '
display_name: webhook-reliability-engineer
knowledge:
- name: ngrok documentation
  url: https://ngrok.com/docs
- name: svix documentation
  url: https://docs.svix.com
- name: GitHub webhook docs
  url: https://docs.github.com/en/webhooks/webhook-events-and-payloads
